reference_id: REF_SYS_TBP_001
name: Agent Technical Best Practices
description: >
  Technical best practices for AI agent architecture, modularity, specification,
  and orchestration sourced from industry leaders (Anthropic, Google, OpenAI,
  Microsoft, academic research). System-wide reference, not role-specific.
version: 1.0.0
last_audited: 2026-03-21
audit_cadence: quarterly

current_system_strengths:
  - area: Holonic architecture
    status: industry_leading
    validation: Validated by 2025 academic taxonomy (Sun et al., arxiv 2508.12683)
  - area: Skill/Runbook separation
    status: industry_leading
    validation: Matches Anthropic Agent Skills direction, DDR-019 v3.0 corrected v2.0 collapse
  - area: Context engineering
    status: industry_leading
    validation: Dedicated architecture with budget management, progressive disclosure, freshness tracking
  - area: Mandatory knowledge per agent
    status: ahead_of_industry
    validation: DDR-019 rule 5, most frameworks have no equivalent requirement
  - area: Mandatory guardrails per agent
    status: ahead_of_industry
    validation: DDR-019 rule 6, three-layer error handling (tool, agent, flow)
  - area: Signal-based event architecture
    status: aligned
    validation: Immutable signals, loose coupling, subscription model
  - area: Trust tiers in playbooks
    status: aligned
    validation: Autonomous/review/human-decides matches Google's human-in-the-loop pattern
  - area: Domain model documentation depth
    status: industry_leading
    validation: Three versions with DDRs, few systems match this maturity

sources:
  anthropic:
    - title: Building Effective Agents
      url: https://www.anthropic.com/research/building-effective-agents
      patterns:
        - name: Six composable patterns
          description: Augmented LLM, Prompt Chaining, Routing, Parallelization, Orchestrator-Workers, Evaluator-Optimizer
          adopted: [routing, orchestrator-workers, parallelization]
          gap: evaluator-optimizer not formalized as named pattern
          priority: medium
        - name: Agent-Computer Interface design
          description: Tool documentation deserves equal prompt engineering rigor as main prompts
          adopted: true
          note: Aligned via DDR-023 prompt registry contract

    - title: Effective Harnesses for Long-Running Agents
      url: https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents
      patterns:
        - name: Two-agent session architecture
          description: Initializer agent + worker agent for multi-session tasks
          adopted: false
          gap: No formal session handoff pattern for multi-day processes
          priority: medium

    - title: Agent Skills Open Standard
      url: https://claude.com/blog/equipping-agents-for-the-real-world-with-agent-skills
      patterns:
        - name: SKILL.md progressive disclosure
          description: Discovery (name/description) -> core instructions -> detailed context
          adopted: partial
          gap: Skills exist as YAML but not in SKILL.md format for external tool discovery
          priority: medium
          note: Partners include Microsoft, OpenAI, Atlassian, Figma, Cursor, GitHub

    - title: Effective Context Engineering
      url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
      patterns:
        - name: Four context strategies
          description: Write, select, compress, isolate
          adopted: true
          note: System has dedicated context engineering architecture

  google:
    - title: Eight Multi-Agent Patterns in ADK
      url: https://developers.googleblog.com/developers-guide-to-multi-agent-patterns-in-adk/
      patterns:
        - name: Generator-Critic pattern
          description: SequentialAgent in LoopAgent with evaluator feedback
          adopted: false
          gap: No iterative refinement loops with max_iterations in process schema
          priority: medium
        - name: AgentTool wrapping
          description: Agents invocable as tools returning structured results
          adopted: partial
          note: Holonic sub-agents similar but invocation pattern less explicit

    - title: A2A Protocol v0.3
      url: https://github.com/a2aproject/A2A
      patterns:
        - name: A2A v0.3 with gRPC and signed security cards
          description: Now under Linux Foundation governance, 150+ supporting organizations
          adopted: partial
          gap: Current A2A cards should be validated against v0.3 spec
          priority: medium

  openai:
    - title: Agents SDK Multi-Agent Orchestration
      url: https://openai.github.io/openai-agents-python/multi_agent/
      patterns:
        - name: Handoff vs Agent-as-Tool
          description: Explicit control transfer vs bounded subtask delegation
          adopted: partial
          note: Reactive routing similar to handoffs, Agent-as-Tool partially in holonic model

    - title: A Practical Guide to Building Agents
      url: https://cdn.openai.com/business-guides-and-resources/a-practical-guide-to-building-agents.pdf
      patterns:
        - name: Start simple, add complexity only when needed
          description: Single agent -> workflows -> multi-agent only when warranted
          adopted: true
          note: DDR-019 holonic decomposition criteria enforce this principle

  microsoft:
    - title: Agent Framework (AutoGen + Semantic Kernel)
      url: https://learn.microsoft.com/en-us/agent-framework/overview/
      patterns:
        - name: Agent middleware/interceptor
          description: Centralized cross-cutting concerns between invocation and execution
          adopted: false
          gap: No middleware layer for logging, cost tracking, rate limiting
          priority: low

  protocols:
    - title: Model Context Protocol (MCP)
      url: https://modelcontextprotocol.io/specification/2025-11-25
      patterns:
        - name: MCP as tool transport layer
          description: JSON-RPC for secure tool invocation, adopted by OpenAI, Microsoft, Google
          adopted: false
          gap: Tool definitions should be expressible as MCP tool schemas
          priority: high
          note: De facto standard for tool integration

    - title: MCP 2026 Roadmap
      url: https://blog.modelcontextprotocol.io/posts/2026-mcp-roadmap/

  oracle:
    - title: Agent Spec 26.2.0 (development)
      url: https://github.com/oracle/agent-spec
      patterns:
        - name: AG-UI integration, new node types
          description: Agentic frontend experiences
          adopted: false
          gap: Evaluate when stable
          priority: low

  evaluation:
    - title: Amazon, Evaluating AI Agents
      url: https://aws.amazon.com/blogs/machine-learning/evaluating-ai-agents-real-world-lessons-from-building-agentic-systems-at-amazon/
      patterns:
        - name: Tool call accuracy as dominant production challenge
          description: Not reasoning quality but accurate tool calling determines success
          adopted: false
          gap: No formal agent evaluation or benchmarking framework
          priority: high

    - title: CLEAR Metrics
      description: Cost, Latency, Efficiency, Assurance, Reliability
      adopted: false
      gap: No production metrics framework for 47 agents
      priority: high

  observability:
    - title: OpenTelemetry for Agents
      url: https://langfuse.com/blog/2024-07-ai-agent-observability-with-langfuse
      patterns:
        - name: OTEL-based agent tracing
          description: Per-trace cost attribution, tool call success rates, latency, quality scoring
          adopted: false
          gap: No observability architecture for tracing requests through multi-agent workflows
          priority: high

  governance:
    - title: MIT Technology Review, From Guardrails to Governance
      url: https://www.technologyreview.com/2026/02/04/1131014/from-guardrails-to-governance-a-ceos-guide-for-securing-agentic-systems/
      patterns:
        - name: Proactive governance over reactive guardrails
          description: Who owns agent behavior, how decisions get reviewed, what recourse exists
          adopted: partial
          note: Trust tiers and guardrails exist, but runtime governance model not documented

    - title: ISACA, Agent Identity Management
      url: https://www.isaca.org/resources/news-and-trends/industry-news/2025/safeguarding-the-enterprise-ai-evolution-best-practices-for-agentic-ai-workflows
      patterns:
        - name: Per-agent unique identity and scoped credentials
          description: 90% of agents over-permissioned, need least-privilege with short-lived tokens
          adopted: false
          gap: No agent identity/credential architecture (concept framework, production requirement)
          priority: medium

  memory:
    - title: Cross-Session Agent Learning
      url: https://mem0.ai
      patterns:
        - name: Persistent operational memory
          description: Agent learns from execution history, 26% accuracy improvement
          adopted: false
          gap: InfoHub stores domain knowledge but not agent self-improvement data
          priority: medium

  academic:
    - title: Taxonomy of Hierarchical Multi-Agent Systems
      url: https://arxiv.org/html/2508.12683
      validation: Holonic architecture validated as one of six named coordination mechanisms

gap_summary:
  high:
    - MCP as tool transport layer (de facto standard, adopted by all major platforms)
    - Agent evaluation framework with CLEAR metrics (no way to measure agent quality across 47 agents)
    - Agent observability architecture (OTEL-based tracing for multi-agent workflows)

  medium:
    - Evaluator-Optimizer as explicit named pattern (Anthropic, Google ADK)
    - Generator-Critic / iterative refinement in process schema (Google ADK)
    - Cross-session agent learning persistence (Mem0, academic research)
    - SKILL.md format compatibility for external discovery (Anthropic Agent Skills standard)
    - A2A v0.3 conformance validation (Linux Foundation governance)
    - Agent identity and credential management (production readiness)
    - Long-running agent session management (Anthropic harnesses)

  low:
    - Agent middleware/interceptor pattern (Microsoft)
    - Context budget enforcement metrics (Stanford/UC Berkeley)
    - Agent Spec 26.2.0 upgrade evaluation (Oracle)
    - Behavioral anomaly detection (industry governance trends)
