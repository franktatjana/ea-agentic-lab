# disclaimer
# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (Richardson Maturity Model,
# API versioning patterns, etc.) are industry-standard
# methodologies cited for educational context.

# PLAYBOOK: Partner Integration Validation
# Framework operationalization for AI agents

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_AA_001"
framework_name: "Partner Integration Validation"
framework_source: "API Maturity Model (Richardson) / Integration Architecture Patterns"
intended_agent_role: "aa-agent"
intended_sub_agent: "aa-integration-validation-agent"
secondary_agents:
  - "SA Agent provides integration requirements from customer deals"
  - "Specialist Agents provide domain-specific API validation"
playbook_mode: "VALIDATION"
playbook_category: "technical_validation"

primary_objective: "Validate partner API/SDK compatibility, track integration version currency, assess change impact from partner platform updates, and maintain integration certification status"

blueprint_integration:
  required: true
  archetypes: "Any archetype involving partner technology"
  trigger_signal: "partner_technology_detected"
  rationale: "Partner integrations must be validated before inclusion in customer architecture proposals"

vault_routing:
  primary_vault: "Global Knowledge Vault"
  rationale: "Integration validation results, compatibility matrices, and certification records are cross-account assets reused across all engagements involving the same partner."
  secondary_outputs:
    - vault: "Internal Account Hub"
      artifact: "Deal-specific compatibility reports when validation is triggered by a customer engagement"

when_not_to_use:
  - "Partner relationship is commercial-only with no technical integration (Partner Manager scope)"
  - "Integration is a one-time data migration, not an ongoing API dependency"
  - "Partner technology is being actively deprecated with no replacement path"
  - "Customer-specific custom integration (SA Agent scope, not reusable partner validation)"
  - "Evaluation-stage partnership where due diligence has not completed (use PB_AA_003 first)"

raci:
  responsible:
    role: "AA Agent"
    agent: "aa-integration-validation-agent"
    description: "Validates partner API/SDK compatibility, tracks version currency, assesses change impact, maintains certification status"

  accountable:
    role: "Alliance Architect"
    human_required: true
    description: "Approves certification status changes, signs off on breaking change remediation plans, authorizes field advisories"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted:
    - role: "SA Agent"
      on_steps: ["field_integration_issues", "customer_impact_assessment", "deployment_compatibility"]
    - role: "Specialist Agents"
      on_steps: ["domain_api_validation", "protocol_specific_testing", "security_review"]

  informed:
    - role: "Partner Manager"
      notify_on: ["certification_status_change", "breaking_change_detected"]
    - role: "SA Teams"
      notify_on: ["compatibility_matrix_updated", "field_advisory_issued"]
    - role: "HAM Agent"
      notify_on: ["marketplace_integration_affected"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Partner platform update or new version released"
    - "API deprecation notice received from partner"
    - "Integration test suite completed (scheduled or ad-hoc)"
    - "Quarterly certification review cycle"
    - "Field-reported integration failure or degradation"

  manual:
    - "SA Agent requests compatibility check for a customer deal"
    - "Alliance Architect requests certification renewal"
    - "Partner Manager requests integration status for business review"

  conditional:
    - "IF partner_api_version_changed THEN trigger compatibility assessment"
    - "IF field_integration_issue_reported THEN trigger impact analysis"
    - "IF days_since_last_certification > 90 THEN trigger recertification"
    - "IF partner_sdk_major_version_released THEN trigger full validation"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Partner API documentation (OpenAPI/Swagger specs, SDK reference)"
    - artifact: "Current integration version manifest (deployed versions, dependency map)"
    - artifact: "Integration test results (automated suite output, manual test records)"
    - artifact: "Certification records (last certification date, scope, conditions)"

  optional:
    - artifact: "Partner SDK release notes and changelog"
      use: "Change impact assessment"
    - artifact: "Field-reported integration issues"
      use: "Known issues correlation"
    - artifact: "{realm}/{node}/internal-infohub/alliance_architects/compatibility_matrix.md"
      use: "Historical compatibility baseline"
    - artifact: "Partner platform roadmap (if shared under NDA)"
      use: "Proactive deprecation planning"

  minimum_data_threshold:
    - "At least partner API documentation or SDK reference available"
    - "At least 1 integration endpoint or SDK method to validate"
    - "Current deployed integration version known"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  api_compatibility:
    - "Which partner API endpoints does the integration consume, and at which version?"
    - "Are there breaking changes between current and latest partner API version?"
    - "Does the partner follow semantic versioning, and what is their deprecation policy?"
    - "Are authentication mechanisms unchanged (OAuth flows, API key format, token lifetimes)?"
    - "Are response payload schemas backward-compatible with current integration parsing?"

  sdk_and_library_health:
    - "Is the partner SDK at the latest stable version, and how many versions behind if not?"
    - "Are there known vulnerabilities in the currently deployed SDK version?"
    - "Does the SDK require runtime or framework upgrades that affect the host application?"
    - "Are SDK initialization, configuration, and error handling patterns still valid?"

  certification_status:
    - "When was the last full certification completed, and what scope did it cover?"
    - "Are there new certification requirements from the partner program since last review?"
    - "Do all integration paths (data ingestion, query, webhook, export) pass current tests?"
    - "Are there conditional certifications (e.g., certified for v2.x but not v3.x)?"

  field_impact:
    - "How many active customer deployments use this partner integration?"
    - "Are there field-reported issues that correlate with recent partner platform changes?"
    - "What is the customer impact severity if this integration breaks (data loss, degraded vs. blocked)?"
    - "Is there a rollback path if the partner update causes integration failure?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    # Breaking change detected
    - condition: "breaking_change_detected == true AND customer_impact_count > 0"
      severity: "HIGH"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Breaking partner API change affecting {vendor} integration"
          severity: "HIGH"
          category: "integration"
          description: "Partner API change breaks existing integration, {customer_count} active deployments affected"
          contributing_factors: [breaking endpoints, affected SDK methods, customer impact scope]

        CREATE Initiative:
          title: "Remediate {vendor} integration breaking change"
          owner: "AA Agent / Engineering"
          urgency: "IMMEDIATE"
          actions:
            - "Notify all SA teams with active deployments using this integration"
            - "Assess remediation effort and timeline"
            - "Coordinate with partner on migration path or compatibility window"
            - "Issue field advisory with workarounds if available"
            - "Update compatibility matrix and certification status to AT-RISK"

    # Minor changes, no breaking impact
    - condition: "api_changes_detected == true AND breaking_change_detected == false"
      output_type: "Decision"
      decision: |
        CREATE Decision:
          title: "Non-breaking {vendor} API update validated"
          context: "Partner API changes detected but backward-compatible"
          decision: "Update compatibility matrix, schedule SDK update in next cycle"
          actions:
            - "Document new endpoints or parameters available"
            - "Update compatibility matrix with latest validated version"
            - "Schedule SDK update to leverage new capabilities"

    # Certification expired or at risk
    - condition: "days_since_last_certification > 90 OR certification_tests_failing > 0"
      severity: "MEDIUM"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Integration certification at risk for {vendor}"
          severity: "MEDIUM"
          category: "compliance"
          description: "Certification expired or test failures detected, partner program compliance at risk"

        CREATE Initiative:
          title: "Recertification for {vendor} integration"
          owner: "AA Agent"
          timeline: "Within 2 weeks"
          actions:
            - "Run full integration test suite against latest partner environment"
            - "Remediate any test failures"
            - "Update certification records with new validation date"
            - "Submit recertification to partner program if required"

    # All validations passing, current
    - condition: "all_tests_passing == true AND sdk_version_current == true AND certification_valid == true"
      output_type: "Decision"
      decision: |
        CREATE Decision:
          title: "Integration validation current for {vendor}"
          context: "All compatibility checks passing, SDK current, certification valid"
          decision: "No action required, schedule next validation per cadence"
          actions:
            - "Update validation timestamp in compatibility matrix"
            - "Archive validation report"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/alliance_architects/integration_validation_{vendor}_{YYYY-MM-DD}.md"
    format: "markdown"
    sections:
      - executive_summary
      - api_compatibility_assessment
      - sdk_version_analysis
      - certification_status
      - change_impact_analysis
      - field_impact_assessment
      - remediation_plan
      - recommendations

    schema:
      executive_summary:
        - partner_name: "string"
        - validation_date: "date"
        - overall_status: "enum[CURRENT|AT_RISK|EXPIRED|BLOCKED]"
        - breaking_changes_found: "boolean"
        - customer_deployments_affected: "number"
        - action_required: "boolean"

      api_compatibility:
        - endpoints_validated: "number"
        - endpoints_compatible: "number"
        - endpoints_breaking: "number"
        - endpoints_deprecated: "number"
        - authentication_status: "enum[VALID|CHANGED|BROKEN]"
        - payload_compatibility: "enum[FULL|PARTIAL|INCOMPATIBLE]"

      sdk_analysis:
        - current_version: "string"
        - latest_version: "string"
        - versions_behind: "number"
        - known_vulnerabilities: "number"
        - upgrade_effort: "enum[LOW|MEDIUM|HIGH]"

      certification_status:
        - last_certified: "date"
        - certification_scope: "array[string]"
        - tests_total: "number"
        - tests_passing: "number"
        - tests_failing: "number"
        - status: "enum[CURRENT|AT_RISK|EXPIRED]"

  decision_objects:
    path: "{realm}/{node}/internal-infohub/alliance_architects/decisions/"
    create_if:
      - "Breaking change requires remediation strategy"
      - "Non-breaking update validated (document for audit trail)"
      - "Certification renewal completed"
    template: "ADR format"

  risk_objects:
    path: "{realm}/{node}/internal-infohub/alliance_architects/risks/"
    create_if:
      - "Breaking change detected with customer impact"
      - "Certification expired or tests failing"
      - "SDK version has known vulnerabilities"
    template: "Risk with mitigation plan"

  initiative_objects:
    path: "{realm}/{node}/internal-infohub/alliance_architects/initiatives/"
    create_if:
      - "Breaking change remediation required"
      - "Recertification needed"
      - "SDK upgrade scheduled"
    template: "Initiative with actions, owner, timeline"

  notifications:
    - recipient: "Alliance Architect"
      condition: "always"
      message: "Integration validation complete for {vendor}: status {overall_status}"

    - recipient: "SA Teams"
      condition: "breaking_change_detected == true"
      message: "ADVISORY: {vendor} integration breaking change detected, {customer_count} deployments affected"

    - recipient: "Partner Manager"
      condition: "certification_status == EXPIRED OR certification_status == AT_RISK"
      message: "Partner certification at risk for {vendor}, program compliance may be affected"

    - recipient: "HAM Agent"
      condition: "marketplace_listing_affected == true"
      message: "Marketplace integration validation status changed for {vendor}: {overall_status}"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "partner_api_docs_unavailable"
      reason: "Cannot validate compatibility without API documentation"
      action: "Alliance Architect to request updated documentation from partner"

    - condition: "breaking_change_affects_more_than_10_customers"
      reason: "Wide blast radius requires coordinated response"
      action: "Escalate to Alliance Architect and Engineering leadership for response plan"

    - condition: "partner_authentication_model_changed"
      reason: "Authentication changes require security review beyond automated validation"
      action: "Escalate to security team and Alliance Architect for review"

  insufficient_data:
    - "No partner API documentation available"
    - "No integration test environment accessible"
    - "No record of current deployed integration version"
    - "No certification baseline to validate against"

  ambiguity_signals:
    - "Partner documentation contradicts observed API behavior"
    - "Multiple API versions in use across different customer deployments"
    - "Unclear whether change is breaking or just behavioral difference"

  human_judgment_required:
    - "Prioritizing remediation across multiple affected integrations"
    - "Deciding whether to accept partial compatibility or require full update"
    - "Coordinating remediation timeline with partner release schedule"
    - "Evaluating whether to maintain backward compatibility or force upgrade"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Partner API documentation or SDK reference accessible"
    - "Integration test environment available"
    - "Current integration version manifest available"

  post_execution:
    - "All API endpoints in scope have compatibility status assigned"
    - "SDK version comparison completed (current vs. latest)"
    - "Certification status updated with validation date"
    - "Customer impact count assessed if changes found"

  output_quality:
    - "No endpoints listed without compatibility status (no 'unknown' allowed)"
    - "All breaking changes include affected SDK methods and customer impact"
    - "Remediation plan includes effort estimate and timeline for each breaking change"
    - "Certification test results include pass/fail counts, not just summary"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "10-20 minutes (agent) + 30-60 minutes (human review for breaking changes)"
frequency: "Quarterly (scheduled) + triggered by partner releases or field issues"
human_review_required: true
approval_workflow:
  - reviewer: "Alliance Architect"
    approval_gate: "Validate compatibility assessment accuracy, approve remediation plan"
  - reviewer: "SA Agent"
    condition: "customer_deployments_affected > 0"
    approval_gate: "Validate customer impact assessment and field advisory content"
  - reviewer: "Engineering Lead"
    condition: "breaking_change_detected == true"
    approval_gate: "Approve remediation timeline and engineering resource allocation"

