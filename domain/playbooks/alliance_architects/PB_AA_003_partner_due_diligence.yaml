# disclaimer
# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (Richardson Maturity Model,
# technology due diligence, API assessment, etc.) are
# industry-standard methodologies cited for educational
# context.

# PLAYBOOK: Partner Technical Due Diligence
# Framework operationalization for AI agents

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_AA_003"
framework_name: "Partner Technical Due Diligence"
framework_source: "Technology Due Diligence Frameworks / API Maturity Assessment"
intended_agent_role: "aa-agent"
intended_sub_agent: "aa-due-diligence-agent"
secondary_agents:
  - "SA Agent provides architectural assessment perspective"
  - "CI Agent provides competitive landscape for partner category"
playbook_mode: "ASSESSMENT"
playbook_category: "partner_evaluation"

primary_objective: "Conduct technical due diligence for prospective partnerships including API maturity scoring, integration effort estimation, risk analysis, and strategic fit assessment"

blueprint_integration:
  required: false
  archetypes: "Standalone, not engagement-specific"
  trigger_signal: "new_partnership_requested"
  rationale: "Due diligence is run when a new partnership is proposed or an existing partnership is up for renewal evaluation. It is not tied to a specific customer engagement."

vault_routing:
  primary_vault: "Global Knowledge Vault"
  rationale: "Due diligence reports inform cross-account partnership decisions. They evaluate the partner as a whole, not in the context of a single deal."
  secondary_outputs: []

when_not_to_use:
  - "Partnership is already active and validated (use PB_AA_001 for ongoing validation)"
  - "Evaluation is purely commercial, no technical integration planned (Partner Manager scope)"
  - "Partner is a hyperscaler (HAM Agent scope, different evaluation criteria)"
  - "Customer requests ad-hoc vendor evaluation for their own use (SA Agent scope)"
  - "Partner has declined to share technical documentation (evaluation cannot proceed)"

raci:
  responsible:
    role: "AA Agent"
    agent: "aa-due-diligence-agent"
    description: "Conducts technical evaluation, scores API maturity, estimates integration effort, performs risk analysis, assesses strategic fit"

  accountable:
    role: "Alliance Architect"
    human_required: true
    secondary_accountable: "VP Alliances"
    description: "Approves due diligence findings, co-owns go/no-go recommendation with VP Alliances"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"
      - "reject"

  consulted:
    - role: "SA Agent"
      on_steps: ["architecture_compatibility", "integration_pattern_assessment", "deployment_model_evaluation"]
    - role: "CI Agent"
      on_steps: ["competitive_positioning", "market_category_analysis", "alternative_partner_options"]

  informed:
    - role: "Partner Agent"
      notify_on: ["due_diligence_complete", "go_nogo_recommendation"]
    - role: "Leadership"
      notify_on: ["strategic_partnership_recommendation", "high_risk_findings"]
    - role: "HAM Agent"
      notify_on: ["marketplace_integration_feasibility"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "New partnership proposal submitted by business development or Partner Manager"
    - "Existing partner renewal evaluation triggered (contract approaching expiry)"
    - "Competitive partnership shift detected (partner acquired, pivoted, or entered competitor alliance)"
    - "M&A signal in partner ecosystem (partner acquired or acquiring)"

  manual:
    - "Alliance Architect requests evaluation of prospective technology partner"
    - "VP Alliances requests strategic partnership assessment"
    - "SA Agent requests evaluation of technology frequently encountered in the field"

  conditional:
    - "IF new_partnership_proposal_submitted THEN trigger"
    - "IF partner_contract_renewal_date - today <= 90 AND partnership_tier >= SILVER THEN trigger"
    - "IF competitor_partner_announcement_detected THEN trigger"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Partner platform evaluation materials (product overview, architecture docs)"
    - artifact: "Partner API documentation (OpenAPI specs, SDK references, integration guides)"
    - artifact: "Strategic alignment criteria (why this partnership is being considered)"
    - artifact: "Competitive landscape for this partner's category"

  optional:
    - artifact: "Partner SDK samples or sandbox environment access"
      use: "Hands-on API maturity and integration quality assessment"
    - artifact: "Partner financial and market data (funding, revenue, growth trajectory)"
      use: "Partnership viability and longevity assessment"
    - artifact: "Existing customer requests or field signals mentioning this partner"
      use: "Demand signal validation"
    - artifact: "Partner's public case studies, customer logos, analyst reports"
      use: "Market validation and credibility assessment"

  minimum_data_threshold:
    - "Partner API documentation or at least a public developer portal accessible"
    - "Partnership strategic rationale documented (why evaluate)"
    - "Competitive category identified"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  api_maturity_assessment:
    - "What is the API maturity level (Richardson Model: Level 0 = HTTP tunneling, Level 1 = resources, Level 2 = HTTP verbs, Level 3 = HATEOAS)?"
    - "Does the partner provide OpenAPI/Swagger specifications, and are they accurate and current?"
    - "What authentication model is used (API key, OAuth 2.0, SAML, mTLS), and does it align with our patterns?"
    - "What is the API versioning strategy (URL path, header, query param), and what is the deprecation policy?"
    - "Are rate limits, pagination, and error handling documented and consistent?"

  integration_effort:
    - "What integration patterns are supported (REST, GraphQL, gRPC, webhook, event-driven, file-based)?"
    - "How much custom code is required vs. using partner SDK out-of-the-box?"
    - "What are the data transformation requirements (schema mapping, format conversion, enrichment)?"
    - "What is the estimated engineering effort to build, test, and certify the integration (person-weeks)?"
    - "Are there existing connectors, middleware, or iPaaS support that reduce effort?"

  architecture_compatibility:
    - "Does the partner's architecture align with our deployment models (cloud-native, hybrid, on-premises)?"
    - "What are the data residency and sovereignty constraints of the partner platform?"
    - "How does the partner handle multi-tenancy, isolation, and data separation?"
    - "What is the partner's availability and disaster recovery posture (SLA, RTO, RPO)?"

  strategic_fit:
    - "Does this partnership fill a gap in our solution portfolio or strengthen an existing capability?"
    - "Is the partner's target market aligned with our ideal customer profile?"
    - "What is the competitive landscape: are alternative partners available with better fit?"
    - "What is the partner's market trajectory (growing, stable, declining, at-risk)?"
    - "Does the partner have existing relationships with hyperscalers that complement our GTM?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    # Strong technical fit, recommend partnership
    - condition: "api_maturity_score >= 2.5 AND integration_effort <= MEDIUM AND strategic_fit == STRONG"
      output_type: "Decision + Initiative"
      decision: |
        CREATE Decision:
          title: "Recommend partnership with {vendor}: strong technical and strategic fit"
          context: "API maturity {api_score}/3, integration effort {effort}, strategic fit strong"
          decision: "Proceed with partnership, initiate integration development"
          actions:
            - "Present findings to VP Alliances with go recommendation"
            - "Initiate integration development planning with engineering"
            - "Begin reference architecture design (route to aa-solution-architecture-agent)"
            - "Coordinate with Partner Manager on commercial terms"
          stakeholders: ["Alliance Architect", "VP Alliances", "Partner Manager"]

        CREATE Initiative:
          title: "Partnership onboarding for {vendor}"
          owner: "Alliance Architect"
          timeline: "90 days"
          actions:
            - "Complete integration development"
            - "Develop reference architecture"
            - "Create field enablement materials"
            - "Achieve initial certification"

    # Moderate fit, conditional recommendation
    - condition: "(api_maturity_score >= 1.5 AND api_maturity_score < 2.5) OR (integration_effort == HIGH AND strategic_fit >= MODERATE)"
      severity: "MEDIUM"
      output_type: "Decision + Risk"
      decision: |
        CREATE Decision:
          title: "Conditional partnership recommendation for {vendor}"
          context: "Technical fit moderate, conditions must be met before proceeding"
          decision: "Proceed with partnership contingent on partner addressing technical gaps"
          conditions:
            - "Partner commits to API improvements per assessment findings"
            - "Integration effort is funded and resourced"
            - "Strategic value justifies higher integration investment"

        CREATE Risk:
          title: "Technical gaps in prospective partnership with {vendor}"
          severity: "MEDIUM"
          category: "integration"
          description: "API maturity or integration effort concerns require mitigation"
          mitigation:
            - "Negotiate API improvement commitments with partner"
            - "Plan phased integration (core functionality first, advanced later)"
            - "Establish SLA on partner API stability and support response times"

    # Weak fit, do not recommend
    - condition: "api_maturity_score < 1.5 OR integration_effort == VERY_HIGH OR strategic_fit == WEAK"
      severity: "HIGH"
      output_type: "Decision + Risk"
      decision: |
        CREATE Decision:
          title: "Do not recommend partnership with {vendor}: technical risk too high"
          context: "API maturity {api_score}/3, integration effort {effort}, strategic fit {fit}"
          decision: "Decline partnership, document reasons, suggest alternatives if available"
          actions:
            - "Document technical findings for future reference"
            - "Identify alternative partners in same category (consult CI Agent)"
            - "Communicate decision to Partner Manager with technical justification"

        CREATE Risk:
          title: "Technical risk assessment for {vendor} partnership"
          severity: "HIGH"
          category: "partnership_viability"
          description: "Partnership would require disproportionate engineering investment relative to strategic value"

    # Renewal evaluation, compare to current state
    - condition: "evaluation_type == RENEWAL AND partnership_active == true"
      output_type: "Decision"
      decision: |
        CREATE Decision:
          title: "Partnership renewal assessment for {vendor}"
          context: "Comparing current integration health, field adoption, and strategic alignment"
          decision: "Renew/renegotiate/sunset based on assessment scores"
          actions:
            - "Compare current API maturity to original assessment"
            - "Review field adoption metrics (deals using this integration)"
            - "Validate strategic alignment remains current"
            - "Recommend tier adjustment if warranted"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "global-knowledge-vault/alliance_architects/due_diligence_{vendor}_{YYYY-MM-DD}.md"
    format: "markdown"
    sections:
      - executive_summary
      - api_maturity_assessment
      - integration_effort_estimation
      - architecture_compatibility
      - strategic_fit_assessment
      - risk_analysis
      - competitive_alternatives
      - recommendation

    schema:
      executive_summary:
        - partner_name: "string"
        - evaluation_date: "date"
        - evaluation_type: "enum[NEW|RENEWAL|STRATEGIC_REVIEW]"
        - overall_recommendation: "enum[PROCEED|CONDITIONAL|DECLINE]"
        - api_maturity_score: "number (0-3, Richardson scale)"
        - integration_effort: "enum[LOW|MEDIUM|HIGH|VERY_HIGH]"
        - strategic_fit: "enum[STRONG|MODERATE|WEAK]"
        - key_findings: "array[string]"

      api_maturity_assessment:
        richardson_level: "number (0-3)"
        api_documentation: "enum[EXCELLENT|GOOD|FAIR|POOR]"
        authentication_model: "string"
        versioning_strategy: "string"
        deprecation_policy: "string"
        rate_limiting: "boolean"
        error_handling_quality: "enum[EXCELLENT|GOOD|FAIR|POOR]"
        sdk_availability: "boolean"
        sdk_languages: "array[string]"

      integration_effort:
        estimated_effort_weeks: "number"
        effort_category: "enum[LOW|MEDIUM|HIGH|VERY_HIGH]"
        complexity_drivers: "array[string]"
        existing_connectors: "boolean"
        custom_code_required: "string (description of custom work)"
        testing_effort: "string"

      risk_analysis:
        technical_risks: "array[{risk, severity, mitigation}]"
        operational_risks: "array[{risk, severity, mitigation}]"
        strategic_risks: "array[{risk, severity, mitigation}]"
        overall_risk_level: "enum[LOW|MEDIUM|HIGH|CRITICAL]"

  decision_objects:
    path: "global-knowledge-vault/alliance_architects/decisions/"
    create_if:
      - "Go recommendation (proceed with partnership)"
      - "No-go recommendation (decline partnership)"
      - "Conditional recommendation (proceed with stipulations)"
      - "Renewal decision (renew, renegotiate, or sunset)"
    template: "ADR format"

  risk_objects:
    path: "global-knowledge-vault/alliance_architects/risks/"
    create_if:
      - "Technical gaps identified in API maturity or architecture"
      - "High integration effort relative to strategic value"
      - "Partner viability concerns (financial, market position)"
    template: "Risk with mitigation plan"

  initiative_objects:
    path: "global-knowledge-vault/alliance_architects/initiatives/"
    create_if:
      - "Partnership onboarding approved"
      - "Conditional partnership with gap remediation plan"
    template: "Initiative with actions, owner, timeline"

  notifications:
    - recipient: "Alliance Architect"
      condition: "always"
      message: "Due diligence complete for {vendor}: recommendation {overall_recommendation}"

    - recipient: "VP Alliances"
      condition: "overall_recommendation == PROCEED OR strategic_fit == STRONG"
      message: "Strategic partnership recommendation for {vendor}: {overall_recommendation}"

    - recipient: "Partner Agent"
      condition: "always"
      message: "Technical due diligence for {vendor} complete: {overall_recommendation}, API maturity {api_score}/3"

    - recipient: "CI Agent"
      condition: "overall_recommendation == DECLINE"
      message: "Partnership declined for {vendor}, alternative partner identification requested for category"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "partner_refuses_technical_disclosure"
      reason: "Cannot conduct due diligence without API documentation or technical access"
      action: "Alliance Architect to negotiate technical disclosure with partner, or recommend decline"

    - condition: "conflicting_strategic_signals (business wants partnership but technical fit is poor)"
      reason: "Strategic vs. technical misalignment requires leadership decision"
      action: "Present findings to VP Alliances for strategic override or decline"

    - condition: "partner_undergoing_acquisition_or_major_pivot"
      reason: "Market instability makes technical assessment unreliable"
      action: "Defer evaluation until post-acquisition integration is clear"

  insufficient_data:
    - "No API documentation available (partner has no public developer portal)"
    - "No SDK or sample code to evaluate integration patterns"
    - "Strategic rationale for partnership not documented"
    - "No engineering resource available to conduct hands-on evaluation"

  ambiguity_signals:
    - "Partner documentation describes planned features as current capabilities"
    - "API documentation is inconsistent with actual API behavior"
    - "Multiple conflicting integration approaches documented without guidance"

  human_judgment_required:
    - "Weighing strategic value against technical investment (business vs. engineering tradeoff)"
    - "Selecting partnership tier (technology partner vs. strategic alliance vs. integration partner)"
    - "Deciding whether to invest in improving a partner's integration vs. choosing alternative"
    - "Evaluating partner's roadmap commitments vs. current state"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Partner evaluation materials accessible"
    - "Strategic rationale documented"
    - "Competitive landscape for partner category available"

  post_execution:
    - "API maturity scored on Richardson scale (0-3) with justification"
    - "Integration effort estimated in person-weeks with complexity drivers"
    - "Strategic fit assessed with evidence (portfolio gap, market alignment, GTM synergy)"
    - "Go/no-go recommendation provided with clear rationale"

  output_quality:
    - "No API maturity scores without specific evidence (endpoint examples, documentation quality)"
    - "Integration effort estimate includes assumptions and confidence level"
    - "Risk analysis covers technical, operational, and strategic dimensions"
    - "Competitive alternatives listed if recommendation is DECLINE"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "20-40 minutes (agent) + 2-4 hours (human review, hands-on testing, strategic alignment)"
frequency: "On-demand (triggered by partnership proposal or renewal)"
human_review_required: true
approval_workflow:
  - reviewer: "Alliance Architect"
    approval_gate: "Validate technical assessment accuracy, confirm API maturity scoring, approve effort estimate"
  - reviewer: "VP Alliances"
    condition: "strategic_partnership == true OR investment > $100K"
    approval_gate: "Approve strategic recommendation (go/no-go/conditional)"
  - reviewer: "SA Agent"
    condition: "architecture_compatibility_concerns == true"
    approval_gate: "Validate architecture compatibility findings"

