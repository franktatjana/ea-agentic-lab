# disclaimer
# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (AWS FTR, Azure IP Co-sell,
# ISV programs, etc.) are industry-standard methodologies
# cited for educational context.

# PLAYBOOK: Co-sell Technical Readiness
# Framework operationalization for AI agents

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_AA_002"
framework_name: "Co-sell Technical Readiness"
framework_source: "AWS Foundational Technical Review / Azure IP Co-sell Requirements / ISV Partner Programs"
intended_agent_role: "aa-agent"
intended_sub_agent: "aa-technical-enablement-agent"
secondary_agents:
  - "HAM Agent provides hyperscaler program requirements"
  - "SA Agent provides customer architecture context"
  - "Partner Agent provides go-to-market context"
playbook_mode: "GENERATIVE"
playbook_category: "partner_enablement"

primary_objective: "Prepare validated technical readiness packages for joint customer engagements, including reference architectures, deployment guides, integration documentation, and co-sell collateral"

blueprint_integration:
  required: true
  archetypes:
    - "Competitive Displacement"
    - "Platform Consolidation"
  trigger_signal: "cosell_engagement_scheduled"
  rationale: "Co-sell deals require validated technical packages that demonstrate joint solution viability to the customer and satisfy hyperscaler program requirements"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Co-sell readiness packages contain deal-specific architecture context, pricing assumptions, and partner positioning that are vendor-internal."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Reusable reference architectures and deployment patterns (sanitized of deal context)"
    - vault: "Customer InfoHub"
      artifact: "Joint solution architecture overview shared with customer during co-sell engagement"

when_not_to_use:
  - "Deal does not involve a partner solution (single-vendor engagement)"
  - "Partner relationship is pre-due-diligence stage (use PB_AA_003 first)"
  - "Customer has already deployed the joint solution and needs support, not readiness"
  - "Commercial co-sell terms not yet agreed (Partner Manager must finalize first)"
  - "Hyperscaler program requirements are unknown (HAM Agent must provide first)"

raci:
  responsible:
    role: "AA Agent"
    agent: "aa-technical-enablement-agent"
    description: "Prepares technical readiness packages, validates against program requirements, assembles co-sell collateral"

  accountable:
    role: "Alliance Architect"
    human_required: true
    description: "Approves readiness package accuracy, validates reference architecture correctness, signs off on co-sell technical content"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted:
    - role: "HAM Agent"
      on_steps: ["program_requirements", "marketplace_listing_compliance", "co-sell_qualification_criteria"]
    - role: "SA Agent"
      on_steps: ["customer_architecture_fit", "deployment_feasibility", "integration_requirements"]
    - role: "Partner Agent"
      on_steps: ["gtm_alignment", "partner_resource_availability", "joint_messaging"]

  informed:
    - role: "AE Agent"
      notify_on: ["readiness_package_complete", "readiness_gap_identified"]
    - role: "HAM Agent"
      notify_on: ["cosell_qualification_status", "marketplace_readiness"]
    - role: "Partner Manager"
      notify_on: ["readiness_package_complete", "partner_action_required"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Co-sell engagement scheduled with customer"
    - "Partner solution included in deal architecture"
    - "Marketplace listing requires technical validation before go-live"
    - "Hyperscaler program review approaching (FTR, IP Co-sell review)"
    - "New reference architecture certified by partner"

  manual:
    - "SA Agent requests co-sell readiness package for customer presentation"
    - "AE Agent requests joint solution collateral for deal advancement"
    - "Partner Manager requests technical content for partner business review"

  conditional:
    - "IF deal_includes_partner_solution == true AND deal_stage >= 3 THEN trigger"
    - "IF hyperscaler_review_date - today <= 30 THEN trigger"
    - "IF marketplace_listing_status == PENDING_TECHNICAL_REVIEW THEN trigger"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Partner solution specifications (capabilities, APIs, deployment models)"
    - artifact: "Hyperscaler program requirements (FTR checklist, IP Co-sell criteria, marketplace requirements)"
    - artifact: "Customer architecture requirements (from SA Agent or deal context)"
    - artifact: "Existing reference architectures for this partner (if any)"

  optional:
    - artifact: "{realm}/{node}/internal-infohub/alliance_architects/compatibility_matrix.md"
      use: "Current integration validation status"
    - artifact: "Partner deployment guides and documentation"
      use: "Validate deployment instructions accuracy"
    - artifact: "Previous co-sell engagement outcomes"
      use: "Lessons learned and reusable patterns"
    - artifact: "Competitor joint solution positioning"
      use: "Differentiation narrative"

  minimum_data_threshold:
    - "Partner solution specifications available"
    - "At least 1 hyperscaler program requirement set identified"
    - "Customer use case or architecture requirements documented"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  solution_architecture:
    - "What is the joint solution architecture (data flow, component interaction, deployment topology)?"
    - "Which deployment models are supported (SaaS-to-SaaS, hybrid, on-premises, marketplace)?"
    - "What are the integration points and data exchange patterns (API, webhook, event-driven, batch)?"
    - "What are the scalability characteristics and performance expectations?"
    - "Are there reference customers who have deployed this joint solution?"

  program_compliance:
    - "Which hyperscaler program requirements apply (AWS FTR, Azure IP Co-sell, GCP ISV)?"
    - "Does the joint solution meet all mandatory technical requirements for the target program?"
    - "Is the marketplace listing complete with required metadata, pricing, and deployment automation?"
    - "Are there pending compliance items that block co-sell qualification?"

  customer_fit:
    - "Does the customer's existing architecture support the joint solution deployment model?"
    - "What prerequisites must the customer meet before deployment (network, identity, data format)?"
    - "Are there known limitations or constraints for this customer's environment?"
    - "What is the expected deployment timeline and effort for this customer?"
    - "Does the customer have the operational maturity to manage the joint solution?"

  enablement_readiness:
    - "Do field SA teams have the knowledge to position and deploy this joint solution?"
    - "Is there a deployment guide with step-by-step instructions and troubleshooting?"
    - "Are demo environments available for customer-facing presentations?"
    - "What training materials exist for the partner solution components?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    # Fully ready for co-sell
    - condition: "readiness_score >= 80 AND program_compliance == COMPLETE AND reference_architecture_validated == true"
      output_type: "Decision + Initiative"
      decision: |
        CREATE Decision:
          title: "Co-sell technical readiness confirmed for {vendor} joint solution"
          context: "Readiness score {score}/100, program compliance complete, reference architecture validated"
          decision: "Approve co-sell engagement, distribute readiness package to SA teams"
          actions:
            - "Distribute readiness package to SA teams involved in the deal"
            - "Notify AE Agent that joint solution is cleared for customer presentation"
            - "Update co-sell qualification status with HAM Agent"
            - "Archive readiness package in Global Knowledge Vault for reuse"

        CREATE Initiative:
          title: "Co-sell execution for {vendor} with {node}"
          owner: "SA Agent / AE Agent"
          timeline: "Aligned with deal timeline"

    # Readiness gaps identified
    - condition: "readiness_score < 80 OR program_compliance == INCOMPLETE"
      severity: "MEDIUM"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Co-sell readiness gaps for {vendor} joint solution"
          severity: "MEDIUM"
          category: "partner_enablement"
          description: "Readiness score {score}/100, gaps in {gap_dimensions}"

        CREATE Initiative:
          title: "Close co-sell readiness gaps for {vendor}"
          owner: "AA Agent"
          urgency: "HIGH"
          actions:
            - "Address each gap dimension with specific remediation"
            - "Coordinate with partner on missing documentation or test environments"
            - "Request HAM Agent clarification on ambiguous program requirements"
            - "Set target date for readiness re-assessment"

    # Reference architecture missing
    - condition: "reference_architecture_exists == false"
      severity: "HIGH"
      output_type: "Initiative"
      decision: |
        CREATE Initiative:
          title: "Develop reference architecture for {vendor} joint solution"
          owner: "AA Agent (aa-solution-architecture-agent)"
          urgency: "HIGH"
          actions:
            - "Design reference architecture based on partner specs and customer patterns"
            - "Validate with SA Agent for deployment feasibility"
            - "Create deployment guide with prerequisites, steps, and validation"
            - "Submit for partner review and certification"
            - "Publish to Global Knowledge Vault for field reuse"

    # Program deadline approaching with incomplete readiness
    - condition: "days_until_program_review <= 14 AND readiness_score < 80"
      severity: "HIGH"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Program review deadline at risk for {vendor} co-sell"
          severity: "HIGH"
          category: "partner_program"
          description: "Program review in {days} days, readiness at {score}/100"

        CREATE Initiative:
          title: "Emergency readiness sprint for {vendor} program review"
          owner: "AA Agent / Alliance Architect"
          urgency: "IMMEDIATE"
          actions:
            - "Prioritize critical compliance gaps only (defer nice-to-haves)"
            - "Escalate partner-dependent items to Partner Manager"
            - "Request extension from hyperscaler program team if needed"
            - "Prepare gap explanation for program review if incomplete"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/alliance_architects/cosell_readiness_{vendor}_{YYYY-MM-DD}.md"
    format: "markdown"
    sections:
      - executive_summary
      - joint_solution_architecture
      - program_compliance_checklist
      - readiness_scorecard
      - deployment_guide_summary
      - customer_fit_assessment
      - enablement_materials
      - gap_analysis
      - recommendations

    schema:
      executive_summary:
        - partner_name: "string"
        - joint_solution_name: "string"
        - readiness_score: "number (0-100)"
        - readiness_status: "enum[READY|GAPS_IDENTIFIED|NOT_READY]"
        - program_compliance: "enum[COMPLETE|INCOMPLETE|NOT_APPLICABLE]"
        - target_engagement_date: "date|null"
        - blocking_gaps: "array[string]"

      readiness_dimensions:
        integration_quality:
          score: "number (0-100)"
          status: "enum[READY|PARTIAL|NOT_READY]"
          details: "string"
        documentation_completeness:
          score: "number (0-100)"
          status: "enum[READY|PARTIAL|NOT_READY]"
          missing_items: "array[string]"
        deployment_automation:
          score: "number (0-100)"
          status: "enum[READY|PARTIAL|NOT_READY]"
          automation_coverage: "string"
        support_coverage:
          score: "number (0-100)"
          status: "enum[READY|PARTIAL|NOT_READY]"
          support_model: "string"

      program_compliance:
        - program_name: "string (e.g., AWS FTR, Azure IP Co-sell)"
        - requirements_total: "number"
        - requirements_met: "number"
        - requirements_pending: "number"
        - blocking_requirements: "array[string]"

  decision_objects:
    path: "{realm}/{node}/internal-infohub/alliance_architects/decisions/"
    create_if:
      - "Readiness confirmed, co-sell approved"
      - "Readiness gaps too large, co-sell deferred"
    template: "ADR format"

  risk_objects:
    path: "{realm}/{node}/internal-infohub/alliance_architects/risks/"
    create_if:
      - "Readiness gaps identified with deal timeline at risk"
      - "Program deadline approaching with incomplete compliance"
    template: "Risk with mitigation plan"

  initiative_objects:
    path: "{realm}/{node}/internal-infohub/alliance_architects/initiatives/"
    create_if:
      - "Reference architecture development needed"
      - "Readiness gap remediation required"
      - "Emergency program review preparation"
    template: "Initiative with actions, owner, timeline"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Co-sell readiness assessment complete for {vendor}: {readiness_status}"

    - recipient: "HAM Agent"
      condition: "always"
      message: "Co-sell qualification status for {vendor}: compliance {program_compliance}, readiness {readiness_score}/100"

    - recipient: "SA Agent"
      condition: "readiness_status == READY"
      message: "Joint solution readiness package available for {vendor}, ready for customer engagement"

    - recipient: "Partner Manager"
      condition: "readiness_status == GAPS_IDENTIFIED OR readiness_status == NOT_READY"
      message: "Co-sell readiness gaps for {vendor}, partner action may be required"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "partner_solution_specs_unavailable"
      reason: "Cannot build readiness package without partner solution documentation"
      action: "Alliance Architect to request specs from partner technical contact"

    - condition: "program_requirements_contradictory_or_ambiguous"
      reason: "Hyperscaler program requirements unclear, cannot assess compliance"
      action: "HAM Agent or Alliance Architect to clarify with program team"

    - condition: "customer_architecture_incompatible_with_joint_solution"
      reason: "Fundamental architecture mismatch requires human assessment of alternatives"
      action: "SA Agent and Alliance Architect to evaluate workarounds or alternative solutions"

  insufficient_data:
    - "Partner solution specifications not available"
    - "Hyperscaler program requirements not documented"
    - "Customer architecture requirements unknown"
    - "No reference architecture or deployment pattern exists for this combination"

  ambiguity_signals:
    - "Partner documentation describes capabilities not validated in testing"
    - "Multiple deployment models available, unclear which fits customer"
    - "Program requirements differ between regions or tiers"

  human_judgment_required:
    - "Selecting reference architecture variant for specific customer environment"
    - "Prioritizing readiness gaps when timeline is constrained"
    - "Deciding whether to proceed with partial readiness or defer engagement"
    - "Approving co-sell collateral messaging and positioning"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Partner solution specifications accessible"
    - "Target hyperscaler program identified"
    - "Customer or engagement context available"

  post_execution:
    - "Readiness score calculated across all dimensions"
    - "Program compliance checklist completed (no items left as 'unknown')"
    - "Reference architecture included or gap documented"
    - "Deployment guide validated or creation initiative created"

  output_quality:
    - "No readiness dimensions scored without supporting evidence"
    - "All compliance items have clear MET/NOT_MET status with evidence"
    - "Gap analysis includes remediation actions with owners and timelines"
    - "Reference architecture validated against current partner API version"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "15-30 minutes (agent) + 60-120 minutes (human review and refinement)"
frequency: "On-demand (triggered by co-sell engagement or program review)"
human_review_required: true
approval_workflow:
  - reviewer: "Alliance Architect"
    approval_gate: "Validate readiness package accuracy, approve reference architecture, sign off on co-sell collateral"
  - reviewer: "HAM Agent"
    condition: "hyperscaler_program_involved == true"
    approval_gate: "Validate program compliance assessment against latest requirements"
  - reviewer: "SA Agent"
    condition: "customer_specific_architecture == true"
    approval_gate: "Validate deployment feasibility and customer architecture fit"

