# PLAYBOOK: Partner Engagement Health Assessment
# Framework operationalization for AI agents
# Periodic assessment of partner engagement health within an account

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
steckbrief:
  playbook_id: "PB_PTR_001"
  name: "Partner Engagement Health"
  category: "partners"
  mode: "ASSESSMENT"
  version: "1.0"
  status: "production_ready"

  one_liner: "Assess partner engagement health by evaluating commitments, communication, alignment, and delivery to produce a health scorecard with GREEN/YELLOW/RED status"
  framework_origin: "Partner Relationship Management Best Practices"

  owner_agent: "Partner Agent (partner_agent)"
  supporting_agents: ["AE Agent (account context)", "Delivery Agent (delivery status)", "CA Agent (customer impact)"]

  triggers_summary:
    - "Monthly partner health review cycle"
    - "Partner misses committed deliverable or milestone"
    - "Account team reports communication breakdown with partner"

  anti_patterns:
    - "Partner relationship is less than 30 days old (insufficient data for health assessment)"
    - "One-time transactional engagement with no ongoing partnership"
    - "Partner is a subcontractor managed entirely by customer (no vendor oversight)"
    - "Joint planning is needed (use PB_PTR_003 instead)"

  key_inputs:
    - "Account plan partner section with commitments and scope"
    - "Partner communication logs and meeting notes"
    - "Partner deliverable tracker with deadlines and status"

  key_outputs:
    - artifact: "Partner Engagement Health Scorecard"
      format: "yaml"
    - artifact: "Partner Risk Alerts"
      format: "yaml"
    - artifact: "Health Trend Report"
      format: "markdown"

  key_decisions:
    - "Health GREEN: maintain current engagement cadence, pursue expansion"
    - "Health YELLOW: increase touchpoint frequency, address specific gaps"
    - "Health RED: escalate to Partner Manager, trigger intervention plan"

  complexity: "MEDIUM"
  estimated_inputs: 8
  estimated_rules: 6

  source_file: "domain/playbooks/partners/PB_PTR_001_partner_engagement_health.yaml"
  last_updated: "2026-02-27"

# ==============================================================================
# VAULT ROUTING
# ==============================================================================
vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Partner alignment and dependency tracking is vendor-internal coordination. Partners receive joint planning outputs but not internal health assessments."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized partner engagement patterns"

# ==============================================================================
# RACI
# ==============================================================================
raci:
  responsible:
    role: "partner_agent"
    agent: "partner_agent"
    description: "Collects partner engagement data, calculates health score, identifies risks"

  accountable:
    role: "partner_manager"
    human_required: true
    description: "Reviews health assessment, approves intervention actions"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted:
    - role: "ae_agent"
      on_steps: ["account_context_collection", "commercial_alignment_review"]
    - role: "delivery_agent"
      on_steps: ["deliverable_status_validation", "implementation_progress_check"]

  informed:
    - role: "ca_agent"
      notify_on: ["health_yellow_or_red", "customer_impact_identified"]
    - role: "sa_agent"
      notify_on: ["technical_deliverable_risk"]

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_PTR_001"
framework_name: "Partner Engagement Health Assessment"
framework_source: "Partner Relationship Management Best Practices"
playbook_mode: "ASSESSMENT"
playbook_category: "relationship_governance"
intended_agent_role: "partner-agent"
secondary_agents: ["AE Agent (account context)", "Delivery Agent (delivery status)", "CA Agent (customer impact)"]

primary_objective: "Periodically assess partner engagement health within an account by evaluating commitment fulfillment, communication effectiveness, strategic alignment, and delivery quality, producing a health scorecard with GREEN/YELLOW/RED status and actionable recommendations"

when_not_to_use:
  - "Partner relationship is less than 30 days old (insufficient data for health assessment)"
  - "One-time transactional engagement with no ongoing partnership"
  - "Partner is a subcontractor managed entirely by customer (no vendor oversight)"
  - "Joint planning is needed (use PB_PTR_003 instead)"
  - "Dependency tracking is the primary concern (use PB_PTR_002 instead)"

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "monthly_partner_health_cycle"
      description: "Scheduled monthly partner engagement review"
      timing: "First week of each month"

    - event: "partner_deliverable_missed"
      description: "Partner fails to deliver on a committed milestone or deliverable"
      condition: "$.partner.deliverable_status == 'overdue' AND $.partner.days_overdue >= 5"

    - event: "communication_gap_detected"
      description: "No partner communication logged for extended period"
      condition: "$.partner.last_communication_days > 14"

    - event: "account_health_declining"
      description: "Account health score drops and partner is a contributing factor"
      condition: "$.account.health_trend == 'DECLINING' AND $.partner.active_engagement == true"

  manual:
    - "Partner Manager requests health assessment ahead of partner business review"
    - "Account team reports alignment concerns with partner"
    - "Pre-renewal partner performance review"

  conditional:
    - condition: "$.partner.missed_deliverables >= 2 AND $.partner.period == 'current_quarter'"
      description: "Multiple missed deliverables in a single quarter"

    - condition: "$.partner.escalation_count >= 1 AND $.partner.escalation_resolved == false"
      description: "Open escalation with unresolved partner issue"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "{realm}/{node}/internal-infohub/partners/partner_engagement.yaml"
      description: "Partner engagement record with commitments, scope, and contacts"
    - artifact: "{realm}/{node}/internal-infohub/planning/account_plan.md"
      description: "Account plan partner section with agreed responsibilities"
    - artifact: "Partner communication logs (emails, meeting notes, chat threads)"
      description: "Record of partner interactions over the assessment period"

  optional:
    - artifact: "{realm}/{node}/internal-infohub/partners/partner_deliverables.yaml"
      use: "Deliverable tracker with deadlines, status, and acceptance criteria"
    - artifact: "{realm}/{node}/internal-infohub/partners/previous_health_scorecard.yaml"
      use: "Prior health assessment for trend comparison"
    - artifact: "{realm}/{node}/internal-infohub/risks/*.md"
      use: "Open risks related to partner engagement"
    - artifact: "{realm}/{node}/external-infohub/delivery/project_plan.md"
      use: "Implementation timeline where partner has deliverables"
    - artifact: "Customer feedback on partner performance"
      use: "Customer perspective on partner work quality and responsiveness"

  minimum_data_threshold:
    - "Partner engagement record exists with defined commitments"
    - "At least 30 days of engagement history available"
    - "At least one communication touchpoint logged in the assessment period"

# ==============================================================================
# KEY QUESTIONS
# ==============================================================================
key_questions:
  commitment_fulfillment:
    - "What did the partner commit to deliver this period?"
    - "What has been delivered vs. what is outstanding?"
    - "Are deliverables meeting quality expectations?"
    - "Are deadlines being met, or are there consistent slippages?"
    - "Has the partner proactively communicated about delays or blockers?"

  communication_effectiveness:
    - "How frequently is the partner communicating with the account team?"
    - "Is communication proactive or only reactive to issues?"
    - "Are the right partner stakeholders engaged (technical, management, executive)?"
    - "Are meeting cadences being honored?"
    - "Is information shared timely and with sufficient detail?"

  strategic_alignment:
    - "Is the partner's work aligned with the account plan objectives?"
    - "Does the partner understand and support the overall account strategy?"
    - "Are there conflicting priorities between vendor goals and partner activities?"
    - "Is the partner pursuing independent objectives that may conflict?"
    - "Is the partner invested in the long-term success of the account?"

  delivery_quality:
    - "What is the quality of partner deliverables (documentation, code, services)?"
    - "Has the customer expressed satisfaction or concerns about partner work?"
    - "Are partner resources appropriately skilled for the engagement?"
    - "Is the partner following agreed methodologies and standards?"
    - "Are there rework cycles caused by partner quality issues?"

  relationship_dynamics:
    - "Is there a clear escalation path when issues arise?"
    - "How quickly are partner issues resolved after identification?"
    - "Is there mutual trust and transparency between vendor and partner teams?"
    - "Are there interpersonal or organizational friction points?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  scoring:
    dimensions:
      - name: "commitment_fulfillment"
        weight: 30
        description: "Percentage of commitments met on time and to standard"
      - name: "communication_quality"
        weight: 25
        description: "Frequency, proactiveness, and quality of partner communication"
      - name: "strategic_alignment"
        weight: 20
        description: "Alignment between partner activities and account plan goals"
      - name: "delivery_quality"
        weight: 15
        description: "Quality of partner deliverables and customer satisfaction"
      - name: "relationship_health"
        weight: 10
        description: "Trust, responsiveness, and escalation effectiveness"
    max_score: 100
    green_threshold: 70
    yellow_threshold: 50
    red_threshold: 49

  rules:
    - id: "partner_health_green"
      condition: "partner_health_score >= 70"
      severity: "LOW"
      output_type: "Decision"
      decision:
        title: "Partner engagement healthy for {partner_name} in {node}"
        context: "Partner meeting commitments, communication effective, alignment strong"
        recommendation: "Maintain current engagement cadence, explore expansion opportunities"
        actions:
          - "Continue scheduled touchpoints and review cadence"
          - "Identify joint expansion or upsell opportunities"
          - "Document successful collaboration patterns for reuse"
          - "Consider partner for reference or case study participation"

    - id: "partner_health_yellow"
      condition: "partner_health_score >= 50 AND partner_health_score < 70"
      severity: "MEDIUM"
      output_type: "Initiative + Action Items"
      decision:
        title: "Partner engagement at risk for {partner_name} in {node}"
        context: "Partner engagement showing gaps in one or more dimensions"
        recommendation: "Increase engagement frequency, address specific gaps"
        actions:
          - "Schedule partner alignment meeting within 7 days"
          - "Document specific gaps with examples and expected standards"
          - "Increase communication cadence to weekly check-ins"
          - "Set 30-day improvement targets for underperforming dimensions"
          - "Notify AE Agent of partner risk to account plan"

    - id: "partner_health_red"
      condition: "partner_health_score < 50"
      severity: "HIGH"
      output_type: "Risk + Escalation"
      decision:
        title: "Partner engagement critical for {partner_name} in {node}"
        context: "Partner engagement failing across multiple dimensions, account impact likely"
        recommendation: "Escalate to Partner Manager, initiate intervention plan"
        actions:
          - "Escalate to Partner Manager with documented evidence"
          - "Schedule executive-to-executive partner conversation"
          - "Assess impact on account delivery timeline and customer commitments"
          - "Prepare contingency plan (alternative partner, in-house delivery)"
          - "Create recovery plan with specific milestones and review dates"
        urgency: "HIGH"
      creates:
        - object_type: "Risk"
          category: "partner"
          severity: "HIGH"

    - id: "commitment_pattern_declining"
      condition: "commitment_fulfillment_trend == 'DECLINING' AND periods_declining >= 2"
      severity: "MEDIUM"
      output_type: "Risk + Action Items"
      decision:
        title: "Declining commitment pattern from {partner_name}"
        context: "Partner commitment fulfillment has declined for 2+ consecutive periods"
        recommendation: "Address root cause before pattern worsens"
        actions:
          - "Investigate root cause: resource constraints, priority shifts, capability gaps"
          - "Schedule candid conversation with partner management"
          - "Review and potentially reduce partner scope if capacity is the issue"
          - "Set explicit improvement timeline with measurable targets"

    - id: "communication_breakdown"
      condition: "days_since_last_communication > 21 OR missed_meetings >= 3"
      severity: "HIGH"
      output_type: "Risk + Escalation"
      decision:
        title: "Communication breakdown with {partner_name}"
        context: "No meaningful partner communication in 21+ days or 3+ missed meetings"
        recommendation: "Immediate outreach through escalation channels"
        actions:
          - "Attempt contact through alternative channels (phone, alternate contacts)"
          - "Escalate to partner management if primary contacts unresponsive"
          - "Assess impact on pending deliverables and customer commitments"
          - "Document communication gap for partner business review"
        urgency: "HIGH"

    - id: "customer_dissatisfaction_with_partner"
      condition: "customer_feedback_negative == true AND feedback_relates_to_partner == true"
      severity: "HIGH"
      output_type: "Risk + Initiative"
      decision:
        title: "Customer dissatisfied with {partner_name} performance in {node}"
        context: "Direct or indirect customer feedback indicates dissatisfaction with partner work"
        recommendation: "Address immediately to prevent account health deterioration"
        actions:
          - "CA Agent: Quantify customer impact and sentiment"
          - "Communicate feedback to partner with specific examples"
          - "Develop remediation plan with partner for customer presentation"
          - "Monitor closely for improvement in next 30 days"
          - "Prepare fallback plan if partner cannot remediate"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/partners/health_scorecard_{partner_id}_{YYYY-MM-DD}.yaml"
    format: "yaml"
    sections:
      - executive_summary
      - overall_health_score
      - dimension_breakdown
      - trend_analysis
      - risk_register
      - recommendations

    schema:
      executive_summary:
        - partner_name: "string"
        - account: "string"
        - assessment_period: "string"
        - overall_status: "enum[GREEN|YELLOW|RED]"
        - headline: "string (one-sentence summary)"

      overall_health_score:
        score: "number (0-100)"
        category: "enum[GREEN|YELLOW|RED]"
        trend: "enum[IMPROVING|STABLE|DECLINING]"
        previous_score: "number|null"
        change: "number (delta from previous)"

      dimension_breakdown:
        commitment_fulfillment:
          score: "number (0-100)"
          status: "enum[GREEN|YELLOW|RED]"
          committed_items: "integer"
          delivered_items: "integer"
          on_time_percentage: "number"
          evidence: "array[string]"
          weight: 0.30

        communication_quality:
          score: "number (0-100)"
          status: "enum[GREEN|YELLOW|RED]"
          touchpoint_frequency: "enum[WEEKLY|BIWEEKLY|MONTHLY|RARE]"
          proactiveness: "enum[HIGH|MODERATE|LOW]"
          evidence: "array[string]"
          weight: 0.25

        strategic_alignment:
          score: "number (0-100)"
          status: "enum[GREEN|YELLOW|RED]"
          alignment_with_account_plan: "enum[STRONG|MODERATE|WEAK|MISALIGNED]"
          evidence: "array[string]"
          weight: 0.20

        delivery_quality:
          score: "number (0-100)"
          status: "enum[GREEN|YELLOW|RED]"
          quality_rating: "enum[EXCEEDS|MEETS|BELOW|POOR]"
          rework_instances: "integer"
          evidence: "array[string]"
          weight: 0.15

        relationship_health:
          score: "number (0-100)"
          status: "enum[GREEN|YELLOW|RED]"
          trust_level: "enum[HIGH|MODERATE|LOW]"
          escalation_effectiveness: "enum[EFFECTIVE|ADEQUATE|POOR]"
          evidence: "array[string]"
          weight: 0.10

      trend_analysis:
        - period: "string"
          direction: "enum[IMPROVING|STABLE|DECLINING]"
          key_changes: "array[string]"

      risk_register:
        - risk_id: "string"
          title: "string"
          severity: "enum[HIGH|MEDIUM|LOW]"
          likelihood: "enum[HIGH|MEDIUM|LOW]"
          impact: "string"
          mitigation: "string"
          owner: "string"

      recommendations:
        - priority: "enum[HIGH|MEDIUM|LOW]"
          action: "string"
          owner: "string"
          timeline: "string"

  decision_objects:
    path: "{realm}/{node}/internal-infohub/decisions/"
    create_if:
      - "Health score RED requiring intervention strategy"
      - "Partner scope change recommended"
    template: "ADR format"

  risk_objects:
    path: "{realm}/{node}/internal-infohub/risks/"
    create_if:
      - "Health score RED (critical partner risk)"
      - "Health score YELLOW with customer-facing impact"
      - "Declining commitment trend detected"
    template: "Risk with mitigation plan"

  notifications:
    - recipient: "Partner Manager"
      condition: "always"
      message: "Partner health assessment complete for {partner_name} in {node}: {score}/100 ({category})"

    - recipient: "AE Agent"
      condition: "health_category == 'YELLOW' OR health_category == 'RED'"
      message: "Partner health {category} for {partner_name} in {node}. Account plan impact should be reviewed."

    - recipient: "Delivery Agent"
      condition: "delivery_quality_status == 'RED' OR commitment_fulfillment_status == 'RED'"
      message: "Partner delivery risk for {partner_name} in {node}. Delivery timeline may be affected."

    - recipient: "CA Agent"
      condition: "customer_impact_identified == true"
      message: "Partner performance impacting customer experience in {node}. Customer health review recommended."

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "partner_health_score < 30"
      reason: "Critical partner failure, strategic decision required on partner engagement"
      action: "Escalate to Partner Manager and Account Executive for partner replacement evaluation"

    - condition: "customer_escalation_related_to_partner"
      reason: "Customer has escalated issue directly tied to partner performance"
      action: "Immediate executive engagement, joint remediation plan required"

    - condition: "partner_contract_violation"
      reason: "Partner actions or inactions may constitute contract violation"
      action: "Engage legal and partner management leadership"

  insufficient_data:
    - "No partner engagement record available"
    - "No communication logs for the assessment period"
    - "Partner relationship less than 30 days old"

  ambiguity_signals:
    - "Conflicting reports on partner performance from different team members"
    - "Partner claims deliverables complete but no acceptance recorded"
    - "Communication logs suggest engagement but no documented outcomes"

  human_judgment_required:
    - "Weighting health dimensions based on account context"
    - "Interpreting qualitative feedback on partner relationship quality"
    - "Deciding whether to escalate, remediate, or replace partner"
    - "Assessing strategic importance of partner relationship beyond this account"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Partner engagement record exists with defined commitments"
    - "Assessment period has at least 30 days of data"
    - "Communication logs accessible for the period"

  post_execution:
    - "Overall health score between 0-100"
    - "Health category assigned (GREEN|YELLOW|RED)"
    - "All dimension scores between 0-100"
    - "Dimension weights sum to 1.0"
    - "At least 1 recommendation provided"
    - "Evidence cited for each dimension assessment"

  output_quality:
    - "Scores supported by specific evidence, not subjective impressions"
    - "Recommendations are actionable with clear owners and timelines"
    - "Trend analysis compares to previous assessment (if available)"
    - "Risk register entries have mitigation plans"

# ==============================================================================
# HEALTH SCORE CALCULATION
# ==============================================================================
calculation_formula:
  overall_score: "Weighted average of dimension scores"
  example:
    - "Commitment Fulfillment (30% weight): 80/100"
    - "Communication Quality (25% weight): 65/100"
    - "Strategic Alignment (20% weight): 75/100"
    - "Delivery Quality (15% weight): 70/100"
    - "Relationship Health (10% weight): 85/100"
    - "Overall: (80*0.30) + (65*0.25) + (75*0.20) + (70*0.15) + (85*0.10) = 24 + 16.25 + 15 + 10.5 + 8.5 = 74.25"

  category_thresholds:
    - "GREEN: 70-100"
    - "YELLOW: 50-69"
    - "RED: 0-49"

  dimension_scoring_guidelines:
    commitment_fulfillment:
      - "90-100: All commitments met on time and to standard"
      - "70-89: Most commitments met, minor delays communicated proactively"
      - "50-69: Several missed commitments, delays not always communicated"
      - "0-49: Majority of commitments missed, pattern of unreliability"

    communication_quality:
      - "90-100: Proactive, frequent, detailed communication with right stakeholders"
      - "70-89: Regular communication, mostly responsive, adequate detail"
      - "50-69: Infrequent or reactive communication, gaps in coverage"
      - "0-49: Rare communication, unresponsive, critical information delayed"

    strategic_alignment:
      - "90-100: Partner activities fully aligned with account plan, proactive contribution to strategy"
      - "70-89: Generally aligned, occasional misalignment on priorities"
      - "50-69: Partial alignment, partner pursues some independent objectives"
      - "0-49: Misaligned, partner activities conflict with account strategy"

    delivery_quality:
      - "90-100: Deliverables exceed expectations, no rework needed"
      - "70-89: Deliverables meet standards, minor revisions occasionally needed"
      - "50-69: Quality inconsistent, rework cycles common"
      - "0-49: Deliverables below standard, significant rework or customer complaints"

    relationship_health:
      - "90-100: High trust, rapid issue resolution, strong collaborative dynamic"
      - "70-89: Good working relationship, issues resolved in reasonable time"
      - "50-69: Functional but strained, escalations needed for resolution"
      - "0-49: Low trust, adversarial dynamics, unresolved friction"

# ==============================================================================
# INTEGRATION WITH OTHER PLAYBOOKS
# ==============================================================================
integrates_with:
  - playbook: "PB_PTR_002_partner_dependency_tracking"
    integration: "Health assessment identifies at-risk dependencies"
    provides: "Health context for dependency risk evaluation"

  - playbook: "PB_PTR_003_joint_account_planning"
    integration: "Health status informs joint planning approach and tone"
    provides: "Partner relationship health for planning session preparation"

  - playbook: "PB_AE_002_account_planning"
    integration: "Partner health impacts account plan execution"
    provides: "Partner health scorecard for account plan partner section"

  - playbook: "PB_CA_007_customer_health_score"
    integration: "Partner health is a contributing factor to customer health"
    provides: "Partner dimension data for customer health calculation"

  - playbook: "PB_DEL_001_implementation_kickoff"
    integration: "Partner health assessed before delivery engagement begins"
    provides: "Partner readiness and reliability assessment"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "15-30 minutes (agent collection + analysis) + 10-15 minutes (human review)"
frequency: "Monthly (scheduled) + triggered by events"
human_review_required: true
approval_workflow:
  - reviewer: "Partner Manager"
    approval_gate: "Validate health assessment accuracy and recommended actions"
  - reviewer: "Account Executive"
    condition: "health_category == 'RED'"
    approval_gate: "Approve intervention strategy and account plan impact assessment"

last_updated: "2026-02-27"
version: "1.0"
status: "production_ready"
notes: "First Partner Agent playbook. Provides structured health assessment of partner engagements within accounts."
