# PLAYBOOK: Joint Account Planning
# Framework operationalization for AI agents
# Structures joint planning sessions between vendor and partner for shared accounts

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
steckbrief:
  playbook_id: "PB_PTR_003"
  name: "Joint Account Planning"
  category: "partners"
  mode: "GENERATIVE"
  version: "1.0"
  status: "production_ready"

  one_liner: "Structure joint planning sessions between vendor and partner for shared accounts, aligning goals, dividing responsibilities, and identifying synergies to produce a joint account plan"
  framework_origin: "Partner Alliance Management & Joint Account Planning Methodology"

  owner_agent: "Partner Agent (partner_agent)"
  supporting_agents: ["AE Agent (account strategy)", "SA Agent (technical alignment)", "Delivery Agent (delivery coordination)", "VE Agent (value proposition)"]

  triggers_summary:
    - "New partner engagement initiated for an account"
    - "Annual or semi-annual joint planning cycle"
    - "Account plan refresh requires partner alignment"

  anti_patterns:
    - "No partner involvement in the account"
    - "Partner relationship is in RED health status (stabilize first via PB_PTR_001)"
    - "Transactional partner engagement with no shared account strategy"
    - "Partner is being replaced or offboarded from the account"

  key_inputs:
    - "Account plan with strategic objectives and whitespace analysis"
    - "Partner engagement record with capabilities and coverage"
    - "Partner health scorecard from most recent assessment"

  key_outputs:
    - artifact: "Joint Account Plan"
      format: "yaml"
    - artifact: "Responsibility Matrix (RACI)"
      format: "yaml"
    - artifact: "Joint Dependency Register"
      format: "yaml"

  key_decisions:
    - "Goal alignment achieved: proceed with joint execution plan"
    - "Capability gaps identified: agree on gap closure or bring additional resources"
    - "Competing priorities detected: negotiate scope boundaries and escalate if unresolved"
    - "Synergies identified: create joint value proposition for customer"

  complexity: "HIGH"
  estimated_inputs: 10
  estimated_rules: 5

  source_file: "domain/playbooks/partners/PB_PTR_003_joint_account_planning.yaml"
  last_updated: "2026-02-27"

# ==============================================================================
# VAULT ROUTING
# ==============================================================================
vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Partner alignment and dependency tracking is vendor-internal coordination. Partners receive joint planning outputs but not internal health assessments."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Joint account plan deliverables (shared with partner and customer)"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized partner engagement patterns"

# ==============================================================================
# RACI
# ==============================================================================
raci:
  responsible:
    role: "partner_agent"
    agent: "partner_agent"
    description: "Prepares joint planning session, facilitates alignment, produces joint account plan"

  accountable:
    role: "partner_manager"
    human_required: true
    description: "Owns partner relationship, approves joint plan commitments"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted:
    - role: "ae_agent"
      on_steps: ["account_strategy_alignment", "revenue_target_setting", "customer_relationship_context"]
    - role: "sa_agent"
      on_steps: ["technical_alignment", "solution_architecture_review", "capability_gap_analysis"]
    - role: "delivery_agent"
      on_steps: ["delivery_coordination", "resource_planning", "timeline_alignment"]
    - role: "ve_agent"
      on_steps: ["joint_value_proposition", "business_case_alignment"]

  informed:
    - role: "ca_agent"
      notify_on: ["joint_plan_finalized", "customer_facing_commitments_agreed"]
    - role: "leadership_agent"
      notify_on: ["strategic_partner_plan_approved", "resource_commitments_made"]

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_PTR_003"
framework_name: "Joint Account Planning"
framework_source: "Partner Alliance Management & Joint Account Planning Methodology"
playbook_mode: "GENERATIVE"
playbook_category: "pursuit_sales_support"
intended_agent_role: "partner-agent"
secondary_agents: ["AE Agent (account strategy)", "SA Agent (technical alignment)", "Delivery Agent (delivery coordination)", "VE Agent (value proposition)"]

primary_objective: "Structure joint planning sessions between vendor and partner for shared accounts by aligning strategic goals, dividing responsibilities, identifying synergies, establishing dependencies, and producing a joint account plan that both parties commit to execute"

when_not_to_use:
  - "No partner involvement in the account"
  - "Partner relationship is in RED health status (stabilize first via PB_PTR_001)"
  - "Transactional partner engagement with no shared account strategy needed"
  - "Partner is being replaced or offboarded from the account"
  - "Quick dependency check needed (use PB_PTR_002 instead)"

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "new_partner_engagement"
      description: "Partner formally engaged for account, requiring initial joint planning"
      condition: "$.partner.engagement_status == 'new' AND $.partner.engagement_type != 'transactional'"

    - event: "annual_planning_cycle"
      description: "Annual or semi-annual joint planning cycle"
      timing: "Q4 for next year planning, Q2 for mid-year refresh"

    - event: "account_plan_refresh"
      description: "Account plan refresh includes partner-relevant changes"
      condition: "$.account_plan.refreshed == true AND $.account_plan.partner_section_changed == true"

    - event: "significant_account_expansion"
      description: "Major new use case or expansion requiring partner alignment"
      condition: "$.opportunity.partner_involvement_required == true AND $.opportunity.arr >= 100000"

  manual:
    - "Partner Manager requests joint planning session"
    - "AE requests partner alignment before major customer engagement"
    - "Partner requests strategic planning meeting"
    - "New fiscal year planning requires partner re-alignment"

  conditional:
    - condition: "$.partner.last_joint_planning_date > 180 AND $.partner.active_engagement == true"
      description: "More than 6 months since last joint planning session"

    - condition: "$.partner.health_category == 'YELLOW' AND $.partner.alignment_score < 60"
      description: "Partner health yellow with alignment issues, planning session may help"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "{realm}/{node}/internal-infohub/planning/account_plan.md"
      description: "Current account plan with strategic objectives, whitespace, and partner section"
    - artifact: "{realm}/{node}/internal-infohub/partners/partner_engagement.yaml"
      description: "Partner engagement record with scope, capabilities, and contacts"
    - artifact: "{realm}/{node}/internal-infohub/stakeholders/relationship_map.md"
      description: "Stakeholder map showing both vendor and partner contacts"

  optional:
    - artifact: "{realm}/{node}/internal-infohub/partners/health_scorecard_{partner_id}.yaml"
      use: "Most recent partner health assessment for context"
    - artifact: "{realm}/{node}/internal-infohub/partners/dependency_tracker.yaml"
      use: "Existing dependencies to review and update during planning"
    - artifact: "{realm}/{node}/external-infohub/planning/customer_success_plan.md"
      use: "Customer success objectives for joint alignment"
    - artifact: "{realm}/{node}/internal-infohub/opportunity/*.md"
      use: "Active and potential opportunities requiring partner involvement"
    - artifact: "Previous joint account plan"
      use: "Prior plan for continuity and progress review"
    - artifact: "{realm}/{node}/internal-infohub/competitive/*.md"
      use: "Competitive landscape context for joint positioning"
    - artifact: "Partner capability matrix"
      use: "Partner skills, certifications, and delivery capacity"

  minimum_data_threshold:
    - "Account plan exists with defined strategic objectives"
    - "Partner engagement scope and capabilities documented"
    - "At least one vendor and one partner contact identified for planning"

# ==============================================================================
# KEY QUESTIONS
# ==============================================================================
key_questions:
  strategic_alignment:
    - "What are the shared strategic objectives for this account?"
    - "Where do vendor and partner goals align, and where do they diverge?"
    - "What is the joint vision for the customer's success?"
    - "How does this account fit into the broader vendor-partner alliance strategy?"
    - "What are the customer's stated priorities that both parties should address?"

  capability_mapping:
    - "What capabilities does the vendor bring to this account?"
    - "What capabilities does the partner bring?"
    - "Where are there overlapping capabilities, and how do we avoid duplication?"
    - "Where are there gaps that neither party covers?"
    - "Does the partner have the right certifications and skills for the planned work?"

  responsibility_division:
    - "Who owns the customer relationship at the executive level?"
    - "Who leads technical discussions and solution design?"
    - "Who is responsible for implementation and delivery?"
    - "Who handles ongoing support and customer success?"
    - "How do we handle customer-facing activities jointly without confusion?"

  synergy_identification:
    - "What can we achieve together that neither could accomplish alone?"
    - "Are there joint solutions or offerings we should create for this customer?"
    - "Can we create a joint value proposition that is more compelling than individual ones?"
    - "Are there cross-sell or upsell opportunities that benefit both parties?"
    - "Can we share market intelligence or customer insights to mutual benefit?"

  dependency_planning:
    - "What are the dependencies between vendor and partner workstreams?"
    - "Which dependencies are on the critical path for customer deliverables?"
    - "What are the handoff points and how do we ensure quality at each transition?"
    - "What communication cadence ensures dependencies stay on track?"
    - "What contingency plans exist if a dependency is not met?"

  commercial_alignment:
    - "How is revenue shared or allocated between vendor and partner?"
    - "Are there commercial conflicts that need resolution?"
    - "How do we handle pricing for joint solutions?"
    - "What is the deal registration or lead sharing process?"
    - "How do we measure and report joint commercial success?"

# ==============================================================================
# PLANNING SESSION STRUCTURE
# ==============================================================================
planning_session:
  duration: "90-120 minutes"
  format: "Collaborative working session with pre-work distributed in advance"
  cadence: "Semi-annual minimum, more frequently for strategic accounts"

  pre_work:
    vendor_preparation:
      owner: "Partner Agent with AE Agent"
      activities:
        - "Review current account plan and identify partner-relevant objectives"
        - "Compile partner health scorecard and dependency status"
        - "Prepare vendor goals and asks for the planning session"
        - "Identify whitespace opportunities requiring partner capabilities"
        - "Draft preliminary responsibility matrix for discussion"
      distribute: "5 business days before planning session"

    partner_preparation:
      activities:
        - "Review account context and customer objectives shared by vendor"
        - "Prepare partner capabilities relevant to the account"
        - "Identify partner goals and asks for the planning session"
        - "Assess resource availability for committed activities"
      distribute: "3 business days before planning session"

  agenda:
    - section: "Account Context and Customer Priorities"
      duration: "15 min"
      presenter: "AE Agent"
      content: "Customer business context, strategic priorities, success criteria"
      inputs: ["account_plan", "customer_success_plan"]

    - section: "Current Engagement Status"
      duration: "15 min"
      presenter: "Partner Agent"
      content: "Current joint activities, health scorecard review, dependency status"
      inputs: ["health_scorecard", "dependency_tracker"]

    - section: "Strategic Alignment Workshop"
      duration: "20-25 min"
      presenter: "Joint (Vendor + Partner)"
      content: "Align on shared goals, identify divergences, agree on priorities"
      technique: "Map vendor objectives vs. partner objectives, use dot voting to prioritize shared goals"

    - section: "Capability Mapping and Responsibility Division"
      duration: "20-25 min"
      presenter: "SA Agent with partner technical lead"
      content: "Map capabilities to customer needs, divide responsibilities, identify gaps"
      technique: "Build RACI matrix collaboratively for all major workstreams"

    - section: "Dependency Planning and Risk Review"
      duration: "10-15 min"
      presenter: "Partner Agent"
      content: "Establish dependencies, agree on handoff points, set communication cadence"
      inputs: ["dependency_tracker", "delivery_plan"]

    - section: "Joint Action Plan and Commitments"
      duration: "10-15 min"
      presenter: "Joint"
      content: "Agree on action items, owners, deadlines, and review cadence"
      technique: "Every action gets an owner, a deadline, and success criteria from both parties"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - id: "goals_aligned"
      condition: "strategic_alignment_achieved == true AND responsibility_matrix_agreed == true"
      severity: "LOW"
      output_type: "Initiative"
      decision:
        title: "Joint account plan aligned for {partner_name} in {node}"
        context: "Vendor and partner goals aligned, responsibilities divided, dependencies mapped"
        recommendation: "Finalize joint account plan and begin execution"
        actions:
          - "Finalize joint account plan document"
          - "Register all dependencies in dependency tracker (PB_PTR_002)"
          - "Schedule first execution check-in (30 days)"
          - "Share customer-facing plan elements with customer team"
          - "Distribute responsibility matrix to all participating teams"

    - id: "capability_gaps_identified"
      condition: "capability_gaps.count > 0 AND gap_closure_plan_needed == true"
      severity: "MEDIUM"
      output_type: "Initiative + Action Items"
      decision:
        title: "Capability gaps identified in joint coverage of {node}"
        context: "Neither vendor nor partner fully covers {gap_areas}"
        recommendation: "Agree on gap closure approach before finalizing plan"
        actions:
          - "Document each capability gap with impact on customer objectives"
          - "Evaluate options: partner upskilling, additional partner, vendor resources"
          - "Assign gap closure owner and timeline for each gap"
          - "Include gap closure in joint plan as tracked dependencies"
          - "Review gap status at next joint planning check-in"

    - id: "competing_priorities_detected"
      condition: "vendor_partner_goal_conflict == true"
      severity: "MEDIUM"
      output_type: "Decision + Action Items"
      decision:
        title: "Competing priorities between vendor and {partner_name} in {node}"
        context: "Vendor and partner have conflicting objectives in specific areas"
        recommendation: "Negotiate scope boundaries, escalate if unresolved"
        actions:
          - "Document specific conflicts with impact on customer"
          - "Negotiate scope boundaries with clear swim lanes"
          - "Agree on conflict resolution mechanism for future disputes"
          - "Escalate to Partner Manager and partner management if session cannot resolve"
          - "Document agreed boundaries in joint plan"

    - id: "synergies_identified"
      condition: "joint_value_opportunities.count > 0"
      severity: "LOW"
      output_type: "Initiative"
      decision:
        title: "Joint value opportunities identified for {node}"
        context: "Vendor and partner can create additional value through collaboration"
        recommendation: "Develop joint value proposition and present to customer"
        actions:
          - "VE Agent: Develop joint value proposition for identified opportunities"
          - "Create joint solution brief for customer-facing discussions"
          - "Identify pilot or proof of concept for joint offering"
          - "Schedule joint customer presentation for value proposition"
          - "Set revenue and adoption targets for joint initiatives"

    - id: "planning_incomplete_follow_up_needed"
      condition: "open_items.count > 3 OR responsibility_matrix_incomplete == true"
      severity: "MEDIUM"
      output_type: "Action Items"
      decision:
        title: "Joint planning session incomplete, follow-up required for {node}"
        context: "Several items could not be resolved during the planning session"
        recommendation: "Schedule follow-up session within 14 days"
        actions:
          - "Document all open items with assigned owners"
          - "Schedule follow-up session within 14 days"
          - "Distribute preliminary plan with open items marked"
          - "Request specific information needed to close open items"
          - "Set deadline for open item resolution before plan is finalized"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/partners/joint_account_plan_{partner_id}_{YYYY-MM-DD}.yaml"
    format: "yaml"
    sections:
      - executive_summary
      - strategic_alignment
      - capability_map
      - responsibility_matrix
      - joint_initiatives
      - dependency_register
      - communication_plan
      - review_cadence

    schema:
      executive_summary:
        - partner_name: "string"
        - account: "string"
        - planning_date: "date"
        - plan_period: "string (e.g., 'H1 2026')"
        - shared_vision: "string (1-2 sentences)"
        - key_objectives: "array[string]"
        - overall_alignment_status: "enum[STRONG|MODERATE|WEAK]"

      strategic_alignment:
        shared_objectives:
          - objective: "string"
            vendor_contribution: "string"
            partner_contribution: "string"
            customer_value: "string"
            target_date: "date"
            success_metric: "string"
        vendor_only_objectives:
          - objective: "string"
            partner_awareness_needed: "boolean"
        partner_only_objectives:
          - objective: "string"
            vendor_awareness_needed: "boolean"
        resolved_conflicts:
          - area: "string"
            resolution: "string"
            agreed_boundary: "string"

      capability_map:
        vendor_capabilities:
          - capability: "string"
            relevance: "string"
        partner_capabilities:
          - capability: "string"
            relevance: "string"
        overlap_areas:
          - capability: "string"
            lead: "enum[VENDOR|PARTNER]"
            rationale: "string"
        gap_areas:
          - gap: "string"
            impact: "string"
            closure_plan: "string"
            owner: "string"
            target_date: "date"

      responsibility_matrix:
        - activity: "string"
          responsible: "enum[VENDOR|PARTNER|JOINT]"
          accountable: "string"
          consulted: "array[string]"
          informed: "array[string]"
          customer_facing: "boolean"

      joint_initiatives:
        - initiative: "string"
          description: "string"
          vendor_role: "string"
          partner_role: "string"
          target_outcome: "string"
          timeline: "string"
          revenue_potential: "string|null"

      dependency_register:
        - dependency_id: "string"
          title: "string"
          from: "enum[VENDOR|PARTNER]"
          to: "enum[VENDOR|PARTNER]"
          due_date: "date"
          on_critical_path: "boolean"
          acceptance_criteria: "string"

      communication_plan:
        cadence:
          - type: "string (e.g., 'Weekly sync', 'Monthly review')"
            frequency: "string"
            participants: "array[string]"
            format: "string"
        escalation_path:
          - level: "string"
            vendor_contact: "string"
            partner_contact: "string"
            trigger: "string"

      review_cadence:
        - review_type: "string"
          frequency: "string"
          next_date: "date"
          owner: "string"

  secondary_artifacts:
    - path: "{realm}/{node}/external-infohub/partners/joint_plan_summary.md"
      description: "Customer-facing summary of joint vendor-partner plan"
    - path: "{realm}/{node}/internal-infohub/partners/responsibility_matrix_{partner_id}.yaml"
      description: "Detailed RACI matrix for all joint activities"

  action_items:
    path: "{realm}/{node}/internal-infohub/actions/"
    create_for_each: "Agreed action item from joint planning session"

  notifications:
    - recipient: "Partner Manager"
      condition: "always"
      message: "Joint account plan finalized for {partner_name} in {node}. Review and approve commitments."

    - recipient: "AE Agent"
      condition: "always"
      message: "Joint account plan with {partner_name} ready for {node}. Vendor commitments and revenue targets included."

    - recipient: "Delivery Agent"
      condition: "delivery_dependencies.count > 0"
      message: "Joint plan for {node} includes {count} delivery dependencies with {partner_name}. Review timeline alignment."

    - recipient: "SA Agent"
      condition: "technical_alignment_items.count > 0"
      message: "Technical alignment items from joint planning with {partner_name} for {node}. Review solution architecture implications."

    - recipient: "CA Agent"
      condition: "customer_facing_commitments.count > 0"
      message: "Customer-facing commitments agreed in joint plan for {node}. Update customer success plan accordingly."

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "irreconcilable_goal_conflict"
      reason: "Vendor and partner goals fundamentally conflict, no compromise found in session"
      action: "Escalate to Partner Manager and partner executive for strategic resolution"

    - condition: "partner_unwilling_to_commit"
      reason: "Partner declines to make commitments during planning session"
      action: "Partner Manager to assess partner engagement viability and escalate if needed"

    - condition: "resource_commitment_exceeds_authority"
      reason: "Joint plan requires resource commitments beyond planning session authority"
      action: "Escalate to leadership for resource approval before finalizing plan"

  insufficient_data:
    - "No account plan available (cannot plan without strategy)"
    - "Partner capabilities not documented (cannot divide responsibilities)"
    - "No customer objectives defined (cannot align on shared goals)"

  ambiguity_signals:
    - "Partner agrees to commitments but shows hesitation or caveats"
    - "Responsibility matrix has overlapping ownership without clear lead"
    - "Dependencies identified but no agreement on acceptance criteria"

  human_judgment_required:
    - "Negotiating scope boundaries between vendor and partner"
    - "Evaluating whether partner capabilities are sufficient for planned work"
    - "Deciding commercial terms for joint solutions or offerings"
    - "Assessing whether planning outcome justifies continued partner involvement"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Account plan exists with strategic objectives"
    - "Partner engagement record available with capabilities"
    - "Key stakeholders from both sides confirmed for planning session"
    - "Pre-work distributed to partner and vendor teams"

  post_execution:
    - "Joint plan has at least 2 shared objectives with success metrics"
    - "Responsibility matrix covers all major workstreams"
    - "Dependencies registered with owners, deadlines, and acceptance criteria"
    - "Communication cadence and escalation path defined"
    - "Review schedule established with next review date"
    - "All action items have owners and deadlines"

  output_quality:
    - "Shared objectives are specific and measurable, not generic"
    - "Responsibility matrix has no unassigned activities"
    - "Dependencies have realistic timelines based on partner capacity"
    - "Customer-facing plan elements are consistent with internal plan"
    - "Capability gaps have closure plans, not just identification"

# ==============================================================================
# INTEGRATION WITH OTHER PLAYBOOKS
# ==============================================================================
integrates_with:
  - playbook: "PB_PTR_001_partner_engagement_health"
    integration: "Health assessment informs planning session tone and priorities"
    provides: "Partner health context for realistic planning"

  - playbook: "PB_PTR_002_partner_dependency_tracking"
    integration: "Planning session establishes dependencies tracked by PTR_002"
    provides: "New dependency register from joint planning"

  - playbook: "PB_AE_002_account_planning"
    integration: "Account plan provides strategy context for joint planning"
    provides: "Partner section update and joint initiative additions"

  - playbook: "PB_DEL_001_implementation_kickoff"
    integration: "Joint plan informs delivery partner involvement in kickoff"
    provides: "Partner responsibilities and dependencies for implementation"

  - playbook: "PB_VE_001_value_engineering"
    integration: "Joint value proposition may require value engineering"
    provides: "Joint initiative business cases and value models"

  - playbook: "PB_AE_006_meddpicc"
    integration: "Joint opportunities follow MEDDPICC qualification"
    provides: "Partner context for deal qualification"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "60-90 minutes (preparation) + 90-120 minutes (planning session) + 30-45 minutes (plan documentation)"
frequency: "Semi-annual minimum + triggered by new engagements or significant changes"
human_review_required: true
approval_workflow:
  - reviewer: "Partner Manager"
    approval_gate: "Approve vendor commitments and resource allocation in joint plan"
  - reviewer: "Account Executive"
    approval_gate: "Validate alignment with account strategy and revenue targets"
  - reviewer: "Partner Management (partner side)"
    condition: "always"
    approval_gate: "Partner approves their commitments in the joint plan"

last_updated: "2026-02-27"
version: "1.0"
status: "production_ready"
notes: "Generative playbook for structured joint planning with partners. Produces joint account plan that both parties commit to execute. Complements PB_PTR_001 (health) and PB_PTR_002 (dependencies)."
