# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (MEDDPICC, Five Whys, SWOT,
# etc.) are industry-standard methodologies cited for
# educational context.

# PLAYBOOK: Customer Enablement & Knowledge Transfer
# Documentation handoff, training material development, acceptance validation

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_PS_003"
framework_name: "Customer Enablement & Knowledge Transfer"
framework_source: "ITIL Knowledge Management / Professional Services Handoff Best Practices"
intended_agent_role: "ps-agent"
secondary_agents: ["CA Agent", "SA Agent", "Delivery Agent"]
playbook_mode: "GENERATIVE"
playbook_category: "customer_enablement"

primary_objective: "Ensure complete knowledge transfer from the PS engagement team to the customer through structured documentation handoff, training material development, and validated acceptance of transferred knowledge"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Knowledge transfer planning, internal checklists, and readiness assessments are vendor-internal process artifacts. The delivered training materials and documentation go to Customer InfoHub."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "All customer-facing deliverables: solution documentation, runbooks, training materials, and architecture guides"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized knowledge transfer templates, common training patterns, and acceptance criteria benchmarks (quarterly)"

flow_bindings:
  description: "Maps knowledge transfer phases to the agent flows that execute them"
  bindings:
    - phase: "Knowledge Transfer Planning"
      agent: ps-knowledge-transfer-agent
      flow: knowledge-transfer
      context: "Identify knowledge domains, assess customer team readiness, define transfer scope and acceptance criteria"
    - phase: "Documentation Development"
      agent: ps-knowledge-transfer-agent
      flow: knowledge-transfer
      context: "Create solution documentation, operational runbooks, architecture decision records, and configuration guides"
    - phase: "Training Material Development"
      agent: ps-knowledge-transfer-agent
      flow: knowledge-transfer
      context: "Develop role-specific training materials, hands-on exercises, and reference guides for customer teams"
    - phase: "Acceptance Validation"
      agent: ps-knowledge-transfer-agent
      flow: knowledge-transfer
      context: "Validate customer can independently operate the solution through acceptance criteria testing and sign-off"

when_not_to_use:
  - "Engagement still in active delivery phase (milestones incomplete)"
  - "Customer has contracted ongoing managed services (no handoff needed)"
  - "POC engagement with no production deployment"
  - "Customer explicitly waives knowledge transfer (document the waiver)"
  - "Solution decommissioned before knowledge transfer phase"

raci:
  responsible:
    role: "PS Agent"
    agent: "ps_agent"
    description: "Plans and executes knowledge transfer, develops documentation and training materials, validates customer acceptance"

  accountable:
    role: "PS Manager"
    human_required: true
    description: "Approves knowledge transfer plan, validates completeness, signs off on engagement closure"
    approval_actions:
      - "approve"
      - "request_revision"
      - "extend_engagement"
      - "escalate"

  consulted:
    - role: "CA Agent"
      on_steps: ["customer_readiness_assessment", "ongoing_support_handoff", "adoption_planning"]
    - role: "SA Agent"
      on_steps: ["architecture_documentation_review", "technical_accuracy_validation"]

  informed:
    - role: "CA Agent"
      notify_on: ["knowledge_transfer_complete", "handoff_to_support"]
    - role: "AE Agent"
      notify_on: ["engagement_closure", "knowledge_transfer_not_accepted"]
    - role: "PS Manager"
      notify_on: ["knowledge_transfer_not_accepted", "acceptance_criteria_failed"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Final delivery milestone marked complete (PB_PS_002 output)"
    - "Engagement timeline entering last 20% of planned duration"
    - "Customer UAT sign-off received"
    - "Go-live date confirmed and within 2 weeks"

  manual:
    - "PS Manager initiates knowledge transfer: '/ps handoff {engagement}'"
    - "Customer requests documentation and training package"
    - "CA Agent requests handoff preparation for ongoing support transition"

  conditional:
    - "IF final_milestone_complete AND knowledge_transfer_not_started THEN trigger"
    - "IF engagement_end_date - today <= 10_business_days AND kt_plan_not_created THEN trigger"
    - "IF customer_requests_early_handoff THEN trigger"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Delivery plan with completed milestones (PB_PS_002 output)"
    - artifact: "Solution architecture documentation (from SA Agent or PS implementation)"
    - artifact: "Customer team roster (roles who will own the solution post-handoff)"
    - artifact: "SOW acceptance criteria for knowledge transfer"

  optional:
    - artifact: "Customer's existing documentation standards"
      use: "Aligns delivered documentation with customer format preferences"
    - artifact: "Customer's internal training platform or LMS details"
      use: "Formats training materials for customer's delivery platform"
    - artifact: "Support case history from implementation phase"
      use: "Identifies common issues to address proactively in documentation"
    - artifact: "Customer's operational runbook templates"
      use: "Matches documentation to customer's operational processes"

  minimum_data_threshold:
    - "Solution deployed and operational in target environment"
    - "Customer team identified for knowledge transfer"
    - "At least one knowledge domain defined for transfer"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  transfer_scope:
    - "What knowledge domains need to be transferred (operations, administration, troubleshooting, development)?"
    - "Which customer roles will own each domain post-handoff?"
    - "What is the customer's current competency level in each domain?"
    - "Are there compliance or audit requirements for documentation?"

  documentation:
    - "What documentation deliverables are specified in the SOW?"
    - "Does the customer have documentation standards or templates to follow?"
    - "What operational runbooks are needed for day-to-day operations?"
    - "Are architecture decision records needed for future change management?"
    - "What configuration and environment details must be documented?"

  training:
    - "What training format does the customer prefer (live workshop, recorded sessions, self-paced)?"
    - "How many people need training and in which roles?"
    - "Does the customer need train-the-trainer capability for future hires?"
    - "What hands-on exercises or labs should be included?"
    - "Is there a sandbox environment available for training?"

  acceptance:
    - "What are the acceptance criteria for knowledge transfer completion?"
    - "How will customer competency be validated (practical exercise, walkthrough, assessment)?"
    - "Who has authority to sign off on knowledge transfer acceptance?"
    - "What is the support transition plan after knowledge transfer?"
    - "Is there a warranty or support period after handoff?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "customer_ready AND all_domains_covered AND acceptance_criteria_defined"
      output_type: "Knowledge Transfer Plan"
      decision: |
        CREATE Plan:
          title: "Knowledge transfer plan for {node}"
          domains: "{identified_knowledge_domains}"
          approach: "Structured transfer with documentation, training, and acceptance validation"
          actions:
            - "Develop documentation package per SOW requirements"
            - "Create role-specific training materials"
            - "Schedule training sessions with customer teams"
            - "Define acceptance validation exercises"
            - "Plan support transition with CA Agent"

    - condition: "customer_team_not_identified OR competency_gaps_significant"
      output_type: "Risk + Initiative"
      decision: |
        FLAG Risk:
          title: "Knowledge transfer readiness gap for {node}"
          severity: "MEDIUM"
          category: "delivery"
          description: "Customer team not fully identified or significant competency gaps require extended transfer period"

        CREATE Initiative:
          title: "Customer readiness preparation for {node}"
          actions:
            - "Work with customer sponsor to confirm team assignments"
            - "Assess individual competency levels and create targeted learning paths"
            - "Propose extended training schedule if gaps are significant"
            - "Identify prerequisite skills customer team needs before transfer sessions"

    - condition: "acceptance_criteria_failed"
      output_type: "Escalation"
      decision: |
        ESCALATE:
          title: "Knowledge transfer acceptance failed for {node}"
          severity: "HIGH"
          route_to: ["PS Manager"]
          timeline: "48 hours"
          reason: "Customer team did not meet acceptance criteria for independent operation"
          actions:
            - "Document specific acceptance criteria that were not met"
            - "Identify root causes (insufficient training time, wrong audience, complexity)"
            - "Propose remediation plan (additional sessions, mentoring period, documentation updates)"
            - "Assess whether engagement extension is needed"

    - condition: "knowledge_transfer_not_accepted AND remediation_attempted"
      output_type: "Escalation"
      decision: |
        ESCALATE:
          title: "Knowledge transfer not accepted after remediation for {node}"
          severity: "CRITICAL"
          route_to: ["PS Manager", "AE Agent"]
          timeline: "immediate"
          reason: "Customer has not accepted knowledge transfer after remediation, engagement closure blocked"
          actions:
            - "Schedule executive review with customer sponsor"
            - "Document all transfer activities completed and outcomes"
            - "Propose resolution options (managed services, extended engagement, partial acceptance)"
            - "Assess contractual implications for delayed closure"

    - condition: "all_acceptance_criteria_met AND customer_signed_off"
      output_type: "Decision + Handoff"
      decision: |
        CLOSE Knowledge Transfer:
          title: "Knowledge transfer complete for {node}"
          status: "Accepted"
          actions:
            - "Archive all documentation in Customer InfoHub"
            - "Confirm support transition plan with CA Agent"
            - "Generate engagement closure report"
            - "Collect customer feedback on PS engagement"
            - "Update Global Knowledge Vault with anonymized patterns"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/professional_services/knowledge_transfer_plan_{engagement}.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - transfer_plan_overview
      - documentation_inventory
      - training_plan
      - acceptance_validation
      - handoff_checklist

    schema:
      transfer_plan_overview:
        engagement_id: "string"
        customer: "string"
        transfer_start_date: "date"
        target_completion_date: "date"
        knowledge_domains: "array[{domain, owner_role, priority}]"
        overall_status: "enum[PLANNING|IN_PROGRESS|VALIDATION|COMPLETE|BLOCKED]"

      documentation_inventory:
        documents:
          - document_id: "string"
            title: "string"
            type: "enum[ARCHITECTURE|RUNBOOK|CONFIGURATION|ADR|USER_GUIDE|API_REFERENCE]"
            status: "enum[DRAFT|REVIEW|APPROVED|DELIVERED]"
            audience: "string"
            reviewer: "string"

      training_plan:
        sessions:
          - session_id: "string"
            title: "string"
            target_audience: "string"
            format: "enum[WORKSHOP|WALKTHROUGH|HANDS_ON_LAB|RECORDED|SELF_PACED]"
            duration: "string"
            date_scheduled: "date"
            status: "enum[PLANNED|DELIVERED|RESCHEDULED]"
            materials: "array[string]"
        train_the_trainer: "boolean"

      acceptance_validation:
        criteria:
          - criterion_id: "string"
            description: "string"
            validation_method: "enum[PRACTICAL_EXERCISE|WALKTHROUGH|ASSESSMENT|OBSERVATION]"
            status: "enum[NOT_TESTED|PASSED|FAILED|WAIVED]"
            validated_by: "string"
            validated_date: "date"
        overall_result: "enum[ACCEPTED|NOT_ACCEPTED|PARTIAL]"
        sign_off_authority: "string"
        sign_off_date: "date"

      handoff_checklist:
        items:
          - item: "string"
            category: "enum[DOCUMENTATION|ACCESS|SUPPORT|MONITORING|ESCALATION]"
            status: "enum[PENDING|COMPLETE]"
            notes: "string"

  documentation_package:
    path: "{realm}/{node}/external-infohub/professional_services/documentation/"
    vault_type: "customer"
    format: "markdown"
    deliverables:
      - "solution_architecture.md"
      - "operational_runbook.md"
      - "configuration_guide.md"
      - "troubleshooting_guide.md"
      - "architecture_decisions.md"
    create_if: "documentation deliverables specified in SOW"

  training_materials:
    path: "{realm}/{node}/external-infohub/professional_services/training/"
    vault_type: "customer"
    format: "markdown"
    deliverables:
      - "training_guide_{role}.md"
      - "hands_on_exercises.md"
      - "quick_reference_card.md"
    create_if: "training deliverables specified in SOW or knowledge transfer plan"

  notifications:
    - recipient: "CA Agent"
      condition: "knowledge_transfer_complete"
      message: "Knowledge transfer complete for {node}, support transition ready"
    - recipient: "PS Manager"
      condition: "knowledge_transfer_not_accepted"
      message: "Knowledge transfer not accepted for {node}, remediation required within 48 hours"
    - recipient: "AE Agent"
      condition: "engagement_closure"
      message: "PS engagement closing for {node}, knowledge transfer {status}"
    - recipient: "Customer Project Sponsor"
      condition: "acceptance_validation_scheduled"
      message: "Knowledge transfer validation scheduled for {node}, sign-off authority required"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "knowledge_transfer_not_accepted"
      reason: "Customer team did not pass acceptance validation"
      action: "Escalate to PS Manager within 48 hours for remediation planning"

    - condition: "customer_team_unavailable"
      reason: "Customer team members not available for scheduled training sessions"
      action: "Escalate to customer project sponsor to resolve scheduling"

    - condition: "documentation_rejected"
      reason: "Customer rejects documentation as insufficient or inaccurate"
      action: "PS Manager to review feedback and assign documentation revision"

    - condition: "no_sign_off_authority"
      reason: "No customer stakeholder with authority to accept knowledge transfer"
      action: "Escalate to AE to identify and engage appropriate customer authority"

    - condition: "customer_delivery_escalation"
      reason: "Customer escalates dissatisfaction with knowledge transfer quality"
      action: "Escalate to PS Manager + CA for joint customer response"

  insufficient_data:
    - "No customer team roster for knowledge transfer"
    - "Solution documentation not created during implementation"
    - "Acceptance criteria not defined in SOW"
    - "No training schedule agreed with customer"

  ambiguity_signals:
    - "Customer says 'we will figure it out' when asked about training needs"
    - "No clear owner on customer side for post-handoff operations"
    - "Customer requests 'all documentation' without specifying what they need"
    - "Acceptance criteria defined as 'customer is comfortable' without measurable standard"

  human_judgment_required:
    - "Deciding depth of documentation for complex custom implementations"
    - "Assessing whether customer team is truly ready or just saying they are"
    - "Determining if partial acceptance is sufficient for engagement closure"
    - "Balancing documentation completeness against engagement timeline pressure"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Implementation milestones complete (PB_PS_002 output)"
    - "Solution deployed and operational in target environment"
    - "Customer team identified for knowledge transfer"
    - "SOW acceptance criteria for knowledge transfer documented"

  post_execution:
    - "All SOW-required documentation delivered and reviewed"
    - "Training sessions delivered to identified customer roles"
    - "Acceptance criteria validated and results documented"
    - "Handoff checklist completed (access, monitoring, escalation paths)"
    - "CA Agent notified for support transition"

  output_quality:
    - "Documentation accurate against deployed solution (not outdated or generic)"
    - "Training materials include hands-on exercises with expected outcomes"
    - "Acceptance validation uses measurable criteria, not subjective assessment"
    - "No vendor-internal information in customer-facing documentation"
    - "Troubleshooting guide covers issues encountered during implementation"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "20-40 minutes (planning) + 2-5 days (documentation and training development)"
frequency: "Once per engagement, during handoff phase"
human_review_required: true
approval_workflow:
  - reviewer: "PS Agent"
    approval_gate: "Knowledge transfer plan complete with documentation, training, and acceptance criteria"
  - reviewer: "SA Agent"
    condition: "architecture_documentation_included == true"
    approval_gate: "Technical accuracy of architecture documentation validated"
  - reviewer: "PS Manager"
    condition: "always"
    approval_gate: "Knowledge transfer plan approved for execution"
  - reviewer: "Customer Project Sponsor"
    condition: "acceptance_validation_complete"
    approval_gate: "Customer accepts knowledge transfer and signs off on handoff"

