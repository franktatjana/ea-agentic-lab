# PLAYBOOK: Pre-Sales Engagement Scoping & SOW Validation
# SOW validation, effort estimation, risk flags, pre-sales scoping

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_PS_001"
framework_name: "Pre-Sales Engagement Scoping & SOW Validation"
framework_source: "Professional Services Engagement Management / PMI Pre-Sales Best Practices"
intended_agent_role: "ps-agent"
secondary_agents: ["SA Agent", "AE Agent", "Delivery Agent"]
playbook_mode: "ASSESSMENT"
playbook_category: "pursuit_sales_support"

primary_objective: "Assess service requirements, estimate effort and resource needs, identify delivery risk flags, and validate SOW commitments against delivery reality before deal closure"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Pre-sales scoping artifacts contain effort estimates, margin assumptions, resource costs, and risk assessments that are vendor-internal commercial data. Never shared with customers in raw form."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Sanitized SOW summary and high-level project timeline shared with customer for alignment"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized scoping benchmarks and estimation accuracy patterns (quarterly aggregation)"

flow_bindings:
  description: "Maps scoping phases to the agent flows that execute them"
  bindings:
    - phase: "Service Requirements Assessment"
      agent: ps-scoping-agent
      flow: presales-scoping
      context: "Gather technical requirements, customer environment details, and integration complexity to determine service scope"
    - phase: "Effort Estimation & Resource Planning"
      agent: ps-scoping-agent
      flow: presales-scoping
      context: "Estimate effort in person-days, identify required skill profiles, and map resource availability"
    - phase: "SOW Validation"
      agent: ps-scoping-agent
      flow: presales-scoping
      context: "Cross-check SOW commitments against estimated effort, flag undeliverable clauses, validate acceptance criteria"
    - phase: "Risk Flag Assessment"
      agent: ps-scoping-agent
      flow: presales-scoping
      context: "Identify delivery risks including timeline pressure, skill gaps, customer readiness, and scope ambiguity"

when_not_to_use:
  - "Post-sale engagement already in delivery phase (use PB_PS_002 instead)"
  - "Pure product-only deal with no services component"
  - "Customer explicitly declined professional services"
  - "Renewal with no change in services scope"
  - "Deal value below professional services engagement threshold"

raci:
  responsible:
    role: "PS Agent"
    agent: "ps_agent"
    description: "Assesses service requirements, estimates effort, validates SOW commitments, and flags delivery risks"

  accountable:
    role: "PS Manager"
    human_required: true
    description: "Approves effort estimates, margin targets, resource commitments, and SOW sign-off"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"
      - "reject_sow"

  consulted:
    - role: "SA Agent"
      on_steps: ["technical_complexity_assessment", "architecture_requirements", "integration_effort"]
    - role: "AE Agent"
      on_steps: ["deal_context", "customer_expectations", "pricing_alignment", "timeline_constraints"]

  informed:
    - role: "AE Agent"
      notify_on: ["scoping_complete", "sow_risk_flags", "sow_undeliverable"]
    - role: "PS Manager"
      notify_on: ["sow_undeliverable", "high_risk_engagement"]
    - role: "Delivery Agent"
      notify_on: ["scoping_complete"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Professional services component added to opportunity"
    - "SOW draft submitted for validation"
    - "Deal stage advanced to proposal with services line items"
    - "Customer requests custom implementation or integration services"
    - "Deal value exceeds threshold requiring PS scoping review"

  manual:
    - "AE requests PS scoping: '/ps scope {opportunity}'"
    - "SA identifies services need during technical discovery"
    - "PS Manager requests re-scoping due to changed requirements"

  conditional:
    - "IF services_line_items_present AND no_scoping_assessment THEN trigger"
    - "IF sow_draft_submitted AND validation_not_complete THEN trigger"
    - "IF technical_complexity == HIGH AND custom_integration_required THEN trigger"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Opportunity details (ARR, services revenue, timeline, products)"
    - artifact: "Customer environment description (current stack, integrations, scale)"
    - artifact: "SOW draft or services scope description"
    - artifact: "Technical discovery findings (from SA Agent)"

  optional:
    - artifact: "Customer's internal project timeline and constraints"
      use: "Validates proposed timeline feasibility"
    - artifact: "Similar engagement history (past PS projects)"
      use: "Calibrates effort estimates against actuals"
    - artifact: "Customer team availability and technical readiness"
      use: "Assesses co-delivery capacity and dependency risks"
    - artifact: "Competitive landscape"
      use: "Informs urgency and differentiation through services"

  minimum_data_threshold:
    - "Services scope described with at least use cases and integration points"
    - "Customer environment baseline available (scale, complexity tier)"
    - "Target go-live date or timeline expectation stated"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  scope_definition:
    - "What specific services are being requested (implementation, migration, integration, custom development)?"
    - "What are the deliverables the customer expects at project completion?"
    - "Are there acceptance criteria defined for each deliverable?"
    - "What is the customer's definition of 'done' for this engagement?"

  effort_estimation:
    - "What is the technical complexity of the customer's environment (number of integrations, data volume, custom requirements)?"
    - "How many person-days are estimated for each workstream?"
    - "What skill profiles are required (platform engineer, data architect, integration specialist)?"
    - "Are there dependencies on customer resources or third-party vendors?"

  risk_assessment:
    - "Is the proposed timeline realistic given the scope and resource availability?"
    - "Are there unvalidated assumptions in the SOW that could expand scope?"
    - "Does the customer have the technical readiness to participate in co-delivery?"
    - "Are there contractual commitments that exceed standard delivery capability?"
    - "What is the customer's change management maturity?"

  commercial_alignment:
    - "Does the effort estimate support the target margin for this engagement?"
    - "Are there fixed-price commitments that create delivery risk?"
    - "Is the pricing aligned with the level of customization required?"
    - "Are there penalty clauses or SLAs that create exposure?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "sow_aligned AND effort_within_margin AND risk_level == LOW"
      output_type: "Decision + Recommendation"
      decision: |
        APPROVE Scoping:
          title: "SOW validated for {node}"
          assessment: "SOW commitments align with delivery capability and effort estimates"
          recommendation: "Proceed to deal closure with services component"
          actions:
            - "Finalize resource allocation plan"
            - "Prepare kickoff materials"
            - "Notify Delivery Agent of upcoming engagement"

    - condition: "sow_has_risk_flags AND risk_level == MEDIUM"
      output_type: "Risk + Initiative"
      decision: |
        FLAG Risk:
          title: "SOW risk flags identified for {node}"
          severity: "MEDIUM"
          category: "delivery"
          description: "SOW contains clauses or assumptions that require clarification before commitment"

        CREATE Initiative:
          title: "SOW risk mitigation for {node}"
          actions:
            - "Document specific risk flags with proposed mitigations"
            - "Propose SOW amendments to AE for customer negotiation"
            - "Add contingency buffer to effort estimate"
            - "Define scope boundaries explicitly in SOW language"

    - condition: "sow_undeliverable OR scope_exceeds_capability"
      output_type: "Escalation"
      decision: |
        ESCALATE:
          title: "SOW undeliverable for {node}"
          severity: "HIGH"
          route_to: ["PS Manager", "AE Agent"]
          reason: "SOW commitments exceed delivery capability or contain undeliverable clauses"
          actions:
            - "Document specific undeliverable items with rationale"
            - "Propose alternative scope that is deliverable"
            - "Estimate effort and cost for the deliverable alternative"
            - "Block deal closure until SOW amended"

    - condition: "effort_estimate_exceeds_margin_target"
      output_type: "Risk + Decision"
      decision: |
        FLAG Risk:
          title: "Margin risk on services engagement for {node}"
          severity: "MEDIUM"
          category: "commercial"

        CREATE Decision:
          title: "Margin remediation required for {node}"
          options:
            - "Reduce scope to fit margin target"
            - "Increase services pricing"
            - "Shift to co-delivery model (customer provides resources)"
            - "Accept reduced margin with PS Manager approval"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/professional_services/scoping_assessment_{opportunity}.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - scoping_summary
      - effort_estimate
      - resource_plan
      - risk_assessment
      - sow_validation

    schema:
      scoping_summary:
        engagement_type: "string"
        scope_description: "string"
        deliverables: "array[string]"
        timeline_proposed: "string"
        timeline_feasible: "boolean"
        complexity_tier: "enum[LOW|MEDIUM|HIGH|VERY_HIGH]"

      effort_estimate:
        total_person_days: "number"
        workstreams:
          - name: "string"
            person_days: "number"
            skill_profile: "string"
        contingency_percentage: "number"
        confidence_level: "enum[LOW|MEDIUM|HIGH]"

      resource_plan:
        required_roles: "array[{role, count, duration}]"
        customer_dependencies: "array[string]"
        third_party_dependencies: "array[string]"

      risk_assessment:
        overall_risk_level: "enum[LOW|MEDIUM|HIGH|CRITICAL]"
        risk_flags: "array[{flag, severity, mitigation}]"
        assumptions: "array[string]"

      sow_validation:
        status: "enum[VALIDATED|FLAGGED|UNDELIVERABLE]"
        flagged_clauses: "array[{clause, issue, recommendation}]"
        acceptance_criteria_defined: "boolean"
        scope_boundaries_clear: "boolean"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "PS scoping assessment complete for {node}: {sow_validation_status}"
    - recipient: "PS Manager"
      condition: "sow_undeliverable OR risk_level == HIGH"
      message: "SOW undeliverable or high-risk engagement flagged for {node}, review required"
    - recipient: "Delivery Agent"
      condition: "sow_validated"
      message: "PS scoping complete for {node}, engagement ready for delivery planning"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "sow_undeliverable"
      reason: "SOW contains commitments that cannot be met with available resources or capability"
      action: "Escalate to PS Manager + AE, block deal closure until SOW amended"

    - condition: "scope_change_exceeds_20_percent"
      reason: "Scope change from original estimate exceeds 20% threshold"
      action: "Escalate to PS Manager + AE within 24 hours for re-scoping approval"

    - condition: "no_technical_discovery"
      reason: "Cannot estimate effort without understanding customer environment"
      action: "SA Agent must complete technical discovery before PS scoping"

    - condition: "fixed_price_with_ambiguous_scope"
      reason: "Fixed-price commitment with unclear scope creates unbounded delivery risk"
      action: "PS Manager to review and approve or require scope clarification"

  insufficient_data:
    - "No services scope description"
    - "No customer environment details"
    - "No timeline expectation"
    - "No technical discovery findings"

  ambiguity_signals:
    - "Customer says 'we need everything implemented' without specifics"
    - "SOW uses vague deliverable language ('optimize performance', 'ensure best practices')"
    - "Multiple conflicting timelines from different stakeholders"
    - "Acceptance criteria described as 'to customer satisfaction'"

  human_judgment_required:
    - "Balancing margin target against strategic account importance"
    - "Deciding between fixed-price and time-and-materials engagement model"
    - "Assessing customer's true technical readiness vs. stated readiness"
    - "Determining appropriate contingency buffer for novel engagement types"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Opportunity contains services line items"
    - "Technical discovery findings available from SA Agent"
    - "SOW draft or scope description provided"

  post_execution:
    - "Effort estimate includes all identified workstreams"
    - "Risk flags documented with severity and mitigation"
    - "SOW validation status assigned (validated, flagged, undeliverable)"
    - "Resource requirements specified with skill profiles"
    - "Timeline feasibility assessed against proposed go-live"

  output_quality:
    - "Effort estimates grounded in comparable engagement data or detailed task breakdown"
    - "No placeholder values in person-day estimates"
    - "Risk flags are specific and actionable, not generic"
    - "SOW flagged clauses include specific language references"
    - "Assumptions explicitly documented and numbered"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "10-20 minutes (agent) + 30-60 minutes (human review)"
frequency: "Per new services opportunity or SOW revision"
human_review_required: true
approval_workflow:
  - reviewer: "PS Agent"
    approval_gate: "Scoping assessment complete with effort estimate and risk flags"
  - reviewer: "PS Manager"
    condition: "always"
    approval_gate: "Effort estimate, margin, and SOW validation approved"
  - reviewer: "AE Agent"
    condition: "sow_amendments_proposed == true"
    approval_gate: "SOW amendments reviewed and customer negotiation planned"

