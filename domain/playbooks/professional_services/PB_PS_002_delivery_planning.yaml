# PLAYBOOK: Project Delivery Planning & Milestone Management
# Resource allocation, milestone definition, timeline management, scope change control

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_PS_002"
framework_name: "Project Delivery Planning & Milestone Management"
framework_source: "PMI PMBOK / Professional Services Delivery Management"
intended_agent_role: "ps-agent"
secondary_agents: ["SA Agent", "CA Agent", "Delivery Agent"]
playbook_mode: "OPERATIONAL"
playbook_category: "delivery_execution"

primary_objective: "Plan and manage project delivery through resource allocation, milestone definition, timeline management, weekly status tracking, and scope change control with a 20% threshold for escalation"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Delivery plans contain resource assignments, cost allocations, internal risk assessments, and margin tracking that are vendor-internal operational data."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Customer-facing project plan with milestones, timeline, and status updates"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized delivery benchmarks, milestone achievement rates, and scope change patterns (quarterly)"

flow_bindings:
  description: "Maps delivery planning phases to the agent flows that execute them"
  bindings:
    - phase: "Project Kickoff Preparation"
      agent: ps-delivery-planning-agent
      flow: project-execution
      context: "Translate scoping assessment into actionable project plan with milestones, resource assignments, and kickoff agenda"
    - phase: "Resource Allocation & Scheduling"
      agent: ps-delivery-planning-agent
      flow: project-execution
      context: "Assign resources to workstreams, validate availability, resolve scheduling conflicts"
    - phase: "Progress Tracking & Status Reporting"
      agent: ps-delivery-planning-agent
      flow: project-execution
      context: "Track milestone completion, generate weekly status updates, flag delivery risks"
    - phase: "Scope Change Management"
      agent: ps-delivery-planning-agent
      flow: scope-management
      context: "Process change requests, assess effort impact, enforce 20% scope change threshold for escalation"

when_not_to_use:
  - "Pre-sales phase (use PB_PS_001 for scoping instead)"
  - "Engagement completed and in post-delivery review phase"
  - "Internal-only project with no customer deliverables"
  - "Engagement paused or on hold pending customer decision"

raci:
  responsible:
    role: "PS Agent"
    agent: "ps_agent"
    description: "Creates delivery plan, allocates resources, tracks progress, manages scope changes, and produces weekly status updates"

  accountable:
    role: "PS Manager"
    human_required: true
    description: "Approves resource commitments, milestone definitions, and scope change requests exceeding threshold"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"
      - "pause_engagement"

  consulted:
    - role: "SA Agent"
      on_steps: ["technical_milestone_definition", "architecture_review_gates", "integration_dependencies"]
    - role: "CA Agent"
      on_steps: ["customer_readiness_validation", "handoff_planning", "adoption_milestones"]

  informed:
    - role: "AE Agent"
      notify_on: ["scope_change_request", "milestone_at_risk", "delivery_escalation"]
    - role: "PS Manager"
      notify_on: ["scope_change_exceeds_threshold", "critical_milestone_missed", "resource_conflict"]
    - role: "CA Agent"
      notify_on: ["delivery_complete", "handoff_scheduled"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "SOW signed and PS scoping assessment approved (PB_PS_001 output)"
    - "Project kickoff date within 10 business days"
    - "Weekly status update cycle (every Monday for active engagements)"
    - "Change request submitted by customer or internal team"
    - "Milestone due date approaching (5 business days warning)"

  manual:
    - "PS Manager requests delivery plan: '/ps plan {engagement}'"
    - "AE escalates delivery concern: '/ps status {engagement}'"
    - "Customer submits change request through engagement channel"

  conditional:
    - "IF sow_signed AND kickoff_not_scheduled THEN trigger kickoff_prep"
    - "IF milestone_due_date - today <= 5_days AND milestone_status != COMPLETE THEN trigger risk_alert"
    - "IF change_request_submitted THEN trigger scope_change_assessment"
    - "IF cumulative_scope_change > 20% THEN trigger escalation"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "PS scoping assessment (PB_PS_001 output)"
    - artifact: "Signed SOW with deliverables and timeline"
    - artifact: "Resource availability (PS team capacity)"
    - artifact: "Customer stakeholder contacts and roles"

  optional:
    - artifact: "Customer's internal project plan and dependencies"
      use: "Aligns vendor milestones with customer milestones"
    - artifact: "Previous engagement history with this customer"
      use: "Calibrates communication style and risk factors"
    - artifact: "Third-party vendor schedules"
      use: "Identifies external dependencies and integration windows"
    - artifact: "Customer's change management process"
      use: "Aligns scope change handling with customer governance"

  minimum_data_threshold:
    - "SOW deliverables list with acceptance criteria"
    - "Target go-live date and key milestone dates"
    - "At least one named PS resource assigned"
    - "Customer project sponsor identified"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  kickoff_preparation:
    - "Who are the key stakeholders on both sides (vendor and customer)?"
    - "What are the communication cadences (weekly status calls, steering committee)?"
    - "What tools and access does the PS team need from the customer?"
    - "Are there environment prerequisites that must be met before work begins?"

  milestone_planning:
    - "What are the logical phases of this engagement (discovery, build, test, deploy, handoff)?"
    - "What are the acceptance criteria for each milestone?"
    - "Which milestones have hard date dependencies (customer events, compliance deadlines)?"
    - "What is the critical path through the project?"

  resource_management:
    - "Which PS resources are assigned and for what duration?"
    - "Are there skill gaps that require specialist involvement?"
    - "What is the customer's resource commitment (co-delivery, testing, UAT)?"
    - "Are there resource conflicts with other active engagements?"

  scope_change_control:
    - "What is the baseline scope against which changes are measured?"
    - "What is the approval process for scope changes (customer and vendor side)?"
    - "At what threshold does a scope change require commercial renegotiation?"
    - "How are out-of-scope requests documented and communicated?"

  progress_tracking:
    - "What percentage of milestones are on track, at risk, or delayed?"
    - "Are there blockers that require escalation?"
    - "What is the burn rate against the estimated effort?"
    - "Are customer dependencies being met on schedule?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "all_milestones_on_track AND no_blockers AND burn_rate_within_budget"
      output_type: "Status Update"
      decision: |
        REPORT Status:
          title: "Weekly status for {node}: On Track"
          summary: "All milestones progressing as planned"
          actions:
            - "Generate weekly status report"
            - "Update milestone tracker"
            - "Confirm next week's priorities with customer"

    - condition: "milestone_at_risk OR blocker_identified"
      output_type: "Risk + Initiative"
      decision: |
        FLAG Risk:
          title: "Milestone at risk for {node}"
          severity: "MEDIUM"
          category: "delivery"
          description: "Milestone {milestone_name} at risk due to {reason}"

        CREATE Initiative:
          title: "Milestone recovery plan for {node}"
          actions:
            - "Identify root cause of delay or blocker"
            - "Propose recovery actions (additional resources, scope adjustment, timeline extension)"
            - "Communicate risk to customer project sponsor"
            - "Update project plan with revised dates"

    - condition: "change_request_submitted AND scope_impact <= 20%"
      output_type: "Decision"
      decision: |
        ASSESS Change Request:
          title: "Scope change request for {node}"
          impact_assessment:
            effort_delta: "{additional_person_days} person-days"
            timeline_impact: "{days_extension} days"
            cost_impact: "{cost_delta}"
          recommendation: "Process within current engagement parameters"
          actions:
            - "Document change request with effort and timeline impact"
            - "Update project plan and milestone dates"
            - "Obtain customer sign-off on revised scope"

    - condition: "cumulative_scope_change > 20%"
      output_type: "Escalation"
      decision: |
        ESCALATE:
          title: "Scope change exceeds 20% threshold for {node}"
          severity: "HIGH"
          route_to: ["PS Manager", "AE Agent"]
          timeline: "24 hours"
          reason: "Cumulative scope changes exceed 20% of original SOW, requiring commercial renegotiation"
          actions:
            - "Document cumulative scope changes with effort impact"
            - "Prepare revised SOW amendment proposal"
            - "Calculate additional services revenue required"
            - "Pause non-critical new scope items until approval"

    - condition: "critical_milestone_missed AND no_recovery_plan"
      output_type: "Escalation"
      decision: |
        ESCALATE:
          title: "Critical milestone missed for {node}"
          severity: "CRITICAL"
          route_to: ["PS Manager"]
          timeline: "immediate"
          reason: "Critical milestone missed without recovery plan, customer delivery at risk"
          actions:
            - "Conduct root cause analysis"
            - "Develop recovery plan with revised timeline"
            - "Schedule emergency steering committee with customer"
            - "Assess contractual implications (SLAs, penalties)"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/professional_services/delivery_plan_{engagement}.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - project_overview
      - milestone_plan
      - resource_allocation
      - risk_register
      - scope_change_log

    schema:
      project_overview:
        engagement_id: "string"
        customer: "string"
        sow_reference: "string"
        start_date: "date"
        target_completion: "date"
        current_status: "enum[GREEN|YELLOW|RED]"
        overall_progress_percentage: "number"

      milestone_plan:
        milestones:
          - milestone_id: "string"
            name: "string"
            phase: "string"
            due_date: "date"
            status: "enum[NOT_STARTED|IN_PROGRESS|AT_RISK|COMPLETE|DELAYED]"
            acceptance_criteria: "array[string]"
            dependencies: "array[string]"
            owner: "string"

      resource_allocation:
        resources:
          - name: "string"
            role: "string"
            allocation_percentage: "number"
            start_date: "date"
            end_date: "date"
            workstream: "string"
        total_effort_estimated: "number (person-days)"
        total_effort_consumed: "number (person-days)"
        burn_rate_status: "enum[UNDER|ON_TRACK|OVER]"

      risk_register:
        risks:
          - risk_id: "string"
            description: "string"
            severity: "enum[LOW|MEDIUM|HIGH|CRITICAL]"
            probability: "enum[LOW|MEDIUM|HIGH]"
            mitigation: "string"
            owner: "string"
            status: "enum[OPEN|MITIGATED|CLOSED]"

      scope_change_log:
        baseline_scope_effort: "number (person-days)"
        cumulative_change_effort: "number (person-days)"
        change_percentage: "number"
        threshold_breached: "boolean"
        changes:
          - change_id: "string"
            description: "string"
            effort_impact: "number (person-days)"
            timeline_impact: "string"
            status: "enum[REQUESTED|APPROVED|REJECTED|IMPLEMENTED]"
            approved_by: "string"

  weekly_status_artifact:
    path: "{realm}/{node}/internal-infohub/professional_services/status/weekly_status_{YYYY-MM-DD}.md"
    vault_type: "internal"
    format: "markdown"
    sections:
      - executive_summary
      - milestone_progress
      - blockers_and_risks
      - next_week_priorities
      - action_items
    create_if: "weekly status cycle triggered"

  customer_facing_artifact:
    path: "{realm}/{node}/external-infohub/professional_services/project_status_{YYYY-MM-DD}.md"
    vault_type: "customer"
    format: "markdown"
    sections:
      - project_status_summary
      - milestone_tracker
      - upcoming_activities
      - action_items
      - decisions_needed
    create_if: "customer status update scheduled"

  notifications:
    - recipient: "PS Manager"
      condition: "scope_change_exceeds_threshold OR critical_milestone_missed"
      message: "Delivery escalation for {node}: {escalation_reason}"
    - recipient: "AE Agent"
      condition: "scope_change_exceeds_threshold"
      message: "Scope change >20% for {node}: commercial renegotiation required"
    - recipient: "CA Agent"
      condition: "delivery_entering_handoff_phase"
      message: "Engagement {node} approaching handoff phase, prepare for knowledge transfer"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "scope_change_exceeds_20_percent"
      reason: "Cumulative scope changes exceed 20% of original SOW"
      action: "Escalate to PS Manager + AE within 24 hours for re-scoping and commercial adjustment"

    - condition: "critical_milestone_missed"
      reason: "Critical path milestone missed, project completion date at risk"
      action: "Escalate to PS Manager immediately for recovery planning"

    - condition: "customer_delivery_escalation"
      reason: "Customer has escalated dissatisfaction with delivery progress"
      action: "Escalate to PS Manager + CA for joint customer response"

    - condition: "resource_unavailable"
      reason: "Assigned resource no longer available, no backup identified"
      action: "PS Manager to reassign resources or negotiate timeline extension"

    - condition: "burn_rate_exceeds_budget_by_15_percent"
      reason: "Effort consumption exceeding budget creates margin risk"
      action: "PS Manager to review and approve additional effort or adjust scope"

  insufficient_data:
    - "No signed SOW"
    - "No PS scoping assessment (PB_PS_001 not completed)"
    - "No customer stakeholder contacts"
    - "No resource availability data"

  ambiguity_signals:
    - "Customer project sponsor not responding to status updates"
    - "Multiple conflicting priorities from different customer stakeholders"
    - "Acceptance criteria defined as 'satisfactory to customer' without specifics"
    - "Customer dependencies repeatedly missed without acknowledgment"

  human_judgment_required:
    - "Prioritizing milestones when timeline compression is needed"
    - "Deciding whether to absorb minor scope changes or document formally"
    - "Assessing whether customer delays warrant timeline extension or scope reduction"
    - "Determining appropriate escalation level for delivery risks"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "SOW signed and PS scoping assessment available"
    - "At least one PS resource assigned to the engagement"
    - "Customer project sponsor identified"
    - "Kickoff date scheduled or within planning window"

  post_execution:
    - "All SOW deliverables mapped to milestones with due dates"
    - "Each milestone has acceptance criteria and an owner"
    - "Resource allocation covers all workstreams without gaps"
    - "Risk register populated with at least initial risks from scoping"
    - "Scope change baseline documented for threshold tracking"

  output_quality:
    - "Milestone dates are specific (not 'TBD' or 'Week of')"
    - "Resource names or role placeholders assigned to every workstream"
    - "Weekly status format consistent across reporting periods"
    - "Scope change log maintains cumulative percentage calculation"
    - "Customer-facing artifacts contain no internal cost or margin data"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "15-30 minutes (initial plan) + 5-10 minutes (weekly status updates)"
frequency: "Initial plan once per engagement, status updates weekly, scope changes on-demand"
human_review_required: true
approval_workflow:
  - reviewer: "PS Agent"
    approval_gate: "Delivery plan complete with milestones, resources, and risk register"
  - reviewer: "PS Manager"
    condition: "always"
    approval_gate: "Resource commitments and milestone plan approved"
  - reviewer: "Customer Project Sponsor"
    condition: "kickoff_phase"
    approval_gate: "Customer signs off on project plan and communication cadence"

