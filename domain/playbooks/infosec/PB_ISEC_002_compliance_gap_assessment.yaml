# InfoSec Compliance Gap Assessment Playbook
# Purpose: Assess compliance gaps between customer requirements and platform capabilities

id: "PB_ISEC_002"
name: "Compliance Gap Assessment"
version: "1.0"
status: "ACTIVE"
playbook_mode: "ASSESSMENT"
playbook_category: "technical_execution"
intended_agent_role: "infosec-agent"

metadata:
  category: "security"
  framework: "Compliance Gap Analysis"
  team_owner: "infosec"
  description: "Evaluate customer compliance requirements against platform certifications and capabilities, identify gaps and remediation paths"
  notes: "Triggered by SA when RFP security sections arrive or when customer compliance requirements surface during discovery."

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Gap analysis reveals vendor limitations and remediation timelines, vendor-internal."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Compliance coverage summary and certification roadmap shared with customer"

raci:
  responsible:
    role: "infosec_agent"
    agent: "infosec-agent"
    description: "Assesses compliance requirements, maps to certifications, identifies gaps, proposes remediation"
  accountable:
    role: "security_lead"
    human_required: true
    description: "Validates gap severity and approves remediation commitments"
  consulted:
    - role: "solution_architects"
      on_steps: ["architecture_compliance", "data_residency"]
    - role: "product_management"
      on_steps: ["certification_roadmap", "feature_gaps"]
  informed:
    - role: "account_executives"
      notify_on: ["blocker_identified", "assessment_complete"]
    - role: "risk_radar_agent"
      notify_on: ["high_severity_gap"]

triggers:
  - event: "compliance_review_requested"
    conditions:
      - "Customer compliance requirements identified during discovery or RFP"
    actions:
      - "Map requirements to framework (SOC2, ISO27001, GDPR, HIPAA, etc.)"
      - "Assess coverage against current certifications"
      - "Classify gaps by severity and remediation timeline"

phases:
  - name: "Requirements Mapping"
    steps:
      - "Extract compliance framework requirements from customer documentation"
      - "Map to applicable standards (SOC2, ISO27001, GDPR, HIPAA, FedRAMP)"
      - "Identify data residency and sovereignty requirements"
  - name: "Coverage Assessment"
    steps:
      - "Check current certification coverage against requirements"
      - "Evaluate platform controls against framework controls"
      - "Identify gaps: not certified, partial coverage, or not applicable"
  - name: "Gap Classification"
    steps:
      - "Classify each gap: BLOCKER (deal-stopping), HIGH (needs remediation plan), LOW (acceptable risk)"
      - "Assess remediation timeline for each gap"
      - "Identify compensating controls where direct compliance is unavailable"
  - name: "Remediation Planning"
    steps:
      - "Propose remediation path for each BLOCKER and HIGH gap"
      - "Map remediation to certification roadmap timelines"
      - "Route BLOCKERs to sa-risk-agent for architecture impact assessment"

quality_gates:
  - "All customer compliance requirements mapped to at least one framework"
  - "Every gap classified with severity and remediation path"
  - "BLOCKERs escalated to SA risk assessment"
