# InfoSec Security Questionnaire Playbook
# Purpose: Process and respond to customer security questionnaires

id: "PB_ISEC_001"
name: "Security Questionnaire Response"
version: "1.0"
status: "ACTIVE"
playbook_mode: "GENERATIVE"
playbook_category: "pursuit_sales_support"
intended_agent_role: "infosec-agent"

metadata:
  category: "security"
  framework: "Questionnaire Response"
  team_owner: "infosec"
  description: "Process customer security questionnaires, match answers from evidence library, flag gaps for SME review"
  notes: "Triggered when AE or SA routes a security questionnaire. Uses evidence library for standard answers, escalates novel questions."

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Draft responses and gap analysis are vendor-internal until customer-approved."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Completed questionnaire response shared with customer"
    - vault: "Global Knowledge Vault"
      artifact: "New Q&A pairs added to evidence library for reuse"

raci:
  responsible:
    role: "infosec_agent"
    agent: "infosec-agent"
    description: "Categorizes questions, matches from evidence library, drafts responses, flags gaps"
  accountable:
    role: "security_lead"
    human_required: true
    description: "Reviews responses for accuracy and approves customer-facing answers"
  consulted:
    - role: "solution_architects"
      on_steps: ["architecture_questions", "integration_security"]
    - role: "engineering_sme"
      on_steps: ["novel_questions", "product_specific_details"]
  informed:
    - role: "account_executives"
      notify_on: ["completion", "blockers_found", "timeline_risk"]

triggers:
  - event: "questionnaire_received"
    conditions:
      - "Security or compliance questionnaire uploaded to deal record"
    actions:
      - "Categorize questions by domain (data, access, compliance, infrastructure)"
      - "Match against evidence library"
      - "Draft responses and flag SME-required items"

phases:
  - name: "Intake and Categorization"
    steps:
      - "Parse questionnaire format (spreadsheet, PDF, portal)"
      - "Categorize questions by security domain"
      - "Identify standard questions vs. novel questions"
      - "Estimate completion timeline"
  - name: "Evidence Matching"
    steps:
      - "Match standard questions to evidence library answers"
      - "Apply customer-specific context to templated responses"
      - "Flag questions requiring SME input"
  - name: "Gap Resolution"
    steps:
      - "Route novel questions to appropriate SMEs"
      - "Coordinate with SA for architecture-specific answers"
      - "Document new Q&A pairs for evidence library"
  - name: "Review and Delivery"
    steps:
      - "Compile complete response document"
      - "Route to security lead for accuracy review"
      - "Deliver to AE for customer submission"

quality_gates:
  - "All questions answered, zero blanks"
  - "Novel answers reviewed by human SME"
  - "Evidence library updated with new patterns"
