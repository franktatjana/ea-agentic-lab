# PLAYBOOK: News Impact Assessment
# Owner: Market News Analysis Agent (mna_agent)

playbook_id: "PB_MNA_002"
framework_name: "News Impact Assessment"
framework_source: "Intelligence Cluster - Market News Analysis"
playbook_mode: "ASSESSMENT"
playbook_category: "discovery_investigation"
intended_agent_role: "mna-agent"
secondary_agents: ["AE Agent (deal context)", "CI Agent (competitive context)", "Industry Intelligence Agent (industry context)"]

primary_objective: "Assess the impact of a specific market event on active engagements, quantify deal risk or opportunity change, and generate recommended actions for account teams"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Impact assessments connect external events to vendor deal strategy and contain sensitive positioning analysis."

when_not_to_use:
  - "Event is routine and already covered in daily digest (no special assessment needed)"
  - "Event affects an industry but no active realm operates in that industry"
  - "Event is speculative or unconfirmed (wait for confirmation before assessment)"

raci:
  responsible:
    role: "MNA Agent"
    agent: "mna-agent"
    description: "Analyzes event impact across affected nodes, quantifies risk/opportunity shift, generates action recommendations"
  accountable:
    role: "Intelligence Manager"
    human_required: true
    description: "Validates impact severity classification and approves escalation recommendations"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"
  consulted:
    - role: "AE Agent"
      on_steps: ["deal_impact", "customer_relationship_context"]
    - role: "CI Agent"
      on_steps: ["competitive_implication"]
    - role: "Industry Intelligence Agent"
      on_steps: ["industry_pattern_context"]
  informed:
    - role: "AE Agent"
      notify_on: ["impact_assessment_complete"]
    - role: "Senior Manager"
      notify_on: ["high_severity_impact"]

trigger_conditions:
  automatic:
    - event: "high_severity_news"
      description: "News event classified as high severity in digest processing"
    - event: "SIG_MNA_IMPACT"
      signal_filter: "severity >= HIGH"
      description: "Signal matcher routes high-impact events for deep assessment"
  manual:
    - "AE requests impact assessment for a specific market event"
    - "Sales leadership requests cross-portfolio impact analysis"

validation_inputs:
  mandatory:
    - artifact: "Event details (source, date, content, affected entities)"
      description: "The specific event to assess"
    - artifact: "{realm}/realm_profile.yaml"
      description: "Realm context for impact mapping"
  optional:
    - artifact: "{realm}/{node}/internal-infohub/overview.md"
      use: "Active deal context for impact quantification"
    - artifact: "{realm}/intelligence/industry_intelligence/industry_profile.yaml"
      use: "Industry context for pattern matching"
    - artifact: "{realm}/intelligence/competitive/*.md"
      use: "Competitive positioning context"

key_questions:
  direct_impact:
    - "Which realms and nodes are directly affected by this event?"
    - "Does this event change the customer's buying timeline or priorities?"
    - "Does this event affect a champion, economic buyer, or key stakeholder?"
  deal_risk:
    - "Does this event increase deal risk (budget freeze, reorganization, competitor win)?"
    - "Does this event create urgency that accelerates the deal?"
    - "Does this event change the competitive landscape for active deals?"
  recommended_actions:
    - "Should the AE adjust messaging or meeting agenda?"
    - "Should a new risk be created in the deal risk register?"
    - "Should Sales Leadership be alerted for strategic intervention?"

expected_outputs:
  primary_artifact:
    path: "{realm}/intelligence/market_news/impact_{event_id}_{YYYY-MM-DD}.yaml"
    format: "yaml"
    sections:
      - event_summary
      - affected_engagements
      - impact_classification
      - risk_assessment
      - opportunity_assessment
      - recommended_actions

  risk_objects:
    path: "{realm}/{node}/internal-infohub/risks/"
    create_if:
      - "Event creates material deal risk (budget, timeline, stakeholder, competitive)"
    template: "Risk with mitigation plan"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Impact assessment complete for '{event_title}': {severity} severity, {affected_count} engagements affected."
    - recipient: "Senior Manager"
      condition: "severity == CRITICAL"
      message: "Critical market event impact: '{event_title}' affects {affected_count} deals. Review recommended actions."

stop_conditions:
  escalate_to_human:
    - condition: "event_affects_multiple_strategic_accounts"
      reason: "Cross-portfolio impact requires leadership coordination"
      action: "Alert Sales Leadership with portfolio-wide impact summary"
    - condition: "event_contradicts_customer_statements"
      reason: "Public event conflicts with what customer told AE"
      action: "AE must validate customer situation before acting on assessment"
  insufficient_data:
    - "Event details too vague for meaningful impact assessment"
    - "No active engagements in affected realm"

estimated_execution_time: "10-20 minutes"
frequency: "On-demand (triggered by high-severity events)"
human_review_required: true

last_updated: "2026-03-25"
version: "1.0"
status: "draft"
