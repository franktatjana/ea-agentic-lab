# PLAYBOOK: News Digest Generation
# Owner: Market News Analysis Agent (mna_agent)

playbook_id: "PB_MNA_001"
framework_name: "News Digest Generation"
framework_source: "Intelligence Cluster - Market News Analysis"
playbook_mode: "GENERATIVE"
playbook_category: "discovery_investigation"
intended_agent_role: "mna-agent"
secondary_agents: ["Industry Intelligence Agent (industry context)", "Account Intelligence Agent (company context)"]

primary_objective: "Generate prioritized news digests for realm and node contexts, connecting market events to active opportunities and surfacing urgent alerts before next customer interaction"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "News digests contain vendor-internal intelligence connecting market events to deal strategy and customer engagement."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized market event patterns and signal detection heuristics (after engagement closes)"

when_not_to_use:
  - "Realm has no active nodes (no engagement context to connect news to)"
  - "Industry profile does not yet exist (run PB_II_001 first for industry context)"
  - "News sources are unavailable or rate-limited (wait for source recovery)"

raci:
  responsible:
    role: "MNA Agent"
    agent: "mna-agent"
    description: "Scans news sources, classifies events by impact, generates prioritized digest with opportunity connections"
  accountable:
    role: "Intelligence Manager"
    human_required: true
    description: "Reviews urgent alerts and validates high-impact event classifications"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"
  consulted:
    - role: "Account Intelligence Agent"
      on_steps: ["company_event_classification", "stakeholder_impact"]
    - role: "Industry Intelligence Agent"
      on_steps: ["industry_trend_context", "regulatory_impact"]
  informed:
    - role: "AE Agent"
      notify_on: ["digest_ready", "urgent_alert"]
    - role: "SA Agent"
      notify_on: ["technology_event", "competitive_event"]

trigger_conditions:
  automatic:
    - event: "scheduled_daily"
      description: "Daily digest generation at configured cadence"
    - event: "urgent_news_detected"
      description: "Breaking news with high severity score triggers immediate alert"
    - event: "realm_created"
      description: "New realm needs initial news baseline scan"
  manual:
    - "Account team requests news briefing before customer meeting"
    - "Pre-QBR news context gathering"

validation_inputs:
  mandatory:
    - artifact: "{realm}/realm_profile.yaml"
      description: "Company and industry context for news relevance filtering"
  optional:
    - artifact: "{realm}/intelligence/industry_intelligence/industry_profile.yaml"
      use: "Industry context for event classification"
    - artifact: "{realm}/intelligence/account_intelligence/company_profile.yaml"
      use: "Company-specific context for stakeholder and initiative matching"
    - artifact: "{realm}/intelligence/source_registry.yaml"
      use: "Previously scanned sources and timestamps"

key_questions:
  company_news:
    - "Has the company announced earnings, restructuring, or leadership changes?"
    - "Are there M&A activities, partnerships, or strategic pivots?"
    - "Has the company made public technology investments or vendor selections?"
  market_events:
    - "Are there regulatory changes affecting the company's industry?"
    - "Have competitors announced products, pricing changes, or market moves?"
    - "Are there macro-economic developments impacting the company's sector?"
  opportunity_connection:
    - "Which active nodes are affected by detected events?"
    - "Does any event create urgency, risk, or expansion opportunity?"
    - "Should any event trigger an AE outreach or meeting agenda change?"

expected_outputs:
  primary_artifact:
    path: "{realm}/intelligence/market_news/digest_{YYYY-MM-DD}.yaml"
    format: "yaml"
    sections:
      - digest_metadata
      - urgent_alerts
      - company_events
      - market_events
      - competitive_signals
      - opportunity_connections

  notifications:
    - recipient: "AE Agent"
      condition: "urgent_alert_count > 0"
      message: "Urgent news alert for {realm_name}: {alert_summary}. Review before next customer interaction."
    - recipient: "AE Agent"
      condition: "always"
      message: "Daily news digest ready for {realm_name}. {event_count} events, {connection_count} opportunity connections."

stop_conditions:
  escalate_to_human:
    - condition: "crisis_event_detected"
      reason: "Major negative event (layoffs, data breach, CEO departure) requires human judgment on engagement approach"
      action: "Alert AE and Sales Leadership immediately with event context"
  insufficient_data:
    - "No news sources accessible for this company or industry"
    - "Company name too generic for reliable news filtering"

estimated_execution_time: "5-10 minutes"
frequency: "Daily (configurable per realm)"
human_review_required: false

last_updated: "2026-03-25"
version: "1.0"
status: "draft"
