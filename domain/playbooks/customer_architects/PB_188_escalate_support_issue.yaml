# PLAYBOOK: Escalate Support Issue
# Process escalation and critical incident signals, route to stakeholders
# Version 1.0 - Signal-driven architecture (Support Agent dissolved 2026-02)

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
steckbrief:
  playbook_id: "PB_188"
  name: "Escalate Support Issue"
  category: "customer_architects"
  mode: "OPERATIONAL"
  version: "1.0"
  status: "DRAFT"

  one_liner: "Process escalation and critical incident signals via SK_CA_001, determine the escalation path, create an escalation record with timeline and impact assessment, and coordinate the response across the account team"
  framework_origin: "Support-to-Account Intelligence (C06)"

  owner_agent: "CA Agent"
  supporting_agents: ["AE Agent", "SA Agent", "Senior Manager"]

  triggers_summary:
    - "SIG_SUP_003: Customer escalated to leadership or SLA breached"
    - "SIG_SUP_004: P1/critical production-down ticket opened"
    - "PB_187 tracked case that worsened into escalation territory"

  anti_patterns:
    - "Internal support team escalation that does not involve the customer"
    - "Signal relates to a planned maintenance window"
    - "Escalation already active for the same ticket with an open response plan"
    - "Account is in planned offboarding"

  key_inputs:
    - "SIG_SUP_003 or SIG_SUP_004 signal payload"
    - "Current health score and existing risk register"
    - "Stakeholder map (for escalation routing)"

  key_outputs:
    - artifact: "Escalation record with timeline and impact assessment"
      format: "yaml"
    - artifact: "Updated risk register entry"
      format: "yaml"
    - artifact: "Escalation communication plan"
      format: "markdown"

  key_decisions:
    - "SLA breach on healthy account: CA Lead escalation path"
    - "Customer leadership escalation: Senior Manager escalation path"
    - "Critical incident (SIG_SUP_004): Executive escalation path, 1-hour SLA"
    - "Multiple escalations on same account in 30 days: systemic review required"

  complexity: "HIGH"
  estimated_inputs: 7
  estimated_rules: 6

  source_file: "domain/playbooks/customer_architects/PB_188_escalate_support_issue.yaml"
  last_updated: "2026-02-27"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Support-to-Account Intelligence"
framework_source: "C06 Support & DSE Engagement (Post-Sales Model)"
playbook_mode: "OPERATIONAL"
playbook_category: "relationship_governance"
intended_agent_role: "CA Agent (signal consumer via SK_CA_001)"
secondary_agents: ["AE Agent", "SA Agent", "Senior Manager"]

primary_objective: "Process escalation and critical incident signals rapidly, determine the correct escalation path based on severity and type, create a complete escalation record, and coordinate the multi-stakeholder response within defined SLAs"

when_not_to_use:
  - "Internal support team escalation not involving the customer"
  - "Signal relates to planned maintenance or known outage"
  - "Escalation already active for the same ticket_id"
  - "Account is in planned offboarding"
  - "Non-escalation signals (SIG_SUP_001, SIG_SUP_002), use PB_187 instead"

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  signal_triggers:
    - signal: "SIG_SUP_003"
      name: "escalation_triggered"
      description: "Customer escalated to leadership, SLA breached, or executive complaint received"
      priority: "HIGH"
      sla: "Response plan within 4 hours"
      skill_entry: "SK_CA_001 step 1"

    - signal: "SIG_SUP_004"
      name: "critical_incident"
      description: "P1/critical production-down ticket opened"
      priority: "CRITICAL"
      sla: "Processed within 1 hour"
      skill_entry: "SK_CA_001 step 1"

  manual:
    - "CA identifies an escalation pattern from tracked cases (PB_187)"
    - "Customer contacts account team directly about an unresolved issue"
    - "AE reports customer dissatisfaction from a commercial conversation"

  conditional:
    - condition: "$.escalation.count_30d >= 3"
      description: "Third escalation in 30 days, systemic issue"

    - condition: "$.signal.severity == 'critical' AND $.health_score.current < 50"
      description: "Critical incident on an already critically unhealthy account"

    - condition: "$.signal.escalation_type == 'executive_complaint'"
      description: "Executive-level complaint requires immediate senior attention"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
validation_inputs:
  mandatory:
    - artifact: "SIG_SUP_003 or SIG_SUP_004 signal payload"
      description: "Validated signal with realm_id, node_id, severity, and escalation details"
    - artifact: "{realm}/{node}/internal-infohub/governance/health_score.yaml"
      description: "Current account health score"
    - artifact: "{realm}/{node}/internal-infohub/stakeholders/relationship_map.md"
      description: "Stakeholder contacts for escalation routing"

  optional:
    - artifact: "{realm}/{node}/internal-infohub/support/case_log.yaml"
      use: "History of prior support cases for context"
    - artifact: "{realm}/{node}/internal-infohub/risks/risk_register.yaml"
      use: "Existing risks to cross-reference"
    - artifact: "{realm}/{node}/internal-infohub/support/escalation_history.yaml"
      use: "Prior escalation records for pattern detection"
    - artifact: "{realm}/{node}/external-infohub/overview.md"
      use: "Account context (tier, engagement track, renewal date)"

  minimum_data_threshold:
    - "Signal payload passes SK_CA_001 step 1 validation"
    - "Severity and escalation type fields present"
    - "Account exists in InfoHub"

# ==============================================================================
# ESCALATION PATH DEFINITIONS
# ==============================================================================
escalation_paths:
  tier_1_ca_lead:
    name: "CA Lead Escalation"
    applies_when:
      - "SLA breach on standard severity"
      - "Customer contact (non-executive) expresses frustration"
      - "First escalation for this account in 90 days"
    owner: "CA Lead"
    response_sla: "4 hours"
    actions:
      - "CA Lead reviews case and assigns ownership"
      - "Customer receives acknowledgment within 4 hours"
      - "Daily updates until resolution"

  tier_2_senior_manager:
    name: "Senior Manager Escalation"
    applies_when:
      - "Customer leadership (VP+) escalation"
      - "Second escalation in 30 days"
      - "SLA breach on high-severity ticket"
    owner: "Senior Manager"
    response_sla: "2 hours"
    actions:
      - "Senior Manager briefed with impact assessment"
      - "Executive-level acknowledgment sent to customer"
      - "War room established for resolution tracking"
      - "AE engaged for relationship management"

  tier_3_executive:
    name: "Executive Escalation"
    applies_when:
      - "SIG_SUP_004 critical incident (production down)"
      - "Executive complaint from C-level"
      - "Third escalation in 30 days"
      - "Account health below 40 with active escalation"
    owner: "VP/Executive"
    response_sla: "1 hour"
    actions:
      - "Executive sponsor notified immediately"
      - "Cross-functional war room activated"
      - "Customer receives executive-level communication within 1 hour"
      - "Hourly updates until production restored"
      - "Post-incident review scheduled"

# ==============================================================================
# KEY QUESTIONS
# ==============================================================================
key_questions:
  signal_assessment:
    - "Is this an escalation (SIG_SUP_003) or a critical incident (SIG_SUP_004)?"
    - "What is the escalation type (customer_leadership, sla_breach, executive_complaint)?"
    - "What is the severity level and the business impact?"
    - "Is there a workaround available (for critical incidents)?"
    - "Who from the customer side initiated the escalation?"

  context_gathering:
    - "What is the account's current health score and trend?"
    - "How many escalations has this account had in the past 90 days?"
    - "Are there open risks or action items related to this issue?"
    - "Is this linked to a case already tracked in PB_187?"
    - "What is the customer's engagement track and renewal timeline?"

  escalation_routing:
    - "Which escalation tier applies based on severity and type?"
    - "Who is the escalation owner at the determined tier?"
    - "Which internal stakeholders need to be in the response loop?"
    - "Does the AE need to prepare executive communication?"
    - "Does the SA Agent need to assess technical root cause?"

  resolution_planning:
    - "What is the target resolution timeline given the SLA?"
    - "What resources are needed to resolve this (support, engineering, SA)?"
    - "What customer communication cadence is appropriate?"
    - "Should a post-incident review be scheduled?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - id: "sla_breach_standard"
      condition: "$.signal.name == 'escalation_triggered' AND $.signal.escalation_type == 'sla_breach' AND $.signal.severity == 'high'"
      severity: "HIGH"
      output_type: "Escalation Record + Risk"
      decision:
        title: "SLA breach escalation at {node}"
        context: "Support SLA breached on a high-severity ticket"
        recommendation: "Tier 1 escalation to CA Lead, investigate root cause"
        actions:
          - "Create escalation record with ticket details and SLA breach timeline"
          - "Notify CA Lead for case ownership"
          - "Send acknowledgment to customer within 4 hours"
          - "Update support case log (PB_187 cross-reference)"
          - "Create risk: SLA compliance failure"
        stakeholders: ["CA Lead", "SA Agent"]
      creates:
        - object_type: "Risk"
          category: "support"
          severity: "HIGH"

    - id: "customer_leadership_escalation"
      condition: "$.signal.escalation_type == 'customer_leadership'"
      severity: "HIGH"
      output_type: "Escalation Record + Risk"
      decision:
        title: "Customer leadership escalation at {node}"
        context: "VP+ level contact has escalated a support issue"
        recommendation: "Tier 2 escalation to Senior Manager"
        actions:
          - "Create escalation record with customer contact details and issue context"
          - "Brief Senior Manager within 2 hours"
          - "AE Agent: prepare relationship response strategy"
          - "Send executive-level acknowledgment to customer"
          - "Create risk: relationship risk from leadership escalation"
        stakeholders: ["Senior Manager", "AE Agent", "CA Lead"]
      creates:
        - object_type: "Risk"
          category: "relationship"
          severity: "HIGH"

    - id: "executive_complaint"
      condition: "$.signal.escalation_type == 'executive_complaint'"
      severity: "CRITICAL"
      output_type: "Escalation Record + Risk + Communication Plan"
      decision:
        title: "Executive complaint at {node}"
        context: "C-level executive complaint received"
        recommendation: "Tier 3 executive escalation, immediate response"
        actions:
          - "Create escalation record with executive context"
          - "Notify VP/Executive within 1 hour"
          - "AE Agent: prepare executive-to-executive response"
          - "Schedule executive briefing call within 24 hours"
          - "Create risk: critical relationship risk"
        stakeholders: ["VP/Executive", "AE Agent", "Senior Manager", "CA Lead"]
        urgency: "IMMEDIATE"
      creates:
        - object_type: "Risk"
          category: "relationship"
          severity: "CRITICAL"

    - id: "critical_incident"
      condition: "$.signal.name == 'critical_incident'"
      severity: "CRITICAL"
      output_type: "Escalation Record + Risk + War Room"
      decision:
        title: "Critical incident at {node}: {impact_description}"
        context: "Production-down P1 ticket, business operations impacted"
        recommendation: "Tier 3 executive escalation, 1-hour processing SLA"
        actions:
          - "Create escalation record with incident details and timeline"
          - "Activate cross-functional war room"
          - "SA Agent: assess technical root cause implications"
          - "AE Agent: prepare stakeholder communication"
          - "Send executive-level communication to customer within 1 hour"
          - "Establish hourly update cadence until resolution"
          - "Schedule post-incident review"
        stakeholders: ["VP/Executive", "AE Agent", "SA Agent", "Senior Manager"]
        urgency: "IMMEDIATE"
      creates:
        - object_type: "Risk"
          category: "support"
          severity: "CRITICAL"

    - id: "repeat_escalation_pattern"
      condition: "$.escalation.count_30d >= 3"
      severity: "CRITICAL"
      output_type: "Systemic Review + Risk"
      decision:
        title: "Systemic escalation pattern at {node}: {count} escalations in 30 days"
        context: "Three or more escalations in 30 days indicates systemic failure"
        recommendation: "Escalate to Senior Manager for systemic review, consider DSE engagement (PB_189)"
        actions:
          - "Create escalation record highlighting systemic pattern"
          - "Brief Senior Manager on full escalation history"
          - "SA Agent: conduct root cause analysis across all escalations"
          - "Evaluate DSE engagement need (may trigger PB_189 via SIG_SUP_005)"
          - "Create risk: systemic support failure"
          - "Schedule account-level support strategy review"
        stakeholders: ["Senior Manager", "SA Agent", "PS Agent"]
      creates:
        - object_type: "Risk"
          category: "support"
          severity: "CRITICAL"

    - id: "critical_on_at_risk_account"
      condition: "$.signal.severity == 'critical' AND $.health_score.current < 50"
      severity: "CRITICAL"
      output_type: "Escalation Record + Retention Alert"
      decision:
        title: "Critical incident on at-risk account {node}"
        context: "Production-down event on an account already in critical health zone"
        recommendation: "Tier 3 escalation with retention strategy activation"
        actions:
          - "All Tier 3 actions apply"
          - "AE Agent: activate retention strategy"
          - "Consider goodwill gesture or service credits"
          - "Post-resolution: schedule executive recovery meeting"
          - "Trigger PB_CS_301 (Health Triage) if not already active"
        stakeholders: ["VP/Executive", "AE Agent", "Senior Manager"]
        urgency: "IMMEDIATE"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/support/escalations/esc_{ticket_id}_{date}.yaml"
    format: "yaml"
    schema:
      escalation_record:
        - escalation_id: "string"
        - date_received: "datetime"
        - signal_id: "enum[SIG_SUP_003|SIG_SUP_004]"
        - escalation_type: "enum[sla_breach|customer_leadership|executive_complaint|critical_incident]"
        - severity: "enum[high|critical]"
        - ticket_id: "string"
        - impact_description: "string"
        - customer_contact_role: "string"
        - escalation_tier: "enum[tier_1|tier_2|tier_3]"
        - escalation_owner: "string"
        - response_sla: "string"
        - actions_required: "array[action]"
        - status: "enum[open|in_progress|resolved|post_review]"
        - timeline:
            - event: "string"
              timestamp: "datetime"
              actor: "string"
        - resolution_summary: "string (populated on close)"
        - post_incident_review_scheduled: "boolean"

  risk_object:
    path: "{realm}/{node}/internal-infohub/risks/"
    create_if: "always (all escalations create risk entries)"

  communication_plan:
    path: "{realm}/{node}/internal-infohub/support/escalations/"
    create_if: "escalation_tier >= tier_2"
    format: "markdown"
    sections:
      - internal_briefing
      - customer_communication_timeline
      - stakeholder_update_cadence

  case_log_update:
    path: "{realm}/{node}/internal-infohub/support/case_log.yaml"
    update_mode: "append"
    content: "Escalation reference entry linking to escalation record"

  notifications:
    - recipient: "CA Lead"
      condition: "always"
      message: "Support escalation at {node}: {escalation_type}, severity {severity}"

    - recipient: "AE Agent"
      condition: "always"
      message: "Support escalation at {node}: {escalation_type}, customer contact {customer_contact_role}"

    - recipient: "SA Agent"
      condition: "$.signal.name == 'critical_incident' OR $.classification == 'architecture_gap'"
      message: "Technical escalation at {node}: {impact_description}"

    - recipient: "Senior Manager"
      condition: "$.escalation_tier IN ['tier_2', 'tier_3']"
      message: "Escalation requiring your attention at {node}: {escalation_type}"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "$.signal.name == 'critical_incident'"
      reason: "All critical incidents require human leadership and decision-making"
      action: "Notify CA Lead and Senior Manager immediately, agent supports with data preparation"

    - condition: "$.escalation_tier == 'tier_3'"
      reason: "Executive escalations require human executive involvement"
      action: "Brief executive with impact assessment, agent prepares materials"

    - condition: "$.customer_contact_role contains 'C-level' OR 'CEO' OR 'CTO' OR 'CIO'"
      reason: "C-suite interaction requires human relationship management"
      action: "AE and Senior Manager take point on communication"

  insufficient_data:
    - "Signal payload missing ticket_id or severity"
    - "Stakeholder map not available for escalation routing"
    - "Account does not exist in InfoHub"

  ambiguity_signals:
    - "Escalation type unclear from signal payload"
    - "Multiple concurrent escalations for different issues on same account"
    - "Customer contact role unknown, cannot determine appropriate tier"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Signal is SIG_SUP_003 or SIG_SUP_004"
    - "Signal payload contains severity and escalation details"
    - "No active escalation record exists for the same ticket_id"
    - "Stakeholder map available for routing"
    - "Account health score available for severity assessment"

  post_execution:
    - "Escalation record created with all required fields"
    - "Escalation tier determined and owner assigned"
    - "Risk entry created in risk register"
    - "All required notifications sent within SLA"
    - "Case log updated with escalation cross-reference"
    - "For SIG_SUP_004: processed within 1-hour SLA"
    - "For SIG_SUP_003: response plan within 4-hour SLA"

  output_quality:
    - "Impact description is specific and actionable"
    - "Escalation tier matches the severity and escalation type"
    - "Actions assigned to named owners with deadlines"
    - "Customer communication timeline is realistic and meets SLA"
    - "Timeline events are timestamped accurately"

# ==============================================================================
# INTEGRATION WITH OTHER PLAYBOOKS
# ==============================================================================
integrates_with:
  - playbook: "PB_187_track_support_case"
    integration: "Escalations reference and update the underlying tracked case"
    provides: "Escalation context added to case log"

  - playbook: "PB_189_engage_dse"
    integration: "Systemic escalation pattern may trigger DSE engagement evaluation"
    trigger: "3+ escalations in 30 days, or post-incident DSE recommendation"

  - playbook: "PB_190_review_support_health"
    integration: "Escalation history feeds quarterly support health review"
    provides: "Escalation count, severity distribution, resolution times"

  - playbook: "PB_174_customer_qbr"
    integration: "Active or recent escalations are surfaced in QBR support section"
    provides: "Escalation summary for customer review"

  - playbook: "PB_CS_301_health_triage"
    integration: "Critical incidents on at-risk accounts trigger health triage"
    trigger: "Critical incident + health score < 50"

  - playbook: "PB_401_customer_health_score"
    integration: "Escalations negatively impact support health component"
    provides: "Escalation severity and frequency data"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "15-30 minutes for record creation, ongoing for resolution tracking"
frequency: "On signal receipt (event-driven)"
human_review_required: true
approval_workflow:
  - reviewer: "CA Lead"
    condition: "always"
    approval_gate: "Validate escalation tier and response plan"
  - reviewer: "Senior Manager"
    condition: "$.escalation_tier IN ['tier_2', 'tier_3']"
    approval_gate: "Approve executive communication and resource allocation"

last_updated: "2026-02-27"
version: "1.0"
status: "DRAFT"
notes: "C06 playbook. CA Agent processes SIG_SUP_003 and SIG_SUP_004 via SK_CA_001. Critical incidents (SIG_SUP_004) must be processed within 1 hour. Support Agent was dissolved 2026-02."
