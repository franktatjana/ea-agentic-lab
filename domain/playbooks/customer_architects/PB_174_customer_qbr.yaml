# PLAYBOOK: Customer Quarterly Business Review
# Customer-facing QBR for reviewing adoption, value, and success plan
# Version 2.0 - PLAYBOOK_EXECUTION_SPECIFICATION standard

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
steckbrief:
  playbook_id: "PB_174"
  name: "Customer QBR"
  category: "customer_architects"
  mode: "GENERATIVE"
  version: "2.0"
  status: "production_ready"

  one_liner: "Prepare and conduct customer-facing quarterly business review covering adoption progress, value realization, success plan status, and forward-looking roadmap"
  framework_origin: "Customer Success Management Best Practice, Mural QBR Methodology"

  owner_agent: "CA Agent"
  supporting_agents: ["AE Agent", "SA Agent", "VE Agent"]

  triggers_summary:
    - "Quarterly cadence for Premium accounts (semi-annual for Economy)"
    - "Customer requests business review"
    - "Health score dropped below 60, proactive review warranted"

  anti_patterns:
    - "Internal sales pipeline review (use PB_603 instead)"
    - "Account in first 30 days post-signature (use onboarding PB_167)"
    - "No success plan exists (create one with PB_171 first)"
    - "Customer in active churn process (use retention intervention)"

  key_inputs:
    - "Customer health score (PB_401 output)"
    - "Customer success plan (PB_402 output)"
    - "Adoption metrics and usage data"

  key_outputs:
    - artifact: "QBR Presentation Deck (structured data)"
      format: "markdown"
    - artifact: "Updated Success Plan"
      format: "yaml"
    - artifact: "QBR Meeting Summary with Action Items"
      format: "markdown"

  key_decisions:
    - "Adoption below target: agree corrective actions with customer"
    - "Value realization confirmed: document for reference/advocacy"
    - "New objectives identified: refresh success plan milestones"
    - "Executive engagement needed: schedule sponsor-level follow-up"

  complexity: "HIGH"
  estimated_inputs: 10
  estimated_rules: 7

  source_file: "domain/playbooks/customer_architects/PB_174_customer_qbr.yaml"
  last_updated: "2026-02-27"

vault_routing:
  primary_vault: "Customer InfoHub"
  rationale: "Customer QBR is a customer-facing business review that shares adoption progress, value realization, and success plan status. The QBR deck and summary are delivered to the customer."
  secondary_outputs:
    - vault: "Internal Account Hub"
      artifact: "Internal QBR prep notes, talking points, and risk assessment"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Customer Quarterly Business Review"
framework_source: "Customer Success Management Best Practice, Mural QBR Methodology"
playbook_mode: "GENERATIVE"
playbook_category: "relationship_governance"
intended_agent_role: "CA Agent"
secondary_agents: ["AE Agent", "SA Agent", "VE Agent"]

primary_objective: "Prepare, conduct, and follow up on customer-facing quarterly business reviews that demonstrate value, review adoption progress, refresh success objectives, and strengthen executive relationships"

when_not_to_use:
  - "Internal sales pipeline review (use PB_603 instead)"
  - "Account in first 30 days post-signature (use onboarding PB_167)"
  - "No success plan exists (create one with PB_171 first)"
  - "Customer in active churn process (use retention intervention)"
  - "Transactional account with no ongoing relationship"

raci:
  responsible:
    role: "CA Agent"
    agent: "ca_agent"
    description: "Prepares, conducts, and follows up on customer-facing quarterly business reviews"

  accountable:
    role: "Customer Success Manager"
    human_required: true
    description: "Approves QBR content, messaging, and customer-facing commitments"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted:
    - role: "AE Agent"
      on_steps: ["internal_alignment", "expansion_opportunity", "executive_disengaged"]
    - role: "SA Agent"
      on_steps: ["challenges_and_opportunities", "adoption_below_target"]
    - role: "VE Agent"
      on_steps: ["value_realization", "value_not_demonstrated"]

  informed:
    - role: "AE Agent"
      notify_on: ["qbr_complete", "expansion_opportunity_identified"]
    - role: "SA Agent"
      notify_on: ["technical_actions_identified"]
    - role: "Sales Leadership"
      notify_on: ["health_score_critical", "expansion_opportunity"]
    - role: "VE Agent"
      notify_on: ["value_realization_gap"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "quarterly_cadence"
      description: "Scheduled QBR based on engagement track"
      timing: "Premium: quarterly, Economy: semi-annual, Fast Track: monthly"

    - event: "health_score_decline"
      description: "Health score dropped below 60, proactive QBR warranted"
      condition: "$.health_score.current < 60 AND $.health_score.trend == 'declining'"

    - event: "success_plan_milestone_complete"
      description: "Major success plan milestone achieved, review timing"
      condition: "$.success_plan.milestones.completed_this_quarter >= 2"

    - event: "renewal_approaching"
      description: "Renewal within 90 days, QBR as value reinforcement"
      condition: "$.contract.renewal_date - today <= 90"

  manual:
    - "Customer requests business review"
    - "Executive sponsor change requires relationship reset"
    - "CA requests proactive review after significant event"
    - "AE requests QBR to support expansion conversation"

  conditional:
    - condition: "$.engagement_track == 'premium' AND $.qbr.last_conducted > 90_days"
      description: "Premium account overdue for quarterly QBR"

    - condition: "$.engagement_track == 'economy' AND $.qbr.last_conducted > 180_days"
      description: "Economy account overdue for semi-annual QBR"

    - condition: "$.adoption.usage_decline_percentage > 20"
      description: "Significant adoption decline warrants proactive review"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
validation_inputs:
  mandatory:
    - artifact: "{realm}/{node}/internal-infohub/governance/health_score.yaml"
      description: "Current account health score and trend"
    - artifact: "{realm}/{node}/external-infohub/planning/success_plan.yaml"
      description: "Active customer success plan with milestones"
    - artifact: "{realm}/{node}/external-infohub/overview.md"
      description: "Account overview and context"

  optional:
    - artifact: "{realm}/{node}/internal-infohub/adoption/adoption_metrics.yaml"
      use: "Usage and adoption tracking data"
    - artifact: "{realm}/{node}/external-infohub/decisions/*.md"
      use: "Architecture decisions and outcomes for value storytelling"
    - artifact: "{realm}/{node}/internal-infohub/stakeholders/relationship_map.md"
      use: "Stakeholder context for attendee planning"
    - artifact: "{realm}/{node}/internal-infohub/risks/*.md"
      use: "Active risks to address transparently"
    - artifact: "Previous QBR summary"
      use: "Track progress on prior action items"
    - artifact: "{realm}/{node}/internal-infohub/competitive/*.md"
      use: "Competitive awareness for positioning"
    - artifact: "Product roadmap updates"
      use: "Forward-looking content for customer interest"
    - artifact: "Support case summary"
      use: "Support trends and resolution quality"

  minimum_data_threshold:
    - "Health score calculated and current (< 7 days stale)"
    - "Success plan exists with defined milestones"
    - "At least 30 days of adoption data available"

# ==============================================================================
# QBR PREPARATION PHASES
# ==============================================================================
preparation_phases:
  phase_1_data_collection:
    timing: "2 weeks before QBR"
    owner: "CA Agent"
    activities:
      - "Pull current health score and trend analysis"
      - "Gather adoption metrics and usage patterns"
      - "Review success plan milestone progress"
      - "Collect support case summary and resolution data"
      - "Review prior QBR action items and completion status"
      - "Identify value realization evidence"
      - "Send pre-QBR engagement materials to customer stakeholders for review and input"
      - "Share preliminary success metrics and invite customer to add their own perspective"

  phase_1b_stakeholder_engagement:
    timing: "10-14 days before QBR"
    owner: "CA Agent with AE Agent"
    activities:
      - "Identify attendee list and their personas (executive, procurement, end user)"
      - "Send personalized pre-meeting brief to each stakeholder with relevant content"
      - "Invite customer stakeholders to contribute topics and questions in advance"
      - "Assess customer communication culture and preferred meeting style"
      - "Gather informal customer sentiment through champion conversations"

  phase_2_analysis:
    timing: "1 week before QBR"
    owner: "CA Agent with SA Agent"
    activities:
      - "Analyze adoption trends vs. targets"
      - "Calculate value delivered vs. business case"
      - "Identify achievements to celebrate"
      - "Surface concerns and proposed mitigations"
      - "Prepare forward-looking recommendations"
      - "Draft QBR presentation structure"

  phase_3_internal_alignment:
    timing: "3-5 days before QBR"
    owner: "CA Agent with AE Agent"
    activities:
      - "Internal pre-QBR alignment meeting"
      - "Agree on messaging for sensitive topics"
      - "Confirm attendees (internal and customer)"
      - "Review expansion or upsell opportunities to introduce"
      - "Finalize presentation materials"

  phase_4_conduct:
    timing: "QBR meeting day"
    owner: "CA Agent leads, AE co-presents"
    activities:
      - "Set agenda and expectations"
      - "Present value delivered and adoption progress"
      - "Review success plan status and refresh objectives"
      - "Discuss challenges and agree on corrective actions"
      - "Share relevant roadmap updates"
      - "Capture decisions and action items"

  phase_5_follow_up:
    timing: "Within 48 hours after QBR"
    owner: "CA Agent"
    activities:
      - "Send meeting summary with documented action items"
      - "Update success plan with new/revised milestones"
      - "Create action items in InfoHub"
      - "Update health score if assessment changed"
      - "Schedule next QBR"

# ==============================================================================
# KEY QUESTIONS
# ==============================================================================
key_questions:
  adoption_review:
    - "What is current product adoption vs. planned targets?"
    - "Which use cases are fully adopted, partially adopted, or not started?"
    - "What adoption blockers exist, and what support is needed?"
    - "How does usage trend compare to prior quarter?"
    - "Are there new teams or departments that should be onboarded?"

  value_realization:
    - "What measurable business outcomes have been achieved?"
    - "How does realized value compare to the original business case?"
    - "What ROI evidence can we document and share?"
    - "What additional value could be unlocked with deeper adoption?"
    - "VE Agent: Can we quantify value delivered in customer's terms?"

  success_plan_status:
    - "Which success plan milestones were completed this quarter?"
    - "Which milestones are behind schedule, and why?"
    - "Do milestones need to be adjusted based on changing priorities?"
    - "What new objectives should be added for the next quarter?"
    - "Is the success plan still aligned with customer's strategic goals?"

  customer_satisfaction:
    - "How does the customer rate their overall experience?"
    - "What support issues have impacted satisfaction?"
    - "Are the right stakeholders engaged and receiving value?"
    - "What feedback has the customer shared informally?"
    - "Would the customer recommend us? (NPS proxy)"

  relationship_health:
    - "Is the executive sponsor engaged and supportive?"
    - "Are key stakeholders attending QBRs and engaged?"
    - "Have we broadened relationships beyond the initial champion?"
    - "Are there organizational changes affecting our engagement?"
    - "Do we have the right meeting cadence and format?"

  forward_looking:
    - "What are the customer's priorities for the next quarter?"
    - "What product roadmap items align with their needs?"
    - "Are there expansion opportunities the customer would benefit from?"
    - "What training or enablement would accelerate adoption?"
    - "What risks should we proactively address?"

# ==============================================================================
# QBR AGENDA TEMPLATE
# ==============================================================================
qbr_agenda:
  duration: "60-90 minutes"
  format: "Interactive collaborative review, not one-sided presentation"
  pre_meeting: "Send agenda and pre-read materials to all attendees 5 business days in advance. Invite stakeholders to add topics or questions."
  sections:
    - section: "Welcome and Relationship Building"
      duration: "5-10 min"
      content: "Welcome, introductions, agenda review, set collaborative tone"
      presenter: "AE Agent / CA Agent"
      technique: "Acknowledge customer team's investment and set expectation for interactive discussion"

    - section: "Customer Wins and Success Stories"
      duration: "10-15 min"
      content: "Customer-driven achievements, business outcomes realized, team accomplishments"
      presenter: "CA Agent, with customer champion sharing their perspective"
      technique: "Lead with customer-driven success stories. Invite customer stakeholders to champion their own achievements. Convert metrics to outcomes: 'Your team resolved incidents 30% faster, what impact has that had?'"
      inputs: ["adoption_metrics", "value_realization_summary"]

    - section: "Success Plan Review"
      duration: "10-15 min"
      content: "Milestone status, completed vs. pending, adjustments needed"
      presenter: "CA Agent"
      technique: "Walk through milestones collaboratively. Ask what should change, not just report status."
      inputs: ["success_plan", "milestone_tracker"]

    - section: "Challenges and Opportunities"
      duration: "15-20 min"
      content: "Adoption blockers, support trends, known issues, proposed mitigations"
      presenter: "CA Agent / SA Agent"
      technique: "Surface challenges proactively with open-ended questions. Use Problem Tree Analysis for root causes. Normalize challenges as part of the growth journey."
      discovery_questions:
        - "What's been the biggest challenge achieving your team goals this quarter?"
        - "Are there internal roadblocks slowing adoption?"
        - "If you could solve one problem with a magic wand, which would it be?"
      inputs: ["support_summary", "risk_register"]

    - section: "Co-Created Forward Roadmap"
      duration: "15-20 min"
      content: "Next quarter priorities, product roadmap alignment, mutual action plan, expansion where appropriate"
      presenter: "CA Agent / AE Agent"
      technique: "Co-create the roadmap collaboratively. Use Now/Next/Later prioritization. Present roadmap skeleton and invite customer to place their priorities. Frame expansion as value amplification, not sales push."
      inputs: ["product_roadmap", "expansion_opportunities", "customer_priorities"]

    - section: "Commitments and Next Steps"
      duration: "5-10 min"
      content: "Summarize decisions, assign action items with owners and deadlines, confirm next QBR date"
      presenter: "CA Agent"
      technique: "Every action item gets an owner (internal or customer), a deadline, and a success metric. Read back commitments to confirm alignment."

# ==============================================================================
# DECISION LOGIC (DLL Syntax)
# ==============================================================================
decision_logic:
  rules:
    - id: "adoption_below_target"
      condition: "$.adoption.overall_percentage < 60"
      severity: "HIGH"
      output_type: "Action + Risk"
      decision:
        title: "Adoption Below 60%, Corrective Action Required"
        context: "Low adoption threatens value realization and renewal"
        recommendation: "Agree on adoption acceleration plan with customer during QBR"
        actions:
          - "Identify top 3 adoption blockers with customer"
          - "SA Agent: Propose technical enablement sessions"
          - "Schedule follow-up adoption review in 30 days"
          - "Trigger adoption guidance playbook (PB_406)"
        stakeholders: ["CA", "SA", "Customer Champion"]
      creates:
        - object_type: "Risk"
          category: "adoption"
          severity: "HIGH"

    - id: "value_not_demonstrated"
      condition: "$.value_realization.evidence_count == 0"
      severity: "HIGH"
      output_type: "Action"
      decision:
        title: "No Documented Value Realization, Risk to Renewal"
        context: "Cannot demonstrate ROI to customer, weakens position at renewal"
        recommendation: "Prioritize value measurement before next QBR"
        actions:
          - "VE Agent: Conduct value assessment with customer"
          - "Identify and document at least 3 measurable outcomes"
          - "Create value realization dashboard for customer"
          - "Schedule dedicated value review session"
        stakeholders: ["CA", "VE Agent", "Customer Business Owner"]

    - id: "success_plan_stale"
      condition: "$.success_plan.last_updated > 90_days"
      severity: "MEDIUM"
      output_type: "Action"
      decision:
        title: "Success Plan Not Updated in 90+ Days"
        context: "Stale success plan means milestones may no longer reflect customer priorities"
        recommendation: "Refresh success plan as part of QBR"
        actions:
          - "Review and update milestones with customer"
          - "Add new objectives based on current priorities"
          - "Remove or defer milestones no longer relevant"
          - "Trigger success plan refresh (PB_402)"

    - id: "executive_disengaged"
      condition: "$.stakeholders.executive_sponsor.last_interaction > 60_days"
      severity: "MEDIUM"
      output_type: "Action"
      decision:
        title: "Executive Sponsor Not Engaged, Relationship Risk"
        context: "Executive sponsor has not been in contact for 60+ days"
        recommendation: "Re-engage executive sponsor through QBR invitation"
        actions:
          - "AE Agent: Send personal QBR invitation to executive sponsor"
          - "Prepare executive-level value summary (no technical details)"
          - "If sponsor declines, request 15-min executive briefing separately"
          - "Identify alternate executive contact if sponsor is unavailable"
        stakeholders: ["AE", "CA"]

    - id: "health_score_declining"
      condition: "$.health_score.trend == 'declining' AND $.health_score.current < 70"
      severity: "HIGH"
      output_type: "Risk + Action"
      decision:
        title: "Health Score Declining, Proactive Intervention Needed"
        context: "Account health deteriorating, QBR should address root causes"
        recommendation: "Address health drivers transparently in QBR"
        actions:
          - "Identify health score drivers causing decline"
          - "Prepare mitigation plan for each declining dimension"
          - "Discuss openly with customer and agree on joint actions"
          - "Trigger health triage (PB_CS_301) if score < 50"
      creates:
        - object_type: "Risk"
          category: "retention"
          severity: "HIGH"

    - id: "expansion_opportunity"
      condition: "$.adoption.overall_percentage > 80 AND $.customer.satisfaction == 'HIGH'"
      severity: "LOW"
      output_type: "Action"
      decision:
        title: "Strong Adoption and Satisfaction, Expansion Opportunity"
        context: "Customer is highly adopted and satisfied, ideal timing for growth conversation"
        recommendation: "Introduce expansion topics in forward-looking QBR section"
        actions:
          - "AE Agent: Prepare expansion talking points aligned to customer needs"
          - "SA Agent: Identify use cases for additional products"
          - "Frame expansion as value amplification, not sales push"
          - "If receptive, schedule dedicated expansion discovery"
        stakeholders: ["AE", "CA", "SA"]

    - id: "prior_actions_incomplete"
      condition: "$.prior_qbr.actions_completed_percentage < 50"
      severity: "MEDIUM"
      output_type: "Action"
      decision:
        title: "Prior QBR Action Items Incomplete, Credibility Risk"
        context: "Less than half of prior QBR actions completed, undermines trust"
        recommendation: "Address incomplete actions transparently and recommit"
        actions:
          - "Review each incomplete action: root cause and revised plan"
          - "Escalate internally if resource constraints caused delays"
          - "Propose realistic timeline for outstanding items"
          - "Do not create new action items until prior ones resolved"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/external-infohub/reviews/qbr_{YYYY}_Q{N}.md"
    format: "markdown"
    sections:
      - executive_summary
      - adoption_progress
      - value_delivered
      - success_plan_status
      - challenges_and_mitigations
      - forward_plan
      - action_items

    schema:
      executive_summary:
        - account_name: "string"
        - quarter: "string"
        - health_score: "integer"
        - health_trend: "enum[improving|stable|declining]"
        - adoption_percentage: "number"
        - key_achievements: "array[string]"
        - key_concerns: "array[string]"
        - overall_sentiment: "enum[positive|neutral|concerned]"

      adoption_progress:
        - use_cases: "array[use_case_status]"
        - overall_adoption: "number (percentage)"
        - active_users: "integer"
        - usage_trend: "enum[growing|stable|declining]"
        - blockers: "array[string]"

      value_delivered:
        - outcomes_achieved: "array[outcome]"
        - roi_evidence: "array[metric]"
        - value_vs_business_case: "enum[exceeding|on_track|behind|unknown]"

      success_plan_status:
        - milestones_completed: "array[milestone]"
        - milestones_in_progress: "array[milestone]"
        - milestones_deferred: "array[milestone]"
        - new_milestones_added: "array[milestone]"
        - plan_health: "enum[on_track|at_risk|off_track]"

      challenges_and_mitigations:
        - challenge: "string"
        - impact: "enum[HIGH|MEDIUM|LOW]"
        - mitigation: "string"
        - owner: "string"
        - status: "enum[open|in_progress|resolved]"

      forward_plan:
        - next_quarter_objectives: "array[string]"
        - product_roadmap_alignment: "array[string]"
        - training_needs: "array[string]"
        - expansion_discussion: "string (if applicable)"

      action_items:
        - action: "string"
        - owner: "string (internal or customer)"
        - due_date: "date"
        - priority: "enum[HIGH|MEDIUM|LOW]"

  updated_success_plan:
    path: "{realm}/{node}/external-infohub/planning/success_plan.yaml"
    format: "yaml"
    update_if: "New milestones agreed or existing milestones revised"

  action_objects:
    path: "{realm}/{node}/internal-infohub/actions/"
    create_for_each: "Action item assigned to internal team"

  customer_action_objects:
    path: "{realm}/{node}/external-infohub/actions/"
    create_for_each: "Action item assigned to customer"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Customer QBR completed for {node}: health {health_score}, adoption {adoption_percentage}%"

    - recipient: "SA Agent"
      condition: "technical_actions.count > 0"
      message: "QBR produced {count} technical action items for {node}"

    - recipient: "Sales Leadership"
      condition: "$.health_score.current < 50 OR $.expansion_opportunity == true"
      message: "QBR alert for {node}: {alert_summary}"

    - recipient: "VE Agent"
      condition: "$.value_realization.evidence_count == 0"
      message: "Value realization gap identified for {node}, assessment needed"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "customer_escalation_during_qbr"
      reason: "Customer raises unresolved escalation or dissatisfaction"
      action: "CA to pause QBR flow, acknowledge, and commit to follow-up within 48h"

    - condition: "$.health_score.current < 40 AND $.contract.renewal_date - today <= 120"
      reason: "Critically low health with renewal approaching"
      action: "Escalate to AE and Sales Leadership for executive intervention"

    - condition: "executive_sponsor_demands_change"
      reason: "Executive sponsor requests significant scope or relationship change"
      action: "Pause, document request, schedule follow-up with AE and leadership"

  insufficient_data:
    - "Health score not calculated or stale (> 7 days)"
    - "No success plan exists for the account"
    - "No adoption data available"

  ambiguity_signals:
    - "Customer provides conflicting feedback from different stakeholders"
    - "Success metrics not agreed between vendor and customer"
    - "QBR attendees lack decision-making authority"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Health score current (< 7 days stale)"
    - "Success plan exists and has active milestones"
    - "Customer attendees confirmed including at least one decision maker"
    - "Prior QBR action items status updated"

  post_execution:
    - "QBR summary sent to customer within 48 hours"
    - "All action items assigned with owners and due dates"
    - "Success plan updated if milestones changed"
    - "Next QBR date scheduled"
    - "Health score updated if assessment changed"

  output_quality:
    - "Value claims supported by data or evidence"
    - "Action items are specific, measurable, and time-bound"
    - "Customer voice captured (not just vendor perspective)"
    - "Forward plan aligns with customer's stated priorities"

# ==============================================================================
# ENGAGEMENT TRACK VARIATIONS
# ==============================================================================
engagement_track_overlay:
  premium:
    frequency: "Quarterly"
    attendees: "Executive sponsor, business owner, technical lead, champion"
    depth: "Full QBR with all sections"
    preparation_time: "2 weeks"
    follow_up: "Within 24 hours"

  economy:
    frequency: "Semi-annual"
    attendees: "Business owner, technical lead"
    depth: "Focused on adoption and value, abbreviated agenda"
    preparation_time: "1 week"
    follow_up: "Within 48 hours"

  fast_track:
    frequency: "Monthly"
    attendees: "Full customer team + executive sponsor"
    depth: "Full QBR with additional operational metrics"
    preparation_time: "1 week (continuous data collection)"
    follow_up: "Within 24 hours"

# ==============================================================================
# STAKEHOLDER TAILORING
# ==============================================================================
stakeholder_tailoring:
  executive_decision_makers:
    personas: ["VP", "C-level", "Director"]
    focus: "Business impact, ROI, strategic vision"
    techniques:
      - "Translate data into actionable insights: 'Your team reduced time on {process} by 25%, translating to {business_impact}'"
      - "Keep discussion high-level, avoid granular technical details unless requested"
      - "Frame everything in terms of their priorities and strategic objectives"
      - "Show how adoption connects to their stated business goals, not just product metrics"
    discovery_questions:
      - "How does this align with your priorities for next quarter?"
      - "What business outcomes would make this investment indispensable?"
      - "Where do you see the greatest untapped opportunity?"

  procurement_and_finance:
    personas: ["Procurement Manager", "Finance Director", "Budget Owner"]
    focus: "Cost efficiency, total cost of ownership, ROI validation"
    techniques:
      - "Emphasize cost efficiency and total cost of ownership"
      - "Frame around ROI and value drivers with quantified evidence"
      - "Time discussions around renewal cycles and budget planning"
      - "Show cost avoidance and efficiency gains, not just feature adoption"
    discovery_questions:
      - "What's your process for evaluating success before renewal?"
      - "How do you measure the return on this investment internally?"
      - "What would strengthen the business case for continued investment?"

  end_users_and_champions:
    personas: ["Platform Admin", "Power User", "Team Lead", "Developer"]
    focus: "Daily workflows, efficiency gains, best practices"
    techniques:
      - "Focus on daily workflow improvements and time savings"
      - "Share peer success stories from similar roles at other organizations"
      - "Drive adoption through relatable examples, not abstract metrics"
      - "Acknowledge their expertise and build on their feedback"
    discovery_questions:
      - "What's been most helpful in your daily work?"
      - "What could we improve to make your workflow easier?"
      - "Are there features or capabilities you wish you had?"
      - "Would you be interested in sharing your experience with peers?"

  tailoring_principle: "87% of business buyers expect reps to function as trusted advisors. Tailor QBR content, language, and depth to each stakeholder persona present. When multiple personas attend, structure the agenda so executive content comes first, followed by operational detail."

# ==============================================================================
# CUSTOMER WINS FRAMEWORK
# ==============================================================================
customer_wins_framework:
  principle: "Lead with customer-driven success stories, not vendor metrics. Encourage customer stakeholders to champion their own achievements rather than relying solely on vendor-presented data."

  win_categories:
    - category: "Business Outcomes"
      examples: ["Revenue impact", "Cost savings", "Time reduction", "Risk mitigation"]
      framing: "Quantify in customer's terms, not vendor terminology"

    - category: "Operational Improvements"
      examples: ["Process efficiency", "Team productivity", "Reduced manual work"]
      framing: "Connect to specific workflows the customer cares about"

    - category: "Strategic Value"
      examples: ["Competitive advantage", "Innovation enablement", "Compliance achievement"]
      framing: "Link to customer's stated strategic priorities"

    - category: "Team Development"
      examples: ["Skills gained", "Certifications achieved", "Cross-team adoption"]
      framing: "Recognize the customer team's investment and growth"

  metrics_to_outcomes_technique:
    approach: "Convert raw usage data into outcome narratives"
    examples:
      - raw_metric: "30% increase in platform usage"
        outcome_narrative: "Your team is resolving incidents 30% faster, which translates to {hours} saved per week. Are there success stories your team would like to share?"
      - raw_metric: "15 new users onboarded"
        outcome_narrative: "Your {department} team has expanded their use of the platform to {use_case}. How has that impacted their workflow?"
      - raw_metric: "99.5% uptime achieved"
        outcome_narrative: "Your SLO targets have been met consistently. Has this changed how your team allocates on-call resources?"

# ==============================================================================
# DISCOVERY QUESTIONS FOR SURFACING CHALLENGES
# ==============================================================================
discovery_questions:
  principle: "Surface challenges proactively using open-ended questions. Do not wait for the customer to raise issues. Create psychological safety by normalizing challenges as part of the growth journey."

  challenge_discovery:
    - "What's been the biggest challenge achieving your team goals this quarter?"
    - "Are there internal roadblocks slowing adoption that we should know about?"
    - "If you could solve one problem with a magic wand, which would it be?"
    - "What's preventing your team from getting more value from the platform?"
    - "Where do you feel we could have supported you better?"

  strategic_discovery:
    - "What's changed in your organization's priorities since our last review?"
    - "Are there upcoming projects or initiatives where we could add value?"
    - "How is your leadership measuring the success of this investment?"
    - "What would make you confident about renewing and expanding?"

  co_creation_prompts:
    - "What should our mutual priorities be for the next quarter?"
    - "If we could focus on one thing together, what would have the biggest impact?"
    - "How would you like to see our partnership evolve over the next year?"
    - "What does an ideal support and engagement model look like for your team?"

  technique: "Use these questions throughout the QBR, not just in the challenges section. Weave discovery into value discussion and forward planning. Listen for signals that indicate expansion opportunities, risk factors, or organizational changes."

# ==============================================================================
# INTERACTIVE COLLABORATION TECHNIQUES
# ==============================================================================
interactive_techniques:
  principle: "A successful QBR is an interactive discussion, not a one-sided presentation. One-sided presentations are not worth synchronized meeting time. Use collaborative techniques to engage all attendees."

  techniques:
    - name: "Problem Tree Analysis"
      when: "Challenges section, when exploring root causes of adoption blockers"
      how: "Map the challenge at the root, contributing factors as branches, symptoms as leaves. Co-create with customer."

    - name: "Now / Next / Later Prioritization"
      when: "Action planning section, when organizing mutual commitments"
      how: "Categorize action items into immediate (now), next quarter (next), and long-term (later). Assign owners and deadlines for 'now' items."

    - name: "Roadmap Co-Creation"
      when: "Forward-looking section, replacing prescriptive next steps"
      how: "Present a one-year roadmap skeleton and invite customer to place their priorities on it. Mark progress with checkmarks to show momentum."

    - name: "Round-Robin Feedback"
      when: "Any section where multiple stakeholders are present"
      how: "Give each attendee 2 minutes to share their perspective before group discussion. Ensures quieter voices are heard."

    - name: "Success Storytelling"
      when: "Customer wins section"
      how: "Invite the customer champion to share a 2-minute anecdote about a real pain point resolved. Emotional outcomes (frustration → relief, confusion → clarity) resonate more than metrics alone."

  co_creation_principle: "Guide customers to define mutual success through collaborative planning rather than prescriptive next steps. The customer should leave feeling they shaped the direction, not that they were told what to do."

