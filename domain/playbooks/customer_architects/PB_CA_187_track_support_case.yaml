# PLAYBOOK: Track Support Case
# Process incoming support signals and maintain the account's support profile
# Version 1.0 - Signal-driven architecture (Support Agent dissolved 2026-02)

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
steckbrief:
  playbook_id: "PB_CA_187"
  name: "Track Support Case"
  category: "customer_architects"
  mode: "OPERATIONAL"
  version: "1.0"
  status: "DRAFT"

  one_liner: "Process incoming support health and repeat issue signals via SK_CA_001, update the account support profile, classify impact on account health, and create follow-up actions"
  framework_origin: "Support-to-Account Intelligence (C06)"

  owner_agent: "CA Agent"
  supporting_agents: ["AE Agent", "SA Agent"]

  triggers_summary:
    - "SIG_SUP_001: Support health metrics shifted (CSAT drop, SLA miss, ticket spike)"
    - "SIG_SUP_002: Same root cause detected across 3+ tickets within 30 days"
    - "CA manually reviews support activity for an account"

  anti_patterns:
    - "Account has no active support entitlement"
    - "Signal relates to a planned maintenance window or known outage"
    - "Issue is already tracked in an open risk or action item with identical root cause"
    - "Ticket is for a different node than the one in scope"

  key_inputs:
    - "SIG_SUP_001 or SIG_SUP_002 signal payload"
    - "Current health score (PB_CA_401 output)"
    - "Existing case log and support health profile"

  key_outputs:
    - artifact: "Updated case log entry"
      format: "yaml"
    - artifact: "Updated support health profile"
      format: "yaml"
    - artifact: "Risk or action item (conditional)"
      format: "yaml"

  key_decisions:
    - "Low-severity signal with stable health: log and monitor, no action item"
    - "High-severity signal or declining health: create risk + action item"
    - "Repeat issue classified as architecture gap: route to SA Agent"
    - "Repeat issue classified as adoption gap: route to adoption guidance (PB_CA_406)"

  complexity: "MEDIUM"
  estimated_inputs: 6
  estimated_rules: 5

  source_file: "domain/playbooks/customer_architects/PB_CA_187_track_support_case.yaml"
  last_updated: "2026-02-27"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Support-to-Account Intelligence"
framework_source: "C06 Support & DSE Engagement (Post-Sales Model)"
playbook_mode: "OPERATIONAL"
playbook_category: "relationship_governance"
intended_agent_role: "CA Agent (signal consumer via SK_CA_001)"
secondary_agents: ["AE Agent", "SA Agent"]

primary_objective: "Translate support health and repeat issue signals into account-level intelligence by updating the support case log, refreshing the support health profile, classifying root causes, and creating actionable follow-ups"

when_not_to_use:
  - "Account has no active support entitlement"
  - "Signal relates to planned maintenance or known outage"
  - "Identical root cause already tracked in an open risk or action item"
  - "Account is in planned offboarding"
  - "Escalation or critical incident signals (use PB_CA_188 instead)"

raci:
  responsible:
    role: "CA Agent"
    agent: "ca_agent"
    description: "Processes support health and repeat issue signals, updates case log, classifies impact, and creates follow-up actions"

  accountable:
    role: "Customer Success Manager"
    human_required: true
    description: "Reviews high-severity classifications and approves action plans before routing"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted:
    - role: "SA Agent"
      on_steps: ["repeat_issue_architecture_gap"]
    - role: "AE Agent"
      on_steps: ["ticket_spike_at_risk"]

  informed:
    - role: "AE Agent"
      notify_on: ["relationship_risk_detected", "csat_critically_low"]
    - role: "SA Agent"
      notify_on: ["architecture_gap_classified"]
    - role: "CA Lead"
      notify_on: ["high_severity_signal"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  signal_triggers:
    - signal: "SIG_SUP_001"
      name: "support_health_change"
      description: "CSAT dropped below 4.0, ticket volume spiked >50% WoW, or SLA compliance fell below 95%"
      priority: "MEDIUM"
      skill_entry: "SK_CA_001 step 1"

    - signal: "SIG_SUP_002"
      name: "repeat_issue_detected"
      description: "Same root cause appeared in 3+ tickets within 30 days"
      priority: "MEDIUM"
      skill_entry: "SK_CA_001 step 1"

  manual:
    - "CA reviews support activity during cadence call prep"
    - "AE requests support context before customer meeting"
    - "QBR preparation requires support data refresh (feeds PB_CA_174)"

  conditional:
    - condition: "$.support_health.csat_score < 3.5 AND $.support_health.trend == 'declining'"
      description: "CSAT critically low and still declining"

    - condition: "$.support_health.sla_compliance_pct < 90"
      description: "SLA compliance below acceptable threshold"

    - condition: "$.support_health.ticket_volume_trend == 'spike' AND $.health_score.current < 70"
      description: "Ticket spike on an already at-risk account"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
validation_inputs:
  mandatory:
    - artifact: "SIG_SUP_001 or SIG_SUP_002 signal payload"
      description: "Validated signal with realm_id, node_id, and metric fields"
    - artifact: "{realm}/{node}/internal-infohub/governance/health_score.yaml"
      description: "Current account health score and support component"

  optional:
    - artifact: "{realm}/{node}/internal-infohub/support/case_log.yaml"
      use: "Existing case log for append and pattern detection"
    - artifact: "{realm}/{node}/internal-infohub/support/support_health.yaml"
      use: "Historical support health profile"
    - artifact: "{realm}/{node}/internal-infohub/adoption/adoption_metrics.yaml"
      use: "Adoption context for root cause classification"
    - artifact: "{realm}/{node}/internal-infohub/risks/risk_register.yaml"
      use: "Check for duplicate risk entries before creating new ones"

  minimum_data_threshold:
    - "Signal payload passes SK_CA_001 step 1 validation"
    - "Account exists in InfoHub with basic context"

# ==============================================================================
# KEY QUESTIONS
# ==============================================================================
key_questions:
  signal_assessment:
    - "What type of support signal was received (health change or repeat issue)?"
    - "What are the specific metrics in the payload (CSAT, SLA, ticket volume, occurrence count)?"
    - "Is this a new pattern or an escalation of a known issue?"
    - "What is the current health score, and how does this signal affect it?"

  root_cause_classification:
    - "Does the issue stem from an adoption gap (usage, configuration, training)?"
    - "Does the issue indicate an architecture gap (integration, design, scalability)?"
    - "Does the issue represent a relationship risk (frustration, dissatisfaction, churn signal)?"
    - "Is there an expansion signal hidden in the support pattern (feature requests, growth patterns)?"

  impact_assessment:
    - "How does this signal change the support health component of the account health score?"
    - "Is the customer's business operation affected by this issue?"
    - "Could this issue affect the upcoming renewal or expansion conversation?"
    - "Does this warrant proactive outreach to the customer?"

  action_routing:
    - "Should this be logged as monitor-only or does it require an active response?"
    - "Which agent or human should own the follow-up action?"
    - "Does the SA Agent need to conduct an architecture review?"
    - "Should the AE Agent be alerted about commercial risk?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - id: "low_severity_stable"
      condition: "$.signal.severity == 'low' AND $.health_score.support_component >= 70"
      severity: "LOW"
      output_type: "Log Entry"
      decision:
        title: "Low-severity signal on healthy account, log and monitor"
        context: "Support metric shift is within tolerance for an account with healthy support profile"
        recommendation: "Update case log, no action item needed"
        actions:
          - "Append entry to case_log.yaml with signal details"
          - "Update support_health.yaml with latest metrics"
          - "No action item created, review at next cadence call"

    - id: "health_declining_signal"
      condition: "$.signal.name == 'support_health_change' AND $.signal.health_direction == 'declining'"
      severity: "MEDIUM"
      output_type: "Log Entry + Action Item"
      decision:
        title: "Support health declining for {node}"
        context: "CSAT, SLA, or ticket volume trending negatively"
        recommendation: "Create action item for CA to investigate and address root cause"
        actions:
          - "Append entry to case_log.yaml"
          - "Update support_health.yaml with declining metrics"
          - "Create action item: investigate support health decline"
          - "If CSAT < 3.5: notify AE Agent about relationship risk"
        stakeholders: ["CA"]

    - id: "ticket_spike_at_risk"
      condition: "$.signal.ticket_volume_trend == 'spike' AND $.health_score.current < 70"
      severity: "HIGH"
      output_type: "Risk + Action Item"
      decision:
        title: "Ticket spike on at-risk account {node}"
        context: "Support volume surging on an account already below healthy threshold"
        recommendation: "Create risk entry and escalate to account team"
        actions:
          - "Append entry to case_log.yaml"
          - "Create risk in risk_register.yaml: support overload on at-risk account"
          - "Notify AE Agent: commercial risk from support deterioration"
          - "Schedule urgent review with SA Agent if technical root cause suspected"
      creates:
        - object_type: "Risk"
          category: "support"
          severity: "HIGH"

    - id: "repeat_issue_adoption_gap"
      condition: "$.signal.name == 'repeat_issue_detected' AND $.classification == 'adoption_issue'"
      severity: "MEDIUM"
      output_type: "Action Item"
      decision:
        title: "Repeat support issue tied to adoption gap at {node}"
        context: "Same root cause recurring because users lack training or configuration knowledge"
        recommendation: "Route to adoption guidance, update adoption blocker list"
        actions:
          - "Append entry to case_log.yaml with adoption classification"
          - "Update adoption blocker list"
          - "Create action item: plan enablement session for affected area"
          - "Consider triggering PB_CA_406 (Adoption Guidance) if pattern is broad"
        stakeholders: ["CA"]

    - id: "repeat_issue_architecture_gap"
      condition: "$.signal.name == 'repeat_issue_detected' AND $.classification == 'architecture_gap'"
      severity: "HIGH"
      output_type: "Risk + Action Item"
      decision:
        title: "Repeat support issue indicates architecture gap at {node}"
        context: "Recurring issue tied to integration design, scalability, or structural limitation"
        recommendation: "Route to SA Agent for architecture review"
        actions:
          - "Append entry to case_log.yaml with architecture classification"
          - "Create risk in risk_register.yaml: architecture-driven repeat issue"
          - "Notify SA Agent: architecture review needed for {affected_component}"
          - "Create action item: schedule architecture review session"
        stakeholders: ["CA", "SA Agent"]
      creates:
        - object_type: "Risk"
          category: "architecture"
          severity: "HIGH"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/support/case_log.yaml"
    format: "yaml"
    update_mode: "append"
    schema:
      case_entry:
        - date: "date"
        - signal_id: "string"
        - signal_name: "string"
        - summary: "string"
        - classification: "enum[adoption_issue|architecture_gap|relationship_risk|expansion_signal|monitoring_only]"
        - severity: "enum[LOW|MEDIUM|HIGH]"
        - metrics_snapshot:
            csat_score: "float (nullable)"
            sla_compliance_pct: "float (nullable)"
            ticket_volume_trend: "string (nullable)"
            occurrence_count: "integer (nullable)"
        - action_created: "boolean"
        - action_reference: "string (nullable)"

  support_health_update:
    path: "{realm}/{node}/internal-infohub/support/support_health.yaml"
    format: "yaml"
    update_mode: "replace"
    schema:
      - last_signal_date: "date"
      - csat_current: "float"
      - csat_trend: "enum[improving|stable|declining]"
      - sla_compliance_pct: "float"
      - ticket_volume_trend: "enum[decreasing|stable|increasing|spike]"
      - repeat_issue_count: "integer"
      - open_risks: "array[string]"
      - health_assessment: "enum[healthy|attention|at_risk|critical]"

  conditional_outputs:
    risk_object:
      path: "{realm}/{node}/internal-infohub/risks/"
      create_if: "severity == HIGH or classification == architecture_gap"

    action_item:
      path: "{realm}/{node}/internal-infohub/actions/"
      create_if: "severity >= MEDIUM"

  notifications:
    - recipient: "AE Agent"
      condition: "$.signal.csat_score < 3.5 OR $.classification == 'relationship_risk'"
      message: "Support risk at {node}: {signal_name}, CSAT {csat_score}"

    - recipient: "SA Agent"
      condition: "$.classification == 'architecture_gap'"
      message: "Architecture review needed for {node}: repeat issue in {affected_component}"

    - recipient: "CA Lead"
      condition: "$.severity == 'HIGH'"
      message: "High-severity support signal at {node}: {signal_name}"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "$.signal.csat_score < 3.0 AND $.health_score.current < 50"
      reason: "Critically low satisfaction on a critically unhealthy account"
      action: "Escalate to CA Lead and AE for immediate customer outreach"

    - condition: "$.repeat_issue.occurrence_count >= 10"
      reason: "Issue frequency indicates systemic failure beyond normal triage"
      action: "Escalate to SA Lead for engineering review"

  insufficient_data:
    - "Signal payload missing required fields (fails SK_CA_001 step 1 validation)"
    - "Account does not exist in InfoHub"
    - "Health score not available for the account"

  ambiguity_signals:
    - "Root cause classification unclear, could be adoption or architecture"
    - "Signal metrics conflict (e.g., CSAT improving but ticket volume spiking)"
    - "Multiple nodes affected but signal references only one"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Signal payload contains realm_id and node_id"
    - "Signal type is SIG_SUP_001 or SIG_SUP_002 (not escalation or critical)"
    - "Account exists in InfoHub with basic context"
    - "No duplicate entry for same signal_id and date in case log"

  post_execution:
    - "Case log entry created with all required fields"
    - "Support health profile updated with latest metrics"
    - "Classification assigned (not left as 'unknown')"
    - "Action item created if severity >= MEDIUM"
    - "Risk entry created if severity == HIGH"
    - "Appropriate agents notified based on classification"

  output_quality:
    - "Classification is specific, references signal payload data"
    - "Action items have clear owners and due dates"
    - "Risk entries include mitigation recommendations"
    - "Support health assessment reflects cumulative pattern, not just latest signal"

# ==============================================================================
# INTEGRATION WITH OTHER PLAYBOOKS
# ==============================================================================
integrates_with:
  - playbook: "PB_CA_188_escalate_support_issue"
    integration: "Tracked cases that escalate are handed off to PB_CA_188"
    trigger: "SIG_SUP_003 or SIG_SUP_004 received for a tracked case"

  - playbook: "PB_CA_190_review_support_health"
    integration: "Case log and support health feed quarterly review"
    provides: "Cumulative support data for trend analysis"

  - playbook: "PB_CA_174_customer_qbr"
    integration: "Support health data feeds QBR support section"
    provides: "Case log summary, support health assessment"

  - playbook: "PB_CA_401_customer_health_score"
    integration: "Support classification updates health score support component"
    provides: "Support health factor input"

  - playbook: "PB_CA_406_adoption_guidance"
    integration: "Adoption-classified repeat issues trigger adoption intervention"
    trigger: "Classification == adoption_issue with broad pattern"

  - playbook: "PB_CA_301_health_triage"
    integration: "High-severity support signals may trigger health triage"
    trigger: "Support signal pushes health score below threshold"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "5-15 minutes per signal"
frequency: "On signal receipt (event-driven)"
human_review_required: false
approval_workflow:
  - reviewer: "CA"
    condition: "severity == HIGH"
    approval_gate: "Validate classification and action plan before routing"

last_updated: "2026-02-27"
version: "1.0"
status: "DRAFT"
notes: "C06 playbook. CA Agent processes SIG_SUP_001 and SIG_SUP_002 via SK_CA_001. Support Agent was dissolved 2026-02; support intelligence is now signal-driven."
