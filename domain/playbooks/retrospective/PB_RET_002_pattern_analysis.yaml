# disclaimer
# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (MEDDPICC, Five Whys, SWOT,
# etc.) are industry-standard methodologies cited for
# educational context.

# PLAYBOOK: Cross-Deal Pattern Analysis and Process Improvement
# Aggregate retrospective analysis for organizational learning

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_RET_002"
framework_name: "Cross-Deal Pattern Analysis"
framework_source: "Statistical Process Control + Continuous Improvement (Deming Cycle)"
intended_agent_role: "retrospective-agent"
secondary_agents: ["CI Agent provides competitive trend context", "SA Agent provides technical pattern validation", "AE Agent provides deal pipeline context"]
playbook_mode: "ANALYTICAL"
playbook_category: "governance"

primary_objective: "Aggregate findings across multiple completed retrospectives to detect recurring win/loss patterns, identify systemic process gaps, generate process improvement recommendations, and distribute actionable knowledge across the organization"

vault_routing:
  primary_vault: "Global Knowledge Vault"
  rationale: "Cross-deal pattern analysis produces anonymized organizational intelligence: win/loss trends, competitor patterns, and process improvement recommendations that benefit all teams regardless of region or segment."
  secondary_outputs:
    - vault: "Internal Account Hub"
      artifact: "Account-specific lessons learned summaries and segment-specific competitive briefs"

flow_bindings:
  description: "Maps playbook phases to the retrospective agent flows that execute them"
  bindings:
    - phase: "pattern_identification"
      agent: retrospective-agent
      flow: pattern-analysis
      step: 1
      prompt: retrospective-identify-patterns
      context: "Aggregate retrospective data across completed deals to find recurring win and loss patterns by factor, competitor, segment, and deal size"
    - phase: "trend_analysis"
      agent: retrospective-agent
      flow: pattern-analysis
      step: 2
      prompt: retrospective-trend-analysis
      context: "Analyze trends over time periods: win rate shifts, emerging competitor patterns, recurring process failures, and seasonal factors"
    - phase: "pattern_report_generation"
      agent: retrospective-agent
      flow: pattern-analysis
      step: 3
      prompt: retrospective-generate-pattern-report
      context: "Create periodic pattern report for leadership with trend data, frequency analysis, and prioritized findings"
    - phase: "lessons_summary_creation"
      agent: retrospective-agent
      flow: knowledge-sharing
      step: 1
      prompt: retrospective-create-lessons-summary
      context: "Create shareable lessons learned summary aggregated from multiple retrospectives, anonymized for broad distribution"
    - phase: "competitive_brief_creation"
      agent: retrospective-agent
      flow: knowledge-sharing
      step: 2
      prompt: retrospective-create-competitive-brief
      context: "Extract and consolidate competitive insights across retrospectives for CI team and sales community"
    - phase: "product_feedback_creation"
      agent: retrospective-agent
      flow: knowledge-sharing
      step: 3
      prompt: retrospective-create-product-feedback
      context: "Document aggregated product feedback from loss retrospectives with frequency, customer evidence, and competitive context"

when_not_to_use:
  - "Fewer than 5 completed retrospectives in the analysis window (insufficient sample)"
  - "All retrospectives in the window are from a single deal type or segment (bias risk)"
  - "Active organizational restructuring that invalidates historical process patterns"
  - "Retrospective data quality is below threshold (incomplete root causes, missing categories)"

raci:
  responsible:
    role: "Retrospective Agent"
    agent: "retrospective-agent"
    description: "Aggregates retrospective data, identifies cross-deal patterns, generates trend analysis, creates process improvement recommendations, and distributes knowledge artifacts"

  accountable:
    role: "Sales Leadership"
    human_required: true
    description: "Reviews pattern analysis findings, prioritizes process improvements, allocates resources for corrective actions, and ensures organizational adoption of learnings"
    approval_actions:
      - "approve"
      - "request_revision"
      - "prioritize"
      - "escalate"

  consulted:
    - role: "CI Agent"
      on_steps: ["trend_analysis", "competitive_brief_creation"]
    - role: "SA Agent"
      on_steps: ["pattern_identification", "product_feedback_creation"]

  informed:
    - role: "AE Community"
      notify_on: ["pattern_report_published", "lessons_summary_distributed"]
    - role: "CI Agent"
      notify_on: ["competitive_brief_published", "competitor_pattern_detected"]
    - role: "Product Team"
      notify_on: ["product_feedback_published", "recurring_product_gap_detected"]
    - role: "Sales Leadership"
      notify_on: ["pattern_report_published", "process_improvement_recommended"]
    - role: "SA Community"
      notify_on: ["lessons_summary_distributed", "technical_pattern_detected"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "quarterly_cycle"
      description: "Scheduled quarterly pattern analysis aligned with business review cadence"
      timing: "Last week of each quarter"

    - event: "retrospective_threshold_reached"
      description: "Minimum number of new retrospectives completed since last analysis"
      condition: "$.retrospectives.completed_since_last_analysis >= 10"

    - event: "recurring_pattern_signal"
      description: "Same root cause category appears in 3+ retrospectives within rolling 90-day window"
      condition: "$.retrospectives.same_root_cause_count >= 3 AND $.retrospectives.window_days <= 90"

    - event: "win_rate_shift"
      description: "Win rate changed by more than 10 percentage points compared to prior quarter"
      condition: "ABS($.metrics.win_rate_current_quarter - $.metrics.win_rate_prior_quarter) >= 10"

  manual:
    - "Sales leadership requests cross-deal pattern analysis"
    - "CI Agent requests competitive trend analysis across retrospectives"
    - "Product team requests aggregated product feedback report"
    - "New sales process rollout requires baseline measurement"

  conditional:
    - condition: "$.retrospectives.competitive_losses_count >= 3 AND $.retrospectives.same_competitor_count >= 2"
      description: "Multiple losses to the same competitor warrant focused competitive pattern analysis"

    - condition: "$.retrospectives.product_gap_count >= 3"
      description: "Recurring product gap across multiple deals requires aggregated product feedback"

    - condition: "$.metrics.average_sales_cycle_days > $.benchmarks.target_sales_cycle_days * 1.25"
      description: "Average sales cycle exceeds target by 25%+, process analysis warranted"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Completed retrospective artifacts from PB_RET_001"
      description: "Minimum 5 completed retrospectives with root cause analysis and tagged learnings"
    - artifact: "Analysis time period"
      description: "Start and end dates for the pattern analysis window"
    - artifact: "Deal outcome data (win/loss counts, values)"
      description: "Aggregate deal metrics for the analysis period"

  optional:
    - artifact: "Prior pattern analysis reports"
      use: "Trend comparison against previous analysis periods"
    - artifact: "CRM pipeline and conversion data"
      use: "Correlation between retrospective findings and pipeline health"
    - artifact: "Competitor win/loss tracking data"
      use: "Competitive trend analysis"
    - artifact: "Product roadmap and recent releases"
      use: "Correlation between product gaps and roadmap coverage"
    - artifact: "Sales process documentation"
      use: "Map process improvement recommendations to current process stages"
    - artifact: "Prior process improvement action items and status"
      use: "Track implementation of previously recommended improvements"

  minimum_data_threshold:
    - "At least 5 completed retrospectives in the analysis window"
    - "Retrospectives span at least 2 different deal types or segments"
    - "Root cause categories assigned in at least 80% of retrospectives"
    - "Analysis period covers at least 30 days"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  pattern_identification:
    - "What are the most frequent root cause categories across losses (product, process, people, positioning, pricing)?"
    - "Which win factors appear most consistently across successful deals?"
    - "Are there segment-specific patterns (enterprise vs. mid-market, new logo vs. expansion)?"
    - "Do certain deal sizes correlate with specific win or loss patterns?"
    - "Are there team composition patterns that correlate with outcomes?"

  competitive_patterns:
    - "Which competitors appear most frequently in losses?"
    - "Are there recurring competitor tactics or positioning strategies?"
    - "Has any competitor's win rate against us changed over the analysis period?"
    - "Are competitive losses concentrated in specific segments or use cases?"
    - "What counter-strategies have proven effective when implemented?"

  trend_analysis:
    - "How has the win rate changed over the analysis period and prior periods?"
    - "Are new loss patterns emerging that were not present in prior analyses?"
    - "Are previously identified patterns improving or worsening?"
    - "What is the average sales cycle length trend and does it correlate with outcomes?"
    - "Are there seasonal or cyclical patterns in win/loss rates?"

  process_assessment:
    - "Which sales process stages show the highest correlation with losses?"
    - "Are there discovery gaps that consistently appear in loss retrospectives?"
    - "Do deals that follow specific process steps have measurably better outcomes?"
    - "What is the correlation between MEDDPICC completion and deal outcomes?"
    - "Are there resource allocation patterns (SA engagement timing, specialist involvement) that correlate with wins?"

  knowledge_distribution:
    - "Which lessons from individual retrospectives have the broadest applicability?"
    - "What competitive intelligence should be consolidated for the CI team?"
    - "What product feedback should be aggregated for the Product team?"
    - "Which win patterns should be formalized into playbook updates?"
    - "Are there segment-specific insights that need targeted distribution?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - id: "recurring_loss_pattern"
      condition: "$.patterns.loss_pattern.frequency >= 3 AND $.patterns.loss_pattern.controllable == true"
      severity: "HIGH"
      output_type: "Initiative + Action Items"
      decision:
        title: "Recurring controllable loss pattern detected: {pattern_description}"
        context: "Same root cause category appeared in {frequency} losses over {period}"
        recommendation: "Implement targeted process improvement to address systemic gap"
        actions:
          - "Create process improvement recommendation with specific corrective steps"
          - "Assign owner and deadline for implementation"
          - "Define success metric to measure improvement"
          - "Schedule follow-up analysis to validate effectiveness"
        stakeholders: ["Sales Leadership", "AE Community", "SA Community"]
      creates:
        - object_type: "Initiative"
          priority: "HIGH"

    - id: "competitor_trend_detected"
      condition: "$.patterns.competitor_losses >= 3 AND $.patterns.same_competitor_count >= 2"
      severity: "HIGH"
      output_type: "Initiative + Artifact"
      decision:
        title: "Competitor {competitor_name} winning pattern detected"
        context: "Lost to {competitor_name} in {count} deals over {period} with recurring tactics"
        recommendation: "Create consolidated competitive brief and update counter-strategy"
        actions:
          - "Retrospective Agent: Create competitive brief via knowledge-sharing flow"
          - "CI Agent: Update battlecards with aggregated intelligence"
          - "SA Community: Review and update technical differentiation for affected use cases"
          - "Sales Leadership: Consider strategic competitive response"
        stakeholders: ["CI Agent", "SA Community", "Sales Leadership"]
      creates:
        - object_type: "competitive_brief"
          priority: "HIGH"

    - id: "product_gap_recurring"
      condition: "$.patterns.product_gap_count >= 3"
      severity: "HIGH"
      output_type: "Risk + Artifact"
      decision:
        title: "Recurring product gap impacting win rate: {product_gap_description}"
        context: "Same product gap cited in {count} loss retrospectives over {period}"
        recommendation: "Escalate aggregated product feedback to Product team with evidence and competitive context"
        actions:
          - "Retrospective Agent: Create product feedback via knowledge-sharing flow"
          - "Product Team: Review aggregated feedback with frequency and revenue impact data"
          - "SA Community: Document current workarounds and positioning guidance"
        escalate_to: "Product Team"
      creates:
        - object_type: "product_feedback"
          priority: "HIGH"
        - object_type: "Risk"
          category: "product"
          severity: "HIGH"

    - id: "win_rate_decline"
      condition: "$.metrics.win_rate_trend == 'declining' AND $.metrics.decline_percentage >= 10"
      severity: "HIGH"
      output_type: "Risk + Initiative"
      decision:
        title: "Win rate declined by {decline_percentage}% over {period}"
        context: "Statistically significant decline in win rate warrants root cause investigation"
        recommendation: "Conduct focused analysis to identify drivers of decline"
        actions:
          - "Correlate decline with specific loss pattern categories"
          - "Assess whether decline is segment-specific or broad-based"
          - "Review whether new competitive dynamics are contributing"
          - "Sales Leadership: Review and prioritize response"
        stakeholders: ["Sales Leadership", "AE Community"]
      creates:
        - object_type: "Risk"
          category: "operational"
          severity: "HIGH"

    - id: "process_improvement_validated"
      condition: "$.prior_improvements.implemented == true AND $.metrics.related_loss_rate_decreased == true"
      severity: "LOW"
      output_type: "Initiative"
      decision:
        title: "Process improvement validated: {improvement_description}"
        context: "Previously recommended improvement shows measurable positive impact"
        recommendation: "Formalize as standard practice and share success story"
        actions:
          - "Update relevant playbooks to incorporate validated improvement"
          - "Share improvement success story with broader organization"
          - "Document before/after metrics for executive reporting"
        stakeholders: ["Sales Leadership", "AE Community"]

    - id: "replicable_win_pattern_systemic"
      condition: "$.patterns.win_pattern.frequency >= 5 AND $.patterns.win_pattern.consistency >= 0.7"
      severity: "LOW"
      output_type: "Initiative"
      decision:
        title: "Systemic win pattern confirmed: {pattern_description}"
        context: "Consistent win factor appearing in 70%+ of wins over {period}"
        recommendation: "Formalize win pattern into playbook guidance and training"
        actions:
          - "Create lessons summary via knowledge-sharing flow"
          - "Update sales and SA playbooks with validated win pattern"
          - "Develop training module or office hours session around the pattern"
          - "Monitor pattern adoption rate in subsequent deals"
        stakeholders: ["Sales Leadership", "AE Community", "SA Community"]

    - id: "insufficient_retrospective_coverage"
      condition: "$.metrics.retrospective_completion_rate < 0.7"
      severity: "MEDIUM"
      output_type: "Risk"
      decision:
        title: "Retrospective completion rate below target: {completion_rate}%"
        context: "Less than 70% of closed deals have completed retrospectives, limiting pattern detection accuracy"
        recommendation: "Address retrospective completion gaps before drawing strong conclusions"
        actions:
          - "Identify deals missing retrospectives and schedule catch-up"
          - "Review whether retrospective process has friction points"
          - "Sales Leadership: Reinforce retrospective completion expectations"
        stakeholders: ["Sales Leadership"]
      creates:
        - object_type: "Risk"
          category: "data_quality"
          severity: "MEDIUM"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "global-knowledge-vault/retrospectives/pattern_analysis_{YYYY}_Q{N}.md"
    format: "markdown"
    sections:
      - executive_summary
      - analysis_scope
      - win_patterns
      - loss_patterns
      - competitive_trends
      - process_assessment
      - trend_comparison
      - recommendations
      - appendix_data

    schema:
      executive_summary:
        - analysis_period: "string"
        - deals_analyzed: "integer"
        - retrospectives_included: "integer"
        - win_rate: "number (percentage)"
        - win_rate_trend: "enum[improving|stable|declining]"
        - top_win_pattern: "string"
        - top_loss_pattern: "string"
        - critical_findings_count: "integer"
        - recommendations_count: "integer"

      analysis_scope:
        - period_start: "date"
        - period_end: "date"
        - total_deals_closed: "integer"
        - retrospectives_completed: "integer"
        - completion_rate: "number (percentage)"
        - segments_covered: "array[string]"
        - deal_size_range: "string"

      win_patterns:
        - pattern: "string"
        - frequency: "integer"
        - consistency: "number (percentage across wins)"
        - segments: "array[string]"
        - example_deals: "array[string] (anonymized)"
        - replicability: "enum[HIGH|MEDIUM|LOW]"
        - recommended_action: "string"

      loss_patterns:
        - pattern: "string"
        - frequency: "integer"
        - root_cause_category: "enum[product|process|people|positioning|pricing|external]"
        - controllable: "boolean"
        - revenue_impact: "number"
        - segments: "array[string]"
        - trend_vs_prior_period: "enum[improving|stable|worsening|new]"
        - recommended_action: "string"

      competitive_trends:
        - competitor: "string"
        - encounters: "integer"
        - wins_against: "integer"
        - losses_to: "integer"
        - win_rate_against: "number (percentage)"
        - trend: "enum[improving|stable|declining]"
        - primary_loss_reasons: "array[string]"
        - primary_win_factors: "array[string]"

      process_assessment:
        - process_stage: "string"
        - correlation_with_outcomes: "string"
        - gap_identified: "boolean"
        - improvement_recommendation: "string"
        - prior_improvement_status: "enum[not_started|in_progress|completed|validated]"

      recommendations:
        - recommendation: "string"
        - priority: "enum[HIGH|MEDIUM|LOW]"
        - category: "enum[process|competitive|product|training|tooling]"
        - expected_impact: "string"
        - owner: "string"
        - deadline: "date"
        - success_metric: "string"

  process_improvement_recommendations:
    path: "global-knowledge-vault/retrospectives/process_improvements_{YYYY}_Q{N}.md"
    format: "markdown"
    create_if: "controllable_loss_patterns.count >= 1"

  competitive_brief:
    path: "global-knowledge-vault/competitive/retro_competitive_trends_{YYYY}_Q{N}.md"
    format: "markdown"
    create_if: "competitive_trends.count >= 1"

  product_feedback:
    path: "global-knowledge-vault/product/retro_product_feedback_{YYYY}_Q{N}.md"
    format: "markdown"
    create_if: "product_gap_patterns.count >= 1"

  lessons_summary:
    path: "global-knowledge-vault/retrospectives/lessons_summary_{YYYY}_Q{N}.md"
    format: "markdown"
    create_always: true

  notifications:
    - recipient: "Sales Leadership"
      condition: "always"
      message: "Quarterly pattern analysis complete: {deals_analyzed} deals, win rate {win_rate}% ({win_rate_trend}), {critical_findings_count} critical findings"

    - recipient: "CI Agent"
      condition: "competitive_brief_created == true"
      message: "Competitive trend brief published from retrospective pattern analysis: {competitors_covered}"

    - recipient: "Product Team"
      condition: "product_feedback_created == true"
      message: "Aggregated product feedback published: {product_gap_count} recurring gaps across {deal_count} deals"

    - recipient: "AE Community"
      condition: "lessons_summary_created == true"
      message: "Quarterly lessons summary published: {win_patterns_count} win patterns, {loss_patterns_count} loss patterns"

    - recipient: "SA Community"
      condition: "technical_patterns.count > 0"
      message: "Technical patterns identified in retrospective analysis: {technical_pattern_summary}"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "win_rate_decline_exceeds_20_percent"
      reason: "Significant win rate decline requires leadership attention and strategic response"
      action: "Present findings to Sales Leadership with urgency flag for executive review"

    - condition: "competitor_dominance_pattern"
      reason: "Single competitor winning 70%+ of contested deals"
      action: "Escalate to Sales Leadership and CI Agent for strategic competitive response"

    - condition: "systemic_process_failure"
      reason: "Same process gap appearing in 50%+ of losses"
      action: "Escalate for organizational process redesign, beyond incremental improvement"

    - condition: "data_quality_below_threshold"
      reason: "Retrospective completion rate below 50% makes pattern analysis unreliable"
      action: "Pause analysis, escalate retrospective completion gap to leadership"

  insufficient_data:
    - "Fewer than 5 completed retrospectives in the analysis window"
    - "Root cause categories missing in more than 30% of retrospectives"
    - "Analysis window shorter than 30 days"
    - "All retrospectives from single segment or deal type (insufficient diversity)"

  ambiguity_signals:
    - "Multiple contradictory patterns with similar frequency (cannot prioritize)"
    - "Correlation between patterns and outcomes is weak (r < 0.3)"
    - "New market dynamics (major competitor entry, product pivot) invalidate historical patterns"
    - "Sample size too small to distinguish pattern from noise"

  human_judgment_required:
    - "Prioritizing which patterns warrant organizational investment"
    - "Determining whether a pattern is systemic or coincidental"
    - "Allocating resources across competing improvement recommendations"
    - "Deciding which competitive responses require strategic vs. tactical action"
    - "Assessing whether product feedback warrants roadmap changes"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Minimum 5 completed retrospectives available in analysis window"
    - "Retrospective data includes root cause categories and tagged learnings"
    - "Analysis period defined with start and end dates"
    - "Prior pattern analysis available for trend comparison (if not first run)"
    - "Deal outcome metrics (win/loss counts, values) accessible"

  post_execution:
    - "All identified patterns supported by 3+ data points"
    - "Trend analysis includes comparison to at least one prior period (if available)"
    - "Process improvement recommendations are specific and actionable"
    - "Each recommendation has an owner, deadline, and success metric"
    - "Competitive briefs distributed to CI Agent"
    - "Product feedback distributed to Product Team"
    - "Lessons summary distributed to AE and SA communities"

  output_quality:
    - "Patterns distinguish between correlation and causation (no false causal claims)"
    - "Recommendations are prioritized by impact and feasibility"
    - "Competitive trends cite specific deal evidence (not generalizations)"
    - "Product feedback includes frequency counts and revenue impact estimates"
    - "All outputs maintain anonymization of deal-specific details in global artifacts"
    - "Statistical claims include sample size and confidence context"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "2-4 hours (agent analysis across retrospective corpus)"
frequency: "Quarterly (automatic), or when threshold of 10+ new retrospectives reached"
human_review_required: true
approval_workflow:
  - reviewer: "Sales Leadership"
    approval_gate: "Review pattern findings, prioritize recommendations, and approve distribution"
  - reviewer: "CI Agent"
    condition: "competitive_brief_created == true"
    approval_gate: "Validate competitive intelligence accuracy before distribution"
  - reviewer: "Product Team"
    condition: "product_feedback_created == true"
    approval_gate: "Review product feedback for roadmap relevance"

