# PLAYBOOK: Revenue Data Quality Review
# Framework operationalization for AI agents
# Audits CRM data hygiene and enforces governance standards

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_RO_001"
framework_name: "Revenue Data Quality Review"
framework_source: "Data Quality Management (DAMA-DMBOK)"
playbook_mode: "ASSESSMENT"
playbook_category: "revenue_operations"
intended_agent_role: "revops-director-agent"
secondary_agents: ["Senior Manager Agent", "AE Agent"]

primary_objective: "Audit CRM data hygiene scores, validate metric source definitions, monitor data freshness, and enforce governance standards across the revenue data estate"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Data quality metrics and governance findings are leadership-internal."

when_not_to_use:
  - "During active CRM migration or platform cutover"
  - "Fewer than 30 days since last major data import"
  - "No baseline data quality score established yet"
  - "Team is in ramp period with provisional data entry standards"

raci:
  responsible:
    role: "revops_director_agent"
    agent: "revops-director-agent"
    description: "Runs data quality audit, identifies gaps, sets remediation priorities"
  accountable:
    role: "revops_director"
    human_required: true
    description: "Approves data governance policy changes and remediation timelines"
  consulted:
    - role: "senior_manager_agent"
      on_steps: ["field_usage_patterns", "team_compliance_gaps"]
    - role: "account_executives"
      on_steps: ["crm_field_feedback", "data_entry_friction"]
  informed:
    - role: "vp_sales"
      notify_on: ["data_quality_score_change", "governance_policy_update"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "data_quality_score_drop"
      description: "CRM data quality score drops below 85%"
      condition: "$.data_quality.score < 85"
    - event: "duplicate_rate_exceeded"
      description: "Duplicate record rate exceeds 3% threshold"
      condition: "$.data_quality.duplicate_rate > 0.03"
    - event: "field_completeness_drop"
      description: "Required field completeness rate falls below 90%"
      condition: "$.data_quality.field_completeness < 0.90"
    - event: "data_freshness_alert"
      description: "Critical records not updated within freshness window"
      condition: "$.data_quality.stale_records_pct > 0.10"

  manual:
    - "Weekly data quality score review"
    - "Monthly field completeness audit"
    - "Quarterly data governance review"
    - "Post-import data validation"

  conditional:
    - condition: "$.crm.records_created_last_30d > 500"
      description: "High volume data entry period requires quality check"
    - condition: "$.data_quality.days_since_last_audit >= 30"
      description: "Monthly audit cadence exceeded"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
validation_inputs:
  mandatory:
    - description: "CRM data quality score (automated hygiene scan)"
    - description: "Field completeness rates by object type"
    - description: "Duplicate record report"
    - description: "Data freshness timestamps for critical objects"

  optional:
    - description: "Previous audit findings and remediation status"
      use: "Track remediation progress against prior gaps"
    - description: "Team-level data entry compliance rates"
      use: "Identify teams needing targeted enablement"
    - description: "Metric source definitions and data dictionary"
      use: "Validate metric definitions against actual data"

  minimum_data_threshold:
    - "CRM data quality score available"
    - "At least one object type with completeness data"
    - "Duplicate scan completed within last 7 days"

# ==============================================================================
# STEPS
# ==============================================================================
steps:
  - step_id: "hygiene_scan"
    name: "Run automated hygiene scoring across all CRM objects"
  - step_id: "field_completeness"
    name: "Measure field completeness rates by object and team"
  - step_id: "duplicate_detection"
    name: "Identify duplicate records and orphaned data"
  - step_id: "freshness_check"
    name: "Check data freshness against thresholds"
  - step_id: "impact_ranking"
    name: "Rank data gaps by downstream reporting impact"
  - step_id: "metric_validation"
    name: "Validate metric definitions against data sources"
  - step_id: "team_mapping"
    name: "Map data quality issues to specific teams or process gaps"
  - step_id: "remediation_assignment"
    name: "Assign remediation owners for top-priority gaps"
  - step_id: "cleanup_procedures"
    name: "Define cleanup procedures: deduplication, enrichment, archival"
  - step_id: "target_dates"
    name: "Set target dates and success metrics for each remediation"
  - step_id: "dictionary_update"
    name: "Update data dictionary with new field definitions"
  - step_id: "scorecard_distribution"
    name: "Distribute data quality scorecard to stakeholders"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "revops_outputs/data_quality/data_quality_review_{YYYY_MM}.md"
    format: "markdown"
    sections:
      - data_quality_scorecard
      - field_completeness_by_object
      - duplicate_analysis
      - freshness_report
      - remediation_plan
      - governance_updates

  risk_objects:
    path: "revops_outputs/data_quality/risks/"
    create_if: "Data quality score below 70% or critical field completeness below 80%"

  notifications:
    - recipient: "VP Sales"
      condition: "data_quality.score_change > 5"
      message: "Data quality score changed by {score_change}%: review scorecard"
    - recipient: "Senior Manager Agent"
      condition: "team_compliance_gap"
      message: "Team data entry compliance below target: {team_name}"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "CRM data quality scan available and current"
    - "Duplicate detection report generated"
    - "Previous audit findings accessible"

  post_execution:
    - "Data quality score measured with documented methodology"
    - "Top 5 data gaps ranked by reporting impact"
    - "Remediation owners assigned with target dates"
    - "Scorecard distributed to affected teams"
    - "Data dictionary updated if definitions changed"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "30-60 minutes (automated scan + analysis)"
frequency: "Weekly score review, monthly deep audit, quarterly governance review"
human_review_required: true
notes: "Data quality is foundational: every downstream metric depends on CRM hygiene. Consistent scoring methodology prevents false alarms."

last_updated: "2026-03-22"
version: "1.0"
status: "draft"
