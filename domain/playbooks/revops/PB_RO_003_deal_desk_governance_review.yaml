# PLAYBOOK: Deal Desk Governance Review
# Framework operationalization for AI agents
# Manages deal approval workflows, pricing governance, and exception tracking

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_RO_003"
framework_name: "Deal Desk Governance Review"
framework_source: "Deal Desk Best Practices (TSIA / DealHub)"
playbook_mode: "ASSESSMENT"
playbook_category: "revenue_operations"
intended_agent_role: "revops-director-agent"
secondary_agents: ["AE Agent", "Senior Manager Agent", "VP Sales Agent", "Finance"]

primary_objective: "Review deal desk approval workflows, track pricing exceptions, enforce discount governance, and analyze deal structure patterns for policy improvement"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Deal pricing and approval data are leadership-internal."

when_not_to_use:
  - "Deal is within standard pricing guidelines (auto-approved)"
  - "No active deal desk requests pending"
  - "Pricing policy under active revision by finance"
  - "End-of-quarter rush without updated discount guardrails"

raci:
  responsible:
    role: "revops_director_agent"
    agent: "revops-director-agent"
    description: "Reviews deal structures, approves within threshold, tracks exceptions"
  accountable:
    role: "revops_director"
    human_required: true
    description: "Approves pricing exceptions and governance policy changes"
  consulted:
    - role: "account_executives"
      on_steps: ["deal_context", "customer_requirements"]
    - role: "senior_manager_agent"
      on_steps: ["strategic_deal_context", "discount_justification"]
  informed:
    - role: "vp_sales"
      notify_on: ["exception_above_threshold", "governance_policy_change"]
    - role: "finance"
      notify_on: ["non_standard_terms", "revenue_recognition_impact"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "discount_threshold_exceeded"
      description: "Deal discount exceeds standard threshold"
      condition: "$.deal.discount_pct > $.pricing.standard_threshold"
    - event: "non_standard_terms"
      description: "Non-standard payment or contract terms requested"
    - event: "multi_year_custom"
      description: "Multi-year contract with custom pricing structure"
    - event: "deal_desk_sla_breach"
      description: "Deal desk response time exceeds SLA"
      condition: "$.deal_desk.response_hours > $.sla.target_hours"

  manual:
    - "Weekly exception review cadence"
    - "Monthly governance report generation"
    - "AE submits deal desk request"
    - "Sales Director requests pricing guidance"

  conditional:
    - condition: "$.deal.value > 500000"
      description: "Deal value exceeds $500K auto-approval threshold"
    - condition: "$.deal.exception_count_qtd > 10"
      description: "Quarter exception count suggests policy gap"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
validation_inputs:
  mandatory:
    - description: "Deal desk request with deal context and discount justification"
    - description: "Standard pricing guidelines and discount matrix"
    - description: "Deal value, term length, and product mix"
    - description: "Customer account history and precedent deals"

  optional:
    - description: "Competitive pricing intelligence"
      use: "Validate discount justification against market"
    - description: "Customer lifetime value analysis"
      use: "Assess long-term margin impact"
    - description: "Similar deal precedent database"
      use: "Check consistency with prior exceptions"

  minimum_data_threshold:
    - "Deal value and discount percentage available"
    - "Standard pricing guidelines accessible"
    - "Customer account identified with history"

# ==============================================================================
# STEPS
# ==============================================================================
steps:
  - step_id: "request_intake"
    name: "Receive deal desk request with deal context and justification"
  - step_id: "classify_request"
    name: "Classify request type: discount, payment terms, custom pricing, bundling"
  - step_id: "auto_approval_check"
    name: "Check if request falls within auto-approval thresholds"
  - step_id: "precedent_search"
    name: "Search precedent database for similar exceptions"
  - step_id: "margin_calculation"
    name: "Calculate margin impact of requested terms"
  - step_id: "risk_assessment"
    name: "Assess risk: revenue recognition, renewal precedent, competitive dynamics"
  - step_id: "decision"
    name: "Approve within threshold or escalate with recommendation"
  - step_id: "condition_documentation"
    name: "Document decision rationale and any conditions"
  - step_id: "governance_logging"
    name: "Log exception in governance tracker with categorization"
  - step_id: "precedent_update"
    name: "Update pricing precedent database"
  - step_id: "weekly_summary"
    name: "Produce weekly exception summary with trend analysis"
  - step_id: "pattern_flagging"
    name: "Flag systematic patterns that warrant policy updates"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "revops_outputs/deal_desk/governance_review_{YYYY_MM}.md"
    format: "markdown"
    sections:
      - exception_summary
      - approval_decisions
      - margin_impact_analysis
      - trend_analysis
      - policy_recommendations

  decision_objects:
    path: "revops_outputs/deal_desk/decisions/"
    create_for_each: "deal desk approval or denial"

  notifications:
    - recipient: "VP Sales"
      condition: "exception_above_threshold"
      message: "Deal desk exception requires VP approval: {deal_name} ({discount_pct}%)"
    - recipient: "Finance"
      condition: "non_standard_revenue_terms"
      message: "Non-standard terms flagged for rev rec review: {deal_name}"
    - recipient: "AE Agent"
      condition: "decision_made"
      message: "Deal desk decision: {decision} for {deal_name}"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Deal context and justification provided"
    - "Standard pricing guidelines current"
    - "Customer account history accessible"

  post_execution:
    - "Precedent check completed before every approval"
    - "Margin impact calculated for non-standard deals"
    - "Exception logged with rationale in governance tracker"
    - "Weekly summary produced with trend analysis"
    - "Policy update recommendations documented if patterns found"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "15-30 minutes per deal review, 1 hour for weekly summary"
frequency: "Real-time for deal approvals, weekly exception review, monthly governance report"
human_review_required: true
notes: "Every exception sets a precedent. Consistent governance prevents margin erosion while maintaining deal velocity."

last_updated: "2026-03-22"
version: "1.0"
status: "draft"
