# PLAYBOOK: Tech Stack Assessment
# Framework operationalization for AI agents
# Evaluates GTM tech stack health, adoption rates, integration quality, and ROI

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_RO_004"
framework_name: "Tech Stack Assessment"
framework_source: "GTM Technology Management (Gartner Revenue Tech)"
playbook_mode: "ASSESSMENT"
playbook_category: "revenue_operations"
intended_agent_role: "revops-director-agent"
secondary_agents: ["Senior Manager Agent", "AE Agent", "IT"]

primary_objective: "Assess GTM tech stack health: license utilization, adoption rates, integration reliability, and total cost of ownership. Recommend additions, removals, or consolidation"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Tech stack costs, vendor evaluations, and adoption data are leadership-internal."

when_not_to_use:
  - "Active vendor contract negotiation (wait for final terms)"
  - "Tool deployed less than 90 days ago (insufficient adoption data)"
  - "IT security review pending for a tool under evaluation"
  - "Budget already locked for current fiscal year with no flex"

raci:
  responsible:
    role: "revops_director_agent"
    agent: "revops-director-agent"
    description: "Evaluates stack health, tracks adoption, recommends changes"
  accountable:
    role: "revops_director"
    human_required: true
    description: "Approves tool additions/removals and budget allocation"
  consulted:
    - role: "senior_manager_agent"
      on_steps: ["team_adoption_feedback", "workflow_friction"]
    - role: "account_executives"
      on_steps: ["tool_usability_feedback", "feature_gaps"]
  informed:
    - role: "vp_sales"
      notify_on: ["budget_impact_change", "stack_consolidation_recommendation"]
    - role: "it"
      notify_on: ["integration_issues", "security_requirements"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "utilization_below_threshold"
      description: "License utilization below 60% for any tool"
      condition: "$.tool.utilization_pct < 0.60"
    - event: "integration_failure_rate"
      description: "Integration error rate exceeds acceptable threshold"
      condition: "$.integration.error_rate > 0.02"
    - event: "contract_renewal_approaching"
      description: "Vendor contract renewal within 90 days"
      condition: "$.tool.days_to_renewal <= 90"

  manual:
    - "Quarterly tech stack review cadence"
    - "New tool evaluation request from team"
    - "Vendor raises pricing or changes terms"
    - "Annual budget planning cycle"

  conditional:
    - condition: "$.stack.total_tools > 15"
      description: "Tool count exceeds consolidation review threshold"
    - condition: "$.stack.yoy_cost_increase > 0.20"
      description: "Year-over-year stack cost increased more than 20%"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
validation_inputs:
  mandatory:
    - description: "License utilization data for each tool in GTM stack"
    - description: "Active usage rates: DAU/MAU by tool and team"
    - description: "Integration health metrics: sync reliability, error rates"
    - description: "Contract terms: cost, renewal date, commitment"

  optional:
    - description: "User satisfaction survey data"
      use: "Measure qualitative adoption beyond raw usage"
    - description: "Vendor product roadmap"
      use: "Assess future value and alignment"
    - description: "Competitive tool landscape analysis"
      use: "Identify better alternatives"
    - description: "IT security assessment results"
      use: "Factor compliance requirements into decisions"

  minimum_data_threshold:
    - "License count and utilization for all tools"
    - "At least 30 days of active usage data"
    - "Contract cost and renewal date available"

# ==============================================================================
# STEPS
# ==============================================================================
steps:
  - step_id: "utilization_audit"
    name: "Pull license utilization data for each tool in GTM stack"
  - step_id: "usage_measurement"
    name: "Measure active usage rates: DAU/MAU by tool and team"
  - step_id: "cost_per_user"
    name: "Calculate cost per active user across the stack"
  - step_id: "shelfware_identification"
    name: "Identify shelfware: tools with less than 60% utilization"
  - step_id: "sync_reliability"
    name: "Monitor data sync reliability between systems"
  - step_id: "error_rate_check"
    name: "Check integration error rates and latency"
  - step_id: "data_flow_validation"
    name: "Validate data flow completeness across lead-to-cash pipeline"
  - step_id: "workaround_identification"
    name: "Identify manual workarounds caused by integration gaps"
  - step_id: "satisfaction_survey"
    name: "Survey team satisfaction and friction points"
  - step_id: "feature_depth"
    name: "Measure feature adoption depth: basic vs advanced usage"
  - step_id: "stack_scorecard"
    name: "Produce stack scorecard: keep, consolidate, replace, add"
  - step_id: "roi_calculation"
    name: "Calculate ROI for recommended changes"
  - step_id: "adoption_plan"
    name: "Build adoption plan for any new tools"
  - step_id: "leadership_presentation"
    name: "Present recommendation with budget impact to leadership"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "revops_outputs/tech_stack/stack_assessment_{YYYY_QN}.md"
    format: "markdown"
    sections:
      - stack_scorecard
      - utilization_report
      - integration_health
      - adoption_metrics
      - roi_analysis
      - recommendations

  decision_objects:
    path: "revops_outputs/tech_stack/decisions/"
    create_for_each: "tool keep/consolidate/replace/add recommendation"

  notifications:
    - recipient: "VP Sales"
      condition: "budget_impact > 10000"
      message: "Tech stack recommendation has budget impact: ${budget_impact}"
    - recipient: "IT"
      condition: "integration_issues"
      message: "Integration health issues identified: {tool_name}"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Utilization data sourced from vendor analytics"
    - "Integration monitoring active and current"
    - "Contract details verified with procurement"

  post_execution:
    - "Utilization data sourced from vendor analytics, not estimates"
    - "ROI calculation includes adoption costs, not just license fees"
    - "Adoption plan included for every new tool recommendation"
    - "Budget impact quantified before presenting to leadership"
    - "Stack scorecard covers every tool in the GTM stack"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "2-3 hours (data collection + analysis)"
frequency: "Monthly adoption tracking, quarterly stack review, annual vendor evaluation"
human_review_required: true
notes: "The best tool is the one people actually use. Adoption feasibility matters more than feature count when evaluating new additions."

last_updated: "2026-03-22"
version: "1.0"
status: "draft"
