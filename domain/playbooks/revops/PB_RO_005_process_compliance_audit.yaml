# educational context.

# PLAYBOOK: Process Compliance Audit
# Framework operationalization for AI agents
# Measures sales process adherence and drives adoption improvements

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_RO_005"
framework_name: "Process Compliance Audit"
framework_source: "Sales Process Governance (Forrester Sales Enablement)"
playbook_mode: "ASSESSMENT"
playbook_category: "revenue_operations"
intended_agent_role: "revops-director-agent"
secondary_agents: ["Senior Manager Agent", "AE Agent"]

primary_objective: "Audit sales process compliance across CRM stages, qualification criteria, and workflow adherence. Identify gaps and coordinate enablement to improve adoption"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Process compliance data and team-level gaps are leadership-internal."

when_not_to_use:
  - "New sales process rolled out less than 30 days ago"
  - "Team is below 50% staffing (compliance data not representative)"
  - "CRM migration in progress affecting stage definitions"
  - "During fiscal year transition when stage mappings change"

raci:
  responsible:
    role: "revops_director_agent"
    agent: "revops-director-agent"
    description: "Measures compliance, identifies gaps, coordinates enablement response"
  accountable:
    role: "revops_director"
    human_required: true
    description: "Approves process changes and enablement priorities"
  consulted:
    - role: "senior_manager_agent"
      on_steps: ["team_compliance_context", "coaching_opportunities"]
    - role: "account_executives"
      on_steps: ["process_friction_feedback", "stage_criteria_clarity"]
  informed:
    - role: "vp_sales"
      notify_on: ["compliance_trend_change", "process_change_recommendation"]
    - role: "management"
      notify_on: ["team_compliance_scores", "enablement_schedule"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "stage_compliance_drop"
      description: "Stage compliance rate drops below 80%"
      condition: "$.compliance.stage_rate < 0.80"
    - event: "qualification_skip_rate"
      description: "Qualification criteria skip rate exceeds 15%"
      condition: "$.compliance.qualification_skip_rate > 0.15"
    - event: "process_rollout_tracking"
      description: "New process rollout needs adoption tracking"
      condition: "$.process.days_since_rollout >= 30 AND $.process.days_since_rollout <= 90"

  manual:
    - "Monthly compliance audit cadence"
    - "Post-training adoption measurement"
    - "Senior Manager requests team compliance data"
    - "Pre-QBR compliance snapshot"

  conditional:
    - condition: "$.compliance.win_rate_compliant > $.compliance.win_rate_noncompliant * 1.2"
      description: "Compliant deals win 20%+ more often, reinforcing adoption message"
    - condition: "$.compliance.backward_stage_moves > 5"
      description: "Excessive backward stage moves indicate unclear criteria"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
validation_inputs:
  mandatory:
    - description: "CRM stage progression data: forward moves, skips, backward moves, stalls"
    - description: "Qualification criteria completion rates (MEDDPICC fields, next steps, close dates)"
    - description: "Workflow adherence data: deal desk submissions, approval routing, handoff protocols"

  optional:
    - description: "Win rate correlation by compliance level"
      use: "Build business case for process adherence"
    - description: "Rep tenure and ramp status"
      use: "Contextualize compliance by experience level"
    - description: "Training completion records"
      use: "Correlate training with compliance improvement"
    - description: "Previous audit findings and remediation progress"
      use: "Track improvement trends"

  minimum_data_threshold:
    - "At least 50 active deals across measured stages"
    - "CRM stage progression data available"
    - "Qualification field completeness measurable"

# ==============================================================================
# STEPS
# ==============================================================================
steps:
  - step_id: "stage_progression"
    name: "Measure CRM stage progression compliance: skip rates, backward moves, stalled deals"
  - step_id: "qualification_completion"
    name: "Check qualification criteria completion: MEDDPICC fields, next steps, close dates"
  - step_id: "workflow_adherence"
    name: "Audit workflow adherence: deal desk submissions, approval routing, handoff protocols"
  - step_id: "team_scoring"
    name: "Score compliance by team, rep tenure, and deal size"
  - step_id: "impact_ranking"
    name: "Rank compliance gaps by revenue impact"
  - step_id: "win_rate_correlation"
    name: "Correlate compliance with win rates and cycle times"
  - step_id: "root_cause_analysis"
    name: "Identify root causes: training gap, process friction, tool limitation, unclear criteria"
  - step_id: "enablement_prioritization"
    name: "Prioritize enablement interventions by impact"
  - step_id: "training_coordination"
    name: "Coordinate training sessions for systematic gaps"
  - step_id: "process_simplification"
    name: "Simplify or clarify processes causing friction"
  - step_id: "crm_workflow_update"
    name: "Update CRM workflows to reduce manual compliance burden"
  - step_id: "target_setting"
    name: "Set compliance targets by team and gap area"
  - step_id: "adoption_monitoring"
    name: "Monitor adoption curves for process changes"
  - step_id: "trend_reporting"
    name: "Report compliance trends to leadership with week-over-week data"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "revops_outputs/compliance/process_compliance_audit_{YYYY_MM}.md"
    format: "markdown"
    sections:
      - compliance_scorecard
      - stage_progression_analysis
      - qualification_completeness
      - team_level_breakdown
      - root_cause_findings
      - enablement_plan
      - trend_data

  risk_objects:
    path: "revops_outputs/compliance/risks/"
    create_if: "Overall compliance below 70% or critical stage skip rate above 25%"

  notifications:
    - recipient: "VP Sales"
      condition: "compliance_trend_declining"
      message: "Process compliance trending down: {compliance_rate}% (was {prior_rate}%)"
    - recipient: "Senior Manager Agent"
      condition: "team_gap_identified"
      message: "Team compliance gap: {team_name} at {team_rate}% (target: {target_rate}%)"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "CRM stage progression data available and current"
    - "Sufficient deal volume for statistical relevance"
    - "Previous audit baseline available for trend comparison"

  post_execution:
    - "Compliance measured with objective CRM data, not self-reporting"
    - "Gap analysis includes root cause, not just symptom"
    - "Enablement response prioritized by revenue impact"
    - "Progress tracked with week-over-week trend data"
    - "Compliance targets set per team with clear measurement criteria"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "1-2 hours (data extraction + analysis)"
frequency: "Weekly compliance dashboard, monthly audit deep-dive, quarterly process review"
human_review_required: true
notes: "Process adoption matters more than process perfection. Focus enablement on the gaps that correlate with win rate improvement, not on 100% compliance for compliance sake."

last_updated: "2026-03-22"
version: "1.0"
status: "draft"
