# PLAYBOOK: Territory & Quota Planning
# Framework operationalization for AI agents
# Designs territory coverage models and allocates quotas

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_RO_002"
framework_name: "Territory & Quota Planning"
framework_source: "Sales Territory Design (Alexander Group methodology)"
playbook_mode: "GENERATIVE"
playbook_category: "revenue_operations"
intended_agent_role: "revops-director-agent"
secondary_agents: ["VP Sales Agent", "Senior Manager Agent", "AE Agent"]

primary_objective: "Model territory coverage, allocate quotas based on market potential and historical performance, run scenario analysis for headcount and compensation changes"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Territory models and quota allocations are leadership-internal."

when_not_to_use:
  - "Mid-quarter without executive approval for territory disruption"
  - "Fewer than 2 quarters of historical performance data available"
  - "Active M&A or org restructure without finalized headcount"
  - "Company revenue target not yet approved by board"

raci:
  responsible:
    role: "revops_director_agent"
    agent: "revops-director-agent"
    description: "Builds territory models, runs quota allocation scenarios, produces recommendation"
  accountable:
    role: "vp_sales"
    human_required: true
    description: "Approves territory assignments and quota targets"
  consulted:
    - role: "senior_manager_agent"
      on_steps: ["rep_capacity_input", "territory_feedback"]
    - role: "account_executives"
      on_steps: ["account_coverage_gaps", "territory_overlap"]
  informed:
    - role: "management"
      notify_on: ["territory_assignment_change", "quota_adjustment"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "annual_planning_cycle"
      description: "Annual territory and quota planning begins"
      timing: "Q4 each year"
    - event: "territory_imbalance_detected"
      description: "Top/bottom quintile potential gap exceeds 2x"
      condition: "$.territory.quintile_gap > 2.0"
    - event: "headcount_change"
      description: "Net headcount change exceeds 10% of team"
      condition: "$.org.headcount_change_pct > 0.10"

  manual:
    - "VP Sales requests territory redesign"
    - "New market segment or geography expansion"
    - "Post-acquisition territory integration"
    - "Quarterly quota adjustment review"

  conditional:
    - condition: "$.territory.coverage_ratio < 0.80"
      description: "Territory coverage dropped below 80% of addressable market"
    - condition: "$.quota.attainment_variance > 0.30"
      description: "Quota attainment variance across territories exceeds 30%"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
validation_inputs:
  mandatory:
    - description: "Account TAM/SAM data by segment and geography"
    - description: "Historical performance by territory: attainment, win rates, cycle times"
    - description: "Rep capacity data: ramp status, tenure, quota history"
    - description: "Company revenue target for planning period"

  optional:
    - description: "Market potential indexes from external sources"
      use: "Enrich territory potential scoring"
    - description: "Competitor territory coverage intelligence"
      use: "Identify competitive coverage gaps"
    - description: "Customer density and travel time analysis"
      use: "Optimize geographic territory design"
    - description: "Historical attrition and ramp curves"
      use: "Model quota capacity with realistic ramp assumptions"

  minimum_data_threshold:
    - "At least 2 quarters of historical territory performance"
    - "Account TAM data for 80%+ of addressable market"
    - "Current headcount and ramp status"

# ==============================================================================
# STEPS
# ==============================================================================
steps:
  - step_id: "tam_data_collection"
    name: "Gather account TAM/SAM data by segment and geography"
  - step_id: "historical_performance"
    name: "Pull historical performance: attainment, win rates, cycle times by territory"
  - step_id: "rep_capacity"
    name: "Collect rep capacity data: ramp status, tenure, quota history"
  - step_id: "market_potential"
    name: "Import market potential indexes from external sources"
  - step_id: "coverage_model"
    name: "Build coverage model: accounts per rep, travel radius, segment alignment"
  - step_id: "balance_analysis"
    name: "Run balance analysis: potential distribution across territories"
  - step_id: "gap_overlap"
    name: "Identify coverage gaps and overlap zones"
  - step_id: "scenario_design"
    name: "Model 2-3 territory design scenarios with tradeoffs"
  - step_id: "bottom_up_quota"
    name: "Calculate bottom-up quota using territory potential and win rates"
  - step_id: "top_down_validation"
    name: "Validate top-down quota against company revenue target"
  - step_id: "what_if_analysis"
    name: "Run what-if scenarios for headcount changes, ramp curves, attrition"
  - step_id: "recommendation"
    name: "Produce quota allocation recommendation with assumption log"
  - step_id: "leadership_review"
    name: "Present territory model and quota recommendation to VP Sales"
  - step_id: "crm_load"
    name: "Load territory and quota data into CRM"
  - step_id: "team_communication"
    name: "Communicate assignments to affected teams with transition plan"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "revops_outputs/planning/territory_quota_plan_{YYYY}.md"
    format: "markdown"
    sections:
      - territory_design_summary
      - coverage_model
      - quota_allocation
      - scenario_comparison
      - assumption_log
      - transition_plan

  decision_objects:
    path: "revops_outputs/planning/decisions/"
    create_for_each: "territory assignment or quota change"

  notifications:
    - recipient: "VP Sales"
      condition: "always"
      message: "Territory and quota model ready for review: {scenario_count} scenarios"
    - recipient: "Senior Manager Agent"
      condition: "territory_change"
      message: "Territory assignments updated for {team_name}"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Company revenue target approved"
    - "Account TAM data current (< 90 days)"
    - "Headcount plan finalized"

  post_execution:
    - "Territory model assumptions documented and validated"
    - "Quota allocation sums to company target within 2% tolerance"
    - "Scenario analysis covers at least 2 alternative designs"
    - "VP Sales approval obtained before CRM load"
    - "Transition plan includes rep communication timeline"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "2-4 hours (modeling + scenario analysis)"
frequency: "Annual with quarterly adjustment reviews"
human_review_required: true
notes: "Territory changes mid-year require VP Sales approval and 30-day transition period. Always model quota capacity with realistic ramp assumptions."

last_updated: "2026-03-22"
version: "1.0"
status: "draft"
