# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Mutual Action Plan (MAP)"
framework_source: "Outreach.io Success Plans methodology + Enterprise sales best practices"
playbook_mode: "GENERATIVE"
playbook_category: "pursuit_sales_support"
intended_agent_role: "ae-agent"
secondary_agents: ["SA Agent", "PS Agent", "VE Agent", "Delivery Agent"]

primary_objective: "Create and maintain a shared buyer-seller roadmap with agreed milestones, success criteria, and engagement tracking to accelerate deal velocity and increase win rates"

vault_routing:
  primary_vault: "Customer InfoHub"
  rationale: "The MAP document is co-created with the buyer and shared as a living document. Buyer-visible milestones, success criteria, and timeline live in the Customer InfoHub for shared visibility."
  secondary_outputs:
    - vault: "Internal Account Hub"
      artifact: "Engagement tracking metrics, buyer interaction signals, risk alerts, and internal deal strategy notes not shared with buyer"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized MAP completion patterns, milestone conversion rates, and engagement benchmarks (after deal closes)"

flow_bindings:
  description: "Maps playbook phases to the agent flows that execute them"
  bindings:
    - phase: "MAP Creation and Milestone Design"
      agent: ae-deal-diagnosis-agent
      flow: deal-diagnosis
      context: "Primary flow: co-create milestones with buyer, map success criteria to business outcomes, set timeline"
    - phase: "Stakeholder Alignment and Buying Committee Mapping"
      agent: ae-stakeholder-agent
      flow: stakeholder-intelligence
      context: "Supporting: identify buying committee members, track who has viewed/engaged with MAP, monitor champion health"
    - phase: "Pipeline and Forecast Integration"
      agent: ae-pipeline-mgmt-agent
      flow: pipeline-management
      context: "Supporting: link MAP milestone completion to stage progression, update forecast confidence based on engagement signals"
    - phase: "Engagement Signal Detection"
      agent: ae-signal-detection-agent
      flow: commercial-signal-detection
      context: "Supporting: monitor buyer engagement patterns, detect stall signals, flag competitive threats during evaluation"
    - phase: "MEDDPICC Alignment Check"
      agent: ae-meddpicc-agent
      flow: meddpicc-qualification
      context: "Supporting: validate MAP milestones align with MEDDPICC qualification dimensions, ensure decision process and paper process are reflected"

when_not_to_use:
  - "Transactional deal with single decision maker and <30 day cycle"
  - "Deal still in initial discovery, qualification incomplete"
  - "Customer explicitly declined shared planning process"
  - "Renewal-only with no expansion and strong health score (>80)"

raci:
  responsible:
    role: "AE Agent"
    agent: "ae_agent"
    description: "Creates MAP, coordinates milestone updates, monitors engagement tracking, and manages buyer-seller alignment"

  accountable:
    role: "Account Executive (Human)"
    human_required: true
    description: "Presents MAP to buyer, co-creates milestones in live sessions, and owns the buyer relationship"
    approval_actions:
      - "approve_map"
      - "adjust_milestones"
      - "escalate_stall"
      - "trigger_reengagement"

  consulted:
    - role: "SA Agent"
      on_steps: ["validation_milestones", "evaluation_milestones", "technical_success_criteria"]
    - role: "VE Agent"
      on_steps: ["education_milestones", "business_case_metrics", "success_criteria_definition"]
    - role: "PS Agent"
      on_steps: ["implementation_milestones", "resource_planning", "go_live_criteria"]
    - role: "Delivery Agent"
      on_steps: ["implementation_milestones", "post_go_live_success_criteria"]

  informed:
    - role: "Sales Leadership"
      notify_on: ["deal_stall_detected", "milestone_slippage_critical", "map_completion_rate_low"]
    - role: "SA Agent"
      notify_on: ["evaluation_milestone_activated", "technical_validation_required"]
    - role: "PS Agent"
      notify_on: ["procurement_milestone_started", "implementation_planning_triggered"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "opportunity_stage_2"
      description: "Deal reaches Stage 2 (Qualification) with confirmed opportunity"

    - event: "complex_deal_threshold"
      description: "Buying committee includes 3+ stakeholders"
      condition: "$.opportunity.stakeholder_count >= 3"

    - event: "extended_cycle_detected"
      description: "Deal cycle projected to exceed 60 days"
      condition: "$.opportunity.projected_cycle_days > 60"

    - event: "large_deal_threshold"
      description: "Opportunity exceeds $200K ARR"
      condition: "$.opportunity.arr >= 200000"

    - event: "expansion_approaching"
      description: "Existing customer expansion opportunity identified"
      condition: "$.account.type == 'expansion' AND $.opportunity.stage >= 2"

    - event: "renewal_approaching"
      description: "Renewal within 120 days with upsell potential"
      condition: "$.account.renewal_days_away <= 120 AND $.opportunity.upsell_potential == true"

  manual:
    - "AE requests MAP creation for strategic deal"
    - "Sales leadership mandates MAP for commit-forecast deals"
    - "Customer requests shared project plan"
    - "Champion asks for internal justification timeline"

  conditional:
    - condition: "$.meddpicc.total_score >= 12 AND $.opportunity.stage >= 2"
      description: "Minimally qualified deal ready for structured execution plan"

    - condition: "$.opportunity.competitive_situation == 'active' AND $.opportunity.stage >= 2"
      description: "Competitive deal benefits from structured buyer engagement"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
validation_inputs:
  mandatory:
    - artifact: "{account}/external-infohub/opportunities/{opportunity}/discovery.yaml"
      description: "Discovery findings with confirmed pain points and desired outcomes"
    - artifact: "{account}/external-infohub/context/stakeholder_map.yaml"
      description: "Buying committee map with roles, influence, and engagement status"
    - artifact: "Opportunity record"
      description: "SFDC opportunity with ARR, stage, close date, and deal type"
    - artifact: "{account}/external-infohub/opportunities/{opportunity}/meddpicc_assessment.yaml"
      description: "Current MEDDPICC scorecard for qualification alignment"

  optional:
    - artifact: "{account}/internal-infohub/competitive/competitive_context.yaml"
      use: "Competitive landscape to inform evaluation milestone design"
    - artifact: "{account}/external-infohub/planning/account_plan.md"
      use: "Strategic account context for success criteria alignment"
    - artifact: "Previous MAP documents"
      use: "Historical milestone patterns and engagement data for similar deals"
    - artifact: "{account}/external-infohub/opportunities/{opportunity}/requirements.yaml"
      use: "Technical and business requirements for evaluation criteria"
    - artifact: "Customer's internal procurement guidelines"
      use: "Procurement timeline and approval steps for procurement milestone"

  minimum_data_threshold:
    - "At least one confirmed pain point with business impact"
    - "Economic buyer or champion identified"
    - "Target close date established"
    - "Deal type determined (new business, expansion, renewal)"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  buyer_success_criteria:
    questions:
      - "What specific business outcomes does the buyer need to achieve?"
      - "How will the buyer measure whether this initiative succeeded?"
      - "What does 'done' look like from the buyer's perspective?"
      - "What internal metrics will improve if the project succeeds?"
      - "Who on the buyer side will evaluate whether success criteria are met?"
    evidence_required: ["Buyer-stated success criteria", "measurable outcomes", "evaluation owner"]

  decision_process:
    questions:
      - "What are the formal steps from evaluation to signed contract?"
      - "Who needs to approve at each step, and what information do they need?"
      - "Are there committee reviews, board approvals, or budget cycles that affect timing?"
      - "Has the buyer completed a similar procurement process recently, and how long did it take?"
      - "What could cause the process to stall or restart?"
    evidence_required: ["Approval chain", "process timeline", "historical cycle data"]

  timeline_and_urgency:
    questions:
      - "What is driving the buyer's target go-live date?"
      - "Are there external deadlines (regulatory, fiscal year, contract expiry) creating urgency?"
      - "What happens if the project slips by 30, 60, or 90 days?"
      - "Is there a compelling event that makes delay costly?"
    evidence_required: ["Compelling event", "deadline documentation", "cost of delay"]

  evaluation_criteria:
    questions:
      - "What criteria will the buyer use to compare vendors?"
      - "Which criteria are must-have versus nice-to-have?"
      - "Has the buyer defined evaluation criteria, or can we help shape them?"
      - "What proof points (references, POC, pilot) does the buyer need?"
    evidence_required: ["Evaluation scorecard", "must-have list", "proof point requirements"]

  procurement_requirements:
    questions:
      - "What is the legal and procurement review process?"
      - "Are there preferred contract vehicles (MSA, SOW, order form)?"
      - "What security, compliance, or vendor risk assessments are required?"
      - "Who leads procurement negotiations on the buyer side?"
    evidence_required: ["Procurement contact", "security requirements", "contract vehicle"]

  implementation_prerequisites:
    questions:
      - "What technical prerequisites must be in place before go-live?"
      - "Who on the buyer side will own implementation?"
      - "What internal resources (IT, security, data) does the buyer need to allocate?"
      - "Are there integration dependencies with other systems?"
      - "What training or change management is needed for adoption?"
    evidence_required: ["Technical prerequisites list", "buyer implementation owner", "resource commitment"]

# ==============================================================================
# MAP MILESTONE FRAMEWORK
# ==============================================================================
milestone_framework:
  description: "Five-phase milestone structure for MAP, adapted from Outreach.io Success Plans methodology. Each phase includes buyer-visible milestones and internal tracking milestones."

  phases:
    - phase: "1_education"
      name: "Education"
      purpose: "Buyer and seller align on the problem, its business impact, and whether this initiative warrants investment"
      buyer_milestones:
        - "Business problem and impact confirmed by executive sponsor"
        - "Success criteria co-defined and documented"
        - "Stakeholders identified and roles agreed"
        - "High-level solution approach reviewed"
      internal_milestones:
        - "Champion identified and validated"
        - "Economic buyer confirmed"
        - "MEDDPICC pain and metrics dimensions scored"
        - "Competitive landscape assessed"
      meddpicc_alignment: ["identify_pain", "metrics", "economic_buyer", "champion"]
      exit_criteria: "Buyer confirms problem is worth solving and agrees to proceed to validation"

    - phase: "2_validation"
      name: "Validation"
      purpose: "Buyer validates that the proposed solution addresses their requirements and use cases"
      buyer_milestones:
        - "Technical requirements documented and prioritized"
        - "Solution architecture reviewed with buyer's technical team"
        - "Reference customer conversations completed"
        - "Integration requirements mapped"
      internal_milestones:
        - "SA Agent: technical fit assessment completed"
        - "Decision criteria documented and influence strategy defined"
        - "Value hypothesis refined with buyer-specific data"
        - "Competitive differentiation positioned against known alternatives"
      meddpicc_alignment: ["decision_criteria", "competition"]
      exit_criteria: "Buyer confirms technical fit and agrees to proceed to formal evaluation"

    - phase: "3_evaluation"
      name: "Evaluation"
      purpose: "Buyer conducts formal evaluation (POC, pilot, or structured assessment) to build internal confidence"
      buyer_milestones:
        - "Evaluation plan agreed with scope, timeline, and success criteria"
        - "POC/pilot environment provisioned (if applicable)"
        - "Evaluation results reviewed against success criteria"
        - "Business case documented with quantified outcomes"
      internal_milestones:
        - "VE Agent: business case co-developed with buyer"
        - "POC/pilot support resources allocated"
        - "Evaluation scorecard tracked against competitor evaluations"
        - "Champion coaching: internal presentation support provided"
      meddpicc_alignment: ["decision_criteria", "metrics", "champion"]
      exit_criteria: "Buyer's evaluation team recommends proceeding to procurement"

    - phase: "4_procurement"
      name: "Procurement"
      purpose: "Buyer navigates internal procurement, legal, and security processes to reach contract execution"
      buyer_milestones:
        - "Procurement process and timeline confirmed"
        - "Security and compliance review initiated"
        - "Contract terms negotiated and agreed"
        - "Final approvals obtained from all required signatories"
      internal_milestones:
        - "Paper process contacts and timeline documented"
        - "Legal/security questionnaires completed"
        - "Executive alignment meeting scheduled if needed"
        - "Contract execution tracked against target close date"
      meddpicc_alignment: ["decision_process", "paper_process", "economic_buyer"]
      exit_criteria: "Contract signed and purchase order issued"

    - phase: "5_implementation"
      name: "Implementation"
      purpose: "Buyer transitions from purchase to value realization with structured onboarding and success tracking"
      buyer_milestones:
        - "Implementation kickoff completed with buyer team"
        - "Technical deployment milestones achieved"
        - "User training and change management completed"
        - "Go-live criteria met and confirmed"
        - "30/60/90 day success review scheduled"
      internal_milestones:
        - "Delivery Agent: implementation plan handed off"
        - "PS Agent: professional services resources allocated"
        - "Success criteria tracking dashboard activated"
        - "Expansion opportunity assessment scheduled for day 90"
      meddpicc_alignment: ["metrics"]
      exit_criteria: "Buyer confirms value realization against original success criteria"

  template_selection:
    new_business:
      phases: ["1_education", "2_validation", "3_evaluation", "4_procurement", "5_implementation"]
      typical_duration: "90-180 days"
      notes: "Full five-phase MAP, all milestones active"
    expansion:
      phases: ["1_education", "2_validation", "3_evaluation", "4_procurement", "5_implementation"]
      typical_duration: "45-90 days"
      notes: "Education phase compressed (existing relationship), validation focused on incremental requirements"
    renewal:
      phases: ["1_education", "3_evaluation", "4_procurement"]
      typical_duration: "30-60 days"
      notes: "Validation phase skipped (solution already deployed), evaluation focused on value realization review"

# ==============================================================================
# DECISION LOGIC (DLL Syntax)
# ==============================================================================
decision_logic:
  engagement_scoring:
    description: "Track buyer engagement with the MAP to predict deal health. Based on Outreach.io finding that deals with active buyer engagement show 26% higher win rates."
    metrics:
      - "Buyer views of MAP document (frequency and recency)"
      - "Milestone completion rate vs. planned timeline"
      - "Number of buying committee members actively engaging"
      - "Response time to action items assigned to buyer"
    green_threshold: "3+ buying committee members engaging, milestones on track, <48hr response time"
    yellow_threshold: "1-2 members engaging, 1 milestone slipped, 48-96hr response time"
    red_threshold: "No engagement in 7+ days, 2+ milestones slipped, no response to action items"

  rules:
    - id: "engagement_drop_off"
      condition: "$.map.buyer_engagement.last_interaction_days > 7"
      severity: "HIGH"
      output_type: "Risk + Action"
      decision:
        title: "Buyer Engagement Drop-Off Detected"
        context: "No buyer interaction with MAP in 7+ days. Deals with disengaged buyers are 3x more likely to stall or lose to no-decision."
        recommendation: "Activate re-engagement sequence through champion and parallel contacts"
        actions:
          - "Contact champion directly to understand internal situation"
          - "Send MAP progress summary to all buying committee members"
          - "Assess whether a compelling event has weakened or a competing priority has emerged"
          - "If champion unresponsive for 14+ days, activate multi-thread contingency"
        owner: "Account Executive"
      creates:
        - object_type: "Risk"
          category: "commercial"
          severity: "HIGH"

    - id: "milestone_slippage"
      condition: "$.map.milestones.slipped_count >= 1 AND $.map.milestones.slip_days > 7"
      severity: "MEDIUM"
      output_type: "Risk + Action"
      decision:
        title: "Milestone Slippage Detected"
        context: "One or more MAP milestones have slipped by more than 7 days. Accumulated slippage signals deal velocity decay."
        recommendation: "Diagnose root cause of slippage and reset timeline with buyer"
        actions:
          - "Identify which milestones slipped and whether they are buyer-side or seller-side"
          - "Discuss slippage with champion to understand blockers"
          - "Adjust downstream milestones to reflect realistic timeline"
          - "If buyer-side slippage, assess whether priority has shifted"
          - "Update forecast confidence based on revised timeline"
        owner: "Account Executive"
      creates:
        - object_type: "Risk"
          category: "commercial"
          severity: "MEDIUM"

    - id: "champion_change"
      condition: "$.map.champion.status == 'changed' OR $.map.champion.engagement == 'silent'"
      severity: "HIGH"
      output_type: "Risk + Action"
      decision:
        title: "Champion Change or Silence Detected"
        context: "The identified champion has changed roles, left the organization, or gone silent. Without an active champion, deal win probability drops significantly."
        recommendation: "Identify and develop replacement champion or activate multi-thread strategy"
        actions:
          - "Confirm champion status (role change, departure, competing priority)"
          - "Activate relationships with other buying committee contacts"
          - "Identify potential replacement champion with power, influence, and access to EB"
          - "Re-present MAP to new champion or alternate contact to maintain momentum"
          - "Update MEDDPICC champion dimension score"
        owner: "Account Executive"
      creates:
        - object_type: "Risk"
          category: "relationship"
          severity: "HIGH"

    - id: "competitive_threat_during_evaluation"
      condition: "$.map.phase == '3_evaluation' AND $.signals.competitive_threat == true"
      severity: "HIGH"
      output_type: "Risk + Action"
      decision:
        title: "Competitive Threat During Evaluation Phase"
        context: "Competitor activity detected during buyer's formal evaluation. Evaluation phase is the highest-risk period for competitive displacement."
        recommendation: "Accelerate differentiation activities and strengthen champion's internal positioning"
        actions:
          - "Request competitive intelligence update from CI Agent"
          - "SA Agent: prepare targeted technical differentiation materials"
          - "VE Agent: sharpen business case with metrics competitor cannot match"
          - "Provide champion with competitive counter-positioning for internal discussions"
          - "Consider accelerating evaluation timeline to reduce competitor window"
        owner: "Account Executive + SA Agent"
      creates:
        - object_type: "Risk"
          category: "competitive"
          severity: "HIGH"

    - id: "deal_stall"
      condition: "$.map.milestones.slipped_count >= 2 AND $.map.buyer_engagement.last_interaction_days > 14"
      severity: "HIGH"
      output_type: "Risk + Escalation"
      decision:
        title: "Deal Stall Detected - MAP Progress Halted"
        context: "Multiple milestones slipped combined with buyer disengagement. Deal is at high risk of no-decision outcome."
        recommendation: "Escalate to sales leadership, execute stall recovery protocol"
        actions:
          - "Sales leadership briefing on deal status and stall signals"
          - "Executive-to-executive outreach to buyer's economic buyer"
          - "Re-qualify deal using MEDDPICC to determine if fundamentals changed"
          - "If buyer confirms deprioritization, adjust forecast and consider deal pause"
          - "Document stall root cause for pattern learning"
        escalate_to: "Sales Leadership"
      creates:
        - object_type: "Risk"
          category: "commercial"
          severity: "HIGH"

    - id: "new_stakeholder_surfaced"
      condition: "$.map.buying_committee.new_member_detected == true"
      severity: "MEDIUM"
      output_type: "Action"
      decision:
        title: "New Stakeholder Surfaced in Buying Committee"
        context: "A previously unknown stakeholder has entered the decision process. Unmanaged stakeholders can derail deals at late stages."
        recommendation: "Update MAP, assess stakeholder stance, and schedule alignment"
        actions:
          - "Add stakeholder to buying committee map with role and influence assessment"
          - "Through champion, understand new stakeholder's priorities and concerns"
          - "Update MAP milestones if new stakeholder introduces additional approval steps"
          - "Schedule introduction meeting or ensure champion briefs new stakeholder"
          - "Update MEDDPICC decision process dimension"
        owner: "Account Executive"

    - id: "map_on_track"
      condition: "$.map.milestones.completion_rate >= 0.8 AND $.map.buyer_engagement.status == 'GREEN'"
      severity: "LOW"
      output_type: "Confidence"
      decision:
        title: "MAP Execution On Track"
        context: "Milestones progressing on schedule with strong buyer engagement. Deals with on-track MAPs show 26% higher win rates."
        recommendation: "Maintain momentum, begin preparing for next phase transition"
        actions:
          - "Confirm next milestone owners and deadlines with buyer"
          - "Pre-stage resources for upcoming phase"
          - "Reinforce value narrative with champion"
          - "Update forecast confidence upward if warranted"

    - id: "procurement_delay"
      condition: "$.map.phase == '4_procurement' AND $.map.milestones.slip_days > 14"
      severity: "MEDIUM"
      output_type: "Risk + Action"
      decision:
        title: "Procurement Process Delay"
        context: "Procurement phase milestones slipping beyond 14 days. Legal, security, or budget approval delays can push deals into next quarter."
        recommendation: "Engage procurement contacts directly and identify specific blockers"
        actions:
          - "Contact procurement lead to understand specific delay cause"
          - "Provide any outstanding security questionnaires or compliance documentation"
          - "If legal terms are the blocker, escalate to deal desk for creative solutions"
          - "If budget approval delayed, re-engage economic buyer"
          - "Update close date forecast based on realistic procurement timeline"
        owner: "Account Executive"
      creates:
        - object_type: "Risk"
          category: "commercial"
          severity: "MEDIUM"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
validation_outputs:
  primary_artifact:
    path: "{account}/external-infohub/opportunities/{opportunity}/mutual_action_plan_{YYYY-MM-DD}.yaml"
    format: "yaml"
    sections:
      - executive_summary
      - success_criteria
      - buying_committee
      - milestone_roadmap
      - engagement_tracking
      - risk_register

    schema:
      executive_summary:
        deal_name: {type: "string"}
        deal_type: {type: "string", enum: ["new_business", "expansion", "renewal"]}
        target_close_date: {type: "date"}
        buyer_success_criteria_summary: {type: "string"}
        current_phase: {type: "string", enum: ["education", "validation", "evaluation", "procurement", "implementation"]}
        overall_status: {type: "string", enum: ["RED", "YELLOW", "GREEN"]}
        milestone_completion_rate: {type: "number"}

      success_criteria:
        type: "array"
        items:
          criterion: {type: "string"}
          measurement: {type: "string"}
          target_value: {type: "string"}
          owner_buyer: {type: "string"}
          owner_seller: {type: "string"}
          status: {type: "string", enum: ["NOT_STARTED", "IN_PROGRESS", "ACHIEVED", "AT_RISK"]}

      buying_committee:
        type: "array"
        items:
          name: {type: "string"}
          title: {type: "string"}
          role_in_deal: {type: "string", enum: ["economic_buyer", "champion", "technical_evaluator", "end_user", "legal_procurement", "influencer", "blocker"]}
          engagement_level: {type: "string", enum: ["HIGH", "MEDIUM", "LOW", "NONE"]}
          last_interaction: {type: "date"}
          map_views: {type: "integer"}
          stance: {type: "string", enum: ["SUPPORTIVE", "NEUTRAL", "RESISTANT", "UNKNOWN"]}

      milestone_roadmap:
        type: "array"
        items:
          phase: {type: "string"}
          milestone: {type: "string"}
          owner: {type: "string", description: "Buyer or seller responsible"}
          target_date: {type: "date"}
          actual_date: {type: "date", nullable: true}
          status: {type: "string", enum: ["NOT_STARTED", "IN_PROGRESS", "COMPLETED", "SLIPPED", "BLOCKED"]}
          dependencies: {type: "array"}
          notes: {type: "string", nullable: true}

      engagement_tracking:
        overall_engagement_status: {type: "string", enum: ["RED", "YELLOW", "GREEN"]}
        active_buying_committee_members: {type: "integer"}
        total_buying_committee_members: {type: "integer"}
        last_buyer_interaction_date: {type: "date"}
        avg_response_time_hours: {type: "number"}
        map_view_count_last_30_days: {type: "integer"}
        engagement_trend: {type: "string", enum: ["INCREASING", "STABLE", "DECLINING"]}

      risk_register:
        type: "array"
        items:
          risk: {type: "string"}
          category: {type: "string", enum: ["engagement", "timeline", "stakeholder", "competitive", "procurement", "technical"]}
          severity: {type: "string", enum: ["HIGH", "MEDIUM", "LOW"]}
          mitigation: {type: "string"}
          owner: {type: "string"}
          status: {type: "string", enum: ["OPEN", "MITIGATING", "RESOLVED"]}

  engagement_dashboard:
    path: "{account}/internal-infohub/opportunities/{opportunity}/map_engagement_tracking.yaml"
    format: "yaml"
    update_frequency: "Weekly or on engagement signal change"
    contents:
      - buyer_interaction_log
      - milestone_velocity_trend
      - buying_committee_heat_map
      - stall_risk_indicators
      - engagement_score_history

  decision_objects:
    path: "{account}/external-infohub/decisions/"
    create_if:
      - "Phase transition requires buyer confirmation"
      - "Milestone timeline reset due to slippage"
      - "New stakeholder requires MAP revision"

  risk_objects:
    path: "{account}/internal-infohub/risks/"
    create_if:
      - "Buyer engagement drops to RED"
      - "Multiple milestones slipped"
      - "Champion change detected"
      - "Competitive threat during evaluation"
      - "Deal stall signals present"

  action_objects:
    path: "{account}/internal-infohub/actions/"
    create_if:
      - "Re-engagement sequence triggered"
      - "Milestone slippage requires timeline reset"
      - "New stakeholder requires alignment meeting"
      - "Phase transition preparation needed"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "$.map.buyer_engagement.last_interaction_days > 21"
      reason: "Buyer disengaged for 3+ weeks despite re-engagement attempts"
      action: "Executive-to-executive outreach required, sales leadership to decide on deal continuation"

    - condition: "$.map.milestones.slipped_count >= 3 AND $.map.phase != '5_implementation'"
      reason: "Systematic milestone failure indicates deal fundamentals may have changed"
      action: "Sales leadership deal review to assess whether to continue, pause, or disqualify"

    - condition: "$.map.champion.status == 'departed' AND $.map.replacement_champion == null"
      reason: "Champion departed with no replacement identified"
      action: "AE must find new internal advocate before MAP can progress"

    - condition: "$.map.economic_buyer.engagement == 'none' AND $.map.phase >= '3_evaluation'"
      reason: "Advanced phase without economic buyer engagement risks late-stage deal collapse"
      action: "Escalate to sales leadership for executive alignment strategy"

  insufficient_data_signals:
    - "No discovery findings documented"
    - "No stakeholder map available"
    - "No MEDDPICC assessment completed"
    - "Target close date not established"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - check: "$.opportunity.id EXISTS"
      description: "Opportunity must exist in CRM"
    - check: "$.opportunity.stage >= 2"
      description: "Deal must be at least Stage 2 (Qualification)"
    - check: "$.discovery.pain_points.length >= 1"
      description: "At least one confirmed pain point required"
    - check: "$.stakeholder_map.contacts.length >= 1"
      description: "At least one buying committee member identified"

  post_execution:
    - check: "$.map.milestones.count >= 5"
      description: "MAP must include at least 5 milestones across active phases"
    - check: "$.map.success_criteria.count >= 2"
      description: "At least 2 buyer success criteria must be defined"
    - check: "$.map.buying_committee.members.count >= 1"
      description: "Buying committee must be documented"
    - check: "$.map.milestones.each.owner IS_ASSIGNED"
      description: "Every milestone must have a clear owner (buyer or seller)"
    - check: "$.map.milestones.each.target_date IS_SET"
      description: "Every milestone must have a target date"

  output_quality:
    - "Success criteria must be measurable, not aspirational"
    - "Milestones must have single owners, not shared ownership"
    - "Buyer-visible content must not contain internal strategy or competitive positioning"
    - "Engagement tracking must use objective signals, not subjective assessments"
    - "Risk mitigations must be specific actions, not generic responses"

# ==============================================================================
# INTEGRATION WITH OTHER PLAYBOOKS
# ==============================================================================
integrates_with:
  - playbook: "PB_AE_006_meddpicc"
    integration: "MAP milestones align with MEDDPICC qualification dimensions. Milestone completion provides evidence for MEDDPICC scoring. MEDDPICC gaps inform which MAP phases need additional buyer-side milestones."
    provides: "Qualification alignment, evidence mapping, gap-driven milestone design"

  - playbook: "PB_AE_002_account_planning"
    integration: "Account plan provides strategic context for MAP success criteria. MAP execution data feeds back into account plan as deal progress evidence."
    provides: "Strategic context, success criteria alignment, deal execution tracking"

  - playbook: "PB_SA_012_technical_evaluation_execution"
    integration: "SA playbook executes the technical milestones within MAP evaluation phase. MAP provides timeline and success criteria; SA playbook provides technical execution."
    provides: "Technical evaluation coordination, POC/pilot milestone execution"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "60-90 minutes (initial MAP creation) + ongoing weekly updates"
frequency: "Created once per deal, updated weekly throughout deal lifecycle"
human_review_required: true
approval_workflow:
  - reviewer: "AE"
    approval_gate: "Validate milestones and success criteria before sharing with buyer"
  - reviewer: "Buyer Champion"
    approval_gate: "Co-sign MAP milestones, timeline, and success criteria"
  - reviewer: "Sales Leadership"
    condition: "$.opportunity.arr >= 250000"
    approval_gate: "Approve MAP for strategic deals"

last_updated: "2026-03-26"
version: "1.0"
status: "draft"
notes: "Mutual Action Plan playbook adapted from Outreach.io Success Plans methodology for structured buyer-seller deal execution"
