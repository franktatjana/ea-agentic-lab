# PLAYBOOK: Sales Quarterly Business Review
# Internal sales team performance review and pipeline assessment
# Version 1.0 - PLAYBOOK_EXECUTION_SPECIFICATION standard

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
steckbrief:
  playbook_id: "PB_603"
  name: "Sales QBR"
  category: "account_executives"
  mode: "ASSESSMENT"
  version: "1.0"
  status: "production_ready"

  one_liner: "Conduct internal sales quarterly business review to assess pipeline health, revenue attainment, deal progression, and forecast accuracy"
  framework_origin: "Enterprise Sales Operations Best Practice"

  owner_agent: "AE Agent"
  supporting_agents: ["SA Agent", "VE Agent", "CI Agent", "Leadership Agent"]

  triggers_summary:
    - "Quarter-end approaching (last 2 weeks of quarter)"
    - "Sales leadership requests pipeline review"
    - "Revenue attainment below 80% at mid-quarter"

  anti_patterns:
    - "Account has no active pipeline (use account planning PB_602 first)"
    - "Mid-deal review needed (use MEDDPICC PB_801 instead)"
    - "Customer-facing QBR (use PB_174 instead)"
    - "Single-deal qualification (use MEDDPICC PB_801)"

  key_inputs:
    - "Pipeline snapshot with all active opportunities"
    - "Revenue targets and attainment data for current quarter"
    - "MEDDPICC assessments for strategic deals"

  key_outputs:
    - artifact: "Sales QBR Report"
      format: "markdown"
    - artifact: "Pipeline Risk Register"
      format: "yaml"
    - artifact: "Next Quarter Action Plan"
      format: "yaml"

  key_decisions:
    - "Pipeline coverage < 3x: increase prospecting cadence"
    - "Win rate declining: review deal quality and qualification rigor"
    - "Forecast accuracy < 70%: recalibrate commit criteria"
    - "At-risk accounts identified: trigger retention or expansion plays"

  complexity: "HIGH"
  estimated_inputs: 12
  estimated_rules: 8

  source_file: "domain/playbooks/account_executives/PB_603_sales_qbr.yaml"
  last_updated: "2026-02-27"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Sales QBR contains pipeline details, revenue attainment, forecast accuracy, and deal-level assessments that are vendor-internal sales operations data."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized QBR patterns, pipeline health benchmarks, and forecast accuracy trends (after engagement closes)"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Sales Quarterly Business Review"
framework_source: "Enterprise Sales Operations Best Practice"
playbook_mode: "ASSESSMENT"
playbook_category: "pursuit_sales_support"
intended_agent_role: "AE Agent"
secondary_agents: ["SA Agent", "VE Agent", "CI Agent", "Leadership Agent"]

primary_objective: "Assess internal sales performance, pipeline health, forecast accuracy, and competitive positioning to set priorities for the next quarter"

when_not_to_use:
  - "Account has no active pipeline (use account planning PB_602 first)"
  - "Mid-deal review needed (use MEDDPICC PB_801 instead)"
  - "Customer-facing business review (use PB_174 instead)"
  - "Single-deal qualification (use MEDDPICC PB_801)"
  - "Post-mortem on lost deal (use Retrospective PB_601)"

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "quarter_end_approaching"
      description: "Last 2 weeks of current quarter"
      timing: "Q1 (Mar 15), Q2 (Jun 15), Q3 (Sep 15), Q4 (Dec 15)"

    - event: "revenue_attainment_below_threshold"
      description: "Revenue attainment below 80% at mid-quarter"
      condition: "$.revenue.attainment_percentage < 80 AND $.quarter.week >= 6"

    - event: "pipeline_coverage_low"
      description: "Pipeline coverage drops below 2.5x target"
      condition: "$.pipeline.total_value / $.revenue.target < 2.5"

    - event: "forecast_accuracy_declining"
      description: "Forecast accuracy below 70% for 2 consecutive months"
      condition: "$.forecast.accuracy_trailing_2m < 70"

  manual:
    - "Sales leadership requests quarterly review"
    - "AE requests pipeline health check"
    - "Pre-board meeting sales data preparation"
    - "New quarter kickoff planning"

  conditional:
    - condition: "$.quarter.remaining_days <= 14"
      description: "Quarter closing, mandatory review"

    - condition: "$.deals.at_risk.count >= 3 AND $.deals.at_risk.total_arr >= 500000"
      description: "Multiple high-value deals at risk"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
validation_inputs:
  mandatory:
    - artifact: "Pipeline snapshot"
      description: "All active opportunities with stage, ARR, close date, probability"
    - artifact: "Revenue targets"
      description: "Quarterly and annual revenue targets by segment/territory"
    - artifact: "{realm}/*/internal-infohub/governance/health_score.yaml"
      description: "Account health scores for active accounts"

  optional:
    - artifact: "MEDDPICC assessments"
      use: "Deal qualification data for strategic opportunities"
    - artifact: "{realm}/*/internal-infohub/competitive/*.md"
      use: "Competitive landscape across accounts"
    - artifact: "Previous QBR report"
      use: "Track progress on prior quarter action items"
    - artifact: "{realm}/*/external-infohub/planning/account_plan_*.md"
      use: "Strategic account plans for context"
    - artifact: "Win/loss retrospectives"
      use: "Pattern analysis from PB_601 outputs"
    - artifact: "Forecast history"
      use: "Compare forecast vs. actuals over time"

  minimum_data_threshold:
    - "Pipeline snapshot with at least 5 active opportunities"
    - "Revenue target defined for current quarter"
    - "At least 1 prior quarter of performance data"

# ==============================================================================
# KEY QUESTIONS
# ==============================================================================
key_questions:
  revenue_performance:
    - "What is current quarter revenue attainment vs. target?"
    - "What deals closed this quarter, and how do they compare to forecast?"
    - "What revenue was lost (slipped, lost, churned) and why?"
    - "Is the revenue mix (new vs. expansion vs. renewal) on track?"

  pipeline_health:
    - "What is current pipeline coverage ratio (pipeline / remaining target)?"
    - "How has pipeline grown or shrunk since last QBR?"
    - "What is the stage distribution of the pipeline (early vs. late stage)?"
    - "What is the average deal cycle time, and is it trending longer?"
    - "What is the pipeline velocity (deals x win rate x value / cycle time)?"

  deal_quality:
    - "What are the MEDDPICC scores for commit and upside deals?"
    - "How many deals have slipped close dates more than once?"
    - "Which deals have been in the same stage for more than 30 days?"
    - "What percentage of pipeline is single-threaded (no champion or EB)?"

  forecast_accuracy:
    - "What was forecast accuracy for the closing quarter?"
    - "Which categories (commit, upside, pipeline) had the most variance?"
    - "What deals surprised us (positive or negative)?"
    - "Are commit criteria being applied consistently across the team?"

  competitive_landscape:
    - "Which competitors appeared most frequently this quarter?"
    - "What is our win rate against each key competitor?"
    - "Where are we losing, and what patterns emerge?"
    - "What new competitive threats have appeared?"

  account_health:
    - "Which accounts have declining health scores?"
    - "What at-risk accounts need immediate intervention?"
    - "Which accounts have expansion potential not being pursued?"
    - "Are strategic accounts getting adequate coverage and attention?"

  team_performance:
    - "What are individual quota attainment levels?"
    - "Where do team members need coaching or support?"
    - "What resource constraints are affecting execution?"
    - "What skills gaps or enablement needs surfaced this quarter?"

# ==============================================================================
# DECISION LOGIC (DLL Syntax)
# ==============================================================================
decision_logic:
  scoring:
    dimensions:
      - name: "revenue_attainment"
        weight: 30
      - name: "pipeline_coverage"
        weight: 20
      - name: "forecast_accuracy"
        weight: 15
      - name: "deal_quality"
        weight: 15
      - name: "competitive_win_rate"
        weight: 10
      - name: "account_health"
        weight: 10
    max_score: 100
    green_threshold: 75
    yellow_threshold: 50
    red_threshold: 49

  rules:
    - id: "pipeline_coverage_critical"
      condition: "$.pipeline.coverage_ratio < 2.0"
      severity: "HIGH"
      output_type: "Risk + Action"
      decision:
        title: "Pipeline Coverage Below 2x, Revenue Target at Risk"
        context: "Insufficient pipeline to cover remaining quota. Industry benchmark is 3x minimum."
        recommendation: "Accelerate pipeline generation activities immediately"
        actions:
          - "Review and reactivate stalled opportunities"
          - "Increase outbound prospecting cadence"
          - "Identify expansion plays in existing accounts"
          - "Request marketing campaign support for pipeline acceleration"
        stakeholders: ["AE", "Sales Leadership"]
        urgency: "IMMEDIATE"

    - id: "win_rate_declining"
      condition: "$.metrics.win_rate < $.metrics.win_rate_prior_quarter * 0.85"
      severity: "MEDIUM"
      output_type: "Risk + Action"
      decision:
        title: "Win Rate Declining, Down {decline_percentage}% from Prior Quarter"
        context: "Win rate erosion suggests deal quality or competitive positioning issues"
        recommendation: "Strengthen qualification rigor and competitive response"
        actions:
          - "Review MEDDPICC discipline on recent losses"
          - "CI Agent: Update competitive intelligence for key competitors"
          - "Conduct win/loss retrospective (PB_601) on significant losses"
          - "SA Agent: Review technical win themes"
        stakeholders: ["AE", "SA", "CI Agent"]

    - id: "forecast_accuracy_low"
      condition: "$.forecast.accuracy < 70"
      severity: "MEDIUM"
      output_type: "Action"
      decision:
        title: "Forecast Accuracy Below 70%, Recalibrate Commit Criteria"
        context: "Unreliable forecasting undermines planning and resource allocation"
        recommendation: "Tighten commit criteria and improve deal inspection"
        actions:
          - "Review commit criteria with deal-level evidence"
          - "Require MEDDPICC score >= 18 for commit forecast"
          - "Implement weekly deal inspection for commit deals"
          - "Track forecast changes to identify pattern of optimism"
        stakeholders: ["AE", "Sales Leadership"]

    - id: "at_risk_accounts"
      condition: "$.accounts.health_score_below_50.count >= 2"
      severity: "HIGH"
      output_type: "Risk + Escalation"
      decision:
        title: "Multiple Accounts at Risk, {count} Accounts Below Health Threshold"
        context: "At-risk accounts threaten renewal revenue and customer satisfaction"
        recommendation: "Trigger intervention playbooks for each at-risk account"
        actions:
          - "CA Agent: Run health triage (PB_CS_301) for each at-risk account"
          - "AE: Schedule executive engagement for top-risk accounts"
          - "SA: Review technical health and adoption blockers"
          - "Escalate to leadership if resource support needed"
        escalate_to: "Sales Leadership"
      creates:
        - object_type: "Risk"
          category: "retention"
          severity: "HIGH"

    - id: "stalled_deals"
      condition: "$.deals.stalled_30_days.count >= 3"
      severity: "MEDIUM"
      output_type: "Action"
      decision:
        title: "Multiple Deals Stalled, {count} Opportunities Without Stage Movement"
        context: "Stalled deals consume resources without progressing toward close"
        recommendation: "Apply qualification pressure and reassess deal viability"
        actions:
          - "Run MEDDPICC assessment (PB_801) on each stalled deal"
          - "Identify and address specific blockers per deal"
          - "Set 30-day deadline: progress or move to nurture"
          - "Reallocate SA resources from stalled to active deals"
        stakeholders: ["AE", "SA"]

    - id: "expansion_opportunity_gap"
      condition: "$.accounts.expansion_potential.count >= 3 AND $.pipeline.expansion_deals.count == 0"
      severity: "LOW"
      output_type: "Action"
      decision:
        title: "Expansion Potential Not Being Pursued"
        context: "Accounts with identified whitespace but no active expansion opportunities"
        recommendation: "Convert expansion potential into pipeline"
        actions:
          - "Review account plans (PB_602) for expansion-ready accounts"
          - "Schedule discovery meetings for whitespace opportunities"
          - "VE Agent: Prepare value propositions for expansion use cases"
          - "Set target of creating 1 expansion opportunity per identified account"

    - id: "competitive_threat_pattern"
      condition: "$.competitive.losses_to_same_competitor >= 2"
      severity: "MEDIUM"
      output_type: "Action"
      decision:
        title: "Repeated Losses to {competitor}, Pattern Detected"
        context: "Multiple losses to the same competitor indicate systematic positioning gap"
        recommendation: "Develop targeted competitive response strategy"
        actions:
          - "CI Agent: Deep competitive analysis on {competitor}"
          - "SA Agent: Develop technical differentiation playbook"
          - "Review and update battlecard"
          - "Schedule competitive war room session"
        stakeholders: ["AE", "SA", "CI Agent"]

    - id: "strong_quarter_performance"
      condition: "$.revenue.attainment_percentage >= 100 AND $.pipeline.coverage_ratio >= 3.0"
      severity: "LOW"
      output_type: "Confidence"
      decision:
        title: "Strong Quarter Performance, Target Achieved with Healthy Pipeline"
        context: "Revenue target met and pipeline positions well for next quarter"
        recommendation: "Maintain momentum, focus on deal quality and strategic accounts"
        actions:
          - "Document winning patterns for team enablement"
          - "Identify replicable strategies from top deals"
          - "Set stretch targets for next quarter"
          - "Celebrate wins and recognize contributions"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/internal-infohub/reviews/sales_qbr_{YYYY}_Q{N}.md"
    format: "markdown"
    sections:
      - executive_summary
      - revenue_performance
      - pipeline_analysis
      - deal_quality_review
      - forecast_accuracy
      - competitive_landscape
      - account_health_overview
      - team_performance
      - next_quarter_priorities
      - action_plan

    schema:
      executive_summary:
        - quarter: "string (e.g., 2026-Q1)"
        - revenue_target: "number"
        - revenue_actual: "number"
        - attainment_percentage: "number"
        - pipeline_coverage: "number"
        - key_wins: "array[string]"
        - key_risks: "array[string]"
        - overall_status: "enum[RED|YELLOW|GREEN]"

      revenue_performance:
        - new_business: "number"
        - expansion: "number"
        - renewal: "number"
        - churned: "number"
        - net_revenue: "number"
        - vs_target: "number"
        - vs_prior_quarter: "number"

      pipeline_analysis:
        - total_pipeline: "number"
        - coverage_ratio: "number"
        - stage_distribution: "map[stage -> count + value]"
        - average_deal_size: "number"
        - average_cycle_time: "number (days)"
        - pipeline_velocity: "number"
        - new_pipeline_created: "number"
        - pipeline_lost: "number"

      deal_quality_review:
        - commit_deals: "array[deal_summary]"
        - upside_deals: "array[deal_summary]"
        - stalled_deals: "array[deal_summary]"
        - average_meddpicc_score: "number"
        - single_threaded_deals: "integer"

      forecast_accuracy:
        - forecast_vs_actual: "number (percentage)"
        - commit_accuracy: "number (percentage)"
        - upside_conversion: "number (percentage)"
        - notable_misses: "array[deal_summary]"

      competitive_landscape:
        - competitors_encountered: "array[competitor_summary]"
        - win_rate_by_competitor: "map[competitor -> percentage]"
        - loss_patterns: "array[string]"
        - emerging_threats: "array[string]"

      account_health_overview:
        - healthy_accounts: "integer"
        - at_risk_accounts: "array[account_summary]"
        - expansion_candidates: "array[account_summary]"

      next_quarter_priorities:
        - priority: "string"
        - owner: "string"
        - target_metric: "string"
        - deadline: "date"

  pipeline_risk_register:
    path: "{realm}/internal-infohub/risks/pipeline_risks_{YYYY}_Q{N}.yaml"
    format: "yaml"
    create_if: "At-risk deals or pipeline gaps identified"

  action_plan:
    path: "{realm}/internal-infohub/actions/qbr_actions_{YYYY}_Q{N}.yaml"
    format: "yaml"
    create_for_each: "Decided priority or intervention"

  notifications:
    - recipient: "Sales Leadership"
      condition: "always"
      message: "Sales QBR complete for {quarter}: {attainment_percentage}% attainment, {pipeline_coverage}x coverage"

    - recipient: "SA Agent"
      condition: "technical_initiatives.count > 0"
      message: "QBR identified {count} technical priorities requiring SA support"

    - recipient: "CI Agent"
      condition: "competitive_losses >= 2"
      message: "QBR flagged competitive pattern: {competitor} wins {count} deals"

    - recipient: "CA Agent"
      condition: "at_risk_accounts.count > 0"
      message: "QBR identified {count} at-risk accounts for health triage"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "$.revenue.attainment_percentage < 50 AND $.quarter.remaining_days < 30"
      reason: "Significant revenue miss likely, executive intervention needed"
      action: "Escalate to VP Sales for recovery plan"

    - condition: "$.pipeline.coverage_ratio < 1.5"
      reason: "Pipeline insufficient to cover target even with high win rate"
      action: "Emergency pipeline generation, leadership intervention"

    - condition: "$.accounts.churning.count >= 2 AND $.accounts.churning.total_arr >= 500000"
      reason: "Material churn risk to revenue base"
      action: "Retention task force with executive sponsorship"

  insufficient_data:
    - "No pipeline data available"
    - "Revenue targets not defined"
    - "No prior quarter data for comparison"

  ambiguity_signals:
    - "Conflicting revenue numbers from different sources"
    - "Pipeline data significantly stale (> 7 days)"
    - "MEDDPICC assessments missing for commit deals"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Pipeline snapshot current (< 7 days old)"
    - "Revenue targets defined for current quarter"
    - "At least 5 opportunities in pipeline"

  post_execution:
    - "All pipeline categories (commit, upside, pipeline) analyzed"
    - "At-risk deals identified with specific actions"
    - "Next quarter priorities defined with owners and deadlines"
    - "Forecast vs. actuals comparison completed"
    - "Competitive win/loss patterns documented"

  output_quality:
    - "Revenue numbers reconcile with source data"
    - "Actions are specific, owned, and time-bound"
    - "Competitive insights cite specific deals, not generalizations"
    - "Risk assessments include mitigation strategies"

# ==============================================================================
# INTEGRATION WITH OTHER PLAYBOOKS
# ==============================================================================
integrates_with:
  - playbook: "PB_801_meddpicc"
    integration: "Deal qualification data feeds pipeline quality analysis"
    provides: "MEDDPICC scores for commit/upside deal review"

  - playbook: "PB_602_account_planning"
    integration: "Account plans provide strategic context for pipeline review"
    provides: "Expansion potential and account growth targets"

  - playbook: "PB_601_retrospective"
    integration: "Win/loss patterns inform competitive and quality analysis"
    provides: "Historical deal outcome patterns"

  - playbook: "PB_401_customer_health_score"
    integration: "Health scores feed account risk assessment"
    provides: "Current account health data"

  - playbook: "PB_174_customer_qbr"
    integration: "Customer-facing QBR outputs inform internal sales review"
    provides: "Customer sentiment and adoption data"

  - playbook: "PB_CS_301_health_triage"
    integration: "Triggered for at-risk accounts identified in QBR"
    provides: "Intervention plans for declining accounts"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "60-120 minutes (data preparation + analysis + report)"
frequency: "Quarterly (with mid-quarter check if triggers fire)"
human_review_required: true
approval_workflow:
  - reviewer: "AE"
    approval_gate: "Validate pipeline data and deal assessments"
  - reviewer: "Sales Leadership"
    approval_gate: "Approve priorities and resource allocation"
  - reviewer: "SA Lead"
    condition: "technical_priorities.count > 0"
    approval_gate: "Validate technical resource commitments"

last_updated: "2026-02-27"
version: "1.0"
status: "production_ready"
notes: "Internal sales QBR focused on pipeline health, revenue attainment, and team performance. For customer-facing QBR, use PB_174."
