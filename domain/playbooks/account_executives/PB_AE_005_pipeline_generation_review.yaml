# PLAYBOOK: Pipeline Generation Review
# Periodic review of top-of-funnel effectiveness

playbook_id: "PB_AE_005"
name: "Pipeline Generation Review"
version: "1.0"
status: "ACTIVE"
playbook_mode: "ASSESSMENT"
playbook_category: "pipeline_management"
intended_agent_role: "ae-agent"

metadata:
  description: "Monthly review of pipeline generation effectiveness: ICP fit accuracy, outreach conversion, coverage gap closure"
  owner_agent: "ae_agent"
  intended_agent_role: "ae-agent"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Pipeline generation metrics and conversion analysis are internal sales operations data."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      condition: "Anonymized ICP patterns and outreach effectiveness benchmarks after quarterly aggregation"

flow_bindings:
  description: "Maps playbook phases to the agent flows that execute them"
  bindings:
    - phase: "Metrics Collection"
      agents:
        - agent: ae-pipeline-gen-agent
          flow: pipeline-generation
          context: "Prospects generated, outreach sent, responses, meetings, opportunities"
        - agent: ae-pipeline-mgmt-agent
          flow: pipeline-management
          context: "Coverage ratio, gap to target, territory breakdown"
    - phase: "ICP Accuracy Review"
      agent: ae-pipeline-gen-agent
      flow: pipeline-generation
      context: "ICP-scored prospects vs conversion outcomes"
    - phase: "Outreach Effectiveness"
      agent: ae-pipeline-gen-agent
      flow: pipeline-generation
      context: "Response rates by channel, personalization impact"
    - phase: "Coverage Gap Analysis"
      agent: ae-pipeline-mgmt-agent
      flow: pipeline-management
      context: "Territory segments, gap closure pace, coverage projections"
      data_flow:
        input_from: "Metrics Collection coverage data"
        output_to: "Adjustment and Actions targets"
    - phase: "Adjustment and Actions"
      agent: ae-pipeline-gen-agent
      flow: pipeline-generation
      context: "ICP criteria adjustments, outreach strategy updates, target setting"
      data_flow:
        input_from: "ICP Accuracy Review + Outreach Effectiveness + Coverage Gap Analysis"
        output_to: "Action items with owners and deadlines"

raci:
  responsible:
    role: "AE Agent"
    agent: "ae-agent"
    description: "Reviews pipeline generation metrics, ICP accuracy, conversion rates"
    file: "PB_AE_005_pipeline_generation_review.yaml"
  accountable:
    role: "Sales Leadership"
    human_required: true
    description: "Approves coverage targets, ICP criteria adjustments, resource allocation for pipe gen"
  consulted:
    - role: "ae-pipeline-gen-agent"
      scope: "Provides prospect lists, outreach metrics, conversion data"
    - role: "ae-pipeline-mgmt-agent"
      scope: "Provides coverage ratios, gap analysis, territory context"
    - role: "ci-agent"
      scope: "Provides competitive context for ICP refinement"
  informed:
    - role: "ae-signal-detection-agent"
      notify_on: ["icp_criteria_adjusted"]
    - role: "senior-manager-agent"
      notify_on: ["coverage_gap_critical"]

trigger:
  automatic:
    - event: "monthly_cadence"
      timing: "First Monday of each month"
    - condition: "coverage_ratio < 2.0 for 2 consecutive weeks"
      severity: "emergency review"
  manual:
    - "Sales leadership requests pipe gen review"
    - "Pre-QBR pipeline deep dive"

phases:
  - name: "Metrics Collection"
    steps:
      - "Pull pipe gen metrics from ae-pipeline-gen-agent: prospects generated, outreach sent, responses received, meetings booked, opportunities created"
      - "Pull coverage data from ae-pipeline-mgmt-agent: current ratio, gap to target, territory breakdown"
      - "Pull conversion funnel: prospect → meeting → opportunity → stage 2 rates"

  - name: "ICP Accuracy Review"
    steps:
      - "Compare ICP-scored prospects against actual conversion outcomes"
      - "Identify ICP criteria that correlate with high conversion (reinforce)"
      - "Identify ICP criteria that don't predict conversion (adjust or remove)"
      - "Flag prospects that converted despite low ICP score (expand criteria)"

  - name: "Outreach Effectiveness"
    steps:
      - "Review response rates by channel (email, LinkedIn, phone, referral)"
      - "Compare personalization depth against response rates"
      - "Identify top-performing outreach patterns and messaging themes"
      - "Flag channels with declining response rates for strategy adjustment"

  - name: "Coverage Gap Analysis"
    steps:
      - "Calculate whether pipe gen activity is closing the coverage gap at target pace"
      - "Identify territory segments with insufficient pipeline generation"
      - "Project when coverage target will be met at current conversion rates"
      - "Recommend acceleration actions if projection exceeds acceptable timeline"

  - name: "Adjustment and Actions"
    steps:
      - "Produce ICP criteria adjustment recommendations (if accuracy < 70%)"
      - "Produce outreach strategy adjustments (if response rate declining)"
      - "Set next month's pipe gen targets based on coverage gap and conversion rates"
      - "Create action items with owners and deadlines"

quality_gates:
  pre_execution:
    - "Minimum 20 prospects generated in review period (statistical relevance)"
    - "Coverage data current (< 7 days old)"
    - "Conversion data spans full month (no partial periods)"
  post_execution:
    - "ICP accuracy calculated with actual outcomes, not assumptions"
    - "Response rate trends based on 3+ month trendline, not single month"
    - "Targets are specific numbers with deadlines, not directional"
    - "Every adjustment recommendation includes expected impact"

notifications:
  - recipient: "sales_leadership"
    condition: "always"
    message: "Pipeline gen review complete: {conversion_rate}% conversion, {coverage_ratio}x coverage"
  - recipient: "ae-pipeline-gen-agent"
    condition: "icp_criteria_adjusted"
    message: "ICP criteria updated based on conversion analysis"
