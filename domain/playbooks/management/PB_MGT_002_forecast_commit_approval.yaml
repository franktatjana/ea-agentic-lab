# Forecast Commit Approval Playbook
# Purpose: Review and approve forecast commits and pipeline narrative

id: "PB_MGT_002"
name: "Forecast Commit Approval"
version: "1.0"
status: "ACTIVE"
playbook_mode: "ASSESSMENT"
playbook_category: "pipeline_management"
intended_agent_role: "senior-manager-agent"

metadata:
  category: "management"
  framework: "Forecast Governance"
  team_owner: "management"
  description: "Review pipeline health, validate forecast commits, approve revenue narrative for leadership"
  notes: "Periodic cadence: weekly pipeline review, monthly forecast commit, quarterly territory review"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Forecast data and pipeline strategy are leadership-internal."

raci:
  responsible:
    role: "senior_manager_agent"
    agent: "senior-manager-agent"
    description: "Reviews pipeline health, validates commits, approves forecast narrative"
  accountable:
    role: "vp_sales"
    human_required: true
    description: "Final approval of forecast numbers submitted to executive leadership"
  consulted:
    - role: "account_executives"
      on_steps: ["deal_commit_validation", "pipeline_health"]
    - role: "ae-pipeline-mgmt-agent"
      on_steps: ["coverage_analysis", "forecast_accuracy"]
  informed:
    - role: "management"
      notify_on: ["forecast_submitted", "variance_alert"]

phases:
  - name: "Pipeline Health Review"
    steps:
      - "Review coverage ratio across pipeline stages"
      - "Identify at-risk deals with declining health scores"
      - "Assess pipeline velocity trends"
  - name: "Commit Validation"
    steps:
      - "Review each commit-level deal for evidence strength"
      - "Validate MEDDPICC scores support commit classification"
      - "Flag deals with insufficient qualification for commit downgrade"
  - name: "Forecast Approval"
    steps:
      - "Approve or adjust forecast commit numbers"
      - "Document variance rationale for any adjustments"
      - "Produce forecast narrative for executive reporting"
  - name: "Action Items"
    steps:
      - "Identify deals needing intervention"
      - "Assign coaching or resource support"
      - "Set next review checkpoint"

quality_gates:
  - "Every commit-level deal reviewed for evidence"
  - "Forecast variance from prior period explained"
  - "Action items assigned for at-risk deals"
