# Deal Escalation Review Playbook
# Purpose: Structured escalation handling for deals exceeding thresholds or at risk

id: "PB_MGT_001"
name: "Deal Escalation Review"
version: "1.0"
status: "draft"
playbook_mode: "ASSESSMENT"
playbook_category: "pursuit_sales_support"
intended_agent_role: "senior-manager-agent"

metadata:
  category: "management"
  framework: "Escalation Handling"
  team_owner: "management"
  description: "Handle deal escalations from AE agents: risk review, resource conflicts, competitive threats, customer issues"
  notes: "Triggered by AE escalation_triggers: deal >$500K, forecast variance >15%, champion gone dark, customer cancellation threat"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Escalation decisions and strategic interventions are leadership-internal."

raci:
  responsible:
    role: "senior_manager_agent"
    agent: "senior-manager-agent"
    description: "Receives escalation, analyzes context, makes decision, documents outcome"
  accountable:
    role: "vp_sales"
    human_required: true
    description: "Approves strategic interventions and resource reallocation"
  consulted:
    - role: "account_executives"
      on_steps: ["deal_context", "customer_relationship"]
    - role: "solution_architects"
      on_steps: ["technical_risk_assessment"]
  informed:
    - role: "management"
      notify_on: ["intervention_decision", "resource_reallocation"]

triggers:
  - event: "deal_escalation"
    conditions:
      - "Deal exceeds $500K threshold"
      - "Forecast variance >15%"
      - "Champion gone dark 21+ days"
      - "Customer threatens cancellation"
      - "Competitive threat at deal level"
    actions:
      - "Intake escalation with clarifying questions"
      - "Assess options and risks"
      - "Make decision and communicate"

phases:
  - name: "Escalation Intake"
    steps:
      - "Receive escalation context from originating agent"
      - "Ask clarifying questions: decision needed, options considered, recommendation, deadline"
      - "Classify escalation type: bid/no-bid, customer issue, resource conflict, competitive threat"
  - name: "Analysis"
    steps:
      - "Review deal context, pipeline impact, and strategic value"
      - "Assess available options with risk/benefit for each"
      - "Consult relevant agents for domain-specific input"
  - name: "Decision"
    steps:
      - "Make go/no-go or intervention decision with rationale"
      - "Allocate resources if needed"
      - "Communicate decision to originating agent and affected parties"
  - name: "Follow-Up"
    steps:
      - "Document decision and rationale in deal record"
      - "Set follow-up checkpoint to verify intervention effectiveness"
      - "Extract pattern for future escalation handling"

quality_gates:
  - "Decision made within 4-24 hours of intake"
  - "Rationale documented with evidence"
  - "Follow-up checkpoint scheduled"
