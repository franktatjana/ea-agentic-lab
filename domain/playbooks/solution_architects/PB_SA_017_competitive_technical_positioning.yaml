# PLAYBOOK: Competitive Technical Positioning
# Architecture advantage mapping and counter-positioning

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
playbook_id: "PB_SA_017"
steckbrief:
  playbook_id: "PB_SA_017"
  name: "Competitive Technical Positioning"
  category: "solution_architects"
  mode: "ANALYTICAL"
  version: "1.0"
  status: "draft"

  one_liner: "Map architecture advantages against specific competitor solutions, build counter-positioning for technical objections, and equip the pursuit team with defensible differentiation"
  framework_origin: "Competitive Intelligence / Gartner Magic Quadrant Analysis"

  owner_agent: "SA Agent"
  supporting_agents: ["CI Agent", "AE Agent"]

  triggers_summary:
    - "Active deal with named competitor identified in opportunity"
    - "Customer requesting head-to-head technical comparison"
    - "AE reports competitive pressure requiring SA-led technical differentiation"

  anti_patterns:
    - "Competitor bashing without evidence-based technical claims"
    - "Positioning without understanding customer's evaluation criteria"
    - "Generic competitive deck not tailored to this customer's use case"
    - "Positioning before technical discovery (no customer context)"
    - "Relying on outdated competitive intelligence"

  key_inputs:
    - "Technical discovery findings with validated customer requirements"
    - "Competitive intelligence on named competitor(s)"
    - "Customer evaluation criteria and decision framework"

  key_outputs:
    - artifact: "Competitive Technical Comparison"
      format: "yaml"
    - artifact: "Architecture Advantage Map"
      format: "yaml"
    - artifact: "Counter-Positioning Playcard"
      format: "yaml"
    - artifact: "Technical Differentiation Narrative"
      format: "markdown"

  key_decisions:
    - "Engage: customer context and competitive intel sufficient for positioning"
    - "Defer: need additional discovery or competitive intelligence before positioning"
    - "Escalate: competitor capability claim requires product team validation"

  complexity: "HIGH"
  estimated_inputs: 5
  estimated_rules: 4

  source_file: "domain/playbooks/solution_architects/PB_SA_017_competitive_technical_positioning.yaml"
  last_updated: "2026-03-26"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Competitive Technical Positioning"
framework_source: "Competitive Intelligence / Gartner Magic Quadrant Analysis"
playbook_mode: "ANALYTICAL"
playbook_category: "pursuit_sales_support"
intended_agent_role: "sa-agent"
secondary_agents: ["CI Agent", "AE Agent"]

primary_objective: "Produce evidence-based technical differentiation against named competitors by mapping architecture advantages to customer requirements, building counter-positioning for anticipated objections, and arming the pursuit team with defensible competitive narratives"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Competitive positioning artifacts are strictly internal. Sharing competitor analysis with the customer would undermine credibility and expose strategy."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized competitive patterns, common objection-response pairs, and win/loss competitive themes (quarterly)"

flow_bindings:
  description: "Maps competitive positioning phases to the agent flows that execute them"
  bindings:
    - phase: "Competitive Intelligence Gathering"
      agent: sa-agent
      flow: specialist-engagement
      context: "Engage CI Agent to retrieve current competitive intelligence on named competitor(s)"
    - phase: "Customer Requirements Alignment"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Map customer evaluation criteria and technical requirements that form the basis for comparison"
    - phase: "Architecture Advantage Mapping"
      agent: sa-agent
      flow: specialist-engagement
      context: "Analyze architecture differentiators against competitor capabilities across customer-relevant dimensions"
    - phase: "Counter-Positioning Development"
      agent: sa-agent
      flow: specialist-engagement
      context: "Build evidence-based responses for anticipated competitive objections and FUD"
    - phase: "Narrative Construction"
      agent: sa-decision-capture-agent
      flow: decision-capture
      context: "Document positioning decisions, rationale, and assumptions as reusable competitive ADRs"

when_not_to_use:
  - "No competitor identified in the opportunity (sole-source deal)"
  - "Customer has already selected and is in procurement (positioning too late)"
  - "Technical discovery not completed (no customer context for tailored positioning)"
  - "Competitive intelligence is stale or unavailable for the named competitor"

raci:
  responsible:
    role: "SA Agent"
    agent: "sa_agent"
    description: "Analyzes architecture advantages, builds counter-positioning, and produces competitive technical narrative"

  accountable:
    role: "SA Manager"
    human_required: true
    description: "Reviews competitive claims for accuracy and approves positioning strategy"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate_to_product"

  consulted:
    - role: "CI Agent"
      on_steps: ["competitive_intelligence_gathering", "competitor_capability_validation"]
    - role: "AE Agent"
      on_steps: ["customer_evaluation_criteria", "deal_strategy_alignment"]
    - role: "Specialist Agent"
      on_steps: ["domain_specific_differentiation"]

  informed:
    - role: "AE Agent"
      notify_on: ["positioning_complete", "critical_competitive_risk"]
    - role: "CI Agent"
      notify_on: ["new_competitive_insight_discovered"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Named competitor identified in CRM opportunity record"
    - "Customer requests formal technical comparison or bake-off"
    - "Competitive loss in adjacent account triggers proactive positioning"

  manual:
    - "SA initiates positioning: '/compete {competitor} {account}'"
    - "AE requests competitive support for active deal"

  conditional:
    - "IF competitor_named AND discovery_complete THEN build_positioning"
    - "IF customer_requests_comparison THEN accelerate_positioning"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Technical discovery report with validated customer requirements (PB_SA_014)"
    - artifact: "Named competitor(s) in the opportunity"
    - artifact: "Customer evaluation criteria or decision framework"

  optional:
    - artifact: "CI Agent competitive profile for named competitor"
      use: "Provides current competitor capabilities, pricing model, and known weaknesses"
    - artifact: "Previous competitive encounters with this competitor"
      use: "Leverage win/loss patterns from prior engagements"
    - artifact: "Analyst reports (Gartner, Forrester) referencing both vendors"
      use: "Third-party validation for differentiation claims"
    - artifact: "Customer's existing technology stack details"
      use: "Identify integration advantages or migration complexity"

  minimum_data_threshold:
    - "At least one named competitor identified"
    - "Customer evaluation criteria known at high level"
    - "Discovery findings available for requirement-based comparison"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  competitive_landscape:
    - "Which competitors are being evaluated and at what stage?"
    - "Has the customer already seen competitor demos or POCs?"
    - "What claims has the competitor made that we need to counter?"
    - "Does the customer have an existing relationship with the competitor?"
    - "What is the competitor's installed base in adjacent teams or use cases?"

  evaluation_criteria:
    - "What are the customer's top 3 technical evaluation criteria?"
    - "How is the customer weighting different evaluation dimensions?"
    - "Who defined the evaluation criteria (customer, competitor, analyst)?"
    - "Are there criteria where the competitor has a perceived advantage?"

  architecture_differentiation:
    - "Where does our architecture provide measurable advantages for this use case?"
    - "What capabilities does the competitor lack that the customer requires?"
    - "What integration, scale, or performance differences matter for this customer?"
    - "Are there total cost of ownership differences across the evaluation period?"

  objection_handling:
    - "What technical objections will the competitor raise about our solution?"
    - "What FUD (fear, uncertainty, doubt) tactics has the competitor used in similar deals?"
    - "What are the most common misconceptions about our capabilities?"
    - "Where do we have genuine gaps, and what is the mitigation strategy?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "competitor_identified AND discovery_complete AND ci_available"
      output_type: "Full Competitive Positioning"
      decision: |
        EXECUTE Full Positioning:
          scope: "Complete architecture comparison, advantage map, counter-positioning"
          depth: "Detailed technical analysis across all customer criteria"
          output: "Competitive comparison, advantage map, counter-playcard, narrative"
          timeline: "2-3 days"

    - condition: "competitor_identified AND discovery_complete AND ci_limited"
      output_type: "Focused Competitive Positioning"
      decision: |
        EXECUTE Focused Positioning:
          scope: "Architecture advantages on customer's top 3 criteria"
          depth: "Targeted analysis on known differentiation areas"
          output: "Focused advantage map and counter-positioning"
          gap: "Request CI Agent to fill intelligence gaps"

    - condition: "customer_requests_bakeoff"
      output_type: "Bake-off Preparation"
      decision: |
        EXECUTE Bake-off Prep:
          scope: "Head-to-head comparison framework aligned to customer criteria"
          depth: "Evidence-based differentiation with reproducible demonstrations"
          coordination: "Align with PB_SA_012 for evaluation execution"
          risk: "Ensure evaluation criteria favor real-world scenarios over feature checklists"

    - condition: "competitor_claim_unverified"
      output_type: "Validation Required"
      decision: |
        DEFER Positioning on Claim:
          action: "Validate competitor capability claim with product team or CI"
          risk: "Do not position against unverified claims"
          timeline: "24-48 hours for validation"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/competitive/positioning_{competitor}.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - competitive_comparison
      - architecture_advantage_map
      - counter_positioning
      - differentiation_narrative

    schema:
      competitive_comparison:
        competitor: "string"
        evaluation_dimensions: "array[string]"
        comparison_matrix:
          - dimension: "string"
            our_capability: "string"
            competitor_capability: "string"
            advantage: "string"  # ours, theirs, parity
            evidence: "string"
            customer_relevance: "string"  # critical, important, nice-to-have

      architecture_advantage_map:
        - advantage_area: "string"
          description: "string"
          customer_impact: "string"
          evidence: "string"
          demo_proof_point: "string"
          competitor_gap: "string"

      counter_positioning:
        - objection: "string"
          competitor_claim: "string"
          counter_response: "string"
          evidence: "string"
          proof_point: "string"
          escalation_path: "string"

      differentiation_narrative:
        executive_summary: "string"
        key_differentiators: "array[string]"
        customer_aligned_messaging: "string"
        proof_points: "array[string]"
        risk_factors: "array[string]"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Competitive positioning for {node} vs. {competitor}: {advantage_count} architecture advantages mapped"
    - recipient: "CI Agent"
      condition: "new_insight_discovered"
      message: "New competitive insight from {node} engagement: {insight_summary}"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "unverified_competitor_claims"
      reason: "Cannot counter-position against claims we have not validated"
      action: "Product team or CI to verify competitor capability before SA positions against it"

    - condition: "genuine_capability_gap"
      reason: "Competitor has a real advantage in a dimension critical to this customer"
      action: "SA Manager and Product to assess roadmap timeline or mitigation strategy"

    - condition: "customer_criteria_competitor_influenced"
      reason: "Evaluation criteria appear designed around competitor strengths"
      action: "SA and AE to collaboratively reshape evaluation criteria with customer"

  insufficient_data:
    - "No competitive intelligence available for the named competitor"
    - "Customer evaluation criteria unknown"
    - "Technical discovery not completed for this account"

  human_judgment_required:
    - "Deciding whether to acknowledge a genuine capability gap or redirect"
    - "Determining competitive positioning tone for sensitive customer relationships"
    - "Assessing whether to challenge competitor-influenced evaluation criteria"
    - "Handling situations where customer has strong incumbent relationship with competitor"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Technical discovery report exists for this account"
    - "At least one competitor named in the opportunity"
    - "Competitive intelligence is current (updated within last 90 days)"

  post_execution:
    - "Every advantage claim is evidence-based, not opinion"
    - "Counter-positioning covers the competitor's top 3 likely objections"
    - "Architecture advantage map ties each differentiator to a customer requirement"
    - "Differentiation narrative uses customer language, not vendor jargon"
    - "Genuine gaps are acknowledged with mitigation plans"

  output_quality:
    - "Comparison is fair and factual, not dismissive of competitor"
    - "Advantages are measurable or demonstrable, not subjective"
    - "Counter-positioning provides evidence, not assertions"
    - "Narrative connects architecture advantages to business outcomes"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "2-4 hours (analysis) + 1 hour (narrative construction)"
frequency: "Per competitive deal, refreshed when competitor landscape changes"
human_review_required: true
approval_workflow:
  - reviewer: "SA Agent"
    approval_gate: "All competitive claims are evidence-based and verifiable"
  - reviewer: "SA Manager"
    condition: "genuine_gap_identified == true"
    approval_gate: "Gap mitigation strategy approved"

