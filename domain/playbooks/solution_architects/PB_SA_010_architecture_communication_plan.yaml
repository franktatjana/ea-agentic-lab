# PLAYBOOK: Architecture Communication Plan
# Multi-audience architecture artifacts and messaging

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
playbook_id: "PB_SA_010"
steckbrief:
  playbook_id: "PB_SA_010"
  name: "Architecture Communication Plan"
  category: "solution_architects"
  mode: "GENERATIVE"
  version: "1.0"
  status: "stub"

  one_liner: "Design audience-adapted architecture communications: executive summaries, technical deep-dives, and operational guides tailored to each stakeholder group"
  framework_origin: "Architecture Communication - Stakeholder-Adapted Messaging"

  owner_agent: "SA Agent"
  supporting_agents: ["AE Agent"]

  triggers_summary:
    - "Architecture decisions made, stakeholder communication needed"
    - "Multiple audiences require different architecture views"
    - "Customer architecture review meeting scheduled"

  anti_patterns:
    - "No architecture decisions exist (nothing to communicate)"
    - "Single technical audience (standard HLD sufficient)"
    - "Internal-only communication (use decision log instead)"

  key_inputs:
    - "Architecture decisions (ADRs from PB_SA_001)"
    - "Solution description (HLD from PB_SA_003)"
    - "Stakeholder map with audience profiles"

  key_outputs:
    - artifact: "Communication Plan"
      format: "yaml"
    - artifact: "Audience-Adapted Architecture Artifacts"
      format: "markdown"

  key_decisions:
    - "Single audience: produce targeted artifact, skip multi-audience plan"
    - "Executive audience: outcome-focused summary, no technical depth"
    - "Mixed audience meeting: layered presentation with progressive detail"

  complexity: "MEDIUM"
  estimated_inputs: 4
  estimated_rules: 3

  source_file: "domain/playbooks/solution_architects/PB_SA_010_architecture_communication_plan.yaml"
  last_updated: "2026-03-08"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Architecture Communication Plan"
framework_source: "Architecture Communication - Stakeholder-Adapted Messaging"
playbook_mode: "GENERATIVE"
playbook_category: "content_generation"
intended_agent_role: "sa-agent"
secondary_agents: ["AE Agent"]

primary_objective: "Produce architecture communications adapted to each stakeholder audience, ensuring executive, technical, and operational stakeholders each receive architecture information at the right level of abstraction"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Communication plans are internal strategy artifacts. The generated architecture artifacts may be customer-facing."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Customer-facing architecture artifacts (presentations, summaries, guides)"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized communication templates by audience type (after engagement closes)"

flow_bindings:
  description: "Maps communication plan phases to the agent flows that execute them"
  bindings:
    - phase: "Audience Analysis"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Identify stakeholder segments, their technical depth, and communication preferences"
    - phase: "Message Architecture"
      agent: sa-decision-capture-agent
      flow: decision-capture
      context: "Extract key decisions and rationale to form the message core"
    - phase: "Artifact Design"
      agent: sa-best-practices-agent
      flow: best-practices
      context: "Apply communication patterns and artifact templates per audience type"
    - phase: "Delivery Planning"
      agent: sa-agent
      flow: meeting-support
      context: "Prepare meeting materials and delivery sequence for each audience"
    - phase: "Feedback Loop"
      agent: sa-agent
      flow: meeting-support
      context: "Capture audience feedback and refine artifacts for future communications"

when_not_to_use:
  - "No architecture decisions exist"
  - "Single technical audience where standard HLD is sufficient"
  - "Internal-only communication (use decision log)"
  - "Customer prefers to create their own architecture communications"

raci:
  responsible:
    role: "SA Agent"
    agent: "sa_agent"
    description: "Designs communication plan and produces audience-adapted architecture artifacts"

  accountable:
    role: "SA Manager"
    human_required: true
    description: "Reviews communication strategy and artifact quality"
    approval_actions:
      - "approve"
      - "request_revision"

  consulted:
    - role: "AE Agent"
      on_steps: ["executive_messaging", "customer_priorities"]

  informed:
    - role: "AE Agent"
      notify_on: ["architecture_artifacts_ready"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Architecture decisions (3+ ADRs) documented and stakeholder presentation needed"
    - "Solution description complete, multi-audience distribution required"
    - "Architecture review meeting with mixed audience scheduled"

  manual:
    - "SA prepares architecture communication: '/arch communicate {scope}'"
    - "Customer requests architecture overview for executive leadership"

  conditional:
    - "IF adr_count >= 3 AND stakeholder_groups > 1 THEN trigger"
    - "IF architecture_review_meeting_scheduled AND mixed_audience THEN trigger"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Architecture decisions (ADRs) from PB_SA_001"
    - artifact: "Stakeholder map with audience profiles"

  optional:
    - artifact: "Solution description (HLD) from PB_SA_003"
      use: "Source material for architecture artifacts"
    - artifact: "Value narrative from PB_SA_009"
      use: "Integrate business value messaging into executive artifacts"
    - artifact: "Meeting schedule"
      use: "Plan delivery sequence and timing"

  minimum_data_threshold:
    - "At least one architecture decision documented"
    - "At least two distinct audience segments identified"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  audience_understanding:
    - "Who are the distinct audience segments?"
    - "What is each audience's technical depth?"
    - "What does each audience care about most?"
    - "What format does each audience prefer (slides, documents, diagrams)?"

  message_design:
    - "What are the key architecture messages that all audiences share?"
    - "What details should be included for technical audiences only?"
    - "What business outcomes should be highlighted for executives?"
    - "What operational concerns should be addressed for ops teams?"

  delivery:
    - "In what order should audiences be briefed?"
    - "Are there dependencies between communications?"
    - "What feedback mechanisms should be built in?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "multiple_audiences AND architecture_decisions_exist"
      output_type: "Communication Plan (full)"
      decision: |
        CREATE Communication Plan:
          per_audience: "Message, artifact type, delivery method, timing"
          artifacts: "Executive summary, technical deep-dive, operational guide"
          sequence: "Executive first, then technical, then operational"

    - condition: "single_audience"
      output_type: "Targeted Artifact"
      decision: |
        CREATE Single Artifact:
          audience: "{identified_audience}"
          depth: "Matched to audience technical level"
          format: "Audience-preferred format"

    - condition: "mixed_audience_single_meeting"
      output_type: "Layered Presentation"
      decision: |
        CREATE Layered Presentation:
          approach: "Progressive disclosure"
          structure: "Business context → architecture overview → technical detail"
          appendix: "Deep-dive material for follow-up"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/communications/architecture_communication_plan.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - communication_strategy
      - audience_profiles
      - message_architecture
      - artifact_inventory
      - delivery_schedule
      - feedback_plan

    schema:
      audience_profiles:
        - audience: "string"
          technical_depth: "enum[EXECUTIVE|TECHNICAL|OPERATIONAL]"
          key_concerns: "array[string]"
          preferred_format: "string"
          artifact_type: "string"

      message_architecture:
        core_message: "string"
        audience_variants:
          - audience: "string"
            message_focus: "string"
            included_details: "array[string]"
            excluded_details: "array[string]"

      artifact_inventory:
        - artifact: "string"
          audience: "string"
          format: "string"
          status: "enum[DRAFT|REVIEW|READY]"
          path: "string"

      delivery_schedule:
        - audience: "string"
          delivery_method: "string"
          timing: "string"
          dependencies: "array[string]"

  customer_facing_artifacts:
    path: "{realm}/{node}/external-infohub/architecture/communications/"
    vault_type: "customer"
    description: "Audience-adapted architecture artifacts for customer distribution"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Architecture communication artifacts ready for {node}"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "no_architecture_decisions"
      reason: "Cannot communicate architecture that has not been decided"
      action: "Complete architecture decisions (PB_SA_001) first"

    - condition: "audience_unknown"
      reason: "Cannot adapt messaging without audience profiles"
      action: "SA to identify stakeholder segments and their needs"

  insufficient_data:
    - "No architecture decisions documented"
    - "Stakeholder map does not exist"

  human_judgment_required:
    - "Selecting appropriate abstraction level for mixed audiences"
    - "Deciding what to include vs. defer to follow-up"
    - "Handling sensitive architecture trade-offs in communication"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Architecture decisions exist"
    - "Stakeholder map identifies at least two audience segments"

  post_execution:
    - "Each audience has a dedicated artifact"
    - "Message variants are consistent in core content"
    - "Artifacts contain no information inappropriate for their audience"

  output_quality:
    - "Executive artifacts avoid technical jargon"
    - "Technical artifacts provide sufficient depth for evaluation"
    - "Delivery sequence respects audience dependencies"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "15-30 minutes (agent) + 30-60 minutes (human review)"
frequency: "Per engagement, updated as architecture evolves"
human_review_required: true
approval_workflow:
  - reviewer: "SA Agent"
    approval_gate: "Technical accuracy across all artifacts"
  - reviewer: "AE Agent"
    condition: "executive_artifact_included"
    approval_gate: "Executive messaging alignment"

last_updated: "2026-03-08"
version: "1.0"
status: "stub"
