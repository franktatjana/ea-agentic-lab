# PLAYBOOK: Solution Fit Assessment
# Bridge between discovery findings and solution design

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
playbook_id: "PB_SA_015"
steckbrief:
  playbook_id: "PB_SA_015"
  name: "Solution Fit Assessment"
  category: "solution_architects"
  mode: "ANALYTICAL"
  version: "1.0"
  status: "stub"

  one_liner: "Assess opportunity shape (transactional vs. strategic), map capabilities to customer needs, and construct a technology roadmap that bridges discovery findings to solution design"
  framework_origin: "SA Solution Fit Assessment Best Practices"

  owner_agent: "SA Agent"
  supporting_agents: ["Discovery Agent", "Best Practices Agent", "Decision Capture Agent"]

  triggers_summary:
    - "Technical discovery complete with validated pain points"
    - "SA-AE alignment needed on pursuit approach before solution design"
    - "Opportunity requires transactional vs. strategic assessment"

  anti_patterns:
    - "Solution framing before discovery (no validated pain points yet)"
    - "Jumping straight to HLD without assessing opportunity shape"
    - "Framing without AE collaboration (missing business context)"
    - "One-size-fits-all approach ignoring transactional vs. strategic signals"

  key_inputs:
    - "Technical discovery report from PB_SA_014"
    - "AE account context and business priorities"
    - "Pre-engagement research (public sources, industry data)"

  key_outputs:
    - artifact: "Opportunity Shape Assessment"
      format: "yaml"
    - artifact: "Capability-to-Need Mapping"
      format: "yaml"
    - artifact: "Technology Roadmap Outline"
      format: "yaml"
    - artifact: "Pursuit Approach Recommendation"
      format: "markdown"

  key_decisions:
    - "Transactional: point solution, limited scope, fast close"
    - "Strategic: enterprise transformation, multi-phase roadmap, exec engagement"
    - "Hybrid: land with transactional, expand to strategic"

  complexity: "MEDIUM"
  estimated_inputs: 5
  estimated_rules: 4

  source_file: "domain/playbooks/solution_architects/PB_SA_015_solution_fit_assessment.yaml"
  last_updated: "2026-03-08"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Solution Fit Assessment"
framework_source: "SA Solution Fit Assessment Best Practices"
playbook_mode: "ANALYTICAL"
playbook_category: "discovery_investigation"
intended_agent_role: "sa-agent"
secondary_agents: ["sa-discovery-agent", "sa-best-practices-agent", "sa-decision-capture-agent"]

primary_objective: "Bridge discovery findings to solution design by assessing opportunity shape, mapping customer needs to solution capabilities, and constructing a pursuit-aligned technology roadmap that the SA and AE jointly own"

knowledge_refs:
  - ref: "references/solution-fit-methodology.yaml"
    load_when: "Opportunity shape assessment, capability mapping, roadmap construction"
    provides: "Transactional vs strategic signals, capability framework, solution options, roadmap guidance, pursuit decision criteria"
  - ref: "references/discovery-methodology.yaml"
    load_when: "Pre-engagement intelligence gathering"
    provides: "Pre-engagement research sources and synthesis technique"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Opportunity assessments and pursuit strategies are internal. Technology roadmap outline may become customer-shareable after review."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized framing patterns by opportunity type and industry (quarterly)"

flow_bindings:
  description: "Maps solution framing phases to the agent flows that execute them"
  bindings:
    - phase: "Pre-engagement Intelligence"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Gather pre-engagement data from public sources: company reports, tech blogs, job postings, industry context"
    - phase: "Opportunity Shape Assessment"
      agent: sa-agent
      flow: meeting-support
      context: "SA-AE collaboration to assess transactional vs. strategic signals from discovery findings"
    - phase: "Capability Mapping"
      agent: sa-best-practices-agent
      flow: best-practices
      context: "Map discovered pain points and requirements to solution capability areas and reference architectures"
    - phase: "Roadmap Construction"
      agent: sa-best-practices-agent
      flow: best-practices
      context: "Construct phased technology roadmap aligned with customer business strategy and initiative timeline"
    - phase: "Pursuit Decision Capture"
      agent: sa-decision-capture-agent
      flow: decision-capture
      context: "Record opportunity shape decision, capability mapping rationale, and roadmap assumptions as ADRs"
    - phase: "SA-AE Alignment"
      agent: sa-agent
      flow: meeting-support
      context: "Joint SA-AE session to align on pursuit approach, next activities, and customer engagement plan"

when_not_to_use:
  - "Discovery not yet complete (use PB_SA_014 first)"
  - "Opportunity is clearly transactional with no ambiguity"
  - "Customer has already defined solution requirements in detail (proceed to PB_SA_003)"
  - "RFP-driven engagement with fixed scope (use RFP playbooks)"

raci:
  responsible:
    role: "SA Agent"
    agent: "sa_agent"
    description: "Assesses opportunity shape, maps capabilities, constructs roadmap, and recommends pursuit approach"

  accountable:
    role: "SA Manager"
    human_required: true
    description: "Reviews pursuit approach and resource investment alignment"
    approval_actions:
      - "approve"
      - "request_revision"
      - "redirect"

  consulted:
    - role: "AE Agent"
      on_steps: ["opportunity_shape_assessment", "pursuit_alignment", "business_priorities"]
    - role: "Best Practices Agent"
      on_steps: ["capability_mapping", "reference_architectures"]
    - role: "Discovery Agent"
      on_steps: ["pre_engagement_research"]

  informed:
    - role: "AE Agent"
      notify_on: ["framing_complete", "pursuit_approach_recommended"]
    - role: "CSP Agent"
      notify_on: ["roadmap_outline_available"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Technical discovery (PB_SA_014) complete with validated findings"
    - "AE requests SA input on pursuit approach for qualified opportunity"
    - "Multiple pain points discovered requiring prioritization and phasing"

  manual:
    - "SA initiates framing: '/frame {account}'"
    - "SA-AE alignment meeting scheduled for pursuit planning"

  conditional:
    - "IF discovery_complete AND pain_points > 3 THEN recommend_framing"
    - "IF opportunity_shape_unclear THEN trigger_assessment"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Technical discovery report (PB_SA_014 output)"
    - artifact: "AE account context and opportunity details"
    - artifact: "Customer pain points with priority ranking"

  optional:
    - artifact: "Pre-engagement research from public sources"
      use: "Build initial landscape understanding before customer contact"
    - artifact: "Industry vertical patterns from SK_SA_010"
      use: "Inform capability mapping with sector-specific patterns"
    - artifact: "Competitive intelligence"
      use: "Shape pursuit approach around differentiation"
    - artifact: "Customer's stated business strategy or initiatives"
      use: "Align roadmap with customer's own strategic direction"

  minimum_data_threshold:
    - "Discovery report with at least one validated pain point"
    - "AE input on opportunity context and commercial framing"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  opportunity_shape:
    - "Is this a point-solution need or an enterprise transformation initiative?"
    - "Does the customer have executive sponsorship for broader change?"
    - "Is the customer focused on a single tool/feature or on process improvement?"
    - "Is there appetite for organizational change, or only technology swap?"
    - "Is the problem in a silo (single team) or systemic (cross-organization)?"

  signals_for_strategic:
    - "Customer discusses process re-alignment, not just tool replacement"
    - "Multiple stakeholder groups involved or affected"
    - "Customer references industry trends, compliance mandates, or transformation"
    - "Customer engages on adoption, change management, and culture topics"
    - "Initial conversation earns invitation to broader or higher-level meetings"

  signals_for_transactional:
    - "Customer looking for specific feature to solve specific problem"
    - "No executive sponsor for broader initiative"
    - "Single team scope with limited organizational impact"
    - "Customer focused on tool comparison, not business outcomes"

  capability_mapping:
    - "Which capability areas address the highest-priority pain points?"
    - "What is the minimum viable solution that delivers initial value?"
    - "What capabilities extend the initial value into a broader platform?"
    - "Which capabilities require specialist SA involvement?"

  roadmap:
    - "What is the customer's initiative timeline?"
    - "What quick wins can demonstrate value within 30-90 days?"
    - "What is the phased approach from initial value to full platform?"
    - "How does the technology roadmap align with the customer's business milestones?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "systemic_pain AND exec_sponsor AND process_change_appetite"
      output_type: "Strategic Framing"
      decision: |
        FRAME as Strategic:
          approach: "Enterprise transformation with phased roadmap"
          engagement: "Multi-stakeholder, exec-level conversations"
          roadmap: "3-phase: quick win → core platform → full transformation"
          next_playbooks: "PB_SA_011 (VSD), PB_SA_003 (HLD), PB_SA_012 (eval)"

    - condition: "point_solution AND single_team AND no_exec_sponsor"
      output_type: "Transactional Framing"
      decision: |
        FRAME as Transactional:
          approach: "Targeted solution for specific problem"
          engagement: "Technical team focused, efficient"
          roadmap: "Single phase: solve immediate problem"
          next_playbooks: "PB_SA_006 (demo), PB_SA_012 (guided trial)"

    - condition: "point_entry BUT strategic_signals_present"
      output_type: "Land-and-Expand Framing"
      decision: |
        FRAME as Land-and-Expand:
          approach: "Enter with transactional win, expand strategically"
          engagement: "Start with technical team, build toward executive"
          roadmap: "Phase 1: point solution → Phase 2: broader platform"
          next_playbooks: "PB_SA_006 (demo for land), PB_SA_011 (VSD for expand)"

    - condition: "ambiguous_signals"
      output_type: "Additional Discovery Needed"
      decision: |
        DEFER Framing:
          action: "Schedule focused discovery on opportunity shape"
          questions: "Exec sponsorship, organizational scope, change appetite"
          next: "Return to PB_SA_014 with targeted questions"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/framing/solution_fit_assessment_{account}.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - pre_engagement_intelligence
      - opportunity_shape
      - capability_mapping
      - technology_roadmap
      - pursuit_approach

    schema:
      pre_engagement_intelligence:
        sources_reviewed: "array[string]"
        company_context: "string"
        technology_landscape: "string"
        industry_trends: "array[string]"
        initial_hypotheses: "array[string]"

      opportunity_shape:
        assessment: "string"  # strategic, transactional, land-and-expand
        signals: "array[string]"
        exec_sponsor: "boolean"
        organizational_scope: "string"
        change_appetite: "string"
        confidence: "string"

      capability_mapping:
        - pain_point: "string"
          capability_area: "string"
          solution_component: "string"
          priority: "string"
          specialist_needed: "boolean"

      technology_roadmap:
        phases:
          - phase: "string"
            objectives: "array[string]"
            capabilities: "array[string]"
            timeline: "string"
            success_criteria: "array[string]"
        quick_wins: "array[string]"
        dependencies: "array[string]"

      pursuit_approach:
        recommendation: "string"
        next_playbooks: "array[string]"
        sa_involvement_level: "string"
        ae_alignment_notes: "string"
        risk_factors: "array[string]"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Solution framing for {node}: {opportunity_shape} approach recommended"
    - recipient: "CSP Agent"
      condition: "strategic_framing"
      message: "Technology roadmap outline available for CSP planning"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "sa_ae_misalignment"
      reason: "SA and AE disagree on opportunity shape or pursuit approach"
      action: "SA Manager to mediate and align"

    - condition: "ambiguous_after_additional_discovery"
      reason: "Cannot determine opportunity shape even after targeted discovery"
      action: "SA Manager to assess whether to invest further"

    - condition: "strategic_but_no_resources"
      reason: "Strategic framing identified but SA capacity insufficient"
      action: "SA Manager to prioritize or request additional resources"

  insufficient_data:
    - "No discovery report available"
    - "No AE input on business context"
    - "No customer pain points validated"

  human_judgment_required:
    - "Choosing between transactional quick win vs. strategic long play"
    - "Deciding resource investment level for strategic pursuit"
    - "Navigating competing priorities between customer needs and product fit"
    - "Assessing when a transactional deal has hidden strategic potential"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Discovery report exists with validated pain points"
    - "AE has provided account context and commercial framing"

  post_execution:
    - "Opportunity shape assessment is evidence-based, not assumed"
    - "Capability mapping covers all high-priority pain points"
    - "Technology roadmap phases are time-bound and achievable"
    - "Pursuit approach includes recommended next playbooks"
    - "SA-AE alignment documented"

  output_quality:
    - "Transactional vs. strategic assessment cites specific signals"
    - "Roadmap phases have clear success criteria"
    - "Capability mapping distinguishes must-have from nice-to-have"
    - "Pursuit approach is actionable with concrete next steps"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "2-4 hours (pre-engagement research) + 1-2 hours (SA-AE alignment session)"
frequency: "Per qualified opportunity after discovery"
human_review_required: true
approval_workflow:
  - reviewer: "SA Agent"
    approval_gate: "Opportunity shape assessment supported by evidence"
  - reviewer: "AE Agent"
    approval_gate: "Pursuit approach aligns with commercial strategy"

last_updated: "2026-03-08"
version: "1.0"
status: "draft"
