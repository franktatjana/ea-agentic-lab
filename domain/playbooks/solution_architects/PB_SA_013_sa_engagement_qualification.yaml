# PLAYBOOK: SA Engagement Qualification
# Stage-gated engagement model with qualification checks

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
playbook_id: "PB_SA_013"
steckbrief:
  playbook_id: "PB_SA_013"
  name: "SA Engagement Qualification"
  category: "solution_architects"
  mode: "ASSESSMENT"
  version: "1.0"
  status: "stub"

  one_liner: "Qualify SA engagement through stage gates, MEDDPICC quality checks, and engagement mode selection to ensure SA time is invested in qualified opportunities"
  framework_origin: "SA Rules of Engagement / MEDDPICC"

  owner_agent: "SA Agent"
  supporting_agents: ["AE Agent"]

  triggers_summary:
    - "New SA engagement request from AE or sales leadership"
    - "Opportunity stage change requiring SA reassessment"
    - "Exception request for non-standard engagement"

  anti_patterns:
    - "SA engagement before opportunity is Stage 2+ qualified"
    - "No MEDDPICC scoring completed for the opportunity"
    - "Engagement without a Customer Success Plan"
    - "SA capacity overcommitted without prioritization"

  key_inputs:
    - "Opportunity details from CRM (stage, size, MEDDPICC score)"
    - "SA engagement request with use case description"
    - "Current SA capacity and workload"

  key_outputs:
    - artifact: "Engagement Qualification Assessment"
      format: "yaml"
    - artifact: "Engagement Mode Recommendation"
      format: "yaml"
    - artifact: "Exception Request (if applicable)"
      format: "yaml"

  key_decisions:
    - "Qualify: opportunity meets engagement criteria, assign SA"
    - "Defer: opportunity not yet qualified, return to AE with requirements"
    - "Exception: non-standard engagement, requires SA Manager approval"

  complexity: "MEDIUM"
  estimated_inputs: 4
  estimated_rules: 5

  source_file: "domain/playbooks/solution_architects/PB_SA_013_sa_engagement_qualification.yaml"
  last_updated: "2026-03-08"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "SA Engagement Qualification"
framework_source: "SA Rules of Engagement / MEDDPICC"
playbook_mode: "ASSESSMENT"
playbook_category: "pursuit_sales_support"
intended_agent_role: "sa-agent"
secondary_agents: []

primary_objective: "Ensure SA engagement is directed at qualified opportunities by applying stage gates, MEDDPICC quality checks, and engagement mode selection, maximizing SA impact on winnable deals"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Qualification assessments are internal sales process artifacts. Never shared with customers."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Aggregated qualification patterns and win/loss correlation (quarterly)"

flow_bindings:
  description: "Maps qualification phases to the agent flows that execute them"
  bindings:
    - phase: "Engagement Request Intake"
      agent: sa-agent
      flow: specialist-engagement
      context: "Receive and parse SA engagement request, extract opportunity details"
    - phase: "Stage Gate Validation"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Validate opportunity stage, MEDDPICC score, and CSP existence"
    - phase: "Engagement Mode Selection"
      agent: sa-agent
      flow: meeting-support
      context: "Determine engagement mode (consultative vs. high-velocity) based on stage and complexity"
    - phase: "Exception Processing"
      agent: sa-agent
      flow: specialist-engagement
      context: "Process exception requests for non-standard engagement, route for SA Manager approval"

when_not_to_use:
  - "Internal SA-initiated activity (not triggered by engagement request)"
  - "Existing engagement being continued (already qualified)"
  - "Post-sale customer success activities (different qualification criteria)"

raci:
  responsible:
    role: "SA Agent"
    agent: "sa_agent"
    description: "Evaluates engagement request against qualification criteria and recommends engagement mode"

  accountable:
    role: "SA Manager"
    human_required: true
    description: "Approves exceptions, resolves capacity conflicts, final engagement decision"
    approval_actions:
      - "approve"
      - "defer"
      - "exception_approve"

  consulted:
    - role: "AE Agent"
      on_steps: ["opportunity_context", "meddpicc_validation"]

  informed:
    - role: "AE Agent"
      notify_on: ["qualification_decision"]
    - role: "SA Manager"
      notify_on: ["exception_request"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "New SA engagement request submitted via standard process"
    - "Opportunity stage changes to Stage 2 or higher"
    - "SA resource reallocation triggered by capacity change"

  manual:
    - "AE requests SA: '/sa request {opportunity}'"
    - "SA Manager reassigns SA resources"

  conditional:
    - "IF new_engagement_request THEN qualify"
    - "IF opportunity_stage_change AND sa_assigned THEN requalify"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Opportunity details (stage, ARR, account tier)"
    - artifact: "MEDDPICC score or qualification status"
    - artifact: "Use case or technical challenge description"

  optional:
    - artifact: "Customer Success Plan"
      use: "Validates CSP requirement at Stage 2"
    - artifact: "Competitive landscape"
      use: "Informs engagement urgency and depth"
    - artifact: "SA capacity dashboard"
      use: "Informs resource availability for assignment"

  minimum_data_threshold:
    - "Opportunity stage identified"
    - "MEDDPICC score available or reason for exception"
    - "Use case described with enough detail for SA scoping"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  stage_gate:
    - "What is the current opportunity stage?"
    - "Is the MEDDPICC score above the engagement threshold?"
    - "Does a Customer Success Plan exist for this account?"
    - "Is there an identified technical champion on the customer side?"

  engagement_mode:
    - "Is this a strategic deal requiring deep, consultative SA engagement?"
    - "Or is this a high-velocity deal requiring lightweight, efficient SA support?"
    - "What is the expected SA time commitment?"
    - "Are specialist SAs needed for domain-specific requirements?"

  exception_criteria:
    - "Why does this opportunity not meet standard qualification criteria?"
    - "What business justification supports the exception?"
    - "What is the expected outcome if SA engages despite non-qualification?"
    - "Who is sponsoring the exception request?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "stage >= 2 AND meddpicc_qualified AND csp_exists"
      output_type: "Qualified: Consultative Engagement"
      decision: |
        APPROVE Engagement:
          mode: "Consultative"
          sa_involvement: "Deep technical engagement"
          activities: "Discovery, architecture, demo, POV as needed"
          commitment: "Named SA assigned through close"

    - condition: "stage >= 3 AND meddpicc_qualified AND standard_use_case"
      output_type: "Qualified: High-Velocity Engagement"
      decision: |
        APPROVE Engagement:
          mode: "High-velocity"
          sa_involvement: "Targeted, efficient support"
          activities: "Focused demo, trial support, technical validation"
          commitment: "SA pooled support, not named assignment"

    - condition: "stage < 2 OR meddpicc_not_qualified"
      output_type: "Deferred"
      decision: |
        DEFER Engagement:
          action: "Return to AE with qualification requirements"
          requirements: "Advance to Stage 2, complete MEDDPICC, create CSP"
          follow_up: "Re-evaluate when requirements met"

    - condition: "qualification_not_met AND business_justification_provided"
      output_type: "Exception Request"
      decision: |
        ROUTE Exception:
          action: "Submit to SA Manager for exception approval"
          documentation: "Business justification, expected outcome, risk"
          tracking: "Exception logged in CRM for pattern analysis"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/engagement/qualification_{opportunity}.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - qualification_assessment
      - engagement_recommendation
      - exception_request

    schema:
      qualification_assessment:
        opportunity_stage: "string"
        meddpicc_score: "string"
        csp_exists: "boolean"
        technical_champion: "string"
        qualification_result: "string"  # qualified, deferred, exception

      engagement_recommendation:
        mode: "string"  # consultative, high-velocity, deferred
        sa_assignment: "string"  # named, pooled, none
        expected_activities: "array[string]"
        time_commitment: "string"
        specialist_needed: "boolean"

      exception_request:
        justification: "string"
        sponsor: "string"
        expected_outcome: "string"
        risk: "string"
        approval_status: "string"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "SA engagement qualification for {node}: {qualification_result}"
    - recipient: "SA Manager"
      condition: "exception_requested"
      message: "Exception request for {node}: requires approval"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "capacity_conflict"
      reason: "SA resources overcommitted, cannot take new engagement"
      action: "SA Manager to prioritize and reallocate"

    - condition: "exception_requires_approval"
      reason: "Non-standard engagement requires human judgment"
      action: "SA Manager reviews and decides"

    - condition: "meddpicc_data_missing"
      reason: "Cannot qualify without opportunity data"
      action: "AE to complete MEDDPICC before resubmitting"

  insufficient_data:
    - "No opportunity stage information"
    - "No MEDDPICC score or qualification data"
    - "No use case description"

  human_judgment_required:
    - "Capacity trade-offs between competing opportunities"
    - "Exception approval for strategic but unqualified deals"
    - "SA specialist assignment decisions"
    - "Engagement mode selection for edge cases"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Engagement request contains opportunity identifier"
    - "CRM data accessible for stage and MEDDPICC lookup"

  post_execution:
    - "Qualification decision documented with rationale"
    - "Engagement mode specified with expected activities"
    - "AE notified of qualification outcome"
    - "Exception requests routed to SA Manager"

  output_quality:
    - "Qualification criteria applied consistently"
    - "Engagement mode matches opportunity characteristics"
    - "Exception justifications are specific and auditable"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "5-15 minutes (qualification check) + variable (exception processing)"
frequency: "Per new SA engagement request or opportunity stage change"
human_review_required: false  # automated for standard qualification, human for exceptions
approval_workflow:
  - reviewer: "SA Agent"
    approval_gate: "Standard qualification criteria met"
  - reviewer: "SA Manager"
    condition: "exception_requested == true"
    approval_gate: "Business justification reviewed"

last_updated: "2026-03-08"
version: "1.0"
status: "draft"
