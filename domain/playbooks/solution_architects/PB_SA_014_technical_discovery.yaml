# PLAYBOOK: Technical Discovery
# Structured customer technical landscape assessment

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
playbook_id: "PB_SA_014"
steckbrief:
  playbook_id: "PB_SA_014"
  name: "Technical Discovery"
  category: "solution_architects"
  mode: "ASSESSMENT"
  version: "1.0"
  status: "stub"

  one_liner: "Structured methodology for understanding a customer's technical landscape, pain points, requirements, and use cases to inform solution design and pursuit strategy"
  framework_origin: "SA Technical Discovery Best Practices"

  owner_agent: "SA Agent"
  supporting_agents: ["Discovery Agent", "Best Practices Agent"]

  triggers_summary:
    - "SA engagement qualified and assigned to opportunity"
    - "New customer relationship requiring technical understanding"
    - "Existing account with new use case or expansion initiative"

  anti_patterns:
    - "Discovery without qualified engagement (PB_SA_013 not passed)"
    - "Jumping to solution design before understanding current state"
    - "Single-session discovery for complex environments"
    - "Discovery without stakeholder access beyond single contact"

  key_inputs:
    - "Account context (industry, size, maturity)"
    - "Engagement qualification output from PB_SA_013"
    - "Known pain points or use cases from AE"

  key_outputs:
    - artifact: "Technical Discovery Report"
      format: "yaml"
    - artifact: "Current State Architecture Summary"
      format: "yaml"
    - artifact: "Pain Point Inventory"
      format: "yaml"
    - artifact: "Use Case Validation Matrix"
      format: "yaml"

  key_decisions:
    - "Discovery depth: lightweight (single session) vs. comprehensive (multi-session)"
    - "Discovery incomplete: schedule follow-up sessions for missing areas"
    - "Specialist needed: trigger specialist engagement for domain-specific discovery"

  complexity: "MEDIUM"
  estimated_inputs: 5
  estimated_rules: 4

  source_file: "domain/playbooks/solution_architects/PB_SA_014_technical_discovery.yaml"
  last_updated: "2026-03-08"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Technical Discovery"
framework_source: "SA Technical Discovery Best Practices"
playbook_mode: "ASSESSMENT"
playbook_category: "discovery_investigation"
intended_agent_role: "sa-agent"
secondary_agents: ["sa-discovery-agent", "sa-best-practices-agent"]

primary_objective: "Build a comprehensive understanding of the customer's technical landscape, identify validated pain points and use cases, and produce a discovery report that informs solution design, demo targeting, and pursuit strategy"

knowledge_refs:
  - ref: "references/discovery-methodology.yaml"
    load_when: "All discovery sessions"
    provides: "Discussion areas, persona engagement guides, SA-AE collaboration model, pre-engagement research framework"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Discovery findings contain customer-sensitive technical details. Sanitized patterns contribute to global knowledge."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized discovery patterns by industry vertical (after engagement closes)"

flow_bindings:
  description: "Maps discovery phases to the agent flows that execute them"
  bindings:
    - phase: "Discovery Planning"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Plan discovery sessions: identify stakeholders, prepare question framework, set discovery objectives"
    - phase: "Current State Assessment"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Map customer's current architecture, tools, integrations, processes, and team structure"
    - phase: "Pain Point Elicitation"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Identify, validate, and prioritize customer pain points through structured questioning"
    - phase: "Requirements Gathering"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Capture functional, non-functional, compliance, and integration requirements"
    - phase: "Use Case Identification"
      agent: sa-best-practices-agent
      flow: best-practices
      context: "Validate use cases against product capabilities and industry patterns"
    - phase: "Stakeholder Technical Profiling"
      agent: sa-agent
      flow: meeting-support
      context: "Profile technical stakeholders: roles, influence, concerns, technical depth"
    - phase: "Discovery Synthesis"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Synthesize findings into discovery report with validated pain points, requirements, and recommended next steps"

when_not_to_use:
  - "Engagement not qualified (use PB_SA_013 first)"
  - "Customer already well-understood from active engagement (use incremental updates)"
  - "RFP response with no customer access (use document-based analysis instead)"
  - "Post-sale engagement (different discovery model under CA)"

raci:
  responsible:
    role: "SA Agent"
    agent: "sa_agent"
    description: "Plans and conducts discovery sessions, synthesizes findings into discovery report"

  accountable:
    role: "SA Manager"
    human_required: true
    description: "Reviews discovery completeness and validates readiness to proceed to solution design"
    approval_actions:
      - "approve"
      - "request_additional_discovery"

  consulted:
    - role: "AE Agent"
      on_steps: ["account_context", "stakeholder_access", "commercial_priorities"]
    - role: "Specialist Agent"
      on_steps: ["domain_specific_discovery"]
    - role: "Best Practices Agent"
      on_steps: ["use_case_validation"]

  informed:
    - role: "AE Agent"
      notify_on: ["discovery_complete", "critical_finding"]
    - role: "CSP Agent"
      notify_on: ["discovery_complete"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "SA engagement qualified via PB_SA_013"
    - "New opportunity assigned to SA"
    - "Account expansion with new use case identified"

  manual:
    - "SA initiates discovery: '/discovery plan {account}'"
    - "AE requests technical deep-dive for qualified opportunity"

  conditional:
    - "IF engagement_qualified AND no_discovery_report THEN plan_discovery"
    - "IF new_use_case AND existing_account THEN incremental_discovery"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Account context (industry, size, geography, maturity)"
    - artifact: "Engagement qualification output or known use case"
    - artifact: "Primary stakeholder contact for discovery sessions"

  optional:
    - artifact: "AE account notes and relationship context"
      use: "Inform discovery approach and stakeholder dynamics"
    - artifact: "Industry vertical patterns from SK_SA_010"
      use: "Pre-load industry-specific discovery questions"
    - artifact: "Competitive intelligence"
      use: "Focus discovery on differentiating capabilities"
    - artifact: "Previous discovery reports (for expansion)"
      use: "Build on existing knowledge, avoid re-discovery"

  minimum_data_threshold:
    - "Account name and industry identified"
    - "At least one stakeholder available for discovery session"
    - "Use case or problem area defined at high level"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  current_state:
    - "What is the current architecture for this use case?"
    - "What tools and platforms are in use today?"
    - "What integrations exist between systems?"
    - "How many users/teams are involved in this workflow?"
    - "What is the current deployment model (cloud, on-prem, hybrid)?"

  pain_points:
    - "What are the biggest challenges with the current approach?"
    - "Where do teams spend the most time on manual or repetitive work?"
    - "What breaks most often or causes the most incidents?"
    - "What has the customer already tried to solve this?"
    - "What is the business impact of these pain points?"

  requirements:
    - "What must the solution support from day one (hard requirements)?"
    - "What compliance or regulatory requirements apply?"
    - "What are the performance and scale expectations?"
    - "What integration points are non-negotiable?"
    - "What is the timeline for implementation?"

  stakeholders:
    - "Who is the technical decision-maker?"
    - "Who will evaluate and approve the architecture?"
    - "Who are the end users affected by this change?"
    - "Who controls budget for this initiative?"
    - "Are there blockers or skeptics we need to address?"

  use_cases:
    - "What are the top 3 use cases to address first?"
    - "Which use case delivers the most visible value?"
    - "Which use case is technically simplest to prove?"
    - "Are there dependencies between use cases?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "new_account AND complex_environment"
      output_type: "Comprehensive Discovery (multi-session)"
      decision: |
        EXECUTE Comprehensive Discovery:
          sessions: "3-5 sessions across stakeholder groups"
          coverage: "Architecture, pain points, requirements, use cases, stakeholders"
          duration: "2-4 weeks"
          output: "Full discovery report with prioritized findings"

    - condition: "new_account AND standard_use_case"
      output_type: "Focused Discovery (single session)"
      decision: |
        EXECUTE Focused Discovery:
          sessions: "1-2 sessions with key stakeholders"
          coverage: "Current state, primary pain points, core requirements"
          duration: "1 week"
          output: "Focused discovery report"

    - condition: "existing_account AND new_use_case"
      output_type: "Incremental Discovery"
      decision: |
        EXECUTE Incremental Discovery:
          sessions: "1 session focused on new use case"
          coverage: "Delta from existing knowledge, new requirements"
          duration: "1-3 days"
          output: "Discovery addendum to existing report"

    - condition: "domain_specific_requirements_detected"
      output_type: "Specialist Discovery Trigger"
      decision: |
        TRIGGER Specialist Engagement:
          action: "Engage specialist SA via PB_SA_013 specialist path"
          domains: "Security, observability, search, or other specialist area"
          coordination: "Joint discovery session with specialist"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/discovery/discovery_report_{account}.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - discovery_summary
      - current_state
      - pain_points
      - requirements
      - use_cases
      - stakeholder_profiles
      - next_steps

    schema:
      discovery_summary:
        account: "string"
        industry: "string"
        discovery_type: "string"  # comprehensive, focused, incremental
        sessions_conducted: "integer"
        completeness_score: "string"  # complete, partial, gaps_identified
        key_findings: "array[string]"

      current_state:
        architecture_overview: "string"
        platforms: "array[string]"
        integrations: "array[string]"
        deployment_model: "string"
        team_structure: "string"
        scale: "string"

      pain_points:
        - pain_point: "string"
          severity: "string"
          business_impact: "string"
          current_workaround: "string"
          addressable: "boolean"
          priority: "integer"

      requirements:
        functional: "array[string]"
        non_functional: "array[string]"
        compliance: "array[string]"
        integration: "array[string]"
        timeline: "string"

      use_cases:
        - use_case: "string"
          priority: "integer"
          complexity: "string"
          addressable: "boolean"
          capability_mapping: "string"
          quick_win: "boolean"

      stakeholder_profiles:
        - name: "string"
          role: "string"
          influence: "string"
          concerns: "array[string]"
          technical_depth: "string"
          disposition: "string"

      next_steps:
        recommended_actions: "array[string]"
        next_playbook: "string"  # PB_SA_006 (demo), PB_SA_011 (VSD), PB_SA_012 (eval)
        specialist_needed: "boolean"
        follow_up_discovery: "boolean"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Technical discovery for {node}: {completeness_score}, {key_findings_count} findings"
    - recipient: "CSP Agent"
      condition: "discovery_complete"
      message: "Discovery report available for CSP planning"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "no_stakeholder_access"
      reason: "Cannot conduct discovery without customer stakeholder participation"
      action: "AE to facilitate stakeholder introductions"

    - condition: "discovery_blocked_by_nda"
      reason: "Customer unable to share technical details without NDA"
      action: "Legal/AE to resolve NDA before discovery proceeds"

    - condition: "scope_expanding_beyond_engagement"
      reason: "Discovery revealing scope significantly larger than qualified engagement"
      action: "SA Manager to reassess engagement scope and resource commitment"

  insufficient_data:
    - "No stakeholder available for discovery sessions"
    - "No use case or problem area identified"
    - "Account context too vague to plan discovery"

  human_judgment_required:
    - "Prioritizing which pain points to focus on when all seem critical"
    - "Deciding discovery depth when customer time is limited"
    - "Handling discovery findings that contradict AE's opportunity narrative"
    - "Navigating sensitive topics (competitor displacement, team changes)"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Engagement qualified via PB_SA_013 or equivalent"
    - "At least one stakeholder identified for discovery"
    - "Discovery objectives defined"

  post_execution:
    - "Current state documented with architecture and tools"
    - "Pain points prioritized with business impact"
    - "Requirements captured (functional, non-functional, compliance)"
    - "Use cases identified and validated against capabilities"
    - "Next steps recommended with playbook references"

  output_quality:
    - "Discovery report is comprehensive enough to inform solution design"
    - "Pain points are customer-validated, not assumed"
    - "Requirements distinguish hard constraints from preferences"
    - "Stakeholder profiles capture influence and concerns accurately"
    - "Completeness score reflects actual coverage gaps"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "1-4 weeks depending on discovery type"
frequency: "Per new engagement or account expansion"
human_review_required: true
approval_workflow:
  - reviewer: "SA Agent"
    approval_gate: "Discovery report covers all required areas"
  - reviewer: "SA Manager"
    condition: "comprehensive_discovery == true"
    approval_gate: "Discovery findings support pursuit investment"

last_updated: "2026-03-08"
version: "1.0"
status: "draft"
