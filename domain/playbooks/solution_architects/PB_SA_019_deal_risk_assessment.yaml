# PLAYBOOK: Deal Risk Assessment
# Technical feasibility, integration complexity, and risk-weighted scoring

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
playbook_id: "PB_SA_019"
steckbrief:
  playbook_id: "PB_SA_019"
  name: "Deal Risk Assessment"
  category: "solution_architects"
  mode: "ASSESSMENT"
  version: "1.0"
  status: "draft"

  one_liner: "Assess deal-specific technical risks by validating solution feasibility, evaluating integration complexity, identifying resource and skills gaps, and producing risk-weighted scores with actionable mitigation plans"
  framework_origin: "Technical Risk Assessment / PMBOK Risk Management"

  owner_agent: "SA Agent"
  supporting_agents: ["Delivery Agent", "PS Agent", "Specialist Agent"]

  triggers_summary:
    - "Solution design proposed for a deal requiring feasibility validation"
    - "Complex integration or migration identified during discovery"
    - "Deal review requests technical risk assessment before commit"

  anti_patterns:
    - "Risk assessment without technical discovery (no data to assess)"
    - "Binary pass/fail without risk-weighted scoring"
    - "Ignoring integration complexity in favor of feature-only assessment"
    - "Skipping resource and skills gap analysis"
    - "Risk assessment performed only once, never refreshed as deal evolves"

  key_inputs:
    - "Technical discovery report and solution design"
    - "Customer environment details and integration requirements"
    - "Delivery capacity and specialist availability"

  key_outputs:
    - artifact: "Technical Risk Register"
      format: "yaml"
    - artifact: "Integration Complexity Assessment"
      format: "yaml"
    - artifact: "Resource Gap Analysis"
      format: "yaml"
    - artifact: "Risk-Weighted Deal Score"
      format: "yaml"

  key_decisions:
    - "Proceed: risks are manageable with documented mitigation plans"
    - "Mitigate first: critical risks must be addressed before deal commitment"
    - "Escalate: risks exceed SA authority, require leadership or product decision"
    - "No-go: technical risks too high, recommend deal restructure or withdrawal"

  complexity: "HIGH"
  estimated_inputs: 6
  estimated_rules: 5

  source_file: "domain/playbooks/solution_architects/PB_SA_019_deal_risk_assessment.yaml"
  last_updated: "2026-03-26"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Deal Risk Assessment"
framework_source: "Technical Risk Assessment / PMBOK Risk Management"
playbook_mode: "ASSESSMENT"
playbook_category: "risk_management"
intended_agent_role: "sa-agent"
secondary_agents: ["Delivery Agent", "PS Agent", "Specialist Agent"]

primary_objective: "Identify, quantify, and plan mitigation for deal-specific technical risks across solution feasibility, integration complexity, resource availability, and customer readiness, producing a risk-weighted score that informs the go/no-go commit decision"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Risk registers, gap analyses, and deal scores are internal strategic assessments. Exposing risk scoring to the customer would undermine negotiation position."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized risk patterns by deal type, industry, and integration complexity (quarterly)"

flow_bindings:
  description: "Maps risk assessment phases to the agent flows that execute them"
  bindings:
    - phase: "Solution Feasibility Validation"
      agent: sa-risk-agent
      flow: technical-risk
      context: "Validate proposed solution against customer requirements, identify capability gaps and architectural constraints"
    - phase: "Integration Complexity Assessment"
      agent: sa-risk-agent
      flow: technical-risk
      context: "Assess integration points, data migration complexity, API compatibility, and environmental dependencies"
    - phase: "Resource and Skills Gap Analysis"
      agent: sa-agent
      flow: specialist-engagement
      context: "Evaluate delivery team capacity, specialist skills availability, and customer-side resource readiness"
    - phase: "Risk Scoring and Prioritization"
      agent: sa-risk-agent
      flow: technical-risk
      context: "Score each risk by probability and impact, produce risk-weighted deal score"
    - phase: "Mitigation Planning"
      agent: sa-agent
      flow: specialist-engagement
      context: "Develop mitigation plans for high and critical risks, assign owners and timelines"
    - phase: "Risk Decision Capture"
      agent: sa-decision-capture-agent
      flow: decision-capture
      context: "Document risk assessment decisions, accepted risks, and mitigation commitments"

when_not_to_use:
  - "Standard, low-complexity deal with proven solution pattern"
  - "Technical discovery not yet completed (assess risk after understanding requirements)"
  - "Post-sale engagement (use delivery risk management instead)"
  - "Non-technical risks only (commercial, legal, or relationship risks handled by other roles)"

raci:
  responsible:
    role: "SA Agent"
    agent: "sa_agent"
    description: "Conducts technical risk assessment, scores risks, and builds mitigation plans"

  accountable:
    role: "SA Manager"
    human_required: true
    description: "Reviews risk assessment, approves risk acceptance, and decides go/no-go for high-risk deals"
    approval_actions:
      - "approve"
      - "mitigate_first"
      - "no_go"

  consulted:
    - role: "Delivery Agent"
      on_steps: ["implementation_feasibility", "resource_availability"]
    - role: "PS Agent"
      on_steps: ["professional_services_capacity", "skills_assessment"]
    - role: "Specialist Agent"
      on_steps: ["domain_specific_risk_assessment"]

  informed:
    - role: "AE Agent"
      notify_on: ["risk_assessment_complete", "critical_risk_identified", "no_go_recommendation"]
    - role: "Delivery Agent"
      notify_on: ["risk_register_available"]
    - role: "PS Agent"
      notify_on: ["resource_gap_identified"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Solution design completed for complex or non-standard deal"
    - "Deal review scheduled requiring technical risk input"
    - "Integration requirements exceed standard patterns"

  manual:
    - "SA initiates risk assessment: '/risk-assess {account} {opportunity}'"
    - "SA Manager requests deal risk review before commit"

  conditional:
    - "IF solution_design_complete AND integration_count > 3 THEN trigger_risk_assessment"
    - "IF deal_size > threshold AND non_standard_architecture THEN require_risk_assessment"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Technical discovery report (PB_SA_014 output)"
    - artifact: "Proposed solution design or architecture (PB_SA_003 output)"
    - artifact: "Customer integration requirements and environment details"
    - artifact: "Delivery timeline and resource expectations"

  optional:
    - artifact: "Previous implementation lessons from similar deals"
      use: "Identify recurring risk patterns"
    - artifact: "Specialist assessment for domain-specific risks"
      use: "Cover security, compliance, or domain-specific risk dimensions"
    - artifact: "Customer technical maturity assessment"
      use: "Assess customer's ability to support implementation"
    - artifact: "PS resource calendar and skills inventory"
      use: "Validate resource availability for implementation"

  minimum_data_threshold:
    - "Solution design proposed with architecture components identified"
    - "Integration points enumerated"
    - "Delivery timeline defined at high level"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  feasibility:
    - "Does the proposed solution address all validated customer requirements?"
    - "Are there capability gaps between what was proposed and what the product supports?"
    - "What architectural constraints exist that limit solution options?"
    - "Has this solution pattern been delivered successfully before?"
    - "What are the non-functional requirements (scale, performance, availability) and can we meet them?"

  integration:
    - "How many integration points does the solution require?"
    - "What data migration is involved, and what is the volume and complexity?"
    - "Are the customer's APIs documented, stable, and accessible?"
    - "What authentication and authorization mechanisms need integration?"
    - "What is the customer's change management process for production integrations?"

  resources:
    - "Does the delivery team have experience with this solution pattern?"
    - "Are specialist skills required that are currently scarce?"
    - "What customer-side resources are needed, and are they committed?"
    - "Is the implementation timeline realistic given resource availability?"
    - "What training or enablement is needed before implementation begins?"

  customer_readiness:
    - "Does the customer have the technical infrastructure to support the solution?"
    - "Is the customer organization ready for the change this solution introduces?"
    - "Are there organizational blockers (security review, architecture board) in the path?"
    - "Does the customer have a realistic expectation of implementation effort?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "all_risks_low_or_medium AND mitigations_defined"
      output_type: "Proceed with Mitigations"
      decision: |
        PROCEED:
          risk_score: "Acceptable"
          action: "Document mitigations, assign owners, proceed to commit"
          monitoring: "Track risk register during implementation"
          review: "Risk register reviewed at each delivery checkpoint"

    - condition: "critical_risks_present AND mitigations_viable"
      output_type: "Mitigate Before Commit"
      decision: |
        MITIGATE FIRST:
          risk_score: "Elevated"
          action: "Execute critical risk mitigations before deal commitment"
          timeline: "Mitigation actions must complete before contract signature"
          escalation: "SA Manager reviews mitigation progress weekly"

    - condition: "critical_risks_present AND mitigations_not_viable"
      output_type: "Escalate"
      decision: |
        ESCALATE:
          risk_score: "High"
          action: "Escalate to SA Manager and leadership for risk acceptance decision"
          documentation: "Full risk register with probability, impact, and failed mitigation options"
          options: "Accept risk, restructure deal, phase implementation, or withdraw"

    - condition: "showstopper_risk_identified"
      output_type: "No-Go Recommendation"
      decision: |
        RECOMMEND No-Go:
          risk_score: "Unacceptable"
          reason: "Technical risk exceeds acceptable threshold with no viable mitigation"
          action: "Recommend deal restructure or withdrawal"
          documentation: "Specific risk that drives no-go, alternatives explored"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/risk/deal_risk_assessment_{opportunity}.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - risk_register
      - integration_complexity
      - resource_gap_analysis
      - risk_weighted_score

    schema:
      risk_register:
        - risk_id: "string"
          category: "string"  # feasibility, integration, resource, customer_readiness
          description: "string"
          probability: "string"  # low, medium, high
          impact: "string"  # low, medium, high, critical
          risk_score: "integer"  # probability x impact (1-16 scale)
          mitigation: "string"
          mitigation_owner: "string"
          mitigation_timeline: "string"
          residual_risk: "string"
          status: "string"  # identified, mitigating, mitigated, accepted

      integration_complexity:
        total_integration_points: "integer"
        complexity_rating: "string"  # low, medium, high, very_high
        integrations:
          - system: "string"
            type: "string"  # API, data_migration, event, batch
            complexity: "string"
            risk_factors: "array[string]"
            prerequisites: "array[string]"
        data_migration:
          volume: "string"
          complexity: "string"
          transformation_needed: "boolean"
          estimated_duration: "string"

      resource_gap_analysis:
        delivery_readiness: "string"  # ready, gaps_identified, not_ready
        gaps:
          - skill_area: "string"
            gap_type: "string"  # capacity, expertise, tooling
            severity: "string"
            mitigation: "string"
        customer_readiness: "string"
        customer_gaps: "array[string]"

      risk_weighted_score:
        overall_score: "integer"
        risk_level: "string"  # acceptable, elevated, high, unacceptable
        recommendation: "string"  # proceed, mitigate_first, escalate, no_go
        key_risks: "array[string]"
        mitigated_risks: "array[string]"
        accepted_risks: "array[string]"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Deal risk assessment for {node}: {risk_level} risk, recommendation: {recommendation}"
    - recipient: "SA Manager"
      condition: "critical_or_unacceptable_risk"
      message: "Critical risk identified for {node}: {key_risk_summary}"
    - recipient: "Delivery Agent"
      condition: "resource_gaps_identified"
      message: "Resource gaps identified for {node}: {gap_summary}"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "showstopper_risk"
      reason: "Risk with no viable mitigation that would prevent successful delivery"
      action: "SA Manager and leadership decide accept, restructure, or withdraw"

    - condition: "resource_gap_critical"
      reason: "Required skills or capacity not available within deal timeline"
      action: "PS leadership to assess resource options or timeline adjustment"

    - condition: "customer_readiness_insufficient"
      reason: "Customer lacks infrastructure, skills, or organizational readiness"
      action: "SA and AE to discuss readiness plan with customer before committing"

  insufficient_data:
    - "No solution design proposed for the deal"
    - "Integration requirements not identified"
    - "Delivery timeline not defined"

  human_judgment_required:
    - "Accepting residual risk on critical integration dependencies"
    - "Trading off implementation timeline against risk mitigation completeness"
    - "Deciding whether customer readiness gaps are deal-breakers or addressable"
    - "Evaluating whether a phased implementation reduces risk sufficiently"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Solution design or architecture exists for this deal"
    - "Integration points have been identified during discovery"
    - "Delivery timeline expectations are documented"

  post_execution:
    - "Risk register covers all four categories: feasibility, integration, resource, customer readiness"
    - "Every high or critical risk has a mitigation plan with owner and timeline"
    - "Integration complexity rating is justified by enumerated integration points"
    - "Resource gap analysis covers both vendor and customer-side readiness"
    - "Risk-weighted score produces a clear recommendation"

  output_quality:
    - "Risk probabilities and impacts are justified, not arbitrary"
    - "Mitigation plans are actionable with specific steps, not generic statements"
    - "Integration complexity assessment includes prerequisites and dependencies"
    - "Resource gaps distinguish between capacity and expertise issues"
    - "Overall recommendation is supported by the aggregated risk evidence"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "3-5 hours (assessment) + 1 hour (mitigation planning)"
frequency: "Per deal at commit stage, refreshed when deal scope or architecture changes"
human_review_required: true
approval_workflow:
  - reviewer: "SA Agent"
    approval_gate: "Risk register is complete and mitigations are viable"
  - reviewer: "SA Manager"
    approval_gate: "Risk-weighted score and recommendation approved"
  - reviewer: "SA Manager"
    condition: "risk_level == 'high' OR risk_level == 'unacceptable'"
    approval_gate: "Leadership risk acceptance or no-go decision"

last_updated: "2026-03-26"
version: "1.0"
status: "draft"
