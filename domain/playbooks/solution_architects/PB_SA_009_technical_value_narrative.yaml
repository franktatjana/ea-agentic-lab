# PLAYBOOK: Technical Value Narrative
# Maps technical capabilities to quantified business outcomes

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
playbook_id: "PB_SA_009"
steckbrief:
  playbook_id: "PB_SA_009"
  name: "Technical Value Narrative"
  category: "solution_architects"
  mode: "GENERATIVE"
  version: "1.0"
  status: "stub"

  one_liner: "Bridge technical capabilities to quantified business outcomes, constructing ROI narratives grounded in architecture evidence and risk reduction"
  framework_origin: "Value Engineering - Technical Value Articulation"

  owner_agent: "SA Agent"
  supporting_agents: ["VE Agent", "AE Agent"]

  triggers_summary:
    - "Solution description complete, business case needed"
    - "Executive presentation requires value justification"
    - "Customer requests ROI or TCO analysis from technical perspective"

  anti_patterns:
    - "No solution design exists (cannot articulate value of undefined solution)"
    - "Pure pricing discussion (commercial, not technical value)"
    - "Generic value propositions not tied to customer's specific situation"

  key_inputs:
    - "Solution design (HLD from PB_SA_003)"
    - "Sizing estimation (from PB_SA_002)"
    - "Risk assessment findings"
    - "Customer business objectives"

  key_outputs:
    - artifact: "Technical Value Narrative"
      format: "markdown"
    - artifact: "Capability-to-Outcome Map"
      format: "yaml"

  key_decisions:
    - "Insufficient technical evidence: gather more data before constructing narrative"
    - "Business objectives unclear: collaborate with AE to clarify"
    - "Multiple audience needs: create audience-specific value variants"

  complexity: "MEDIUM"
  estimated_inputs: 5
  estimated_rules: 3

  source_file: "domain/playbooks/solution_architects/PB_SA_009_technical_value_narrative.yaml"
  last_updated: "2026-03-08"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Technical Value Narrative"
framework_source: "Value Engineering - Technical Value Articulation"
playbook_mode: "GENERATIVE"
playbook_category: "content_generation"
intended_agent_role: "sa-agent"
secondary_agents: ["VE Agent", "AE Agent"]

primary_objective: "Construct value narratives that translate technical architecture decisions, risk mitigations, and capability deployments into quantified business outcomes the customer can use for internal justification"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "The internal narrative draft includes vendor-side reasoning and competitive positioning. The customer-facing version is sanitized."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Customer-facing value summary (sanitized, no competitive positioning)"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized value narrative patterns by industry vertical"

flow_bindings:
  description: "Maps value narrative phases to the agent flows that execute them"
  bindings:
    - phase: "Technical Capability Inventory"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Extract deployed capabilities, architecture components, and their technical characteristics"
    - phase: "Business Outcome Mapping"
      agent: sa-best-practices-agent
      flow: best-practices
      context: "Apply industry patterns to map capabilities to expected business outcomes"
    - phase: "ROI Evidence Assembly"
      agent: sa-risk-agent
      flow: technical-risk
      context: "Quantify risk reduction, performance improvement, and capacity efficiency"
    - phase: "Narrative Construction"
      agent: sa-agent
      flow: meeting-support
      context: "Prepare value narrative document with talking points"
    - phase: "Audience Adaptation"
      agent: sa-agent
      flow: meeting-support
      context: "Adapt narrative depth and language for executive, technical, or operational audiences"

when_not_to_use:
  - "No solution design exists"
  - "Pure pricing or commercial discussion"
  - "Generic value propositions not tied to customer's specific situation"
  - "Customer has own value assessment process they prefer"

raci:
  responsible:
    role: "SA Agent"
    agent: "sa_agent"
    description: "Constructs technical value narrative bridging capabilities to business outcomes"

  accountable:
    role: "SA Manager"
    human_required: true
    description: "Reviews value claims for accuracy and defensibility"
    approval_actions:
      - "approve"
      - "request_revision"

  consulted:
    - role: "VE Agent"
      on_steps: ["roi_methodology", "value_quantification"]
    - role: "AE Agent"
      on_steps: ["business_priorities", "customer_language"]

  informed:
    - role: "AE Agent"
      notify_on: ["value_narrative_complete"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Solution description (PB_SA_003) completed"
    - "Executive meeting scheduled requiring value justification"
    - "Customer requests ROI or business case from technical perspective"

  manual:
    - "SA prepares value narrative: '/value narrative {account}'"
    - "AE requests technical value support for proposal"

  conditional:
    - "IF solution_description_complete AND executive_meeting_scheduled THEN trigger"
    - "IF customer_requests_roi AND technical_evidence_available THEN trigger"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Solution design or HLD from PB_SA_003"
    - artifact: "Customer business objectives"

  optional:
    - artifact: "Sizing estimation from PB_SA_002"
      use: "Quantify capacity and performance improvements"
    - artifact: "Risk assessment findings"
      use: "Quantify risk reduction value"
    - artifact: "Industry benchmarks"
      use: "Contextualize value claims with industry data"
    - artifact: "Customer's existing solution costs"
      use: "Enable TCO comparison"

  minimum_data_threshold:
    - "Solution design exists"
    - "At least one business objective identified"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  capability_mapping:
    - "What technical capabilities does the solution provide?"
    - "What problem does each capability solve for the customer?"
    - "What is the current alternative (manual process, competitor, none)?"

  outcome_quantification:
    - "What measurable improvement does each capability enable?"
    - "What risk is reduced and what is the cost of that risk materializing?"
    - "What efficiency gain can be quantified (time, cost, resources)?"

  narrative_framing:
    - "What language does the customer use for business outcomes?"
    - "Who needs to be convinced (executive sponsor, technical decision maker)?"
    - "What internal justification process does the customer follow?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "solution_design_complete AND business_objectives_clear"
      output_type: "Value Narrative (complete)"
      decision: |
        CREATE Value Narrative:
          structure: "Capability → outcome → evidence → quantification"
          format: "Executive summary + detailed mapping"

    - condition: "technical_evidence_strong AND business_objectives_unclear"
      output_type: "Action Required"
      decision: |
        DEFER Full Narrative:
          action: "Collaborate with AE to clarify business objectives"
          produce: "Technical capability inventory (partial deliverable)"

    - condition: "multiple_audiences"
      output_type: "Value Narrative (multi-audience)"
      decision: |
        CREATE Audience Variants:
          executive: "Outcome and ROI focus, minimal technical detail"
          technical: "Architecture value, risk reduction, scalability"
          operational: "Efficiency gains, operational simplification"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/value/technical_value_narrative.md"
    vault_type: "internal"
    format: "markdown"
    sections:
      - executive_value_summary
      - capability_outcome_map
      - roi_evidence
      - risk_reduction_value
      - narrative_document

    schema:
      capability_outcome_map:
        - capability: "string"
          technical_description: "string"
          business_outcome: "string"
          quantification: "string"
          evidence_source: "string"

      roi_evidence:
        efficiency_gains: "array[{area, current_cost, projected_cost, savings}]"
        risk_reductions: "array[{risk, probability, impact, mitigation_value}]"
        performance_improvements: "array[{metric, current, projected, business_value}]"

  customer_facing_artifact:
    path: "{realm}/{node}/external-infohub/value/value_summary.md"
    vault_type: "customer"
    description: "Sanitized value summary without competitive positioning or internal reasoning"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Technical value narrative ready for {node}"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "no_solution_design"
      reason: "Cannot articulate value of undefined solution"
      action: "Complete solution description (PB_SA_003) first"

    - condition: "value_claims_unsubstantiated"
      reason: "Cannot make value claims without technical evidence"
      action: "SA to gather additional evidence or narrow scope"

  insufficient_data:
    - "No solution design exists"
    - "No business objectives documented"

  human_judgment_required:
    - "Quantifying soft benefits (e.g., improved developer experience)"
    - "Selecting which value dimensions to emphasize"
    - "Validating ROI assumptions"

# ==============================================================================
# CONTENT GUARDRAILS
# ==============================================================================
content_guardrails:
  must_include:
    - "Every value claim linked to specific technical capability"
    - "Quantification with stated assumptions"
    - "Evidence source for each claim"

  must_exclude:
    - "Unsubstantiated value claims"
    - "Competitor-specific comparisons in customer-facing version"
    - "Internal pricing or margin information"

  tone:
    - "Evidence-based, not aspirational"
    - "Customer-outcome focused, not feature-focused"
    - "Specific to customer's situation, not generic"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Solution design exists"
    - "Business objectives documented"

  post_execution:
    - "Every capability maps to a business outcome"
    - "Quantifications have stated assumptions"
    - "Customer-facing version contains no competitive positioning"

  output_quality:
    - "Value narrative uses customer language"
    - "ROI calculations are defensible"
    - "Evidence sources are cited"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "20-30 minutes (agent) + 30-60 minutes (human review)"
frequency: "Per engagement, updated as solution evolves"
human_review_required: true
approval_workflow:
  - reviewer: "SA Agent"
    approval_gate: "Technical accuracy of capability claims"
  - reviewer: "VE Agent"
    condition: "roi_calculations_included"
    approval_gate: "Value quantification methodology"

last_updated: "2026-03-08"
version: "1.0"
status: "stub"
