# PLAYBOOK: Office Hours with Enterprise Clients
# Recurring technical engagement for existing enterprise accounts
# Version 1.0 - PLAYBOOK_EXECUTION_SPECIFICATION standard

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
playbook_id: "PB_SA_016"
steckbrief:
  playbook_id: "PB_SA_016"
  name: "Office Hours with Enterprise Clients"
  category: "solution_architects"
  mode: "OPERATIONAL"
  version: "1.0"
  status: "production_ready"

  one_liner: "Recurring technical engagement with existing enterprise clients combining product momentum, embedded discovery, and qualified next steps"
  framework_origin: "Account Governance Best Practices"

  owner_agent: "SA Engagement Agent"
  supporting_agents: ["SA Best Practices Agent", "SA Discovery Agent", "CA Agent", "AE Agent", "Specialist Agent"]

  triggers_summary:
    - "Monthly or quarterly cadence based on account tier"
    - "Customer requests recurring technical touchpoint"
    - "Post-sales account without dedicated CA (SA covers full lifecycle)"

  anti_patterns:
    - "Sales call disguised as technical session"
    - "Training session (use enablement playbook instead)"
    - "Support call for issue resolution (handle separately)"
    - "Filling 60 minutes with content when there is nothing to cover"
    - "Generic product walkthrough not adapted to client context"

  key_inputs:
    - "Account context and current product version"
    - "Client primary use case (Observability / Security / Search)"
    - "Prior session notes and open technical questions"

  key_outputs:
    - artifact: "Session Summary with Next Steps"
      format: "markdown"
    - artifact: "Discovery Findings"
      format: "yaml"
    - artifact: "CRM Update (sentiment, signals, next step)"
      format: "yaml"

  key_decisions:
    - "Topic not ready: remove from agenda or bring SME support"
    - "Client shows strong interest: slow down, go deeper, identify concrete next step"
    - "Client disengaged: surface with direct question, do not continue delivering content"
    - "Closing block at risk: compress content blocks, never cut Q&A"

  complexity: "MEDIUM"
  estimated_inputs: 6
  estimated_rules: 5

  source_file: "domain/playbooks/solution_architects/PB_SA_016_office_hours.yaml"
  last_updated: "2026-03-15"

# ==============================================================================
# APPLICABILITY
# ==============================================================================
# Office Hours is a shared activity between SA and CA roles.
# Who owns it depends on the account footprint, not just deal stage:
#   - Accounts with dedicated CA: SA runs Office Hours for technical depth,
#     CA is briefed on outcomes and integrates into CSP/health tracking
#   - Accounts without dedicated CA (smaller footprint): SA covers
#     the full lifecycle including Office Hours, effectively absorbing
#     CA responsibilities for recurring engagement
# The playbook is SA-owned because the SA drives the technical content,
# demo selection, and embedded discovery regardless of coverage model.

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Office Hours with Enterprise Clients"
framework_source: "Account Governance Best Practices"
playbook_mode: "OPERATIONAL"
playbook_category: "relationship_governance"
intended_agent_role: "sa-engagement-agent"
secondary_agents: ["SA Best Practices Agent", "SA Discovery Agent", "CA Agent", "AE Agent", "Specialist Agent"]

primary_objective: "Maintain recurring technical engagement with existing enterprise clients that demonstrates product momentum, deepens the technical relationship, and surfaces qualified expansion signals through embedded discovery"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Session prep, discovery findings, and internal briefings are vendor-internal. The follow-up summary shared with the client is customer-facing."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Session summary email with topics covered, resource links, and confirmed next steps"

flow_bindings:
  description: "Maps Office Hours phases to the agent flows that execute them"
  bindings:
    - phase: "Pre-Session Preparation"
      agent: sa-engagement-agent
      flow: office-hours
      context: "Gather account context, confirm agenda, prepare topic blocks and discovery questions"
    - phase: "Topic Delivery"
      agent: sa-best-practices-agent
      flow: best-practices
      context: "Product updates, architecture patterns, and best practices relevant to client context"
    - phase: "Demo Execution"
      agent: sa-engagement-agent
      flow: office-hours
      context: "Select demo format and prepare click-through or live demo assets"
    - phase: "Embedded Discovery"
      agent: sa-engagement-agent
      flow: office-hours
      context: "Discovery questions placed at natural transition points in content"
    - phase: "Session Flow Adaptation"
      agent: sa-engagement-agent
      flow: office-hours
      context: "Real-time adaptation based on client engagement signals"
    - phase: "Follow-Up"
      agent: sa-engagement-agent
      flow: office-hours
      context: "Summary email, CRM update, AE/CA briefing, expansion signal routing"

when_not_to_use:
  - "Account in first 30 days post-signature (use onboarding playbook)"
  - "Active support escalation in progress (resolve first, then resume cadence)"
  - "No prior engagement context exists (run discovery first with PB_SA_014)"
  - "QBR is scheduled within 2 weeks (consolidate into QBR instead)"
  - "Client explicitly questioned the value of recurring sessions (escalate to SA Manager)"

raci:
  responsible:
    role: "SA Engagement Agent"
    agent: "sa_engagement_agent"
    description: "Prepares, conducts, and follows up on Office Hours sessions including content selection, embedded discovery, and demo execution"

  accountable:
    role: "SA Manager"
    human_required: true
    description: "Reviews session quality indicators, escalation criteria, and recurring value"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted:
    - role: "CA Agent"
      on_steps: ["pre_session_briefing", "account_context", "csp_integration"]
    - role: "AE Agent"
      on_steps: ["account_context", "expansion_signals"]
    - role: "Specialist Agent"
      on_steps: ["complex_technical_topics"]

  informed:
    - role: "AE Agent"
      notify_on: ["expansion_signal_identified", "session_complete"]
    - role: "CA Agent"
      notify_on: ["session_complete", "discovery_findings", "health_signal"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "office_hours_cadence_due"
      description: "Recurring Office Hours session approaching based on account tier"
      timing: "5 business days before scheduled session"
      condition: "$.account.tier IN ['strategic', 'enterprise'] AND $.office_hours.cadence_active == true"

    - event: "product_release_relevant"
      description: "Major product release relevant to client's primary use case"
      condition: "$.product.release.use_cases INTERSECT $.account.primary_use_cases"

    - event: "sa_covers_ca_responsibilities"
      description: "Account without dedicated CA, SA maintains full engagement rhythm"
      condition: "$.account.ca_assigned == false AND $.account.last_technical_engagement_days > 21"

  manual:
    - "SA schedules Office Hours for account"
    - "Customer requests recurring technical touchpoint"
    - "AE requests SA-led technical engagement for existing account"

  conditional:
    - condition: "$.account.tier == 'strategic' AND $.office_hours.last_session > 30_days"
      description: "Strategic account overdue for monthly Office Hours"

    - condition: "$.account.tier == 'enterprise' AND $.office_hours.last_session > 90_days"
      description: "Enterprise account overdue for quarterly Office Hours"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
validation_inputs:
  mandatory:
    - artifact: "{realm}/{node}/external-infohub/overview.md"
      description: "Account overview and primary use case"
    - artifact: "Client current product version"
      description: "Version determines feature availability, never assume latest"
    - artifact: "Confirmed agenda topics with run order"
      description: "Topics reflecting both product momentum and client context"

  optional:
    - artifact: "{realm}/{node}/internal-infohub/engagements/calls/"
      use: "Prior session notes for continuity and open questions"
    - artifact: "{realm}/{node}/external-infohub/planning/success_plan.yaml"
      use: "CSP context when CA is assigned (maturity positioning)"
    - artifact: "{realm}/{node}/internal-infohub/stakeholders/relationship_map.md"
      use: "Attendee context and champion identification"
    - artifact: "Product release notes since last session"
      use: "Identify updates directly relevant to client environment"

  minimum_data_threshold:
    - "Client primary use case known"
    - "At least one prior engagement with this account"
    - "Current product version confirmed"

# ==============================================================================
# PRE-SESSION PREPARATION
# ==============================================================================
preparation:
  mandatory_24h_before:
    - task: "Confirm agenda topics and run order"
      owner: "SA"
      note: "Topics should reflect both product momentum and client context"
    - task: "Identify client current product version"
      owner: "SA"
      note: "Version determines feature availability, never assume latest"
    - task: "Confirm client primary use case"
      owner: "SA"
      note: "Observability vs Security vs Search changes content emphasis"
    - task: "Open all demo environments in advance"
      owner: "SA"
      note: "Click-through demos preferred, live demos require rehearsal"
    - task: "Identify one prior conversation reference"
      owner: "SA"
      note: "Shows continuity, signals you know this account specifically"

  recommended_48_72h_before:
    - "Review account notes for open technical questions from last session"
    - "Check product updates since last session relevant to this client"
    - "Prepare 3-4 embedded discovery questions tailored to client maturity level"
    - "Brief AE/AM on planned content so they can flag account context"
    - "If CA assigned: get CSP status and any health signals"

  topic_readiness_check:
    description: "For each topic on the agenda, the SA should be able to answer without looking"
    questions:
      - "What is the single sentence that captures the value for this client's context?"
      - "What are the two or three technical facts most likely to come up as questions?"
      - "What is the most common misconception, and how is it corrected?"
      - "What is the correct next step if the client shows strong interest in this topic?"
    rule: "If any of these cannot be answered before the session, the topic is not ready. Remove it from the agenda or bring SME support."

# ==============================================================================
# SESSION STRUCTURE
# ==============================================================================
session_structure:
  standard_60min:
    description: "Default template for recurring Office Hours"
    blocks:
      - block: "Opening + context-setting"
        duration: "5 min"
        purpose: "Agenda, framing, first discovery question"
      - block: "Topic block 1"
        duration: "10-12 min"
        purpose: "Content + embedded discovery question at transition"
      - block: "Topic block 2"
        duration: "10-12 min"
        purpose: "Content + demo (if applicable)"
      - block: "Topic block 3"
        duration: "10-12 min"
        purpose: "Content + embedded discovery question at transition"
      - block: "Topic block 4 (optional)"
        duration: "8-10 min"
        purpose: "Content, shorter if time constrained"
      - block: "Next steps + Q&A"
        duration: "10 min"
        purpose: "Maturity positioning, concrete follow-up"

  scaling:
    45_min:
      max_topic_blocks: 2
      demos: "None (no live demos)"
      emphasis: "Stronger focus on discovery and next steps"
    60_min:
      max_topic_blocks: 4
      demos: "1-2 click-through demos"
      emphasis: "Balanced content and discovery"
    90_min:
      max_topic_blocks: 4
      demos: "Live demo possible, hands-on lab feasible"
      emphasis: "Deeper Q&A, can accommodate Instruqt hands-on lab"

  non_negotiable_rule:
    description: "Reserve 10 minutes for close"
    rationale: "The last 10 minutes are the highest-value part of the session. This is where the client articulates what they want to do next and where blockers surface. Cutting this block to extend content delivery is the single most common preparation failure. Content that didn't fit can be sent as follow-up. A missed closing conversation cannot be recovered."
    enforcement: "Compress content blocks if running over. Never compress the closing block."

# ==============================================================================
# EMBEDDED DISCOVERY MODEL
# ==============================================================================
embedded_discovery:
  principle: "Discovery questions are placed at natural transition points in the content, not as a separate block. Each question is binary or forced-choice to prevent open-ended responses that consume disproportionate time."

  why_not_sequential: |
    Asking discovery questions as a separate block after content delivery creates three problems:
    it consumes time allocated to something else, it feels like a sales call to the client,
    and the answers come too late to change the content that was just delivered.

  question_types:
    structural:
      placement: "Opening, after context slide"
      purpose: "Calibrates everything that follows"
      example: "Before we start, where would you place yourselves on the maturity curve today, and what's driving the conversation internally?"

    technical_depth:
      placement: "After first topic block"
      purpose: "Determines how deep to go"
      format: "Binary"
      example: "Are you already running X in your environment, or is this still on the roadmap?"

    pain_point:
      placement: "After demo or AI/automation block"
      purpose: "Surfaces where time and effort go"
      format: "Forced choice"
      example: "When you think about [relevant problem], where does most of the time go: [option A] or [option B]?"

    closing:
      placement: "Before next steps"
      purpose: "Produces concrete next step and surfaces blockers"
      example: "Based on what we covered, what's the one thing you'd want to try first, and is there anything blocking you from moving forward?"
      note: "The second part ('is there anything blocking you') is essential. Budget constraints, version gaps, and internal approval requirements surface here and almost nowhere else."

  signal_interpretation:
    - signal: "Heavy questions on data collection / agent architecture"
      interpretation: "Active migration in progress"
      action: "Slow down, go deeper"
    - signal: "Questions about AI and natural language interfaces"
      interpretation: "Leadership mandate"
      action: "Position the full AI stack"
    - signal: "Questions about cost and resource requirements"
      interpretation: "Procurement cycle"
      action: "Surface TCO and sizing resources"
    - signal: "Silence"
      interpretation: "Content not relevant, or audience not the right one"
      action: "Surface with a direct question rather than continuing"

# ==============================================================================
# DEMO STRATEGY
# ==============================================================================
demo_strategy:
  principle: "A demo concludes a content block. It is proof of concept, not introduction. The sequence is always: establish the concept, show the demo as confirmation, move on."

  anti_pattern: "A demo that opens a block before context is established creates a viewing experience without comprehension. A demo that runs for more than 5 minutes in a 60-minute session consumes a disproportionate share of time."

  format_selection:
    - format: "Click-through (navattic / demo gallery)"
      when: "Default for all 60-min sessions"
      risk: "None, no environment dependency"
    - format: "Live internal demo environment"
      when: "Client-specific data is relevant"
      risk: "Requires rehearsal and stable environment"
    - format: "Hands-on lab (Instruqt)"
      when: "90-min sessions, or as post-session follow-up"
      risk: "Time-intensive, not suitable for mixed audiences"

  hygiene:
    - "All tabs open before the session starts, not during"
    - "Click-through demos do not require apology or framing as 'just a walkthrough', they are the actual UI"
    - "If live demo environment is used, have click-through fallback ready"
    - "Hard stop at 4-5 minutes per demo"

# ==============================================================================
# KEY QUESTIONS
# ==============================================================================
key_questions:
  pre_session:
    - "What happened since the last session that changes this client's context?"
    - "Which product updates are directly relevant to this client's environment?"
    - "What open technical questions remain from the last session?"
    - "What is the client's current maturity level for each topic on the agenda?"

  during_session:
    - "Where does the client place themselves on the maturity curve?"
    - "Which topics generate the most engagement?"
    - "What signals indicate migration, procurement, or leadership mandate?"
    - "What is blocking the client from moving forward?"

  post_session:
    - "Did the closing question produce a specific next step with a named owner?"
    - "What discovery findings should inform the next session or trigger another playbook?"
    - "Should session frequency or content emphasis change based on what was learned?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - id: "topic_not_ready"
      condition: "topic_readiness_check.any_question_unanswerable == true"
      severity: "MEDIUM"
      output_type: "Action"
      decision:
        title: "Topic Not Ready for Delivery"
        context: "SA cannot answer readiness check questions for a planned topic"
        recommendation: "Remove topic from agenda or bring SME support"
        actions:
          - "Remove topic from this session's agenda"
          - "If topic is important: engage Specialist Agent for SME co-presentation"
          - "Reschedule topic for next session with proper preparation"

    - id: "strong_engagement_signal"
      condition: "$.session.topic_engagement == 'heavy_questions' AND $.session.time_remaining > 15"
      severity: "LOW"
      output_type: "Action"
      decision:
        title: "Strong Client Engagement, Adjust Session Flow"
        context: "Client is deeply engaged on a topic, signaling active initiative"
        recommendation: "Slow down, go deeper on this topic, compress or drop remaining topics"
        actions:
          - "Extend current topic block"
          - "Compress or skip remaining topic blocks"
          - "Protect closing block (10 min minimum)"
          - "Identify concrete next step for this topic specifically"

    - id: "client_disengaged"
      condition: "$.session.engagement == 'silence' AND $.session.topics_delivered >= 1"
      severity: "MEDIUM"
      output_type: "Action"
      decision:
        title: "Client Disengaged, Content May Not Be Relevant"
        context: "Client is not asking questions or engaging with content"
        recommendation: "Surface with direct question rather than continuing delivery"
        actions:
          - "Ask directly: 'Is this relevant to what your team is working on right now?'"
          - "If not relevant: pivot to client-driven topics"
          - "If audience mismatch: note for next session planning"

    - id: "closing_block_at_risk"
      condition: "$.session.time_remaining < 15 AND $.session.closing_not_started == true"
      severity: "HIGH"
      output_type: "Action"
      decision:
        title: "Closing Block at Risk, Content Overrun"
        context: "Less than 15 minutes remaining and closing conversation not started"
        recommendation: "Stop content delivery immediately, transition to closing"
        actions:
          - "Cut current topic block"
          - "Transition to closing question"
          - "Send remaining content as follow-up"

    - id: "expansion_signal_detected"
      condition: "$.discovery.pain_point_surfaced == true AND $.discovery.next_step_interest == 'strong'"
      severity: "LOW"
      output_type: "Action + Signal"
      decision:
        title: "Expansion Signal Detected in Office Hours"
        context: "Client expressed strong interest in a capability adjacent to current deployment"
        recommendation: "Capture signal, offer specific follow-up, brief AE"
        actions:
          - "Offer specific follow-up option (not generic 'let us know')"
          - "Document signal in CRM update"
          - "Brief AE Agent on expansion opportunity"
          - "If CA assigned: brief CA Agent for CSP integration"
        stakeholders: ["AE", "CA"]

    - id: "session_value_questioned"
      condition: "$.client.feedback == 'questions_value' OR $.session.consecutive_no_next_step >= 3"
      severity: "HIGH"
      output_type: "Risk + Escalation"
      decision:
        title: "Client Questions Value of Recurring Session"
        context: "Client explicitly questioned value, or three consecutive sessions produced no concrete next step"
        recommendation: "Escalate to SA Manager for review"
        actions:
          - "Acknowledge feedback directly"
          - "Escalate to SA Manager"
          - "Review session format, frequency, and content relevance"
          - "Consider pausing cadence until value proposition is re-established"
        stakeholders: ["SA Manager"]
      creates:
        - object_type: "Risk"
          category: "relationship"
          severity: "HIGH"

# ==============================================================================
# FOLLOW-UP STANDARDS
# ==============================================================================
follow_up:
  within_24h:
    - task: "Summary email to client"
      content: "Topics covered, links to resources mentioned, confirmed next step with owner and date"
      vault: "Customer InfoHub"
    - task: "CRM update"
      content: "Discovery outcomes, client sentiment, expansion signals"
      vault: "Internal Account Hub"
    - task: "Brief to AE/AM"
      content: "What was covered, what client responded to, recommended next step"
    - task: "Brief to CA (if assigned)"
      content: "Discovery findings, health signals, any CSP-relevant outcomes"

  follow_up_menu:
    description: "Standard follow-up options to offer at close. The SA should offer one specific option, not a generic 'let us know what you need.'"
    options:
      - option: "Hands-on lab (Instruqt)"
        best_for: "Clients who want to explore a specific feature independently"
      - option: "POC scoping call"
        best_for: "Clients who expressed interest in testing a feature on their data"
      - option: "Architecture review"
        best_for: "Clients with active migration or deployment decisions"
      - option: "Maturity Assessment workshop"
        best_for: "Clients who engaged with the maturity curve and want to formalise their position"
      - option: "Targeted enablement session"
        best_for: "Clients whose team has a specific skill gap surfaced during the session"

# ==============================================================================
# QUALITY INDICATORS
# ==============================================================================
quality_indicators:
  session_went_well:
    - "Client asked questions that went beyond the slide content"
    - "At least one embedded discovery question was answered and informed a content decision mid-session"
    - "The closing question produced a specific next step with a named owner"
    - "The session ended on time or slightly early without awkward padding"

  session_needs_improvement:
    - "SA talked for more than 80% of the session"
    - "No discovery question was asked before the closing block"
    - "Next step at close was 'we'll follow up' without a specific owner or date"
    - "A client question was deflected to documentation rather than answered or honestly deferred"

  escalation_criteria:
    - trigger: "Client explicitly questions the value of the recurring session"
      action: "SA Manager visibility required"
    - trigger: "Three consecutive sessions with no concrete next step produced"
      action: "SA Manager review of session approach"
    - trigger: "Technical question beyond SA scope requires SME involvement"
      action: "Engage Specialist Agent for next session"

# ==============================================================================
# COMMON PREPARATION FAILURES
# ==============================================================================
common_failures:
  - failure: "Too many topics on the agenda"
    cause: "SA defaults to 'show everything new'"
    correction: "Maximum four topic blocks. Pick the most relevant to this client's context."

  - failure: "No discovery before closing"
    cause: "SA treats session as content delivery"
    correction: "Place first discovery question in opening five minutes, embedded in context slide."

  - failure: "Demo runs over time"
    cause: "No time limit set in advance"
    correction: "Set hard stop at 4-5 minutes. Use click-through format to maintain control."

  - failure: "Closing block cut short"
    cause: "Content overran"
    correction: "Protect last 10 minutes explicitly. Compress content blocks, never Q&A."

  - failure: "Generic content not adapted to client"
    cause: "Preparation focused on slides, not context"
    correction: "Read last session notes before every call. Reference at least one client-specific detail in opening."

# ==============================================================================
# RELATIONSHIP TO ACCOUNT GOVERNANCE
# ==============================================================================
governance_position:
  description: "Office Hours sits between QBR (strategic, exec-facing, backward-looking) and ad-hoc support (reactive, issue-driven). It is the session where the SA demonstrates product momentum, deepens the technical relationship, and surfaces qualified next steps."
  relationships:
    - touchpoint: "QBR (PB_CA_001)"
      relationship: "Office Hours surfaces technical depth. QBR synthesises business impact. Office Hours feeds QBR content."
    - touchpoint: "Ad-hoc support"
      relationship: "Office Hours is not for issue resolution. If an issue surfaces, note it and handle separately."
    - touchpoint: "Expansion pipeline"
      relationship: "Office Hours is the primary mechanism for surfacing organic expansion signals. Discovery questions should identify use cases adjacent to current deployment."
    - touchpoint: "Champion development"
      relationship: "The recurring nature builds the technical relationship with internal advocates. This is the highest-ROI account investment an SA can make over a multi-year relationship."
    - touchpoint: "Cadence Calls (PB_CA_005)"
      relationship: "When CA is assigned, Office Hours complements CA cadence calls. CA handles operational rhythm, SA handles technical depth. When SA covers CA responsibilities, Office Hours may absorb some cadence call functions."

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/external-infohub/engagements/office_hours/session_{YYYY_MM_DD}.md"
    vault_type: "customer"
    format: "markdown"
    sections:
      - session_summary
      - topics_covered
      - resources_shared
      - next_steps

    schema:
      session_summary:
        date: "date"
        duration: "string"
        attendees: "array[person]"
        session_number: "integer"

      topics_covered:
        - topic: "string"
          client_engagement: "enum[high|medium|low]"
          demo_shown: "boolean"
          key_takeaway: "string"

      next_steps:
        - action: "string"
          owner: "string"
          due_date: "date"
          type: "enum[hands_on_lab|poc_scoping|architecture_review|maturity_assessment|enablement|other]"

  internal_artifact:
    path: "{realm}/{node}/internal-infohub/engagements/office_hours/session_{YYYY_MM_DD}_internal.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - discovery_findings
      - expansion_signals
      - client_sentiment
      - quality_assessment

    schema:
      discovery_findings:
        - question_asked: "string"
          response_summary: "string"
          signal_type: "enum[migration|procurement|leadership_mandate|skill_gap|none]"
          action_required: "string"

      expansion_signals:
        - use_case: "string"
          interest_level: "enum[strong|moderate|none]"
          next_step: "string"
          ae_briefed: "boolean"

      client_sentiment:
        overall: "enum[positive|neutral|concerned]"
        engagement_level: "enum[high|medium|low]"
        value_perception: "enum[high|medium|low|questioned]"

      quality_assessment:
        discovery_question_answered: "boolean"
        closing_produced_next_step: "boolean"
        sa_talk_ratio: "number"
        session_ended_on_time: "boolean"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Office Hours completed for {node}: sentiment {sentiment}, next step: {next_step}"

    - recipient: "CA Agent"
      condition: "$.account.ca_assigned == true"
      message: "Office Hours session for {node}: discovery findings and health signals available"

    - recipient: "AE Agent"
      condition: "$.expansion_signals.any.interest_level == 'strong'"
      message: "Expansion signal from Office Hours for {node}: {use_case}"

    - recipient: "SA Manager"
      condition: "$.quality_assessment.consecutive_no_next_step >= 3 OR $.client_sentiment.value_perception == 'questioned'"
      message: "Office Hours quality concern for {node}: review required"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "client_questions_session_value"
      reason: "Client explicitly questions whether recurring sessions are worthwhile"
      action: "SA Manager to review format, frequency, and content approach"

    - condition: "technical_question_beyond_scope"
      reason: "Question requires domain expertise beyond SA scope"
      action: "Engage Specialist Agent or SME for targeted follow-up"

    - condition: "three_sessions_no_next_step"
      reason: "Pattern indicates session format or content is not generating value"
      action: "SA Manager review, consider pausing cadence"

  insufficient_data:
    - "No prior engagement with this account"
    - "Client primary use case unknown"
    - "Current product version not confirmed"

  ambiguity_signals:
    - "Client sends mixed signals on engagement value"
    - "Attendee list keeps changing session to session"
    - "Client requests topics outside SA scope (commercial, contractual)"

  human_judgment_required:
    - "Selecting which topics are most relevant for this specific client"
    - "Deciding when to slow down vs. move on based on client engagement"
    - "Determining whether silence indicates disinterest or audience mismatch"
    - "Choosing the right follow-up option to offer at close"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Client primary use case confirmed"
    - "Current product version identified"
    - "Agenda topics pass readiness check"
    - "Demo environments pre-loaded (if applicable)"
    - "Prior session notes reviewed"

  post_execution:
    - "Summary email sent to client within 24 hours"
    - "CRM updated with discovery outcomes and sentiment"
    - "AE briefed on session outcomes"
    - "CA briefed (if assigned) on discovery findings"
    - "Next session date confirmed"

  output_quality:
    - "Closing question produced specific next step with named owner"
    - "At least one embedded discovery question answered during session"
    - "Content adapted to client context (not generic)"
    - "SA talk ratio below 80%"
    - "Session ended on time"

# ==============================================================================
# INTEGRATION WITH OTHER PLAYBOOKS
# ==============================================================================
integrates_with:
  - playbook: "PB_CA_001_customer_qbr"
    integration: "Office Hours technical findings feed QBR content"
    provides: "Technical depth, adoption signals, and discovery findings"

  - playbook: "PB_CA_005_cadence_calls"
    integration: "Complements CA cadence rhythm with technical depth"
    provides: "Technical engagement that cadence calls reference"
    note: "When SA covers CA responsibilities, Office Hours may absorb cadence call functions"

  - playbook: "PB_SA_006_technical_demo_preparation"
    integration: "Demo preparation for Office Hours topics"
    provides: "Demo scenarios and click-through assets"

  - playbook: "PB_SA_014_technical_discovery"
    integration: "Embedded discovery model adapted from full discovery playbook"
    provides: "Discovery methodology for transition-point questions"

  - playbook: "PB_CA_008_customer_success_plan"
    integration: "Office Hours discovery findings update CSP when CA is assigned"
    provides: "Maturity signals and adoption progress"

  - playbook: "PB_CA_007_customer_health_score"
    integration: "Session quality indicators feed health score dimensions"
    provides: "Engagement health signals"

  - playbook: "PB_SA_012_technical_evaluation_execution"
    integration: "Office Hours may trigger POC scoping as follow-up"
    provides: "POC interest signal from embedded discovery"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "2-4 hours preparation + 45-90 min session + 1 hour follow-up"
frequency: "Monthly (strategic accounts) or quarterly (enterprise accounts)"
human_review_required: false
approval_workflow:
  - reviewer: "SA"
    approval_gate: "Agenda topics pass readiness check"
  - reviewer: "SA Manager"
    condition: "escalation_criteria_met == true"
    approval_gate: "Review session approach and client engagement value"

last_updated: "2026-03-15"
version: "1.0"
status: "production_ready"
notes: "SA-owned recurring technical engagement. Shared activity between SA and CA, with ownership determined by account footprint. When no CA is assigned, SA covers the full engagement lifecycle including Office Hours."
