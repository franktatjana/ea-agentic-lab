# PLAYBOOK: Technical Win Strategy
# Technical success criteria, evaluation design, and objection mitigation

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
playbook_id: "PB_SA_018"
steckbrief:
  playbook_id: "PB_SA_018"
  name: "Technical Win Strategy"
  category: "solution_architects"
  mode: "GENERATIVE"
  version: "1.0"
  status: "draft"

  one_liner: "Plan the technical win for active deals by defining success criteria with the buyer, designing evaluation frameworks, mitigating technical objections, and aligning to MEDDPICC technical pain and champion coaching"
  framework_origin: "MEDDPICC Technical Validation / Presales Win Planning"

  owner_agent: "SA Agent"
  supporting_agents: ["AE Agent", "POC Agent", "VE Agent"]

  triggers_summary:
    - "Qualified opportunity entering technical evaluation stage"
    - "AE and SA align on need for structured technical win plan"
    - "Competitive deal requiring deliberate technical strategy"

  anti_patterns:
    - "No defined success criteria (hoping to win on relationships alone)"
    - "Technical win plan created without AE alignment on deal strategy"
    - "Ignoring MEDDPICC gaps, especially technical pain and champion"
    - "Win strategy that does not address known technical objections"
    - "POC or benchmark plan without measurable exit criteria"

  key_inputs:
    - "Technical discovery report and solution fit assessment"
    - "MEDDPICC scorecard with technical pain and champion status"
    - "Competitive positioning analysis (if competitive deal)"

  key_outputs:
    - artifact: "Technical Win Plan"
      format: "yaml"
    - artifact: "Evaluation Framework Design"
      format: "yaml"
    - artifact: "Objection Mitigation Matrix"
      format: "yaml"
    - artifact: "Champion Coaching Brief"
      format: "markdown"

  key_decisions:
    - "Go: technical win plan viable, proceed with evaluation"
    - "Adjust: gaps in MEDDPICC technical pain or champion require action before evaluation"
    - "No-go: technical win unlikely, recommend de-prioritize or redirect"

  complexity: "HIGH"
  estimated_inputs: 6
  estimated_rules: 5

  source_file: "domain/playbooks/solution_architects/PB_SA_018_technical_win_strategy.yaml"
  last_updated: "2026-03-26"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Technical Win Strategy"
framework_source: "MEDDPICC Technical Validation / Presales Win Planning"
playbook_mode: "GENERATIVE"
playbook_category: "pursuit_sales_support"
intended_agent_role: "sa-agent"
secondary_agents: ["AE Agent", "POC Agent", "VE Agent"]

primary_objective: "Define the technical win strategy for active deals by co-developing success criteria with the buyer, designing POC and benchmark evaluation frameworks, building objection mitigation plans, and coaching the technical champion to advocate internally"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Technical win plans, objection matrices, and champion coaching briefs are internal strategy documents. Evaluation framework design may be shared with the customer as a co-developed artifact."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Co-developed evaluation framework and success criteria (shared with customer)"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized win strategy patterns and objection-response effectiveness (quarterly)"

flow_bindings:
  description: "Maps technical win strategy phases to the agent flows that execute them"
  bindings:
    - phase: "MEDDPICC Technical Assessment"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Assess MEDDPICC technical pain depth, champion strength, and decision process clarity"
    - phase: "Success Criteria Co-development"
      agent: sa-agent
      flow: specialist-engagement
      context: "Work with customer champion to define measurable technical success criteria"
    - phase: "Evaluation Framework Design"
      agent: sa-agent
      flow: specialist-engagement
      context: "Design POC criteria, benchmark plans, or guided trial structure aligned to success criteria"
    - phase: "Objection Analysis"
      agent: sa-risk-agent
      flow: technical-risk
      context: "Identify anticipated technical objections and build evidence-based mitigation plans"
    - phase: "Champion Coaching"
      agent: sa-agent
      flow: specialist-engagement
      context: "Prepare technical champion with internal selling materials, talking points, and objection responses"
    - phase: "Win Plan Documentation"
      agent: sa-decision-capture-agent
      flow: decision-capture
      context: "Capture technical win plan decisions, assumptions, and risk factors"

when_not_to_use:
  - "Opportunity not yet qualified (use PB_SA_013 first)"
  - "Technical discovery not completed (use PB_SA_014 first)"
  - "No active deal motion, purely exploratory engagement"
  - "Post-sale engagement (different success criteria model)"

raci:
  responsible:
    role: "SA Agent"
    agent: "sa_agent"
    description: "Builds technical win plan, designs evaluation framework, develops objection mitigation, and coaches champion"

  accountable:
    role: "SA Manager"
    human_required: true
    description: "Reviews win plan viability and approves resource commitment for evaluation"
    approval_actions:
      - "approve"
      - "request_revision"
      - "no_go"

  consulted:
    - role: "AE Agent"
      on_steps: ["deal_strategy_alignment", "meddpicc_review", "champion_identification"]
    - role: "POC Agent"
      on_steps: ["evaluation_framework_design", "benchmark_planning"]
    - role: "VE Agent"
      on_steps: ["value_quantification", "business_case_alignment"]

  informed:
    - role: "AE Agent"
      notify_on: ["win_plan_complete", "critical_objection_identified", "no_go_recommendation"]
    - role: "POC Agent"
      notify_on: ["evaluation_framework_ready"]
    - role: "VE Agent"
      notify_on: ["value_metrics_needed"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Opportunity advances to technical evaluation stage"
    - "MEDDPICC review identifies technical pain as top priority"
    - "Competitive deal flagged requiring technical win strategy"

  manual:
    - "SA initiates win planning: '/win-strategy {account} {opportunity}'"
    - "AE requests technical win plan for deal review"

  conditional:
    - "IF discovery_complete AND evaluation_stage THEN build_win_strategy"
    - "IF competitive_deal AND no_win_plan THEN trigger_urgently"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Technical discovery report (PB_SA_014 output)"
    - artifact: "MEDDPICC scorecard with technical pain and champion fields"
    - artifact: "Solution fit assessment (PB_SA_015 output)"
    - artifact: "Opportunity timeline and decision process"

  optional:
    - artifact: "Competitive positioning (PB_SA_017 output)"
      use: "Align win strategy with competitive differentiation"
    - artifact: "Customer decision criteria or evaluation rubric"
      use: "Design evaluation framework around customer's own criteria"
    - artifact: "Previous win/loss reports for similar deals"
      use: "Apply lessons from analogous pursuits"
    - artifact: "Value engineering analysis from VE Agent"
      use: "Quantify business impact of technical success criteria"

  minimum_data_threshold:
    - "Discovery report with validated requirements"
    - "MEDDPICC technical pain identified"
    - "Customer champion or technical evaluator identified"
    - "Opportunity timeline known"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  technical_pain:
    - "What is the customer's most acute technical pain, and who feels it?"
    - "Has the technical pain been quantified in business terms?"
    - "Is the technical pain urgent enough to drive a purchase decision?"
    - "Does the technical pain map directly to our solution capabilities?"

  champion:
    - "Who is the technical champion, and what is their influence level?"
    - "Can the champion articulate the technical pain to economic buyers?"
    - "Does the champion have access to the decision-making process?"
    - "What does the champion need from us to advocate internally?"
    - "Has the champion been validated (will they actively sell on our behalf)?"

  evaluation:
    - "What type of evaluation does the customer expect (POC, benchmark, trial)?"
    - "What are the measurable success criteria for the evaluation?"
    - "Who will participate in and judge the evaluation results?"
    - "What is the evaluation timeline and how does it align with the decision timeline?"
    - "What resources (data, environment, people) will the customer provide?"

  objections:
    - "What technical objections have been raised or are anticipated?"
    - "What has the competitor told the customer about our solution?"
    - "Are there architectural concerns (scale, security, integration) we must address?"
    - "What previous negative experiences does the customer have with similar solutions?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "technical_pain_strong AND champion_validated AND criteria_defined"
      output_type: "Full Technical Win Plan"
      decision: |
        EXECUTE Full Win Plan:
          strategy: "Structured evaluation with co-developed success criteria"
          evaluation: "POC or benchmark designed around customer criteria"
          champion: "Coach champion with internal selling materials"
          objections: "Proactive mitigation plan for top 5 objections"
          timeline: "Aligned to customer decision process"

    - condition: "technical_pain_identified AND champion_weak"
      output_type: "Champion Development Required"
      decision: |
        ADJUST Win Plan:
          priority: "Strengthen technical champion before evaluation"
          actions:
            - "Identify and validate true technical champion"
            - "Build champion with technical proof points and business case"
            - "Provide champion with internal advocacy materials"
          risk: "Evaluation without champion likely fails at decision stage"

    - condition: "technical_pain_weak OR solution_fit_poor"
      output_type: "No-Go Recommendation"
      decision: |
        RECOMMEND No-Go:
          reason: "Technical pain insufficient or solution fit gap too large"
          action: "Document rationale, recommend AE deprioritize or requalify"
          alternative: "Monitor for technical pain evolution or scope change"

    - condition: "competitive_deal AND evaluation_criteria_competitor_shaped"
      output_type: "Criteria Reshaping Strategy"
      decision: |
        EXECUTE Criteria Reshaping:
          action: "Work with champion to expand evaluation criteria"
          focus: "Add dimensions where architecture advantage exists"
          risk: "Transparent about reshaping; demonstrate customer value of broader criteria"
          coordinate: "Align with PB_SA_017 competitive positioning"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/pursuit/win_strategy_{opportunity}.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - technical_win_plan
      - evaluation_framework
      - objection_mitigation
      - champion_coaching

    schema:
      technical_win_plan:
        opportunity: "string"
        technical_pain_summary: "string"
        solution_alignment: "string"
        win_probability: "string"  # high, medium, low
        key_differentiators: "array[string]"
        risk_factors: "array[string]"
        timeline: "string"
        meddpicc_gaps: "array[string]"

      evaluation_framework:
        type: "string"  # POC, benchmark, guided_trial
        success_criteria:
          - criterion: "string"
            metric: "string"
            target: "string"
            measurement_method: "string"
            owner: "string"
        duration: "string"
        resources_required: "array[string]"
        exit_criteria: "string"
        checkpoint_schedule: "array[string]"

      objection_mitigation:
        - objection: "string"
          source: "string"  # customer, competitor, internal
          severity: "string"  # critical, moderate, low
          response: "string"
          evidence: "string"
          proof_point: "string"
          owner: "string"

      champion_coaching:
        champion_profile: "string"
        influence_level: "string"
        internal_selling_points: "array[string]"
        talking_points: "array[string]"
        materials_provided: "array[string]"
        coaching_cadence: "string"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Technical win strategy for {node}: {win_probability} probability, {evaluation_type} planned"
    - recipient: "POC Agent"
      condition: "evaluation_framework_ready"
      message: "Evaluation framework ready for {node}: {evaluation_type}, {duration}"
    - recipient: "VE Agent"
      condition: "value_quantification_needed"
      message: "Value metrics needed for {node} success criteria"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "no_technical_champion"
      reason: "Cannot execute technical win without customer-side champion"
      action: "AE to identify and develop technical champion before SA proceeds"

    - condition: "solution_fit_gap_critical"
      reason: "Required capability not available or on roadmap"
      action: "Product team to assess roadmap; SA Manager decides proceed or no-go"

    - condition: "meddpicc_gaps_multiple"
      reason: "Multiple MEDDPICC elements missing, win unlikely without addressing"
      action: "AE and SA jointly review deal health before investing in evaluation"

  insufficient_data:
    - "No technical discovery report available"
    - "MEDDPICC scorecard not completed"
    - "Customer decision process and timeline unknown"

  human_judgment_required:
    - "Go/no-go decision when technical win probability is marginal"
    - "Resource commitment for multi-week POC evaluation"
    - "Champion coaching strategy for politically sensitive organizations"
    - "Handling technical objections that require product roadmap commitments"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Discovery report and solution fit assessment completed"
    - "MEDDPICC scorecard available with technical pain field populated"
    - "AE confirms active deal and evaluation stage alignment"

  post_execution:
    - "Success criteria are specific, measurable, and co-developed with buyer"
    - "Evaluation framework has clear exit criteria and timeline"
    - "Objection mitigation covers top 5 anticipated objections with evidence"
    - "Champion coaching materials are customer-specific, not generic"
    - "Win plan aligns with MEDDPICC technical pain and decision process"

  output_quality:
    - "Win probability assessment is evidence-based, not optimistic bias"
    - "Success criteria test capabilities the customer actually needs"
    - "Evaluation framework favors real-world scenarios over feature checklists"
    - "Champion coaching equips internal advocacy, not just product knowledge"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "3-5 hours (strategy development) + 1-2 hours (champion coaching preparation)"
frequency: "Per active deal entering evaluation, refreshed at stage transitions"
human_review_required: true
approval_workflow:
  - reviewer: "SA Agent"
    approval_gate: "Win plan is realistic and evaluation framework is achievable"
  - reviewer: "SA Manager"
    approval_gate: "Resource commitment approved for evaluation execution"
  - reviewer: "AE Agent"
    approval_gate: "Win strategy aligns with overall deal strategy"

last_updated: "2026-03-26"
version: "1.0"
status: "draft"
