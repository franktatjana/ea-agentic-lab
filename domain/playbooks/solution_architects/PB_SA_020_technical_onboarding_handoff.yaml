# PLAYBOOK: Technical Onboarding Handoff
# Sales-to-delivery transition with architecture context transfer

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
playbook_id: "PB_SA_020"
steckbrief:
  playbook_id: "PB_SA_020"
  name: "Technical Onboarding Handoff"
  category: "solution_architects"
  mode: "GENERATIVE"
  version: "1.0"
  status: "draft"

  one_liner: "Execute the sales-to-delivery transition by transferring technical context, architecture decisions, implementation prerequisites, and customer landscape knowledge to delivery and professional services teams"
  framework_origin: "ITIL Service Transition / Sales-to-Delivery Handoff Best Practices"

  owner_agent: "SA Agent"
  supporting_agents: ["Delivery Agent", "PS Agent", "CA Agent"]

  triggers_summary:
    - "Deal closed-won and entering implementation phase"
    - "Customer ready for technical onboarding kickoff"
    - "Delivery team assigned and needs technical context"

  anti_patterns:
    - "Handoff without written documentation (verbal-only knowledge transfer)"
    - "SA disengages completely after handoff (no transition period)"
    - "Handoff missing architecture decision rationale (only what, not why)"
    - "Delivery team receives handoff without customer introduction"
    - "Skipping implementation prerequisites validation"

  key_inputs:
    - "Technical discovery report and solution design"
    - "Architecture decisions and rationale from pursuit"
    - "Customer technical landscape and stakeholder profiles"

  key_outputs:
    - artifact: "Technical Handoff Package"
      format: "yaml"
    - artifact: "Architecture Decision Summary"
      format: "yaml"
    - artifact: "Implementation Prerequisites Checklist"
      format: "yaml"
    - artifact: "Customer Technical Landscape Brief"
      format: "markdown"

  key_decisions:
    - "Ready: all prerequisites met, handoff can proceed"
    - "Conditional: prerequisites partially met, handoff proceeds with action items"
    - "Block: critical prerequisites missing, handoff delayed until resolved"

  complexity: "MEDIUM"
  estimated_inputs: 5
  estimated_rules: 4

  source_file: "domain/playbooks/solution_architects/PB_SA_020_technical_onboarding_handoff.yaml"
  last_updated: "2026-03-26"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Technical Onboarding Handoff"
framework_source: "ITIL Service Transition / Sales-to-Delivery Handoff Best Practices"
playbook_mode: "GENERATIVE"
playbook_category: "delivery_execution"
intended_agent_role: "sa-agent"
secondary_agents: ["Delivery Agent", "PS Agent", "CA Agent"]

primary_objective: "Ensure seamless sales-to-delivery transition by producing a complete technical handoff package that transfers architecture decisions, customer context, and implementation prerequisites to the delivery team, minimizing ramp-up time and preventing knowledge loss"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Handoff documents contain internal architecture decisions and delivery planning. Customer-facing elements (landscape brief, prerequisites) transition to Customer InfoHub for shared visibility."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Implementation prerequisites checklist and onboarding timeline (shared with customer)"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized handoff templates and common prerequisite patterns (quarterly)"

flow_bindings:
  description: "Maps handoff phases to the agent flows that execute them"
  bindings:
    - phase: "Handoff Package Assembly"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Compile all technical discovery findings, solution designs, and evaluation results into handoff package"
    - phase: "Architecture Decision Documentation"
      agent: sa-decision-capture-agent
      flow: decision-capture
      context: "Document all architecture decisions made during pursuit with rationale, alternatives considered, and constraints"
    - phase: "Prerequisites Validation"
      agent: sa-risk-agent
      flow: technical-risk
      context: "Validate implementation prerequisites: environment readiness, access, data availability, customer resource commitments"
    - phase: "Customer Landscape Transfer"
      agent: sa-agent
      flow: specialist-engagement
      context: "Prepare customer technical landscape brief: stakeholder map, technical environment, known constraints, relationship context"
    - phase: "Delivery Team Briefing"
      agent: sa-agent
      flow: specialist-engagement
      context: "Conduct structured handoff session with delivery and PS teams, ensure knowledge transfer completeness"

when_not_to_use:
  - "Deal not yet closed (handoff is premature)"
  - "Delivery team not yet assigned (no recipient for handoff)"
  - "Customer not ready for implementation (parking lot the handoff)"
  - "Pure SaaS self-service deployment with no delivery engagement"

raci:
  responsible:
    role: "SA Agent"
    agent: "sa_agent"
    description: "Assembles handoff package, documents architecture decisions, validates prerequisites, and conducts handoff briefing"

  accountable:
    role: "SA Manager"
    human_required: true
    description: "Confirms handoff completeness and approves SA transition out of account"
    approval_actions:
      - "approve"
      - "extend_transition"
      - "block_handoff"

  consulted:
    - role: "Delivery Agent"
      on_steps: ["handoff_content_review", "prerequisite_validation"]
    - role: "PS Agent"
      on_steps: ["implementation_planning", "resource_alignment"]
    - role: "CA Agent"
      on_steps: ["customer_relationship_continuity", "success_plan_alignment"]

  informed:
    - role: "AE Agent"
      notify_on: ["handoff_complete", "handoff_blocked"]
    - role: "Delivery Agent"
      notify_on: ["handoff_package_ready"]
    - role: "PS Agent"
      notify_on: ["handoff_package_ready"]
    - role: "CA Agent"
      notify_on: ["customer_landscape_available"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Opportunity status changes to closed-won in CRM"
    - "Delivery team assigned to the account"
    - "Customer requests implementation kickoff scheduling"

  manual:
    - "SA initiates handoff: '/handoff {account}'"
    - "SA Manager requests handoff for closed deal"

  conditional:
    - "IF deal_closed_won AND delivery_team_assigned THEN initiate_handoff"
    - "IF customer_requests_kickoff AND handoff_not_started THEN trigger_urgently"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Technical discovery report (PB_SA_014 output)"
    - artifact: "Solution design or architecture document (PB_SA_003 output)"
    - artifact: "Architecture decision records from pursuit phase"
    - artifact: "Customer stakeholder profiles and contact information"

  optional:
    - artifact: "Evaluation results (PB_SA_012 output)"
      use: "Share POC/trial findings that inform implementation approach"
    - artifact: "Risk assessment (PB_SA_019 output)"
      use: "Transfer identified risks and mitigation plans to delivery"
    - artifact: "Competitive context from pursuit"
      use: "Inform delivery team of displacement dynamics or competitive sensitivities"
    - artifact: "Customer success plan"
      use: "Align implementation milestones with success plan objectives"
    - artifact: "Technical win strategy (PB_SA_018 output)"
      use: "Transfer commitments made during evaluation to delivery"

  minimum_data_threshold:
    - "Solution design with architecture components identified"
    - "Customer stakeholder contacts for implementation"
    - "At least one architecture decision documented with rationale"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  technical_context:
    - "What solution was sold and what architecture was agreed?"
    - "What architecture decisions were made and why?"
    - "What alternatives were considered and rejected?"
    - "What constraints shaped the solution design?"
    - "What was promised during the sales process that delivery must honor?"

  customer_landscape:
    - "Who are the key technical stakeholders and what are their roles?"
    - "What is the customer's current technical environment?"
    - "What are the known technical sensitivities or concerns?"
    - "What is the customer's change management process?"
    - "What is the customer's technical maturity level?"

  prerequisites:
    - "What environment provisioning must the customer complete before implementation?"
    - "What data preparation or migration is required?"
    - "What access and permissions does the delivery team need?"
    - "What customer-side resources must be available and when?"
    - "What third-party dependencies exist that could block implementation?"

  transition:
    - "What is the SA's transition plan (immediate handoff vs. shadow period)?"
    - "What open questions or unresolved issues need delivery attention?"
    - "What customer expectations need managing during transition?"
    - "What follow-up commitments did the SA make that delivery must track?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "handoff_package_complete AND prerequisites_validated AND delivery_team_ready"
      output_type: "Full Handoff"
      decision: |
        EXECUTE Full Handoff:
          handoff_session: "Structured briefing with delivery and PS teams"
          customer_intro: "SA introduces delivery team to customer stakeholders"
          transition: "SA available for questions during 2-week shadow period"
          completion: "Handoff confirmed when delivery team acknowledges receipt and readiness"

    - condition: "handoff_package_complete AND prerequisites_partially_met"
      output_type: "Conditional Handoff"
      decision: |
        EXECUTE Conditional Handoff:
          handoff_session: "Briefing with explicit open items documented"
          action_items: "Prerequisites tracker with owners and deadlines"
          transition: "SA remains engaged until prerequisites resolved"
          risk: "Implementation start delayed if prerequisites not met by kickoff date"

    - condition: "prerequisites_critical_missing"
      output_type: "Handoff Blocked"
      decision: |
        BLOCK Handoff:
          reason: "Critical prerequisites not met, implementation would fail"
          action: "SA and AE work with customer to resolve prerequisites"
          prerequisites: "Environment, access, data, or resource gaps specified"
          escalation: "SA Manager informed, handoff rescheduled when resolved"

    - condition: "complex_implementation AND specialist_knowledge_required"
      output_type: "Extended Transition"
      decision: |
        EXECUTE Extended Transition:
          handoff_session: "Multi-session knowledge transfer (2-3 sessions)"
          specialist: "Specialist SA participates in handoff for domain areas"
          transition: "SA shadows delivery through first milestone"
          completion: "Handoff confirmed after first implementation checkpoint"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/handoff/technical_handoff_{account}.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - handoff_summary
      - architecture_decisions
      - implementation_prerequisites
      - customer_landscape
      - transition_plan

    schema:
      handoff_summary:
        account: "string"
        solution_sold: "string"
        deal_context: "string"
        sa_owner: "string"
        delivery_team: "array[string]"
        handoff_date: "string"
        transition_end_date: "string"
        open_items: "array[string]"

      architecture_decisions:
        - decision_id: "string"
          decision: "string"
          rationale: "string"
          alternatives_considered: "array[string]"
          constraints: "array[string]"
          commitments: "array[string]"
          status: "string"

      implementation_prerequisites:
        - prerequisite: "string"
          category: "string"  # environment, access, data, resources, third_party
          status: "string"  # met, in_progress, not_started, blocked
          owner: "string"
          deadline: "string"
          blocker: "string"

      customer_landscape:
        stakeholders:
          - name: "string"
            role: "string"
            relevance: "string"
            communication_preference: "string"
        environment_summary: "string"
        known_constraints: "array[string]"
        sensitivities: "array[string]"
        change_management_process: "string"

      transition_plan:
        type: "string"  # immediate, shadow_period, extended
        sa_availability: "string"
        shadow_duration: "string"
        escalation_contact: "string"
        follow_up_commitments: "array[string]"
        handoff_confirmation_criteria: "array[string]"

  notifications:
    - recipient: "Delivery Agent"
      condition: "always"
      message: "Technical handoff package ready for {node}: {solution_sold}"
    - recipient: "PS Agent"
      condition: "always"
      message: "Technical handoff for {node}: prerequisites {prerequisites_status}"
    - recipient: "CA Agent"
      condition: "always"
      message: "Customer landscape brief available for {node}: {stakeholder_count} stakeholders profiled"
    - recipient: "AE Agent"
      condition: "handoff_blocked"
      message: "Handoff blocked for {node}: {block_reason}"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "critical_prerequisite_blocked"
      reason: "Customer cannot meet critical prerequisite, implementation at risk"
      action: "SA Manager, AE, and customer to resolve before handoff proceeds"

    - condition: "delivery_team_not_assigned"
      reason: "Cannot hand off without a receiving team"
      action: "PS leadership to assign delivery resources"

    - condition: "commitments_conflict"
      reason: "Promises made during sales conflict with delivery capabilities"
      action: "SA Manager to mediate between sales commitments and delivery reality"

  insufficient_data:
    - "No solution design document available"
    - "No architecture decisions documented from pursuit"
    - "Customer stakeholder contacts not available"

  human_judgment_required:
    - "Deciding transition type (immediate vs. shadow period vs. extended)"
    - "Handling customer expectations that differ from what was sold"
    - "Resolving conflicts between sales commitments and delivery constraints"
    - "Determining when SA can safely disengage from account"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Deal is closed-won in CRM"
    - "Delivery team identified and available"
    - "All pursuit-phase documentation is accessible"

  post_execution:
    - "Handoff package includes all required sections"
    - "Architecture decisions document rationale, not just outcomes"
    - "Prerequisites checklist has owners and deadlines for every item"
    - "Customer landscape brief covers stakeholders, environment, and sensitivities"
    - "Transition plan defines SA availability and handoff confirmation criteria"

  output_quality:
    - "Delivery team confirms handoff package is sufficient to begin implementation"
    - "No verbal-only knowledge: everything material is documented"
    - "Commitments made during sales are explicitly listed for delivery awareness"
    - "Open items have owners and expected resolution dates"
    - "Customer introduction is scheduled, not just documented"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "3-5 hours (package assembly) + 1-2 hours (handoff session)"
frequency: "Per closed deal entering implementation"
human_review_required: true
approval_workflow:
  - reviewer: "SA Agent"
    approval_gate: "Handoff package complete with all sections populated"
  - reviewer: "Delivery Agent"
    approval_gate: "Delivery team confirms receipt and readiness"
  - reviewer: "SA Manager"
    approval_gate: "SA transition approved, engagement officially handed off"

last_updated: "2026-03-26"
version: "1.0"
status: "draft"
