# PLAYBOOK: Technical Evaluation Execution
# Structured POV and Guided Trial management

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
playbook_id: "PB_SA_012"
steckbrief:
  playbook_id: "PB_SA_012"
  name: "Technical Evaluation Execution"
  category: "solution_architects"
  mode: "ASSESSMENT"
  version: "1.0"
  status: "stub"

  one_liner: "Manage structured technical evaluations, both Proof of Value (up to 8 weeks) and Guided Trials (30 days with 3 goals), from scoping through success measurement"
  framework_origin: "Technical Evaluation Best Practices"

  owner_agent: "SA Agent"
  supporting_agents: ["Discovery Agent", "Risk Agent", "CSP Agent"]

  triggers_summary:
    - "Customer requires hands-on evaluation before purchase decision"
    - "Competitive situation demands proof of technical differentiation"
    - "Complex use case needs validated in customer environment"

  anti_patterns:
    - "No success criteria defined (open-ended evaluation)"
    - "Customer using trial as free usage with no purchase intent"
    - "Evaluation without technical champion on customer side"
    - "POV scope exceeds what can be achieved in 8 weeks"

  key_inputs:
    - "Technical discovery findings and validated use cases"
    - "Customer evaluation criteria and success metrics"
    - "Customer environment details for integration"

  key_outputs:
    - artifact: "Evaluation Plan"
      format: "yaml"
    - artifact: "Success Criteria Document"
      format: "yaml"
    - artifact: "Evaluation Progress Reports"
      format: "markdown"
    - artifact: "Evaluation Summary & Recommendation"
      format: "markdown"

  key_decisions:
    - "POV vs. Guided Trial: select format based on complexity and customer maturity"
    - "Scope reduction: narrow evaluation to achievable goals within timeframe"
    - "Early termination: evaluation not progressing, escalate or close"

  complexity: "HIGH"
  estimated_inputs: 5
  estimated_rules: 4

  source_file: "domain/playbooks/solution_architects/PB_SA_012_technical_evaluation_execution.yaml"
  last_updated: "2026-03-08"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Technical Evaluation Execution"
framework_source: "Technical Evaluation Best Practices"
playbook_mode: "ASSESSMENT"
playbook_category: "technical_execution"
intended_agent_role: "sa-agent"
secondary_agents: ["sa-discovery-agent", "sa-risk-agent", "sa-csp-agent"]

primary_objective: "Execute structured technical evaluations that validate solution fit through defined success criteria, maintaining momentum and producing clear success/failure evidence for purchase decisions"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Evaluation plans and progress reports contain internal strategy. Success criteria document is co-owned with customer."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized evaluation patterns and success criteria templates (after engagement closes)"

flow_bindings:
  description: "Maps evaluation phases to the agent flows that execute them"
  bindings:
    - phase: "Evaluation Scoping"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Validate use cases, define evaluation scope, and identify technical requirements"
    - phase: "Success Criteria Definition"
      agent: sa-best-practices-agent
      flow: best-practices
      context: "Define measurable success criteria and evaluation methodology using proven patterns"
    - phase: "Environment Setup & Risk Assessment"
      agent: sa-risk-agent
      flow: technical-risk
      context: "Assess technical risks in evaluation environment, identify blockers early"
    - phase: "Evaluation Execution & Monitoring"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Monitor evaluation progress, gather technical findings, adjust approach"
    - phase: "Checkpoint Reviews"
      agent: sa-agent
      flow: meeting-support
      context: "Prepare and facilitate checkpoint meetings with customer evaluation team"
    - phase: "Success Measurement"
      agent: sa-best-practices-agent
      flow: best-practices
      context: "Measure results against success criteria, compile evidence"
    - phase: "CSP Integration"
      agent: sa-csp-agent
      flow: customer-success-plan
      context: "Integrate evaluation outcomes into customer success plan for post-sale continuity"

when_not_to_use:
  - "No success criteria agreed with customer"
  - "Customer lacks technical resources to participate in evaluation"
  - "Simple use case addressable through demonstration (PB_SA_006)"
  - "Customer not in active evaluation stage"

raci:
  responsible:
    role: "SA Agent"
    agent: "sa_agent"
    description: "Scopes evaluation, defines success criteria, monitors progress, and produces evaluation summary"

  accountable:
    role: "SA Manager"
    human_required: true
    description: "Approves evaluation scope and resource commitment, reviews evaluation outcome"
    approval_actions:
      - "approve"
      - "request_revision"
      - "descope"

  consulted:
    - role: "Risk Agent"
      on_steps: ["environment_risk_assessment"]
    - role: "Discovery Agent"
      on_steps: ["use_case_validation", "technical_findings"]
    - role: "AE Agent"
      on_steps: ["commercial_context_and_timeline"]

  informed:
    - role: "AE Agent"
      notify_on: ["evaluation_started", "checkpoint_complete", "evaluation_concluded"]
    - role: "CSP Agent"
      notify_on: ["evaluation_concluded"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Customer requests hands-on evaluation after demo or technical discovery"
    - "Competitive situation requires proof of differentiation"
    - "Complex integration requires validation in customer environment"

  manual:
    - "SA initiates evaluation: '/evaluation plan {account} {type}'"
    - "AE requests POV to accelerate deal progression"

  conditional:
    - "IF demo_complete AND customer_requires_validation THEN scope_evaluation"
    - "IF competitive_deal AND technical_differentiation_needed THEN recommend_pov"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Technical discovery findings with validated use cases"
    - artifact: "Customer evaluation criteria and timeline"
    - artifact: "Customer technical champion identified"

  optional:
    - artifact: "Customer environment specifications"
      use: "Plan integration and environment setup"
    - artifact: "Competitive evaluation criteria"
      use: "Ensure evaluation addresses competitive differentiators"
    - artifact: "Previous demo feedback"
      use: "Focus evaluation on areas requiring deeper validation"

  minimum_data_threshold:
    - "At least one use case with defined success criteria"
    - "Customer technical champion committed to participate"
    - "Evaluation timeline agreed (30 days for trial, up to 8 weeks for POV)"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  scoping:
    - "What use cases must be validated during the evaluation?"
    - "What does success look like for each use case (measurable criteria)?"
    - "What is the evaluation timeline and who is the customer champion?"
    - "Is this a competitive evaluation or sole-source validation?"

  format_selection:
    - "Is the customer technically mature enough for self-directed trial?"
    - "Does the use case require deep integration (POV) or standard deployment (trial)?"
    - "What level of SA involvement does the customer need?"

  execution:
    - "What environment is available for the evaluation?"
    - "What data can be used (production, synthetic, sample)?"
    - "What checkpoints should be scheduled during the evaluation?"
    - "What blockers could delay or derail the evaluation?"

  outcome:
    - "Did the evaluation meet all defined success criteria?"
    - "What findings emerged that were not in the original scope?"
    - "What is the customer's evaluation team sentiment?"
    - "What next steps does the evaluation support?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "complex_integration AND deep_validation_needed"
      output_type: "Proof of Value (POV)"
      decision: |
        EXECUTE POV:
          duration: "Up to 8 weeks"
          sa_involvement: "Active, hands-on guidance"
          checkpoints: "Weekly progress reviews"
          success_gate: "All success criteria measured and documented"

    - condition: "standard_use_case AND customer_self_sufficient"
      output_type: "Guided Trial"
      decision: |
        EXECUTE Guided Trial:
          duration: "30 days"
          goals: "3 defined goals, each with clear success criteria"
          sa_involvement: "Checkpoint-based, customer-led"
          success_gate: "3 goals achieved within 30-day window"

    - condition: "evaluation_stalled AND no_progress"
      output_type: "Escalation"
      decision: |
        ESCALATE:
          action: "Review blockers with customer champion"
          options: "Rescope, extend, or close evaluation"
          notify: "SA Manager and AE"

    - condition: "early_success AND all_criteria_met"
      output_type: "Early Completion"
      decision: |
        CONCLUDE Early:
          action: "Document success, prepare evaluation summary"
          next: "Transition to commercial discussion"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/evaluations/eval_{use_case}.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - evaluation_plan
      - success_criteria
      - progress_log
      - evaluation_summary

    schema:
      evaluation_plan:
        type: "string"  # POV or Guided Trial
        use_cases: "array[string]"
        duration: "string"
        customer_champion: "string"
        sa_involvement_level: "string"
        checkpoints: "array[string]"

      success_criteria:
        - criterion: "string"
          metric: "string"
          target: "string"
          measurement_method: "string"
          status: "string"

      progress_log:
        - checkpoint: "string"
          date: "string"
          status: "string"
          findings: "array[string]"
          blockers: "array[string]"
          next_actions: "array[string]"

      evaluation_summary:
        outcome: "string"  # success, partial, unsuccessful
        criteria_results:
          - criterion: "string"
            result: "string"
            evidence: "string"
        key_findings: "array[string]"
        recommendation: "string"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Evaluation {type} for {node}: {status}"
    - recipient: "CSP Agent"
      condition: "evaluation_concluded"
      message: "Evaluation outcomes available for CSP integration"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "no_success_criteria_agreed"
      reason: "Cannot execute evaluation without measurable success criteria"
      action: "SA to work with customer to define criteria before proceeding"

    - condition: "customer_champion_disengaged"
      reason: "Evaluation requires active customer participation"
      action: "AE to re-engage customer or reassess deal qualification"

    - condition: "evaluation_exceeds_timeline"
      reason: "Evaluation running past agreed duration"
      action: "SA Manager to decide: extend, rescope, or close"

  insufficient_data:
    - "No success criteria defined"
    - "No customer technical champion identified"
    - "No evaluation timeline agreed"

  human_judgment_required:
    - "Deciding POV vs. Guided Trial format"
    - "Setting evaluation scope boundaries"
    - "Handling evaluation that partially meets success criteria"
    - "Navigating competitive evaluation dynamics"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Success criteria defined and agreed with customer"
    - "Customer champion identified and committed"
    - "Evaluation timeline fits within engagement stage"

  post_execution:
    - "All success criteria have measured results"
    - "Evaluation summary includes evidence for each criterion"
    - "Customer champion confirms findings accuracy"
    - "Next steps documented and agreed"

  output_quality:
    - "Success criteria are specific and measurable"
    - "Progress reports track momentum and blockers"
    - "Evaluation summary supports clear go/no-go decision"
    - "Findings translate to CSP content for post-sale"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "30 days (Guided Trial) or up to 8 weeks (POV)"
frequency: "Per qualified evaluation opportunity"
human_review_required: true
approval_workflow:
  - reviewer: "SA Manager"
    approval_gate: "Evaluation scope and resource commitment approved"
  - reviewer: "SA Agent"
    approval_gate: "Success criteria complete and measurable"

last_updated: "2026-03-08"
version: "1.0"
status: "stub"
