# PLAYBOOK: Sales Enablement
# Technical training, content creation, and qualification coaching for sales teams

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
playbook_id: "PB_SA_021"
steckbrief:
  playbook_id: "PB_SA_021"
  name: "Sales Enablement"
  category: "solution_architects"
  mode: "GENERATIVE"
  version: "1.0"
  status: "draft"

  one_liner: "Enable sales teams with technical training on product capabilities, competitive positioning, and demo skills, plus create reusable technical content and coach qualification criteria for technical pain identification"
  framework_origin: "Sales Enablement Best Practices / MEDDPICC Technical Qualification"

  owner_agent: "SA Agent"
  supporting_agents: ["AE Agent", "CI Agent"]

  triggers_summary:
    - "New product release requiring AE team technical enablement"
    - "AE team requesting technical training or competitive coaching"
    - "Recurring qualification gaps where AEs miss technical pain signals"

  anti_patterns:
    - "One-time training dump without reinforcement or follow-up"
    - "Generic product training not tailored to AE selling scenarios"
    - "Creating content without AE input on what they actually need"
    - "Technical depth that overwhelms rather than enables AE conversations"
    - "Enablement without measurable outcomes or feedback loops"

  key_inputs:
    - "Product capabilities and recent feature releases"
    - "Competitive intelligence and positioning materials"
    - "AE team feedback on technical knowledge gaps"

  key_outputs:
    - artifact: "Technical Training Module"
      format: "yaml"
    - artifact: "Battle Cards"
      format: "yaml"
    - artifact: "Technical One-Pagers"
      format: "markdown"
    - artifact: "Qualification Coaching Guide"
      format: "yaml"

  key_decisions:
    - "Broad enablement: full AE team training on new capabilities"
    - "Targeted enablement: specific team or region needs coaching on gap area"
    - "Content refresh: existing materials outdated, refresh required"

  complexity: "MEDIUM"
  estimated_inputs: 4
  estimated_rules: 3

  source_file: "domain/playbooks/solution_architects/PB_SA_021_sales_enablement.yaml"
  last_updated: "2026-03-26"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Sales Enablement"
framework_source: "Sales Enablement Best Practices / MEDDPICC Technical Qualification"
playbook_mode: "GENERATIVE"
playbook_category: "customer_enablement"
intended_agent_role: "sa-agent"
secondary_agents: ["AE Agent", "CI Agent"]

primary_objective: "Increase AE team effectiveness in technical conversations by providing structured training on product capabilities and competitive positioning, creating reusable sales content (battle cards, one-pagers, cheat sheets), and coaching technical pain identification aligned to MEDDPICC qualification"

vault_routing:
  primary_vault: "Global Knowledge Vault"
  rationale: "Enablement materials, training modules, and battle cards are reusable assets for the entire sales organization. Not account-specific."
  secondary_outputs:
    - vault: "Internal Account Hub"
      artifact: "Account-specific enablement notes when training is tailored to a regional or segment team"

flow_bindings:
  description: "Maps enablement phases to the agent flows that execute them"
  bindings:
    - phase: "Knowledge Gap Assessment"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Assess AE team technical knowledge gaps through feedback, win/loss analysis, and qualification data"
    - phase: "Training Content Development"
      agent: sa-agent
      flow: specialist-engagement
      context: "Develop technical training modules tailored to AE selling scenarios and conversation depth"
    - phase: "Battle Card and Content Creation"
      agent: sa-agent
      flow: specialist-engagement
      context: "Create battle cards, one-pagers, and cheat sheets for AE use in customer conversations"
    - phase: "Competitive Positioning Coaching"
      agent: sa-agent
      flow: specialist-engagement
      context: "Coach AEs on competitive differentiation, leveraging CI Agent intelligence"
    - phase: "Qualification Criteria Training"
      agent: sa-agent
      flow: specialist-engagement
      context: "Train AEs on technical pain identification, MEDDPICC technical qualification, and SA engagement triggers"

when_not_to_use:
  - "Account-specific technical support (use PB_SA_014 discovery or PB_SA_006 demo instead)"
  - "Product training owned by product marketing (SA provides technical depth, not product overview)"
  - "Customer-facing enablement (different playbook for customer training)"
  - "Onboarding for new SAs (SA-to-SA enablement is a different process)"

raci:
  responsible:
    role: "SA Agent"
    agent: "sa_agent"
    description: "Creates training content, battle cards, and qualification coaching materials for AE consumption"

  accountable:
    role: "SA Manager"
    human_required: true
    description: "Approves enablement priorities, reviews content accuracy, and measures enablement effectiveness"
    approval_actions:
      - "approve"
      - "request_revision"
      - "reprioritize"

  consulted:
    - role: "AE Agent"
      on_steps: ["knowledge_gap_assessment", "content_relevance_validation", "scenario_testing"]
    - role: "CI Agent"
      on_steps: ["competitive_intelligence_for_battle_cards"]
    - role: "Sales Leadership"
      on_steps: ["enablement_priorities", "effectiveness_measurement"]

  informed:
    - role: "AE Agent"
      notify_on: ["training_available", "new_content_published", "battle_card_updated"]
    - role: "CI Agent"
      notify_on: ["competitive_content_published"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "New product release or major feature launch"
    - "Win/loss analysis reveals recurring technical qualification gaps"
    - "Competitive landscape shift requiring updated battle cards"

  manual:
    - "SA initiates enablement: '/enable {topic} {audience}'"
    - "AE team requests technical training session"
    - "Sales leadership requests competitive coaching"

  conditional:
    - "IF product_release AND ae_impacted THEN plan_enablement"
    - "IF loss_reason == 'technical_qualification_gap' AND frequency > threshold THEN coach_qualification"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Enablement topic or knowledge gap identification"
    - artifact: "Target audience (AE team, region, segment)"
    - artifact: "Product capabilities or competitive intelligence for topic area"

  optional:
    - artifact: "Win/loss analysis data showing technical qualification patterns"
      use: "Focus coaching on specific gap areas with evidence"
    - artifact: "Existing enablement materials for refresh assessment"
      use: "Build on existing content rather than creating from scratch"
    - artifact: "CI Agent competitive profiles for battle cards"
      use: "Ground competitive content in current intelligence"
    - artifact: "AE team feedback from previous enablement sessions"
      use: "Iterate on format, depth, and delivery based on feedback"

  minimum_data_threshold:
    - "Enablement topic defined"
    - "Product capabilities or competitive intelligence available for the topic"
    - "Target audience identified"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  knowledge_gaps:
    - "What technical topics do AEs struggle to discuss confidently with customers?"
    - "Where are deals stalling due to AE inability to articulate technical value?"
    - "What competitive scenarios are AEs losing because of insufficient technical positioning?"
    - "What MEDDPICC technical pain signals are AEs missing during qualification?"

  training_design:
    - "What is the right depth of technical training for this AE audience?"
    - "What selling scenarios should the training map to?"
    - "What format works best for this team (live session, self-paced, reference card)?"
    - "How will training effectiveness be measured?"

  content_needs:
    - "What technical content do AEs need for customer-facing conversations?"
    - "What competitive battle cards are missing or outdated?"
    - "What one-pagers or cheat sheets would AEs use in the field?"
    - "What demo skills or technical storytelling techniques need coaching?"

  qualification_coaching:
    - "Can AEs identify technical pain versus stated requirements?"
    - "Can AEs distinguish urgency signals from interest signals in technical discussions?"
    - "Do AEs know when to engage SA versus handle technical questions themselves?"
    - "Can AEs validate technical champion strength?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "new_product_release AND broad_ae_impact"
      output_type: "Broad Enablement Program"
      decision: |
        EXECUTE Broad Enablement:
          scope: "Full AE team training on new capabilities"
          content: "Training module, battle card updates, one-pagers"
          format: "Live session + self-paced reference materials"
          timeline: "Deliver within 2 weeks of release"
          follow_up: "Office hours for Q&A, effectiveness survey at 30 days"

    - condition: "knowledge_gap_identified AND specific_team"
      output_type: "Targeted Coaching"
      decision: |
        EXECUTE Targeted Coaching:
          scope: "Specific team or region coaching on gap area"
          content: "Focused training module and practice scenarios"
          format: "Interactive workshop with role-play"
          timeline: "Deliver within 1 week"
          follow_up: "Track qualification improvement in coached deals"

    - condition: "competitive_landscape_shift"
      output_type: "Battle Card Refresh"
      decision: |
        EXECUTE Battle Card Refresh:
          scope: "Update competitive positioning materials"
          content: "Revised battle cards, counter-positioning updates"
          coordination: "CI Agent provides updated intelligence"
          distribution: "Push to all AEs with change summary"

    - condition: "qualification_gap_pattern_detected"
      output_type: "Qualification Coaching Program"
      decision: |
        EXECUTE Qualification Coaching:
          scope: "Technical pain identification and MEDDPICC coaching"
          content: "Qualification guide, signal recognition framework, SA engagement triggers"
          format: "Case-study based workshop with real deal examples"
          outcome: "AEs can identify technical pain, validate champions, and trigger SA engagement correctly"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "global-knowledge-vault/enablement/sa_enablement_{topic}.yaml"
    vault_type: "global"
    format: "yaml"
    sections:
      - training_module
      - battle_cards
      - technical_content
      - qualification_guide

    schema:
      training_module:
        topic: "string"
        audience: "string"
        objectives: "array[string]"
        format: "string"  # live_session, self_paced, workshop, hybrid
        duration: "string"
        outline:
          - section: "string"
            content: "string"
            selling_scenario: "string"
            practice_exercise: "string"
        prerequisites: "array[string]"
        effectiveness_metrics: "array[string]"

      battle_cards:
        - competitor: "string"
          last_updated: "string"
          positioning_summary: "string"
          key_differentiators: "array[string]"
          common_objections:
            - objection: "string"
              response: "string"
              proof_point: "string"
          landmines_to_set: "array[string]"
          questions_to_ask: "array[string]"

      technical_content:
        one_pagers:
          - topic: "string"
            audience: "string"
            key_messages: "array[string]"
            technical_depth: "string"  # executive, practitioner, technical
        cheat_sheets:
          - topic: "string"
            quick_reference: "array[string]"
            when_to_use: "string"
        demo_talking_points:
          - use_case: "string"
            setup: "string"
            key_moments: "array[string]"
            value_statement: "string"

      qualification_guide:
        technical_pain_signals:
          - signal: "string"
            indicates: "string"
            follow_up_question: "string"
            sa_engagement_trigger: "boolean"
        champion_validation:
          - criterion: "string"
            how_to_test: "string"
            red_flag: "string"
        sa_engagement_triggers:
          - trigger: "string"
            context: "string"
            what_ae_provides_to_sa: "string"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "New SA enablement content available: {topic} for {audience}"
    - recipient: "CI Agent"
      condition: "battle_card_published"
      message: "Battle card published for {competitor}: requesting ongoing intelligence updates"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "enablement_scope_exceeds_sa_capacity"
      reason: "Enablement program requires more SA time than available"
      action: "SA Manager to prioritize enablement against deal support"

    - condition: "content_accuracy_disputed"
      reason: "Product capabilities or competitive claims disputed by product team or CI"
      action: "Resolve accuracy before publishing to sales team"

    - condition: "enablement_ineffective"
      reason: "Previous enablement did not improve qualification or win rates"
      action: "SA Manager to reassess format, depth, and delivery approach"

  insufficient_data:
    - "No clear enablement topic or knowledge gap identified"
    - "Product capabilities not documented for the topic area"
    - "No target audience defined"

  human_judgment_required:
    - "Prioritizing enablement topics when multiple gaps exist simultaneously"
    - "Deciding technical depth appropriate for AE audience"
    - "Handling sensitive competitive intelligence in broadly distributed materials"
    - "Assessing whether knowledge gap is a training issue or a hiring/role issue"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Enablement topic and audience defined"
    - "Product capabilities or competitive intelligence available"
    - "AE input gathered on content needs and preferred format"

  post_execution:
    - "Training module maps to AE selling scenarios, not just product features"
    - "Battle cards include objection responses with evidence and proof points"
    - "Qualification guide includes actionable signals, not abstract concepts"
    - "All content is factually accurate and verified against current product state"
    - "Content format matches audience preference and consumption patterns"

  output_quality:
    - "AE can use the content in a customer conversation without SA support"
    - "Battle cards are concise enough to reference during a live call"
    - "Qualification coaching produces measurable improvement in MEDDPICC technical fields"
    - "Content is refreshed when product capabilities or competitive landscape changes"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "4-8 hours (content creation) + 1-2 hours (delivery)"
frequency: "Per product release, competitive shift, or identified knowledge gap"
human_review_required: true
approval_workflow:
  - reviewer: "SA Agent"
    approval_gate: "Content is technically accurate and mapped to selling scenarios"
  - reviewer: "SA Manager"
    approval_gate: "Enablement priorities aligned with business needs"
  - reviewer: "AE Agent"
    condition: "broad_enablement == true"
    approval_gate: "Content validated by AE representative for relevance and usability"

last_updated: "2026-03-26"
version: "1.0"
status: "draft"
