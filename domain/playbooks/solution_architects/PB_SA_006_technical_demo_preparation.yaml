# PLAYBOOK: Technical Demo Preparation
# Targeted demo design from discovery findings

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
playbook_id: "PB_SA_006"
steckbrief:
  playbook_id: "PB_SA_006"
  name: "Technical Demo Preparation"
  category: "solution_architects"
  mode: "GENERATIVE"
  version: "1.0"
  status: "stub"

  one_liner: "Design targeted technical demonstrations mapped to customer pain points, with environment preparation and value narrative scripting"
  framework_origin: "Presales Demo Best Practices"

  owner_agent: "SA Agent"
  supporting_agents: ["Specialist Agent"]

  triggers_summary:
    - "Technical discovery complete and demo requested"
    - "POC planning requires demo of target use case"
    - "Customer stakeholder meeting requires live demonstration"

  anti_patterns:
    - "No discovery completed (cannot target demo to pain points)"
    - "Generic product walkthrough (not a targeted demo)"
    - "Demo before technical qualification (premature)"

  key_inputs:
    - "Technical discovery findings"
    - "Customer pain points and use cases"
    - "Product capabilities relevant to use case"

  key_outputs:
    - artifact: "Demo Scenario Script"
      format: "yaml"
    - artifact: "Environment Requirements"
      format: "yaml"
    - artifact: "Value Narrative for Demo"
      format: "markdown"

  key_decisions:
    - "Discovery incomplete: complete discovery before designing demo"
    - "Pain points unclear: refine pain points with customer before demo design"
    - "Environment not available: assess alternative demo approaches"

  complexity: "MEDIUM"
  estimated_inputs: 4
  estimated_rules: 3

  source_file: "domain/playbooks/solution_architects/PB_SA_006_technical_demo_preparation.yaml"
  last_updated: "2026-03-08"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Technical Demo Preparation"
framework_source: "Presales Demo Best Practices"
playbook_mode: "GENERATIVE"
playbook_category: "pursuit_sales_support"
intended_agent_role: "sa-agent"
secondary_agents: ["Specialist Agent"]

primary_objective: "Design and prepare targeted technical demonstrations that connect customer pain points to product capabilities through a compelling value narrative"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Demo scripts and environment specs are vendor-internal preparation artifacts. The demo itself is customer-facing, but the scripting and preparation are internal."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized demo patterns and scenario templates (after engagement closes)"

flow_bindings:
  description: "Maps demo preparation phases to the agent flows that execute them"
  bindings:
    - phase: "Discovery-to-Demo Mapping"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Extract pain points, use cases, and technical requirements that demo must address"
    - phase: "Demo Environment Design"
      agent: sa-best-practices-agent
      flow: best-practices
      context: "Reference architecture patterns and best practices for demo environment setup"
    - phase: "Demo Scenario Scripting"
      agent: sa-best-practices-agent
      flow: best-practices
      context: "Apply proven demo patterns and product capability mapping"
    - phase: "Value Narrative Integration"
      agent: sa-agent
      flow: meeting-support
      context: "Prepare value narrative and talking points for demo delivery"
    - phase: "Rehearsal & Refinement"
      agent: sa-agent
      flow: meeting-support
      context: "Meeting preparation for demo delivery, anticipate questions"

when_not_to_use:
  - "No discovery completed (cannot target demo to pain points)"
  - "Generic product walkthrough (not a targeted demo)"
  - "Demo before technical qualification (premature)"
  - "Customer explicitly prefers hands-on POC over demo"

raci:
  responsible:
    role: "SA Agent"
    agent: "sa_agent"
    description: "Designs demo scenario, prepares environment requirements, and scripts value narrative"

  accountable:
    role: "SA Manager"
    human_required: true
    description: "Reviews demo design for technical accuracy and customer relevance"
    approval_actions:
      - "approve"
      - "request_revision"

  consulted:
    - role: "Specialist Agent"
      on_steps: ["domain_specific_capabilities"]
    - role: "AE Agent"
      on_steps: ["customer_priorities_and_messaging"]

  informed:
    - role: "AE Agent"
      notify_on: ["demo_ready"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Technical discovery complete and customer requests demo"
    - "POC planning requires demonstration of target use case"
    - "Customer stakeholder meeting scheduled with demo expectation"

  manual:
    - "SA explicitly prepares demo: '/demo prepare {use_case}'"
    - "Customer architect requests technical deep-dive with demonstration"

  conditional:
    - "IF discovery_complete AND demo_requested THEN trigger"
    - "IF poc_planning_started AND use_case_demo_needed THEN trigger"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Technical discovery findings from PB_SA_005 or discovery sessions"
    - artifact: "Customer pain points with priority ranking"
    - artifact: "Product capabilities relevant to use case"

  optional:
    - artifact: "Customer environment details"
      use: "Design demo environment to match customer context"
    - artifact: "Competitive landscape"
      use: "Highlight differentiators in demo flow"
    - artifact: "Stakeholder profiles"
      use: "Tailor demo depth and language to audience"

  minimum_data_threshold:
    - "At least one prioritized pain point documented"
    - "Product capability mapping exists for the pain point"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  demo_targeting:
    - "Which customer pain points should the demo address first?"
    - "What use case will resonate most with this audience?"
    - "What is the customer's current workflow for this use case?"
    - "What outcome does the customer expect to see?"

  environment:
    - "What data characteristics should the demo environment reflect?"
    - "What integrations should be shown?"
    - "What scale should the demo represent?"
    - "Are there specific compliance or security aspects to demonstrate?"

  narrative:
    - "What business outcome does each capability enable?"
    - "What is the 'before and after' story?"
    - "What questions will the audience likely ask?"
    - "What objections should the demo preemptively address?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "discovery_complete AND pain_points_prioritized"
      output_type: "Demo Scenario (targeted)"
      decision: |
        CREATE Demo Scenario:
          mapping: "Pain point → capability → demo step"
          narrative: "Problem → solution → outcome"
          format: "Scripted with talking points"

    - condition: "discovery_incomplete"
      output_type: "Action Required"
      decision: |
        DEFER Demo Preparation:
          action: "Complete technical discovery first"
          reason: "Cannot target demo without understanding pain points"

    - condition: "multiple_stakeholder_audiences"
      output_type: "Demo Scenario (multi-audience)"
      decision: |
        CREATE Demo Variants:
          executive: "Outcome-focused, business value"
          technical: "Architecture, integration, performance"
          operational: "Day-to-day workflow, administration"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/demos/demo_scenario_{use_case}.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - demo_objective
      - pain_point_mapping
      - scenario_script
      - environment_requirements
      - value_narrative
      - anticipated_questions
      - fallback_plan

    schema:
      demo_objective:
        target_pain_point: "string"
        expected_outcome: "string"
        audience: "array[string]"
        duration: "string"

      pain_point_mapping:
        - pain_point: "string"
          capability: "string"
          demo_step: "string"
          value_message: "string"

      scenario_script:
        - step: "integer"
          action: "string"
          talking_point: "string"
          expected_reaction: "string"
          duration: "string"

      environment_requirements:
        data: "string"
        integrations: "array[string]"
        configuration: "string"
        scale: "string"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Demo prepared for {node}: {use_case} scenario ready for scheduling"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "no_discovery_findings"
      reason: "Cannot design targeted demo without discovery"
      action: "SA to complete discovery first"

    - condition: "capability_gap_identified"
      reason: "Product cannot demonstrate the required capability"
      action: "SA to engage product team or identify workaround"

  insufficient_data:
    - "No pain points documented"
    - "No product capability mapping available"

  human_judgment_required:
    - "Selecting which pain points to prioritize in demo"
    - "Deciding demo depth vs. breadth for time-constrained sessions"
    - "Handling competitive demo scenarios"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Discovery findings exist for this account"
    - "At least one pain point mapped to product capability"

  post_execution:
    - "Every demo step links back to a customer pain point"
    - "Value narrative uses customer language, not vendor jargon"
    - "Environment requirements are achievable"
    - "Anticipated questions have prepared responses"

  output_quality:
    - "Demo scenario is time-boxed and realistic"
    - "Narrative bridges technical capability to business outcome"
    - "Fallback plan exists for environment issues"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "20-40 minutes (agent) + 30-60 minutes (human refinement and rehearsal)"
frequency: "Per demo engagement, reused and adapted across sessions"
human_review_required: true
approval_workflow:
  - reviewer: "SA Agent"
    approval_gate: "Demo scenario covers prioritized pain points"
  - reviewer: "Specialist"
    condition: "domain_specific_demo == true"
    approval_gate: "Domain-specific capability demonstrated correctly"

last_updated: "2026-03-08"
version: "1.0"
status: "draft"
