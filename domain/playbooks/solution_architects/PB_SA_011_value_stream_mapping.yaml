# PLAYBOOK: Value Stream Mapping
# End-to-end VSD methodology from qualification to executive briefing

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
playbook_id: "PB_SA_011"
steckbrief:
  playbook_id: "PB_SA_011"
  name: "Value Stream Mapping"
  category: "solution_architects"
  mode: "ASSESSMENT"
  version: "1.0"
  status: "stub"

  one_liner: "Facilitate structured value stream mapping workshops that map customer processes end-to-end, identify waste and bottlenecks, and design future-state improvements"
  framework_origin: "Value Stream Mapping / Lean Discovery"

  owner_agent: "SA Agent"
  supporting_agents: ["Discovery Agent", "Journey Agent"]

  triggers_summary:
    - "Customer expresses interest in process improvement or transformation"
    - "Multiple pain points suggest systemic workflow issues"
    - "Strategic account requires deep operational understanding"

  anti_patterns:
    - "Customer not committed to workshop participation (no exec sponsor)"
    - "Single-point solution request (VSD is for end-to-end process mapping)"
    - "No decision-maker access (VSD outcomes need executive buy-in)"
    - "Time-constrained engagement where lighter discovery suffices"

  key_inputs:
    - "Account context and industry vertical"
    - "Initial pain points from technical discovery"
    - "Stakeholder map with workshop participants"

  key_outputs:
    - artifact: "Current State Value Stream Map"
      format: "yaml"
    - artifact: "Future State Value Stream Map"
      format: "yaml"
    - artifact: "VSD Executive Briefing"
      format: "markdown"
    - artifact: "Improvement Recommendations"
      format: "yaml"

  key_decisions:
    - "Customer not ready: defer VSD, continue lighter discovery"
    - "Scope too broad: narrow to single value stream per workshop"
    - "No exec sponsor: escalate or reposition as informal discovery session"

  complexity: "HIGH"
  estimated_inputs: 6
  estimated_rules: 5

  source_file: "domain/playbooks/solution_architects/PB_SA_011_value_stream_mapping.yaml"
  last_updated: "2026-03-08"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Value Stream Mapping"
framework_source: "Value Stream Mapping / Lean Discovery"
playbook_mode: "ASSESSMENT"
playbook_category: "discovery_investigation"
intended_agent_role: "sa-agent"
secondary_agents: ["sa-discovery-agent", "sa-journey-agent"]

primary_objective: "Map customer value streams end-to-end, identify waste and bottlenecks, and produce a future-state vision with prioritized improvement recommendations and executive briefing"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Value stream maps contain sensitive customer operational data. The executive briefing is customer-shareable, but raw maps stay internal."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized VSD patterns and industry templates (after engagement closes)"

flow_bindings:
  description: "Maps VSD phases to the agent flows that execute them"
  bindings:
    - phase: "VSD Qualification"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Assess customer readiness, identify value stream candidates, validate executive sponsorship"
    - phase: "Customer Education & Commitment"
      agent: sa-agent
      flow: meeting-support
      context: "Prepare VSD positioning materials, educate customer on process and expected outcomes"
    - phase: "Workshop Preparation"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Gather pre-workshop data: org charts, process documentation, tool inventory, metrics"
    - phase: "Workshop Positioning"
      agent: sa-best-practices-agent
      flow: best-practices
      context: "Select VSD technique (full workshop, discovery session, day-in-the-life, informal) based on customer context"
    - phase: "Current State Mapping"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Facilitate current-state value stream mapping: process steps, handoffs, wait times, pain points"
    - phase: "Future State Design"
      agent: sa-best-practices-agent
      flow: best-practices
      context: "Design future-state value stream with solution capabilities mapped to improvement opportunities"
    - phase: "Executive Briefing"
      agent: sa-agent
      flow: meeting-support
      context: "Prepare and deliver executive briefing with findings, recommendations, and next steps"
    - phase: "Journey Integration"
      agent: sa-journey-agent
      flow: customer-journey
      context: "Integrate VSD findings into customer journey record and evaluation tracking"

when_not_to_use:
  - "Customer not committed to workshop participation"
  - "Single-point solution request where VSD adds unnecessary complexity"
  - "No access to process participants or operational stakeholders"
  - "Time-constrained engagement (use TECHDRIVE or informal discovery instead)"

raci:
  responsible:
    role: "SA Agent"
    agent: "sa_agent"
    description: "Qualifies VSD opportunity, facilitates workshop, produces value stream maps and executive briefing"

  accountable:
    role: "SA Manager"
    human_required: true
    description: "Approves VSD scope, reviews executive briefing before customer delivery"
    approval_actions:
      - "approve"
      - "request_revision"
      - "descope"

  consulted:
    - role: "Discovery Agent"
      on_steps: ["pre_workshop_data_gathering", "current_state_mapping"]
    - role: "Journey Agent"
      on_steps: ["journey_integration"]
    - role: "AE Agent"
      on_steps: ["customer_context_and_priorities"]

  informed:
    - role: "AE Agent"
      notify_on: ["vsd_complete", "executive_briefing_ready"]
    - role: "CSP Agent"
      notify_on: ["improvement_recommendations_published"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Technical discovery reveals systemic process pain points across multiple teams"
    - "Customer explicitly requests value stream or process mapping engagement"
    - "Strategic account with transformation initiative underway"

  manual:
    - "SA proposes VSD: '/vsd qualify {account}'"
    - "AE requests deep discovery for strategic opportunity"

  conditional:
    - "IF pain_points_systemic AND exec_sponsor_identified THEN qualify_vsd"
    - "IF account_tier == strategic AND discovery_complete THEN recommend_vsd"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Account context (industry, size, maturity)"
    - artifact: "Initial pain points from technical discovery or customer conversations"
    - artifact: "Identified value stream candidate (the process to map)"

  optional:
    - artifact: "Customer org chart and team structure"
      use: "Identify workshop participants and handoff points"
    - artifact: "Existing process documentation"
      use: "Pre-populate current state map"
    - artifact: "Customer metrics and KPIs"
      use: "Quantify waste and improvement potential"
    - artifact: "Industry-specific value stream templates"
      use: "Accelerate mapping with vertical patterns"

  minimum_data_threshold:
    - "At least one value stream candidate identified"
    - "Executive sponsor confirmed for workshop"
    - "Workshop participants identified (3-8 people)"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  qualification:
    - "Is the customer experiencing systemic process pain or isolated issues?"
    - "Does the customer have an executive sponsor willing to participate?"
    - "Is the customer willing to commit 2-4 hours of participant time?"
    - "What is the target value stream (end-to-end process to map)?"

  preparation:
    - "Who are the process participants and what roles do they play?"
    - "What existing documentation describes the current process?"
    - "What metrics does the customer track for this process?"
    - "What tools and systems support this value stream?"

  current_state:
    - "What are the process steps from trigger to completion?"
    - "Where are the handoffs between teams or systems?"
    - "What are the wait times and bottlenecks?"
    - "What manual or redundant steps exist?"
    - "What is the lead time vs. process time ratio?"

  future_state:
    - "Which bottlenecks can be eliminated or automated?"
    - "What capabilities would transform the most painful steps?"
    - "What is the target lead time reduction?"
    - "What quick wins can demonstrate value within 30 days?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "exec_sponsor AND systemic_pain_points AND participant_commitment"
      output_type: "Full VSD Workshop"
      decision: |
        EXECUTE Full Workshop:
          format: "Half-day or full-day facilitated session"
          participants: "5-8 cross-functional stakeholders"
          output: "Current + future state maps, executive briefing"

    - condition: "pain_points_identified BUT no_exec_sponsor"
      output_type: "Discovery Session (lightweight)"
      decision: |
        EXECUTE Discovery Session:
          format: "1-2 hour focused session"
          participants: "2-4 technical stakeholders"
          output: "Pain point inventory, VSD proposal for exec sponsor"

    - condition: "early_engagement AND relationship_building"
      output_type: "Informal Session"
      decision: |
        EXECUTE Informal Discovery:
          format: "Conversational, embedded in regular meeting"
          participants: "1-2 contacts"
          output: "Initial value stream sketch, qualification for full VSD"

    - condition: "deep_operational_understanding_needed"
      output_type: "Day-in-the-Life Session"
      decision: |
        EXECUTE Day-in-the-Life:
          format: "Shadow or interview practitioners"
          participants: "Individual practitioners"
          output: "Detailed operational view, pain point validation"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/discovery/vsd_{value_stream}.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - qualification_assessment
      - workshop_plan
      - current_state_map
      - future_state_map
      - improvement_recommendations
      - executive_briefing

    schema:
      qualification_assessment:
        value_stream: "string"
        exec_sponsor: "string"
        participant_count: "integer"
        readiness_score: "string"
        recommended_format: "string"

      current_state_map:
        process_steps:
          - step: "string"
            owner: "string"
            duration: "string"
            wait_time: "string"
            pain_points: "array[string]"
            tools: "array[string]"
        total_lead_time: "string"
        total_process_time: "string"
        handoff_count: "integer"
        bottlenecks: "array[string]"

      future_state_map:
        process_steps:
          - step: "string"
            improvement: "string"
            capability: "string"
            time_reduction: "string"
        target_lead_time: "string"
        improvement_percentage: "string"

      improvement_recommendations:
        - recommendation: "string"
          priority: "string"
          effort: "string"
          impact: "string"
          quick_win: "boolean"

      executive_briefing:
        summary: "string"
        key_findings: "array[string]"
        recommendations: "array[string]"
        next_steps: "array[string]"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "VSD complete for {node}: {value_stream} mapped, executive briefing ready"
    - recipient: "CSP Agent"
      condition: "recommendations_published"
      message: "VSD improvement recommendations available for CSP integration"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "no_exec_sponsor"
      reason: "VSD requires executive sponsorship for outcomes adoption"
      action: "SA to engage AE for sponsor identification"

    - condition: "participant_resistance"
      reason: "Workshop participants unwilling to share process details"
      action: "SA to reposition engagement or defer"

    - condition: "scope_creep"
      reason: "Value stream scope expanding beyond single workshop"
      action: "SA to define boundaries and plan follow-up sessions"

  insufficient_data:
    - "No value stream candidate identified"
    - "No participant commitment obtained"

  human_judgment_required:
    - "Selecting which value stream to map first"
    - "Navigating organizational politics around process ownership"
    - "Balancing workshop depth vs. participant time constraints"
    - "Deciding when to shift from current state to future state"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Value stream candidate identified and scoped"
    - "Executive sponsor confirmed"
    - "Workshop participants identified and committed"

  post_execution:
    - "Current state map includes all process steps with timing"
    - "Future state map links improvements to solution capabilities"
    - "Executive briefing stands alone without requiring technical context"
    - "Improvement recommendations include effort and impact assessment"

  output_quality:
    - "Process steps validated by participants during workshop"
    - "Bottlenecks quantified with data or participant consensus"
    - "Recommendations are actionable, not generic"
    - "Executive briefing uses customer language"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "2-4 hours (qualification + prep) + 4-8 hours (workshop) + 2-4 hours (briefing)"
frequency: "Per strategic account or major transformation initiative"
human_review_required: true
approval_workflow:
  - reviewer: "SA Manager"
    approval_gate: "VSD scope and participant list approved"
  - reviewer: "SA Agent"
    approval_gate: "Executive briefing reviewed before customer delivery"

last_updated: "2026-03-08"
