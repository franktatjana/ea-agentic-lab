# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
playbook_id: "PB_SA_007"
steckbrief:
  playbook_id: "PB_SA_007"
  name: "Customer Journey Mapping"
  category: "solution_architects"
  mode: "ASSESSMENT"
  version: "1.0"
  status: "stub"

  one_liner: "Map the customer journey from first touch through deal close, documenting touchpoints, stakeholder experiences, and preparing handoff to Customer Architect"
  framework_origin: "Customer Experience Management - Presales Journey Mapping"

  owner_agent: "SA Agent"
  supporting_agents: ["CA Agent", "AE Agent"]

  triggers_summary:
    - "Opportunity enters Stage 2"
    - "First technical meeting with customer completed"
    - "Deal approaching close, handoff preparation needed"

  anti_patterns:
    - "Opportunity in Stage 1 (too early for journey mapping)"
    - "No customer interactions have occurred"
    - "Renewal with no presales engagement"

  key_inputs:
    - "Meeting records and interaction history"
    - "Stakeholder map"
    - "Discovery findings"

  key_outputs:
    - artifact: "Customer Journey Map"
      format: "yaml"
    - artifact: "Stakeholder Journey Views"
      format: "yaml"
    - artifact: "CA Handoff Package"
      format: "yaml"

  key_decisions:
    - "Journey gaps: identify missing touchpoints and schedule remediation"
    - "Negative sentiment trend: escalate to SA and AE for intervention"
    - "Handoff readiness: verify journey completeness before CA handoff"

  complexity: "MEDIUM"
  estimated_inputs: 5
  estimated_rules: 4

  source_file: "domain/playbooks/solution_architects/PB_SA_007_customer_journey_mapping.yaml"
  last_updated: "2026-03-08"

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
framework_name: "Customer Journey Mapping"
framework_source: "Customer Experience Management - Presales Journey Mapping"
playbook_mode: "ASSESSMENT"
playbook_category: "discovery_investigation"
intended_agent_role: "sa-agent"
secondary_agents: ["CA Agent", "AE Agent"]

primary_objective: "Build and maintain a complete customer journey map capturing touchpoints, stakeholder experiences, and feedback from first technical engagement through deal close and CA handoff"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Journey maps capture the vendor's view of the customer experience, including internal observations and sentiment analysis. The handoff package is shared with the CA team."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Sanitized journey summary shared with customer during handoff"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized journey patterns and handoff templates (after engagement closes)"

flow_bindings:
  description: "Maps journey mapping phases to the agent flows that execute them"
  bindings:
    - phase: "Journey Initiation"
      agent: sa-journey-agent
      flow: customer-journey
      context: "Start journey map when opportunity enters Stage 2, capture first touchpoints"
    - phase: "Touchpoint Documentation"
      agent: sa-journey-agent
      flow: customer-journey
      context: "Document each customer interaction with date, participants, topics, outcomes"
    - phase: "Stakeholder Journey Views"
      agent: sa-journey-agent
      flow: customer-journey
      context: "Create individual journey perspectives per key stakeholder"
    - phase: "Discovery Context Integration"
      agent: sa-discovery-agent
      flow: technical-discovery
      context: "Enrich journey with technical discovery findings and stakeholder roles"
    - phase: "Evaluation Journey Tracking"
      agent: sa-journey-agent
      flow: customer-journey
      context: "Track POV/POC evaluation touchpoints and sentiment"
    - phase: "Feedback Capture"
      agent: sa-journey-agent
      flow: customer-journey
      context: "Document qualitative feedback, sentiment, friction points"
    - phase: "CA Handoff Preparation"
      agent: sa-csp-agent
      flow: customer-success-plan
      context: "Align journey map with success plan milestones for CA handoff"

when_not_to_use:
  - "Opportunity in Stage 1 (no customer interactions yet)"
  - "Renewal with no presales engagement"
  - "No technical meetings have occurred"

raci:
  responsible:
    role: "SA Agent"
    agent: "sa_agent"
    description: "Orchestrates journey mapping across touchpoints, delegates to sa-journey-agent"

  accountable:
    role: "SA Manager"
    human_required: true
    description: "Reviews journey completeness and handoff quality"
    approval_actions:
      - "approve"
      - "request_revision"

  consulted:
    - role: "AE Agent"
      on_steps: ["commercial_touchpoints", "deal_timeline"]
    - role: "CA Agent"
      on_steps: ["handoff_requirements", "onboarding_expectations"]

  informed:
    - role: "CA Agent"
      notify_on: ["handoff_package_ready"]
    - role: "AE Agent"
      notify_on: ["negative_sentiment_detected"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Opportunity enters Stage 2"
    - "First technical meeting with customer completed"
    - "Customer meeting ended (touchpoint documentation)"

  manual:
    - "SA requests journey map creation: '/journey map {account}'"
    - "CA requests handoff package preparation"

  conditional:
    - "IF opportunity.stage == STAGE_2 AND journey_map_not_exists THEN initiate"
    - "IF deal_close_imminent AND handoff_not_prepared THEN trigger handoff phase"
    - "IF negative_feedback_count > 2 THEN escalate"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Opportunity data with stage and stakeholder list"
    - artifact: "Meeting records (transcripts, notes, emails)"
    - artifact: "Stakeholder map"

  optional:
    - artifact: "Discovery findings"
      use: "Enrich journey context with technical discovery outcomes"
    - artifact: "Customer success plan"
      use: "Align journey milestones with success plan"
    - artifact: "POC/POV records"
      use: "Track evaluation journey touchpoints"

  minimum_data_threshold:
    - "At least one customer interaction documented"
    - "Stakeholder map exists"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  touchpoint_quality:
    - "What was discussed and what was the outcome?"
    - "Who attended and what was each person's engagement level?"
    - "What decisions were made or deferred?"
    - "What action items emerged?"

  stakeholder_experience:
    - "How does each stakeholder perceive the engagement?"
    - "What are each stakeholder's priorities and concerns?"
    - "Where are friction points in the stakeholder's journey?"

  handoff_readiness:
    - "Is the journey map complete (no undocumented gaps)?"
    - "Are all open items tracked with owners?"
    - "Does the CA have sufficient context to continue the relationship?"
    - "Are there unresolved concerns that need attention before handoff?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - condition: "opportunity_stage_2 AND no_journey_map"
      output_type: "Journey Initiation"
      decision: |
        INITIATE Journey Map:
          capture: "First touchpoint, stakeholders, initial context"
          schedule: "Ongoing touchpoint documentation after each interaction"

    - condition: "negative_feedback_trend"
      output_type: "Escalation"
      decision: |
        ESCALATE Sentiment Concern:
          notify: "SA and AE"
          action: "Review and address friction points"
          urgency: "High"

    - condition: "deal_close_imminent AND journey_complete"
      output_type: "Handoff Package"
      decision: |
        PREPARE Handoff:
          compile: "Journey map, open items, stakeholder views, feedback summary"
          validate: "Completeness check"
          deliver: "CA Agent"

    - condition: "touchpoint_gaps_detected"
      output_type: "Gap Remediation"
      decision: |
        REMEDIATE Journey Gaps:
          identify: "Missing touchpoints, undocumented meetings"
          action: "Backfill from available records"
          flag: "Gaps that cannot be backfilled"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/journey/customer_journey_map.yaml"
    vault_type: "internal"
    format: "yaml"
    sections:
      - journey_overview
      - touchpoints
      - stakeholder_views
      - feedback_summary
      - open_items
      - handoff_package

    schema:
      journey_overview:
        account: "string"
        start_date: "YYYY-MM-DD"
        current_stage: "string"
        touchpoint_count: "integer"
        overall_sentiment: "enum[POSITIVE|NEUTRAL|NEGATIVE|MIXED]"

      touchpoints:
        - date: "YYYY-MM-DD"
          type: "enum[MEETING|EMAIL|DEMO|POC|WORKSHOP]"
          participants: "array[string]"
          topics: "array[string]"
          outcomes: "array[string]"
          action_items: "array[{item, owner, due_date}]"
          sentiment: "enum[POSITIVE|NEUTRAL|NEGATIVE]"

      stakeholder_views:
        - stakeholder: "string"
          role: "string"
          touchpoint_count: "integer"
          engagement_level: "enum[HIGH|MEDIUM|LOW]"
          key_concerns: "array[string]"
          sentiment_trend: "enum[IMPROVING|STABLE|DECLINING]"

      handoff_package:
        journey_summary: "string"
        open_items: "array[{item, owner, status}]"
        key_relationships: "array[{stakeholder, relationship_quality}]"
        recommendations: "array[string]"

  notifications:
    - recipient: "CA Agent"
      condition: "handoff_ready"
      message: "Journey map and handoff package ready for {node}"

    - recipient: "AE Agent"
      condition: "negative_sentiment_detected"
      message: "Negative sentiment trend detected in {node} journey"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "no_customer_interactions"
      reason: "Cannot map a journey that has not started"
      action: "Wait for first customer interaction"

    - condition: "negative_feedback_count > 2"
      reason: "Repeated negative feedback requires human intervention"
      action: "SA and AE to review and address relationship concerns"

  insufficient_data:
    - "No meeting records or interaction history available"
    - "Stakeholder map does not exist"

  human_judgment_required:
    - "Interpreting ambiguous customer feedback"
    - "Deciding appropriate level of detail for CA handoff"
    - "Prioritizing which stakeholder concerns to address first"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Opportunity exists and is Stage 2+"
    - "At least one customer interaction has occurred"

  post_execution:
    - "Every documented meeting has a corresponding touchpoint"
    - "Stakeholder views are individual, not merged"
    - "Handoff package passes completeness check"

  output_quality:
    - "Sentiment claims quote exact customer statements"
    - "Action items have owners and due dates"
    - "Journey map has no undocumented gaps exceeding 2 weeks"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "10-20 minutes per touchpoint (agent) + ongoing accumulation"
frequency: "Initiated once per opportunity, updated after each interaction"
human_review_required: true
approval_workflow:
  - reviewer: "SA Agent"
    approval_gate: "Journey completeness and accuracy"
  - reviewer: "CA Agent"
    condition: "handoff_phase"
    approval_gate: "Handoff package meets onboarding needs"

last_updated: "2026-03-08"
version: "1.0"
status: "draft"
