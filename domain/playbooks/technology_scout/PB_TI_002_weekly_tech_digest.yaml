# PLAYBOOK: Weekly Technology Intelligence Digest
# Owner: Technology Intelligence Agent (ti_agent)

playbook_id: "PB_TI_002"
framework_name: "Weekly Technology Intelligence Digest"
framework_source: "Intelligence Cluster - Technology Intelligence"
playbook_mode: "GENERATIVE"
playbook_category: "operations_reporting"
intended_agent_role: "ti-agent"
secondary_agents: ["Tech Signal Scanner Agent (signal updates)", "Tech Signal Analyzer Agent (trend synthesis)"]

primary_objective: "Generate weekly technology intelligence digest summarizing signal changes, trend shifts, and actionable insights across all active realms for engagement teams"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Weekly digests aggregate vendor-internal technology intelligence across accounts."

when_not_to_use:
  - "No active realms with technology radars (nothing to digest)"
  - "Digest was generated within last 5 days (avoid duplicate reports)"

raci:
  responsible:
    role: "TI Agent"
    agent: "ti-agent"
    description: "Aggregates signal changes across realms, identifies cross-account patterns, generates prioritized digest"
  accountable:
    role: "Intelligence Manager"
    human_required: true
    description: "Reviews digest for accuracy and strategic relevance"
  consulted:
    - role: "FCTO Agent"
      on_steps: ["cross_realm_patterns", "technology_vision_alignment"]
  informed:
    - role: "AE Agent"
      notify_on: ["digest_ready"]
    - role: "SA Agent"
      notify_on: ["digest_ready"]
    - role: "FCTO Agent"
      notify_on: ["digest_ready"]

trigger_conditions:
  automatic:
    - event: "scheduled_weekly"
      description: "Weekly digest generation on configured day"
  manual:
    - "Leadership requests ad-hoc technology intelligence summary"
    - "Pre-QBR technology landscape briefing"

validation_inputs:
  mandatory:
    - artifact: "{realm}/intelligence/technology_scout/current_radar.yaml"
      description: "Current technology radars for active realms"
  optional:
    - artifact: "{realm}/intelligence/technology_scout/previous_radar.yaml"
      use: "Previous radar for delta calculation"
    - artifact: "{realm}/intelligence/industry_intelligence/industry_profile.yaml"
      use: "Industry context for trend interpretation"

key_questions:
  signal_changes:
    - "Which technologies changed ring position since last digest?"
    - "What new technologies were first detected this week?"
    - "Which technologies show accelerating or decelerating adoption?"
  cross_realm_patterns:
    - "Are multiple realms adopting the same technology simultaneously?"
    - "Are there industry-wide technology shifts visible across accounts?"
    - "Do any patterns suggest emerging competitive threats or opportunities?"
  actionable_insights:
    - "Which signal changes should trigger SA engagement or deal repositioning?"
    - "Are there competitive technology adoptions requiring CI assessment?"
    - "Do any trends support or contradict current deal positioning?"

expected_outputs:
  primary_artifact:
    path: "intelligence/technology_scout/digest_{YYYY-WW}.yaml"
    format: "yaml"
    sections:
      - digest_metadata
      - highlights
      - signal_changes_by_realm
      - cross_realm_patterns
      - competitive_alerts
      - recommended_actions

  notifications:
    - recipient: "SA Agent"
      condition: "always"
      message: "Weekly tech intelligence digest ready. {highlight_count} highlights across {realm_count} realms."
    - recipient: "FCTO Agent"
      condition: "cross_realm_pattern_count > 0"
      message: "Cross-realm technology patterns detected in weekly digest: {pattern_summary}"

stop_conditions:
  insufficient_data:
    - "No technology radars updated since last digest"
    - "All active realms have stale radars (>30 days old)"

estimated_execution_time: "10-20 minutes"
frequency: "Weekly"
human_review_required: false

last_updated: "2026-03-25"
version: "1.0"
status: "draft"
