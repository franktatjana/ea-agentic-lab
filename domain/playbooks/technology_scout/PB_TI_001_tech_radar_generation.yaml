# PLAYBOOK: Technology Radar Generation
# Owner: Technology Intelligence Agent (ti_agent)
# Orchestrates sub-agents: TI Scanner + TI Analyzer

playbook_id: "PB_TI_001"
framework_name: "Technology Radar Generation"
framework_source: "Intelligence Cluster - Technology Intelligence"
playbook_mode: "GENERATIVE"
playbook_category: "discovery_investigation"
intended_agent_role: "ti-agent"
secondary_agents: ["Tech Signal Scanner Agent (signal collection)", "Tech Signal Analyzer Agent (analysis and synthesis)"]

primary_objective: "Generate a comprehensive technology signal map for a realm, assigning ring positions (Adopt/Trial/Assess/Hold) to detected technologies and identifying adoption trends relevant to active engagements"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Technology radar contains vendor-internal intelligence about customer technology adoption patterns used for deal positioning."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized technology adoption patterns by industry vertical (after engagement closes)"

when_not_to_use:
  - "Realm has no public technology footprint (no job postings, no engineering blog, no vendor announcements)"
  - "Technology radar was refreshed within last 14 days and no significant signals detected"
  - "Realm is in early discovery with no technical engagement context"

raci:
  responsible:
    role: "TI Agent"
    agent: "ti-agent"
    description: "Orchestrates signal scanning and analysis, produces technology radar with ring assignments and trend indicators"
  accountable:
    role: "Intelligence Manager"
    human_required: true
    description: "Reviews radar accuracy and validates technology trend classifications"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"
  consulted:
    - role: "SA Agent"
      on_steps: ["technology_relevance", "integration_implications"]
    - role: "Industry Intelligence Agent"
      on_steps: ["industry_technology_benchmarks"]
  informed:
    - role: "AE Agent"
      notify_on: ["radar_complete"]
    - role: "SA Agent"
      notify_on: ["radar_complete", "technology_shift_detected"]
    - role: "FCTO Agent"
      notify_on: ["cross_realm_pattern_detected"]

trigger_conditions:
  automatic:
    - event: "realm_created"
      description: "New realm needs initial technology signal baseline"
    - event: "scheduled_biweekly"
      description: "Bi-weekly radar refresh for active realms"
    - event: "SIG_ACI_001"
      signal_filter: "sections_updated contains 'technology_stack'"
      description: "Account intelligence updated technology context"
  manual:
    - "SA requests technology landscape before technical discovery"
    - "Pre-POC technology stack assessment"
    - "FCTO requests cross-realm technology pattern analysis"

validation_inputs:
  mandatory:
    - artifact: "{realm}/realm_profile.yaml"
      description: "Company context for signal source identification"
  optional:
    - artifact: "{realm}/intelligence/account_intelligence/company_profile.yaml"
      use: "Known technology stack and IT organization structure"
    - artifact: "{realm}/intelligence/industry_intelligence/industry_profile.yaml"
      use: "Industry technology benchmarks and digital maturity context"
    - artifact: "{realm}/intelligence/technology_scout/previous_radar.yaml"
      use: "Previous radar for trend comparison (30-day, 90-day)"

key_questions:
  signal_collection:
    - "What technologies appear in the company's job postings (last 90 days)?"
    - "What vendor products or tools does the company mention publicly?"
    - "What engineering blog posts or conference talks reveal technology choices?"
    - "What partnerships or vendor certifications has the company announced?"
  analysis:
    - "Which technologies are trending up (increasing mentions, new job roles)?"
    - "Which technologies are declining (fewer mentions, legacy migration signals)?"
    - "Are there competitor technologies in the landscape?"
    - "What technology gaps align with vendor solution capabilities?"
  engagement_relevance:
    - "Which detected technologies are relevant to active node use cases?"
    - "Does the technology landscape suggest readiness for vendor solution?"
    - "Are there technology adoption blockers (legacy dependencies, skills gaps)?"

expected_outputs:
  primary_artifact:
    path: "{realm}/intelligence/technology_scout/current_radar.yaml"
    format: "yaml"
    sections:
      - radar_metadata
      - technology_signals
      - ring_assignments
      - trend_indicators
      - competitive_technologies
      - engagement_relevance

  notifications:
    - recipient: "SA Agent"
      condition: "always"
      message: "Technology radar updated for {realm_name}. {signal_count} signals, {trend_count} trends detected."
    - recipient: "AE Agent"
      condition: "competitive_technology_detected"
      message: "Competitive technology detected at {realm_name}: {technology_name} in {ring} ring."
    - recipient: "FCTO Agent"
      condition: "cross_realm_pattern"
      message: "Technology pattern detected across multiple realms: {pattern_description}"

stop_conditions:
  escalate_to_human:
    - condition: "no_public_signals"
      reason: "Company has minimal public technology footprint"
      action: "SA to gather technology context through direct customer engagement"
  insufficient_data:
    - "No job postings found for company domain"
    - "Company website and engineering blog inaccessible"

estimated_execution_time: "15-30 minutes"
frequency: "Bi-weekly for active realms, on-demand for new realms"
human_review_required: false

last_updated: "2026-03-25"
version: "1.0"
status: "draft"
