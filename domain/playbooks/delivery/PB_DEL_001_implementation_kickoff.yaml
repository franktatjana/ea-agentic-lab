# PLAYBOOK: Implementation Kickoff
# Framework operationalization for AI agents
# Structures the transition from pre-sales to implementation

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_DEL_001"
framework_name: "Implementation Kickoff"
framework_source: "Implementation Governance Best Practices"
playbook_mode: "GENERATIVE"
playbook_category: "delivery_execution"
intended_agent_role: "Delivery Agent (delivery_agent)"
secondary_agents: ["AE Agent (deal context)", "SA Agent (architecture handoff)", "CA Agent (adoption readiness)"]

primary_objective: "Structure the transition from pre-sales to implementation by collecting all pre-sales artifacts, validating handoff completeness, creating the implementation project structure, and scheduling kickoff with all stakeholders"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Project setup, internal RACI, risk register, and handoff gap analysis are vendor-internal artifacts. The customer does not need visibility into internal readiness assessments or gap identification."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Shared project plan, timeline, milestones, and kickoff agenda"

when_not_to_use:
  - "Deal is not yet closed (pre-sales still active)"
  - "Implementation is services-only with no product deployment"
  - "Customer is self-service with no assigned delivery resources"
  - "Handoff already completed and implementation is underway"

# ==============================================================================
# RACI
# ==============================================================================
raci:
  responsible:
    role: "delivery_agent"
    agent: "delivery_agent"
    description: "Collects handoff artifacts, identifies gaps, creates project structure"

  accountable:
    role: "delivery_manager"
    human_required: true
    description: "Reviews and approves implementation plan and resource allocation"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted:
    - role: "ae_agent"
      on_steps: ["deal_context_collection", "stakeholder_identification"]
    - role: "sa_agent"
      on_steps: ["architecture_handoff", "technical_requirements_review"]

  informed:
    - role: "ca_agent"
      notify_on: ["kickoff_scheduled", "adoption_readiness_flag"]
    - role: "ps_agent"
      notify_on: ["services_scope_confirmed", "resource_requirements"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "SIG_LC_002"
      signal_filter: "new_status == 'implementation' OR new_status == 'closed_won'"
      description: "Node transitions to implementation or deal closes, initiating handoff"

    - event: "SIG_COM_001"
      signal_filter: "stage == 'Closed Won'"
      description: "Opportunity marked closed won, delivery handoff required"

  manual:
    - "Delivery Manager requests implementation kickoff preparation"
    - "AE requests handoff initiation for signed deal"
    - "SA signals readiness for architecture handoff"

  conditional:
    - condition: "$.opportunity.stage == 'Closed Won' AND $.implementation.kickoff_status == null"
      description: "Deal closed but no kickoff initiated yet"

    - condition: "$.handoff.requested == true AND $.handoff.completed == false"
      description: "Handoff requested but not yet completed"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "{realm}/{node}/external-infohub/overview.md"
      description: "Account overview and engagement context"
    - artifact: "{realm}/{node}/internal-infohub/opportunity/deal_summary.md"
      description: "Deal summary with scope, ARR, and contract terms"
    - artifact: "{realm}/{node}/internal-infohub/stakeholders/relationship_map.md"
      description: "Stakeholder map from pre-sales engagement"

  optional:
    - artifact: "{realm}/{node}/external-infohub/architecture/solution_description.md"
      use: "SA-authored solution architecture and design decisions"
    - artifact: "{realm}/{node}/external-infohub/poc/poc_results.md"
      use: "POC outcomes, validated use cases, and lessons learned"
    - artifact: "{realm}/{node}/external-infohub/success_plan/csp.yaml"
      use: "Customer success plan with agreed objectives and milestones"
    - artifact: "{realm}/{node}/internal-infohub/risks/*.md"
      use: "Pre-sales risks that carry into implementation"
    - artifact: "{realm}/{node}/internal-infohub/competitive/*.md"
      use: "Competitive context relevant to implementation positioning"

  minimum_data_threshold:
    - "Deal summary with scope and contract terms available"
    - "At least one stakeholder contact identified on customer side"
    - "Solution scope defined (products, use cases, data sources)"

# ==============================================================================
# KEY QUESTIONS
# ==============================================================================
key_questions:
  handoff_completeness:
    - "What solution was sold and what are the contracted deliverables?"
    - "What architecture decisions were made during pre-sales?"
    - "Were there POC results, and do they influence implementation approach?"
    - "What commitments were made to the customer during the sales cycle?"
    - "Are there known risks or constraints from pre-sales?"
    - "What competitive context should the delivery team be aware of?"

  stakeholder_mapping:
    - "Who is the executive sponsor on the customer side?"
    - "Who is the technical lead or project manager on the customer side?"
    - "Who from the vendor side will lead implementation (PS, SA, or partner)?"
    - "Are there third-party integrators or partners involved?"
    - "Who needs to attend the kickoff meeting?"

  scope_and_timeline:
    - "What is the agreed implementation timeline and milestones?"
    - "Are there hard deadlines (compliance, contract, business events)?"
    - "What are the phases of implementation (if phased rollout)?"
    - "What is the scope of data migration required?"
    - "What integrations need to be built?"

  resource_requirements:
    - "What vendor resources are needed (PS consultants, SA support, training)?"
    - "What customer resources are required (admin, security team, data team)?"
    - "Are there skill gaps on either side that need to be addressed?"
    - "Is partner involvement required for implementation?"

  risk_identification:
    - "What are the known technical risks from pre-sales?"
    - "Are there organizational risks (reorg, budget freeze, champion departure)?"
    - "What dependencies exist outside the project team's control?"
    - "Are there data quality or migration risks?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - id: "handoff_complete"
      condition: "handoff_artifacts_collected >= 0.8 AND stakeholder_map_complete == true"
      severity: "LOW"
      output_type: "Initiative"
      decision:
        title: "Handoff complete for {node}, ready to schedule kickoff"
        context: "All critical pre-sales artifacts collected and stakeholders identified"
        recommendation: "Proceed with kickoff scheduling and project plan creation"
        actions:
          - "Create implementation project plan with timeline and milestones"
          - "Draft kickoff agenda and distribute to stakeholders"
          - "Set up project tracking (Jira board, status cadence)"
          - "Initialize delivery risk register"

    - id: "handoff_gaps_critical"
      condition: "handoff_artifacts_collected < 0.5 OR solution_scope_undefined == true"
      severity: "HIGH"
      output_type: "Risk + Action Items"
      decision:
        title: "Critical handoff gaps for {node} implementation"
        context: "Missing essential pre-sales artifacts, cannot proceed safely"
        recommendation: "Block kickoff until gaps are resolved"
        actions:
          - "Identify specific missing artifacts and owners"
          - "Schedule handoff completion meeting with AE and SA"
          - "Document gaps with impact assessment"
          - "Set deadline for gap resolution before kickoff"
        urgency: "HIGH"
      creates:
        - object_type: "Risk"
          category: "delivery"
          severity: "HIGH"

    - id: "handoff_gaps_minor"
      condition: "handoff_artifacts_collected >= 0.5 AND handoff_artifacts_collected < 0.8"
      severity: "MEDIUM"
      output_type: "Initiative + Action Items"
      decision:
        title: "Partial handoff for {node}, proceed with gaps tracked"
        context: "Core artifacts available but some gaps exist"
        recommendation: "Proceed with kickoff but track gaps as action items"
        actions:
          - "Document missing items with owners and due dates"
          - "Include gap resolution in kickoff agenda"
          - "Add gaps to delivery risk register as MEDIUM risks"
          - "Schedule follow-up handoff session within first week"

    - id: "complex_implementation"
      condition: "integration_count > 3 OR data_migration_required == true OR multi_phase == true"
      severity: "MEDIUM"
      output_type: "Initiative"
      decision:
        title: "Complex implementation identified for {node}"
        context: "Multiple integrations, data migration, or phased rollout increases delivery risk"
        recommendation: "Apply enhanced project governance structure"
        actions:
          - "Create detailed implementation phases with gate reviews"
          - "Assign dedicated project manager"
          - "Establish weekly status cadence with steering committee"
          - "Include SA in ongoing architecture review capacity"

    - id: "tight_timeline"
      condition: "days_to_target_go_live < 60 AND scope_complexity == 'HIGH'"
      severity: "HIGH"
      output_type: "Risk + Initiative"
      decision:
        title: "Aggressive timeline for {node} implementation"
        context: "Target go-live in <60 days with high complexity scope"
        recommendation: "Flag timeline risk and negotiate scope or timeline adjustment"
        actions:
          - "Create critical path analysis"
          - "Identify scope reduction opportunities for phased approach"
          - "Escalate timeline risk to Delivery Manager"
          - "Prepare timeline options for customer discussion"
      creates:
        - object_type: "Risk"
          category: "delivery"
          severity: "HIGH"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/delivery/implementation_kickoff_{YYYY-MM-DD}.yaml"
    format: "yaml"
    sections:
      - handoff_assessment
      - project_plan
      - raci_matrix
      - risk_register
      - kickoff_agenda

    schema:
      handoff_assessment:
        - completeness_score: "percentage"
        - artifacts_collected: "array[artifact_name]"
        - artifacts_missing: "array[{name, owner, due_date, impact}]"
        - commitments_from_presales: "array[string]"
        - risks_from_presales: "array[risk]"

      project_plan:
        - implementation_phases: "array[{phase_name, start_date, end_date, deliverables}]"
        - milestones: "array[{name, target_date, criteria, owner}]"
        - dependencies: "array[{dependency, owner, status}]"
        - total_duration_weeks: "integer"

      raci_matrix:
        - activities: "array[{activity, responsible, accountable, consulted, informed}]"

      risk_register:
        - risks: "array[{title, severity, category, likelihood, impact, mitigation, owner}]"

      kickoff_agenda:
        - date: "date"
        - attendees: "array[{name, role, organization}]"
        - agenda_items: "array[{topic, duration_minutes, presenter}]"

  secondary_artifacts:
    - path: "{realm}/{node}/external-infohub/delivery/project_plan.md"
      description: "Customer-facing project plan with timeline and milestones"
    - path: "{realm}/{node}/external-infohub/delivery/kickoff_agenda.md"
      description: "Kickoff meeting agenda shared with customer"

  action_items:
    path: "{realm}/{node}/internal-infohub/actions/"
    create_for_each: "handoff gap and initial project setup task"

  notifications:
    - recipient: "AE Agent"
      condition: "handoff_gaps_identified"
      message: "Handoff gaps identified for {node} implementation. AE input needed on deal context."

    - recipient: "SA Agent"
      condition: "architecture_handoff_incomplete"
      message: "Architecture handoff incomplete for {node}. SA review requested."

    - recipient: "CA Agent"
      condition: "kickoff_scheduled"
      message: "Implementation kickoff scheduled for {node}. Adoption planning should begin."

    - recipient: "Delivery Manager"
      condition: "always"
      message: "Implementation kickoff prepared for {node}. Review project plan and risk register."

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "no_deal_summary_available"
      reason: "Cannot determine implementation scope without deal summary"
      action: "Request AE to provide deal summary before proceeding"

    - condition: "no_customer_contact_identified"
      reason: "No customer-side stakeholder available for kickoff"
      action: "AE to establish customer project contact"

    - condition: "scope_significantly_changed_since_sale"
      reason: "Implementation scope differs materially from what was sold"
      action: "Escalate to Delivery Manager and AE for scope realignment"

  insufficient_data:
    - "No deal summary or contract information available"
    - "Solution scope not defined (products, use cases unknown)"
    - "No stakeholder contacts on customer or vendor side"

  ambiguity_signals:
    - "Conflicting information between deal summary and solution description"
    - "Unclear whether customer expects phased or big-bang rollout"
    - "Multiple project timelines mentioned without consensus"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Deal is confirmed closed won or implementation approved"
    - "At least deal summary and account overview are available"
    - "Delivery resources identified or allocation in progress"

  post_execution:
    - "Handoff completeness score calculated"
    - "All gaps have assigned owners and due dates"
    - "Project plan has defined phases and milestones"
    - "RACI matrix covers all major implementation activities"
    - "Risk register initialized with pre-sales risks carried forward"
    - "Kickoff agenda drafted with all required attendees"

  output_quality:
    - "Project milestones have measurable completion criteria"
    - "Risk register entries have mitigation plans"
    - "RACI has no unassigned activities"
    - "Timeline is realistic given scope complexity"

# ==============================================================================
# INTEGRATION WITH OTHER PLAYBOOKS
# ==============================================================================
integrates_with:
  - playbook: "PB_CA_402_customer_success_plan"
    integration: "CSP handoff triggers implementation kickoff context"
    provides: "Customer objectives and milestones from success planning"

  - playbook: "PB_POC_501_poc_success_plan"
    integration: "POC results feed into implementation approach"
    provides: "Validated use cases and technical lessons learned"

  - playbook: "PB_DEL_002_go_live_readiness"
    integration: "Kickoff establishes milestones that DEL_002 validates at go-live"
    provides: "Baseline project plan and success criteria"

  - playbook: "PB_DEL_003_implementation_risk_review"
    integration: "Initial risk register seeded during kickoff"
    provides: "Baseline risk register for ongoing risk reviews"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "45-90 minutes (agent collection + human review)"
frequency: "Once per implementation engagement"
human_review_required: true
approval_workflow:
  - reviewer: "Delivery Manager"
    approval_gate: "Approve implementation plan, resource allocation, and timeline"
  - reviewer: "SA Agent"
    condition: "architecture_handoff_required"
    approval_gate: "Confirm architecture handoff completeness"

last_updated: "2026-02-27"
version: "1.0"
status: "DRAFT"
notes: "First dedicated Delivery Agent playbook. Bridges pre-sales to implementation with structured handoff validation."
