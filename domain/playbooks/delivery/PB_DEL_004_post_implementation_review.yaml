# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (MEDDPICC, Five Whys, SWOT,
# etc.) are industry-standard methodologies cited for
# educational context.

# PLAYBOOK: Post-Implementation Review
# Framework operationalization for AI agents
# Structured retrospective after implementation completion

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_DEL_004"
framework_name: "Post-Implementation Review"
framework_source: "Implementation Governance Best Practices"
playbook_mode: "GENERATIVE"
playbook_category: "delivery_execution"
intended_agent_role: "delivery-agent"
secondary_agents: ["SA Agent (technical review)", "PS Agent (services review)", "AE Agent (commercial review)", "CA Agent (handoff recipient)"]

primary_objective: "Conduct structured retrospective after implementation completion, capturing lessons learned, comparing outcomes to original plan, executing handoff to post-sales teams, and contributing anonymized implementation patterns to the Global Knowledge Vault"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "The retrospective analysis, internal lessons learned, and vendor-side performance assessment are internal artifacts. The customer does not need to see the vendor's self-assessment of delivery performance."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized implementation patterns, common blockers, and duration benchmarks for future project planning"

when_not_to_use:
  - "Implementation is still active (use PB_DEL_003 risk review instead)"
  - "Go-live has not occurred (use PB_DEL_002 readiness assessment)"
  - "Project was cancelled before any implementation work occurred"
  - "Post-implementation review already completed for this engagement"

# ==============================================================================
# RACI
# ==============================================================================
raci:
  responsible:
    role: "delivery_agent"
    agent: "delivery_agent"
    description: "Conducts retrospective, compiles outcomes analysis, executes handoff to CA Agent"

  accountable:
    role: "delivery_manager"
    human_required: true
    description: "Reviews retrospective findings and approves lessons learned publication"
    approval_actions:
      - "approve"
      - "request_revision"
      - "classify_lessons"

  consulted:
    - role: "sa_agent"
      on_steps: ["technical_outcomes_review", "architecture_lessons"]
    - role: "ps_agent"
      on_steps: ["services_outcomes_review", "resource_efficiency"]
    - role: "ae_agent"
      on_steps: ["commercial_alignment_review", "customer_satisfaction"]

  informed:
    - role: "ca_agent"
      notify_on: ["handoff_initiated", "adoption_baseline_established"]
    - role: "senior_manager"
      notify_on: ["review_completed", "significant_lessons_identified"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "SIG_LC_002"
      signal_filter: "new_status == 'go_live_complete' OR new_status == 'post_sales'"
      description: "Node transitions to post go-live or post-sales status"

    - event: "milestone_reached"
      signal_filter: "milestone_type == 'go_live' OR milestone_type == 'implementation_complete'"
      description: "Go-live or implementation completion milestone reached"

  manual:
    - "Delivery Manager requests post-implementation review"
    - "Project team requests retrospective after major delivery milestone"
    - "CA Agent requests formal handoff documentation"

  conditional:
    - condition: "$.implementation.status == 'complete' AND $.review.post_implementation == null"
      description: "Implementation marked complete but no review conducted"

    - condition: "$.go_live.date <= today - 14 AND $.review.post_implementation == null"
      description: "Two weeks post go-live without review (review window closing)"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "{realm}/{node}/internal-infohub/delivery/implementation_kickoff*.yaml"
      description: "Original implementation plan with milestones and scope"
    - artifact: "{realm}/{node}/internal-infohub/delivery/risk_register.yaml"
      description: "Final delivery risk register"
    - artifact: "{realm}/{node}/internal-infohub/delivery/risk_review_*.yaml"
      description: "Historical risk reviews for trend analysis"

  optional:
    - artifact: "{realm}/{node}/external-infohub/delivery/go_live_readiness*.md"
      use: "Go-live readiness assessment for outcome comparison"
    - artifact: "{realm}/{node}/external-infohub/success_plan/csp.yaml"
      use: "Customer success plan for objective achievement review"
    - artifact: "{realm}/{node}/internal-infohub/delivery/status_reports/*.md"
      use: "Historical status reports for delivery timeline analysis"
    - artifact: "Jira/project board export"
      use: "Final sprint/iteration data for velocity and backlog analysis"
    - artifact: "{realm}/{node}/internal-infohub/stakeholders/relationship_map.md"
      use: "Stakeholder engagement analysis"

  minimum_data_threshold:
    - "Original implementation plan available for comparison"
    - "Go-live has occurred or implementation formally closed"

# ==============================================================================
# KEY QUESTIONS
# ==============================================================================
key_questions:
  outcomes_vs_plan:
    - "How does actual timeline compare to original plan (weeks planned vs. actual)?"
    - "Were all contracted deliverables completed?"
    - "What scope changes occurred during implementation?"
    - "How does actual resource utilization compare to planned?"
    - "Were there budget overruns or under-runs?"

  quality_assessment:
    - "What was the go-live readiness score at cutover?"
    - "How many BLOCKER issues were resolved before go-live?"
    - "Were any known issues accepted for post go-live resolution?"
    - "What is the customer satisfaction with the implementation?"
    - "What is the post go-live incident rate (first 14 days)?"

  risk_retrospective:
    - "Which risks materialized and how were they handled?"
    - "Which risks were mitigated successfully?"
    - "Were there risks that were not anticipated?"
    - "What was the average time to resolve HIGH severity risks?"
    - "How effective were the risk mitigation strategies?"

  process_improvement:
    - "What went well during the implementation?"
    - "What should be improved for future implementations?"
    - "Were there recurring patterns in blockers or delays?"
    - "What tools, processes, or templates were most useful?"
    - "What was missing that would have improved delivery?"

  handoff_readiness:
    - "Is the customer ready for the transition to post-sales support model?"
    - "Has the CA Agent been briefed on customer context and adoption baseline?"
    - "Are there pending items that carry over to post-sales?"
    - "Is the support model operational (channels, SLAs, escalation paths)?"
    - "What adoption milestones should the CA Agent target first?"

  knowledge_contribution:
    - "What implementation patterns can be generalized for future use?"
    - "What duration benchmarks should be updated based on this implementation?"
    - "What common blocker patterns were observed?"
    - "What industry or use-case specific lessons emerged?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - id: "implementation_successful"
      condition: "timeline_variance_percentage <= 0.15 AND deliverables_complete == true AND customer_satisfaction >= 'SATISFIED'"
      severity: "LOW"
      output_type: "Decision + Knowledge Contribution"
      decision:
        title: "Successful implementation review for {node}"
        context: "Implementation completed within 15% of planned timeline, all deliverables met"
        recommendation: "Document as reference implementation, contribute patterns to knowledge vault"
        actions:
          - "Compile implementation patterns for Global Knowledge Vault"
          - "Update duration benchmarks for similar implementations"
          - "Document best practices identified"
          - "Execute handoff to CA Agent with adoption baseline"
          - "Consider customer as reference candidate"

    - id: "implementation_challenged"
      condition: "timeline_variance_percentage > 0.15 AND timeline_variance_percentage <= 0.40"
      severity: "MEDIUM"
      output_type: "Initiative + Lessons Learned"
      decision:
        title: "Challenged implementation review for {node}"
        context: "Implementation exceeded planned timeline by {variance}%. Root cause analysis needed."
        recommendation: "Conduct detailed root cause analysis and update planning benchmarks"
        actions:
          - "Identify top 3 root causes for timeline variance"
          - "Document specific improvement recommendations"
          - "Update resource estimation models for similar projects"
          - "Contribute lessons learned to Global Knowledge Vault"
          - "Execute handoff to CA Agent with variance context"

    - id: "implementation_problematic"
      condition: "timeline_variance_percentage > 0.40 OR deliverables_incomplete == true OR customer_satisfaction == 'DISSATISFIED'"
      severity: "HIGH"
      output_type: "Risk + Initiative + Lessons Learned"
      decision:
        title: "Problematic implementation review for {node}"
        context: "Significant delivery issues: timeline overrun >40%, incomplete deliverables, or customer dissatisfied"
        recommendation: "Executive review of delivery process and customer recovery plan"
        actions:
          - "Conduct formal root cause analysis with all stakeholders"
          - "Create customer recovery plan if satisfaction is low"
          - "Escalate process improvement recommendations to Senior Manager"
          - "Update risk identification guidelines based on missed risks"
          - "Execute handoff to CA Agent with recovery context and priority actions"
        urgency: "HIGH"
      creates:
        - object_type: "Risk"
          category: "retention"
          severity: "MEDIUM"

    - id: "handoff_to_ca"
      condition: "always"
      severity: "LOW"
      output_type: "Initiative"
      decision:
        title: "Post-sales handoff for {node}"
        context: "Implementation complete, transition to post-sales support and adoption"
        recommendation: "Execute structured handoff to CA Agent"
        actions:
          - "Compile handoff package (architecture, known issues, pending items)"
          - "Brief CA Agent on customer context and adoption baseline"
          - "Transfer open items to CA Agent action list"
          - "Trigger CA adoption playbooks (PB_DEL_005, PB_CA_012)"
          - "Schedule post-implementation check-in at 30 and 60 days"

    - id: "pattern_contribution"
      condition: "implementation_duration_days > 30"
      severity: "LOW"
      output_type: "Knowledge Contribution"
      decision:
        title: "Knowledge contribution from {node} implementation"
        context: "Implementation data sufficient for pattern extraction"
        recommendation: "Anonymize and contribute to Global Knowledge Vault"
        actions:
          - "Extract anonymized implementation duration by phase"
          - "Document common blocker categories and resolution approaches"
          - "Update integration complexity benchmarks"
          - "Record resource utilization patterns"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/delivery/post_implementation_review_{YYYY-MM-DD}.yaml"
    format: "yaml"
    sections:
      - executive_summary
      - outcomes_analysis
      - risk_retrospective
      - lessons_learned
      - handoff_package
      - knowledge_contribution

    schema:
      executive_summary:
        - implementation_start: "date"
        - implementation_end: "date"
        - planned_duration_weeks: "integer"
        - actual_duration_weeks: "integer"
        - variance_percentage: "number"
        - deliverables_planned: "integer"
        - deliverables_completed: "integer"
        - overall_assessment: "enum[SUCCESSFUL|CHALLENGED|PROBLEMATIC]"
        - customer_satisfaction: "enum[DELIGHTED|SATISFIED|NEUTRAL|DISSATISFIED]"

      outcomes_analysis:
        - timeline_comparison:
            planned_phases: "array[{phase, planned_weeks, actual_weeks, variance}]"
            critical_path_deviations: "array[string]"
        - scope_changes:
            total_changes: "integer"
            scope_increases: "array[{description, impact_weeks}]"
            scope_reductions: "array[{description, reason}]"
        - resource_utilization:
            vendor_days_planned: "number"
            vendor_days_actual: "number"
            customer_resource_availability: "enum[EXCELLENT|ADEQUATE|CONSTRAINED|POOR]"

      risk_retrospective:
        - risks_materialized: "array[{risk_title, original_severity, actual_impact, resolution}]"
        - risks_mitigated: "array[{risk_title, mitigation_approach}]"
        - risks_missed: "array[{risk_description, impact, why_missed}]"
        - average_risk_resolution_days: "number"

      lessons_learned:
        - what_went_well: "array[string]"
        - what_to_improve: "array[string]"
        - specific_recommendations: "array[{area, recommendation, priority}]"
        - process_gaps: "array[string]"

      handoff_package:
        - architecture_summary: "string (reference to architecture docs)"
        - known_issues: "array[{issue, severity, workaround, target_resolution}]"
        - pending_items: "array[{item, owner, due_date}]"
        - adoption_baseline: "string (current adoption state)"
        - key_contacts: "array[{name, role, relationship_strength}]"
        - recommended_ca_actions: "array[string]"

      knowledge_contribution:
        - anonymized: true
        - patterns:
            implementation_type: "string"
            industry: "string"
            duration_benchmark: "number (weeks)"
            common_blockers: "array[string]"
            integration_complexity: "enum[LOW|MEDIUM|HIGH]"
            resource_ratio: "string (vendor:customer)"

  secondary_artifacts:
    - path: "global/knowledge_vault/implementation_patterns/{pattern_id}.yaml"
      description: "Anonymized implementation pattern for Global Knowledge Vault"
    - path: "{realm}/{node}/external-infohub/delivery/implementation_summary.md"
      description: "Customer-appropriate implementation completion summary"

  action_items:
    path: "{realm}/{node}/internal-infohub/actions/"
    create_for_each: "pending item and process improvement recommendation"

  notifications:
    - recipient: "CA Agent"
      condition: "always"
      message: "Implementation complete for {node}. Handoff package ready. Adoption baseline: {adoption_state}. Trigger adoption playbooks."

    - recipient: "AE Agent"
      condition: "always"
      message: "Implementation review complete for {node}. Assessment: {overall_assessment}. Customer satisfaction: {satisfaction}."

    - recipient: "Delivery Manager"
      condition: "always"
      message: "Post-implementation review complete for {node}. Assessment: {overall_assessment}. Lessons learned documented."

    - recipient: "Senior Manager"
      condition: "overall_assessment == 'PROBLEMATIC' OR customer_satisfaction == 'DISSATISFIED'"
      message: "ATTENTION: Problematic implementation review for {node}. Customer recovery plan may be needed."

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "customer_satisfaction == 'DISSATISFIED'"
      reason: "Customer dissatisfaction requires executive engagement for recovery"
      action: "Delivery Manager and AE to develop customer recovery plan"

    - condition: "deliverables_incomplete AND no_remediation_plan"
      reason: "Incomplete deliverables without a plan to resolve"
      action: "Delivery Manager to negotiate completion plan or scope adjustment"

    - condition: "significant_process_failures_identified"
      reason: "Systemic delivery process issues require organizational response"
      action: "Senior Manager to review and sponsor process improvement initiative"

  insufficient_data:
    - "Original implementation plan not available (cannot compare outcomes)"
    - "No delivery status history (cannot analyze timeline variance)"
    - "Customer feedback not collected (cannot assess satisfaction)"

  ambiguity_signals:
    - "Conflicting stakeholder views on implementation success"
    - "Unclear whether pending items are implementation scope or post-sales requests"
    - "Customer satisfied but metrics show underperformance"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Implementation is complete or go-live has occurred"
    - "Original implementation plan available for comparison"
    - "Post go-live stabilization period has passed (minimum 7 days)"

  post_execution:
    - "Outcomes compared quantitatively to original plan"
    - "Lessons learned captured with specific recommendations"
    - "Handoff package complete with all required sections"
    - "CA Agent notified and adoption playbooks referenced"
    - "Knowledge contribution prepared (if implementation > 30 days)"
    - "Customer satisfaction assessed (even if informally)"

  output_quality:
    - "Timeline variance is quantified with root cause attribution"
    - "Lessons learned are specific and actionable (not generic platitudes)"
    - "Handoff package provides sufficient context for CA Agent to operate independently"
    - "Knowledge contributions are properly anonymized (no customer names or identifiers)"

# ==============================================================================
# INTEGRATION WITH OTHER PLAYBOOKS
# ==============================================================================
integrates_with:
  - playbook: "PB_DEL_001_implementation_kickoff"
    integration: "Original plan provides the baseline for outcomes comparison"
    provides: "Planned timeline, scope, milestones, and RACI"

  - playbook: "PB_DEL_002_go_live_readiness"
    integration: "Go-live assessment provides cutover quality baseline"
    provides: "Readiness score, accepted risks, open items at go-live"

  - playbook: "PB_DEL_003_implementation_risk_review"
    integration: "Risk review history provides delivery health trajectory"
    provides: "Risk register evolution and blocker history"

  - playbook: "PB_DEL_005_security_stage_adoption"
    integration: "Post-implementation handoff triggers adoption journey"
    trigger: "Implementation complete for security solution"

  - playbook: "PB_CA_012_adoption_guidance"
    integration: "Handoff provides adoption baseline for CA guidance"
    provides: "Current adoption state and recommended first actions"

  - playbook: "PB_AE_001_retrospective"
    integration: "Implementation review feeds into broader deal retrospective"
    provides: "Delivery-specific outcomes and lessons"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "60-90 minutes (review + analysis + handoff preparation)"
frequency: "Once per implementation completion"
human_review_required: true
approval_workflow:
  - reviewer: "Delivery Manager"
    approval_gate: "Approve retrospective findings and lessons learned classification"
  - reviewer: "CA Agent"
    condition: "handoff_package_ready"
    approval_gate: "Accept handoff and confirm adoption baseline understanding"

last_updated: "2026-02-27"
version: "1.0"
status: "draft"
notes: "Closes the delivery lifecycle by capturing institutional knowledge and ensuring smooth transition to post-sales. Knowledge contributions improve future project planning accuracy."
