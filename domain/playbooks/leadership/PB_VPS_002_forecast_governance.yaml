# PLAYBOOK: Forecast Governance
# Purpose: Validate forecast accuracy at roll-up level, identify commit risks, ensure board-ready reporting

playbook_id: "PB_VPS_002"
framework_name: "Forecast Governance"
framework_source: "Leadership - VP Sales"
playbook_mode: "ASSESSMENT"
playbook_category: "pursuit_sales_support"
intended_agent_role: "vp-sales-agent"
secondary_agents: ["Senior Manager Agent (territory forecasts)", "RevOps Agent (analytics and variance)"]

primary_objective: "Validate forecast accuracy at regional roll-up level, identify commit risks across territories, reconcile bottom-up forecasts with top-down targets, and produce board-ready revenue narrative"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Forecast governance contains sensitive revenue projections, commit analysis, and board-level reporting."

when_not_to_use:
  - "First 2 weeks of quarter (insufficient pipeline movement data)"
  - "During territory realignment (forecasts not comparable to baseline)"

raci:
  responsible:
    role: "VP Sales Agent"
    agent: "vp-sales-agent"
    description: "Validates territory forecasts, identifies commit risks, generates roll-up with variance narrative"
  accountable:
    role: "CRO/CEO"
    human_required: true
    description: "Signs off on forecast commit and board narrative"
    approval_actions:
      - "approve"
      - "request_revision"
      - "override_forecast"
  consulted:
    - role: "Senior Manager Agent"
      on_steps: ["territory_forecast_validation", "deal_risk_assessment"]
    - role: "RevOps Agent"
      on_steps: ["pipeline_analytics", "historical_accuracy"]
  informed:
    - role: "Senior Manager"
      notify_on: ["forecast_published", "commit_risk_flagged"]
    - role: "Finance"
      notify_on: ["forecast_published"]

trigger_conditions:
  automatic:
    - event: "weekly_forecast_cycle"
      description: "Weekly forecast governance cadence"
    - event: "month_end_approaching"
      description: "Intensified forecast review in final week of month"
    - event: "board_meeting_preparation"
      description: "Pre-board forecast lock and narrative generation"
  manual:
    - "CRO requests forecast review"
    - "Finance requests revenue projection update"

validation_inputs:
  mandatory:
    - artifact: "Territory forecasts from Senior Managers"
      description: "Bottom-up forecasts by territory with deal-level detail"
    - artifact: "Historical forecast accuracy data"
      description: "Prior quarter accuracy for bias detection"
  optional:
    - artifact: "Pipeline stage distribution and velocity"
      use: "Validate forecast realism against pipeline math"
    - artifact: "Deal risk flags from AE agents"
      use: "Identify deals at risk of slipping or loss"
    - artifact: "Macro-economic indicators"
      use: "External factors affecting forecast assumptions"

key_questions:
  forecast_validation:
    - "Does the roll-up forecast match pipeline math (coverage, conversion, velocity)?"
    - "Which territories have forecast variance >15% vs. prior week?"
    - "Are there commit deals without validated next steps or champion access?"
  risk_assessment:
    - "Which commit deals have the highest slip risk?"
    - "Are there concentration risks (too much commit in too few deals)?"
    - "Does historical accuracy suggest systematic optimism or pessimism bias?"
  board_narrative:
    - "What is the variance narrative (why up/down vs. plan)?"
    - "What are the top 3 upside opportunities and top 3 downside risks?"
    - "What corrective actions are in flight for underperforming territories?"

expected_outputs:
  primary_artifact:
    path: "leadership/forecast/governance_{YYYY-WW}.yaml"
    format: "yaml"
    sections:
      - forecast_summary
      - territory_roll_up
      - commit_validation
      - risk_flags
      - variance_narrative
      - board_narrative

  risk_objects:
    path: "leadership/forecast/risks/"
    create_if:
      - "Commit deal has slip indicators (no activity 14+ days, champion unavailable)"
      - "Territory forecast variance exceeds 15%"
      - "Pipeline coverage below 2.5x for remaining quarter"
    template: "Risk with mitigation plan"

  notifications:
    - recipient: "Senior Manager"
      condition: "territory_risk_flagged"
      message: "Forecast risk flagged in {territory}: {risk_description}. Review and provide updated commit."
    - recipient: "CRO"
      condition: "always"
      message: "Forecast governance complete for week {week}: Commit = {commit_amount}, Best Case = {best_case}, Risk Flags = {risk_count}"

stop_conditions:
  escalate_to_human:
    - condition: "forecast_gap_exceeds_plan_by_25_percent"
      reason: "Gap too large for organic pipeline recovery"
      action: "CRO to decide on intervention (pipeline blitz, territory support, target adjustment)"
    - condition: "contradictory_signals"
      reason: "Bottom-up forecast conflicts with pipeline math by >20%"
      action: "VP Sales to conduct deal-level review with Senior Managers"
  insufficient_data:
    - "Territory forecasts not submitted by deadline"
    - "Pipeline data stale (>3 days old)"

estimated_execution_time: "15-25 minutes"
frequency: "Weekly (intensified at month-end and quarter-end)"
human_review_required: true

last_updated: "2026-03-25"
version: "1.0"
status: "draft"
