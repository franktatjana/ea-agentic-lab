# PLAYBOOK: Revenue Strategy Review
# Purpose: Periodic review of regional revenue performance, territory health, and strategic adjustments

playbook_id: "PB_VPS_001"
framework_name: "Revenue Strategy Review"
framework_source: "Leadership - VP Sales"
playbook_mode: "ASSESSMENT"
playbook_category: "operations_reporting"
intended_agent_role: "vp-sales-agent"
secondary_agents: ["Senior Manager Agent (territory details)", "RevOps Agent (pipeline analytics)"]

primary_objective: "Assess regional revenue performance against targets, identify territory gaps and coverage issues, and determine strategic adjustments to GTM motion, territory design, or resource allocation"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Revenue strategy reviews contain sensitive pipeline data, territory performance metrics, and leadership decisions."

when_not_to_use:
  - "Mid-quarter with insufficient data (less than 4 weeks into quarter)"
  - "Immediately after territory realignment (allow 30 days for baseline)"

raci:
  responsible:
    role: "VP Sales Agent"
    agent: "vp-sales-agent"
    description: "Aggregates territory performance, identifies gaps, generates strategic recommendations"
  accountable:
    role: "CRO/CEO"
    human_required: true
    description: "Approves strategic adjustments, resource reallocation, and GTM changes"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"
  consulted:
    - role: "Senior Manager Agent"
      on_steps: ["territory_performance", "rep_productivity"]
    - role: "RevOps Agent"
      on_steps: ["pipeline_analytics", "forecast_data"]
  informed:
    - role: "Senior Manager"
      notify_on: ["strategy_review_complete", "territory_adjustment"]

trigger_conditions:
  automatic:
    - event: "end_of_quarter"
      description: "Quarterly revenue strategy review"
    - event: "forecast_variance_high"
      description: "Forecast variance exceeds 20% threshold at roll-up level"
  manual:
    - "CRO requests revenue performance review"
    - "Board meeting preparation"
    - "Annual planning cycle"

validation_inputs:
  mandatory:
    - artifact: "Pipeline data by territory and segment"
      description: "Current pipeline, stage distribution, and velocity metrics"
    - artifact: "Revenue actuals vs. targets by territory"
      description: "YTD and quarterly performance against plan"
  optional:
    - artifact: "Rep productivity metrics (activity, conversion, deal size)"
      use: "Identify performance levers and coaching needs"
    - artifact: "Market segment data (TAM, SAM, penetration)"
      use: "Territory design and coverage optimization"
    - artifact: "Competitive win/loss data by territory"
      use: "Competitive response strategy"

key_questions:
  revenue_performance:
    - "Which territories are ahead/behind plan and by how much?"
    - "What is the pipeline coverage ratio by territory (target: 3x+)?"
    - "What is the average deal cycle and how has it changed?"
  territory_health:
    - "Are there coverage gaps (territories without adequate pipeline)?"
    - "Is territory balance appropriate (workload, opportunity, capacity)?"
    - "Which segments or verticals are underperforming?"
  strategic_adjustments:
    - "Should territory boundaries be adjusted?"
    - "Are additional resources needed in specific segments?"
    - "Does the GTM motion need modification (enterprise vs. mid-market mix)?"

expected_outputs:
  primary_artifact:
    path: "leadership/revenue_strategy/review_{YYYY-Q}.yaml"
    format: "yaml"
    sections:
      - executive_summary
      - revenue_performance_by_territory
      - pipeline_health
      - territory_coverage_analysis
      - strategic_recommendations
      - action_items

  notifications:
    - recipient: "Senior Manager"
      condition: "always"
      message: "Revenue strategy review complete for {quarter}. {territory_count} territories assessed, {action_count} strategic actions recommended."
    - recipient: "CRO"
      condition: "strategic_adjustment_recommended"
      message: "Strategic adjustments recommended in revenue review: {adjustment_summary}"

stop_conditions:
  escalate_to_human:
    - condition: "revenue_gap_exceeds_30_percent"
      reason: "Revenue gap too large for tactical correction"
      action: "CRO must assess whether targets need reset or major intervention required"
  insufficient_data:
    - "Pipeline data unavailable or stale (>7 days old)"
    - "Territory assignments not current"

estimated_execution_time: "15-30 minutes"
frequency: "Quarterly (or on-demand for forecast variance)"
human_review_required: true

last_updated: "2026-03-25"
version: "1.0"
status: "draft"
