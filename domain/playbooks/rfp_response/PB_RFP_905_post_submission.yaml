# RFP Post-Submission Analysis Playbook
# Purpose: Capture submission details and extract win/loss learnings

id: "PB_RFP_905"
name: "RFP Post-Submission Analysis"
version: "1.0"
status: "ACTIVE"
playbook_mode: "ANALYTICAL"
playbook_category: "pursuit_sales_support"
intended_agent_role: "rfp-agent"

metadata:
  category: "learning"
  framework: "Win/Loss Analysis"
  team_owner: "rfp_response"
  description: "Document submission, track outcome, extract learnings for future RFP responses"
  notes: "Closes the RFP lifecycle. Feeds patterns into Global Knowledge Vault for institutional learning."

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Win/loss analysis contains competitive positioning and pricing insights."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized RFP patterns, win rates by category, common requirement themes"

raci:
  responsible:
    role: "rfp_agent"
    agent: "rfp-agent"
    description: "Documents submission, coordinates outcome tracking, produces win/loss analysis"
  accountable:
    role: "sales_leadership"
    human_required: true
    description: "Reviews win/loss findings and approves knowledge vault updates"
  consulted:
    - role: "account_executives"
      on_steps: ["outcome_debrief", "customer_feedback"]
    - role: "competitive_intelligence"
      on_steps: ["competitive_learnings"]
  informed:
    - role: "management"
      notify_on: ["win_loss_report_complete"]

phases:
  - name: "Submission Confirmation"
    steps:
      - "Record submission timestamp, format, and recipient confirmation"
      - "Archive final submitted response in account hub"
      - "Set outcome tracking reminder (30/60/90 day follow-up)"
  - name: "Outcome Tracking"
    steps:
      - "Monitor deal progression post-submission"
      - "Capture customer questions and clarification requests"
      - "Record shortlist/elimination status"
  - name: "Win/Loss Analysis"
    steps:
      - "Conduct outcome debrief with account team"
      - "Identify winning/losing factors by evaluation criteria"
      - "Extract reusable response patterns for knowledge vault"
      - "Update competitive intelligence with positioning learnings"

quality_gates:
  - "Outcome recorded with customer feedback where available"
  - "Learnings documented and routed to knowledge vault"
  - "Competitive intelligence updated if competitor won"
