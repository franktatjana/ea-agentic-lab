# RFP Quality Review Playbook
# Purpose: Pre-submission compliance and quality validation

id: "PB_RFP_904"
name: "RFP Quality Review"
version: "1.0"
status: "ACTIVE"
playbook_mode: "ASSESSMENT"
playbook_category: "pursuit_sales_support"
intended_agent_role: "rfp-agent"

metadata:
  category: "quality"
  framework: "RFP Quality Assurance"
  team_owner: "rfp_response"
  description: "Validate response completeness, compliance, and quality before submission"
  notes: "Final gate before submission. No TBDs, all mandatory requirements addressed, all sections reviewed."

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Quality review findings and compliance gaps are vendor-internal."

raci:
  responsible:
    role: "rfp_agent"
    agent: "rfp-agent"
    description: "Executes compliance matrix check, quality scoring, pre-submission checklist"
  accountable:
    role: "sales_leadership"
    human_required: true
    description: "Final sign-off on submission readiness"
  consulted:
    - role: "solution_architects"
      on_steps: ["technical_accuracy_review"]
    - role: "infosec_agent"
      on_steps: ["security_section_review"]
  informed:
    - role: "account_executives"
      notify_on: ["submission_ready", "blockers_found"]

phases:
  - name: "Compliance Review"
    steps:
      - "Verify all mandatory requirements addressed in compliance matrix"
      - "Check formatting against RFP submission requirements"
      - "Validate all attachments and appendices present"
  - name: "Quality Scoring"
    steps:
      - "Check win theme visibility across response sections"
      - "Verify proof points and customer references included"
      - "Assess differentiation clarity vs. generic responses"
  - name: "Pre-Submission Checklist"
    steps:
      - "Confirm zero TBDs in final response"
      - "Executive summary reviewed by senior manager"
      - "Pricing approved and terms reviewed by legal"
      - "Security sections validated by infosec-agent"

quality_gates:
  - "Compliance matrix 100% complete"
  - "Zero TBD items remaining"
  - "All review sign-offs collected"
