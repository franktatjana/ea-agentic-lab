# RFP Response Strategy Playbook
# Purpose: Develop win themes and differentiated response strategy

id: "PB_RFP_903"
name: "RFP Response Strategy"
version: "1.0"
status: "ACTIVE"
playbook_mode: "GENERATIVE"
playbook_category: "pursuit_sales_support"
intended_agent_role: "rfp-agent"

metadata:
  category: "commercial"
  framework: "Response Strategy"
  team_owner: "rfp_response"
  description: "Develop win themes, executive summary, and section-level response strategy"
  notes: "Runs after bid decision (PB_RFP_902). Produces the strategic foundation before drafting begins."

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Win themes and positioning strategy are vendor-internal competitive advantage."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Response outline shared with customer for alignment (when applicable)"

raci:
  responsible:
    role: "rfp_agent"
    agent: "rfp-agent"
    description: "Develops win themes, drafts executive summary, creates response outline"
  accountable:
    role: "sales_leadership"
    human_required: true
    description: "Validates win themes align with account strategy"
  consulted:
    - role: "account_executives"
      on_steps: ["win_theme_development", "executive_summary"]
    - role: "competitive_intelligence"
      on_steps: ["competitive_positioning"]
  informed:
    - role: "solution_architects"
      notify_on: ["response_outline_complete"]

phases:
  - name: "Win Theme Development"
    steps:
      - "Identify 3-5 differentiated positioning themes from RFP requirements"
      - "Map each theme to specific customer pain points and evaluation criteria"
      - "Validate themes against competitive intelligence"
  - name: "Executive Summary"
    steps:
      - "Draft 1-page executive summary leading with customer outcomes"
      - "Embed win themes in opening narrative"
      - "Include proof points and differentiators"
  - name: "Response Outline"
    steps:
      - "Create section-by-section response plan"
      - "Assign section owners (SA, specialist, AE, InfoSec)"
      - "Set milestone timeline with review checkpoints"

quality_gates:
  - "Win themes validated against competitive landscape"
  - "Executive summary reviewed by AE for customer alignment"
  - "All sections assigned to named owners with deadlines"
