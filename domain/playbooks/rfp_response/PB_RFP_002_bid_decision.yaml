# RFP Bid/No-Bid Decision Playbook
# Purpose: Structured bid decision framework for RFP opportunities

id: "PB_RFP_002"
name: "RFP Bid/No-Bid Decision"
version: "1.0"
status: "ACTIVE"
playbook_mode: "ASSESSMENT"
playbook_category: "pursuit_sales_support"
intended_agent_role: "rfp-agent"

metadata:
  category: "commercial"
  framework: "Bid Decision Framework"
  team_owner: "rfp_response"
  description: "Evaluate RFP opportunity fit and make structured bid/no-bid recommendation"
  notes: "Weighted scoring across strategic fit, competitive position, solution fit, resource availability, and commercial viability"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Bid decision rationale and scoring methodology are vendor-internal strategy."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized bid decision patterns and win rate correlation (after engagement closes)"

raci:
  responsible:
    role: "rfp_agent"
    agent: "rfp-agent"
    description: "Analyzes RFP requirements, scores fit dimensions, produces bid recommendation"
  accountable:
    role: "sales_leadership"
    human_required: true
    description: "Approves final bid/no-bid decision"
    approval_actions: ["approve", "override", "escalate"]
  consulted:
    - role: "account_executives"
      on_steps: ["strategic_fit_assessment", "competitive_position"]
    - role: "solution_architects"
      on_steps: ["solution_fit_scoring"]
  informed:
    - role: "management"
      notify_on: ["decision_made", "no_bid_with_rationale"]

triggers:
  - event: "rfp_received"
    conditions:
      - "RFP document uploaded to deal record"
    actions:
      - "Extract requirements and evaluation criteria"
      - "Score against 5 fit dimensions"
      - "Produce bid/no-bid recommendation with evidence"

phases:
  - name: "RFP Intake Analysis"
    steps:
      - "Extract mandatory requirements and evaluation criteria"
      - "Identify red flags (timeline, scope, incumbent advantage)"
      - "Map requirements to platform capabilities"
  - name: "Fit Scoring"
    steps:
      - "Score strategic fit (account tier, market segment, reference value)"
      - "Score competitive position (incumbent, known competitors, differentiation)"
      - "Score solution fit (capability coverage, gaps, customization needed)"
      - "Score resource availability (SA capacity, specialist needs, timeline feasibility)"
      - "Score commercial viability (deal size, margin, terms)"
  - name: "Decision"
    steps:
      - "Calculate weighted composite score"
      - "Generate bid/no-bid recommendation with supporting evidence"
      - "Route to sales leadership for approval"

quality_gates:
  - "All 5 fit dimensions scored with evidence"
  - "Red flags documented with mitigation or escalation"
  - "Resource availability confirmed with SA lead"
