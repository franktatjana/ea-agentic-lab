# disclaimer
# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (Pyramid Principle, SCQA,
# etc.) are industry-standard methodologies cited for
# educational context.

# PLAYBOOK: Executive Advisory & Briefing
# Framework operationalization for AI agents

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_FCTO_002"
framework_name: "Executive Advisory & Briefing"
framework_source: "Pyramid Principle (Barbara Minto) / SCQA Framework"
intended_agent_role: "fcto-agent"
intended_sub_agent: "fcto-executive-advisory-agent"
secondary_agents:
  - "AE Agent provides customer context and stakeholder map"
  - "SA Agent provides technical depth"
  - "VE Agent provides value narrative"
playbook_mode: "GENERATIVE"
playbook_category: "executive_engagement"

primary_objective: "Prepare executive briefing packages with customer-specific context, cross-account evidence, and audience-calibrated messaging for CTO, CIO, CEO, and board engagements"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Briefing packages contain commercial context, deal positioning, competitive framing, and internal strategy that are vendor-internal. Messaging calibration and objection handling are sensitive."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Sanitized talking points and leave-behind materials shared with customer post-engagement"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized executive engagement templates and messaging frameworks for field reuse"

when_not_to_use:
  - "Operational account meetings (regular check-ins, QBRs handled by CA Agent)"
  - "Technical deep-dive sessions (SA Agent's domain)"
  - "No customer context available (briefing without context risks misalignment)"
  - "Audience level unknown (messaging calibration requires knowing the audience)"
  - "Deal size < $500K without strategic significance (overhead exceeds value)"

raci:
  responsible:
    role: "FCTO Agent"
    agent: "fcto-executive-advisory-agent"
    description: "Prepares executive briefing packages with audience-calibrated messaging, cross-account evidence, and strategic framing"

  accountable:
    role: "Field CTO"
    human_required: true
    description: "Reviews briefing accuracy, validates strategic messaging, and delivers executive engagement"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted:
    - role: "AE Agent"
      on_steps: ["customer_context_gathering", "stakeholder_mapping", "deal_positioning"]
    - role: "SA Agent"
      on_steps: ["technical_narrative_depth", "architecture_discussion_points", "demo_framing"]
    - role: "VE Agent"
      on_steps: ["value_story_integration", "roi_talking_points", "business_case_summary"]

  informed:
    - role: "AE Agent"
      notify_on: ["briefing_package_ready"]
    - role: "Sales Leadership"
      notify_on: ["strategic_executive_engagement_scheduled"]
    - role: "SA Agent"
      notify_on: ["technical_narrative_finalized"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Executive briefing request created in CRM"
    - "C-suite meeting scheduled with customer (CTO, CIO, CEO, Board)"
    - "Strategic deal > $1M advancing to executive engagement stage"
    - "Executive sponsor added to opportunity stakeholder map"
    - "Customer requests executive technology discussion or roadmap briefing"

  manual:
    - "AE requests executive briefing for strategic account"
    - "Field CTO initiates proactive executive outreach to key account"
    - "Sales leadership requests board-level presentation for customer"

  conditional:
    - "IF deal_value > 1000000 AND executive_engagement_requested THEN trigger"
    - "IF audience_level IN [CTO, CIO, CEO, Board] THEN trigger"
    - "IF strategic_account == true AND executive_briefing_due THEN trigger"
    - "IF competitive_situation == true AND executive_sponsor_involved THEN trigger"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "{realm}/{node}/external-infohub/overview.md"
    - artifact: "Audience profile (role, level, priorities, known concerns)"
      examples: ["CTO focused on platform modernization", "CIO evaluating vendor consolidation", "CEO concerned with operational risk"]
    - artifact: "Engagement purpose (what outcome is expected from the meeting)"
      examples: ["Secure executive sponsorship", "Roadmap alignment", "Budget approval", "Strategic partnership discussion"]
    - artifact: "Customer context (industry, size, strategic initiatives, challenges)"

  optional:
    - artifact: "{realm}/{node}/internal-infohub/stakeholders/relationship_map.md"
      use: "Map audience dynamics and influence structure"
    - artifact: "Cross-account evidence from PB_FCTO_001 pattern reports"
      use: "Peer benchmarks and industry patterns for executive credibility"
    - artifact: "{realm}/{node}/internal-infohub/competitive/*.md"
      use: "Competitive positioning for executive conversations"
    - artifact: "VE Agent business case summary"
      use: "Value narrative and ROI talking points"
    - artifact: "Product roadmap (releasable version)"
      use: "Technology direction discussion points"

  minimum_data_threshold:
    - "Customer industry and size known"
    - "Audience role and level confirmed"
    - "Engagement purpose defined"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  audience_calibration:
    - "What is the executive's primary strategic priority this quarter/year?"
    - "What is their technical depth (CTO-level detail vs. CEO-level outcomes)?"
    - "What concerns or objections have they raised in prior interactions?"
    - "Who else will be in the room, and what are their roles and influence?"
    - "What does success look like for this executive (metrics, outcomes, positioning)?"

  customer_context:
    - "What are the customer's top 3 strategic initiatives?"
    - "What industry pressures or regulatory changes affect their technology decisions?"
    - "What is their current relationship with {vendor} (new, expanding, renewing, at-risk)?"
    - "What competitive alternatives are they evaluating or using?"

  messaging_framing:
    - "What is the single most compelling message for this audience (the headline)?"
    - "What cross-account evidence supports the strategic narrative (peer benchmarks)?"
    - "What anticipated objections need preemptive framing?"
    - "What leave-behind or follow-up action advances the relationship?"
    - "What topics should be avoided in this engagement (known sensitivities)?"

  engagement_logistics:
    - "What is the meeting format (in-person, virtual, keynote, roundtable)?"
    - "What is the time allocation (15-min exec slot, 1-hour briefing, half-day workshop)?"
    - "What materials need advance preparation (deck, demo, whiteboard, leave-behind)?"
    - "What follow-up cadence is expected after the engagement?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    # CTO audience, technical vision
    - condition: "audience_level == CTO"
      output_type: "Decision"
      decision: |
        CREATE Decision:
          title: "CTO briefing framing for {node}"
          context: "Audience is CTO, expects technical vision with architectural depth"
          decision: "Frame briefing around technology direction, architecture patterns, and technical differentiation"
          actions:
            - "Lead with technology vision narrative from PB_FCTO_003 outputs"
            - "Include architecture pattern evidence from peer deployments"
            - "Prepare for deep technical questions with SA Agent input"
            - "Include roadmap discussion points (approved for external sharing)"
          stakeholders: ["Field CTO", "SA Agent"]

    # CIO audience, operational value
    - condition: "audience_level == CIO"
      output_type: "Decision"
      decision: |
        CREATE Decision:
          title: "CIO briefing framing for {node}"
          context: "Audience is CIO, expects operational value and risk reduction narrative"
          decision: "Frame briefing around operational efficiency, consolidation, risk reduction, and total cost"
          actions:
            - "Lead with operational impact and consolidation benefits"
            - "Include TCO comparison and efficiency metrics from VE Agent"
            - "Prepare risk reduction narrative (security, compliance, resilience)"
            - "Include peer benchmarks showing operational improvements"
          stakeholders: ["Field CTO", "VE Agent"]

    # CEO/Board audience, business outcomes
    - condition: "audience_level IN [CEO, Board]"
      output_type: "Decision + Initiative"
      decision: |
        CREATE Decision:
          title: "Executive/Board briefing framing for {node}"
          context: "Audience is CEO or Board, expects business outcome narrative"
          decision: "Frame briefing around strategic business outcomes, competitive positioning, and market leadership"
          actions:
            - "Lead with business outcomes and strategic value"
            - "Use SCQA framework (Situation-Complication-Question-Answer)"
            - "Limit technical depth, focus on market positioning and business impact"
            - "Prepare 3-slide maximum board summary with outcome metrics"
          stakeholders: ["Field CTO", "AE Agent", "Sales Leadership"]

        CREATE Initiative:
          title: "Executive co-presentation coordination for {node}"
          owner: "Field CTO + AE"
          timeline: "1 week before engagement"
          actions:
            - "Align with {vendor} executive sponsor for co-presentation"
            - "Rehearse key messages and anticipated questions"
            - "Prepare leave-behind document for board distribution"

    # Competitive situation with executive engagement
    - condition: "competitive_situation == true AND audience_level IN [CTO, CIO, CEO]"
      severity: "HIGH"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Competitive executive engagement for {node}"
          severity: "HIGH"
          category: "competitive"
          description: "Executive meeting with active competitive evaluation, misalignment risks deal loss"

        CREATE Initiative:
          title: "Competitive positioning preparation for {node} executive briefing"
          owner: "Field CTO + CI Agent"
          urgency: "HIGH"
          actions:
            - "Integrate competitive differentiation into briefing narrative"
            - "Prepare preemptive objection handling for known competitor strengths"
            - "Include customer-specific proof points that counter competitor claims"
            - "Brief AE on competitive talking points and topics to avoid"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/field_cto/executive_briefing_{YYYY-MM-DD}.md"
    format: "markdown"
    sections:
      - briefing_metadata
      - executive_summary
      - audience_profile
      - messaging_framework
      - talking_points
      - anticipated_questions
      - competitive_positioning
      - leave_behind_summary
      - follow_up_plan

    schema:
      briefing_metadata:
        - engagement_date: "string (YYYY-MM-DD)"
        - audience: "string (name, title, company)"
        - audience_level: "enum[CTO|CIO|CEO|Board|VP_Engineering|VP_IT]"
        - engagement_purpose: "string"
        - meeting_format: "string"
        - duration: "string"

      executive_summary:
        - headline_message: "string (single sentence, the key takeaway)"
        - situation: "string (current state, SCQA S)"
        - complication: "string (challenge or change, SCQA C)"
        - question: "string (implied strategic question, SCQA Q)"
        - answer: "string (proposed path forward, SCQA A)"

      messaging_framework:
        - primary_message: "string"
        - supporting_points: "array[string] (3 max, Pyramid Principle)"
        - evidence: "array[string] (cross-account proof points)"
        - differentiators: "array[string] (vs. competitive alternatives)"

      talking_points:
        - topic: "string"
          key_message: "string"
          supporting_data: "string"
          transition: "string (how to move to next topic)"

      anticipated_questions:
        - question: "string"
          recommended_response: "string"
          supporting_evidence: "string"
          escalation_path: "string (if question requires follow-up)"

      follow_up_plan:
        - action: "string"
          owner: "string"
          timeline: "string"
          deliverable: "string"

  decision_objects:
    path: "{realm}/{node}/internal-infohub/decisions/"
    create_if:
      - "Briefing framing decision (audience-calibrated approach)"
      - "Competitive positioning strategy for executive engagement"
    template: "ADR format"

  risk_objects:
    path: "{realm}/{node}/internal-infohub/risks/"
    create_if:
      - "Competitive executive engagement (misalignment risk)"
      - "Executive meeting without adequate customer context"
      - "Board presentation with unvalidated messaging"
    template: "Risk with mitigation plan"

  initiative_objects:
    path: "{realm}/{node}/internal-infohub/initiatives/"
    create_if:
      - "Executive co-presentation coordination"
      - "Competitive positioning preparation"
      - "Follow-up action plan post-engagement"
    template: "Initiative with actions, owner, timeline"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Executive briefing package ready for {node}: {audience_level} engagement on {date}"

    - recipient: "Sales Leadership"
      condition: "audience_level IN [CEO, Board] OR deal_value > 2000000"
      message: "Strategic executive engagement prepared for {node}: {audience_level} briefing"

    - recipient: "SA Agent"
      condition: "technical_narrative_included == true"
      message: "Technical narrative finalized for {node} executive briefing, review recommended"

    - recipient: "Field CTO"
      condition: "always"
      message: "Briefing package complete for {node}: {audience_level}, purpose: {engagement_purpose}"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "no_customer_context_available"
      reason: "Cannot prepare executive briefing without understanding customer situation"
      action: "AE must provide customer context before briefing preparation proceeds"

    - condition: "audience_level_unknown"
      reason: "Messaging calibration requires knowing the audience level"
      action: "AE must confirm audience role, level, and priorities"

    - condition: "engagement_purpose_unclear"
      reason: "Briefing framing depends on desired outcome"
      action: "AE and Field CTO must align on engagement purpose before preparation"

    - condition: "board_presentation_requested AND no_executive_sponsor_alignment"
      reason: "Board-level presentations require internal executive coordination"
      action: "Field CTO must align with {vendor} executive sponsor before board presentation prep"

  insufficient_data:
    - "No customer overview or account context"
    - "No stakeholder map or audience profile"
    - "No engagement purpose defined"
    - "No prior interaction history with this executive"

  ambiguity_signals:
    - "Multiple conflicting priorities from different stakeholders"
    - "Unclear whether engagement is relationship-building or deal-advancing"
    - "Customer context suggests executive may not be the decision-maker"

  human_judgment_required:
    - "Selecting which cross-account evidence to include (relevance vs. recency)"
    - "Calibrating competitive positioning intensity (aggressive vs. subtle)"
    - "Determining appropriate roadmap disclosure level"
    - "Deciding follow-up cadence and next steps"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Customer overview exists in InfoHub"
    - "Audience level and role confirmed"
    - "Engagement purpose defined and documented"
    - "Meeting date and format known"

  post_execution:
    - "Messaging follows SCQA or Pyramid Principle structure"
    - "Talking points calibrated to audience level (no CTO-depth for CEO)"
    - "Anticipated questions include recommended responses"
    - "Leave-behind materials are customer-safe (no internal-only data)"
    - "Follow-up plan has clear owners and timelines"

  output_quality:
    - "No internal pricing, discount, or margin data in customer-facing materials"
    - "No unvalidated product commitments or roadmap promises"
    - "Cross-account evidence anonymized appropriately"
    - "Messaging is concise (talking points are bullet-length, not paragraphs)"
    - "Briefing package is complete enough for Field CTO to deliver without additional research"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "8-12 minutes (agent) + 30-45 minutes (human review and rehearsal)"
frequency: "On-demand (triggered by executive engagement request)"
human_review_required: true
approval_workflow:
  - reviewer: "Field CTO"
    approval_gate: "Validate messaging accuracy, strategic framing, and competitive positioning"
  - reviewer: "AE Agent"
    approval_gate: "Confirm customer context accuracy and deal alignment"
  - reviewer: "Sales Leadership"
    condition: "audience_level IN [CEO, Board] OR deal_value > 2000000"
    approval_gate: "Approve executive engagement strategy and co-presentation approach"

blueprint_integration:
  track: "Premium"
  optional_for: ["Strategic Account", "Platform Consolidation", "Competitive Displacement"]
  trigger_signal: "executive_sponsor"

