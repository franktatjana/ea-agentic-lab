# disclaimer
# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (Competitive Intelligence,
# Voice of Field, etc.) are industry-standard
# methodologies cited for educational context.

# PLAYBOOK: Field Intelligence Aggregation
# Framework operationalization for AI agents

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_FCTO_004"
framework_name: "Field Intelligence Aggregation"
framework_source: "Competitive Intelligence Methodology / Voice of Field Programs"
intended_agent_role: "fcto-agent"
intended_sub_agent: "fcto-field-intelligence-agent"
secondary_agents:
  - "SA Agent provides deal observations"
  - "CA Agent provides customer feedback"
  - "AE Agent provides market signals"
playbook_mode: "ANALYTICAL"
playbook_category: "strategic_intelligence"

primary_objective: "Aggregate field observations from SA and CA engagement data, structure intelligence for product strategy consumption with frequency and revenue weighting, prepare evidence-backed advisory board input, and provide cross-account evidence for strategic deal positioning"

vault_routing:
  primary_vault: "Global Knowledge Vault"
  rationale: "Aggregated field intelligence is cross-account portfolio-level data. Product strategy reports, advisory board input, and aggregated demand signals are organizational assets, not account-specific."
  secondary_outputs:
    - vault: "Internal Account Hub"
      artifact: "Deal-specific support packages with cross-account evidence tailored to a specific opportunity"
    - vault: "Customer InfoHub"
      artifact: "Anonymized peer insights shared with customers during strategic engagements"

when_not_to_use:
  - "Single-account deal support without cross-account context (SA Agent handles directly)"
  - "Fewer than 10 field observations available (insufficient data for aggregation)"
  - "Real-time competitive intelligence for active deals (CI Agent's domain)"
  - "Customer-specific feedback routing (CA Agent handles directly)"
  - "Product bug tracking or support escalation (Support team's domain)"

raci:
  responsible:
    role: "FCTO Agent"
    agent: "fcto-field-intelligence-agent"
    description: "Aggregates field observations, structures intelligence for product strategy, prepares advisory board input, and packages cross-account evidence for strategic deals"

  accountable:
    role: "Field CTO"
    human_required: true
    description: "Validates intelligence accuracy, prioritizes themes for product strategy, and approves advisory board input"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted:
    - role: "SA Agent"
      on_steps: ["deal_observation_extraction", "architecture_feedback_validation", "deployment_challenge_verification"]
    - role: "CA Agent"
      on_steps: ["customer_feedback_correlation", "adoption_blocker_validation", "satisfaction_signal_verification"]
    - role: "AE Agent"
      on_steps: ["market_signal_extraction", "competitive_encounter_context", "pipeline_impact_assessment"]

  informed:
    - role: "PM Agent"
      notify_on: ["product_strategy_report_ready", "critical_product_gap_detected"]
    - role: "CI Agent"
      notify_on: ["competitive_pattern_surfaced"]
    - role: "Advisory Board"
      notify_on: ["advisory_board_input_package_ready"]
    - role: "SA Teams"
      notify_on: ["deal_support_package_available"]
    - role: "Sales Leadership"
      notify_on: ["market_signal_report_published"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Monthly field intelligence aggregation cycle (last week of month)"
    - "Product advisory board meeting approaching (4 weeks, 2 weeks before)"
    - "Product gap signal from 3+ accounts within 30-day window"
    - "Competitive pattern detected across 3+ field reports"
    - "Support case trend spike in specific product area"

  manual:
    - "Field CTO requests intelligence report for product strategy session"
    - "Strategic deal team requests cross-account evidence package"
    - "Product leadership requests field perspective for roadmap planning"

  conditional:
    - "IF product_gap_signal_count[same_theme] >= 3 THEN trigger gap aggregation"
    - "IF advisory_board_meeting_days_away <= 28 THEN trigger board prep"
    - "IF strategic_deal_support_requested THEN trigger deal support package"
    - "IF competitive_pattern_count >= 3 THEN trigger competitive aggregation"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "SA deal notes and engagement summaries across accounts"
      examples: ["Architecture review findings", "Technology stack observations", "Integration challenges", "Product feedback from POCs"]
    - artifact: "CA customer feedback and adoption data"
      examples: ["Feature adoption metrics", "Customer satisfaction signals", "Adoption blockers", "Expansion barriers"]
    - artifact: "Deal outcome records with technical factors"

  optional:
    - artifact: "AE competitive encounters and market observations"
      use: "Market signal extraction and competitive pattern detection"
    - artifact: "Support case trends by product area and severity"
      use: "Product quality and gap identification from support channel"
    - artifact: "Customer advisory board meeting notes (prior sessions)"
      use: "Continuity tracking for recurring themes"
    - artifact: "Product roadmap (for gap-to-roadmap mapping)"
      use: "Assess which field-observed gaps are already being addressed"

  minimum_data_threshold:
    - "At least 10 field observations across sources (SA, CA, AE)"
    - "Data spanning at least 3 accounts"
    - "Observations from the current or prior month"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  observation_themes:
    - "What product capabilities are customers requesting most frequently?"
    - "What deployment or integration challenges recur across accounts?"
    - "What workflow gaps do SA teams observe during architecture reviews?"
    - "What adoption blockers do CA teams identify across the customer base?"
    - "What product limitations are cited in lost deals or stalled expansions?"

  competitive_signals:
    - "Which competitors are referenced most frequently in field conversations?"
    - "What specific competitor capabilities are customers comparing against?"
    - "What competitive displacement tactics are field teams observing?"
    - "Where is {vendor} winning vs. losing in head-to-head evaluations?"

  demand_patterns:
    - "What capabilities are appearing in RFP requirements that the portfolio lacks?"
    - "Which customer segments show strongest demand for specific capabilities?"
    - "What is the revenue weight behind each demand theme (pipeline + ARR at risk)?"
    - "How does demand intensity change quarter-over-quarter for tracked themes?"
    - "Which demand signals represent expansion opportunities vs. retention risks?"

  product_strategy_input:
    - "Which field observations should influence the next roadmap cycle?"
    - "What evidence supports prioritizing one product investment over another?"
    - "What field data contradicts current product strategy assumptions?"
    - "Which customer outcomes validate recent product investments?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    # Notable observation cluster (actionable threshold)
    - condition: "observation_frequency >= 5 AND observation_frequency < 10"
      output_type: "Decision + Initiative"
      decision: |
        CREATE Decision:
          title: "Actionable field observation cluster: {theme}"
          context: "Observed in {count} field reports, revenue weight ${revenue_weight}"
          decision: "Include in monthly product strategy report, monitor for escalation"
          actions:
            - "Document theme with source observations and account references"
            - "Calculate revenue weight (pipeline + ARR impact)"
            - "Add to product strategy report with field evidence"
            - "Set monitoring threshold for escalation (10+ observations)"
          stakeholders: ["PM Agent", "Field CTO"]

        CREATE Initiative:
          title: "Product strategy input: {theme}"
          owner: "FCTO Agent"
          timeline: "Include in next monthly report"

    # Critical observation cluster (immediate routing)
    - condition: "observation_frequency >= 10 OR (observation_frequency >= 5 AND revenue_weight > 2000000)"
      severity: "HIGH"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Critical product signal: {theme}"
          severity: "HIGH"
          category: "product_strategy"
          description: "Field observation cluster ({count} reports, ${revenue_weight}) requires product strategy attention"

        CREATE Initiative:
          title: "Escalated product intelligence: {theme}"
          owner: "PM Agent + Field CTO"
          urgency: "HIGH"
          actions:
            - "Package complete evidence set with frequency, revenue weight, and competitive urgency"
            - "Schedule product strategy session with PM Agent"
            - "Prepare advisory board talking points if meeting approaching"
            - "Develop interim field positioning guidance for SA teams"
          timeline: "Route to PM Agent within 48 hours"

    # Strategic deal support request
    - condition: "strategic_deal_support_requested AND deal_value > 500000"
      output_type: "Initiative"
      decision: |
        CREATE Initiative:
          title: "Cross-account evidence package for {node} deal"
          owner: "FCTO Agent"
          actions:
            - "Identify similar deployments in customer portfolio by industry, size, and use case"
            - "Extract relevant architecture patterns and customer outcomes"
            - "Compile anonymized proof points for deal positioning"
            - "Include competitive differentiation evidence from cross-account data"
          timeline: "Deliver within 3 business days of request"

    # Advisory board preparation
    - condition: "advisory_board_meeting_approaching AND days_until_meeting <= 28"
      output_type: "Decision + Initiative"
      decision: |
        CREATE Decision:
          title: "Advisory board preparation for {meeting_date}"
          context: "Advisory board meeting in {days} days, need evidence-backed field themes"
          decision: "Prepare advisory board input package with top field themes and supporting evidence"
          actions:
            - "Rank field observation themes by frequency, revenue weight, and strategic importance"
            - "Select top 5 themes for advisory board discussion"
            - "Package each theme with evidence trail (observations, accounts, revenue impact)"
            - "Include prior advisory board action item status"
          stakeholders: ["Field CTO", "Product Leadership", "Advisory Board"]

        CREATE Initiative:
          title: "Advisory board input package preparation"
          owner: "FCTO Agent + Field CTO"
          timeline: "Complete 1 week before advisory board meeting"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/global-knowledge-vault/field_cto/intelligence/field_intelligence_{YYYY-MM-DD}.md"
    format: "markdown"
    sections:
      - executive_summary
      - observation_themes
      - product_strategy_recommendations
      - competitive_intelligence_summary
      - demand_signals
      - advisory_board_input
      - deal_support_log

    schema:
      executive_summary:
        - reporting_period: "string (e.g., March 2026)"
        - total_observations_processed: "number"
        - sources: "object {sa_reports: number, ca_reports: number, ae_reports: number, support_cases: number}"
        - top_themes: "array[string] (top 5 by frequency)"
        - critical_signals: "array[string] (requiring immediate product attention)"
        - total_revenue_weight: "number (USD)"

      observation_themes:
        - theme: "string"
          category: "enum[product_gap|deployment_challenge|adoption_blocker|competitive_signal|market_demand]"
          frequency: "number (observation count)"
          accounts_affected: "number"
          revenue_weight: "number (USD)"
          competitive_urgency: "enum[HIGH|MEDIUM|LOW]"
          trend: "enum[INCREASING|STABLE|DECREASING]"
          source_breakdown: "object {sa: number, ca: number, ae: number, support: number}"
          sample_observations: "array[string] (3-5 representative quotes or summaries)"
          roadmap_status: "enum[PLANNED|UNADDRESSED|PARTIAL|DELIVERED]"

      product_strategy_recommendations:
        - recommendation: "string"
          supporting_themes: "array[string]"
          revenue_impact: "number (USD)"
          competitive_urgency: "enum[HIGH|MEDIUM|LOW]"
          priority: "enum[CRITICAL|HIGH|MEDIUM|LOW]"

      competitive_intelligence_summary:
        - competitor: "string"
          mention_frequency: "number"
          primary_strengths_cited: "array[string]"
          displacement_risk: "enum[HIGH|MEDIUM|LOW]"
          field_counter_strategies: "array[string]"

      demand_signals:
        - capability: "string"
          demand_count: "number (accounts)"
          segment_distribution: "object {vertical: array, deal_size: array}"
          revenue_weight: "number (USD)"
          nature: "enum[EXPANSION|ACQUISITION|RETENTION]"

      advisory_board_input:
        - theme: "string"
          evidence_count: "number"
          revenue_weight: "number (USD)"
          discussion_framing: "string"
          desired_outcome: "string"
          prior_board_status: "string|null"

  decision_objects:
    path: "{realm}/global-knowledge-vault/field_cto/decisions/"
    create_if:
      - "Actionable observation cluster ready for product strategy routing"
      - "Advisory board preparation decision (theme selection)"
    template: "ADR format"

  risk_objects:
    path: "{realm}/global-knowledge-vault/field_cto/risks/"
    create_if:
      - "Critical product signal requiring immediate attention"
      - "Competitive pattern threatening portfolio position"
      - "Demand signal indicating retention risk across accounts"
    template: "Risk with mitigation plan"

  initiative_objects:
    path: "{realm}/global-knowledge-vault/field_cto/initiatives/"
    create_if:
      - "Product strategy input routing"
      - "Advisory board input package preparation"
      - "Strategic deal support package"
      - "Competitive response preparation"
    template: "Initiative with actions, owner, timeline"

  notifications:
    - recipient: "PM Agent"
      condition: "product_strategy_report_ready OR critical_signal_detected"
      message: "Field intelligence report ready: {theme_count} themes, {critical_count} critical, ${revenue_weight} weighted"

    - recipient: "CI Agent"
      condition: "competitive_pattern_detected"
      message: "Competitive pattern from field data: {competitor}, {frequency} mentions across {account_count} accounts"

    - recipient: "Advisory Board"
      condition: "advisory_board_package_ready"
      message: "Advisory board input package ready: {theme_count} themes with field evidence"

    - recipient: "SA Teams"
      condition: "deal_support_package_delivered"
      message: "Cross-account evidence package available for {node}: {evidence_points} proof points"

    - recipient: "Field CTO"
      condition: "always"
      message: "Field intelligence aggregation complete: {observations} observations, {themes} themes, {critical} critical signals"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "critical_product_gap_with_revenue_risk > 5000000"
      reason: "Product gap with significant revenue exposure requires executive product discussion"
      action: "Field CTO to schedule emergency session with Product Leadership and CRO"

    - condition: "conflicting_field_signals (SA reports positive, CA reports negative for same product area)"
      reason: "Contradictory field data requires human investigation"
      action: "Field CTO to convene SA and CA leads for signal reconciliation"

    - condition: "advisory_board_themes_politically_sensitive"
      reason: "Some field themes may be sensitive for customer advisory board discussion"
      action: "Field CTO and Product Leadership to review theme selection before board meeting"

  insufficient_data:
    - "Fewer than 10 field observations across all sources"
    - "No SA engagement reports available for the reporting period"
    - "No CA feedback data available"
    - "Revenue data unavailable for weighting calculations"

  ambiguity_signals:
    - "Observation themes overlap significantly (difficult to separate distinct signals)"
    - "Revenue weighting uncertain due to incomplete pipeline data"
    - "Field observations contradict product telemetry or usage data"

  human_judgment_required:
    - "Prioritizing themes for product strategy report (frequency vs. revenue vs. competitive urgency)"
    - "Selecting advisory board themes (balancing field evidence with strategic messaging)"
    - "Determining competitive response urgency for multi-front competitive pressure"
    - "Deciding level of detail in deal support packages (avoiding over-sharing cross-account data)"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "At least 10 field observations available from reporting period"
    - "SA, CA, and AE data sources accessible"
    - "Product roadmap available for gap-to-roadmap mapping"
    - "Prior period report available for trend comparison"

  post_execution:
    - "All themes backed by at least 3 source observations"
    - "Revenue weighting applied to all themes where pipeline/ARR data available"
    - "Competitive intelligence summary cross-referenced with CI Agent data"
    - "Product strategy recommendations include priority ranking"
    - "Advisory board input themes are evidence-backed with discussion framing"

  output_quality:
    - "No themes based on fewer than 3 observations (noise threshold)"
    - "All revenue figures cite source data (pipeline records, ARR, deal value)"
    - "Sample observations are representative, not cherry-picked"
    - "Recommendations are actionable with clear priority and owner"
    - "Competitive mentions reference specific encounters, not assumptions"
    - "Trend indicators compare to prior period data"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "8-12 minutes (agent) + 30-45 minutes (human review and prioritization)"
frequency: "Monthly (scheduled) + triggered by advisory board preparation or deal support requests"
human_review_required: true
approval_workflow:
  - reviewer: "Field CTO"
    approval_gate: "Validate theme accuracy, prioritization, and product strategy recommendations"
  - reviewer: "Product Leadership"
    condition: "critical_product_signal_detected == true"
    approval_gate: "Acknowledge critical signal and confirm response plan"
  - reviewer: "Field CTO + Product Leadership"
    condition: "advisory_board_package == true"
    approval_gate: "Approve advisory board theme selection and discussion framing"

blueprint_integration:
  track: "Standalone periodic"
  feeds_into: ["Strategic Account discovery phase"]
  trigger_signal: "field_intelligence_aggregation_due"

