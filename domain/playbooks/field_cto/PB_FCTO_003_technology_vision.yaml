# disclaimer
# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (ThoughtWorks Technology Radar,
# Gartner Hype Cycle, etc.) are industry-standard
# methodologies cited for educational context.

# PLAYBOOK: Technology Vision Assessment
# Framework operationalization for AI agents

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_FCTO_003"
framework_name: "Technology Vision Assessment"
framework_source: "ThoughtWorks Technology Radar / Gartner Hype Cycle / Portfolio Readiness Methodology"
intended_agent_role: "fcto-agent"
intended_sub_agent: "fcto-technology-vision-agent"
secondary_agents:
  - "SA Agent provides field implementation signals"
  - "Specialist Agents provide domain-specific trend data"
playbook_mode: "ANALYTICAL"
playbook_category: "strategic_intelligence"

primary_objective: "Monitor technology trends from analyst reports, open-source activity, and field signals, assess portfolio readiness for emerging patterns, and develop thought leadership content grounded in field observations"

vault_routing:
  primary_vault: "Global Knowledge Vault"
  rationale: "Technology vision assessments are cross-account strategic intelligence. Portfolio readiness evaluations inform product strategy and field positioning across the entire organization."
  secondary_outputs:
    - vault: "Internal Account Hub"
      artifact: "Account-specific technology direction narratives when vision assessment applies to a strategic deal"
    - vault: "Customer InfoHub"
      artifact: "Published thought leadership content and technology perspective pieces shared externally"

when_not_to_use:
  - "Account-specific technology assessment (SA Agent's domain)"
  - "Product feature evaluation (PM Agent's domain)"
  - "No recent analyst data or field signals available (assessment would be speculative)"
  - "Operational technology decisions for specific deployments (SA Agent handles)"
  - "Vendor product comparison for a specific deal (CI Agent's domain)"

raci:
  responsible:
    role: "FCTO Agent"
    agent: "fcto-technology-vision-agent"
    description: "Monitors technology trends, assesses portfolio readiness, and develops thought leadership content grounded in field observations and analyst research"

  accountable:
    role: "Field CTO"
    human_required: true
    description: "Validates trend assessments, approves portfolio readiness conclusions, and authorizes thought leadership publication"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted:
    - role: "SA Agent"
      on_steps: ["field_implementation_signals", "deployment_pattern_validation", "technology_adoption_evidence"]
    - role: "Specialist Agents"
      on_steps: ["domain_trend_validation", "emerging_technology_assessment"]

  informed:
    - role: "PM Agent"
      notify_on: ["portfolio_gap_identified", "technology_trend_with_product_implications"]
    - role: "SA Teams"
      notify_on: ["technology_direction_narrative_published"]
    - role: "CA Teams"
      notify_on: ["customer_facing_thought_leadership_published"]
    - role: "Marketing"
      notify_on: ["thought_leadership_content_ready"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Quarterly technology vision cycle (mid-quarter)"
    - "Major analyst report published (Gartner Magic Quadrant, Forrester Wave, ThoughtWorks Radar)"
    - "Significant open-source project release or adoption milestone"
    - "Customer demand pattern for capability not currently in portfolio (3+ accounts)"
    - "Technology trend referenced in 5+ customer conversations within 30 days"

  manual:
    - "Field CTO initiates ad-hoc technology assessment for strategic planning"
    - "Product leadership requests field perspective on technology direction"
    - "Marketing requests thought leadership content for upcoming event or campaign"

  conditional:
    - "IF analyst_report_published AND report_covers_portfolio_domain THEN trigger"
    - "IF customer_inquiry_count[technology_topic] >= 5 THEN trigger"
    - "IF open_source_adoption_shift_detected THEN trigger"
    - "IF competitor_announces_capability_in_emerging_area THEN trigger"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Analyst reports (Gartner, Forrester, IDC, ThoughtWorks Technology Radar)"
      examples: ["Magic Quadrant for relevant domain", "Forrester Wave evaluation", "Technology Radar blips"]
    - artifact: "Field implementation signals from SA engagement data"
      examples: ["Technology stack trends in customer deployments", "Architecture pattern shifts", "Emerging integration requirements"]
    - artifact: "Product roadmap (current capabilities and planned features)"

  optional:
    - artifact: "Open-source activity signals (GitHub stars, contributor growth, release velocity)"
      use: "Identify emerging technologies gaining adoption momentum"
    - artifact: "Conference and event themes from recent industry events"
      use: "Validate trend momentum and market attention"
    - artifact: "Customer inquiry and RFP requirements analysis"
      use: "Demand-side signal for emerging technology needs"
    - artifact: "Competitive capability announcements"
      use: "Competitive urgency assessment for portfolio gaps"

  minimum_data_threshold:
    - "At least 1 recent analyst report (within 6 months) for the relevant domain"
    - "Field signals from at least 5 customer engagements"
    - "Current product roadmap available for readiness assessment"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  trend_identification:
    - "What technology trends appear in 2+ analyst reports from the current cycle?"
    - "Which emerging technologies are customers asking about in field conversations?"
    - "What open-source projects are gaining adoption momentum in the portfolio's domain?"
    - "What technology patterns are shifting from experimental to production in customer environments?"
    - "Which analyst-identified trends align with observed field implementation patterns?"

  portfolio_readiness:
    - "For each identified trend, does the current portfolio address it (ready, partial, gap)?"
    - "Which trends are on the product roadmap, and what is the expected delivery timeline?"
    - "Which portfolio gaps could be addressed through partnerships or integrations?"
    - "What is the competitive positioning for each trend (leader, competitive, behind, absent)?"

  thought_leadership:
    - "Which trends can {vendor} credibly speak to based on field deployment evidence?"
    - "What unique field observations provide differentiated perspective vs. analyst content?"
    - "Which customer outcomes demonstrate practical application of emerging trends?"
    - "What contrarian or nuanced views does field evidence support vs. market hype?"

  strategic_implications:
    - "Which trends represent market expansion opportunities for the portfolio?"
    - "Which trends could commoditize existing portfolio strengths?"
    - "What technology shifts could create new competitive threats?"
    - "How should field positioning evolve based on technology direction?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    # Trend with portfolio readiness
    - condition: "trend_classification IN [Adopt, Trial] AND portfolio_readiness == READY"
      output_type: "Decision"
      decision: |
        CREATE Decision:
          title: "Portfolio aligned with {trend_name} trend"
          context: "Analyst-validated trend ({classification}) and portfolio has capability"
          decision: "Develop thought leadership content and field enablement"
          actions:
            - "Create thought leadership piece positioning {vendor} expertise"
            - "Develop SA enablement brief with customer-ready talking points"
            - "Identify customer success stories demonstrating capability"
            - "Propose conference speaking submissions on this topic"
          stakeholders: ["Marketing", "SA Teams", "Field CTO"]

    # Trend with portfolio gap
    - condition: "trend_classification IN [Adopt, Trial] AND portfolio_readiness == GAP"
      severity: "HIGH"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Portfolio gap for {trend_name} trend"
          severity: "HIGH"
          category: "strategic"
          description: "Analyst-validated trend ({classification}) but portfolio lacks capability, {competitor_count} competitors have it"

        CREATE Initiative:
          title: "Address portfolio gap for {trend_name}"
          owner: "PM Agent + Field CTO"
          urgency: "HIGH"
          actions:
            - "Route to PM Agent with field evidence and revenue impact"
            - "Assess build vs. partner vs. integrate options"
            - "Develop interim field positioning (how to address customer questions)"
            - "Monitor competitive capability in this area"
          timeline: "Assessment within 2 weeks, interim positioning within 1 week"

    # Trend on roadmap
    - condition: "trend_classification IN [Adopt, Trial] AND portfolio_readiness == ROADMAP"
      output_type: "Decision + Initiative"
      decision: |
        CREATE Decision:
          title: "Roadmap-aligned trend: {trend_name}"
          context: "Portfolio capability planned for {delivery_timeline}, trend is {classification}"
          decision: "Develop pre-launch positioning and field readiness plan"
          actions:
            - "Create pre-launch thought leadership content"
            - "Develop field readiness plan for upcoming capability"
            - "Identify beta/early-adopter customers from field pipeline"
          stakeholders: ["PM Agent", "SA Teams", "Marketing"]

        CREATE Initiative:
          title: "Field readiness preparation for {trend_name}"
          owner: "Field CTO"
          timeline: "Before capability launch"

    # Assess/Hold trend, monitor only
    - condition: "trend_classification IN [Assess, Hold]"
      output_type: "Decision"
      decision: |
        CREATE Decision:
          title: "Monitor trend: {trend_name} ({classification})"
          context: "Trend is early-stage ({classification}), not yet requiring portfolio action"
          decision: "Add to watch list, reassess next quarter"
          actions:
            - "Document trend with current evidence and analyst positioning"
            - "Set monitoring triggers (adoption milestones, analyst reclassification)"
            - "Brief field teams on trend context for customer conversations"
          stakeholders: ["Field CTO"]

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/global-knowledge-vault/field_cto/vision/technology_vision_{YYYY-MM-DD}.md"
    format: "markdown"
    sections:
      - executive_summary
      - trend_assessment
      - portfolio_readiness_matrix
      - thought_leadership_opportunities
      - technology_direction_narrative
      - recommendations

    schema:
      executive_summary:
        - assessment_period: "string (e.g., Q1 2026)"
        - trends_assessed: "number"
        - portfolio_ready: "number"
        - portfolio_gaps: "number"
        - roadmap_aligned: "number"
        - critical_actions: "array[string]"

      trend_assessment:
        - trend_name: "string"
          classification: "enum[Adopt|Trial|Assess|Hold]"
          source: "array[string] (analyst reports, field signals, open-source data)"
          description: "string"
          field_evidence: "string (observed in X customer environments)"
          customer_demand_signal: "number (accounts asking about this)"
          competitive_landscape: "string (who offers this capability)"
          momentum: "enum[ACCELERATING|STABLE|DECELERATING]"

      portfolio_readiness_matrix:
        - trend_name: "string"
          readiness: "enum[READY|PARTIAL|GAP|ROADMAP|PARTNER]"
          current_capability: "string|null"
          roadmap_timeline: "string|null"
          partner_option: "string|null"
          competitive_positioning: "enum[LEADER|COMPETITIVE|BEHIND|ABSENT]"
          action_required: "string"

      thought_leadership_opportunities:
        - topic: "string"
          angle: "string (unique perspective based on field evidence)"
          target_audience: "string"
          format: "enum[blog|whitepaper|conference_talk|webinar|customer_briefing]"
          field_evidence_available: "boolean"
          priority: "enum[HIGH|MEDIUM|LOW]"

      technology_direction_narrative:
        - time_horizon: "string (e.g., 6 months, 12 months, 24 months)"
          key_themes: "array[string]"
          portfolio_positioning: "string"
          market_context: "string"

  decision_objects:
    path: "{realm}/global-knowledge-vault/field_cto/decisions/"
    create_if:
      - "Portfolio aligned with validated trend (thought leadership opportunity)"
      - "Trend requires monitoring (watch list addition)"
      - "Roadmap-aligned trend (pre-launch positioning)"
    template: "ADR format"

  risk_objects:
    path: "{realm}/global-knowledge-vault/field_cto/risks/"
    create_if:
      - "Portfolio gap for analyst-validated trend"
      - "Competitor capability in emerging area without portfolio response"
      - "Technology shift threatening existing portfolio strength"
    template: "Risk with mitigation plan"

  initiative_objects:
    path: "{realm}/global-knowledge-vault/field_cto/initiatives/"
    create_if:
      - "Portfolio gap requiring build/partner/integrate assessment"
      - "Field readiness preparation for roadmap capability"
      - "Thought leadership content development"
    template: "Initiative with actions, owner, timeline"

  notifications:
    - recipient: "PM Agent"
      condition: "portfolio_gap_detected AND trend_classification IN [Adopt, Trial]"
      message: "Portfolio gap for validated trend: {trend_name}, {customer_demand_count} accounts asking"

    - recipient: "SA Teams"
      condition: "technology_direction_published"
      message: "Technology direction narrative updated: {key_themes}"

    - recipient: "Marketing"
      condition: "thought_leadership_content_ready"
      message: "Thought leadership opportunity: {topic}, field evidence available"

    - recipient: "Field CTO"
      condition: "always"
      message: "Technology vision assessment complete: {trends_assessed} trends, {gaps} gaps, {ready} ready"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "portfolio_gap_for_adopt_trend AND competitive_urgency == HIGH"
      reason: "Strategic portfolio gap with competitive pressure requires executive product discussion"
      action: "Field CTO to schedule session with Product Leadership and CTO"

    - condition: "technology_shift_threatens_core_portfolio"
      reason: "Fundamental technology shift could commoditize existing strengths"
      action: "Field CTO to initiate strategic review with executive leadership"

    - condition: "conflicting_analyst_assessments (Gartner says Adopt, Forrester says Hold)"
      reason: "Analyst disagreement requires human judgment on trend maturity"
      action: "Field CTO to assess based on field evidence and make directional call"

  insufficient_data:
    - "No analyst reports available for the relevant domain within 6 months"
    - "Fewer than 5 field engagement data points for trend validation"
    - "Product roadmap unavailable for readiness assessment"
    - "No competitive capability data for positioning analysis"

  ambiguity_signals:
    - "Trend appears in analyst reports but no field demand signal"
    - "Field demand signal exists but no analyst validation"
    - "Open-source momentum does not match enterprise adoption pattern"

  human_judgment_required:
    - "Assessing trend maturity when analyst and field signals diverge"
    - "Prioritizing portfolio gaps (which gaps matter most for competitive positioning)"
    - "Deciding thought leadership angle (contrarian vs. aligned with analyst narrative)"
    - "Determining appropriate roadmap disclosure level in thought leadership content"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "At least 1 recent analyst report available"
    - "Field engagement data accessible for trend validation"
    - "Product roadmap reference available"

  post_execution:
    - "Every trend assessment cites at least 1 analyst source and 1 field signal"
    - "Portfolio readiness matrix covers all identified trends"
    - "Thought leadership opportunities are grounded in field evidence"
    - "Technology direction narrative is time-bounded (specific horizons)"
    - "Recommendations have clear owners and timelines"

  output_quality:
    - "No trend assessments based solely on hype (must have field validation or analyst rigor)"
    - "Portfolio readiness classifications are evidence-based, not aspirational"
    - "Thought leadership angles are differentiated from analyst reports"
    - "Technology narrative avoids product commitments or unannounced roadmap details"
    - "All competitive positioning claims are current and verifiable"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "10-15 minutes (agent) + 45-60 minutes (human review and narrative refinement)"
frequency: "Quarterly (scheduled) + triggered by major analyst publications or market shifts"
human_review_required: true
approval_workflow:
  - reviewer: "Field CTO"
    approval_gate: "Validate trend assessments, portfolio readiness conclusions, and thought leadership angles"
  - reviewer: "Product Leadership"
    condition: "portfolio_gap_critical == true"
    approval_gate: "Acknowledge portfolio gap and confirm roadmap response"
  - reviewer: "Marketing"
    condition: "thought_leadership_content_ready == true"
    approval_gate: "Review thought leadership content for publication readiness"

blueprint_integration:
  track: "Premium"
  optional_for: ["Strategic Account", "Platform Consolidation"]
  trigger_signal: "technology_direction_driver"

