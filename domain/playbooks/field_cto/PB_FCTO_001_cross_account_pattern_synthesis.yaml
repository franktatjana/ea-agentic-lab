# disclaimer
# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (ThoughtWorks Technology Radar,
# etc.) are industry-standard methodologies cited for
# educational context.

# PLAYBOOK: Cross-Account Pattern Synthesis
# Framework operationalization for AI agents

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_FCTO_001"
framework_name: "Cross-Account Pattern Synthesis"
framework_source: "Enterprise Architecture Pattern Analysis / ThoughtWorks Technology Radar Methodology"
intended_agent_role: "fcto-agent"
intended_sub_agent: "fcto-pattern-synthesis-agent"
secondary_agents:
  - "SA Agent provides deal-level architecture data"
  - "CA Agent provides adoption patterns"
  - "CI Agent validates competitive displacement patterns"
playbook_mode: "ANALYTICAL"
playbook_category: "strategic_intelligence"

primary_objective: "Synthesize technical patterns across customer portfolio to surface cross-account themes, competitive displacement strategies, win/loss patterns, and product gap clusters with revenue weighting"

vault_routing:
  primary_vault: "Global Knowledge Vault"
  rationale: "Cross-account patterns are portfolio-level intelligence, not account-specific. Patterns inform product strategy, field enablement, and competitive positioning across the entire customer base."
  secondary_outputs:
    - vault: "Internal Account Hub"
      artifact: "Account-specific pattern evidence packages when a pattern applies to a specific deal"
    - vault: "Customer InfoHub"
      artifact: "Anonymized peer benchmarks shared with customers showing industry adoption patterns"

when_not_to_use:
  - "Single-account technical analysis (SA Agent's domain, use PB_SA playbooks)"
  - "Fewer than 3 accounts with comparable data (insufficient sample for pattern detection)"
  - "Real-time deal support without prior pattern baseline (use PB_FCTO_004 field intelligence instead)"
  - "Product roadmap decisions (PM Agent's domain, FCTO provides input only)"
  - "Customer-facing technical recommendations (SA Agent delivers, FCTO provides cross-account evidence)"

raci:
  responsible:
    role: "FCTO Agent"
    agent: "fcto-pattern-synthesis-agent"
    description: "Synthesizes technical patterns across customer portfolio, identifies cross-account themes, and produces pattern reports with frequency and revenue weighting"

  accountable:
    role: "Field CTO"
    human_required: true
    description: "Validates pattern significance, approves strategic conclusions, and authorizes distribution of pattern reports to product and field teams"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted:
    - role: "SA Agent"
      on_steps: ["architecture_pattern_extraction", "deal_level_evidence", "technical_validation"]
    - role: "CA Agent"
      on_steps: ["adoption_pattern_correlation", "usage_trend_validation"]
    - role: "CI Agent"
      on_steps: ["competitive_displacement_validation", "win_loss_pattern_verification"]

  informed:
    - role: "PM Agent"
      notify_on: ["product_gap_cluster_report_ready"]
    - role: "SA Teams"
      notify_on: ["new_pattern_report_published"]
    - role: "CA Teams"
      notify_on: ["adoption_pattern_report_published"]
    - role: "Sales Leadership"
      notify_on: ["competitive_displacement_playbook_updated"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Quarterly pattern synthesis cycle (end of quarter)"
    - "3+ accounts exhibit similar architecture pattern within 30-day window"
    - "Competitive displacement detected across 2+ accounts with same competitor"
    - "Product gap signal frequency crosses actionable threshold (5+ accounts)"
    - "Win rate shift >10% in a vertical or horizontal segment"

  manual:
    - "Field CTO requests ad-hoc pattern analysis for strategic initiative"
    - "Product leadership requests field evidence for roadmap planning"
    - "Sales leadership requests competitive displacement playbook update"

  conditional:
    - "IF similar_architecture_pattern_count >= 3 THEN trigger pattern detection"
    - "IF competitive_encounter_count[same_competitor] >= 2 THEN trigger displacement analysis"
    - "IF product_gap_signal_count[same_theme] >= 5 THEN trigger gap clustering"
    - "IF win_rate_change[segment] > 0.10 THEN trigger win theme analysis"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "SA engagement data across accounts (architecture reviews, deal notes)"
      examples: ["Architecture decision records", "Technology stack assessments", "Integration patterns documented"]
    - artifact: "Deal outcome data (wins, losses, no-decisions)"
      examples: ["Win/loss records with technical factors", "Competitive encounter reports", "Deal stage progression data"]
    - artifact: "Product roadmap (current capabilities and planned features)"

  optional:
    - artifact: "CA adoption reports across accounts"
      use: "Correlate adoption patterns with architecture decisions"
    - artifact: "Competitive intelligence reports"
      use: "Validate displacement patterns against CI Agent analysis"
    - artifact: "Support case trends by product area"
      use: "Identify product gaps surfacing through support channels"
    - artifact: "Customer advisory board feedback"
      use: "Cross-reference field patterns with direct customer input"

  minimum_data_threshold:
    - "At least 3 accounts with comparable engagement data for pattern detection"
    - "At least 10 data points (engagements, deals, reviews) across the portfolio"
    - "Data from at least 2 verticals or segments for cross-cutting analysis"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  architecture_patterns:
    - "What technology stack combinations appear in 3+ customer environments?"
    - "Which integration patterns recur across accounts (API-first, event-driven, batch)?"
    - "What migration paths do customers follow most frequently (on-prem to cloud, multi-cloud, hybrid)?"
    - "Which architectural anti-patterns cause repeated deal friction or deployment failures?"
    - "What infrastructure patterns correlate with successful deployments vs. troubled ones?"

  competitive_displacement:
    - "Which competitors appear most frequently in displacement scenarios?"
    - "What technical differentiators drive displacement decisions in the customer's favor?"
    - "What are the common technical objections raised against {vendor} in competitive situations?"
    - "Which customer segments are most susceptible to competitive displacement (inbound or outbound)?"
    - "What proof points or reference architectures accelerate displacement wins?"

  win_loss_patterns:
    - "What technical factors appear in 50%+ of won deals?"
    - "What technical gaps or missing capabilities appear in 50%+ of lost deals?"
    - "How does win rate vary by vertical, deal size, and competitive presence?"
    - "What role does executive engagement play in win rate for strategic deals?"

  product_gap_signals:
    - "Which feature requests appear across 5+ accounts (frequency threshold)?"
    - "What is the total revenue weight behind each product gap cluster?"
    - "Which gaps block expansion vs. block new acquisition?"
    - "How do product gaps map to competitive strengths of key rivals?"
    - "Which gaps are on the roadmap vs. unaddressed?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    # Emerging pattern detected
    - condition: "pattern_frequency >= 3 AND pattern_frequency < 5"
      output_type: "Decision"
      decision: |
        CREATE Decision:
          title: "Emerging pattern detected: {pattern_name}"
          context: "Pattern observed in {count} accounts, frequency below established threshold"
          decision: "Monitor and document, add to quarterly pattern report as emerging"
          actions:
            - "Document pattern with evidence from each account"
            - "Add to pattern watch list for next quarter"
            - "Alert SA teams to watch for additional instances"
          stakeholders: ["SA Teams", "Field CTO"]

    # Established pattern requiring action
    - condition: "pattern_frequency >= 5 AND revenue_weight > 500000"
      output_type: "Decision + Initiative"
      decision: |
        CREATE Decision:
          title: "Established pattern with revenue significance: {pattern_name}"
          context: "Pattern observed in {count} accounts with ${revenue_weight} aggregate pipeline/ARR impact"
          decision: "Publish pattern report, create field enablement, route to product strategy"
          actions:
            - "Publish pattern report to Global Knowledge Vault"
            - "Create field enablement brief for SA and AE teams"
            - "Route product gap cluster to PM Agent with revenue weighting"
            - "Update competitive displacement playbook if competitive pattern"
          stakeholders: ["PM Agent", "SA Teams", "Sales Leadership"]

        CREATE Initiative:
          title: "Field enablement for {pattern_name}"
          owner: "Field CTO"
          timeline: "Within 2 weeks of pattern confirmation"

    # Competitive displacement pattern
    - condition: "competitive_displacement_detected AND accounts_affected >= 2"
      severity: "HIGH"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Competitive displacement pattern: {competitor} across {count} accounts"
          severity: "HIGH"
          category: "competitive"
          description: "Competitor {competitor} displacing {vendor} using {displacement_tactic} in {count} accounts"

        CREATE Initiative:
          title: "Competitive response playbook for {competitor} displacement"
          owner: "Field CTO + CI Agent"
          urgency: "HIGH"
          actions:
            - "Analyze displacement tactics and technical differentiation gaps"
            - "Develop counter-positioning framework with proof points"
            - "Create technical battle card for SA teams"
            - "Identify at-risk accounts and prioritize defensive engagement"
            - "Route competitive gap to PM Agent for product response assessment"

    # Product gap cluster with revenue impact
    - condition: "gap_cluster_accounts >= 5 AND total_revenue_weight > 1000000"
      output_type: "Initiative"
      decision: |
        CREATE Initiative:
          title: "Product gap cluster: {gap_theme} (${revenue_weight} revenue impact)"
          owner: "PM Agent"
          actions:
            - "Package gap cluster with evidence from {count} accounts"
            - "Include revenue weighting and competitive urgency multiplier"
            - "Prepare advisory board input package with customer evidence"
            - "Track against product roadmap for closure timeline"
          timeline: "Route to PM Agent within 1 week"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/global-knowledge-vault/field_cto/patterns/pattern_synthesis_{YYYY-MM-DD}.md"
    format: "markdown"
    sections:
      - executive_summary
      - pattern_inventory
      - competitive_displacement_analysis
      - win_theme_analysis
      - product_gap_clusters
      - recommendations
      - appendix_evidence

    schema:
      executive_summary:
        - total_patterns_detected: "number"
        - new_patterns_this_period: "number"
        - established_patterns: "number"
        - total_revenue_weight: "number (USD)"
        - top_competitive_threats: "array[string]"
        - critical_product_gaps: "array[string]"

      pattern_inventory:
        - pattern_name: "string"
          category: "enum[architecture|integration|migration|deployment|competitive]"
          frequency: "number (account count)"
          status: "enum[EMERGING|ESTABLISHED|DECLINING]"
          revenue_weight: "number (USD)"
          accounts: "array[string] (anonymized account references)"
          evidence_summary: "string"

      competitive_displacement_analysis:
        - competitor: "string"
          displacement_direction: "enum[INBOUND|OUTBOUND]"
          accounts_affected: "number"
          primary_tactic: "string"
          counter_strategy: "string"
          win_rate: "number (percentage)"

      win_theme_analysis:
        - theme: "string"
          win_correlation: "number (percentage)"
          verticals: "array[string]"
          deal_size_range: "string"
          supporting_evidence: "array[string]"

      product_gap_clusters:
        - gap_theme: "string"
          accounts_requesting: "number"
          revenue_weight: "number (USD)"
          competitive_urgency: "enum[HIGH|MEDIUM|LOW]"
          roadmap_status: "enum[PLANNED|UNADDRESSED|PARTIAL]"
          pm_routing_status: "enum[ROUTED|PENDING|ACKNOWLEDGED]"

  decision_objects:
    path: "{realm}/global-knowledge-vault/field_cto/decisions/"
    create_if:
      - "Emerging pattern detected (3-4 accounts)"
      - "Established pattern with revenue significance"
    template: "ADR format"

  risk_objects:
    path: "{realm}/global-knowledge-vault/field_cto/risks/"
    create_if:
      - "Competitive displacement pattern across 2+ accounts"
      - "Critical product gap blocking deals in 5+ accounts"
      - "Win rate decline in key segment"
    template: "Risk with mitigation plan"

  initiative_objects:
    path: "{realm}/global-knowledge-vault/field_cto/initiatives/"
    create_if:
      - "Field enablement needed for established pattern"
      - "Competitive response playbook needed"
      - "Product gap cluster ready for PM routing"
    template: "Initiative with actions, owner, timeline"

  notifications:
    - recipient: "PM Agent"
      condition: "product_gap_cluster_ready"
      message: "Product gap cluster ready: {gap_theme}, {count} accounts, ${revenue_weight} revenue impact"

    - recipient: "SA Teams"
      condition: "new_pattern_published"
      message: "New cross-account pattern published: {pattern_name} ({frequency} accounts)"

    - recipient: "Sales Leadership"
      condition: "competitive_displacement_detected"
      message: "Competitive displacement alert: {competitor} active across {count} accounts"

    - recipient: "Field CTO"
      condition: "always"
      message: "Pattern synthesis complete: {total_patterns} patterns, {new_patterns} new, ${total_revenue_weight} weighted"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "conflicting_patterns (same accounts show contradictory signals)"
      reason: "Human judgment needed to determine which pattern is primary"
      action: "Field CTO to review conflicting evidence and determine pattern priority"

    - condition: "competitive_displacement_critical (3+ strategic accounts at risk)"
      reason: "Strategic response requires executive-level coordination"
      action: "Escalate to Sales Leadership and Field CTO for competitive war room"

    - condition: "product_gap_revenue_weight > 5000000"
      reason: "Gap cluster with significant revenue impact requires executive product discussion"
      action: "Field CTO to schedule executive session with Product Leadership"

  insufficient_data:
    - "Fewer than 3 accounts with comparable engagement data"
    - "No SA engagement reports available for the analysis period"
    - "Deal outcome data missing (no win/loss records)"
    - "No competitive encounter data available"

  ambiguity_signals:
    - "Pattern appears in fewer than 3 accounts (could be coincidence, not trend)"
    - "Revenue weighting unavailable for majority of accounts in pattern"
    - "Conflicting signals between SA and CA data for same accounts"

  human_judgment_required:
    - "Determining pattern significance (emerging vs. noise)"
    - "Prioritizing competitive response urgency across multiple threats"
    - "Deciding which product gaps to escalate vs. defer"
    - "Weighing strategic vs. revenue impact for pattern prioritization"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "At least 3 accounts with engagement data available"
    - "SA engagement data covers the analysis time period"
    - "Deal outcome records accessible"
    - "Product roadmap reference available for gap analysis"

  post_execution:
    - "Every pattern has at least 3 account evidence points"
    - "Revenue weighting applied to all patterns where data available"
    - "Competitive displacement analysis includes counter-strategy"
    - "Product gap clusters mapped against current roadmap"
    - "Win themes supported by win/loss data"

  output_quality:
    - "No patterns based on single-account observations"
    - "All revenue figures cite source data (pipeline, ARR, deal value)"
    - "Competitive analysis references specific encounters, not assumptions"
    - "Gap clusters include both frequency count and revenue weight"
    - "Recommendations are actionable with clear owner and timeline"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "10-15 minutes (agent) + 60-90 minutes (human review and validation)"
frequency: "Quarterly (scheduled) + triggered by threshold conditions"
human_review_required: true
approval_workflow:
  - reviewer: "Field CTO"
    approval_gate: "Validate pattern significance, competitive conclusions, and product gap prioritization"
  - reviewer: "Sales Leadership"
    condition: "competitive_displacement_critical == true"
    approval_gate: "Approve competitive response strategy and resource allocation"
  - reviewer: "Product Leadership"
    condition: "product_gap_revenue_weight > 2000000"
    approval_gate: "Acknowledge product gap cluster and confirm roadmap alignment"

blueprint_integration:
  track: "Premium"
  optional_for: ["Strategic Account", "Platform Consolidation"]
  trigger_signal: "cross_account_evidence_needed"

