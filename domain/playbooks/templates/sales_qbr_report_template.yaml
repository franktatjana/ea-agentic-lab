# Sales QBR Report Template
# Purpose: Standardized format for internal sales quarterly business review
# Owner: AE Agent
# Frequency: Quarterly (with mid-quarter triggers if needed)

# ============================================================================
# METADATA
# ============================================================================
metadata:
  report_id: "SQBR-{YYYY}-Q{N}"
  quarter: "{YYYY}-Q{N}"
  created_date: "{date}"
  author: "{author_name}"
  status: "DRAFT|IN_REVIEW|FINAL"
  playbook_source: "PB_AE_603"

# ============================================================================
# EXECUTIVE SUMMARY
# ============================================================================
executive_summary:
  revenue_target: "{amount}"
  revenue_actual: "{amount}"
  attainment_percentage: "{percentage}"
  pipeline_coverage: "{ratio}x"
  overall_status: "RED|YELLOW|GREEN"

  key_wins:
    - "{deal_name}: ${amount} ARR"

  key_risks:
    - "{risk_description}"

  quarter_headline: |
    {1-2 sentence summary of quarter performance}

# ============================================================================
# REVENUE PERFORMANCE
# ============================================================================
revenue_performance:
  current_quarter:
    new_business: "{amount}"
    expansion: "{amount}"
    renewal: "{amount}"
    churned: "{amount}"
    net_revenue: "{amount}"

  vs_target:
    target: "{amount}"
    actual: "{amount}"
    variance: "{amount}"
    attainment: "{percentage}"

  vs_prior_quarter:
    prior_quarter_revenue: "{amount}"
    change: "{amount}"
    change_percentage: "{percentage}"
    trend: "GROWING|FLAT|DECLINING"

  notable_deals:
    wins:
      - account: "{account_name}"
        arr: "{amount}"
        type: "NEW|EXPANSION|RENEWAL"
        notes: "{what made this notable}"
    losses:
      - account: "{account_name}"
        arr: "{amount}"
        lost_to: "{competitor or NO_DECISION}"
        root_cause: "{primary reason}"

# ============================================================================
# PIPELINE ANALYSIS
# ============================================================================
pipeline_analysis:
  snapshot_date: "{date}"

  coverage:
    remaining_target: "{amount}"
    total_pipeline: "{amount}"
    coverage_ratio: "{ratio}x"
    status: "RED|YELLOW|GREEN"

  stage_distribution:
    - stage: "Stage 1 - Discovery"
      count: "{number}"
      value: "{amount}"
    - stage: "Stage 2 - Qualification"
      count: "{number}"
      value: "{amount}"
    - stage: "Stage 3 - Technical Validation"
      count: "{number}"
      value: "{amount}"
    - stage: "Stage 4 - Proposal"
      count: "{number}"
      value: "{amount}"
    - stage: "Stage 5 - Negotiation"
      count: "{number}"
      value: "{amount}"

  velocity:
    average_deal_size: "{amount}"
    average_cycle_time_days: "{number}"
    win_rate: "{percentage}"
    pipeline_velocity: "{amount}/quarter"

  pipeline_movement:
    created_this_quarter: "{amount}"
    advanced_stage: "{amount}"
    slipped: "{amount}"
    lost: "{amount}"

# ============================================================================
# DEAL QUALITY REVIEW
# ============================================================================
deal_quality:
  commit_deals:
    - deal: "{opportunity_name}"
      account: "{account_name}"
      arr: "{amount}"
      close_date: "{date}"
      meddpicc_score: "{score}/24"
      risk_flags: ["{flag}"]

  upside_deals:
    - deal: "{opportunity_name}"
      account: "{account_name}"
      arr: "{amount}"
      close_date: "{date}"
      meddpicc_score: "{score}/24"
      path_to_commit: "{what needs to happen}"

  stalled_deals:
    - deal: "{opportunity_name}"
      account: "{account_name}"
      arr: "{amount}"
      days_in_current_stage: "{number}"
      blocker: "{primary blocker}"
      recommended_action: "{next step}"

  quality_metrics:
    average_meddpicc_score: "{score}"
    single_threaded_deals: "{count}"
    deals_slipped_close_date: "{count}"

# ============================================================================
# FORECAST ACCURACY
# ============================================================================
forecast_accuracy:
  quarter_result:
    forecast_at_start: "{amount}"
    forecast_at_midpoint: "{amount}"
    actual_result: "{amount}"
    accuracy_percentage: "{percentage}"

  category_analysis:
    commit:
      forecast: "{amount}"
      actual: "{amount}"
      accuracy: "{percentage}"
    upside:
      forecast: "{amount}"
      converted: "{amount}"
      conversion_rate: "{percentage}"
    pipeline:
      forecast: "{amount}"
      converted: "{amount}"
      conversion_rate: "{percentage}"

  surprises:
    positive:
      - deal: "{deal_name}"
        expected: "{amount or outcome}"
        actual: "{amount or outcome}"
    negative:
      - deal: "{deal_name}"
        expected: "{amount or outcome}"
        actual: "{amount or outcome}"

# ============================================================================
# COMPETITIVE LANDSCAPE
# ============================================================================
competitive_landscape:
  competitors_encountered:
    - competitor: "{competitor_name}"
      deals_competed: "{count}"
      wins: "{count}"
      losses: "{count}"
      win_rate: "{percentage}"

  loss_patterns:
    - pattern: "{description of recurring loss theme}"
      frequency: "{count} deals"
      recommended_response: "{action}"

  emerging_threats:
    - threat: "{competitor or market shift}"
      signal: "{how detected}"
      impact: "HIGH|MEDIUM|LOW"

# ============================================================================
# ACCOUNT HEALTH OVERVIEW
# ============================================================================
account_health:
  summary:
    total_accounts: "{number}"
    healthy: "{number} (score >= 80)"
    at_risk: "{number} (score 50-79)"
    critical: "{number} (score < 50)"

  at_risk_accounts:
    - account: "{account_name}"
      health_score: "{score}"
      trend: "IMPROVING|STABLE|DECLINING"
      primary_concern: "{description}"
      intervention: "{planned action}"

  expansion_candidates:
    - account: "{account_name}"
      current_arr: "{amount}"
      expansion_potential: "{amount}"
      readiness: "HIGH|MEDIUM|LOW"
      next_step: "{action}"

# ============================================================================
# NEXT QUARTER PRIORITIES
# ============================================================================
next_quarter_priorities:
  - priority: "{description}"
    owner: "{name/role}"
    target_metric: "{what success looks like}"
    deadline: "{date}"
    status: "NOT_STARTED|IN_PROGRESS"

# ============================================================================
# ACTION ITEMS
# ============================================================================
action_items:
  - action: "{specific action}"
    owner: "{name/role}"
    due_date: "{date}"
    priority: "HIGH|MEDIUM|LOW"
    linked_to: "{priority or risk it addresses}"

# ============================================================================
# REVIEW SIGN-OFF
# ============================================================================
sign_off:
  reviewed_by:
    - name: "{reviewer}"
      role: "{role}"
      date: "{date}"
      status: "APPROVED|COMMENTS"
