# Customer QBR Report Template
# Purpose: Standardized format for customer-facing quarterly business review
# Owner: CA Agent
# Frequency: Per engagement track (monthly/quarterly/semi-annual)

# ============================================================================
# METADATA
# ============================================================================
metadata:
  report_id: "CQBR-{YYYY}-Q{N}-{account_id}"
  quarter: "{YYYY}-Q{N}"
  account_name: "{account_name}"
  node: "{node_name}"
  created_date: "{date}"
  qbr_date: "{date}"
  author: "{author_name}"
  status: "DRAFT|INTERNAL_REVIEW|PRESENTED|FINAL"
  playbook_source: "PB_CA_001"
  engagement_track: "ECONOMY|PREMIUM|FAST_TRACK"

# ============================================================================
# ATTENDEES
# ============================================================================
attendees:
  internal:
    - name: "{name}"
      role: "{role}"
      responsibility: "PRESENTER|CO-PRESENTER|OBSERVER"
  customer:
    - name: "{name}"
      title: "{title}"
      role: "EXECUTIVE_SPONSOR|BUSINESS_OWNER|TECHNICAL_LEAD|CHAMPION"

# ============================================================================
# EXECUTIVE SUMMARY
# ============================================================================
executive_summary:
  health_score: "{score}"
  health_trend: "IMPROVING|STABLE|DECLINING"
  adoption_percentage: "{percentage}"
  overall_sentiment: "POSITIVE|NEUTRAL|CONCERNED"

  key_achievements:
    - "{achievement description}"

  key_concerns:
    - "{concern description}"

  quarter_headline: |
    {1-2 sentence summary of account status and QBR outcome}

# ============================================================================
# ADOPTION PROGRESS
# ============================================================================
adoption_progress:
  overall_adoption: "{percentage}"
  active_users: "{count}"
  usage_trend: "GROWING|STABLE|DECLINING"

  use_cases:
    - use_case: "{use case name}"
      status: "FULLY_ADOPTED|PARTIALLY_ADOPTED|NOT_STARTED|BLOCKED"
      adoption_percentage: "{percentage}"
      target_date: "{date}"
      blockers: ["{blocker if any}"]
      next_steps: ["{action}"]

  usage_highlights:
    - metric: "{usage metric name}"
      current: "{value}"
      prior_quarter: "{value}"
      trend: "UP|FLAT|DOWN"

  adoption_blockers:
    - blocker: "{description}"
      impact: "HIGH|MEDIUM|LOW"
      owner: "VENDOR|CUSTOMER|JOINT"
      mitigation: "{planned action}"

# ============================================================================
# VALUE DELIVERED
# ============================================================================
value_delivered:
  value_vs_business_case: "EXCEEDING|ON_TRACK|BEHIND|NOT_MEASURED"

  outcomes_achieved:
    - outcome: "{measurable outcome}"
      metric: "{metric name}"
      baseline: "{before value}"
      current: "{current value}"
      improvement: "{percentage or amount}"
      evidence: "{source of measurement}"

  roi_summary:
    investment: "{total investment amount}"
    value_realized: "{total value delivered}"
    roi_percentage: "{percentage}"
    payback_status: "ACHIEVED|ON_TRACK|BEHIND"

  value_stories:
    - title: "{short title}"
      description: |
        {2-3 sentences describing the value story}
      quotable: "YES|NO"

# ============================================================================
# SUCCESS PLAN STATUS
# ============================================================================
success_plan_status:
  plan_health: "ON_TRACK|AT_RISK|OFF_TRACK"
  last_updated: "{date}"

  milestones_completed:
    - milestone: "{milestone name}"
      completed_date: "{date}"
      outcome: "{what was achieved}"

  milestones_in_progress:
    - milestone: "{milestone name}"
      target_date: "{date}"
      progress_percentage: "{percentage}"
      on_track: "YES|AT_RISK|NO"
      notes: "{status update}"

  milestones_deferred:
    - milestone: "{milestone name}"
      original_date: "{date}"
      new_date: "{date}"
      reason: "{why deferred}"

  new_milestones_proposed:
    - milestone: "{milestone name}"
      target_date: "{date}"
      rationale: "{why this matters now}"
      agreed: "YES|PENDING|NO"

# ============================================================================
# CHALLENGES AND MITIGATIONS
# ============================================================================
challenges:
  - challenge: "{description}"
    impact: "HIGH|MEDIUM|LOW"
    category: "TECHNICAL|ADOPTION|RESOURCE|ORGANIZATIONAL|COMMERCIAL"
    mitigation: "{proposed or in-progress action}"
    owner: "VENDOR|CUSTOMER|JOINT"
    status: "OPEN|IN_PROGRESS|RESOLVED"
    target_resolution: "{date}"

# ============================================================================
# SUPPORT SUMMARY
# ============================================================================
support_summary:
  cases_opened: "{count}"
  cases_resolved: "{count}"
  average_resolution_time: "{hours/days}"
  critical_cases: "{count}"
  satisfaction_rating: "{score or rating}"

  notable_cases:
    - case_id: "{id}"
      summary: "{brief description}"
      status: "OPEN|RESOLVED"
      impact: "{impact on customer}"

# ============================================================================
# FORWARD PLAN
# ============================================================================
forward_plan:
  next_quarter_objectives:
    - objective: "{description}"
      success_criteria: "{how we measure success}"
      owner: "VENDOR|CUSTOMER|JOINT"

  product_roadmap_alignment:
    - feature: "{feature or capability}"
      relevance: "{why it matters to this customer}"
      expected_availability: "{timeline}"

  training_and_enablement:
    - topic: "{training topic}"
      audience: "{who needs it}"
      format: "WORKSHOP|WEBINAR|SELF_PACED|ON_SITE"
      proposed_date: "{date}"

  expansion_discussion:
    discussed: "YES|NO|DEFERRED"
    summary: |
      {Brief summary of expansion conversation if applicable}
    next_steps: ["{action}"]

# ============================================================================
# PRIOR QBR ACTION ITEMS
# ============================================================================
prior_action_items:
  - action: "{action from prior QBR}"
    owner: "{name/role}"
    due_date: "{date}"
    status: "COMPLETED|IN_PROGRESS|NOT_STARTED|CANCELLED"
    notes: "{completion details or reason for delay}"

# ============================================================================
# NEW ACTION ITEMS
# ============================================================================
action_items:
  - action: "{specific action}"
    owner: "{name/role (vendor or customer)}"
    due_date: "{date}"
    priority: "HIGH|MEDIUM|LOW"

# ============================================================================
# NEXT QBR
# ============================================================================
next_qbr:
  proposed_date: "{date}"
  confirmed: "YES|PENDING"
  focus_areas: ["{topic}"]

# ============================================================================
# INTERNAL NOTES (not shared with customer)
# ============================================================================
internal_notes:
  customer_sentiment: |
    {Honest assessment of customer mood and engagement}
  expansion_readiness: "HIGH|MEDIUM|LOW|NOT_READY"
  renewal_risk: "HIGH|MEDIUM|LOW"
  competitive_signals: |
    {Any competitive activity detected}
  follow_up_urgency: "IMMEDIATE|STANDARD|LOW"

# ============================================================================
# REVIEW SIGN-OFF
# ============================================================================
sign_off:
  internal_review:
    - name: "{reviewer}"
      role: "{CA|AE|SA}"
      date: "{date}"
      status: "APPROVED|COMMENTS"
  customer_acknowledged:
    date: "{date}"
    method: "EMAIL|MEETING|PORTAL"
