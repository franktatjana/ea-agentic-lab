# OPERATIONAL PLAYBOOK: Process Technology Scout Update
# Triggered when tech radar is updated (SIG_TECH_001)

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "OP_TECH_001"
playbook_name: "Process Technology Scout Update"
playbook_mode: "OPERATIONAL"
playbook_category: "system_governance"
status: "active"
intended_agent_role: "tech-signal-analyzer-agent"
notes: "Keeps technology intelligence current by routing tech radar changes to affected engagements"
category: "tech_intelligence"

metadata:
  name: "Process Technology Scout Update"
  description: "Process tech radar updates, identify actionable insights, and route to appropriate agents"
  owner_agent: "tech_signal_analyzer_agent"
  intended_agent_role: "tech-signal-analyzer-agent"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Operational playbooks create and update internal governance objects (risks, actions, escalations, health alerts). These are vendor-internal operational data."
  secondary_outputs: []

purpose: "Process tech radar updates, identify actionable insights, and route to appropriate agents"

raci:
  responsible:
    role: "Tech Signal Analyzer Agent"
    agent: "tsct_agent"
    description: "Processes tech radar updates, identifies actionable insights, and routes to appropriate agents"

  accountable:
    role: "Technology Scout Manager"
    human_required: true
    description: "Validates significant technology intelligence findings before distribution"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted: []

  informed:
    - role: "SA Agent"
      notify_on: ["significant_tech_change"]
    - role: "CI Agent"
      notify_on: ["competitor_technology_change"]
    - role: "AE Agent"
      notify_on: ["opportunity_from_tech_update"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger:
  signal: "SIG_TECH_001"
  signal_name: "technology_scout_updated"
  description: "Technology Scout has been recalculated with new job posting data"

# ==============================================================================
# PROCESSING STEPS
# ==============================================================================
processing_steps:
  - step: 1
    name: "Extract Highlights"
    action: "Parse SIG_TECH_001 payload for key changes"
    inputs:
      - "realm_id"
      - "technology_count"
      - "new_technologies_count"
      - "ring_changes_count"
      - "competitor_mentions_count"
    outputs:
      - "highlight_summary"

  - step: 2
    name: "Identify Competitor Signals"
    action: "Check for competitor technology trends"
    condition: "competitor_mentions_count > 0"
    sub_steps:
      - "Query /tech-radar/competitive endpoint"
      - "Identify declining competitors (displacement opportunities)"
      - "Identify growing competitors (threats)"
    outputs:
      - "competitor_insights"

  - step: 3
    name: "Identify Skills Gap Opportunities"
    action: "Check for alignment with our offerings"
    sub_steps:
      - "Query /tech-radar/skills-gap endpoint"
      - "Extract opportunities with strong alignment"
      - "Map to affected nodes in realm"
    outputs:
      - "skills_gap_opportunities"

  - step: 4
    name: "Route to Consumers"
    action: "Distribute insights to subscribed agents"
    routing:
      - agent: "SA Agent"
        condition: "always"
        data: ["highlight_summary", "skills_gap_opportunities"]

      - agent: "CI Agent"
        condition: "competitor_mentions_count > 0"
        data: ["competitor_insights"]

      - agent: "AE Agent"
        condition: "skills_gap_opportunities.count > 0"
        data: ["skills_gap_opportunities"]

      - agent: "PM Agent"
        condition: "new_technologies_count > 2"
        data: ["new_technologies"]

  - step: 5
    name: "Trigger Follow-up Playbooks"
    action: "Invoke dependent playbooks based on findings"
    triggers:
      - playbook: "PB_DEL_007_tech_trend_response"
        condition: "competitor_declining OR competitor_growing"
        for_each: "affected competitor technology"

      - playbook: "PB_STR_004_swot_analysis"
        condition: "ring_changes_count >= 3"
        description: "Significant tech landscape shift warrants SWOT refresh"

  - step: 6
    name: "Generate Summary Report"
    action: "Create tech radar update summary"
    output:
      path: "{realm}/intelligence/technology_scout/reports/update_{YYYY-MM-DD}.md"
      format: "markdown"
      sections:
        - "Executive Summary"
        - "Key Highlights"
        - "Competitor Analysis"
        - "Skills Gap Opportunities"
        - "Recommended Actions"

# ==============================================================================
# SIGNAL EMISSION
# ==============================================================================
signals_emitted:
  # Already received SIG_TECH_001, may also process child signals
  - signal: "SIG_TECH_002"
    condition: "new_technologies detected"
    emit_for_each: "new technology"

  - signal: "SIG_TECH_003"
    condition: "significant trend change (>15%)"
    emit_for_each: "trending technology"

# ==============================================================================
# NOTIFICATIONS
# ==============================================================================
notifications:
  - recipient: "SA Team"
    condition: "always"
    channel: "slack"
    message: "Technology Scout updated for {realm}: {technology_count} technologies, {new_technologies_count} new"

  - recipient: "Account Executives"
    condition: "skills_gap_opportunities.count > 0"
    channel: "email"
    subject: "Technology Scout: {skills_gap_opportunities.count} opportunities identified for {realm}"

  - recipient: "CI Team"
    condition: "competitor_mentions_count > 0"
    channel: "slack"
    message: "Competitor tech update for {realm}: {competitor_summary}"

# ==============================================================================
# QUALITY GATES
# ==============================================================================
quality_gates:
  - "All highlights extracted"
  - "Competitor analysis complete if competitors present"
  - "Routing completed to all subscribed agents"
  - "Summary report generated"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "1-2 minutes"
frequency: "On each SIG_TECH_001"
human_review_required: false

last_updated: "2026-01-21"
version: "1.0"
