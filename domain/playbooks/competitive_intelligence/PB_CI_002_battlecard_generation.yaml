# PLAYBOOK: Competitive Battlecard Generation
# Purpose: Create and maintain competitor-specific battlecards for field consumption

playbook_id: "PB_CI_002"
framework_name: "Competitive Battlecard Generation"
framework_source: "Intelligence Cluster - Competitive Intelligence"
playbook_mode: "GENERATIVE"
playbook_category: "pursuit_sales_support"
intended_agent_role: "ci-agent"
secondary_agents: ["Battlecard Agent (content assembly)", "SA Agent (technical differentiation)", "AE Agent (field validation)"]

primary_objective: "Generate competitor-specific battlecards containing positioning, objection handling, technical differentiation, and win themes for field teams to use in active pursuits"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Battlecards contain competitive positioning, pricing intelligence, and win/loss patterns that are strictly vendor-internal."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized competitive patterns and objection frequencies (after engagement closes)"

when_not_to_use:
  - "No identified competitor for the opportunity"
  - "Competitor already has a current battlecard (<30 days old) with no new intelligence"
  - "Deal is sole-source with no competitive evaluation"

raci:
  responsible:
    role: "CI Agent"
    agent: "ci-agent"
    description: "Orchestrates battlecard creation using competitive intelligence, win/loss data, and field feedback"
  accountable:
    role: "CI Manager"
    human_required: true
    description: "Reviews battlecard accuracy, approves positioning claims, validates pricing intelligence"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"
  consulted:
    - role: "SA Agent"
      on_steps: ["technical_differentiation", "objection_handling"]
    - role: "AE Agent"
      on_steps: ["field_validation", "pricing_positioning"]
  informed:
    - role: "Account Executive"
      notify_on: ["battlecard_published", "battlecard_updated"]
    - role: "SA Agent"
      notify_on: ["battlecard_published"]

trigger_conditions:
  automatic:
    - event: "competitor_identified_in_deal"
      description: "New competitor surfaces in an active opportunity"
    - event: "competitive_loss"
      description: "Post-loss analysis triggers battlecard refresh"
    - event: "battlecard_stale"
      description: "Existing battlecard older than 90 days"
  manual:
    - "AE requests battlecard for upcoming competitive meeting"
    - "SA needs technical differentiation for POC/demo"
    - "Sales leadership requests competitive readiness update"

validation_inputs:
  mandatory:
    - artifact: "Competitor name and product identification"
      description: "Which competitor and product line to address"
    - artifact: "Win/loss data for this competitor (last 12 months)"
      description: "Historical patterns of competitive encounters"
  optional:
    - artifact: "{realm}/{node}/internal-infohub/competitive/*.md"
      use: "Account-specific competitive history and positioning"
    - artifact: "Competitor public materials (website, documentation, pricing)"
      use: "Current competitor positioning and messaging"
    - artifact: "Customer evaluation criteria"
      use: "Tailor differentiation to what customer values"

key_questions:
  competitor_profile:
    - "What is the competitor's core value proposition and target market?"
    - "What are their strongest capabilities relative to our solution?"
    - "Where are their known gaps, limitations, or architectural weaknesses?"
  positioning:
    - "What is our primary differentiation against this competitor?"
    - "What customer pain points do we solve better?"
    - "What proof points (case studies, benchmarks) support our positioning?"
  objection_handling:
    - "What are the top 5 objections customers raise when comparing us?"
    - "What are effective counter-arguments with supporting evidence?"
    - "What questions should AE/SA ask to reframe the conversation?"
  field_tactics:
    - "What demo scenarios highlight our advantages?"
    - "What evaluation criteria favor our solution?"
    - "What are common competitive traps to avoid?"

expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/competitive/battlecard_{competitor}_{YYYY-MM-DD}.md"
    format: "markdown"
    sections:
      - competitor_overview
      - head_to_head_comparison
      - our_advantages
      - their_advantages
      - objection_handling
      - win_themes
      - field_tactics
      - proof_points

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Battlecard ready for {competitor_name}. Key differentiator: {primary_differentiator}"
    - recipient: "SA Agent"
      condition: "technical_differentiation_updated"
      message: "Technical differentiation updated in {competitor_name} battlecard. Review recommended."

stop_conditions:
  escalate_to_human:
    - condition: "no_win_loss_data_available"
      reason: "No historical competitive encounters to inform battlecard"
      action: "CI Manager to source competitive intelligence from field interviews or analyst reports"
    - condition: "competitor_claims_unverifiable"
      reason: "Cannot validate competitor capability claims"
      action: "SA to conduct technical validation before publishing"
  insufficient_data:
    - "Competitor not identified (generic 'competition' reference)"
    - "No competitive intelligence sources available"

estimated_execution_time: "10-15 minutes"
frequency: "Per competitor per active deal (refresh every 90 days)"
human_review_required: true

last_updated: "2026-03-25"
version: "1.0"
status: "draft"
