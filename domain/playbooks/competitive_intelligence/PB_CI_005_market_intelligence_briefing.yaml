# PLAYBOOK: Market Intelligence Briefing
# Purpose: Periodic competitive landscape summary for leadership and field teams

playbook_id: "PB_CI_005"
framework_name: "Market Intelligence Briefing"
framework_source: "Intelligence Cluster - Competitive Intelligence"
playbook_mode: "GENERATIVE"
playbook_category: "operations_reporting"
intended_agent_role: "ci-agent"
secondary_agents: ["Market Intel Agent (data synthesis)", "II Agent (industry context)", "TI Agent (technology trends)"]

primary_objective: "Generate periodic market intelligence briefing summarizing competitive landscape changes, win/loss trends, emerging threats, and strategic positioning recommendations for sales leadership"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Market intelligence briefings aggregate competitive data across the portfolio and contain strategic positioning guidance."

when_not_to_use:
  - "Briefing generated within last 14 days with no significant competitive events"
  - "No active competitive deals in pipeline (nothing to report on)"

raci:
  responsible:
    role: "CI Agent"
    agent: "ci-agent"
    description: "Aggregates competitive signals, win/loss patterns, and market shifts into leadership-ready briefing"
  accountable:
    role: "CI Manager"
    human_required: true
    description: "Reviews briefing accuracy, approves strategic recommendations"
    approval_actions:
      - "approve"
      - "request_revision"
  consulted:
    - role: "II Agent"
      on_steps: ["industry_context", "market_trend_validation"]
    - role: "TI Agent"
      on_steps: ["technology_landscape_shifts"]
  informed:
    - role: "VP Sales Agent"
      notify_on: ["briefing_published"]
    - role: "Senior Manager Agent"
      notify_on: ["briefing_published"]
    - role: "AE Agent"
      notify_on: ["briefing_published"]

trigger_conditions:
  automatic:
    - event: "scheduled_biweekly"
      description: "Bi-weekly market intelligence briefing cadence"
    - event: "quarter_end_approaching"
      description: "Pre-QBR competitive landscape summary"
  manual:
    - "Sales leadership requests competitive landscape update"
    - "Board meeting preparation requires competitive positioning"
    - "Major competitive event triggers ad-hoc briefing"

validation_inputs:
  mandatory:
    - artifact: "Competitive signal log (last 14 days)"
      description: "Accumulated signals from monitoring"
    - artifact: "Win/loss analysis summaries (current quarter)"
      description: "Deal outcome patterns against competitors"
  optional:
    - artifact: "intelligence/competitive/signals_*.yaml"
      use: "Daily signal monitoring outputs"
    - artifact: "{realm}/intelligence/industry_intelligence/industry_profile.yaml"
      use: "Industry context for competitive dynamics"
    - artifact: "Analyst reports and market research"
      use: "Third-party validation of competitive positioning"

key_questions:
  landscape_changes:
    - "Which competitors gained or lost market presence in the last period?"
    - "Were there significant competitive product launches or announcements?"
    - "Have any competitors changed pricing, packaging, or GTM strategy?"
  win_loss_patterns:
    - "What is our win rate against each named competitor (quarter trend)?"
    - "What are the top 3 reasons we win? Top 3 reasons we lose?"
    - "Are there emerging patterns in deal outcomes (size, segment, use case)?"
  strategic_implications:
    - "Should our competitive positioning change based on recent data?"
    - "Are there competitors we should deprioritize or elevate in our strategy?"
    - "What product investments would improve our competitive position?"

expected_outputs:
  primary_artifact:
    path: "intelligence/competitive/briefing_{YYYY-WW}.yaml"
    format: "yaml"
    sections:
      - briefing_metadata
      - executive_summary
      - landscape_changes
      - win_loss_summary
      - competitor_spotlight
      - emerging_threats
      - strategic_recommendations

  notifications:
    - recipient: "VP Sales Agent"
      condition: "always"
      message: "Market intelligence briefing ready: {competitor_count} competitors tracked, win rate {win_rate}% this quarter."
    - recipient: "PM Agent"
      condition: "product_gap_pattern_detected"
      message: "Recurring product gap in competitive losses: {gap_description}"

stop_conditions:
  escalate_to_human:
    - condition: "win_rate_below_30_percent"
      reason: "Win rate critically low, requires strategic intervention"
      action: "VP Sales and CI Manager to conduct competitive strategy review"
  insufficient_data:
    - "No competitive deals closed in reporting period"
    - "Signal monitoring data unavailable"

estimated_execution_time: "15-25 minutes"
frequency: "Bi-weekly (intensified at quarter-end)"
human_review_required: true

last_updated: "2026-03-25"
version: "1.0"
status: "draft"
