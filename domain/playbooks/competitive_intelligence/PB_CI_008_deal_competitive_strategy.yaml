# PLAYBOOK: Deal-Level Competitive Strategy
# Purpose: Per-deal competitive game plan when multiple vendors are in active evaluation

playbook_id: "PB_CI_008"
framework_name: "Deal-Level Competitive Strategy"
framework_source: "Intelligence Cluster - Competitive Intelligence"
playbook_mode: "ASSESSMENT"
playbook_category: "pursuit_sales_support"
intended_agent_role: "ci-agent"
secondary_agents: ["AE Agent (deal context and stakeholders)", "SA Agent (technical differentiation)", "Battlecard Agent (competitor tactics)"]

primary_objective: "Develop a deal-specific competitive game plan that maps each competitor's likely strategy, identifies evaluation criteria we can influence, and defines tactics for each stage of the customer's decision process"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Deal-level competitive strategy contains customer decision process intelligence and tactical positioning."

when_not_to_use:
  - "Single-vendor evaluation (no competitive pressure)"
  - "Deal in early discovery without identified competitors"
  - "Deal value below competitive investment threshold"

raci:
  responsible:
    role: "CI Agent"
    agent: "ci-agent"
    description: "Maps competitive landscape for the deal, predicts competitor moves, recommends counter-tactics"
  accountable:
    role: "Senior Manager"
    human_required: true
    description: "Reviews competitive strategy, approves resource allocation for competitive activities"
    approval_actions:
      - "approve"
      - "request_revision"
  consulted:
    - role: "AE Agent"
      on_steps: ["deal_context", "stakeholder_mapping", "commercial_positioning"]
    - role: "SA Agent"
      on_steps: ["technical_differentiation", "evaluation_criteria_influence", "demo_strategy"]
  informed:
    - role: "AE Agent"
      notify_on: ["strategy_complete"]
    - role: "SA Agent"
      notify_on: ["strategy_complete"]
    - role: "Senior Manager"
      notify_on: ["multi_competitor_high_value"]

trigger_conditions:
  automatic:
    - event: "multiple_competitors_identified"
      description: "Two or more competitors confirmed in active evaluation"
    - event: "deal_stage_advanced"
      description: "Deal enters Stage 3+ with competitive dynamics"
    - event: "competitive_signal_in_deal"
      description: "New competitor enters or competitive dynamics shift mid-deal"
  manual:
    - "AE requests competitive game plan for strategic deal"
    - "Deal review surfaces competitive risk"
    - "Customer shares evaluation scorecard or criteria"

validation_inputs:
  mandatory:
    - artifact: "Identified competitors in this deal"
      description: "Named vendors in evaluation"
    - artifact: "Customer evaluation criteria and process"
      description: "How customer will decide"
    - artifact: "{realm}/{node}/internal-infohub/overview.md"
      description: "Deal context, stakeholders, and stage"
  optional:
    - artifact: "intelligence/competitive/profiles/*.yaml"
      use: "Competitor profiles for named competitors"
    - artifact: "{realm}/{node}/internal-infohub/competitive/battlecard_*.md"
      use: "Existing battlecards for this deal's competitors"
    - artifact: "Win/loss history against these competitors"
      use: "Historical patterns in similar competitive scenarios"

key_questions:
  competitive_landscape:
    - "Who are the competitors and what is each one's likely positioning?"
    - "Which competitor is the front-runner (customer preference, incumbent advantage)?"
    - "Are there dark horse competitors we may not know about?"
  evaluation_dynamics:
    - "What are the customer's evaluation criteria and their relative weights?"
    - "Which criteria favor us? Which favor competitors?"
    - "Can we influence criteria to shift weighting in our favor?"
    - "Who are the evaluators and what are their individual preferences?"
  tactical_planning:
    - "What will each competitor's demo/POC strategy likely be?"
    - "What objections will competitors raise against us?"
    - "What traps might competitors set (feature bake-offs, pricing anchors)?"
    - "What proof points and references will be most impactful?"
  win strategy:
    - "What is our primary win theme for this deal?"
    - "What is the one thing we must prove to win?"
    - "What is the biggest risk to losing and how do we mitigate it?"

expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/competitive/deal_strategy_{YYYY-MM-DD}.md"
    format: "markdown"
    sections:
      - deal_competitive_summary
      - competitor_assessment_matrix
      - evaluation_criteria_analysis
      - win_theme_and_strategy
      - competitor_counter_tactics
      - stage_by_stage_game_plan
      - risk_factors_and_mitigation
      - resource_requirements

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Competitive game plan ready for {node}: {competitor_count} competitors, win probability {win_probability}%."
    - recipient: "Senior Manager"
      condition: "deal_value > threshold AND competitor_count >= 3"
      message: "High-value multi-competitor deal at {node}. Competitive strategy requires review."

stop_conditions:
  escalate_to_human:
    - condition: "front_runner_is_competitor"
      reason: "Customer preference is currently with competitor, requires strategic intervention"
      action: "Senior Manager to assess: invest resources to change dynamics or qualify out"
    - condition: "evaluation_criteria_unfavorable"
      reason: "Customer's criteria structurally favor competitor (e.g., incumbent integration requirements)"
      action: "AE and SA to develop criteria reframing strategy with customer sponsor"
  insufficient_data:
    - "Customer evaluation criteria unknown"
    - "Competitors identified only as 'others' without names"
    - "No stakeholder access to understand decision dynamics"

estimated_execution_time: "15-20 minutes"
frequency: "Per competitive deal (refresh when competitive dynamics change)"
human_review_required: true

last_updated: "2026-03-25"
version: "1.0"
status: "draft"
