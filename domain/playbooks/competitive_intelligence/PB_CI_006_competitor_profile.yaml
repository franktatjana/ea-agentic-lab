# PLAYBOOK: Competitor Profile Deep-Dive
# Purpose: Build comprehensive competitor dossier for strategic planning

playbook_id: "PB_CI_006"
framework_name: "Competitor Profile Deep-Dive"
framework_source: "Intelligence Cluster - Competitive Intelligence"
playbook_mode: "GENERATIVE"
playbook_category: "discovery_investigation"
intended_agent_role: "ci-agent"
secondary_agents: ["Market Intel Agent (public research)", "TI Agent (technology stack analysis)", "II Agent (industry positioning)"]

primary_objective: "Build a comprehensive competitor dossier covering product capabilities, go-to-market strategy, technology architecture, pricing model, customer base, and strategic trajectory to inform long-term competitive strategy"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Competitor profiles contain aggregated competitive intelligence and strategic assessments that are vendor-internal."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized competitor capability matrices by product category"

when_not_to_use:
  - "Competitor profile exists and was refreshed within last 90 days"
  - "Competitor is marginal (appeared in fewer than 2 deals in last 12 months)"
  - "Competitor is a potential partner, not a competitive threat"

raci:
  responsible:
    role: "CI Agent"
    agent: "ci-agent"
    description: "Orchestrates deep-dive research, synthesizes findings into structured competitor profile"
  accountable:
    role: "CI Manager"
    human_required: true
    description: "Validates profile accuracy, approves strategic assessments"
    approval_actions:
      - "approve"
      - "request_revision"
  consulted:
    - role: "SA Agent"
      on_steps: ["technology_architecture", "product_capability_mapping"]
    - role: "PM Agent"
      on_steps: ["product_roadmap_comparison", "feature_gap_identification"]
    - role: "II Agent"
      on_steps: ["market_positioning", "industry_presence"]
  informed:
    - role: "AE Agent"
      notify_on: ["profile_published"]
    - role: "VP Sales Agent"
      notify_on: ["strategic_threat_identified"]

trigger_conditions:
  automatic:
    - event: "new_competitor_identified"
      description: "Previously unknown competitor appears in 2+ deals"
    - event: "competitor_profile_stale"
      description: "Existing profile older than 90 days"
    - event: "competitor_major_event"
      description: "Competitor IPO, acquisition, major product launch, or funding round"
  manual:
    - "Sales leadership requests strategic competitor assessment"
    - "Annual competitive landscape refresh"
    - "Pre-board competitive positioning update"

validation_inputs:
  mandatory:
    - artifact: "Competitor identification (company name, primary product)"
      description: "Which competitor to profile"
  optional:
    - artifact: "Competitor public materials (website, docs, blog, careers)"
      use: "Primary research sources"
    - artifact: "Win/loss data against this competitor"
      use: "Field-validated strengths and weaknesses"
    - artifact: "Analyst reports mentioning competitor"
      use: "Third-party perspective on positioning and capability"
    - artifact: "Competitor job postings"
      use: "Technology stack, expansion signals, hiring velocity"

key_questions:
  company_overview:
    - "What is the competitor's founding year, funding, revenue (if public), and headcount?"
    - "What is their primary market focus and ideal customer profile?"
    - "What is their growth trajectory (expanding, stable, declining)?"
  product_capabilities:
    - "What are their core product capabilities and architecture?"
    - "How does their feature set compare to ours across key dimensions?"
    - "What are their known product gaps or architectural limitations?"
    - "What is their technology stack and deployment model (cloud, on-prem, hybrid)?"
  go_to_market:
    - "What is their pricing model and typical deal size?"
    - "What is their sales motion (PLG, enterprise, channel)?"
    - "Who are their key partners and ecosystem integrations?"
    - "What analyst coverage and industry recognition do they have?"
  strategic_trajectory:
    - "What does their product roadmap suggest (from public signals)?"
    - "Are they expanding into adjacent markets?"
    - "What acquisitions or partnerships signal strategic direction?"
    - "Do hiring patterns suggest new capabilities under development?"

expected_outputs:
  primary_artifact:
    path: "intelligence/competitive/profiles/{competitor_slug}_profile.yaml"
    format: "yaml"
    sections:
      - profile_metadata
      - company_overview
      - product_capability_matrix
      - technology_architecture
      - go_to_market_analysis
      - pricing_model
      - customer_base
      - strategic_trajectory
      - head_to_head_assessment
      - recommended_positioning

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Competitor profile published for {competitor_name}. Overall threat level: {threat_level}"
    - recipient: "VP Sales Agent"
      condition: "threat_level == HIGH"
      message: "High-threat competitor profile: {competitor_name}. Strategic response recommended."
    - recipient: "PM Agent"
      condition: "product_gaps_identified"
      message: "Product gaps vs {competitor_name}: {gap_summary}"

stop_conditions:
  escalate_to_human:
    - condition: "competitor_is_hyperscaler"
      reason: "Competing with AWS/GCP/Azure requires executive-level strategic response"
      action: "VP Sales and FCTO to define competitive coexistence strategy"
    - condition: "competitor_capability_claims_unverifiable"
      reason: "Cannot validate competitor technical claims from public sources"
      action: "SA to attempt hands-on evaluation or request analyst briefing"
  insufficient_data:
    - "Competitor is stealth-mode startup with no public presence"
    - "No win/loss data and no public product documentation available"

estimated_execution_time: "20-30 minutes"
frequency: "Per competitor (refresh every 90 days or on major event)"
human_review_required: true

last_updated: "2026-03-25"
version: "1.0"
status: "draft"
