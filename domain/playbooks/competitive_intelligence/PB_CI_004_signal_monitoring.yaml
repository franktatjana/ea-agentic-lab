# PLAYBOOK: Competitive Signal Monitoring
# Purpose: Continuous detection and classification of competitive signals across accounts

playbook_id: "PB_CI_004"
framework_name: "Competitive Signal Monitoring"
framework_source: "Intelligence Cluster - Competitive Intelligence"
playbook_mode: "MONITORING"
playbook_category: "monitoring_maintenance"
intended_agent_role: "ci-agent"
secondary_agents: ["Signal Detection Agent (signal collection)", "MNA Agent (news correlation)", "TI Agent (technology signals)"]

primary_objective: "Continuously monitor accounts and market for competitive signals, classify their severity and urgency, and route actionable intelligence to the right agents for response"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Signal monitoring aggregates competitive intelligence patterns across the portfolio."

when_not_to_use:
  - "No active accounts or opportunities in pipeline"
  - "Signal monitoring ran within last 24 hours with no new data sources"

raci:
  responsible:
    role: "CI Agent"
    agent: "ci-agent"
    description: "Orchestrates signal collection, classifies signals by severity, routes to appropriate agents"
  accountable:
    role: "CI Manager"
    human_required: true
    description: "Reviews high-severity signals before distribution"
  consulted:
    - role: "MNA Agent"
      on_steps: ["news_signal_correlation"]
    - role: "TI Agent"
      on_steps: ["technology_signal_analysis"]
  informed:
    - role: "AE Agent"
      notify_on: ["high_severity_signal", "deal_impacting_signal"]
    - role: "SA Agent"
      notify_on: ["technical_competitive_signal"]

trigger_conditions:
  automatic:
    - event: "scheduled_daily"
      description: "Daily competitive signal sweep"
    - event: "SIG_MNA_IMPACT"
      signal_filter: "category == competitive"
      description: "Market news with competitive implications"
    - event: "SIG_TECH_003"
      signal_filter: "is_competitor == true"
      description: "Competitor technology signal from Technology Scout"
  manual:
    - "AE reports competitor activity at account"
    - "Sales leadership requests competitive landscape refresh"

validation_inputs:
  mandatory:
    - artifact: "Active realm and node inventory"
      description: "Which accounts and deals to monitor"
  optional:
    - artifact: "{realm}/intelligence/technology_scout/current_radar.yaml"
      use: "Technology signals with competitive relevance"
    - artifact: "{realm}/intelligence/market_news/*.yaml"
      use: "Recent news events mentioning competitors"
    - artifact: "CRM opportunity notes and meeting summaries"
      use: "Field-reported competitive mentions"

key_questions:
  signal_detection:
    - "Has a competitor been mentioned in customer communications in the last 7 days?"
    - "Has a competitor made a public announcement affecting our market?"
    - "Are there hiring signals suggesting competitor expansion into our space?"
    - "Has a competitor changed pricing, packaging, or go-to-market strategy?"
  signal_classification:
    - "Is this signal deal-specific or market-wide?"
    - "What is the urgency: immediate response needed or trend monitoring?"
    - "Does this signal change the competitive dynamics in active deals?"
  signal_routing:
    - "Which accounts are directly affected by this signal?"
    - "Which agents need to act on this intelligence?"
    - "Should this trigger a battlecard refresh or Five Forces update?"

expected_outputs:
  primary_artifact:
    path: "intelligence/competitive/signals_{YYYY-MM-DD}.yaml"
    format: "yaml"
    sections:
      - scan_metadata
      - signals_detected
      - severity_classification
      - affected_accounts
      - recommended_actions

  notifications:
    - recipient: "AE Agent"
      condition: "deal_impacting_signal"
      message: "Competitive signal detected at {realm_name}: {signal_summary}. Recommended action: {action}"
    - recipient: "CI Agent"
      condition: "battlecard_refresh_needed"
      message: "Competitive signal suggests battlecard refresh for {competitor_name}"

stop_conditions:
  insufficient_data:
    - "No active accounts to monitor"
    - "All data sources unavailable or stale (>7 days)"

estimated_execution_time: "5-10 minutes"
frequency: "Daily (automated), on-demand for urgent signals"
human_review_required: false

last_updated: "2026-03-25"
version: "1.0"
status: "draft"
