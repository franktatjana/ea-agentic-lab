# PLAYBOOK: Competitive Displacement Strategy
# Purpose: Structured approach to displacing an incumbent competitor at an account

playbook_id: "PB_CI_007"
framework_name: "Competitive Displacement Strategy"
framework_source: "Intelligence Cluster - Competitive Intelligence"
playbook_mode: "ASSESSMENT"
playbook_category: "pursuit_sales_support"
intended_agent_role: "ci-agent"
secondary_agents: ["AE Agent (relationship strategy)", "SA Agent (technical migration path)", "VE Agent (cost of change analysis)"]

primary_objective: "Develop a targeted displacement strategy when an account is using a competitor solution, identifying switching triggers, migration barriers, and positioning that makes the case for change"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Displacement strategies contain account-specific competitive positioning and migration analysis."

when_not_to_use:
  - "Customer is not currently using a competitor (greenfield opportunity)"
  - "Customer has recently renewed competitor contract (>18 months remaining)"
  - "Relationship with customer is too early for displacement conversation"

raci:
  responsible:
    role: "CI Agent"
    agent: "ci-agent"
    description: "Assesses incumbent position, identifies switching triggers, develops displacement roadmap"
  accountable:
    role: "Senior Manager"
    human_required: true
    description: "Approves displacement pursuit, allocates resources for competitive campaign"
    approval_actions:
      - "approve"
      - "request_revision"
      - "deprioritize"
  consulted:
    - role: "AE Agent"
      on_steps: ["relationship_assessment", "commercial_triggers", "stakeholder_alignment"]
    - role: "SA Agent"
      on_steps: ["technical_migration_path", "integration_complexity", "proof_point_design"]
    - role: "VE Agent"
      on_steps: ["cost_of_change_analysis", "value_differential"]
  informed:
    - role: "AE Agent"
      notify_on: ["strategy_complete"]
    - role: "Senior Manager"
      notify_on: ["strategy_complete", "high_switching_barrier"]

trigger_conditions:
  automatic:
    - event: "competitor_contract_renewal_approaching"
      description: "Incumbent contract renewal within 6 months"
    - event: "customer_dissatisfaction_signal"
      description: "Support escalations, NPS decline, or public complaints about incumbent"
    - event: "incumbent_disruption"
      description: "Incumbent acquired, pivoting, sunsetting product, or pricing change"
  manual:
    - "AE identifies displacement opportunity during discovery"
    - "Customer proactively exploring alternatives to incumbent"
    - "Sales leadership targets strategic account for competitive win"

validation_inputs:
  mandatory:
    - artifact: "Incumbent competitor identification and product in use"
      description: "Which competitor solution is deployed"
    - artifact: "Customer's current deployment scope and usage"
      description: "How deeply embedded the incumbent is"
  optional:
    - artifact: "intelligence/competitive/profiles/{competitor}_profile.yaml"
      use: "Competitor capabilities and known weaknesses"
    - artifact: "{realm}/{node}/internal-infohub/competitive/*.md"
      use: "Account-specific competitive history"
    - artifact: "Customer contract details (term, renewal date, pricing)"
      use: "Commercial switching window analysis"

key_questions:
  incumbent_assessment:
    - "How long has the customer used the incumbent? How deep is the deployment?"
    - "What is the customer's satisfaction level (NPS, support trends, renewal history)?"
    - "What are the incumbent's known weaknesses at this specific account?"
    - "Are there internal champions dissatisfied with the incumbent?"
  switching_triggers:
    - "What event could trigger evaluation of alternatives (contract renewal, incident, reorg)?"
    - "Is there a business initiative that the incumbent cannot support?"
    - "Has the incumbent changed pricing, ownership, or product direction unfavorably?"
    - "Is there a new stakeholder who does not have incumbent loyalty?"
  switching_barriers:
    - "What is the technical migration complexity (data, integrations, custom config)?"
    - "What is the organizational switching cost (retraining, process change)?"
    - "Are there contractual barriers (long-term commitment, termination penalties)?"
    - "Is there executive sponsorship for the incumbent that blocks evaluation?"
  displacement_approach:
    - "Should we pursue full displacement or coexistence/expansion strategy?"
    - "What proof points would demonstrate superiority in customer's context?"
    - "What is the optimal evaluation format (POC, pilot, parallel run)?"

expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/competitive/displacement_strategy_{YYYY-MM-DD}.md"
    format: "markdown"
    sections:
      - incumbent_assessment
      - switching_trigger_analysis
      - barrier_assessment
      - displacement_roadmap
      - stakeholder_strategy
      - proof_point_plan
      - timeline_and_milestones
      - risk_factors

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Displacement strategy ready for {node}: incumbent {incumbent_name}, readiness score {readiness}/10."
    - recipient: "Senior Manager"
      condition: "readiness_score >= 7"
      message: "High-readiness displacement opportunity at {node} against {incumbent_name}. Resource allocation recommended."

stop_conditions:
  escalate_to_human:
    - condition: "switching_barriers_exceed_value"
      reason: "Migration cost and risk outweigh competitive advantage"
      action: "Senior Manager to decide: pursue coexistence strategy or deprioritize"
    - condition: "executive_sponsor_blocks_evaluation"
      reason: "C-level relationship with incumbent prevents fair evaluation"
      action: "AE to develop executive engagement plan before competitive pursuit"
  insufficient_data:
    - "Incumbent solution unknown (customer won't disclose current vendor)"
    - "No access to customer stakeholders who interact with incumbent"

estimated_execution_time: "15-25 minutes"
frequency: "Per displacement opportunity"
human_review_required: true

last_updated: "2026-03-25"
version: "1.0"
status: "draft"
