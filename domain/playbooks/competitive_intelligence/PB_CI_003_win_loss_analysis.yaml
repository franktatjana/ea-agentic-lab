# PLAYBOOK: Win/Loss Analysis
# Purpose: Post-outcome analysis to extract competitive lessons and improve win rates

playbook_id: "PB_CI_003"
framework_name: "Win/Loss Analysis"
framework_source: "Intelligence Cluster - Competitive Intelligence"
playbook_mode: "ASSESSMENT"
playbook_category: "discovery_investigation"
intended_agent_role: "ci-agent"
secondary_agents: ["Win/Loss Agent (analysis execution)", "AE Agent (deal context)", "SA Agent (technical factors)"]

primary_objective: "Analyze completed deals (won or lost) to identify competitive patterns, decision drivers, and improvement opportunities that inform future positioning and product strategy"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Win/loss analyses contain sensitive deal details, customer decision factors, and competitive intelligence."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized win/loss patterns by competitor, segment, and deal size"

when_not_to_use:
  - "Deal still active (analysis requires final outcome)"
  - "Deal lost to no-decision with no competitive evaluation (use separate no-decision analysis)"
  - "Less than 7 days since deal close (allow cooling period for objective assessment)"

raci:
  responsible:
    role: "CI Agent"
    agent: "ci-agent"
    description: "Conducts structured win/loss analysis, identifies patterns, generates actionable insights"
  accountable:
    role: "CI Manager"
    human_required: true
    description: "Validates analysis objectivity, approves distribution of findings"
    approval_actions:
      - "approve"
      - "request_revision"
  consulted:
    - role: "AE Agent"
      on_steps: ["deal_context", "relationship_factors", "commercial_dynamics"]
    - role: "SA Agent"
      on_steps: ["technical_factors", "solution_fit", "evaluation_process"]
  informed:
    - role: "PM Agent"
      notify_on: ["product_gap_identified"]
    - role: "Sales Leadership"
      notify_on: ["analysis_complete", "pattern_detected"]

trigger_conditions:
  automatic:
    - event: "deal_closed_won"
      description: "Competitive win, analyze success factors"
    - event: "deal_closed_lost"
      description: "Loss to competitor, analyze failure factors"
  manual:
    - "Sales leadership requests analysis of strategic loss"
    - "Product team requests competitive feedback on specific feature area"
    - "Quarterly win/loss pattern review"

validation_inputs:
  mandatory:
    - artifact: "Deal outcome (won/lost) and competing vendor(s)"
      description: "Final result and who was involved"
    - artifact: "Deal timeline and stage progression"
      description: "How the deal evolved through stages"
  optional:
    - artifact: "{realm}/{node}/internal-infohub/overview.md"
      use: "Full deal context and stakeholder history"
    - artifact: "Meeting notes and customer communications"
      use: "Direct evidence of decision factors"
    - artifact: "Customer feedback (if available)"
      use: "Customer's stated reasons for decision"

key_questions:
  decision_factors:
    - "What were the customer's top 3 decision criteria?"
    - "Which criteria did we win/lose on?"
    - "Was the decision primarily technical, commercial, or relationship-driven?"
  competitive_dynamics:
    - "Which competitor(s) were in the final evaluation?"
    - "What was the competitor's positioning and primary message?"
    - "Where did the competitor outperform us (customer perception)?"
  process_factors:
    - "Did we engage the right stakeholders at the right time?"
    - "Were there missed signals or warning signs?"
    - "Did our evaluation process (demo, POC, reference) help or hurt?"
  improvement_opportunities:
    - "What would we do differently in a similar deal?"
    - "Are there product gaps that contributed to the outcome?"
    - "Should our competitive positioning change based on this result?"

expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/competitive/win_loss_{YYYY-MM-DD}.md"
    format: "markdown"
    sections:
      - deal_summary
      - outcome_classification
      - decision_factors_analysis
      - competitive_dynamics
      - strengths_leveraged_or_missed
      - weaknesses_exposed
      - lessons_learned
      - recommendations

  notifications:
    - recipient: "Sales Leadership"
      condition: "always"
      message: "Win/loss analysis complete for {node}: {outcome}. Primary factor: {primary_decision_factor}"
    - recipient: "PM Agent"
      condition: "product_gap_identified"
      message: "Product gap identified in win/loss for {node}: {gap_description}"
    - recipient: "CI Agent"
      condition: "pattern_matches_previous"
      message: "Win/loss pattern detected: {pattern_description}. Battlecard update recommended."

stop_conditions:
  escalate_to_human:
    - condition: "customer_declined_feedback"
      reason: "Cannot validate internal assumptions without customer input"
      action: "AE to attempt informal debrief conversation"
    - condition: "contradictory_internal_accounts"
      reason: "AE and SA disagree on loss factors"
      action: "CI Manager to facilitate structured debrief session"
  insufficient_data:
    - "No deal history or stage progression data available"
    - "Outcome ambiguous (deal stalled, not formally closed)"

estimated_execution_time: "15-20 minutes"
frequency: "Per deal close (won or lost against named competitor)"
human_review_required: true

last_updated: "2026-03-25"
version: "1.0"
status: "draft"
