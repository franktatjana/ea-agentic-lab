# disclaimer
# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (Challenge-Solution-Results,
# content production lifecycle, etc.) are industry-standard
# methodologies cited for educational context.

# PLAYBOOK: Case Study Production Lifecycle
# Framework operationalization for AI agents

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_CAD_002"
framework_name: "Case Study Production Lifecycle"
framework_source: "Challenge-Solution-Results Framework + Content Marketing Best Practices"
intended_agent_role: "cad-agent"
secondary_agents: ["CA Agent", "VE Agent", "Marketing Agent", "Product Agent"]
playbook_mode: "GENERATIVE"
playbook_category: "customer_advocacy"

primary_objective: "Manage the end-to-end case study production pipeline from candidate identification through publication, using the Challenge-Solution-Results framework with measurable outcomes, while maintaining a production cadence of 2-4 new studies per quarter per major product line"

vault_routing:
  primary_vault: "Customer InfoHub"
  rationale: "Published case studies are shared customer-facing artifacts co-owned with the customer. They require customer approval and represent a mutual commitment to publicly share outcomes."
  secondary_outputs:
    - vault: "Internal Account Hub"
      artifact: "Draft versions, internal notes on candidate selection rationale, legal/PR approval status tracking"
    - vault: "Global Knowledge Vault"
      artifact: "Case study production patterns, bottleneck analysis, and template refinements (quarterly aggregation)"

flow_bindings:
  description: "Maps playbook phases to the agent flows that execute them"
  bindings:
    - phase: "Candidate Identification"
      agent: cad-agent-proactive
      flow: case-study-candidate-scan
      context: "Scan customer success data for high-outcome accounts with logo value and coverage gap fit"
    - phase: "Candidate Prioritization"
      agent: cad-agent-analytical
      flow: case-study-prioritization
      context: "Score candidates by outcome strength, proof point library gap coverage, campaign alignment, and logo tier"
    - phase: "Customer Outreach and Consent"
      agent: cad-agent
      flow: advocate-engagement
      context: "Coordinate outreach through CA, secure participation consent, schedule interview"
    - phase: "Interview and Content Drafting"
      agent: cad-agent
      flow: case-study-drafting
      context: "Structure interview outputs into Challenge-Solution-Results framework with validated metrics"
    - phase: "Review and Approval Workflow"
      agent: cad-agent
      flow: approval-tracking
      context: "Track customer review, legal review, PR review, and marketing review with SLA enforcement"
    - phase: "Publication and Distribution"
      agent: cad-agent
      flow: case-study-publication
      context: "Publish to proof point library, distribute to sales and marketing channels, update coverage map"
    - phase: "Pipeline Health Monitoring"
      agent: cad-agent-analytical
      flow: pipeline-health-analysis
      context: "Track pipeline velocity, detect bottlenecks, forecast production against quarterly targets"

when_not_to_use:
  - "Customer has an active support escalation or negative health signal (stabilize first)"
  - "Customer has explicitly declined all advocacy participation"
  - "Outcomes are not yet measurable (deployment too recent, less than 90 days in production)"
  - "Story duplicates an existing case study with the same industry, use case, and outcomes"
  - "Legal or regulatory restrictions prevent the customer from being publicly referenced"

raci:
  responsible:
    role: "CAD Agent"
    agent: "cad_agent"
    description: "Identifies candidates, manages production pipeline, structures content in Challenge-Solution-Results format, tracks approval workflows, and publishes to proof point library"

  accountable:
    role: "Customer Advocacy Manager"
    human_required: true
    description: "Approves candidate selection, conducts customer interviews, exercises editorial judgment, and owns final publication decision"
    approval_actions:
      - "approve_candidate"
      - "approve_draft"
      - "approve_publication"
      - "request_revision"
      - "kill_story"

  consulted:
    - role: "CA Agent"
      on_steps: ["candidate_identification", "customer_outreach", "outcome_validation"]
    - role: "VE Agent"
      on_steps: ["technical_accuracy_review", "architecture_validation"]
    - role: "Marketing Agent"
      on_steps: ["messaging_alignment", "distribution_planning"]
    - role: "Product Agent"
      on_steps: ["feature_accuracy", "adoption_metrics_validation"]

  informed:
    - role: "AE Agent"
      notify_on: ["case_study_published", "case_study_relevant_to_active_deal"]
    - role: "Sales Leadership"
      notify_on: ["quarterly_production_report"]
    - role: "Marketing Agent"
      notify_on: ["case_study_published", "case_study_available_for_campaign"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "customer_milestone_achieved"
      description: "Customer reports measurable outcomes (cost reduction, performance improvement, time savings)"
      condition: "$.customer.outcome_metrics.count >= 2 AND $.customer.deployment_age_days >= 90"

    - event: "deal_closed_won_with_strong_outcomes"
      description: "Recently closed deal with strong projected outcomes and logo value"
      condition: "$.deal.outcome == 'won' AND $.customer.logo_tier IN ['tier_1', 'tier_2']"

    - event: "proof_point_library_gap_detected"
      description: "Coverage gap identified in a priority segment with no recent case study"
      condition: "$.proof_point_library.gap.priority == 'HIGH'"

    - event: "marketing_campaign_content_request"
      description: "Marketing requests case study content aligned with upcoming campaign themes"

    - event: "quarterly_production_review"
      description: "Quarterly cadence check against 2-4 case studies per product line target"
      timing: "First week of each quarter"

  manual:
    - "Customer Advocacy Manager identifies a case study candidate"
    - "CA Agent flags a customer with exceptional outcomes"
    - "Sales requests a case study for a specific industry or use case gap"
    - "Marketing requests a story for a specific campaign or event"

  conditional:
    - condition: "$.customer.nps_score >= 9 AND $.customer.deployment_age_days >= 180"
      description: "High-NPS customer with mature deployment is a strong candidate"

    - condition: "$.proof_point_library.segment_coverage[industry] < 2"
      description: "Fewer than 2 case studies for a tier-1 industry triggers proactive candidate search"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Customer account with measurable outcomes (at least 2 quantified metrics)"
    - artifact: "Customer consent status (willing to participate in advocacy)"
    - artifact: "Deployment details (products used, scale, timeline)"

  optional:
    - artifact: "Customer interview transcript or notes"
      use: "Source material for Challenge-Solution-Results framework"
    - artifact: "Technical architecture overview"
      use: "VE validation of deployment details and solution accuracy"
    - artifact: "Proof point library coverage map"
      use: "Prioritize candidates that fill coverage gaps"
    - artifact: "Marketing messaging framework"
      use: "Align case study positioning with current campaigns"
    - artifact: "Customer quotes or testimonial fragments"
      use: "Incorporate verbatim customer voice into the story"
    - artifact: "Competitor displacement context"
      use: "Position migration stories for competitive selling"

  minimum_data_threshold:
    - "At least 2 quantified outcome metrics"
    - "Customer has provided verbal or written consent for advocacy"
    - "Deployment is in production for 90+ days"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  candidate_assessment:
    - "What measurable outcomes has this customer achieved (quantified metrics)?"
    - "How long has the deployment been in production?"
    - "What is the customer's NPS score and overall satisfaction trend?"
    - "Is the customer willing to be publicly named and quoted?"
    - "Does this customer fill a gap in the proof point library (industry, use case, scale)?"
    - "What is the logo value (brand recognition, industry leadership, deal size)?"

  challenge_framework:
    - "What business challenge was the customer facing before deployment?"
    - "What was the quantified impact of the challenge (cost, time, risk, missed opportunity)?"
    - "What previous approaches had the customer tried and why did they fall short?"
    - "Who were the key stakeholders affected by the challenge?"
    - "Was there a triggering event that made solving this challenge urgent?"

  solution_framework:
    - "What specific products and features were deployed?"
    - "What was the deployment approach (phased rollout, big-bang, proof-of-concept to production)?"
    - "What integrations with existing systems were required?"
    - "What was the implementation timeline?"
    - "Were there unexpected challenges during deployment and how were they resolved?"
    - "What internal or partner resources supported the implementation?"

  results_framework:
    - "What are the primary quantified outcomes (percentages, dollars, time saved, volume handled)?"
    - "What is the before-and-after comparison for key metrics?"
    - "Were there unexpected benefits beyond the original business case?"
    - "What is the ROI or payback period?"
    - "How has the customer expanded usage since initial deployment?"
    - "What future plans does the customer have with the platform?"

  approval_workflow:
    - "Has the customer's legal team been engaged for content approval?"
    - "Are there industry-specific compliance considerations for public statements?"
    - "Does the customer require review by their PR or communications team?"
    - "Are there any metrics or details the customer wants excluded from public content?"
    - "What is the customer's preferred timeline for review and approval?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    # High-priority candidate with strong outcomes
    - id: "high_priority_candidate"
      condition: "outcome_metrics.count >= 3 AND logo_tier IN ['tier_1', 'tier_2'] AND coverage_gap == true"
      severity: "LOW"
      output_type: "Case Study Pipeline Entry"
      decision:
        title: "High-priority case study candidate: {customer_name}"
        context: "Strong outcomes, high logo value, fills proof point library gap"
        recommendation: "Fast-track into production pipeline"
        actions:
          - "Add to pipeline with priority tier 'HIGH'"
          - "Request CA Agent for customer sentiment confirmation"
          - "Initiate outreach through Customer Advocacy Manager"
          - "Reserve production capacity for next quarter target"

    # Candidate fills critical coverage gap
    - id: "critical_gap_candidate"
      condition: "proof_point_library.gap.priority == 'CRITICAL' AND customer.consent == 'active'"
      severity: "MEDIUM"
      output_type: "Case Study Pipeline Entry + Escalation"
      decision:
        title: "Critical coverage gap candidate: {customer_name} for {industry}/{use_case}"
        context: "Proof point library has no current content for this high-demand segment"
        recommendation: "Prioritize above standard production queue"
        actions:
          - "Escalate to Customer Advocacy Manager as priority production"
          - "Coordinate expedited interview scheduling"
          - "Notify Marketing of expected publication timeline"
          - "Track against coverage gap closure metric"

    # Production bottleneck detected
    - id: "production_bottleneck"
      condition: "pipeline.stage_age > stage_sla AND pipeline.stuck_stories >= 2"
      severity: "HIGH"
      output_type: "Bottleneck Alert + Remediation Plan"
      decision:
        title: "Case study production bottleneck at {stuck_stage}"
        context: "{stuck_count} stories stalled at {stuck_stage} exceeding SLA by {days_over} days"
        recommendation: "Identify root cause and remediate to protect quarterly production target"
        actions:
          - "Identify bottleneck root cause (customer delay, legal review, interview scheduling)"
          - "Propose remediation (parallel review tracks, escalation, alternative formats)"
          - "Reprioritize pipeline to protect quarterly production target"
          - "Notify Customer Advocacy Manager with recommended interventions"

    # Legal/PR approval delay
    - id: "approval_delay"
      condition: "approval.stage IN ['legal_review', 'pr_review'] AND approval.days_in_stage > 10"
      severity: "HIGH"
      output_type: "Escalation"
      decision:
        title: "Approval delay on case study {story_id}: {days_in_stage} days in {approval_stage}"
        context: "Legal or PR review exceeding 10 business day SLA"
        recommendation: "Escalate to Senior Manager for unblocking"
        actions:
          - "Send escalation notification with approval history"
          - "Identify specific blocker (missing information, reviewer availability, policy concern)"
          - "Propose resolution path (additional context, alternative reviewer, scope reduction)"
          - "Track escalation outcome for process improvement"

    # Quarterly production target at risk
    - id: "quarterly_target_risk"
      condition: "quarter.published < quarter.target AND quarter.remaining_weeks < 4 AND pipeline.ready_for_publication < shortfall"
      severity: "HIGH"
      output_type: "Production Risk Alert"
      decision:
        title: "Q{quarter} case study production target at risk: {published}/{target} published"
        context: "Less than 4 weeks remaining with insufficient stories ready for publication"
        recommendation: "Accelerate pipeline or adjust target with justification"
        actions:
          - "Identify stories closest to publication and remove blockers"
          - "Consider alternative formats (short-form, quote cards, video snippets) to supplement"
          - "Escalate resource constraints to Customer Advocacy Manager"
          - "Document target miss root causes for process improvement"

    # Customer-initiated story with competitor migration angle
    - id: "competitive_migration_story"
      condition: "customer.migrated_from_competitor == true AND competitor IN competitive_priorities"
      severity: "MEDIUM"
      output_type: "Case Study Pipeline Entry + CI Notification"
      decision:
        title: "Competitive migration case study candidate: {customer_name} from {competitor}"
        context: "Customer migrated from priority competitor, strong competitive selling asset"
        recommendation: "Prioritize as competitive proof point"
        actions:
          - "Add to pipeline with 'competitive' tag"
          - "Coordinate with CI Agent for competitive positioning input"
          - "Include migration-specific sections (timeline, challenges, comparison)"
          - "Notify AE team of upcoming competitive proof point"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/advocacy/case_studies/{customer_slug}_{date}.md"
    format: "markdown (Challenge-Solution-Results)"
    sections:
      - executive_summary
      - customer_profile
      - challenge
      - solution
      - results
      - future_outlook
      - customer_quote
      - metadata

    schema:
      executive_summary:
        headline: "string (one-sentence outcome statement)"
        key_metrics: "array[string] (top 3 quantified results)"
        products_featured: "array[string]"

      customer_profile:
        company_name: "string"
        industry: "string"
        company_size: "string (employees, revenue range)"
        geography: "string"
        use_case: "string"

      challenge:
        business_problem: "string (what the customer was facing)"
        quantified_impact: "string (cost, time, risk before deployment)"
        previous_approaches: "array[string] (what they tried before)"
        trigger_event: "string (what made the problem urgent)"

      solution:
        products_deployed: "array[string]"
        deployment_approach: "string (phased, proof-of-concept, etc.)"
        implementation_timeline: "string"
        integrations: "array[string]"
        key_capabilities: "array[string] (specific features that addressed the challenge)"

      results:
        primary_outcomes: "array[outcome] (metric, before, after, improvement)"
        roi_or_payback: "string"
        unexpected_benefits: "array[string]"
        expansion_plans: "string"

      customer_quote:
        quote_text: "string (verbatim customer language)"
        speaker_name: "string"
        speaker_title: "string"
        consent_date: "date"

      metadata:
        case_study_id: "string"
        publication_date: "date"
        last_validated: "date"
        proof_point_tags: "array[string] (industry, use case, product, outcome type)"
        campaign_alignment: "array[string] (marketing campaigns this supports)"
        competitive_relevance: "string|null (competitor displaced)"

  pipeline_dashboard:
    path: "{realm}/advocacy/pipeline/case_study_pipeline_{quarter}.md"
    format: "markdown with tables"
    create_if: "always (updated weekly)"
    sections:
      - pipeline_summary
      - stories_by_stage
      - bottleneck_analysis
      - production_forecast
      - coverage_gap_status

  proof_point_library_entry:
    path: "{realm}/advocacy/proof_points/{industry}/{use_case}/{customer_slug}.yaml"
    create_if: "case_study_published == true"
    fields:
      - case_study_ref: "string"
      - industry: "string"
      - use_case: "string"
      - key_metrics: "array[string]"
      - quote: "string"
      - products: "array[string]"
      - publication_date: "date"
      - expiry_date: "date (12 months from publication)"

  notifications:
    - recipient: "Customer Advocacy Manager"
      condition: "always"
      message: "Case study pipeline update: {pipeline_summary}"

    - recipient: "AE Agent"
      condition: "case_study_published == true"
      message: "New case study published: {customer_name} - {headline}"

    - recipient: "Marketing Agent"
      condition: "case_study_published == true"
      message: "Case study available for campaigns: {customer_name} - {industry}/{use_case}"

    - recipient: "Sales Leadership"
      condition: "quarterly_report == true"
      message: "Q{quarter} case study production: {published}/{target} published"

    - recipient: "CA Agent"
      condition: "customer_contacted_for_interview == true"
      message: "Customer {customer_name} contacted for case study interview, monitor for sentiment"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "customer_declines_participation"
      reason: "Customer contacted for case study declines or expresses reluctance"
      action: "Respect decision immediately, do not re-approach for 6 months, log reason for decline"

    - condition: "customer_health_deteriorates_during_production"
      reason: "Customer health score drops below 70 or support escalation opens during production"
      action: "Pause production, notify CA Agent, wait for health stabilization before resuming"

    - condition: "legal_blocks_publication"
      reason: "Legal review identifies compliance, IP, or regulatory concerns with content"
      action: "Route to Customer Advocacy Manager and Legal for resolution path"

    - condition: "metrics_cannot_be_validated"
      reason: "Customer-reported outcomes cannot be independently verified or seem inflated"
      action: "Escalate to Customer Advocacy Manager for editorial judgment, consider softer language or ranges"

    - condition: "approval_stalled_beyond_20_days"
      reason: "Combined approval workflow exceeds 20 business days with no resolution"
      action: "Escalate to Senior Manager for executive intervention or decision to shelve the story"

  insufficient_data:
    - "Fewer than 2 quantified outcome metrics available"
    - "No customer quotes or interview content obtained"
    - "Deployment details too vague for credible technical narrative"
    - "Customer consent status unknown or expired"

  ambiguity_signals:
    - "Customer provides conflicting outcome metrics across touchpoints"
    - "Unclear whether outcomes are attributable to the vendor's solution or other factors"
    - "Customer wants to participate but their legal team has not responded"
    - "Multiple stakeholders at the customer disagree about public messaging"

  human_judgment_required:
    - "Selecting which outcomes to emphasize when multiple strong metrics exist"
    - "Navigating customer requests to include competitor criticism in their story"
    - "Determining whether outcomes are impressive enough for a full case study vs. a short proof point"
    - "Editorial decisions about tone, narrative arc, and headline framing"
    - "Deciding whether to publish with partial approval vs. waiting for complete sign-off"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Customer has active advocacy consent on file"
    - "At least 2 quantified outcome metrics are documented"
    - "Deployment has been in production for 90+ days"
    - "CA Agent confirms customer health score is 70+"

  post_execution:
    - "Case study follows Challenge-Solution-Results framework with all sections populated"
    - "All metrics are sourced and validated (no fabricated or estimated numbers)"
    - "Customer quote is verbatim with speaker consent documented"
    - "Product names, feature descriptions, and technical details are accurate (VE validated)"
    - "Case study tagged for proof point library indexing (industry, use case, product, outcome type)"
    - "Legal and customer approval documented with dates"

  output_quality:
    - "Challenge section describes a real business problem, not a product pitch"
    - "Solution section focuses on approach and capabilities, not feature lists"
    - "Results section leads with quantified outcomes, not qualitative statements"
    - "No superlatives or marketing language not supported by evidence"
    - "Customer voice is present through direct quotes, not paraphrased testimonials"
    - "Competitive references are factual and approved by legal, not disparaging"

# ==============================================================================
# PRODUCTION STAGE SLAS
# ==============================================================================
production_stage_slas:
  stages:
    - stage: "candidate_identified"
      max_days: 5
      description: "Candidate scored and prioritized, outreach decision made"
    - stage: "customer_outreach"
      max_days: 10
      description: "Customer contacted, consent confirmed, interview scheduled"
    - stage: "interview_complete"
      max_days: 15
      description: "Interview conducted, raw content captured"
    - stage: "draft_complete"
      max_days: 10
      description: "First draft structured in Challenge-Solution-Results format"
    - stage: "customer_review"
      max_days: 10
      description: "Customer reviews and approves content and quotes"
    - stage: "legal_pr_review"
      max_days: 10
      description: "Legal and PR teams review and approve for publication"
    - stage: "published"
      max_days: 5
      description: "Final formatting, publishing to library and distribution channels"
  total_target_days: 65
  escalation_threshold: "Any stage exceeding SLA by 5+ days triggers bottleneck alert"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "2-4 hours (agent pipeline management per story) + 8-20 hours (human interviews, writing, approvals)"
frequency: "Continuous pipeline management with quarterly production targets (2-4 per major product line)"
human_review_required: true
approval_workflow:
  - reviewer: "Customer Advocacy Manager"
    approval_gate: "Candidate selection, draft quality, editorial standards"
  - reviewer: "Customer Stakeholder"
    approval_gate: "Content accuracy, quote approval, metrics validation"
  - reviewer: "Legal Team"
    condition: "always for published case studies"
    approval_gate: "Compliance, IP, regulatory clearance"
  - reviewer: "VE Agent"
    condition: "technical_claims_present == true"
    approval_gate: "Technical accuracy of solution and architecture descriptions"
  - reviewer: "Marketing Agent"
    condition: "campaign_alignment_requested == true"
    approval_gate: "Messaging alignment and distribution readiness"

