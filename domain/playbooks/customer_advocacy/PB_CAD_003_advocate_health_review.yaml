# disclaimer
# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (advocate lifecycle management,
# fatigue detection, etc.) are industry-standard
# methodologies cited for educational context.

# PLAYBOOK: Advocate Pool Health Review
# Framework operationalization for AI agents

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_CAD_003"
framework_name: "Advocate Pool Health Review"
framework_source: "Customer Advocacy Program Management + Portfolio Health Methodology"
intended_agent_role: "cad-agent"
secondary_agents: ["CA Agent", "AE Agent", "Marketing Agent"]
playbook_mode: "GENERATIVE"
playbook_category: "governance"

primary_objective: "Monitor and maintain advocate pool health through participation frequency tracking, fatigue detection, coverage gap analysis, maturity tier progression, and peer review site ratings to ensure sustainable program capacity and balanced advocate utilization"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Advocate health reports contain participation patterns, fatigue scores, tier classifications, and pool composition data that inform internal advocacy strategy and resource allocation. Sharing externally would expose advocate utilization patterns."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Advocate recognition summaries shared with customer stakeholders as appreciation touchpoints"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized advocate program health benchmarks and maturity progression patterns (quarterly aggregation)"

flow_bindings:
  description: "Maps playbook phases to the agent flows that execute them"
  bindings:
    - phase: "Participation Frequency Analysis"
      agent: cad-agent-analytical
      flow: participation-tracking
      context: "Calculate per-advocate activity counts, identify over-utilized and under-utilized advocates"
    - phase: "Fatigue Detection"
      agent: cad-agent-proactive
      flow: fatigue-detection
      context: "Detect declining responsiveness, longer response times, reduced willingness signals"
    - phase: "Coverage Gap Analysis"
      agent: cad-agent-analytical
      flow: coverage-gap-analysis
      context: "Map advocate pool against industry, use case, geography, and persona dimensions to find gaps"
    - phase: "Maturity Tier Assessment"
      agent: cad-agent-analytical
      flow: maturity-progression
      context: "Evaluate advocate progression through tiers (new, established, champion, ambassador)"
    - phase: "Peer Review Site Monitoring"
      agent: cad-agent-proactive
      flow: peer-review-monitoring
      context: "Track ratings and review volume on G2, Gartner Peer Insights, and TrustRadius"
    - phase: "Recruitment Pipeline Review"
      agent: cad-agent-proactive
      flow: recruitment-pipeline
      context: "Assess new advocate candidate pipeline against pool attrition and coverage needs"
    - phase: "Health Report Generation"
      agent: cad-agent-analytical
      flow: health-report
      context: "Compile all health dimensions into a consolidated advocate pool health dashboard"

when_not_to_use:
  - "Advocate program has fewer than 10 active advocates (insufficient data for meaningful analysis)"
  - "Program is in initial launch phase (less than 2 quarters of participation data)"
  - "Major organizational restructuring makes historical participation data unreliable"
  - "Review is triggered less than 30 days after last comprehensive health review"

raci:
  responsible:
    role: "CAD Agent"
    agent: "cad_agent"
    description: "Collects participation data, calculates fatigue scores, identifies coverage gaps, tracks maturity progression, monitors peer review sites, and generates health reports"

  accountable:
    role: "Customer Advocacy Manager"
    human_required: true
    description: "Reviews health findings, approves intervention plans, makes strategic decisions on advocate pool composition and recruitment priorities"
    approval_actions:
      - "approve_report"
      - "approve_intervention_plan"
      - "adjust_thresholds"
      - "authorize_recruitment_campaign"

  consulted:
    - role: "CA Agent"
      on_steps: ["fatigue_detection", "health_signal_correlation", "advocate_sentiment"]
    - role: "AE Agent"
      on_steps: ["coverage_gap_impact_on_deals", "reference_demand_forecast"]
    - role: "Marketing Agent"
      on_steps: ["peer_review_campaigns", "content_needs_alignment"]

  informed:
    - role: "Sales Leadership"
      notify_on: ["critical_coverage_gaps", "reference_capacity_risk"]
    - role: "CA Agent"
      notify_on: ["advocate_fatigue_alerts", "recognition_recommendations"]
    - role: "Marketing Agent"
      notify_on: ["peer_review_ratings_change", "advocate_content_availability"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "monthly_health_review"
      description: "Scheduled monthly advocate pool health assessment"
      timing: "First week of each month"

    - event: "quarterly_comprehensive_review"
      description: "Quarterly deep-dive including maturity progression, coverage trend analysis, and program ROI"
      timing: "Second week of each quarter"

    - event: "fatigue_threshold_breach"
      description: "Any advocate exceeds 4 activities in a quarter"
      condition: "$.advocate.quarterly_activities > 4"

    - event: "peer_review_rating_drop"
      description: "Rating on any monitored peer review site drops below 4.2"
      condition: "$.peer_review.rating < 4.2"

    - event: "coverage_gap_critical"
      description: "A tier-1 industry or top-10 use case has fewer than 3 active advocates"
      condition: "$.coverage.segment_advocates < 3 AND $.coverage.segment_priority == 'tier_1'"

    - event: "advocate_pool_attrition"
      description: "Net advocate count decreased by more than 10% in a quarter"
      condition: "$.pool.quarterly_attrition_rate > 0.10"

  manual:
    - "Customer Advocacy Manager requests ad-hoc health review"
    - "Sales leadership requests reference capacity assessment"
    - "Marketing requests peer review site strategy review"
    - "Quarterly business review preparation"

  conditional:
    - condition: "$.reference_requests.unfulfilled_rate > 0.15"
      description: "More than 15% of reference requests unfulfilled triggers capacity review"

    - condition: "$.advocate.inactive_90_days.count > pool_size * 0.20"
      description: "More than 20% of advocates have been inactive for 90+ days"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Advocate registry with participation history (activities, dates, types)"
    - artifact: "Reference request log with fulfillment outcomes"
    - artifact: "Advocate consent status records"

  optional:
    - artifact: "Customer health scores from CA Agent"
      use: "Correlate advocate willingness with customer satisfaction"
    - artifact: "Peer review site data (G2, Gartner Peer Insights, TrustRadius ratings and review counts)"
      use: "Monitor external advocacy presence"
    - artifact: "Reference request forecast from AE pipeline"
      use: "Project future demand against current pool capacity"
    - artifact: "Previous health review report"
      use: "Track trends and measure improvement against prior recommendations"
    - artifact: "Marketing campaign calendar"
      use: "Anticipate spikes in advocate demand from upcoming campaigns and events"
    - artifact: "Advocate recognition history"
      use: "Identify advocates due for recognition or appreciation activities"

  minimum_data_threshold:
    - "At least 2 quarters of participation history"
    - "Advocate registry covers 80%+ of known referenceable customers"
    - "Reference request log covers at least the current and prior quarter"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  participation_frequency:
    - "Which advocates have participated more than 4 times this quarter?"
    - "What is the distribution of participation across the pool (concentrated vs. even)?"
    - "Which advocates have not participated in the last 90 days despite being active?"
    - "What is the average participation frequency per advocate per quarter?"
    - "Are participation requests aligned with advocate preferences (call vs. event vs. content)?"

  fatigue_detection:
    - "Which advocates show declining response rates to outreach?"
    - "Which advocates have increased response times over the last 2 quarters?"
    - "Are any advocates showing sentiment decline in their recent interactions?"
    - "Which advocates have declined their last 2+ reference requests?"
    - "Are any top-tier advocates at risk of disengaging?"

  coverage_gaps:
    - "Which tier-1 industries have fewer than 3 active advocates?"
    - "Which top-10 use cases lack a recent case study (less than 12 months old)?"
    - "Which geographies are under-represented in the advocate pool?"
    - "Which buyer personas (CISO, CTO, VP Engineering) are under-represented?"
    - "Which deployment scales (SMB, mid-market, enterprise) lack reference depth?"
    - "Which recently-launched products have no advocate coverage yet?"

  maturity_progression:
    - "How many advocates progressed from 'new' to 'established' this quarter?"
    - "How many advocates progressed from 'established' to 'champion' this quarter?"
    - "What is the conversion rate at each tier transition?"
    - "What activities correlate most strongly with tier advancement?"
    - "Are there advocates stuck at a tier for more than 4 quarters?"

  peer_review_sites:
    - "What is the current rating on G2, Gartner Peer Insights, and TrustRadius?"
    - "How has review volume trended over the last 4 quarters?"
    - "What percentage of reviews are from advocates vs. organic submissions?"
    - "Are there product categories or segments with low review coverage?"
    - "What is the sentiment breakdown of recent reviews (positive, neutral, negative)?"

  recruitment_pipeline:
    - "How many new advocate candidates are in the recruitment pipeline?"
    - "What is the acceptance rate for advocate recruitment outreach?"
    - "Do current recruitment targets align with identified coverage gaps?"
    - "What is the net advocate pool growth rate (new recruits minus attrition)?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    # Advocate fatigue detected
    - id: "advocate_fatigue_alert"
      condition: "advocate.quarterly_activities >= 4 OR advocate.decline_rate > 0.5"
      severity: "HIGH"
      output_type: "Fatigue Alert + Intervention Plan"
      decision:
        title: "Advocate fatigue detected: {advocate_count} advocates at or above threshold"
        context: "Advocates approaching or exceeding the 4-activity quarterly maximum risk disengagement"
        recommendation: "Redistribute reference requests and initiate recognition activities"
        actions:
          - "Immediately flag fatigued advocates in the matching system to prevent new requests"
          - "Identify alternative advocates with similar profiles for request redistribution"
          - "Schedule recognition activities for over-utilized advocates (thank-you, gift, exclusive briefing)"
          - "Review request routing logic to prevent future concentration"

    # Critical coverage gap
    - id: "critical_coverage_gap"
      condition: "segment.active_advocates < 3 AND segment.priority == 'tier_1'"
      severity: "HIGH"
      output_type: "Coverage Gap Alert + Recruitment Target"
      decision:
        title: "Critical coverage gap: {segment_name} has {advocate_count} active advocates"
        context: "Tier-1 segment falls below minimum advocate depth, reference requests may go unfulfilled"
        recommendation: "Launch targeted recruitment campaign for the gap segment"
        actions:
          - "Identify customers in the gap segment with health scores above 70 and NPS above 8"
          - "Create recruitment outreach plan with CA Agent coordination"
          - "Notify AE teams that reference capacity for this segment is constrained"
          - "Set 90-day recruitment target to reach minimum 3 active advocates"

    # Pool utilization imbalance
    - id: "utilization_imbalance"
      condition: "top_10_percent_advocates.share_of_activities > 0.50"
      severity: "MEDIUM"
      output_type: "Utilization Report + Redistribution Plan"
      decision:
        title: "Advocate utilization imbalance: top 10% of advocates handle {activity_share}% of requests"
        context: "Over-reliance on a small number of advocates increases burnout risk and program fragility"
        recommendation: "Redistribute activity load and develop depth in under-utilized advocate segments"
        actions:
          - "Identify under-utilized advocates with matching capabilities"
          - "Adjust matching algorithm weights to favor less-utilized advocates"
          - "Develop activation plans for dormant advocates (re-engagement outreach)"
          - "Set utilization distribution targets for next quarter"

    # Maturity progression stall
    - id: "maturity_progression_stall"
      condition: "tier_progression_rate < 0.15 AND quarter_count >= 2"
      severity: "MEDIUM"
      output_type: "Progression Analysis + Development Plan"
      decision:
        title: "Maturity progression stalled: only {progression_rate}% of advocates advanced tiers"
        context: "Advocate development pipeline is not converting new advocates to higher tiers"
        recommendation: "Review tier criteria and create targeted development activities"
        actions:
          - "Analyze common blockers preventing tier advancement (activity types, engagement depth)"
          - "Design tier-specific development activities (webinar speaking, advisory board invitation, co-authored content)"
          - "Create personalized progression plans for top candidates"
          - "Review tier criteria for achievability and adjust if needed"

    # Peer review rating decline
    - id: "peer_review_rating_decline"
      condition: "peer_review.rating < 4.2 OR peer_review.rating_trend == 'declining'"
      severity: "HIGH"
      output_type: "Peer Review Alert + Campaign Plan"
      decision:
        title: "Peer review rating concern: {platform} at {current_rating} (target: 4.2+)"
        context: "Peer review rating below threshold or showing declining trend impacts buyer confidence"
        recommendation: "Launch coordinated review campaign with advocate pool"
        actions:
          - "Identify satisfied advocates who have not submitted peer reviews"
          - "Coordinate review request campaign with Marketing Agent"
          - "Analyze negative reviews for product feedback patterns"
          - "Set review volume and rating targets for next quarter"
          - "Forward product feedback patterns to Product Agent"

    # Advocate pool attrition
    - id: "pool_attrition_alert"
      condition: "quarterly_attrition_rate > 0.10"
      severity: "HIGH"
      output_type: "Attrition Analysis + Retention Plan"
      decision:
        title: "Advocate pool attrition: {attrition_rate}% net loss this quarter"
        context: "Pool shrinking faster than recruitment replaces, capacity at risk"
        recommendation: "Analyze attrition causes and launch retention and recruitment initiatives"
        actions:
          - "Categorize attrition reasons (fatigue, role change, customer churn, dissatisfaction)"
          - "Identify at-risk advocates and create proactive retention touchpoints"
          - "Increase recruitment pipeline targets to offset attrition"
          - "Review advocate experience for systemic issues driving departures"

    # Healthy pool, no intervention needed
    - id: "pool_healthy"
      condition: "fatigue_rate < 0.05 AND coverage_gaps.critical == 0 AND utilization_gini < 0.3 AND peer_review.rating >= 4.2"
      severity: "LOW"
      output_type: "Health Confirmation Report"
      decision:
        title: "Advocate pool health: GREEN, all metrics within targets"
        context: "Pool is balanced, coverage is adequate, no fatigue risk, peer reviews strong"
        recommendation: "Maintain current cadence, focus on maturity progression"
        actions:
          - "Generate standard health report with trend data"
          - "Identify maturity progression opportunities for top performers"
          - "Plan recognition activities for upcoming quarter"
          - "Update recruitment targets based on demand forecast"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/advocacy/health/advocate_pool_health_{YYYY}_{quarter}.md"
    format: "markdown with tables and trend indicators"
    sections:
      - executive_summary
      - participation_metrics
      - fatigue_dashboard
      - coverage_map
      - maturity_distribution
      - peer_review_scorecard
      - recruitment_pipeline
      - recommendations
      - trend_comparison

    schema:
      executive_summary:
        overall_health: "enum[GREEN|YELLOW|RED]"
        pool_size: "integer"
        active_advocates: "integer (participated in last 90 days)"
        fatigue_alerts: "integer"
        critical_coverage_gaps: "integer"
        peer_review_average: "float"
        key_findings: "array[string] (top 3 findings)"

      participation_metrics:
        total_activities: "integer (current quarter)"
        avg_activities_per_advocate: "float"
        utilization_distribution:
          top_10_percent_share: "float"
          bottom_50_percent_share: "float"
          gini_coefficient: "float"
        activity_type_breakdown:
          reference_calls: "integer"
          case_studies: "integer"
          events_speaking: "integer"
          peer_reviews: "integer"
          advisory_boards: "integer"

      fatigue_dashboard:
        advocates_above_threshold: "integer"
        advocates_at_threshold: "integer"
        declining_response_rate: "integer"
        recognition_overdue: "integer"
        fatigued_advocates:
          type: "array"
          items:
            advocate_id: "string"
            quarterly_activities: "integer"
            fatigue_risk: "enum[LOW|MEDIUM|HIGH|CRITICAL]"
            recommended_action: "string"

      coverage_map:
        type: "table"
        dimensions:
          - dimension: "industry"
            segments: "array[coverage_segment]"
          - dimension: "use_case"
            segments: "array[coverage_segment]"
          - dimension: "geography"
            segments: "array[coverage_segment]"
          - dimension: "persona"
            segments: "array[coverage_segment]"
          - dimension: "deployment_scale"
            segments: "array[coverage_segment]"
        coverage_segment_schema:
          segment_name: "string"
          priority: "enum[tier_1|tier_2|tier_3]"
          active_advocates: "integer"
          minimum_target: "integer"
          gap: "boolean"
          gap_severity: "enum[none|moderate|critical]"

      maturity_distribution:
        new: "integer"
        established: "integer"
        champion: "integer"
        ambassador: "integer"
        progression_this_quarter:
          new_to_established: "integer"
          established_to_champion: "integer"
          champion_to_ambassador: "integer"
        avg_time_in_tier: "object (tier -> average months)"

      peer_review_scorecard:
        platforms:
          type: "array"
          items:
            platform: "string"
            current_rating: "float"
            target_rating: "float"
            total_reviews: "integer"
            reviews_this_quarter: "integer"
            sentiment_breakdown:
              positive: "float"
              neutral: "float"
              negative: "float"
            trend: "enum[improving|stable|declining]"

      recruitment_pipeline:
        candidates_identified: "integer"
        outreach_in_progress: "integer"
        accepted_this_quarter: "integer"
        declined_this_quarter: "integer"
        acceptance_rate: "float"
        pipeline_coverage_of_gaps: "float (what % of critical gaps have candidates)"

      recommendations:
        type: "array"
        items:
          priority: "enum[HIGH|MEDIUM|LOW]"
          category: "enum[fatigue|coverage|maturity|peer_review|recruitment|recognition]"
          finding: "string"
          recommendation: "string"
          target_date: "date"
          owner: "string"

      trend_comparison:
        type: "table"
        description: "Quarter-over-quarter comparison of key health metrics"
        metrics:
          - metric: "string"
          - current_quarter: "string"
          - prior_quarter: "string"
          - trend: "enum[improving|stable|declining]"

  fatigue_alerts:
    path: "{realm}/advocacy/health/fatigue_alerts/"
    create_if: "advocate.quarterly_activities >= 4"
    template: "Individual fatigue alert with advocate history and recommended action"

  coverage_gap_reports:
    path: "{realm}/advocacy/health/coverage_gaps/"
    create_if: "segment.active_advocates < minimum_target"
    template: "Coverage gap detail with segment analysis and recruitment targets"

  notifications:
    - recipient: "Customer Advocacy Manager"
      condition: "always"
      message: "Advocate pool health review complete: {overall_health} status, {fatigue_alerts} fatigue alerts, {critical_gaps} critical gaps"

    - recipient: "CA Agent"
      condition: "fatigue_alerts > 0"
      message: "{fatigue_count} advocates approaching fatigue threshold, recognition activities recommended"

    - recipient: "Sales Leadership"
      condition: "critical_coverage_gaps > 0 OR reference_capacity_risk == true"
      message: "Reference capacity concern: {critical_gaps} critical coverage gaps may impact deal support"

    - recipient: "Marketing Agent"
      condition: "peer_review_rating < 4.2"
      message: "Peer review rating below target on {platform}: {current_rating}, campaign recommended"

    - recipient: "AE Agent"
      condition: "segment_capacity_constrained == true"
      message: "Reference capacity constrained for {constrained_segments}, expect longer fulfillment times"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "pool_health_RED"
      reason: "Multiple health dimensions in critical state simultaneously"
      action: "Escalate to Customer Advocacy Manager for strategic program review"

    - condition: "systematic_fatigue_pattern"
      reason: "More than 20% of active advocates show fatigue signals in the same quarter"
      action: "Escalate to Senior Manager for program model review, current demand exceeds sustainable capacity"

    - condition: "peer_review_rating_below_4.0"
      reason: "Peer review rating dropped below 4.0 on any major platform"
      action: "Escalate to Marketing and Product leadership for coordinated response"

    - condition: "coverage_gap_blocks_strategic_deals"
      reason: "Reference gaps in segments where active strategic deals require peer validation"
      action: "Escalate to Sales Leadership and Customer Advocacy Manager for emergency recruitment"

    - condition: "attrition_exceeds_recruitment"
      reason: "Pool is shrinking for 2+ consecutive quarters despite recruitment efforts"
      action: "Escalate to Senior Manager for root cause investigation and program redesign"

  insufficient_data:
    - "Participation history covers fewer than 2 quarters"
    - "Advocate registry missing consent status for more than 30% of entries"
    - "Peer review site data unavailable or more than 30 days stale"
    - "Customer health scores not available from CA Agent for correlation analysis"

  ambiguity_signals:
    - "Participation data shows anomalies (bulk imports, system migrations) that distort trends"
    - "Advocate tier classifications inconsistent across data sources"
    - "Peer review ratings reflect a product launch or incident, not steady-state sentiment"

  human_judgment_required:
    - "Determining whether fatigue signals reflect genuine burnout vs. temporary unavailability"
    - "Deciding which coverage gaps to prioritize when recruitment capacity is limited"
    - "Evaluating whether maturity tier criteria should be adjusted"
    - "Interpreting peer review sentiment trends in the context of product changes"
    - "Setting advocate participation thresholds that balance program needs with advocate well-being"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Advocate registry data is current (last sync within 7 days)"
    - "Participation log covers at least the current and prior quarter"
    - "Peer review site data is current (last pull within 30 days)"
    - "Prior health review available for trend comparison (if not first review)"

  post_execution:
    - "All five health dimensions covered (participation, fatigue, coverage, maturity, peer reviews)"
    - "Fatigue alerts generated for every advocate above threshold"
    - "Coverage gaps categorized by severity with recruitment targets"
    - "Maturity progression rates calculated with prior quarter comparison"
    - "Peer review scorecard includes all monitored platforms"
    - "Recommendations are prioritized and assigned to owners with target dates"

  output_quality:
    - "Metrics are calculated from actual participation data, not estimates"
    - "Trend comparisons use consistent methodology across quarters"
    - "Coverage gap severity reflects actual reference demand, not theoretical"
    - "Fatigue scores incorporate multiple signals (frequency, response rate, sentiment), not just activity count"
    - "Recommendations are specific and actionable, not generic program advice"
    - "Executive summary accurately reflects the detailed findings"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "30-60 minutes (agent analysis) + 15-30 minutes (human review and strategic decisions)"
frequency: "Monthly (standard) + quarterly (comprehensive with maturity and trend deep-dive)"
human_review_required: true
approval_workflow:
  - reviewer: "CAD Agent"
    approval_gate: "Data quality verification, calculation accuracy, anomaly flagging"
  - reviewer: "Customer Advocacy Manager"
    approval_gate: "Strategic interpretation, intervention plan approval, threshold adjustments"
  - reviewer: "Sales Leadership"
    condition: "critical_coverage_gaps > 0 OR overall_health == 'RED'"
    approval_gate: "Resource allocation for gap closure, program investment decisions"

