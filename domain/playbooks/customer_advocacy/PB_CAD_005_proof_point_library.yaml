# disclaimer
# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (content lifecycle management,
# sales enablement, etc.) are industry-standard
# methodologies cited for educational context.

# PLAYBOOK: Proof Point Library Curation
# Framework operationalization for AI agents

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_CAD_005"
framework_name: "Proof Point Library Curation"
framework_source: "Content Marketing Strategy + Sales Enablement Asset Management"
intended_agent_role: "cad-agent"
secondary_agents: ["AE Agent", "Marketing Agent", "VE Agent", "Product Agent"]
playbook_mode: "ANALYTICAL"
playbook_category: "customer_enablement"

primary_objective: "Maintain a current, comprehensive, and sales-ready proof point library by inventorying existing assets with freshness tracking, analyzing coverage gaps against sales needs, enriching metadata for discoverability, aligning content with current product capabilities, executing archive/refresh/retire decisions, and coordinating multi-format production to maximize proof point reach"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Proof point library management data contains internal prioritization criteria, gap analysis against sales pipeline, freshness assessments, and editorial decisions. Sharing externally would expose content strategy and sales coverage weaknesses."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Published proof points (case studies, testimonials, data sheets) shared with customers and prospects"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized proof point utilization patterns, content effectiveness metrics, and coverage trend analysis (quarterly aggregation)"

flow_bindings:
  description: "Maps playbook phases to the agent flows that execute them"
  bindings:
    - phase: "Proof Point Inventory and Freshness Tracking"
      agent: cad-agent-analytical
      flow: program-operations
      context: "Catalog all existing proof points with publication dates, last validation dates, and freshness status (current, aging, stale, expired)"
    - phase: "Gap Analysis Against Sales Needs"
      agent: cad-agent-analytical
      flow: program-operations
      context: "Cross-reference proof point coverage against active pipeline industries, use cases, personas, and competitive scenarios to identify gaps"
    - phase: "Metadata Enrichment"
      agent: cad-agent
      flow: program-operations
      context: "Enrich proof points with structured metadata: industry, use case, outcome type, deal stage relevance, buyer persona, deployment scale"
    - phase: "Product Capability Alignment"
      agent: cad-agent-analytical
      flow: program-operations
      context: "Validate proof points reference current product capabilities, flag content citing deprecated features or outdated positioning"
    - phase: "Archive, Refresh, and Retire Decisions"
      agent: cad-agent
      flow: program-operations
      context: "Apply lifecycle rules to determine which proof points to refresh with updated metrics, archive for historical reference, or retire from active use"
    - phase: "Multi-Format Production Coordination"
      agent: cad-agent-proactive
      flow: program-operations
      context: "Coordinate production of proof points across formats: full case study, one-page summary, slide excerpt, video snippet, quote card, sales deck insert"

when_not_to_use:
  - "Proof point library has fewer than 10 assets (build before curating)"
  - "No sales pipeline data available for gap analysis (gaps cannot be prioritized without demand signals)"
  - "Product is undergoing major repositioning that will invalidate current messaging (wait for new positioning)"
  - "Curation cycle triggered less than 30 days after last comprehensive review"

raci:
  responsible:
    role: "CAD Agent"
    agent: "cad_agent"
    description: "Inventories proof points, tracks freshness, analyzes coverage gaps, enriches metadata, validates product alignment, and coordinates lifecycle decisions and multi-format production"

  accountable:
    role: "Customer Advocacy Manager"
    human_required: true
    description: "Approves archive/retire decisions for published content, validates gap prioritization, and authorizes refresh initiatives that require customer re-engagement"
    approval_actions:
      - "approve_refresh"
      - "approve_archive"
      - "approve_retire"
      - "request_revision"
      - "override_freshness_status"

  consulted:
    - role: "AE Agent"
      on_steps: ["gap_analysis", "deal_stage_relevance_mapping", "usage_feedback"]
    - role: "Marketing Agent"
      on_steps: ["messaging_alignment", "multi_format_production", "campaign_alignment"]
    - role: "VE Agent"
      on_steps: ["product_capability_validation", "technical_accuracy_review"]
    - role: "Product Agent"
      on_steps: ["feature_deprecation_check", "roadmap_alignment"]

  informed:
    - role: "AE Agent"
      notify_on: ["new_proof_point_published", "proof_point_retired", "gap_closed"]
    - role: "Marketing Agent"
      notify_on: ["new_formats_available", "content_retired", "positioning_misalignment_detected"]
    - role: "Sales Leadership"
      notify_on: ["critical_gap_report", "quarterly_library_health"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "monthly_freshness_scan"
      description: "Scheduled monthly scan of all proof points for freshness status updates"
      timing: "First week of each month"

    - event: "quarterly_gap_analysis"
      description: "Quarterly comprehensive gap analysis against current sales pipeline and coverage targets"
      timing: "Second week of each quarter"

    - event: "proof_point_age_threshold"
      signal_filter: "age_months >= 9"
      description: "Proof point reaches 9 months since last validation, triggering refresh assessment"

    - event: "product_release_published"
      description: "New product release or feature deprecation requires proof point alignment check"

    - event: "case_study_published"
      description: "New case study published triggers metadata enrichment and multi-format production"

  manual:
    - "Customer Advocacy Manager requests library audit"
    - "Sales leadership identifies proof point gap blocking deals"
    - "Marketing requests content inventory for campaign planning"

  conditional:
    - condition: "$.proof_point_library.stale_percentage > 0.20"
      description: "More than 20% of proof points are stale (12+ months without validation)"

    - condition: "$.pipeline.top_industries[industry].proof_points < 2"
      description: "Top pipeline industry has fewer than 2 active proof points"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Complete proof point inventory with publication dates and last validation dates"
      source: "Proof Point Library / Content Management System"
      criticality: "HIGH"
    - artifact: "Active sales pipeline by industry, use case, and deal stage"
      source: "CRM / AE Agent Pipeline Data"
      criticality: "HIGH"
    - artifact: "Current product capability matrix and feature status"
      source: "Product Agent / Product Documentation"
      criticality: "HIGH"
    - artifact: "Proof point utilization data (downloads, shares, deal attachments)"
      source: "Sales Enablement Platform"
      criticality: "MEDIUM"

  optional:
    - artifact: "Marketing messaging framework and campaign calendar"
      source: "Marketing Agent"
      criticality: "MEDIUM"
    - artifact: "Competitive proof point landscape (competitor case studies and claims)"
      source: "CI Agent"
      criticality: "LOW"
    - artifact: "Customer consent records for refresh outreach"
      source: "Advocate Registry"
      criticality: "MEDIUM"
    - artifact: "Reference request fulfillment log with gap patterns"
      source: "CAD Agent / Reference Matching"
      criticality: "MEDIUM"

  minimum_data_threshold:
    - "Proof point inventory covers 80%+ of known published assets"
    - "Publication dates available for all cataloged proof points"
    - "At least one quarter of sales pipeline data available for gap analysis"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  inventory_freshness:
    - "How many proof points are current (validated within 12 months), aging (9-12 months), stale (12-18 months), or expired (18+ months)?"
    - "Which proof points have the highest utilization rates and should be prioritized for refresh?"
    - "Are there proof points with outdated metrics that customers have since surpassed?"
    - "Which proof points reference deprecated product features or outdated architecture patterns?"
    - "What is the average age of proof points by industry and use case segment?"

  gap_analysis:
    - "Which top-10 pipeline industries lack proof points with metrics less than 12 months old?"
    - "Which high-demand use cases have no supporting proof points?"
    - "Which buyer personas (CISO, CTO, VP Engineering, line-of-business) are under-represented?"
    - "Which competitive displacement scenarios lack migration proof points?"
    - "Which deal stages (discovery, evaluation, negotiation) are missing stage-appropriate assets?"

  metadata_quality:
    - "What percentage of proof points have complete metadata (industry, use case, outcome type, deal stage, persona)?"
    - "Are proof points consistently tagged for searchability across the sales enablement platform?"
    - "Do outcome types map to the categories sales teams search for (cost reduction, speed improvement, risk reduction, revenue growth)?"

  format_coverage:
    - "Which high-impact proof points exist only in one format (full case study) without derivative assets?"
    - "Which proof points would benefit from video, slide, or quote card formats for different consumption contexts?"
    - "Are there proof points that should be consolidated or split for better usability?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    # Proof point is stale but high-utilization
    - id: "high_utilization_stale"
      condition: "proof_point.days_since_validation >= 270 AND proof_point.utilization_rank <= TOP_20"
      severity: "HIGH"
      output_type: "Refresh Priority + Customer Outreach Plan"
      decision:
        title: "High-utilization proof point requires refresh: {proof_point_title}"
        context: "Frequently used by sales but approaching or past freshness threshold"
        recommendation: "Prioritize refresh with updated metrics from the customer"
        actions:
          - "Check customer advocate status and consent for re-engagement"
          - "Coordinate with CA Agent for current customer health and outcome data"
          - "Schedule refresh interview or metrics update request"
          - "Flag to AE teams that asset is under refresh with expected completion date"

    # Critical gap identified
    - id: "critical_coverage_gap"
      condition: "pipeline_segment.proof_points == 0 AND pipeline_segment.active_deals >= 3"
      severity: "HIGH"
      output_type: "Gap Alert + Production Request"
      decision:
        title: "Critical proof point gap: {industry}/{use_case} has no active proof points"
        context: "{active_deals} active deals in this segment with no supporting proof points"
        recommendation: "Escalate for urgent content production or alternative asset creation"
        actions:
          - "Check advocate registry for customers in this segment with documented outcomes"
          - "If advocate available: fast-track case study production via PB_CAD_002"
          - "If no advocate: create alternative assets (analyst quotes, data points, peer review excerpts)"
          - "Notify AE teams of gap and provide interim alternatives"

    # Proof point references deprecated features
    - id: "deprecated_feature_reference"
      condition: "proof_point.references_deprecated_feature == true"
      severity: "HIGH"
      output_type: "Alignment Alert + Update Plan"
      decision:
        title: "Proof point references deprecated feature: {proof_point_title}"
        context: "Content references features or architecture no longer current, risking credibility"
        recommendation: "Update or retire the proof point to reflect current product capabilities"
        actions:
          - "Assess whether the customer has migrated to the replacement feature"
          - "If migrated: refresh with updated solution details"
          - "If not migrated: archive the proof point and note context"
          - "Coordinate with VE Agent for technical accuracy review"

    # Proof point expired, low utilization
    - id: "expired_low_utilization"
      condition: "proof_point.days_since_validation >= 540 AND proof_point.utilization_rank > BOTTOM_30"
      severity: "LOW"
      output_type: "Retire Recommendation"
      decision:
        title: "Retire recommendation: {proof_point_title}"
        context: "Proof point is 18+ months without validation and has low utilization"
        recommendation: "Archive the proof point and remove from active sales enablement channels"
        actions:
          - "Move to archived status in proof point library"
          - "Remove from sales enablement platform active listings"
          - "Retain in historical records for trend analysis"
          - "Check if segment now has a coverage gap requiring new content"

    # Multi-format production opportunity
    - id: "multi_format_opportunity"
      condition: "proof_point.format_count == 1 AND proof_point.utilization_rank <= TOP_30"
      severity: "MEDIUM"
      output_type: "Multi-Format Production Plan"
      decision:
        title: "Multi-format production opportunity: {proof_point_title}"
        context: "High-utilization proof point exists only as a full case study, derivative formats would expand reach"
        recommendation: "Produce derivative formats (one-pager, slide excerpt, quote card, video snippet)"
        actions:
          - "Identify which derivative formats align with sales consumption patterns"
          - "Coordinate with Marketing Agent for format templates and brand guidelines"
          - "Produce prioritized formats and publish to sales enablement platform"
          - "Track utilization of new formats against original"

    # Library health is strong
    - id: "library_health_good"
      condition: "stale_percentage < 0.15 AND coverage_gaps_critical == 0 AND deprecated_references == 0"
      severity: "LOW"
      output_type: "Health Report"
      decision:
        title: "Library health check passed: all metrics within targets"
        context: "Library freshness, coverage, product alignment, and metadata quality are within acceptable thresholds"
        recommendation: "Continue standard monthly and quarterly audit cadence"
        actions:
          - "Generate library health report with metrics and trends"
          - "Identify proactive refresh candidates for next quarter"
          - "Note emerging coverage gaps from pipeline changes"
          - "Plan multi-format production for highest-impact assets"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/advocacy/proof_points/library_health_{YYYY-Q}.md"
    format: "markdown with tables"
    sections:
      - executive_summary
      - freshness_dashboard
      - coverage_gap_map
      - metadata_quality_scorecard
      - product_alignment_status
      - lifecycle_actions
      - multi_format_status
      - recommendations

    schema:
      executive_summary:
        total_proof_points: "integer"
        current: "integer (validated within 12 months)"
        aging: "integer (9-12 months)"
        stale: "integer (12-18 months)"
        expired: "integer (18+ months)"
        critical_gaps: "integer"
        deprecated_references: "integer"
        refresh_in_progress: "integer"
        library_health_score: "enum[GREEN|YELLOW|RED]"

      freshness_dashboard:
        type: "array"
        items:
          proof_point_id: "string"
          title: "string"
          publication_date: "date"
          last_validated: "date"
          freshness_status: "enum[current|aging|stale|expired]"
          utilization_rank: "integer"
          recommended_action: "enum[maintain|refresh|archive|retire]"

      coverage_gap_map:
        type: "table"
        dimensions:
          - dimension: "industry"
            segments: "array[gap_segment]"
          - dimension: "use_case"
            segments: "array[gap_segment]"
          - dimension: "persona"
            segments: "array[gap_segment]"
          - dimension: "deal_stage"
            segments: "array[gap_segment]"
          - dimension: "outcome_type"
            segments: "array[gap_segment]"
        gap_segment_schema:
          segment_name: "string"
          active_proof_points: "integer"
          pipeline_deals: "integer"
          gap_severity: "enum[none|moderate|critical]"
          candidate_available: "boolean"

      metadata_quality_scorecard:
        total_proof_points: "integer"
        complete_metadata: "integer"
        missing_industry: "integer"
        missing_use_case: "integer"
        missing_outcome_type: "integer"
        missing_deal_stage: "integer"
        missing_persona: "integer"
        completeness_percentage: "float"

      product_alignment_status:
        aligned: "integer"
        needs_update: "integer"
        deprecated_feature_references: "integer"
        pending_review: "integer"

  lifecycle_action_log:
    path: "{realm}/advocacy/proof_points/lifecycle_actions/"
    create_if: "lifecycle_action_taken == true"
    fields:
      - proof_point_id: "string"
      - action: "enum[refresh|archive|retire|enrich|reformat]"
      - action_date: "date"
      - rationale: "string"
      - new_status: "string"

  multi_format_tracker:
    path: "{realm}/advocacy/proof_points/format_coverage/"
    create_if: "multi_format_assessment_complete == true"
    fields:
      - proof_point_id: "string"
      - available_formats: "array[string]"
      - planned_formats: "array[string]"
      - production_timeline: "string"

  notifications:
    - recipient: "Customer Advocacy Manager"
      condition: "always"
      message: "Proof point library health report: {current_count} current, {stale_count} stale, {critical_gaps} critical gaps"

    - recipient: "AE Agent"
      condition: "proof_point_retired == true OR new_proof_point_available == true"
      message: "Proof point library update: {action_summary}"

    - recipient: "Marketing Agent"
      condition: "multi_format_produced == true OR positioning_misalignment == true"
      message: "Proof point content update: {update_summary}"

    - recipient: "VE Agent"
      condition: "technical_review_needed == true"
      message: "Proof point {proof_point_title} flagged for technical accuracy review against current product capabilities"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "proof_point_involves_churned_customer"
      reason: "Proof point features a customer who has since churned or significantly reduced engagement"
      action: "Route to Customer Advocacy Manager for retire/archive decision and sales communication"

    - condition: "metrics_no_longer_accurate"
      reason: "Customer reports outcomes have changed significantly since proof point publication"
      action: "Immediately flag to Customer Advocacy Manager, pause distribution until refreshed"

    - condition: "legal_compliance_concern"
      reason: "Proof point may contain claims that no longer meet compliance or regulatory standards"
      action: "Quarantine immediately and escalate to Legal and Customer Advocacy Manager"

    - condition: "customer_requests_removal"
      reason: "Customer requests their proof point be removed from public use"
      action: "Immediately remove from all distribution channels, notify Customer Advocacy Manager"

    - condition: "stale_entries_percentage_critical"
      reason: "More than 50% of the library is stale, indicating systemic curation failure"
      action: "Escalate to Customer Advocacy Manager for emergency refresh program"

  insufficient_data:
    - "Proof point inventory missing publication dates for more than 20% of assets"
    - "Sales pipeline data unavailable for gap analysis"
    - "Product capability matrix not current (last update > 90 days)"

  ambiguity_signals:
    - "Proof point metrics are ambiguous (ranges vs. specific numbers, relative vs. absolute improvements)"
    - "Multiple proof points cover the same customer with conflicting outcome data"
    - "Unclear whether a product feature referenced in a proof point has been deprecated or renamed"
    - "Customer approval contact has left the company and replacement contact unknown"

  human_judgment_required:
    - "Deciding whether borderline-stale proof points with moderate utilization justify refresh investment"
    - "Prioritizing between multiple critical gaps when production capacity is limited"
    - "Determining whether to consolidate overlapping proof points or maintain both"
    - "Editorial judgment on whether refreshed metrics represent a meaningful update"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Proof point inventory is complete and current (last full sync within 14 days)"
    - "Sales pipeline data available for at least the current quarter"
    - "Product capability matrix current (feature status verified within 60 days)"
    - "Utilization data available from sales enablement platform"

  post_execution:
    - "Every proof point has a freshness status assigned with date basis"
    - "Coverage gap map cross-references actual pipeline data, not assumptions"
    - "All lifecycle actions (refresh, archive, retire) have documented rationale"
    - "Metadata enrichment covers all mandatory fields for newly cataloged assets"
    - "Product alignment check covers all proof points referencing specific features"
    - "Multi-format production priorities align with utilization and gap data"

  output_quality:
    - "Freshness scores reflect actual validation dates, not publication dates alone"
    - "Gap analysis considers deal stage relevance, not just industry and use case presence"
    - "Lifecycle recommendations distinguish between content quality issues and pure age-based staleness"
    - "Metadata tags use consistent taxonomy aligned with sales enablement search patterns"
    - "Recommendations are prioritized by business impact (pipeline influence), not just age or count"
    - "Product alignment flags cite specific deprecated features, not generic concerns"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "30-60 minutes (agent inventory and analysis) + 1-2 hours (human review of lifecycle decisions)"
frequency: "Monthly freshness scan + quarterly comprehensive gap analysis and lifecycle review"
human_review_required: true
approval_workflow:
  - reviewer: "CAD Agent"
    approval_gate: "Validate freshness calculations, gap analysis accuracy, and metadata completeness"
  - reviewer: "Customer Advocacy Manager"
    approval_gate: "Approve archive/retire decisions, validate gap prioritization, authorize refresh outreach"
  - reviewer: "VE Agent"
    condition: "deprecated_feature_flagged == true"
    approval_gate: "Confirm product capability alignment and technical accuracy"

