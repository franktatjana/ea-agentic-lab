# disclaimer
# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (customer marketing ROI,
# reference program measurement, etc.) are industry-
# standard methodologies cited for educational context.

# PLAYBOOK: Advocacy Program ROI Reporting
# Framework operationalization for AI agents

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_CAD_007"
framework_name: "Advocacy Program ROI Reporting"
framework_source: "Customer Marketing ROI + Reference Program Performance Measurement"
intended_agent_role: "cad-agent"
secondary_agents: ["AE Agent", "CA Agent", "Marketing Agent"]
playbook_mode: "ANALYTICAL"
playbook_category: "governance"

primary_objective: "Measure and report the return on investment of the customer advocacy program by tracking influenced pipeline, monitoring reference fulfillment SLA performance, measuring case study production velocity, assessing advocate pool health metrics, analyzing win rate lift from reference activities, calculating program cost vs. influenced revenue, and producing coverage trend reports for leadership"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Program ROI data contains revenue attribution, pipeline influence calculations, cost analysis, win rate comparisons, fulfillment SLA data, and advocate utilization metrics that are vendor-internal financial and strategic intelligence."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Advocate impact summaries shared with individual advocates as recognition touchpoints (their personal contribution metrics)"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized reference program benchmarks, influence multipliers, and maturity progression patterns (annual aggregation)"

flow_bindings:
  description: "Maps playbook phases to the agent flows that execute them"
  bindings:
    - phase: "Influenced Pipeline Tracking"
      agent: cad-agent-analytical
      flow: program-operations
      context: "Trace reference activities to deal pipeline, calculate influenced pipeline value using multi-touch attribution"
    - phase: "Reference Fulfillment SLA Monitoring"
      agent: cad-agent-analytical
      flow: program-operations
      context: "Track time-to-fulfill for reference requests against 48-hour SLA, identify bottlenecks and fulfillment patterns"
    - phase: "Case Study Velocity Measurement"
      agent: cad-agent-analytical
      flow: program-operations
      context: "Measure case study production throughput, stage-by-stage cycle times, and quarterly production against targets"
    - phase: "Advocate Pool Health Metrics"
      agent: cad-agent-analytical
      flow: program-operations
      context: "Calculate pool composition, utilization balance, fatigue distribution, maturity tier progression, and net growth rate"
    - phase: "Win Rate Lift Analysis"
      agent: cad-agent-analytical
      flow: program-operations
      context: "Compare win rates for deals with reference activities vs. deals without, segment by deal size, industry, and activity type"
    - phase: "Program Cost vs. Influenced Revenue"
      agent: cad-agent-analytical
      flow: program-operations
      context: "Aggregate program costs and calculate ROI multiplier, cost-per-reference, and cost-per-influenced-pipeline-dollar"
    - phase: "Coverage Trend Reporting"
      agent: cad-agent
      flow: program-operations
      context: "Compile coverage trends across industries, use cases, and personas, showing gap closure progress and emerging gaps"

when_not_to_use:
  - "Program is in first quarter of operation (insufficient data for meaningful ROI calculation)"
  - "Fewer than 10 reference activities completed in the measurement period"
  - "Deal tracking system does not capture reference activity linkage (no attribution data)"
  - "Ad-hoc proof point request, not a program-level measurement (use PB_CAD_005 instead)"
  - "Budget cycle has not started (cost data unavailable for ROI calculation)"

raci:
  responsible:
    role: "CAD Agent"
    agent: "cad_agent"
    description: "Calculates influenced pipeline, tracks fulfillment SLAs, measures case study velocity, analyzes win rate lift, computes program ROI, and produces quarterly reports"

  accountable:
    role: "Customer Advocacy Manager"
    human_required: true
    description: "Validates attribution methodology, approves ROI calculations, interprets strategic implications, and presents quarterly report to leadership"
    approval_actions:
      - "approve_report"
      - "request_revision"
      - "adjust_methodology"
      - "set_benchmarks"

  consulted:
    - role: "AE Agent"
      on_steps: ["pipeline_influence_validation", "win_rate_data_verification", "deal_outcome_correlation"]
    - role: "CA Agent"
      on_steps: ["advocate_satisfaction_signals", "customer_health_correlation"]
    - role: "Marketing Agent"
      on_steps: ["campaign_attribution_alignment", "content_effectiveness_data"]

  informed:
    - role: "Sales Leadership"
      notify_on: ["quarterly_roi_report_ready", "win_rate_lift_data_updated"]
    - role: "Customer Success Leadership"
      notify_on: ["quarterly_roi_report_ready", "advocate_pool_health_trends"]
    - role: "Marketing Leadership"
      notify_on: ["proof_point_impact_metrics", "content_effectiveness_data"]
    - role: "AE Agent"
      notify_on: ["win_rate_lift_data_updated", "reference_availability_by_segment"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "quarter_end"
      description: "Scheduled quarterly ROI calculation at the close of each fiscal quarter"

    - event: "annual_program_review"
      description: "Annual comprehensive program ROI review with year-over-year comparison"

    - event: "leadership_review_preparation"
      description: "Executive review or board meeting preparation requiring program metrics"

  manual:
    - "Customer Advocacy Manager requests ad-hoc ROI calculation for budget justification"
    - "Sales leadership requests reference program impact data for planning"
    - "Marketing requests proof point effectiveness data for content strategy"

  conditional:
    - condition: "$.quarter.reference_activities_completed >= 10"
      description: "Minimum activity threshold reached for statistically meaningful analysis"

    - condition: "$.fulfillment.sla_breach_rate > 0.15"
      description: "More than 15% of reference requests breaching SLA, triggering diagnostic review"

    - condition: "$.budget.program_spend_ytd >= budget_threshold"
      description: "Program spend exceeds threshold, triggering cost-benefit review"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Reference activity log (all reference calls, case study uses, event speaking, peer reviews)"
      source: "CAD Agent / Advocate Tracking System"
      criticality: "HIGH"
    - artifact: "Deal pipeline data with reference activity linkage (which deals had references attached)"
      source: "CRM / AE Agent Pipeline Data"
      criticality: "HIGH"
    - artifact: "Deal outcomes (won, lost, no-decision) with close dates and values"
      source: "CRM / Sales Operations"
      criticality: "HIGH"
    - artifact: "Program cost data (staff allocation, tools, recognition, events, travel)"
      source: "Finance / Customer Advocacy Manager"
      criticality: "HIGH"
    - artifact: "Reference request log with timestamps and fulfillment outcomes"
      source: "CAD Agent / Reference Matching"
      criticality: "HIGH"
    - artifact: "Case study production pipeline with stage timestamps"
      source: "CAD Agent / Case Study Tracking"
      criticality: "HIGH"

  optional:
    - artifact: "Advocate maturity tier history (tier assignments over time)"
      source: "Advocate Registry"
      criticality: "MEDIUM"
    - artifact: "Customer health score correlation data"
      source: "CA Agent"
      criticality: "MEDIUM"
    - artifact: "Previous quarter ROI reports"
      source: "CAD Agent / Reports Archive"
      criticality: "MEDIUM"
    - artifact: "Industry benchmarks for reference program ROI"
      source: "Analyst Reports / Industry Data"
      criticality: "LOW"

  minimum_data_threshold:
    - "At least 10 reference activities in the measurement period"
    - "At least 20 deals in the pipeline during the period (for win rate comparison)"
    - "Program cost data available for the measurement period"
    - "Reference request log covers at least the current and prior quarter"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  pipeline_influence:
    - "What is the total pipeline value of deals that included at least one reference activity?"
    - "What percentage of total pipeline was influenced by reference activities?"
    - "What is the average deal size for reference-influenced deals vs. non-influenced deals?"
    - "At which deal stages are reference activities most frequently introduced?"
    - "How many reference activities per deal on average for won deals vs. lost deals?"

  fulfillment_sla:
    - "What percentage of reference requests were fulfilled within the 48-hour SLA?"
    - "What is the average time-to-fulfill across all requests?"
    - "Which request types (industry, persona, competitive) have the longest fulfillment times?"
    - "What is the unfulfilled request rate, and what are the primary reasons for non-fulfillment?"
    - "Is fulfillment SLA performance improving or declining quarter-over-quarter?"

  case_study_velocity:
    - "How many case studies were published this quarter against the target?"
    - "What is the average end-to-end production time from candidate identification to publication?"
    - "Which production stage has the longest average cycle time (bottleneck identification)?"
    - "How many case studies are currently in the pipeline by stage?"

  advocate_pool_health:
    - "What is the current advocate pool size and net growth rate?"
    - "What is the maturity tier distribution (new, established, champion, ambassador)?"
    - "What percentage of advocates participated in at least one activity this quarter?"
    - "What is the advocate utilization balance (concentrated vs. distributed)?"
    - "What is the fatigue rate (percentage of advocates at or above quarterly activity threshold)?"

  win_rate_lift:
    - "What is the win rate for deals with at least one reference activity?"
    - "What is the win rate for deals without any reference activity?"
    - "Does win rate lift vary by deal size segment (SMB, mid-market, enterprise)?"
    - "Which reference activity types produce the highest win rate lift?"
    - "What is the win rate for competitive deals with references vs. without?"

  program_economics:
    - "What is the total program cost for the period?"
    - "What is the cost per reference activity?"
    - "What is the cost per influenced pipeline dollar?"
    - "What is the program ROI multiplier (influenced revenue / program cost)?"

  coverage_trends:
    - "How has proof point coverage changed across tier-1 industries over the last 4 quarters?"
    - "Which coverage gaps were closed this quarter, and which new gaps emerged?"
    - "What is the coverage trajectory: improving, stable, or declining?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    # Strong ROI, program is delivering
    - id: "strong_program_roi"
      condition: "roi_multiplier >= 10 AND win_rate_lift >= 15 AND sla_compliance >= 0.85"
      severity: "LOW"
      output_type: "ROI Report + Investment Recommendation"
      decision:
        title: "Advocacy program delivering strong ROI: {roi_multiplier}x return"
        context: "Program is generating {influenced_pipeline} in influenced pipeline with {win_rate_lift}pp win rate lift and {sla_compliance}% SLA compliance"
        recommendation: "Maintain program investment, consider scaling high-performing activity types"
        actions:
          - "Generate quarterly ROI report for leadership"
          - "Highlight top-performing activity types and advocate segments"
          - "Recommend investment increase in highest-ROI activities"
          - "Share win rate lift data with AE teams to encourage reference usage"
          - "Recognize top-contributing advocates"

    # Moderate ROI, optimization needed
    - id: "moderate_roi_optimization"
      condition: "roi_multiplier >= 3 AND roi_multiplier < 10"
      severity: "MEDIUM"
      output_type: "ROI Report + Optimization Plan"
      decision:
        title: "Advocacy program ROI moderate: {roi_multiplier}x return"
        context: "Program generating positive return but below benchmark targets"
        recommendation: "Optimize program mix, reduce low-performing activities, scale high performers"
        actions:
          - "Generate quarterly ROI report with optimization recommendations"
          - "Identify lowest-ROI activity types and recommend reallocation"
          - "Analyze whether advocate pool composition limits effectiveness"
          - "Assess whether AE reference adoption rate is limiting pipeline influence"
          - "Set 90-day improvement targets with measurable milestones"

    # Low ROI, program restructuring needed
    - id: "low_roi_restructuring"
      condition: "roi_multiplier < 3 OR win_rate_lift < 5"
      severity: "HIGH"
      output_type: "ROI Report + Restructuring Recommendation"
      decision:
        title: "Advocacy program ROI below threshold: {roi_multiplier}x return"
        context: "Program cost exceeds justified return, win rate lift is minimal"
        recommendation: "Restructure program, address root causes of low impact"
        actions:
          - "Generate detailed diagnostic report identifying ROI bottlenecks"
          - "Analyze whether low impact is due to quality (weak advocates), volume (few activities), or adoption (AEs not using)"
          - "Recommend specific restructuring actions based on root cause"
          - "Escalate to Customer Advocacy Manager and Sales Leadership for budget review"
          - "Propose 90-day turnaround plan with measurable milestones"

    # Fulfillment SLA degradation
    - id: "sla_degradation"
      condition: "sla_compliance < 0.80 OR sla_trend == DECLINING"
      severity: "HIGH"
      output_type: "SLA Alert + Remediation Plan"
      decision:
        title: "Reference fulfillment SLA compliance at {sla_compliance}%, below 80% target"
        context: "Reference requests are taking longer to fulfill, impacting deal support timeliness"
        recommendation: "Diagnose fulfillment bottlenecks and implement remediation"
        actions:
          - "Analyze unfulfilled and delayed requests for common patterns (segment, urgency, time of quarter)"
          - "Identify whether delays are due to pool gaps, advocate availability, or process inefficiency"
          - "Recommend targeted fixes: recruitment for gap segments, streamlined matching process, capacity planning"
          - "Set SLA improvement targets for next quarter"

    # Case study production behind target
    - id: "case_study_velocity_lag"
      condition: "quarter.published < quarter.target * 0.75 AND quarter.remaining_weeks < 4"
      severity: "MEDIUM"
      output_type: "Production Risk Alert"
      decision:
        title: "Case study production behind target: {published}/{target} with {remaining_weeks} weeks remaining"
        context: "Production velocity insufficient to meet quarterly case study target"
        recommendation: "Accelerate pipeline and address stage bottlenecks"
        actions:
          - "Identify stories closest to publication and remove blockers"
          - "Analyze which production stage is creating the bottleneck"
          - "Consider alternative formats (short-form, quote cards) to supplement full case studies"
          - "Escalate resource constraints to Customer Advocacy Manager"

    # Coverage trend declining
    - id: "coverage_trend_declining"
      condition: "coverage_gaps.critical > prior_quarter.coverage_gaps.critical AND gap_closure_rate < 0.5"
      severity: "MEDIUM"
      output_type: "Coverage Trend Alert"
      decision:
        title: "Proof point coverage declining: {critical_gaps} critical gaps (up from {prior_critical_gaps})"
        context: "More coverage gaps are opening than closing, proof point library losing ground"
        recommendation: "Align recruitment and case study production priorities with coverage gaps"
        actions:
          - "Map new gaps to recruitment pipeline and case study candidates"
          - "Prioritize proof point production for segments with active pipeline demand"
          - "Notify AE teams of constrained segments"
          - "Set coverage closure targets for next quarter"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/advocacy/metrics/roi_report_{YYYY-Q}.md"
    format: "markdown with tables and trend indicators"
    sections:
      - executive_summary
      - influenced_pipeline_metrics
      - fulfillment_sla_dashboard
      - case_study_velocity
      - advocate_pool_health
      - win_rate_lift_analysis
      - program_economics
      - coverage_trends
      - recommendations

    schema:
      executive_summary:
        reporting_period: "string"
        total_reference_activities: "integer"
        influenced_pipeline_value: "currency"
        pipeline_influence_percentage: "float (percentage)"
        win_rate_with_references: "float (percentage)"
        win_rate_without_references: "float (percentage)"
        win_rate_lift: "float (percentage points)"
        sla_compliance_rate: "float (percentage)"
        case_studies_published: "integer"
        case_study_target: "integer"
        program_cost: "currency"
        roi_multiplier: "float"
        active_advocates: "integer"
        quarter_over_quarter_trend: "enum[IMPROVING|STABLE|DECLINING]"

      influenced_pipeline_metrics:
        total_deals_with_references: "integer"
        total_deals_without_references: "integer"
        influenced_pipeline_value: "currency"
        non_influenced_pipeline_value: "currency"
        avg_deal_size_with_reference: "currency"
        avg_deal_size_without_reference: "currency"
        deal_size_lift: "float (percentage)"
        avg_time_to_close_with_reference: "integer (days)"
        avg_time_to_close_without_reference: "integer (days)"
        cycle_time_reduction: "integer (days)"

      fulfillment_sla_dashboard:
        total_requests: "integer"
        fulfilled_within_sla: "integer"
        sla_compliance_rate: "float (percentage)"
        avg_fulfillment_hours: "float"
        unfulfilled_count: "integer"
        unfulfilled_reasons:
          no_match: "integer"
          advocate_unavailable: "integer"
          request_cancelled: "integer"
        sla_trend: "enum[IMPROVING|STABLE|DECLINING]"

      case_study_velocity:
        published_this_quarter: "integer"
        quarterly_target: "integer"
        in_pipeline_by_stage:
          candidate_identified: "integer"
          outreach: "integer"
          interview: "integer"
          draft: "integer"
          review: "integer"
          publication: "integer"
        avg_production_days: "integer"
        bottleneck_stage: "string"
        bottleneck_avg_days: "integer"

      advocate_pool_health:
        pool_size: "integer"
        net_growth_rate: "float (percentage)"
        maturity_distribution:
          new: "integer"
          established: "integer"
          champion: "integer"
          ambassador: "integer"
        participation_rate: "float (percentage, advocates active this quarter)"
        utilization_gini: "float"
        fatigue_rate: "float (percentage at or above threshold)"

      win_rate_lift_analysis:
        overall_lift: "float (percentage points)"
        by_deal_size:
          smb: "float"
          mid_market: "float"
          enterprise: "float"
        by_activity_type:
          reference_calls: "float"
          case_studies: "float"
          event_speaking: "float"
          peer_reviews: "float"
        by_competitive_status:
          competitive_with_ref: "float"
          competitive_without_ref: "float"

      program_economics:
        total_program_cost: "currency"
        cost_per_reference_activity: "currency"
        cost_per_influenced_pipeline_dollar: "float"
        roi_multiplier: "float"
        cost_trend_qoq: "enum[DECREASING|STABLE|INCREASING]"

      coverage_trends:
        type: "table"
        metrics:
          - dimension: "string (industry, use case, persona)"
          - current_quarter_gaps: "integer"
          - prior_quarter_gaps: "integer"
          - gaps_closed: "integer"
          - gaps_opened: "integer"
          - trend: "enum[IMPROVING|STABLE|DECLINING]"

  leadership_summary:
    path: "{realm}/advocacy/metrics/leadership_summary_{YYYY-Q}.md"
    create_if: "always"
    format: "Executive summary (1 page max) with key metrics and recommendations"

  advocate_recognition_reports:
    path: "{realm}/advocacy/metrics/advocate_impact/"
    create_if: "advocate_contribution_significant == true"
    template: "Individual advocate contribution summary for recognition touchpoint"

  notifications:
    - recipient: "Sales Leadership"
      condition: "always"
      message: "Q{quarter} Advocacy Program ROI: {roi_multiplier}x return, {win_rate_lift}pp win rate lift, {influenced_pipeline} influenced pipeline"

    - recipient: "Customer Advocacy Manager"
      condition: "always"
      message: "Q{quarter} ROI report ready: {roi_multiplier}x, {reference_activities} activities, {sla_compliance}% SLA compliance"

    - recipient: "AE Agent"
      condition: "win_rate_data_updated == true"
      message: "Updated: deals with references win at {win_rate_with_ref}% vs. {win_rate_without_ref}% without"

    - recipient: "Sales Leadership"
      condition: "roi_multiplier < 3 OR sla_compliance < 0.80"
      message: "ALERT: Advocacy program metrics below threshold, review recommended"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "attribution_methodology_disputed"
      reason: "Stakeholders disagree on how to attribute pipeline influence to reference activities"
      action: "Customer Advocacy Manager to convene methodology review with Sales Operations"

    - condition: "data_integrity_issue"
      reason: "Deal system data and reference activity logs show significant discrepancies"
      action: "Pause ROI calculation until data reconciliation is complete"

    - condition: "roi_below_threshold_two_consecutive_quarters"
      reason: "Program ROI below minimum threshold for two consecutive quarters indicates structural issue"
      action: "Escalate to Sales Leadership and Customer Advocacy Manager for program review"

    - condition: "sla_compliance_below_70_percent"
      reason: "Fulfillment SLA compliance dropped below 70%, impacting deal support reliability"
      action: "Escalate to Customer Advocacy Manager for urgent capacity review and process remediation"

  insufficient_data:
    - "Fewer than 10 reference activities in the measurement period"
    - "Deal outcome data incomplete (cannot determine win/loss for referenced deals)"
    - "Program cost data unavailable or incomplete"
    - "Previous quarter data unavailable (cannot calculate trends)"

  ambiguity_signals:
    - "Multiple reference activities on the same deal (attribution weighting unclear)"
    - "Reference activity occurred but deal outcome influenced by unrelated factors"
    - "SLA clock unclear due to request resubmissions or scope changes"

  human_judgment_required:
    - "Selecting attribution model (first-touch, last-touch, multi-touch, time-decay)"
    - "Determining causation vs. correlation (do references cause wins, or are better deals more likely to get references?)"
    - "Setting ROI threshold benchmarks for the program"
    - "Deciding whether to count indirect influence (reference used in marketing content that influenced a deal)"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Reference activity log complete for the measurement period"
    - "Deal pipeline data accessible with reference linkage fields"
    - "Program cost data available and categorized"
    - "Reference request log with timestamps covers the measurement period"
    - "Case study production pipeline data available with stage timestamps"
    - "Previous quarter report available for trend comparison"

  post_execution:
    - "All seven metric categories populated (pipeline, SLA, velocity, pool health, win rate, economics, coverage)"
    - "Win rate comparison uses statistically comparable deal cohorts"
    - "ROI calculation accounts for all program costs, not just direct activity costs"
    - "SLA metrics reflect actual fulfillment timestamps, not estimates"
    - "Trend analysis covers at least 2 prior quarters for meaningful comparison"
    - "Recommendations are specific and tied to metric findings"

  output_quality:
    - "Pipeline influence uses documented attribution methodology, not arbitrary assignment"
    - "Win rate lift controls for deal size, industry, and competitive status"
    - "Program cost includes allocated staff time, not just direct expenses"
    - "SLA compliance calculated from actual request and fulfillment timestamps"
    - "Case study velocity metrics based on actual stage transition dates"
    - "Recommendations prioritize highest-impact improvements with estimated effect"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "45-90 minutes (agent analysis and report generation) + 2-4 hours (human validation and leadership review)"
frequency: "Quarterly (scheduled) + annual comprehensive review + triggered by SLA or ROI threshold breaches"
human_review_required: true
approval_workflow:
  - reviewer: "CAD Agent"
    approval_gate: "Validate data completeness, calculation accuracy, and trend consistency"
  - reviewer: "Customer Advocacy Manager"
    approval_gate: "Approve attribution methodology, validate ROI calculations, and approve leadership report"
  - reviewer: "Sales Operations"
    condition: "attribution_methodology_changed == true"
    approval_gate: "Validate pipeline attribution methodology aligns with revenue operations standards"

