# PLAYBOOK: Peer Review Site Campaign Coordination
# Framework operationalization for AI agents

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_CAD_008"
framework_name: "Peer Review Site Campaign Coordination"
framework_source: "Online Reputation Management + Peer Review Site Best Practices (G2, Gartner Peer Insights, TrustRadius)"
intended_agent_role: "cad-agent"
secondary_agents: ["CA Agent"]
playbook_mode: "PROACTIVE"
playbook_category: "customer_advocacy"

primary_objective: "Coordinate peer review site campaigns by monitoring ratings on G2, Gartner Peer Insights, and TrustRadius, identifying review candidates from the advocate pool, designing targeted outreach campaigns with volume and quality targets, and tracking campaign results and rating trends"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Campaign strategy, outreach lists, review targets, and internal rating trend analysis are vendor-internal. Sharing externally would reveal rating manipulation concerns and campaign mechanics."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Review request invitations with site links and simple instructions shared with participating advocates"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized review campaign conversion benchmarks, rating trend patterns, and platform-specific best practices (annual aggregation)"

flow_bindings:
  description: "Maps playbook phases to the agent flows that execute them"
  bindings:
    - phase: "Rating Monitoring"
      agent: cad-agent-proactive
      flow: peer-review-monitoring
      context: "Track current ratings, review volume, review recency, and competitive positioning across G2, Gartner Peer Insights, and TrustRadius"
    - phase: "Review Candidate Identification"
      agent: cad-agent-analytical
      flow: review-candidate-selection
      context: "Filter advocate pool for review candidates based on platform experience, recent positive outcomes, and review history"
    - phase: "Campaign Design"
      agent: cad-agent
      flow: review-campaign-design
      context: "Design outreach campaigns with volume targets, platform prioritization, timing, and personalized messaging"
    - phase: "Outreach Execution"
      agent: cad-agent-proactive
      flow: review-outreach
      context: "Execute outreach to review candidates with platform-specific links, instructions, and incentive details"
    - phase: "Results Tracking"
      agent: cad-agent-analytical
      flow: campaign-results-tracking
      context: "Track campaign conversion rates, review submissions, rating changes, and platform ranking impact"
    - phase: "Trend Analysis"
      agent: cad-agent-analytical
      flow: rating-trend-analysis
      context: "Analyze rating trends over time, compare against competitors, identify sentiment themes in review text"

when_not_to_use:
  - "Platform terms of service prohibit solicited reviews (verify current policies before each campaign)"
  - "Product is undergoing major issues that would generate negative reviews (stabilize first)"
  - "Advocate pool is below minimum threshold for meaningful campaign (fewer than 20 eligible advocates)"
  - "Previous campaign ran within the last 60 days on the same platform (avoid review clustering)"
  - "Customer has an active escalation or at-risk health score (resolve before requesting reviews)"

raci:
  responsible:
    role: "CAD Agent"
    agent: "cad_agent"
    description: "Monitors ratings, identifies review candidates, designs campaigns, executes outreach, and tracks results"

  accountable:
    role: "Customer Advocacy Manager"
    human_required: true
    description: "Approves campaign targets, outreach messaging, and incentive structures, ensures compliance with platform policies"
    approval_actions:
      - "approve"
      - "request_revision"
      - "pause_campaign"

  consulted:
    - role: "CA Agent"
      on_steps: ["candidate_health_verification", "review_timing_assessment"]

  informed:
    - role: "Marketing Leadership"
      notify_on: ["campaign_results_ready", "rating_milestone_reached", "rating_decline_detected"]
    - role: "Product Leadership"
      notify_on: ["negative_sentiment_theme_detected", "feature_gap_theme_in_reviews"]
    - role: "CA Agent"
      notify_on: ["review_candidate_contacted", "negative_review_submitted"]
    - role: "Customer Advocacy Manager"
      notify_on: ["campaign_launched", "campaign_complete", "rating_drop_detected"]

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "quarterly_review_campaign_cycle"
      description: "Scheduled quarterly campaign to maintain review freshness and volume"

    - event: "rating_drop_detected"
      signal_filter: "rating_change <= -0.2 OR ranking_position_change >= 3"
      description: "Average rating drops by 0.2+ points or ranking position falls 3+ spots"

    - event: "competitor_review_surge"
      description: "Competitor receives 50%+ more reviews than previous quarter, threatening ranking position"

    - event: "platform_report_season"
      description: "G2 Grid, Gartner Magic Quadrant, or TrustRadius evaluation cycle approaching (reviews influence reports)"

  manual:
    - "Customer Advocacy Manager initiates targeted campaign for specific platform"
    - "Marketing requests review volume increase for upcoming analyst evaluation"
    - "Product launch creates need for reviews on new capabilities"

  conditional:
    - condition: "$.platform.review_count_90d < 10"
      description: "Fewer than 10 new reviews in 90 days on any tracked platform, risking staleness"

    - condition: "$.platform.rating < 4.0 AND $.platform.competitor_avg_rating >= 4.2"
      description: "Rating below 4.0 while competitor average exceeds 4.2, competitive gap"

    - condition: "$.platform.report_deadline_days <= 60"
      description: "Platform report evaluation deadline within 60 days, time-sensitive review campaign needed"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Current ratings and review counts across G2, Gartner Peer Insights, and TrustRadius"
    - artifact: "Advocate registry with review consent status and platform review history"
    - artifact: "Competitor ratings and review counts on the same platforms"
    - artifact: "Platform policies on solicited reviews and incentives"

  optional:
    - artifact: "Previous campaign results (conversion rates, review quality)"
      use: "Benchmark expectations and refine outreach approach"
    - artifact: "Platform report evaluation criteria and timelines"
      use: "Prioritize campaigns around report deadlines"
    - artifact: "Customer NPS and satisfaction data"
      use: "Target highest-satisfaction customers for strongest reviews"
    - artifact: "Review text sentiment analysis from previous reviews"
      use: "Identify themes to reinforce or address in campaign messaging"

  minimum_data_threshold:
    - "Current ratings available for at least one tracked platform"
    - "At least 20 advocates with review consent in the pool"
    - "Competitor comparison data available for at least 2 competitors"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  rating_assessment:
    - "What is the current average rating on each tracked platform?"
    - "What is the review volume trend (increasing, stable, declining) per platform?"
    - "What is the average review age (are recent reviews keeping the profile fresh)?"
    - "How does the rating compare to top 3 competitors on each platform?"
    - "What is the current ranking position in relevant platform categories?"
    - "Are there recent negative reviews dragging down the average?"

  candidate_identification:
    - "Which advocates have not submitted a review on the target platform?"
    - "Which advocates have the highest NPS or satisfaction scores?"
    - "Which advocates have recent positive outcomes that would make compelling review content?"
    - "Which advocates are in underrepresented categories on the platform (specific industries, use cases, company sizes)?"
    - "Which advocates previously agreed to submit reviews but have not yet done so?"

  campaign_design:
    - "Which platform should be prioritized based on rating gap and report timing?"
    - "What is the target number of new reviews for this campaign?"
    - "What is the optimal campaign window (avoid holiday periods, quarter-end, customer budget cycles)?"
    - "What incentive or recognition structure is appropriate and compliant with platform policies?"
    - "What messaging resonates best with the target advocate segment (community contribution, thought leadership, product feedback)?"

  competitive_positioning:
    - "Which competitors have gained or lost reviews recently?"
    - "What review themes give competitors an advantage (features, support, pricing)?"
    - "Where does the product outperform competitors according to existing reviews?"
    - "Which platform categories should be targeted for maximum competitive impact?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    # Rating gap with competitor, urgent campaign
    - id: "competitive_rating_gap"
      condition: "platform.rating < competitor_avg_rating - 0.3 AND platform.report_deadline_days <= 90"
      severity: "HIGH"
      output_type: "Urgent Campaign Plan"
      decision:
        title: "Competitive rating gap on {platform_name}: {rating} vs. competitor avg {competitor_avg}"
        context: "Rating trails competitors with platform report deadline approaching"
        recommendation: "Launch targeted high-volume campaign to close rating gap before report cutoff"
        actions:
          - "Identify top 30 advocate candidates sorted by satisfaction score and platform eligibility"
          - "Design urgent outreach with clear call-to-action and simplified review link"
          - "Set target: {target_reviews} new reviews within 45 days"
          - "Segment outreach by advocate tier (Champions first, then Active, then Passive)"
          - "Prepare weekly progress tracking against target"
          - "Notify Marketing Leadership of campaign strategy and expected timeline"

    # Freshness issue, reviews aging out
    - id: "review_freshness_decline"
      condition: "platform.avg_review_age_months >= 6 AND platform.reviews_90d < 5"
      severity: "MEDIUM"
      output_type: "Freshness Campaign"
      decision:
        title: "Review freshness declining on {platform_name}"
        context: "Average review age exceeds 6 months with fewer than 5 new reviews in 90 days"
        recommendation: "Launch steady-state freshness campaign to maintain consistent review flow"
        actions:
          - "Identify 15-20 advocate candidates for staggered outreach over 8 weeks"
          - "Target 2-3 new reviews per week for sustained freshness"
          - "Focus outreach on advocates with recent product milestones (upgrade, expansion, value realization)"
          - "Include platform-specific tips to guide high-quality review content"

    # Strong position, maintenance mode
    - id: "strong_rating_maintenance"
      condition: "platform.rating >= 4.3 AND platform.rating >= competitor_avg_rating AND platform.reviews_90d >= 10"
      severity: "LOW"
      output_type: "Maintenance Plan"
      decision:
        title: "Strong rating position on {platform_name}: {rating}"
        context: "Rating leads competitors with healthy review freshness"
        recommendation: "Continue steady-state review generation, no urgent campaign needed"
        actions:
          - "Maintain quarterly outreach to 10-15 advocates for ongoing freshness"
          - "Focus on diversifying review profiles (industries, use cases, company sizes)"
          - "Monitor competitor review activity for shifts"
          - "Share strong rating with sales teams for deal support"

    # Negative review spike
    - id: "negative_review_spike"
      condition: "negative_reviews_30d >= 3 AND negative_reviews_30d > negative_reviews_avg_monthly * 2"
      severity: "HIGH"
      output_type: "Response + Counterbalance Campaign"
      decision:
        title: "Negative review spike on {platform_name}: {negative_reviews_30d} negative reviews in 30 days"
        context: "Negative review volume doubled relative to average, pulling down rating"
        recommendation: "Analyze root causes, coordinate response, and launch counterbalance outreach"
        actions:
          - "Analyze negative review themes for actionable product or support feedback"
          - "Share negative review themes with Product Leadership and CA Agent"
          - "If platform allows, post vendor response to each negative review"
          - "Launch targeted outreach to satisfied advocates to counterbalance with positive reviews"
          - "Investigate whether negative reviews correlate with known product or support issues"

    # New platform category opportunity
    - id: "new_category_opportunity"
      condition: "platform.new_category_available == true AND platform.reviews_in_category < 5"
      severity: "MEDIUM"
      output_type: "Category Campaign"
      decision:
        title: "New category opportunity on {platform_name}: {category_name}"
        context: "New platform category with low review volume, early mover advantage available"
        recommendation: "Launch targeted campaign to establish presence in new category"
        actions:
          - "Identify advocates whose use cases align with the new category"
          - "Design outreach emphasizing category-specific outcomes and capabilities"
          - "Target 10-15 reviews to establish strong initial category presence"
          - "Coordinate with Marketing to align category messaging"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/advocacy/peer_reviews/campaign_report_{YYYY-Q}.md"
    format: "markdown"
    sections:
      - executive_summary
      - platform_dashboard
      - competitive_comparison
      - campaign_results
      - sentiment_analysis
      - trend_analysis
      - recommendations

    schema:
      executive_summary:
        platforms_tracked: "integer"
        total_reviews_submitted: "integer"
        avg_campaign_conversion_rate: "float (percentage)"
        rating_changes: "map[string, float] (platform -> delta)"
        ranking_changes: "map[string, integer] (platform -> position delta)"

      platform_dashboard:
        type: "array"
        items:
          platform: "enum[G2|Gartner_Peer_Insights|TrustRadius]"
          current_rating: "float"
          previous_rating: "float"
          rating_change: "float"
          total_reviews: "integer"
          reviews_this_quarter: "integer"
          avg_review_age_months: "float"
          ranking_position: "integer"
          category: "string"

      competitive_comparison:
        type: "array"
        items:
          platform: "string"
          vendor_rating: "float"
          competitor_ratings:
            type: "array"
            items:
              competitor: "string"
              rating: "float"
              review_count: "integer"
              trend: "enum[UP|STABLE|DOWN]"
          gap_to_leader: "float"

      campaign_results:
        type: "array"
        items:
          campaign_name: "string"
          platform: "string"
          target_reviews: "integer"
          candidates_contacted: "integer"
          reviews_submitted: "integer"
          conversion_rate: "float (percentage)"
          avg_review_rating: "float"
          campaign_duration_days: "integer"
          rating_impact: "float (change in overall rating)"

      sentiment_analysis:
        positive_themes: "array[string] (most frequently praised aspects)"
        negative_themes: "array[string] (most frequently criticized aspects)"
        feature_requests: "array[string] (features mentioned as missing)"
        competitive_mentions: "array[string] (competitors mentioned in reviews)"

      trend_analysis:
        type: "array"
        items:
          quarter: "string"
          platform: "string"
          rating: "float"
          review_volume: "integer"
          sentiment_score: "float"
          competitive_position: "integer"

  campaign_plans:
    path: "{realm}/advocacy/peer_reviews/campaigns/{campaign_name}.md"
    create_if: "campaign_approved == true"
    sections:
      - target_platform
      - review_target
      - candidate_list
      - outreach_messaging
      - timeline
      - incentive_structure
      - compliance_notes

  notifications:
    - recipient: "Customer Advocacy Manager"
      condition: "always"
      message: "Peer review dashboard: G2={g2_rating}, GPI={gpi_rating}, TR={tr_rating}, {reviews_this_quarter} new reviews"

    - recipient: "Marketing Leadership"
      condition: "rating_milestone_reached == true"
      message: "Rating milestone: {platform} rating reached {rating}, up from {previous_rating}"

    - recipient: "Product Leadership"
      condition: "negative_sentiment_theme_count >= 3"
      message: "Review sentiment alert: {theme_count} negative themes detected across {platform}, product feedback attached"

    - recipient: "CA Agent"
      condition: "negative_review_from_known_advocate == true"
      message: "Known advocate {advocate_name} submitted negative review on {platform}, relationship check recommended"

    - recipient: "Customer Advocacy Manager"
      condition: "rating_drop >= 0.2"
      message: "ALERT: {platform} rating dropped {rating_drop} points to {current_rating}, action required"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "platform_policy_violation_risk"
      reason: "Campaign design may conflict with platform terms of service regarding solicited reviews"
      action: "Customer Advocacy Manager and Legal to review campaign compliance before launch"

    - condition: "negative_review_from_strategic_account"
      reason: "Negative review submitted by a contact at a strategic account"
      action: "Escalate to CA Agent and AE Agent for relationship assessment and response coordination"

    - condition: "competitor_review_manipulation_suspected"
      reason: "Unusual competitor review patterns suggest artificial inflation"
      action: "Customer Advocacy Manager to assess response strategy and potential platform reporting"

    - condition: "incentive_compliance_question"
      reason: "Proposed incentive structure needs legal and platform policy verification"
      action: "Route to Legal and Customer Advocacy Manager for compliance review"

  insufficient_data:
    - "Platform API or scraping data unavailable (cannot retrieve current ratings)"
    - "Advocate review history not tracked (cannot identify who has already reviewed)"
    - "Competitor data unavailable for comparison"

  ambiguity_signals:
    - "Platform changed rating methodology (historical comparison unreliable)"
    - "Review attributed to wrong product category"
    - "Anonymous review may be from a known advocate or competitor plant"

  human_judgment_required:
    - "Deciding whether to respond publicly to a negative review"
    - "Setting incentive levels that comply with platform policies"
    - "Prioritizing between platforms when resources are limited"
    - "Determining whether review volume targets are achievable without pressuring advocates"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Current platform ratings and review counts accessible"
    - "Advocate registry includes review consent and platform review history"
    - "Platform policies reviewed and current (verified within last 90 days)"
    - "No active campaign running on the same platform (minimum 60-day spacing)"

  post_execution:
    - "Campaign results tracked with conversion rate and rating impact"
    - "All outreach complied with platform terms of service"
    - "No advocate contacted more than once per campaign without consent"
    - "Sentiment analysis includes both positive and negative themes"
    - "Competitive comparison uses contemporaneous data (same measurement period)"

  output_quality:
    - "Ratings cite platform source and retrieval date"
    - "Conversion rates use actual outreach count as denominator, not candidate pool size"
    - "Sentiment analysis based on review text content, not just star ratings"
    - "Competitive comparison uses apples-to-apples categories and timeframes"
    - "Recommendations distinguish between rating improvement and ranking improvement strategies"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "30-60 minutes (agent analysis and campaign design) + 4-8 weeks (campaign execution and tracking)"
frequency: "Quarterly (scheduled campaigns) + triggered by rating drops and report deadlines"
human_review_required: true
approval_workflow:
  - reviewer: "CAD Agent"
    approval_gate: "Validate rating data accuracy, candidate eligibility, and campaign compliance"
  - reviewer: "Customer Advocacy Manager"
    approval_gate: "Approve campaign targets, outreach messaging, incentive structure, and platform policy compliance"
  - reviewer: "Legal"
    condition: "incentive_offered == true OR platform_policy_changed == true"
    approval_gate: "Verify compliance with platform terms of service and applicable regulations"

