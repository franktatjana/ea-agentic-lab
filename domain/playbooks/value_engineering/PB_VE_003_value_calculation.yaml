# Value Calculation Playbook
# Purpose: Calculate ROI, TCO, and cost of inaction

id: "PB_VE_003"
name: "Value Calculation"
version: "1.0"
status: "ACTIVE"
playbook_mode: "ANALYTICAL"
playbook_category: "discovery_investigation"
intended_agent_role: "ve-agent"

metadata:
  category: "commercial"
  framework: "Financial Modeling"
  team_owner: "value_engineering"
  description: "Build 3-year financial models including ROI, TCO comparison, and cost of inaction analysis"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Financial models contain pricing and margin assumptions."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Customer-facing business case with sanitized financial projections"

raci:
  responsible:
    role: "ve_agent"
    agent: "ve-agent"
    description: "Builds ROI model, TCO analysis, cost of inaction, sensitivity analysis"
  accountable:
    role: "ae_lead"
    human_required: true
    description: "Validates financial assumptions and approves customer-facing numbers"
  consulted:
    - role: "account_executives"
      on_steps: ["pricing_context", "deal_structure"]
    - role: "solution_architects"
      on_steps: ["infrastructure_costs", "implementation_effort"]
  informed:
    - role: "management"
      notify_on: ["strong_roi_case", "marginal_roi_case"]

phases:
  - name: "ROI Calculation"
    steps:
      - "Build 3-year financial model with phased benefit realization"
      - "Calculate ROI percentage and payback period"
      - "Run sensitivity analysis across key assumptions"
  - name: "TCO Analysis"
    steps:
      - "Document current-state total cost of ownership"
      - "Model proposed-state TCO including implementation and operational costs"
      - "Calculate net TCO difference over 3-year horizon"
  - name: "Cost of Inaction"
    steps:
      - "Quantify ongoing cost of maintaining status quo"
      - "Model risk exposure from delayed modernization"
      - "Calculate competitive disadvantage timeline"
  - name: "Value by Type"
    steps:
      - "Categorize: hard savings, soft savings, risk avoidance, revenue enablement"
      - "Assign confidence-weighted values to each category"
      - "Produce stakeholder-specific financial summaries"

quality_gates:
  - "All assumptions documented with source"
  - "Sensitivity analysis covers pessimistic/base/optimistic scenarios"
  - "ROI and payback period calculated with confidence range"
