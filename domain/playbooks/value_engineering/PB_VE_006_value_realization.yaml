# Value Realization Playbook
# Purpose: Track ongoing value delivery post-sale for renewals and expansions

id: "PB_VE_006"
name: "Value Realization"
version: "1.0"
status: "ACTIVE"
playbook_mode: "OPERATIONAL"
playbook_category: "customer_lifecycle"
intended_agent_role: "ve-agent"

metadata:
  category: "commercial"
  framework: "Value Realization Tracking"
  team_owner: "value_engineering"
  description: "Ongoing value tracking post-sale: QBR content, success stories, renewal justification"

vault_routing:
  primary_vault: "Customer InfoHub"
  rationale: "Realized value evidence is shared with customer as part of ongoing relationship."
  secondary_outputs:
    - vault: "Internal Account Hub"
      artifact: "Internal value tracking against deal commitments and renewal targets"

raci:
  responsible:
    role: "ve_agent"
    agent: "ve-agent"
    description: "Updates value tracker, prepares QBR content, develops success stories"
  accountable:
    role: "ca_lead"
    human_required: true
    description: "Validates value metrics align with customer success plan"
  consulted:
    - role: "customer_architects"
      on_steps: ["adoption_metrics", "customer_health"]
    - role: "account_executives"
      on_steps: ["renewal_strategy", "expansion_context"]
  informed:
    - role: "management"
      notify_on: ["value_milestone_reached", "value_shortfall_detected"]

phases:
  - name: "Value Tracker Update"
    steps:
      - "Collect current-period value metrics from customer"
      - "Calculate cumulative value delivered vs. committed"
      - "Flag any value shortfalls for intervention"
  - name: "QBR Value Content"
    steps:
      - "Prepare value realization slides for quarterly business review"
      - "Include trend analysis and forward projections"
      - "Highlight new value opportunities identified"
  - name: "Success Story Development"
    steps:
      - "Identify reference-worthy value achievements"
      - "Draft customer success narrative with quantified outcomes"
      - "Coordinate customer approval for external use"

quality_gates:
  - "Value tracker updated monthly"
  - "QBR content ready 5 business days before review"
  - "Value shortfalls flagged within one reporting cycle"
