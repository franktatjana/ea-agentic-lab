# Value Amplification Playbook
# Purpose: Leverage realized value for renewals, expansions, and competitive differentiation

id: "PB_VE_007"
name: "Value Amplification"
version: "1.0"
status: "ACTIVE"
playbook_mode: "GENERATIVE"
playbook_category: "customer_lifecycle"
intended_agent_role: "ve-agent"

metadata:
  category: "commercial"
  framework: "Value Amplification"
  team_owner: "value_engineering"
  description: "Build renewal justification, expansion business cases, case studies, and competitive value positioning"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Renewal pricing and expansion strategy are vendor-internal."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Renewal value summary and expansion opportunity analysis"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized case studies and value benchmarks"

raci:
  responsible:
    role: "ve_agent"
    agent: "ve-agent"
    description: "Builds renewal cases, expansion models, case studies, competitive differentiation"
  accountable:
    role: "ae_lead"
    human_required: true
    description: "Validates commercial strategy alignment"
  consulted:
    - role: "account_executives"
      on_steps: ["renewal_strategy", "expansion_targets"]
    - role: "competitive_intelligence"
      on_steps: ["competitive_value_positioning"]
  informed:
    - role: "management"
      notify_on: ["renewal_case_ready", "expansion_case_ready"]

phases:
  - name: "Renewal Justification"
    steps:
      - "Calculate cumulative value delivered over contract period"
      - "Build forward-looking value projection for renewal term"
      - "Produce renewal business case for customer decision-makers"
  - name: "Expansion Business Case"
    steps:
      - "Identify incremental value from expanded deployment"
      - "Model additional use case economics"
      - "Calculate marginal ROI of expansion investment"
  - name: "Case Study Creation"
    steps:
      - "Document customer journey from challenge to outcome"
      - "Quantify results with before/after metrics"
      - "Obtain customer approval and format for distribution"
  - name: "Competitive Value Differentiation"
    steps:
      - "Position realized value against competitor claims"
      - "Build value-based competitive messaging"
      - "Feed differentiation data to CI agent"

quality_gates:
  - "Renewal case includes quantified value delivered"
  - "Expansion case projects incremental ROI"
  - "Case studies approved by customer before distribution"
