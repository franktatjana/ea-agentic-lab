# Value Hypothesis Playbook
# Purpose: Create quantified value hypotheses tied to stakeholder outcomes

id: "PB_VE_002"
name: "Value Hypothesis"
version: "1.0"
status: "draft"
playbook_mode: "GENERATIVE"
playbook_category: "discovery_investigation"
intended_agent_role: "ve-agent"

metadata:
  category: "commercial"
  framework: "Value Hypothesis Framework"
  team_owner: "value_engineering"
  description: "Transform discovery findings into quantified value hypotheses with stakeholder-specific narratives"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Value hypotheses contain pricing assumptions and competitive positioning."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Stakeholder-specific value narratives (sanitized of internal assumptions)"

raci:
  responsible:
    role: "ve_agent"
    agent: "ve-agent"
    description: "Creates value hypotheses, maps to stakeholders, builds business case framework"
  accountable:
    role: "ae_lead"
    human_required: true
    description: "Validates hypothesis alignment with deal strategy"
  consulted:
    - role: "account_executives"
      on_steps: ["stakeholder_mapping", "deal_context"]
    - role: "solution_architects"
      on_steps: ["technical_feasibility"]
  informed:
    - role: "management"
      notify_on: ["high_value_case_identified"]

phases:
  - name: "Hypothesis Creation"
    steps:
      - "Map discovery pain points to quantified improvement targets"
      - "Define baseline metrics and expected outcome ranges"
      - "Assign confidence levels (high/medium/low) with supporting evidence"
  - name: "Stakeholder Narratives"
    steps:
      - "Create role-specific value messages (CFO, CTO, LOB leader)"
      - "Link each hypothesis to stakeholder KPIs"
      - "Build presentation-ready value summaries"
  - name: "Business Case Framework"
    steps:
      - "Structure investment vs. return model"
      - "Define measurement criteria and success milestones"
      - "Identify risk factors and sensitivity ranges"

quality_gates:
  - "Every hypothesis has a baseline metric and target range"
  - "At least one hypothesis per identified stakeholder"
  - "Confidence levels justified with evidence"
