# Value Stream Workshop Playbook
# Purpose: Facilitate structured value stream mapping workshops

id: "PB_VE_304"
name: "Value Stream Workshop"
version: "1.0"
status: "ACTIVE"
playbook_mode: "GENERATIVE"
playbook_category: "discovery_investigation"
intended_agent_role: "ve-agent"

metadata:
  category: "commercial"
  framework: "Value Stream Mapping"
  team_owner: "value_engineering"
  description: "Plan and facilitate value stream workshops from current-state mapping through future-state design"

vault_routing:
  primary_vault: "Customer InfoHub"
  rationale: "Workshop artifacts are collaborative outputs co-created with the customer."
  secondary_outputs:
    - vault: "Internal Account Hub"
      artifact: "Internal workshop strategy, positioning notes, and deal implications"

raci:
  responsible:
    role: "ve_agent"
    agent: "ve-agent"
    description: "Prepares workshop materials, facilitates mapping, synthesizes outcomes"
  accountable:
    role: "sa_lead"
    human_required: true
    description: "Co-facilitates technical portions and validates architecture alignment"
  consulted:
    - role: "solution_architects"
      on_steps: ["future_state_design", "architecture_mapping"]
    - role: "specialists"
      on_steps: ["domain_specific_workflows"]
  informed:
    - role: "account_executives"
      notify_on: ["workshop_complete", "value_model_ready"]

phases:
  - name: "Workshop Preparation"
    steps:
      - "Define workshop objectives and scope"
      - "Identify stakeholder participants and roles"
      - "Prepare current-state mapping templates"
  - name: "Current State Mapping"
    steps:
      - "Document end-to-end workflow with cycle times"
      - "Identify pain points, bottlenecks, and waste"
      - "Quantify cost at each process step"
  - name: "Future State Design"
    steps:
      - "Define target architecture and workflow"
      - "Map improvements to specific pain points"
      - "Estimate benefit at each optimization point"
  - name: "Workshop Synthesis"
    steps:
      - "Create value model from current vs. future state delta"
      - "Prioritize improvements by impact and implementation effort"
      - "Produce phased implementation recommendation"

quality_gates:
  - "Current state documented with measurable metrics"
  - "Future state linked to specific platform capabilities"
  - "Value model quantified with phased timeline"
