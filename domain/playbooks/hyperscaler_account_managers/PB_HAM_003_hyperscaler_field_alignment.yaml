# disclaimer
# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (AWS ISV Accelerate, Azure
# Partner Center, GCP Partner Advantage, etc.) are
# industry-standard programs cited for educational
# context.

# PLAYBOOK: Hyperscaler Field Alignment
# Framework operationalization for AI agents

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_HAM_003"
framework_name: "Hyperscaler Field Alignment"
framework_source: "Partner Field Engagement Best Practices / Co-sell Playbook Methodology"
intended_agent_role: "ham-agent"
intended_sub_agent: "ham-field-alignment-agent"
secondary_agents:
  - "AE Agent provides account strategy and customer context"
  - "SA Agent provides technical demonstration context"
  - "FCTO Agent provides executive engagement strategy for strategic accounts"
playbook_mode: "GENERATIVE"
playbook_category: "cosell_operations"

primary_objective: "Coordinate hyperscaler field rep alignment including joint session preparation, opportunity registration in ACE/Partner Center, field session debrief capture, and ongoing cadence management"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Field alignment data is account-specific, containing hyperscaler rep engagement notes, joint session strategies, and opportunity registration details that are vendor-internal."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized field engagement patterns, session prep templates, and cadence benchmarks (aggregated quarterly)"

when_not_to_use:
  - "No hyperscaler field rep assigned to the region or account segment"
  - "Customer has explicitly declined hyperscaler involvement in the sales process"
  - "Account is not in an active sales cycle (no open opportunity or expansion discussion)"
  - "Hyperscaler relationship is at program level only (no field-level engagement)"
  - "Internal-only planning session with no hyperscaler rep participation"

raci:
  responsible:
    role: "HAM Agent"
    agent: "ham-field-alignment-agent"
    description: "Prepares joint session materials, manages opportunity registration, captures debrief outcomes, and maintains field engagement cadence"

  accountable:
    role: "VP Alliances"
    human_required: true
    description: "Approves field engagement strategy, validates session priorities, and authorizes executive-level hyperscaler engagements"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted:
    - role: "AE Agent"
      on_steps: ["account_strategy", "customer_context", "deal_positioning"]
    - role: "SA Agent"
      on_steps: ["technical_context", "demo_alignment", "architecture_validation"]
    - role: "FCTO Agent"
      on_steps: ["executive_engagement", "strategic_account_positioning"]

  informed:
    - role: "AE Agent"
      notify_on: ["session_outcome", "registration_confirmation", "field_rep_feedback"]
    - role: "Partner Agent"
      notify_on: ["field_relationship_status", "co-sell_pipeline_update"]

# ==============================================================================
# BLUEPRINT INTEGRATION
# ==============================================================================
blueprint_integration:
  required_when: "Premium track engagements, optional for Strategic Account and Platform Consolidation"
  trigger_signal: "hyperscaler_field_session"
  applicable_archetypes: "Premium track (required), Strategic Account and Platform Consolidation (optional)"

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Joint customer session scheduled with hyperscaler field rep"
    - "Opportunity registration due in ACE/Partner Center (co-sell qualified opportunity)"
    - "Field session completed (debrief trigger, within 24 hours)"
    - "Quarterly cadence review approaching for active accounts"
    - "Hyperscaler field rep engagement requested by AE or VP Alliances"

  manual:
    - "HAM requests session preparation brief for upcoming joint meeting"
    - "AE requests hyperscaler field rep introduction for a new account"
    - "VP Alliances requests field alignment review across portfolio"

  conditional:
    - "IF joint_session.status == scheduled AND session_date - today <= 5_days THEN trigger"
    - "IF cosell_qualified == true AND registration_submitted == false THEN trigger"
    - "IF joint_session.status == completed AND debrief_captured == false THEN trigger"
    - "IF last_field_session_date > 90_days AND account.status == active THEN trigger"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "{realm}/{node}/internal-infohub/cosell/opportunity_context.md"
    - artifact: "Account strategy and customer context from AE Agent"
    - artifact: "Hyperscaler field rep relationship data (name, role, region, engagement history)"
    - artifact: "Session agenda and objectives (if session scheduled)"

  optional:
    - artifact: "{realm}/{node}/internal-infohub/cosell/qualification_scorecard_{YYYY-MM-DD}.md"
      use: "Co-sell readiness context for session positioning"
    - artifact: "Previous session outcomes and debrief notes"
      use: "Continuity across field engagements"
    - artifact: "Hyperscaler solution plays and campaign priorities"
      use: "Alignment of {vendor} positioning with hyperscaler go-to-market"
    - artifact: "Customer cloud architecture overview"
      use: "Technical context for joint session preparation"

  minimum_data_threshold:
    - "Account context with customer name, industry, and primary use case"
    - "Hyperscaler field rep identified (name and role at minimum)"
    - "Clear session objective or registration purpose"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  session_preparation:
    - "What is the session type (discovery, demo, executive briefing, technical deep-dive, pipeline review)?"
    - "What are the specific objectives for this joint session?"
    - "What is the hyperscaler field rep's known priority for this account (consumption growth, migration, modernization)?"
    - "What is the ask/give balance: what do we need from the hyperscaler rep, and what do we offer them?"
    - "Are there hyperscaler solution plays or campaigns that align with this customer's use case?"

  opportunity_registration:
    - "Has this opportunity been registered in ACE or Partner Center?"
    - "What is the registration status (draft, submitted, accepted, rejected)?"
    - "Are all required registration fields populated (customer contact, deal value, close date, use case)?"
    - "Should registration happen pre-session or post-session based on program rules?"
    - "Is this a new registration or an update to an existing one (stage change, value change)?"

  debrief_capture:
    - "What commitments did the hyperscaler field rep make (follow-ups, introductions, resources)?"
    - "What customer signals emerged during the joint session?"
    - "Did the hyperscaler rep indicate deal prioritization level (champion, support, monitor)?"
    - "What follow-up actions are required from each party (vendor, hyperscaler, customer)?"

  cadence_management:
    - "What is the current engagement frequency with this hyperscaler field rep?"
    - "When was the last joint session for this account?"
    - "Are there accounts in the portfolio that have gone >90 days without field engagement?"
    - "What is the optimal cadence based on deal stage and hyperscaler rep capacity?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    # Session preparation, session scheduled within 5 days
    - condition: "session_scheduled == true AND session_date - today <= 5"
      output_type: "Initiative"
      decision: |
        CREATE Initiative:
          title: "Joint session preparation for {node} with {hyperscaler} field rep"
          owner: "HAM Agent"
          urgency: "HIGH"
          actions:
            - "Build session prep brief with talking points, objectives, and ask/give framework"
            - "Align positioning with hyperscaler solution plays relevant to customer use case"
            - "Gather technical context from SA Agent for demo or architecture discussion"
            - "Prepare account map showing {vendor} footprint and expansion whitespace"
            - "Confirm registration status: submit pre-session if not yet registered"

    # Opportunity registration overdue
    - condition: "cosell_qualified == true AND registration_submitted == false AND days_since_qualification > 5"
      severity: "MEDIUM"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Overdue co-sell registration for {node}"
          severity: "MEDIUM"
          category: "cosell_operations"
          description: "Opportunity qualified for co-sell {days_since_qualification} days ago but not yet registered in {program_portal}"

        CREATE Initiative:
          title: "Submit co-sell registration for {node}"
          owner: "HAM Agent"
          urgency: "HIGH"
          actions:
            - "Complete required registration fields from qualification scorecard"
            - "Submit opportunity in ACE/Partner Center"
            - "Confirm submission with hyperscaler field rep"
            - "Set follow-up for acceptance status check (3 business days)"

    # Session debrief not captured within 24 hours
    - condition: "session_completed == true AND debrief_captured == false AND hours_since_session > 24"
      severity: "MEDIUM"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Debrief overdue for {node} joint session"
          severity: "MEDIUM"
          category: "cosell_operations"
          description: "Joint session completed {hours_since_session} hours ago without debrief capture"

        CREATE Initiative:
          title: "Capture session debrief for {node}"
          owner: "HAM Agent"
          urgency: "IMMEDIATE"
          actions:
            - "Gather session notes from attendees (HAM, AE, SA if present)"
            - "Document hyperscaler rep commitments and follow-ups"
            - "Record customer signals and prioritization indicators"
            - "Update opportunity registration with session outcome if applicable"
            - "Share debrief summary with AE Agent for deal strategy integration"

    # Cadence gap detected
    - condition: "days_since_last_session > 90 AND account_status == active"
      severity: "LOW"
      output_type: "Initiative"
      decision: |
        CREATE Initiative:
          title: "Re-engage hyperscaler field alignment for {node}"
          owner: "HAM Agent"
          actions:
            - "Review current deal status and pipeline for this account"
            - "Identify relevant hyperscaler solution play or campaign hook"
            - "Propose joint session to hyperscaler field rep with clear agenda"
            - "Coordinate scheduling with AE and customer stakeholders"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/cosell/field_alignment_{YYYY-MM-DD}.md"
    format: "markdown"
    sections:
      - executive_summary
      - session_preparation
      - opportunity_registration
      - session_debrief
      - cadence_status

    schema:
      executive_summary:
        - alignment_status: "enum[ACTIVE|CADENCE_GAP|NO_FIELD_REP|PENDING_SESSION]"
        - hyperscaler: "enum[AWS|AZURE|GCP]"
        - field_rep_name: "string"
        - last_session_date: "string (YYYY-MM-DD)|null"
        - next_session_date: "string (YYYY-MM-DD)|null"
        - registration_status: "enum[NOT_REGISTERED|DRAFT|SUBMITTED|ACCEPTED|REJECTED]"

      session_preparation:
        - session_type: "enum[DISCOVERY|DEMO|EXECUTIVE_BRIEFING|TECHNICAL_DEEPDIVE|PIPELINE_REVIEW]"
        - objectives: "array[string]"
        - talking_points: "array[string]"
        - ask_from_hyperscaler: "array[string] (what we need from the field rep)"
        - give_to_hyperscaler: "array[string] (what we provide to the field rep)"
        - solution_play_alignment: "string (hyperscaler campaign or solution play)"
        - attendees_vendor: "array[string]"
        - attendees_hyperscaler: "array[string]"
        - attendees_customer: "array[string]"

      opportunity_registration:
        - registration_id: "string|null"
        - portal: "enum[ACE|PARTNER_CENTER|PARTNER_ADVANTAGE]"
        - status: "enum[NOT_REGISTERED|DRAFT|SUBMITTED|ACCEPTED|REJECTED]"
        - submitted_date: "string (YYYY-MM-DD)|null"
        - acceptance_date: "string (YYYY-MM-DD)|null"
        - rejection_reason: "string|null"
        - required_fields_complete: "boolean"

      session_debrief:
        - session_date: "string (YYYY-MM-DD)"
        - session_type: "string"
        - key_outcomes: "array[string]"
        - hyperscaler_commitments: "array[string]"
        - customer_signals: "array[string]"
        - follow_up_actions:
          - owner: "string"
            action: "string"
            due_date: "string (YYYY-MM-DD)"
        - hyperscaler_priority_level: "enum[CHAMPION|SUPPORT|MONITOR|UNKNOWN]"

      cadence_status:
        - current_frequency: "enum[WEEKLY|BIWEEKLY|MONTHLY|QUARTERLY|INACTIVE]"
        - sessions_this_quarter: "number"
        - target_cadence: "enum[WEEKLY|BIWEEKLY|MONTHLY|QUARTERLY]"
        - cadence_health: "enum[ON_TRACK|BELOW_TARGET|INACTIVE]"

  decision_objects:
    path: "{realm}/{node}/internal-infohub/cosell/decisions/"
    create_if:
      - "Session strategy selected (type, positioning, ask/give)"
      - "Registration timing decision (pre-session vs. post-session)"
    template: "ADR format"

  risk_objects:
    path: "{realm}/{node}/internal-infohub/cosell/risks/"
    create_if:
      - "Registration overdue"
      - "Debrief not captured within SLA"
      - "Cadence gap exceeds 90 days on active account"
      - "Registration rejected by hyperscaler"
    template: "Risk with mitigation plan"

  initiative_objects:
    path: "{realm}/{node}/internal-infohub/cosell/initiatives/"
    create_if:
      - "Session preparation required"
      - "Registration submission needed"
      - "Debrief capture pending"
      - "Cadence re-engagement planned"
    template: "Initiative with actions, owner, timeline"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Field alignment update for {node}: {alignment_status} with {hyperscaler} field rep"

    - recipient: "AE Agent"
      condition: "session_debrief_captured == true"
      message: "Joint session debrief for {node}: {key_outcomes_summary}, hyperscaler priority: {priority_level}"

    - recipient: "AE Agent"
      condition: "registration_rejected == true"
      message: "Co-sell registration rejected for {node}: {rejection_reason}"

    - recipient: "VP Alliances"
      condition: "cadence_gap > 90 AND account_tier == strategic"
      message: "Strategic account {node} has not had hyperscaler field engagement in {days} days"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "no_hyperscaler_field_rep_assigned"
      reason: "Cannot conduct field alignment without an identified hyperscaler field representative"
      action: "VP Alliances to request field rep assignment from hyperscaler partner manager"

    - condition: "customer_declines_hyperscaler_involvement"
      reason: "Customer does not want hyperscaler participation in the sales process"
      action: "AE to document customer objection and determine if indirect co-sell is possible"

    - condition: "registration_rejected_twice"
      reason: "Repeated registration rejection indicates systemic eligibility issue"
      action: "VP Alliances to engage hyperscaler partner manager to resolve registration blockers"

    - condition: "executive_engagement_requested"
      reason: "Executive-level hyperscaler engagement requires VP Alliances involvement"
      action: "VP Alliances to coordinate executive-to-executive hyperscaler session"

  insufficient_data:
    - "No account context available (customer name, industry, use case unknown)"
    - "No hyperscaler field rep identified for the account region"
    - "No session agenda or objectives defined"
    - "No co-sell qualification scorecard available (cannot assess registration readiness)"

  ambiguity_signals:
    - "Hyperscaler field rep engagement level unclear (champion vs. passive vs. disengaged)"
    - "Multiple hyperscaler field reps with overlapping account coverage"
    - "Session objectives conflict between vendor goals and hyperscaler rep priorities"

  human_judgment_required:
    - "Selecting session type when multiple formats could apply"
    - "Balancing ask/give with hyperscaler field rep (relationship capital management)"
    - "Determining registration timing (pre-session builds credibility, post-session captures validated data)"
    - "Interpreting hyperscaler rep body language and verbal signals during session debrief"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "client_id exists in InfoHub"
    - "Hyperscaler field rep identified with contact information"
    - "Account in active sales cycle or expansion discussion"

  post_execution:
    - "Session prep brief includes objectives, talking points, and ask/give framework"
    - "Registration status documented with portal, submission date, and field completion"
    - "Debrief captured within 24 hours of session completion"
    - "Cadence status updated with current frequency and target"

  output_quality:
    - "Session prep talking points are specific to this account, not generic co-sell templates"
    - "Ask/give framework is balanced (not all ask, demonstrates value to hyperscaler rep)"
    - "Debrief commitments include owner, action, and due date for each follow-up"
    - "Registration fields are complete and accurate (no placeholder values)"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "5-10 minutes (agent) + 20-30 minutes (human review and session prep)"
frequency: "Per-session (triggered by scheduling) + quarterly cadence review"
human_review_required: true
approval_workflow:
  - reviewer: "AE Agent"
    approval_gate: "Validate account strategy alignment, customer context accuracy, and session objectives"
  - reviewer: "VP Alliances"
    condition: "executive_engagement == true OR strategic_account == true"
    approval_gate: "Approve executive-level field engagement and hyperscaler relationship investment"
  - reviewer: "SA Agent"
    condition: "session_type == DEMO OR session_type == TECHNICAL_DEEPDIVE"
    approval_gate: "Validate technical content and architecture context for joint session"

