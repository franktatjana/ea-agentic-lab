# disclaimer
# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (AWS ACE, Azure Partner Center,
# GCP Partner Advantage, committed spend programs,
# etc.) are industry-standard programs cited for
# educational context.

# PLAYBOOK: Co-sell Program Health Review
# Framework operationalization for AI agents

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_HAM_004"
framework_name: "Co-sell Program Health Review"
framework_source: "Partner Program Management / Committed Spend Analytics"
intended_agent_role: "ham-agent"
intended_sub_agent: "ham-program-health-agent"
secondary_agents:
  - "Partner Agent provides overall partner program context"
  - "FCTO Agent provides cross-account program utilization patterns"
playbook_mode: "ANALYTICAL"
playbook_category: "cosell_operations"

primary_objective: "Monitor co-sell program health across hyperscalers including registered pipeline review, closed transaction analysis, committed spend (EDP/MACC/CUD) burn rate tracking, co-sell incentive utilization, and program tier status"

vault_routing:
  primary_vault: "Global Knowledge Vault"
  rationale: "Program health data is cross-account, covering portfolio-level metrics, program tier standing, and incentive utilization that inform partnership strategy rather than individual deal tactics."

when_not_to_use:
  - "No active hyperscaler co-sell programs (no ACE, Partner Center, or Partner Advantage registrations)"
  - "Committed spend data unavailable from hyperscaler portals"
  - "Program review period has fewer than 5 registered opportunities (insufficient data for meaningful analysis)"
  - "Hyperscaler partnership is in initial onboarding phase (no historical data for trend analysis)"

raci:
  responsible:
    role: "HAM Agent"
    agent: "ham-program-health-agent"
    description: "Calculates program health metrics, tracks committed spend burn rates, monitors incentive utilization, and assesses program tier standing across hyperscalers"

  accountable:
    role: "VP Alliances"
    human_required: true
    description: "Validates program health assessment, approves corrective actions, and makes strategic decisions on program investment"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted:
    - role: "Partner Agent"
      on_steps: ["program_strategy", "tier_requirements", "partnership_investment"]
    - role: "FCTO Agent"
      on_steps: ["cross_account_utilization_patterns", "strategic_program_recommendations"]

  informed:
    - role: "Sales Leadership"
      notify_on: ["program_revenue_milestone", "tier_risk", "committed_spend_shortfall"]
    - role: "Finance"
      notify_on: ["committed_spend_burn_report", "incentive_revenue"]
    - role: "AE Teams"
      notify_on: ["tier_status_change", "incentive_eligibility_update"]

# ==============================================================================
# BLUEPRINT INTEGRATION
# ==============================================================================
blueprint_integration:
  required_when: "Standalone periodic review, not engagement-specific"
  trigger_signal: "scheduled_periodic"
  applicable_archetypes: "Runs on schedule, applies across all engagement archetypes with hyperscaler involvement"

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "Monthly scheduled review (first business day of each month)"
    - "Committed spend burn rate below 60% at quarter midpoint"
    - "Co-sell incentive utilization below target threshold"
    - "Program tier review period approaching (annual tier assessment)"
    - "Closed marketplace transaction milestone (10th, 25th, 50th transaction)"

  manual:
    - "VP Alliances requests program health dashboard for executive review"
    - "Quarterly business review preparation with hyperscaler partner team"
    - "Annual partnership planning requires program health baseline"

  conditional:
    - "IF committed_spend_burn_rate < 60 AND quarter_progress >= 50% THEN trigger"
    - "IF incentive_utilization < target_threshold THEN trigger"
    - "IF days_until_tier_review <= 30 THEN trigger"
    - "IF month_start == true THEN trigger (monthly scheduled)"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "ACE/Partner Center registered pipeline data (all active registrations)"
    - artifact: "Closed marketplace transaction records (current period and prior period)"
    - artifact: "Committed spend contracts and consumption data (EDP, MACC, CUD)"
    - artifact: "Co-sell incentive program details and utilization data"

  optional:
    - artifact: "Program tier criteria and current standing per hyperscaler"
      use: "Tier risk assessment and upgrade/downgrade projection"
    - artifact: "Historical program health reports"
      use: "Trend analysis and period-over-period comparison"
    - artifact: "Hyperscaler partner manager feedback"
      use: "Qualitative program health signals"
    - artifact: "Cross-hyperscaler revenue attribution data"
      use: "Portfolio-level program ROI analysis"

  minimum_data_threshold:
    - "At least one active hyperscaler program with registered pipeline"
    - "At least one month of committed spend consumption data"
    - "Program tier criteria documented for current tier standing"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  pipeline_health:
    - "What is the total registered co-sell pipeline by hyperscaler (AWS ACE, Azure Partner Center, GCP Partner Advantage)?"
    - "What is the registration acceptance rate by hyperscaler (accepted / submitted)?"
    - "What is the pipeline stage distribution (early stage vs. committed vs. closed)?"
    - "How does current pipeline compare to same period last quarter (growth/decline trend)?"
    - "What are the top rejection reasons and how can they be addressed?"

  transaction_analysis:
    - "How many marketplace transactions closed this period by hyperscaler?"
    - "What is the total marketplace transaction value and average deal size?"
    - "What is marketplace revenue as a percentage of total bookings?"
    - "What is the average cycle time from private offer creation to customer acceptance?"
    - "How many transactions were CPPO vs. direct private offer?"

  committed_spend_health:
    - "What is the current burn rate for each active committed spend program (EDP, MACC, CUD)?"
    - "Is burn rate on track for the commitment period (green >80%, yellow 60-80%, red <60%)?"
    - "What is the projected end-of-period burn rate at current consumption velocity?"
    - "Are there accounts with underburn that could benefit from marketplace transactions?"
    - "Are there committed spend programs approaching renewal that need consumption acceleration?"

  incentive_and_tier_health:
    - "What co-sell incentives are available and what is the utilization rate?"
    - "Are there unclaimed incentives approaching deadline?"
    - "What is current program tier standing per hyperscaler?"
    - "Is the organization at risk of tier downgrade based on current metrics?"
    - "What metrics need improvement to achieve tier upgrade?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    # Healthy program, all metrics green
    - condition: "burn_rate >= 80 AND acceptance_rate >= 70 AND incentive_utilization >= 75"
      output_type: "Decision"
      decision: |
        CREATE Decision:
          title: "Co-sell program health GREEN across {hyperscaler_count} hyperscalers"
          context: "Burn rate {burn_rate}%, acceptance rate {acceptance_rate}%, incentive utilization {incentive_util}%"
          decision: "Maintain current program execution, pursue tier upgrade opportunities"
          actions:
            - "Document program health for quarterly hyperscaler partner review"
            - "Identify tier upgrade criteria gaps and build action plan"
            - "Share program success metrics with Sales Leadership"
            - "Explore additional incentive programs for eligible deals"

    # Committed spend burn rate critical
    - condition: "burn_rate < 60 AND quarter_progress >= 50"
      severity: "HIGH"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Committed spend shortfall risk for {program_type}"
          severity: "HIGH"
          category: "cosell_operations"
          description: "Burn rate {burn_rate}% at {quarter_progress}% through the quarter, projected shortfall of {shortfall_amount}"

        CREATE Initiative:
          title: "Committed spend acceleration program"
          owner: "HAM Agent + VP Alliances"
          urgency: "IMMEDIATE"
          actions:
            - "Identify all marketplace-eligible opportunities in current pipeline"
            - "Prioritize deals with customers who have active committed spend programs"
            - "Coordinate with AE teams to position marketplace as procurement channel"
            - "Engage hyperscaler partner manager on consumption acceleration resources"
            - "Escalate to VP Alliances for executive intervention if burn rate <50%"

    # Low acceptance rate indicates qualification issues
    - condition: "acceptance_rate < 50"
      severity: "MEDIUM"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Low co-sell acceptance rate: {acceptance_rate}%"
          severity: "MEDIUM"
          category: "cosell_operations"
          description: "Acceptance rate below 50% damages hyperscaler relationship and wastes field rep engagement capital"

        CREATE Initiative:
          title: "Improve co-sell registration quality"
          actions:
            - "Analyze top rejection reasons across last 90 days"
            - "Update qualification criteria in PB_HAM_001 based on rejection patterns"
            - "Conduct registration quality audit on pending submissions"
            - "Schedule training session with AE teams on co-sell eligibility requirements"
            - "Engage hyperscaler partner manager for feedback on registration quality"

    # Incentives going unclaimed
    - condition: "unclaimed_incentives > 0 AND incentive_deadline_days <= 30"
      severity: "MEDIUM"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Unclaimed co-sell incentives approaching deadline"
          severity: "MEDIUM"
          category: "cosell_operations"
          description: "{unclaimed_count} incentives worth {unclaimed_value} expiring in {incentive_deadline_days} days"

        CREATE Initiative:
          title: "Incentive claim acceleration"
          actions:
            - "Identify all eligible deals for unclaimed incentives"
            - "Validate claim requirements (registration, transaction proof, documentation)"
            - "Submit claims for all qualified transactions"
            - "Notify AE teams of incentive-eligible deals in pipeline"

    # Tier downgrade risk
    - condition: "tier_risk == HIGH AND days_until_tier_review <= 60"
      severity: "HIGH"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Program tier downgrade risk for {hyperscaler}"
          severity: "HIGH"
          category: "cosell_operations"
          description: "Current metrics fall below tier maintenance thresholds, review in {days_until_tier_review} days"

        CREATE Initiative:
          title: "Tier maintenance action plan for {hyperscaler}"
          owner: "VP Alliances + HAM Agent"
          urgency: "HIGH"
          actions:
            - "Map current metrics against tier requirements with gap analysis"
            - "Prioritize highest-impact metric improvements"
            - "Engage hyperscaler partner manager on tier review timeline and flexibility"
            - "Accelerate co-sell registrations and marketplace transactions to boost metrics"
            - "Prepare tier review presentation with improvement trajectory"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "global-knowledge-vault/cosell/program_health_{YYYY-MM-DD}.md"
    format: "markdown"
    sections:
      - executive_summary
      - per_hyperscaler_scorecard
      - committed_spend_burn
      - incentive_utilization
      - tier_assessment
      - cross_hyperscaler_comparison
      - recommendations

    schema:
      executive_summary:
        - overall_program_health: "enum[GREEN|YELLOW|RED]"
        - total_registered_pipeline: "number (USD)"
        - total_marketplace_revenue: "number (USD)"
        - aggregate_burn_rate: "number (percentage)"
        - incentive_utilization_rate: "number (percentage)"
        - key_risks: "array[string]"
        - period: "string (e.g., 'Q1 2026' or 'March 2026')"

      per_hyperscaler_scorecard:
        aws:
          registered_pipeline: "number (USD)"
          acceptance_rate: "number (percentage)"
          closed_transactions: "number (count)"
          transaction_value: "number (USD)"
          edp_burn_rate: "number (percentage)|null"
          isv_accelerate_status: "string"
          health: "enum[GREEN|YELLOW|RED]"
        azure:
          registered_pipeline: "number (USD)"
          acceptance_rate: "number (percentage)"
          closed_transactions: "number (count)"
          transaction_value: "number (USD)"
          macc_burn_rate: "number (percentage)|null"
          ip_cosell_status: "string"
          health: "enum[GREEN|YELLOW|RED]"
        gcp:
          registered_pipeline: "number (USD)"
          acceptance_rate: "number (percentage)"
          closed_transactions: "number (count)"
          transaction_value: "number (USD)"
          cud_burn_rate: "number (percentage)|null"
          partner_advantage_tier: "string"
          health: "enum[GREEN|YELLOW|RED]"

      committed_spend_burn:
        programs:
          - type: "enum[EDP|MACC|CUD]"
            hyperscaler: "enum[AWS|AZURE|GCP]"
            total_commitment: "number (USD)"
            consumed_to_date: "number (USD)"
            burn_rate: "number (percentage)"
            projection_end_of_period: "number (percentage)"
            health: "enum[GREEN|YELLOW|RED]"
            accounts_contributing: "number (count)"
            recommendation: "string"

      incentive_utilization:
        - program_name: "string"
          hyperscaler: "enum[AWS|AZURE|GCP]"
          total_available: "number (USD)"
          claimed: "number (USD)"
          utilization_rate: "number (percentage)"
          unclaimed_expiring_30d: "number (USD)"
          eligible_deals_in_pipeline: "number (count)"

      tier_assessment:
        - hyperscaler: "enum[AWS|AZURE|GCP]"
          current_tier: "string"
          tier_criteria_met: "array[string]"
          tier_criteria_gaps: "array[string]"
          risk_level: "enum[SECURE|AT_RISK|CRITICAL]"
          next_review_date: "string (YYYY-MM-DD)"
          upgrade_eligible: "boolean"

      cross_hyperscaler_comparison:
        - metric: "string"
          aws_value: "string"
          azure_value: "string"
          gcp_value: "string"
          trend: "string"

  decision_objects:
    path: "global-knowledge-vault/cosell/decisions/"
    create_if:
      - "Program health green, pursue tier upgrade"
      - "Strategic program investment decision required"
    template: "ADR format"

  risk_objects:
    path: "global-knowledge-vault/cosell/risks/"
    create_if:
      - "Committed spend burn rate below threshold"
      - "Low acceptance rate trend"
      - "Incentives approaching expiration"
      - "Tier downgrade risk"
    template: "Risk with mitigation plan"

  initiative_objects:
    path: "global-knowledge-vault/cosell/initiatives/"
    create_if:
      - "Committed spend acceleration needed"
      - "Registration quality improvement required"
      - "Incentive claim acceleration"
      - "Tier maintenance action plan"
    template: "Initiative with actions, owner, timeline"

  notifications:
    - recipient: "VP Alliances"
      condition: "always"
      message: "Co-sell program health report: {overall_health}, pipeline {total_pipeline}, burn rate {aggregate_burn_rate}%"

    - recipient: "VP Alliances"
      condition: "burn_rate < 60 AND quarter_progress >= 50"
      message: "CRITICAL: Committed spend burn rate {burn_rate}% at quarter midpoint, projected shortfall {shortfall_amount}"

    - recipient: "Sales Leadership"
      condition: "tier_risk == HIGH"
      message: "Program tier downgrade risk for {hyperscaler}: review in {days_until_review} days"

    - recipient: "Finance"
      condition: "always"
      message: "Committed spend burn report: {program_count} programs, aggregate burn rate {aggregate_burn_rate}%"

    - recipient: "AE Teams"
      condition: "incentive_eligibility_update == true"
      message: "Co-sell incentive update: {eligible_count} deals eligible for {incentive_program}"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "committed_spend_burn_below_50_at_quarter_end"
      reason: "Severe committed spend shortfall requires executive intervention with hyperscaler"
      action: "VP Alliances to engage hyperscaler executive sponsor for consumption acceleration or commitment restructuring"

    - condition: "tier_downgrade_imminent"
      reason: "Tier downgrade affects program benefits, incentive eligibility, and field support levels"
      action: "VP Alliances to negotiate tier review extension or present improvement plan to hyperscaler"

    - condition: "acceptance_rate_below_30"
      reason: "Persistent low acceptance rate indicates fundamental misalignment with program criteria"
      action: "VP Alliances to meet with hyperscaler partner manager for program criteria recalibration"

  insufficient_data:
    - "No ACE/Partner Center pipeline data available"
    - "No committed spend consumption reports from hyperscaler portals"
    - "No closed transaction records for the review period"
    - "No program tier criteria documentation available"

  ambiguity_signals:
    - "Consumption data from hyperscaler portal conflicts with internal tracking"
    - "Incentive eligibility criteria changed mid-period"
    - "Tier review criteria updated without formal communication"

  human_judgment_required:
    - "Interpreting qualitative hyperscaler partner manager feedback on program standing"
    - "Deciding program investment priority when multiple hyperscalers compete for resources"
    - "Assessing strategic vs. financial value of maintaining program tier"
    - "Determining whether to accelerate consumption or renegotiate committed spend terms"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "At least one active hyperscaler program with registered pipeline"
    - "Committed spend consumption data available for current period"
    - "Review period defined (monthly or quarterly)"

  post_execution:
    - "Per-hyperscaler scorecard generated for all active programs"
    - "Committed spend burn rate calculated with projection"
    - "Incentive utilization tracked with expiration warnings"
    - "Tier assessment completed with gap analysis"
    - "Cross-hyperscaler comparison table populated"

  output_quality:
    - "All metrics cite data source (ACE portal, Partner Center, consumption API)"
    - "Burn rate calculations include projection methodology (linear, weighted, seasonal)"
    - "Trend analysis compares to prior period, not absolute assessment"
    - "Recommendations are actionable with owner and timeline"
    - "No aggregated metrics without per-hyperscaler breakdown"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "5-10 minutes (agent) + 30-45 minutes (human review and strategy discussion)"
frequency: "Monthly (scheduled) + triggered by threshold breaches + quarterly deep-dive"
human_review_required: true
approval_workflow:
  - reviewer: "VP Alliances"
    approval_gate: "Validate program health assessment, approve corrective actions, and confirm strategic program priorities"
  - reviewer: "Finance"
    condition: "committed_spend_shortfall_projected == true"
    approval_gate: "Review committed spend burn projections and financial impact of shortfall"
  - reviewer: "Partner Agent"
    condition: "tier_risk == HIGH"
    approval_gate: "Assess tier risk impact on overall partner program strategy"

