# disclaimer
# This playbook is part of a reference architecture
# framework. It defines agent behavior specifications,
# not production-ready operational procedures.
# Framework references (AWS ACE, Azure Partner Center,
# GCP Partner Advantage, etc.) are industry-standard
# programs cited for educational context.

# PLAYBOOK: Co-sell Opportunity Qualification
# Framework operationalization for AI agents

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_HAM_001"
framework_name: "Co-sell Opportunity Qualification"
framework_source: "AWS ACE Program / Azure Partner Center / Google Cloud Partner Advantage"
intended_agent_role: "ham-agent"
intended_sub_agent: "ham-cosell-qualification-agent"
secondary_agents:
  - "AE Agent provides deal context and customer relationship"
  - "AA Agent validates technical readiness for co-sell"
  - "FCTO Agent provides strategic positioning for marquee deals"
playbook_mode: "ANALYTICAL"
playbook_category: "cosell_operations"

primary_objective: "Qualify opportunities for hyperscaler co-sell programs by assessing eligibility, readiness, and program fit across AWS ACE, Azure Partner Center, and GCP Partner Advantage, with committed spend applicability and incentive optimization"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Co-sell qualification contains deal-specific commercial data including committed spend positions, program incentive eligibility, and hyperscaler-internal registration details."
  secondary_outputs:
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized qualification patterns, acceptance rate benchmarks, and program fit heuristics (after engagement closes)"

when_not_to_use:
  - "No hyperscaler relationship exists for this account"
  - "Customer explicitly refuses hyperscaler involvement in the procurement process"
  - "Deal value below hyperscaler co-sell minimum threshold ($25K ARR for ACE, varies by program)"
  - "Pure renewal with no expansion or consumption component"
  - "Customer procurement is locked to a single vendor contract vehicle that excludes marketplace"

raci:
  responsible:
    role: "HAM Agent"
    agent: "ham-cosell-qualification-agent"
    description: "Assesses co-sell eligibility across hyperscaler programs, scores readiness, validates committed spend applicability, and recommends optimal program routing"

  accountable:
    role: "VP Alliances"
    human_required: true
    description: "Approves co-sell qualification strategy, validates program fit recommendations, and authorizes hyperscaler field engagement"
    approval_actions:
      - "approve"
      - "request_revision"
      - "escalate"

  consulted:
    - role: "AE Agent"
      on_steps: ["deal_context", "customer_relationship", "pricing_terms"]
    - role: "AA Agent"
      on_steps: ["technical_readiness", "architecture_validation", "listing_status"]
    - role: "FCTO Agent"
      on_steps: ["strategic_positioning", "executive_engagement_for_marquee_deals"]

  informed:
    - role: "AE Agent"
      notify_on: ["qualification_complete", "readiness_score_below_threshold"]
    - role: "Partner Agent"
      notify_on: ["cosell_pipeline_update", "cppo_routing_needed"]
    - role: "Sales Leadership"
      notify_on: ["cosell_revenue_milestone", "program_tier_impact"]

# ==============================================================================
# BLUEPRINT INTEGRATION
# ==============================================================================
blueprint_integration:
  required_when: "Hyperscaler co-sell involved in any engagement archetype"
  trigger_signal: "hyperscaler_cosell"
  applicable_archetypes: "All archetypes where cloud consumption or marketplace procurement applies"

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - "New opportunity created with hyperscaler involvement flagged in CRM"
    - "Deal stage advance where cloud consumption component identified"
    - "Committed spend program enrollment detected (EDP, MACC, CUD)"
    - "ACE or Partner Center pipeline review cycle (monthly)"
    - "Customer cloud consumption data update indicates marketplace eligibility"

  manual:
    - "AE requests co-sell qualification for a specific opportunity"
    - "Hyperscaler field rep requests co-sell registration"
    - "VP Alliances requests portfolio-level co-sell qualification review"

  conditional:
    - "IF opportunity.cloud_component == true AND opportunity.stage >= 2 THEN trigger"
    - "IF customer.committed_spend_program_active == true THEN trigger"
    - "IF hyperscaler_field_rep.engagement_requested == true THEN trigger"
    - "IF deal_value > 100000 AND marketplace_route_possible == true THEN trigger"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "{realm}/{node}/internal-infohub/cosell/opportunity_context.md"
    - artifact: "CRM opportunity data (deal value, stage, products, timeline)"
    - artifact: "Hyperscaler program eligibility criteria (ACE rules, Partner Center requirements, Partner Advantage criteria)"
    - artifact: "Customer cloud relationship data (which hyperscalers, consumption level, committed spend status)"

  optional:
    - artifact: "{realm}/{node}/internal-infohub/cosell/committed_spend_status.md"
      use: "Committed spend (EDP/MACC/CUD) position and burn rate"
    - artifact: "ACE/Partner Center registration history"
      use: "Historical acceptance rates and rejection reasons"
    - artifact: "Marketplace listing status"
      use: "Current listing health for marketplace transaction readiness"
    - artifact: "Hyperscaler field rep relationship data"
      use: "Field engagement context for qualification priority"

  minimum_data_threshold:
    - "Confirmed opportunity with deal value and product scope"
    - "At least one hyperscaler relationship identified for the account"
    - "Customer consent for hyperscaler co-sell engagement (or no explicit refusal)"

# ==============================================================================
# KEY QUESTIONS TO EXTRACT
# ==============================================================================
key_questions:
  program_eligibility:
    - "Which hyperscaler programs is this opportunity eligible for (ACE, Partner Center referral, Partner Advantage co-sell)?"
    - "Does the deal meet minimum ARR thresholds for each program ($25K ACE, varies Azure/GCP)?"
    - "Is the {vendor} listing currently co-sell ready or co-sell eligible in Partner Center?"
    - "Does the customer have an active cloud agreement with the relevant hyperscaler?"
    - "Are all required registration fields available (customer contact, use case, timeline)?"

  readiness_assessment:
    - "Is the marketplace listing validated and current for the relevant hyperscaler?"
    - "Has the customer provided consent for hyperscaler engagement (required for ACE)?"
    - "Is there an identified hyperscaler field rep for this account/region?"
    - "Does the technical architecture align with the hyperscaler's solution plays?"
    - "Are there any blockers in listing status, pricing, or procurement path?"

  committed_spend_applicability:
    - "Does the customer have an active EDP (AWS), MACC (Azure), or CUD (GCP) commitment?"
    - "What is the current burn rate against the committed spend baseline?"
    - "Is marketplace procurement a viable route to draw down committed spend?"
    - "What is the remaining commitment balance and time horizon?"

  incentive_optimization:
    - "Which program yields the best incentive outcome for this deal (referral fee, co-sell credit, marketplace benefit)?"
    - "Is the deal eligible for AWS ISV Accelerate co-sell benefits?"
    - "Does the deal qualify for Azure IP Co-sell incentive (MACC-eligible listing required)?"
    - "Are there time-sensitive incentive windows approaching deadline?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    # Fully eligible across at least one program
    - condition: "eligibility_score >= 80 AND readiness_dimensions_all_green == true"
      output_type: "Decision + Initiative"
      decision: |
        CREATE Decision:
          title: "Co-sell qualified for {node} via {program_name}"
          context: "Eligibility score {score}/100, all readiness dimensions green, committed spend applicable"
          decision: "Proceed with co-sell registration in {program_portal}"
          actions:
            - "Submit opportunity registration in ACE/Partner Center with pre-filled fields"
            - "Notify hyperscaler field rep of co-sell registration"
            - "Prepare co-sell brief for AE with hyperscaler context"
          stakeholders: ["AE", "Hyperscaler Field Rep", "VP Alliances"]

        CREATE Initiative:
          title: "Co-sell registration and field engagement for {node}"
          owner: "HAM Agent"
          timeline: "Within 5 business days"

    # Partially eligible, needs remediation
    - condition: "eligibility_score >= 50 AND eligibility_score < 80"
      severity: "MEDIUM"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Co-sell readiness gaps for {node}"
          severity: "MEDIUM"
          category: "cosell_operations"
          description: "Eligibility score {score}/100 with gaps in {failing_dimensions}"

        CREATE Initiative:
          title: "Remediate co-sell readiness for {node}"
          actions:
            - "Address specific readiness gaps: {gap_list}"
            - "Validate marketplace listing status with AA Agent"
            - "Obtain customer consent for hyperscaler engagement if missing"
            - "Re-assess eligibility after remediation (target: 5 business days)"

    # Not eligible for any program
    - condition: "eligibility_score < 50 OR no_hyperscaler_relationship == true"
      severity: "LOW"
      output_type: "Decision"
      decision: |
        CREATE Decision:
          title: "Co-sell not viable for {node}"
          context: "Eligibility score {score}/100, deal does not meet program criteria"
          decision: "Do not pursue co-sell registration at this time"
          actions:
            - "Document disqualification reasons for AE"
            - "Identify future eligibility path if applicable"
            - "Assess alternative procurement routes (direct, reseller)"
          rationale: "Submitting ineligible opportunities damages hyperscaler acceptance rate metrics"

    # Committed spend opportunity with burn rate risk
    - condition: "committed_spend_active == true AND burn_rate < 70"
      severity: "HIGH"
      output_type: "Risk + Initiative"
      decision: |
        CREATE Risk:
          title: "Committed spend underburn creates urgency for {node}"
          severity: "HIGH"
          category: "cosell_operations"
          description: "Customer committed spend burn rate at {burn_rate}%, marketplace transaction could accelerate draw-down"

        CREATE Initiative:
          title: "Marketplace acceleration for committed spend draw-down at {node}"
          actions:
            - "Position marketplace transaction as committed spend draw-down vehicle"
            - "Prepare burn rate analysis for customer cloud/platform team"
            - "Coordinate with AE to align deal timing with spend commitment"
            - "Engage hyperscaler field rep with spend urgency narrative"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/cosell/qualification_scorecard_{YYYY-MM-DD}.md"
    format: "markdown"
    sections:
      - executive_summary
      - per_program_eligibility
      - readiness_dimensions
      - committed_spend_analysis
      - incentive_optimization
      - recommendation
      - registration_package

    schema:
      executive_summary:
        - overall_readiness: "enum[QUALIFIED|NEEDS_REMEDIATION|NOT_VIABLE]"
        - recommended_program: "string (ACE, Partner Center, Partner Advantage)"
        - eligibility_score: "number (0-100)"
        - key_blockers: "array[string]"

      per_program_eligibility:
        aws_ace:
          eligible: "boolean"
          score: "number (0-100)"
          gaps: "array[string]"
          isv_accelerate_eligible: "boolean"
        azure_partner_center:
          eligible: "boolean"
          score: "number (0-100)"
          gaps: "array[string]"
          ip_cosell_eligible: "boolean"
          macc_eligible: "boolean"
        gcp_partner_advantage:
          eligible: "boolean"
          score: "number (0-100)"
          gaps: "array[string]"

      readiness_dimensions:
        listing_status:
          status: "enum[GREEN|YELLOW|RED]"
          detail: "string"
        customer_consent:
          status: "enum[GREEN|YELLOW|RED]"
          detail: "string"
        technical_fit:
          status: "enum[GREEN|YELLOW|RED]"
          detail: "string"
        field_rep_availability:
          status: "enum[GREEN|YELLOW|RED]"
          detail: "string"
        committed_spend_applicability:
          status: "enum[GREEN|YELLOW|RED]"
          detail: "string"

      committed_spend_analysis:
        program_type: "enum[EDP|MACC|CUD|NONE]"
        total_commitment: "number (USD)"
        consumed_to_date: "number (USD)"
        burn_rate_percentage: "number"
        remaining_balance: "number (USD)"
        commitment_end_date: "string (YYYY-MM-DD)"
        marketplace_draw_down_applicable: "boolean"

      incentive_optimization:
        recommended_program: "string"
        estimated_incentive_value: "number (USD)|null"
        incentive_type: "string (referral fee, co-sell credit, marketplace benefit)"
        claim_deadline: "string (YYYY-MM-DD)|null"

  decision_objects:
    path: "{realm}/{node}/internal-infohub/cosell/decisions/"
    create_if:
      - "Co-sell qualified (proceed with registration)"
      - "Co-sell not viable (document reasons)"
      - "Committed spend urgency (accelerate marketplace)"
    template: "ADR format"

  risk_objects:
    path: "{realm}/{node}/internal-infohub/cosell/risks/"
    create_if:
      - "Readiness gaps require remediation"
      - "Committed spend burn rate below threshold"
      - "Incentive claim deadline approaching"
    template: "Risk with mitigation plan"

  initiative_objects:
    path: "{realm}/{node}/internal-infohub/cosell/initiatives/"
    create_if:
      - "Co-sell registration required"
      - "Readiness remediation needed"
      - "Committed spend acceleration opportunity"
    template: "Initiative with actions, owner, timeline"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Co-sell qualification complete for {node}: {readiness_status}, recommended program: {program_name}"

    - recipient: "AE Agent"
      condition: "readiness_status == NOT_VIABLE"
      message: "Co-sell not viable for {node}: {disqualification_reasons}"

    - recipient: "Partner Agent"
      condition: "cppo_routing_needed == true"
      message: "CPPO routing required for {node} co-sell via {program_name}"

    - recipient: "Sales Leadership"
      condition: "committed_spend_burn_rate < 60"
      message: "Committed spend urgency at {node}: burn rate {burn_rate}%, marketplace transaction recommended"

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "no_hyperscaler_relationship_for_account"
      reason: "Cannot qualify co-sell without an established hyperscaler relationship"
      action: "VP Alliances to determine if hyperscaler relationship development is warranted"

    - condition: "customer_refuses_hyperscaler_involvement"
      reason: "Customer has explicitly declined hyperscaler co-sell engagement"
      action: "AE to explore alternative procurement routes and document customer objection"

    - condition: "conflicting_program_eligibility (eligible for multiple programs with trade-offs)"
      reason: "Choosing between competing programs requires strategic judgment on incentive vs. relationship value"
      action: "VP Alliances to decide program routing based on overall partnership strategy"

    - condition: "committed_spend_data_unavailable"
      reason: "Cannot assess committed spend applicability without consumption data"
      action: "HAM to request consumption data from hyperscaler partner manager"

  insufficient_data:
    - "No CRM opportunity record (deal not registered)"
    - "No hyperscaler program criteria available for the relevant cloud provider"
    - "No customer cloud relationship data (unknown if they use AWS/Azure/GCP)"
    - "No marketplace listing exists for the relevant hyperscaler"

  ambiguity_signals:
    - "Customer cloud strategy is multi-cloud with no clear primary (affects program selection)"
    - "Deal involves both marketplace and direct procurement paths (hybrid routing)"
    - "Hyperscaler field rep provides conflicting signals on co-sell priority"

  human_judgment_required:
    - "Selecting optimal program when multiple are eligible with different trade-offs"
    - "Prioritizing co-sell registration order when capacity-constrained"
    - "Assessing strategic value of co-sell registration beyond financial incentives"
    - "Determining whether to pursue co-sell on borderline-eligible deals"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "client_id exists in InfoHub"
    - "Opportunity record available in CRM with deal value and stage"
    - "At least one hyperscaler relationship identified for the account"

  post_execution:
    - "Eligibility score calculated for at least one hyperscaler program"
    - "All five readiness dimensions assessed (listing, consent, technical, field rep, committed spend)"
    - "Recommendation provided (QUALIFIED, NEEDS_REMEDIATION, or NOT_VIABLE)"
    - "Registration package pre-filled if qualification status is QUALIFIED"

  output_quality:
    - "No vague eligibility assessments ('might qualify' is not acceptable, score and cite criteria)"
    - "All program-specific criteria cited with source (ACE guide, Partner Center docs, Partner Advantage terms)"
    - "Committed spend analysis includes burn rate calculation with data source"
    - "Incentive optimization includes estimated value and claim deadline where applicable"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "3-5 minutes (agent) + 15-20 minutes (human review)"
frequency: "Per-opportunity (triggered by new deal or AE request) + monthly pipeline review"
human_review_required: true
approval_workflow:
  - reviewer: "VP Alliances"
    approval_gate: "Validate program selection, readiness assessment accuracy, and registration priority"
  - reviewer: "AE Agent"
    condition: "always"
    approval_gate: "Confirm deal context, customer relationship status, and co-sell timing"
  - reviewer: "AA Agent"
    condition: "technical_readiness_yellow_or_red == true"
    approval_gate: "Validate technical readiness assessment and listing status"

