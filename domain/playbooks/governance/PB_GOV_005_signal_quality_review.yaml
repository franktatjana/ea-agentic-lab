# Signal Quality Review Playbook
# Purpose: Periodic review of signal matching accuracy, false positive rates, routing effectiveness

id: "PB_GOV_005"
name: "Signal Quality Review"
version: "1.0"
status: "ACTIVE"
playbook_mode: "ANALYTICAL"
playbook_category: "system_governance"
intended_agent_role: "signal-matcher-agent"

metadata:
  category: "governance"
  framework: "Signal Governance"
  team_owner: "governance"
  description: "Review signal matching accuracy, false positive rates, and routing effectiveness"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Signal quality metrics are system-internal calibration data."

raci:
  responsible:
    role: "signal_matcher_agent"
    agent: "signal-matcher-agent"
    description: "Analyzes signal matching accuracy, false positive rates, routing outcomes"
  accountable:
    role: "system_admin"
    human_required: true
    description: "Reviews signal calibration and approves pattern updates"
  informed:
    - role: "task_shepherd_agent"
      notify_on: ["signal_routing_change"]

phases:
  - name: "Accuracy Assessment"
    steps:
      - "Review signal matches against actual outcomes"
      - "Calculate false positive and false negative rates"
      - "Identify signals consistently misrouted"
  - name: "Coverage Analysis"
    steps:
      - "Check for signal types with no matching rules"
      - "Identify new signal patterns from unmatched events"
      - "Assess signal source coverage completeness"
  - name: "Calibration"
    steps:
      - "Recommend threshold adjustments for signal sensitivity"
      - "Update routing rules based on accuracy data"
      - "Produce signal quality report"
