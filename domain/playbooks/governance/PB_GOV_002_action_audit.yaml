# Action Audit Playbook
# Purpose: Weekly audit of action item lifecycle, completion rates, and quality

id: "PB_GOV_002"
name: "Weekly Action Audit"
version: "1.0"
status: "ACTIVE"
playbook_mode: "ASSESSMENT"
playbook_category: "system_governance"
intended_agent_role: "task-shepherd-agent"

metadata:
  category: "governance"
  framework: "Action Governance"
  team_owner: "governance"
  description: "Audit action items for completeness, staleness, duplicates, and priority accuracy"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Action tracking metrics are system-internal governance data."

raci:
  responsible:
    role: "task_shepherd_agent"
    agent: "task-shepherd-agent"
    description: "Audits action items, merges duplicates, validates priorities, produces report"
  accountable:
    role: "system_admin"
    human_required: true
    description: "Reviews audit findings and approves bulk actions"
  informed:
    - role: "nudger_agent"
      notify_on: ["overdue_actions_identified"]

phases:
  - name: "Completeness Check"
    steps:
      - "Verify all actions have owner, deadline, and source reference"
      - "Flag incomplete actions for remediation"
  - name: "Staleness Detection"
    steps:
      - "Identify actions past deadline without update"
      - "Classify stale actions: blocked, forgotten, or obsolete"
      - "Route blocked items to escalation, close obsolete items"
  - name: "Duplicate Merge"
    steps:
      - "Detect duplicate or overlapping actions across accounts"
      - "Merge duplicates preserving most complete version"
  - name: "Priority Validation"
    steps:
      - "Infer priority from deal context and timeline"
      - "Flag misaligned priorities for human review"
      - "Produce weekly action health summary"
