# Risk Review Playbook
# Purpose: Weekly risk portfolio review, trend analysis, and mitigation tracking

id: "PB_GOV_004"
name: "Weekly Risk Review"
version: "1.0"
status: "draft"
playbook_mode: "ASSESSMENT"
playbook_category: "system_governance"
intended_agent_role: "risk-radar-agent"

metadata:
  category: "governance"
  framework: "Risk Governance"
  team_owner: "governance"
  description: "Review risk register, track mitigation progress, detect emerging risk patterns"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Risk portfolio and mitigation strategies are system-internal."

raci:
  responsible:
    role: "risk_radar_agent"
    agent: "risk-radar-agent"
    description: "Scans risk register, classifies severity, tracks mitigations, escalates critical risks"
  accountable:
    role: "system_admin"
    human_required: true
    description: "Reviews critical risks and approves escalation decisions"
  informed:
    - role: "decision_registrar_agent"
      notify_on: ["risk_requires_decision"]
    - role: "nudger_agent"
      notify_on: ["overdue_mitigation"]

phases:
  - name: "Risk Scan"
    steps:
      - "Review all active risks by severity (critical, high, medium, low)"
      - "Check for new risks registered since last review"
      - "Validate risk classifications against current evidence"
  - name: "Mitigation Tracking"
    steps:
      - "Check mitigation action status for each active risk"
      - "Flag overdue mitigations for nudger escalation"
      - "Assess mitigation effectiveness on risk severity"
  - name: "Pattern Detection"
    steps:
      - "Identify risk trends across accounts and domains"
      - "Detect systemic risks appearing in multiple accounts"
      - "Produce weekly risk summary with trend indicators"
  - name: "Escalation"
    steps:
      - "Escalate critical risks without mitigation plans"
      - "Route cross-account patterns to management"
