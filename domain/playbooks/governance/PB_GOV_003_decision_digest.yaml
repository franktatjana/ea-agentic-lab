# Decision Digest Playbook
# Purpose: Weekly decision log review, impact tracking, and pattern identification

id: "PB_GOV_003"
name: "Weekly Decision Digest"
version: "1.0"
status: "ACTIVE"
playbook_mode: "ANALYTICAL"
playbook_category: "system_governance"
intended_agent_role: "decision-registrar-agent"

metadata:
  category: "governance"
  framework: "Decision Governance"
  team_owner: "governance"
  description: "Review registered decisions, track implementation status, identify cross-account patterns"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Decision tracking and pattern analysis are system-internal."

raci:
  responsible:
    role: "decision_registrar_agent"
    agent: "decision-registrar-agent"
    description: "Reviews decision log, tracks status, finds related decisions, produces digest"
  accountable:
    role: "system_admin"
    human_required: true
    description: "Reviews cross-account decision patterns"
  informed:
    - role: "risk_radar_agent"
      notify_on: ["decision_reversal", "conflicting_decisions"]

phases:
  - name: "Decision Status Review"
    steps:
      - "Check implementation status of recent decisions"
      - "Flag decisions awaiting action beyond deadline"
      - "Update decision status based on implementation evidence"
  - name: "Relationship Mapping"
    steps:
      - "Find related decisions across accounts and domains"
      - "Identify decisions that conflict or supersede each other"
      - "Link decisions to their architecture or commercial impact"
  - name: "Pattern Identification"
    steps:
      - "Detect recurring decision patterns across accounts"
      - "Flag decisions that historically lead to risk"
      - "Produce weekly decision digest for stakeholders"
