# Vault Structure Review Playbook
# Purpose: Periodic review of Global Knowledge Vault health, structure, and governance compliance

id: "PB_GOV_007"
name: "Vault Structure Review"
version: "1.0"
status: "ACTIVE"
playbook_mode: "ASSESSMENT"
playbook_category: "system_governance"
intended_agent_role: "knowledge-vault-curator-agent"

metadata:
  category: "governance"
  framework: "Knowledge Governance"
  team_owner: "governance"
  description: "Audit Global Knowledge Vault for structural integrity, anonymization compliance, knowledge gaps, and lifecycle health"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Vault health metrics and gap analysis are system-internal governance data."

raci:
  responsible:
    role: "knowledge_vault_curator_agent"
    agent: "knowledge-vault-curator-agent"
    description: "Scans vault for structural issues, anonymization violations, gaps, and lifecycle staleness"
  accountable:
    role: "system_admin"
    human_required: true
    description: "Reviews vault health findings and approves remediation actions"
  informed:
    - role: "playbook_curator_agent"
      notify_on: ["knowledge_gap_detected"]
    - role: "nudger_agent"
      notify_on: ["obsolete_items_flagged"]
    - role: "senior_manager_agent"
      notify_on: ["vault_health_below_threshold"]

phases:
  - name: "Structural Integrity"
    steps:
      - "Validate all vault items conform to schema (domain, archetype, phase, confidence)"
      - "Check for orphaned items with no domain or archetype tag"
      - "Verify lifecycle state transitions follow allowed paths"
  - name: "Anonymization Audit"
    steps:
      - "Scan vault items for customer-identifiable data (company names, deal values, dates)"
      - "Flag items that passed initial validation but contain indirect identifiers"
      - "Route violations for immediate remediation"
  - name: "Gap Analysis"
    steps:
      - "Cross-reference vault coverage against active domains and archetypes"
      - "Identify domains with no knowledge items or low confidence coverage"
      - "Check consumption index for items never referenced by playbook executions"
  - name: "Lifecycle Health"
    steps:
      - "Flag items not consumed in 12+ months for obsolescence review"
      - "Identify items contradicted by 3+ recent engagement patterns"
      - "Recommend confidence promotions based on cross-engagement validation"
      - "Produce vault health summary with coverage and quality metrics"
