# Nudge Effectiveness Review Playbook
# Purpose: Periodic review of nudge delivery, response rates, and escalation patterns

id: "PB_GOV_001"
name: "Nudge Effectiveness Review"
version: "1.0"
status: "ACTIVE"
playbook_mode: "ANALYTICAL"
playbook_category: "system_governance"
intended_agent_role: "nudger-agent"

metadata:
  category: "governance"
  framework: "Nudge Governance"
  team_owner: "governance"
  description: "Weekly review of nudge delivery rates, response patterns, escalation frequency, and false positive rate"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Governance metrics and agent performance data are system-internal."

raci:
  responsible:
    role: "nudger_agent"
    agent: "nudger-agent"
    description: "Collects nudge metrics, analyzes patterns, produces effectiveness report"
  accountable:
    role: "system_admin"
    human_required: true
    description: "Reviews nudge calibration and approves threshold adjustments"
  informed:
    - role: "task_shepherd_agent"
      notify_on: ["escalation_pattern_change"]

phases:
  - name: "Metrics Collection"
    steps:
      - "Count nudges sent, acknowledged, ignored by category"
      - "Calculate response rate and time-to-response trends"
      - "Identify escalation frequency and patterns"
  - name: "Pattern Analysis"
    steps:
      - "Detect over-nudging (agents ignoring reminders)"
      - "Identify under-nudging (overdue items without reminders)"
      - "Flag false positive nudges (items already resolved)"
  - name: "Calibration Recommendations"
    steps:
      - "Recommend threshold adjustments for nudge timing"
      - "Suggest escalation path changes based on response patterns"
      - "Produce weekly effectiveness summary"
