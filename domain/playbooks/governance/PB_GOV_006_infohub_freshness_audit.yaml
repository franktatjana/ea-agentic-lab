# InfoHub Freshness Audit Playbook
# Purpose: Periodic audit of InfoHub content freshness, completeness, and governance compliance

id: "PB_GOV_006"
name: "InfoHub Freshness Audit"
version: "1.0"
status: "ACTIVE"
playbook_mode: "ASSESSMENT"
playbook_category: "system_governance"
intended_agent_role: "infohub-curator-agent"

metadata:
  category: "governance"
  framework: "Knowledge Governance"
  team_owner: "governance"
  description: "Audit InfoHub nodes for staleness, missing content, governance compliance, and cross-reference integrity"

vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Governance audit results are system-internal quality metrics."

raci:
  responsible:
    role: "infohub_curator_agent"
    agent: "infohub-curator-agent"
    description: "Scans InfoHub for stale content, missing sections, broken references"
  accountable:
    role: "system_admin"
    human_required: true
    description: "Reviews audit findings and prioritizes remediation"
  informed:
    - role: "nudger_agent"
      notify_on: ["stale_content_detected"]
    - role: "playbook_curator_agent"
      notify_on: ["governance_gap_found"]

phases:
  - name: "Freshness Scan"
    steps:
      - "Check last-updated timestamps across all InfoHub nodes"
      - "Flag nodes not updated within governance threshold (30/60/90 days)"
      - "Prioritize stale nodes by account tier and activity level"
  - name: "Completeness Check"
    steps:
      - "Verify required sections present per blueprint template"
      - "Identify missing canvases, risk registers, or decision logs"
      - "Check cross-reference integrity between linked nodes"
  - name: "Governance Compliance"
    steps:
      - "Validate vault routing rules are applied correctly"
      - "Check access controls match classification levels"
      - "Verify no customer-internal data in wrong vault"
  - name: "Remediation Planning"
    steps:
      - "Produce prioritized remediation list"
      - "Route stale content alerts to responsible agents via nudger"
      - "Schedule follow-up audit for remediated items"
