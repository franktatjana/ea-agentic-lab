# Canvas Spec: QBR Tracking Canvas
# One page: Quarter Scorecard + Commitment Tracking + Portfolio Health + Signals + Readiness
# Output: QBR Scorecard + Commitment Status + Readiness Assessment
# Scope: Per-AE portfolio (aggregates across realms), not per-node

canvas_id: qbr_tracking
version: "1.0"
name: "QBR Tracking Canvas"
description: "Continuous tracking between QBR sessions - monitors commitments, portfolio health, and readiness for the next Sales QBR (PB_AE_603)"

# ==============================================================================
# CANVAS SECTIONS
# ==============================================================================
sections:
  quarter_scorecard:
    label: "Quarter Scorecard"
    prompt: "Key metrics aligned with PB_AE_603 scoring dimensions, updated weekly"
    required: true
    format: "structured"
    subsections:
      revenue:
        label: "Revenue Attainment"
        weight: 30
        fields:
          - target: "Quarterly revenue target"
          - actual: "Revenue closed to date"
          - attainment_pct: "Percentage of target achieved"
          - status: "GREEN (>=90%) | YELLOW (75-89%) | RED (<75%)"
      pipeline:
        label: "Pipeline Coverage"
        weight: 20
        fields:
          - total_pipeline: "Total qualified pipeline value"
          - remaining_target: "Revenue target minus closed"
          - coverage_ratio: "Pipeline / remaining target"
          - status: "GREEN (>=3.0x) | YELLOW (2.0-2.9x) | RED (<2.0x)"
      forecast:
        label: "Forecast Accuracy"
        weight: 15
        fields:
          - current_forecast: "Latest forecast amount"
          - prior_forecast: "Forecast from last period"
          - accuracy_trailing_pct: "Trailing accuracy percentage"
          - status: "GREEN (>=80%) | YELLOW (70-79%) | RED (<70%)"
      deal_quality:
        label: "Deal Quality"
        weight: 15
        fields:
          - avg_meddpicc: "Average MEDDPICC score for commit deals"
          - single_threaded_pct: "Percentage of deals with single-thread risk"
          - stalled_count: "Deals stalled 30+ days"
          - status: "GREEN (avg>=18, stalled<=1) | YELLOW | RED (avg<12, stalled>=3)"
      competitive:
        label: "Competitive Win Rate"
        weight: 10
        fields:
          - encounters: "Total competitive deals this quarter"
          - win_rate_pct: "Win rate across all competitors"
          - status: "GREEN (>=60%) | YELLOW (40-59%) | RED (<40%)"
      account_health:
        label: "Account Health"
        weight: 10
        fields:
          - healthy_count: "Accounts with health score >= 70"
          - at_risk_count: "Accounts with health score < 50"
          - avg_health_score: "Portfolio average"
          - status: "GREEN (avg>=70, at_risk=0) | YELLOW | RED (avg<50 OR at_risk>=2)"
    source:
      type: "derived"
      from:
        - "{realm}/*/internal-infohub/governance/health_score.yaml"
        - "{realm}/*/internal-infohub/pipeline/*.yaml"
        - "{realm}/*/internal-infohub/opportunities/*/discovery.yaml"
        - "{realm}/*/internal-infohub/competitive/*.md"
      aggregate: "across_ae_realms"

  commitment_tracker:
    label: "Prior QBR Commitments"
    prompt: "Action items from last QBR with current status, every item must have an owner and deadline"
    required: true
    max_items: 10
    format: "table"
    columns:
      - action: "Commitment from prior QBR"
      - owner: "Person accountable"
      - deadline: "Target completion date"
      - status: "Not Started | In Progress | Completed | Blocked"
      - outcome: "Result or current progress note"
    source:
      type: "infohub"
      path: "{realm}/internal-infohub/actions/qbr_actions_{YYYY}_Q{N-1}.yaml"
      fallback: "{ae_id}/internal-infohub/reviews/sales_qbr_{YYYY}_Q{N-1}/qbr_snapshot.json → actions"

  portfolio_health:
    label: "Portfolio Health"
    prompt: "Account health and pipeline across all realms in the AE's portfolio"
    required: true
    max_items: 12
    format: "table"
    columns:
      - realm: "Account / organization"
      - health_score: "Current health score (0-100)"
      - trend: "Improving | Stable | Declining"
      - pipeline_value: "Active pipeline in this realm"
      - coverage_ratio: "Pipeline / target for this realm"
      - key_risk: "Primary risk or opportunity"
    source:
      type: "derived"
      from:
        - "{realm}/*/internal-infohub/governance/health_score.yaml"
        - "{realm}/*/internal-infohub/pipeline/*.yaml"
      aggregate: "one_row_per_realm"
      sort: "health_score ASC"

  signals_risks:
    label: "Signals & Risks"
    prompt: "Active risks, competitive encounters, and PB_AE_603 decision rules triggered this quarter"
    required: false
    max_items: 8
    format: "table"
    columns:
      - signal: "What was detected"
      - type: "Pipeline Risk | Competitive | Forecast | Account Health | Stalled Deal"
      - severity: "HIGH | MEDIUM | LOW"
      - action_required: "Recommended response"
      - owner: "Person accountable"
      - status: "Open | Mitigating | Resolved"
    source:
      type: "derived"
      from:
        - "{realm}/internal-infohub/risks/pipeline_risks_{YYYY}_Q{N}.yaml"
        - "{realm}/*/internal-infohub/competitive/*.md"
        - "PB_AE_603.decision_logic.rules"
      filter: "status != 'resolved'"
      sort: "severity DESC"

  qbr_readiness:
    label: "QBR Readiness"
    prompt: "Preparation checklist mapped to PB_AE_603 quarter-long cadence"
    required: true
    max_items: 10
    format: "checklist"
    items:
      - item: "Pipeline snapshot current (< 7 days old)"
        phase: "weeks_9_12"
        source_check: "pipeline data freshness"
      - item: "Revenue targets defined for current quarter"
        phase: "weeks_1_4"
        source_check: "revenue target exists"
      - item: "MEDDPICC assessments complete for commit deals"
        phase: "weeks_9_12"
        source_check: "meddpicc scores for commit-stage deals"
      - item: "Health scores updated for all realms"
        phase: "weeks_5_8"
        source_check: "health_score.yaml freshness per realm"
      - item: "Competitive encounters documented"
        phase: "weeks_5_8"
        source_check: "competitive directory has current-quarter entries"
      - item: "Prior QBR action items status updated"
        phase: "weeks_5_8"
        source_check: "commitment_tracker has no stale items"
      - item: "Win/loss retrospectives captured (PB_AE_601)"
        phase: "weeks_5_8"
        source_check: "retrospective outputs exist for closed deals"
      - item: "Pre-QBR sync with SA/CA/CI/VE agents completed"
        phase: "pre_qbr_sync"
        source_check: "sync meeting notes exist"
      - item: "Narrative drafted for key topics"
        phase: "weeks_9_12"
        source_check: "qbr_customizations.json exists with narrative_overrides"
    source:
      type: "derived"
      from:
        - "data_freshness_checks"
        - "PB_AE_603.preparation_phases"

# ==============================================================================
# OUTPUT ARTIFACTS
# ==============================================================================
output_artifacts:
  qbr_scorecard:
    description: "Overall quarter health score (0-100) with dimensional breakdown"
    generated_from: ["quarter_scorecard"]
    calculated:
      overall_score: "weighted_sum(revenue*0.30 + pipeline*0.20 + forecast*0.15 + deal_quality*0.15 + competitive*0.10 + account_health*0.10)"
      overall_status: "GREEN (>=75) | YELLOW (50-74) | RED (<50)"

  commitment_status:
    description: "Completion rate and blocked items from prior QBR"
    generated_from: ["commitment_tracker"]
    calculated:
      completion_rate: "count(status=completed) / total"
      blocked_count: "count(status=blocked)"

  readiness_assessment:
    description: "QBR preparation completeness"
    generated_from: ["qbr_readiness"]
    calculated:
      readiness_pct: "count(checked) / total"
      readiness_status: "GREEN (>=80%) | YELLOW (50-79%) | RED (<50%)"

# ==============================================================================
# METADATA
# ==============================================================================
metadata:
  ae_id:
    label: "Account Executive"
    source: "ae_profile.yaml → name"
    position: "header"
  quarter:
    label: "Quarter"
    source: "derived from current date"
    position: "header"
  realm_count:
    label: "Accounts"
    calculated: "count(portfolio_health)"
    position: "header"
  overall_score:
    label: "Score"
    calculated: "qbr_scorecard.overall_score"
    position: "header"
  prior_qbr_ref:
    label: "Prior QBR"
    source: "{ae_id}/internal-infohub/reviews/sales_qbr_{YYYY}_Q{N-1}/qbr_snapshot.json → session_id"
    position: "header"
  next_qbr_date:
    label: "Next QBR"
    source: "PB_AE_603.trigger_conditions → quarter_end_timing"
    position: "header"
  last_updated:
    source: "render_timestamp"

# ==============================================================================
# RENDER TRIGGERS
# ==============================================================================
triggers:
  on_create:
    - "New quarter begins"
    - "Prior QBR snapshot frozen"
  on_update:
    - "Health score changes for any realm"
    - "Pipeline data updated"
    - "Commitment status changes"
    - "New risk or competitive signal identified"
    - "MEDDPICC assessment updated"
  scheduled:
    - frequency: "weekly"
      condition: "quarter.active AND ae.assigned_realms.count > 0"

# ==============================================================================
# VALIDATION RULES
# ==============================================================================
validation:
  completeness:
    minimum_sections:
      - "quarter_scorecard"
      - "commitment_tracker"
      - "portfolio_health"
    warning_if_missing:
      - "signals_risks"
      - "qbr_readiness"

  commitment_rules:
    - rule: "all commitments must have owner and deadline"
      severity: "error"
    - rule: "blocked commitments must have reason in outcome field"
      severity: "warning"
    - rule: "commitments past deadline with status != completed should be flagged"
      severity: "error"

  scorecard_rules:
    - rule: "all 6 scoring dimensions must have data"
      severity: "warning"
    - rule: "overall_score must be recalculated on each render"
      severity: "error"

  health_rules:
    - rule: "all realms in AE portfolio must appear in portfolio_health"
      severity: "warning"
    - rule: "health scores older than 14 days flagged as stale"
      severity: "warning"

  alerts:
    - condition: "overall_score < 50"
      message: "Quarter health critical, multiple dimensions below threshold"
      severity: "error"
    - condition: "commitment_tracker.blocked_count >= 2"
      message: "Multiple prior QBR commitments blocked"
      severity: "warning"
    - condition: "portfolio_health WHERE health_score < 50 COUNT >= 2"
      message: "Multiple accounts at risk, intervention required"
      severity: "warning"

# ==============================================================================
# OUTPUT PATHS
# ==============================================================================
# NOTE: Per-AE path (not per-realm/node) because Sales QBR is a portfolio-level review.
# This is a deliberate departure from other canvases. See ADR-001 D3, D6.
output:
  markdown:
    path: "{ae_id}/internal-infohub/canvas/qbr_tracking_{YYYY}_Q{N}.md"
  html:
    path: "{ae_id}/internal-infohub/canvas/qbr_tracking_{YYYY}_Q{N}.html"
    template: "playbooks/canvas/templates/qbr_tracking.html"

# ==============================================================================
# LAYOUT
# ==============================================================================
layout:
  grid: "header + scorecard + 2x2"
  sections:
    top: "quarter_scorecard"       # full width, 6-metric dashboard
    middle_left: "commitment_tracker"
    middle_right: "portfolio_health"
    bottom_left: "signals_risks"
    bottom_right: "qbr_readiness"
  color_coding:
    green: "#C8E6C9"
    yellow: "#FFF9C4"
    red: "#FFCDD2"
