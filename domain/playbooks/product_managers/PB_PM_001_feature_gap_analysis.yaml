# PLAYBOOK: Feature Gap Analysis
# Framework operationalization for AI agents
# Owner: PM Agent (pm_agent)

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
steckbrief:
  playbook_id: "PB_PM_001"
  name: "Feature Gap Analysis"
  category: "product_management"
  mode: "ANALYTICAL"
  version: "1.0"
  status: "production_ready"
  one_liner: "Analyze gap between customer requirements and current product capabilities, classify feasibility, and recommend workarounds"
  framework_origin: "Product Management Best Practices"
  owner_agent: "PM Agent (pm_agent)"
  supporting_agents:
    - "SA Agent (technical feasibility validation)"
    - "CA Agent (customer context and usage patterns)"
  triggers_summary:
    - "Customer requirement received that may exceed current capabilities"
    - "SA or AE flags potential feature gap during pre-sales"
    - "Support case pattern suggests missing capability"
  anti_patterns:
    - "Request is already covered by existing product capability"
    - "Request is a configuration issue, not a product gap"
    - "Customer has not articulated a concrete requirement"
  key_inputs:
    - "Customer requirement description"
    - "Current product capability documentation"
    - "Account context (ARR, deal value, strategic importance)"
  key_outputs:
    - artifact: "Feature gap report"
      format: "yaml"
    - artifact: "Sanitized feasibility response for customer"
      format: "markdown"
  key_decisions:
    - "Classify gap as FEASIBLE, LIMITED, or NOT_PLANNED"
    - "Determine if workaround exists or alternative approach is viable"
    - "Assess deal impact if gap is not addressed"
  complexity: "MEDIUM"
  estimated_inputs: 6
  estimated_rules: 4
  source_file: "domain/playbooks/product_managers/PB_PM_001_feature_gap_analysis.yaml"
  last_updated: "2026-02-27"

# ==============================================================================
# VAULT ROUTING
# ==============================================================================
vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Product roadmap alignment and feature gap analysis contain vendor-internal strategy. Customer receives sanitized feasibility responses."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Sanitized feature feasibility response"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized feature request patterns across accounts"

# ==============================================================================
# RACI
# ==============================================================================
raci:
  responsible:
    role: "pm_agent"
    agent: "pm_agent"
    description: "Analyzes gap, classifies feasibility, produces report with workaround recommendations"

  accountable:
    role: "pm_director"
    human_required: true
    description: "Reviews gap classification and approves customer-facing feasibility response"
    approval_actions:
      - "approve"
      - "reclassify"
      - "escalate_to_engineering"

  consulted:
    - role: "sa_agent"
      on_steps: ["technical_feasibility_check", "workaround_assessment"]
    - role: "ca_agent"
      on_steps: ["customer_usage_context", "workaround_viability"]

  informed:
    - role: "ae_agent"
      notify_on: ["gap_classified", "feasibility_response_ready"]
    - role: "delivery_agent"
      notify_on: ["workaround_requires_implementation_support"]

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_PM_001"
framework_name: "Feature Gap Analysis"
framework_source: "Product Management Best Practices"
playbook_mode: "ANALYTICAL"
playbook_category: "product_management"
intended_agent_role: "PM Agent (pm_agent)"
secondary_agents: ["SA Agent (technical feasibility)", "CA Agent (customer context)"]

primary_objective: "Analyze the gap between customer requirements and current product capabilities. Classify each gap as FEASIBLE, LIMITED, or NOT_PLANNED. Produce a feature gap report with workaround recommendations and a sanitized customer response."

when_not_to_use:
  - "Request is already covered by existing product capability (direct SA to demo)"
  - "Request is a configuration or deployment issue, not a product gap"
  - "Customer has not articulated a specific requirement (needs discovery first)"
  - "Request is for a third-party integration outside product scope"

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "SIG_COM_001"
      signal_filter: "contains(requirement_flags, 'gap_potential')"
      description: "Customer requirement flagged as potential gap during pre-sales or engagement"

    - event: "SIG_SUP_001"
      signal_filter: "case_category == 'feature_request' AND case_count >= 3"
      description: "Recurring support cases suggest missing product capability"

  manual:
    - "AE or SA requests feasibility assessment for customer requirement"
    - "Customer submits formal feature request through advisory board"
    - "Pre-sales team encounters capability gap during demo or POC"

  conditional:
    - condition: "$.requirement.gap_detected == true AND $.requirement.classification == null"
      description: "Gap detected but not yet classified"

    - condition: "$.deal.stage == 'Technical Validation' AND $.deal.blocker_type == 'feature_gap'"
      description: "Feature gap is blocking deal progression"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "Customer requirement description"
      description: "Clear statement of what the customer needs and why"
    - artifact: "{realm}/{node}/external-infohub/overview.md"
      description: "Account context and engagement history"
    - artifact: "Current product capability documentation"
      description: "Product feature set relevant to the requirement domain"

  optional:
    - artifact: "{realm}/{node}/external-infohub/architecture/solution_description.md"
      use: "Existing solution architecture for workaround assessment"
    - artifact: "{realm}/{node}/internal-infohub/opportunity/deal_summary.md"
      use: "Deal context and commercial impact of gap"
    - artifact: "Product roadmap (internal)"
      use: "Check if feature is planned and estimated delivery date"

  minimum_data_threshold:
    - "Customer requirement description available with enough detail to assess"
    - "Product capability scope for the relevant domain is known"
    - "Account identified with basic context (name, ARR, engagement stage)"

# ==============================================================================
# KEY QUESTIONS
# ==============================================================================
key_questions:
  requirement_clarity:
    - "What exactly is the customer asking for in functional terms?"
    - "What business outcome does the customer expect from this capability?"
    - "Is this a hard requirement or a nice-to-have?"
    - "What happens if the customer does not get this capability?"

  capability_assessment:
    - "What does the product currently offer in this domain?"
    - "How close is the current capability to the requirement?"
    - "Are there adjacent features that partially address the need?"
    - "Has this capability been requested by other customers?"

  workaround_viability:
    - "Can the requirement be met through configuration or customization?"
    - "Is there an API-based workaround or third-party integration?"
    - "What is the effort and trade-off of the workaround?"
    - "Is the workaround sustainable long-term or just a bridge?"

  impact_assessment:
    - "What is the commercial impact if this gap is not addressed?"
    - "Is this gap blocking a deal, renewal, or expansion?"
    - "How many other accounts have the same or similar requirement?"
    - "Does this gap create competitive vulnerability?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - id: "feasible_gap"
      condition: "product_capability_match >= 0.7 OR workaround_available == true"
      severity: "LOW"
      output_type: "Feasibility Note"
      decision:
        title: "Requirement FEASIBLE for {node}: {requirement_summary}"
        context: "Current product capability or available workaround addresses the requirement"
        recommendation: "Provide feasibility confirmation with implementation guidance"
        actions:
          - "Document how current capability or workaround meets the requirement"
          - "Prepare customer-facing feasibility response"
          - "If workaround, document steps and limitations"
          - "Notify AE/SA that gap is addressable"

    - id: "limited_gap"
      condition: "product_capability_match >= 0.3 AND product_capability_match < 0.7 AND workaround_available == false"
      severity: "MEDIUM"
      output_type: "Feasibility Note + Risk"
      decision:
        title: "Requirement LIMITED for {node}: {requirement_summary}"
        context: "Partial capability exists but significant gap remains"
        recommendation: "Communicate partial coverage, flag gap for roadmap consideration"
        actions:
          - "Document what is covered and what is not"
          - "Check roadmap for planned enhancements"
          - "Assess competitive risk of the gap"
          - "Prepare customer response with honest scope and alternatives"
          - "Submit feature request to product backlog if not already tracked"
      creates:
        - object_type: "Risk"
          category: "product_gap"
          severity: "MEDIUM"

    - id: "not_planned_gap"
      condition: "product_capability_match < 0.3 AND roadmap_status == 'not_planned'"
      severity: "HIGH"
      output_type: "Risk + Escalation"
      decision:
        title: "Requirement NOT_PLANNED for {node}: {requirement_summary}"
        context: "No current capability and feature is not on the roadmap"
        recommendation: "Escalate to PM Director, assess strategic importance, prepare alternative positioning"
        actions:
          - "Document the gap with full business justification"
          - "Assess how many accounts need this capability"
          - "Evaluate competitive landscape for this feature"
          - "Escalate to PM Director for roadmap consideration"
          - "Prepare customer response that manages expectations"
        urgency: "HIGH"
      creates:
        - object_type: "Risk"
          category: "product_gap"
          severity: "HIGH"

    - id: "deal_blocking_gap"
      condition: "deal_blocker == true AND deal_value >= ${thresholds.strategic_deal_value}"
      severity: "CRITICAL"
      output_type: "Escalation + Risk"
      decision:
        title: "Deal-blocking gap for {node}: {requirement_summary} (${deal_value})"
        context: "Feature gap is blocking a strategic deal"
        recommendation: "Immediate escalation to PM Director and Engineering leadership"
        actions:
          - "Document gap with full commercial impact"
          - "Prepare engineering feasibility request with timeline"
          - "Identify interim workaround to unblock deal"
          - "Schedule cross-functional meeting (PM, Engineering, Sales)"
        urgency: "IMMEDIATE"
      creates:
        - object_type: "Risk"
          category: "commercial"
          severity: "CRITICAL"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/product/feature_gap_{requirement_id}_{YYYY-MM-DD}.yaml"
    format: "yaml"
    sections:
      - requirement_summary
      - capability_assessment
      - gap_classification
      - workaround_analysis
      - impact_assessment
      - recommendations

    schema:
      requirement_summary:
        - requirement_id: "string"
        - description: "string"
        - business_outcome: "string"
        - priority: "enum[CRITICAL|HIGH|MEDIUM|LOW]"
        - requesting_account: "string"

      capability_assessment:
        - current_capability: "string"
        - capability_match_score: "float (0.0-1.0)"
        - adjacent_features: "array[string]"
        - partial_coverage: "string"

      gap_classification:
        - classification: "enum[FEASIBLE|LIMITED|NOT_PLANNED]"
        - confidence: "enum[HIGH|MEDIUM|LOW]"
        - rationale: "string"

      workaround_analysis:
        - workaround_available: "boolean"
        - workaround_description: "string"
        - workaround_effort: "enum[SMALL|MEDIUM|LARGE]"
        - workaround_limitations: "array[string]"
        - workaround_sustainability: "enum[LONG_TERM|BRIDGE|NOT_VIABLE]"

      impact_assessment:
        - deal_impact: "enum[BLOCKING|SIGNIFICANT|MINOR|NONE]"
        - deal_value_at_risk: "number"
        - accounts_affected: "integer"
        - competitive_exposure: "enum[HIGH|MEDIUM|LOW]"

      recommendations:
        - customer_response: "string"
        - internal_actions: "array[string]"
        - roadmap_recommendation: "string"
        - follow_up_date: "date"

  secondary_artifacts:
    - path: "{realm}/{node}/external-infohub/product/feasibility_response_{requirement_id}.md"
      description: "Sanitized customer-facing feasibility response"

  decision_objects:
    - type: "gap_classification"
      classification: "enum[FEASIBLE|LIMITED|NOT_PLANNED]"
      linked_to: "requirement_id"

  risk_objects:
    path: "{realm}/{node}/internal-infohub/risks/"
    create_if: "classification == LIMITED OR classification == NOT_PLANNED"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Feature gap analysis complete for {node}: {requirement_summary} classified as {classification}"

    - recipient: "SA Agent"
      condition: "workaround_available == true"
      message: "Workaround identified for {node} feature gap. Review technical implementation."

    - recipient: "PM Director"
      condition: "classification == 'NOT_PLANNED' OR deal_blocker == true"
      message: "Feature gap escalation for {node}: {requirement_summary}. Roadmap decision required."

    - recipient: "CA Agent"
      condition: "workaround_requires_customer_change"
      message: "Feature gap workaround for {node} requires customer-side changes. Adoption guidance needed."

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "classification_uncertain"
      reason: "Cannot determine feasibility without engineering input"
      action: "Escalate to PM Director for engineering consultation"

    - condition: "deal_blocking_and_strategic"
      reason: "Gap blocks a strategic deal and requires executive decision"
      action: "Escalate to PM Director and Sales Leadership"

    - condition: "workaround_has_security_implications"
      reason: "Proposed workaround may introduce security or compliance risks"
      action: "Escalate for security review before communicating to customer"

  insufficient_data:
    - "Customer requirement too vague to assess (needs discovery)"
    - "Product capability documentation unavailable for the relevant domain"
    - "No account context available to assess impact"

  ambiguity_signals:
    - "Requirement could be interpreted multiple ways"
    - "Conflicting information about current product capability"
    - "Unclear whether customer need is a gap or a configuration issue"

  human_judgment_required:
    - "Strategic roadmap decisions that set product direction"
    - "Commitments to customers about future delivery dates"
    - "Trade-offs between competing customer requirements"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Customer requirement is documented with sufficient detail"
    - "Product capability scope for the relevant domain is accessible"
    - "Account context (ARR, stage, strategic importance) is available"

  post_execution:
    - "Gap is classified as FEASIBLE, LIMITED, or NOT_PLANNED"
    - "Workaround analysis is complete (available or not, with rationale)"
    - "Impact assessment includes deal impact and accounts affected"
    - "Customer-facing feasibility response is prepared"
    - "Internal actions and follow-up date are defined"

  output_quality:
    - "Classification rationale is specific, not generic"
    - "Workaround steps are actionable if workaround exists"
    - "Customer response is honest but positions vendor favorably"
    - "Impact assessment uses concrete data, not assumptions"

# ==============================================================================
# INTEGRATION WITH OTHER PLAYBOOKS
# ==============================================================================
integrates_with:
  - playbook: "PB_PM_002_roadmap_alignment"
    integration: "Gap classification feeds into roadmap alignment assessment"
    provides: "Individual gap classification for roadmap dependency mapping"

  - playbook: "PB_PM_003_feature_request_pattern"
    integration: "Each gap analysis contributes to pattern aggregation"
    provides: "Individual feature request data point for pattern detection"

  - playbook: "PB_501_poc_success_plan"
    integration: "Gaps identified during POC feed into gap analysis"
    provides: "POC context for feasibility assessment"

  - playbook: "PB_104_solution_description"
    integration: "Solution description provides current architecture context"
    provides: "Technical baseline for workaround assessment"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "20-40 minutes (agent analysis + SA consultation)"
frequency: "On demand, per customer requirement"
human_review_required: true
approval_workflow:
  - reviewer: "PM Director"
    approval_gate: "Approve gap classification and customer-facing response"
  - reviewer: "SA Agent"
    condition: "workaround_proposed"
    approval_gate: "Validate workaround technical feasibility"

last_updated: "2026-02-27"
version: "1.0"
status: "production_ready"
notes: "First PM Agent playbook. Closes the tracked gap for product management feature assessment workflow."
