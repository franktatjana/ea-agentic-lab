# PLAYBOOK: Feature Request Pattern Analysis
# Framework operationalization for AI agents
# Owner: PM Agent (pm_agent)

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
steckbrief:
  playbook_id: "PB_PM_003"
  name: "Feature Request Pattern Analysis"
  category: "product_management"
  mode: "ANALYTICAL"
  version: "1.0"
  status: "production_ready"
  one_liner: "Aggregate feature requests across accounts to identify high-frequency patterns, strategic themes, and competitive gaps for product prioritization"
  framework_origin: "Product Management Best Practices"
  owner_agent: "PM Agent (pm_agent)"
  supporting_agents:
    - "CI Agent (competitive gap context)"
    - "AE Agent (commercial impact per account)"
    - "CA Agent (adoption and usage pattern context)"
  triggers_summary:
    - "Quarterly pattern analysis cycle"
    - "Feature request volume exceeds threshold within period"
    - "New competitive gap identified affecting multiple accounts"
  anti_patterns:
    - "Fewer than 5 feature requests in the analysis period (insufficient data)"
    - "Analysis already completed within the last 30 days with no new requests"
    - "Requests are from a single account (use PB_PM_001 instead)"
  key_inputs:
    - "Feature gap reports across accounts (PB_PM_001 outputs)"
    - "Customer feature requests from all channels"
    - "Competitive intelligence on feature parity"
  key_outputs:
    - artifact: "Feature request pattern report"
      format: "yaml"
    - artifact: "Product prioritization input for leadership"
      format: "markdown"
  key_decisions:
    - "Identify top requested features by frequency and commercial impact"
    - "Classify patterns into strategic themes"
    - "Flag competitive gaps where multiple accounts cite competitor advantage"
  complexity: "HIGH"
  estimated_inputs: 8
  estimated_rules: 5
  source_file: "domain/playbooks/product_managers/PB_PM_003_feature_request_pattern.yaml"
  last_updated: "2026-02-27"

# ==============================================================================
# VAULT ROUTING
# ==============================================================================
vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Product roadmap alignment and feature gap analysis contain vendor-internal strategy. Customer receives sanitized feasibility responses."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Sanitized feature feasibility response"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized feature request patterns across accounts"

# ==============================================================================
# RACI
# ==============================================================================
raci:
  responsible:
    role: "pm_agent"
    agent: "pm_agent"
    description: "Aggregates requests, detects patterns, produces pattern report for product prioritization"

  accountable:
    role: "pm_director"
    human_required: true
    description: "Reviews pattern analysis and drives product prioritization decisions"
    approval_actions:
      - "approve"
      - "request_deeper_analysis"
      - "escalate_to_product_leadership"

  consulted:
    - role: "ci_agent"
      on_steps: ["competitive_gap_validation", "market_positioning_context"]
    - role: "ae_agent"
      on_steps: ["commercial_impact_assessment", "deal_context_per_request"]
    - role: "ca_agent"
      on_steps: ["usage_pattern_correlation", "adoption_barrier_context"]

  informed:
    - role: "sa_agent"
      notify_on: ["technical_pattern_identified", "architecture_theme_detected"]
    - role: "ae_agent"
      notify_on: ["pattern_report_ready", "strategic_theme_identified"]

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_PM_003"
framework_name: "Feature Request Pattern Analysis"
framework_source: "Product Management Best Practices"
playbook_mode: "ANALYTICAL"
playbook_category: "product_management"
intended_agent_role: "pm-agent"
secondary_agents: ["CI Agent (competitive context)", "AE Agent (commercial impact)", "CA Agent (adoption patterns)"]

primary_objective: "Aggregate feature requests across all accounts to identify recurring patterns, strategic themes, and competitive gaps. Detect high-frequency requests, measure commercial impact, and produce a prioritized pattern report that informs product investment decisions."

when_not_to_use:
  - "Fewer than 5 unique feature requests in the analysis period (insufficient data for patterns)"
  - "Analysis already completed within the last 30 days with no significant new requests"
  - "All requests originate from a single account (use PB_PM_001 for individual account analysis)"
  - "Requests are outside product scope (partner or services requests)"

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "quarterly_pattern_cycle"
      description: "Quarterly feature request pattern analysis across all accounts"
      timing: "Third week of each quarter"

    - event: "SIG_PM_001"
      signal_filter: "new_gap_reports_count >= 10 AND days_since_last_pattern_analysis > 30"
      description: "Threshold of new feature gap reports triggers pattern analysis"

    - event: "SIG_CI_001"
      signal_filter: "competitive_gap_multi_account == true"
      description: "CI Agent identifies competitive gap affecting multiple accounts"

  manual:
    - "PM Director requests pattern analysis for product planning cycle"
    - "Product leadership requests input for roadmap prioritization"
    - "Sales leadership requests feature gap impact across portfolio"

  conditional:
    - condition: "$.gap_reports.unanalyzed_count >= 10 AND $.last_pattern_analysis_days > 60"
      description: "Accumulated unanalyzed gap reports exceed threshold"

    - condition: "$.competitive_events.feature_parity_gaps >= 3"
      description: "Multiple competitive parity gaps reported recently"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "*/internal-infohub/product/feature_gap_*.yaml"
      description: "Feature gap reports from PB_PM_001 across all accounts"
    - artifact: "Customer feature request log"
      description: "All feature requests from all channels (support, sales, advisory board)"

  optional:
    - artifact: "*/internal-infohub/competitive/*.md"
      use: "Competitive intelligence for gap validation"
    - artifact: "*/internal-infohub/opportunity/deal_summary.md"
      use: "Commercial context per account for impact weighting"
    - artifact: "Product roadmap (internal)"
      use: "Cross-reference requests against planned features"
    - artifact: "*/internal-infohub/product/roadmap_alignment_*.yaml"
      use: "Alignment reports for timeline context"
    - artifact: "Customer advisory board feedback"
      use: "Structured feedback from advisory board sessions"
    - artifact: "Support case analysis (feature_request category)"
      use: "Support-channel requests for volume analysis"

  minimum_data_threshold:
    - "At least 5 unique feature requests from at least 3 different accounts"
    - "Requests span at least 30 days for meaningful pattern detection"
    - "Account context (ARR, segment) available for impact weighting"

# ==============================================================================
# KEY QUESTIONS
# ==============================================================================
key_questions:
  frequency_analysis:
    - "What features are requested most frequently across accounts?"
    - "Which requests appear in multiple account segments?"
    - "What is the trend in request volume over the last 3-4 quarters?"
    - "Are there seasonal patterns in certain types of requests?"

  commercial_impact:
    - "What is the total ARR at risk from each feature gap?"
    - "Which requests are blocking active deals and what is the combined deal value?"
    - "Which requests affect renewal risk for existing customers?"
    - "What is the expansion opportunity if each gap were closed?"

  strategic_themes:
    - "Do the requests cluster into strategic themes (e.g., AI/ML, compliance, integration)?"
    - "Which themes align with company strategic direction?"
    - "Which themes represent new market opportunities?"
    - "Are there themes driven by regulatory or industry shifts?"

  competitive_context:
    - "Which requested features are available in competitor products?"
    - "Where are competitors winning deals due to feature parity gaps?"
    - "What competitive threats does the pattern data reveal?"
    - "Which gaps are table-stakes vs. differentiating?"

  customer_segmentation:
    - "Do enterprise vs. mid-market customers request different features?"
    - "Are there industry-specific patterns in feature requests?"
    - "Which customer segments generate the most deal-blocking requests?"
    - "Do new customers vs. mature customers have different needs?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - id: "high_frequency_pattern"
      condition: "request_count >= 10 AND unique_accounts >= 5"
      severity: "HIGH"
      output_type: "Strategic Theme + Initiative"
      decision:
        title: "High-frequency pattern: {feature_theme} ({request_count} requests, {unique_accounts} accounts)"
        context: "Strong demand signal across multiple accounts for this capability"
        recommendation: "Prioritize for roadmap inclusion, present to product leadership"
        actions:
          - "Document pattern with full commercial impact"
          - "Quantify ARR at risk and expansion opportunity"
          - "Present to PM Director with roadmap recommendation"
          - "Prepare business case for engineering investment"
        urgency: "HIGH"

    - id: "competitive_gap_pattern"
      condition: "competitor_has_feature == true AND accounts_citing_competitor >= 3"
      severity: "HIGH"
      output_type: "Competitive Risk + Initiative"
      decision:
        title: "Competitive gap pattern: {feature_theme} (cited by {accounts_citing_competitor} accounts)"
        context: "Competitor advantage is creating deal risk across multiple accounts"
        recommendation: "Escalate as competitive parity issue, assess table-stakes vs. differentiator"
        actions:
          - "Validate competitive intelligence with CI Agent"
          - "Quantify deals lost or at risk due to this gap"
          - "Assess if feature is table-stakes or differentiator"
          - "Recommend build, buy, or partner response"
      creates:
        - object_type: "Risk"
          category: "competitive"
          severity: "HIGH"

    - id: "deal_blocking_cluster"
      condition: "blocking_deals_count >= 3 AND total_deal_value >= ${thresholds.pattern_deal_threshold}"
      severity: "CRITICAL"
      output_type: "Escalation + Initiative"
      decision:
        title: "Deal-blocking cluster: {feature_theme} (blocking {blocking_deals_count} deals worth ${total_deal_value})"
        context: "Pattern is actively blocking significant pipeline"
        recommendation: "Immediate escalation to product and sales leadership"
        actions:
          - "Prepare deal impact summary for leadership"
          - "Convene PM + Engineering + Sales review"
          - "Evaluate fast-track development or interim solution"
          - "Develop account-by-account mitigation plan"
        urgency: "IMMEDIATE"
      creates:
        - object_type: "Risk"
          category: "commercial"
          severity: "CRITICAL"

    - id: "emerging_trend"
      condition: "request_growth_rate > 0.5 AND quarters_trending >= 2"
      severity: "MEDIUM"
      output_type: "Strategic Insight"
      decision:
        title: "Emerging trend: {feature_theme} (growing {request_growth_rate_pct}% quarter over quarter)"
        context: "Request volume is accelerating, indicating growing market demand"
        recommendation: "Monitor closely, begin feasibility assessment if not already started"
        actions:
          - "Track trend over next quarter for confirmation"
          - "Begin technical feasibility assessment"
          - "Gather additional customer context on use cases"
          - "Compare against industry analyst predictions"

    - id: "segment_specific_pattern"
      condition: "segment_concentration >= 0.7 AND request_count >= 5"
      severity: "MEDIUM"
      output_type: "Strategic Insight"
      decision:
        title: "Segment-specific pattern: {feature_theme} concentrated in {segment} ({concentration_pct}%)"
        context: "Feature demand is concentrated in a specific customer segment"
        recommendation: "Evaluate segment-specific investment vs. platform capability"
        actions:
          - "Assess segment size and growth potential"
          - "Evaluate effort of segment-specific vs. platform solution"
          - "Determine if this aligns with go-to-market strategy"
          - "Consult with segment sales leadership"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "global/product/feature_request_patterns_{YYYY-Q}.yaml"
    format: "yaml"
    sections:
      - analysis_summary
      - pattern_registry
      - strategic_themes
      - competitive_gaps
      - segment_analysis
      - prioritization_matrix
      - recommendations

    schema:
      analysis_summary:
        - analysis_period: "string (YYYY-Q)"
        - total_requests_analyzed: "integer"
        - unique_accounts: "integer"
        - unique_features_requested: "integer"
        - total_arr_at_risk: "number"
        - total_deal_value_blocked: "number"
        - patterns_identified: "integer"
        - new_patterns_since_last: "integer"

      pattern_registry:
        type: "array"
        items:
          - pattern_id: "string"
          - feature_theme: "string"
          - request_count: "integer"
          - unique_accounts: "integer"
          - account_names: "array[string]"
          - total_arr_affected: "number"
          - blocking_deals: "integer"
          - blocking_deal_value: "number"
          - classification: "enum[HIGH_FREQUENCY|COMPETITIVE_GAP|DEAL_BLOCKING|EMERGING_TREND|SEGMENT_SPECIFIC]"
          - trend: "enum[GROWING|STABLE|DECLINING]"
          - quarters_tracked: "integer"

      strategic_themes:
        type: "array"
        items:
          - theme_name: "string"
          - description: "string"
          - related_patterns: "array[pattern_id]"
          - strategic_alignment: "enum[HIGH|MEDIUM|LOW]"
          - market_opportunity: "string"

      competitive_gaps:
        type: "array"
        items:
          - feature: "string"
          - competitor_with_feature: "array[string]"
          - accounts_citing: "integer"
          - table_stakes_or_differentiator: "enum[TABLE_STAKES|DIFFERENTIATOR|NICE_TO_HAVE]"
          - competitive_risk: "enum[CRITICAL|HIGH|MEDIUM|LOW]"

      segment_analysis:
        type: "array"
        items:
          - segment: "string"
          - top_requests: "array[{feature, count, arr_impact}]"
          - unique_needs: "array[string]"
          - segment_arr: "number"

      prioritization_matrix:
        type: "array"
        items:
          - feature_theme: "string"
          - frequency_score: "integer (1-10)"
          - commercial_impact_score: "integer (1-10)"
          - competitive_urgency_score: "integer (1-10)"
          - strategic_alignment_score: "integer (1-10)"
          - composite_priority: "float"
          - recommended_action: "enum[BUILD_NOW|PLAN_NEXT|EVALUATE|MONITOR|DEFER]"

      recommendations:
        - build_now: "array[{feature_theme, justification, estimated_impact}]"
        - plan_next: "array[{feature_theme, justification, target_quarter}]"
        - evaluate: "array[{feature_theme, open_questions}]"
        - monitor: "array[{feature_theme, trigger_for_reassessment}]"
        - next_analysis_date: "date"

  secondary_artifacts:
    - path: "global/product/pattern_report_executive_summary_{YYYY-Q}.md"
      description: "Executive summary of feature request patterns for product leadership"
    - path: "global/product/competitive_gap_summary_{YYYY-Q}.md"
      description: "Competitive gap analysis for go-to-market team"

  decision_objects:
    - type: "prioritization_recommendation"
      action: "enum[BUILD_NOW|PLAN_NEXT|EVALUATE|MONITOR|DEFER]"
      linked_to: "pattern_id"

  risk_objects:
    path: "global/product/risks/"
    create_if: "competitive_gap_critical == true OR deal_blocking_cluster == true"

  notifications:
    - recipient: "PM Director"
      condition: "always"
      message: "Feature request pattern report ready for {analysis_period}: {patterns_identified} patterns, ${total_arr_at_risk} ARR at risk"

    - recipient: "CI Agent"
      condition: "competitive_gaps_identified > 0"
      message: "Feature pattern analysis identified {competitive_gaps_count} competitive gaps. Validation requested."

    - recipient: "AE Agents (all)"
      condition: "deal_blocking_cluster_identified"
      message: "Deal-blocking feature pattern identified: {feature_theme}. Mitigation plans in preparation."

    - recipient: "SA Agent"
      condition: "technical_theme_identified"
      message: "Technical feature theme identified: {feature_theme}. Architecture assessment may be needed."

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "insufficient_request_volume"
      reason: "Fewer than 5 requests from fewer than 3 accounts in the period"
      action: "Defer analysis until sufficient data accumulates"

    - condition: "conflicting_patterns"
      reason: "Data suggests contradictory patterns that cannot be resolved algorithmically"
      action: "Request PM Director input on interpretation"

    - condition: "strategic_direction_change"
      reason: "Pattern analysis suggests product strategy needs fundamental reassessment"
      action: "Escalate to product leadership for strategic discussion"

  insufficient_data:
    - "No feature gap reports available from PB_PM_001"
    - "Feature request log not accessible or empty"
    - "Account context (ARR, segment) not available for impact weighting"

  ambiguity_signals:
    - "Feature requests described inconsistently across accounts (same need, different terms)"
    - "Unclear whether requests represent distinct features or variations of the same need"
    - "Commercial impact data is incomplete for impact-weighted prioritization"

  human_judgment_required:
    - "Product investment decisions (build, buy, partner)"
    - "Strategic prioritization when multiple patterns have equal scores"
    - "Market entry decisions based on segment-specific patterns"
    - "Roadmap reprioritization affecting committed deliveries"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "Feature gap reports or request log available with sufficient volume"
    - "Account metadata (ARR, segment, engagement stage) accessible for weighting"
    - "Previous pattern analysis available for trend comparison (if not first run)"

  post_execution:
    - "All requests are categorized into patterns or marked as one-off"
    - "Each pattern has frequency, account count, and commercial impact"
    - "Strategic themes are identified and linked to patterns"
    - "Competitive gaps are validated against CI data"
    - "Prioritization matrix is complete with composite scores"
    - "Actionable recommendations are provided (BUILD_NOW, PLAN_NEXT, etc.)"

  output_quality:
    - "Patterns are based on data, not assumptions (request counts are verifiable)"
    - "Commercial impact uses actual ARR and deal values, not estimates"
    - "Competitive gaps reference specific competitor capabilities"
    - "Recommendations are actionable with clear justification"
    - "Trend analysis compares to previous quarter when available"

# ==============================================================================
# INTEGRATION WITH OTHER PLAYBOOKS
# ==============================================================================
integrates_with:
  - playbook: "PB_PM_001_feature_gap_analysis"
    integration: "Individual gap reports are the primary data source for pattern detection"
    provides: "Aggregated view of individual feature gaps across accounts"

  - playbook: "PB_PM_002_roadmap_alignment"
    integration: "Alignment data provides timeline urgency for pattern prioritization"
    provides: "Pattern priority informed by roadmap dependency timing"

  - playbook: "PB_CI_001_five_forces"
    integration: "Five Forces analysis provides competitive context for gap patterns"
    provides: "Competitive gap data for industry-level analysis"

  - playbook: "PB_AE_002_account_planning"
    integration: "Pattern insights inform account strategy for affected accounts"
    provides: "Cross-account feature demand context for individual account planning"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "60-120 minutes (data aggregation + analysis + CI validation)"
frequency: "Quarterly, or on-demand when request volume threshold is reached"
human_review_required: true
approval_workflow:
  - reviewer: "PM Director"
    approval_gate: "Approve pattern classifications and prioritization recommendations"
  - reviewer: "Product Leadership"
    condition: "build_now_recommendations_count > 0"
    approval_gate: "Approve engineering investment recommendations"

last_updated: "2026-02-27"
version: "1.0"
status: "production_ready"
notes: "Third PM Agent playbook. Provides cross-account pattern intelligence for product investment decisions."
