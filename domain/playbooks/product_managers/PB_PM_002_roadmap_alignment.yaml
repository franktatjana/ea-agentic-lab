# PLAYBOOK: Roadmap Alignment
# Framework operationalization for AI agents
# Owner: PM Agent (pm_agent)

# ==============================================================================
# PLAYBOOK STECKBRIEF
# ==============================================================================
steckbrief:
  playbook_id: "PB_PM_002"
  name: "Roadmap Alignment"
  category: "product_management"
  mode: "ANALYTICAL"
  version: "1.0"
  status: "production_ready"
  one_liner: "Periodic review of customer roadmap dependencies, mapping customer timelines to product delivery dates, flagging timing risks and alternatives"
  framework_origin: "Product Roadmap Management Best Practices"
  owner_agent: "PM Agent (pm_agent)"
  supporting_agents:
    - "SA Agent (technical timeline validation)"
    - "AE Agent (commercial urgency context)"
    - "CA Agent (customer adoption timeline)"
  triggers_summary:
    - "Quarterly roadmap alignment review cycle"
    - "Customer timeline dependency detected on unreleased feature"
    - "Product roadmap change affects committed customer timelines"
  anti_patterns:
    - "Customer has no dependency on upcoming product releases"
    - "Account is in churn or wind-down (no roadmap alignment needed)"
    - "Requirement already classified as NOT_PLANNED with no roadmap path"
  key_inputs:
    - "Customer requirements with timeline dependencies"
    - "Product roadmap with planned delivery dates"
    - "Account engagement timeline and milestones"
  key_outputs:
    - artifact: "Roadmap alignment report"
      format: "yaml"
    - artifact: "Timing risk summary for account team"
      format: "markdown"
  key_decisions:
    - "Flag timing risks where customer deadline precedes product delivery"
    - "Identify alternative approaches when roadmap does not align"
    - "Recommend escalation for strategic accounts with critical misalignment"
  complexity: "MEDIUM"
  estimated_inputs: 7
  estimated_rules: 5
  source_file: "domain/playbooks/product_managers/PB_PM_002_roadmap_alignment.yaml"
  last_updated: "2026-02-27"

# ==============================================================================
# VAULT ROUTING
# ==============================================================================
vault_routing:
  primary_vault: "Internal Account Hub"
  rationale: "Product roadmap alignment and feature gap analysis contain vendor-internal strategy. Customer receives sanitized feasibility responses."
  secondary_outputs:
    - vault: "Customer InfoHub"
      artifact: "Sanitized feature feasibility response"
    - vault: "Global Knowledge Vault"
      artifact: "Anonymized feature request patterns across accounts"

# ==============================================================================
# RACI
# ==============================================================================
raci:
  responsible:
    role: "pm_agent"
    agent: "pm_agent"
    description: "Maps customer timelines to roadmap, identifies misalignment, produces alignment report"

  accountable:
    role: "pm_director"
    human_required: true
    description: "Reviews alignment report and approves roadmap commitments or escalations"
    approval_actions:
      - "approve"
      - "adjust_timeline"
      - "escalate_to_engineering"

  consulted:
    - role: "sa_agent"
      on_steps: ["technical_timeline_validation", "alternative_architecture_assessment"]
    - role: "ae_agent"
      on_steps: ["commercial_urgency_assessment", "customer_expectation_context"]
    - role: "ca_agent"
      on_steps: ["adoption_timeline_input", "customer_readiness_assessment"]

  informed:
    - role: "delivery_agent"
      notify_on: ["timing_risk_identified", "workaround_requires_delivery_support"]
    - role: "ae_agent"
      notify_on: ["alignment_report_ready", "critical_misalignment_detected"]

# ==============================================================================
# PLAYBOOK METADATA
# ==============================================================================
playbook_id: "PB_PM_002"
framework_name: "Roadmap Alignment"
framework_source: "Product Roadmap Management Best Practices"
playbook_mode: "ANALYTICAL"
playbook_category: "product_management"
intended_agent_role: "pm-agent"
secondary_agents: ["SA Agent (technical timelines)", "AE Agent (commercial urgency)", "CA Agent (adoption readiness)"]

primary_objective: "Conduct periodic review of customer roadmap dependencies by mapping customer timelines to product delivery dates. Flag timing risks where customer deadlines precede planned delivery. Recommend alternatives and escalation paths for critical misalignments."

when_not_to_use:
  - "Customer has no dependency on upcoming product releases"
  - "Account is in churn or wind-down with no active roadmap needs"
  - "All customer requirements are met by current product capabilities"
  - "Less than 30 days since last alignment review with no roadmap changes"

# ==============================================================================
# TRIGGER CONDITIONS
# ==============================================================================
trigger_conditions:
  automatic:
    - event: "quarterly_alignment_cycle"
      description: "Quarterly roadmap alignment review for all accounts with active dependencies"
      timing: "First week of each quarter"

    - event: "SIG_ROADMAP_001"
      signal_filter: "roadmap_item_date_changed == true AND customer_dependencies_exist == true"
      description: "Product roadmap date changed on item with customer dependencies"

    - event: "SIG_COM_001"
      signal_filter: "customer_timeline_updated == true AND roadmap_dependency == true"
      description: "Customer timeline changed on requirement with roadmap dependency"

  manual:
    - "AE requests roadmap alignment check before customer meeting or QBR"
    - "SA identifies timeline risk during technical planning"
    - "Customer asks about delivery date for roadmap-dependent feature"

  conditional:
    - condition: "$.roadmap_dependencies.count > 0 AND $.last_alignment_review_days > 90"
      description: "Active dependencies exist but no alignment review in 90+ days"

    - condition: "$.customer.renewal_days <= 180 AND $.roadmap_dependencies.blocking_count > 0"
      description: "Renewal approaching with unresolved roadmap dependencies"

# ==============================================================================
# REQUIRED INPUTS
# ==============================================================================
required_inputs:
  mandatory:
    - artifact: "{realm}/{node}/internal-infohub/product/feature_gap_*.yaml"
      description: "Existing feature gap analyses with roadmap dependencies"
    - artifact: "Product roadmap (internal)"
      description: "Current product roadmap with planned features and delivery dates"
    - artifact: "{realm}/{node}/external-infohub/overview.md"
      description: "Account overview with engagement context and milestones"

  optional:
    - artifact: "{realm}/{node}/internal-infohub/opportunity/deal_summary.md"
      use: "Commercial context for prioritization of misalignment response"
    - artifact: "{realm}/{node}/external-infohub/success_plan/csp.yaml"
      use: "Customer success milestones dependent on product delivery"
    - artifact: "{realm}/{node}/internal-infohub/product/roadmap_alignment_*.yaml"
      use: "Previous alignment reports for trend analysis"
    - artifact: "{realm}/{node}/external-infohub/architecture/solution_description.md"
      use: "Architecture context for evaluating interim solutions"

  minimum_data_threshold:
    - "At least one documented roadmap dependency exists for the account"
    - "Product roadmap accessible with planned delivery dates"
    - "Customer timeline or milestone dates are known"

# ==============================================================================
# KEY QUESTIONS
# ==============================================================================
key_questions:
  dependency_mapping:
    - "What product features does this customer depend on that are not yet released?"
    - "What are the customer's target dates for each dependent capability?"
    - "What is the planned product delivery date for each dependency?"
    - "What is the gap in days between customer need date and planned delivery?"

  timing_risk_assessment:
    - "Which dependencies have customer deadlines before product delivery dates?"
    - "How confident is the product delivery date (committed vs. tentative)?"
    - "What is the customer's flexibility on their timeline?"
    - "Are there hard deadlines (regulatory, contractual, business events)?"

  alternative_evaluation:
    - "Can an interim workaround bridge the timing gap?"
    - "Is there an alternative architecture that avoids the dependency?"
    - "Can the customer phase their rollout to align with product delivery?"
    - "Is early access or beta program an option for this customer?"

  impact_assessment:
    - "What is the commercial impact of each timing misalignment?"
    - "Does the misalignment affect renewal, expansion, or new deal closure?"
    - "How many other accounts share the same dependency?"
    - "Does the misalignment create competitive exposure?"

# ==============================================================================
# DECISION LOGIC
# ==============================================================================
decision_logic:
  rules:
    - id: "aligned"
      condition: "product_delivery_date <= customer_need_date AND confidence == 'committed'"
      severity: "LOW"
      output_type: "Alignment Confirmation"
      decision:
        title: "Roadmap aligned for {node}: {feature_name}"
        context: "Product delivery date meets or precedes customer timeline"
        recommendation: "Confirm alignment to account team, continue monitoring"
        actions:
          - "Document alignment status in report"
          - "Notify AE of confirmed alignment"
          - "Set review reminder for next quarter"

    - id: "at_risk_timing"
      condition: "product_delivery_date > customer_need_date AND gap_days <= 90"
      severity: "MEDIUM"
      output_type: "Risk + Alternatives"
      decision:
        title: "Timing risk for {node}: {feature_name} ({gap_days} days gap)"
        context: "Product delivery date is 1-90 days after customer need date"
        recommendation: "Evaluate interim alternatives, assess customer flexibility"
        actions:
          - "Identify interim workaround or phased approach"
          - "Assess customer timeline flexibility"
          - "Check if early access or beta is available"
          - "Prepare contingency plan for account team"
      creates:
        - object_type: "Risk"
          category: "roadmap_alignment"
          severity: "MEDIUM"

    - id: "critical_misalignment"
      condition: "product_delivery_date > customer_need_date AND gap_days > 90"
      severity: "HIGH"
      output_type: "Escalation + Risk"
      decision:
        title: "Critical roadmap misalignment for {node}: {feature_name} ({gap_days} days gap)"
        context: "Product delivery is 90+ days after customer need, significant risk"
        recommendation: "Escalate to PM Director, explore engineering acceleration or alternative solutions"
        actions:
          - "Escalate to PM Director with full impact analysis"
          - "Request engineering feasibility for timeline acceleration"
          - "Develop alternative solution architecture with SA"
          - "Prepare customer communication strategy with AE"
        urgency: "HIGH"
      creates:
        - object_type: "Risk"
          category: "roadmap_alignment"
          severity: "HIGH"

    - id: "delivery_confidence_low"
      condition: "confidence == 'tentative' AND customer_dependency_critical == true"
      severity: "HIGH"
      output_type: "Risk + Initiative"
      decision:
        title: "Low confidence on roadmap item critical to {node}: {feature_name}"
        context: "Customer has critical dependency on tentatively scheduled feature"
        recommendation: "Request commitment clarity from engineering, prepare contingency"
        actions:
          - "Request delivery confidence assessment from engineering"
          - "Identify contingency plan if delivery slips"
          - "Do not communicate tentative dates to customer as commitments"
          - "Add to PM Director review agenda"
      creates:
        - object_type: "Risk"
          category: "roadmap_alignment"
          severity: "HIGH"

    - id: "renewal_at_risk_from_misalignment"
      condition: "renewal_days <= 180 AND blocking_dependencies > 0 AND classification != 'FEASIBLE'"
      severity: "CRITICAL"
      output_type: "Escalation + Risk"
      decision:
        title: "Renewal risk from roadmap misalignment for {node}"
        context: "Renewal within 6 months with unresolved blocking roadmap dependencies"
        recommendation: "Immediate cross-functional response to address dependencies before renewal"
        actions:
          - "Escalate to PM Director and Sales Leadership"
          - "Convene cross-functional meeting (PM, Engineering, AE, SA)"
          - "Develop retention strategy that addresses dependencies"
          - "Prepare alternative value proposition if timeline cannot shift"
        urgency: "IMMEDIATE"
      creates:
        - object_type: "Risk"
          category: "commercial"
          severity: "CRITICAL"

# ==============================================================================
# EXPECTED OUTPUTS
# ==============================================================================
expected_outputs:
  primary_artifact:
    path: "{realm}/{node}/internal-infohub/product/roadmap_alignment_{YYYY-Q}.yaml"
    format: "yaml"
    sections:
      - alignment_summary
      - dependency_map
      - timing_risks
      - alternatives
      - recommendations

    schema:
      alignment_summary:
        - account_name: "string"
        - review_date: "date"
        - total_dependencies: "integer"
        - aligned_count: "integer"
        - at_risk_count: "integer"
        - critical_misalignment_count: "integer"
        - overall_alignment_score: "enum[GREEN|YELLOW|RED]"

      dependency_map:
        type: "array"
        items:
          - feature_name: "string"
          - customer_need_date: "date"
          - product_delivery_date: "date"
          - gap_days: "integer"
          - delivery_confidence: "enum[COMMITTED|TENTATIVE|UNSCHEDULED]"
          - status: "enum[ALIGNED|AT_RISK|CRITICAL_MISALIGNMENT]"
          - linked_gap_report: "string (PB_PM_001 reference)"

      timing_risks:
        type: "array"
        items:
          - feature_name: "string"
          - risk_severity: "enum[CRITICAL|HIGH|MEDIUM|LOW]"
          - gap_days: "integer"
          - commercial_impact: "string"
          - mitigation_plan: "string"

      alternatives:
        type: "array"
        items:
          - feature_name: "string"
          - alternative_type: "enum[WORKAROUND|PHASED_ROLLOUT|EARLY_ACCESS|PARTNER_SOLUTION|NONE]"
          - description: "string"
          - effort: "enum[SMALL|MEDIUM|LARGE]"
          - viability: "enum[HIGH|MEDIUM|LOW]"

      recommendations:
        - escalations: "array[{feature, urgency, audience}]"
        - customer_communications: "array[{feature, message_type, timing}]"
        - internal_actions: "array[{action, owner, due_date}]"
        - next_review_date: "date"

  secondary_artifacts:
    - path: "{realm}/{node}/internal-infohub/product/timing_risk_summary_{YYYY-Q}.md"
      description: "Concise timing risk summary for account team consumption"

  decision_objects:
    - type: "alignment_status"
      status: "enum[GREEN|YELLOW|RED]"
      linked_to: "account_id"

  risk_objects:
    path: "{realm}/{node}/internal-infohub/risks/"
    create_if: "at_risk_count > 0 OR critical_misalignment_count > 0"

  notifications:
    - recipient: "AE Agent"
      condition: "always"
      message: "Roadmap alignment report ready for {node}: {aligned_count} aligned, {at_risk_count} at risk, {critical_misalignment_count} critical"

    - recipient: "PM Director"
      condition: "critical_misalignment_count > 0 OR renewal_at_risk == true"
      message: "Critical roadmap misalignment for {node}. Escalation required."

    - recipient: "SA Agent"
      condition: "alternatives_needed == true"
      message: "Roadmap alternatives needed for {node}. Architecture workaround assessment requested."

    - recipient: "CA Agent"
      condition: "adoption_timeline_affected == true"
      message: "Roadmap timing affects adoption plan for {node}. Timeline adjustment may be needed."

# ==============================================================================
# STOP CONDITIONS
# ==============================================================================
stop_conditions:
  escalate_to_human:
    - condition: "roadmap_dates_not_available"
      reason: "Product roadmap dates are not accessible or not yet defined"
      action: "Request PM Director to provide current roadmap for dependency assessment"

    - condition: "conflicting_customer_commitments"
      reason: "Multiple accounts have conflicting priority on the same roadmap item"
      action: "Escalate to PM Director for prioritization decision"

    - condition: "engineering_timeline_dispute"
      reason: "Delivery confidence assessment conflicts with published roadmap"
      action: "Escalate for cross-functional alignment between PM and Engineering"

  insufficient_data:
    - "No documented roadmap dependencies for this account"
    - "Product roadmap not accessible or dates not defined"
    - "Customer timeline not established for dependent capabilities"

  ambiguity_signals:
    - "Customer deadline is soft with no clear driver"
    - "Roadmap item described differently in multiple sources"
    - "Unclear whether dependency is hard (blocking) or soft (preferred)"

  human_judgment_required:
    - "Roadmap reprioritization decisions affecting multiple accounts"
    - "Customer commitments about future delivery dates"
    - "Strategic decisions about feature investment timing"

# ==============================================================================
# VALIDATION CHECKS
# ==============================================================================
validation_checks:
  pre_execution:
    - "At least one roadmap dependency is documented for the account"
    - "Product roadmap is accessible with current delivery dates"
    - "Customer timeline or milestone dates are available"

  post_execution:
    - "Every dependency has a status (ALIGNED, AT_RISK, CRITICAL_MISALIGNMENT)"
    - "Timing risks have severity and mitigation plans"
    - "Alternatives are evaluated for each at-risk dependency"
    - "Overall alignment score is calculated (GREEN, YELLOW, RED)"
    - "Next review date is set"

  output_quality:
    - "Gap days are calculated accurately from real dates, not estimates"
    - "Delivery confidence reflects current engineering assessment, not outdated"
    - "Alternatives are practical and actionable, not theoretical"
    - "Customer communication recommendations are appropriate for the relationship"

# ==============================================================================
# INTEGRATION WITH OTHER PLAYBOOKS
# ==============================================================================
integrates_with:
  - playbook: "PB_PM_001_feature_gap_analysis"
    integration: "Individual gap reports feed into alignment review"
    provides: "Gap classification and workaround data for each dependency"

  - playbook: "PB_PM_003_feature_request_pattern"
    integration: "Alignment data enriches pattern analysis with timeline context"
    provides: "Timeline urgency data for feature request prioritization"

  - playbook: "PB_AE_002_account_planning"
    integration: "Alignment status informs account strategy and risk assessment"
    provides: "Roadmap risk input for strategic account planning"

  - playbook: "PB_CA_008_customer_success_plan"
    integration: "CSP milestones may depend on roadmap delivery"
    provides: "Roadmap alignment status for success plan milestone planning"

# ==============================================================================
# EXECUTION METADATA
# ==============================================================================
estimated_execution_time: "30-60 minutes (agent analysis + stakeholder input)"
frequency: "Quarterly, or on-demand when roadmap changes or customer timeline shifts"
human_review_required: true
approval_workflow:
  - reviewer: "PM Director"
    approval_gate: "Approve alignment report and escalation recommendations"
  - reviewer: "AE Agent"
    condition: "customer_communication_recommended"
    approval_gate: "Approve customer communication approach"

last_updated: "2026-02-27"
version: "1.0"
status: "production_ready"
notes: "Second PM Agent playbook. Provides systematic roadmap dependency tracking and timing risk management across accounts."
