# Service Registry: Agent Endpoint Configuration
# Maps agent IDs to deployment endpoints for A2A routing.
# Used by the agent-registry resolver for invoke-* tools and a2a.agent_url resolution.
#
# Profile selection: EA_RUNTIME_PROFILE environment variable
# Supported profiles: mock, dev, staging, production

active_profile: ${EA_RUNTIME_PROFILE:-mock}

profiles:
  mock:
    base_url: http://localhost:8000/mock/agents
    agents:
      # Account Executive agents
      ae-agent:
        endpoint: ${base_url}/ae-agent
        health_check: ${base_url}/ae-agent/health
        protocol: a2a
