  # invoke-* tool to target agent mapping
  # Platform resolves invoke-{name} by looking up {name}-agent in the agents block above
  invoke_tools:
    invoke-deal-diagnosis: ae-deal-diagnosis-agent
    invoke-meeting-prep: ae-meeting-prep-agent
    invoke-opportunity-hygiene: ae-opportunity-hygiene-agent
    invoke-pipeline-gen: ae-pipeline-gen-agent
    invoke-pipeline-mgmt: ae-pipeline-mgmt-agent
    invoke-qualification: ae-qualification-agent
    invoke-signal-detection: ae-signal-detection-agent
    invoke-stakeholder-intelligence: ae-stakeholder-agent
    invoke-poc-agent: poc-agent
    invoke-rfp-agent: rfp-agent
    invoke-sa-best-practices-agent: sa-best-practices-agent
    invoke-sa-csp-agent: sa-csp-agent
    invoke-sa-decision-capture-agent: sa-decision-capture-agent
    invoke-sa-discovery-agent: sa-discovery-agent
    invoke-sa-journey-agent: sa-journey-agent
    invoke-sa-risk-agent: sa-risk-agent
    invoke-specialist-agent: specialist-agent

  # $component_ref resolution
  # Compile-time: ref value must match an agent id in the agents block
  # Platform replaces $component_ref with full agent spec before runtime binding
  component_ref_resolution: compile-time

  dev:
    base_url: http://localhost:8080/agents
    agents: {} # Inherits structure from mock, override endpoints as needed

  staging:
    base_url: https://staging.ea-platform.internal/agents
    agents: {} # Override per environment

  production:
    base_url: https://ea-platform.internal/agents
    agents: {} # Override per environment
