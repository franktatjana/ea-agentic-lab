# Tool Resolver: Tool-to-Connector Mapping
# Maps tool IDs to connector types and operations for runtime binding.
# Used by the service-registry resolver for data access and persistence tools.
#
# Profile selection: EA_RUNTIME_PROFILE environment variable
# Supported profiles: mock, dev, staging, production
#
# Resolution algorithm:
# 1. Look up tool ID in tool_mappings for exact match
# 2. If no exact match, derive connector from tool ID prefix pattern
# 3. Resolve connector endpoint from active profile's connectors block
# 4. Fail with TOOL_RESOLVER_MISSING if no mapping found

active_profile: ${EA_RUNTIME_PROFILE:-mock}

# Connector definitions per profile
profiles:
  mock:
    connectors:
      crm:
        base_url: http://localhost:8000/mock/crm
        mode: stub
        description: CRM data (Salesforce mock)
      infohub:
        base_url: http://localhost:8000/mock/infohub
        mode: file
        description: InfoHub vault (local filesystem)
      communications:
        base_url: http://localhost:8000/mock/communications
        mode: stub
        description: Email and Slack (mock)
      intelligence:
        base_url: http://localhost:8000/mock/intelligence
        mode: stub
        description: Market and competitive intelligence (mock)
      content:
        base_url: http://localhost:8000/mock/content
        mode: stub
        description: Content scanning (mock)

  dev:
    connectors:
      crm:
        base_url: http://localhost:8080/crm
        mode: sandbox
      infohub:
        base_url: http://localhost:8080/infohub
        mode: file
      communications:
        base_url: http://localhost:8080/communications
        mode: sandbox
      intelligence:
        base_url: http://localhost:8080/intelligence
        mode: sandbox
      content:
        base_url: http://localhost:8080/content
        mode: sandbox

  staging:
    connectors:
      crm:
        base_url: https://staging.ea-platform.internal/crm
        mode: sandbox
      infohub:
        base_url: https://staging.ea-platform.internal/infohub
        mode: live
      communications:
        base_url: https://staging.ea-platform.internal/communications
        mode: sandbox
      intelligence:
        base_url: https://staging.ea-platform.internal/intelligence
        mode: live
      content:
        base_url: https://staging.ea-platform.internal/content
        mode: live

  production:
    connectors:
      crm:
        base_url: https://ea-platform.internal/crm
        mode: live
      infohub:
        base_url: https://ea-platform.internal/infohub
        mode: live
      communications:
        base_url: https://ea-platform.internal/communications
        mode: live
      intelligence:
        base_url: https://ea-platform.internal/intelligence
        mode: live
      content:
        base_url: https://ea-platform.internal/content
        mode: live

