      inputs: [source_type: string, account_name: string]
      # DIVERGENCE: ae-qualification uses (query: string) instead.
      # Canonical schema uses the ae-deal-diagnosis signature.
      # ae-qualification-definition.yaml needs alignment.

    # InfoHub vault (read)
