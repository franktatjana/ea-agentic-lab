# ============================================================
# TOOL REGISTRY
# ============================================================
# All 128 valid tool IDs grouped by resolver type.
# New agents must only use tools from this list.
# To add a new tool, add it here AND in tool_resolver.yaml
# or service_registry.yaml as appropriate.
#
# Each tool declares canonical inputs. When multiple agents use
# the same tool, their inputs block MUST match this registry.
# Divergences are flagged and must be resolved before linting
# can enforce schema consistency.

tool_registry:

  # --- inline (platform-intrinsic) ---
  inline:
    - id: ask-user
      description: Request human input for decisions requiring judgment
      inputs: [question: string]

  # --- agent-registry (invoke-* routing tools) ---
  # invoke-* tools take no explicit inputs; the platform routes
  # the parent agent's context to the target sub-agent.
  agent_registry:
    - id: invoke-deal-diagnosis
      target: ae-deal-diagnosis-agent
    - id: invoke-meeting-prep
      target: ae-meeting-prep-agent
    - id: invoke-opportunity-hygiene
      target: ae-opportunity-hygiene-agent
    - id: invoke-pipeline-gen
      target: ae-pipeline-gen-agent
    - id: invoke-pipeline-mgmt
      target: ae-pipeline-mgmt-agent
    - id: invoke-qualification
      target: ae-qualification-agent
    - id: invoke-signal-detection
      target: ae-signal-detection-agent
    - id: invoke-stakeholder-intelligence
      target: ae-stakeholder-agent
    - id: invoke-poc-agent
      target: poc-agent
    - id: invoke-rfp-agent
      target: rfp-agent
    - id: invoke-sa-best-practices-agent
      target: sa-best-practices-agent
    - id: invoke-sa-csp-agent
      target: sa-csp-agent
    - id: invoke-sa-decision-capture-agent
      target: sa-decision-capture-agent
    - id: invoke-sa-discovery-agent
      target: sa-discovery-agent
    - id: invoke-sa-journey-agent
      target: sa-journey-agent
    - id: invoke-sa-risk-agent
      target: sa-risk-agent
    - id: invoke-specialist-agent
      target: specialist-agent

