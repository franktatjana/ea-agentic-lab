# Agent Scaffold
# Centralized registry of all valid tool IDs, agent IDs, and scaffolding rules.
# Referenced by CLAUDE.md Step 8 for linting new agent definitions.
#
# Purpose:
#   1. Validate tool references in *-definition.yaml files
#   2. Validate invoke-* target agent IDs
#   3. Define the folder structure scaffold for new agents
#   4. Document the definition YAML template
#
# Reference implementation: domain/agents/account_executives/ (AE agent)

# ============================================================
# AGENT FOLDER STRUCTURE
# ============================================================
# Every agent directory must follow this structure.
# Files marked [mandatory] must exist. Files marked [optional]
# are created when the agent needs them.

folder_structure:
  mandatory:
    - pattern: "{role}-agent-definition.yaml"
      description: Canonical agent spec (Oracle Agent Spec 26.1.0)
    - pattern: "{role}-agent.md"
      description: Human-readable profile documentation
    - pattern: "agents/{role}_agent.yaml"
      description: Runtime agent configuration
    - pattern: "personalities/{role}_personality.yaml"
      description: Personality traits, tone, communication style
    - pattern: "prompts/tasks.yaml"
      description: Prompt registry with requires_data dependencies

  optional:
    - pattern: "prompts/context_template.md"
      description: Context injection template for prompt assembly
    - pattern: "skills/{skill_name}.yaml"
      description: Skill definitions (one per skill)
    - pattern: "references/{reference_name}.yaml"
      description: Domain knowledge, frameworks, methodologies
    - pattern: "{role}-{sub}-definition.yaml"
      description: Sub-agent definition (lives at directory root, same level as parent)

  # Holonic agents: orchestrators with sub-agents.
  # Sub-agent *-definition.yaml files sit at the directory root alongside
  # the parent definition. Sub-agents share the parent's prompts/, skills/,
  # references/ folders. Each sub-agent has its own personality file.
  #
  # Concrete example (account_executives/):
  #
  #   domain/agents/account_executives/
  #   ├── ae-agent-definition.yaml            ← parent orchestrator
  #   ├── ae-deal-diagnosis-definition.yaml    ← sub-agent
  #   ├── ae-meeting-prep-definition.yaml      ← sub-agent
  #   ├── ae-pipeline-mgmt-definition.yaml     ← sub-agent
  #   ├── ae-qualification-definition.yaml     ← sub-agent
  #   ├── ae-agent.md                          ← parent profile doc
  #   ├── agents/
  #   │   └── ae_agent.yaml
  #   ├── personalities/
  #   │   ├── ae_personality.yaml              ← parent personality
  #   │   ├── ae_deal_diagnosis_personality.yaml
  #   │   └── ae_qualification_personality.yaml
  #   ├── prompts/
  #   │   └── tasks.yaml                       ← shared prompt registry
  #   ├── skills/
  #   └── references/
  #
  holonic_agents:
    description: >
      Agents with sub-agents (orchestrators) place sub-agent definitions
      at the directory root, alongside the parent definition. The parent
      definition declares invoke-* tools and specialized_agents blocks.
      Each sub-agent definition sets metadata.parent_agent to the parent ID.
    reference: domain/agents/account_executives/
    example_parent: ae-agent-definition.yaml
    example_sub_agents:
      - ae-deal-diagnosis-definition.yaml
      - ae-meeting-prep-definition.yaml
      - ae-opportunity-hygiene-definition.yaml
      - ae-pipeline-gen-definition.yaml
      - ae-pipeline-mgmt-definition.yaml
      - ae-qualification-definition.yaml
      - ae-signal-detection-definition.yaml
      - ae-stakeholder-definition.yaml

# ============================================================
# DEFINITION YAML TEMPLATE
# ============================================================
# Minimal valid definition. Every field shown is required.
# See ae-agent-definition.yaml for a full reference.

definition_template:
  header:
    agentspec_version: "26.1.0"
    component_type: Agent
    id: "{role}-agent"
    name: "{Role} Agent"
    description: "One paragraph describing what this agent does and why it exists."

  metadata:
    definition_version: "0.1.0"
    parent_agent: null  # Set to parent ID for sub-agents
    disclaimer: >
      This agent specification is a reference design for educational and
      demonstration purposes. It is not a production system. All examples,
      case studies, and scenarios are fictional.
    tags: []  # At least 3 tags describing the agent's domain
    responsibility: "One sentence: what this agent is accountable for."

  required_blocks:
    - system_prompt    # What the agent does, routing rules, MUST/MUST NOT
    - human_in_the_loop  # true or false
    - llm_configuration  # model_id, temperature, max_tokens
    - inputs           # Typed input parameters
    - outputs          # Typed output parameters
    - tools            # ClientTool declarations with resolver
    - flows            # At least one flow (empty [] only for orchestrators)
    - a2a              # agent_url, connection_config, agent_card

  x_ea_agent_blocks:
    - prompt_registry  # Prompt definitions with requires_data
    - profile          # why, goals, role_context, capabilities, challenges
                       # sub_agents list lives here: x-ea-agent.profile.sub_agents
    - knowledge        # archetypes lives at: knowledge.scope.archetypes
    - guardrails       # boundaries, output_validation, signal_validation
    - handoffs         # human_escalation, agent_escalation
    - autonomy         # triggers, outputs, cascade_limits

# ============================================================
# TOOL VALIDATION RULES
# ============================================================
# Every ClientTool in a definition YAML must satisfy these rules.

tool_rules:
  - rule: "Every x-ea-agent block must have a resolver field"
    valid_values: [service-registry, agent-registry, inline]

  - rule: "resolver must match tool ID pattern"
    mapping:
      service-registry: "read-*, write-*, save-*, scan-*, get-*"
      agent-registry: "invoke-*"
      inline: "ask-user"

  - rule: "Tool ID must exist in this library's tool registry"
    action: "If a new tool ID is needed, add it here first"

  - rule: "invoke-* tools must have target_agent in x-ea-agent"
    action: "target_agent must match a valid agent ID"

  - rule: "requires_data.source must reference a tool in the same agent's tools block"
    action: "Cross-check prompt_registry against tools list"

  - rule: "Tool inputs must match canonical schema in this registry"
    action: "Compare agent's tool inputs block against the inputs declared here"

  - rule: "read-* and write-* naming may be asymmetric by design"
    note: >
      read-* tools query a data source (e.g. read-value-tracker reads the
      value tracking system). write-* tools persist artifacts to InfoHub
      (e.g. write-value-artifact). The naming reflects what is being accessed
      (tracker, database, data) vs what is being produced (artifact, insight,
      alert). This is not a bug.

