# Agent Definition Generator Overrides
# Handles edge cases where standard source-to-definition mapping needs adjustment

# Governance: signal_matcher has no personality file
signal_matcher:
  personality_source: config
  system_prompt_source: spec_md

# Governance: skill ownership
governance_skills:
  process_meeting: meeting_notes
  extract_decisions: decision_registrar

# Technology scout: prompt section mapping
technology_scout:
  scanner: scanning
  analyzer: analysis

# Specialist sub-agents: flat prompt format
specialist_sub_agents:
  prompt_format: flat
  prompt_file_pattern: "prompts/*_specialist_prompts.yaml"

# Temperature overrides (category defaults in script: sales=0.6, delivery=0.5, governance=0.4)
temperature_overrides:
  risk_radar: 0.4
  meeting_notes: 0.3
  infosec: 0.4
  leadership: 0.6
  poc: 0.5
  rfp: 0.4

# Specialized agent variant naming (override generic proactive/analytical)
specialized_variants:
  delivery:
    - id_suffix: tracking
      label: Tracking
      focus: "Real-time delivery monitoring and status updates"
    - id_suffix: transition
      label: Transition
      focus: "Phase transitions, handoffs, and go-live readiness"
  leadership:
    - id_suffix: operational
      label: Operational
      focus: "Day-to-day escalation handling and resource allocation"
    - id_suffix: strategic
      label: Strategic
      focus: "Portfolio oversight, coaching, and executive engagement"
  poc:
    - id_suffix: qualification
      label: Qualification
      focus: "POV qualification, kickoff, and success criteria"
    - id_suffix: execution
      label: Execution
      focus: "POV execution, conclusion, and conversion"
