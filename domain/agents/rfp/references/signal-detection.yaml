# RFP Signal Detection Reference
# Domain knowledge extracted to references/ per DDR-018

bid_quality_signals:
  positive:
    - "strong incumbency"
    - "existing relationship"
    - "reference customer"
    - "clear requirements"
    - "reasonable timeline"
    - "budget allocated"

  negative:
    - "wired for competitor"
    - "unrealistic timeline"
    - "no budget confirmed"
    - "checkbox exercise"
    - "unknown decision maker"

deadline_signals:
  keywords:
    - "submission deadline"
    - "Q&A cutoff"
    - "presentation date"
    - "evaluation period"
    - "shortlist announcement"

competitive_signals:
  keywords:
    - "incumbent"
    - "competitive evaluation"
    - "alternative solutions"
    - "market comparison"
