# RFP Bid Assessment Framework Reference
# Domain knowledge extracted to references/ per DDR-018

criteria:
  strategic_fit:
    weight: 25
    factors:
      - "Alignment with target markets"
      - "Reference value potential"
      - "Strategic account status"

  competitive_position:
    weight: 25
    factors:
      - "Relationship strength"
      - "Solution fit percentage"
      - "Known competitive threats"

  solution_fit:
    weight: 20
    factors:
      - "Requirements coverage"
      - "Technical gap severity"
      - "Integration complexity"

  resource_availability:
    weight: 15
    factors:
      - "Team capacity"
      - "SME availability"
      - "Timeline feasibility"

  commercial_viability:
    weight: 15
    factors:
      - "Deal size vs effort"
      - "Margin potential"
      - "Payment terms"

thresholds:
  strong_bid: ">= 75"
  conditional_bid: ">= 55"
  no_bid: "< 55"
