x-ea-agent:
  profile:
    role_context: 'Raw technology signals from job postings and public data need to be synthesized into maps showing what customers are investing in, what they''re moving away from, and where adoption is
      shifting. Without analysis, signal data sits unprocessed.

      '
    scenarios:
    - problem: Raw scan data accumulates but nobody synthesizes it into actionable intelligence
      why: 'The Scanner produces technology signal data from job postings and public sources, but without structured analysis, the data sits in raw form. Engagement teams walk into account meetings without
        knowing what the customer is actively investing in or moving away from.

        '
      agent: tech-signal-analyzer-agent
      agent_response: 'The agent transforms raw scan results into technology signal maps with ring assignments (Adopt, Trial, Assess, Hold) based on evidence thresholds. It calculates 30-day and 90-day
        trend directions and produces a weekly tech intelligence digest that highlights changes relevant to active engagements.

        '
      success_signal:
        metric: Technology signal maps generated per realm per cycle
        target: Weekly tech digest delivered for every active realm
        leading_indicator: Ring assignments updated within 48 hours of scan completion
        failure_signal: Engagement teams lack technology context in account reviews
    - problem: Competitor technology adoption goes undetected until the customer announces a decision
      why: 'Customers evaluate and adopt competitor technologies in parallel with vendor engagements. Without monitoring competitor tool mentions in hiring patterns and public signals, the team learns about
        displacement risk too late to respond with a counter-narrative.

        '
      agent: tech-signal-analyzer-agent
      agent_response: 'The agent identifies competitive technology mentions in scan data, maps them to vendor product categories, and flags displacement opportunities or threats. It produces a vendor landscape
        analysis that shows competitive positioning shifts over time, feeding directly into engagement strategy.

        '
      success_signal:
        metric: Competitive technology signals detected and surfaced
        target: Competitor adoption signals flagged within one analysis cycle of detection
        leading_indicator: Vendor landscape analysis includes competitive movement trends
        failure_signal: Competitive displacement discovered only when customer raises it
    challenges:
    - text: Signal data sits unprocessed without dedicated analysis time
      specific_overhead:
      - Manually correlating job posting data with known technology stacks
    - text: Technology trends at individual accounts aren't connected to deal strategy
      specific_overhead:
      - Building trend visualizations in slides for account reviews
    administrative_overhead:
    - Manually correlating job posting data with known technology stacks
    - Building trend visualizations in slides for account reviews
    capabilities:
    - Signal map generation
    - Technology trend visualization
    human_matters_summary: 'Technology trends require strategic context to matter. The agent analyzes adoption signals and assigns technology rings based on evidence, but the architect understands which
      trends signal architectural evolution for this customer, which competitor technologies threaten relationship resilience, and how to position recommendations. The analysis is structured, but human
      judgment decides how to engage.

      '
    playbook_raci:
      context: >
        The Tech Signal Analyzer owns 1 vendor analysis playbook and contributes
        technology assessment context to playbooks led by other roles.
      responsible:
        - playbook: Vendor Analysis (PB_TSCT_002)
          scope: Technology vendor evaluation, capability assessment, maturity scoring
          team: technology_scout
          file: PB_TSCT_002_vendor_analysis.yaml
      accountable:
        - playbook: Vendor Analysis (PB_TSCT_002)
          scope: Technology Scout Lead validates vendor assessment methodology and scoring
          team: technology_scout
      consulted:
        - playbook: Technology Vision (PB_FCTO_003)
          scope: Vendor capability data and maturity assessment for vision planning
          team: field_cto
          file: PB_FCTO_003_technology_vision.yaml
        - playbook: Partner Due Diligence (PB_AA_003)
          scope: Technology maturity assessment for partnership evaluation
          team: alliance_architects
          file: PB_AA_003_partner_due_diligence.yaml
      informed:
        - playbook: Cross-Account Pattern Synthesis (PB_FCTO_001)
          scope: Receives cross-account technology patterns for vendor context
          team: field_cto
  fallback_model: null
  prompt_registry:
    tech-signal-analyzer-tech-map-generation:
      description: Generate technology signal map from scan results
      source: prompts/tasks.yaml#analysis.tech_map_generation
      inputs:
      - title: company_name
        type: string
      - title: platform_offerings
        type: string
      - title: previous_map
        type: string
      - title: realm_id
        type: string
      - title: ring_rules
        type: string
      - title: scan_results
        type: string
