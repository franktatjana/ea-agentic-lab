      source: prompts/tasks.yaml#analysis.weekly_tech_digest
      inputs:
      - title: active_nodes
        type: string
      - title: company_name
        type: string
      - title: current_map
        type: string
      - title: date
        type: string
      - title: previous_week_map
        type: string
      - title: realm_id
