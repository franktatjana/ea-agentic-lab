# Technology Scout Analyzer - Ring Assignment Criteria
# Domain knowledge extracted to references/ per DDR-018

ring_assignment:
  adopt:
    description: "Technology is well-established and broadly adopted"
    criteria: "20+ mentions, 70%+ required ratio, stable or growing"
  trial:
    description: "Technology is gaining traction, worth evaluating"
    criteria: "10+ mentions, 50%+ required ratio"
  assess:
    description: "Technology is emerging, monitor for momentum"
    criteria: "3+ mentions or newly appeared"
  hold:
    description: "Technology is declining, avoid new adoption"
    criteria: "declining trend (-20% over 30 days)"

vendor_landscape:
  - "Map vendors by category (infrastructure, security, observability, etc.)"
  - "Track vendor adoption strength from job posting frequency"
  - "Detect vendor consolidation or displacement patterns"
