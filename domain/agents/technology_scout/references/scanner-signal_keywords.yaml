# Technology Scout Scanner - Signal Detection Keywords
# Domain knowledge extracted to references/ per DDR-018

technology_signals:
  - "adopting"
  - "migrating to"
  - "implementing"
  - "replacing"
  - "evaluating"
  - "standardizing on"
  - "partnership with"
  - "certified in"

vendor_signals:
  - "vendor selection"
  - "RFP"
  - "proof of concept"
  - "technology partner"
  - "strategic partnership"
  - "preferred vendor"

patterns:
  - "{company_name}.*partner.*{vendor_name}"
  - "{company_name}.*adopt|implement|migrate.*{technology}"
  - "{company_name}.*engineer|developer.*{technology}"
