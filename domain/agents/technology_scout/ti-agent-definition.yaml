toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: ti-agent-proactive
  name: Technology Intelligence Agent (Proactive)
  description: 'Proactive mode: monitors for technology signals and surfaces intelligence without prompting'
  agent:
    $component_ref: ti-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Route scanning
      requests to detect new signals before being asked. Surface intelligence
      that indicates technology shifts at active accounts. Prioritize timeliness
      over depth. Keep outputs concise and action-oriented. Flag anything that
      needs immediate attention.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: ti-agent-analytical
  name: Technology Intelligence Agent (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence trails and trend modeling'
  agent:
    $component_ref: ti-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Route analysis
      requests for comprehensive signal interpretation with full evidence trails.
      Synthesize scanning and analysis results across multiple realms. Prioritize
      accuracy and defensibility over speed. Include confidence levels and
      caveats where appropriate.

      '
    human_in_the_loop: true
flows: []
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - technology-signal-scanning
    - technology-signal-analysis
    - vendor-landscape-intelligence
    - weekly-tech-digest
    input_modes:
    - text/plain
    - application/json
    output_modes:
