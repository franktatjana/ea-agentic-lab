    playbook_raci:
      context: 'The Technology Intelligence orchestrator coordinates 2 playbooks covering technology landscape scanning and vendor analysis. It provides technology signal data to playbooks led by other roles.
'
      responsible:
      - playbook: Tech Landscape Scan (PB_TSCT_001)
