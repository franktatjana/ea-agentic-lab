  id: read-tech-data
  name: Read Technology Data
  description: 'Access data sources: scan results, signal maps, vendor landscapes, realm data'
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: write-tech-artifact
  name: Write Technology Artifact
  description: 'Save artifacts: signal maps, vendor landscapes, tech digests, analysis reports'
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or additional input from the user
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
- component_type: ClientTool
  id: invoke-ti-scanner
  name: Invoke TI Scanner Agent
  description: Route job posting scans, vendor announcement scans, tech blog scans, and source registry updates
  requires_confirmation: false
  inputs:
  - title: request
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: sub-agent
- component_type: ClientTool
  id: invoke-ti-analyzer
  name: Invoke TI Analyzer Agent
  description: Route tech map generation, ring assignment, vendor landscape analysis, and weekly digest requests
  requires_confirmation: false
  inputs:
  - title: request
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: sub-agent
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: ti-agent-proactive
  name: Technology Intelligence Agent (Proactive)
  description: 'Proactive mode: monitors for technology signals and surfaces intelligence without prompting'
  agent:
    $component_ref: ti-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Route scanning
      requests to detect new signals before being asked. Surface intelligence
      that indicates technology shifts at active accounts. Prioritize timeliness
      over depth. Keep outputs concise and action-oriented. Flag anything that
      needs immediate attention.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: ti-agent-analytical
  name: Technology Intelligence Agent (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence trails and trend modeling'
  agent:
    $component_ref: ti-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Route analysis
      requests for comprehensive signal interpretation with full evidence trails.
      Synthesize scanning and analysis results across multiple realms. Prioritize
      accuracy and defensibility over speed. Include confidence levels and
      caveats where appropriate.

      '
    human_in_the_loop: true
flows: []
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - technology-signal-scanning
    - technology-signal-analysis
    - vendor-landscape-intelligence
    - weekly-tech-digest
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain
x-ea-agent:
  profile:
    why: 'Technology intelligence is scattered across job boards, vendor announcements, engineering blogs, and conference talks with no systematic process to collect, normalize, and interpret it. SAs and engagement teams know these signals exist but lack the bandwidth to scan sources consistently, extract technology mentions, and synthesize them into maps that reveal where accounts are investing and what they are moving away from. The result is teams walking into customer conversations without knowing what technologies the customer is actively hiring for, which vendors they are evaluating, or whether competitive displacement is underway. The operational cost of this blindness is missed positioning opportunities, reactive engagement strategies, and technology recommendations that ignore what the customer has already decided.

      '
    human_matters_summary: 'The agent systematically scans and analyzes public technology signals, but the SA interprets what those signals mean for a specific engagement. Technology adoption patterns reveal direction, but human judgment determines which signals indicate openness to solutions, which represent locked-in decisions, and how to position recommendations that align with the customer''s trajectory. The intelligence is structured, but translating it into strategy requires relationship context and commercial awareness that the agent does not possess.

      '
    human_matters_goal: 'Every engagement team enters customer conversations with current, evidence-based technology intelligence, and the SA decides how to use it.

      '
    role_tab_intro: 'Technology intelligence sits at the foundation of informed engagement. Without systematic signal detection, engagement teams operate on stale assumptions about what customers are investing in. The Technology Intelligence function bridges the gap between publicly available technology adoption signals and the structured intelligence that SAs need to position effectively. The challenges below capture where technology intelligence time gets consumed, mapped to the sub-agents built to handle each.

      '
    role_context: 'The Technology Intelligence function owns the end-to-end pipeline from raw technology signal detection to structured, actionable intelligence. It monitors job postings, vendor announcements, engineering blogs, and conference talks to detect what technologies companies are adopting, evaluating, or abandoning. The scanning layer captures and normalizes raw signals with source attribution. The analysis layer transforms those signals into technology maps with ring assignments (Adopt, Trial, Assess, Hold), trend tracking over 30-day and 90-day periods, vendor landscape mapping, and competitive technology detection. The function serves engagement teams by providing weekly tech intelligence digests and on-demand signal analysis for specific accounts or realms.

      '
    goals_summary: 'The Technology Intelligence function succeeds when every active realm has a current technology signal map, engagement teams receive weekly intelligence digests, and no significant technology adoption shift at a target account goes undetected.

      '
    goals:
    - Achieve weekly scanning cadence for all realm-associated companies across job postings and public sources
    - Maintain technology signal maps with ring assignments updated within 48 hours of scan completion
    - Deliver weekly tech intelligence digests for every active realm
    - Detect competitive technology adoption signals within one scanning cycle of public appearance
    - Track technology trends with 30-day and 90-day directional indicators for all active technologies
    - Achieve 90%+ source attribution coverage across all detected signals
    - Surface vendor landscape shifts within one analysis cycle of detection
    - Reduce engagement team technology blindspots by providing pre-meeting intelligence briefs
    - Maintain a normalized technology taxonomy across all scanned sources to prevent duplicate or ambiguous signal entries
    - Produce cross-realm competitive intelligence alerts within 48 hours of detecting industry-wide adoption patterns
    key_metrics:
    - name: Scanning Coverage
      definition: Percentage of realm-associated companies scanned per cycle (target 100% weekly)
    - name: Signal Freshness
      definition: Median age of most recent scan per realm (target less than 7 days)
    - name: Ring Assignment Currency
      definition: Percentage of technologies with current ring assignment (target greater than 95%)
    - name: Digest Delivery Rate
      definition: Weekly digests delivered on time for active realms (target 100%)
    - name: Competitive Detection Latency
      definition: Time from public signal appearance to flagged intelligence (target less than 1 scanning cycle)
    - name: Source Attribution
      definition: Percentage of signals with verified source citation (target greater than 90%)
    - name: Trend Accuracy
      definition: Directional trend predictions validated against subsequent data (target greater than 75% accuracy)
    key_responsibilities:
    - Orchestrate technology signal scanning across job postings, vendor announcements, and engineering blogs
    - Coordinate signal analysis pipeline from raw data to structured technology maps
    - Ensure weekly tech intelligence digests are generated and delivered for all active realms
    - Route scanning requests to the TI Scanner Agent for data gathering
    - Route analysis requests to the TI Analyzer Agent for signal interpretation
    - Aggregate cross-domain results when requests span both scanning and analysis
    - Escalate signals indicating major vendor displacement at strategic accounts
    - Maintain scanning cadence and analysis freshness across the realm portfolio
    - Enforce technology taxonomy consistency across scanning and analysis outputs
    - Provide technology intelligence to collaborating agents including AE, Field CTO, CI, and Alliance Architects
    - Validate signal quality and source reliability before routing data to the analysis pipeline
    challenges:
    - text: Technology adoption signals are spread across dozens of public sources with no systematic collection process
      solved_by: tech-signal-scanner-agent
      category: "Job Posting and Hiring Signal Collection"
      specific_overhead:
      - Browsing job boards, vendor blogs, and conference sites manually for each account before meetings
    - text: Raw scan data accumulates without synthesis because analysis requires dedicated time that competes with active deals
      solved_by: tech-signal-analyzer-agent
      category: "Technology Map Generation"
      specific_overhead:
      - Manually correlating job posting data with known technology stacks in spreadsheets that are never shared
    - text: Competitive technology adoption goes undetected until the customer announces a decision or asks about a competitor product
      solved_by: tech-signal-analyzer-agent
      category: "Competitive Technology Analysis"
      specific_overhead:
      - Learning about competitor displacement only when the customer mentions it during a meeting
    - text: Technology intelligence is per-person rather than per-team, creating inconsistent account knowledge across engagement teams
      solved_by: ti-agent
      category: "Cross-Domain Intelligence Distribution"
      specific_overhead:
      - Different team members have different, conflicting views of what technologies a customer uses
    - text: Scanning and analysis happen in the same person's head with no structured handoff, causing both tasks to be done superficially
      solved_by: ti-agent
      category: "Weekly Intelligence Digest"
      specific_overhead:
      - Combining quick job board searches with informal analysis during prep, producing neither thorough scanning nor rigorous analysis
    - text: Vendor announcements and partnership changes are only discovered when the customer asks about them, leaving the engagement team unable to proactively position alternatives
      solved_by: tech-signal-scanner-agent
      category: "Vendor and Partnership Monitoring"
      specific_overhead:
      - Missing vendor EOL announcements that create migration opportunities at key accounts
      - Learning about partnership changes from customer presentations rather than from proactive monitoring
    - text: Engineering blog posts and conference talks that reveal first-party technology decisions are never systematically captured, so engagement teams miss architecture changes that happen before hiring data confirms them
      solved_by: tech-signal-scanner-agent
      category: "Engineering Blog and Conference Scanning"
      specific_overhead:
      - Manually checking selected company engineering blogs before major account meetings, covering only accounts the SA already knows well
      - Conference talk references passed around informally in Slack with no structured capture or linkage to accounts
    - text: Technology taxonomy inconsistencies across scan cycles generate false trend readings that make stable technologies appear to be rising or falling when only the label changed
      solved_by: tech-signal-scanner-agent
      category: "Signal Quality and Taxonomy"
      specific_overhead:
      - Reconciling variant technology names manually when preparing trend slides, consuming preparation time and producing unreliable trend data
      - Discovering taxonomy drift only when analysis results contradict field observations, requiring manual audit of months of scan data
    - text: Hiring signal clusters pointing to a net-new technology area go unrecognized because role volume is not analyzed for skill concentration, leaving engagement teams unaware of platform bets before vendor confirmation
      solved_by: tech-signal-scanner-agent
      category: "Job Posting and Hiring Signal Collection"
      specific_overhead:
      - Reviewing individual job postings without aggregating role types or skill clusters, missing the directional pattern that multiple related postings would reveal
      - Realizing a customer had been building a data platform capability for six months only after the customer mentioned it in a QBR
    - text: Technology ring assignments become stale between scan cycles and are cited in customer conversations as current intelligence when they no longer reflect the customer's actual adoption stage
      solved_by: tech-signal-analyzer-agent
      category: "Technology Map Generation"
      specific_overhead:
      - Using technology maps from the previous quarter in active engagement preparation because no updated map was produced after the last scan
      - Discovering ring assignment staleness only when the customer corrects the SA during a meeting, undermining credibility
    - text: Cross-realm competitive technology patterns that require a coordinated vertical response are handled as isolated account issues, allowing competitors to build momentum before the team recognizes the trend
      solved_by: tech-signal-analyzer-agent
      category: "Competitive Technology Analysis"
      specific_overhead:
      - Each SA addresses competitor mentions independently in account planning without access to signals from adjacent accounts in the same vertical
      - Vertical-level competitive response strategies assembled reactively after the pattern is already visible in multiple lost deals
    - text: Technology intelligence produced for one realm is not routed to collaborating agents, so AE deal positioning, Field CTO vision planning, and CI battlecard updates operate on outdated or incomplete technology context
      solved_by: tech-signal-analyzer-agent
      category: "Cross-Domain Intelligence Distribution"
      specific_overhead:
      - AE account plans and Field CTO technology narratives prepared from separate, manually maintained technology notes with no shared source
      - CI battlecard refresh requests triggered by field observation rather than by technology signal data, causing battlecards to lag competitive movement by weeks
    administrative_overhead:
    - Browsing job boards and filtering postings by technology keywords for each account
    - Manually correlating job posting data with known technology stacks
    - Building trend visualizations in slides for account reviews
    - Logging findings in spreadsheets that are never aggregated across the team
    - Checking vendor announcement pages and engineering blogs without a structured cadence
    scenarios:
    - problem: An engagement team is preparing for a strategic account review but has no current view of the customer's technology investments and hiring patterns
      why: 'Technology signals from job postings and public sources change weekly, but account reviews happen quarterly. Between reviews, nobody systematically tracks what the customer is hiring for, which vendors they are evaluating, or whether their technology stack is shifting. The SA enters the review with a technology landscape that may be months out of date, missing positioning opportunities or failing to address competitive threats the customer is already considering.

        '
      agent: ti-agent
      agent_response: 'The orchestrator routes to the TI Scanner Agent to run a full scan across job postings, vendor announcements, and engineering blogs for the account. Once scanning completes, it routes the results to the TI Analyzer Agent to generate a current technology signal map with ring assignments, trend indicators, and competitive technology flags. The engagement team receives a pre-meeting intelligence brief showing what has changed since the last review.

        '
      success_signal:
        metric: Pre-meeting intelligence briefs delivered with current technology data
        target: Every strategic account review includes a technology signal map updated within 7 days
        leading_indicator: Engagement teams reference technology intelligence data during account reviews
        failure_signal: Account reviews proceed with technology assumptions from the previous quarter
    - problem: A competitor technology starts appearing in hiring patterns across multiple accounts in the same industry vertical, but nobody connects the dots
      why: 'Individual account scanning may detect a competitor mention, but without cross-realm analysis, the pattern of industry-wide adoption goes unrecognized. The team responds to each account individually rather than recognizing a competitive trend that requires a coordinated response across the vertical.

        '
      agent: ti-agent
      agent_response: 'The orchestrator routes scanning requests across all realm-associated companies in the affected vertical to the TI Scanner Agent, then routes the aggregated results to the TI Analyzer Agent for cross-realm competitive analysis. The Analyzer identifies the pattern, quantifies adoption velocity, and produces a competitive intelligence alert showing which accounts are affected and at what stage of adoption.

        '
      success_signal:
        metric: Cross-realm competitive patterns detected and communicated
        target: Industry-wide technology adoption trends flagged within two scanning cycles of emergence
        leading_indicator: Competitive intelligence alerts reference data from multiple realms
        failure_signal: Competitive technology trends discovered account-by-account over months rather than identified as a pattern
    - problem: The weekly tech digest is inconsistent because scanning and analysis depend on the same person finding time for both
      why: 'When scanning and analysis are not separated, both tasks compete for the same time slot. The person doing the work tends to either scan superficially and analyze thoroughly, or scan thoroughly and skip analysis. The result is a weekly digest that varies in quality, coverage, and timeliness depending on how busy the responsible person was that week.

        '
      agent: ti-agent
      agent_response: 'The orchestrator enforces the separation by routing scanning to the TI Scanner Agent on a fixed cadence and routing analysis to the TI Analyzer Agent once scanning completes. The digest is generated from structured, normalized scan data rather than ad-hoc observations, ensuring consistent quality and coverage regardless of individual workload.

        '
      success_signal:
        metric: Weekly digest consistency and on-time delivery
        target: 100% of active realms receive a weekly digest with standardized format and coverage
        leading_indicator: Digests are generated from complete scan data rather than partial observations
        failure_signal: Weekly digest skipped or delivered late because the responsible person was occupied with active deals
    capabilities:
    - Technology signal scanning orchestration across multiple source types
    - Signal analysis pipeline coordination from raw data to structured maps
    - Cross-realm technology trend detection and competitive intelligence
    - Weekly tech intelligence digest orchestration
    - Pre-meeting technology intelligence brief generation
    - Vendor landscape intelligence aggregation
    stakeholder_landscape:
      customer_side:
      - "Technology Vendors: product announcements, partnership disclosures, roadmap signals"
      - "Industry Analysts (Gartner, Forrester): technology adoption research, hype cycle positioning"
      - "Engineering Communities: conference talks, open source adoption signals, blog posts"
      - "Developer Advocates/CTOs: technology direction signals, platform adoption patterns, architecture preferences"
      internal_team:
      - "Solution Architect: primary consumer of technology intelligence for engagement positioning"
      - "Field CTO: technology vision planning, cross-account pattern synthesis"
      - "Account Executive: deal strategy informed by customer technology investments"
      - "Competitive Intelligence: competitor technology adoption signals feeding battlecard updates"
      - "Alliance Architect: vendor landscape data for partnership evaluation"
    sub_agents:
    - name: TI Scanner Agent
      id: tech-signal-scanner-agent
      purpose: Scan job postings, vendor announcements, and engineering blogs to detect and normalize technology adoption signals
    - name: TI Analyzer Agent
      id: tech-signal-analyzer-agent
      purpose: Analyze scan results to generate technology signal maps, ring assignments, vendor landscapes, and weekly digests
    with_this_agent:
    - domain: Job Posting and Hiring Signal Collection
      agent: tech-signal-scanner-agent
      items:
      - 'Job Posting Scan: Scan job postings from realm-associated companies to extract technology adoption signals and identify skill clusters that reveal strategic investment direction'
      - 'Hiring Pattern Analysis: Detect patterns in role types and volume to surface technology bets before vendor or analyst confirmation'
      - 'Signal Normalization: Deduplicate and normalize extracted technology mentions against the canonical taxonomy for analysis-ready output'
    - domain: Vendor and Partnership Monitoring
      agent: tech-signal-scanner-agent
      items:
      - 'Vendor Announcement Monitoring: Track product launches, roadmap disclosures, and pricing changes from vendors active in target realms'
      - 'Partnership and Ecosystem Scanning: Detect new alliances, integration announcements, and OEM changes that shift the competitive landscape'
      - 'EOL and Deprecation Detection: Flag end-of-life notices and sunset announcements that create migration opportunities at active accounts'
    - domain: Engineering Blog and Conference Scanning
      agent: tech-signal-scanner-agent
      items:
      - 'Engineering Blog Scan: Monitor engineering and developer blogs published by realm-associated companies to detect first-party technology adoption signals'
      - 'Conference Talk Monitoring: Scan conference session abstracts and recordings for technology stack references and architectural direction signals'
      - 'Community Signal Detection: Track open source contributions, forum activity, and developer community signals to identify adoption trends ahead of hiring patterns'
    - domain: Technology Map Generation
      agent: tech-signal-analyzer-agent
      items:
      - 'Tech Signal Map Generation: Synthesize normalized scan data into structured technology maps with ring assignments (Adopt, Trial, Assess, Hold) and source attribution'
      - 'Stack Mapping: Construct per-account technology stacks from aggregated signals, identifying platform layers, integration points, and coverage gaps'
      - 'Trend Calculation: Compute 30-day and 90-day directional indicators for each technology to distinguish sustained adoption from one-time mentions'
    - domain: Competitive Technology Analysis
      agent: tech-signal-analyzer-agent
      items:
      - 'Competitive Adoption Detection: Identify competitor technology mentions across accounts and flag patterns that indicate active evaluation or displacement risk'
      - 'Displacement Risk Scoring: Score accounts by displacement probability based on signal frequency, recency, and source credibility'
      - 'Cross-Realm Pattern Recognition: Aggregate competitive signals across multiple realms to surface industry-wide adoption trends requiring a coordinated response'
    - domain: Weekly Intelligence Digest
      agent: tech-signal-analyzer-agent
      items:
      - 'Digest Generation: Produce weekly technology intelligence summaries for every active realm, covering new signals, ring changes, and trend shifts since the prior cycle'
      - 'Trend Indicators: Include 30-day and 90-day momentum indicators per technology so engagement teams can distinguish emerging bets from stable investments'
      - 'Account Preparation Briefs: Generate pre-meeting intelligence briefs for scheduled engagements, surfacing technology changes most relevant to the upcoming conversation'
    - domain: Signal Quality and Taxonomy
      agent: tech-signal-scanner-agent
      items:
      - 'Taxonomy Enforcement: Validate that all scanner output uses canonical technology names, preventing duplicate or ambiguous entries from propagating into analysis'
      - 'Source Reliability Gating: Evaluate source credibility before routing scan data to the analysis pipeline, rejecting low-confidence inputs that would degrade intelligence quality'
      - 'Signal Quality Validation: Confirm that signals meet evidence threshold requirements and carry source attribution before analysis begins'
    - domain: Cross-Domain Intelligence Distribution
      agent: tech-signal-analyzer-agent
      items:
      - 'AE Intelligence Feed: Deliver technology signal maps and account briefs to the AE Agent to support deal positioning and account strategy'
      - 'Field CTO Signal Distribution: Route technology trend data and cross-realm patterns to the Field CTO Agent for technology vision planning'
      - 'CI and Alliance Distribution: Provide competitive technology adoption signals to the CI Agent for battlecard updates and vendor landscape data to the Alliance Architect Agent for partnership evaluation'
    activity_map:
      purpose: 'The Technology Intelligence function exists to ensure engagement teams have current, evidence-based technology intelligence for every active account. Everything the Technology Intelligence function does falls into one of eight operational domains. Scanning domains are owned by the TI Scanner Agent, analysis and delivery domains by the TI Analyzer Agent, and orchestration domains by the TI orchestrator itself. Each domain operates independently with its own tools, flows, and boundaries.

        '
      domains:
      - domain: Job Posting and Hiring Signal Collection
        why: 'Hiring patterns are the earliest public signal of strategic technology investment. Companies begin recruiting for technologies months before vendor announcements or analyst coverage confirms adoption. Without systematic job posting scans, engagement teams miss the window to position ahead of a customer decision and arrive at conversations reacting to investments already made.

          '
        agent: tech-signal-scanner-agent
        contributing_agents:
        - agent: tech-signal-analyzer-agent
          provides: Feedback on signal quality and taxonomy gaps to refine keyword extraction
        activities:
        - Job posting scanning across realm-associated companies for technology keyword extraction
        - Role volume and skill cluster analysis to detect directional investment signals
        - Technology mention normalization against canonical taxonomy
        - Deduplication of repeated postings across time windows
        - Source registry updates for job board coverage tracking
        cadence: weekly scanning cycle per realm, continuous monitoring for strategic accounts
      - domain: Vendor and Partnership Monitoring
        why: 'Vendor EOL announcements and partnership changes create time-sensitive migration and displacement opportunities. Engagement teams that discover these signals after the customer does lose the ability to proactively position alternatives, appearing reactive rather than strategic. Systematic monitoring ensures the team surfaces vendor landscape shifts before the customer raises them.

          '
        agent: tech-signal-scanner-agent
        activities:
        - Vendor product announcement and roadmap disclosure monitoring
        - Partnership, OEM, and integration announcement detection
        - EOL and deprecation notice scanning for vendors active in target realms
        - Pricing change and licensing shift detection
        - Vendor registry updates to maintain source coverage
        cadence: continuous monitoring for high-priority vendors, weekly sweep for long-tail sources
      - domain: Engineering Blog and Conference Scanning
        why: 'Engineering blogs and conference talks carry first-party technology signals that hiring data does not surface until adoption is already underway. When a company publishes a post about migrating to a new platform or presents an architecture change at a conference, it is documenting a decision in progress. Capturing these signals provides context that transforms a job posting from a data point into a directional story.

          '
        agent: tech-signal-scanner-agent
        contributing_agents:
        - agent: tech-signal-analyzer-agent
          provides: Signals requiring deeper interpretation routed back for context enrichment
        activities:
        - Engineering blog monitoring for realm-associated companies
        - Conference talk abstract and recording scanning for technology references
        - Open source contribution and community activity tracking
        - Developer forum and community signal detection
        - Blog source registry maintenance and coverage auditing
        cadence: weekly scan cycle, triggered scan on new publication detection
      - domain: Technology Map Generation
        why: 'Raw scan output is only valuable once it is synthesized into a structured technology map an engagement team can act on. Without ring assignment, trend tracking, and source attribution, the data remains a list of mentions with no sense of what the customer is committed to, what they are evaluating, and what they are walking away from. The technology map is the primary artifact that turns scanning into engagement strategy.

          '
        agent: tech-signal-analyzer-agent
        contributing_agents:
        - agent: tech-signal-scanner-agent
          provides: Normalized, deduplicated scan data with source attribution for analysis input
        activities:
        - Technology signal map generation with Adopt, Trial, Assess, and Hold ring assignments
        - Per-account stack construction from aggregated scan signals
        - 30-day and 90-day trend calculation and momentum scoring
        - Source attribution linking each ring assignment to its evidence
        - Map versioning to track stack evolution across scan cycles
        cadence: within 48 hours of scan completion, incremental updates on triggered scans
      - domain: Competitive Technology Analysis
        why: 'Competitive displacement is rarely announced. It surfaces as hiring patterns for a competitor platform, a vendor partnership announcement, or a conference talk describing a migration. Without dedicated analysis to detect these signals and score displacement risk, teams learn about competitive threats when the customer mentions them during a meeting, at which point positioning options are limited.

          '
        agent: tech-signal-analyzer-agent
        activities:
        - Competitive technology mention identification across all scan results
        - Displacement risk scoring by signal frequency, recency, and source credibility
        - Cross-realm competitive pattern aggregation for industry-wide trend detection
        - Competitive alert generation for accounts above displacement risk threshold
        - Trend correlation between competitor hiring signals and customer technology shifts
        cadence: within 48 hours of scan completion, immediate alert for high-risk displacement signals
      - domain: Weekly Intelligence Digest
        why: 'Engagement teams need a reliable, consistent intelligence feed to stay current across an active realm portfolio. When digest quality and timing depend on individual bandwidth, some accounts receive thorough coverage while others get skipped. A structured digest process decouples intelligence delivery from the workload of the person responsible and ensures every active realm receives the same baseline of technology context each week.

          '
        agent: tech-signal-analyzer-agent
        activities:
        - Weekly technology intelligence digest generation per active realm
        - Ring change and trend shift highlighting since the prior scan cycle
        - Pre-meeting intelligence brief generation for scheduled engagements
        - Digest delivery to the InfoHub for consumption by collaborating agents
        - Coverage completeness validation before delivery
        cadence: weekly digest on fixed cycle, pre-meeting briefs on demand
      - domain: Signal Quality and Taxonomy
        why: 'Intelligence quality degrades silently when taxonomy inconsistencies or low-confidence signals enter the analysis pipeline unchecked. A signal labeled differently across two scan cycles creates false trend readings. A source with no attribution undermines the evidence standard that engagement teams need to cite intelligence in customer conversations. Taxonomy enforcement and quality gating are the controls that keep the entire intelligence pipeline credible.

          '
        agent: tech-signal-scanner-agent
        activities:
        - Canonical taxonomy validation of all scanner output before routing to analysis
        - Source credibility evaluation and confidence threshold enforcement
        - Source attribution completeness checks
        - Signal rejection and feedback loop to scanner for below-threshold inputs
        - Taxonomy change management when new technologies require registry updates
        cadence: inline with every scan-to-analysis routing, taxonomy review monthly
      - domain: Cross-Domain Intelligence Distribution
        why: 'Technology intelligence has no impact if it stays inside the scanning and analysis pipeline. AE agents need account technology maps to position deals. The Field CTO needs trend data to build technology vision narratives. The CI agent needs competitive technology signals to maintain current battlecards. Distribution is the step that converts intelligence into engagement value.

          '
        agent: tech-signal-analyzer-agent
        activities:
        - Technology signal map and account brief delivery to the AE Agent
        - Technology trend data and cross-realm pattern routing to the Field CTO Agent
        - Competitive technology adoption signal delivery to the CI Agent
        - Vendor landscape data routing to the Alliance Architect Agent
        - Distribution confirmation and InfoHub write verification
        cadence: on completion of each analysis cycle, weekly digest distribution on fixed schedule
    public_resources:
