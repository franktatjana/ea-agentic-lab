x-ea-agent:
  profile:
    why: 'Technology intelligence is scattered across job boards, vendor announcements, engineering blogs, and conference talks with no systematic process to collect, normalize, and interpret it. SAs and engagement teams know these signals exist but lack the bandwidth to scan sources consistently, extract technology mentions, and synthesize them into maps that reveal where accounts are investing and what they are moving away from. The result is teams walking into customer conversations without knowing what technologies the customer is actively hiring for, which vendors they are evaluating, or whether competitive displacement is underway. The operational cost of this blindness is missed positioning opportunities, reactive engagement strategies, and technology recommendations that ignore what the customer has already decided.

      '
    human_matters_summary: 'The agent systematically scans and analyzes public technology signals, but the SA interprets what those signals mean for a specific engagement. Technology adoption patterns reveal direction, but human judgment determines which signals indicate openness to solutions, which represent locked-in decisions, and how to position recommendations that align with the customer''s trajectory. The intelligence is structured, but translating it into strategy requires relationship context and commercial awareness that the agent does not possess.

      '
    human_matters_goal: 'Every engagement team enters customer conversations with current, evidence-based technology intelligence, and the SA decides how to use it.

      '
    role_tab_intro: 'Technology intelligence sits at the foundation of informed engagement. Without systematic signal detection, engagement teams operate on stale assumptions about what customers are investing in. The Technology Intelligence function bridges the gap between publicly available technology adoption signals and the structured intelligence that SAs need to position effectively. The challenges below capture where technology intelligence time gets consumed, mapped to the sub-agents built to handle each.

      '
    role_context: 'The Technology Intelligence function owns the end-to-end pipeline from raw technology signal detection to structured, actionable intelligence. It monitors job postings, vendor announcements, engineering blogs, and conference talks to detect what technologies companies are adopting, evaluating, or abandoning. The scanning layer captures and normalizes raw signals with source attribution. The analysis layer transforms those signals into technology maps with ring assignments (Adopt, Trial, Assess, Hold), trend tracking over 30-day and 90-day periods, vendor landscape mapping, and competitive technology detection. The function serves engagement teams by providing weekly tech intelligence digests and on-demand signal analysis for specific accounts or realms.

      '
    goals_summary: 'The Technology Intelligence function succeeds when every active realm has a current technology signal map, engagement teams receive weekly intelligence digests, and no significant technology adoption shift at a target account goes undetected.

      '
    goals:
    - Achieve weekly scanning cadence for all realm-associated companies across job postings and public sources
    - Maintain technology signal maps with ring assignments updated within 48 hours of scan completion
    - Deliver weekly tech intelligence digests for every active realm
    - Detect competitive technology adoption signals within one scanning cycle of public appearance
    - Track technology trends with 30-day and 90-day directional indicators for all active technologies
    - Achieve 90%+ source attribution coverage across all detected signals
    - Surface vendor landscape shifts within one analysis cycle of detection
    - Reduce engagement team technology blindspots by providing pre-meeting intelligence briefs
    - Maintain a normalized technology taxonomy across all scanned sources to prevent duplicate or ambiguous signal entries
    - Produce cross-realm competitive intelligence alerts within 48 hours of detecting industry-wide adoption patterns
    key_metrics:
    - name: Scanning Coverage
      definition: Percentage of realm-associated companies scanned per cycle (target 100% weekly)
    - name: Signal Freshness
      definition: Median age of most recent scan per realm (target less than 7 days)
    - name: Ring Assignment Currency
      definition: Percentage of technologies with current ring assignment (target greater than 95%)
    - name: Digest Delivery Rate
      definition: Weekly digests delivered on time for active realms (target 100%)
    - name: Competitive Detection Latency
      definition: Time from public signal appearance to flagged intelligence (target less than 1 scanning cycle)
    - name: Source Attribution
      definition: Percentage of signals with verified source citation (target greater than 90%)
    - name: Trend Accuracy
      definition: Directional trend predictions validated against subsequent data (target greater than 75% accuracy)
    key_responsibilities:
    - Orchestrate technology signal scanning across job postings, vendor announcements, and engineering blogs
    - Coordinate signal analysis pipeline from raw data to structured technology maps
    - Ensure weekly tech intelligence digests are generated and delivered for all active realms
    - Route scanning requests to the TI Scanner Agent for data gathering
    - Route analysis requests to the TI Analyzer Agent for signal interpretation
    - Aggregate cross-domain results when requests span both scanning and analysis
    - Escalate signals indicating major vendor displacement at strategic accounts
    - Maintain scanning cadence and analysis freshness across the realm portfolio
    - Enforce technology taxonomy consistency across scanning and analysis outputs
    - Provide technology intelligence to collaborating agents including AE, Field CTO, CI, and Alliance Architects
    - Validate signal quality and source reliability before routing data to the analysis pipeline
    challenges:
    - text: Technology adoption signals are spread across dozens of public sources with no systematic collection process
      solved_by: tech-signal-scanner-agent
      specific_overhead:
      - Browsing job boards, vendor blogs, and conference sites manually for each account before meetings
    - text: Raw scan data accumulates without synthesis because analysis requires dedicated time that competes with active deals
      solved_by: tech-signal-analyzer-agent
      specific_overhead:
      - Manually correlating job posting data with known technology stacks in spreadsheets that are never shared
    - text: Competitive technology adoption goes undetected until the customer announces a decision or asks about a competitor product
      solved_by: tech-signal-analyzer-agent
      specific_overhead:
      - Learning about competitor displacement only when the customer mentions it during a meeting
    - text: Technology intelligence is per-person rather than per-team, creating inconsistent account knowledge across engagement teams
      solved_by: ti-agent
      specific_overhead:
      - Different team members have different, conflicting views of what technologies a customer uses
    - text: Scanning and analysis happen in the same person's head with no structured handoff, causing both tasks to be done superficially
      solved_by: ti-agent
      specific_overhead:
      - Combining quick job board searches with informal analysis during prep, producing neither thorough scanning nor rigorous analysis
    administrative_overhead:
    - Browsing job boards and filtering postings by technology keywords for each account
    - Manually correlating job posting data with known technology stacks
    - Building trend visualizations in slides for account reviews
    - Logging findings in spreadsheets that are never aggregated across the team
    - Checking vendor announcement pages and engineering blogs without a structured cadence
    scenarios:
    - problem: An engagement team is preparing for a strategic account review but has no current view of the customer's technology investments and hiring patterns
      why: 'Technology signals from job postings and public sources change weekly, but account reviews happen quarterly. Between reviews, nobody systematically tracks what the customer is hiring for, which vendors they are evaluating, or whether their technology stack is shifting. The SA enters the review with a technology landscape that may be months out of date, missing positioning opportunities or failing to address competitive threats the customer is already considering.

        '
      agent: ti-agent
      agent_response: 'The orchestrator routes to the TI Scanner Agent to run a full scan across job postings, vendor announcements, and engineering blogs for the account. Once scanning completes, it routes the results to the TI Analyzer Agent to generate a current technology signal map with ring assignments, trend indicators, and competitive technology flags. The engagement team receives a pre-meeting intelligence brief showing what has changed since the last review.

        '
      success_signal:
        metric: Pre-meeting intelligence briefs delivered with current technology data
        target: Every strategic account review includes a technology signal map updated within 7 days
        leading_indicator: Engagement teams reference technology intelligence data during account reviews
        failure_signal: Account reviews proceed with technology assumptions from the previous quarter
    - problem: A competitor technology starts appearing in hiring patterns across multiple accounts in the same industry vertical, but nobody connects the dots
      why: 'Individual account scanning may detect a competitor mention, but without cross-realm analysis, the pattern of industry-wide adoption goes unrecognized. The team responds to each account individually rather than recognizing a competitive trend that requires a coordinated response across the vertical.

        '
      agent: ti-agent
      agent_response: 'The orchestrator routes scanning requests across all realm-associated companies in the affected vertical to the TI Scanner Agent, then routes the aggregated results to the TI Analyzer Agent for cross-realm competitive analysis. The Analyzer identifies the pattern, quantifies adoption velocity, and produces a competitive intelligence alert showing which accounts are affected and at what stage of adoption.

        '
      success_signal:
        metric: Cross-realm competitive patterns detected and communicated
        target: Industry-wide technology adoption trends flagged within two scanning cycles of emergence
        leading_indicator: Competitive intelligence alerts reference data from multiple realms
        failure_signal: Competitive technology trends discovered account-by-account over months rather than identified as a pattern
    - problem: The weekly tech digest is inconsistent because scanning and analysis depend on the same person finding time for both
      why: 'When scanning and analysis are not separated, both tasks compete for the same time slot. The person doing the work tends to either scan superficially and analyze thoroughly, or scan thoroughly and skip analysis. The result is a weekly digest that varies in quality, coverage, and timeliness depending on how busy the responsible person was that week.

        '
      agent: ti-agent
      agent_response: 'The orchestrator enforces the separation by routing scanning to the TI Scanner Agent on a fixed cadence and routing analysis to the TI Analyzer Agent once scanning completes. The digest is generated from structured, normalized scan data rather than ad-hoc observations, ensuring consistent quality and coverage regardless of individual workload.

        '
      success_signal:
        metric: Weekly digest consistency and on-time delivery
        target: 100% of active realms receive a weekly digest with standardized format and coverage
        leading_indicator: Digests are generated from complete scan data rather than partial observations
        failure_signal: Weekly digest skipped or delivered late because the responsible person was occupied with active deals
    capabilities:
    - Technology signal scanning orchestration across multiple source types
    - Signal analysis pipeline coordination from raw data to structured maps
    - Cross-realm technology trend detection and competitive intelligence
    - Weekly tech intelligence digest orchestration
    - Pre-meeting technology intelligence brief generation
    - Vendor landscape intelligence aggregation
    stakeholder_landscape:
      external:
      - role: 'Technology vendors: product announcements, partnership disclosures, roadmap signals'
        connected_via: tech-signal-scanner-agent
      - role: 'Industry analysts (Gartner, Forrester): technology adoption research, hype cycle positioning'
        connected_via: tech-signal-analyzer-agent
      - role: 'Engineering communities: conference talks, open source adoption signals, blog posts'
        connected_via: tech-signal-scanner-agent
      internal:
      - role: 'Solution Architects: primary consumers of technology intelligence for engagement positioning'
        connected_via: ti-agent
      - role: 'Field CTO: technology vision planning, cross-account pattern synthesis'
        connected_via: ti-agent
      - role: 'Account Executives: deal strategy informed by customer technology investments'
        connected_via: ti-agent
      - role: 'Competitive Intelligence: competitor technology adoption signals feeding battlecard updates'
        connected_via: ti-agent
      - role: 'Alliance Architects: vendor landscape data for partnership evaluation'
        connected_via: ti-agent
    sub_agents:
    - name: TI Scanner Agent
      id: tech-signal-scanner-agent
      purpose: Scan job postings, vendor announcements, and engineering blogs to detect and normalize technology adoption signals
    - name: TI Analyzer Agent
      id: tech-signal-analyzer-agent
      purpose: Analyze scan results to generate technology signal maps, ring assignments, vendor landscapes, and weekly digests
    with_this_agent:
    - domain: Job Posting and Source Scanning
      agent: tech-signal-scanner-agent
      items:
      - 'Job Posting Scan: Scan job postings from realm-associated companies to extract technology adoption signals'
      - 'Vendor Announcement Scan: Monitor vendor partnerships and product announcements for technology signals'
      - 'Tech Blog Scan: Scan engineering blogs and conference talks for technology adoption indicators'
    - domain: Technology Map and Ring Analysis
      agent: tech-signal-analyzer-agent
      items:
      - 'Tech Map Generation: Generate technology signal maps from scan results with ring assignments (Adopt, Trial, Assess, Hold)'
      - 'Vendor Landscape Analysis: Build vendor/supplier technology landscape from adoption signals'
    - domain: Intelligence Delivery
      agent: tech-signal-analyzer-agent
      items:
      - 'Weekly Tech Digest: Generate weekly technology intelligence summary highlighting changes and trends'
      - 'Competitive Detection: Identify competitive technology mentions and displacement opportunities'
    activity_map:
      purpose: 'The Technology Intelligence function exists to ensure engagement teams have current, evidence-based technology intelligence for every active account. Everything the Technology Intelligence function does falls into one of two operational domains. Each domain is owned by a sub-agent that operates independently with its own tools, flows, boundaries, and prompt registry.

        '
      domains:
      - domain: Scanning
        why: 'The Technology Intelligence function depends on systematic, comprehensive signal collection from public sources. Without disciplined scanning, the analysis layer works with incomplete data and produces intelligence that misses critical adoption signals. Scanning must cover job postings, vendor announcements, and engineering blogs with consistent cadence and normalized output.

          '
        agent: tech-signal-scanner-agent
        contributing_agents:
        - agent: tech-signal-analyzer-agent
          provides: Feedback on signal quality and coverage gaps to refine scanning parameters
        activities:
        - Job posting scanning across realm-associated companies
        - Vendor announcement and partnership signal detection
        - Engineering blog and conference talk monitoring
        - Technology mention normalization and deduplication
        - Source registry maintenance for cluster-wide reuse
        cadence: weekly scanning cycle per realm, continuous monitoring for high-priority accounts
      - domain: Analysis
        why: 'Raw scan data has no value until it is synthesized into structured intelligence. The analysis domain transforms normalized signals into technology maps with ring assignments, tracks trends over time, detects competitive adoption patterns, and produces the weekly digests that engagement teams depend on for account preparation.

          '
        agent: tech-signal-analyzer-agent
        contributing_agents:
        - agent: tech-signal-scanner-agent
          provides: Normalized, deduplicated scan data with source attribution
        activities:
        - Technology signal map generation with ring assignments
        - 30-day and 90-day trend calculation and momentum detection
        - Vendor/supplier landscape construction from adoption signals
        - Competitive technology mention identification and flagging
        - Weekly tech intelligence digest generation
        cadence: analysis within 48 hours of scan completion, weekly digest delivery
    public_resources:
    - title: ThoughtWorks Technology Radar
      url: https://www.thoughtworks.com/radar
      context: Reference methodology for technology ring classification (Adopt, Trial, Assess, Hold)
    - title: Gartner Hype Cycle
      url: https://www.gartner.com/en/research/methodologies/gartner-hype-cycle
      context: Technology maturity assessment framework for signal interpretation
    - title: OSINT Framework
      url: https://osintframework.com
      context: Open source intelligence collection methodology applicable to technology signal scanning
    - title: StackShare Technology Stacks
      url: https://stackshare.io
      context: Public technology stack data for company signal validation
    - title: Technology Adoption Lifecycle (Geoffrey Moore)
      url: https://en.wikipedia.org/wiki/Technology_adoption_life_cycle
      context: Framework for classifying technology maturity and adoption stage across market segments
    - title: CNCF Technology Radar
      url: https://radar.cncf.io
      context: Cloud-native technology assessment using adopt/trial/assess methodology for infrastructure and platform technologies
    playbook_raci:
      context: >
        The Technology Intelligence orchestrator coordinates 2 playbooks covering
        technology landscape scanning and vendor analysis. It provides technology
        signal data to playbooks led by other roles.
      responsible:
      - playbook: Tech Landscape Scan (PB_TSCT_001)
        scope: Technology landscape scanning, signal detection, trend identification
        team: technology_scout
        file: PB_TSCT_001_tech_landscape_scan.yaml
      - playbook: Vendor Analysis (PB_TSCT_002)
        scope: Technology vendor evaluation, capability assessment, maturity scoring
        team: technology_scout
        file: PB_TSCT_002_vendor_analysis.yaml
      accountable:
      - playbook: Tech Landscape Scan (PB_TSCT_001)
        scope: Technology Scout Lead validates signal quality and trend classification
        team: technology_scout
      - playbook: Vendor Analysis (PB_TSCT_002)
        scope: Technology Scout Lead validates vendor assessment methodology and scoring
        team: technology_scout
      consulted:
      - playbook: Technology Vision (PB_FCTO_003)
        scope: Technology signal data and trend analysis for vision planning
        team: field_cto
        file: PB_FCTO_003_technology_vision.yaml
      - playbook: Partner Due Diligence (PB_AA_003)
        scope: Technology maturity assessment for partnership evaluation
        team: alliance_architects
        file: PB_AA_003_partner_due_diligence.yaml
      informed:
      - playbook: Field Intelligence (PB_FCTO_004)
        scope: Receives field-observed technology adoption patterns for signal validation
        team: field_cto
      - playbook: Cross-Account Pattern Synthesis (PB_FCTO_001)
        scope: Receives cross-account technology patterns for vendor context
        team: field_cto
    collaboration:
      defer_to:
        field_cto_agent: technology vision decisions, cross-account pattern strategy
        ci_agent: competitive positioning beyond technology signal data
      provide_to:
        ae_agent: technology intelligence for deal positioning and account strategy
        field_cto_agent: technology signal data and trend analysis for vision planning
        ci_agent: competitive technology adoption signals for battlecard updates
        alliance_architect_agent: vendor landscape data for partnership evaluation
  fallback_model: null
  prompt_registry: {}
  validation:
    required_dimensions:
    - name: context
      description: What account, realm, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not execute domain tasks directly (always delegates to sub-agents)
  - Does not scan data sources (handoff to TI Scanner Agent)
  - Does not assign technology rings or interpret signals (handoff to TI Analyzer Agent)
  - Does not make engagement recommendations (handoff to AE Agent)
  - Does not assess competitive positioning beyond technology signals (handoff to CI Agent)
  - Does not research company org structure (handoff to Account Intelligence Agent)
  permissions:
  - Route technology scanning requests to TI Scanner Agent
  - Route technology analysis requests to TI Analyzer Agent
  - Aggregate cross-domain results spanning scanning and analysis
  - Escalate signals indicating major vendor displacement
  - Coordinate scanning cadence and analysis freshness across realms
  escalation_triggers:
  - Major vendor displacement signal at strategic account (to SA Lead / Field CTO)
  - Technology shift affecting multiple realms simultaneously (to Field CTO)
  - Conflicting signals that cannot be resolved by evidence alone (to Human review)
  - Data source access issues or API key problems (to IT/Engineering)
  handoffs:
    human_escalation: Field CTO / SA Lead
    receives_from:
      ae_agent: Technology intelligence requests for deal positioning
      field_cto_agent: Cross-account technology pattern inquiries
  human_in_the_loop_conditions:
  - Review required before publishing technology intelligence externally
  - Approval needed for strategic account technology alerts
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Scanning status and completion state per realm
    - Analysis pipeline state and pending requests
    - Cross-domain aggregation results
    persistent:
    - Historical scanning cadence and coverage metrics
    - Previous intelligence delivery outcomes
    - Known realm configurations and priority levels
    shared:
    - Intelligence results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest engagement impact
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (scanning status, analysis pipeline)
    - Technology signal maps and trend data
    - Competitive technology detection alerts
    - Vendor landscape intelligence
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current realm or account context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - technology-intelligence
      - technology-signals
      - vendor-landscape
      - signal-assessment
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/analyzer-ring_criteria.yaml
      description: Ring Assignment, Vendor Landscape
    - path: references/scanner-signal_keywords.yaml
      description: Technology Signals, Vendor Signals, Patterns
  assets:
  - name: intelligence
    filename: '{realm}-intelligence.md'
    description: Aggregated technology intelligence output
  quality:
    before_output:
    - Sub-agent routing is correct for the request type
    - Scanning completes before analysis begins for dependent requests
    - Source attribution is maintained through the pipeline
    - Cross-realm patterns are flagged when detected
    - Confidence level stated for aggregated intelligence
