x-ea-agent:
  profile:
    role_context: 'Job postings and public technical signals reveal what technologies companies are investing in. Patterns in hiring tell a story about where an organization is heading, often before they
      announce it publicly.

      '
    scenarios:
    - problem: Technology adoption signals in job postings are missed because nobody has time to scan systematically
      why: 'Job postings reveal what technologies companies are investing in months before public announcements. SAs know this signal exists but scanning job boards across a portfolio of accounts, extracting
        technology mentions, and normalizing them is manual work that never gets prioritized over active deals.

        '
      agent: tech-signal-scanner-agent
      agent_response: 'The agent scans job postings from realm-associated companies across multiple sources, extracts technology mentions, normalizes them to canonical forms, and deduplicates before passing
        structured signal data to the Analyzer. It registers all sources in the shared source registry for cluster-wide reuse.

        '
      success_signal:
        metric: Job postings scanned per realm per cycle
        target: All realm-associated companies scanned on weekly cadence
        leading_indicator: New technology mentions detected and normalized within 24 hours of posting
        failure_signal: Realm technology maps stale for more than 2 weeks
    - problem: Vendor partnership and procurement signals are scattered across unmonitored channels
      why: 'Technology procurement decisions leave traces in vendor announcements, blog posts, and conference talks. These signals are publicly available but spread across dozens of sources that no individual
        can monitor consistently, leaving the team blind to infrastructure shifts at target accounts.

        '
      agent: tech-signal-scanner-agent
      agent_response: 'The agent monitors tech blogs, engineering publications, and vendor announcements for technology adoption signals. It detects vendor partnerships and procurement signals, attributes
        each finding to a source with metadata, and feeds the raw signal data to the Analyzer without interpretation.

        '
      success_signal:
        metric: Non-job-posting signal sources monitored per realm
        target: Engineering blogs and vendor announcements scanned for all active realms
        leading_indicator: New signal sources registered in shared source registry
        failure_signal: Technology signals limited to job posting data only
    challenges:
    - text: Technology adoption signals are invisible without systematic scanning
      specific_overhead:
      - Browsing job boards and filtering postings by technology keywords
    - text: Manual job posting analysis doesn't scale across a portfolio of accounts
      specific_overhead:
      - Logging findings in spreadsheets that are never aggregated
    administrative_overhead:
    - Browsing job boards and filtering postings by technology keywords
    - Logging findings in spreadsheets that are never aggregated
    capabilities:
    - Job posting analysis for tech signals
    - Technology adoption pattern detection
    human_matters_summary: 'Technology scanning detects hiring signals; humans interpret what they mean. The agent normalizes technology mentions from job postings and identifies adoption patterns, but
      the SA understands what technology choices reveal about customer architecture direction and which signals indicate openness to solutions. The signal is captured, but human insight translates it into
      strategy.

      '
    playbook_raci:
      context: >
        The Tech Signal Scanner owns 1 technology landscape playbook and contributes
        technology signals to playbooks led by other roles.
      responsible:
        - playbook: Tech Landscape Scan (PB_TSCT_001)
          scope: Technology landscape scanning, signal detection, trend identification
          team: technology_scout
          file: PB_TSCT_001_tech_landscape_scan.yaml
      accountable:
        - playbook: Tech Landscape Scan (PB_TSCT_001)
          scope: Technology Scout Lead validates signal quality and trend classification
          team: technology_scout
      consulted:
        - playbook: Technology Vision (PB_FCTO_003)
          scope: Technology signal data and trend analysis for vision planning
          team: field_cto
          file: PB_FCTO_003_technology_vision.yaml
      informed:
        - playbook: Field Intelligence (PB_FCTO_004)
          scope: Receives field-observed technology adoption patterns for signal validation
          team: field_cto
  fallback_model: null
  prompt_registry:
    tech-signal-scanner-job-posting-scan:
      description: Scan job postings for technology adoption signals
      source: prompts/tasks.yaml#scanning.job_posting_scan
      inputs:
      - title: company_domain
        type: string
      - title: company_name
        type: string
      - title: existing_tech_map
        type: string
      - title: realm_id
        type: string
      - title: source_registry
        type: string
      outputs:
      - title: job-posting-scan_result
        type: object
      requires_data:
      - source: read-tech-signal-scanner-data
        fields:
        - realm_profile
        - existing_tech_map
        - source_registry
        priority: critical
    tech-signal-scanner-vendor-announcement-scan:
      description: Scan for vendor partnerships and product announcements
      source: prompts/tasks.yaml#scanning.vendor_announcement_scan
      inputs:
      - title: company_name
        type: string
      - title: existing_vendor_landscape
        type: string
      - title: realm_id
        type: string
      - title: source_registry
        type: string
      outputs:
      - title: vendor-announcement-scan_result
        type: object
      requires_data:
      - source: read-tech-signal-scanner-data
        fields:
        - existing_vendor_landscape
        - source_registry
        priority: critical
    tech-signal-scanner-tech-blog-scan:
      description: Scan engineering blogs and conference talks for technology signals
      source: prompts/tasks.yaml#scanning.tech_blog_scan
      inputs:
      - title: company_name
        type: string
      - title: engineering_blog_url
        type: string
      - title: realm_id
        type: string
      - title: source_registry
        type: string
      outputs:
      - title: tech-blog-scan_result
        type: object
      requires_data:
      - source: read-tech-signal-scanner-data
        fields:
        - realm_profile
        - engineering_blog_url
        - source_registry
        priority: critical
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not analyze or interpret scan results (that's Technology Scout Analyzer's job) (handoff to Leadership)
  - Does not make ring assignments or trend assessments (that's Analyzer's job) (handoff to Leadership)
  - Does not research company structure or strategy (that's Account Intelligence Agent's job) (handoff to Leadership)
  - Does not monitor news feeds (that's MNA Agent's job) (handoff to Leadership)
  - Does not assess competitive positioning (that's CI Agent's job) (handoff to Leadership)
  - Does not generate recommendations or action items (handoff to Leadership)
  - Does not access systems requiring credentials beyond approved API keys (handoff to Leadership)
  permissions:
  - Scan job postings from realm-associated companies to extract technology signals
  - Monitor tech blogs, engineering publications, and vendor announcements
  - Track conference talks and technical presentations for technology adoption signals
  - Detect vendor partnerships and technology procurement signals
  - Normalize and deduplicate technology mentions across sources
  - Register all sources in shared source registry for cluster-wide reuse
  escalation_triggers:
  - Critical issue detected (to Leadership)
  - Information uncertainty requiring human verification
  handoffs:
    human_escalation: Leadership
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Job postings from realm companies (primary signal source)
    - Vendor announcements and partnership disclosures
    - Tech blog posts and engineering publications
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - technology-signals
      - vendor-landscape
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/analyzer-ring_criteria.yaml
      description: Ring Assignment, Vendor Landscape
    - path: references/scanner-signal_keywords.yaml
      description: Technology Signals, Vendor Signals, Patterns
  assets:
  - name: artifacts
    filename: '{account}-artifacts.md'
    description: artifacts
  - name: signals
    filename: '{account}-signals.md'
    description: signals
  quality:
  - All claims supported by evidence
  - No assumed dynamics
  - Sources cited
