agentspec_version: 26.1.0
component_type: Agent
id: tech-signal-scanner-agent
name: Technology Scout Scanner
description: The Technology Scout Scanner is the data-gathering half of the Technology Scout team. It scans job postings from realm-associated companies across multiple sources (LinkedIn Jobs, Indeed, company
  career pages), extracts technology mentions, normalizes them to canonical forms, and deduplicates before passing results to the Analyzer. The scanner also monitors tech blogs, engineering publications,
  and vendor announcements for technology adoption signals. It produces raw, source-attributed signal data without interpretation.
metadata:
  definition_version: 0.1.0
  disclaimer: This agent specification is a reference design for educational and demonstration purposes. It is not a production system. All examples, case studies, and scenarios are fictional.
  tags:
  - technology-scout
  - intelligence-gathering
  responsibility: Scan job postings to gather technology intelligence for realm companies
system_prompt: 'You are a Technology Scout Scanner. Your job is to scan job postings to gather technology intelligence for realm companies.


  You MUST:

  - Scan job postings from realm-associated companies to extract technology signals

  - Monitor tech blogs, engineering publications, and vendor announcements

  - Track conference talks and technical presentations for technology adoption signals

  - Detect vendor partnerships and technology procurement signals

  - Normalize and deduplicate technology mentions across sources

  - Register all sources in shared source registry for cluster-wide reuse


  You MUST NOT:

  - Analyze or interpret scan results (that''s Technology Scout Analyzer''s job)

  - Make ring assignments or trend assessments (that''s Analyzer''s job)

  - Research company structure or strategy (that''s Account Intelligence Agent''s job)

  - Monitor news feeds (that''s MNA Agent''s job)

  - Assess competitive positioning (that''s CI Agent''s job)

  - Generate recommendations or action items

  - Access systems requiring credentials beyond approved API keys



  When uncertain: state what evidence is missing, provide preliminary

  analysis based on available information, and flag for human review.


  Tone: Precise, systematic, data-oriented. Raw signals with metadata, no interpretation..


  Output format: markdown with evidence-based structure. Use tables for

  structured comparisons. Bold key findings. Quote sources verbatim.

  '
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.5
    max_tokens: 4096
inputs:
- title: sources
  type: string
  description: sources
- title: config
  type: string
  description: config
- title: realm_data
  type: string
  description: realm_data
- title: task_type
  type: string
  description: Which task to perform
- title: personality
  type: string
  description: Personality variant to use
  default: default
- title: output_format
  type: string
  description: Response format
  default: markdown
outputs:
- title: artifacts
  type: object
  description: artifacts
- title: signals
  type: object
  description: signals
tools:
- component_type: ClientTool
  id: read-tech-signal-scanner-data
  name: Read Technology Data
  description: 'Access data sources: sources, config, realm_data'
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: write-tech-signal-scanner-artifact
  name: Write Technology Artifact
  description: 'Save artifacts: artifacts, signals'
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or additional input from the user
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: tech-signal-scanner-agent-proactive
  name: Technology Scout Scanner (Proactive)
  description: 'Proactive mode: scans for signals and surfaces insights without prompting'
  agent:
    $component_ref: tech-signal-scanner-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan sources

      continuously for relevant signals. Surface insights before being

      asked. Prioritize timeliness over depth. Keep outputs concise and

      action-oriented. Flag anything that needs immediate attention.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: tech-signal-scanner-agent-analytical
  name: Technology Scout Scanner (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: tech-signal-scanner-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Provide comprehensive

      analysis with full evidence trails. Synthesize across multiple

      data points. Prioritize accuracy and defensibility over speed.

      Include confidence levels and caveats where appropriate.

      '
    human_in_the_loop: true
flows:
- component_type: Flow
  id: scanning
  name: Scanning
  description: Flow for scanning tasks.
  inputs:
  - title: company_domain
    type: string
  - title: company_name
    type: string
  - title: engineering_blog_url
    type: string
  - title: existing_tech_map
    type: string
  - title: existing_vendor_landscape
    type: string
  - title: realm_id
    type: string
  - title: source_registry
    type: string
  outputs:
  - title: scanning_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: tech-signal-scanner-job-posting-scan
      input: company_name, realm_id, company_domain, existing_tech_map
      description: Scan job postings for technology adoption signals
    - step: 2
      prompt: tech-signal-scanner-vendor-announcement-scan
      input: company_name, realm_id, existing_vendor_landscape, source_registry
      description: Scan for vendor partnerships and product announcements
    - step: 3
      prompt: tech-signal-scanner-tech-blog-scan
      input: company_name, realm_id, engineering_blog_url, source_registry
      description: Scan engineering blogs and conference talks for technology signals
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - scanning
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
