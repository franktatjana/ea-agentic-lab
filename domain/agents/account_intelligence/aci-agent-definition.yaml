      prompt: aci-opportunity-mapping
      input: company_name, realm_id, strategic_initiatives, organigram_summary
      description: Map company strategy to vendor capabilities and identify opportunities
    - step: 2
      prompt: aci-refresh-delta
      input: company_name, realm_id, previous_profile, previous_organigram
