    path: '{realm}/intelligence/account_intelligence/organigram.yaml'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: aci-organigram-building-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: aci-organigram-building-synthesize
