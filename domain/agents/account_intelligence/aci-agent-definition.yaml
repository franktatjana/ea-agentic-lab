  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information,
      and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not monitor ongoing news feeds (that's MNA Agent's job) (handoff to Leadership)
  - Does not analyze competitive positioning (that's CI Agent's job) (handoff to Leadership)
  - Does not scan technology adoption signals (that's Technology Scout's job) (handoff to Leadership)
  - Does not analyze industry-level trends (that's Industry Intelligence Agent's job) (handoff to Leadership)
  - Does not make commercial recommendations (that's AE Agent's job) (handoff to Leadership)
  - Does not generate customer-facing content (handoff to Leadership)
  - Does not access internal or confidential company data (handoff to Leadership)
  - Does not fabricate organizational relationships without source evidence (handoff to Leadership)
  permissions:
  - Research company structure, business lines, and strategy from public sources
  - Build and maintain organizational hierarchies (organigrams) by business line
  - Identify key decision-makers and map reporting relationships
  - Summarize company strategy from annual reports, investor presentations, and filings
  - Identify new business opportunities aligned with company strategic initiatives
  - Track leadership changes and organizational restructuring
  - Register all sources in shared source registry for cluster-wide reuse
  - Enrich realm profiles with verified company intelligence
  escalation_triggers:
  - Critical issue detected (to Leadership)
  - Information uncertainty requiring human verification
  handoffs:
    human_escalation: Leadership
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Company structure and business lines (foundation for all other analysis)
    - Leadership and decision chains (who to engage, who decides)
    - Strategic initiatives and transformation programs (where opportunities exist)
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains: [account-intelligence, context-enrichment]
      archetypes: [enterprise, mid-market]
    references:
    - path: references/research_sources.yaml
      description: Primary Sources, Secondary Sources
  assets:
  - name: artifacts
    filename: '{account}-artifacts.md'
    description: artifacts
  - name: signals
    filename: '{account}-signals.md'
    description: signals
  quality:
  - All claims supported by evidence
  - No assumed dynamics
  - Sources cited
