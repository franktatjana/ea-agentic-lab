# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:
  profile:
    role_context: >
      Account teams need to understand what's happening inside their target
      accounts: org changes, strategic shifts, technology decisions, and buying
      signals. This intelligence is scattered across news, social media, job
      postings, and public filings. Without systematic monitoring, account
      research happens ad-hoc before meetings.
    scenarios:
      - problem: "Account research happens the night before meetings"
        why: >
          Reps scramble to pull together company context from LinkedIn, news sites,
          and SEC filings hours before a customer meeting. The result is shallow
          preparation that misses org changes, strategic shifts, and buying signals
          that would shape the conversation.
        agent: aci-agent
        agent_response: >
          The agent continuously researches target companies from public sources,
          builds organizational hierarchies by business line, and tracks strategy
          evolution from corporate disclosures. By the time a meeting is scheduled,
          a structured company profile with source-attributed findings already exists.
        success_signal:
          metric: "Pre-meeting research preparation time"
          target: "Reduce ad-hoc research time by 70% per meeting"
          leading_indicator: "Account profiles are current within 7 days of latest public disclosure"
          failure_signal: "Reps still manually searching LinkedIn and news sites before meetings"
      - problem: "Whitespace opportunities are discovered too late"
        why: >
          Unengaged business lines and new strategic initiatives at target accounts
          go unnoticed because nobody systematically maps company initiatives to
          vendor capabilities. Opportunities surface only when a customer mentions
          them, by which point competitors may already be engaged.
        agent: aci-agent
        agent_response: >
          The agent maps company strategic initiatives to vendor capabilities and
          identifies unengaged business lines through organigram analysis. It surfaces
          whitespace opportunities with confidence scores and source evidence, giving
          account teams a proactive view of where to expand.
        success_signal:
          metric: "Proactively identified whitespace opportunities per account"
          target: "Surface at least 2 net-new opportunities per account per quarter"
          leading_indicator: "Opportunity maps are generated within 48 hours of new strategic initiative detection"
          failure_signal: "New business lines are only discovered when customers raise them in meetings"
      - problem: "Org changes are discovered too late to adjust engagement strategy"
        why: >
          Executive departures, reorganizations, and new hires reshape decision-making
          authority within accounts. When these changes are caught weeks later through
          a failed meeting or a cold contact, the engagement strategy is already
          misaligned and relationships built with previous stakeholders lose their value.
        agent: aci-agent
        agent_response: >
          The agent monitors public org signals including LinkedIn role changes,
          press releases, and corporate announcements for tracked accounts. It flags
          leadership transitions, reports new decision-makers with context on their
          background, and recommends engagement adjustments before the next touchpoint.
        success_signal:
          metric: "Org change detection latency"
          target: "Detect and surface executive changes within 5 business days of public signal"
          leading_indicator: "Engagement plans are updated to reflect new stakeholders before next scheduled meeting"
          failure_signal: "Account team discovers org change during a customer call or through a bounced email"
      - problem: "Technology adoption signals are missed in the noise"
        why: >
          Customers publish job postings, partner announcements, and conference talks
          that reveal technology direction. These signals are scattered across dozens
          of sources and easy to miss among unrelated noise. By the time someone notices,
          the technology decision has already been made and the vendor window has closed.
        agent: aci-agent
        agent_response: >
          The agent filters public signals for technology adoption indicators such as
          job postings with specific stack mentions, partnership announcements, and
          conference presentations. It classifies each signal by relevance and urgency,
          linking it to active opportunities so the account team can act while the
          decision is still open.
        success_signal:
          metric: "Technology signal detection coverage"
          target: "Capture and classify at least 80% of public technology adoption signals per tracked account"
          leading_indicator: "Account strategies reference technology signals detected in the prior 30 days"
          failure_signal: "Customer technology decisions are discovered after vendor selection is complete"
      - problem: "Strategic priorities are inferred from outdated information"
        why: >
          Account teams rely on last quarter's earnings call or a six-month-old annual
          report to understand customer priorities. Between publications, strategic
          shifts from M&A activity, leadership changes, or market pressure go unnoticed.
          Conversations anchored in stale priorities damage credibility with informed buyers.
        agent: aci-agent
        agent_response: >
          The agent continuously tracks strategic priority signals from earnings
          transcripts, investor presentations, press releases, and regulatory filings.
          It maintains a timestamped priority map per account and flags when new signals
          contradict or update the previous understanding, keeping the account team
          aligned with the customer's current direction.
        success_signal:
          metric: "Account priority freshness"
          target: "Strategic priority map updated within 7 days of any material public disclosure"
          leading_indicator: "Account briefings reference priority shifts detected in the current quarter"
          failure_signal: "Customer corrects the account team's understanding of their priorities during a meeting"
      - problem: "Account research is done ad-hoc, usually the night before a meeting"
        why: >
          Without a systematic research cadence, account intelligence is reactive
          rather than continuous. Reps invest effort only when a meeting forces
          urgency, producing shallow snapshots instead of cumulative understanding.
          Over time, the team never builds a durable knowledge base per account,
          repeating the same searches and missing patterns that only emerge from
          longitudinal tracking.
        agent: aci-agent
        agent_response: >
          The agent runs scheduled research cycles per tracked account, updating
          company profiles, organigrams, and opportunity maps on a regular cadence
          regardless of meeting schedules. When a meeting is booked, the briefing
          is assembled from existing, up-to-date intelligence rather than built
          from scratch under time pressure.
        success_signal:
          metric: "Account profiles maintained on a regular research cadence"
          target: "90% of tracked accounts have a profile updated within the last 14 days"
          leading_indicator: "Meeting prep time drops because existing profiles already contain current intelligence"
          failure_signal: "Reps still initiate ad-hoc research the day before meetings instead of relying on existing profiles"
    challenges:
      - "Account research is done ad-hoc, usually the night before a meeting"
      - "Org changes are discovered too late to adjust engagement strategy"
      - "Technology adoption signals are missed in the noise"
      - "Strategic priorities are inferred from outdated information"
      - "Account research happens the night before meetings"
      - "Whitespace opportunities are discovered too late"
    administrative_overhead:
      - "Searching LinkedIn, news sites, and SEC filings before every meeting"
      - "Maintaining account dossiers in shared documents that go stale"
      - "Manually tracking executive movements across target accounts"
    capabilities:
      - "Account signal detection"
      - "Org change monitoring"
      - "Technology adoption tracking"
      - "Buying pattern analysis"
      - "Strategic priority mapping"
    human_matters_summary: >
      Org charts are static; organizations are living politics. The agent builds
      organizational maps from public sources and identifies structural changes,
      but the AE understands what those changes mean for decision-making power,
      which new leaders might be open to change, and how budget reallocations
      signal unmet needs. The intelligence is structured, but the human's market
      instinct translates it into account strategy.

