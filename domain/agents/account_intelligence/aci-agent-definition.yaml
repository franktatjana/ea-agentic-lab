x-ea-agent:
  profile:
    role_context: 'Account teams need to understand what''s happening inside their target accounts: org changes, strategic shifts, technology decisions, and buying signals. This intelligence is scattered
      across news, social media, job postings, and public filings. Without systematic monitoring, account research happens ad-hoc before meetings.

      '
    scenarios:
    - problem: Account research is done ad-hoc, usually the night before a meeting
      why: 'Reps scramble to pull together company context from LinkedIn, news sites, and SEC filings hours before a customer meeting. The result is shallow preparation that misses org changes, strategic
        shifts, and buying signals that would shape the conversation.

        '
      agent: aci-agent
      agent_response: 'The agent continuously researches target companies from public sources, builds organizational hierarchies by business line, and tracks strategy evolution from corporate disclosures.
        By the time a meeting is scheduled, a structured company profile with source-attributed findings already exists.

        '
      success_signal:
        metric: Pre-meeting research preparation time
        target: Reduce ad-hoc research time by 70% per meeting
        leading_indicator: Account profiles are current within 7 days of latest public disclosure
        failure_signal: Reps still manually searching LinkedIn and news sites before meetings
    - problem: Whitespace opportunities are discovered too late
      why: 'Unengaged business lines and new strategic initiatives at target accounts go unnoticed because nobody systematically maps company initiatives to vendor capabilities. Opportunities surface only
        when a customer mentions them, by which point competitors may already be engaged.

        '
      agent: aci-agent
      agent_response: 'The agent maps company strategic initiatives to vendor capabilities and identifies unengaged business lines through organigram analysis. It surfaces whitespace opportunities with
        confidence scores and source evidence, giving account teams a proactive view of where to expand.

        '
      success_signal:
        metric: Proactively identified whitespace opportunities per account
        target: Surface at least 2 net-new opportunities per account per quarter
        leading_indicator: Opportunity maps are generated within 48 hours of new strategic initiative detection
        failure_signal: New business lines are only discovered when customers raise them in meetings
    - problem: Org changes are discovered too late to adjust engagement strategy
      why: 'Executive departures, reorganizations, and new hires reshape decision-making authority within accounts. When these changes are caught weeks later through a failed meeting or a cold contact,
        the engagement strategy is already misaligned and relationships built with previous stakeholders lose their value.

        '
      agent: aci-agent
      agent_response: 'The agent monitors public org signals including LinkedIn role changes, press releases, and corporate announcements for tracked accounts. It flags leadership transitions, reports new
        decision-makers with context on their background, and recommends engagement adjustments before the next touchpoint.

        '
      success_signal:
        metric: Org change detection latency
        target: Detect and surface executive changes within 5 business days of public signal
        leading_indicator: Engagement plans are updated to reflect new stakeholders before next scheduled meeting
        failure_signal: Account team discovers org change during a customer call or through a bounced email
    - problem: Technology adoption signals are missed in the noise
      why: 'Customers publish job postings, partner announcements, and conference talks that reveal technology direction. These signals are scattered across dozens of sources and easy to miss among unrelated
        noise. By the time someone notices, the technology decision has already been made and the vendor window has closed.

        '
      agent: aci-agent
      agent_response: 'The agent filters public signals for technology adoption indicators such as job postings with specific stack mentions, partnership announcements, and conference presentations. It
        classifies each signal by relevance and urgency, linking it to active opportunities so the account team can act while the decision is still open.

        '
      success_signal:
        metric: Technology signal detection coverage
        target: Capture and classify at least 80% of public technology adoption signals per tracked account
        leading_indicator: Account strategies reference technology signals detected in the prior 30 days
        failure_signal: Customer technology decisions are discovered after vendor selection is complete
    - problem: Strategic priorities are inferred from outdated information
      why: 'Account teams rely on last quarter''s earnings call or a six-month-old annual report to understand customer priorities. Between publications, strategic shifts from M&A activity, leadership changes,
        or market pressure go unnoticed. Conversations anchored in stale priorities damage credibility with informed buyers.

        '
      agent: aci-agent
      agent_response: 'The agent continuously tracks strategic priority signals from earnings transcripts, investor presentations, press releases, and regulatory filings. It maintains a timestamped priority
        map per account and flags when new signals contradict or update the previous understanding, keeping the account team aligned with the customer''s current direction.

        '
      success_signal:
        metric: Account priority freshness
        target: Strategic priority map updated within 7 days of any material public disclosure
        leading_indicator: Account briefings reference priority shifts detected in the current quarter
        failure_signal: Customer corrects the account team's understanding of their priorities during a meeting
    challenges:
    - text: Account research is done ad-hoc, usually the night before a meeting
      specific_overhead:
      - Searching LinkedIn, news sites, and SEC filings before every meeting
    - text: Org changes are discovered too late to adjust engagement strategy
      specific_overhead:
      - Maintaining account dossiers in shared documents that go stale
    - text: Technology adoption signals are missed in the noise
      specific_overhead:
      - Manually tracking executive movements across target accounts
    - Strategic priorities are inferred from outdated information
    - Whitespace opportunities are discovered too late
    administrative_overhead:
    - Searching LinkedIn, news sites, and SEC filings before every meeting
    - Maintaining account dossiers in shared documents that go stale
    - Manually tracking executive movements across target accounts
    capabilities:
    - Account signal detection
    - Org change monitoring
    - Technology adoption tracking
    - Buying pattern analysis
    - Strategic priority mapping
    human_matters_summary: 'Org charts are static; organizations are living politics. The agent builds organizational maps from public sources and identifies structural changes, but the AE understands what
      those changes mean for decision-making power, which new leaders might be open to change, and how budget reallocations signal unmet needs. The intelligence is structured, but the human''s market instinct
      translates it into account strategy.

      '
    human_matters_goal: 'Every account is researched, every org change is tracked, every whitespace opportunity is surfaced, but the account team wins because the human translated structured intelligence into relationship strategy and commercial action.

      '
    role_tab_intro: 'An Account Intelligence Analyst monitors 20-50 target accounts and needs to know what changed inside each one since the last review. The challenges below are where research time gets wasted, signals get missed, and account teams operate on stale information, each mapped to the sub-agent built to handle it.

      '
    goals_summary: 'The ACI succeeds when account profiles stay current, org changes surface before they impact engagement, and whitespace opportunities are identified before competitors find them.

      '
    goals:
    - Maintain current company profiles for all tracked accounts within 7 days of any material public disclosure
    - Reduce ad-hoc pre-meeting research time by 70% through pre-built account intelligence
    - Surface at least 2 net-new whitespace opportunities per account per quarter
    - Detect and flag executive changes within 5 business days of public signal
    - Build and maintain organigrams for all Tier 1 and Tier 2 accounts with quarterly refresh
    - Capture and classify at least 80% of public technology adoption signals per tracked account
    - Map all strategic initiatives from earnings calls, investor presentations, and annual reports within 10 business days of publication
    - Register 100% of research sources in shared source registry with confidence scoring
    - Keep opportunity maps updated within 48 hours of new strategic initiative detection
    - Provide source-attributed evidence for every claim in account profiles
    - Identify unengaged business lines through organigram analysis for every tracked account
    - Track leadership changes across all C-suite and VP-level positions at tracked accounts
    - Maintain timestamped priority maps per account reflecting current strategic direction
    - Deliver account intelligence packages that reduce AE meeting prep to under 15 minutes
    key_metrics:
    - name: Account Profile Freshness
      definition: Percentage of tracked accounts with profiles updated within 7 days of latest material public disclosure
    - name: Research Time Savings
      definition: Reduction in ad-hoc pre-meeting research time measured against baseline manual research effort
    - name: Whitespace Opportunity Yield
      definition: Net-new whitespace opportunities surfaced per account per quarter through systematic capability-initiative mapping
    - name: Org Change Detection Latency
      definition: Average business days between public org change signal and agent-flagged notification to account team
    - name: Source Attribution Coverage
      definition: Percentage of intelligence claims with linked, verifiable source evidence and confidence score
    - name: Signal Classification Accuracy
      definition: Precision and recall of technology adoption, strategic shift, and leadership change signal detection against human-validated ground truth
    - name: Organigram Completeness
      definition: Percentage of Tier 1 and Tier 2 accounts with current organigrams covering C-suite, VP-level, and business line leadership
    key_responsibilities:
    - "Company Research: research target companies from public sources to build comprehensive profiles covering structure, business lines, strategy, and financials"
    - "Organigram Building: construct organizational hierarchies by business line with leadership mapping, department structure, and decision chains"
    - "Opportunity Identification: map company strategic initiatives to vendor capabilities and identify unengaged business lines as whitespace opportunities"
    - "Leadership Tracking: monitor executive appointments, departures, and role changes across tracked accounts from public signals"
    - "Strategic Priority Mapping: extract and maintain timestamped strategic priorities from earnings transcripts, investor presentations, and regulatory filings"
    - "Source Registry Management: register all research sources in shared source registry with confidence scoring for cluster-wide reuse"
    - "Business Line Analysis: analyze revenue segments, business units, and operating divisions from annual reports and investor materials"
    - "Technology Signal Detection: filter public signals for technology adoption indicators including job postings, partnership announcements, and conference presentations"
    - "Account Profile Enrichment: enrich realm profiles with verified company intelligence including financials, strategy, org structure, and competitive context"
    - "Refresh Delta Analysis: identify what has changed since the last research cycle and flag material updates for account team review"
    - "Decision Chain Mapping: trace reporting relationships and budget authority paths to identify who decides, who influences, and who blocks"
    - "Initiative-Capability Alignment: match customer transformation programs and published initiatives against vendor solution portfolio"
    - "Intelligence Packaging: assemble account intelligence into meeting-ready briefings that reduce AE preparation time"
    - "Cross-Account Pattern Detection: identify recurring strategic themes, technology choices, and organizational patterns across the tracked account portfolio"
    stakeholder_landscape:
      external:
      - role: "CEO/President: corporate strategy direction, M&A decisions, transformation mandates"
        connected_via: aci-organigram-agent
      - role: "CFO/Finance Leadership: budget allocation signals, financial health indicators, cost optimization priorities"
        connected_via: aci-company-research-agent
      - role: "CTO/CIO: technology strategy, digital transformation roadmap, vendor evaluation"
        connected_via: aci-company-research-agent
      - role: "Business Line Presidents/GMs: divisional strategy, P&L ownership, departmental priorities"
        connected_via: aci-organigram-agent
      - role: "VP Engineering/IT Directors: technology adoption decisions, infrastructure choices, team composition"
        connected_via: aci-opportunity-agent
      - role: "Investor Relations: public disclosures, earnings guidance, strategic narrative"
        connected_via: aci-company-research-agent
      internal:
      - role: "Account Executive: consumes account intelligence for meeting prep, deal strategy, and relationship planning"
        connected_via: aci-company-research-agent
      - role: "Solution Architect: uses org maps and technology signals for technical discovery and architecture planning"
        connected_via: aci-organigram-agent
      - role: "Field CTO: leverages cross-account patterns and strategic initiative intelligence for advisory conversations"
        connected_via: aci-opportunity-agent
      - role: "Customer Architect: uses account context for adoption planning and expansion identification"
        connected_via: aci-company-research-agent
      - role: "Sales Leadership: reviews account intelligence for territory planning, forecast enrichment, and resource allocation"
        connected_via: aci-opportunity-agent
    sub_agents:
    - name: ACI Company Research Agent
      id: aci-company-research-agent
      purpose: Research companies from public sources, build comprehensive profiles covering structure, business lines, strategy, and financials
    - name: ACI Organigram Agent
      id: aci-organigram-agent
      purpose: Build organizational hierarchies with leadership mapping, department structure, and decision chains organized by business line
    - name: ACI Opportunity Agent
      id: aci-opportunity-agent
      purpose: Identify business opportunities by mapping company initiatives to vendor capabilities and finding unengaged business lines
    activity_map:
      purpose: 'The Account Intelligence Analyst exists to provide structured, source-attributed company intelligence that feeds engagement planning and opportunity development across the account team. Everything the ACI does falls into one of three research domains. Each domain is owned by a sub-agent that operates independently with its own tools, flows, boundaries, and prompt registry.

        '
      domains:
      - domain: Company Research and Profile Building
        why: 'The account team needs current, comprehensive company intelligence before every engagement. Without systematic research, preparation is ad-hoc and shallow, missing strategic shifts and financial signals that should shape the conversation.

          '
        agent: aci-company-research-agent
        contributing_agents:
        - agent: aci-organigram-agent
          provides: Organizational context for interpreting strategic announcements
        - agent: aci-opportunity-agent
          provides: Initiative data that enriches company profile with forward-looking context
        activities:
        - Deep-dive company research from public filings, earnings calls, and investor materials
        - Business line analysis covering revenue segments and operating divisions
        - Strategic priority extraction from corporate disclosures
        - Financial health summary and trend tracking
        - Source registration in shared registry with confidence scoring
        cadence: triggered by new account onboarding, quarterly refresh, or material public disclosure
      - domain: Organizational Mapping and Leadership Tracking
        why: 'Enterprise deals are won or lost based on relationships with the right people. Without current org maps, account teams engage the wrong stakeholders, miss decision-maker changes, and lose time navigating unfamiliar hierarchies.

          '
        agent: aci-organigram-agent
        contributing_agents:
        - agent: aci-company-research-agent
          provides: Business line structure and corporate hierarchy from filings
        - agent: aci-opportunity-agent
          provides: Initiative ownership data linking leaders to strategic programs
        activities:
        - C-suite and senior leadership extraction from public sources
        - Org hierarchy mapping by business line with department structure
        - Decision chain identification tracing budget authority and approval paths
        - Leadership change detection and transition tracking
        - Reporting relationship mapping across divisions
        cadence: quarterly refresh for Tier 1 accounts, semi-annual for Tier 2, triggered by detected changes
      - domain: Opportunity Identification and Whitespace Analysis
        why: 'Whitespace opportunities go unnoticed when nobody systematically maps customer initiatives to vendor capabilities. By the time opportunities surface through customer conversation, competitors may already be engaged.

          '
        agent: aci-opportunity-agent
        contributing_agents:
        - agent: aci-company-research-agent
          provides: Strategic initiatives and transformation programs from corporate disclosures
        - agent: aci-organigram-agent
          provides: Business line coverage map showing engaged vs. unengaged divisions
        activities:
        - Initiative-to-capability mapping against vendor solution portfolio
        - Unengaged business line identification through organigram analysis
        - Opportunity confidence scoring with source evidence
        - Refresh delta analysis identifying changes since last research cycle
        - Technology adoption signal classification by relevance and urgency
        cadence: quarterly per account, triggered by new initiative detection or strategic shift
    with_this_agent:
    - domain: Company Research and Profile Building
      agent: aci-company-research-agent
      items:
      - 'Company Profiles: Get structured, source-attributed company intelligence covering strategy, financials, business lines, and competitive context'
      - 'Strategic Priorities: Track what the customer cares about right now from their own public disclosures, not from last quarter''s assumptions'
    - domain: Organizational Mapping and Leadership Tracking
      agent: aci-organigram-agent
      items:
      - 'Org Maps: See who leads what, who reports to whom, and how the organization is structured by business line'
      - 'Leadership Changes: Know when executives change roles, depart, or join before the next customer meeting'
    - domain: Opportunity Identification and Whitespace Analysis
      agent: aci-opportunity-agent
      items:
      - 'Whitespace Opportunities: Discover unengaged business lines and unmapped initiatives where vendor capabilities align with customer needs'
      - 'Technology Signals: Catch technology adoption indicators from job postings, partnerships, and conference talks while the decision window is still open'
    collaboration:
      defer_to:
        ae_agent:
          scope: Commercial decisions, relationship strategy, customer engagement approach
          scenarios:
          - trigger: Account intelligence reveals commercial opportunity or risk requiring relationship action
            context_passed: Account profile, opportunity map, org change details, confidence scores
            receiver_action: Engagement strategy adjustment, meeting planning, deal qualification update
        mna_agent:
          scope: Ongoing news monitoring, M&A activity, real-time event tracking
          scenarios:
          - trigger: Research identifies need for continuous news monitoring beyond point-in-time research
            context_passed: Account context, monitoring keywords, signal categories of interest
            receiver_action: News feed setup, alert configuration, event tracking activation
        ci_agent:
          scope: Competitive positioning, market share analysis, competitive strategy
          scenarios:
          - trigger: Company research surfaces competitive dynamics requiring dedicated analysis
            context_passed: Competitive mentions, market positioning signals, vendor landscape context
            receiver_action: Competitive intelligence assessment, battlecard update, positioning recommendation
        industry_intelligence_agent:
          scope: Industry-level trends, market dynamics, regulatory landscape
          scenarios:
          - trigger: Account research reveals industry-level patterns beyond single-company scope
            context_passed: Industry signals, regulatory mentions, market trend indicators
            receiver_action: Industry trend analysis, regulatory impact assessment, market context enrichment
      provide_to:
        ae_agent:
          scope: Account intelligence for meeting prep, deal strategy, and account planning
          scenarios:
          - trigger: Account profile updated, org change detected, or whitespace opportunity identified
            context_passed: Updated account profile, org change summary, opportunity map with confidence scores
            receiver_action: Meeting preparation, engagement strategy update, opportunity qualification
        sa_agent:
          scope: Technical context from org maps and technology signals
          scenarios:
          - trigger: Technology adoption signal detected or org map reveals technical leadership change
            context_passed: Technology signals, technical leader profiles, org structure in technical divisions
            receiver_action: Technical discovery planning, architecture assessment adjustment
        fcto_agent:
          scope: Cross-account patterns and strategic initiative intelligence
          scenarios:
          - trigger: Pattern detected across multiple accounts or major strategic shift at key account
            context_passed: Cross-account pattern summary, strategic initiative details, leadership context
            receiver_action: Advisory conversation preparation, trend validation, strategic recommendation
        ca_agent:
          scope: Account context for adoption planning and expansion identification
          scenarios:
          - trigger: Account profile refresh reveals adoption-relevant changes or expansion signals
            context_passed: Business line coverage, org changes affecting adoption, expansion indicators
            receiver_action: Adoption plan adjustment, expansion opportunity assessment
    public_resources:
    - title: ZoomInfo Sales Intelligence Platform
      url: https://pipeline.zoominfo.com/sales
      context: B2B contact data, company intelligence, and sales automation for account research and prospecting
    - title: 6sense Account-Based Marketing and Intelligence
      url: https://6sense.com/blog/6sense-vs-zoominfo-account-based-marketing/
      context: Predictive account intelligence with intent signals, buyer journey insights, and in-market account identification
    - title: Stakeholder Mapping for Enterprise Sales (Outreach)
