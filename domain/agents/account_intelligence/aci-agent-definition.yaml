    type: object
    format: yaml
    description: 'Comprehensive company profile: overview, business_lines, strategic_initiatives, financial_summary'
    path: '{realm}/intelligence/account_intelligence/company_profile.yaml'
  - name: source_registry_entries
    type: array
    format: yaml
    description: Sources used during research, appended to shared registry
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: aci-company-research-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: aci-company-research-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: aci-company-research-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: opportunity-identification
