  description: Identify business opportunities by mapping company strategic initiatives to vendor capabilities and finding unengaged business lines
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: opportunity_map
    type: object
    format: yaml
    description: Identified opportunities with type, confidence, estimated_potential, and business_line mapping
    path: '{realm}/intelligence/account_intelligence/opportunity_map.yaml'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: aci-opportunity-identification-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: aci-opportunity-identification-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: aci-opportunity-identification-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: organigram-building
  name: Organigram Building
  description: Build an organizational hierarchy organized by business lines with leadership mapping, department structure, and decision chains
  inputs:
