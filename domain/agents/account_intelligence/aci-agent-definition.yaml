  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not monitor ongoing news feeds (that's MNA Agent's job) (handoff to Leadership)
  - Does not analyze competitive positioning (that's CI Agent's job) (handoff to Leadership)
  - Does not scan technology adoption signals (that's Technology Scout's job) (handoff to Leadership)
  - Does not analyze industry-level trends (that's Industry Intelligence Agent's job) (handoff to Leadership)
  - Does not make commercial recommendations (that's AE Agent's job) (handoff to Leadership)
  - Does not generate customer-facing content (handoff to Leadership)
  - Does not access internal or confidential company data (handoff to Leadership)
  - Does not fabricate organizational relationships without source evidence (handoff to Leadership)
  permissions:
