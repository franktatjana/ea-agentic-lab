# ACI Organizational Hierarchy Patterns
# Domain knowledge for building and interpreting enterprise org structures

hierarchy_models:
  functional:
    description: "Organized by business function (Engineering, Sales, Marketing, Finance)"
    signal: "Traditional structure, clear departmental boundaries, slower cross-functional decisions"
    engagement_implication: "Navigate through functional heads, budget owned by department VP"

  divisional:
    description: "Organized by business line, product, or geography with autonomous P&L"
    signal: "Decentralized decision-making, each division has own technology budget"
    engagement_implication: "Engage each division separately, GM/President is economic buyer"

  matrix:
    description: "Dual reporting lines combining functional and divisional axes"
    signal: "Complex decision chains, consensus-driven, multiple approval gates"
    engagement_implication: "Map both reporting lines, identify who has final authority"

  platform:
    description: "Shared platform teams serving product/business units"
    signal: "Centralized technology decisions for infrastructure, distributed for business apps"
    engagement_implication: "Platform team decides infrastructure, business units decide applications"

decision_chain_mapping:
  roles_to_identify:
    economic_buyer: "Controls budget allocation, approves purchase order"
    technical_decision_maker: "Evaluates and validates technical fit"
    champion: "Internal advocate who drives the opportunity forward"
    influencer: "Shapes opinion but does not have final authority"
    blocker: "Can delay or prevent decision, often procurement, legal, or security"
    user_buyer: "End user whose adoption determines success"

  authority_indicators:
    direct: "Title includes 'VP', 'SVP', 'EVP', 'Chief', 'President', 'GM', 'Head of'"
    inferred: "Reports directly to C-suite, manages budget line in filings, quoted in earnings calls"
    confirmed: "Met in engagement, confirmed authority through discovery"

  mapping_sources:
    - source: "Annual report / proxy statement"
      provides: "C-suite, board, named executive officers, compensation structure"
    - source: "LinkedIn"
      provides: "Reporting relationships, tenure, career trajectory, team size"
    - source: "Company website leadership page"
      provides: "Official hierarchy, business unit leaders, functional heads"
    - source: "Press releases"
      provides: "New appointments, promotions, departures, restructuring"
    - source: "Conference speaker bios"
      provides: "Responsibility scope, project ownership, technology focus"

leadership_change_signals:
  types:
    - change: "New CTO/CIO appointment"
      implication: "Technology strategy review likely within 90 days, vendor reevaluation probable"
      urgency: high
    - change: "CEO transition"
      implication: "Strategic direction shift, new transformation initiatives within 6 months"
      urgency: high
    - change: "Business line GM departure"
      implication: "Division priorities may shift, existing relationships need re-anchoring"
      urgency: medium
    - change: "VP Engineering hire from competitor"
      implication: "Technology stack preferences may shift, potential displacement opportunity"
      urgency: medium
    - change: "Org restructuring announcement"
      implication: "Budget reallocation, new decision-makers, engagement plan needs refresh"
      urgency: high

  detection_sources:
    - "LinkedIn role change notifications"
    - "Press releases and 8-K filings (NEO changes)"
    - "Company website leadership page updates"
    - "Industry publication coverage of executive moves"

organigram_quality_criteria:
  minimum_viable:
    - "C-suite complete (CEO, CFO, CTO/CIO, COO at minimum)"
    - "Business line leaders identified with revenue segment mapping"
    - "Technology leadership mapped to business lines"
    - "Decision chain traced for at least one active opportunity"
  comprehensive:
    - "All VP-level and above positions mapped"
    - "Reporting relationships confirmed from multiple sources"
    - "Budget authority indicators annotated per leader"
    - "Tenure and career trajectory for key stakeholders"
    - "Relationship map showing engagement history with each stakeholder"
