# ACI Research Sources
# Domain knowledge extracted to references/ per DDR-018

primary_sources:
  public_filings:
    - type: "Annual Reports (10-K)"
      intelligence: "Revenue segments, business lines, strategy narrative, risk factors, competitive landscape"
      refresh_cadence: annual
    - type: "Quarterly Reports (10-Q)"
      intelligence: "Revenue trends, segment performance, material changes, management discussion"
      refresh_cadence: quarterly
    - type: "Proxy Statements (DEF 14A)"
      intelligence: "Executive compensation, board composition, governance structure, shareholder proposals"
      refresh_cadence: annual
    - type: "8-K Filings"
      intelligence: "Material events, executive changes, M&A, restructuring, strategic shifts"
      refresh_cadence: event-driven
      source_url: "https://www.sec.gov/cgi-bin/browse-edgar"
      publisher: SEC EDGAR

  corporate_communications:
    - type: "Earnings Call Transcripts"
      intelligence: "Strategic priorities, growth drivers, competitive positioning, forward guidance"
      signal_quality: high
    - type: "Investor Presentations"
      intelligence: "Strategy framework, market sizing, competitive differentiation, product roadmap hints"
      signal_quality: high
    - type: "Press Releases"
      intelligence: "Product launches, partnerships, executive appointments, M&A activity"
      signal_quality: medium
    - type: "Company Website (About, Leadership, IR)"
      intelligence: "Org structure, leadership bios, corporate narrative, job openings"
      signal_quality: medium

  professional_networks:
    - type: "LinkedIn Company Pages"
      intelligence: "Employee count, growth rate, department composition, job postings"
      signal_quality: medium
    - type: "LinkedIn Executive Profiles"
      intelligence: "Role changes, tenure, professional background, connections"
      signal_quality: high
    - type: "Glassdoor/Blind Reviews"
      intelligence: "Internal culture signals, organizational health, leadership sentiment"
      signal_quality: low

secondary_sources:
  industry_coverage:
    - "Analyst reports mentioning the company (Gartner, Forrester, IDC)"
    - "Industry trade publications and vertical media"
    - "Conference speaker bios, presentations, and panel participation"
    - "Patent filings and research publications indicating technology direction"
    - "Government contract awards and regulatory filings"

  competitive_signals:
    - "Job postings revealing technology stack and strategic hires"
    - "Partnership and alliance announcements"
    - "Customer case studies and reference stories"
    - "Social media presence and thought leadership content"

confidence_scoring:
  high: "Direct from company (filings, IR, official communications)"
  medium: "Professional networks, verified third-party sources"
  low: "Inferred from indirect signals, unverified sources"
  attribution_rule: "Every claim must link to a verifiable source with timestamp"
