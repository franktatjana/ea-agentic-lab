# ACI Opportunity Classification Framework
# Domain knowledge for identifying and scoring whitespace opportunities

opportunity_types:
  unengaged_business_line:
    definition: "Business unit or division where vendor has no active engagement despite capability fit"
    detection_method: "Compare organigram business lines against active deal/customer map"
    confidence_factors:
      - "Business line revenue visibility (disclosed in filings)"
      - "Technology stack indicators from job postings"
      - "Leadership tenure and transformation mandate signals"
    typical_trigger: "Organigram refresh reveals new or restructured division"

  initiative_capability_match:
    definition: "Published strategic initiative that maps directly to vendor solution capability"
    detection_method: "Extract initiatives from earnings calls, filings, press releases, map against vendor portfolio"
    confidence_factors:
      - "Budget signal (investment amount mentioned)"
      - "Timeline signal (fiscal year or quarter commitment)"
      - "Executive sponsor identified"
      - "Technology category explicitly named"
    typical_trigger: "Earnings call or annual report reveals new transformation program"

  competitive_displacement:
    definition: "Incumbent competitor showing weakness signals at the account"
    detection_method: "Monitor for vendor-switch indicators in job postings, complaints, contract expirations"
    confidence_factors:
      - "Job postings mentioning new technology stack"
      - "Executive change in technology leadership"
      - "Public criticism of existing vendor"
      - "Contract renewal timeline approaching"
    typical_trigger: "Technology leadership change or public dissatisfaction signal"

  expansion_adjacency:
    definition: "Existing customer relationship with natural expansion into adjacent use cases"
    detection_method: "Map current engagement scope against full vendor capability portfolio"
    confidence_factors:
      - "Current engagement health and satisfaction signals"
      - "Adjacent business line connectivity to engaged division"
      - "Budget authority overlap between divisions"
    typical_trigger: "Account profile refresh shows growth in adjacent business line"

opportunity_scoring:
  dimensions:
    - name: "Capability Fit"
      weight: 0.30
      scale: "1-5 based on vendor portfolio coverage of the identified need"
    - name: "Timing Signal"
      weight: 0.25
      scale: "1-5 based on urgency indicators (budget cycle, initiative timeline, competitive pressure)"
    - name: "Access Quality"
      weight: 0.20
      scale: "1-5 based on relationship depth with relevant decision-makers"
    - name: "Budget Visibility"
      weight: 0.15
      scale: "1-5 based on disclosed investment or budget allocation signals"
    - name: "Source Confidence"
      weight: 0.10
      scale: "1-5 based on evidence quality (primary filing vs. inferred)"

  thresholds:
    hot: "Score >= 4.0, pursue within current quarter"
    warm: "Score 2.5-3.9, develop and monitor"
    cold: "Score < 2.5, track for future activation"

whitespace_analysis_process:
  step_1: "Build complete business line map from latest annual report and organigram"
  step_2: "Overlay current vendor engagement map (active deals, customers, trials)"
  step_3: "Identify gaps where business lines exist without vendor engagement"
  step_4: "For each gap, assess capability fit against vendor portfolio"
  step_5: "Score opportunities using multi-dimensional framework"
  step_6: "Prioritize and package for account team with source evidence"
