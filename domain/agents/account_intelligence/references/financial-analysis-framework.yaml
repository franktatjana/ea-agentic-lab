# ACI Financial Analysis Framework
# Domain knowledge for interpreting company financials from public filings

revenue_analysis:
  segment_decomposition:
    purpose: "Break total revenue into business lines to identify growth engines and declining segments"
    data_sources:
      - "10-K segment reporting (ASC 280)"
      - "Earnings call management commentary"
      - "Investor day business unit presentations"
    key_metrics:
      - "Revenue by segment (absolute and percentage of total)"
      - "Year-over-year growth rate by segment"
      - "Gross margin by segment (when disclosed)"
      - "Geographic revenue distribution"

  growth_signal_detection:
    accelerating: "Two consecutive quarters of increasing YoY growth rate"
    decelerating: "Two consecutive quarters of declining YoY growth rate"
    pivot_indicator: "New segment appearing in filings or segment renamed/restructured"
    acquisition_driven: "Revenue jump coinciding with M&A closure, organic growth disclosed separately"

financial_health_indicators:
  profitability:
    - metric: "Operating margin trend"
      signal: "Expanding margins suggest operational efficiency or pricing power"
    - metric: "Free cash flow conversion"
      signal: "FCF/Revenue ratio indicates business model sustainability"
    - metric: "R&D as percentage of revenue"
      signal: "Investment intensity signals technology commitment and innovation capacity"

  balance_sheet:
    - metric: "Cash and equivalents"
      signal: "Runway for M&A, investment, or restructuring"
    - metric: "Debt-to-equity ratio trend"
      signal: "Leverage changes indicate strategic financing decisions"
    - metric: "Deferred revenue growth"
      signal: "Leading indicator of future recognized revenue, especially in SaaS"

  risk_factors:
    - "Customer concentration (single customer >10% of revenue)"
    - "Geographic concentration and currency exposure"
    - "Regulatory risk disclosures and pending litigation"
    - "Going concern qualifications or auditor changes"

strategic_initiative_extraction:
  sources:
    - section: "Management Discussion & Analysis (MD&A)"
      extract: "Strategic priorities, market opportunities, operational initiatives"
    - section: "Risk Factors"
      extract: "Competitive threats, market disruption, technology dependencies"
    - section: "CEO Letter to Shareholders"
      extract: "Vision, transformation themes, long-term strategic direction"
    - section: "Earnings Call Q&A"
      extract: "Analyst concerns, management confidence signals, forward guidance nuance"

  classification:
    growth_initiative: "New markets, products, or customer segments being pursued"
    efficiency_initiative: "Cost reduction, automation, consolidation programs"
    transformation_initiative: "Digital transformation, platform migration, business model shifts"
    compliance_initiative: "Regulatory response, security enhancement, governance programs"

vendor_relevance_scoring:
  high: "Initiative directly maps to vendor capability with budget signals"
  medium: "Initiative is adjacent to vendor capability, timing uncertain"
  low: "Initiative is tangentially related, no direct capability match"
  scoring_inputs:
    - "Mentioned budget allocation or investment amount"
    - "Named technology category or vendor type"
    - "Timeline commitment (this year, next year, multi-year)"
    - "Executive sponsor identified in public communications"
