      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Win status to record
      - Journey map updates
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Win documented with evidence and confidence
      - CSP baselines have measurement methodology
      - AE handoff includes commercial leverage and risks
      - Implementation notes capture POC-validated decisions
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, AE handoff, and next steps.
      - If run_mode is DISCOVERY: produce only the win documentation checklist and data gaps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the win with value proven,
      (2) the strongest commercial lever for negotiation,
      and (3) the most urgent next action to maintain momentum.

  handle_poc_loss:
    name: "Handle POC Loss"
    description: "Process an unsuccessful POC outcome with root cause analysis, competitive insights, product feedback, and resurrection assessment"
    prompt: |
      Context: POC lost for {account_name}.
      POC results: {results_summary}
      Loss type: {COMPETITOR|NO_DECISION|TECHNICAL}
      Loss reason: {reason}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + root cause + resurrection; DISCOVERY = data collection checklist only. Default: FULL)

      You are processing a POC loss. Honest loss analysis prevents
      repeating mistakes and may identify resurrection opportunities.
      Every loss produces learning that improves future POC execution.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: LOSS CLASSIFICATION
      Classify the loss:
      - Category: COMPETITOR / NO_DECISION / TECHNICAL / OTHER
        + secondary flag if applicable
      - Timing: DURING POC / POST POC / DELAYED
      - Predictability: EXPECTED / UNEXPECTED / GRADUAL
      - Confidence: HIGH (customer confirmed), MEDIUM (inferred), LOW (speculation)
      Deliverable: Loss Classification (Category | Secondary Flag | Timing |
      Predictability | Confidence).

      STEP 2: ROOT CAUSE ANALYSIS
      Identify root cause:
      - Primary root cause
      - Contributing factors
      - Timeline of key events
      - Inflection point (when outcome became likely)
      - Missed signals
      - Confidence: HIGH (post-mortem data), MEDIUM (analysis), LOW (limited info)
      Deliverable: Root Cause Analysis (Primary Cause | Contributing Factors |
      Timeline | Inflection Point | Missed Signals | Confidence).

      STEP 3: LEARNINGS
      Capture actionable learnings:
      - What worked well (keep doing)
      - What should have been done differently (specific changes)
      - Qualification signals that should have been caught
      - Process improvements for future POCs
      Deliverable: Learnings (Category | Observation | Specific Change |
      Impact on Future POCs).

      STEP 4: COMPETITIVE INSIGHTS
      Capture competitive intelligence (if applicable):
      - Competitor strengths observed
      - Competitor weaknesses observed
      - Customer comparison points
      - Positioning adjustments needed
      - Confidence: HIGH (customer shared), MEDIUM (inferred), LOW (rumored)
      If not competitor loss: state "Not applicable, loss not competitor-driven."
      Deliverable: Competitive Insights (Dimension | Competitor | Us | Gap |
      Confidence).

      STEP 5: PRODUCT FEEDBACK
      Capture product-relevant feedback:
      - Feature gaps
      - Integration limitations
      - Performance issues
      - Priority: HIGH (deal-breaking) / MEDIUM (significant) / LOW (minor)
      If no product issues: state "Loss not attributed to product limitations."
      Deliverable: Product Feedback (Item | Category | Impact | Priority |
      Confidence).

      STEP 6: RESURRECTION ASSESSMENT
      Assess future re-engagement potential:
      - Potential: HIGH / MEDIUM / LOW / NONE
      - Conditions for re-engagement
      - Nurture approach
      - Timeline for re-engagement attempt
      - Confidence: HIGH (customer indicated interest), MEDIUM (relationship
        intact), LOW (minimal signal)
      Deliverable: Resurrection Assessment (Potential | Conditions | Nurture |
      Timeline | Confidence).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Loss documentation to record
      - Account status change
      - Nurture actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Root cause is specific, not generic
      - Learnings are actionable with specific changes
      - Competitive insights attributed with confidence
      - Product feedback prioritized by deal impact
      - Resurrection has specific conditions
      - No trend claims from single loss
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, root cause, and resurrection assessment.
      - If run_mode is DISCOVERY: produce only the data collection checklist for full analysis.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the loss classification with confidence,
      (2) the primary root cause,
      and (3) the resurrection potential with recommended next step.

