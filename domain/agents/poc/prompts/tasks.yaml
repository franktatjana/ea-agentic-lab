# POC Agent Task Prompts
# Purpose: Full runbook prompts with numbered steps, named deliverables, and quality checks
# Reference: Personality defined in personalities/poc_personality.yaml
# Standard: docs/architecture/playbooks/runbook-design-principles.md
# Framework: Enhanced with industry POV framework best practices

# ============================================================================
# POV QUALIFICATION PROMPTS
# ============================================================================
pov_qualification:

  pov_type_recommendation:
    name: "POV Type Recommendation"
    description: "Recommend appropriate POV type based on opportunity value, customer engagement capacity, and timeline constraints to select the optimal evaluation format"
    prompt: |
      Context: POV request for {account_name}.
      Opportunity ARR: {opportunity_arr}
      Use cases: {use_cases}
      Customer engagement level: {engagement_level}
      Timeline: {timeline}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + top recommendation; DISCOVERY = qualification checklist only. Default: FULL)

      You are recommending the optimal POV type for this opportunity.
      POV type selection drives resource allocation, customer commitment level,
      and ultimately conversion probability. A mismatched type wastes SA cycles
      or under-serves strategic accounts. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: OPPORTUNITY ASSESSMENT
      Evaluate the opportunity along these dimensions:
      - ARR value tier: ENTERPRISE (>$200K), MID-MARKET ($50K-$200K), VELOCITY (<$50K)
      - Strategic importance: STRATEGIC (logo win, competitive displacement, expansion),
        STANDARD (net-new, typical deal), TRANSACTIONAL (renewal add-on, small expansion)
      - Use case complexity: HIGH (multi-product, integration-heavy), MEDIUM (single product,
        some integration), LOW (standard deployment, minimal customization)
      - Confidence: HIGH (data from CRM + AE confirmation), MEDIUM (CRM data only),
        LOW (verbal estimate or missing fields)
      If {opportunity_arr} is empty: state that ARR is unknown, note that type
      recommendation will default to conservative option, proceed without fabrication.
      Deliverable: Opportunity Assessment table (Dimension | Classification | Evidence |
      Confidence).

      STEP 2: CUSTOMER ENGAGEMENT CAPACITY
      Assess the customer's ability to participate in each POV type:
      - Technical evaluator availability: DEDICATED / SHARED / UNKNOWN
      - Executive sponsor engagement: ACTIVE / PASSIVE / ABSENT
      - Data and environment readiness: READY / PARTIAL / NOT READY
      - Time commitment capacity: FULL (daily touchpoints), MODERATE (2-3x/week),
        LIMITED (weekly only)
      - Confidence: HIGH (confirmed by customer), MEDIUM (inferred from engagement
        pattern), LOW (assumed or unknown)
      If {engagement_level} is empty: state that engagement capacity is unknown,
      note this is a risk factor for any POV type, proceed with conservative estimate.
      Deliverable: Engagement Capacity table (Factor | Assessment | Evidence | Confidence).

      STEP 3: POV TYPE MATCHING
      Match opportunity and engagement profiles to POV type using this matrix:

      POV Type Definitions:
      - GUIDED: 14-45 days, regular touchpoints, standard enterprise.
        Best fit: MID-MARKET to ENTERPRISE, MODERATE engagement, MEDIUM complexity
      - ON-SITE: 3-5 days, daily SA involvement, strategic accounts.
        Best fit: ENTERPRISE, FULL engagement, HIGH complexity, competitive displacement
      - PAID: 60+ days, extended engagement, complex enterprise.
        Best fit: ENTERPRISE with >$300K ARR, DEDICATED evaluator, HIGH complexity
      - LITE: 1-2 weeks, minimal touchpoints, velocity deals.
        Best fit: VELOCITY, LIMITED engagement, LOW complexity

      For each type, score fit as: STRONG / MODERATE / WEAK with rationale.
      Assign primary recommendation and secondary alternative.
      - Confidence: HIGH (clear match on 3+ dimensions), MEDIUM (match on 2 dimensions),
        LOW (ambiguous, multiple types score similarly)
      Deliverable: POV Type Fit Matrix (Type | Duration | Fit Score | Rationale | Confidence)
      + Primary recommendation + Alternative recommendation.

      STEP 4: RESOURCE REQUIREMENTS
      For the recommended POV type, specify:
      - SA hours required (total and per-week)
      - SE support needed (yes/no, hours)
      - Customer resources needed (roles, hours)
      - Environment and tooling needs
      - Prerequisites before POV start
        Prerequisites column: what must be true before this resource is allocated
      Deliverable: Resource Requirements table (Resource | Quantity | Duration |
      Prerequisites | Owner).

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - POV type recommendation to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Every classification includes confidence level with basis
      - POV type fit scored across all four types, not just the recommended one
      - Resource requirements include prerequisites column
      - Alternative type provided in case primary is not feasible
      - Account state delta references specific evidence for each field change
      - No trend claims made from single data points
      - Executive summary is self-sufficient: a reader can act on it without reading detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, primary recommendation, and account state delta. Skip detailed scoring tables.
      - If run_mode is DISCOVERY: produce only the qualification checklist and data gaps to resolve before type recommendation.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the recommended POV type with confidence level,
      (2) the weakest point in the recommendation (lowest-confidence dimension),
      and (3) the single most urgent action to take next.

  pov_qualification_assessment:
    name: "POV Qualification Assessment"
    description: "Qualify opportunity for POV engagement by evaluating mandatory go criteria, no-go signals, and conditional factors to produce a GO/NO-GO/CONDITIONAL decision"
    prompt: |
      Context: POV qualification for {account_name}.
      Opportunity: {opportunity_details}
      Stage: {stage}
      ARR: {arr}
      Discovery findings: {discovery_summary}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + decision + top action; DISCOVERY = criteria checklist only. Default: FULL)

      You are assessing whether this opportunity qualifies for a POV engagement.
      A poorly qualified POV consumes SA capacity without conversion probability.
      Every qualification dimension must be scored with evidence, not assumptions.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: MANDATORY GO CRITERIA
      Evaluate each mandatory criterion. All must be MET for GO decision:
      - Budget confirmed or highly likely
      - Decision timeline < 90 days post-POV
      - Technical evaluator identified and engaged
      - Success criteria agreed in writing
      - Customer commits time and resources

      For each criterion:
      - Status: MET / NOT MET / UNKNOWN
      - Evidence supporting the status
      - Confidence: HIGH (documented proof), MEDIUM (verbal confirmation),
        LOW (inferred or assumed)
      If {discovery_summary} is empty: state that no discovery findings are available,
      note that all criteria will require direct verification, proceed with UNKNOWN
      status for evidence-dependent criteria.
      Deliverable: Mandatory Criteria table (Criterion | Status | Evidence | Confidence).

      STEP 2: NO-GO SIGNAL DETECTION
      Scan for disqualifying signals:
      - Active competitor POC running simultaneously
      - No budget authority identified
      - Evaluation is "just looking" with no project timeline
      - Customer unwilling to commit any resources
      - Technical fit issues identified in discovery
      - Political blockers (e.g., incumbent vendor with executive sponsorship)

      For each signal:
      - Signal: detected / not detected
      - Severity: HARD NO-GO (disqualifying) / SOFT NO-GO (addressable risk)
      - Evidence
      - Confidence: HIGH (confirmed), MEDIUM (suspected), LOW (rumored)
        Assign primary classification. Add secondary flag if signal could be
        either hard or soft depending on resolution.
      Deliverable: No-Go Signal table (Signal | Detected | Severity | Secondary Flag |
      Evidence | Confidence).

      STEP 3: CONDITIONAL FACTORS
      Identify conditions that must be met for the POV to succeed:
      - For each condition:
        - Description
        - Owner (who resolves it)
        - Timeline to resolve
        - Impact if unresolved: BLOCKS POV / DEGRADES POV / MANAGEABLE
        - Prerequisites: what must happen before this condition can be addressed
      If no conditional factors exist: state "No conditional factors identified."
      Deliverable: Conditional Factors table (Condition | Owner | Resolve By |
      Impact if Unresolved | Prerequisites).

      STEP 4: QUALIFICATION DECISION
      Based on Steps 1-3, determine overall qualification:
      - GO: all mandatory criteria MET, no HARD NO-GO signals
      - NO-GO: 1+ HARD NO-GO signals, or 3+ mandatory criteria NOT MET
      - CONDITIONAL: some mandatory criteria UNKNOWN or NOT MET, but addressable
        within reasonable timeframe

      State the decision with:
      - Decision rationale (2-3 sentences)
      - Strongest supporting evidence
      - Greatest risk to the decision
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Qualification Decision (Decision | Rationale | Key Evidence |
      Key Risk | Confidence).

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Qualification status to record
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Every mandatory criterion has evidence and confidence, not just MET/NOT MET
      - No-go signals include severity classification with secondary flags
      - Conditional factors include prerequisites and owner
      - Decision confidence stated with explicit basis
      - Account state delta references specific evidence for each field change
      - No trend claims from single observations
      - Executive summary is self-sufficient: a reader can act on it without reading detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, qualification decision, and account state delta.
      - If run_mode is DISCOVERY: produce only the criteria checklist with current known status and data needed.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the qualification decision with confidence level,
      (2) the weakest point in the assessment (lowest-confidence criterion or highest-risk signal),
      and (3) the single most urgent action to take next.

  success_criteria_design:
    name: "POV Success Criteria Design"
    description: "Design measurable SMART success criteria collaboratively with the customer, ensuring each criterion is specific, achievable within POV scope, and tied to a business outcome"
    prompt: |
      Context: Designing success criteria for {account_name} POV.
      Use cases: {use_cases}
      Business outcomes: {business_outcomes}
      Customer priorities: {priorities}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + criteria table; DISCOVERY = criteria framework only. Default: FULL)

      You are designing success criteria that will determine POV outcome.
      Poorly defined criteria lead to scope creep, disputed results, and stalled
      decisions. Each criterion must be measurable, achievable in the POV window,
      and traceable to a business outcome. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: BUSINESS OUTCOME MAPPING
      Map each stated business outcome to potential success criteria:
      - Business outcome
      - Measurable proxy in POV scope
      - Why this proxy is valid
      - Confidence: HIGH (direct measurement), MEDIUM (reasonable proxy),
        LOW (weak correlation to outcome)
      If {business_outcomes} is empty: state that no business outcomes are documented,
      note this is a critical gap that must be resolved before criteria can be finalized,
      proceed with use-case-based criteria as placeholder.
      Deliverable: Outcome Mapping table (Business Outcome | POV Proxy | Validity |
      Confidence).

      STEP 2: CRITERIA DEFINITION (max 5)
      For each criterion:
      - ID (SC-01 through SC-05)
      - Category: FUNCTIONAL / PERFORMANCE / INTEGRATION / OPERATIONAL / BUSINESS
        Assign primary category. Add secondary flag if criterion spans categories.
      - Criterion statement (one sentence, specific)
      - Measurement method (how it will be measured)
      - Target value (specific, quantified)
      - Priority: MUST_HAVE / SHOULD_HAVE
      - Milestone: when in POV timeline this should be demonstrated
      - Baseline: current state measurement needed before POV
      - Confidence: HIGH (customer confirmed), MEDIUM (SA-proposed, not yet validated),
        LOW (inferred from use cases)
      Deliverable: Success Criteria table (ID | Category | Secondary Flag | Criterion |
      Measurement | Target | Priority | Milestone | Baseline | Confidence).

      STEP 3: SMART VALIDATION
      Validate each criterion against SMART framework:
      - Specific: is the outcome clearly defined? YES/NO + comment
      - Measurable: is there a quantifiable metric? YES/NO + comment
      - Achievable: is it realistic in POV scope? YES/NO + comment
      - Relevant: is it tied to a stated business outcome? YES/NO + comment
      - Time-bound: can it be proven in the timeline? YES/NO + comment

      Flag any criterion that fails 2+ SMART dimensions for redesign.
      Deliverable: SMART Validation table (ID | Specific | Measurable | Achievable |
      Relevant | Time-bound | Pass/Fail).

      STEP 4: ANTI-PATTERN CHECK
      Screen criteria for common anti-patterns:
      - "Prove everything works" (scope too broad)
      - "Match competitor feature X" (feature war, not value proof)
      - Subjective criteria ("easy to use", "intuitive")
      - Moving target criteria (no fixed target value)
      - Criteria that require production data not available in POV

      For each anti-pattern: detected / not detected, with remediation if detected.
      Deliverable: Anti-Pattern Check table (Anti-Pattern | Detected | Affected Criteria |
      Remediation).

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Success criteria to record
      - Baseline measurements needed
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Maximum 5 criteria defined (more dilutes focus)
      - Every criterion has confidence level with basis
      - SMART validation completed for each criterion
      - Anti-pattern check completed
      - Each criterion traces to a business outcome
      - Baseline measurement identified for each criterion
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, criteria table, and account state delta.
      - If run_mode is DISCOVERY: produce only the criteria framework with business outcome mapping and data gaps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) number of criteria defined with overall confidence,
      (2) the weakest criterion or highest-risk gap,
      and (3) the single most urgent action to take next (e.g., customer sign-off, baseline capture).

  blocker_analysis:
    name: "POV Blocker Analysis"
    description: "Identify, classify, and plan resolution for POV blockers with ownership, impact assessment, and escalation paths"
    prompt: |
      Context: Potential blockers for {account_name} POV.
      Qualification findings: {findings}
      Customer constraints: {constraints}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + critical blockers; DISCOVERY = blocker inventory only. Default: FULL)

      You are analyzing blockers that could prevent POV start or success.
      Unresolved blockers are the primary cause of POV delays and failures.
      Each blocker must have an owner, resolution path, and escalation trigger.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: BLOCKER IDENTIFICATION
      Identify all potential blockers across these categories:
      - TECHNICAL: environment access, data availability, integration dependencies
      - ORGANIZATIONAL: resource availability, scheduling conflicts, approval chains
      - COMMERCIAL: budget, procurement, legal/security review
      - STAKEHOLDER: evaluator commitment, sponsor engagement, decision maker access

      For each blocker:
      - Category (primary + secondary flag if applicable)
      - Description
      - Severity: CRITICAL (blocks POV start) / HIGH (blocks success criteria) /
        MEDIUM (degrades POV quality) / LOW (inconvenience)
      - Confidence: HIGH (confirmed by stakeholder), MEDIUM (observed pattern),
        LOW (suspected risk)
      If {findings} is empty: state that no qualification findings are available,
      note that blocker analysis will be based on {constraints} only, proceed
      without fabrication.
      Deliverable: Blocker Inventory table (ID | Category | Secondary Flag | Description |
      Severity | Confidence).

      STEP 2: IMPACT AND DEPENDENCY ANALYSIS
      For each blocker, assess:
      - Impact on POV timeline (days of delay if unresolved)
      - Impact on success criteria (which criteria are affected)
      - Dependencies (does resolving this blocker depend on resolving another?)
      - Critical path: YES (on critical path to POV start/success) / NO
      Deliverable: Impact Analysis table (Blocker ID | Timeline Impact | Criteria Affected |
      Dependencies | Critical Path).

      STEP 3: RESOLUTION PLANNING
      For each blocker:
      - Owner: who is responsible for resolution (name + role)
      - Resolution approach (specific actions)
      - Timeline to resolve
      - Prerequisites: what must be true before resolution can begin
      - Escalation trigger: condition under which this blocker should be escalated
      - Escalation target: SM, AE, SA Manager, or customer executive
      Deliverable: Resolution Plan table (Blocker ID | Owner | Resolution Approach |
      Timeline | Prerequisites | Escalation Trigger | Escalation Target).

      STEP 4: PROCEED RECOMMENDATION
      Based on blocker analysis, recommend:
      - PROCEED: no critical blockers, or all critical blockers have confirmed
        resolution paths within acceptable timeline
      - WAIT: critical blockers exist but are resolvable, specify wait conditions
      - CANCEL: unresolvable critical blockers, POV not viable

      State recommendation with:
      - Decision rationale
      - Conditions for re-assessment (if WAIT)
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Proceed Recommendation (Decision | Rationale | Conditions |
      Confidence).

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Blockers to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Every blocker has severity, confidence, and owner
      - Resolution plans include prerequisites and escalation triggers
      - Critical path analysis completed
      - Proceed recommendation includes confidence with basis
      - No blocker left without an owner
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, critical blockers, and proceed recommendation.
      - If run_mode is DISCOVERY: produce only the blocker inventory with categories and severity.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) total blockers found with count by severity,
      (2) the most critical blocker and its resolution status,
      and (3) the proceed/wait/cancel recommendation with confidence.

# ============================================================================
# POV KICKOFF PROMPTS
# ============================================================================
pov_kickoff:

  internal_kickoff_prep:
    name: "Internal POV Kickoff Preparation"
    description: "Prepare for internal team alignment before customer kickoff by defining roles, risks, technical approach, and customer engagement strategy"
    prompt: |
      Context: Internal kickoff for {account_name} POV.
      POV type: {pov_type}
      Success criteria: {success_criteria}
      Timeline: {start_date} to {end_date}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + role assignments + top risk; DISCOVERY = team roster and gap analysis only. Default: FULL)

      You are preparing the internal team alignment before the customer-facing
      kickoff. Internal misalignment is a top-three cause of POV failure.
      Every team member must know their role, the success criteria they own,
      and the risks they need to watch. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: TEAM ROSTER AND ROLES
      Identify all internal team members needed for this POV:
      - Person / Role / Responsibilities / Time commitment / Availability status
      - For each role: CONFIRMED / TENTATIVE / NEEDED (not yet assigned)
      - Confidence: HIGH (confirmed by manager), MEDIUM (verbal commitment),
        LOW (assumed availability)
      If team members are not specified: state that team roster is incomplete,
      list required roles based on POV type, flag as critical gap.
      Deliverable: Team Roster table (Person | Role | Responsibilities |
      Time Commitment | Availability | Confidence).

      STEP 2: SUCCESS CRITERIA OWNERSHIP
      Map each success criterion to an internal owner:
      - Criterion ID and statement
      - Primary owner (person responsible for proving this criterion)
      - Technical approach (how this criterion will be demonstrated)
      - Dependencies (environment, data, customer access)
      - Prerequisites: what must be ready before this criterion work can begin
      - Risk level: HIGH / MEDIUM / LOW
      If {success_criteria} is empty: state that criteria are not yet defined,
      note this blocks meaningful ownership assignment, flag for resolution
      before customer kickoff.
      Deliverable: Criteria Ownership table (Criterion ID | Statement | Owner |
      Technical Approach | Dependencies | Prerequisites | Risk).

      STEP 3: RISK REGISTER (INITIAL)
      Identify initial risks for this POV:
      - Risk description
      - Category: TECHNICAL / ORGANIZATIONAL / TIMELINE / CUSTOMER / COMPETITIVE
        Assign primary category + secondary flag if applicable.
      - Likelihood: HIGH / MEDIUM / LOW
      - Impact: HIGH / MEDIUM / LOW
      - Mitigation strategy
      - Owner
      - Confidence: HIGH (based on known factors), MEDIUM (based on similar POVs),
        LOW (speculative)
      Deliverable: Risk Register table (Risk | Category | Secondary Flag | Likelihood |
      Impact | Mitigation | Owner | Confidence).

      STEP 4: CUSTOMER ENGAGEMENT STRATEGY
      Define approach for customer-facing interactions:
      - Communication cadence (daily standup, weekly review, ad-hoc)
      - Primary customer contact and backup
      - Escalation path (customer-side and internal)
      - Engagement rules (response SLA, meeting format, documentation sharing)
      - Competitive intelligence considerations (if competitor is in play)
      Deliverable: Engagement Strategy (Cadence | Contacts | Escalation Path |
      Rules | Competitive Notes).

      STEP 5: INTERNAL KICKOFF AGENDA
      Produce the meeting agenda for the internal kickoff:
      - Agenda items with time allocation
      - Decision points to resolve
      - Materials to prepare before meeting
      - Expected outcomes from meeting
      Deliverable: Internal Kickoff Agenda (Item | Duration | Owner | Expected Outcome).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Team assignments to record
      - Risk entries to add
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Every team member has confirmed/tentative/needed status
      - Every success criterion has an owner
      - Risk register includes confidence for each risk
      - Engagement strategy addresses escalation paths
      - Agenda includes decision points, not just information sharing
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, team roster, and top risk.
      - If run_mode is DISCOVERY: produce only the team roster with gaps and role requirements.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) team readiness status with confidence,
      (2) the highest-risk gap in preparation,
      and (3) the single most urgent action before customer kickoff.

  external_kickoff_prep:
    name: "External POV Kickoff Preparation"
    description: "Prepare for customer POV kickoff meeting including agenda, success criteria confirmation, mutual commitments, and communication plan"
    prompt: |
      Context: Customer kickoff for {account_name} POV.
      Internal alignment: {internal_summary}
      Customer attendees: {customer_attendees}
      Success criteria: {success_criteria}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + agenda + commitments; DISCOVERY = attendee and readiness check only. Default: FULL)

      You are preparing the customer-facing POV kickoff. This meeting sets
      expectations and secures mutual commitments. Failure to confirm success
      criteria and commitments at kickoff leads to scope creep and disputed
      outcomes. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: ATTENDEE AND READINESS CHECK
      Verify customer-side readiness:
      - Expected attendees: name, role, decision authority (DECISION_MAKER /
        EVALUATOR / INFLUENCER / OBSERVER)
      - Key missing attendees (who should be there but is not confirmed)
      - Pre-meeting materials sent: YES / NO
      - Environment readiness: READY / PARTIAL / NOT READY
      - Confidence: HIGH (confirmed RSVP), MEDIUM (invited, no response),
        LOW (not yet invited)
      If {customer_attendees} is empty: state that attendee list is unknown,
      note this is a risk for commitment confirmation, flag for resolution.
      Deliverable: Attendee Readiness table (Name | Role | Authority | RSVP Status |
      Confidence) + Readiness Gaps.

      STEP 2: KICKOFF AGENDA
      Design the kickoff meeting agenda with time allocations:
      - Welcome and introductions (5 min)
      - POV objectives and scope review (10 min)
      - Success criteria walkthrough and confirmation (15 min)
      - Mutual commitments review (10 min)
      - Timeline and milestone review (10 min)
      - Communication cadence confirmation (5 min)
      - Q&A and next steps (5 min)

      For each agenda item:
      - Owner (presenter)
      - Key message or decision to capture
      - Materials needed
      Deliverable: Kickoff Agenda table (Item | Duration | Owner | Key Message |
      Materials).

      STEP 3: MUTUAL COMMITMENTS
      Document commitments to confirm at kickoff:

      Customer commitments:
      - Technical resource availability (hours/week)
      - Data and environment access (what, when)
      - Response SLA for questions and blockers
      - Decision maker availability for midpoint and final review
      - Executive sponsor briefing cadence

      {vendor} commitments:
      - SA availability and response SLA
      - Deliverables with dates
      - Support escalation path
      - Status update cadence

      For each commitment:
      - Status: CONFIRMED / TO CONFIRM / AT RISK
      - Prerequisites: what must be true for this commitment to hold
      Deliverable: Mutual Commitments table (Party | Commitment | Status |
      Prerequisites | Owner).

      STEP 4: TIMELINE AND MILESTONES
      Present the POV timeline for customer review:
      - Phase breakdown with dates
      - Milestone markers with success criteria mapped
      - Key decision points
      - Buffer time allocation
      Deliverable: Timeline (Phase | Dates | Activities | Milestones | Decision Points).

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Commitments to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Agenda includes time allocations and owners for every item
      - All commitments have status and prerequisites
      - Decision maker attendance confirmed or flagged
      - Success criteria are ready for customer confirmation
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, agenda, and commitments table.
      - If run_mode is DISCOVERY: produce only the attendee readiness check and gaps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) kickoff readiness status with confidence,
      (2) the biggest risk to a successful kickoff,
      and (3) the single most urgent action before the meeting.

  mutual_action_plan:
    name: "POV Mutual Action Plan"
    description: "Create a phased mutual action plan for POV execution with milestones, resource allocation, communication cadence, and risk acknowledgment"
    prompt: |
      Context: Creating MAP for {account_name} POV.
      Success criteria: {success_criteria}
      Timeline: {timeline}
      Resources: {resources}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + phase breakdown; DISCOVERY = resource and timeline feasibility check only. Default: FULL)

      You are creating the mutual action plan that governs POV execution.
      The MAP is the single document both parties reference for accountability.
      Every action must have an owner, due date, and exit criteria. Vague
      actions lead to disputed progress. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: PHASE BREAKDOWN
      Define POV phases with actions:

      Setup Phase (Days 1-2):
      - Actions with owner, due date, exit criteria
      - Environment provisioning, access verification, baseline capture
      - Prerequisites: what must be complete before this phase starts

      Core Validation Phase (Days 3-7):
      - Actions mapped to success criteria
      - Daily touchpoint cadence
      - Exit criteria: minimum criteria progress before advancing
      - Prerequisites: setup phase exit criteria met

      Extended Validation Phase (Days 8-12, if applicable):
      - Advanced scenarios, edge cases, integration testing
      - Criteria that require extended observation
      - Prerequisites: core validation exit criteria met

      Wrap-up Phase (Final days):
      - Results compilation, feedback session, recommendation
      - Deliverables to produce
      - Prerequisites: validation phases complete

      For each action:
      - Owner (specific person)
      - Due date
      - Exit criteria (how we know it is done)
      - Dependencies
      Deliverable: Phase Plan (Phase | Action | Owner | Due | Exit Criteria |
      Dependencies | Prerequisites).

      STEP 2: MILESTONE TABLE
      Define key milestones:
      - Milestone name
      - Target date
      - Owner
      - Success indicator (how we know milestone is met)
      - Impact if missed (on overall POV timeline and criteria)
      Deliverable: Milestone table (Milestone | Date | Owner | Success Indicator |
      Impact if Missed).

      STEP 3: RESOURCE ALLOCATION
      Map resources to phases:
      - Person / Role / Phase involvement / Hours per week / Availability confirmed
      - Identify resource conflicts or gaps
      - Backup plan for key person unavailability
      Deliverable: Resource Allocation table (Person | Role | Phase | Hours/Week |
      Confirmed | Backup Plan).

      STEP 4: COMMUNICATION PLAN
      Define communication cadence:
      - Daily standups: time, attendees, format
      - Weekly reviews: time, attendees, agenda
      - Ad-hoc escalation: trigger, channel, response SLA
      - Status report: frequency, audience, format
      Deliverable: Communication Plan (Type | Frequency | Attendees | Format |
      Owner).

      STEP 5: RISK ACKNOWLEDGMENT
      Document risks both parties acknowledge:
      - Risk description
      - Likelihood: HIGH / MEDIUM / LOW
      - Impact: HIGH / MEDIUM / LOW
      - Mitigation approach
      - Owner
      - Confidence: HIGH (discussed with customer), MEDIUM (internally assessed),
        LOW (assumed)
      Deliverable: Risk Acknowledgment table (Risk | Likelihood | Impact |
      Mitigation | Owner | Confidence).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - MAP to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Every action has owner, due date, and exit criteria
      - Phases have prerequisites and exit criteria
      - Milestones include impact-if-missed assessment
      - Resource allocation addresses backup for key personnel
      - Communication plan covers escalation, not just updates
      - Risk acknowledgment includes confidence levels
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, phase breakdown, and milestone table.
      - If run_mode is DISCOVERY: produce only resource and timeline feasibility check with gaps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) total phases and milestones with timeline confidence,
      (2) the highest-risk phase or resource gap,
      and (3) the single most urgent action to finalize the MAP.

# ============================================================================
# POV EXECUTION PROMPTS
# ============================================================================
pov_execution:

  daily_status_update:
    name: "POV Daily Status Update"
    description: "Generate daily POV status update with success criteria progress, blocker tracking, and next-day plan"
    prompt: |
      Context: Daily update for {account_name} POV.
      Day: {day_number} of {total_days}
      Activities today: {activities}
      Issues encountered: {issues}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = status + criteria progress + blockers; DISCOVERY = activity log only. Default: FULL)

      You are producing the daily POV status update. Daily tracking prevents
      small issues from compounding into POV failures. Every status must
      reference success criteria progress with evidence. Follow these steps
      in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: OVERALL STATUS DETERMINATION
      Determine overall POV status:
      - ON TRACK: all criteria progressing as planned, no active blockers
      - AT RISK: 1+ criteria behind schedule or 1+ unresolved blockers
      - BLOCKED: critical blocker preventing progress on 2+ criteria

      Basis for status determination:
      - Criteria on track count vs total
      - Active blocker count and severity
      - Customer engagement level today
      - Confidence: HIGH (objective data), MEDIUM (mixed signals),
        LOW (limited data today)
      If {activities} is empty: state that no activities were reported,
      note this itself is a risk signal, proceed with status based on
      available information.
      Deliverable: Status Declaration (Status | Basis | Confidence).

      STEP 2: SUCCESS CRITERIA PROGRESS
      Update progress for each success criterion:
      - Criterion ID and statement
      - Status: ON TRACK / AT RISK / BLOCKED / COMPLETED
      - Progress notes (what was done today toward this criterion)
      - Evidence captured (measurements, screenshots, logs)
      - Confidence: HIGH (measurable progress), MEDIUM (activity but no
        measurement yet), LOW (no activity today)

      For trend assessment: if this is Day 1 or 2, state "INSUFFICIENT DATA
      FOR TREND, establishing baseline." Only assess trajectory trends when
      3+ daily data points exist.
      Deliverable: Criteria Progress table (Criterion ID | Statement | Status |
      Today's Progress | Evidence | Confidence).

      STEP 3: BLOCKER TRACKING
      List active blockers:
      - Blocker description
      - Impact on criteria (which criteria affected)
      - Owner
      - Resolution ETA
      - Escalation needed: YES / NO
      If no blockers: state "No active blockers."
      Deliverable: Active Blockers table (Blocker | Criteria Impact | Owner |
      ETA | Escalation).

      STEP 4: CUSTOMER ENGAGEMENT ASSESSMENT
      Assess today's customer engagement:
      - Interactions today (meetings, emails, Slack)
      - Engagement quality: ACTIVE / PASSIVE / DISENGAGED
      - Sentiment signals observed
      - Confidence: HIGH (direct interaction), MEDIUM (indirect signals),
        LOW (no interaction today)

      For engagement trend: require 3+ daily observations before stating
      trend direction. Single-day observation = "Single observation, trend
      not established."
      Deliverable: Engagement Assessment (Interactions | Quality | Sentiment |
      Confidence | Trend Status).

      STEP 5: NEXT DAY PLAN
      Plan for tomorrow:
      - Planned activities
      - Criteria to advance
      - Meetings scheduled
      - Help needed from team
      - Prerequisites: what must be resolved today for tomorrow's plan to execute
      Deliverable: Next Day Plan (Activity | Criterion | Prerequisites | Owner).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Status updates to record
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Overall status has explicit basis, not just a label
      - Every criterion has today's progress and evidence
      - Trend claims only made with 3+ data points
      - Blockers have owners and ETAs
      - Customer engagement includes confidence level
      - Next day plan includes prerequisites
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, status declaration, criteria progress, and blockers.
      - If run_mode is DISCOVERY: produce only the activity log and data gaps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) overall status with day count and confidence,
      (2) the weakest criterion or most critical blocker,
      and (3) the single most urgent action for tomorrow.

  weekly_retrospective:
    name: "POV Weekly Retrospective"
    description: "Conduct weekly POV retrospective analyzing criteria trajectory, engagement health, and adjustments needed for the coming week"
    prompt: |
      Context: Week {week_number} retrospective for {account_name} POV.
      Week summary: {week_summary}
      Success criteria status: {criteria_status}
      Customer feedback: {feedback}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + criteria tracker + top adjustment; DISCOVERY = data gaps and observation plan only. Default: FULL)

      You are conducting the weekly POV retrospective. Weekly reviews catch
      trajectory problems that daily updates miss. Trends require at least
      two weekly data points to establish direction. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: WEEK ACCOMPLISHMENTS AND CHALLENGES
      Summarize the week:
      - Key accomplishments (mapped to success criteria where possible)
      - Challenges encountered and how they were addressed
      - Unresolved issues carrying into next week
      - Confidence: HIGH (documented evidence), MEDIUM (verbal reports),
        LOW (incomplete data)
      Deliverable: Week Summary (Accomplishments | Challenges | Unresolved | Confidence).

      STEP 2: SUCCESS CRITERIA TRACKER UPDATE
      Update each criterion with weekly progress:
      - Criterion ID and statement
      - Status: ON TRACK / AT RISK / BLOCKED / COMPLETED
      - Progress percentage (estimate with basis)
      - Week-over-week trajectory: IMPROVING / STABLE / DECLINING
        For Week 1: state "INSUFFICIENT DATA FOR TREND, first measurement."
        Trajectory requires 2+ weekly observations.
      - Notes on what drove progress or lack thereof
      - Confidence: HIGH (measured), MEDIUM (estimated), LOW (assumed)
      Deliverable: Criteria Tracker table (Criterion ID | Statement | Status |
      Progress % | Trajectory | Notes | Confidence).

      STEP 3: WHAT WORKED / WHAT NEEDS CHANGE
      Retrospective analysis:
      - Continue doing (practices that worked this week)
      - Change (practices that did not work, with specific adjustment)
      - Start doing (new practices needed based on this week)
      - Stop doing (activities that wasted time or created friction)
      Deliverable: Retrospective Actions (Category | Practice | Rationale | Owner).

      STEP 4: RISK REGISTER UPDATE
      Update the risk register:
      - New risks identified this week
      - Existing risks: status change (escalated, mitigated, closed)
      - For each active risk: likelihood, impact, mitigation, owner
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Risk Register Update (Risk | Status Change | Likelihood | Impact |
      Mitigation | Owner | Confidence).

      STEP 5: CUSTOMER SENTIMENT ASSESSMENT
      Assess customer engagement and sentiment:
      - Engagement level this week: ACTIVE / MODERATE / LOW
      - Sentiment signals: POSITIVE / NEUTRAL / CONCERNED / NEGATIVE
      - Specific observations supporting sentiment assessment
      - Week-over-week sentiment trajectory (requires 2+ weekly observations)
      - Confidence: HIGH (direct feedback), MEDIUM (behavioral signals),
        LOW (no direct interaction this week)
      Deliverable: Sentiment Assessment (Engagement | Sentiment | Observations |
      Trajectory | Confidence).

      STEP 6: NEXT WEEK ADJUSTMENTS
      Plan adjustments for next week:
      - Priority actions (mapped to at-risk criteria)
      - Resource adjustments needed
      - Customer engagement changes
      - Escalations to execute
      - Prerequisites: what must be resolved this week for next week's plan
      Deliverable: Next Week Plan (Action | Criterion | Owner | Prerequisites).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Criteria status updates
      - Risk register updates
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Every criterion has progress percentage with basis
      - Trajectory claims backed by 2+ weekly data points
      - Sentiment assessment includes confidence and observations
      - Retrospective actions are specific and actionable
      - Risk register includes new and changed risks
      - Next week plan includes prerequisites
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, criteria tracker, and top adjustment.
      - If run_mode is DISCOVERY: produce only data gaps and observation plan for next week.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) overall week status with criteria on-track count,
      (2) the weakest criterion or most concerning trend,
      and (3) the single most urgent adjustment for next week.

  midpoint_checkpoint:
    name: "POV Midpoint Checkpoint"
    description: "Conduct POV midpoint review assessing criteria trajectory, scope integrity, customer engagement, and go-forward recommendation"
    prompt: |
      Context: Midpoint checkpoint for {account_name} POV.
      Days completed: {days_completed} of {total_days}
      Success criteria status: {criteria_status}
      Risks: {current_risks}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + criteria assessment + go-forward; DISCOVERY = gap analysis only. Default: FULL)

      You are conducting the POV midpoint review. The midpoint is the last
      opportunity to course-correct before the wrap-up phase. If criteria
      are not on trajectory to be met, the second half must change approach
      or the POV outcome is predictable. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: SUCCESS CRITERIA ASSESSMENT
      Assess each criterion at midpoint:
      - Criterion ID and statement
      - Status: ON TRACK / AT RISK / BLOCKED / COMPLETED
      - Progress vs expected at midpoint (ahead / on pace / behind)
      - Evidence collected so far
      - Projected outcome: WILL MEET / MAY MEET / UNLIKELY TO MEET
      - Confidence: HIGH (strong evidence trajectory), MEDIUM (some evidence),
        LOW (insufficient data to project)

      Trajectory assessment requires data from at least 2 measurement points.
      If only 1 measurement exists, state "Single measurement, trajectory
      projection is LOW confidence."
      Deliverable: Midpoint Criteria Assessment table (Criterion ID | Statement |
      Status | Progress vs Expected | Evidence | Projected Outcome | Confidence).

      STEP 2: SCOPE INTEGRITY CHECK
      Verify scope has not drifted:
      - Original scope statement
      - Current scope (as being executed)
      - Scope changes detected: YES / NO
      - If YES: each change with impact on timeline and criteria
      - Scope creep indicators (additional requests, expanded use cases)
      - Confidence: HIGH (documented scope), MEDIUM (verbal scope),
        LOW (scope not clearly documented)
      Deliverable: Scope Check (Original Scope | Current Scope | Changes Detected |
      Impact | Confidence).

      STEP 3: CUSTOMER ENGAGEMENT ASSESSMENT
      Assess customer engagement at midpoint:
      - Evaluator engagement: ACTIVE / PASSIVE / DISENGAGED
      - Sponsor engagement: ACTIVE / PASSIVE / ABSENT
      - Decision maker awareness: BRIEFED / UNBRIEFED / UNKNOWN
      - Engagement trajectory (requires 2+ weekly observations):
        IMPROVING / STABLE / DECLINING
      - Warning signals (missed meetings, delayed responses, reduced participation)
      - Confidence: HIGH (direct interaction data), MEDIUM (indirect signals),
        LOW (limited contact)
      Deliverable: Engagement Assessment (Role | Engagement Level | Trajectory |
      Warning Signals | Confidence).

      STEP 4: RESOURCE UTILIZATION
      Review resource consumption at midpoint:
      - SA hours consumed vs budgeted
      - SE hours consumed vs budgeted
      - Customer resource utilization vs committed
      - Burn rate assessment: SUSTAINABLE / ACCELERATING / INSUFFICIENT
      Deliverable: Resource Utilization (Resource | Budgeted | Consumed | Remaining |
      Burn Rate).

      STEP 5: RISK ASSESSMENT UPDATE
      Update risk posture at midpoint:
      - Risks materialized (which risks became issues)
      - Risks mitigated (which risks were resolved)
      - New risks identified
      - Overall risk trajectory: IMPROVING / STABLE / WORSENING
        Requires comparison to initial risk register. If initial register
        unavailable, state "No baseline for risk trajectory comparison."
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Risk Assessment (Risk | Status | Trajectory | Mitigation |
      Owner | Confidence).

      STEP 6: GO-FORWARD RECOMMENDATION
      Recommend path forward:
      - CONTINUE AS PLANNED: criteria on track, no significant issues
      - ADJUST AND CONTINUE: criteria at risk but recoverable with changes
      - EXTEND: criteria not achievable in remaining time, extension justified
      - ESCALATE: critical issues requiring management intervention
      - STOP: criteria not achievable, resources better deployed elsewhere

      For each option that applies:
      - Specific changes needed
      - Impact on timeline
      - Impact on outcome probability
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Go-Forward Recommendation (Decision | Rationale | Changes |
      Timeline Impact | Outcome Probability | Confidence).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Midpoint status to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Every criterion has projected outcome with confidence
      - Trajectory claims backed by 2+ data points
      - Scope check references original documented scope
      - Customer engagement assessed by role, not just overall
      - Resource utilization includes burn rate
      - Go-forward recommendation includes outcome probability
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, criteria assessment, and go-forward recommendation.
      - If run_mode is DISCOVERY: produce only gap analysis and data needed for full midpoint review.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) overall midpoint status with criteria on-track count,
      (2) the weakest criterion or most critical risk,
      and (3) the go-forward recommendation with confidence.

  scope_change_assessment:
    name: "POV Scope Change Assessment"
    description: "Assess and respond to a scope change request with impact analysis, options, and recommendation"
    prompt: |
      Context: Scope change requested for {account_name} POV.
      Original scope: {original_scope}
      Requested change: {change_request}
      Remaining time: {remaining_days}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + impact + recommendation; DISCOVERY = change classification only. Default: FULL)

      You are assessing a scope change request during an active POV. Scope
      changes are the leading cause of POV timeline overruns and disputed
      outcomes. Every change must be evaluated against its impact on existing
      success criteria. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: CHANGE REQUEST CLASSIFICATION
      Classify the change request:
      - Type: SCOPE EXPANSION / SCOPE MODIFICATION / SCOPE REDUCTION
        Assign primary type. Add secondary flag if the change spans types
        (e.g., expanding one area while reducing another).
      - Origin: CUSTOMER REQUEST / TECHNICAL DISCOVERY / COMPETITIVE RESPONSE
      - Urgency: IMMEDIATE / NEXT PHASE / POST-POV
      - Legitimacy: VALID (tied to business outcome) / QUESTIONABLE (feature war,
        scope creep) / INVALID (outside POV purpose)
      - Confidence: HIGH (documented request), MEDIUM (verbal), LOW (inferred)
      Deliverable: Change Classification (Type | Secondary Flag | Origin | Urgency |
      Legitimacy | Confidence).

      STEP 2: IMPACT ANALYSIS
      Assess impact across dimensions:
      - Timeline impact: days added, removed, or no change
      - Resource impact: additional SA/SE hours needed
      - Success criteria impact: which criteria are affected and how
      - Risk impact: new risks introduced by accepting change
      - Customer relationship impact: effect of accepting vs declining

      For each dimension:
      - Impact level: HIGH / MEDIUM / LOW / NONE
      - Specific quantification where possible
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Impact Analysis table (Dimension | Impact Level | Quantification |
      Confidence).

      STEP 3: OPTIONS ANALYSIS
      Evaluate four standard options:
      1. Accept with timeline extension
         - New end date, additional resources needed, prerequisites
      2. Accept within current timeline (trade-off)
         - What is deferred or removed, impact on other criteria
      3. Defer to post-POV roadmap
         - How to position with customer, impact on decision
      4. Decline with rationale
         - How to communicate, relationship impact

      For each option:
      - Feasibility: HIGH / MEDIUM / LOW
      - Impact on POV outcome probability
      - Customer reaction assessment
      - Prerequisites: what must be true for this option to work
      Deliverable: Options Analysis table (Option | Feasibility | Outcome Impact |
      Customer Reaction | Prerequisites).

      STEP 4: RECOMMENDATION
      Recommend the best option with:
      - Selected option and rationale
      - Implementation plan if accepted
      - Customer communication approach
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Recommendation (Option | Rationale | Implementation | Communication |
      Confidence).

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Scope change decision to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Change classified with primary type and secondary flags
      - Impact quantified across all dimensions
      - All four options evaluated, not just the recommended one
      - Options include prerequisites
      - Recommendation includes customer communication approach
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, impact analysis, and recommendation.
      - If run_mode is DISCOVERY: produce only the change classification and preliminary impact.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the change request classification and legitimacy,
      (2) the highest-impact dimension,
      and (3) the recommended option with confidence.

  risk_mitigation:
    name: "POV Risk Mitigation Planning"
    description: "Address an identified POV risk with root cause analysis, mitigation options, action plan, and escalation recommendation"
    prompt: |
      Context: Risk identified in {account_name} POV.
      Risk: {risk_description}
      Impact: {impact}
      Current status: {status}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + recommended action + escalation; DISCOVERY = root cause analysis only. Default: FULL)

      You are planning mitigation for an identified POV risk. Unmitigated
      risks compound during POV execution and reduce conversion probability.
      Every mitigation option must include effort, effectiveness, and trade-off
      assessment. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: ROOT CAUSE ANALYSIS
      Analyze the risk:
      - Root cause identification (what is actually causing this risk)
      - Contributing factors
      - Category: TECHNICAL / ORGANIZATIONAL / TIMELINE / CUSTOMER / COMPETITIVE
        Assign primary category + secondary flag if applicable.
      - Impact assessment:
        - Likelihood: HIGH / MEDIUM / LOW
        - Impact on timeline: days at risk
        - Impact on criteria: which criteria affected
        - Impact on conversion: effect on win probability
      - Confidence: HIGH (verified root cause), MEDIUM (probable cause),
        LOW (suspected, needs investigation)
      Deliverable: Root Cause Analysis (Root Cause | Contributing Factors |
      Category | Secondary Flag | Likelihood | Timeline Impact | Criteria Impact |
      Conversion Impact | Confidence).

      STEP 2: MITIGATION OPTIONS
      Evaluate mitigation options:
      For each option:
      - Description
      - Effort: HIGH (multiple days, multiple people) / MEDIUM (1-2 days, 1 person) /
        LOW (hours, minimal disruption)
      - Effectiveness: HIGH (eliminates risk) / MEDIUM (reduces risk) /
        LOW (delays risk)
      - Trade-off: what is given up by choosing this option
      - Prerequisites: what must be true before this mitigation can begin
      - Confidence: HIGH (proven approach), MEDIUM (reasonable expectation),
        LOW (experimental)
      Deliverable: Mitigation Options table (Option | Effort | Effectiveness |
      Trade-off | Prerequisites | Confidence).

      STEP 3: RECOMMENDED APPROACH
      Select and detail the recommended mitigation:
      - Selected option and rationale
      - Action plan: specific steps with owners and due dates
      - Success indicators: how we know the mitigation worked
      - Fallback plan: what to do if mitigation fails
      Deliverable: Action Plan table (Action | Owner | Due Date | Success Indicator |
      Fallback).

      STEP 4: ESCALATION ASSESSMENT
      Determine if escalation is needed:
      - Escalation recommended: YES / NO
      - If YES:
        - Escalation target (SM, AE, SA Manager, customer executive)
        - Escalation message (what to communicate)
        - Expected outcome from escalation
        - Prerequisites: what information must be prepared before escalating
      - If NO: rationale for handling at current level
      - Customer communication needed: YES / NO with approach
      Deliverable: Escalation Assessment (Recommended | Target | Message |
      Expected Outcome | Prerequisites | Customer Communication).

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Risk mitigation actions to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Root cause identified with confidence level
      - Multiple mitigation options evaluated (not just the recommended one)
      - Options include effort, effectiveness, and trade-offs
      - Action plan has specific owners and due dates
      - Escalation assessment includes prerequisites
      - Fallback plan provided
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, recommended action, and escalation assessment.
      - If run_mode is DISCOVERY: produce only the root cause analysis and contributing factors.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the risk with root cause confidence,
      (2) the recommended mitigation with expected effectiveness,
      and (3) whether escalation is needed and to whom.

# ============================================================================
# POV CONCLUSION PROMPTS
# ============================================================================
pov_conclusion:

  results_documentation:
    name: "POV Results Documentation"
    description: "Document POV results with success criteria outcomes, value demonstrated, technical findings, and overall recommendation"
    prompt: |
      Context: {account_name} POV complete.
      Duration: {start_date} to {end_date}
      Success criteria: {success_criteria}
      Results: {results_summary}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + criteria results + recommendation; DISCOVERY = data completeness check only. Default: FULL)

      You are documenting the final POV results. This document is the
      authoritative record of what was proven and becomes the basis for
      the commercial decision. Every result must reference evidence.
      Unsubstantiated claims weaken the document. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: SUCCESS CRITERIA RESULTS
      Document results for each criterion:
      - Criterion ID and statement
      - Target value (as defined at kickoff)
      - Achieved value (measured result)
      - Status: MET / PARTIALLY MET / NOT MET
      - Evidence: specific measurements, screenshots, logs, customer confirmation
      - Confidence: HIGH (independently verifiable), MEDIUM (vendor-measured),
        LOW (estimated or self-reported)

      Overall outcome: MET (all MUST_HAVE criteria met), PARTIALLY MET (some
      MUST_HAVE criteria met), NOT MET (majority of MUST_HAVE criteria not met).
      Deliverable: Criteria Results table (Criterion ID | Statement | Target |
      Achieved | Status | Evidence | Confidence) + Overall Outcome.

      STEP 2: VALUE DEMONSTRATED
      Quantify value proven during POV:
      - Business value metrics (time saved, cost reduced, risk mitigated)
      - Operational value (efficiency gains, automation potential)
      - Strategic value (competitive advantage, platform consolidation)
      - For each value claim:
        - Quantification (specific number where possible)
        - Extrapolation to production scale (with assumptions stated)
        - Confidence: HIGH (measured in POV), MEDIUM (extrapolated with
          reasonable assumptions), LOW (estimated, assumptions uncertain)
      If value cannot be quantified: state the limitation and provide
      qualitative assessment with explicit confidence level.
      Deliverable: Value Summary table (Value Category | POV Result |
      Production Projection | Assumptions | Confidence).

      STEP 3: TECHNICAL FINDINGS
      Document technical outcomes:
      - Architecture validated (what was proven technically)
      - Integration points tested
      - Performance benchmarks achieved
      - Limitations discovered
      - Technical debt or concerns identified
      - Confidence: HIGH (tested and measured), MEDIUM (observed but not
        formally benchmarked), LOW (inferred)
      Deliverable: Technical Findings table (Finding | Category | Evidence |
      Implications | Confidence).

      STEP 4: CUSTOMER FEEDBACK SUMMARY
      Compile customer feedback:
      - Evaluator feedback (technical user perspective)
      - Sponsor feedback (business perspective)
      - Decision maker feedback (strategic perspective, if available)
      - Unresolved concerns
      - Confidence: HIGH (documented feedback), MEDIUM (verbal feedback),
        LOW (inferred from behavior)
      If no formal feedback captured: state "No formal feedback session
      conducted," note implication for decision confidence, proceed.
      Deliverable: Feedback Summary (Stakeholder | Role | Feedback |
      Concerns | Confidence).

      STEP 5: LESSONS LEARNED
      Capture POV lessons:
      - What went well (repeat in future POVs)
      - What should change (improve for future POVs)
      - Process improvements
      - Product feedback to share with engineering
      Deliverable: Lessons Learned (Category | Observation | Recommendation).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - POV results to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Every criterion result has evidence and confidence
      - Value claims are quantified where possible with stated assumptions
      - Technical findings distinguish measured from observed
      - Customer feedback attributed to specific stakeholder roles
      - No trend claims from single observations
      - Overall outcome logically follows from individual criteria results
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, criteria results table, and overall recommendation.
      - If run_mode is DISCOVERY: produce only the data completeness check and gaps needed for full documentation.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the overall outcome with criteria met count,
      (2) the weakest result or biggest concern,
      and (3) the recommended next step based on outcome.

  customer_feedback_session:
    name: "POV Customer Feedback Session"
    description: "Prepare for and capture structured customer feedback including satisfaction, concerns, decision readiness, and transition planning"
    prompt: |
      Context: Feedback session for {account_name} POV.
      POV results: {results_summary}
      Attendees: {attendees}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + question list + decision readiness; DISCOVERY = attendee prep and readiness check only. Default: FULL)

      You are preparing and conducting the customer feedback session. This
      session determines customer satisfaction and decision readiness.
      Questions must be specific enough to surface real concerns, not just
      confirm positive bias. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: SESSION AGENDA
      Design the feedback session:
      - Duration and format
      - Attendee roles and what to capture from each
      - Agenda items with time allocation
      - Facilitation approach (open discussion vs structured questions)
      Deliverable: Session Agenda (Item | Duration | Facilitator | Target Attendee |
      Objective).

      STEP 2: STRUCTURED QUESTIONS
      Prepare questions by category:

      Success criteria satisfaction:
      - "Did criterion [X] meet your expectations? If not, what gap remains?"
      - "Which criterion result was most valuable to your team?"
      - "Which criterion result was least convincing?"

      POV experience:
      - "How would you rate the communication and responsiveness?"
      - "Were there points where you felt the evaluation stalled?"
      - "What would you change about the POV process?"

      Remaining concerns:
      - "What concerns remain about moving forward?"
      - "Are there stakeholders who need additional information?"
      - "What questions do you anticipate from [decision maker]?"

      Decision readiness:
      - "What is your timeline for making a decision?"
      - "What additional information do you need to recommend moving forward?"
      - "Who else needs to be involved in the decision?"

      For each question category: purpose and what the answer reveals.
      Deliverable: Question Guide (Category | Question | Purpose | What Answer Reveals).

      STEP 3: FEEDBACK CAPTURE TEMPLATE
      Structure for documenting responses:
      - Stakeholder name and role
      - Question asked
      - Response (verbatim where possible)
      - Sentiment: POSITIVE / NEUTRAL / CONCERNED / NEGATIVE
      - Action item triggered (if any)
      - Confidence: HIGH (recorded), MEDIUM (notes), LOW (recalled)
      Deliverable: Feedback Capture Template (Stakeholder | Role | Question |
      Response | Sentiment | Action | Confidence).

      STEP 4: DECISION READINESS ASSESSMENT
      Based on feedback (or anticipated feedback), assess:
      - Customer readiness: READY / NEEDS MORE / NOT READY
      - Blockers to decision (specific items)
      - Stakeholder alignment: ALIGNED / PARTIALLY ALIGNED / MISALIGNED
      - Competitive position: AHEAD / EVEN / BEHIND
      - Confidence: HIGH (direct signals), MEDIUM (inferred), LOW (assumed)

      For readiness trend: require feedback from 2+ sessions or touchpoints.
      Single session = "Initial reading, no trend data."
      Deliverable: Decision Readiness (Readiness | Blockers | Alignment |
      Competitive Position | Confidence).

      STEP 5: TRANSITION PLANNING
      Plan the transition from POV to commercial discussion:
      - Next meeting or follow-up needed
      - Materials to prepare (proposal, pricing, implementation plan)
      - Stakeholders to engage next
      - Timeline to commercial proposal
      - Prerequisites: what must happen before commercial discussion
      Deliverable: Transition Plan (Action | Owner | Timeline | Prerequisites).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Feedback results to record
      - Decision readiness status
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Questions designed to surface concerns, not just confirm
      - Feedback template includes sentiment and confidence
      - Decision readiness includes specific blockers
      - Transition plan includes prerequisites
      - No trend claims from single feedback session
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, question list, and decision readiness.
      - If run_mode is DISCOVERY: produce only the attendee prep and readiness check.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) session readiness with attendee confidence,
      (2) the most critical question to get answered,
      and (3) the anticipated decision readiness level.

  go_no_go_recommendation:
    name: "POV Go/No-Go Recommendation"
    description: "Provide clear outcome determination with evidence-based recommendation, next steps, and handoff or loss analysis"
    prompt: |
      Context: POV complete for {account_name}.
      Results: {results_summary}
      Customer sentiment: {sentiment}
      Commercial context: {commercial_context}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + outcome + next steps; DISCOVERY = evidence gap analysis only. Default: FULL)

      You are providing the definitive POV outcome recommendation. This
      recommendation drives deal progression, resource reallocation, and
      pipeline accuracy. The outcome must be evidence-based with clear
      confidence levels. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: OUTCOME DETERMINATION
      Classify the POV outcome:
      - Clear Win: all criteria met, customer confirms value, ready to proceed
      - Conditional Win: most criteria met, minor gaps addressable in negotiation
      - Technical Win, No Decision: POV successful, customer stalls on decision
      - Loss, Competitor: customer selects competitor
      - Loss, No Decision: customer abandons evaluation
      - Loss, Technical: criteria not met, technical gap confirmed

      Assign primary outcome. Add secondary flag if outcome straddles
      categories (e.g., Conditional Win trending toward No Decision).
      - Evidence supporting this classification
      - Confidence: HIGH (customer confirmed), MEDIUM (strong signals),
        LOW (inferred from behavior)
      Deliverable: Outcome Determination (Primary Outcome | Secondary Flag |
      Evidence | Confidence).

      STEP 2: EVIDENCE COMPILATION
      Compile evidence supporting the outcome:
      - Success criteria results (summary from results documentation)
      - Customer feedback signals (positive and negative)
      - Commercial signals (budget movement, timeline confirmation)
      - Competitive signals (competitor status if known)
      - Engagement trajectory (improving / declining over POV duration,
        requires 2+ weekly data points for trend claim)

      For each evidence category:
      - Signal strength: STRONG / MODERATE / WEAK / ABSENT
      - Confidence: HIGH / MEDIUM / LOW with basis
      If any category has no evidence: state "No evidence available for
      [category]," note impact on outcome confidence.
      Deliverable: Evidence Summary table (Category | Signal | Strength |
      Confidence).

      STEP 3: RECOMMENDED NEXT STEPS
      Based on outcome:

      If Win or Conditional Win:
      - AE handoff timing and format
      - Commercial leverage points
      - Implementation planning considerations
      - Risks to monitor during negotiation
      - Prerequisites: what must be prepared before AE handoff

      If Technical Win, No Decision:
      - Re-engagement strategy
      - Stakeholder mapping for decision acceleration
      - Timeline for follow-up
      - Prerequisites: what must change for decision to happen

      If Loss:
      - Loss analysis triggers
      - Account nurture recommendation
      - Competitive intelligence to capture
      - Product feedback to submit
      - Prerequisites: what data must be collected for loss analysis

      Deliverable: Next Steps (Action | Owner | Timeline | Prerequisites).

      STEP 4: HANDOFF OR CLOSURE
      Prepare handoff or closure documentation:

      If Win: AE Handoff Brief
      - Value proven (quantified)
      - Customer sentiment by stakeholder
      - Commercial considerations
      - Risks to close

      If Loss: Loss Documentation
      - Primary loss reason
      - Contributing factors
      - Learnings for future POVs
      - Account status recommendation

      Deliverable: Handoff Brief or Loss Documentation (as applicable).

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - POV outcome to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Outcome has primary classification and secondary flag where applicable
      - Evidence compiled across all categories with confidence
      - Next steps include prerequisites
      - Handoff or closure documentation complete
      - Trend claims backed by 2+ data points
      - Confidence stated for outcome determination
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, outcome determination, and next steps.
      - If run_mode is DISCOVERY: produce only the evidence gap analysis and data needed for full recommendation.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the outcome determination with confidence,
      (2) the weakest evidence area or biggest remaining risk,
      and (3) the single most urgent next action.

  pov_summary_presentation:
    name: "POV Summary Presentation"
    description: "Create a POV summary presentation for stakeholders with results, value demonstrated, and call to action"
    prompt: |
      Context: Creating summary presentation for {account_name} POV.
      Audience: {audience}
      Results: {results}
      Objective: {presentation_objective}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + outline + key messages; DISCOVERY = audience analysis only. Default: FULL)

      You are creating the stakeholder presentation that summarizes the POV.
      This presentation often determines whether the deal advances. Every
      slide must serve the presentation objective. Data without narrative
      loses the audience. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: AUDIENCE ANALYSIS
      Analyze the presentation audience:
      - Attendee roles and decision authority
      - What each attendee cares about (technical vs business vs strategic)
      - Known concerns or objections per attendee
      - Presentation objective alignment with audience priorities
      - Confidence: HIGH (known stakeholders), MEDIUM (partially known),
        LOW (audience not confirmed)
      If {audience} is empty: state that audience is not defined, note this
      limits message targeting, proceed with generic stakeholder assumptions.
      Deliverable: Audience Analysis table (Attendee | Role | Priority |
      Known Concerns | Confidence).

      STEP 2: PRESENTATION OUTLINE
      Structure the presentation:
      1. POV objectives recap (1 slide)
         - Key message: what we set out to prove
      2. Success criteria and results (2-3 slides)
         - Key message: what was proven with evidence
      3. Value demonstrated (1-2 slides)
         - Key message: business impact quantified
      4. Technical highlights (1 slide)
         - Key message: architecture fit confirmed
      5. Customer feedback (1 slide)
         - Key message: team validation
      6. Recommendation (1 slide)
         - Key message: clear path forward
      7. Proposed next steps (1 slide)
         - Key message: specific actions with timeline

      For each slide:
      - Key message (one sentence)
      - Supporting data points
      - Visual recommendation (chart, table, quote)
      Deliverable: Presentation Outline (Slide | Key Message | Data Points |
      Visual Type).

      STEP 3: KEY METRICS AND VISUALIZATIONS
      Identify metrics to visualize:
      - Success criteria results (bar chart or scorecard)
      - Value metrics (before/after comparison)
      - Timeline adherence (Gantt or milestone tracker)
      - Customer satisfaction indicators
      - Confidence: HIGH (measured data), MEDIUM (extrapolated),
        LOW (estimated)
      Deliverable: Metrics for Visualization (Metric | Value | Visual Type |
      Confidence).

      STEP 4: OBJECTION HANDLING
      Prepare for anticipated objections:
      - Objection (what might be raised)
      - Response (prepared answer with evidence)
      - Supporting evidence
      - Confidence: HIGH (prepared response tested), MEDIUM (reasonable
        response), LOW (speculative)
      Deliverable: Objection Handling table (Objection | Response | Evidence |
      Confidence).

      STEP 5: CALL TO ACTION
      Define the presentation's call to action:
      - Primary ask (what you want the audience to do)
      - Supporting rationale
      - Timeline for response
      - Next meeting or follow-up
      - Prerequisites: what must the audience have before they can act
      Deliverable: Call to Action (Ask | Rationale | Timeline | Prerequisites).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Presentation status to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Audience analysis drives message targeting
      - Every slide has a key message, not just data
      - Metrics include confidence levels
      - Objection handling covers likely pushback
      - Call to action is specific and actionable with prerequisites
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, presentation outline, and key messages.
      - If run_mode is DISCOVERY: produce only the audience analysis and gaps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) presentation readiness with audience confidence,
      (2) the most critical message to land,
      and (3) the call to action with expected outcome.

# ============================================================================
# POV CONVERSION PROMPTS
# ============================================================================
pov_conversion:

  conversion_readiness:
    name: "POV Conversion Readiness Assessment"
    description: "Assess readiness to convert POV to deal by evaluating success criteria satisfaction, stakeholder alignment, budget status, and competitive position"
    prompt: |
      Context: Assessing conversion readiness for {account_name}.
      POV outcome: {outcome}
      Decision maker engagement: {dm_engagement}
      Commercial signals: {signals}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + readiness + top blocker; DISCOVERY = readiness factor inventory only. Default: FULL)

      You are assessing whether the POV outcome translates to deal conversion.
      A technical win does not guarantee commercial conversion. Readiness
      assessment must cover technical, commercial, and stakeholder dimensions
      independently. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: READINESS FACTOR EVALUATION
      Evaluate each readiness factor:
      - Success criteria met: YES / PARTIAL / NO
      - Decision maker engaged: ACTIVE / PASSIVE / ABSENT
      - Budget confirmed: CONFIRMED / LIKELY / UNCERTAIN / NO
      - Timeline defined: YES (with date) / VAGUE / NO
      - Competitor neutralized: YES / IN PROGRESS / NO / UNKNOWN

      For each factor:
      - Status
      - Evidence supporting status
      - Impact on conversion if not resolved
      - Confidence: HIGH (confirmed), MEDIUM (signals), LOW (assumed)
      If {dm_engagement} is empty: state that decision maker engagement
      is unknown, flag as critical gap for conversion assessment.
      Deliverable: Readiness Factor table (Factor | Status | Evidence |
      Conversion Impact | Confidence).

      STEP 2: REMAINING BLOCKERS
      Identify blockers to conversion:
      - Blocker description
      - Category: COMMERCIAL / TECHNICAL / ORGANIZATIONAL / COMPETITIVE
        Assign primary + secondary flag if applicable.
      - Resolution owner
      - Resolution approach
      - Timeline to resolve
      - Prerequisites: what must happen before resolution can begin
      - Impact if unresolved: DEAL LOSS / DEAL DELAY / DEAL DISCOUNT
      Deliverable: Conversion Blockers table (Blocker | Category | Secondary Flag |
      Owner | Approach | Timeline | Prerequisites | Impact).

      STEP 3: STAKEHOLDER ENGAGEMENT PLAN
      Map stakeholders for conversion:
      - Stakeholder name and role
      - Current position: CHAMPION / SUPPORTER / NEUTRAL / SKEPTIC / BLOCKER
      - Engagement needed: what they need to see or hear
      - Owner (who engages them)
      - Timeline for engagement
      - Confidence: HIGH (known position), MEDIUM (inferred), LOW (unknown)
      Deliverable: Stakeholder Map (Name | Role | Position | Engagement Needed |
      Owner | Timeline | Confidence).

      STEP 4: CONVERSION READINESS DETERMINATION
      Overall readiness assessment:
      - Readiness level: HIGH (3+ factors confirmed, no critical blockers) /
        MEDIUM (2 factors confirmed, addressable blockers) /
        LOW (1 or fewer factors confirmed, critical blockers remain)
      - Conversion probability estimate with basis
      - Path to close (sequence of actions)
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Readiness Determination (Level | Probability | Path to Close |
      Confidence).

      STEP 5: AE HANDOFF BRIEF
      Prepare the commercial handoff:
      - POV outcome summary (2-3 sentences)
      - Value proven with quantification
      - Customer sentiment by stakeholder
      - Commercial leverage points
      - Risks to address in negotiation
      - Recommended close approach
      Deliverable: AE Handoff Brief (Outcome | Value | Sentiment | Leverage |
      Risks | Approach).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Conversion readiness to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Every readiness factor has evidence and confidence
      - Blockers include prerequisites and impact if unresolved
      - Stakeholder positions assessed with confidence
      - Conversion probability has explicit basis
      - AE handoff brief includes commercial leverage
      - No trend claims from single observations
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, readiness determination, and top blocker.
      - If run_mode is DISCOVERY: produce only the readiness factor inventory with current known status.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) conversion readiness level with confidence,
      (2) the most critical blocker to conversion,
      and (3) the single most urgent action to advance the deal.

  ae_handoff_brief:
    name: "POV to AE Handoff Brief"
    description: "Prepare comprehensive POV handoff to AE for commercial negotiation with value proof, stakeholder sentiment, and competitive positioning"
    prompt: |
      Context: POV complete, handoff to AE for {account_name}.
      POV results: {results}
      Conversion readiness: {readiness}
      Customer contacts: {contacts}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + value + close approach; DISCOVERY = data completeness check only. Default: FULL)

      You are preparing the handoff from POV execution to commercial
      negotiation. The AE needs actionable intelligence, not a POV diary.
      Every section must answer "so what?" for the negotiation.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: POV OUTCOME SUMMARY
      Summarize the POV outcome for commercial context:
      - Outcome category and confidence
      - Success criteria results (scored summary)
      - Duration and resource investment
      - Overall assessment: what was proven and what was not
      Deliverable: Outcome Summary (Category | Criteria Results | Duration |
      Assessment | Confidence).

      STEP 2: VALUE PROVEN
      Quantify demonstrated value:
      - Business value metrics with production-scale projections
      - ROI estimate with assumptions stated
      - Time-to-value demonstrated
      - Competitive differentiation proved
      - Confidence: HIGH (measured), MEDIUM (extrapolated), LOW (estimated)
      Deliverable: Value Summary (Metric | POV Result | Production Projection |
      Assumptions | Confidence).

      STEP 3: STAKEHOLDER SENTIMENT MAP
      Map customer stakeholders for AE:
      - Name, role, and decision authority
      - Sentiment: CHAMPION / POSITIVE / NEUTRAL / SKEPTICAL / OPPOSED
      - Key concerns or requirements
      - Engagement recommendation for AE
      - Confidence: HIGH (direct interaction), MEDIUM (inferred), LOW (assumed)
      Deliverable: Stakeholder Sentiment table (Name | Role | Authority |
      Sentiment | Concerns | AE Engagement | Confidence).

      STEP 4: COMMERCIAL LEVERAGE AND POSITIONING
      Identify commercial leverage:
      - Value-based pricing justification
      - Competitive positioning advantages
      - Customer pain points validated in POV
      - Expansion opportunities identified
      - Pricing considerations (discounts to avoid, premium justification)
      - Confidence: HIGH (data-backed), MEDIUM (reasonable inference),
        LOW (speculative)
      Deliverable: Commercial Leverage (Lever | Evidence | Recommendation |
      Confidence).

      STEP 5: RISKS AND NEGOTIATION CONSIDERATIONS
      Flag risks for negotiation:
      - Technical gaps to address (if any)
      - Competitor risks (if competitor is in play)
      - Timeline risks (customer urgency or lack thereof)
      - Pricing risks (budget constraints, procurement process)
      - For each risk: mitigation approach and prerequisites
      Deliverable: Negotiation Risks (Risk | Category | Mitigation | Prerequisites |
      Confidence).

      STEP 6: RECOMMENDED CLOSE APPROACH
      Recommend the approach:
      - Close timeline
      - Key milestones to decision
      - Stakeholder engagement sequence
      - Proposal format and content
      - Prerequisites: what must happen before proposal delivery
      Deliverable: Close Approach (Timeline | Milestones | Stakeholder Sequence |
      Proposal | Prerequisites).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Handoff status to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Value quantified with confidence and assumptions
      - Stakeholder sentiment includes engagement recommendation for AE
      - Commercial leverage is evidence-based
      - Risks include mitigation approaches
      - Close approach includes prerequisites
      - No trend claims from single observations
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, value summary, and close approach.
      - If run_mode is DISCOVERY: produce only the data completeness check and gaps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the POV outcome with commercial readiness,
      (2) the strongest commercial lever,
      and (3) the recommended close timeline with confidence.

  loss_analysis:
    name: "POV Loss Analysis"
    description: "Analyze POV loss with root cause identification, competitive insights, product feedback, and account nurture recommendation"
    prompt: |
      Context: POV did not convert for {account_name}.
      Outcome: {outcome_type}
      Reason: {loss_reason}
      Competitor: {competitor_if_any}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + root cause + learnings; DISCOVERY = data collection checklist only. Default: FULL)

      You are analyzing a POV loss. Loss analysis serves two purposes:
      capturing learnings for future POVs and assessing resurrection
      potential for this account. Honest root cause identification
      prevents repeating mistakes. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: LOSS CLASSIFICATION
      Classify the loss:
      - Primary category: COMPETITOR / NO_DECISION / TECHNICAL / OTHER
        Add secondary flag if loss spans categories.
      - Loss timing: DURING POV / POST POV / DELAYED DECISION
      - Predictability: EXPECTED (signals visible) / UNEXPECTED (surprise) /
        GRADUAL (slow deterioration)
      - Confidence: HIGH (customer confirmed reason), MEDIUM (inferred from
        signals), LOW (speculation)
      Deliverable: Loss Classification (Category | Secondary Flag | Timing |
      Predictability | Confidence).

      STEP 2: ROOT CAUSE ANALYSIS
      Identify root cause:
      - Primary root cause
      - Contributing factors (list all that apply)
      - Timeline of key events leading to loss
      - Inflection point: when did the outcome become likely
      - What signals were visible but not acted on
      - Confidence: HIGH (post-mortem data), MEDIUM (pattern analysis),
        LOW (limited information)
      Deliverable: Root Cause Analysis (Primary Cause | Contributing Factors |
      Timeline | Inflection Point | Missed Signals | Confidence).

      STEP 3: WHAT WORKED AND WHAT SHOULD HAVE CHANGED
      Retrospective assessment:
      - What worked well (practices to keep)
      - What should have been done differently (specific, actionable)
      - Process improvements for future POVs
      - Were there qualification signals that should have prevented this POV?
      Deliverable: Retrospective (Category | Observation | Recommendation |
      Impact on Future POVs).

      STEP 4: COMPETITIVE INSIGHTS
      Capture competitive intelligence (if competitor loss):
      - Competitor name and product
      - Competitor strengths observed
      - Competitor weaknesses observed (if any)
      - Customer comparison points
      - Competitive positioning adjustments needed
      - Confidence: HIGH (customer shared comparison), MEDIUM (inferred),
        LOW (rumored)
      If no competitor involved: state "Loss not competitor-driven.
      No competitive insights applicable."
      Deliverable: Competitive Insights table (Dimension | Competitor Position |
      Our Position | Gap | Confidence).

      STEP 5: PRODUCT FEEDBACK
      Capture product-relevant feedback:
      - Feature gaps identified during POV
      - Integration limitations encountered
      - Performance issues observed
      - Customer-requested capabilities
      - Priority: HIGH (deal-breaking) / MEDIUM (significant) / LOW (nice-to-have)
      If no product issues contributed: state "Loss not attributed to
      product limitations."
      Deliverable: Product Feedback table (Item | Category | Customer Impact |
      Priority | Confidence).

      STEP 6: RESURRECTION ASSESSMENT
      Assess potential for future re-engagement:
      - Resurrection potential: HIGH / MEDIUM / LOW / NONE
      - Conditions for re-engagement (what must change)
      - Recommended nurture approach
      - Timeline for re-engagement attempt
      - Confidence: HIGH (customer indicated future interest), MEDIUM
        (relationship preserved), LOW (minimal future signal)
      Deliverable: Resurrection Assessment (Potential | Conditions | Nurture
      Approach | Timeline | Confidence).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Loss reason to record
      - Account status change
      - Next actions to add (nurture plan)
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Loss classification includes confidence
      - Root cause is specific and actionable, not generic
      - Retrospective includes both what worked and what to change
      - Competitive insights attributed with confidence
      - Product feedback prioritized by deal impact
      - Resurrection assessment includes specific conditions
      - No trend claims from single loss event
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, root cause, and learnings.
      - If run_mode is DISCOVERY: produce only the data collection checklist for full loss analysis.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the loss classification with confidence,
      (2) the primary root cause,
      and (3) the resurrection potential with recommended action.

# ============================================================================
# POV METRICS & REPORTING PROMPTS
# ============================================================================
pov_metrics:

  pov_health_assessment:
    name: "POV Health Assessment"
    description: "Assess overall POV health across technical progress, customer engagement, and conversion likelihood with actionable recommendations"
    prompt: |
      Context: Health check for {account_name} POV.
      Current status: {status}
      Days elapsed: {days_elapsed} of {total_days}
      Signals: {recent_signals}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + health status + top action; DISCOVERY = signal inventory only. Default: FULL)

      You are assessing overall POV health. Health assessment integrates
      multiple signal sources into a single actionable status. Each health
      dimension must be independently scored with evidence. An aggregate
      status without dimensional breakdown hides problems. Follow these
      steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: TECHNICAL HEALTH
      Assess technical progress:
      - Success criteria progress (on track / behind / blocked for each)
      - Environment stability (stable / intermittent issues / unstable)
      - Technical blockers (count and severity)
      - SA capacity utilization (sustainable / stretched / overloaded)
      - Technical health score: GREEN / YELLOW / RED
      - Confidence: HIGH (measured metrics), MEDIUM (observation-based),
        LOW (limited data)
      Deliverable: Technical Health (Dimension | Status | Evidence | Score |
      Confidence).

      STEP 2: ENGAGEMENT HEALTH
      Assess customer engagement:
      - Evaluator engagement: ACTIVE / MODERATE / LOW / DISENGAGED
      - Sponsor engagement: ACTIVE / PASSIVE / ABSENT
      - Meeting attendance rate (percentage of scheduled meetings attended)
      - Response time pattern: PROMPT / DELAYED / UNRESPONSIVE
      - Engagement trajectory (requires 2+ observations for trend):
        IMPROVING / STABLE / DECLINING
      - Engagement health score: GREEN / YELLOW / RED
      - Confidence: HIGH (interaction data), MEDIUM (behavioral signals),
        LOW (limited contact)
      If {recent_signals} is empty: state "No recent engagement signals
      available," score as YELLOW (data gap itself is a warning).
      Deliverable: Engagement Health (Dimension | Status | Evidence | Score |
      Confidence | Trajectory).

      STEP 3: CONVERSION LIKELIHOOD
      Estimate conversion probability:
      - Technical win probability: HIGH / MEDIUM / LOW
      - Commercial conversion probability: HIGH / MEDIUM / LOW
      - Combined conversion estimate (percentage range with basis)
      - Key factors supporting conversion
      - Key factors threatening conversion
      - Confidence: HIGH (strong multi-dimensional signals), MEDIUM (mixed
        signals), LOW (insufficient data)

      For conversion trajectory: require 2+ health assessments to establish
      trend. Single assessment = "Initial measurement, no trajectory data."
      Deliverable: Conversion Likelihood (Technical | Commercial | Combined |
      Supporting Factors | Threatening Factors | Confidence | Trajectory).

      STEP 4: RISK INDICATORS
      Flag active risk indicators:
      - Risk indicator and category
      - Severity: CRITICAL / HIGH / MEDIUM / LOW
      - Trend: NEW / ESCALATING / STABLE / IMPROVING
        Trend requires 2+ observations. New indicator = "NEW, no trend data."
      - Action needed
      Deliverable: Risk Indicators table (Indicator | Category | Severity |
      Trend | Action | Confidence).

      STEP 5: RECOMMENDED ACTIONS
      Based on health assessment:
      - Priority actions ranked by impact on health improvement
      - Owner for each action
      - Timeline for each action
      - Prerequisites: what must be true before action can start
      - Expected impact on health score
      Deliverable: Recommended Actions table (Action | Priority | Owner |
      Timeline | Prerequisites | Expected Impact).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Health status to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Each health dimension scored independently with evidence
      - Trend claims backed by 2+ observations
      - Conversion estimate includes confidence range, not point estimate
      - Risk indicators include trend assessment
      - Actions include prerequisites and expected impact
      - Aggregate health status logically follows from dimensional scores
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, aggregate health status, and top action.
      - If run_mode is DISCOVERY: produce only the signal inventory and data gaps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) overall health status with dimensional breakdown,
      (2) the weakest health dimension,
      and (3) the single most urgent action to improve health.

  portfolio_status:
    name: "POV Portfolio Status"
    description: "Summary status of all active POVs with health, resource utilization, conversion forecast, and escalation needs"
    prompt: |
      Context: Portfolio review of active POVs.
      Active POVs: {pov_list}
      Time period: {period}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + portfolio table + escalations; DISCOVERY = data completeness check only. Default: FULL)

      You are producing the portfolio-level view of all active POVs.
      Portfolio review reveals resource conflicts, capacity constraints,
      and conversion pipeline health. Individual POV health does not
      capture portfolio-level risks. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: PORTFOLIO SUMMARY TABLE
      Summarize all active POVs:
      - Account name
      - POV type
      - Day X of Y
      - Health status: GREEN / YELLOW / RED
      - Conversion probability: HIGH / MEDIUM / LOW
      - SA assigned
      - Key risk or note
      - Confidence: HIGH / MEDIUM / LOW

      Sort by health status (RED first, then YELLOW, then GREEN).
      If {pov_list} is empty: state "No active POVs reported," produce
      empty portfolio assessment.
      Deliverable: Portfolio Summary table (Account | Type | Day | Health |
      Conversion | SA | Risk | Confidence).

      STEP 2: ATTENTION ITEMS
      Flag POVs needing management attention:
      - RED status POVs: what is wrong, what is needed
      - YELLOW status POVs: what could deteriorate
      - POVs with declining trajectory (requires 2+ health assessments)
      - Single health assessment = "Initial measurement, trajectory unknown."
      Deliverable: Attention Items (Account | Status | Issue | Action Needed |
      Urgency | Confidence).

      STEP 3: RESOURCE UTILIZATION
      Assess SA resource allocation:
      - SA capacity: hours committed vs available
      - POV overlap conflicts (SAs assigned to multiple concurrent POVs)
      - Resource bottlenecks
      - Capacity for incoming POV requests
      Deliverable: Resource Utilization (SA | POVs Assigned | Hours Committed |
      Hours Available | Bottleneck Risk).

      STEP 4: CONVERSION FORECAST
      Forecast portfolio conversion:
      - Expected conversions this period
      - Expected ARR from conversions
      - Conversion rate: actual vs target
      - Pipeline value at risk (POVs at RED/YELLOW)
      - Confidence: HIGH (strong signals across portfolio), MEDIUM (mixed),
        LOW (limited data)

      For conversion rate trend: require 2+ periods of data. Single period =
      "INSUFFICIENT DATA FOR TREND, first measurement period."
      Deliverable: Conversion Forecast (Metric | Value | Target | Variance |
      Confidence | Trend).

      STEP 5: ESCALATIONS AND RECOMMENDATIONS
      Identify required escalations:
      - POVs requiring management intervention
      - Resource reallocation recommendations
      - Process improvements identified
      - For each: urgency, owner, expected outcome, prerequisites
      Deliverable: Escalations (Item | Urgency | Owner | Expected Outcome |
      Prerequisites).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Portfolio status to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Every POV has health status and conversion estimate
      - Attention items sorted by urgency
      - Resource utilization identifies bottlenecks
      - Conversion forecast includes confidence range
      - Trend claims backed by 2+ period data points
      - Escalations include prerequisites and expected outcomes
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, portfolio table, and escalations.
      - If run_mode is DISCOVERY: produce only the data completeness check and gaps per POV.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) portfolio status with count by health tier,
      (2) the most at-risk POV,
      and (3) the single most urgent portfolio-level action.

# ============================================================================
# POC SUCCESS PLAN PROMPTS
# Based on industry enterprise POV/POC best practices
# ============================================================================
poc_success_plan:

  create_success_plan:
    name: "Create POC Success Plan"
    description: "Initialize a POC Success Plan for a new evaluation with objectives, timeline, commitments, and communication cadence"
    prompt: |
      Context: POC approved for {account_name}.
      Opportunity: {opportunity_name}
      ARR: {opportunity_arr}
      POC type: {poc_type}
      Qualification status: {qualification_status}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + plan template + timeline; DISCOVERY = feasibility check only. Default: FULL)

      You are initializing the POC Success Plan, the master document that
      governs the entire evaluation. A POC without a success plan drifts
      into unstructured demos. Every section must be actionable and have
      an owner. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: POC OVERVIEW
      Define the POC scope:
      - Objective statement (one sentence, outcome-focused)
      - Scope boundaries (what is in, what is out)
      - POC type and rationale for type selection
      - Strategic context (why this POC matters)
      - Confidence: HIGH (aligned with customer), MEDIUM (SA-defined),
        LOW (assumed based on opportunity)
      Deliverable: POC Overview (Objective | Scope In | Scope Out | Type |
      Strategic Context | Confidence).

      STEP 2: TIMELINE AND MILESTONES
      Define the POC timeline:
      - Start date and end date
      - Phase breakdown (Setup, Core Validation, Extended, Wrap-up)
      - Milestone markers with dates
      - Buffer allocation
      - Dependencies that could shift dates
      - Prerequisites: what must be complete before POC start date
      Deliverable: Timeline (Phase | Start | End | Milestones | Dependencies |
      Prerequisites).

      STEP 3: SUCCESS CRITERIA (PLACEHOLDER)
      Create placeholder for success criteria:
      - Note that criteria will be designed in a dedicated runbook
      - Capture any initial criteria discussed during qualification
      - Flag that customer sign-off is required before POC starts
      Deliverable: Success Criteria Placeholder (Initial Ideas | Sign-off Status |
      Next Step).

      STEP 4: COMMITMENT FRAMEWORK
      Define the commitment structure:
      - Customer commitments needed (resources, access, time, data)
      - {vendor} commitments offered (SA time, support, deliverables)
      - Commitment verification process
      - Consequence of unmet commitments
      - Prerequisites: what must be agreed before commitments are formalized
      Deliverable: Commitment Framework (Party | Commitment | Verification |
      Consequence | Prerequisites).

      STEP 5: TEAM AND COMMUNICATION
      Define team and communication plan:
      - {vendor} team roster (roles and responsibilities)
      - Customer team needed (roles and responsibilities)
      - Communication cadence (daily, weekly, ad-hoc)
      - Escalation paths (both sides)
      - Documentation sharing approach
      Deliverable: Team and Communication Plan (Person | Role | Responsibilities |
      Cadence | Escalation Path).

      STEP 6: INITIAL RISK REGISTER
      Identify initial risks:
      - Risk description and category
      - Likelihood: HIGH / MEDIUM / LOW
      - Impact: HIGH / MEDIUM / LOW
      - Mitigation approach
      - Owner
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Risk Register (Risk | Category | Likelihood | Impact |
      Mitigation | Owner | Confidence).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - POC Success Plan created
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Objective is outcome-focused, not activity-focused
      - Scope has explicit in/out boundaries
      - Timeline includes buffer and dependencies
      - Commitment framework covers both parties
      - Risk register includes confidence levels
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, overview, and timeline.
      - If run_mode is DISCOVERY: produce only the feasibility check and input gaps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) POC plan readiness with confidence,
      (2) the most critical gap to fill before kickoff,
      and (3) the recommended next action.

  capture_customer_commitments:
    name: "Capture Customer Commitments"
    description: "Document and verify customer commitments including resources, access, data readiness, and executive engagement"
    prompt: |
      Context: POC planning for {account_name}.
      POC Success Plan: {plan_link}
      Customer contacts: {contacts}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + commitment checklist + gaps; DISCOVERY = commitment requirements only. Default: FULL)

      You are capturing and verifying customer commitments before POC
      execution. Uncommitted customers produce inconclusive POCs. Each
      commitment must be verified with a specific person, not assumed.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: COMMITMENT INVENTORY
      Enumerate all required customer commitments:
      - Technical lead assignment and weekly availability (hours)
      - Data access: what data, format, readiness
      - System/environment access: what systems, credentials, VPN
      - Time commitments: meetings, response SLA, review cycles
      - Decision maker engagement: briefing cadence, availability for reviews
      - Executive sponsor: initial briefing, midpoint check-in, final review
      - Budget confirmation: status and next steps

      For each commitment:
      - Verification status: CONFIRMED / VERBAL / REQUESTED / NOT YET ASKED
      - Verified with: person name and date
      - Confidence: HIGH (written confirmation), MEDIUM (verbal), LOW (assumed)
      If {contacts} is empty: state that customer contacts are not identified,
      flag as critical gap preventing commitment capture.
      Deliverable: Commitment Inventory table (Commitment | Category | Status |
      Verified With | Date | Confidence).

      STEP 2: COMMITMENT GAPS
      Identify gaps in commitments:
      - Commitment not yet secured
      - Risk if gap persists
      - Action to close gap
      - Owner of action
      - Prerequisites: what must happen before this gap can be addressed
      - Timeline to close
      Deliverable: Commitment Gaps table (Gap | Risk | Action | Owner |
      Prerequisites | Timeline).

      STEP 3: GO/NO-GO RECOMMENDATION
      Based on commitment status:
      - GO: all critical commitments CONFIRMED or VERBAL with high confidence
      - CONDITIONAL GO: most commitments secured, gaps are addressable
      - NO-GO: critical commitments missing, gap closure uncertain

      Recommendation with:
      - Rationale
      - Conditions for upgrade (if CONDITIONAL)
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Go/No-Go Recommendation (Decision | Rationale | Conditions |
      Confidence).

      STEP 4: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Commitment status to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Every commitment has verification status and confidence
      - Gaps have specific owners and timelines
      - Go/No-Go based on evidence, not optimism
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, commitment checklist, and gaps.
      - If run_mode is DISCOVERY: produce only the commitment requirements list.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) commitment capture status with count confirmed,
      (2) the most critical unconfirmed commitment,
      and (3) the go/no-go recommendation with confidence.

  design_success_criteria:
    name: "Design Success Criteria with Customer"
    description: "Collaboratively design SMART success criteria with priority classification, measurement methods, and anti-pattern screening"
    prompt: |
      Context: Success criteria design for {account_name} POC.
      Business outcomes: {business_outcomes}
      Use cases: {use_cases}
      Customer priorities: {priorities}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + criteria table; DISCOVERY = outcome mapping only. Default: FULL)

      You are designing the success criteria that determine POC outcome.
      Criteria must be collaboratively designed with the customer to ensure
      buy-in and prevent post-POC disputes. Each criterion must pass SMART
      validation. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: BUSINESS OUTCOME MAPPING
      Map business outcomes to measurable criteria:
      - Business outcome stated by customer
      - Measurable proxy achievable in POC scope
      - Validity of proxy as outcome indicator
      - Confidence: HIGH (direct measurement), MEDIUM (reasonable proxy),
        LOW (weak correlation)
      If {business_outcomes} is empty: state that no business outcomes are
      documented, note this is critical for criteria relevance, proceed with
      use-case-based criteria as provisional.
      Deliverable: Outcome Mapping table (Business Outcome | POC Proxy |
      Validity | Confidence).

      STEP 2: CRITERIA DEFINITION (max 5)
      For each criterion:
      - ID: SC-01 through SC-05
      - Category: FUNCTIONAL / PERFORMANCE / INTEGRATION / OPERATIONAL / BUSINESS
        Assign primary category + secondary flag if applicable.
      - Criterion statement (one sentence)
      - Measurement method
      - Target value (quantified)
      - Priority: MUST_HAVE / SHOULD_HAVE
      - Milestone: when to demonstrate
      - Baseline: current state measurement needed
      - Confidence: HIGH (customer confirmed), MEDIUM (SA-proposed),
        LOW (inferred)
      Deliverable: Success Criteria table (ID | Category | Secondary Flag |
      Criterion | Measurement | Target | Priority | Milestone | Baseline |
      Confidence).

      STEP 3: SMART VALIDATION
      Validate each criterion:
      - Specific: YES / NO + comment
      - Measurable: YES / NO + comment
      - Achievable: YES / NO + comment
      - Relevant: YES / NO + comment
      - Time-bound: YES / NO + comment
      Flag criteria failing 2+ dimensions for redesign.
      Deliverable: SMART Validation table (ID | S | M | A | R | T | Pass/Fail).

      STEP 4: ANTI-PATTERN CHECK
      Screen for common criteria anti-patterns:
      - "Prove everything works" (scope too broad)
      - "Match competitor feature X" (feature war)
      - Subjective criteria ("easy to use")
      - Moving target (no fixed value)
      - Requires production data unavailable in POC

      For each: detected / not detected + remediation if detected.
      Deliverable: Anti-Pattern Check (Anti-Pattern | Detected | Affected Criteria |
      Remediation).

      STEP 5: BASELINE METRICS
      Identify baseline measurements needed:
      - Metric to capture
      - Source of baseline data
      - When to capture (before POC start)
      - Owner of baseline capture
      - Prerequisites: what access or data is needed
      Deliverable: Baseline Requirements table (Metric | Source | Capture Date |
      Owner | Prerequisites).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Success criteria to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Maximum 5 criteria (more dilutes focus)
      - Every criterion has confidence with basis
      - SMART validation completed for each
      - Anti-pattern check completed
      - Each criterion traces to a business outcome
      - Baseline requirements identified
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary and criteria table.
      - If run_mode is DISCOVERY: produce only the outcome mapping and gaps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) criteria count and overall confidence,
      (2) the weakest criterion or highest-risk gap,
      and (3) the most urgent action (e.g., customer sign-off, baseline capture).

  validate_commitments:
    name: "Validate Pre-POC Commitments"
    description: "Verify all commitments are fulfilled before POC start with go/no-go gate"
    prompt: |
      Context: Pre-POC validation for {account_name}.
      POC Success Plan: {plan_link}
      POC start date: {start_date}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + verification checklist + go/no-go; DISCOVERY = verification requirements only. Default: FULL)

      You are running the pre-POC commitment validation gate. Starting a
      POC with unverified commitments leads to delays and scope disputes.
      Each commitment must be independently verified, not assumed from
      earlier conversations. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: COMMITMENT VERIFICATION
      Verify each commitment from the POC Success Plan:
      - Technical lead: assigned and available? YES / NO
      - Data: ready and accessible? YES / NO
      - System access: granted? YES / NO
      - Decision maker: engaged? YES / NO
      - Success criteria: signed off? YES / NO
      - Executive sponsor: briefed? YES / NO

      For each:
      - Verified: YES / NO
      - Verification method: EMAIL / MEETING / SYSTEM CHECK / VERBAL
      - Verified by: person and date
      - Confidence: HIGH (written), MEDIUM (verbal), LOW (assumed)
      - Red flag: any concern about this commitment holding
      If {plan_link} is empty: state that no POC Success Plan is available,
      note this prevents systematic verification, list standard commitments
      to verify.
      Deliverable: Verification Checklist (Commitment | Verified | Method |
      Verified By | Date | Confidence | Red Flag).

      STEP 2: RED FLAGS
      Identify commitment risks:
      - Red flag description
      - Affected commitment
      - Impact on POC if unresolved
      - Remediation action
      - Owner
      - Prerequisites for remediation
      - Timeline
      If no red flags: state "No red flags identified."
      Deliverable: Red Flags table (Flag | Commitment | POC Impact |
      Remediation | Owner | Prerequisites | Timeline).

      STEP 3: GO/NO-GO GATE
      Make the start decision:
      - GO: all critical commitments verified, no unresolved red flags
      - CONDITIONAL GO: most commitments verified, red flags are manageable
      - NO-GO: critical commitments unverified, red flags are blocking

      Decision with:
      - Rationale
      - Conditions for start (if CONDITIONAL)
      - Escalation needed (if NO-GO)
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Go/No-Go Gate (Decision | Rationale | Conditions |
      Escalation | Confidence).

      STEP 4: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Validation status to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Every commitment independently verified with method
      - Red flags have remediation plans and owners
      - Go/No-Go decision has explicit rationale and confidence
      - Escalation path defined for NO-GO
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, verification checklist, and go/no-go decision.
      - If run_mode is DISCOVERY: produce only the verification requirements list.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) verification status with count confirmed,
      (2) the most critical unverified commitment or red flag,
      and (3) the go/no-go recommendation with confidence.

  conduct_internal_kickoff:
    name: "Conduct Internal POC Kickoff"
    description: "Align internal team before customer kickoff with role assignments, technical approach, risk discussion, and customer strategy"
    prompt: |
      Context: Internal kickoff for {account_name} POC.
      POC Success Plan: {plan_link}
      Team: SA {sa_name}, AE {ae_name}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + roles + risks; DISCOVERY = team readiness check only. Default: FULL)

      You are aligning the internal team before the customer-facing kickoff.
      Internal misalignment surfaces during customer interactions and erodes
      confidence. Every team member must leave this kickoff knowing their
      role, the criteria they support, and the risks to watch.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: POC OBJECTIVE AND SCOPE REVIEW
      Review and confirm:
      - POC objective (from Success Plan)
      - Scope boundaries
      - Success criteria summary
      - Timeline and milestones
      - Confidence: HIGH (documented), MEDIUM (verbal), LOW (assumed)
      Deliverable: Objective Review (Objective | Scope | Criteria Summary |
      Timeline | Confidence).

      STEP 2: ROLE ASSIGNMENTS
      Confirm team roles:
      - Person | Role | Responsibilities | Criteria Owned | Availability
      - CONFIRMED / TENTATIVE / GAP for each
      - Backup plan for key person unavailability
      - Confidence: HIGH (confirmed), MEDIUM (tentative), LOW (gap)
      Deliverable: Role Assignments table (Person | Role | Responsibilities |
      Criteria Owned | Availability | Status | Confidence).

      STEP 3: TECHNICAL APPROACH
      Summarize technical approach:
      - Architecture or deployment model for POC
      - Integration points to configure
      - Data requirements and sources
      - Environment setup steps
      - Known technical risks
      - Prerequisites: what must be ready before technical work begins
      Deliverable: Technical Approach (Architecture | Integrations | Data |
      Environment | Risks | Prerequisites).

      STEP 4: RISK DISCUSSION
      Review and update risk register:
      - Risks from Success Plan
      - New risks identified in preparation
      - Mitigation assignments
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Risk Discussion (Risk | Source | Mitigation | Owner |
      Confidence).

      STEP 5: CUSTOMER ENGAGEMENT STRATEGY
      Align on customer approach:
      - Communication style and cadence
      - Key messages to reinforce
      - Sensitive topics to handle carefully
      - Competitive considerations
      - Engagement do's and don'ts
      Deliverable: Engagement Strategy (Aspect | Approach | Rationale).

      STEP 6: ACTION ITEMS BEFORE CUSTOMER KICKOFF
      List actions to complete before customer meeting:
      - Action | Owner | Due Date | Prerequisites
      Deliverable: Pre-Kickoff Actions table (Action | Owner | Due | Prerequisites).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Internal kickoff completion to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Every team member has confirmed role and criteria ownership
      - Technical approach addresses known risks
      - Risk register updated with mitigation assignments
      - Engagement strategy includes competitive considerations
      - Pre-kickoff actions have owners and due dates
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, role assignments, and top risks.
      - If run_mode is DISCOVERY: produce only the team readiness check and gaps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) team readiness with role confirmation status,
      (2) the highest-risk gap before customer kickoff,
      and (3) the most urgent pre-kickoff action.

  conduct_customer_kickoff:
    name: "Conduct Customer POC Kickoff"
    description: "Launch POC with customer stakeholders, confirm objectives, mutual commitments, communication cadence, and obtain sign-off"
    prompt: |
      Context: Customer kickoff for {account_name} POC.
      Attendees: {attendees}
      POC Success Plan: {plan_link}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + agenda + sign-off status; DISCOVERY = attendee readiness only. Default: FULL)

      You are conducting the customer-facing POC kickoff. This meeting
      establishes the mutual agreement that governs the evaluation. Leaving
      the kickoff without confirmed criteria and commitments means the POC
      has no contract. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: KICKOFF AGENDA
      Define the meeting agenda:
      - Welcome and introductions (5 min)
      - POC objectives and scope (10 min)
      - Success criteria walkthrough (15 min)
      - Mutual commitments review (10 min)
      - Timeline and milestones (10 min)
      - Communication cadence (5 min)
      - Q&A and sign-off (5 min)

      For each item: owner, key message, materials needed.
      Deliverable: Kickoff Agenda (Item | Duration | Owner | Key Message |
      Materials).

      STEP 2: SUCCESS CRITERIA CONFIRMATION
      Present criteria for customer confirmation:
      - Each criterion with measurement and target
      - Customer questions or modifications
      - Sign-off status: CONFIRMED / MODIFIED / DEFERRED
      - Confidence: HIGH (signed off), MEDIUM (verbal agreement),
        LOW (still discussing)
      Deliverable: Criteria Confirmation (Criterion ID | Statement | Target |
      Customer Response | Sign-off Status | Confidence).

      STEP 3: MUTUAL COMMITMENTS REVIEW
      Confirm mutual commitments:
      - Customer commitments: confirmed / modified / outstanding
      - {vendor} commitments: confirmed
      - Communication plan: confirmed
      - Escalation paths: confirmed
      - Prerequisites: any conditions attached to commitments
      Deliverable: Commitment Confirmation (Party | Commitment | Status |
      Modifications | Prerequisites).

      STEP 4: SIGN-OFF AND ACTION ITEMS
      Capture meeting outcomes:
      - POC Success Plan sign-off: OBTAINED / PENDING / NOT OBTAINED
      - Action items with owners and due dates
      - Follow-up meetings scheduled
      - Materials to distribute post-meeting
      Deliverable: Sign-off Record (Sign-off Status | Action Items | Follow-ups |
      Materials).

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Kickoff completion to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Agenda includes time allocations and owners
      - Criteria sign-off status captured for each criterion
      - Commitments confirmed by both parties
      - Action items have owners and due dates
      - Sign-off status documented
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, agenda, and sign-off status.
      - If run_mode is DISCOVERY: produce only the attendee readiness check.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) kickoff outcome with sign-off status,
      (2) any criteria or commitments not confirmed,
      and (3) the most urgent follow-up action.

  track_daily_status:
    name: "Track Daily POC Status"
    description: "Document daily POC progress with criteria tracking, blocker identification, and engagement monitoring"
    prompt: |
      Context: Daily status for {account_name} POC.
      Day: {day_number} of {total_days}
      Yesterday's status: {yesterday_summary}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = status + criteria + blockers; DISCOVERY = activity log only. Default: FULL)

      You are tracking daily POC progress. Consistent daily tracking
      catches issues early and provides the data needed for midpoint
      and final reviews. Every entry must reference criteria progress.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: STATUS DETERMINATION
      Determine daily status:
      - ON_TRACK: criteria progressing, no blockers
      - AT_RISK: 1+ criteria behind or 1+ blockers
      - BLOCKED: progress halted on critical criteria

      Basis for determination with evidence.
      - Confidence: HIGH (measured), MEDIUM (observed), LOW (limited data)
      Deliverable: Status Declaration (Status | Basis | Confidence).

      STEP 2: ACTIVITIES COMPLETED
      Log today's activities:
      - Activity description
      - Criterion supported
      - Outcome or finding
      - Evidence captured
      If no activities: state "No POC activities today," flag as risk signal.
      Deliverable: Activity Log (Activity | Criterion | Outcome | Evidence).

      STEP 3: BLOCKERS
      List active blockers:
      - Description
      - Criteria impacted
      - Owner
      - Resolution ETA
      - Escalation needed: YES / NO
      If no blockers: state "No active blockers."
      Deliverable: Blocker Log (Blocker | Criteria Impact | Owner | ETA |
      Escalation).

      STEP 4: CUSTOMER ENGAGEMENT
      Track customer engagement:
      - Interactions today: YES / NO
      - Engagement quality: ACTIVE / PASSIVE / NO CONTACT
      - Sentiment signal (if observable)
      - Confidence: HIGH (direct interaction), MEDIUM (indirect), LOW (none)

      Engagement trend: require 3+ daily observations. Until then:
      "Trend not established, Day {day_number} observation."
      Deliverable: Engagement Entry (Interactions | Quality | Sentiment |
      Confidence | Trend Status).

      STEP 5: TOMORROW'S PLAN
      Plan for next day:
      - Planned activities mapped to criteria
      - Meetings scheduled
      - Prerequisites for tomorrow
      - Help needed
      Deliverable: Tomorrow Plan (Activity | Criterion | Prerequisites | Help).

      STEP 6: ALERT CHECK
      Generate alert if warranted:
      - RED alert: criteria BLOCKED or AT_RISK for 2+ consecutive days
      - YELLOW alert: engagement quality LOW for 2+ consecutive days
      - No alert: normal operations

      Alert requires 2+ daily observations of the triggering condition.
      Single observation = "Monitoring, no alert triggered."
      Deliverable: Alert Status (Alert Level | Trigger | Duration | Action).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Status entry to record
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Status determination has explicit basis
      - Activities linked to criteria
      - Blockers have owners and ETAs
      - Engagement includes confidence level
      - Trend and alert claims require sufficient observations
      - Tomorrow plan includes prerequisites
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, status, criteria status, and blockers.
      - If run_mode is DISCOVERY: produce only the activity log.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) status with day count and confidence,
      (2) the most critical blocker or at-risk criterion,
      and (3) the top priority for tomorrow.

  conduct_midpoint_review:
    name: "Conduct POC Midpoint Review"
    description: "Mid-POC checkpoint with customer covering criteria progress, scope validation, blocker resolution, and timeline confirmation"
    prompt: |
      Context: Midpoint review for {account_name} POC.
      POC Success Plan: {plan_link}
      Days completed: {days_completed} of {total_days}
      Criteria status: {criteria_summary}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + criteria progress + adjustments; DISCOVERY = data gaps only. Default: FULL)

      You are conducting the POC midpoint review with the customer. The
      midpoint is the formal checkpoint where both parties assess whether
      the POC is on track. Unaddressed issues at midpoint rarely resolve
      themselves in the second half. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: MIDPOINT REVIEW AGENDA
      Define the review meeting structure:
      - Criteria progress review (20 min)
      - Scope validation (10 min)
      - Blocker discussion (10 min)
      - Timeline confirmation (5 min)
      - Adjustments and next steps (15 min)
      Deliverable: Review Agenda (Item | Duration | Owner | Objective).

      STEP 2: CRITERIA PROGRESS
      Review each criterion at midpoint:
      - Criterion ID and statement
      - Status: ON TRACK / AT RISK / BLOCKED / COMPLETED
      - Progress vs expected at midpoint
      - Evidence collected
      - Projected outcome: WILL MEET / MAY MEET / UNLIKELY TO MEET
      - Confidence: HIGH (strong evidence), MEDIUM (some evidence),
        LOW (insufficient data)

      Trajectory requires 2+ measurement points. If only 1 exists:
      state "Single measurement, trajectory projection is LOW confidence."
      Deliverable: Criteria Progress table (Criterion ID | Statement | Status |
      Progress vs Expected | Evidence | Projected Outcome | Confidence).

      STEP 3: SCOPE VALIDATION
      Verify scope integrity:
      - Original scope vs current execution
      - Scope changes detected: YES / NO
      - If YES: each change with impact assessment
      - Scope creep indicators
      - Confidence: HIGH (documented), MEDIUM (verbal), LOW (unclear)
      Deliverable: Scope Validation (Original | Current | Changes | Impact |
      Confidence).

      STEP 4: BLOCKER RESOLUTION
      Address active blockers:
      - Blocker | Status | Resolution Plan | Owner | ETA
      - New blockers surfaced at review
      - Customer assistance needed
      - Escalation required
      Deliverable: Blocker Resolution table (Blocker | Status | Plan | Owner |
      ETA | Customer Action | Escalation).

      STEP 5: TIMELINE CONFIRMATION
      Confirm remaining timeline:
      - Remaining milestones with dates
      - Timeline adjustments needed: YES / NO
      - If YES: revised dates with rationale
      - Customer agreement on timeline: CONFIRMED / PENDING
      Deliverable: Timeline Confirmation (Milestone | Original Date | Revised Date |
      Rationale | Customer Agreement).

      STEP 6: CUSTOMER SENTIMENT
      Assess customer sentiment at midpoint:
      - Evaluator satisfaction: POSITIVE / NEUTRAL / CONCERNED
      - Sponsor engagement: ACTIVE / PASSIVE / ABSENT
      - Confidence signals observed
      - Concern signals observed
      - Confidence: HIGH (direct feedback), MEDIUM (behavioral), LOW (inferred)
      Deliverable: Sentiment Assessment (Stakeholder | Satisfaction | Signals |
      Confidence).

      STEP 7: ADJUSTMENTS NEEDED
      Document required adjustments:
      - Adjustment | Reason | Owner | Timeline | Prerequisites
      Deliverable: Adjustments table (Adjustment | Reason | Owner | Timeline |
      Prerequisites).

      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Midpoint status to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Every criterion assessed with projected outcome
      - Trajectory claims require 2+ data points
      - Scope validated against original documentation
      - Timeline confirmation includes customer agreement status
      - Sentiment assessed with confidence
      - Adjustments include prerequisites
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, criteria progress, and adjustments needed.
      - If run_mode is DISCOVERY: produce only the data gaps needing resolution.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) midpoint status with criteria on-track count,
      (2) the most critical issue to resolve,
      and (3) whether timeline is confirmed or needs adjustment.

  manage_scope_change:
    name: "Manage POC Scope Change"
    description: "Process a scope change request with impact assessment, options evaluation, mutual agreement, and plan update"
    prompt: |
      Context: Scope change requested for {account_name} POC.
      Original scope: {original_scope}
      Requested change: {change_request}
      Requestor: {requestor}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + impact + recommendation; DISCOVERY = change classification only. Default: FULL)

      You are processing a scope change request during an active POC.
      Unmanaged scope changes are the primary cause of POC overruns and
      disputed outcomes. Every change must be formally assessed and
      mutually agreed, not silently absorbed. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: CHANGE ASSESSMENT
      Assess the change request:
      - Change description and requestor
      - Category: EXPANSION / MODIFICATION / REDUCTION
        + secondary flag if applicable
      - Legitimacy: VALID / QUESTIONABLE / INVALID
      - Urgency: IMMEDIATE / CAN WAIT / POST-POC
      - Confidence: HIGH (documented), MEDIUM (verbal), LOW (inferred)
      Deliverable: Change Assessment (Description | Requestor | Category |
      Secondary Flag | Legitimacy | Urgency | Confidence).

      STEP 2: IMPACT ANALYSIS
      Analyze impact:
      - Timeline: days added / no change / reduced
      - Resource: additional hours needed
      - Criteria: which affected and how
      - Risk: new risks introduced
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Impact Analysis (Dimension | Impact | Quantification |
      Confidence).

      STEP 3: OPTIONS
      Evaluate options:
      1. Accept with timeline extension
      2. Accept with trade-off (defer something else)
      3. Defer to post-POC
      4. Decline with rationale

      For each: feasibility, outcome impact, customer reaction, prerequisites.
      Deliverable: Options table (Option | Feasibility | Outcome Impact |
      Customer Reaction | Prerequisites).

      STEP 4: RECOMMENDATION
      Recommend option with:
      - Selected option and rationale
      - Sign-off required: YES / NO
      - Updated plan section if accepted
      - Customer communication approach
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Recommendation (Option | Rationale | Sign-off | Plan Update |
      Communication | Confidence).

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Scope change decision to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Change classified with legitimacy assessment
      - Impact quantified across dimensions
      - All four options evaluated
      - Recommendation includes communication approach
      - Sign-off requirement stated
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, impact analysis, and recommendation.
      - If run_mode is DISCOVERY: produce only the change classification.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the change classification and legitimacy,
      (2) the highest-impact dimension,
      and (3) the recommended option with confidence.

  escalate_poc_risk:
    name: "Escalate POC Risk"
    description: "Escalate a critical POC risk or blocker with business impact, resolution options, and urgency classification"
    prompt: |
      Context: Risk escalation for {account_name} POC.
      Risk: {risk_description}
      Impact: {impact}
      Current status: {status}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + risk summary + escalation target; DISCOVERY = risk assessment only. Default: FULL)

      You are escalating a POC risk that cannot be resolved at the
      execution level. Escalation must be precise: the recipient needs
      to understand the business impact and what decision they need to
      make. Vague escalations waste management time. Follow these steps
      in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: RISK SUMMARY
      Summarize the risk for escalation:
      - Risk description (clear, specific)
      - Category: TECHNICAL / ORGANIZATIONAL / COMMERCIAL / CUSTOMER
        + secondary flag if applicable
      - Current status and how long it has persisted
      - What has been tried at execution level
      - Why escalation is needed (what authority or resource is missing)
      - Confidence: HIGH (verified), MEDIUM (observed), LOW (suspected)
      Deliverable: Risk Summary (Description | Category | Secondary Flag |
      Duration | Attempted Resolution | Escalation Reason | Confidence).

      STEP 2: BUSINESS IMPACT ASSESSMENT
      Quantify business impact:
      - Impact on POV outcome (criteria at risk)
      - Impact on deal value (ARR at risk)
      - Impact on timeline (days at risk)
      - Impact on customer relationship
      - Urgency: CRITICAL (must resolve today) / HIGH (must resolve this week) /
        MEDIUM (must resolve before next milestone)
      Deliverable: Business Impact (Dimension | Impact | Quantification | Urgency).

      STEP 3: RESOLUTION OPTIONS
      Present options for the escalation recipient:
      - Option description
      - Resource or authority needed
      - Expected outcome
      - Timeline to resolve
      - Prerequisites for this option
      Deliverable: Resolution Options table (Option | Resource Needed |
      Expected Outcome | Timeline | Prerequisites).

      STEP 4: RECOMMENDED ACTION
      Recommend course of action:
      - Recommended option
      - Escalation target: SM / AE / SA Manager / VP Sales / Customer Executive
      - Decision needed from target (specific ask)
      - Response deadline
      - Follow-up plan
      Deliverable: Recommended Action (Option | Target | Decision Needed |
      Deadline | Follow-up).

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Escalation to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Risk description is specific and actionable
      - Business impact quantified
      - Urgency classification based on evidence
      - Resolution options include prerequisites
      - Escalation target matched to decision authority needed
      - Previous resolution attempts documented
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, risk summary, and escalation target.
      - If run_mode is DISCOVERY: produce only the risk assessment.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the risk with urgency classification,
      (2) the business impact (ARR and criteria at risk),
      and (3) the escalation target with specific decision needed.

  document_poc_results:
    name: "Document POC Results"
    description: "Compile final POC results with criteria outcomes, technical findings, customer feedback, and overall recommendation"
    prompt: |
      Context: POC complete for {account_name}.
      POC Success Plan: {plan_link}
