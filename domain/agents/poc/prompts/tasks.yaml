      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + criteria results + recommendation; DISCOVERY = data completeness check only. Default: FULL)

      You are compiling the final POC results document. This is the
      authoritative record that feeds the decision presentation and
      AE handoff. Every result must be evidence-based. Unsubstantiated
      claims undermine the document's credibility. Follow these steps
      in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: RESULTS SUMMARY
      Compile aggregate results:
      - Criteria met: X of Y
      - Success rate: Z%
      - MUST_HAVE criteria met: A of B
      - SHOULD_HAVE criteria met: C of D
      - Overall outcome: MET / PARTIALLY MET / NOT MET
      - Confidence: HIGH (all criteria measured), MEDIUM (some estimated),
        LOW (significant gaps in measurement)
      Deliverable: Results Summary (Met Count | Total | Success Rate |
      Must-Have Score | Should-Have Score | Outcome | Confidence).

      STEP 2: CRITERIA RESULTS TABLE
      Detail each criterion:
      - Criterion ID and statement
      - Target value
      - Achieved value
      - Status: MET / PARTIALLY MET / NOT MET
      - Evidence (specific measurements, artifacts)
      - Confidence: HIGH (measured), MEDIUM (observed), LOW (estimated)
      Deliverable: Criteria Results table (ID | Statement | Target | Achieved |
      Status | Evidence | Confidence).

      STEP 3: TECHNICAL FINDINGS
      Document technical outcomes:
      - Architecture fit validated
      - Integration points tested
      - Performance results
      - Limitations discovered
      - Open technical questions
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Technical Findings table (Finding | Category | Evidence |
      Implications | Confidence).

      STEP 4: CUSTOMER FEEDBACK SUMMARY
      Compile feedback received:
      - Evaluator feedback
      - Sponsor feedback
      - Strengths identified by customer
      - Concerns raised by customer
      - Confidence: HIGH (documented), MEDIUM (verbal), LOW (inferred)
      If no formal feedback: state "No formal customer feedback captured,"
      note implication.
      Deliverable: Feedback Summary (Source | Feedback | Strengths | Concerns |
      Confidence).

      STEP 5: OVERALL RECOMMENDATION
      Provide recommendation:
      - Outcome: WIN / CONDITIONAL WIN / LOSS
      - Recommendation for next steps
      - Risks to monitor
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Recommendation (Outcome | Next Steps | Risks | Confidence).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - POC results to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Every criterion result has evidence and confidence
      - Technical findings distinguish measured from observed
      - Customer feedback attributed with confidence
      - Overall recommendation logically follows from results
      - No trend claims from single observations
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, criteria results, and recommendation.
      - If run_mode is DISCOVERY: produce only the data completeness check.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) criteria met count and success rate,
      (2) the weakest result or biggest concern,
      and (3) the overall recommendation with confidence.

  prepare_decision_presentation:
    name: "Prepare POC Decision Presentation"
    description: "Create a presentation for decision makers with POC results, value demonstration, and recommendation"
    prompt: |
      Context: Decision presentation for {account_name} POC.
      POC results: {results_summary}
      Audience: {decision_maker}, {attendees}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + outline + call to action; DISCOVERY = audience analysis only. Default: FULL)

      You are creating the presentation that drives the customer decision.
      Decision makers see summarized value, not technical details. Every
      slide must answer "why should we buy?" not "what did you test?"
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: AUDIENCE ANALYSIS
      Analyze the decision audience:
      - Attendee, role, decision authority
      - What they care about (business / technical / strategic)
      - Known concerns
      - Confidence: HIGH (known), MEDIUM (partially known), LOW (unknown)
      Deliverable: Audience Analysis (Attendee | Role | Authority | Priority |
      Concerns | Confidence).

      STEP 2: PRESENTATION OUTLINE
      Structure the presentation:
      1. POC objectives recap (1 slide)
      2. Success criteria results (2-3 slides)
      3. Value demonstrated (1-2 slides)
      4. Technical highlights (1 slide)
      5. Customer feedback (1 slide)
      6. Recommendation (1 slide)
      7. Proposed next steps (1 slide)

      For each slide: key message, data points, visual type.
      Deliverable: Presentation Outline (Slide | Key Message | Data Points |
      Visual Type).

      STEP 3: KEY TALKING POINTS
      Prepare talking points:
      - Per slide: main argument, supporting data, anticipated questions
      - Value narrative: connect POC results to business outcomes
      - Differentiation points: what sets this apart from alternatives
      Deliverable: Talking Points (Slide | Argument | Data | Questions).

      STEP 4: OBJECTION HANDLING
      Prepare for objections:
      - Anticipated objection
      - Prepared response with evidence
      - Supporting data or reference
      - Confidence: HIGH (tested response), MEDIUM (reasonable), LOW (speculative)
      Deliverable: Objection Handling table (Objection | Response | Evidence |
      Confidence).

      STEP 5: CALL TO ACTION
      Define the ask:
      - Primary ask (decision or next step)
      - Supporting rationale
      - Timeline
      - Prerequisites for audience to act
      Deliverable: Call to Action (Ask | Rationale | Timeline | Prerequisites).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Presentation status to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Audience analysis drives message targeting
      - Every slide has a key message
      - Objection handling covers likely pushback
      - Call to action is specific with prerequisites
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, outline, and call to action.
      - If run_mode is DISCOVERY: produce only the audience analysis.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) presentation readiness with audience confidence,
      (2) the most critical message to land,
      and (3) the call to action.

  drive_poc_decision:
    name: "Drive POC Decision"
    description: "Facilitate and accelerate the customer decision with blocker identification, stakeholder engagement, and acceleration tactics"
    prompt: |
      Context: Decision pending for {account_name} POC.
      POC results: {results_summary}
      Decision maker: {decision_maker}
      Decision deadline: {deadline}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + blockers + acceleration; DISCOVERY = decision status assessment only. Default: FULL)

      You are driving the customer toward a decision. Post-POC momentum
      decays rapidly. Every week without a decision reduces conversion
      probability. Actions must be specific and time-bound.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: DECISION STATUS ASSESSMENT
      Assess current decision status:
      - Decision stage: PENDING / DELAYED / STALLED / ACTIVE
      - Days since POC completion
      - Customer engagement level since POC: ACTIVE / COOLING / SILENT
      - Decision maker availability: ACCESSIBLE / LIMITED / UNAVAILABLE
      - Confidence: HIGH (direct signals), MEDIUM (inferred), LOW (limited contact)

      Decision momentum: require 2+ post-POC interactions to assess.
      Single interaction = "Initial post-POC contact, momentum not established."
      Deliverable: Decision Status (Stage | Days Post-POC | Engagement |
      DM Availability | Confidence | Momentum).

      STEP 2: BLOCKERS TO DECISION
      Identify what is blocking the decision:
      - Blocker description
      - Category: INTERNAL CUSTOMER / COMPETITIVE / COMMERCIAL / TECHNICAL /
        PROCUREMENT
        + secondary flag if applicable
      - Owner (who can resolve)
      - Resolution approach
      - Prerequisites for resolution
      - Confidence: HIGH (confirmed), MEDIUM (inferred), LOW (suspected)
      If no blockers identified: state "No specific blockers identified,"
      note that silent status may itself be the blocker.
      Deliverable: Decision Blockers table (Blocker | Category | Secondary Flag |
      Owner | Approach | Prerequisites | Confidence).

      STEP 3: STAKEHOLDER ENGAGEMENT PLAN
      Map engagement needed to drive decision:
      - Stakeholder | Current Position | Action Needed | Owner | Timeline
      - Priority contacts (who can unlock the decision)
      - Messages to reinforce
      Deliverable: Stakeholder Engagement (Stakeholder | Position | Action |
      Owner | Timeline | Priority).

      STEP 4: INFORMATION GAPS
      Identify information the customer needs:
      - Information request or gap
      - Impact on decision if not provided
      - Action to close
      - Owner
      - Prerequisites
      - Timeline
      Deliverable: Information Gaps table (Gap | Decision Impact | Action |
      Owner | Prerequisites | Timeline).

      STEP 5: ACCELERATION TACTICS
      Identify ways to accelerate the decision:
      - Tactic (e.g., executive alignment, reference call, proposal preview)
      - Expected impact on timeline
      - Effort required
      - Prerequisites
      - Risk of tactic (could it backfire?)
      Deliverable: Acceleration Tactics (Tactic | Impact | Effort | Prerequisites |
      Risk).

      STEP 6: TIMELINE TO DECISION
      Project decision timeline:
      - Expected decision date
      - Key milestones between now and decision
      - Escalation triggers (when to escalate if decision does not progress)
      - Confidence: HIGH (customer confirmed timeline), MEDIUM (estimated),
        LOW (no timeline signal)
      Deliverable: Decision Timeline (Date | Milestones | Escalation Triggers |
      Confidence).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Decision status to record
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed with explicit status for every input
      - Decision status assessed with momentum (requires 2+ data points)
      - Blockers include prerequisites and confidence
      - Stakeholder engagement prioritized
      - Acceleration tactics include risk assessment
      - Timeline includes escalation triggers
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, blockers, and acceleration tactics.
      - If run_mode is DISCOVERY: produce only the decision status assessment.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) decision status with days post-POC,
      (2) the most critical blocker to decision,
      and (3) the top acceleration tactic with expected impact.

  handle_poc_win:
    name: "Handle POC Win"
    description: "Process a successful POC outcome with success documentation, journey map update, AE handoff, and implementation planning"
    prompt: |
      Context: POC won for {account_name}.
      POC results: {results_summary}
      Customer decision: GO
      Opportunity: {opportunity_name}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + AE handoff + next steps; DISCOVERY = win documentation checklist only. Default: FULL)

      You are processing a POC win. A win must be captured systematically
      to feed CSP baselines, negotiation leverage, and implementation
      planning. Speed matters: delay between win and commercial proposal
      risks momentum loss. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: WIN DOCUMENTATION
      Document the win:
      - POC summary (objective, duration, outcome)
      - Success criteria results (scored)
      - Value demonstrated (quantified)
      - Customer quotes or endorsements
      - Key differentiators proven
      - Confidence: HIGH (documented), MEDIUM (verbal), LOW (inferred)
      Deliverable: Win Documentation (Summary | Criteria Results | Value |
      Quotes | Differentiators | Confidence).

      STEP 2: SUCCESS BASELINE FOR CSP
      Extract baselines for Customer Success Plan:
      - Metrics measured during POC
      - Baseline values established
      - Target values for production
      - Measurement methodology
      - Confidence: HIGH (measured), MEDIUM (estimated), LOW (projected)
      Deliverable: CSP Baseline table (Metric | POC Baseline | Production Target |
      Methodology | Confidence).

      STEP 3: JOURNEY MAP UPDATE
      Update the customer journey map:
      - POC phase documentation (dates, participants, outcomes)
      - Key moments and decisions
      - Stakeholder engagement evolution
      - Lessons for journey optimization
      Deliverable: Journey Map Update (Phase | Date | Participants | Outcome |
      Key Moments).

      STEP 4: AE HANDOFF BRIEF
      Prepare AE handoff for negotiation:
      - Value proven (quantified with confidence)
      - Stakeholder sentiment summary
      - Commercial leverage points
      - Pricing considerations
      - Negotiation risks
      - Recommended close approach
      - Prerequisites: what AE needs before first commercial meeting
      Deliverable: AE Handoff Brief (Value | Sentiment | Leverage | Pricing |
      Risks | Approach | Prerequisites).

      STEP 5: IMPLEMENTATION NOTES
      Capture implementation considerations:
      - Architecture decisions validated in POC
      - Integration requirements confirmed
      - Data migration considerations
      - Estimated implementation timeline
      - Risks identified during POC
      Deliverable: Implementation Notes (Architecture | Integrations | Data |
