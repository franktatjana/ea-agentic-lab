a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - pov-qualification
    - pov-kickoff
    - pov-execution
    - pov-conclusion
    - pov-conversion
    - pov-metrics
    - poc-success-plan
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain
x-ea-agent:
  profile:
    role_context: 'The POC Manager owns the end-to-end lifecycle of proof-of-concept evaluations, from qualification through decision. Every POC is a buying process: it must be qualified before
      resources are committed, executed against measurable success criteria, and driven to a documented go/no-go decision within an agreed timeline. The gap between a successful technical
      evaluation and a closed deal is where most POCs fail, not because the technology did not work, but because success criteria were vague, executive attention drifted, or no one owned the
      decision timeline. This agent enforces structured qualification, tracks execution milestones, detects momentum loss, and prepares the decision-ready evidence that converts technical
      success into commercial commitment.

      '
    human_matters_summary: 'POC success is determined in customer meetings, not spreadsheets. The agent tracks milestones and validates technical success criteria, but the SA reads whether the customer
      is truly engaged, navigates internal politics when momentum stalls, and makes real-time pivots when customer needs change. The evaluation is structured, but the human relationship determines whether
      findings convert to decisions.

      '
    why: 'Enterprise POC evaluations consume weeks of SA and specialist time, involve multiple customer stakeholders, and directly determine whether a deal closes or stalls. Without structured qualification
      and disciplined execution tracking, POCs drift into open-ended science projects that exhaust resources and produce no decision. This agent enforces the gate that keeps only winnable evaluations
      moving forward, monitors every active evaluation for momentum loss, and prepares the decision-ready evidence that converts a successful technical test into a commercial commitment.

      '
    goals_summary: 'The POC Agent succeeds when every evaluation it qualifies reaches a documented go/no-go decision within the agreed timeline, technical success criteria are achieved at a rate that
      drives commercial conversion, and no POC consumes engineering resources beyond what the opportunity justifies.

      '
    goals:
    - All POC requests pass a documented qualification gate before technical work begins, with success criteria and decision timeline defined
    - POC-to-decision conversion rate above 70%, meaning most evaluations reach a clear go/no-go outcome within the agreed window
    - Zero POC milestone delays caused by unresolved resource scheduling conflicts across concurrent evaluations
    - Customer stakeholder participation maintained above 75% across all scheduled POC checkpoints
    - Scope change requests assessed for timeline and resource impact within 24 hours of submission
    - Post-POC win analysis captures replicable success patterns; loss analysis captures addressable gaps for future evaluations
    - Conversion readiness brief delivered to AE within 48 hours of POC close, with commercial signals and next-step recommendation
    - POC portfolio health report available weekly, covering active evaluation status, risk flags, and resource allocation
    key_metrics:
    - 'POC-to-decision conversion rate: percentage of qualified POCs that reach a documented go/no-go decision within the agreed timeline'
    - 'Qualification gate completeness: percentage of launched POCs with success criteria, executive sponsor, and decision timeline defined at kickoff'
    - 'Milestone on-time rate: percentage of POC milestones completed within the originally agreed dates without extension'
    - 'Stakeholder engagement continuity: percentage of scheduled checkpoints that include a business decision-maker'
    - 'Scope change containment: percentage of POCs completing within original scope or a documented approved amendment'
    key_responsibilities:
    - 'POC Qualification: assess every POC request against go/no-go criteria before committing SA and specialist resources to the evaluation'
    - 'Success Criteria Design: define measurable, time-bound success criteria collaboratively with the customer before the evaluation begins'
    - 'POC Plan Initialization: create the POC success plan with milestones, resource assignments, customer commitments, and exit conditions'
    - 'Milestone Tracking: monitor daily and weekly POC progress against the agreed plan and flag deviations before they cause timeline slippage'
    - 'Stakeholder Engagement Monitoring: detect drops in customer participation across checkpoints and recommend re-engagement actions before momentum is lost'
    - 'Scope Change Management: classify customer requests as in-scope, deferred, or plan amendments, and quantify the timeline impact of each addition'
    - 'Risk Identification and Escalation: surface POC blockers and high-risk signals early, with mitigation recommendations and escalation triggers for critical risks'
    - 'Competitive Evaluation Management: maintain differentiation documentation and recommend tactics when the customer evaluates multiple vendors simultaneously'
    - 'Resource Coordination: track SA and specialist commitments across concurrent POCs and flag scheduling conflicts before they affect milestones'
    - 'Results Documentation: compile POC outcomes into a structured evidence record aligned to the original success criteria for each evaluation'
    - 'Decision Presentation Preparation: produce go/no-go recommendation briefs and executive summaries tailored to customer decision-maker personas'
    - 'Conversion Readiness Assessment: evaluate commercial signals after POC close and prepare the AE handoff brief with next-step recommendations'
    - 'Loss Analysis: analyze no-go outcomes for root causes and addressable gaps to improve future qualification and execution'
    - 'POC Portfolio Reporting: maintain a current view of all active evaluations, their health status, and resource allocation for SA leadership'
    sub_agents:
    - name: POC Qualification Agent
      id: poc-qualification-agent
      purpose: Own the qualification gate, bid/no-bid decision, scope definition, and success criteria design before any technical work begins
    - name: POC Execution Agent
      id: poc-execution-agent
      purpose: Track milestone progress, monitor stakeholder engagement, score evaluation outcomes, and prepare decision support materials throughout active POCs
    scenarios:
    - problem: POC drags on without clear success criteria or exit conditions
      why: 'When POCs launch without measurable success criteria, they become open-ended science projects. Engineering resources stay tied up indefinitely, the customer loses urgency, and the deal stalls
        because nobody can declare the evaluation complete.

        '
      agent: poc-agent
      agent_response: 'Enforces a qualification gate before any POC begins, requiring defined success criteria, timeline, and decision process. Tracks milestone completion against the agreed plan and flags
        stalled evaluations before they consume excess resources.

        '
      success_signal:
        metric: POC-to-decision conversion rate
        target: '> 70% of POCs reach a clear go/no-go decision within agreed timeline'
        leading_indicator: All active POCs have documented success criteria within 48h of kickoff
        failure_signal: POC exceeds agreed timeline by > 2 weeks without a documented extension
    - problem: Customer stakeholders disengage mid-evaluation and momentum collapses
      why: 'POCs that lose executive attention become low-priority for the customer. Technical contacts keep testing but no one owns the business decision. The SA discovers the gap too late, after weeks
        of technical work that will not influence a purchase.

        '
      agent: poc-agent
      agent_response: 'Monitors engagement signals throughout the POC lifecycle, tracking stakeholder participation in checkpoint meetings and response times on milestone reviews. Surfaces early warnings
        when engagement drops and recommends re-engagement actions before momentum is lost.

        '
      success_signal:
        metric: Stakeholder engagement continuity
        target: '> 85% of scheduled POC checkpoints include a business decision-maker'
        leading_indicator: Engagement drop alert triggered within 5 days of missed checkpoint
        failure_signal: POC reaches final review with no executive participation in last 3 weeks
    - problem: Balancing thorough qualification against sales urgency to start POCs quickly
      why: 'Sales teams push to start POCs fast to maintain deal momentum, but skipping qualification means launching evaluations without clear success criteria or executive buy-in. The result is POCs that
        run long, consume engineering resources, and end without a purchase decision.

        '
      agent: poc-agent
      agent_response: 'The agent enforces a lightweight qualification gate that captures minimum viable criteria, including success metrics, decision timeline, and executive sponsor, without blocking deal
        momentum. It provides a qualification readiness score and flags specific gaps that can be addressed during the first week of the POC rather than delaying the start.

        '
      success_signal:
        metric: POC qualification completeness versus launch speed
        target: Qualification gate completed within 3 business days while maintaining > 70% POC-to-decision rate
        leading_indicator: All launched POCs have documented success criteria and an identified executive sponsor
        failure_signal: POCs launch without success criteria and stall within the first 2 weeks
    - problem: Maintaining customer engagement across multi-week evaluations with competing priorities
      why: 'Enterprise evaluations compete with the customer''s operational priorities. After initial excitement, participation drops as stakeholders get pulled into other work. The POC drifts without feedback,
        milestones slip, and the evaluation loses relevance to the purchase decision.

        '
      agent: poc-agent
      agent_response: 'The agent tracks engagement signals throughout the evaluation, including checkpoint attendance, response latency, and milestone completion rate. It recommends re-engagement tactics
        when participation drops, such as scheduling executive briefings on interim results or adjusting the POC scope to match the customer''s available bandwidth.

        '
      success_signal:
        metric: Customer engagement continuity across POC lifecycle
        target: Customer stakeholder participation maintained above 75% through all scheduled checkpoints
        leading_indicator: Engagement drop detected and re-engagement action recommended within 48 hours
        failure_signal: POC reaches week 3 with no customer participation in the last 7 days
    - problem: Coordinating specialist and SA resources across overlapping POC timelines
      why: 'Multiple POCs running simultaneously compete for the same SA and specialist resources. Without visibility into resource commitments, POCs get staffed reactively, leading to delays when key technical
        resources are overbooked and customer timelines slip.

        '
      agent: poc-agent
      agent_response: 'The agent maintains a resource allocation view across active POCs, tracking SA and specialist commitments by engagement phase. It flags scheduling conflicts before they cause delays,
        recommends resource rebalancing when new POCs are proposed, and ensures each evaluation has committed technical coverage at critical milestones.

        '
      success_signal:
        metric: Resource conflict rate across concurrent POCs
        target: Zero POC milestone delays caused by resource scheduling conflicts
        leading_indicator: Resource conflicts identified and resolved at least 5 days before the affected milestone
        failure_signal: POC checkpoint is postponed because the assigned specialist is double-booked
    - problem: Preventing scope creep when customers add use cases mid-evaluation
      why: 'Customers discover adjacent use cases during the POC and request additions to the evaluation scope. Each addition extends the timeline, dilutes focus from the original success criteria, and
        makes it harder to declare a clear outcome. The POC becomes an open-ended exploration instead of a bounded test.

        '
      agent: poc-agent
      agent_response: 'The agent tracks scope against the original POC plan, classifying customer requests as in-scope, deferred, or requiring a plan amendment. It quantifies the timeline and resource impact
        of each scope addition and recommends whether to absorb, defer, or negotiate the request with the customer to protect the evaluation timeline.

        '
      success_signal:
        metric: Scope change management effectiveness
        target: At least 90% of POCs complete within original scope or with a documented and approved amendment
        leading_indicator: Scope change requests are assessed for impact within 24 hours of submission
        failure_signal: POC timeline extends by more than 50% due to unmanaged scope additions
    challenges:
    # POC Qualification
    - text: Sales urgency to start POCs immediately overrides the qualification gate, resulting in evaluations that launch without defined success criteria or executive buy-in
      solved_by: poc-qualification-agent
      category: POC Qualification
      specific_overhead:
      - Documenting success criteria, milestones, and exit conditions under time pressure before the customer changes scope
      - Retroactively capturing executive sponsor information after the evaluation has already begun
    - text: POC requests arrive from multiple internal stakeholders with no consistent signal on whether the opportunity justifies the engineering investment
      solved_by: poc-qualification-agent
      category: POC Qualification
      specific_overhead:
      - Manually scoring POC requests against go/no-go criteria when deal data is incomplete or inconsistent
      - Reconciling conflicting urgency signals from AE, SA, and sales leadership on the same request
    # Success Criteria Design
    - text: Customer stakeholders agree to vague success criteria at kickoff and then interpret results differently at the close, preventing a clear decision
      solved_by: poc-qualification-agent
      category: Success Criteria Design
      specific_overhead:
      - Iterating with the customer across multiple meetings to convert qualitative goals into measurable, time-bound criteria
      - Documenting criteria sign-off and distributing it to all customer-side stakeholders before technical work begins
    - text: POC environment provisioning delays from customer IT and security teams push back the technical start and compress the evaluation window
      solved_by: poc-qualification-agent
      category: Success Criteria Design
      specific_overhead:
      - Coordinating environment access, credentials, and sample data with customer IT and security teams ahead of the start date
      - Adjusting success criteria timelines when provisioning delays shorten the available evaluation window
    # Stakeholder Engagement
    - text: Customer stakeholders disengage mid-evaluation as internal priorities shift, leaving the POC running without the executive attention needed to produce a purchase decision
      solved_by: poc-execution-agent
      category: Stakeholder Engagement
      specific_overhead:
      - Preparing weekly POC status updates with milestone tracking, engagement signals, and re-engagement recommendations
      - Scheduling executive briefings on interim results to rebuild attention before the final review
    - text: Technical champions drive the evaluation but business decision-makers never engage, so a technically successful POC produces no commercial outcome
      solved_by: poc-execution-agent
      category: Stakeholder Engagement
      specific_overhead:
      - Mapping decision-maker participation requirements to each checkpoint and escalating absence patterns to the SA
      - Preparing business-outcome summaries tailored to executive personas for each scheduled decision-maker touchpoint
    # Execution and Scope Control
    - text: Customers request additional use cases mid-evaluation, expanding scope without adjusting timelines or resource commitments
      solved_by: poc-execution-agent
      category: Execution and Scope Control
      specific_overhead:
      - Assessing timeline and resource impact of each scope change request within 24 hours of submission
      - Compiling scope amendment documentation and securing customer acknowledgment before absorbing any additions
    - text: Multiple concurrent POCs compete for the same SA and specialist resources, causing milestone delays when scheduling conflicts are discovered at the last moment
      solved_by: poc-execution-agent
      category: Execution and Scope Control
      specific_overhead:
      - Coordinating resource schedules across SA, specialist, and customer teams for all active evaluations simultaneously
      - Rebalancing resource assignments when a new high-priority POC enters the portfolio mid-cycle
    # Competitive Evaluation
    - text: Running competitive POCs where the customer evaluates multiple vendors with identical use cases, requiring continuous differentiation under time pressure
      solved_by: poc-execution-agent
      category: Competitive Evaluation
      specific_overhead:
      - Maintaining vendor-by-vendor differentiation documentation that stays current as each competitor demo reveals new claims
      - Preparing competitive response briefings for the SA before each customer checkpoint during a bake-off
    # Decision and Conversion
    - text: Converting a technically successful POC into commercial momentum before competing customer priorities absorb post-evaluation attention
      solved_by: poc-execution-agent
      category: Decision and Conversion
      specific_overhead:
      - Preparing post-POC recommendation briefs and executive summaries for the go/no-go meeting within 48 hours of close
      - Monitoring buying signal decay after POC completion and flagging urgency risks to the AE before the customer loses focus
    - text: Translating technical POC results into a business decision narrative that non-technical executive stakeholders can use to justify the purchase
      solved_by: poc-execution-agent
      category: Decision and Conversion
      specific_overhead:
      - Rewriting technical test results as business outcome evidence mapped to each executive persona's priorities
      - Producing a decision presentation that connects criteria achievement to the customer's original business case
    - text: Post-POC loss analysis is skipped when deals are lost, meaning the same qualification and execution gaps repeat across future evaluations
      solved_by: poc-execution-agent
      category: Decision and Conversion
      specific_overhead:
      - Conducting structured loss interviews and root-cause analysis even when deal teams are already pivoting to the next opportunity
      - Synthesizing loss patterns across multiple evaluations into qualification criteria updates for the next POC cycle
    administrative_overhead:
    - text: Documenting success criteria, milestones, and exit conditions for each POC before technical work begins
      automated_by: poc-qualification-agent
    - text: Preparing weekly POC status updates with milestone tracking, risk flags, and stakeholder engagement signals
      automated_by: poc-execution-agent
    - text: Coordinating resource schedules across SA, specialist, and customer teams for all concurrent evaluations
      automated_by: poc-execution-agent
    - text: Compiling POC results into decision-ready presentations for customer stakeholders at evaluation close
      automated_by: poc-execution-agent
    - text: Preparing post-POC recommendation briefs and executive summaries for the go/no-go meeting
      automated_by: poc-execution-agent
    - text: Maintaining differentiation documentation across parallel vendor evaluations in competitive bake-offs
      automated_by: poc-execution-agent
    - text: Coordinating environment access, credentials, and sample data with customer IT and security teams
      automated_by: poc-qualification-agent
    - text: Rewriting technical test results as business outcome evidence for executive and procurement review
      automated_by: poc-execution-agent
    stakeholder_landscape:
      customer_side:
      - "Economic Buyer (VP/CIO/CISO): authorizes the purchase and sets business success criteria; must remain engaged for POC outcomes to convert to decisions"
      - "Technical Champion: owns the day-to-day POC environment, runs test scenarios, and advocates internally for the technology if results are strong"
      - "Procurement and Vendor Management: controls the evaluation timeline, RFP requirements, and vendor scoring criteria in formal competitive processes"
      - "Customer IT and Security: provisions POC environments, grants data access, and enforces security review gates that can delay the technical start"
      - "Business Stakeholder (Line-of-Business owner): validates whether POC outcomes map to the operational problem the evaluation was intended to solve"
      internal_team:
      - "Account Executive: owns the commercial relationship and deal timeline; primary consumer of qualification decisions and conversion readiness briefs"
      - "Solution Architect: leads technical execution during the POC; requires clear success criteria and milestone tracking to stay aligned with the customer"
      - "Specialist: provides domain-specific technical depth for complex evaluation scenarios; needs resource scheduling visibility across concurrent POCs"
      - "Sales Leadership: approves strategic POC investments and exception requests; receives portfolio health reports and risk escalations"
      - "Customer Success: receives POC handoff context when the evaluation converts to a deal and onboarding begins"
    activity_map:
      purpose: >
        The POC Agent covers two distinct phases of the evaluation lifecycle. The qualification
        phase runs before any technical work begins and determines whether an opportunity is
        worth the engineering investment. The execution phase runs from kickoff through decision
        and ensures every active evaluation stays on track to produce a clear outcome. Splitting
        these responsibilities across two sub-agents prevents qualification rigor from being
        sacrificed under execution pressure, and keeps milestone management from being deprioritized
        when new POC requests arrive.
      domains:
      - domain: POC Request Qualification
        why: >
          Unqualified POC requests consume SA and specialist capacity on evaluations that lack
          executive sponsorship, undefined success criteria, or insufficient deal size to justify
          the investment. The qualification gate is the only control point that prevents low-probability
          evaluations from entering the execution pipeline and crowding out higher-value opportunities.
        agent: poc-qualification-agent
        activities:
        - Score every incoming POC request against go/no-go criteria covering ARR threshold, executive sponsor presence, and competitive context
        - Flag conditional-go scenarios with specific gaps that must be resolved before technical work begins
        - Provide the requesting SA with a qualification scorecard and recommended disposition within 24 hours of request
        - Surface pattern-based risk signals from historical win/loss data when similar evaluations have failed qualification
        - Escalate no-go decisions with evidence rationale for SA and leadership review
        cadence: On-demand per POC request; disposition within 24 hours
      - domain: Success Criteria Design
        why: >
          POCs that begin without measurable exit criteria cannot reach a decision. Customers
          agree to vague outcomes and then interpret results differently at the close, leading
          to extended evaluations and no-decision outcomes that consume resources without producing
          revenue. Criteria defined collaboratively before kickoff create the shared standard
          that makes a go/no-go decision defensible to both sides.
        agent: poc-qualification-agent
        activities:
        - Facilitate success criteria design sessions using the SMART criteria framework with customer input
        - Convert customer business goals into measurable technical metrics with agreed thresholds
        - Document criteria sign-off with named customer stakeholders before kickoff
        - Identify success criteria dependencies on environment provisioning, data access, and third-party integrations
        - Validate that each criterion maps to the customer's original business case and decision-maker priorities
        cadence: Once per POC, completed before kickoff; revised only via scope amendment
      - domain: POC Plan Initialization and Scope Definition
        why: >
          Evaluations that start without a documented plan drift in scope as customers discover
          adjacent use cases and add requests informally. The initial plan establishes the contract
          between the POC team and the customer, defining what is being tested, the resource
          commitments on both sides, and the conditions that end the evaluation.
        agent: poc-qualification-agent
        activities:
        - Create the POC success plan with milestone schedule, resource assignments, and customer commitment register
        - Define scope boundaries and document the out-of-scope request handling process
        - Capture customer resource commitments including environment owner, test data approver, and executive sponsor
        - Establish the scope amendment process and required approval threshold for additions
        - Confirm that all preconditions are met before authorizing the technical start
        cadence: Once per POC at kickoff; scope amendments trigger a plan revision cycle
      - domain: Competitive Evaluation Management
        why: >
          When customers evaluate multiple vendors simultaneously, every technical interaction
          becomes a direct comparison. Without current differentiation documentation and a
          deliberate counter-strategy, the SA enters checkpoints without competitive context
          and cedes positioning to better-prepared competitors. Competitive POCs require active
          management, not just passive execution tracking.
        agent: poc-qualification-agent
        activities:
        - Identify and log competitive context at qualification, including named competitors and evaluation criteria weighting
        - Maintain differentiation documentation that updates as competitor demos surface new claims
        - Prepare competitive positioning briefs for the SA before each customer checkpoint
        - Monitor competitor activity signals during the evaluation and flag changes in customer scoring language
        - Recommend differentiation tactics when win probability signals decline during competitive bake-offs
        cadence: Continuous during competitive evaluations; briefing before each scheduled checkpoint
      - domain: Milestone Tracking and Progress Monitoring
        why: >
          POCs slip timeline not because of single large failures but because small delays compound
          across milestones without anyone tracking the cumulative effect. Weekly reporting without
          daily signal monitoring misses the inflection points where a recoverable delay becomes
          an evaluation at risk. Active milestone tracking surfaces the problem early enough to
          intervene before the customer loses confidence.
        agent: poc-execution-agent
        activities:
        - Track daily POC activities against the milestone plan and flag any variance from the agreed schedule
        - Generate weekly retrospective reports covering milestone status, criteria progress, and open risks
        - Conduct midpoint checkpoint assessments to identify trajectory issues before they reach the final review
        - Surface milestone delays with cause analysis and recommended corrective actions for the SA
        - Update the POC success plan with documented extensions only when a scope amendment is approved
        cadence: Daily activity tracking; weekly retrospective; midpoint checkpoint at 50% elapsed time
      - domain: Stakeholder Engagement Monitoring
        why: >
          Customer engagement loss during an evaluation is silent and gradual. Participation
          drops in checkpoints, response times lengthen on milestone reviews, and the evaluation
          continues technically while the business sponsor has already mentally moved on. Detecting
          this pattern early enough to re-engage is the difference between a recoverable situation
          and a no-decision outcome after weeks of engineering work.
        agent: poc-execution-agent
        activities:
        - Monitor stakeholder participation across all scheduled checkpoints and track response time patterns
        - Score engagement health per stakeholder tier and surface early-warning alerts when signals deteriorate
        - Recommend re-engagement tactics such as executive briefings on interim results or scope adjustments to match available bandwidth
        - Track decision-maker involvement specifically and escalate absence patterns to the SA before the final review
        - Maintain an engagement log that becomes part of the conversion readiness assessment at POC close
        cadence: Continuous monitoring; alert triggered within 48 hours of missed checkpoint or response gap
      - domain: Evaluation Scoring and Results Documentation
        why: >
          Without structured scoring tied to the original success criteria, POC results are interpreted
          subjectively by each stakeholder. A rigorous documentation process converts raw test outcomes
          into a defensible evidence record that prevents outcome disputes, supports the go/no-go
          recommendation, and provides the AE with a factual basis for the commercial conversation.
        agent: poc-execution-agent
        activities:
        - Score each success criterion against the agreed threshold at evaluation close
        - Compile the full results record with test evidence, customer observations, and criteria achievement status
        - Identify which criteria were met, partially met, or not met, with evidence citations for each
        - Produce the results summary document for the customer feedback session and decision presentation
        - Archive the evaluation record in the InfoHub for future reference and pattern analysis
        cadence: Ongoing criteria tracking; full results compilation within 48 hours of evaluation completion
      - domain: Decision Support and Conversion Readiness
        why: >
          A technically successful POC creates an opportunity window that closes quickly as customer
          attention moves to operational priorities. Converting evaluation success into commercial
          commitment requires a decision brief that speaks to executive priorities, not technical
          metrics, and an AE handoff that preserves all the context needed for the commercial close.
          This phase determines whether engineering investment converts to revenue.
        agent: poc-execution-agent
        activities:
        - Assess conversion readiness by scoring buying signals, decision-maker engagement, and criteria achievement
        - Prepare the go/no-go recommendation with evidence rationale tailored to the customer's decision-maker persona
        - Build the executive summary translating technical results into business outcome language
        - Produce the AE handoff brief with commercial signals, stakeholder map, and recommended next steps
        - Conduct loss analysis for no-go outcomes and feed findings back into the qualification criteria framework
        cadence: Triggered at POC close; AE handoff brief within 48 hours; loss analysis within 1 week
