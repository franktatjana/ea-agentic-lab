# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:
  profile:
    human_matters_summary: >
      POC success is determined in customer meetings, not spreadsheets. The
      agent tracks milestones and validates technical success criteria, but the
      SA reads whether the customer is truly engaged, navigates internal politics
      when momentum stalls, and makes real-time pivots when customer needs change.
      The evaluation is structured, but the human relationship determines whether
      findings convert to decisions.
    scenarios:
      - problem: "POC drags on without clear success criteria or exit conditions"
        why: >
          When POCs launch without measurable success criteria, they become
          open-ended science projects. Engineering resources stay tied up
          indefinitely, the customer loses urgency, and the deal stalls because
          nobody can declare the evaluation complete.
        agent: poc-agent
        agent_response: >
          Enforces a qualification gate before any POC begins, requiring defined
          success criteria, timeline, and decision process. Tracks milestone
          completion against the agreed plan and flags stalled evaluations before
          they consume excess resources.
        success_signal:
          metric: "POC-to-decision conversion rate"
          target: "> 70% of POCs reach a clear go/no-go decision within agreed timeline"
          leading_indicator: "All active POCs have documented success criteria within 48h of kickoff"
          failure_signal: "POC exceeds agreed timeline by > 2 weeks without a documented extension"
      - problem: "Customer stakeholders disengage mid-evaluation and momentum collapses"
        why: >
          POCs that lose executive attention become low-priority for the customer.
          Technical contacts keep testing but no one owns the business decision.
          The SA discovers the gap too late, after weeks of technical work that
          will not influence a purchase.
        agent: poc-agent
        agent_response: >
          Monitors engagement signals throughout the POC lifecycle, tracking
          stakeholder participation in checkpoint meetings and response times
          on milestone reviews. Surfaces early warnings when engagement drops
          and recommends re-engagement actions before momentum is lost.
        success_signal:
          metric: "Stakeholder engagement continuity"
          target: "> 85% of scheduled POC checkpoints include a business decision-maker"
          leading_indicator: "Engagement drop alert triggered within 5 days of missed checkpoint"
          failure_signal: "POC reaches final review with no executive participation in last 3 weeks"
      - problem: "Balancing thorough qualification against sales urgency to start POCs quickly"
        why: >
          Sales teams push to start POCs fast to maintain deal momentum, but skipping
          qualification means launching evaluations without clear success criteria or
          executive buy-in. The result is POCs that run long, consume engineering
          resources, and end without a purchase decision.
        agent: poc-agent
        agent_response: >
          The agent enforces a lightweight qualification gate that captures minimum
          viable criteria, including success metrics, decision timeline, and executive
          sponsor, without blocking deal momentum. It provides a qualification
          readiness score and flags specific gaps that can be addressed during the
          first week of the POC rather than delaying the start.
        success_signal:
          metric: "POC qualification completeness versus launch speed"
          target: "Qualification gate completed within 3 business days while maintaining > 70% POC-to-decision rate"
          leading_indicator: "All launched POCs have documented success criteria and an identified executive sponsor"
          failure_signal: "POCs launch without success criteria and stall within the first 2 weeks"
      - problem: "Maintaining customer engagement across multi-week evaluations with competing priorities"
        why: >
          Enterprise evaluations compete with the customer's operational priorities.
          After initial excitement, participation drops as stakeholders get pulled into
          other work. The POC drifts without feedback, milestones slip, and the
          evaluation loses relevance to the purchase decision.
        agent: poc-agent
        agent_response: >
          The agent tracks engagement signals throughout the evaluation, including
          checkpoint attendance, response latency, and milestone completion rate.
          It recommends re-engagement tactics when participation drops, such as
          scheduling executive briefings on interim results or adjusting the POC
          scope to match the customer's available bandwidth.
        success_signal:
          metric: "Customer engagement continuity across POC lifecycle"
          target: "Customer stakeholder participation maintained above 75% through all scheduled checkpoints"
          leading_indicator: "Engagement drop detected and re-engagement action recommended within 48 hours"
          failure_signal: "POC reaches week 3 with no customer participation in the last 7 days"
      - problem: "Coordinating specialist and SA resources across overlapping POC timelines"
        why: >
          Multiple POCs running simultaneously compete for the same SA and specialist
          resources. Without visibility into resource commitments, POCs get staffed
          reactively, leading to delays when key technical resources are overbooked
          and customer timelines slip.
        agent: poc-agent
        agent_response: >
          The agent maintains a resource allocation view across active POCs, tracking
          SA and specialist commitments by engagement phase. It flags scheduling
          conflicts before they cause delays, recommends resource rebalancing when
          new POCs are proposed, and ensures each evaluation has committed technical
          coverage at critical milestones.
        success_signal:
          metric: "Resource conflict rate across concurrent POCs"
          target: "Zero POC milestone delays caused by resource scheduling conflicts"
          leading_indicator: "Resource conflicts identified and resolved at least 5 days before the affected milestone"
          failure_signal: "POC checkpoint is postponed because the assigned specialist is double-booked"
      - problem: "Preventing scope creep when customers add use cases mid-evaluation"
        why: >
          Customers discover adjacent use cases during the POC and request additions
          to the evaluation scope. Each addition extends the timeline, dilutes focus
          from the original success criteria, and makes it harder to declare a clear
          outcome. The POC becomes an open-ended exploration instead of a bounded test.
        agent: poc-agent
        agent_response: >
          The agent tracks scope against the original POC plan, classifying customer
          requests as in-scope, deferred, or requiring a plan amendment. It quantifies
          the timeline and resource impact of each scope addition and recommends
          whether to absorb, defer, or negotiate the request with the customer to
          protect the evaluation timeline.
        success_signal:
          metric: "Scope change management effectiveness"
          target: "At least 90% of POCs complete within original scope or with a documented and approved amendment"
          leading_indicator: "Scope change requests are assessed for impact within 24 hours of submission"
          failure_signal: "POC timeline extends by more than 50% due to unmanaged scope additions"
    challenges:
      - "Balancing thorough qualification against sales urgency to start POCs quickly"
      - "Maintaining customer engagement across multi-week evaluations with competing priorities"
      - "Coordinating specialist and SA resources across overlapping POC timelines"
      - "Preventing scope creep when customers add use cases mid-evaluation"
    administrative_overhead:
      - "Documenting success criteria, milestones, and exit conditions for each POC"
      - "Preparing weekly POC status updates with milestone tracking and risk flags"
      - "Coordinating resource schedules across SA, specialist, and customer teams"
      - "Compiling POC results into decision-ready presentations for customer stakeholders"

