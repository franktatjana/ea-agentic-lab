      input: account_name, plan_link, start_date, end_date
      description: Compile final POC results
      on_failure: stop
    - step: 12
      prompt: poc-prepare-decision-presentation
      input: account_name, results_summary, decision_maker, attendees
      description: Create presentation for decision makers
      on_failure: stop
    - step: 13
