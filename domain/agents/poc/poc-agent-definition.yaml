      input: account_name, results_summary, decision_maker, deadline
      description: Facilitate decision from customer
      on_failure: stop
    - step: 14
      prompt: poc-handle-poc-win
      input: account_name, results_summary, opportunity_name
      description: Process successful POC outcome
      on_failure: stop
    - step: 15
