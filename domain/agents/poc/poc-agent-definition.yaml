      - Flags conditional-go scenarios with specific gaps to resolve before technical work begins, giving the SA a clear action list rather than a binary block
      - Escalates no-go decisions with evidence rationale, separating the qualification judgment from the AE's commercial relationship with the account
    - domain: Success Criteria Design
      agent: poc-qualification-agent
