  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input_validation:
    - rule: Reject requests without source content or evidence base
    - rule: POC scope must reference a specific opportunity
    - rule: Success criteria must be measurable and time-bound
    output_checks:
    - rule: All qualification decisions cite specific go/no-go criteria
    - rule: Every risk includes mitigation action and owner
    - rule: POC timelines include all milestone dates
    - rule: Conversion recommendations reference success criteria results
    signal_validation:
    - rule: POC health signals must reference observable evidence
    - rule: Stall indicators require minimum 2 data points
    - rule: Customer sentiment claims cite specific interactions
    resource:
    - max_tool_calls: 30
  error_handling:
    tool_failures:
      critical:
      - read-crm-data
      enrichment:
      - read-communications
      - read-infohub
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  boundaries:
  - Does not execute technical implementation (SA/Specialist domain) (handoff to SA Agent)
  - Does not negotiate commercial terms (AE Agent's domain) (handoff to AE Agent)
  - Does not commit to product features (PM Agent's domain) (handoff to Leadership)
  - Does not extend POC timelines without approval (handoff to Leadership)
  - Does not guarantee outcomes not validated (handoff to Leadership)
  - Does not skip qualification for 'strategic' requests (handoff to Leadership)
  permissions:
  - Qualify POC requests (go/no-go analysis)
  - Design measurable success criteria
  - Track POC execution milestones
  - Monitor technical and business signals
  - Coordinate cross-functional POC resources
  - Drive POC-to-close conversion
  escalation_triggers:
  - Technical execution, architecture decisions (to SA Agent)
  - Commercial discussions, conversion negotiations (to AE Agent)
  - Deep technical implementation (to Specialist Agent)
  - Critical poc qualification quality exceeding agent authority (to Leadership)
  handoffs:
    human_escalation: Leadership
    defer_to:
      sa_agent: Technical execution, architecture decisions
      ae_agent: Commercial discussions, conversion negotiations
      specialist_agent: Deep technical implementation
    provide_to:
      ae_agent: POC status, conversion readiness
      sa_agent: Success criteria, technical requirements
      senior_manager: Strategic POC risks
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - POC qualification quality
    - Success criteria achievement
    - Conversion to close
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - poc-evaluation
      - qualification
      - signal-detection
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/qualification-criteria.yaml
      description: Go Criteria, No Go Criteria, Conditional Go
    - path: references/signal-detection.yaml
      description: Poc Health Signals, Qualification Signals, Conversion Signals
    - path: references/success-criteria-design.yaml
      description: Principles, Anti Patterns
    - path: references/target-metrics.yaml
      description: Conversion Rate, Avg Duration, Success Criteria Achievement
  assets:
  - name: analysis
    filename: '{account}-analysis.md'
    description: Analysis output
  quality:
    before_output:
    - Success criteria are SMART
    - Timeline has specific dates
    - All stakeholders identified
    - Go/no-go rationale documented
    - Risks have mitigations
  autonomy:
    triggers:
    - type: parent_dispatch
      source: sa-agent
      description: SA orchestrator routes POC lifecycle requests
    - type: event
      source: crm_webhook
      condition: opportunity.poc_requested == true
      description: Auto-activates when POC is requested on an opportunity
    - type: downstream
      source: rfp-agent
      condition: rfp.requires_poc == true
      description: RFP process identifies need for proof-of-concept validation
    outputs:
    - type: parent_return
      target: sa-agent
      payload:
      - poc_status
      - qualification_decision
      - success_criteria_results
      - conversion_readiness
      description: Full POC status and results back to SA orchestrator
    - type: trigger_agent
      target: sa-agent
      condition: poc.outcome == SUCCESS AND opportunity.arr >= 100000
      payload:
      - poc_results
      - customer_requirements
      - technical_profile
      flow: customer-success-plan
      description: Successful POC triggers CSP initiation on SA agent
    - type: trigger_agent
      target: specialist-agent
      condition: poc.technical_risk >= HIGH
      payload:
      - risk_details
      - domain_area
      - customer_context
      description: High technical risk during POC triggers specialist engagement
    - type: notify_human
      condition: poc.qualification == NO_GO OR poc.risk_level == HIGH
      channel: alert
      description: No-go decisions and high-risk POCs surface for SA review
    consumes_toolboxes:
    - toolbox: discovery-intelligence
      agent: sa-discovery-agent
      tools:
      - get-discovery-summary
      - get-stakeholder-map
      reason: Discovery findings inform POC scope and success criteria
    - toolbox: risk-intelligence
      agent: sa-risk-agent
      tools:
      - get-architecture-health
      reason: Architecture health context for POC risk assessment
    dependencies:
    - agent: specialist-agent
      reason: Domain expertise for complex technical evaluation scenarios
    - agent: infosec-agent
      reason: Security assessment when POC involves sensitive data or compliance requirements
