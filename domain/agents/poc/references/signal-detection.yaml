# POC Signal Detection Reference
# Domain knowledge extracted to references/ per DDR-018

poc_health_signals:
  positive:
    - "success criteria met"
    - "stakeholder engaged"
    - "expanding scope"
    - "asking about pricing"
    - "discussing timeline"
    - "internal champion active"

  negative:
    - "unresponsive"
    - "changing requirements"
    - "adding stakeholders late"
    - "competitor POC parallel"
    - "budget uncertainty"
    - "scope creep"

qualification_signals:
  must_have:
    - "defined success criteria"
    - "decision maker identified"
    - "budget confirmed"
    - "timeline agreed"

  red_flags:
    - "science experiment"
    - "no clear use case"
    - "no budget"
    - "no decision authority"
    - "unlimited timeline"

conversion_signals:
  keywords:
    - "ready to proceed"
    - "contract discussion"
    - "procurement"
    - "implementation planning"
    - "success validated"
