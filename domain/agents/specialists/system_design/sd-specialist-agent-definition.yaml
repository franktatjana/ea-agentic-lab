specialized_agents:
- component_type: SpecializedAgent
  id: sd-specialist-agent-proactive
  name: System Design Specialist (Proactive)
  description: 'Proactive mode: scans for architecture risks, scalability bottlenecks, and design debt without prompting'
  agent:
    $component_ref: sd-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan architectures for design risks, scalability
      ceilings, and resilience gaps. Surface architectural debt and single points of failure before they cause incidents.
      Prioritize timeliness over depth. Keep outputs concise and action-oriented. Flag anything that needs immediate attention.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: sd-specialist-agent-analytical
  name: System Design Specialist (Analytical)
  description: 'Analytical mode: deep architecture analysis with comprehensive tradeoff evaluation and pattern matching'
  agent:
    $component_ref: sd-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Provide comprehensive architecture analysis with full
      tradeoff evaluation. Synthesize across multiple design dimensions (scalability, resilience, cost, complexity). Prioritize
      accuracy and defensibility over speed. Include confidence levels and caveats where appropriate.

      '
    human_in_the_loop: true
flows:
- component_type: Flow
  id: system-architecture-assessment
  name: System Architecture Assessment
  description: Comprehensive assessment of current system architecture covering patterns, scalability, resilience, integration,
    cloud readiness, and performance.
  inputs:
  - title: system_context
    type: object
  - title: non_functional_requirements
    type: object
  outputs:
  - title: architecture_assessment
    type: object
  - title: improvement_roadmap
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: sd-architecture-review
      input: system_context
      tools:
      - invoke-sd-architecture-agent
      - read-infohub
      description: Assess current architecture patterns, identify structural weaknesses and anti-patterns
      on_failure: stop
    - step: 2
      prompt: sd-nfr-analysis
      input: system_context, non_functional_requirements
      tools:
      - invoke-sd-scalability-agent
      - invoke-sd-resilience-agent
      - invoke-sd-performance-agent
      description: Evaluate scalability, resilience, and performance against stated NFRs
      on_failure: stop
    - step: 3
      prompt: sd-integration-review
      input: system_context
      tools:
      - invoke-sd-integration-agent
      - invoke-sd-cloud-native-agent
      description: Assess integration landscape and cloud-native readiness
      on_failure: skip_with_warning
- component_type: Flow
  id: cloud-migration-design
  name: Cloud Migration Design
  description: End-to-end cloud migration architecture design covering application modernization, infrastructure transformation,
    and operational readiness.
  inputs:
  - title: current_architecture
    type: object
  - title: target_cloud
    type: string
  - title: migration_constraints
    type: object
  outputs:
  - title: migration_architecture
    type: object
  - title: migration_plan
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: sd-migration-assessment
      input: current_architecture, target_cloud
      tools:
      - invoke-sd-architecture-agent
      - invoke-sd-cloud-native-agent
      description: Assess current state and define target architecture for cloud migration
      on_failure: stop
    - step: 2
      prompt: sd-migration-resilience
      input: current_architecture, migration_constraints
      tools:
      - invoke-sd-resilience-agent
      - invoke-sd-scalability-agent
      description: Design resilience and scalability for the target cloud architecture
      on_failure: stop
    - step: 3
      prompt: sd-migration-integration
      input: current_architecture, target_cloud
      tools:
      - invoke-sd-integration-agent
      - invoke-sd-performance-agent
      description: Design integration patterns and validate performance targets for migrated workloads
      on_failure: skip_with_warning
- component_type: Flow
  id: resilience-review
  name: Resilience and DR Review
  description: Focused resilience review covering high availability, disaster recovery, fault tolerance, and chaos engineering
    readiness.
  inputs:
  - title: system_context
    type: object
  - title: availability_targets
    type: object
  outputs:
  - title: resilience_assessment
    type: object
  - title: dr_plan
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: sd-resilience-assessment
      input: system_context, availability_targets
      tools:
      - invoke-sd-resilience-agent
      - read-infohub
      description: Assess current resilience posture against availability targets and identify gaps
      on_failure: stop
    - step: 2
      prompt: sd-resilience-design
      input: system_context, availability_targets
      tools:
      - invoke-sd-resilience-agent
      - invoke-sd-scalability-agent
      description: Design resilience improvements, DR strategy, and chaos engineering recommendations
      on_failure: stop
