agentspec_version: 26.1.0
component_type: Agent
id: sd-cloud-native-agent
name: SD Cloud Native Agent
description: 'Moving to the cloud without adopting cloud-native patterns means paying cloud prices for on-premises architecture. This agent provides expert guidance on containerization, Kubernetes orchestration, serverless computing, infrastructure-as-code, and cloud-native design patterns. It produces cloud-native maturity assessments, migration strategies, and IaC implementation plans that ensure organizations leverage cloud capabilities rather than merely hosting in them.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: sd-specialist-agent
  tags:
  - containers
  - kubernetes
  - serverless
  - infrastructure-as-code
  - cloud-native
  responsibility: 'Assess cloud-native maturity, design containerization and Kubernetes strategies, plan serverless adoption, and implement infrastructure-as-code practices.

    '
system_prompt: 'You are a Cloud Native Agent, part of the System Design Specialist
  intelligence system. Your job is to design cloud-native architectures and migration strategies.


  You MUST:

  - Assess cloud-native maturity against established maturity models (CNCF, cloud provider)

  - Design containerization strategies with image building, registry management, and security scanning

  - Architect Kubernetes deployments with namespace design, resource management, and networking

  - Evaluate serverless fit for workloads based on execution pattern, cold start tolerance, and cost

  - Design infrastructure-as-code pipelines with module structure, state management, and drift detection

  - Plan cloud migration strategies (rehost, replatform, refactor) with clear criteria per workload

  - Design multi-cloud and hybrid-cloud architectures with portability and governance considerations

  - Produce cloud-native transformation roadmaps with phased delivery and rollback criteria


  You MUST NOT:

  - Design architecture patterns or service boundaries (Architecture Agent''s domain)

  - Design scaling or capacity plans (Scalability Agent''s domain)

  - Design resilience or DR patterns (Resilience Agent''s domain)

  - Design integration topologies (Integration Agent''s domain)

  - Execute performance tests (Performance Agent''s domain)

  - Recommend specific cloud providers without structured evaluation criteria


  Every cloud-native recommendation must include the migration risk, the operational

  complexity impact, and the team capability requirements for sustainable adoption.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-infrastructure-docs
  name: Read Infrastructure Documentation
  description: Access infrastructure configurations, deployment manifests, IaC templates, and cloud resource inventories
  requires_confirmation: false
  inputs:
  - title: source_type
    type: string
  - title: account_name
    type: string
  outputs:
  - title: content
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Cannot access infrastructure documentation, flag as data gap
    - error_code: NO_RECORDS
      guidance: No infrastructure documentation found, note gap and request from user
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: architecture, infrastructure, cloud, deployments, or frameworks.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map), industry (profile, regulatory, trends), market (news digest), technology (current
    map, vendor landscape).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: write-cloud-native-artifact
  name: Write Cloud Native Artifact
  description: Save cloud-native assessments, migration plans, and IaC designs to InfoHub
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from user about cloud environment or migration constraints
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes: []
specialized_agents: []
flows:
- component_type: Flow
  id: cloud-native-assessment
  name: Cloud Native Assessment and Migration Planning
  playbook_refs:
  - PB_SD_006
  description: Assess cloud-native maturity, design containerization strategy, and produce migration roadmap.
  inputs:
  - title: system_context
    type: object
  - title: cloud_environment
    type: object
  - title: migration_constraints
    type: object
  outputs:
  - title: maturity_assessment
    type: object
  - title: containerization_strategy
    type: object
  - title: migration_roadmap
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: sd-cloud-maturity
      input: system_context, cloud_environment
      tools:
      - read-infrastructure-docs
      - read-infohub
      description: Assess cloud-native maturity against CNCF and cloud provider maturity models
      on_failure: stop
    - step: 2
      prompt: sd-containerization-design
      input: system_context, cloud_environment
      tools:
      - read-infrastructure-docs
      description: Design containerization strategy with image building, registry, and security scanning
      on_failure: stop
    - step: 3
      prompt: sd-migration-roadmap
      input: system_context, migration_constraints
      tools:
      - read-infohub
      - read-intelligence
      description: Produce cloud-native transformation roadmap with phased delivery and rollback criteria
      on_failure: stop
    - step: 4
      action: persist
      tools:
      - write-cloud-native-artifact
      description: Save maturity assessment and migration roadmap to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - cloud-native-assessment
    - containerization-strategy
    - kubernetes-architecture
    - serverless-design
    - infrastructure-as-code
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'The agent assesses cloud-native readiness and designs migration strategies. The engineering leader knows how much operational complexity the team can absorb, which workloads justify the investment in containerization, and whether the organization has the skills to operate Kubernetes or should adopt a managed platform. The migration plan is technically sound, but the human leader ensures the team can sustain it.

      '
    challenges:
    - text: Cloud migrations lift-and-shift without modernizing, creating cloud-hosted legacy systems
      specific_overhead:
      - Paying cloud-scale costs for on-premises architecture patterns that cannot leverage elastic scaling or managed services
    - text: Kubernetes is adopted as a platform without the operational maturity to run it sustainably
      specific_overhead:
      - Debugging Kubernetes networking, resource limits, and scheduling issues without dedicated platform engineering skills
    - text: Infrastructure-as-code is partially adopted, leaving manual drift as the source of configuration incidents
      specific_overhead:
      - Reconciling manually-applied production changes with IaC state files after configuration drift causes an incident
    - text: Serverless is applied to workloads where cold start latency or execution time limits make it unsuitable
      specific_overhead:
      - Re-architecting serverless functions back to containers after discovering latency or timeout constraints in production
    - text: Container images are built without security scanning, creating vulnerability exposure in production
      specific_overhead:
      - Remediating container vulnerabilities discovered by a security audit rather than caught during build
    administrative_overhead:
    - Maintaining IaC module libraries and cloud resource inventories
    - Documenting cloud architecture decisions and migration progress per workload
    scenarios:
    - problem: A lift-and-shift cloud migration delivers no cost savings because applications run on oversized VMs with no auto-scaling
      why: 'Applications were moved to the cloud without changing their deployment model. Each application runs on a dedicated VM sized for peak load, paying for idle capacity during off-peak hours. The migration delivered no elastic scaling, no managed service adoption, and no operational improvement.

        '
      agent: sd-cloud-native-agent
      agent_response: 'The agent classifies each workload by migration strategy (rehost, replatform, refactor) using a decision matrix based on complexity, cloud-native benefit potential, and team capability. For replatform candidates, it designs containerization with auto-scaling. For refactor candidates, it produces a phased modernization plan with managed service adoption. For workloads that should remain as VMs, it designs right-sizing and reserved capacity.

        '
      success_signal:
        metric: Cloud cost efficiency improvement
        target: 30% reduction in compute cost for migrated workloads within 6 months of replatforming
        leading_indicator: Workload classification completed with migration strategy per application
        failure_signal: Cloud costs increase post-migration without corresponding capability improvement
    - problem: Kubernetes cluster sprawl creates operational burden because each team runs its own cluster without standardization
      why: 'Multiple teams adopted Kubernetes independently, each with different configurations, networking setups, and monitoring approaches. There is no shared platform team, no standard cluster configuration, and no consistent operational practices. The organization is running Kubernetes but not operating it as a platform.

        '
      agent: sd-cloud-native-agent
      agent_response: 'The agent designs a multi-tenant Kubernetes platform architecture with standardized cluster configuration, namespace isolation, resource quotas, and shared observability. The design includes a platform team operating model, golden path templates for application deployment, and a migration plan to consolidate workloads onto managed clusters.

        '
      success_signal:
        metric: Kubernetes operational standardization
        target: All production workloads run on standardized platform with shared operational practices
        leading_indicator: Platform team established with golden path templates available
        failure_signal: Teams continue running independent clusters outside the standard platform
  escalation_triggers:
  - Cloud migration strategy with significant vendor lock-in implications
  - Kubernetes adoption recommendation exceeding team operational maturity
  - Multi-cloud architecture decision requiring executive alignment on cloud strategy
  - IaC adoption plan requiring organizational process changes beyond the engineering team
  prompt_registry:
    sd-cloud-maturity:
      description: Assess cloud-native maturity against established maturity models
      source: prompts/tasks.yaml#system_design.cloud_maturity
      inputs:
      - title: system_context
        type: object
      - title: cloud_environment
        type: object
      outputs:
      - title: maturity_assessment
        type: object
      requires_data:
      - source: read-infrastructure-docs
        fields:
        - deployment_configs
        - cloud_resources
        - ci_cd_pipelines
        priority: critical
      - source: read-infohub
        fields:
        - technology_stack
        - team_capabilities
        priority: enrichment
    sd-containerization-design:
      description: Design containerization strategy with image building and security scanning
      source: prompts/tasks.yaml#system_design.containerization_design
      inputs:
      - title: system_context
        type: object
      - title: cloud_environment
        type: object
      outputs:
      - title: containerization_strategy
        type: object
      requires_data:
      - source: read-infrastructure-docs
        fields:
        - application_inventory
        - deployment_model
        priority: critical
    sd-migration-roadmap:
      description: Produce cloud-native transformation roadmap with phased delivery
      source: prompts/tasks.yaml#system_design.migration_roadmap
      inputs:
      - title: system_context
        type: object
      - title: migration_constraints
        type: object
      outputs:
      - title: migration_roadmap
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - architecture_docs
        - team_capabilities
        priority: critical
      - source: read-intelligence
        fields:
        - cloud_provider_services
        - industry_adoption_patterns
        priority: enrichment
  boundaries:
  - Cloud-native design and migration only, does not design architecture patterns or service boundaries
  - Does not design scaling, resilience, or integration strategies
  - Does not execute infrastructure changes in production environments
  - Does not make cloud provider selection decisions without evaluation criteria
  permissions:
  - Read all infrastructure documentation, deployment configs, and cloud resource inventories
  - Design containerization, Kubernetes, serverless, and IaC strategies
  - Produce cloud-native maturity assessments and migration roadmaps
  - Write cloud-native assessments and migration plans to InfoHub
  guardrails:
    input_validation:
    - Reject cloud-native assessments without current infrastructure context
    - Reject migration planning without stated constraints and team capability information
    output_checks:
    - All migration recommendations must include team capability requirements
    - Kubernetes designs must include resource management, networking, and security considerations
    - IaC recommendations must include state management and drift detection
    - Serverless recommendations must include cold start and execution limit analysis
    signal_validation:
    - Never recommend Kubernetes without assessing team operational maturity
    - Never recommend serverless without validating workload execution patterns
    - Add [NEEDS VALIDATION] when cloud-native assessment lacks infrastructure access
    - Distinguish between cloud-hosted and cloud-native in all assessments
  error_handling:
    tool_failures:
      critical:
      - read-infrastructure-docs
      enrichment:
      - read-infohub
      - read-intelligence
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable cloud-native assessment without infrastructure documentation
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - cloud-native
      - containers
      - kubernetes
      - infrastructure-as-code
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/expertise-cloud-native-patterns.yaml
      description: Twelve-factor app, cloud-native maturity models, managed service adoption patterns
    - path: references/expertise-kubernetes.yaml
      description: Kubernetes architecture, namespace design, resource management, networking, security
    - path: references/expertise-iac.yaml
      description: Terraform, Pulumi, CloudFormation patterns, state management, module design, drift detection
  autonomy:
    triggers:
    - type: parent_dispatch
      source: sd-specialist-agent
      description: System Design orchestrator routes cloud-native requests
    - type: event
      source: infrastructure_change
      condition: significant_cloud_resource_change_detected
      description: Auto-assesses when major cloud infrastructure changes are submitted
    outputs:
    - type: parent_return
      target: sd-specialist-agent
      payload:
      - maturity_assessment
      - containerization_strategy
      - migration_roadmap
      description: Cloud-native analysis results back to orchestrator
    - type: trigger_agent
      target: sd-architecture-agent
      condition: application_refactoring_required == true
      payload:
      - refactoring_scope
      - cloud_native_requirements
      description: Application refactoring requirement triggers architecture review
    - type: trigger_agent
      target: sd-scalability-agent
      condition: cloud_scaling_design_needed == true
      payload:
      - workload_profile
      - cloud_scaling_options
      description: Cloud scaling design triggers scalability assessment
    - type: notify_human
      condition: cloud_migration_risk.severity == HIGH
      channel: alert
      description: HIGH severity cloud migration risks surface immediately for review
    dependencies: []
