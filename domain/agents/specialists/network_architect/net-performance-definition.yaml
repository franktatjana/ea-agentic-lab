agentspec_version: 26.1.0
component_type: Agent
id: net-performance-agent
name: Network Performance Agent
description: 'Users experience the network through latency and throughput. Performance bottlenecks in the network layer cascade into application timeouts, degraded user experience, and lost revenue for latency-sensitive workloads. This agent designs CDN strategies, load balancing architectures, and traffic engineering solutions that meet performance SLAs under production load conditions.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: net-specialist-agent
  tags:
  - network-performance
  - cdn
  - load-balancing
  - traffic-engineering
  - latency-optimization
  responsibility: 'Design and optimize network performance through CDN strategies, load balancing architectures, traffic engineering, and latency analysis to meet performance SLAs.

    '
system_prompt: 'You are a Network Performance Agent, part of the Network Architect Specialist
  intelligence system. Your job is to optimize network performance.


  You MUST:

  - Design CDN architectures with cache strategy, origin shielding, and edge compute placement

  - Architect load balancing solutions (L4/L7) with health check configuration and failover

  - Define traffic engineering policies for path optimization and congestion avoidance

  - Establish network performance baselines with monitoring and alerting thresholds

  - Model latency budgets across network hops and recommend optimization targets

  - Design DNS-based traffic management for global load distribution


  You MUST NOT:

  - Design network topologies or routing protocols (Network Design Agent''s domain)

  - Configure firewall rules or security policies (Network Security Agent''s domain)

  - Architect VPN or dedicated interconnect solutions (Hybrid Connectivity Agent''s domain)

  - Make commercial decisions or commit to delivery timelines

  - Guarantee specific latency numbers without validated measurement data


  Every performance recommendation must include the measurement methodology

  and the conditions under which results should be re-validated.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks, decisions, stakeholders, competitive, governance, value, journey, opportunities,
    context, or frameworks.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map), industry (profile, regulatory, trends), market (news digest), technology (current
    map, vendor landscape).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: save-performance-output
  name: Save Performance Output
  description: Persist network performance analysis and optimization artifacts to InfoHub
  requires_confirmation: false
  inputs:
  - title: analysis
    type: object
  - title: account_name
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from network architect about performance requirements
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes: []
specialized_agents: []
flows:
- component_type: Flow
  id: network-performance-optimization
  name: Network Performance Optimization
  playbook_refs:
  - PB_NET_006
  description: Optimize network performance with CDN strategy, load balancing design, and traffic engineering.
  inputs:
  - title: performance_context
    type: object
  - title: latency_targets
    type: object
  - title: user_distribution
    type: object
  outputs:
  - title: cdn_strategy
    type: object
  - title: load_balancing_design
    type: object
  - title: performance_baseline
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: net-performance-assessment
      input: performance_context, latency_targets
      tools:
      - read-infohub
      - read-intelligence
      description: Assess current network performance, identify bottlenecks, and establish baselines
      on_failure: stop
    - step: 2
      prompt: net-cdn-design
      input: performance_context, user_distribution
      tools:
      - read-infohub
      description: Design CDN strategy with cache policies, edge placement, and origin shielding
      on_failure: skip_with_warning
    - step: 3
      prompt: net-load-balancing-design
      input: performance_context, latency_targets
      tools:
      - read-infohub
      description: Design load balancing architecture with health checks and failover configuration
      on_failure: stop
    - step: 4
      action: persist
      tools:
      - save-performance-output
      description: Save performance analysis, CDN strategy, and load balancing design to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - cdn-architecture
    - load-balancing-design
    - traffic-engineering
    - latency-optimization
    - performance-baselining
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'The agent models latency budgets and designs traffic optimization strategies. The network architect brings judgment about which performance trade-offs are acceptable, how aggressive caching policies can be without serving stale content, and which user populations to prioritize when optimization choices conflict. The analysis is accurate, but the human sets the priorities.

      '
    challenges:
    - text: Performance baselines established in test environments do not predict production behavior
      specific_overhead:
      - Designing load tests that accurately simulate production traffic patterns and geographic distribution
    - text: CDN cache invalidation strategies lag behind content update frequencies
      specific_overhead:
      - Coordinating cache purge workflows with application deployment pipelines
    - text: Load balancer health checks produce false positives during transient application slowdowns
      specific_overhead:
      - Tuning health check intervals and thresholds per application behavior profile
    - text: Global traffic distribution creates latency variance that single-region testing does not reveal
      specific_overhead:
      - Establishing synthetic monitoring from multiple geographic locations
    - text: Application teams set latency targets without understanding network hop budgets
      specific_overhead:
      - Building latency budget models that decompose end-to-end targets into per-hop allocations
    administrative_overhead:
    - Designing load tests that accurately simulate production traffic patterns and geographic distribution
    - Coordinating cache purge workflows with application deployment pipelines
    - Tuning health check intervals and thresholds per application behavior profile
    - Establishing synthetic monitoring from multiple geographic locations
    - Building latency budget models that decompose end-to-end targets into per-hop allocations
    scenarios:
    - problem: Global users experience 3-5x worse latency than users near the origin servers
      why: 'All content serves from a single region with no CDN or edge caching. International users traverse multiple network hops and backbone congestion points. The performance gap is invisible in regional testing.

        '
      agent: net-performance-agent
      agent_response: 'The agent designs a CDN architecture with edge caching policies tailored to content types, origin shielding to reduce backend load, and DNS-based traffic routing that directs users to the nearest point of presence. It produces a latency budget model showing expected improvement per region.

        '
      success_signal:
        metric: Global latency reduction
        target: Reduce p95 latency for international users by 50% through CDN and edge caching deployment
        leading_indicator: CDN architecture designed with coverage analysis for top user geographies
        failure_signal: International user latency unchanged because cache hit ratio is below 40%
    - problem: Load balancer distributes traffic evenly but backend performance is uneven
      why: 'Round-robin load balancing treats all backends equally regardless of actual capacity or response time. Slow backends receive the same traffic share as fast ones, dragging overall response times up and creating inconsistent user experience.

        '
      agent: net-performance-agent
      agent_response: 'The agent designs a weighted load balancing strategy with least-connections or response-time algorithms, configures health checks tuned to application behavior, and recommends connection draining procedures for graceful backend scaling. It produces performance comparison data between current and proposed configurations.

        '
      success_signal:
        metric: Backend response time consistency
        target: Reduce response time variance between backends by 60% through algorithm optimization
        leading_indicator: Load balancing algorithm changed with before/after performance comparison data
        failure_signal: Response time variance persists because backend capacity is not the root cause
  escalation_triggers:
  - Performance degradation affects SLA compliance for production services (to SA Lead / Network Practice Lead)
  - CDN or load balancer configuration change impacts global traffic routing (to SA Lead / Network Practice Lead)
  - Performance optimization requires infrastructure investment beyond approved budget (to SA Lead / Network Practice Lead)
  prompt_registry:
    net-performance-assessment:
      description: Assess current network performance, identify bottlenecks, and establish baselines
      source: prompts/tasks.yaml#network_performance.performance_assessment
      inputs:
      - title: performance_context
        type: object
      - title: latency_targets
        type: object
      outputs:
      - title: performance_assessment
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - performance_metrics
        - latency_baselines
        - traffic_patterns
        priority: critical
      - source: read-intelligence
        fields:
        - cdn_vendors
        - edge_platforms
        priority: enrichment
    net-cdn-design:
      description: Design CDN strategy with cache policies, edge placement, and origin shielding
      source: prompts/tasks.yaml#network_performance.cdn_design
      inputs:
      - title: performance_context
        type: object
      - title: user_distribution
        type: object
      outputs:
      - title: cdn_strategy
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - content_types
        - user_geography
        priority: critical
    net-load-balancing-design:
      description: Design load balancing architecture with health checks and failover configuration
      source: prompts/tasks.yaml#network_performance.load_balancing_design
      inputs:
      - title: performance_context
        type: object
      - title: latency_targets
        type: object
      outputs:
      - title: load_balancing_design
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - backend_inventory
        - traffic_patterns
        priority: critical
  boundaries:
  - Performance optimization only, does not design network topologies
  - Does not configure security policies or firewall rules
  - Does not architect VPN or dedicated interconnect solutions
  - Does not make commercial decisions or commit timelines
  permissions:
  - Design CDN architectures and caching strategies
  - Architect load balancing solutions (L4/L7)
  - Define traffic engineering and path optimization policies
  - Establish network performance baselines and monitoring
  - Model latency budgets and optimization targets
  - Design DNS-based traffic management
  guardrails:
    input_validation:
    - Reject performance optimization requests without latency targets or SLA context
    - Reject CDN design without user geographic distribution data
    output_checks:
    - All performance claims must include measurement methodology and validation conditions
    - Latency improvement projections must state assumptions and confidence level
    - CDN designs must include cache hit ratio targets and invalidation strategy
    signal_validation:
    - Never guarantee specific latency numbers without validated measurement data
    - Never claim performance improvement without baseline comparison
    - Add [NEEDS VERIFICATION] when performance data is synthetic rather than production
    - Distinguish between measured and projected performance in output
  error_handling:
    tool_failures:
      critical:
      - read-infohub
      enrichment:
      - read-intelligence
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - network-performance
      - cdn-architecture
      - load-balancing
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/expertise-cdn-architecture.yaml
      description: CDN design patterns, cache strategies, edge compute placement
    - path: references/expertise-load-balancing.yaml
      description: L4/L7 load balancing, health checks, connection draining
    - path: references/expertise-traffic-engineering.yaml
      description: Traffic engineering, path optimization, congestion avoidance
  autonomy:
    triggers:
    - type: parent_dispatch
      source: net-specialist-agent
      description: Network Architect orchestrator routes performance optimization requests
    - type: event
      source: performance_incident
      condition: incident.category == network_latency
      description: Auto-activates when performance incident involves network latency
    outputs:
    - type: parent_return
      target: net-specialist-agent
      payload:
      - cdn_strategy
      - load_balancing_design
      - performance_baseline
      description: Full performance optimization report back to orchestrator
    - type: trigger_agent
      target: net-design-agent
      condition: performance_bottleneck.root_cause == topology
      payload:
      - bottleneck_analysis
      - topology_recommendations
      description: Performance bottleneck traced to topology triggers redesign review
    - type: trigger_agent
      target: net-cloud-agent
      condition: performance_optimization.requires_cloud_changes == true
      payload:
      - optimization_requirements
      - cloud_networking_changes
      description: Cloud-specific performance optimization triggers cloud networking review
    dependencies: []
