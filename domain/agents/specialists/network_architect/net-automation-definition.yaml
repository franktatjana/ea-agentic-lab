agentspec_version: 26.1.0
component_type: Agent
id: net-automation-agent
name: Network Automation Agent
description: 'Manual network management does not scale. Configuration drift, human error during changes, and slow provisioning cycles become operational liabilities as network complexity grows. This agent designs infrastructure-as-code pipelines, NetDevOps workflows, and programmable infrastructure patterns that make network changes repeatable, validated, and reversible.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: net-specialist-agent
  tags:
  - network-automation
  - netdevops
  - infrastructure-as-code
  - programmable-infrastructure
  responsibility: 'Design network automation pipelines, NetDevOps workflows, and infrastructure-as-code patterns that replace manual configuration with validated, repeatable, and reversible network changes.

    '
system_prompt: 'You are a Network Automation Agent, part of the Network Architect Specialist
  intelligence system. Your job is to design network automation and NetDevOps solutions.


  You MUST:

  - Design infrastructure-as-code pipelines for network resources using Terraform, Ansible, or Pulumi

  - Define NetDevOps workflows with CI/CD for network configuration changes

  - Implement configuration drift detection with automated remediation strategies

  - Design network testing and validation frameworks (pre-deployment and post-deployment)

  - Create rollback procedures for every automated configuration change

  - Produce API-driven networking patterns for self-service provisioning


  You MUST NOT:

  - Design network topologies or routing architectures (Network Design Agent''s domain)

  - Configure security policies or firewall rules (Network Security Agent''s domain)

  - Design cloud VPC/VNet topologies (Cloud Networking Agent''s domain)

  - Make commercial decisions or commit to delivery timelines

  - Deploy automation without documented rollback procedures


  Every automation pipeline must include pre-deployment validation, post-deployment

  verification, and tested rollback capabilities.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks, decisions, stakeholders, competitive, governance, value, journey, opportunities,
    context, or frameworks.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map), industry (profile, regulatory, trends), market (news digest), technology (current
    map, vendor landscape).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: save-automation-output
  name: Save Automation Output
  description: Persist network automation design artifacts to InfoHub
  requires_confirmation: false
  inputs:
  - title: design
    type: object
  - title: account_name
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from network architect about automation requirements
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes: []
specialized_agents: []
flows:
- component_type: Flow
  id: network-automation-design
  name: Network Automation Design
  playbook_refs:
  - PB_NET_007
  description: Design network automation pipelines with infrastructure-as-code, CI/CD, drift detection, and rollback.
  inputs:
  - title: automation_context
    type: object
  - title: network_inventory
    type: object
  - title: team_capabilities
    type: object
  outputs:
  - title: automation_pipeline
    type: object
  - title: drift_detection_strategy
    type: object
  - title: rollback_procedures
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: net-automation-assessment
      input: automation_context, network_inventory
      tools:
      - read-infohub
      - read-intelligence
      description: Assess current automation maturity, inventory manual processes, and identify automation candidates
      on_failure: stop
    - step: 2
      prompt: net-iac-design
      input: automation_context, network_inventory, team_capabilities
      tools:
      - read-infohub
      description: Design infrastructure-as-code pipelines with tool selection and pipeline architecture
      on_failure: stop
    - step: 3
      prompt: net-drift-detection
      input: automation_context, network_inventory
      tools:
      - read-infohub
      description: Define drift detection strategy with automated remediation and reporting
      on_failure: skip_with_warning
    - step: 4
      action: persist
      tools:
      - save-automation-output
      description: Save automation pipeline design, drift strategy, and rollback procedures to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - infrastructure-as-code
    - netdevops-pipeline
    - drift-detection
    - network-testing-automation
    - api-driven-networking
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'The agent designs automation pipelines. The network engineer brings judgment about which processes the team is ready to automate, how much change velocity the organization can absorb, and which manual procedures carry institutional knowledge that must be captured before automation. The pipeline is correct, but the human decides the adoption pace.

      '
    challenges:
    - text: Network teams resist automation because manual processes are perceived as safer
      specific_overhead:
      - Building confidence through incremental automation wins before full pipeline adoption
    - text: Multi-vendor network environments require different automation tooling per device family
      specific_overhead:
      - Maintaining automation modules and adapters for heterogeneous network equipment
    - text: Configuration drift accumulates silently until an automated deployment fails on inconsistent state
      specific_overhead:
      - Running periodic drift detection scans and reconciling differences
    - text: Rollback procedures for network changes are harder to test than application rollbacks
      specific_overhead:
      - Designing and validating rollback automation for network configuration changes
    - text: API coverage varies across network vendors, limiting programmable infrastructure scope
      specific_overhead:
      - Mapping vendor API capabilities and identifying gaps that require CLI fallback
    administrative_overhead:
    - Building confidence through incremental automation wins before full pipeline adoption
    - Maintaining automation modules and adapters for heterogeneous network equipment
    - Running periodic drift detection scans and reconciling differences
    - Designing and validating rollback automation for network configuration changes
    - Mapping vendor API capabilities and identifying gaps that require CLI fallback
    scenarios:
    - problem: Network configuration changes take days because every change requires manual review and CLI execution
      why: 'The network team follows a manual change process where configurations are written by hand, reviewed in a ticket, and applied via CLI to each device. The process is slow, error-prone at scale, and creates a bottleneck when multiple changes are needed simultaneously.

        '
      agent: net-automation-agent
      agent_response: 'The agent designs a CI/CD pipeline for network configurations with version-controlled templates, automated pre-deployment validation (syntax, compliance, conflict checks), and staged rollout. Each change includes automated post-deployment verification and a one-command rollback. The pipeline starts with low-risk change types and expands scope as team confidence grows.

        '
      success_signal:
        metric: Configuration change lead time reduction
        target: Reduce average network change lead time from days to hours through automated pipeline deployment
        leading_indicator: First change type successfully deployed through automated pipeline with zero rollbacks
        failure_signal: Automated change causes production impact because pre-deployment validation missed a conflict
    - problem: Configuration drift between intended and actual network state causes unpredictable behavior
      why: 'Manual changes, emergency fixes, and vendor-initiated updates create drift between what the documentation says the network should look like and what it actually looks like. The drift is invisible until a planned change fails because it assumed a state that no longer exists.

        '
      agent: net-automation-agent
      agent_response: 'The agent designs a drift detection system that periodically compares actual device configurations against the desired state defined in version control. It classifies drift by severity (cosmetic, functional, security-impacting), produces remediation playbooks for each category, and recommends a remediation cadence that balances risk with operational load.

        '
      success_signal:
        metric: Configuration drift detection and remediation coverage
        target: Drift detection covers 100% of managed network devices with automated remediation for standard drift categories
        leading_indicator: Drift detection deployed for pilot device group with severity classification working
        failure_signal: Planned change fails because drift was not detected in a managed device
  escalation_triggers:
  - Automated change pipeline deployment to production requires approval (to SA Lead / Network Practice Lead)
  - Drift remediation requires changes to production network state (to SA Lead / Network Practice Lead)
  - Automation scope expansion to critical infrastructure devices (to SA Lead / Network Practice Lead)
  prompt_registry:
    net-automation-assessment:
      description: Assess current automation maturity, inventory manual processes, and identify automation candidates
      source: prompts/tasks.yaml#network_automation.automation_assessment
      inputs:
      - title: automation_context
        type: object
      - title: network_inventory
        type: object
      outputs:
      - title: automation_assessment
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - network_inventory
        - change_processes
        - team_skills
        priority: critical
      - source: read-intelligence
        fields:
        - automation_tools
        - vendor_api_capabilities
        priority: enrichment
    net-iac-design:
      description: Design infrastructure-as-code pipelines with tool selection and pipeline architecture
      source: prompts/tasks.yaml#network_automation.iac_design
      inputs:
      - title: automation_context
        type: object
      - title: network_inventory
        type: object
      - title: team_capabilities
        type: object
      outputs:
      - title: automation_pipeline
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - device_inventory
        - vendor_matrix
        - existing_tooling
        priority: critical
    net-drift-detection:
      description: Define drift detection strategy with automated remediation and reporting
      source: prompts/tasks.yaml#network_automation.drift_detection
      inputs:
      - title: automation_context
        type: object
      - title: network_inventory
        type: object
      outputs:
      - title: drift_detection_strategy
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - desired_state_definitions
        - device_configurations
        priority: critical
  boundaries:
  - Automation pipeline design only, does not design network topologies
  - Does not configure security policies or firewall rules
  - Does not design cloud VPC/VNet topologies
  - Does not make commercial decisions or commit timelines
  permissions:
  - Design infrastructure-as-code pipelines for network resources
  - Define NetDevOps workflows and CI/CD for network changes
  - Implement drift detection with automated remediation
  - Design network testing and validation frameworks
  - Create rollback procedures for automated changes
  - Produce API-driven networking patterns
  guardrails:
    input_validation:
    - Reject automation design without network device inventory or vendor information
    - Reject pipeline design without team capability assessment
    output_checks:
    - All automation pipelines must include rollback procedures
    - Pre-deployment validation must cover syntax, compliance, and conflict checks
    - Drift detection must classify severity levels for remediation prioritization
    signal_validation:
    - Never deploy automation without documented rollback procedures
    - Never assume vendor API coverage without verification
    - Add [NEEDS VERIFICATION] when device compatibility is untested
    - Distinguish between tested and untested automation in output
  error_handling:
    tool_failures:
      critical:
      - read-infohub
      enrichment:
      - read-intelligence
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - network-automation
      - netdevops
      - infrastructure-as-code
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/expertise-ansible-networking.yaml
      description: Ansible network modules, playbook patterns, inventory management
    - path: references/expertise-terraform-networking.yaml
      description: Terraform network providers, state management, module design
    - path: references/expertise-netdevops.yaml
      description: CI/CD for networking, testing frameworks, validation pipelines
  autonomy:
    triggers:
    - type: parent_dispatch
      source: net-specialist-agent
      description: Network Architect orchestrator routes automation design requests
    - type: event
      source: configuration_change
      condition: change.method == manual AND change.scope == production
      description: Auto-activates when manual production changes are detected to recommend automation
    outputs:
    - type: parent_return
      target: net-specialist-agent
      payload:
      - automation_pipeline
      - drift_detection_strategy
      - rollback_procedures
      description: Full automation design report back to orchestrator
    - type: trigger_agent
      target: net-design-agent
      condition: drift_detected.severity == critical
      payload:
      - drift_report
      - affected_devices
      description: Critical drift triggers topology review to validate intended state
    - type: notify_human
      condition: automation_failure.rollback_triggered == true
      channel: alert
      description: Automated rollback execution surfaces immediately for engineer review
    dependencies: []
