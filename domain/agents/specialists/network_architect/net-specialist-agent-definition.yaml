    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: net-design-agent
- component_type: ClientTool
  id: invoke-net-security
  name: Invoke Network Security Agent
  description: Route to Network Security Agent for firewall rules, WAF configuration, DDoS protection, or zero-trust networking
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: security_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: net-security-agent
- component_type: ClientTool
  id: invoke-net-cloud
  name: Invoke Cloud Networking Agent
  description: Route to Cloud Networking Agent for VPC/VNet design, peering, transit gateways, or cloud-native networking
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: cloud_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: net-cloud-agent
- component_type: ClientTool
  id: invoke-net-hybrid
  name: Invoke Hybrid Connectivity Agent
  description: Route to Hybrid Connectivity Agent for VPN tunnels, Direct Connect, ExpressRoute, SD-WAN, or site-to-site connectivity
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: connectivity_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: net-hybrid-agent
- component_type: ClientTool
  id: invoke-net-performance
  name: Invoke Network Performance Agent
  description: Route to Network Performance Agent for CDN configuration, load balancing, traffic engineering, or latency optimization
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: performance_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: net-performance-agent
- component_type: ClientTool
  id: invoke-net-automation
  name: Invoke Network Automation Agent
  description: Route to Network Automation Agent for infrastructure-as-code, NetDevOps, or programmable infrastructure
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: automation_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: net-automation-agent
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks,
    decisions, stakeholders, competitive, governance, value, journey, opportunities, context, or frameworks.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map),
    industry (profile, regulatory, trends), market (news digest), technology (current map, vendor landscape).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: net-specialist-agent-proactive
  name: Network Architect Specialist (Proactive)
  description: 'Proactive mode: scans for network risks, capacity bottlenecks, and security gaps without prompting'
  agent:
    $component_ref: net-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan network configurations for risks, capacity
      constraints, and security gaps. Surface insights before being asked. Prioritize timeliness over depth. Keep outputs
      concise and action-oriented. Flag anything that needs immediate attention.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: net-specialist-agent-analytical
  name: Network Architect Specialist (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and network architecture patterns'
  agent:
    $component_ref: net-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Provide comprehensive analysis with full evidence trails.
      Synthesize across multiple network domains. Prioritize accuracy and defensibility over speed. Include confidence levels
      and caveats where appropriate.

      '
    human_in_the_loop: true
flows: []
