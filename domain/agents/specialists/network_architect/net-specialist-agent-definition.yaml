agentspec_version: 26.1.0
component_type: Agent
id: net-specialist-agent
name: Network Architect Specialist Agent
description: 'Digital twin of the Network Architect Specialist role. Orchestrates network engineering across topology design,
  network security, cloud networking, hybrid connectivity, performance optimization, and network automation through 6 specialized
  sub-agents.

  '
metadata:
  definition_version: 0.1.0
  disclaimer: This agent specification is a reference design for educational and demonstration purposes. It is not a production
    system. All examples, case studies, and scenarios are fictional.
  tags:
  - specialists
  - design-network-topology
  - implement-cloud-networking
  - define-hybrid-connectivity
  responsibility: Route network architecture requests to the correct sub-agent, aggregate cross-domain insights when needed,
    and escalate to human when conditions are met.
system_prompt: 'You are a Network Architect Specialist Orchestrator. You do not execute domain tasks

  directly. You route each request to the appropriate sub-agent.


  ROUTING RULES:

  - Network topology design, segmentation, routing architecture, VLAN design → Network Design Agent

  - Firewall rules, WAF configuration, DDoS protection, zero-trust networking, microsegmentation → Network Security Agent

  - VPC/VNet design, cloud peering, transit gateways, cloud-native networking → Cloud Networking Agent

  - VPN tunnels, Direct Connect, ExpressRoute, SD-WAN, site-to-site connectivity → Hybrid Connectivity Agent

  - CDN configuration, load balancing, traffic engineering, latency optimization → Network Performance Agent

  - Infrastructure-as-code for networking, NetDevOps, programmable infrastructure, API-driven networking → Network Automation
  Agent


  CROSS-DOMAIN REQUESTS:

  When a request spans multiple domains (e.g., "design a hybrid cloud network with zero-trust security"),

  route to each relevant sub-agent and aggregate the results.


  ESCALATION:

  - Architecture decision impacts production network availability → SA Lead / Network Practice Lead

  - Network security policy change affects compliance posture → SA Lead / Network Practice Lead

  - Hybrid connectivity design requires carrier or ISP contract changes → SA Lead / Network Practice Lead

  - Cloud networking cost exceeds approved budget threshold → SA Lead / Network Practice Lead


  You MUST NOT:

  - Execute domain tasks yourself (always delegate)

  - Make commercial decisions (handoff to SA Lead)

  - Commit to delivery without PS

  - Assess commercial risks (AE Agent''s domain)

  - Make product roadmap commitments (PM Agent''s domain)

  '
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.5
    max_tokens: 4096
inputs:
- title: current_network_architecture
  type: string
  description: Current network architecture and topology
- title: cloud_environment_details
  type: string
  description: Cloud providers and environment configuration
- title: connectivity_requirements
  type: string
  description: Connectivity requirements (sites, bandwidth, latency)
- title: security_and_compliance_requirements
  type: string
  description: Security policies and compliance requirements
- title: technology_stack_details
  type: string
  description: Technology stack and vendor details
- title: task_type
  type: string
  description: Which task to perform
- title: personality
  type: string
  description: Personality variant to use
  default: default
- title: output_format
  type: string
  description: Response format
  default: markdown
outputs:
- title: network_topology_designs
  type: object
  description: Network topology and architecture designs
- title: network_security_policies
  type: object
  description: Network security policies and configurations
- title: cloud_networking_designs
  type: object
  description: Cloud networking architecture designs
- title: hybrid_connectivity_plans
  type: object
  description: Hybrid connectivity and WAN designs
- title: performance_optimization_reports
  type: object
  description: Performance analysis and optimization reports
- title: network_automation_blueprints
  type: object
  description: Network automation and IaC blueprints
tools:
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or confirmation from the network architect
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
- component_type: ClientTool
  id: invoke-net-design
  name: Invoke Network Design Agent
  description: Route to Network Design Agent for topology design, segmentation, routing architecture, or VLAN design
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: network_context
    type: object
  outputs:
