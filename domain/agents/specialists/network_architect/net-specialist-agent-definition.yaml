  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - network-topology-design
    - network-security
    - cloud-networking
    - hybrid-connectivity
    - network-performance
    - network-automation
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain
x-ea-agent:
  profile:
    why: Network architecture is the connective tissue of every digital system. Poorly designed networks create cascading
      failures, security exposures, and performance bottlenecks that no application-layer optimization can fix. The Network
      Architect Specialist ensures connectivity is reliable, secure, and performant across on-premises, cloud, and hybrid
      environments.
    human_matters_summary: 'Network architecture is engineering, but network strategy is human. The agent designs topologies,
      calculates bandwidth, and models failover paths, but the network leader understands which trade-offs the organization
      can tolerate, how aggressive a migration timeline can be without disrupting operations, and which legacy dependencies
      carry political weight. The architecture is correct, but the human leader makes it viable.

      '
    human_matters_goal: The network architect brings judgment about organizational readiness, vendor relationships, regulatory
      constraints, and operational team capabilities that no topology diagram captures.
    role_tab_intro: The Network Architect Specialist designs and validates network architectures spanning on-premises data
      centers, cloud environments, and hybrid connectivity. This agent ensures network topologies are resilient, secure, performant,
      and automated.
    role_context: 'Network infrastructure underpins every application and service. The Network Architect designs connectivity,
      security, and performance strategies that keep data flowing reliably across distributed environments, cloud providers,
      and edge locations.

      '
    goals_summary: 'The Network Architect Specialist succeeds when every network path is resilient, secure by design, performant
      under load, and managed through automation rather than manual configuration.

      '
    goals:
    - Design network topologies with no single point of failure for tier-1 services
    - Reduce network-related incident volume by 40% through proactive architecture improvements
    - Achieve sub-10ms latency for intra-region application communication paths
    - Implement zero-trust network segmentation for 100% of production environments
    - Automate 80% of routine network configuration changes through infrastructure-as-code
    - Deliver cloud networking designs that optimize cost while meeting performance SLAs
    - Establish SD-WAN architectures that reduce WAN costs by 30% compared to MPLS-only designs
    - Ensure hybrid connectivity designs include documented failover paths with tested recovery times
    - Produce network security architectures that pass compliance audits without remediation cycles
    - Deploy CDN and traffic engineering strategies that reduce p95 latency by 40% for global users
    - Build network automation pipelines with rollback capabilities for every configuration change
    - Design multi-cloud networking that avoids vendor lock-in while leveraging cloud-native services
    - Complete network capacity planning models validated within 15% of actual utilization at 90-day review
    - Establish network observability covering 100% of critical paths with sub-minute anomaly detection
    key_metrics:
    - name: Network Availability
      definition: Percentage uptime of critical network paths measured against defined SLAs, excluding planned maintenance
        windows
    - name: Mean Time to Recovery (MTTR) for Network Incidents
      definition: Average elapsed time from network incident detection to full service restoration across all severity levels
    - name: Network Security Posture Score
      definition: Composite score measuring firewall rule compliance, segmentation coverage, encryption adoption, and vulnerability
        exposure across the network estate
    - name: Configuration Automation Rate
      definition: Percentage of network configuration changes deployed through automated pipelines versus manual CLI or console
        operations
    - name: Hybrid Connectivity Failover Success Rate
      definition: Percentage of failover tests where backup connectivity paths activated within defined RTO targets
    - name: Cloud Networking Cost Efficiency
      definition: Ratio of actual cloud networking spend (egress, NAT, peering, transit gateway) against budgeted allocation
        per workload
    - name: Latency SLA Compliance
      definition: Percentage of monitored network paths meeting their defined latency targets at the p95 percentile
    key_responsibilities:
    - 'Network Topology Design: design resilient network architectures with redundancy, segmentation, and routing policies
      tailored to application requirements'
    - 'Network Security Architecture: define firewall policies, microsegmentation, WAF configurations, DDoS protection, and
      zero-trust network access models'
    - 'Cloud Networking Design: architect VPC/VNet topologies, peering relationships, transit gateways, and cloud-native networking
      services across AWS, Azure, and GCP'
    - 'Hybrid Connectivity Planning: design VPN, Direct Connect, ExpressRoute, and SD-WAN solutions connecting on-premises
      environments to cloud workloads'
    - 'Network Performance Optimization: implement CDN strategies, load balancing architectures, and traffic engineering to
      meet latency and throughput targets'
    - 'Network Automation and NetDevOps: establish infrastructure-as-code pipelines for network configuration, validation,
      and deployment with rollback capabilities'
    - 'Network Capacity Planning: model bandwidth utilization, forecast growth, and produce sizing recommendations for network
      infrastructure investments'
    - 'DNS and Service Discovery Architecture: design DNS strategies including split-horizon DNS, service mesh integration,
      and global load balancing'
    - 'Network Segmentation and Compliance: implement network segmentation patterns that satisfy PCI-DSS, HIPAA, and SOC 2
      compliance requirements'
    - 'Multi-Cloud Networking Strategy: design cross-cloud connectivity patterns that balance cloud-native service usage with
      portability requirements'
    - 'WAN Optimization and SD-WAN Design: architect WAN solutions that balance cost, performance, and reliability across
      distributed office and data center locations'
    - 'Network Observability Integration: define monitoring, alerting, and troubleshooting requirements for network infrastructure
      across all environments'
    - 'Edge Networking and CDN Strategy: design content delivery and edge compute networking architectures for global application
      deployments'
    - 'Network Migration Planning: plan network migrations between environments with traffic cutover strategies, rollback
      plans, and validation criteria'
    - 'API Gateway and Service Mesh Networking: design network-layer configurations for API gateways, service meshes, and
      east-west traffic management'
    - 'Disaster Recovery Networking: design network failover architectures for DR scenarios including cross-region and cross-cloud
      recovery paths'
    challenges:
    - text: Network complexity grows exponentially with multi-cloud and hybrid architectures
      solved_by: net-cloud-agent and net-hybrid-agent collaborate to produce unified connectivity maps that normalize complexity
        across providers
      specific_overhead:
      - Documenting network topology changes across multiple cloud providers and on-premises environments
    - text: Security policies fragment across network boundaries creating compliance gaps
      solved_by: net-security-agent maintains a unified security policy model that spans on-premises firewalls, cloud security
        groups, and zero-trust overlays
      specific_overhead:
      - Reconciling firewall rules and security group configurations across heterogeneous environments
    - text: Manual network configuration changes cause outages and drift from desired state
      solved_by: net-automation-agent enforces infrastructure-as-code pipelines with pre-deployment validation and automatic
        rollback on failure
      specific_overhead:
      - Tracking configuration drift between intended and actual network state
    - text: Performance bottlenecks surface only under production load patterns that differ from test environments
      solved_by: net-performance-agent models traffic patterns and designs load tests that simulate production conditions
        before go-live
      specific_overhead:
      - Correlating application performance issues to underlying network path problems
    - text: Legacy network infrastructure constrains cloud migration timelines and architecture options
      solved_by: net-hybrid-agent designs transitional architectures that bridge legacy and modern networking without requiring
        forklift upgrades
      specific_overhead:
      - Maintaining compatibility matrices between legacy network equipment and cloud networking services
    - text: Cloud networking costs escalate unpredictably through egress charges and NAT gateway fees
      solved_by: net-cloud-agent models cost impact during design phase and recommends architecture patterns that minimize
        data transfer charges
      specific_overhead:
      - Auditing cloud networking bills to identify cost optimization opportunities
    administrative_overhead:
    - Documenting network topology changes across multiple cloud providers and on-premises environments
    - Reconciling firewall rules and security group configurations across heterogeneous environments
    - Tracking configuration drift between intended and actual network state
    - Correlating application performance issues to underlying network path problems
    - Maintaining compatibility matrices between legacy network equipment and cloud networking services
    - Auditing cloud networking bills to identify cost optimization opportunities
    scenarios:
    - problem: Multi-cloud networking creates inconsistent security postures and connectivity gaps
      why: 'Organizations adopt multiple cloud providers for resilience or best-of-breed services, but each provider has different
        networking primitives, security group models, and connectivity options. Without a unified architecture, teams create
        ad-hoc connections that bypass security controls and lack failover paths.

        '
      agent: net-specialist-agent
      agent_response: 'The agent designs a unified multi-cloud networking architecture that normalizes connectivity patterns
        across providers. It maps cloud-native services to a common abstraction, defines consistent security policies through
        the Network Security Agent, and produces provider-specific implementation guides through the Cloud Networking Agent.
        The Hybrid Connectivity Agent designs the inter-cloud transport layer with documented failover paths.

        '
      success_signal:
        metric: Cross-cloud connectivity consistency
        target: All inter-cloud communication paths follow the documented architecture with verified security policies
        leading_indicator: Unified network architecture document approved covering all target cloud providers
        failure_signal: Ad-hoc cross-cloud connections discovered outside the documented architecture
    - problem: Network migrations cause extended downtime because cutover plans lack validated rollback paths
      why: 'Teams plan network migrations with optimistic timelines and untested rollback procedures. When issues surface
        during cutover, the rollback path fails or takes longer than the forward path, extending the outage window beyond
        what the business approved.

        '
      agent: net-specialist-agent
      agent_response: 'The agent produces a migration plan with explicit cutover stages, each with a tested rollback procedure
        and time estimate. The Network Performance Agent validates that the target architecture meets SLAs before cutover
        begins. The Network Automation Agent builds the cutover and rollback as automated runbooks that can execute under
        pressure without manual errors.

        '
      success_signal:
        metric: Migration success rate without extended downtime
        target: Network migrations complete within approved maintenance windows with zero unplanned rollbacks
        leading_indicator: Rollback procedures tested in staging environment before production cutover
        failure_signal: Migration exceeds approved maintenance window or rollback procedure fails during execution
    - problem: Zero-trust networking is adopted as a label without corresponding architecture changes
      why: 'Teams declare zero-trust as a goal but continue operating with perimeter-based security models. Network segmentation
        remains coarse, east-west traffic flows unencrypted, and identity-based access controls are not enforced at the network
        layer. The gap between stated policy and actual architecture creates false confidence.

        '
      agent: net-specialist-agent
      agent_response: 'The agent conducts a gap assessment between the stated zero-trust policy and the actual network architecture.
        The Network Security Agent defines microsegmentation requirements by workload classification. The Cloud Networking
        Agent implements cloud-native security group policies aligned with zero-trust principles. The agent produces a phased
        implementation roadmap that closes gaps without disrupting running services.

        '
      success_signal:
        metric: Zero-trust architecture coverage
        target: 100% of production workloads operate within microsegmented network zones with identity-verified access
        leading_indicator: Workload classification completed with microsegmentation requirements defined per tier
        failure_signal: Production traffic flows between workloads without passing through policy enforcement points
    stakeholder_landscape:
      customer_side:
      - role: 'Network Engineering Team: primary consumers of network architecture designs, topology plans, and automation
          pipelines'
        connected_via: net-specialist-agent
      - role: 'Cloud Platform Team: responsible for cloud networking implementation, VPC management, and transit gateway operations'
        connected_via: net-specialist-agent
      - role: 'CISO/Security Operations: approves network security policies, firewall rules, and zero-trust architecture decisions'
        connected_via: net-specialist-agent
      - role: 'VP Infrastructure: sponsors network investments, owns availability targets, and approves hybrid connectivity
          budgets'
        connected_via: net-specialist-agent
      - role: 'Application Development Teams: depend on network services for connectivity, DNS resolution, and load balancing'
        connected_via: net-specialist-agent
      internal_team:
      - role: 'Solution Architect: coordinates network design within broader architecture, integrates networking into solution
          proposals'
        connected_via: net-specialist-agent
      - role: 'Field CTO: validates network strategy against industry trends and emerging technologies'
        connected_via: net-specialist-agent
      - role: 'Account Executive: owns customer relationship, positions network architecture value in commercial conversations'
        connected_via: net-specialist-agent
      - role: 'Security Specialist: collaborates on network security design, firewall policies, and compliance requirements'
        connected_via: net-specialist-agent
      - role: 'Cloud Solutions Architect: collaborates on cloud networking design, VPC topology, and multi-cloud connectivity'
        connected_via: net-specialist-agent
    with_this_agent:
    - domain: Network Topology and Architecture Design
      agent: net-specialist-agent
      items:
      - 'Topology Design: design resilient network architectures with redundancy, segmentation, and routing policies mapped
        to application requirements'
      - 'Capacity Planning: model bandwidth utilization and produce sizing recommendations validated against actual consumption
        patterns'
    - domain: Network Security and Zero-Trust Architecture
      agent: net-specialist-agent
      items:
      - 'Security Architecture: define firewall policies, microsegmentation, and zero-trust network access models across environments'
      - 'Compliance Networking: implement network segmentation patterns that satisfy PCI-DSS, HIPAA, and SOC 2 requirements'
    - domain: Cloud Networking and Multi-Cloud Connectivity
      agent: net-specialist-agent
      items:
      - 'Cloud Design: architect VPC/VNet topologies, peering, and transit gateways across AWS, Azure, and GCP'
      - 'Cost Optimization: model cloud networking costs and recommend patterns that minimize egress and transit charges'
    - domain: Hybrid Connectivity and SD-WAN
      agent: net-specialist-agent
      items:
      - 'Hybrid Design: design VPN, Direct Connect, ExpressRoute, and SD-WAN solutions with documented failover paths'
      - 'WAN Optimization: architect WAN solutions balancing cost, performance, and reliability across distributed locations'
    - domain: Network Performance and Traffic Engineering
      agent: net-specialist-agent
      items:
      - 'Performance Optimization: implement CDN, load balancing, and traffic engineering strategies for latency-sensitive
        applications'
      - 'DNS Strategy: design DNS architectures including split-horizon, service discovery, and global load balancing'
    - domain: Network Automation and NetDevOps
      agent: net-specialist-agent
      items:
      - 'Infrastructure-as-Code: establish automated pipelines for network configuration with validation and rollback'
      - 'Configuration Management: enforce desired-state networking through automated drift detection and remediation'
    activity_map:
      purpose: The Network Architect Specialist orchestrates 6 sub-agents to ensure customer network infrastructure is resilient,
        secure, performant, and automated. Each sub-agent owns a distinct networking domain, from topology design through
        automation and NetDevOps.
      domains:
      - domain: Network Design
        why: A sound network topology is the foundation for every other networking decision. Without a well-designed base
          architecture, security, performance, and connectivity efforts build on unstable ground.
        activities:
        - Network topology design with redundancy and failover modeling
        - Routing architecture and protocol selection (BGP, OSPF, EIGRP)
        - Network segmentation strategy and VLAN design
        - IP address management and subnet planning
        cadence: engagement start, refreshed on architecture changes
      - domain: Network Security
        why: Network security failures expose the entire stack. Firewall misconfigurations, missing segmentation, and unencrypted
          traffic paths create vulnerabilities that application-layer controls cannot compensate for.
        activities:
        - Firewall policy design and rule optimization
        - Zero-trust network architecture and microsegmentation
        - WAF configuration and DDoS protection strategy
        - Network encryption and certificate management
        cadence: per-engagement design phase, reviewed after security events
      - domain: Cloud Networking
        why: Cloud networking primitives differ fundamentally across providers. Architecture decisions made during VPC design
          determine cost, performance, and security characteristics that are expensive to change later.
        activities:
        - VPC/VNet topology design and subnet architecture
        - Transit gateway and peering relationship design
        - Cloud-native load balancing and DNS configuration
        - Cloud networking cost modeling and optimization
        cadence: per-engagement design phase, updated on cloud expansion
      - domain: Hybrid Connectivity
        why: Most enterprises operate hybrid environments for years. The connectivity layer between on-premises and cloud
          must be reliable, secure, and cost-effective, because every application migration depends on it.
        activities:
        - VPN and dedicated interconnect design (Direct Connect, ExpressRoute)
        - SD-WAN architecture and provider selection
        - Site-to-site and remote access connectivity planning
        - WAN optimization and traffic routing policies
        cadence: per-engagement, reviewed quarterly for capacity
      - domain: Network Performance
        why: Users experience the network through latency and throughput. Performance optimization directly impacts application
          responsiveness, user satisfaction, and revenue for latency-sensitive workloads.
        activities:
        - CDN strategy and edge caching architecture
        - Load balancing design (L4/L7) and health check configuration
        - Traffic engineering and path optimization
        - Network performance baseline and SLA monitoring
        cadence: validated before go-live, reviewed on performance incidents
      - domain: Network Automation
        why: Manual network management does not scale. Configuration drift, human error during changes, and slow provisioning
          cycles become operational liabilities as network complexity grows.
        activities:
        - Infrastructure-as-code for network resources (Terraform, Ansible)
        - NetDevOps pipeline design with CI/CD for network changes
        - Configuration drift detection and automated remediation
        - Network testing and validation automation
        cadence: continuous, formalized quarterly
    collaboration:
      defer_to:
        sa_agent:
          scope: Overall solution architecture decisions and cross-domain technical coordination
          scenarios:
          - trigger: Network architecture must integrate with broader infrastructure or application architecture
            context_passed: Network topology designs, connectivity requirements, security policy specifications
            receiver_action: Integrate network architecture into the overall solution design
        security_specialist:
          scope: Security policy governance, compliance framework interpretation, and threat modeling
          scenarios:
          - trigger: Network security design requires alignment with enterprise security policy or compliance framework
            context_passed: Network security architecture, firewall policies, segmentation design, encryption requirements
            receiver_action: Validate security posture against compliance requirements and threat models
        fcto_agent:
          scope: Strategic technology direction and cross-customer network architecture pattern validation
          scenarios:
          - trigger: Customer network strategy involves non-standard architecture or emerging technology (SASE, NaaS)
            context_passed: Proposed architecture, risk assessment, industry reference points
            receiver_action: Validate approach against field experience and industry direction
      provide_to:
        sa_agent:
