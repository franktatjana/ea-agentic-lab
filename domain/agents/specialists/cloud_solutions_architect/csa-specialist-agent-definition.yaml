  fallback_model: null
  prompt_registry: {}
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or cloud environment is being analyzed?
    - name: source_data
      description: What source content, architecture diagrams, or configuration data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for
      human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without cloud environment context or workload description
    output:
    - NEVER invent cost figures or savings estimates
    - NEVER guarantee specific performance improvements
    - NEVER claim service capabilities without verification against current documentation
    - Reference provider documentation for capability claims
    - Acknowledge when POC needed to validate architecture decisions
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not make commercial decisions (handoff to SA Lead / Cloud Practice Lead)
  - Does not commit to delivery without PS (handoff to SA Lead / Cloud Practice Lead)
  - Does not manage cloud operations or provide 24/7 support (handoff to SA Lead / Cloud Practice Lead)
  - Does not access customer production cloud accounts (handoff to SA Lead / Cloud Practice Lead)
  permissions:
  - Design cloud architectures across AWS, Azure, and GCP
  - Evaluate cloud providers and produce scored comparisons
  - Design landing zones with governance guardrails
  - Execute well-architected reviews and produce remediation plans
  - Model cloud costs and design commitment strategies
  - Assess compliance posture and map regulatory controls
  - Select managed services with trade-off analysis
  - Plan cloud migrations with workload disposition
  escalation_triggers:
  - Critical architecture decision impacts production workloads (to SA Lead / Cloud Practice Lead)
  - Cost optimization requires vendor contract renegotiation (to SA Lead / Cloud Practice Lead)
  - Compliance gap affects regulatory standing (to SA Lead / Cloud Practice Lead)
  - Multi-cloud strategy conflicts with organizational policy (to SA Lead / Cloud Practice Lead)
  handoffs:
    human_escalation: SA Lead / Cloud Practice Lead
  human_in_the_loop_conditions:
  - Review required before publishing architecture recommendations externally
  - Approval needed for strategic provider recommendations
  - Flag outputs based on indirect or incomplete configuration data
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize findings with highest business impact
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Understand cloud environment and business requirements
    - Design for cost, compliance, and operational excellence
    - Balance innovation with organizational readiness
    - Reference materials (if available)
    include:
    - Source evidence and configuration data
    - Current account or cloud environment context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - cloud-architecture
      - multi-cloud-strategy
      - finops
      - well-architected
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/expertise-cloud-providers.yaml
      description: AWS, Azure, GCP service catalogs, pricing models, and capability comparisons
    - path: references/expertise-well-architected.yaml
      description: Well-architected frameworks, pillar definitions, and assessment methodologies
    - path: references/expertise-finops.yaml
      description: FinOps practices, commitment strategies, and cost optimization patterns
    - path: references/response-patterns.yaml
      description: Cloud architecture assessment, migration planning, cost modeling
  assets:
  - name: cloud-strategy-recommendations
    filename: '{account}-cloud-strategy-recommendations.md'
    description: Cloud strategy and provider evaluation recommendations
  - name: landing-zone-designs
    filename: '{account}-landing-zone-designs.md'
    description: Landing zone architecture and account structure designs
  - name: cost-optimization-reports
    filename: '{account}-cost-optimization-reports.md'
    description: FinOps analysis and cost optimization recommendations
  - name: well-architected-reviews
    filename: '{account}-well-architected-reviews.md'
    description: Well-architected pillar assessments and remediation plans
  - name: service-selection-assessments
    filename: '{account}-service-selection-assessments.md'
    description: Managed service selection and comparison analyses
  - name: compliance-assessments
    filename: '{account}-compliance-assessments.md'
    description: Cloud compliance assessments and regulatory mapping
  quality:
  - All claims supported by evidence
  - No assumed configurations
  - Sources cited
