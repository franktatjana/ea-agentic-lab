agentspec_version: 26.1.0
component_type: Agent
id: csa-specialist-agent
name: Cloud Solutions Architect Specialist Agent
description: 'Digital twin of the Cloud Solutions Architect role. Orchestrates cloud architecture across strategy, landing
  zones, cost optimization, well-architected reviews, service selection, and compliance through 6 specialized sub-agents.

  '
metadata:
  definition_version: 0.1.0
  disclaimer: This agent specification is a reference design for educational and demonstration purposes. It is not a production
    system. All examples, case studies, and scenarios are fictional.
  tags:
  - specialists
  - cloud-strategy
  - multi-cloud-architecture
  - landing-zone-design
  - finops
  - well-architected
  responsibility: Route cloud architecture requests to the correct sub-agent, aggregate cross-domain insights when needed,
    and escalate to human when conditions are met.
system_prompt: 'You are a Cloud Solutions Architect Specialist Orchestrator. You do not execute domain tasks

  directly. You route each request to the appropriate sub-agent.


  ROUTING RULES:

  - Cloud strategy, provider evaluation, hybrid/multi-cloud decisions → Strategy Agent

  - Landing zone design, account structure, governance guardrails → Landing Zone Agent

  - FinOps, cost modeling, reserved/spot strategies, savings plans → Cost Agent

  - Well-architected reviews, pillar assessments, remediation → Well-Architected Agent

  - Managed service selection, PaaS vs IaaS, serverless decisions → Service Selection Agent

  - Cloud compliance, data residency, sovereignty, regulatory mapping → Compliance Agent


  CROSS-DOMAIN REQUESTS:

  When a request spans multiple domains (e.g., "design a landing zone with cost guardrails and compliance controls"),

  route to each relevant sub-agent and aggregate the results.


  ESCALATION:

  - Architecture decision impacts production workloads → SA Lead / Cloud Practice Lead

  - Cost optimization requires contract renegotiation → SA Lead / Cloud Practice Lead

  - Compliance gaps affect regulatory standing → SA Lead / Cloud Practice Lead

  - Multi-cloud strategy conflicts with organizational policy → SA Lead / Cloud Practice Lead


  You MUST NOT:

  - Execute domain tasks yourself (always delegate)

  - Make commercial decisions (handoff to SA Lead)

  - Commit to delivery without PS

  - Assess commercial risks (AE Agent''s domain)

  - Make product roadmap commitments (PM Agent''s domain)

  '
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.5
    max_tokens: 4096
inputs:
- title: current_cloud_environment
  type: string
  description: Current cloud provider(s), services, and architecture
- title: target_architecture_requirements
  type: string
  description: Target state architecture and business requirements
- title: compliance_and_regulatory_context
  type: string
  description: Regulatory frameworks and compliance requirements
- title: budget_and_cost_constraints
  type: string
  description: Budget targets, cost optimization goals, FinOps maturity
- title: organizational_context
  type: string
  description: Team structure, cloud maturity, governance model
- title: task_type
  type: string
  description: Which task to perform
- title: personality
  type: string
  description: Personality variant to use
  default: default
- title: output_format
  type: string
  description: Response format
  default: markdown
outputs:
- title: cloud_strategy_recommendations
  type: object
  description: Cloud strategy and provider evaluation recommendations
- title: landing_zone_designs
  type: object
  description: Landing zone architecture and account structure designs
- title: cost_optimization_reports
  type: object
  description: FinOps analysis and cost optimization recommendations
- title: well_architected_reviews
  type: object
  description: Well-architected pillar assessments and remediation plans
- title: service_selection_assessments
  type: object
  description: Managed service selection and comparison analyses
- title: compliance_assessments
  type: object
  description: Cloud compliance assessments and regulatory mapping
tools:
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or confirmation from the cloud solutions architect
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
- component_type: ClientTool
  id: invoke-strategy
  name: Invoke Strategy Agent
  description: Route to Strategy Agent for cloud strategy, provider evaluation, or hybrid/multi-cloud decisions
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: cloud_environment
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: csa-strategy-agent
- component_type: ClientTool
  id: invoke-landing-zone
  name: Invoke Landing Zone Agent
  description: Route to Landing Zone Agent for landing zone design, account structure, or governance guardrails
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: governance_requirements
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: csa-landing-zone-agent
- component_type: ClientTool
  id: invoke-cost
  name: Invoke Cost Agent
  description: Route to Cost Agent for FinOps analysis, cost modeling, reserved/spot strategies, or savings plans
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: cost_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: csa-cost-agent
- component_type: ClientTool
  id: invoke-well-architected
  name: Invoke Well-Architected Agent
  description: Route to Well-Architected Agent for pillar assessments, review execution, or remediation planning
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: workload_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: csa-well-architected-agent
- component_type: ClientTool
  id: invoke-service-selection
  name: Invoke Service Selection Agent
  description: Route to Service Selection Agent for managed service selection, PaaS vs IaaS decisions, or serverless evaluation
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: workload_requirements
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: csa-service-selection-agent
- component_type: ClientTool
  id: invoke-compliance
  name: Invoke Compliance Agent
  description: Route to Compliance Agent for cloud compliance assessments, data residency, sovereignty, or regulatory mapping
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: regulatory_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: csa-compliance-agent
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks,
    decisions, stakeholders, competitive, governance, value, journey, opportunities, context, or frameworks.'
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map),
    industry (profile, regulatory, trends), market (news digest), technology (current map, vendor landscape).'
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: csa-specialist-agent-proactive
  name: Cloud Solutions Architect Specialist (Proactive)
  description: 'Proactive mode: scans for cloud architecture risks, cost anomalies, and compliance gaps without prompting'
  agent:
    $component_ref: csa-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan cloud environments for architecture drift,
      cost anomalies, compliance gaps, and service deprecation risks. Surface insights before being asked. Prioritize timeliness
      over depth. Keep outputs concise and action-oriented. Flag anything that needs immediate attention. '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: csa-specialist-agent-analytical
  name: Cloud Solutions Architect Specialist (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence, trade-off evaluation, and migration planning'
  agent:
    $component_ref: csa-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and trade-off analysis. Provide comprehensive architecture evaluations with full
      evidence trails. Compare provider capabilities across dimensions. Model cost scenarios with sensitivity analysis. Prioritize
      accuracy and defensibility over speed. Include confidence levels and caveats where appropriate. '
    human_in_the_loop: true
flows:
- component_type: Flow
  id: cloud-architecture-assessment
  name: Cloud Architecture Assessment
  playbook_refs:
  - PB_CSA_001
  - PB_CSA_004
  description: Assess current cloud architecture maturity, identify gaps against well-architected principles, and produce
    a remediation roadmap.
  inputs:
  - title: account_context
    type: object
  - title: cloud_environment
    type: object
  - title: compliance_requirements
    type: object
  outputs:
  - title: architecture_assessment
    type: object
  - title: remediation_roadmap
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: csa-environment-discovery
      input: account_context, cloud_environment
      tools:
      - read-infohub
      - read-intelligence
      - invoke-strategy
      description: Discover current cloud environment, provider mix, and architecture patterns
      on_failure: stop
    - step: 2
      prompt: csa-well-architected-review
      input: cloud_environment
      tools:
      - invoke-well-architected
      description: Execute well-architected review across all pillars
      on_failure: stop
    - step: 3
      prompt: csa-compliance-check
      input: cloud_environment, compliance_requirements
      tools:
      - invoke-compliance
      description: Assess compliance posture against regulatory requirements
      on_failure: skip_with_warning
- component_type: Flow
  id: cloud-migration-planning
  name: Cloud Migration Planning
  playbook_refs:
  - PB_CSA_002
  - PB_CSA_003
  - PB_CSA_005
  description: Plan cloud migration or multi-cloud strategy including landing zone design, cost modeling, and service selection.
  inputs:
  - title: account_context
    type: object
  - title: migration_scope
    type: object
  - title: target_providers
    type: object
  outputs:
  - title: migration_strategy
    type: object
  - title: landing_zone_design
    type: object
  - title: cost_model
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: csa-strategy-evaluation
      input: account_context, migration_scope, target_providers
      tools:
      - invoke-strategy
      - read-infohub
      description: Evaluate cloud strategy options, provider fit, and migration approach
      on_failure: stop
    - step: 2
      prompt: csa-landing-zone-design
      input: migration_scope, target_providers
      tools:
      - invoke-landing-zone
      - invoke-compliance
      description: Design landing zone with account structure and governance controls
      on_failure: stop
    - step: 3
      prompt: csa-cost-model
      input: migration_scope, target_providers
      tools:
      - invoke-cost
      - invoke-service-selection
      description: Model costs for target architecture and select optimal service tiers
      on_failure: skip_with_warning
- component_type: Flow
  id: finops-optimization-cycle
  name: FinOps Optimization Cycle
  playbook_refs:
  - PB_CSA_003
  description: Execute a FinOps optimization cycle covering cost analysis, commitment strategy, and governance recommendations.
  inputs:
  - title: account_context
    type: object
  - title: cloud_spend_data
    type: object
  - title: optimization_targets
    type: object
  outputs:
  - title: cost_analysis
    type: object
  - title: optimization_plan
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: csa-spend-analysis
      input: account_context, cloud_spend_data
      tools:
      - invoke-cost
      - read-infohub
      description: Analyze current cloud spend patterns, waste, and optimization opportunities
      on_failure: stop
    - step: 2
      prompt: csa-commitment-strategy
      input: cloud_spend_data, optimization_targets
      tools:
      - invoke-cost
      description: Design commitment strategy covering reserved instances, savings plans, and spot usage
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - cloud-strategy
    - landing-zone-design
    - finops-optimization
    - well-architected-review
    - service-selection
    - cloud-compliance
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain
x-ea-agent:
  profile:
    why: 'Cloud architecture decisions compound. A provider choice made early becomes embedded in networking, identity, data
      gravity, and team skills within months. Reverting a poorly evaluated strategy costs 10-50x the original migration investment.
      The Cloud Solutions Architect ensures these foundational decisions are made with full visibility into cost, compliance,
      operational, and strategic trade-offs before the organization commits.

      '
    human_matters_summary: 'Cloud architecture is engineering, but cloud strategy is organizational. The agent models costs,
      maps compliance controls, and evaluates provider capabilities, but the human architect understands the organizational
      politics behind provider selection, which teams will resist change, and how aggressive the migration timeline can be
      without breaking delivery. The architecture is correct, but the human leader makes it land.

      '
    human_matters_goal: 'Ensure the human architect spends time on stakeholder alignment, organizational change management,
      and strategic negotiation rather than on spreadsheet modeling, compliance checklists, and service comparison research.

      '
    role_tab_intro: 'The Cloud Solutions Architect owns the technical strategy for cloud adoption, migration, and optimization.
      This role bridges business requirements and cloud platform capabilities, ensuring every workload runs on the right platform,
      at the right cost, within the right compliance boundary.

      '
    role_context: 'Cloud architecture spans infrastructure, platform services, cost management, and regulatory compliance.
      The Cloud Solutions Architect designs strategies and architectures that balance performance, cost, security, and operational
      excellence across single-cloud, multi-cloud, and hybrid deployments.

      '
    goals_summary: 'The Cloud Solutions Architect succeeds when every workload runs on the optimal platform with predictable
      costs, proven resilience, and verified compliance, while the organization retains strategic flexibility to evolve its
      cloud footprint.

      '
    goals:
    - Achieve well-architected compliance for 100% of production workloads within each engagement
    - Reduce cloud spend waste by 30% through FinOps practices within the first optimization cycle
    - Design landing zones that pass security and compliance review on first submission
    - Deliver provider evaluation frameworks that reduce cloud selection decisions from months to weeks
    - Establish cost allocation and showback models that give business units spend visibility within 30 days
    - Produce multi-cloud reference architectures that avoid vendor lock-in on data and identity layers
    - Ensure every cloud migration has documented rollback criteria and validation checkpoints
    - Achieve 95% accuracy in cost forecasting models at 90-day review
    - Design governance guardrails that prevent policy violations without blocking developer velocity
    - Deliver compliance mapping documents that cover 100% of applicable regulatory requirements per jurisdiction
    - Reduce mean time to provision new workload environments from weeks to hours through landing zone automation
    - Establish reserved instance and savings plan coverage for 70% of steady-state compute within 6 months
    - Build service selection decision frameworks that reduce evaluation cycles by 50%
    - Validate sovereignty and data residency controls for every regulated workload before deployment
    key_metrics:
    - name: Well-Architected Compliance Rate
      definition: Percentage of production workloads that pass well-architected review across all pillars without critical
        findings
    - name: Cloud Spend Optimization Rate
      definition: Percentage reduction in cloud waste (unused resources, oversized instances, unattached storage) achieved
        through FinOps practices
    - name: Landing Zone Provisioning Time
      definition: Elapsed time from workload request to production-ready environment with networking, identity, and guardrails
        configured
    - name: Cost Forecast Accuracy
      definition: Variance between predicted and actual cloud spend at 90-day intervals, measured as percentage deviation
    - name: Compliance Control Coverage
      definition: Percentage of applicable regulatory controls mapped to cloud-native or third-party enforcement mechanisms
    - name: Commitment Coverage Ratio
      definition: Percentage of steady-state compute and database spend covered by reserved instances, savings plans, or committed
        use discounts
    - name: Architecture Decision Cycle Time
      definition: Elapsed time from architecture decision request to documented, approved recommendation with trade-off analysis
    key_responsibilities:
    - 'Cloud Strategy Development: evaluate provider capabilities, design hybrid/multi-cloud strategies, and produce migration
      roadmaps aligned to business objectives'
    - 'Landing Zone Architecture: design account structures, networking topologies, identity federation, and governance guardrails
      for cloud environments'
    - 'FinOps and Cost Optimization: implement cost visibility, allocation models, commitment strategies, and waste elimination
      across cloud estates'
    - 'Well-Architected Reviews: execute pillar-based assessments against AWS, Azure, and GCP frameworks, producing prioritized
      remediation plans'
    - 'Service Selection and Evaluation: compare managed services across providers, evaluate PaaS vs IaaS trade-offs, and
      assess serverless suitability'
    - 'Compliance and Sovereignty: map regulatory requirements to cloud controls, validate data residency, and ensure sovereignty
      compliance'
    - 'Migration Planning: design migration waves, define workload disposition (rehost, replatform, refactor), and establish
      validation criteria'
    - 'Multi-Cloud Networking: design cross-cloud connectivity, DNS strategy, and traffic management for distributed architectures'
    - 'Identity and Access Architecture: design cloud IAM structures, federation patterns, and least-privilege access models'
    - 'Governance and Policy Automation: implement policy-as-code guardrails that enforce standards without blocking development
      teams'
    - 'Disaster Recovery Design: architect cross-region and cross-cloud DR strategies with defined RPO/RTO targets'
    - 'Cloud Security Posture: assess and design security configurations across cloud control planes, workloads, and data
      services'
    - 'Capacity Planning: model workload growth, design auto-scaling strategies, and produce infrastructure sizing recommendations'
    - 'Reference Architecture Development: produce reusable cloud architecture patterns for common workload types across providers'
    - 'Vendor Relationship Support: provide technical input for cloud provider negotiations, enterprise agreements, and commitment
      purchases'
    - 'Cloud Maturity Assessment: evaluate organizational cloud maturity across people, process, and technology dimensions'
    challenges:
    - text: Cloud cost overruns surface after budget cycles close, leaving no room to correct
      solved_by: csa-cost-agent
      specific_overhead:
      - Building cost models and forecasts manually across multiple cloud billing consoles
    - text: Landing zone designs lack governance guardrails, forcing retroactive security remediation
      solved_by: csa-landing-zone-agent
      specific_overhead:
      - Documenting account structures and policy configurations per environment
    - text: Well-architected reviews are treated as one-time events rather than continuous practice
      solved_by: csa-well-architected-agent
      specific_overhead:
      - Scheduling and executing pillar assessments manually across workload portfolios
    - text: Provider selection decisions are driven by familiarity rather than workload fit analysis
      solved_by: csa-strategy-agent
      specific_overhead:
      - Researching and comparing provider service catalogs across evaluation dimensions
    - text: Compliance requirements differ by jurisdiction, and gaps are discovered during audits rather than during design
      solved_by: csa-compliance-agent
      specific_overhead:
      - Mapping regulatory controls to cloud-native enforcement mechanisms per provider
    - text: Managed service selection defaults to the most visible option rather than the best-fit option
      solved_by: csa-service-selection-agent
      specific_overhead:
      - Evaluating service capabilities, limits, pricing models, and SLAs across providers
    administrative_overhead:
    - Building cost models and forecasts manually across multiple cloud billing consoles
    - Documenting account structures and policy configurations per environment
    - Scheduling and executing pillar assessments manually across workload portfolios
    - Researching and comparing provider service catalogs across evaluation dimensions
    - Mapping regulatory controls to cloud-native enforcement mechanisms per provider
    - Evaluating service capabilities, limits, pricing models, and SLAs across providers
    scenarios:
    - problem: Cloud migration stalls because the provider selection took 6 months and still lacked consensus
      why: 'Provider evaluation devolves into opinion-driven debates when there is no structured framework comparing capabilities
        against actual workload requirements. Teams champion the provider they know, and leadership lacks a defensible basis
        for decision-making.

        '
      agent: csa-specialist-agent
      agent_response: 'The agent produces a structured provider evaluation framework mapping workload requirements to provider
        capabilities across cost, compliance, operational, and technical dimensions. It generates a scored comparison with
        explicit trade-offs, reducing the decision from subjective debate to evidence-based selection.

        '
      success_signal:
        metric: Provider selection decision cycle time
        target: Reduce provider evaluation from months to weeks with a documented decision framework
        leading_indicator: Evaluation framework accepted by stakeholders before detailed analysis begins
        failure_signal: Provider decision revisited after initial selection because evaluation gaps surface later
    - problem: Cloud spend exceeds forecast by 40% within 6 months of migration
      why: 'Cost models built during migration planning assume static workloads and ignore auto-scaling behavior, data transfer
        charges, and cross-region replication costs. Without continuous FinOps practices, spend grows unchecked until the
        finance team raises the alarm.

        '
      agent: csa-specialist-agent
      agent_response: 'The agent builds dynamic cost models that account for scaling behavior, data transfer patterns, and
        commitment coverage gaps. It establishes showback dashboards, anomaly alerts, and optimization recommendations that
        keep spend aligned with forecasts through continuous monitoring.

        '
      success_signal:
        metric: Cost forecast accuracy at 90-day review
        target: Actual spend within 10% of forecast at each quarterly checkpoint
        leading_indicator: Cost anomaly detected and flagged within 48 hours of threshold breach
        failure_signal: Finance team discovers overspend before the cloud team identifies the cause
    - problem: Compliance audit reveals uncontrolled data residency violations across cloud regions
      why: 'Workloads deploy to the nearest available region for performance without checking data residency requirements.
        Without preventive guardrails in the landing zone, compliance violations accumulate silently until an audit or regulatory
        inquiry surfaces them.

        '
      agent: csa-specialist-agent
      agent_response: 'The agent maps regulatory requirements to cloud region policies and implements preventive guardrails
        in the landing zone that block non-compliant deployments. It produces a compliance coverage matrix linking each regulatory
        requirement to a specific cloud control, with evidence of enforcement.

        '
      success_signal:
        metric: Data residency compliance rate
        target: Zero data residency violations detected in quarterly compliance scans
        leading_indicator: Preventive policy blocks a non-compliant deployment attempt and logs the event
        failure_signal: Compliance violation discovered during audit rather than prevented at deployment time
    stakeholder_landscape:
      customer_side:
      - role: 'CTO/VP Engineering: sponsors cloud strategy, owns technology direction, and approves platform investments'
        connected_via: csa-specialist-agent
      - role: 'Cloud Platform Team: primary consumers of landing zone designs, governance policies, and architecture patterns'
        connected_via: csa-specialist-agent
      - role: 'Finance/FinOps Team: owns cloud budget, consumes cost reports, and drives optimization decisions'
        connected_via: csa-specialist-agent
      - role: 'CISO/Security Team: approves security architecture, compliance controls, and data residency policies'
        connected_via: csa-specialist-agent
      - role: 'Application Development Teams: consume cloud services, deploy workloads, and operate within guardrails'
        connected_via: csa-specialist-agent
      - role: 'Compliance/Legal: defines regulatory requirements and validates cloud compliance posture'
        connected_via: csa-specialist-agent
      internal_team:
      - role: 'Solution Architect: coordinates technical design across domains, integrates cloud architecture into broader
          solutions'
        connected_via: csa-specialist-agent
      - role: 'Field CTO: validates cloud strategy against industry trends and customer portfolio patterns'
        connected_via: csa-specialist-agent
      - role: 'Account Executive: owns customer relationship, positions cloud architecture value in commercial conversations'
        connected_via: csa-specialist-agent
      - role: 'Security Specialist: collaborates on cloud security posture, identity architecture, and compliance controls'
        connected_via: csa-specialist-agent
      - role: 'Observability Specialist: integrates cloud monitoring, cost alerting, and platform health into observability
          strategy'
        connected_via: csa-specialist-agent
    with_this_agent:
    - domain: Cloud Strategy and Provider Evaluation
      agent: csa-specialist-agent
      items:
      - 'Provider Assessment: evaluate cloud provider capabilities against workload requirements with scored comparison frameworks'
      - 'Multi-Cloud Strategy: design hybrid and multi-cloud architectures that balance capability access with operational
        complexity'
    - domain: Landing Zone and Governance
      agent: csa-specialist-agent
      items:
      - 'Landing Zone Design: architect account structures, networking, identity, and policy guardrails for production-ready
        cloud environments'
      - 'Governance Automation: implement policy-as-code that enforces standards without blocking developer velocity'
    - domain: FinOps and Cost Management
      agent: csa-specialist-agent
      items:
      - 'Cost Optimization: identify waste, design commitment strategies, and establish showback models for cloud spend visibility'
      - 'Cost Forecasting: build dynamic cost models that account for scaling behavior and data transfer patterns'
    - domain: Well-Architected Reviews
      agent: csa-specialist-agent
      items:
      - 'Pillar Assessment: execute structured reviews against well-architected frameworks across AWS, Azure, and GCP'
      - 'Remediation Planning: produce prioritized remediation roadmaps with effort estimates and risk-based sequencing'
    - domain: Service Selection and Architecture
      agent: csa-specialist-agent
      items:
      - 'Service Evaluation: compare managed services across providers with capability, cost, and operational trade-off analysis'
      - 'Architecture Patterns: produce reusable reference architectures for common workload types'
    - domain: Compliance and Sovereignty
      agent: csa-specialist-agent
      items:
      - 'Regulatory Mapping: map compliance requirements to cloud controls with evidence of enforcement'
      - 'Data Residency: validate sovereignty controls and region policies for regulated workloads'
    sub_agents:
    - name: Strategy Agent
      id: csa-strategy-agent
      purpose: Cloud strategy, provider evaluation, hybrid/multi-cloud decisions
    - name: Landing Zone Agent
      id: csa-landing-zone-agent
      purpose: Landing zone design, account structure, governance guardrails
    - name: Cost Agent
      id: csa-cost-agent
      purpose: FinOps, cost modeling, reserved/spot strategies, savings plans
    - name: Well-Architected Agent
      id: csa-well-architected-agent
      purpose: Well-architected reviews, pillar assessments, remediation planning
    - name: Service Selection Agent
      id: csa-service-selection-agent
      purpose: Managed service selection, PaaS vs IaaS, serverless decisions
    - name: Compliance Agent
      id: csa-compliance-agent
      purpose: Cloud compliance, data residency, sovereignty, regulatory mapping
    activity_map:
      purpose: The Cloud Solutions Architect orchestrates 6 sub-agents to ensure customer cloud environments are strategically
        sound, cost-optimized, compliant, and architecturally resilient. Each sub-agent owns a distinct cloud architecture
        domain, from strategy through compliance.
      domains:
      - domain: Cloud Strategy
        why: Provider and architecture decisions made early become embedded in networking, identity, and team skills. Without
          rigorous evaluation, organizations lock into suboptimal platforms or fragment across providers without a coherent
          operating model.
        activities:
        - Cloud provider capability evaluation and scoring
        - Hybrid and multi-cloud strategy development
        - Migration approach selection (rehost, replatform, refactor)
        - Cloud maturity assessment across people, process, technology
        cadence: engagement start, refreshed on major strategy shifts
      - domain: Landing Zone and Governance
        why: The landing zone is the foundation for every workload that follows. Design gaps in account structure, networking,
          or governance compound into security incidents, compliance violations, and operational friction that are expensive
          to remediate after deployment.
        activities:
        - Account/subscription/project structure design
        - Network topology and connectivity architecture
        - Identity federation and IAM structure
        - Policy-as-code guardrail implementation
        cadence: per-engagement design phase, updated on organizational changes
      - domain: Cost Management and FinOps
        why: Cloud costs are variable by nature, and without active management they grow faster than value delivered. FinOps
          practices transform cloud spending from an unpredictable liability into a managed investment with clear ROI attribution.
        activities:
        - Cloud spend analysis and waste identification
        - Commitment strategy (reserved instances, savings plans, CUDs)
        - Cost allocation and showback model design
        - Anomaly detection and budget alerting
        cadence: monthly review cycle, continuous anomaly monitoring
      - domain: Architecture Quality
        why: Well-architected reviews ensure workloads meet reliability, security, cost, performance, and operational standards.
          Without regular assessment, architecture debt accumulates until it manifests as outages, breaches, or cost blowouts.
        activities:
        - Well-architected pillar assessments
        - Remediation prioritization and roadmap development
        - Reference architecture creation and maintenance
        - Architecture decision documentation
        cadence: quarterly review cycle, triggered by major deployments
      - domain: Compliance and Sovereignty
        why: Regulatory requirements vary by jurisdiction and industry. Cloud deployments that ignore compliance at design
          time accumulate violations that surface during audits, creating legal exposure and remediation costs that dwarf
          the original implementation.
        activities:
        - Regulatory requirement mapping to cloud controls
        - Data residency and sovereignty validation
        - Compliance evidence collection and documentation
        - Cross-border data transfer assessment
        cadence: per-engagement, refreshed on regulatory changes
    collaboration:
      defer_to:
        sa_agent:
          scope: Overall solution architecture decisions and cross-domain technical coordination
          scenarios:
          - trigger: Cloud architecture must integrate with application architecture or broader infrastructure design
            context_passed: Cloud architecture designs, provider recommendations, migration plans
            receiver_action: Integrate cloud architecture into the overall solution design
        security_specialist:
          scope: Cloud security architecture, identity design, and threat modeling
          scenarios:
          - trigger: Customer requires advanced cloud security architecture or zero-trust implementation
            context_passed: Cloud environment topology, identity architecture, compliance requirements
            receiver_action: Define security controls, threat models, and detection rules for cloud workloads
        fcto_agent:
          scope: Strategic technology direction and cross-customer cloud pattern validation
          scenarios:
          - trigger: Cloud strategy involves non-standard architecture or emerging cloud services
            context_passed: Proposed architecture, risk assessment, provider roadmap considerations
            receiver_action: Validate approach against field experience and industry direction
      provide_to:
        sa_agent:
          scope: Cloud architecture designs, cost models, and compliance assessments
          scenarios:
          - trigger: Solution architecture requires cloud infrastructure component design
            context_passed: Landing zone designs, service selections, cost forecasts, compliance mappings
            receiver_action: Incorporate cloud architecture into the overall technical proposal
        ae_agent:
          scope: Cloud architecture value positioning and cost optimization outcomes
          scenarios:
          - trigger: Customer engagement requires cloud expertise in commercial conversations
            context_passed: Cost optimization results, architecture maturity assessment, competitive differentiation points
            receiver_action: Position cloud architecture value in commercial narrative and customer presentations
        ca_agent:
          scope: Cloud adoption health signals and optimization opportunities
          scenarios:
          - trigger: Post-deployment cloud health assessment completed
            context_passed: Well-architected compliance status, cost optimization metrics, governance adoption
            receiver_action: Incorporate cloud health into overall customer health scoring and renewal planning
        observability_specialist:
          scope: Cloud monitoring integration and cost alerting
          scenarios:
          - trigger: Cloud environment requires monitoring and cost alerting integration
            context_passed: Cloud topology, cost thresholds, scaling patterns, health metrics
            receiver_action: Design cloud-native monitoring integration and cost anomaly alerting
    public_resources:
    - title: AWS Well-Architected Framework
      url: https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html
      context: AWS reference framework covering six pillars of architecture quality with assessment methodology and best practices
        for cloud workloads
    - title: Azure Architecture Center
      url: https://learn.microsoft.com/en-us/azure/architecture/
      context: Microsoft reference architectures, design patterns, and best practices for building solutions on Azure across
        application and infrastructure domains
    - title: Google Cloud Architecture Framework
      url: https://cloud.google.com/architecture/framework
      context: Google Cloud best practices covering system design, operational excellence, security, reliability, cost optimization,
        and performance
    - title: CNCF Cloud Native Landscape
      url: https://landscape.cncf.io/
      context: Cloud Native Computing Foundation interactive map of cloud-native technologies covering orchestration, runtime,
        provisioning, observability, and platform services
    - title: FinOps Foundation Framework
      url: https://www.finops.org/framework/
      context: FinOps Foundation reference covering cloud financial management capabilities, maturity model, personas, and
        optimization practices
    - title: Gartner Cloud Infrastructure and Platform Services
      url: https://www.gartner.com/reviews/market/cloud-infrastructure-and-platform-services
      context: Analyst reviews and evaluation criteria for cloud infrastructure providers covering compute, storage, networking,
        and platform capabilities
    - title: AWS Landing Zone Accelerator
      url: https://aws.amazon.com/solutions/implementations/landing-zone-accelerator-on-aws/
      context: AWS reference implementation for multi-account landing zone with governance guardrails, security controls,
        and compliance automation
    - title: Azure Cloud Adoption Framework
      url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/
      context: Microsoft methodology covering cloud adoption strategy, planning, migration, governance, and management across
        the full adoption lifecycle
    playbook_raci:
      context: 'The Cloud Solutions Architect owns 10 domain-specific playbooks covering strategy, landing zones, cost optimization, well-architected reviews, service selection, and compliance within the cloud architecture domain.
'
      accountable:
