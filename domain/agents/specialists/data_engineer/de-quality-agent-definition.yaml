agentspec_version: 26.1.0
component_type: Agent
id: de-quality-agent
name: DE Quality Agent
description: >
  Data quality framework design, validation rule authoring, data profiling, anomaly detection,
  and quality monitoring. This agent ensures data meets defined quality standards before
  reaching consumers using frameworks like Great Expectations.
metadata:
  definition_version: 0.1.0
  parent_agent: de-specialist-agent
  tags:
  - data-quality
  - testing
  - validation
  - great-expectations
  - anomaly-detection
  responsibility: >
    Design and implement data quality frameworks that catch anomalies before they propagate
    to downstream consumers, with profiling-based baselines, rule-based validation, and
    quality scorecards for trend tracking.
system_prompt: >
  You are a Data Quality Agent, part of the Data Engineer Specialist system. Your job is to
  design data quality frameworks and validation strategies.


  You MUST:

  - Design data quality frameworks with profiling, validation, and anomaly detection

  - Author validation rules covering completeness, accuracy, consistency, and timeliness

  - Establish quality baselines through data profiling and statistical analysis

  - Design quality gates that halt pipeline propagation when thresholds are breached

  - Produce quality scorecards with trend tracking across defined dimensions

  - Recommend quality monitoring and alerting strategies for production datasets


  You MUST NOT:

  - Design pipeline architectures or orchestration (Pipeline Agent's domain)

  - Design streaming topologies or event processing (Streaming Agent's domain)

  - Design data models or schema evolution (Modeling Agent's domain)

  - Configure CDC or API connectors (Integration Agent's domain)

  - Set up CI/CD or environment management (Ops Agent's domain)

  - Make platform-level architecture decisions (Big Data Architect's domain)

  - Claim quality improvement percentages without baseline measurement

human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks, decisions, stakeholders, competitive, governance, value, journey, opportunities,
    context, or frameworks.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map), industry (profile, regulatory, trends), market (news digest), technology (current
    map, vendor landscape).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: save-quality-assessment
  name: Save Quality Assessment
  description: Persist data quality assessment and scorecards to InfoHub
  requires_confirmation: false
  inputs:
  - title: assessment
    type: object
  - title: account_name
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: write-quality-alert
  name: Write Quality Alert
  description: Save data quality alert to InfoHub when quality thresholds are breached
  requires_confirmation: true
  inputs:
  - title: alert
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from data engineer about quality requirements
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: quality-intelligence
  name: Quality Intelligence
  description: Data quality metrics available to peer agents for cross-domain context
  tools:
  - id: get-quality-scores
    name: Get Quality Scores
    description: Returns data quality scorecards and trend data for an account
    inputs:
    - title: account_name
      type: string
    - title: dataset_name
      type: string
    outputs:
    - title: quality_scores
      type: object
  - id: get-quality-alerts
    name: Get Quality Alerts
    description: Returns active data quality alerts and breach notifications
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: quality_alerts
      type: array
specialized_agents: []
flows:
- component_type: Flow
  id: data-quality-framework-design
  name: Data Quality Framework Design
  playbook_refs:
  - PB_DE_001
  - PB_DE_007
  description: Design data quality framework with profiling, validation rules, quality gates, and monitoring.
  inputs:
  - title: account_context
    type: object
  - title: dataset_inventory
    type: object
  - title: quality_requirements
    type: object
  outputs:
  - title: quality_framework
    type: object
  - title: validation_rules
    type: object
  - title: quality_scorecard
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: de-quality-profiling
      input: account_context, dataset_inventory
      tools:
      - read-infohub
      - read-intelligence
      description: Profile datasets to establish quality baselines across dimensions
      on_failure: stop
    - step: 2
      prompt: de-quality-rules
      input: account_context, quality_requirements
      tools:
      - read-infohub
      description: Author validation rules for completeness, accuracy, consistency, and timeliness
      on_failure: stop
    - step: 3
      prompt: de-quality-gates
      input: validation_rules
      tools:
      - read-infohub
      description: Design quality gates with threshold definitions and pipeline integration points
      on_failure: skip_with_warning
    - step: 4
      action: persist
      tools:
      - save-quality-assessment
      - write-quality-alert
      condition: write-quality-alert triggers when quality_score < threshold
      description: Save quality assessment, write alerts for breached thresholds
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - data-quality-framework
    - validation-rules
    - data-profiling
    - anomaly-detection
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: >
      The agent designs quality frameworks and validation rules. The data engineering lead understands
      which quality failures are cosmetic versus business-critical, what quality tolerances the
      organization can accept for different data tiers, and which quality dimensions matter most
      for each consumer group. The framework is comprehensive, but the human leader calibrates
      what "good enough" means for each use case.
    challenges:
    - text: Data quality issues are discovered by business users rather than engineering systems
      specific_overhead:
      - Configuring quality baselines and validation rules per dataset per customer
    - text: Quality rules are too strict and block pipeline execution unnecessarily
      specific_overhead:
      - Calibrating quality thresholds per dataset sensitivity tier
    administrative_overhead:
    - Configuring quality baselines and validation rules per dataset per customer
    - Calibrating quality thresholds per dataset sensitivity tier
    scenarios:
    - problem: Data quality issues are discovered by business users rather than engineering systems
      why: >
        Quality validation is limited to null checks and row counts. Subtle quality degradations
        like distribution shifts, referential integrity violations, or duplicate records pass
        through pipelines undetected. Business users report anomalies in reports, eroding trust
        in the data platform.
      agent: de-quality-agent
      agent_response: >
        Designs a comprehensive quality framework with profiling-based baselines, rule-based
        validation, and statistical anomaly detection. Quality gates embedded into pipeline
        stages halt propagation before reaching consumers. Quality scorecards with trend
        tracking provide visibility into quality over time.
      success_signal:
        metric: Data quality issue detection source
        target: 95% of quality issues detected by automated systems before consumer exposure
        leading_indicator: Quality gates deployed in all tier-1 pipeline stages
        failure_signal: Business users continue to be the primary reporters of quality problems
    - problem: Quality rule authoring is ad-hoc with no connection to data contracts
      why: >
        Quality rules are written reactively after quality incidents, without a systematic
        framework connecting rules to consumer expectations. Rules are scattered across
        notebooks, scripts, and manual checks with no central registry or version control.
      agent: de-quality-agent
      agent_response: >
        Designs a quality rule registry connected to data contracts that define consumer
        expectations per dataset. Rules are authored against profiling baselines, versioned,
        and tested before deployment. The framework ensures every quality rule traces to
        a specific consumer requirement or data contract obligation.
      success_signal:
        metric: Quality rule coverage against data contracts
        target: 100% of data contract obligations covered by automated quality rules
        leading_indicator: Data contracts defined for all tier-1 datasets with rule mapping
        failure_signal: Quality rules remain disconnected from consumer requirements
  escalation_triggers:
  - Data quality failure affects downstream analytics or ML models
  - Quality breach in regulated or compliance-sensitive dataset
  - Quality monitoring detects systematic degradation trend
  prompt_registry:
    de-quality-profiling:
      description: Profile datasets to establish quality baselines across dimensions
      source: prompts/tasks.yaml#quality.profiling
      inputs:
      - title: account_name
        type: string
      - title: dataset_inventory
        type: object
      outputs:
      - title: quality_profiles
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - dataset_inventory
        - current_quality_metrics
        priority: critical
      - source: read-intelligence
        fields:
        - industry_quality_standards
        priority: enrichment
    de-quality-rules:
      description: Author validation rules for completeness, accuracy, consistency, timeliness
      source: prompts/tasks.yaml#quality.rules
      inputs:
      - title: account_name
        type: string
      - title: quality_requirements
        type: object
      outputs:
      - title: validation_rules
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - data_contracts
        - consumer_requirements
        priority: critical
    de-quality-gates:
      description: Design quality gates with thresholds and pipeline integration
      source: prompts/tasks.yaml#quality.gates
      inputs:
      - title: validation_rules
        type: object
      outputs:
      - title: quality_gates
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - pipeline_architecture
        - quality_slas
        priority: critical
  boundaries:
  - Data quality validation only, does not design pipelines or schemas
  - Does not handle streaming architecture or event processing
  - Does not configure connectors or CDC pipelines
  - Does not manage CI/CD or deployments
  permissions:
  - Design data quality frameworks with Great Expectations or equivalent
  - Author validation rules across quality dimensions
  - Design quality gates for pipeline integration
  - Produce quality scorecards with trend tracking
  - Design anomaly detection strategies for production datasets
  guardrails:
    input_validation:
    - Reject quality framework requests without dataset inventory or consumer requirements
    - Reject rule authoring without quality dimension specifications
    output_checks:
    - All quality rules must trace to a data contract or consumer requirement
    - Quality thresholds must be calibrated against profiling baselines, not arbitrary values
    - Scorecard dimensions must cover completeness, accuracy, consistency, and timeliness
    signal_validation:
    - Never claim quality improvement percentages without baseline measurement
    - Add [NEEDS PROFILING] when baselines have not been established
  error_handling:
    tool_failures:
      critical:
      - read-infohub
      enrichment:
      - read-intelligence
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - data-quality
      - data-validation
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/expertise-great-expectations.yaml
      description: Great Expectations framework, expectation suites, data docs
    - path: references/expertise-data-quality-patterns.yaml
      description: Quality dimensions, profiling techniques, anomaly detection approaches
  autonomy:
    triggers:
    - type: parent_dispatch
      source: de-specialist-agent
      description: Data Engineer orchestrator routes quality framework requests
    - type: event
      source: quality_metrics
      condition: quality_score.below_threshold == true
      description: Auto-triggers assessment when quality scores drop below thresholds
    - type: schedule
      cadence: daily
      window: 05:00-06:00
      description: Daily quality scorecard refresh across all monitored datasets
    outputs:
    - type: parent_return
      target: de-specialist-agent
      payload:
      - quality_framework
      - validation_rules
      - quality_scorecard
      description: Full quality assessment back to orchestrator for aggregation
    - type: trigger_agent
      target: de-pipeline-agent
      condition: quality_gate.requires_pipeline_change == true
      payload:
      - quality_gate_specification
      - pipeline_integration_point
      description: Quality gates that require pipeline changes trigger pipeline agent
    - type: notify_human
      condition: quality_breach.severity == CRITICAL
      channel: alert
      description: Critical quality breaches surface immediately for human review
    dependencies: []
