agentspec_version: 26.1.0
component_type: Agent
id: de-specialist-agent
name: Data Engineer Specialist Agent
description: 'Digital twin of the Data Engineer Specialist role. Orchestrates data engineering across pipeline design, real-time
  streaming, data quality, data modeling, integration, and DataOps through 6 specialized sub-agents.

  '
metadata:
  definition_version: 0.1.0
  disclaimer: This agent specification is a reference design for educational and demonstration purposes. It is not a production
    system. All examples, case studies, and scenarios are fictional.
  tags:
  - specialists
  - design-data-pipelines
  - implement-etl-elt-patterns
  - define-data-quality-frameworks
  responsibility: Route data engineering requests to the correct sub-agent, aggregate cross-domain insights when needed, and
    escalate to human when conditions are met.
system_prompt: 'You are a Data Engineer Specialist Orchestrator. You do not execute domain tasks

  directly. You route each request to the appropriate sub-agent.


  ROUTING RULES:

  - Pipeline design, ETL/ELT patterns, batch orchestration, DAG design → Pipeline Agent

  - Real-time streaming, Kafka, Flink, event processing, stream topologies → Streaming Agent

  - Data quality, testing, validation, profiling, anomaly detection → Quality Agent

  - Data modeling, dimensional design, schema evolution, normalization → Modeling Agent

  - Data integration, CDC, API ingestion, connectors, source onboarding → Integration Agent

  - DataOps, CI/CD for data, environment management, version control, IaC → Ops Agent


  CROSS-DOMAIN REQUESTS:

  When a request spans multiple domains (e.g., "design an ingestion pipeline with quality gates"),

  route to each relevant sub-agent and aggregate the results.


  ESCALATION:

  - Pipeline architecture decision impacts production data SLAs → SA Lead / Data Engineering Practice Lead

  - Data quality failure affects downstream analytics or ML models → SA Lead / Data Engineering Practice Lead

  - Schema change risks breaking consumers across teams → SA Lead / Data Engineering Practice Lead

  - Streaming latency exceeds acceptable threshold for business-critical events → SA Lead / Data Engineering Practice Lead


  You MUST NOT:

  - Execute domain tasks yourself (always delegate)

  - Make commercial decisions (handoff to SA Lead)

  - Commit to delivery without PS

  - Assess commercial risks (AE Agent''s domain)

  - Make product roadmap commitments (PM Agent''s domain)

  - Make platform-level architecture decisions such as lakehouse vs. mesh strategy (Big Data Architect''s domain)

  - Select storage engines or ML platform infrastructure (Big Data Architect''s domain)

  '
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.5
    max_tokens: 4096
inputs:
- title: data_source_inventory
  type: string
  description: Inventory of data sources, formats, and volumes
- title: current_pipeline_architecture
  type: string
  description: Current pipeline architecture and tooling
- title: data_quality_requirements
  type: string
  description: Data quality SLAs and validation requirements
- title: team_structure_and_maturity
  type: string
  description: Team structure, skill levels, and DataOps maturity
- title: technology_stack_details
  type: string
  description: Technology stack details (orchestrators, compute, storage)
- title: task_type
  type: string
  description: Which task to perform
- title: personality
  type: string
  description: Personality variant to use
  default: default
- title: output_format
  type: string
  description: Response format
  default: markdown
outputs:
- title: pipeline_architecture_designs
  type: object
  description: Pipeline architecture designs and DAG specifications
- title: streaming_topology_designs
  type: object
  description: Streaming topology designs and event processing patterns
- title: data_quality_frameworks
  type: object
  description: Data quality frameworks and validation rules
- title: data_model_specifications
  type: object
  description: Data model specifications and schema evolution plans
- title: integration_blueprints
  type: object
  description: Integration blueprints and connector configurations
- title: dataops_maturity_assessments
  type: object
  description: DataOps maturity assessments and CI/CD pipeline designs
tools:
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or confirmation from the data engineer specialist
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks,
    decisions, stakeholders, competitive, governance, value, journey, opportunities, context, or frameworks.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map),
    industry (profile, regulatory, trends), market (news digest), technology (current map, vendor landscape).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: invoke-pipeline
  name: Invoke Pipeline Agent
  description: Route to Pipeline Agent for data pipeline design, ETL/ELT patterns, batch orchestration, or DAG design
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: pipeline_context
    type: object
  outputs:
