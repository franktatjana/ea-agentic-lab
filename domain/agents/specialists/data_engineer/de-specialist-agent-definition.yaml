    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: de-pipeline-agent
- component_type: ClientTool
  id: invoke-streaming
  name: Invoke Streaming Agent
  description: Route to Streaming Agent for real-time streaming, Kafka, Flink, event processing, or stream topology design
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: streaming_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: de-streaming-agent
- component_type: ClientTool
  id: invoke-quality
  name: Invoke Quality Agent
  description: Route to Quality Agent for data quality frameworks, testing, validation, profiling, or anomaly detection
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: quality_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: de-quality-agent
- component_type: ClientTool
  id: invoke-modeling
  name: Invoke Modeling Agent
  description: Route to Modeling Agent for data modeling, dimensional design, schema evolution, or normalization strategies
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: modeling_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: de-modeling-agent
- component_type: ClientTool
  id: invoke-integration
  name: Invoke Integration Agent
  description: Route to Integration Agent for data integration, CDC, API ingestion, connector configuration, or source onboarding
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: integration_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: de-integration-agent
- component_type: ClientTool
  id: invoke-ops
  name: Invoke Ops Agent
  description: Route to Ops Agent for DataOps practices, CI/CD for data, environment management, or version control strategies
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: ops_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: de-ops-agent
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: de-specialist-agent-proactive
  name: Data Engineer Specialist (Proactive)
  description: 'Proactive mode: scans for pipeline health signals and surfaces data quality insights without prompting'
  agent:
    $component_ref: de-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan pipeline metadata, data quality metrics,
      and schema registries continuously for relevant signals. Surface data freshness issues, quality degradation, and schema
      drift before they impact downstream consumers. Prioritize timeliness over depth. Keep outputs concise and action-oriented.
      Flag anything that needs immediate attention.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: de-specialist-agent-analytical
  name: Data Engineer Specialist (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: de-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Provide comprehensive analysis with full evidence trails
      across pipeline performance, data quality trends, and integration patterns. Synthesize across multiple data points.
      Prioritize accuracy and defensibility over speed. Include confidence levels and caveats where appropriate.

      '
    human_in_the_loop: true
flows: []
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - pipeline-design
    - streaming-architecture
    - data-quality
    - data-modeling
    - data-integration
    - dataops
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain
x-ea-agent:
  profile:
    why: 'Data pipelines are the circulatory system of modern analytics and ML. When pipelines break, dashboards go dark,
      models train on stale data, and business decisions rely on yesterday''s reality. The Data Engineer Specialist ensures
      data flows reliably from source to consumer, with quality gates at every stage, schema contracts that prevent breaking
      changes, and operational practices that treat data infrastructure with the same rigor as application infrastructure.
      This role is distinct from the Big Data Architect, who owns platform-level decisions (lakehouse vs. mesh, storage engine
      selection, ML platform infrastructure). The Data Engineer operates within the platform the architect designs, building
      and maintaining the pipelines, quality frameworks, and integration patterns that move data through the system.

      '
    human_matters_summary: 'Data engineering is automation; data trust is human. The agent designs pipelines, quality gates,
      and integration patterns, but the data engineering lead understands which data consumers matter most, what latency tolerances
      the business can accept, and which data quality failures are cosmetic versus business-critical. The architecture is
      correct, but the human leader makes it serve the right priorities.

      '
    human_matters_goal: 'The agent handles pipeline engineering, schema management, and quality automation. The human leader
      decides which pipelines are business-critical, negotiates SLAs with data consumers, and resolves organizational conflicts
      around data ownership and access.

      '
    role_tab_intro: 'The Data Engineer Specialist designs, builds, and operates data pipelines that move data from source
      systems to analytics and ML consumers. This role covers pipeline orchestration, real-time streaming, data quality enforcement,
      data modeling, integration patterns, and DataOps practices. It operates within platform boundaries set by the Big Data
      Architect, focusing on pipeline-level engineering rather than platform-level architecture.

      '
    role_context: 'Data infrastructure underpins analytics, reporting, and machine learning. The Data Engineer Specialist
      designs pipelines, streaming architectures, and quality frameworks that ensure data reaches consumers reliably, on time,
      and with verified quality.

      '
    goals_summary: 'The Data Engineer Specialist succeeds when data pipelines run reliably, data quality is measurable and
      enforced, schema changes propagate without breaking consumers, and DataOps practices bring software engineering discipline
      to data infrastructure.

      '
    goals:
    - Achieve 99.5% pipeline reliability for tier-1 data pipelines across each engagement
    - Reduce data freshness SLA violations by 70% through improved orchestration and monitoring
    - Implement data quality gates that catch 95% of data anomalies before they reach consumers
    - Deliver pipeline architectures that separate ingestion, transformation, and serving concerns cleanly
    - Establish schema evolution practices with backward compatibility validation for all shared datasets
    - Cut pipeline recovery time by 60% through idempotent designs and automated retry strategies
    - Implement end-to-end data lineage tracking across all production pipelines
    - Reduce manual data integration effort by 80% through standardized connector patterns
    - Establish CI/CD practices for data pipelines with automated testing in staging environments
    - Design streaming architectures that maintain sub-second latency for business-critical event streams
    - Produce data quality scorecards for every critical dataset with trend tracking over time
    - Deliver DataOps maturity assessments with actionable improvement roadmaps
    - Ensure every schema change goes through a compatibility check before deployment to production
    - Validate CDC implementations with zero-data-loss guarantees for regulated data sources
    key_metrics:
    - name: Pipeline Reliability Rate
      definition: Percentage of scheduled pipeline runs that complete successfully within their SLA window, measured across
        all tier-1 and tier-2 pipelines
    - name: Data Freshness SLA Compliance
      definition: Percentage of datasets that meet their defined freshness SLA, measured as the time between source event
        and consumer availability
    - name: Data Quality Score
      definition: Composite score across completeness, accuracy, consistency, and timeliness dimensions for each critical
        dataset, tracked over time
    - name: Schema Compatibility Rate
      definition: Percentage of schema changes that pass backward compatibility validation before deployment to production
    - name: Mean Time to Recovery (MTTR) for Pipelines
      definition: Average elapsed time between pipeline failure detection and successful recovery, including data backfill
        completion
    - name: Integration Onboarding Time
      definition: Average time from new data source request to production-ready ingestion pipeline, measured in business days
    - name: DataOps Maturity Score
      definition: Assessment score across CI/CD adoption, environment parity, automated testing, version control, and monitoring
        dimensions
    key_responsibilities:
    - 'Pipeline Architecture Design: design batch and micro-batch pipeline architectures with clear separation of ingestion,
      transformation, and serving layers'
    - 'ETL/ELT Pattern Selection: evaluate and recommend ETL vs. ELT approaches based on data volume, transformation complexity,
      and target platform capabilities'
    - 'Batch Orchestration: design DAG-based orchestration workflows with dependency management, retry logic, and SLA monitoring'
    - 'Real-Time Streaming Architecture: design event-driven streaming topologies using Kafka, Flink, or equivalent technologies
      for low-latency data delivery'
    - 'Data Quality Framework Design: implement quality validation frameworks with profiling, rule-based checks, anomaly detection,
      and quality scorecards'
    - 'Data Modeling and Schema Design: design dimensional models, normalize/denormalize schemas, and establish schema evolution
      practices with compatibility guarantees'
    - 'Change Data Capture Implementation: design CDC patterns for database replication with ordering guarantees and schema
      change propagation'
    - 'API and Connector Integration: design standardized integration patterns for REST APIs, file-based ingestion, and SaaS
      connector orchestration'
    - 'DataOps Practice Enablement: establish CI/CD pipelines for data infrastructure with automated testing, environment
      management, and version control'
    - 'Data Lineage and Observability: implement end-to-end lineage tracking and pipeline observability with alerting on freshness,
      volume, and quality drift'
    - 'Schema Registry Management: design schema registry workflows with compatibility validation, versioning, and consumer
      notification'
    - 'Pipeline Performance Optimization: identify and resolve pipeline bottlenecks through partitioning, parallelization,
      and resource tuning'
    - 'Environment Management: design staging and production environment parity for data pipelines with data subsetting and
      synthetic data strategies'
    - 'Disaster Recovery for Data Pipelines: design backup, recovery, and replay strategies that ensure data completeness
      after infrastructure failures'
    - 'Source System Onboarding: standardize the process for onboarding new data sources from requirements to production-ready
      ingestion'
    - 'Cost Optimization for Data Pipelines: identify compute and storage inefficiencies in pipeline execution and recommend
      optimization strategies'
    stakeholder_landscape:
      customer_side:
      - role: 'Data Engineering Team: primary consumers of pipeline designs, quality frameworks, and DataOps practices'
        connected_via: de-specialist-agent
      - role: 'Analytics/BI Team: downstream consumers of data products, define freshness and quality SLAs'
        connected_via: de-specialist-agent
      - role: 'ML/Data Science Team: consume feature pipelines, require data quality guarantees and lineage for model training'
        connected_via: de-specialist-agent
      - role: 'VP Data/CDO: sponsors data engineering initiatives, owns data strategy, and approves platform investments'
        connected_via: de-specialist-agent
      - role: 'Application Development Teams: produce source data, consume integration APIs, and depend on CDC pipelines'
        connected_via: de-specialist-agent
      internal_team:
      - role: 'Solution Architect: coordinates technical design across domains, integrates data engineering into broader architecture'
        connected_via: de-specialist-agent
      - role: 'Big Data Architect: owns platform-level architecture decisions, lakehouse/mesh strategy, and storage engine
          selection'
        connected_via: de-specialist-agent
      - role: 'Field CTO: validates data engineering strategy against industry trends and customer portfolio patterns'
        connected_via: de-specialist-agent
      - role: 'Account Executive: owns customer relationship, positions data engineering value in commercial conversations'
        connected_via: de-specialist-agent
      - role: 'Observability Specialist: collaborates on pipeline monitoring, data pipeline observability, and alerting integration'
        connected_via: de-specialist-agent
    sub_agents:
    - name: Pipeline Agent
      id: de-pipeline-agent
      purpose: Data pipeline design, ETL/ELT patterns, batch orchestration, DAG design
    - name: Streaming Agent
      id: de-streaming-agent
      purpose: Real-time streaming, Kafka, Flink, event processing, stream topology design
    - name: Quality Agent
      id: de-quality-agent
      purpose: Data quality frameworks, testing, validation, profiling, anomaly detection
    - name: Modeling Agent
      id: de-modeling-agent
      purpose: Data modeling, dimensional design, schema evolution, normalization strategies
    - name: Integration Agent
      id: de-integration-agent
      purpose: Data integration, CDC, API ingestion, connector configuration, source onboarding
    - name: Ops Agent
      id: de-ops-agent
      purpose: DataOps practices, CI/CD for data pipelines, environment management, version control
    activity_map:
      purpose: The Data Engineer Specialist orchestrates 6 sub-agents to ensure customer data pipelines are reliable, observable,
        and maintainable. Each sub-agent owns a distinct data engineering domain, from pipeline design through DataOps and
        operational excellence.
      domains:
      - domain: Pipeline Engineering
        why: Reliable data pipelines are the foundation of every analytics and ML capability. Without well-designed orchestration,
          dependency management, and failure handling, data arrives late, incomplete, or not at all.
        activities:
        - Batch and micro-batch pipeline architecture design
        - DAG orchestration with dependency and SLA management
        - ETL vs. ELT pattern evaluation and recommendation
        - Pipeline performance optimization and bottleneck resolution
        cadence: engagement start, updated on architecture changes
      - domain: Real-Time Streaming
        why: Business-critical events require sub-second processing. Streaming architectures must handle ordering, exactly-once
          semantics, and backpressure without data loss or duplication.
        activities:
        - Event-driven streaming topology design
        - Kafka cluster architecture and topic design
        - Stream processing with Flink, Spark Streaming, or equivalent
        - Exactly-once semantics and ordering guarantee design
        cadence: per-engagement design phase, updated on latency requirement changes
      - domain: Data Quality
        why: Data without quality guarantees is a liability. Quality frameworks catch anomalies before they propagate to dashboards,
          ML models, and business decisions.
        activities:
        - Data profiling and quality baseline establishment
        - Rule-based validation and anomaly detection design
        - Quality scorecard creation with trend tracking
        - Quality gate integration into pipeline workflows
        cadence: continuous monitoring, formal review quarterly
      - domain: Data Modeling and Schema Management
        why: Schema decisions are contracts with every downstream consumer. Breaking changes cascade through pipelines, dashboards,
          and ML features, making compatibility management essential.
        activities:
        - Dimensional modeling and schema design
        - Schema evolution with backward compatibility validation
        - Schema registry workflow design
        - Normalization and denormalization strategy
        cadence: per-engagement design phase, reviewed on schema change requests
      - domain: Integration and Connectivity
        why: Source systems are diverse in protocol, format, and reliability. Standardized integration patterns reduce onboarding
          time and prevent each new source from becoming a bespoke engineering project.
        activities:
        - CDC implementation with ordering and schema change propagation
        - REST API and SaaS connector orchestration
        - File-based ingestion pattern design
        - Source onboarding standardization and automation
        cadence: triggered by new source requests, reviewed quarterly
      - domain: DataOps and Operational Excellence
        why: Data pipelines deserve the same engineering rigor as application code. CI/CD, automated testing, and environment
          parity prevent deployment failures and reduce time to production.
        activities:
        - CI/CD pipeline design for data infrastructure
        - Automated testing strategies for data pipelines
        - Environment parity and data subsetting for staging
        - Version control and infrastructure-as-code practices
        cadence: continuous improvement, formal maturity assessment quarterly
    collaboration:
      defer_to:
        sa_agent:
          scope: Overall solution architecture decisions and cross-domain technical coordination
          scenarios:
          - trigger: Data pipeline architecture must integrate with broader application or infrastructure architecture
            context_passed: Pipeline architecture designs, data flow diagrams, integration specifications
            receiver_action: Integrate data engineering architecture into the overall solution design
        big_data_architect:
          scope: Platform-level architecture decisions, lakehouse/mesh strategy, storage engine selection, ML platform infrastructure
          scenarios:
          - trigger: Pipeline design requires platform-level decisions about compute, storage, or data organization strategy
            context_passed: Pipeline requirements, data volume projections, performance constraints
            receiver_action: Make platform architecture decisions that the data engineer will build upon
        security_specialist:
          scope: Data security, encryption, access controls, and compliance-driven data handling requirements
          scenarios:
          - trigger: Customer requires data encryption in transit/at rest, PII handling, or compliance-driven data retention
            context_passed: Data classification, pipeline data flow, sensitivity requirements
            receiver_action: Define security controls, encryption standards, and access policies for data pipelines
        fcto_agent:
          scope: Strategic technology direction and cross-customer data engineering pattern validation
          scenarios:
          - trigger: Customer data engineering strategy involves non-standard architecture or emerging technology
            context_passed: Proposed architecture, risk assessment, industry reference points
            receiver_action: Validate approach against field experience and industry direction
      provide_to:
        sa_agent:
          scope: Data pipeline architecture designs, integration blueprints, and quality frameworks
          scenarios:
          - trigger: Solution architecture requires data engineering component design
            context_passed: Pipeline architectures, streaming topologies, quality frameworks, integration patterns
            receiver_action: Incorporate data engineering design into the overall technical proposal
        ae_agent:
          scope: Data engineering value positioning and technical readiness for commercial conversations
          scenarios:
          - trigger: Customer engagement requires data engineering expertise in sales conversations
            context_passed: DataOps maturity assessment summary, pipeline reliability metrics, competitive differentiation
              points
            receiver_action: Position data engineering value in commercial narrative and customer presentations
        ca_agent:
          scope: Data pipeline health signals and adoption indicators
          scenarios:
          - trigger: Post-deployment pipeline health assessment completed
            context_passed: Pipeline reliability metrics, data quality scores, DataOps adoption status
            receiver_action: Incorporate data engineering health into overall customer health scoring and renewal planning
        observability_specialist:
          scope: Pipeline monitoring integration and data observability patterns
          scenarios:
          - trigger: Data pipelines require monitoring, alerting, and observability integration
            context_passed: Pipeline SLA definitions, quality metrics, lineage metadata, alerting requirements
            receiver_action: Integrate data pipeline observability into the broader monitoring architecture
        product_team:
          scope: Data engineering product capability gaps identified during customer engagements
          scenarios:
          - trigger: Customer requirement exceeds current product capability
            context_passed: Gap description, customer use case, competitive alternative, impact assessment
            receiver_action: Evaluate for product roadmap prioritization
    public_resources:
    - title: Apache Beam Documentation
      url: https://beam.apache.org/documentation/
      context: Unified programming model for batch and streaming data processing, portable across runners including Dataflow,
        Flink, and Spark
    - title: dbt Documentation
      url: https://docs.getdbt.com/
      context: Analytics engineering framework for SQL-based transformations with testing, documentation, and lineage built
        into the workflow
    - title: Apache Airflow Documentation
      url: https://airflow.apache.org/docs/
      context: Workflow orchestration platform for authoring, scheduling, and monitoring data pipelines as directed acyclic
        graphs (DAGs)
    - title: Great Expectations Documentation
      url: https://docs.greatexpectations.io/
      context: Data quality framework for profiling, validation, and documentation with expectation-based testing and data
        contracts
    - title: Fivetran Architecture Documentation
      url: https://fivetran.com/docs/getting-started/architecture
      context: Managed data integration platform covering connector architecture, sync modes, and schema change handling for
        ELT pipelines
    - title: Confluent / Apache Kafka Documentation
      url: https://docs.confluent.io/platform/current/overview.html
      context: Event streaming platform covering producers, consumers, stream processing, schema registry, and exactly-once
        semantics
    - title: Data Engineering Weekly
      url: https://www.dataengineeringweekly.com/
      context: Curated weekly newsletter covering data engineering trends, tools, architecture patterns, and community best
        practices
    - title: Databricks Engineering Blog
      url: https://www.databricks.com/blog/category/engineering
      context: Technical blog covering lakehouse architecture, Delta Lake, Spark optimization, and production data engineering
        patterns
    with_this_agent:
    - domain: Pipeline Architecture and Orchestration
      agent: de-specialist-agent
      items:
      - 'Pipeline Design: design batch and micro-batch pipeline architectures with separation of ingestion, transformation,
        and serving layers'
      - 'Orchestration: build DAG-based workflows with dependency management, retry logic, and SLA monitoring using Airflow
        or equivalent'
    - domain: Real-Time Streaming and Event Processing
      agent: de-specialist-agent
      items:
      - 'Streaming Topologies: design event-driven streaming architectures with Kafka, Flink, or equivalent for low-latency
        data delivery'
      - 'Event Processing: implement exactly-once semantics, ordering guarantees, and backpressure handling for business-critical
        streams'
    - domain: Data Quality and Validation
      agent: de-specialist-agent
      items:
      - 'Quality Frameworks: implement data quality validation with profiling, rule-based checks, and anomaly detection using
        Great Expectations or equivalent'
      - 'Quality Scorecards: produce dataset quality scorecards with trend tracking across completeness, accuracy, consistency,
        and timeliness'
    - domain: Data Modeling and Schema Management
      agent: de-specialist-agent
      items:
      - 'Data Modeling: design dimensional models, star schemas, and normalized structures aligned to analytics and reporting
        requirements'
      - 'Schema Evolution: establish schema compatibility validation and versioning practices that prevent breaking downstream
        consumers'
    - domain: Data Integration and Source Onboarding
      agent: de-specialist-agent
      items:
      - 'CDC Implementation: design change data capture patterns with ordering guarantees and zero-data-loss for regulated
        sources'
      - 'Connector Patterns: standardize API ingestion, file-based loading, and SaaS connector orchestration to reduce onboarding
        time'
    - domain: DataOps and CI/CD for Data
      agent: de-specialist-agent
      items:
      - 'DataOps Practices: establish CI/CD pipelines for data infrastructure with automated testing and environment parity'
      - 'Maturity Assessment: evaluate DataOps maturity across version control, testing, deployment, monitoring, and collaboration
        dimensions'
    - domain: Pipeline Operations and Cost Optimization
      agent: de-specialist-agent
      items:
      - 'Pipeline Recovery: design idempotent pipelines with automated retry and backfill strategies for fast recovery'
      - 'Cost Optimization: identify compute and storage inefficiencies and recommend partitioning, caching, and scheduling
        optimizations'
    scenarios:
    - problem: Data pipelines fail silently, and downstream consumers discover stale data hours or days later
      why: 'Pipelines are built without health monitoring, freshness SLAs, or quality gates. Failures in upstream dependencies
        cascade silently through the pipeline graph. The analytics team discovers the problem when a dashboard shows yesterday''s
        numbers, or worse, when a business decision is made on stale data.

        '
      agent: de-specialist-agent
      agent_response: 'The agent designs pipeline architectures with built-in observability, including freshness SLAs per
        dataset, quality gates between pipeline stages, and automated alerting on data latency violations. It produces a pipeline
        monitoring framework that surfaces failures at the point of occurrence rather than at the point of consumption.

        '
      success_signal:
        metric: Time between pipeline failure and team notification
        target: Pipeline failures detected and alerted within 5 minutes of occurrence
        leading_indicator: Freshness SLAs defined for all tier-1 datasets with automated monitoring
        failure_signal: Downstream consumers discover data staleness before pipeline alerts fire
    - problem: Every new data source requires a bespoke engineering project with unpredictable timelines
      why: 'Without standardized integration patterns, each new source is treated as a greenfield project. Engineers build
        custom connectors, ad-hoc schema mappings, and one-off quality checks. Onboarding times range from days to months
        depending on the engineer assigned, and there is no reusable infrastructure for common patterns like CDC, API pagination,
        or file-based ingestion.

        '
      agent: de-specialist-agent
      agent_response: 'The agent designs a standardized source onboarding framework with templatized connector patterns for
        common integration types (CDC, REST API, file, SaaS). It produces an onboarding checklist that covers schema mapping,
        quality validation, monitoring, and documentation, reducing onboarding time to a predictable, repeatable process.

        '
      success_signal:
        metric: New source onboarding time
        target: Reduce average onboarding time to under 5 business days for standard integration types
        leading_indicator: Connector templates available for the top 5 integration patterns
        failure_signal: Onboarding times remain variable and engineer-dependent after framework adoption
    - problem: Schema changes in source systems break downstream pipelines without warning
      why: 'Source teams deploy schema changes (column renames, type changes, field removals) without notifying data engineering.
        Pipelines fail at transformation or load stages, requiring manual investigation and repair. The blast radius is unpredictable
        because there is no lineage tracking to identify all affected consumers.

        '
      agent: de-specialist-agent
      agent_response: 'The agent designs a schema registry workflow with compatibility validation that rejects breaking changes
        before they reach production. It implements end-to-end lineage tracking so that any proposed schema change can be
        impact-assessed against all downstream consumers before deployment.

        '
      success_signal:
        metric: Schema-change-induced pipeline failures
        target: Zero unplanned pipeline failures caused by upstream schema changes
        leading_indicator: Schema registry with compatibility validation deployed for all shared datasets
        failure_signal: Pipeline failures caused by undetected schema drift persist after registry adoption
    - problem: Data quality issues are discovered by business users, not by engineering systems
      why: 'Quality validation is either absent or limited to null checks and row counts. Subtle quality degradations, such
        as distribution shifts, referential integrity violations, or duplicate records, pass through pipelines undetected.
        Business users report anomalies in reports, creating a reactive cycle that erodes trust in the data platform.

        '
      agent: de-specialist-agent
      agent_response: 'The agent designs a comprehensive data quality framework using Great Expectations or equivalent, with
        profiling-based baselines, rule-based validation, and statistical anomaly detection. Quality gates are embedded into
        pipeline stages so that quality failures halt propagation before reaching consumers. Quality scorecards with trend
        tracking provide visibility into quality over time.

        '
      success_signal:
        metric: Data quality issue detection source
        target: 95% of data quality issues detected by automated systems before consumer exposure
        leading_indicator: Quality gates deployed in all tier-1 pipeline stages with baseline profiles established
        failure_signal: Business users continue to be the primary reporters of data quality problems
    - problem: DataOps maturity is low, with manual deployments and no testing for pipeline changes
      why: 'Data pipelines are deployed manually, tested in production, and version-controlled inconsistently. Pipeline changes
        cause regressions because there is no staging environment with representative data. Rollbacks are manual and slow,
        extending outage windows when deployments fail.

        '
      agent: de-specialist-agent
      agent_response: 'The agent assesses current DataOps maturity and produces an improvement roadmap covering CI/CD pipeline
        design, automated testing strategies (unit, integration, data validation), environment parity with data subsetting,
        and version control practices. It provides a phased adoption plan that delivers incremental value without requiring
        a full platform rewrite.

        '
      success_signal:
        metric: DataOps maturity score improvement
        target: Advance at least one maturity level within each assessment dimension within 6 months
        leading_indicator: CI/CD pipeline deployed for at least one tier-1 data pipeline with automated tests
        failure_signal: Pipeline deployments remain manual 90 days after DataOps initiative begins
    challenges:
    - text: Data pipelines fail silently and downstream consumers discover stale data hours later
      solved_by: de-pipeline-agent
      specific_overhead:
      - Configuring freshness SLA monitoring per dataset per customer
    - text: Schema changes in source systems break downstream pipelines without warning
      solved_by: de-modeling-agent
      specific_overhead:
      - Maintaining schema registries and compatibility validation across customer environments
    - text: Data quality issues are discovered by business users rather than engineering systems
      solved_by: de-quality-agent
      specific_overhead:
      - Configuring quality baselines and validation rules per dataset per customer
    - text: Every new data source requires a bespoke integration project with unpredictable timelines
      solved_by: de-integration-agent
      specific_overhead:
      - Documenting integration patterns and onboarding checklists per source type
    - text: DataOps maturity is low with manual deployments and no automated testing for pipelines
      solved_by: de-ops-agent
      specific_overhead:
      - Assessing and documenting DataOps maturity per customer engagement
    - text: Streaming latency spikes during peak load cause business-critical event processing delays
      solved_by: de-streaming-agent
      specific_overhead:
      - Tuning streaming configurations and backpressure settings per customer workload
    administrative_overhead:
    - Configuring freshness SLA monitoring per dataset per customer
    - Maintaining schema registries and compatibility validation across customer environments
    - Configuring quality baselines and validation rules per dataset per customer
    - Documenting integration patterns and onboarding checklists per source type
    - Assessing and documenting DataOps maturity per customer engagement
    - Tuning streaming configurations and backpressure settings per customer workload
    capabilities:
    - Data pipeline architecture design
    - Real-time streaming and event processing
    - Data quality framework design
    - Data modeling and schema management
    - Data integration and CDC
    - DataOps and CI/CD for data
