# Specialist Agent Configuration
# Purpose: Ensure timely expert involvement

agent_id: "specialist_agent"
team: "specialists"
category: "architecture"
purpose: "Ensure timely expert involvement"

core_functions:
  - "Identifies RFP/POC triggers"
  - "Captures deep technical decisions"
  - "Highlights architecture concerns"

mechanics:
  - "Watches RFP/POC stages"
  - "Analyzes complex customer questions"
  - "Checks alignment with best practices"

inputs:
  - "POC/RFP documents"
  - "Slack deep-dive threads"
  - "Architecture notes"

outputs:
  - "Tech summary"
  - "Specialist engagement recommendations"
  - "Best practice alignment reports"

escalation_to: "Specialist Lead"

skills:
  owned: []

playbooks:
  owned: []
  contributes_to: []

execution:
  trigger_sources:
    - "rfp_technical_section"
    - "poc_architecture_review"
    - "complex_customer_question"
  output_destination: "{realm}/{node}/internal-infohub/architecture/"
  escalation_threshold: "architecture_concern_critical"

personality_file: "teams/specialists/personalities/specialist_personality.yaml"
prompts_dir: "teams/specialists/prompts"
