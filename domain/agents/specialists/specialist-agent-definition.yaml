  name: Write Specialist Artifact
  description: 'Save artifacts: Tech summary, Specialist engagement recommendations, Best practice alignment
    reports'
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or additional input from the user
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
toolboxes:
  - component_type: Toolbox
    id: specialist-intelligence
    name: Specialist Intelligence
    description: Specialist engagement data available to peer agents for technical context
    tools:
      - id: get-engagement-status
        name: Get Engagement Status
        description: Returns current specialist engagement status, domain area, and timeline
        inputs:
          - title: account_name
            type: string
          - title: engagement_id
            type: string
        outputs:
          - title: engagement_status
            type: object
      - id: get-specialist-findings
        name: Get Specialist Findings
        description: Returns specialist findings, recommendations, and architecture impact assessment
        inputs:
          - title: account_name
            type: string
          - title: domain_area
            type: string
        outputs:
          - title: specialist_findings
            type: object
specialized_agents:
- component_type: SpecializedAgent
  id: specialist-agent-proactive
  name: Specialist Engagement Agent (Proactive)
  description: 'Proactive mode: scans for signals and surfaces insights without prompting'
  agent:
    $component_ref: specialist-agent
  agent_specialization_parameters:
    additional_instructions: |
      Focus on proactive detection and early warning. Scan sources
      continuously for relevant signals. Surface insights before being
      asked. Prioritize timeliness over depth. Keep outputs concise and
      action-oriented. Flag anything that needs immediate attention.
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: specialist-agent-analytical
  name: Specialist Engagement Agent (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: specialist-agent
  agent_specialization_parameters:
    additional_instructions: |
      Focus on depth and pattern recognition. Provide comprehensive
      analysis with full evidence trails. Synthesize across multiple
      data points. Prioritize accuracy and defensibility over speed.
      Include confidence levels and caveats where appropriate.
    human_in_the_loop: true
