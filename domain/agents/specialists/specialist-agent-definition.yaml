    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: specialist-sa-handback
      input: account_name, scope, deliverables
      description: Prepare handback to SA after specialist engagement
    - step: 2
      prompt: specialist-best-practice-doc
