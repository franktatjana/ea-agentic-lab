a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - engagement-triage
    - technical-deep-dive
    - rfp-poc
    - knowledge-transfer
    input_modes:
    - text/plain
    - application/json
