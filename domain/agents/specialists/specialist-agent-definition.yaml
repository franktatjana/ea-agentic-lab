x-ea-agent:
  profile:
    human_matters_summary: 'Specialist engagement is timing and trust, not just technical need. The agent flags situations requiring deep expertise and captures decision context, but the engagement owner
      understands when to bring specialists versus solve internally, how to position them to the customer, and when to defer decisions until specialists engage. The need is flagged, but human judgment decides
      whether to engage.

      '
    scenarios:
    - problem: Specialist engagement happens too late, after technical decisions are already locked in
      why: 'When domain specialists join after architecture decisions are made, they find issues that require rework. The customer sees a revised design mid-POC, which damages credibility. Late specialist
        involvement turns a correctable design choice into a costly pivot that delays timelines and erodes trust.

        '
      agent: specialist-agent
      agent_response: 'Monitors RFP requirements, POC scoping documents, and architecture discussions for specialist triggers (log volume thresholds, compliance requirements, search complexity indicators).
        Flags engagement needs before design decisions are finalized, ensuring specialist input shapes the architecture rather than correcting it.

        '
      success_signal:
        metric: Specialist engaged before architecture lock-in
        target: '> 85% of specialist engagements start before POC design is finalized'
        leading_indicator: Trigger detected and specialist notified within 24h of signal
        failure_signal: Specialist discovers rework-requiring issue after design is presented to customer
    - problem: SA handles domain-specific questions beyond their depth, producing generic guidance
      why: 'SAs cover broad technical ground but cannot match specialist depth in areas like observability pipelines, search relevance tuning, or security architecture. When they attempt specialist-level
        answers, the guidance is surface-level and risks misconfiguration or missed best practices that surface during production.

        '
      agent: specialist-agent
      agent_response: 'Detects when customer questions or RFP requirements cross complexity thresholds for specific domains (observability, search, security, data management). Routes the engagement to the
        appropriate specialist with scoped context, ensuring deep expertise is applied where it has the highest impact.

        '
      success_signal:
        metric: Domain-specialist routing accuracy
        target: '> 90% of high-complexity technical questions routed to correct specialist'
        leading_indicator: Complexity threshold triggers match post-engagement specialist assessment
        failure_signal: Customer escalation or POC failure traced to guidance that needed specialist review
    - problem: Distinguishing between questions the SA can handle and those requiring specialist depth
      why: 'SAs encounter technical questions that fall in a gray zone between general knowledge and specialist depth. Without clear criteria, some questions are escalated unnecessarily while others are
        answered inadequately. Both outcomes waste time or damage credibility.

        '
      agent: specialist-agent
      agent_response: 'The agent applies complexity threshold criteria per domain, evaluating question depth against SA capability baselines. It classifies each technical inquiry as SA-sufficient, specialist-recommended,
        or specialist-required, with the rationale visible so SAs learn the boundary over time and calibrate their own judgment.

        '
      success_signal:
        metric: Escalation accuracy rate
        target: At least 90% of specialist escalations confirmed as warranted by post-engagement review
        leading_indicator: SA self-assessment of question complexity aligns with threshold classification
        failure_signal: Specialist finds the escalated question was within standard SA scope
    - problem: Managing specialist availability when multiple accounts need the same domain expertise simultaneously
      why: 'Specialist capacity is limited by design, as deep expertise does not scale horizontally. When three accounts need the same security or observability specialist in the same week, there is no
        systematic way to prioritize or sequence engagements, leading to delayed responses and frustrated account teams.

        '
      agent: specialist-agent
      agent_response: 'The agent tracks specialist capacity across active engagements, queues incoming requests by urgency and deal impact, and recommends scheduling that maximizes coverage. It surfaces
        conflicts before they cause delays and suggests interim guidance that the SA can deliver while awaiting specialist availability.

        '
      success_signal:
        metric: Specialist scheduling conflict resolution
        target: Zero specialist engagements delayed by more than 3 business days due to scheduling conflicts
        leading_indicator: Capacity dashboard updated in real time with specialist commitment status
        failure_signal: Account team escalates because specialist request has been pending without response for over a week
    - problem: Ensuring specialist findings and decisions transfer back to the SA for ongoing account ownership
      why: 'Specialists engage deeply during POCs or architecture reviews, then move on. Their findings, design decisions, and customer context stay in their notes or memory. The SA, who owns the account
        long-term, is left without the technical detail needed to support the customer post-engagement.

        '
      agent: specialist-agent
      agent_response: 'The agent generates a structured handback document at the end of each specialist engagement, capturing design decisions, configuration rationale, open items, and customer-specific
        context. It routes the handback to the owning SA with a summary of what was decided and what requires follow-up, ensuring continuity of technical ownership.

        '
      success_signal:
        metric: Handback documentation completeness
        target: Structured handback delivered within 48 hours of specialist engagement closure for 100% of engagements
        leading_indicator: SAs confirm handback content is sufficient for ongoing customer support
        failure_signal: SA cannot answer customer follow-up questions because specialist context was not transferred
    - problem: Calibrating trigger thresholds to avoid both under-engagement and specialist overload
      why: 'If triggers are too sensitive, specialists are pulled into engagements that SAs could handle, creating a bottleneck. If triggers are too loose, specialists miss engagements where their depth
        was needed, and customers receive suboptimal guidance. Finding the right balance requires continuous tuning based on outcomes.

        '
      agent: specialist-agent
      agent_response: 'The agent tracks trigger activation outcomes, comparing the complexity classification at trigger time with the actual engagement difficulty. It identifies patterns of over-triggering
        and under-triggering by domain, and recommends threshold adjustments with supporting data from engagement retrospectives and customer outcomes.

        '
      success_signal:
        metric: Trigger threshold accuracy
        target: Trigger precision above 85%, measured by post-engagement validation of engagement necessity
        leading_indicator: Quarterly threshold review completed with adjustment recommendations
        failure_signal: Specialist overload from low-complexity escalations or missed engagements requiring depth
    challenges:
    - text: Distinguishing between questions the SA can handle and those requiring specialist depth
      specific_overhead:
      - Documenting engagement requests with scoped context, urgency, and domain classification
    - text: Managing specialist availability when multiple accounts need the same domain expertise simultaneously
      specific_overhead:
      - Tracking specialist engagement status and capacity across active customer accounts
    - text: Ensuring specialist findings and decisions transfer back to the SA for ongoing account ownership
      specific_overhead:
      - Preparing handback summaries that capture specialist findings for SA continuity
    - text: Calibrating trigger thresholds to avoid both under-engagement and specialist overload
      specific_overhead:
      - Maintaining and updating specialist trigger criteria as product capabilities evolve
    - Specialist engagement happens too late, after technical decisions are already locked in
    - SA handles domain-specific questions beyond their depth, producing generic guidance
    administrative_overhead:
    - Documenting engagement requests with scoped context, urgency, and domain classification
    - Tracking specialist engagement status and capacity across active customer accounts
    - Preparing handback summaries that capture specialist findings for SA continuity
    - Maintaining and updating specialist trigger criteria as product capabilities evolve
