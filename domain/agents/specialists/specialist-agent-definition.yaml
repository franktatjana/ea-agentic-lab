  description: Flow for rfp poc tasks.
  inputs:
  - title: account_name
    type: string
  - title: criteria
    type: string
  - title: customer_criteria
    type: string
  - title: poc_results
    type: string
  - title: poc_timeline
    type: string
  - title: questions
    type: string
  - title: rfp_section
    type: string
  - title: use_case
    type: string
  outputs:
  - title: rfp_poc_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: specialist-rfp-technical-response
      input: account_name, rfp_section, questions
      description: Prepare technical content for RFP response
    - step: 2
      prompt: specialist-poc-design
      input: account_name, use_case, customer_criteria, poc_timeline
      description: Design POC architecture and success criteria
    - step: 3
      prompt: specialist-poc-review
      input: account_name, poc_results, criteria
      description: Review POC results and prepare customer presentation
- component_type: Flow
  id: knowledge-transfer
  name: Knowledge Transfer
  description: Flow for knowledge transfer tasks.
  inputs:
  - title: account_name
    type: string
  - title: deliverables
    type: string
  - title: key_learnings
    type: string
  - title: scope
    type: string
  - title: topic
    type: string
  outputs:
