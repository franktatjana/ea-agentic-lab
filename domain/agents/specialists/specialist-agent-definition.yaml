        - decisions_log
        - architecture_context
        - deliverables_registry
        priority: critical
    specialist-best-practice-doc:
      description: Document best practices from engagement
      source: prompts/tasks.yaml#knowledge_transfer.best_practice_doc
      inputs:
      - title: account_name
        type: string
      - title: key_learnings
        type: string
      - title: topic
        type: string
      outputs:
      - title: best-practice-doc_result
        type: object
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input_validation:
    - rule: Reject requests without source content or evidence base
    - rule: Engagement requests must specify the domain area and customer context
    - rule: Trigger assessment requires observable technical signals
    output_checks:
    - rule: Never route to specialist without clear, documented trigger
    - rule: Never assess technical complexity beyond routing scope
    - rule: Quote exact customer requirement in engagement requests
    - rule: Specialist selection must match the domain taxonomy
    signal_validation:
    - rule: Specialist triggers must reference specific technical indicators
    - rule: Complexity assessments require minimum 2 supporting data points
    - rule: Domain classification must map to defined specialist categories
    resource:
    - max_tool_calls: 30
  error_handling:
    tool_failures:
      critical: []
      enrichment:
      - read-communications
      - read-infohub
      - read-intelligence
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  boundaries:
  - Does not provide specialist-level technical guidance (handoff to Specialist Lead)
  - Does not make decisions on specialist's behalf (handoff to Specialist Lead)
  permissions:
  - Identify when specialist expertise needed (Observability, Security, Search, etc.)
  - Capture deep technical decisions from RFP/POC phases
  - Highlight architecture concerns requiring specialist review
  - Track specialist engagement status
  escalation_triggers:
  - Critical specialist trigger identification exceeding agent authority (to Specialist Lead)
  handoffs:
    human_escalation: Specialist Lead
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Specialist trigger identification
    - Complexity assessment
    - Engagement tracking
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - specialist-engagement
      - knowledge-transfer
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/specialist-triggers.yaml
      description: When To Flag, Domains
  assets:
  - name: tech-summary
    filename: '{account}-tech-summary.md'
    description: Tech summary
  - name: specialist-engagement-recommendations
    filename: '{account}-specialist-engagement-recommendations.md'
    description: Specialist engagement recommendations
  - name: best-practice-alignment-reports
    filename: '{account}-best-practice-alignment-reports.md'
    description: Best practice alignment reports
  quality:
  - All claims supported by evidence
  - No assumed dynamics
  - Sources cited
  autonomy:
    triggers:
    - type: parent_dispatch
      source: sa-agent
      description: SA orchestrator routes specialist engagement requests
    - type: downstream
      source: poc-agent
      condition: poc.technical_risk >= HIGH
      description: High-risk POC scenarios trigger specialist assessment
    - type: downstream
      source: rfp-agent
      condition: rfp.technical_depth >= DEEP
      description: Deep technical RFP sections require specialist input
    outputs:
    - type: parent_return
      target: sa-agent
      payload:
      - engagement_status
      - specialist_findings
      - recommendations
      description: Specialist findings and recommendations back to SA orchestrator
    - type: trigger_agent
      target: sa-agent
      condition: engagement.status == COMPLETE
      payload:
      - findings
      - decisions
      - architecture_impact
      flow: decision-capture
      description: Completed specialist engagement triggers SA decision capture
    - type: notify_human
      condition: complexity.level == HIGH OR engagement.blocked == true
      channel: alert
      description: High-complexity findings and blocked engagements surface for SA review
    consumes_toolboxes:
    - toolbox: risk-intelligence
      agent: sa-risk-agent
      tools:
      - get-risk-register
      reason: Risk context for domain-specific assessment
    - toolbox: best-practices-intelligence
      agent: sa-best-practices-agent
      tools:
      - get-best-practice
      reason: Best practices inform specialist recommendations
    dependencies:
    - agent: security-specialist-agent
      reason: SIEM, threat detection, MITRE ATT&CK domain expertise
    - agent: observability-specialist-agent
      reason: APM, SLO/SLI, distributed tracing domain expertise
    - agent: search-specialist-agent
      reason: Relevance tuning, vector search, RAG domain expertise
