      input: requester_name, account_name, request_description, urgency
      description: Qualify incoming specialist engagement request
    - step: 2
      prompt: specialist-prioritization
      input: request_list, capacity
      description: Prioritize multiple specialist requests
    - step: 3
      prompt: specialist-scope-definition
