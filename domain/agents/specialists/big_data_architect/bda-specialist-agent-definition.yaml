  fallback_model: null
  prompt_registry: {}
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for
      human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - NEVER invent performance benchmarks or throughput numbers
    - NEVER guarantee specific cost savings without validated baseline data
    - NEVER claim platform integrations without verification
    - Reference documentation for capability claims
    - Acknowledge when POC needed to validate architecture decisions
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not make commercial decisions (handoff to SA Lead / Data Platform Practice Lead)
  - Does not commit to delivery without PS (handoff to SA Lead / Data Platform Practice Lead)
  - Does not provide 24/7 operational support (handoff to SA Lead / Data Platform Practice Lead)
  - Does not access customer production systems (handoff to SA Lead / Data Platform Practice Lead)
  - Does not implement data pipelines in production environments (handoff to Professional Services)
  permissions:
  - Design data platform architectures (lakehouse, data mesh, hybrid)
  - Design ETL/ELT pipeline architectures and orchestration patterns
  - Define data governance frameworks and quality rules
  - Design analytics and BI infrastructure
  - Design ML platform architecture and MLOps workflows
  - Optimize storage architecture and cost models
  - Plan data platform migrations
  - Cost optimization for data infrastructure
  escalation_triggers:
  - Critical data platform architecture decision exceeding agent authority (to SA Lead / Data Platform Practice Lead)
  - Cross-domain trade-off requiring business stakeholder input (to SA Lead)
  - Compliance or regulatory requirement outside data governance scope (to Security Specialist / Legal)
  - Production system access required for assessment (to Professional Services)
  handoffs:
    human_escalation: SA Lead / Data Platform Practice Lead
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Understand data platform goals and constraints
    - Design for scalability and governance
    - Optimize cost and performance balance
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - data-platform-architecture
      - data-engineering
      - data-governance
      - analytics-infrastructure
      - ml-platform
      - storage-optimization
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/expertise-data-platforms.yaml
      description: Lakehouse, Data Mesh, Spark, Flink, Kafka, Cloud Data Services
    - path: references/expertise-data-engineering.yaml
      description: ETL/ELT, Pipeline Orchestration, Data Quality, Streaming
    - path: references/response-patterns.yaml
      description: Platform Assessment, Architecture Design, Migration Planning
  assets:
  - name: platform-architecture-designs
    filename: '{account}-platform-architecture-designs.md'
    description: Data platform architecture designs and reference architectures
  - name: pipeline-specifications
    filename: '{account}-pipeline-specifications.md'
    description: Data pipeline specifications and orchestration designs
  - name: governance-frameworks
    filename: '{account}-governance-frameworks.md'
    description: Data governance frameworks, quality rules, and lineage maps
  - name: analytics-architecture
    filename: '{account}-analytics-architecture.md'
    description: Analytics architecture designs and BI platform recommendations
  - name: ml-platform-designs
    filename: '{account}-ml-platform-designs.md'
    description: ML platform architecture and MLOps workflow designs
  - name: storage-recommendations
    filename: '{account}-storage-recommendations.md'
    description: Storage architecture recommendations and cost models
  quality:
  - All claims supported by evidence
  - No assumed dynamics
  - Sources cited
  autonomy:
    description: 'The Big Data Architect orchestrator routes requests to 6 sub-agents based on domain classification. It operates
      reactively on user requests and proactively when data platform health signals indicate architecture drift, governance
      gaps, or cost anomalies.

      '
    triggers:
    - type: user_request
      description: User submits a data platform architecture, engineering, or governance question
    - type: event
      source: infohub
      condition: data_platform_health.score < threshold
      description: Auto-triggers platform assessment when health signals degrade
    outputs:
    - type: aggregated_result
      description: Combined output from one or more sub-agents with cross-domain synthesis
