specialized_agents:
- component_type: SpecializedAgent
  id: bda-specialist-agent-proactive
  name: Big Data Architect (Proactive)
  description: 'Proactive mode: scans for data platform risks, performance bottlenecks, and governance gaps without prompting'
  agent:
    $component_ref: bda-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan data platform configurations for performance
      risks, governance gaps, and cost anomalies. Surface insights before being asked. Prioritize timeliness over depth. Keep
      outputs concise and action-oriented. Flag anything that needs immediate attention, especially data quality degradation,
      pipeline failures, or compliance drift.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: bda-specialist-agent-analytical
  name: Big Data Architect (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence, architecture trade-offs, and benchmark comparisons'
  agent:
    $component_ref: bda-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Provide comprehensive analysis with full evidence trails.
      Synthesize across multiple data points including platform benchmarks, cost models, and architecture patterns. Prioritize
      accuracy and defensibility over speed. Include confidence levels and caveats where appropriate. Compare against industry
      reference architectures.

      '
    human_in_the_loop: true
