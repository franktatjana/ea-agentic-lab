x-ea-agent:
  profile:
    why: 'Every enterprise generates more data than it can use. The gap between data collection and data-driven decisions
      is an architecture problem, not a tooling problem. The Big Data Architect exists to close that gap by designing data
      platforms that make data accessible, trustworthy, and actionable across the organization.

      '
    human_matters_summary: 'Data platform architecture is engineering; data strategy is human. The agent designs lakehouse
      architectures, pipeline topologies, and governance frameworks, but the data leader understands which data assets drive
      real business value, how aggressive the migration timeline can be without breaking the team, and what data culture changes
      will stick in the organization. The architecture is correct, but the human leader makes it work.

      '
    human_matters_goal: 'Ensure the Big Data Architect augments the data leader''s judgment rather than replacing it. The
      agent handles architectural complexity and pattern matching while the human applies organizational context, political
      awareness, and strategic prioritization that no model can replicate.

      '
    role_tab_intro: 'The Big Data Architect designs and validates data platform architectures for enterprise customers, covering
      the full stack from storage and compute through pipelines, governance, analytics, and ML infrastructure.

      '
    role_context: 'Data platform architecture underpins every data-driven initiative. The Big Data Architect designs the foundational
      layers, from storage formats and partitioning strategies through pipeline orchestration and governance frameworks, that
      determine whether an organization can actually use its data at scale.

      Modern data platforms span multiple paradigms: lakehouse architectures that unify batch and streaming, data mesh patterns
      that decentralize ownership while maintaining interoperability, and cloud-native services that trade operational overhead
      for managed scalability. The specialist navigates these trade-offs with a clear view of the customer''s current maturity,
      team capabilities, and business objectives.

      The role bridges data engineering, analytics, and ML infrastructure. A pipeline that ingests data is only valuable if
      governance ensures trust, analytics makes it accessible, and ML platforms can operationalize it. The Big Data Architect
      designs these layers as an integrated system, not isolated components, ensuring that architectural decisions at one
      layer do not create bottlenecks at another.

      '
    goals_summary: 'The Big Data Architect succeeds when data platforms are reliable, governed, cost-efficient, and directly
      enabling business decisions. Every engagement should leave the customer with a clearer path from raw data to measurable
      business outcomes.

      '
    goals:
    - Achieve data platform architecture designs that reduce time-to-insight by 40% through optimized pipeline and storage
      choices
    - Establish data governance frameworks covering 100% of tier-1 data assets within each engagement
    - Reduce pipeline failure rates by 50% through architecture redesign and orchestration improvements
    - Deliver storage cost optimization recommendations that cut storage spend by 30% without sacrificing query performance
    - Implement data quality frameworks with automated validation covering all critical data pipelines
    - Design lakehouse or data mesh architectures that unify batch and streaming workloads on a single platform
    - Produce ML platform architectures that reduce model deployment time from weeks to days
    - Establish data catalog coverage for 100% of governed data assets with lineage tracking
    - Design analytics architectures that support self-service BI for 80% of standard reporting needs
    - Deliver capacity planning models with sizing accuracy within 20% of actual consumption at 90-day review
    - Build reference architectures covering AWS, Azure, and GCP data platform services
    - Reduce data pipeline end-to-end latency by 60% for real-time use cases through streaming architecture design
    - Ensure every engagement produces a documented data platform maturity assessment with prioritized remediation roadmap
    - Validate data platform migrations with POC success criteria before full rollout
    key_metrics:
    - name: Data Platform Maturity Score
      definition: Composite score measuring architecture completeness across storage, compute, pipelines, governance, analytics,
        and ML layers on a 1-5 scale
    - name: Pipeline Reliability Rate
      definition: Percentage of scheduled pipeline runs that complete successfully without manual intervention over a 30-day
        window
    - name: Data Governance Coverage
      definition: Percentage of tier-1 data assets with active governance policies, quality rules, lineage tracking, and access
        controls
    - name: Time-to-Insight
      definition: Average elapsed time from raw data ingestion to availability in analytics or ML serving layers
    - name: Storage Cost Efficiency
      definition: Ratio of actively queried data volume to total stored data volume, indicating storage tier optimization
        effectiveness
    - name: Data Quality Score
      definition: Percentage of critical data pipelines with automated quality validation checks that pass defined thresholds
    - name: Self-Service Analytics Adoption
      definition: Percentage of standard reporting needs served through self-service BI tools without requiring data engineering
        intervention
    key_responsibilities:
    - 'Data Platform Architecture Design: design end-to-end data platform architectures spanning storage, compute, pipelines,
      governance, and serving layers'
    - 'Lakehouse and Data Mesh Strategy: evaluate and recommend lakehouse vs data mesh vs hybrid architectures based on organizational
      maturity and use cases'
    - 'Pipeline Architecture and Orchestration: design ETL/ELT pipeline topologies with appropriate batch, streaming, and
      micro-batch patterns'
    - 'Data Governance Framework: establish governance frameworks covering data quality, catalog, lineage, access control,
      and compliance requirements'
    - 'Analytics Infrastructure Design: architect BI platforms, semantic layers, and OLAP systems that enable self-service
      analytics at scale'
    - 'ML Platform Architecture: design ML infrastructure covering feature stores, model training, serving, monitoring, and
      MLOps workflows'
    - 'Storage Architecture Optimization: design storage strategies with tiering, partitioning, and format selection optimized
      for query patterns and cost'
    - 'Data Quality Engineering: implement automated data quality frameworks with validation rules, anomaly detection, and
      quality scoring'
    - 'Platform Assessment and Maturity Evaluation: assess current data platform maturity against industry benchmarks and
      produce gap remediation roadmaps'
    - 'Cost Optimization for Data Infrastructure: identify over-provisioned resources, optimize storage tiers, and model cost
      impact of architecture changes'
    - 'Migration Planning and Execution: plan migrations between data platforms with data validation, parallel-run testing,
      and rollback criteria'
    - 'Real-Time Architecture Design: architect streaming data platforms for real-time analytics, event processing, and operational
      intelligence'
    - 'Cross-Cloud Data Architecture: produce cloud-specific implementation guides for data platforms spanning AWS, Azure,
      and GCP services'
    - 'Data Catalog and Lineage: implement data discovery, catalog, and lineage tracking systems that make data assets findable
      and trustworthy'
    - 'Capacity Planning and Sizing: model data volumes, query patterns, and growth projections to produce validated infrastructure
      sizing recommendations'
    - 'Data Team Enablement: guide teams on data engineering best practices, platform adoption, and organizational patterns
      for data ownership'
    challenges:
    - text: Data platforms grow organically into ungoverned sprawl with duplicated pipelines and inconsistent definitions
      solved_by: bda-governance-agent
      specific_overhead:
      - Auditing existing pipeline inventory and data asset catalog for each customer engagement
    - text: Migration from legacy data warehouses stalls when query performance regressions surface late in testing
      solved_by: bda-storage-agent
      specific_overhead:
      - Benchmarking query performance across source and target platforms during migration validation
    - text: Real-time and batch architectures are designed as separate systems, doubling infrastructure cost and operational
        complexity
      solved_by: bda-platform-design-agent
      specific_overhead:
      - Evaluating unified architectures (lakehouse, Kappa) against existing batch-only infrastructure
    - text: ML teams cannot operationalize models because feature engineering and serving infrastructure is missing or ad-hoc
      solved_by: bda-ml-platform-agent
      specific_overhead:
      - Assessing ML infrastructure maturity and feature store readiness per customer
    - text: Data quality issues propagate silently through pipelines until they corrupt downstream analytics and dashboards
      solved_by: bda-pipeline-agent
      specific_overhead:
      - Implementing data quality checks at pipeline boundaries for each critical data flow
    - text: Analytics users wait days for new data products because the semantic layer is coupled to engineering release cycles
      solved_by: bda-analytics-agent
      specific_overhead:
      - Designing self-service analytics layers that decouple business logic from pipeline engineering
    administrative_overhead:
    - Auditing existing pipeline inventory and data asset catalog for each customer engagement
    - Benchmarking query performance across source and target platforms during migration validation
    - Evaluating unified architectures against existing batch-only infrastructure
    - Assessing ML infrastructure maturity and feature store readiness per customer
    - Implementing data quality checks at pipeline boundaries for each critical data flow
    - Designing self-service analytics layers that decouple business logic from pipeline engineering
    scenarios:
    - problem: Data platform grew organically and now has 200+ pipelines with no governance, unclear ownership, and frequent
        silent failures
      why: 'Without a deliberate platform architecture, teams build independent pipelines using different tools and conventions.
        Data definitions drift between producers and consumers, pipeline failures go undetected until downstream reports break,
        and nobody owns the platform as a whole. The result is a data swamp that erodes trust in data across the organization.

        '
      agent: bda-specialist-agent
      agent_response: 'The orchestrator coordinates a cross-domain assessment: the Governance sub-agent audits data asset
        ownership and quality rules, the Pipeline sub-agent maps pipeline dependencies and failure patterns, and the Platform
        Design sub-agent evaluates the architecture against lakehouse and data mesh patterns. The combined output is a maturity
        assessment with a prioritized remediation roadmap that addresses governance gaps first, then pipeline consolidation,
        then platform modernization.

        '
      success_signal:
        metric: Data platform maturity score improvement
        target: Move from ad-hoc (level 1) to managed (level 3) within 6 months of roadmap execution
        leading_indicator: Data asset catalog covers 100% of tier-1 assets with assigned owners
        failure_signal: Pipeline failure rate unchanged 90 days after assessment
    - problem: Customer wants to migrate from on-premises Hadoop to a cloud-native lakehouse but cannot accept query performance
        regression
      why: 'Legacy Hadoop clusters have years of query optimization baked into custom configurations, file formats, and partition
        schemes. A naive lift-and-shift to cloud storage results in slower queries, higher costs, and frustrated analysts
        who revert to the old system. The migration needs architecture-level planning, not just tooling changes.

        '
      agent: bda-specialist-agent
      agent_response: 'The orchestrator coordinates the Storage sub-agent for format and partitioning analysis, the Pipeline
        sub-agent for migration ETL design, and the Analytics sub-agent for query pattern profiling. The combined output is
        a migration plan with performance baselines, format conversion strategy (Parquet/Delta/Iceberg selection), partition
        redesign, and parallel-run validation criteria that gate cutover on query performance parity.

        '
      success_signal:
        metric: Query performance parity post-migration
        target: P95 query latency within 10% of baseline for top-50 queries at migration cutover
        leading_indicator: Parallel-run validation passes for 90% of benchmark queries before cutover
        failure_signal: Analysts report slower queries and revert to legacy system within 30 days
    - problem: ML team has models in notebooks but no path to production, feature engineering is duplicated across projects
      why: 'Data science teams build models in isolation using ad-hoc feature engineering. Without a shared feature store
        and model serving infrastructure, each model deployment is a custom engineering project. Feature logic is duplicated,
        training/serving skew goes undetected, and model monitoring is manual or nonexistent.

        '
      agent: bda-specialist-agent
      agent_response: 'The orchestrator routes to the ML Platform sub-agent for feature store and model serving architecture,
        coordinates with the Pipeline sub-agent for feature pipeline design, and involves the Governance sub-agent for model
        lineage and audit requirements. The output is an ML platform architecture with feature store design, model registry,
        serving infrastructure, and monitoring framework that connects to the existing data platform.

        '
      success_signal:
        metric: Model deployment time reduction
        target: Reduce average model deployment time from weeks to days with standardized ML platform
        leading_indicator: Feature store covers 80% of commonly used features across ML projects
        failure_signal: Data scientists continue building ad-hoc feature pipelines outside the platform
    stakeholder_landscape:
      customer_side:
      - role: 'Chief Data Officer / VP Data: sponsors data platform initiatives, owns data strategy, and approves architecture
          investments'
        connected_via: bda-specialist-agent
      - role: 'Head of Data Engineering: primary consumer of platform and pipeline architecture designs, owns pipeline operations'
        connected_via: bda-specialist-agent
      - role: 'Data Governance Lead: responsible for data quality, catalog, lineage, and compliance policy implementation'
        connected_via: bda-specialist-agent
      - role: 'Analytics/BI Lead: owns analytics infrastructure, reporting standards, and self-service BI adoption'
        connected_via: bda-specialist-agent
      - role: 'ML Engineering Lead: responsible for ML infrastructure, feature stores, and model operationalization'
        connected_via: bda-specialist-agent
      - role: 'Cloud/Infrastructure Team: manages cloud infrastructure, networking, and platform operations underlying data
          systems'
        connected_via: bda-specialist-agent
      internal_team:
      - role: 'Solution Architect: coordinates technical design across domains, integrates data platform into broader architecture'
        connected_via: bda-specialist-agent
      - role: 'Field CTO: validates data platform strategy against industry trends and customer portfolio patterns'
        connected_via: bda-specialist-agent
      - role: 'Account Executive: owns customer relationship, positions data platform value in commercial conversations'
        connected_via: bda-specialist-agent
      - role: 'Security Specialist: collaborates on data security, encryption, access control, and compliance requirements'
        connected_via: bda-specialist-agent
      - role: 'Customer Architect: consumes data platform adoption signals for health scoring and expansion planning'
        connected_via: bda-specialist-agent
    with_this_agent:
    - domain: Data Platform Architecture and Design
      agent: bda-specialist-agent
      items:
      - 'Platform Assessment: evaluate current data platform maturity across storage, compute, pipelines, governance, and
        analytics layers'
      - 'Architecture Design: design lakehouse, data mesh, or hybrid architectures based on organizational maturity and use
        cases'
    - domain: Data Pipeline Engineering
      agent: bda-specialist-agent
      items:
      - 'Pipeline Design: architect ETL/ELT pipelines with appropriate batch, streaming, and micro-batch patterns'
      - 'Orchestration Strategy: design pipeline orchestration with Airflow, Dagster, or cloud-native workflow services'
    - domain: Data Governance and Quality
      agent: bda-specialist-agent
      items:
      - 'Governance Framework: establish data governance covering quality rules, catalog, lineage, and compliance requirements'
      - 'Data Quality: implement automated quality validation with anomaly detection and quality scoring'
    - domain: Analytics and BI Architecture
      agent: bda-specialist-agent
      items:
      - 'Analytics Design: architect BI platforms, semantic layers, and OLAP systems for self-service analytics'
      - 'Reporting Strategy: design reporting infrastructure that decouples business logic from pipeline engineering'
    - domain: ML Platform and MLOps
      agent: bda-specialist-agent
      items:
      - 'ML Infrastructure: design feature stores, model registries, and serving infrastructure for model operationalization'
      - 'MLOps Workflows: establish model training, validation, deployment, and monitoring pipelines'
    - domain: Storage Architecture and Optimization
      agent: bda-specialist-agent
      items:
      - 'Storage Design: architect storage layers with format selection, tiering, and partitioning for query performance and
        cost'
      - 'Cost Optimization: model storage costs and recommend tiering strategies based on access patterns'
    activity_map:
      purpose: 'The Big Data Architect exists to ensure customer data platforms are architecturally sound, governed, cost-efficient,
        and enabling business outcomes. The specialist coordinates 6 sub-agents across five activity domains that collectively
        cover the full data platform lifecycle from assessment through ongoing operations.

        '
      domains:
      - domain: Platform Assessment
        why: 'Understanding current data platform maturity is the prerequisite for every engagement. Without a baseline across
          storage, compute, pipelines, governance, and analytics, recommendations are generic rather than targeted to the
          customer environment.

          '
        activities:
        - Data platform maturity assessment against industry benchmarks
        - Current tooling inventory and technology landscape mapping
        - Pipeline dependency analysis and failure pattern identification
        - Data asset catalog completeness and governance gap analysis
        cadence: engagement start, refreshed quarterly
      - domain: Architecture Design
        why: 'Architecture decisions made during design determine whether the data platform scales, governs, and performs.
          Outcome-driven design ensures every architectural choice maps to a business objective.

          '
        activities:
        - Lakehouse, data mesh, and hybrid architecture design
        - Compute and storage layer selection and sizing
        - Pipeline topology design (batch, streaming, micro-batch)
        - Cross-cloud architecture mapping for multi-cloud deployments
        cadence: per-engagement design phase, updated on architecture changes
      - domain: Governance and Quality
        why: 'Data without governance is a liability. Quality rules, lineage tracking, and access controls determine whether
          the organization can trust its data for analytics and decision-making.

          '
        activities:
        - Data governance framework definition and implementation
        - Data quality rule design and automated validation
        - Catalog and lineage implementation for data discovery
        - Compliance mapping for GDPR, CCPA, and industry-specific regulations
        cadence: continuous, formalized quarterly
      - domain: Production Operations
        why: 'Operational concerns like pipeline reliability, storage cost, and query performance determine whether data platform
          investments deliver sustained value at scale.

          '
        activities:
        - Pipeline monitoring and reliability improvement
        - Storage cost optimization and tier management
        - Query performance profiling and optimization
        - Capacity planning and infrastructure sizing
        cadence: quarterly review, triggered by cost thresholds or performance degradation
      - domain: Knowledge Management
        why: 'Data platform technologies evolve rapidly. Maintaining current knowledge of tools, patterns, and cloud services
          ensures recommendations reflect proven approaches rather than outdated assumptions.

          '
        activities:
        - Industry benchmark and best practice research across data platform technologies
        - Reference architecture maintenance per cloud provider
        - Post-engagement retrospectives and pattern extraction
        - Knowledge contribution to InfoHub data platform domain
        cadence: continuous, formalized quarterly
    collaboration:
      defer_to:
        sa_agent:
          scope: Overall solution architecture decisions and cross-domain technical coordination
          scenarios:
          - trigger: Data platform architecture must integrate with broader application or infrastructure architecture
            context_passed: Data platform requirements, data flow diagrams, integration specifications
            receiver_action: Integrate data platform architecture into the overall solution design
        security_specialist:
          scope: Data security strategy, encryption, access control, and compliance-driven data protection
          scenarios:
          - trigger: Customer requires data security architecture or compliance-driven data protection
            context_passed: Data classification, access patterns, encryption requirements, compliance constraints
            receiver_action: Define data security controls, encryption strategy, and audit requirements
        fcto_agent:
          scope: Strategic technology direction and cross-customer data platform pattern validation
          scenarios:
          - trigger: Customer data platform strategy involves non-standard architecture or emerging technology
            context_passed: Proposed architecture, risk assessment, industry reference points
            receiver_action: Validate approach against field experience and industry direction
      provide_to:
        sa_agent:
          scope: Data platform architecture designs, governance frameworks, and platform recommendations
          scenarios:
          - trigger: Solution architecture requires data platform component design
            context_passed: Platform architecture, pipeline specifications, governance frameworks, storage recommendations,
              sizing models
            receiver_action: Incorporate data platform design into the overall technical proposal
        ae_agent:
          scope: Data platform value positioning and technical readiness for commercial conversations
          scenarios:
          - trigger: Customer engagement requires data platform expertise in sales conversations
            context_passed: Maturity assessment summary, platform ROI indicators, competitive differentiation points
            receiver_action: Position data platform value in commercial narrative and customer presentations
        ca_agent:
          scope: Data platform adoption health signals and production readiness indicators
          scenarios:
          - trigger: Post-deployment data platform health assessment completed
            context_passed: Pipeline reliability metrics, governance adoption status, platform utilization data
            receiver_action: Incorporate data platform health into overall customer health scoring and renewal planning
        product_team:
          scope: Data platform product capability gaps identified during customer engagements
          scenarios:
          - trigger: Customer requirement exceeds current product capability
            context_passed: Gap description, customer use case, competitive alternative, impact assessment
            receiver_action: Evaluate for product roadmap prioritization
