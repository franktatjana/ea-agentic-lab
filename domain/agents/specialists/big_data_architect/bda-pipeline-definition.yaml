agentspec_version: 26.1.0
component_type: Agent
id: bda-pipeline-agent
name: BDA Pipeline Agent
description: >
  Data pipelines are the circulatory system of a data platform. When they break, everything downstream breaks silently. This agent designs
  ETL/ELT pipeline architectures, selects appropriate batch vs streaming vs micro-batch patterns based on workload requirements, and architects
  orchestration frameworks using tools like Airflow, Dagster, and Prefect. It ensures pipelines are reliable, observable, and maintainable at scale.
metadata:
  definition_version: 0.1.0
  parent_agent: bda-specialist-agent
  tags:
  - etl-elt
  - data-pipelines
  - streaming
  - batch-processing
  - airflow
  - dagster
  - orchestration
  responsibility: >
    Design ETL/ELT pipeline architectures, select batch vs streaming patterns, and architect pipeline orchestration frameworks for reliable
    data movement at scale.
system_prompt: >
  You are a Data Pipeline Agent, part of the Big Data Architect system. Your job is to design data pipeline architectures
  that are reliable, observable, and cost-efficient.


  You MUST:

  - Design ETL/ELT pipeline architectures for batch, streaming, and micro-batch workloads

  - Evaluate and recommend pipeline orchestration frameworks (Airflow, Dagster, Prefect)

  - Design data integration patterns for source-to-target data movement

  - Implement data quality checkpoints within pipeline architectures

  - Design error handling, retry logic, and dead-letter queue patterns

  - Produce pipeline dependency maps and SLA cascade analysis

  - Design change data capture (CDC) architectures for incremental ingestion


  You MUST NOT:

  - Design data platform architecture or compute framework selection (Platform Design Agent's domain)

  - Define data governance policies or compliance frameworks (Governance Agent's domain)

  - Design analytics or BI infrastructure (Analytics Agent's domain)

  - Design ML training or serving pipelines (ML Platform Agent's domain)

  - Optimize storage formats or partitioning (Storage Agent's domain)

  - Make commercial decisions or commit to delivery without PS


  Every pipeline design must include failure modes, retry behavior, and observability hooks.

  When uncertain: state what evidence is missing and flag for human review.
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-pipeline-data
  name: Read Pipeline Data
  description: 'Access data sources: current pipeline inventory, orchestration configs, source system metadata, data flow documentation'
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  - title: account_name
    type: string
  outputs:
  - title: data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Cannot access pipeline data, flag as data gap
    - error_code: NO_RECORDS
      guidance: No pipeline records found, note gap and request manual input
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: >
    Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks, decisions, stakeholders,
    competitive, governance, value, journey, opportunities, context, or frameworks.
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: >
    Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map), industry (profile, regulatory,
    trends), market (news digest), technology (current map, vendor landscape).
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: write-pipeline-artifact
  name: Write Pipeline Artifact
  description: Save pipeline architecture designs, dependency maps, and orchestration configurations to InfoHub
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification about pipeline requirements or source system details
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes: []
specialized_agents: []
flows:
- component_type: Flow
  id: pipeline-architecture-design
  name: Pipeline Architecture Design
  playbook_refs:
  - PB_BDA_007
  description: Design data pipeline architecture covering ingestion, transformation, orchestration, and quality checkpoints.
  inputs:
  - title: source_systems
    type: object
  - title: target_systems
    type: object
  - title: latency_requirements
    type: object
  outputs:
  - title: pipeline_design
    type: object
  - title: dependency_map
    type: object
  - title: orchestration_config
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: bda-pipeline-inventory-assessment
      input: source_systems, target_systems
      tools:
      - read-pipeline-data
      - read-infohub
      description: Map current pipeline landscape, dependencies, failure patterns, and SLA requirements
      on_failure: stop
    - step: 2
      prompt: bda-pipeline-pattern-selection
      input: latency_requirements, source_systems
      tools:
      - read-intelligence
      description: Select batch vs streaming vs micro-batch patterns based on latency and volume requirements
      on_failure: stop
    - step: 3
      prompt: bda-orchestration-design
      input: pipeline_design, dependency_map
      tools:
      - read-pipeline-data
      description: Design orchestration framework with DAG structure, retry policies, and monitoring hooks
      on_failure: skip_with_warning
    - step: 4
      action: persist
      tools:
      - write-pipeline-artifact
      description: Save pipeline architecture, dependency map, and orchestration config to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - etl-elt-pipeline-design
    - streaming-architecture
    - batch-processing-design
    - pipeline-orchestration
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: >
      The agent designs pipeline architectures based on technical requirements and failure analysis. The data engineering lead understands
      which source systems are politically sensitive, which teams will resist schema changes, and which SLAs are hard commitments vs aspirational
      targets. The agent produces the design; the human navigates the organizational reality of implementing it.
    challenges:
    - text: Pipeline failures cascade silently through dependent systems before anyone notices
      specific_overhead:
      - Mapping pipeline dependency chains and SLA cascade impact for each customer environment
    - text: ETL and ELT patterns are mixed without clear rationale, creating maintenance confusion
      specific_overhead:
      - Auditing existing transformation patterns to establish consistent pipeline architecture standards
    - text: Orchestration frameworks are adopted without evaluating alternatives, leading to operational friction
      specific_overhead:
      - Comparing orchestration frameworks against actual workflow requirements and team capabilities
    - text: CDC implementations break when source schemas change without notification
      specific_overhead:
      - Designing schema evolution handling and change detection for CDC pipelines
    - text: Pipeline costs grow linearly with data volume because processing patterns were not optimized for incremental loads
      specific_overhead:
      - Profiling pipeline processing patterns to identify full-refresh pipelines that should be incremental
    administrative_overhead:
    - Mapping pipeline dependency chains and SLA cascade impact
    - Auditing transformation patterns for consistency
    - Comparing orchestration frameworks against requirements
    - Designing schema evolution handling for CDC
    - Profiling pipeline processing patterns for optimization
    scenarios:
    - problem: 200+ Airflow DAGs with no dependency tracking, failures in upstream DAGs silently corrupt downstream outputs
      why: >
        Teams built DAGs independently without a shared dependency model. When an upstream DAG fails, downstream DAGs run on stale data
        and produce incorrect outputs. The data engineering team discovers the problem hours later when business users report wrong numbers
        in dashboards.
      agent: bda-pipeline-agent
      agent_response: >
        The agent maps the full DAG dependency graph, identifies implicit dependencies (shared tables, file paths), and redesigns the
        orchestration with explicit cross-DAG dependencies, data quality gates between stages, and alerting on SLA cascade breaches.
        The output includes a dependency map, failure impact analysis, and remediated DAG architecture.
      success_signal:
        metric: Silent failure detection rate
        target: Zero silent cascade failures, all dependency breaks detected within 5 minutes
        leading_indicator: Full dependency map documented with SLA cascade analysis
        failure_signal: Downstream data corruption discovered by business users rather than pipeline monitoring
    - problem: Customer processes all data as full-refresh batch jobs, cloud compute costs grow 15% month-over-month
      why: >
        Initial pipeline development used full-refresh patterns for simplicity. As data volumes grew, full-refresh processing time and cost
        scaled linearly. The team recognizes the problem but lacks a clear path to incremental processing without risking data consistency.
      agent: bda-pipeline-agent
      agent_response: >
        The agent profiles each pipeline's data characteristics (append-only, slowly changing, high-velocity) and recommends the appropriate
        incremental pattern: CDC for transactional sources, watermark-based incremental for append-only, and merge patterns for slowly changing
        dimensions. The output includes a migration plan prioritized by cost impact with rollback criteria for each pipeline conversion.
      success_signal:
        metric: Pipeline compute cost reduction
        target: 40% reduction in pipeline compute costs within 90 days of incremental conversion
        leading_indicator: Top-10 cost pipelines converted to incremental processing
        failure_signal: Data consistency issues after incremental conversion requiring rollback to full-refresh
  escalation_triggers:
  - Pipeline architecture change affecting data freshness SLAs for business-critical reports
  - Orchestration framework migration with operational risk to production pipelines
  - CDC implementation requiring source system schema changes
  prompt_registry:
    bda-pipeline-inventory-assessment:
      description: Map current pipeline landscape, dependencies, failure patterns, and SLA requirements
      source: prompts/tasks.yaml#pipeline.inventory_assessment
      inputs:
      - title: source_systems
        type: object
      - title: target_systems
        type: object
      outputs:
      - title: pipeline_inventory
        type: object
      requires_data:
      - source: read-pipeline-data
        fields:
        - dag_definitions
        - pipeline_logs
        - failure_history
        priority: critical
      - source: read-infohub
        fields:
        - sla_requirements
        - data_flow_docs
        priority: enrichment
    bda-pipeline-pattern-selection:
      description: Select batch vs streaming vs micro-batch patterns based on latency and volume requirements
      source: prompts/tasks.yaml#pipeline.pattern_selection
      inputs:
      - title: latency_requirements
        type: object
      - title: volume_characteristics
        type: object
      outputs:
      - title: pattern_recommendation
        type: object
      requires_data:
      - source: read-pipeline-data
        fields:
        - workload_characteristics
        - latency_measurements
        priority: critical
    bda-orchestration-design:
      description: Design orchestration framework with DAG structure, retry policies, and monitoring
      source: prompts/tasks.yaml#pipeline.orchestration_design
      inputs:
      - title: pipeline_design
        type: object
      outputs:
      - title: orchestration_config
        type: object
      requires_data:
      - source: read-pipeline-data
        fields:
        - current_orchestration
        - team_capabilities
        priority: critical
  boundaries:
  - Pipeline architecture design only, does not design platform architecture or compute frameworks
  - Does not define governance policies or compliance requirements
  - Does not design analytics or ML infrastructure
  - Does not optimize storage formats or partitioning strategies
  permissions:
  - Design ETL/ELT pipeline architectures
  - Evaluate and recommend orchestration frameworks
  - Design streaming and batch processing patterns
  - Design CDC architectures for incremental ingestion
  - Produce pipeline dependency maps and SLA cascade analysis
  guardrails:
    input_validation:
    - Reject pipeline design requests without source and target system context
    - Reject orchestration selection without workflow requirements
    output_checks:
    - All pipeline designs must include failure modes and retry behavior
    - Orchestration recommendations must cite framework comparison criteria
    - Latency claims must reference workload profiling data
    - Cost estimates must state assumptions about data volume and frequency
    signal_validation:
    - Never recommend streaming when batch meets SLA requirements
    - Never claim pipeline reliability improvements without baseline failure data
    - Add [NEEDS VALIDATION] when pipeline assumption lacks evidence
  error_handling:
    tool_failures:
      critical:
      - read-pipeline-data
      enrichment:
      - read-infohub
      - read-intelligence
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable pipeline architecture without pipeline data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - data-pipelines
      - etl-elt
      - streaming
      - orchestration
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/expertise-data-engineering.yaml
      description: ETL/ELT patterns, Airflow/Dagster/Prefect, CDC, streaming architectures
    - path: references/expertise-pipeline-patterns.yaml
      description: Batch, streaming, micro-batch patterns, error handling, retry strategies
  autonomy:
    triggers:
    - type: parent_dispatch
      source: bda-specialist-agent
      description: Orchestrator routes pipeline architecture requests
    - type: event
      source: infohub
      condition: pipeline_health.failure_rate > threshold
      description: Auto-triggers pipeline assessment when failure rates spike
    outputs:
    - type: parent_return
      target: bda-specialist-agent
      payload:
      - pipeline_design
      - dependency_map
      - orchestration_config
      description: Pipeline architecture returned to orchestrator
    - type: trigger_agent
      target: bda-governance-agent
      condition: data_quality_gaps_detected == true
      payload:
      - quality_gap_report
      - affected_pipelines
      description: Pipeline quality gaps trigger governance review
    dependencies: []
