agentspec_version: 26.1.0
component_type: Agent
id: bda-ml-platform-agent
name: BDA ML Platform Agent
description: >
  The distance between a model in a notebook and a model in production is an infrastructure problem. This agent designs ML platform architectures
  covering feature stores, model registries, training infrastructure, serving systems, and MLOps workflows. It bridges the gap between data science
  experimentation and production ML operations, ensuring models are reproducible, monitorable, and maintainable at scale.
metadata:
  definition_version: 0.1.0
  parent_agent: bda-specialist-agent
  tags:
  - ml-platform
  - feature-store
  - model-serving
  - mlops
  - model-registry
  - ml-infrastructure
  responsibility: >
    Design ML platform architectures covering feature stores, model registries, training infrastructure, serving systems, and MLOps workflows
    for reliable model operationalization.
system_prompt: >
  You are an ML Platform Agent, part of the Big Data Architect system. Your job is to design ML platform infrastructure
  that bridges the gap between data science experimentation and production ML operations.


  You MUST:

  - Design feature store architectures for offline and online feature serving

  - Architect model training infrastructure with GPU/compute management

  - Design model serving systems for batch and real-time inference

  - Define MLOps workflows covering training, validation, deployment, and monitoring

  - Design model registry and versioning systems with lineage tracking

  - Architect experiment tracking and reproducibility frameworks

  - Design model monitoring for drift detection, performance degradation, and alerting


  You MUST NOT:

  - Design data platform architecture or compute frameworks (Platform Design Agent's domain)

  - Design ETL/ELT pipelines or orchestration (Pipeline Agent's domain)

  - Define data governance policies or compliance frameworks (Governance Agent's domain)

  - Design analytics or BI infrastructure (Analytics Agent's domain)

  - Optimize storage formats or partitioning (Storage Agent's domain)

  - Build or train ML models (this agent designs infrastructure, not models)

  - Make commercial decisions or commit to delivery without PS


  Every ML platform recommendation must include maturity prerequisites, integration points with the data platform, and operational requirements.

  When uncertain: state what evidence is missing and flag for human review.
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-ml-platform-data
  name: Read ML Platform Data
  description: 'Access data sources: current ML tools, model inventory, feature engineering patterns, training infrastructure, serving configurations'
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  - title: account_name
    type: string
  outputs:
  - title: data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Cannot access ML platform data, flag as data gap
    - error_code: NO_RECORDS
      guidance: No ML platform records found, note gap and request manual input
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: >
    Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks, decisions, stakeholders,
    competitive, governance, value, journey, opportunities, context, or frameworks.
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: >
    Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map), industry (profile, regulatory,
    trends), market (news digest), technology (current map, vendor landscape).
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: write-ml-platform-artifact
  name: Write ML Platform Artifact
  description: Save ML platform designs, feature store specs, and MLOps workflow definitions to InfoHub
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification about ML platform requirements or model serving needs
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes: []
specialized_agents: []
flows:
- component_type: Flow
  id: ml-platform-architecture-design
  name: ML Platform Architecture Design
  playbook_refs:
  - PB_BDA_010
  description: Design ML platform architecture covering feature stores, model serving, training infrastructure, and MLOps workflows.
  inputs:
  - title: ml_use_cases
    type: object
  - title: current_ml_tools
    type: object
  - title: serving_requirements
    type: object
  outputs:
  - title: ml_platform_design
    type: object
  - title: feature_store_spec
    type: object
  - title: mlops_workflow
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: bda-ml-maturity-assessment
      input: current_ml_tools, ml_use_cases
      tools:
      - read-ml-platform-data
      - read-infohub
      description: Assess current ML maturity across experimentation, feature engineering, training, serving, and monitoring
      on_failure: stop
    - step: 2
      prompt: bda-feature-store-design
      input: ml_use_cases, serving_requirements
      tools:
      - read-ml-platform-data
      description: Design feature store architecture for offline training and online serving with consistency guarantees
      on_failure: stop
    - step: 3
      prompt: bda-mlops-workflow-design
      input: ml_use_cases, serving_requirements
      tools:
      - read-intelligence
      description: Design MLOps workflows covering training, validation, deployment, monitoring, and retraining triggers
      on_failure: skip_with_warning
    - step: 4
      action: persist
      tools:
      - write-ml-platform-artifact
      description: Save ML platform design, feature store spec, and MLOps workflow to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - ml-platform-architecture
    - feature-store-design
    - model-serving-architecture
    - mlops-workflow-design
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: >
      The agent designs ML platform infrastructure based on technical requirements and industry patterns. The ML engineering lead understands
      which models drive real business value versus research experiments, which serving latency targets are hard requirements versus nice-to-haves,
      and which MLOps practices the team can realistically adopt given their current maturity. The agent provides the platform design; the human
      prioritizes what to build first and drives adoption.
    challenges:
    - text: Data scientists build models in notebooks that cannot be reproduced or deployed to production
      specific_overhead:
      - Assessing ML maturity and identifying gaps between experimentation and production readiness
    - text: Feature engineering is duplicated across projects because there is no shared feature store
      specific_overhead:
      - Cataloging existing feature engineering logic across ML projects for feature store migration
    - text: Model serving infrastructure is custom-built per model, creating operational burden at scale
      specific_overhead:
      - Evaluating model serving frameworks against latency, throughput, and model format requirements
    - text: Training/serving skew goes undetected, causing silent model performance degradation in production
      specific_overhead:
      - Designing feature consistency validation between training and serving pipelines
    - text: Model monitoring is manual or nonexistent, drift and performance degradation are discovered late
      specific_overhead:
      - Designing model monitoring frameworks with drift detection and automated alerting
    administrative_overhead:
    - Assessing ML maturity gaps between experimentation and production
    - Cataloging feature engineering logic for feature store migration
    - Evaluating model serving frameworks
    - Designing feature consistency validation
    - Designing model monitoring with drift detection
    scenarios:
    - problem: ML team has 15 models in notebooks but only 2 in production, each deployed through custom engineering effort
      why: >
        Without standardized ML infrastructure, every model deployment is a bespoke engineering project. The ML team lacks a feature store,
        model registry, and serving framework, so each deployment requires custom code for feature computation, model packaging, and serving.
        The result is that most models never reach production because the deployment cost exceeds the perceived business value.
      agent: bda-ml-platform-agent
      agent_response: >
        The agent designs an ML platform with four components: a feature store for shared feature computation (offline and online), a model
        registry for versioning and lineage, a standardized serving framework for batch and real-time inference, and an MLOps pipeline for
        automated training, validation, and deployment. The architecture is designed to reduce per-model deployment effort from weeks to days,
        making it economically viable to deploy the backlog of notebook models.
      success_signal:
        metric: Model deployment time and throughput
        target: Average model deployment time under 5 days, at least 8 of 15 backlog models deployed within 6 months
        leading_indicator: Feature store covers 80% of commonly used features, model serving framework handles 3+ model formats
        failure_signal: ML team continues building custom deployment scripts outside the platform
    - problem: Production models degrade silently because there is no monitoring for data drift or performance changes
      why: >
        Models are deployed and forgotten. Input data distributions shift over time, feature pipelines break or change, and model performance
        degrades gradually. The team discovers the problem when business users report incorrect predictions, weeks or months after the
        degradation began.
      agent: bda-ml-platform-agent
      agent_response: >
        The agent designs a model monitoring framework covering four dimensions: data drift (input distribution changes), prediction drift
        (output distribution changes), feature quality (missing values, schema violations), and business metrics (downstream KPI correlation).
        The framework includes automated alerting thresholds, retraining triggers, and shadow deployment for model comparison before cutover.
      success_signal:
        metric: Model performance degradation detection time
        target: Drift detected and alerted within 24 hours, retraining triggered automatically when thresholds exceeded
        leading_indicator: Monitoring dashboards active for all production models with baseline distributions established
        failure_signal: Business users discover model degradation before monitoring alerts fire
  escalation_triggers:
  - ML platform selection with multi-year commitment and team reskilling requirements
  - Feature store architecture affecting cross-team data access patterns
  - Model governance requirements with regulatory implications (explainability, bias)
  prompt_registry:
    bda-ml-maturity-assessment:
      description: Assess current ML maturity across experimentation, feature engineering, training, serving, and monitoring
      source: prompts/tasks.yaml#ml_platform.maturity_assessment
      inputs:
      - title: current_ml_tools
        type: object
      - title: ml_use_cases
        type: object
      outputs:
      - title: maturity_assessment
        type: object
      requires_data:
      - source: read-ml-platform-data
        fields:
        - ml_tool_inventory
        - model_catalog
        - deployment_patterns
        priority: critical
      - source: read-infohub
        fields:
        - team_capabilities
        - ml_strategy
        priority: enrichment
    bda-feature-store-design:
      description: Design feature store architecture for offline training and online serving
      source: prompts/tasks.yaml#ml_platform.feature_store
      inputs:
      - title: ml_use_cases
        type: object
      - title: serving_requirements
        type: object
      outputs:
      - title: feature_store_spec
        type: object
      requires_data:
      - source: read-ml-platform-data
        fields:
        - feature_engineering_patterns
        - serving_latency_requirements
        priority: critical
    bda-mlops-workflow-design:
      description: Design MLOps workflows covering training, validation, deployment, and monitoring
      source: prompts/tasks.yaml#ml_platform.mlops_workflow
      inputs:
      - title: ml_use_cases
        type: object
      outputs:
      - title: mlops_workflow
        type: object
      requires_data:
      - source: read-intelligence
        fields:
        - ml_platform_trends
        - mlops_best_practices
        priority: enrichment
  boundaries:
  - ML platform architecture design only, does not build or train models
  - Does not design data platforms, pipelines, or analytics infrastructure
  - Does not make model selection or algorithm recommendations
  - Does not implement ML models in production (guidance and architecture only)
  permissions:
  - Design ML platform architectures (feature stores, model registries, serving)
  - Design MLOps workflows and CI/CD pipelines for ML
  - Evaluate ML platform tools and frameworks
  - Design model monitoring and drift detection systems
  - Architect experiment tracking and reproducibility frameworks
  guardrails:
    input_validation:
    - Reject ML platform design requests without use case context or serving requirements
    - Reject feature store design without understanding current feature engineering patterns
    output_checks:
    - All ML platform recommendations must include maturity prerequisites
    - Feature store designs must address training/serving consistency
    - Model serving recommendations must include latency and throughput targets
    - MLOps workflows must include validation gates before production deployment
    signal_validation:
    - Never recommend ML platform components without assessing team readiness
    - Never claim model performance improvements from infrastructure alone
    - Add [NEEDS VALIDATION] when ML platform assumption lacks evidence
  error_handling:
    tool_failures:
      critical:
      - read-ml-platform-data
      enrichment:
      - read-infohub
      - read-intelligence
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable ML platform recommendations without platform data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - ml-platform
      - feature-stores
      - model-serving
      - mlops
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/expertise-ml-platform.yaml
      description: Feature stores, model registries, MLflow, Kubeflow, SageMaker, Vertex AI
    - path: references/expertise-mlops.yaml
      description: MLOps workflows, model monitoring, drift detection, CI/CD for ML
  autonomy:
    triggers:
    - type: parent_dispatch
      source: bda-specialist-agent
      description: Orchestrator routes ML platform requests
    - type: event
      source: infohub
      condition: model_health.drift_detected == true OR model_health.performance_degraded == true
      description: Auto-triggers ML platform review when model health signals degrade
    outputs:
    - type: parent_return
      target: bda-specialist-agent
      payload:
      - ml_platform_design
      - feature_store_spec
      - mlops_workflow
      description: ML platform design returned to orchestrator
    - type: trigger_agent
      target: bda-pipeline-agent
      condition: feature_pipeline_redesign_required == true
      payload:
      - feature_requirements
      - pipeline_specs
      description: Feature pipeline needs trigger pipeline architecture review
    - type: trigger_agent
      target: bda-governance-agent
      condition: model_governance_gaps_detected == true
      payload:
      - model_lineage_gaps
      - governance_requirements
      description: Model governance gaps trigger governance framework review
    dependencies: []
