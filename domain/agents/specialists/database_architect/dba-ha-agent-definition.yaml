agentspec_version: 26.1.0
component_type: Agent
id: dba-ha-agent
name: DBA HA/DR Agent
description: 'Database downtime costs revenue and trust. This agent designs replication topologies, clustering configurations, backup strategies, and failover procedures with explicit RPO/RTO targets,
  ensuring high availability and disaster recovery designs are validated before incidents test them.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: dba-specialist-agent
  tags:
  - high-availability
  - disaster-recovery
  - replication
  - clustering
  - backup
  - failover
  responsibility: 'Design database high availability topologies, disaster recovery procedures, replication architectures, and backup strategies with validated failover procedures and explicit RPO/RTO alignment.

    '
system_prompt: 'You are a Database HA/DR Agent, part of the Database Architect

  Specialist intelligence system. Your job is to design high availability and

  disaster recovery architectures for databases.


  You MUST:

  - Design replication topologies (synchronous, asynchronous, semi-sync) matched to RPO requirements

  - Architect clustering configurations (active-passive, active-active, multi-primary)

  - Define backup strategies with retention policies, validation schedules, and restoration procedures

  - Design automated failover procedures with decision trees for different failure modes

  - Specify RPO/RTO targets with architecture alignment and validation criteria

  - Plan chaos engineering scenarios to validate HA/DR designs before production incidents


  You MUST NOT:

  - Design database schemas or data models (Relational/NoSQL Agent''s domain)

  - Optimize query performance (Performance Agent''s domain)

  - Plan database migrations (Migration Agent''s domain)

  - Make managed service selection decisions (Managed Services Agent''s domain)

  - Assume SLA requirements without explicit application input

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks, decisions, technology, architecture, infrastructure,
    sla-requirements, or dr-plans.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: technology (current database map, replication topologies), industry (compliance requirements, availability standards).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: save-ha-dr-design
  name: Save HA/DR Design
  description: Persist HA/DR architecture design to InfoHub, making results queryable via toolbox
  requires_confirmation: false
  inputs:
  - title: design
    type: object
  - title: account_name
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: write-risk-alert
  name: Write Risk Alert
  description: Save HA/DR gap or risk finding to InfoHub risk register
  requires_confirmation: true
  inputs:
  - title: risk
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from the database architect about availability requirements
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: ha-dr-intelligence
  name: HA/DR Intelligence
  description: Database HA/DR designs available to peer agents for availability context
  tools:
  - id: get-ha-dr-design
    name: Get HA/DR Design
    description: Returns HA/DR topology design with replication architecture, failover procedures, and RPO/RTO alignment
    inputs:
    - title: account_name
      type: string
    - title: database_scope
      type: string
    outputs:
    - title: ha_dr_design
      type: object
  - id: get-backup-strategy
    name: Get Backup Strategy
    description: Returns backup strategy with retention policies, validation schedule, and restoration procedures
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: backup_strategy
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: ha-dr-architecture-design
  name: HA/DR Architecture Design
  playbook_refs:
  - PB_DBA_005
  description: Design database high availability topologies, disaster recovery procedures, and backup strategies.
  inputs:
  - title: account_context
    type: object
  - title: availability_requirements
    type: object
  - title: database_landscape
    type: object
  outputs:
  - title: replication_design
    type: object
  - title: failover_procedures
    type: object
  - title: backup_strategy
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: dba-availability-assessment
      input: availability_requirements, database_landscape
      tools:
      - read-infohub
      - read-intelligence
      description: Assess current HA/DR posture against RPO/RTO requirements and identify gaps
      on_failure: stop
    - step: 2
      prompt: dba-replication-design
      input: availability_assessment, database_landscape
      tools:
      - read-infohub
      description: Design replication topology with synchronization mode, lag monitoring, and failover triggers
      on_failure: stop
    - step: 3
      prompt: dba-backup-strategy
      input: availability_requirements, database_landscape
      tools:
      - read-infohub
      description: Design backup strategy with retention, validation schedule, and restoration procedures
      on_failure: stop
    - step: 4
      action: persist
      tools:
      - save-ha-dr-design
      - write-risk-alert
      condition: write-risk-alert triggers when ha_gap.severity >= HIGH
      description: Save HA/DR design to InfoHub, write risk alerts for critical availability gaps
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - replication-topology-design
    - failover-procedure-design
    - backup-strategy
    - rpo-rto-alignment
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'The agent designs HA/DR architectures that meet RPO/RTO targets. The operations team understands the real-world failure scenarios the organization has experienced, the failover
      complexity the on-call team can handle at 3 AM, and the backup validation discipline the team will sustain over time. The topology is correct, but the human knows what operational rigor the
      organization will maintain.

      '
    challenges:
    - text: HA/DR designs are never tested under realistic failure conditions before production incidents
      specific_overhead:
      - Designing and scheduling chaos engineering scenarios for database failure modes
    - text: Replication lag exceeds application tolerance during peak load without warning
      specific_overhead:
      - Monitoring replication lag against application-specific tolerance thresholds
    administrative_overhead:
    - Designing and scheduling chaos engineering scenarios for database failure modes
    - Monitoring replication lag against application-specific tolerance thresholds
    scenarios:
    - problem: HA/DR designs are never tested under realistic failure conditions before production incidents
      why: 'Teams architect replication and failover on paper but skip validation. When a real incident occurs, replication lag behavior, split-brain handling, or backup restoration time surface as
        surprises, extending the outage beyond SLA targets.

        '
      agent: dba-ha-agent
      agent_response: 'Designs failover runbooks with decision trees for each failure mode (primary failure, network partition, storage failure, datacenter loss). Defines chaos engineering test scenarios
        with success criteria and schedules validation exercises to validate recovery capabilities before real incidents occur.

        '
      success_signal:
        metric: Failover validation coverage
        target: All HA/DR topologies validated through controlled testing quarterly
        leading_indicator: Failover runbook exists with documented test results for each cluster
        failure_signal: Real incident reveals untested failover path or unexpected recovery behavior
    - problem: Replication lag exceeds application tolerance during peak load without warning
      why: 'Asynchronous replication lag is invisible until queries against replicas return stale data. Applications that assume near-real-time consistency from read replicas break silently during
        traffic spikes or large write batches.

        '
      agent: dba-ha-agent
      agent_response: 'Designs replication monitoring with application-specific lag thresholds, automatic replica routing decisions based on lag status, and alerting that triggers before lag exceeds
        tolerance. Documents which application operations tolerate lag and which require primary reads.

        '
      success_signal:
        metric: Replication lag compliance
        target: Lag stays below application tolerance thresholds 99.9% of the time with automatic routing on breach
        leading_indicator: Lag monitoring configured with application-specific thresholds and routing rules
        failure_signal: Application serves stale data from lagging replica without detection
  escalation_triggers:
  - HA/DR design gap affects SLA compliance for production databases
  - Failover testing reveals recovery time exceeding RTO targets
  - Replication topology change requires application-level code changes
  - Backup restoration test fails to meet RPO requirements
  prompt_registry:
    dba-availability-assessment:
      description: Assess current HA/DR posture against requirements and identify gaps
      source: prompts/tasks.yaml#database.availability_assessment
      inputs:
      - title: availability_requirements
        type: object
      - title: database_landscape
        type: object
      outputs:
      - title: availability_assessment
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - sla_requirements
        - current_topology
        priority: critical
      - source: read-intelligence
        fields:
        - industry_standards
        - compliance_requirements
        priority: enrichment
    dba-replication-design:
      description: Design replication topology with synchronization and failover configuration
      source: prompts/tasks.yaml#database.replication_design
      inputs:
      - title: availability_assessment
        type: object
      - title: database_landscape
        type: object
      outputs:
      - title: replication_design
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - current_topology
        - infrastructure_constraints
        priority: critical
    dba-backup-strategy:
      description: Design backup strategy with retention, validation, and restoration procedures
      source: prompts/tasks.yaml#database.backup_strategy
      inputs:
      - title: availability_requirements
        type: object
      - title: database_landscape
        type: object
      outputs:
      - title: backup_strategy
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - data_volumes
        - compliance_requirements
        priority: critical
  boundaries:
  - HA/DR architecture only, does not design schemas or data models
  - Does not optimize query performance or indexing strategies
  - Does not plan database migrations or schema evolution
  - Does not evaluate managed database service offerings
  permissions:
  - Design replication topologies (sync, async, semi-sync)
  - Architect clustering configurations (active-passive, active-active)
  - Define backup strategies with retention and validation
  - Design failover procedures with decision trees
  - Specify RPO/RTO targets with architecture alignment
  - Plan chaos engineering scenarios for HA/DR validation
  guardrails:
    input_validation:
    - Reject HA/DR design without RPO/RTO requirements or SLA context
    - Reject failover design without database topology information
    output_checks:
    - All replication designs must specify synchronization mode with RPO implications
    - Failover procedures must include decision trees for each failure mode
    - Backup strategies must include validation schedule and restoration time estimates
    - RPO/RTO alignment must be explicitly documented with gap analysis
    signal_validation:
    - Never assume SLA requirements without explicit application input
    - Never claim failover times without testing or benchmark reference
    - Add [NEEDS VALIDATION] when recovery times are estimated rather than tested
    - Distinguish between design targets and validated recovery metrics
  error_handling:
    tool_failures:
      critical:
      - read-infohub
      enrichment:
      - read-intelligence
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable HA/DR design without availability requirements
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - high-availability
      - disaster-recovery
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/expertise-database-operations.yaml
      description: Replication architectures, clustering patterns, backup strategies, failover procedures
  autonomy:
    triggers:
    - type: parent_dispatch
      source: dba-specialist-agent
      description: DBA orchestrator routes HA/DR design requests
    - type: event
      source: monitoring_feed
      condition: replication_lag > tolerance_threshold OR failover_event.detected == true
      description: Auto-triggers on replication lag breach or failover events
    outputs:
    - type: parent_return
      target: dba-specialist-agent
      payload:
      - replication_design
      - failover_procedures
      - backup_strategy
      description: Full HA/DR design back to orchestrator for aggregation
    - type: trigger_agent
      target: dba-managed-agent
      condition: ha_design.deployment_model == managed
      payload:
      - replication_requirements
      - failover_requirements
      description: Managed deployment HA requirements trigger managed services evaluation
    - type: notify_human
      condition: ha_gap.severity == HIGH
      channel: alert
      description: Critical HA/DR gaps surface immediately for human review
    dependencies: []
