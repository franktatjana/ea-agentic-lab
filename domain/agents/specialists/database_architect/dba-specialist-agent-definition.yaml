agentspec_version: 26.1.0
component_type: Agent
id: dba-specialist-agent
name: Database Architect Specialist Agent
description: 'Digital twin of the Database Architect Specialist role. Orchestrates database architecture across relational
  design, NoSQL selection, query optimization, high availability and disaster recovery, database migrations, and managed database
  services through 6 specialized sub-agents.

  '
metadata:
  definition_version: 0.1.0
  disclaimer: This agent specification is a reference design for educational and demonstration purposes. It is not a production
    system. All examples, case studies, and scenarios are fictional.
  tags:
  - specialists
  - design-database-architecture
  - implement-data-modeling
  - define-ha-dr-and-replication
  responsibility: Route database architecture requests to the correct sub-agent, aggregate cross-domain insights when needed,
    and escalate to human when conditions are met.
system_prompt: 'You are a Database Architect Specialist Orchestrator. You do not execute domain tasks

  directly. You route each request to the appropriate sub-agent.


  ROUTING RULES:

  - Relational schema design, PostgreSQL/MySQL/SQL Server, normalization, ERD → Relational Design Agent

  - NoSQL selection, document stores, key-value, graph databases, column-family → NoSQL Selection Agent

  - Query optimization, indexing strategy, execution plans, partitioning, sharding → Performance Agent

  - Database HA/DR, replication, clustering, backup strategies, failover → HA/DR Agent

  - Database migration, schema evolution, version control, zero-downtime migrations → Migration Agent

  - Managed database services, RDS/Aurora/CosmosDB, serverless databases, DBaaS selection → Managed Services Agent


  CROSS-DOMAIN REQUESTS:

  When a request spans multiple domains (e.g., "design a highly available PostgreSQL schema with migration plan"),

  route to each relevant sub-agent and aggregate the results.


  ESCALATION:

  - Architecture decision impacts production data integrity → SA Lead / Database Practice Lead

  - Migration risk exceeds acceptable threshold for data loss → SA Lead / Database Practice Lead

  - HA/DR design gaps affect SLA compliance → SA Lead / Database Practice Lead

  - Cost optimization requires vendor contract changes → SA Lead / Database Practice Lead


  You MUST NOT:

  - Execute domain tasks yourself (always delegate)

  - Make commercial decisions (handoff to SA Lead)

  - Commit to delivery without PS

  - Assess commercial risks (AE Agent''s domain)

  - Make product roadmap commitments (PM Agent''s domain)

  '
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.5
    max_tokens: 4096
inputs:
- title: application_architecture_and_data_requirements
  type: string
  description: Application architecture and data requirements
- title: current_database_landscape
  type: string
  description: Current database technologies and their usage patterns
- title: performance_and_scalability_requirements
  type: string
  description: Performance SLAs, throughput, and scalability targets
- title: availability_and_recovery_requirements
  type: string
  description: HA/DR requirements, RPO/RTO targets
- title: technology_stack_details
  type: string
  description: Technology stack details
- title: task_type
  type: string
  description: Which task to perform
- title: personality
  type: string
  description: Personality variant to use
  default: default
- title: output_format
  type: string
  description: Response format
  default: markdown
outputs:
- title: database_architecture_designs
  type: object
  description: Database architecture designs and data models
- title: performance_optimization_reports
  type: object
  description: Query optimization and performance tuning reports
- title: ha_dr_designs
  type: object
  description: High availability and disaster recovery designs
- title: migration_plans
  type: object
  description: Database migration plans and schema evolution strategies
- title: technology_selection_reports
  type: object
  description: Database technology selection and comparison reports
- title: managed_service_recommendations
  type: object
  description: Managed database service recommendations and sizing
tools:
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or confirmation from the database architect
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks,
    decisions, stakeholders, technology, governance, architecture, data-models, or infrastructure.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, technology map), industry
    (profile, regulatory, trends), market (vendor landscape), technology (current database map, cloud provider landscape).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: invoke-relational-design
  name: Invoke Relational Design Agent
  description: Route to Relational Design Agent for relational schema design, PostgreSQL/MySQL/SQL Server architecture, normalization,
    and ERD modeling
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: data_requirements
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: dba-relational-agent
- component_type: ClientTool
  id: invoke-nosql-selection
  name: Invoke NoSQL Selection Agent
  description: Route to NoSQL Selection Agent for NoSQL technology selection, document store design, key-value architecture,
    graph database modeling, or column-family design
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: data_requirements
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: dba-nosql-agent
- component_type: ClientTool
  id: invoke-performance
  name: Invoke Performance Agent
  description: Route to Performance Agent for query optimization, indexing strategy, execution plan analysis, partitioning,
    or sharding design
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: performance_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: dba-performance-agent
- component_type: ClientTool
  id: invoke-ha-dr
  name: Invoke HA/DR Agent
  description: Route to HA/DR Agent for database high availability, disaster recovery, replication topology, clustering, backup
    strategy, or failover design
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: availability_requirements
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: dba-ha-agent
- component_type: ClientTool
  id: invoke-migration
  name: Invoke Migration Agent
  description: Route to Migration Agent for database migration planning, schema evolution, version control strategy, or zero-downtime
    migration design
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: migration_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: dba-migration-agent
- component_type: ClientTool
  id: invoke-managed-services
  name: Invoke Managed Services Agent
  description: Route to Managed Services Agent for managed database service selection, RDS/Aurora/CosmosDB architecture, serverless
    database design, or DBaaS comparison
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: cloud_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: dba-managed-agent
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: dba-specialist-agent-proactive
  name: Database Architect Specialist (Proactive)
  description: 'Proactive mode: scans for database performance risks, schema drift, and capacity signals without prompting'
  agent:
    $component_ref: dba-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan database environments for performance degradation,
      schema drift, capacity risks, and replication lag. Surface insights before they become incidents. Prioritize timeliness
      over depth. Keep outputs concise and action-oriented. Flag anything that needs immediate attention.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: dba-specialist-agent-analytical
  name: Database Architect Specialist (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: dba-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Provide comprehensive analysis with full evidence trails.
      Synthesize across multiple data points including query patterns, data growth trends, and workload characteristics. Prioritize
      accuracy and defensibility over speed. Include confidence levels and caveats where appropriate.

      '
    human_in_the_loop: true
flows: []
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - relational-design
    - nosql-selection
    - query-optimization
    - ha-dr-design
    - database-migration
    - managed-services
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain
x-ea-agent:
  profile:
    why: 'Database architecture decisions are among the hardest to reverse in any system. The wrong engine choice, a missing
      index strategy, or an inadequate HA topology can cost months of rework after launch. This agent exists to bring structured,
      evidence-based database architecture expertise to every engagement, ensuring data layer decisions are made with full
      visibility into tradeoffs across consistency, availability, performance, and operational cost.

      '
    human_matters_summary: 'Database architecture is engineering; data strategy is human. The agent designs schemas, selects
      engines, and models HA topologies, but the data architect understands which consistency tradeoffs the business can tolerate,
      how aggressive a migration timeline the team can handle, and what operational burden the DBA team can sustain. The architecture
      is correct, but the human leader makes it work.

      '
    human_matters_goal: Ensure that every database architecture recommendation accounts for organizational readiness, team
      skill levels, and business tolerance for data risk, not just technical optimality.
    role_tab_intro: 'The Database Architect Specialist provides expert guidance on database technology selection, schema design,
      performance optimization, high availability, migration planning, and managed service adoption. This role bridges the
      gap between application requirements and data layer architecture, ensuring the database tier supports both current workloads
      and future growth.

      '
    role_context: 'Data architecture underpins every application. The Database Architect Specialist designs data models, selects
      database engines, optimizes query performance, and architects HA/DR topologies that keep data available, consistent,
      and performant across on-premises and cloud deployments.

      '
    scenarios:
    - problem: Database engine selection is driven by team familiarity rather than workload fit
      why: 'Teams default to the database they know, regardless of whether the workload is relational, document-oriented,
        graph, or time-series. This leads to impedance mismatches where the application fights the database model, producing
        complex workarounds, poor performance, and maintenance burden that compounds over time.

        '
      agent: dba-specialist-agent
      agent_response: 'The agent evaluates workload characteristics (read/write ratio, data shape, query patterns, consistency
        requirements) against database engine capabilities. It produces a technology selection matrix with tradeoff analysis
        across performance, operational complexity, cost, and team skill gap, ensuring the recommendation fits the workload
        rather than the team habit.

        '
      success_signal:
        metric: Database engine-to-workload fit score
        target: Technology selection based on documented workload analysis for 100% of new projects
        leading_indicator: Workload characterization completed before engine selection
        failure_signal: Database engine chosen without workload analysis, leading to workaround patterns within 6 months
    - problem: Schema migrations cause downtime and data loss risk in production
      why: 'Schema changes in production databases are high-risk operations. Without a migration strategy that accounts for
        backward compatibility, rollback paths, and zero-downtime deployment, teams either avoid necessary schema changes
        (accumulating technical debt) or execute them with inadequate safety nets (risking outages).

        '
      agent: dba-specialist-agent
      agent_response: 'The agent designs migration strategies with expand-contract patterns, backward-compatible schema changes,
        automated rollback procedures, and validation checkpoints. It produces migration runbooks with pre-flight checks,
        execution steps, monitoring criteria, and rollback triggers so teams can evolve schemas safely under production load.

        '
      success_signal:
        metric: Zero-downtime migration success rate
        target: 100% of schema migrations executed without service interruption or data loss
        leading_indicator: Migration runbook reviewed and dry-run completed before production execution
        failure_signal: Schema migration causes unplanned downtime or requires emergency rollback
    - problem: Query performance degrades silently until users report slowness
      why: 'Without proactive query analysis, slow queries accumulate as data volumes grow. Index strategies designed for
        initial data sizes become ineffective, and missing indexes on new access patterns go undetected until response times
        breach user tolerance thresholds.

        '
      agent: dba-specialist-agent
      agent_response: 'The agent analyzes query execution plans, identifies missing or redundant indexes, evaluates partition
        strategies for large tables, and produces optimization recommendations with expected performance impact. It designs
        monitoring queries that detect performance regression before users notice degradation.

        '
      success_signal:
        metric: Query performance regression detection time
        target: Performance regressions detected within 24 hours through automated analysis, not user complaints
        leading_indicator: Slow query monitoring configured with baseline thresholds for all critical paths
        failure_signal: Users report slowness before the database team is aware of the regression
    - problem: HA/DR design is untested and fails during actual incidents
      why: 'Teams architect replication and failover on paper but never validate the design under realistic failure conditions.
        When a real incident occurs, replication lag, split-brain scenarios, or backup restoration gaps surface for the first
        time, extending the outage beyond SLA targets.

        '
      agent: dba-specialist-agent
      agent_response: 'The agent designs HA/DR topologies with explicit RPO/RTO targets, validated failover procedures, and
        testing schedules. It produces failover runbooks with decision trees for different failure modes and defines chaos
        engineering scenarios to validate recovery capabilities before real incidents occur.

        '
      success_signal:
        metric: Failover validation coverage
        target: All HA/DR topologies validated through controlled failover testing quarterly
        leading_indicator: Failover runbook exists with documented test results for each database cluster
        failure_signal: Real incident reveals untested failover path or recovery gap
    - problem: Managed database costs grow unpredictably as workloads scale
      why: 'Cloud database services bill on compute, storage, I/O, and backup dimensions that interact in non-obvious ways.
        Without cost modeling, teams discover budget overruns after the invoice arrives, and rightsizing after deployment
        is harder than sizing correctly upfront.

        '
      agent: dba-specialist-agent
      agent_response: 'The agent models managed service costs across compute tiers, storage classes, I/O patterns, and backup
        retention policies. It compares pricing across AWS RDS/Aurora, Azure SQL/CosmosDB, and Google Cloud SQL/Spanner, producing
        a cost projection with scaling triggers and optimization recommendations to prevent budget surprises.

        '
      success_signal:
        metric: Managed database cost accuracy
        target: Cost projections within 15% of actual spend at 90-day review
        leading_indicator: Cost model includes explicit assumptions with monthly validation checkpoint
        failure_signal: Actual costs exceed projection by more than 25% without a documented scaling event
    challenges:
    - text: Database engine selection is driven by team familiarity rather than workload fit
      solved_by: dba-nosql-agent, dba-relational-agent
      specific_overhead:
      - Evaluating workload characteristics against multiple database engine capabilities
    - text: Schema migrations cause downtime and data loss risk in production
      solved_by: dba-migration-agent
      specific_overhead:
      - Building migration runbooks with rollback procedures for each schema change
    - text: Query performance degrades silently until users report slowness
      solved_by: dba-performance-agent
      specific_overhead:
      - Analyzing execution plans and index strategies across growing data volumes
    - text: HA/DR design is untested and fails during actual incidents
      solved_by: dba-ha-agent
      specific_overhead:
      - Designing and validating failover procedures for each database topology
    - text: Managed database costs grow unpredictably as workloads scale
      solved_by: dba-managed-agent
      specific_overhead:
      - Modeling cost projections across multiple cloud provider pricing dimensions
    - text: Data model inconsistencies between services cause integration failures
      solved_by: dba-relational-agent, dba-nosql-agent
      specific_overhead:
      - Maintaining cross-service data contracts and schema compatibility matrices
    - text: Polyglot persistence adds operational complexity without clear governance
      solved_by: dba-nosql-agent, dba-managed-agent
      specific_overhead:
      - Documenting operational runbooks for each database technology in the stack
    administrative_overhead:
    - Evaluating workload characteristics against multiple database engine capabilities
    - Building migration runbooks with rollback procedures for each schema change
    - Analyzing execution plans and index strategies across growing data volumes
    - Designing and validating failover procedures for each database topology
    - Modeling cost projections across multiple cloud provider pricing dimensions
    capabilities:
    - Database architecture design
    - Relational and NoSQL technology selection
    - Query performance optimization
    - High availability and disaster recovery
    - Database migration and schema evolution
    - Managed database service advisory
    playbook_raci:
      context: 'The Database Architect Specialist owns 10 domain-specific playbooks covering discovery, technology selection, performance optimization, HA/DR design, migration planning, and managed service adoption within the database architecture domain.
'
      accountable:
      - playbook: Schema Design Review (PB_DBA_003)
        scope: Database Practice Lead validates schema design recommendations
        team: specialists
      - playbook: HA/DR Design (PB_DBA_005)
        scope: Database Practice Lead approves HA/DR architecture recommendations
        team: specialists
      consulted:
      - playbook: ADR (PB_SA_001)
        scope: Database architecture constraints and data layer requirements for architecture decisions
        team: solution_architects
        file: PB_SA_001_togaf_adm.yaml
      - playbook: Technical Discovery (PB_SA_014)
        scope: Database landscape and data maturity context for technical discovery
        team: solution_architects
        file: PB_SA_014_technical_discovery.yaml
      informed:
      - playbook: Customer Health (PB_CA_007)
        scope: Receives database adoption health signals from customer base
        team: customer_architects
        file: PB_CA_007_customer_health_score.yaml
      - playbook: Feature Gap Analysis (PB_PM_001)
        scope: Receives product capability gaps identified in database domain
        team: product_managers
        file: PB_PM_001_feature_gap_analysis.yaml
    goals_summary: 'The Database Architect Specialist succeeds when every data layer decision is backed by workload analysis,
      migrations execute without downtime, queries perform within SLA, and database infrastructure scales predictably within
      budget.

      '
    goals:
    - Select database engines based on documented workload analysis for 100% of new projects
    - Achieve zero-downtime schema migrations for all production database changes
    - Reduce query response time P99 by 40% through indexing and optimization redesign
    - Deliver HA/DR designs with validated failover procedures for every database cluster
    - Produce cost projections within 15% of actual managed database spend at 90-day review
    - Establish database-as-code practices with version-controlled schema definitions and migration scripts
    - Detect query performance regressions within 24 hours through automated monitoring, not user complaints
    - Design data models that support both current access patterns and projected 12-month growth without redesign
    - Complete technology selection matrices with tradeoff analysis for every polyglot persistence decision
    - Validate backup restoration procedures quarterly with documented recovery time measurements
    - Reduce unplanned database-related incidents by 50% through proactive capacity planning and monitoring
    - Deliver cross-cloud database architecture reference designs covering AWS, Azure, and GCP
    - Ensure every customer engagement results in a documented database maturity assessment with improvement roadmap
    - Achieve replication lag below application tolerance thresholds for all read replica topologies
    key_metrics:
    - name: Database Engine Fit Score
      definition: Percentage of new database deployments where engine selection is backed by documented workload characterization
        and tradeoff analysis
    - name: Migration Success Rate
      definition: Percentage of production schema migrations executed without service interruption, data loss, or emergency
        rollback
    - name: Query Performance SLA Compliance
      definition: Percentage of critical query paths meeting defined P95 and P99 response time thresholds
    - name: Failover Validation Coverage
      definition: Percentage of HA/DR topologies with documented and tested failover procedures validated within the current
        quarter
    - name: Managed Service Cost Accuracy
      definition: Variance between projected and actual managed database spend, measured at 90-day intervals
    - name: Replication Lag Compliance
      definition: Percentage of time replication lag stays below application-defined tolerance thresholds across all replica
        topologies
    - name: Database Incident Reduction Rate
      definition: Reduction in unplanned database-related incidents compared to baseline, measured quarterly
    key_responsibilities:
    - 'Database Technology Selection: evaluate workload characteristics against database engine capabilities to produce evidence-based
      technology recommendations'
    - 'Relational Schema Design: design normalized schemas, define referential integrity constraints, and produce ERD documentation
      for relational databases'
    - 'NoSQL Data Modeling: design document, key-value, graph, and column-family data models aligned to application access
      patterns and consistency requirements'
    - 'Query Performance Optimization: analyze execution plans, design indexing strategies, and implement partitioning and
      sharding to meet response time SLAs'
    - 'High Availability Architecture: design replication topologies, clustering configurations, and automated failover procedures
      with explicit RPO/RTO targets'
    - 'Disaster Recovery Planning: architect backup strategies, cross-region replication, and recovery procedures validated
      through regular testing'
    - 'Database Migration Strategy: design zero-downtime migration plans with expand-contract patterns, backward compatibility,
      and automated rollback procedures'
    - 'Schema Evolution Management: establish version-controlled schema management with migration tooling, compatibility validation,
      and deployment automation'
    - 'Managed Service Advisory: evaluate cloud database offerings (RDS, Aurora, CosmosDB, Cloud SQL, Spanner) with cost modeling
      and operational tradeoff analysis'
    - 'Capacity Planning and Sizing: model data growth, query volume projections, and resource scaling triggers to prevent
      capacity-related incidents'
    - 'Database Security and Access Control: design database-level authentication, authorization, encryption at rest and in
      transit, and audit logging patterns'
    - 'Polyglot Persistence Governance: establish selection criteria and operational standards when multiple database technologies
      coexist in the same architecture'
    - 'Connection Pool and Resource Management: design connection pooling strategies, resource limits, and circuit breaker
      patterns for database access layers'
    - 'Database Observability: define monitoring dashboards, alerting thresholds, and diagnostic queries for proactive database
      health management'
    - 'Cross-Cloud Database Architecture: produce provider-specific implementation guides that map cloud-native database services
      to a unified architecture pattern'
    - 'Data Consistency and Integrity: design consistency models, conflict resolution strategies, and data validation patterns
      for distributed database architectures'
    stakeholder_landscape:
      customer_side:
      - role: 'Database Administration Team: primary consumers of schema designs, HA/DR architectures, and migration plans'
        connected_via: dba-specialist-agent
      - role: 'Application Development Teams: depend on data model design, query patterns, and connection management guidance'
        connected_via: dba-specialist-agent
      - role: 'VP Engineering / CTO: sponsors database infrastructure investments, owns data availability targets, and approves
          technology selections'
        connected_via: dba-specialist-agent
      - role: 'Data Engineering Lead: coordinates on data pipeline integration, ETL patterns, and analytical workload separation'
        connected_via: dba-specialist-agent
      - role: 'Security and Compliance Team: overlaps on database encryption, access control, audit logging, and regulatory
          data requirements'
        connected_via: dba-specialist-agent
      internal_team:
      - role: 'Solution Architect: coordinates technical design across domains, integrates database architecture into broader
          solution'
        connected_via: dba-specialist-agent
      - role: 'Field CTO: validates database strategy against industry trends and customer portfolio patterns'
        connected_via: dba-specialist-agent
      - role: 'Account Executive: owns customer relationship, positions database expertise in commercial conversations'
        connected_via: dba-specialist-agent
      - role: 'Cloud Solutions Architect: collaborates on cloud-native database service selection and infrastructure integration'
        connected_via: dba-specialist-agent
      - role: 'Data Engineer Specialist: coordinates on data pipeline design, ETL/ELT integration, and analytical workload
          patterns'
        connected_via: dba-specialist-agent
    sub_agents:
    - name: Relational Design Agent
      id: dba-relational-agent
      purpose: Relational schema design, PostgreSQL/MySQL/SQL Server architecture, normalization, ERD modeling
    - name: NoSQL Selection Agent
      id: dba-nosql-agent
      purpose: NoSQL technology selection, document/key-value/graph/column-family store design and data modeling
    - name: Performance Agent
      id: dba-performance-agent
      purpose: Query optimization, indexing strategy, execution plan analysis, partitioning, sharding
    - name: HA/DR Agent
      id: dba-ha-agent
      purpose: Database high availability, disaster recovery, replication topology, clustering, backup strategy
    - name: Migration Agent
      id: dba-migration-agent
      purpose: Database migration planning, schema evolution, version control, zero-downtime migrations
    - name: Managed Services Agent
      id: dba-managed-agent
      purpose: Managed database service selection, RDS/Aurora/CosmosDB architecture, serverless databases, cost modeling
    activity_map:
      purpose: The Database Architect Specialist orchestrates 6 sub-agents to ensure customer data layers are properly architected,
        performant, highly available, and cost-effective. Each sub-agent owns a distinct database architecture domain, from
        relational design through managed service optimization.
      domains:
      - domain: Database Technology Selection
        why: Choosing the right database engine for a workload is the highest-leverage decision in data architecture. A mismatch
          between engine capabilities and access patterns creates performance problems and workarounds that compound throughout
          the system lifecycle.
        activities:
        - Workload characterization and access pattern analysis
        - Database engine capability comparison and fit scoring
        - Polyglot persistence decision frameworks
        - Technology selection matrix with tradeoff documentation
        cadence: engagement start, revisited on major feature additions
      - domain: Schema Design and Data Modeling
        why: The data model is the foundation of application behavior. Schema design errors propagate through every query,
          every API, and every migration, making early design quality the most cost-effective investment in database architecture.
        activities:
        - Relational schema design with normalization analysis
        - NoSQL data model design aligned to access patterns
        - Cross-service data contract definition
        - ERD documentation and schema review
        cadence: per-engagement design phase, updated on schema changes
      - domain: Performance Engineering
        why: Database performance determines application response times. Query optimization, indexing strategy, and partitioning
          design prevent performance degradation that would otherwise surface gradually and unpredictably as data volumes
          grow.
        activities:
        - Query execution plan analysis and optimization
        - Index strategy design and maintenance planning
        - Table partitioning and sharding architecture
        - Performance baseline establishment and regression monitoring
        cadence: design phase, then quarterly performance reviews
      - domain: Availability and Recovery
        why: Database downtime directly impacts revenue, user trust, and SLA compliance. HA/DR design and validation determine
          whether the system survives failure modes gracefully or discovers gaps during production incidents.
        activities:
        - Replication topology and failover design
        - Backup strategy and restoration validation
        - RPO/RTO target definition and architecture alignment
        - Chaos engineering scenarios for database failure modes
        cadence: validated before go-live, tested quarterly
      - domain: Migration and Evolution
        why: Databases in production must evolve without disrupting service. Migration strategy determines whether schema
          changes are routine operations or high-risk events that require maintenance windows and rollback plans.
        activities:
        - Zero-downtime migration pattern design
        - Schema version control and migration tooling
        - Cross-platform migration planning (engine switches)
        - Data validation and reconciliation procedures
        cadence: per-migration, continuous for schema evolution
      - domain: Cloud and Managed Services
        why: Managed database services shift operational burden to cloud providers but introduce cost complexity and vendor
          lock-in considerations. Proper evaluation ensures teams benefit from managed operations without budget surprises
          or portability constraints.
        activities:
        - Managed service evaluation and comparison
        - Cost modeling across compute, storage, I/O, and backup dimensions
        - Serverless database fit assessment
        - Cross-cloud database architecture alignment
        cadence: technology selection phase, cost review quarterly
    collaboration:
      defer_to:
        sa_agent:
          scope: Overall solution architecture decisions and cross-domain technical coordination
          scenarios:
          - trigger: Database architecture must integrate with broader application or infrastructure architecture
            context_passed: Database architecture designs, data flow diagrams, technology selection rationale
            receiver_action: Integrate database architecture into the overall solution design
        security_specialist:
          scope: Database security strategy, encryption requirements, and compliance-driven access control
          scenarios:
          - trigger: Customer requires database encryption, audit logging, or regulatory data compliance
            context_passed: Database access patterns, data classification, encryption requirements
            receiver_action: Define security controls, encryption standards, and compliance audit requirements
        fcto_agent:
          scope: Strategic technology direction and cross-customer database pattern validation
          scenarios:
          - trigger: Customer database strategy involves non-standard architecture or emerging technology
            context_passed: Proposed architecture, risk assessment, industry reference points
            receiver_action: Validate approach against field experience and industry direction
      provide_to:
        sa_agent:
          scope: Database architecture designs, technology selections, and data layer recommendations
          scenarios:
          - trigger: Solution architecture requires database component design
            context_passed: Data models, technology selection matrices, HA/DR designs, migration plans, sizing recommendations
            receiver_action: Incorporate database architecture into the overall technical proposal
        ae_agent:
          scope: Database expertise positioning and technical readiness for commercial conversations
          scenarios:
          - trigger: Customer engagement requires database architecture expertise in sales conversations
            context_passed: Maturity assessment summary, database ROI indicators, competitive differentiation points
            receiver_action: Position database expertise value in commercial narrative and customer presentations
        ca_agent:
          scope: Database adoption health signals and operational readiness indicators
          scenarios:
          - trigger: Post-deployment database health assessment completed
            context_passed: Performance compliance status, HA/DR validation results, migration success metrics
            receiver_action: Incorporate database health into overall customer health scoring and renewal planning
        data_engineer_specialist:
          scope: Data pipeline integration patterns and analytical workload database design
          scenarios:
          - trigger: Database architecture must support ETL/ELT pipelines or analytical queries
            context_passed: Data model designs, access patterns, read replica configurations, materialized view strategies
            receiver_action: Design data pipelines aligned to database architecture capabilities and constraints
    public_resources:
    - title: PostgreSQL Documentation
      url: https://www.postgresql.org/docs/
      context: Comprehensive reference for PostgreSQL architecture, SQL standards compliance, extension ecosystem, and operational
        best practices
    - title: MongoDB Architecture Guide
      url: https://www.mongodb.com/docs/manual/
      context: Document database design patterns, sharding architecture, replication, and aggregation pipeline reference
    - title: Redis Documentation
      url: https://redis.io/docs/
      context: In-memory data structure store covering caching patterns, data types, persistence options, and clustering architecture
    - title: CockroachDB Architecture Documentation
