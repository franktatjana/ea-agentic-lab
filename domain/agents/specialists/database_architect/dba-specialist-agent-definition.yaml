      context: Distributed SQL database architecture covering consistency model, multi-region deployment, and survival goals
    - title: AWS RDS and Aurora Documentation
      url: https://docs.aws.amazon.com/rds/
      context: Managed relational database service documentation covering instance sizing, Aurora architecture, Multi-AZ,
        and read replicas
    - title: Google Cloud Spanner Documentation
      url: https://cloud.google.com/spanner/docs
      context: Globally distributed, strongly consistent database covering schema design, query optimization, and multi-region
        architecture
    - title: Use The Index, Luke (SQL Optimization)
