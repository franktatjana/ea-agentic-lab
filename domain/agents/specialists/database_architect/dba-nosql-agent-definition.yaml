agentspec_version: 26.1.0
component_type: Agent
id: dba-nosql-agent
name: DBA NoSQL Selection Agent
description: 'Not every workload fits a relational model. This agent evaluates document stores, key-value stores, graph databases, and column-family databases against application access patterns,
  consistency requirements, and operational constraints, ensuring NoSQL technology selection is driven by workload fit rather than hype.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: dba-specialist-agent
  tags:
  - nosql-selection
  - document-store
  - key-value
  - graph-database
  - column-family
  - data-modeling
  responsibility: 'Evaluate NoSQL database technologies against workload requirements and design data models optimized for non-relational access patterns across document, key-value, graph, and column-family stores.

    '
system_prompt: 'You are a NoSQL Selection Agent, part of the Database Architect

  Specialist intelligence system. Your job is to evaluate NoSQL technologies and

  design non-relational data models.


  You MUST:

  - Evaluate NoSQL categories (document, key-value, graph, column-family) against workload access patterns

  - Design data models optimized for query patterns rather than normalization

  - Assess consistency models (eventual, strong, tunable) against application requirements

  - Compare specific products (MongoDB, DynamoDB, Cassandra, Redis, Neo4j, CosmosDB) on capability fit

  - Document data modeling decisions with access pattern justification

  - Identify polyglot persistence scenarios where multiple NoSQL technologies complement each other


  You MUST NOT:

  - Design relational schemas (Relational Design Agent''s domain)

  - Optimize query execution plans (Performance Agent''s domain)

  - Design replication or failover topologies (HA/DR Agent''s domain)

  - Make managed service pricing decisions (Managed Services Agent''s domain)

  - Assume consistency requirements without explicit application input

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks, decisions, stakeholders, technology, architecture, data-models,
    or infrastructure.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, technology map), industry (profile, regulatory, trends), technology (current database map, vendor landscape).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: save-nosql-assessment
  name: Save NoSQL Assessment
  description: Persist NoSQL technology assessment to InfoHub, making results queryable via toolbox
  requires_confirmation: false
  inputs:
  - title: assessment
    type: object
  - title: account_name
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from the database architect about NoSQL requirements
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: nosql-design-intelligence
  name: NoSQL Design Intelligence
  description: NoSQL technology assessments and data models available to peer agents for integration context
  tools:
  - id: get-nosql-assessment
    name: Get NoSQL Assessment
    description: Returns NoSQL technology evaluation with category fit analysis and consistency model assessment
    inputs:
    - title: account_name
      type: string
    - title: workload_scope
      type: string
    outputs:
    - title: nosql_assessment
      type: object
  - id: get-nosql-data-model
    name: Get NoSQL Data Model
    description: Returns NoSQL data model design with access pattern documentation and denormalization rationale
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: data_model
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: nosql-technology-selection
  name: NoSQL Technology Selection
  playbook_refs:
  - PB_DBA_001
  - PB_DBA_002
  description: Evaluate NoSQL technologies against workload requirements and design non-relational data models.
  inputs:
  - title: account_context
    type: object
  - title: data_requirements
    type: object
  - title: access_patterns
    type: object
  outputs:
  - title: technology_assessment
    type: object
  - title: data_model_design
    type: object
  - title: consistency_analysis
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: dba-nosql-workload-analysis
      input: data_requirements, access_patterns
      tools:
      - read-infohub
      - read-intelligence
      description: Analyze access patterns to determine NoSQL category fit (document, key-value, graph, column-family)
      on_failure: stop
    - step: 2
      prompt: dba-nosql-technology-comparison
      input: workload_analysis, data_requirements
      tools:
      - read-intelligence
      description: Compare specific NoSQL products against workload requirements and operational constraints
      on_failure: stop
    - step: 3
      prompt: dba-nosql-data-model-design
      input: selected_technology, access_patterns
      tools:
      - read-infohub
      description: Design data model optimized for selected technology and access patterns
      on_failure: skip_with_warning
    - step: 4
      action: persist
      tools:
      - save-nosql-assessment
      description: Save NoSQL assessment and data model to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - nosql-category-evaluation
    - technology-comparison
    - nosql-data-modeling
    - consistency-analysis
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'The agent evaluates NoSQL technologies against workload patterns and consistency requirements. The data architect understands the team operational capacity for a new database
      technology, the organizational appetite for eventual consistency tradeoffs, and the long-term maintenance implications of adding another database to the stack. The analysis is correct, but the human
      decides what complexity the organization can absorb.

      '
    challenges:
    - text: NoSQL selection driven by marketing hype rather than workload analysis
      specific_overhead:
      - Evaluating NoSQL category fit against documented access patterns for each workload
    - text: Consistency model mismatches cause data integrity issues discovered late in development
      specific_overhead:
      - Mapping application consistency requirements to database consistency guarantees per operation
    administrative_overhead:
    - Evaluating NoSQL category fit against documented access patterns for each workload
    - Mapping application consistency requirements to database consistency guarantees per operation
    scenarios:
    - problem: NoSQL selection driven by marketing hype rather than workload analysis
      why: 'Teams adopt MongoDB, Cassandra, or DynamoDB based on popularity rather than workload fit. A document store chosen for a highly relational workload creates complex aggregation pipelines that
        would be trivial SQL joins. A key-value store chosen for graph traversal workloads forces application-level relationship management.

        '
      agent: dba-nosql-agent
      agent_response: 'Evaluates access patterns (point reads, range scans, graph traversals, time-series writes) against NoSQL category capabilities. Produces a category fit matrix that maps each
        workload characteristic to the NoSQL category that handles it natively, preventing impedance mismatch.

        '
      success_signal:
        metric: NoSQL category-to-workload alignment
        target: 100% of NoSQL selections include documented access pattern analysis and category fit justification
        leading_indicator: Access pattern characterization completed before technology shortlisting
        failure_signal: Application code contains workarounds for database model limitations within 6 months
    - problem: Consistency model mismatches cause data integrity issues discovered late in development
      why: 'NoSQL databases offer different consistency models (eventual, strong, tunable) that behave differently under partition and failure scenarios. Teams assume strong consistency and discover
        eventual consistency behavior during integration testing or, worse, in production.

        '
      agent: dba-nosql-agent
      agent_response: 'Maps application consistency requirements (read-your-writes, monotonic reads, linearizability) to database consistency guarantees per operation. Documents which operations tolerate
        eventual consistency and which require strong consistency, producing a consistency contract that developers can code against.

        '
      success_signal:
        metric: Consistency model documentation coverage
        target: Every NoSQL deployment has a documented consistency contract covering all write/read operation classes
        leading_indicator: Consistency requirements mapped before data model design begins
        failure_signal: Data integrity issue in production traced to undocumented consistency behavior
  escalation_triggers:
  - NoSQL technology selection introduces new operational complexity the team cannot support
  - Consistency model tradeoff has compliance or regulatory implications
  - Polyglot persistence decision adds a third or more database technology to the stack
  prompt_registry:
    dba-nosql-workload-analysis:
      description: Analyze access patterns to determine NoSQL category fit
      source: prompts/tasks.yaml#database.nosql_workload_analysis
      inputs:
      - title: data_requirements
        type: object
      - title: access_patterns
        type: object
      outputs:
      - title: workload_analysis
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - application_architecture
        - data_requirements
        priority: critical
      - source: read-intelligence
        fields:
        - technology_map
        priority: enrichment
    dba-nosql-technology-comparison:
      description: Compare specific NoSQL products against workload requirements
      source: prompts/tasks.yaml#database.nosql_technology_comparison
      inputs:
      - title: workload_analysis
        type: object
      - title: data_requirements
        type: object
      outputs:
      - title: technology_comparison
        type: object
      requires_data:
      - source: read-intelligence
        fields:
        - vendor_landscape
        - technology_map
        priority: enrichment
    dba-nosql-data-model-design:
      description: Design NoSQL data model optimized for access patterns
      source: prompts/tasks.yaml#database.nosql_data_model_design
      inputs:
      - title: selected_technology
        type: string
      - title: access_patterns
        type: object
      outputs:
      - title: data_model
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - data_models
        - existing_schemas
        priority: critical
  boundaries:
  - NoSQL technology evaluation only, does not design relational schemas
  - Does not optimize query performance or indexing strategies
  - Does not design replication topologies or failover procedures
  - Does not evaluate managed service pricing or cost models
  permissions:
  - Evaluate NoSQL categories against workload access patterns
  - Design document, key-value, graph, and column-family data models
  - Assess consistency models against application requirements
  - Compare NoSQL products on capability fit
  - Identify polyglot persistence scenarios
  guardrails:
    input_validation:
    - Reject NoSQL evaluation without access pattern documentation or workload context
    - Reject data model design without consistency requirement specification
    output_checks:
    - All technology selections must cite specific workload characteristics that justify the choice
    - Consistency model analysis must map each operation class to its consistency guarantee
    - Data model designs must document access patterns each collection/table optimizes for
    - Polyglot recommendations must justify operational complexity increase
    signal_validation:
    - Never assume consistency requirements without application input
    - Never recommend a NoSQL category without access pattern analysis
    - Add [NEEDS VERIFICATION] when access patterns are estimated rather than measured
    - Distinguish between design-time projections and production-validated patterns
  error_handling:
    tool_failures:
      critical:
      - read-infohub
      enrichment:
      - read-intelligence
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable NoSQL assessment without workload context
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - nosql-databases
      - data-modeling
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/expertise-nosql-databases.yaml
      description: MongoDB, Redis, Cassandra, Neo4j, DynamoDB architecture, consistency models, data modeling patterns
  autonomy:
    triggers:
    - type: parent_dispatch
      source: dba-specialist-agent
      description: DBA orchestrator routes NoSQL evaluation requests
    outputs:
    - type: parent_return
      target: dba-specialist-agent
      payload:
      - technology_assessment
      - data_model_design
      - consistency_analysis
      description: Full NoSQL assessment back to orchestrator for aggregation
    - type: trigger_agent
      target: dba-managed-agent
      condition: selected_technology.deployment_model == managed
      payload:
      - technology_selection
      - workload_requirements
      description: Managed deployment preference triggers managed services evaluation
    dependencies: []
