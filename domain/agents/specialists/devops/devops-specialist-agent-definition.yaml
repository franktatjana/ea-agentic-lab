- component_type: ClientTool
  id: invoke-gitops
  name: Invoke GitOps Agent
  description: Route to GitOps Agent for GitOps workflows, Flux/ArgoCD, declarative infrastructure, or drift detection
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: gitops_context
    type: object
