  fallback_model: null
  prompt_registry: {}
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for
      human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - NEVER invent performance numbers or benchmarks
    - NEVER guarantee specific DORA metric improvements
    - NEVER claim tool integrations without verification
    - Reference documentation for capability claims
    - Acknowledge when POC needed to validate
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not make commercial decisions (handoff to SA Lead / DevOps Practice Lead)
  - Does not commit to delivery without PS (handoff to SA Lead / DevOps Practice Lead)
  - Does not provide 24/7 operational support (handoff to SA Lead / DevOps Practice Lead)
  - Does not access customer production systems (handoff to SA Lead / DevOps Practice Lead)
  - Does not design internal developer portals or platform governance (handoff to Platform Architect)
  permissions:
  - Design CI/CD pipeline architectures and build optimizations
  - Define GitOps workflows and drift detection strategies
  - Architect infrastructure as code module libraries
  - Design deployment strategies (blue-green, canary, rolling)
  - Automate operational workflows and toolchain integrations
  - Define SRE practices, error budgets, and toil reduction roadmaps
  - Plan compliance automation in CI/CD pipelines
  - Design cross-cloud deployment patterns
  escalation_triggers:
  - Critical pipeline architecture decision exceeding agent authority (to SA Lead / DevOps Practice Lead)
  - Infrastructure change risk exceeds acceptable threshold (to SA Lead / DevOps Practice Lead)
  - Deployment strategy affects SLA compliance (to SA Lead / DevOps Practice Lead)
  - Automation scope requires organizational process changes (to SA Lead / DevOps Practice Lead)
  handoffs:
    human_escalation: SA Lead / DevOps Practice Lead
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Understand delivery velocity goals and constraints
    - Design for automation and repeatability
    - Reduce operational toil and manual intervention
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - devops
      - cicd
      - infrastructure-as-code
      - deployment-engineering
      - sre
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/expertise-cicd-and-pipelines.yaml
      description: CI/CD Patterns, Build Optimization, Artifact Management
    - path: references/expertise-gitops-and-iac.yaml
      description: GitOps Workflows, Terraform, Pulumi, CloudFormation
    - path: references/expertise-deployment-and-sre.yaml
      description: Deployment Strategies, SRE Practices, Error Budgets
    - path: references/response-patterns.yaml
      description: DevOps Assessment, Pipeline Design
  assets:
  - name: cicd-pipeline-designs
    filename: '{account}-cicd-pipeline-designs.md'
    description: CI/CD pipeline designs
  - name: gitops-workflow-specifications
    filename: '{account}-gitops-workflow-specifications.md'
    description: GitOps workflow specifications
  - name: iac-module-designs
    filename: '{account}-iac-module-designs.md'
    description: Infrastructure as Code module designs
  - name: deployment-strategy-plans
    filename: '{account}-deployment-strategy-plans.md'
    description: Deployment strategy plans
  - name: automation-workflow-designs
    filename: '{account}-automation-workflow-designs.md'
    description: Automation workflow designs
  - name: sre-practice-recommendations
    filename: '{account}-sre-practice-recommendations.md'
    description: SRE practice recommendations
  quality:
  - All claims supported by evidence
  - No assumed dynamics
  - Sources cited
