  - title: task
    type: string
  - title: account_context
    type: object
  - title: automation_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: devops-automation-agent
- component_type: ClientTool
