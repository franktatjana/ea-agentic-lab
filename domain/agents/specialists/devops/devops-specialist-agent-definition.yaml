  name: Invoke SRE Agent
  description: Route to SRE Agent for error budgets, toil reduction, reliability engineering, or incident management
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: reliability_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: devops-sre-agent
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks,
    decisions, stakeholders, competitive, governance, value, journey, opportunities, context, or frameworks.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map),
    industry (profile, regulatory, trends), market (news digest), technology (current map, vendor landscape).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: devops-specialist-agent-proactive
  name: DevOps Specialist (Proactive)
  description: 'Proactive mode: scans for signals and surfaces insights without prompting'
  agent:
    $component_ref: devops-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan sources

      continuously for relevant signals. Surface insights before being

      asked. Prioritize timeliness over depth. Keep outputs concise and

      action-oriented. Flag anything that needs immediate attention.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: devops-specialist-agent-analytical
  name: DevOps Specialist (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: devops-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Provide comprehensive

      analysis with full evidence trails. Synthesize across multiple

      data points. Prioritize accuracy and defensibility over speed.

      Include confidence levels and caveats where appropriate.

      '
    human_in_the_loop: true
flows: []
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - cicd-pipeline-design
    - gitops-workflow
    - infrastructure-as-code
    - deployment-strategy
    - workflow-automation
    - sre-practices
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain
x-ea-agent:
  profile:
    why: 'DevOps engineering sits at the intersection of software delivery and operational reliability. Every organization
      shipping software faces the same friction: slow pipelines, manual deployments, configuration drift, and reactive incident
      response. The DevOps Specialist removes that friction by designing automated, repeatable, and observable delivery systems.
      Without this role, teams accumulate technical debt in their delivery infrastructure, which compounds into slower releases,
      higher failure rates, and longer recovery times.'
    human_matters_summary: 'Pipeline architecture is engineering; delivery culture is human. The agent designs CI/CD pipelines,
      IaC modules, and deployment strategies, but the DevOps leader understands which automation the team will adopt, how
      aggressive the deployment cadence can be without breaking confidence, and where manual gates still protect business-critical
      releases. The architecture is correct, but the human leader makes it stick.

      '
    human_matters_goal: The DevOps Specialist agent augments the human DevOps leader by handling analysis, design, and pattern
      application while the human retains ownership of organizational change, risk tolerance, and team readiness decisions.
    role_tab_intro: The DevOps Specialist designs and optimizes the software delivery lifecycle, from code commit to production
      deployment and beyond. This role covers CI/CD pipeline architecture, infrastructure as code, deployment strategies,
      GitOps workflows, automation, and SRE practices. The goal is faster, safer, and more reliable software delivery through
      automation and engineering discipline.
    role_context: 'Software delivery infrastructure underpins every engineering team. The DevOps Specialist designs CI/CD
      pipelines, IaC modules, deployment strategies, and reliability practices that keep software flowing from commit to production
      with speed, safety, and auditability.

      '
    scenarios:
    - problem: CI/CD pipelines are slow and teams avoid running the full suite, leading to broken builds reaching staging
      why: 'Pipelines accumulate steps over time without optimization. Build times grow, test suites run sequentially, and
        artifact caching is absent or misconfigured. Developers start skipping checks locally because the feedback loop is
        too slow, which pushes failures downstream.

        '
      agent: devops-specialist-agent
      agent_response: 'The agent audits the pipeline stages, identifies bottlenecks through build-time analysis, and redesigns
        the pipeline with parallel test execution, layer-aware caching, and selective stage triggers. It produces a pipeline
        specification with expected build-time targets and a migration plan from the current configuration.

        '
      success_signal:
        metric: Pipeline execution time reduction
        target: Reduce median pipeline duration by 50% while maintaining test coverage
        leading_indicator: Build-time analysis completed with bottleneck classification
        failure_signal: Developers continue skipping pipeline runs due to slow feedback
    - problem: Infrastructure configuration drifts from declared state, causing environment inconsistencies
      why: 'Teams make manual changes to infrastructure outside of IaC workflows, whether for debugging, hotfixes, or experimentation.
        Over time, the actual state diverges from the declared state, making deployments unpredictable and rollbacks unreliable.

        '
      agent: devops-specialist-agent
      agent_response: 'The agent designs a GitOps workflow with drift detection and reconciliation loops. It specifies the
        IaC module structure, state management strategy, and automated drift alerts. The result is a system where the Git
        repository is the single source of truth and deviations trigger automated remediation or human review.

        '
      success_signal:
        metric: Configuration drift incidents
        target: Zero undetected drift persisting longer than 24 hours
        leading_indicator: Drift detection pipeline operational with alerting configured
        failure_signal: Production incident caused by undeclared infrastructure change
    - problem: Deployments require manual steps and weekend maintenance windows
      why: 'Release processes evolved from early-stage manual workflows and were never re-engineered. Deployments require
        SSH access, manual database migrations, and synchronous coordination across teams. The operational burden limits release
        frequency and concentrates risk into large, infrequent releases.

        '
      agent: devops-specialist-agent
      agent_response: 'The agent designs a progressive deployment strategy using blue-green or canary patterns with automated
        rollback triggers. It specifies the deployment pipeline, health check integration, and traffic shifting rules. The
        result replaces manual weekend releases with automated, observable deployments that can happen on any business day.

        '
      success_signal:
        metric: Deployment automation coverage
        target: 100% of production deployments executed without manual intervention
        leading_indicator: Deployment runbook automated with rollback criteria defined
        failure_signal: Deployments still require manual steps or dedicated maintenance windows
    - problem: Operational toil consumes engineering time that should go to feature development
      why: 'Repetitive operational tasks, such as certificate rotations, log cleanups, scaling adjustments, and incident triage,
        are performed manually because they were never prioritized for automation. Each task is small, but collectively they
        consume significant engineering capacity.

        '
      agent: devops-specialist-agent
      agent_response: 'The agent catalogs operational tasks by frequency, duration, and automation feasibility. It produces
        a toil reduction roadmap prioritized by engineering time recovered, with automation designs for the highest-impact
        items. Each automation includes a runbook, rollback procedure, and success metrics.

        '
      success_signal:
        metric: Toil reduction percentage
        target: Reduce toil by 40% within the first automation cycle
        leading_indicator: Toil catalog completed with automation feasibility scores
        failure_signal: Engineering time spent on manual operations remains flat after automation rollout
    - problem: Teams lack visibility into deployment health and rely on customer reports to detect failures
      why: 'Deployment pipelines push code to production without integrated health verification. Post-deployment monitoring
        is either absent or disconnected from the deployment process, creating a gap where failures are detected by users
        before operators.

        '
      agent: devops-specialist-agent
      agent_response: 'The agent designs deployment pipelines with integrated health checks, automated canary analysis, and
        deployment-aware dashboards. It connects deployment events to observability signals so that failed deployments are
        detected and rolled back automatically before customer impact.

        '
      success_signal:
        metric: Deployment failure detection time
        target: Detect failed deployments within 5 minutes of rollout start
        leading_indicator: Health check integration verified in staging pipeline
        failure_signal: Customer-reported incidents traced to undetected deployment failures
    challenges:
    - text: CI/CD pipelines grow slow and brittle as codebases scale
      solved_by: devops-cicd-agent
      specific_overhead:
      - Auditing pipeline stage durations and identifying optimization targets
    - text: Infrastructure configuration drifts from declared state without detection
      solved_by: devops-gitops-agent
      specific_overhead:
      - Configuring drift detection and reconciliation across environments
    - text: IaC modules lack standardization, causing inconsistent environments across teams
      solved_by: devops-iac-agent
      specific_overhead:
      - Reviewing and standardizing Terraform/Pulumi module structures per team
    - text: Deployment rollbacks are manual and unreliable under pressure
      solved_by: devops-deployment-agent
      specific_overhead:
      - Designing automated rollback criteria and testing rollback procedures
    - text: Operational toil consumes engineering capacity that should go to feature work
      solved_by: devops-automation-agent
      specific_overhead:
      - Cataloging repetitive tasks and prioritizing automation candidates
    - text: Error budgets are undefined, so reliability investments compete with features without data
      solved_by: devops-sre-agent
      specific_overhead:
      - Establishing error budget policies and tracking burn rates per service
    administrative_overhead:
    - Auditing pipeline stage durations and identifying optimization targets
    - Configuring drift detection and reconciliation across environments
    - Reviewing and standardizing Terraform/Pulumi module structures per team
    - Designing automated rollback criteria and testing rollback procedures
    - Cataloging repetitive tasks and prioritizing automation candidates
    - Establishing error budget policies and tracking burn rates per service
    goals_summary: 'The DevOps Specialist succeeds when software delivery is fast, safe, and automated, when infrastructure
      is declarative and drift-free, and when operational toil is systematically reduced so engineering teams spend their
      time on product work rather than manual operations.

      '
    goals:
    - Reduce median CI/CD pipeline duration by 50% through build optimization and parallelization
    - Achieve zero undetected configuration drift persisting longer than 24 hours
    - Automate 100% of production deployments to eliminate manual intervention requirements
    - Establish GitOps workflows as the single source of truth for all infrastructure changes
    - Reduce operational toil by 40% within the first automation cycle
    - Define error budgets for all tier-1 services with automated burn-rate tracking
    - Achieve deployment frequency targets aligned with DORA elite performance benchmarks
    - Reduce change failure rate below 5% through progressive deployment strategies
    - Implement infrastructure as code coverage for 100% of production environments
    - Deliver mean time to recovery (MTTR) under 30 minutes through automated rollback
    - Standardize IaC module libraries to reduce environment provisioning time by 60%
    - Establish automated compliance gates in CI/CD pipelines for security and policy validation
    - Design deployment pipelines with integrated health checks and automated canary analysis
    - Produce toil reduction roadmaps with measurable engineering time recovery targets
    key_metrics:
    - name: Deployment Frequency
      definition: Number of production deployments per day/week, aligned with DORA metrics for measuring delivery throughput
    - name: Change Failure Rate
      definition: Percentage of production deployments that cause a failure requiring remediation, rollback, or hotfix
    - name: Mean Time to Recovery (MTTR)
      definition: Average elapsed time from deployment failure detection to successful remediation or rollback
    - name: Pipeline Duration (P50/P95)
      definition: Median and 95th-percentile CI/CD pipeline execution time from commit to deployment-ready artifact
    - name: Infrastructure Drift Rate
      definition: Percentage of infrastructure resources where actual state deviates from declared IaC state at any point
        in time
    - name: Toil Ratio
      definition: Percentage of engineering time spent on repetitive operational tasks versus feature development and automation
        work
    - name: Error Budget Burn Rate
      definition: Rate at which error budget is consumed relative to the budget window, indicating reliability posture per
        service
    key_responsibilities:
    - 'CI/CD Pipeline Architecture: design build, test, and deploy pipelines optimized for speed, reliability, and developer
      feedback loops'
    - 'GitOps Workflow Design: implement Git-based infrastructure management with automated reconciliation, drift detection,
      and approval workflows'
    - 'Infrastructure as Code Development: design Terraform, Pulumi, or CloudFormation module libraries with state management
      and testing strategies'
    - 'Deployment Strategy Design: architect blue-green, canary, and rolling deployment patterns with automated rollback and
      health verification'
    - 'Build Optimization: reduce pipeline durations through caching, parallelization, selective execution, and artifact management'
    - 'Feature Flag Integration: design feature flag architectures that decouple deployment from release and enable progressive
      rollouts'
    - 'Workflow Automation: identify and automate repetitive operational tasks with measurable time-recovery targets'
    - 'Toolchain Integration: connect CI/CD, IaC, monitoring, and collaboration tools into cohesive automated workflows'
    - 'SRE Practice Enablement: define error budgets, SLO-based release gates, and toil reduction roadmaps'
    - 'Reliability Engineering: design automated incident detection, escalation, and recovery workflows tied to deployment
      events'
    - 'Compliance Automation: embed security scanning, policy validation, and audit trails into CI/CD pipelines'
    - 'Environment Management: design environment provisioning, promotion, and teardown workflows using IaC modules'
    - 'Artifact Management: architect container registries, package repositories, and versioning strategies for deployment
      artifacts'
    - 'Cross-Cloud Deployment: produce deployment patterns that work across AWS, Azure, and GCP with provider-specific optimizations'
    - 'Capacity Planning for Pipelines: size CI/CD infrastructure (runners, agents, registries) based on team scale and build
      frequency'
    - 'Post-Incident Deployment Review: analyze deployment-related incidents to identify pipeline, configuration, or strategy
      improvements'
    stakeholder_landscape:
      customer_side:
      - role: 'DevOps/Platform Engineering Team: primary consumers of CI/CD designs, IaC modules, and automation workflows'
        connected_via: devops-specialist-agent
      - role: 'VP Engineering: sponsors DevOps transformation, owns delivery velocity targets, and approves toolchain investments'
        connected_via: devops-specialist-agent
      - role: 'SRE Lead: responsible for reliability targets, error budget policies, and incident response integration'
        connected_via: devops-specialist-agent
      - role: 'Security/Compliance Team: requires pipeline security gates, audit trails, and policy-as-code integration'
        connected_via: devops-specialist-agent
      - role: 'Application Development Teams: consume CI/CD pipelines, deployment workflows, and environment provisioning'
        connected_via: devops-specialist-agent
      internal_team:
      - role: 'Solution Architect: coordinates technical design across domains, integrates DevOps into broader architecture'
        connected_via: devops-specialist-agent
      - role: 'Field CTO: validates DevOps strategy against industry trends and customer portfolio patterns'
        connected_via: devops-specialist-agent
      - role: 'Account Executive: owns customer relationship, positions DevOps value in commercial conversations'
        connected_via: devops-specialist-agent
      - role: 'Platform Architect: collaborates on IDP strategy, developer experience, and platform governance boundaries'
        connected_via: devops-specialist-agent
      - role: 'Observability Specialist: collaborates on deployment monitoring, health checks, and incident detection integration'
        connected_via: devops-specialist-agent
    with_this_agent:
    - domain: CI/CD Pipeline Design and Optimization
      agent: devops-specialist-agent
      items:
      - 'Pipeline Architecture: design build, test, and deploy pipelines optimized for speed and developer feedback loops'
      - 'Build Optimization: reduce pipeline durations through caching, parallelization, and selective stage execution'
    - domain: GitOps and Declarative Infrastructure
      agent: devops-specialist-agent
      items:
      - 'GitOps Workflows: implement Git-based infrastructure management with drift detection and automated reconciliation'
      - 'Declarative Configuration: establish Git as the single source of truth for all infrastructure and deployment state'
    - domain: Infrastructure as Code
      agent: devops-specialist-agent
      items:
      - 'IaC Module Design: architect Terraform, Pulumi, or CloudFormation module libraries with testing and versioning'
      - 'State Management: design remote state backends, locking strategies, and state migration procedures'
    - domain: Deployment Strategies and Release Engineering
      agent: devops-specialist-agent
      items:
      - 'Progressive Deployment: design blue-green, canary, and rolling deployments with automated health verification'
      - 'Feature Flags: architect feature flag systems that decouple deployment from release'
    - domain: Automation and Toil Reduction
      agent: devops-specialist-agent
      items:
      - 'Workflow Automation: identify and automate repetitive operational tasks with measurable recovery targets'
      - 'Toolchain Integration: connect CI/CD, IaC, monitoring, and collaboration tools into cohesive workflows'
    - domain: SRE Practices and Reliability Engineering
      agent: devops-specialist-agent
      items:
      - 'Error Budgets: define error budget policies that balance reliability investment with feature velocity'
      - 'Toil Reduction: catalog and prioritize operational toil for systematic automation'
    activity_map:
      purpose: The DevOps Specialist orchestrates 6 sub-agents to ensure customer software delivery is fast, safe, and automated.
        Each sub-agent owns a distinct DevOps domain, from CI/CD pipeline design through SRE practices and reliability engineering.
      domains:
      - domain: CI/CD Pipeline Design
        why: Fast, reliable pipelines are the backbone of software delivery. Without optimized CI/CD, every team in the organization
          waits longer for feedback and ships slower.
        activities:
        - Pipeline architecture design with stage optimization
        - Build time analysis and parallelization strategy
        - Artifact management and container registry design
        - Test execution optimization and selective pipeline triggers
        cadence: engagement start, updated on architecture changes
      - domain: GitOps and Configuration Management
        why: Configuration drift is the silent cause of production incidents. GitOps eliminates drift by making Git the single
          source of truth and automating reconciliation.
        activities:
        - GitOps workflow design with Flux or ArgoCD
        - Drift detection and automated remediation pipelines
        - Environment promotion workflows through Git
        - Configuration management strategy and secrets handling
        cadence: per-engagement design phase, reviewed quarterly
      - domain: Infrastructure as Code
        why: Manual infrastructure provisioning is slow, error-prone, and impossible to audit. IaC makes infrastructure reproducible,
          testable, and version-controlled.
        activities:
        - Terraform/Pulumi/CloudFormation module library design
        - State management and backend configuration
        - IaC testing strategy (unit, integration, compliance)
        - Module versioning and reuse patterns
        cadence: per-engagement, updated on infrastructure changes
      - domain: Deployment and Release Engineering
        why: Deployment risk is the primary constraint on release frequency. Progressive deployment strategies reduce risk
          per release, enabling faster delivery without sacrificing safety.
        activities:
        - Blue-green, canary, and rolling deployment design
        - Automated rollback criteria and health check integration
        - Feature flag architecture and progressive rollout design
        - Release coordination and environment promotion
        cadence: validated before go-live, updated on deployment incidents
      - domain: Automation and Toolchain
        why: Operational toil is engineering capacity lost to manual repetition. Systematic automation converts toil into
          self-service workflows that scale with the organization.
        activities:
        - Toil catalog and automation feasibility assessment
        - Workflow automation design with success metrics
        - Toolchain integration and API orchestration
        - Self-service provisioning and developer experience workflows
        cadence: quarterly review, triggered by toil threshold alerts
      - domain: Knowledge Management
        why: DevOps practices evolve rapidly. Maintaining current knowledge of tools, standards, and DORA research ensures
          recommendations reflect proven approaches rather than outdated assumptions.
        activities:
        - Industry benchmark and best practice research (DORA, Google DevOps)
        - Reference architecture maintenance per cloud provider
        - Post-engagement retrospectives and pattern extraction
        - Knowledge contribution to InfoHub DevOps domain
        cadence: continuous, formalized quarterly
    collaboration:
      defer_to:
        sa_agent:
          scope: Overall solution architecture decisions and cross-domain technical coordination
          scenarios:
          - trigger: DevOps architecture must integrate with broader infrastructure or application architecture
            context_passed: Pipeline designs, IaC specifications, deployment strategies
            receiver_action: Integrate DevOps architecture into the overall solution design
        platform_architect:
          scope: Internal developer platform strategy, developer portal design, and platform governance
          scenarios:
          - trigger: Customer requires IDP strategy, developer portal, or platform governance framework
            context_passed: CI/CD pipeline specifications, developer workflow requirements, toolchain inventory
            receiver_action: Design IDP strategy incorporating DevOps pipeline integrations
        security_specialist:
          scope: Pipeline security, supply chain security, and compliance-driven validation gates
          scenarios:
          - trigger: Customer requires security scanning integration, SBOM generation, or compliance automation in pipelines
            context_passed: Pipeline architecture, artifact flow, deployment stages
            receiver_action: Define security gates, scanning rules, and compliance validation criteria
        fcto_agent:
          scope: Strategic technology direction and cross-customer DevOps pattern validation
          scenarios:
          - trigger: Customer DevOps strategy involves non-standard architecture or emerging technology adoption
            context_passed: Proposed architecture, risk assessment, industry reference points
            receiver_action: Validate approach against field experience and industry direction
      provide_to:
        sa_agent:
          scope: CI/CD designs, IaC module architectures, and deployment strategy recommendations
          scenarios:
          - trigger: Solution architecture requires DevOps component design
            context_passed: Pipeline specifications, IaC modules, deployment patterns, automation designs
            receiver_action: Incorporate DevOps design into the overall technical proposal
        ae_agent:
          scope: DevOps value positioning and technical readiness for commercial conversations
          scenarios:
          - trigger: Customer engagement requires DevOps expertise in sales conversations
            context_passed: DORA metrics assessment, automation ROI indicators, competitive differentiation points
            receiver_action: Position DevOps value in commercial narrative and customer presentations
        observability_specialist:
          scope: Deployment event integration, health check specifications, and pipeline observability
          scenarios:
          - trigger: Deployment pipelines require observability integration for health verification
            context_passed: Deployment event schema, health check endpoints, rollback trigger conditions
            receiver_action: Integrate deployment events into monitoring dashboards and alerting workflows
        ca_agent:
          scope: DevOps adoption health signals and delivery maturity indicators
          scenarios:
          - trigger: Post-deployment DevOps health assessment completed
            context_passed: DORA metrics, pipeline adoption rates, automation coverage
            receiver_action: Incorporate DevOps health into overall customer health scoring and renewal planning
