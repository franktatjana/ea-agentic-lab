agentspec_version: 26.1.0
component_type: Agent
id: obs-platform-assessment-agent
name: OBS Platform Assessment Agent
description: 'Evaluates current observability stack maturity, maps tooling coverage against industry benchmarks,
  and produces vendor comparison analyses. This agent turns vague "we need better monitoring" requests
  into structured gap assessments with prioritized remediation roadmaps.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: observability-specialist-agent
  tags:
  - observability
  - platform-assessment
  - maturity-model
  - vendor-comparison
  - gap-analysis
  responsibility: 'Assess observability platform maturity, evaluate tooling coverage across the three pillars,
    and produce vendor comparison analyses with gap remediation roadmaps.

    '
system_prompt: 'You are a Platform Assessment Agent, part of the Observability Specialist
  intelligence system. Your job is to evaluate observability stack maturity and tooling coverage.


  You MUST:

  - Assess observability maturity against industry benchmarks (CNCF, Gartner)

  - Map current tooling coverage across metrics, logs, and traces

  - Produce vendor comparison analyses with weighted scoring criteria

  - Identify coverage gaps and prioritize by service criticality

  - Correlate tool capabilities with customer reliability requirements

  - Document assumptions behind every maturity rating

  - Recommend remediation roadmaps with phased adoption milestones


  You MUST NOT:

  - Design SLO/SLI frameworks (Monitoring Design Agent''s domain)

  - Architect data pipelines or instrumentation (Data Pipeline Agent''s domain)

  - Perform cost analysis or retention optimization (Cost Optimization Agent''s domain)

  - Design alerting hierarchies or dashboards (Monitoring Design Agent''s domain)

  - Implement APM or distributed tracing (APM Agent''s domain)


  Every assessment must cite the maturity model used and the evidence

  supporting each rating level.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target
    specific data: technology stack, monitoring tools, infrastructure architecture.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: technology (current map, vendor
    landscape), market (news digest), industry (trends).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: read-vendor-catalog
  name: Read Vendor Catalog
  description: Access observability vendor capability matrices and pricing models for comparison analysis
  requires_confirmation: false
  inputs:
  - title: vendor_names
    type: array
  - title: capability_dimensions
    type: array
  outputs:
  - title: vendor_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: VENDOR_NOT_FOUND
      guidance: Vendor not in catalog, flag for manual research
- component_type: ClientTool
  id: save-assessment-report
  name: Save Assessment Report
  description: Persist platform assessment results to InfoHub, making results queryable via toolbox
  requires_confirmation: true
  inputs:
  - title: assessment
    type: object
  - title: account_name
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from observability specialist about assessment scope
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: platform-assessment-intelligence
  name: Platform Assessment Intelligence
  description: Assessment data available to peer agents for architecture context
  tools:
  - id: get-maturity-assessment
    name: Get Maturity Assessment
    description: Returns observability maturity ratings and gap analysis for an account
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: assessment
      type: object
  - id: get-vendor-comparison
    name: Get Vendor Comparison
    description: Returns vendor comparison analysis with weighted scoring for an account
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: comparison
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: observability-maturity-assessment
  name: Observability Maturity Assessment
  playbook_refs:
  - PB_OBS_001
  - PB_OBS_008
  description: Assess current observability maturity, identify gaps, and produce remediation roadmap.
  inputs:
  - title: account_context
    type: object
  - title: technology_stack
    type: object
  outputs:
  - title: maturity_report
    type: object
  - title: gap_analysis
    type: object
  - title: remediation_roadmap
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: obs-tooling-inventory
      input: account_context, technology_stack
      tools:
      - read-infohub
      - read-intelligence
      description: Inventory current monitoring tools and map coverage across metrics, logs, traces
      on_failure: stop
    - step: 2
      prompt: obs-maturity-scoring
      input: tooling_inventory
      tools:
      - read-vendor-catalog
      description: Score maturity against industry benchmarks, identify gaps by service tier
      on_failure: stop
    - step: 3
      prompt: obs-remediation-roadmap
      input: maturity_scores, gap_analysis
      tools:
      - save-assessment-report
      description: Produce phased remediation roadmap with milestones and resource estimates
      on_failure: stop
- component_type: Flow
  id: vendor-comparison-analysis
  name: Vendor Comparison Analysis
  playbook_refs:
  - PB_OBS_005
  description: Compare observability vendors against customer requirements with weighted scoring.
  inputs:
  - title: account_context
    type: object
  - title: vendor_shortlist
    type: array
  - title: evaluation_criteria
    type: object
  outputs:
  - title: comparison_report
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: obs-vendor-requirements
      input: account_context, evaluation_criteria
      tools:
      - read-infohub
      description: Extract customer requirements and define weighted evaluation dimensions
      on_failure: stop
    - step: 2
      prompt: obs-vendor-scoring
      input: vendor_shortlist, evaluation_dimensions
      tools:
      - read-vendor-catalog
      - read-intelligence
      description: Score each vendor against weighted criteria with evidence citations
      on_failure: stop
    - step: 3
      action: persist
      tools:
      - save-assessment-report
      description: Save comparison report to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - maturity-assessment
    - vendor-comparison
    - gap-analysis
    - tooling-inventory
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'The agent scores maturity and maps gaps, but the human specialist understands
      organizational readiness, team skill levels, and which tools the team will actually adopt.
      A maturity model is only as good as the context behind the ratings.

      '
    challenges:
    - text: Observability maturity self-assessments overestimate actual capabilities
      specific_overhead:
      - Validating maturity claims against actual tooling configuration and usage
    - text: Vendor comparison criteria shift based on stakeholder priorities
      specific_overhead:
      - Reconciling conflicting evaluation weights from different customer teams
    - text: Gap remediation timelines underestimate adoption complexity
      specific_overhead:
      - Calibrating roadmap phases against team capacity and change tolerance
    administrative_overhead:
    - Validating maturity claims against actual tooling configuration and usage
    - Reconciling conflicting evaluation weights from different customer teams
    scenarios:
    - problem: Customer assumes monitoring stack is comprehensive but has blind spots
      why: 'Teams deploy monitoring tools incrementally without a coverage map. Each tool
        covers its domain well, but nobody checks whether the full stack has gaps across
        metrics, logs, and traces for all critical services.

        '
      agent: obs-platform-assessment-agent
      agent_response: 'Maps every monitoring tool against the service catalog and three-pillar
        coverage matrix. Produces a gap heat map showing which services lack coverage by
        pillar, prioritized by service tier.

        '
      success_signal:
        metric: Coverage gaps identified before incident exposure
        target: Coverage audit identifies gaps in 90% of tier-1 services before production incidents
        leading_indicator: Gap heat map reviewed and accepted by SRE lead
        failure_signal: Post-incident review reveals unaudited monitoring blind spot
    - problem: Vendor selection driven by feature lists rather than operational fit
      why: 'Observability vendor evaluations compare feature checklists without weighting
        for the customer environment. A tool that scores highest on paper may be the worst
        fit for the team skills, deployment model, and budget.

        '
      agent: obs-platform-assessment-agent
      agent_response: 'Defines weighted evaluation criteria based on customer constraints
        (team skills, deployment model, budget, scale requirements). Scores vendors against
        these weighted dimensions with evidence for each rating.

        '
      success_signal:
        metric: Vendor selection satisfaction at 6-month review
        target: Selected vendor meets 80% of weighted criteria at 6-month operational review
        leading_indicator: Evaluation criteria validated by all stakeholder groups before scoring
        failure_signal: Vendor replaced within 12 months due to operational fit issues
  escalation_triggers:
  - Maturity assessment reveals critical gaps in tier-1 service coverage
  - Vendor comparison shows no viable option meeting minimum requirements
  - Assessment scope expands beyond observability into adjacent domains
  prompt_registry:
    obs-tooling-inventory:
      description: Inventory current monitoring tools and map coverage across metrics, logs, traces
      source: prompts/tasks.yaml#platform_assessment.tooling_inventory
      inputs:
      - title: account_name
        type: string
      - title: technology_stack
        type: object
      outputs:
      - title: tooling_inventory
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - technology_stack
        - monitoring_tools
        priority: critical
      - source: read-intelligence
        fields:
        - vendor_landscape
        priority: enrichment
    obs-maturity-scoring:
      description: Score observability maturity against industry benchmarks
      source: prompts/tasks.yaml#platform_assessment.maturity_scoring
      inputs:
      - title: tooling_inventory
        type: object
      outputs:
      - title: maturity_scores
        type: object
      requires_data:
      - source: read-vendor-catalog
        fields:
        - benchmark_data
        priority: enrichment
    obs-remediation-roadmap:
      description: Produce phased remediation roadmap with milestones
      source: prompts/tasks.yaml#platform_assessment.remediation_roadmap
      inputs:
      - title: maturity_scores
        type: object
      - title: gap_analysis
        type: object
      outputs:
      - title: roadmap
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - team_capacity
        - budget_constraints
        priority: enrichment
  boundaries:
  - Assessment and evaluation only, does not design solutions
  - Does not implement monitoring configurations or deploy tools
  - Does not define SLOs or alerting rules
  - Does not perform cost optimization analysis
  permissions:
  - Assess observability maturity across all three pillars
  - Access customer technology stack inventories
  - Produce vendor comparison analyses with scoring
  - Generate gap remediation roadmaps
  guardrails:
    input_validation:
    - Reject assessments without account context or technology stack information
    - Reject vendor comparisons without defined evaluation criteria
    output_checks:
    - All maturity ratings must cite the benchmark framework used
    - Vendor scores must include evidence for each dimension rating
    - Gap analysis must prioritize by service criticality tier
    - Remediation roadmaps must include resource and timeline estimates
    signal_validation:
    - Never rate maturity higher than evidence supports
    - Never assume tool coverage without explicit configuration verification
    - Add [NEEDS VERIFICATION] when assessment relies on self-reported data
  error_handling:
    tool_failures:
      critical:
      - read-infohub
      enrichment:
      - read-intelligence
      - read-vendor-catalog
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable assessment without account data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - platform-assessment
      - vendor-evaluation
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/expertise-sre-and-platforms.yaml
      description: Platform engineering best practices, tool ecosystem knowledge
    - path: references/expertise-three-pillars.yaml
      description: Three-pillar coverage model for maturity evaluation
  autonomy:
    triggers:
    - type: parent_dispatch
      source: observability-specialist-agent
      description: Orchestrator routes platform assessment requests
    - type: schedule
      cadence: quarterly
      description: Quarterly maturity reassessment for active accounts
    outputs:
    - type: parent_return
      target: observability-specialist-agent
      payload:
      - maturity_report
      - gap_analysis
      - remediation_roadmap
      description: Full assessment report back to orchestrator
    - type: trigger_agent
      target: obs-monitoring-design-agent
      condition: gap_analysis.critical_gaps > 0
      payload:
      - gap_details
      - priority_services
      description: Critical gaps trigger monitoring design engagement
    dependencies: []
