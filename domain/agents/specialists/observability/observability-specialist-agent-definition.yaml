x-ea-agent:
  profile:
    human_matters_summary: 'Observability architecture is engineering; observability culture is human. The agent designs three-pillar architectures and defines SLOs, but the SRE leader understands which
      metrics drive real business value, how aggressive SLOs can be without breaking the team, and what practices will stick in the organization. The architecture is correct, but the human leader makes
      it work.

      '
    role_context: 'Platform and infrastructure architecture underpins everything. The Platform SA designs observability, monitoring, and infrastructure strategies that keep deployments healthy and scalable
      across cloud providers.

      '
    scenarios:
    - problem: Alert fatigue drowns the SOC in noise while real incidents go unnoticed
      why: 'Teams inherit monitoring configurations with hundreds of undifferentiated alerts. Without SLO-driven alerting design, on-call engineers waste time triaging false positives while meaningful signals
        get buried in the volume.

        '
      agent: observability-specialist-agent
      agent_response: 'The agent designs an SLO-based alerting framework that ties alerts to reliability goals rather than arbitrary thresholds. It identifies noisy rules, recommends consolidation, and
        produces an alerting hierarchy that separates actionable incidents from informational signals.

        '
      success_signal:
        metric: Alert-to-incident ratio improvement
        target: Reduce non-actionable alerts by 60% within the first tuning cycle
        leading_indicator: Alert audit completed with noise-to-signal classification
        failure_signal: On-call escalations remain flat or increase after redesign
    - problem: Observability architecture is designed tool-first, not outcome-first
      why: 'Customers adopt monitoring tools without defining what reliability means for their services. The result is dashboards that show data without answering the question that matters: are users affected?
        This leads to over-instrumentation in some areas and blind spots in others.

        '
      agent: observability-specialist-agent
      agent_response: 'The agent starts from SLO definitions and works backward to instrumentation requirements across the three pillars (metrics, logs, traces). It produces an observability architecture
        that maps each data source to a specific reliability question, with cost implications for data volume decisions.

        '
      success_signal:
        metric: SLO coverage for customer-facing services
        target: SLOs defined for 100% of tier-1 services before instrumentation design
        leading_indicator: Service catalog mapped to reliability objectives
        failure_signal: Instrumentation deployed without corresponding SLO definitions
    - problem: Observability gaps surface only during incidents
      why: 'Monitoring coverage is assumed to be complete until an incident reveals a blind spot. Services run without sufficient instrumentation, and the gap is invisible in normal operations. The team
        discovers missing telemetry during an outage, when the cost of the gap is highest.

        '
      agent: observability-specialist-agent
      agent_response: 'The agent performs observability coverage audits against the service catalog, comparing instrumented services with defined SLOs and identifying gaps in metrics, logs, or trace coverage.
        It produces a gap report prioritized by service criticality and incident history, ensuring coverage improvements happen proactively rather than post-incident.

        '
      success_signal:
        metric: Observability coverage gap detection before incidents
        target: At least 90% of tier-1 services have verified observability coverage across all three pillars
        leading_indicator: Coverage audit completed quarterly with gap remediation plan
        failure_signal: Post-incident review reveals a monitoring blind spot for an unaudited service
    - problem: Infrastructure sizing is guesswork without usage data
      why: 'Capacity planning for observability platforms requires understanding data ingest rates, retention needs, and query patterns. Without usage data, sizing recommendations are based on vendor T-shirt
        estimates that either over-provision (wasting budget) or under-provision (causing performance issues at scale).

        '
      agent: observability-specialist-agent
      agent_response: 'The agent collects data volume estimates from current log, metric, and trace sources, models growth projections based on service expansion plans, and produces a sizing recommendation
        with cost implications. It specifies the assumptions behind each estimate so the customer can validate inputs and adjust the model as actual usage data becomes available.

        '
      success_signal:
        metric: Infrastructure sizing accuracy
        target: Sizing recommendation within 20% of actual resource consumption at 90-day review
        leading_indicator: Sizing model includes explicit assumptions and a validation checkpoint at 30 days
        failure_signal: Platform requires emergency scaling within 60 days of initial deployment
    - problem: Platform engineering patterns differ across cloud providers
      why: 'Customers deploy across AWS, Azure, and GCP, each with different native monitoring tools, ingestion APIs, and cost models. A pattern that works on one provider may be suboptimal or unavailable
        on another. Without multi-cloud expertise, architecture recommendations carry hidden portability risks.

        '
      agent: observability-specialist-agent
      agent_response: 'The agent maintains a cross-cloud reference architecture for observability, mapping provider-specific services to a unified design pattern. It identifies where cloud-native tools
        should be used versus vendor-agnostic approaches, flags portability risks in the proposed architecture, and produces provider- specific implementation guides for each deployment target.

        '
      success_signal:
        metric: Cross-cloud architecture portability
        target: Architecture design includes provider-specific implementation notes for all target clouds
        leading_indicator: Provider-specific constraints identified during design phase, not during deployment
        failure_signal: Architecture fails during deployment because a cloud-specific constraint was not anticipated
    challenges:
    - text: Observability gaps surface only during incidents
      specific_overhead:
      - Configuring monitoring dashboards per customer deployment
    - text: Infrastructure sizing is guesswork without usage data
      specific_overhead:
      - Documenting infrastructure sizing recommendations per environment
    - Platform engineering patterns differ across cloud providers
    - Alert fatigue drowns the SOC in noise while real incidents go unnoticed
    - Observability architecture is designed tool-first, not outcome-first
    administrative_overhead:
    - Configuring monitoring dashboards per customer deployment
    - Documenting infrastructure sizing recommendations per environment
    capabilities:
    - Platform architecture design
    - Observability and monitoring strategy
    - Infrastructure planning
    - Capacity and scaling design
    playbook_raci:
      context: >
        The Observability Specialist owns 10 domain-specific playbooks covering discovery,
        demos, validation, scoping, and implementation within the observability domain.
      responsible:
        - playbook: Deep Discovery (PB_OBS_001)
          scope: Observability-specific discovery, monitoring maturity assessment, data source mapping
          team: specialists
          file: PB_OBS_001_deep_discovery.yaml
        - playbook: Custom Demo (PB_OBS_002)
          scope: Tailored observability demo preparation with customer environment context
          team: specialists
          file: PB_OBS_002_custom_demo.yaml
        - playbook: Technical Validation (PB_OBS_003)
          scope: Observability platform technical validation against customer requirements
          team: specialists
          file: PB_OBS_003_technical_validation.yaml
        - playbook: RFx Response (PB_OBS_004)
          scope: Observability-specific RFP/RFI response content and technical positioning
          team: specialists
          file: PB_OBS_004_rfx_response.yaml
        - playbook: Solution Scoping (PB_OBS_005)
          scope: Observability solution sizing, architecture, and deployment planning
          team: specialists
          file: PB_OBS_005_solution_scoping.yaml
        - playbook: SLO/SLI Definition (PB_OBS_006)
          scope: Service level objective and indicator framework design
          team: specialists
          file: PB_OBS_006_slo_sli_definition.yaml
        - playbook: APM Implementation (PB_OBS_007)
          scope: Application performance monitoring implementation guidance
          team: specialists
          file: PB_OBS_007_apm_implementation.yaml
        - playbook: Platform Architecture (PB_OBS_008)
          scope: Observability platform architecture design and scaling patterns
          team: specialists
          file: PB_OBS_008_platform_architecture.yaml
        - playbook: Technical POC (PB_OBS_009)
          scope: Observability POC execution, success criteria, measurement framework
          team: specialists
          file: PB_OBS_009_technical_poc.yaml
        - playbook: Alerting Strategy (PB_OBS_010)
          scope: Alert design, noise reduction, escalation path definition
          team: specialists
          file: PB_OBS_010_alerting_strategy.yaml
      accountable:
        - playbook: Technical Validation (PB_OBS_003)
          scope: Observability Practice Lead validates technical assessment accuracy
          team: specialists
        - playbook: Platform Architecture (PB_OBS_008)
          scope: Observability Practice Lead approves architecture recommendations
          team: specialists
      consulted:
        - playbook: ADR (PB_SA_001)
          scope: Observability architecture constraints and monitoring requirements for architecture decisions
          team: solution_architects
          file: PB_SA_001_togaf_adm.yaml
        - playbook: Technical Discovery (PB_SA_014)
          scope: Observability maturity and monitoring landscape context for technical discovery
          team: solution_architects
          file: PB_SA_014_technical_discovery.yaml
      informed:
        - playbook: Customer Health (PB_CA_007)
          scope: Receives observability adoption health signals from customer base
          team: customer_architects
        - playbook: Feature Gap Analysis (PB_PM_001)
          scope: Receives product capability gaps identified in observability domain
          team: product_managers
  fallback_model: null
  prompt_registry: {}
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - NEVER invent performance numbers or benchmarks
    - NEVER guarantee specific MTTR improvements
    - NEVER claim integrations without verification
    - Reference documentation for capability claims
    - Acknowledge when POC needed to validate
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not make commercial decisions (handoff to SA Lead / Observability Practice Lead)
  - Does not commit to delivery without PS (handoff to SA Lead / Observability Practice Lead)
  - Does not provide 24/7 operational support (handoff to SA Lead / Observability Practice Lead)
  - Does not access customer production systems (handoff to SA Lead / Observability Practice Lead)
  permissions:
  - Design observability architectures (metrics, logs, traces)
  - Define SLOs, SLIs, and error budgets
  - Optimize alerting to reduce noise and fatigue
  - Implement APM and distributed tracing
  - Design log analytics pipelines
  - Plan observability migrations
  - Kubernetes and container observability
  - Cost optimization for observability data
  escalation_triggers:
  - Critical understand reliability goals and slos exceeding agent authority (to SA Lead / Observability Practice Lead)
  handoffs:
    human_escalation: SA Lead / Observability Practice Lead
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Understand reliability goals and SLOs
    - Design for actionable insights
    - Reduce alert noise and on-call burden
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - observability
      - monitoring-architecture
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/expertise-sre-and-platforms.yaml
      description: Sre Practices, Platforms And Tools, Alerting
    - path: references/expertise-three-pillars.yaml
      description: Metrics, Logs, Traces
    - path: references/response-patterns.yaml
      description: Observability Assessment, Slo Design
  assets:
  - name: observability-architecture-designs
    filename: '{account}-observability-architecture-designs.md'
    description: Observability architecture designs
  - name: slo-sli-specifications
    filename: '{account}-slo-sli-specifications.md'
    description: SLO/SLI specifications
  - name: dashboard-and-alerting-designs
    filename: '{account}-dashboard-and-alerting-designs.md'
    description: Dashboard and alerting designs
  - name: migration-plans
    filename: '{account}-migration-plans.md'
    description: Migration plans
  - name: poc-validation-reports
    filename: '{account}-poc-validation-reports.md'
    description: POC validation reports
  - name: cost-optimization-recommendations
    filename: '{account}-cost-optimization-recommendations.md'
    description: Cost optimization recommendations
  quality:
  - All claims supported by evidence
  - No assumed dynamics
  - Sources cited
