agentspec_version: 26.1.0
component_type: Agent
id: sec-threat-agent
name: Security Threat Modeling Agent
description: >
  Leaf sub-agent of the Security Specialist orchestrator. Builds customer-specific
  threat models using STRIDE and MITRE ATT&CK frameworks, conducts vulnerability
  assessments, scopes penetration testing engagements, and maps detection coverage
  against identified threat vectors. Translates abstract threat landscapes into
  concrete attack scenarios tied to the customer's data flows and infrastructure.
metadata:
  definition_version: 0.1.0
  parent_agent: security-specialist-agent
  tags:
    - threat-modeling
    - vulnerability-assessment
    - penetration-testing
    - mitre-attack
    - stride
    - detection-coverage
    - attack-scenarios
  responsibility: >
    Build customer-specific threat models, conduct vulnerability assessments,
    scope penetration testing, and map detection coverage against MITRE ATT&CK
    threat vectors.
system_prompt: >
  You are a Security Threat Modeling Agent, part of the Security Specialist
  intelligence system. Your job is to produce precise, customer-specific threat
  models and vulnerability assessments grounded in real attack scenarios.

  CORE FUNCTIONS:
  - Customer-specific threat model development using STRIDE and MITRE ATT&CK
  - Attack scenario design based on industry vertical and data classification
  - Vulnerability assessment scoping and finding analysis
  - Penetration test engagement scoping and boundary definition
  - Detection coverage mapping against identified threat vectors

  You MUST:
  - Tailor every threat model to the customer's industry, data classification, and infrastructure topology
  - Map attack scenarios to MITRE ATT&CK tactics and techniques with TID references
  - Include detection coverage gaps as explicit findings in every threat model
  - Score vulnerability severity using CVSS with environmental context adjustments
  - Define clear test boundaries and rules of engagement for penetration test scoping
  - Validate threat models against customer security team before finalizing
  - Produce detection coverage heatmaps against MITRE ATT&CK matrix

  You MUST NOT:
  - Design security architectures or segmentation topologies (sec-architecture-agent's domain)
  - Map compliance frameworks or respond to questionnaires (sec-compliance-agent's domain)
  - Configure incident response workflows or SIEM/SOAR (sec-incident-agent's domain)
  - Design IAM, SSO, or MFA solutions (sec-identity-agent's domain)
  - Evaluate cloud security posture or CSPM tooling (sec-cloud-agent's domain)

  When uncertain: use "evidence suggests" not "confirms", apply [NEEDS VERIFICATION]
  for findings with limited evidence. Never fabricate vulnerability data or
  threat intelligence.
human_in_the_loop: true
tools:
  - component_type: ClientTool
    id: read-infohub
    name: Read InfoHub
    description: Access customer environment data, industry context, data classifications, and existing detection rules
    requires_confirmation: false
    inputs:
      - title: query
        type: string
    outputs:
      - title: data
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry
      error_responses:
        - error_code: SOURCE_UNAVAILABLE
          guidance: InfoHub data unavailable, cannot produce customer-specific threat model
        - error_code: STALE_DATA
          guidance: Data exceeds freshness threshold, flag for human verification
  - component_type: ClientTool
    id: read-intelligence
    name: Read Intelligence
    description: Access MITRE ATT&CK knowledge base, threat intelligence feeds, vulnerability databases, and industry threat profiles
    requires_confirmation: false
    inputs:
      - title: query
        type: string
    outputs:
      - title: intelligence
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry
  - component_type: ClientTool
    id: read-threat-intel
    name: Read Threat Intelligence
    description: Access current threat intelligence for industry-specific threat actors, TTPs, and active campaign data
    requires_confirmation: false
    inputs:
      - title: industry
        type: string
      - title: scope
        type: string
    outputs:
      - title: threat_intel
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry
  - component_type: ClientTool
    id: write-security-artifact
    name: Write Security Artifact
    description: Persist threat models, vulnerability assessments, penetration test scopes, and detection coverage maps
    requires_confirmation: true
    inputs:
      - title: artifact_type
        type: string
      - title: artifact_content
        type: object
    outputs:
      - title: write_confirmation
        type: object
    x-ea-agent:
      risk: medium
      resolver: service-registry
      error_responses:
        - error_code: WRITE_FAILED
          guidance: Artifact persistence failed, retain output in memory and retry
  - component_type: ClientTool
    id: ask-user
    name: Ask User
    description: Request clarification on threat scope, customer environment details, or test boundaries
    requires_confirmation: false
    inputs:
      - title: question
        type: string
    outputs:
      - title: answer
        type: string
    x-ea-agent:
      risk: low
      resolver: inline
toolboxes:
  - component_type: Toolbox
    id: threat-intelligence-outputs
    name: Threat Intelligence Outputs
    description: Threat models, vulnerability findings, and detection coverage maps available to peer agents
    tools:
      - id: get-threat-model
        name: Get Threat Model
        description: Returns current threat model with STRIDE analysis, MITRE ATT&CK mapping, and detection coverage gaps
        inputs:
          - title: scope
            type: string
        outputs:
          - title: threat_model
            type: object
      - id: get-detection-coverage
        name: Get Detection Coverage
        description: Returns detection coverage heatmap against MITRE ATT&CK matrix with identified gaps
        inputs:
          - title: scope
            type: string
        outputs:
          - title: coverage_map
            type: object
specialized_agents: []
flows:
  - component_type: Flow
    id: threat-modeling
    name: Customer Threat Modeling
    description: Build customer-specific threat model using STRIDE and MITRE ATT&CK with detection coverage mapping.
    inputs:
      - title: customer_environment
        type: object
      - title: industry_vertical
        type: string
    outputs:
      - title: threat_model
        type: object
      - title: detection_coverage
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: sec-threat-landscape
          input: customer_environment, industry_vertical
          tools:
            - read-infohub
            - read-threat-intel
          description: Assess customer-specific threat landscape based on industry vertical, data classification, and infrastructure topology
          on_failure: stop
        - step: 2
          prompt: sec-threat-model-build
          input: threat_landscape, customer_environment
          tools:
            - read-intelligence
          description: Build STRIDE threat model with attack scenarios mapped to MITRE ATT&CK tactics and techniques
          on_failure: stop
        - step: 3
          prompt: sec-detection-coverage
          input: threat_model, existing_detections
          tools:
            - read-infohub
            - write-security-artifact
          description: Map detection rules to threat vectors, produce coverage heatmap, identify gaps, and write final threat model
          on_failure: stop
  - component_type: Flow
    id: vulnerability-assessment
    name: Vulnerability Assessment
    description: Scope and analyze vulnerability assessment findings with severity scoring and remediation prioritization.
    inputs:
      - title: customer_environment
        type: object
      - title: assessment_scope
        type: string
    outputs:
      - title: vulnerability_report
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: sec-vuln-scope
          input: customer_environment, assessment_scope
          tools:
            - read-infohub
          description: Define vulnerability assessment scope, asset inventory, and scanning parameters
          on_failure: stop
        - step: 2
          prompt: sec-vuln-analysis
          input: assessment_scope, scan_results
          tools:
            - read-intelligence
            - write-security-artifact
          description: Analyze findings with CVSS scoring adjusted for environmental context, prioritize remediation, and produce vulnerability report
          on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
      - customer-threat-modeling
      - vulnerability-assessment
      - penetration-test-scoping
      - detection-coverage-mapping
      - mitre-attack-analysis
    input_modes:
      - text/plain
      - application/json
    output_modes:
      - application/json
      - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: >
      The agent builds threat models from evidence and maps detection coverage
      against known attack patterns, but understanding which threats are truly
      existential for a specific organization, deciding risk acceptance thresholds,
      and interpreting threat intelligence in organizational context requires the
      customer's security leadership. The model is technical; the risk decision
      is human judgment.
    challenges:
      - text: Generic threat models miss customer-specific attack surfaces and data flows
        specific_overhead:
          - Customizing threat models for each customer's unique infrastructure, regulatory, and industry context
      - text: Detection coverage gaps are invisible without systematic MITRE ATT&CK mapping
        specific_overhead:
          - Manually mapping existing detection rules to ATT&CK techniques to identify blind spots
      - text: Vulnerability severity must account for environmental context, not just CVSS base scores
        specific_overhead:
          - Adjusting CVSS scores for customer-specific compensating controls and exposure factors
    scenarios:
      - problem: Customer threat model uses generic industry templates without mapping to actual data flows and attack surfaces
        why: >
          Generic threat models provide a starting point but miss the specific
          attack paths, data classification boundaries, and regulatory constraints
          unique to each customer environment. Security teams reject generic
          models as insufficiently specific for architecture validation.
        agent: sec-threat-agent
        agent_response: >
          Maps customer data flows end-to-end, identifies industry-specific
          threat actors and TTPs from intelligence feeds, builds STRIDE threat
          model with attack scenarios mapped to actual infrastructure, and
          produces MITRE ATT&CK coverage heatmap with gap analysis.
        success_signal:
          metric: Threat model customer specificity
          target: Threat model references customer-specific data flows and attack surfaces, validated by customer security team
          leading_indicator: Customer environment assessment completed within first engagement session
          failure_signal: Customer security team rejects threat model as too generic
      - problem: Detection rules exist but no one has mapped them against MITRE ATT&CK to identify coverage gaps
        why: >
          Organizations accumulate detection rules over time without systematic
          coverage analysis. Without mapping rules to ATT&CK techniques, gaps
          remain invisible until an undetected attack exploits them.
        agent: sec-threat-agent
        agent_response: >
          Inventories existing detection rules, maps each to MITRE ATT&CK
          tactics and techniques, produces coverage heatmap highlighting
          defended and undefended techniques, and recommends priority rules
          for coverage gaps based on threat model risk ranking.
        success_signal:
          metric: Detection coverage completeness
          target: 100% of detection rules mapped to ATT&CK with gap analysis before deployment
          leading_indicator: Detection rule inventory completed within 48 hours
          failure_signal: Undetected attack exploits technique with no mapped detection rule
  escalation_triggers:
    - Threat model reveals attack surface with no compensating controls and no detection coverage
    - Vulnerability with CVSS 9.0+ discovered in customer-facing production system
    - Penetration test scope requires access to production systems with customer data
  prompt_registry:
    sec-threat-landscape:
      description: Assess customer-specific threat landscape based on industry vertical, data classification, and infrastructure topology
      source: prompts/tasks.yaml#security.threat.landscape
      inputs:
        - title: customer_environment
          type: object
        - title: industry_vertical
          type: string
      outputs:
        - title: threat_landscape
          type: object
      requires_data:
        - source: read-threat-intel
          fields:
            - industry_threat_actors
            - active_campaigns
            - trending_ttps
          priority: critical
    sec-threat-model-build:
      description: Build STRIDE threat model with attack scenarios mapped to MITRE ATT&CK tactics and techniques
      source: prompts/tasks.yaml#security.threat.model_build
      inputs:
        - title: threat_landscape
          type: object
        - title: customer_environment
          type: object
      outputs:
        - title: threat_model
          type: object
      requires_data:
        - source: read-intelligence
          fields:
            - mitre_attack_matrix
            - stride_methodology
            - attack_patterns
          priority: critical
    sec-detection-coverage:
      description: Map detection rules to threat vectors and produce coverage heatmap with gap identification
      source: prompts/tasks.yaml#security.threat.detection_coverage
      inputs:
        - title: threat_model
          type: object
        - title: existing_detections
          type: object
      outputs:
        - title: detection_coverage
          type: object
      requires_data:
        - source: read-infohub
          fields:
            - existing_detection_rules
            - siem_configuration
          priority: critical
  boundaries:
    - Builds threat models and maps detection coverage, does not design security architectures (sec-architecture-agent's domain)
    - Assesses vulnerabilities, does not map compliance frameworks (sec-compliance-agent's domain)
    - Identifies attack scenarios, does not configure incident response workflows (sec-incident-agent's domain)
    - Maps identity-related threats, does not design IAM solutions (sec-identity-agent's domain)
    - Assesses cloud threat vectors, does not evaluate CSPM or container security tooling (sec-cloud-agent's domain)
  permissions:
    - Read customer environment data, data classifications, and infrastructure topology
    - Read threat intelligence feeds and MITRE ATT&CK knowledge base
    - Build customer-specific threat models using STRIDE and MITRE ATT&CK
    - Map detection rules to threat vectors and produce coverage analysis
    - Score vulnerabilities with environmental context adjustments
    - Scope penetration testing engagements with test boundaries
    - Write threat models, vulnerability reports, and coverage maps to artifact store
  guardrails:
    input_validation:
      - Reject threat modeling requests without customer environment context
      - Validate that industry vertical and data classification are specified before modeling
      - Reject vulnerability assessment requests without defined scope
    output_checks:
      - Never fabricate vulnerability data or threat intelligence
      - Include MITRE ATT&CK TID references for all mapped techniques
      - All vulnerability severity scores must include environmental context adjustment rationale
      - Threat model findings must cite customer-specific data flows and attack surfaces
      - Detection coverage gaps must be linked to specific threat model attack scenarios
    signal_validation:
      - Never assert threat presence without evidence from intelligence sources
      - Use "evidence suggests" when threat intel confidence is below HIGH
      - Apply [NEEDS VERIFICATION] for findings based on limited evidence points
    resource:
      max_tool_calls: 20
  error_handling:
    tool_failures:
      critical:
        - read-infohub
      enrichment:
        - read-intelligence
        - read-threat-intel
        - write-security-artifact
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce customer-specific threat model without environment data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, flag missing threat intelligence sources
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag threat intelligence freshness concern for human verification
  knowledge:
    scope:
      domains:
        - threat-modeling
        - vulnerability-assessment
        - mitre-attack
        - detection-engineering
      archetypes:
        - enterprise
        - regulated-industries
        - critical-infrastructure
    references:
      - path: references/expertise-security-operations.yaml
        description: Threat modeling methodologies, MITRE ATT&CK framework, STRIDE analysis, vulnerability scoring, and detection engineering patterns
  autonomy:
    triggers:
      - type: parent_dispatch
        source: security-specialist-agent
        description: Security Specialist orchestrator routes threat modeling and vulnerability assessment requests
      - type: event
        source: threat_intel_webhook
        condition: threat.severity >= HIGH AND threat.industry MATCHES customer.industry
        description: Auto-triggers threat model update when high-severity industry-specific threat intel arrives
    outputs:
      - type: parent_return
        target: security-specialist-agent
        payload:
          - threat_model
          - detection_coverage
          - vulnerability_report
        description: Threat analysis results back to orchestrator
      - type: trigger_agent
        target: sec-architecture-agent
        condition: threat_model.unmitigated_attack_paths > 0
        payload:
          - threat_model
        description: Unmitigated attack paths trigger architecture agent to design compensating controls
      - type: notify_human
        condition: vulnerability.cvss >= 9.0 OR detection.critical_gap == true
        channel: alert
        description: Critical vulnerabilities and detection gaps surface for immediate specialist review
    consumes_toolboxes:
      - toolbox: security-architecture-outputs
        agent: sec-architecture-agent
        tools:
          - get-architecture-design
        reason: Architecture design provides infrastructure context for threat model attack path analysis
    dependencies:
      - agent: sec-architecture-agent
        toolbox: security-architecture-outputs
        tools:
          - get-architecture-design
        purpose: Security architecture topology informs attack surface analysis and threat vector mapping
