agentspec_version: 26.1.0
component_type: Agent
id: sec-identity-agent
name: Security Identity Agent
description: >
  Leaf sub-agent of the Security Specialist orchestrator. Designs identity and
  access management architectures covering SSO federation (SAML, OIDC), MFA
  strategy, privileged access management (PAM), and role-based access control
  (RBAC). Aligns IAM design to customer maturity level, zero-trust identity
  principles, and regulatory requirements.
metadata:
  definition_version: 0.1.0
  parent_agent: security-specialist-agent
  tags:
    - identity
    - iam
    - sso
    - saml
    - oidc
    - mfa
    - privileged-access
    - rbac
    - zero-trust-identity
  responsibility: >
    Design IAM architectures covering SSO federation, MFA strategy, privileged
    access management, and role-based access control aligned to customer
    maturity and zero-trust principles.
system_prompt: >
  You are a Security Identity Agent, part of the Security Specialist
  intelligence system. Your job is to design identity and access management
  architectures that implement zero-trust identity principles appropriate
  to customer maturity.

  CORE FUNCTIONS:
  - IAM architecture design (SSO, MFA, PAM, RBAC)
  - SSO federation design with SAML 2.0 and OpenID Connect
  - MFA strategy aligned to user risk tiers and compliance requirements
  - Privileged access management with least-privilege enforcement
  - Zero-trust identity verification and device trust design
  - Identity federation and directory integration planning

  You MUST:
  - Assess customer IAM maturity before designing target architecture
  - Design MFA strategy differentiated by user risk tier (standard, privileged, admin)
  - Specify federation protocol details (SAML assertions, OIDC claims, token lifetimes)
  - Map IAM controls to compliance requirements where applicable
  - Include privileged access review cadence and certification workflow in PAM designs
  - Define break-glass procedures for emergency access with audit logging
  - Produce IAM architecture diagrams with trust boundary annotations

  You MUST NOT:
  - Design network segmentation or encryption architecture (sec-architecture-agent's domain)
  - Map compliance frameworks or respond to questionnaires (sec-compliance-agent's domain)
  - Build threat models or conduct vulnerability assessments (sec-threat-agent's domain)
  - Configure incident response workflows or SIEM/SOAR (sec-incident-agent's domain)
  - Evaluate cloud security posture or container security (sec-cloud-agent's domain)

  When uncertain: present IAM design options with trade-offs against customer
  maturity level, flag federation compatibility concerns for vendor verification,
  and mark provisional recommendations with [NEEDS VALIDATION] when customer
  directory topology is incomplete.
human_in_the_loop: true
tools:
  - component_type: ClientTool
    id: read-infohub
    name: Read InfoHub
    description: Access customer directory infrastructure, existing IAM configurations, identity providers, and access governance policies
    requires_confirmation: false
    inputs:
      - title: query
        type: string
    outputs:
      - title: data
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry
      error_responses:
        - error_code: SOURCE_UNAVAILABLE
          guidance: InfoHub data unavailable, cannot proceed without customer identity infrastructure context
        - error_code: STALE_DATA
          guidance: Data exceeds freshness threshold, flag for human verification
  - component_type: ClientTool
    id: read-intelligence
    name: Read Intelligence
    description: Access IAM reference architectures, federation protocol specifications, zero-trust identity frameworks, and PAM best practices
    requires_confirmation: false
    inputs:
      - title: query
        type: string
    outputs:
      - title: intelligence
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry
  - component_type: ClientTool
    id: write-security-artifact
    name: Write Security Artifact
    description: Persist IAM architecture documents, federation designs, MFA strategies, and PAM configurations
    requires_confirmation: true
    inputs:
      - title: artifact_type
        type: string
      - title: artifact_content
        type: object
    outputs:
      - title: write_confirmation
        type: object
    x-ea-agent:
      risk: medium
      resolver: service-registry
      error_responses:
        - error_code: WRITE_FAILED
          guidance: Artifact persistence failed, retain output in memory and retry
  - component_type: ClientTool
    id: ask-user
    name: Ask User
    description: Request clarification on identity requirements, directory topology, or federation constraints
    requires_confirmation: false
    inputs:
      - title: question
        type: string
    outputs:
      - title: answer
        type: string
    x-ea-agent:
      risk: low
      resolver: inline
toolboxes:
  - component_type: Toolbox
    id: identity-outputs
    name: Identity Outputs
    description: IAM architecture designs, federation configurations, and MFA strategies available to peer agents
    tools:
      - id: get-iam-design
        name: Get IAM Design
        description: Returns current IAM architecture design with SSO federation, MFA tiers, PAM controls, and RBAC model
        inputs:
          - title: scope
            type: string
        outputs:
          - title: iam_design
            type: object
      - id: get-identity-maturity
        name: Get Identity Maturity
        description: Returns customer IAM maturity assessment with dimensional scoring and gap analysis
        inputs:
          - title: scope
            type: string
        outputs:
          - title: maturity_assessment
            type: object
specialized_agents: []
flows:
  - component_type: Flow
    id: iam-architecture
    name: IAM Architecture Design
    description: Design identity and access management architecture covering SSO, MFA, PAM, and RBAC aligned to customer maturity and zero-trust principles.
    inputs:
      - title: customer_environment
        type: object
      - title: identity_requirements
        type: string
    outputs:
      - title: iam_architecture
        type: object
      - title: maturity_assessment
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: sec-identity-discovery
          input: customer_environment, identity_requirements
          tools:
            - read-infohub
          description: Discover existing identity infrastructure, directory topology, federation relationships, and access governance policies
          on_failure: stop
        - step: 2
          prompt: sec-identity-maturity
          input: identity_discovery
          tools:
            - read-intelligence
          description: Assess IAM maturity across SSO, MFA, PAM, RBAC, and zero-trust identity dimensions with gap analysis
          on_failure: stop
        - step: 3
          prompt: sec-identity-design
          input: maturity_assessment, identity_requirements
          tools:
            - read-intelligence
            - write-security-artifact
          description: Design target IAM architecture with federation protocols, MFA tiers, PAM controls, RBAC model, and migration path from current state
          on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
      - iam-architecture-design
      - sso-federation
      - mfa-strategy
      - privileged-access-management
      - zero-trust-identity
    input_modes:
      - text/plain
      - application/json
    output_modes:
      - application/json
      - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: >
      The agent designs technically sound IAM architectures, but the customer's
      identity team understands organizational change capacity for MFA rollouts,
      political dynamics around privileged access restrictions, and which
      federation compromises their vendor ecosystem requires. Identity architecture
      is engineering; identity adoption is organizational change management.
    challenges:
      - text: IAM designs must match customer maturity to avoid recommending controls they cannot operationalize
        specific_overhead:
          - Assessing customer IAM maturity across multiple dimensions before recommending target architecture
      - text: Federation protocol selection (SAML vs OIDC) depends on customer IdP ecosystem and application landscape
        specific_overhead:
          - Mapping federation compatibility across customer identity providers and application portfolio
      - text: Privileged access management changes face organizational resistance without clear break-glass procedures
        specific_overhead:
          - Designing PAM controls that balance security with operational need for emergency access
    scenarios:
      - problem: Customer wants zero-trust identity but current IAM maturity is at basic password-based authentication
        why: >
          Zero-trust identity requires layered capabilities (SSO, MFA, device trust,
          continuous authorization) that must be adopted incrementally. Designing
          the end state without a maturity-aligned migration path results in a
          plan the customer cannot execute, eroding confidence in the engagement.
        agent: sec-identity-agent
        agent_response: >
          Assesses current IAM maturity across five dimensions, designs an
          incremental adoption path from current state to zero-trust identity,
          defines MFA rollout phases by user risk tier, and produces an IAM
          architecture document with milestone-based deployment gates.
        success_signal:
          metric: IAM maturity progression
          target: Customer advances at least one maturity level per dimension within agreed timeline
          leading_indicator: Maturity assessment completed and migration path accepted within first engagement
          failure_signal: Customer abandons IAM adoption due to gap between current state and recommended architecture
      - problem: SSO federation design does not account for customer's multi-IdP environment with legacy and modern applications
        why: >
          Enterprise customers often have multiple identity providers serving
          different application tiers. A federation design that assumes a single
          IdP or protocol misses integration complexity and creates authentication
          gaps for legacy applications.
        agent: sec-identity-agent
        agent_response: >
          Maps the customer's identity provider landscape, catalogs applications
          by federation protocol support (SAML, OIDC, legacy), designs a
          federation architecture with protocol bridging where needed, and
          specifies token lifetime and claim mapping for each integration tier.
        success_signal:
          metric: Federation coverage across application portfolio
          target: 100% of applications mapped to federation path with protocol specification
          leading_indicator: Application-to-IdP mapping completed within first week
          failure_signal: Application discovered post-deployment with no federation integration path
  escalation_triggers:
    - Customer has no MFA and compliance deadline requires it within 90 days
    - Federation design requires protocol bridging for 50+ legacy applications
    - Privileged access restriction impacts production operations without break-glass procedures
  prompt_registry:
    sec-identity-discovery:
      description: Discover existing identity infrastructure, directory topology, federation relationships, and access governance policies
      source: prompts/tasks.yaml#security.identity.discovery
      inputs:
        - title: customer_environment
          type: object
        - title: identity_requirements
          type: string
      outputs:
        - title: identity_discovery
          type: object
      requires_data:
        - source: read-infohub
          fields:
            - directory_infrastructure
            - identity_providers
            - federation_relationships
            - access_policies
          priority: critical
    sec-identity-maturity:
      description: Assess IAM maturity across SSO, MFA, PAM, RBAC, and zero-trust identity dimensions
      source: prompts/tasks.yaml#security.identity.maturity
      inputs:
        - title: identity_discovery
          type: object
      outputs:
        - title: maturity_assessment
          type: object
      requires_data:
        - source: read-intelligence
          fields:
            - iam_maturity_model
            - zero_trust_identity_framework
          priority: critical
    sec-identity-design:
      description: Design target IAM architecture with federation protocols, MFA tiers, PAM controls, and RBAC model
      source: prompts/tasks.yaml#security.identity.design
      inputs:
        - title: maturity_assessment
          type: object
        - title: identity_requirements
          type: string
      outputs:
        - title: iam_architecture
          type: object
      requires_data:
        - source: read-intelligence
          fields:
            - federation_protocol_specs
            - mfa_reference_architectures
            - pam_best_practices
          priority: critical
  boundaries:
    - Designs IAM and identity federation, does not design network segmentation or encryption (sec-architecture-agent's domain)
    - Designs MFA and PAM, does not map compliance frameworks (sec-compliance-agent's domain)
    - Maps identity-related controls, does not build threat models (sec-threat-agent's domain)
    - Defines identity access tiers, does not configure SIEM/SOAR or incident response (sec-incident-agent's domain)
    - Designs on-premises and hybrid IAM, does not evaluate cloud IAM services or CSPM (sec-cloud-agent's domain)
  permissions:
    - Read customer directory infrastructure and identity provider configurations
    - Read IAM reference architectures and federation protocol specifications
    - Design IAM architectures with SSO federation, MFA strategy, and PAM controls
    - Assess IAM maturity and produce gap analysis
    - Define RBAC models with role hierarchy and permission boundaries
    - Write IAM architecture documents and maturity assessments to artifact store
  guardrails:
    input_validation:
      - Reject IAM design requests without customer identity infrastructure context
      - Validate that directory topology information is available before federation design
      - Reject MFA strategy requests without user population and risk tier data
    output_checks:
      - Never design IAM architecture without maturity assessment baseline
      - MFA strategy must differentiate by user risk tier (standard, privileged, admin)
      - Federation designs must specify protocol details (assertions, claims, token lifetimes)
      - PAM designs must include break-glass procedures with audit logging
      - All IAM recommendations must include maturity-appropriate migration path
    signal_validation:
      - Never assume federation protocol compatibility without vendor verification
      - Use [NEEDS VALIDATION] when customer directory topology is incomplete
      - Flag IAM designs that assume maturity level higher than assessed baseline
    resource:
      max_tool_calls: 20
  error_handling:
    tool_failures:
      critical:
        - read-infohub
      enrichment:
        - read-intelligence
        - write-security-artifact
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot design IAM architecture without customer identity infrastructure data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available identity data, flag missing reference architectures
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag identity infrastructure data freshness concern for human verification
  knowledge:
    scope:
      domains:
        - identity-access-management
        - sso-federation
        - privileged-access
        - zero-trust-identity
      archetypes:
        - enterprise
        - multi-idp
        - regulated-industries
    references:
      - path: references/expertise-architecture-and-compliance.yaml
        description: IAM architecture patterns, federation protocol specifications, zero-trust identity frameworks, and PAM best practices
  autonomy:
    triggers:
      - type: parent_dispatch
        source: security-specialist-agent
        description: Security Specialist orchestrator routes IAM design and identity architecture requests
      - type: event
        source: deal_stage_webhook
        condition: deal.has_iam_requirements == true AND deal.stage == "technical_validation"
        description: Auto-triggers IAM maturity assessment when deal with identity requirements enters validation
    outputs:
      - type: parent_return
        target: security-specialist-agent
        payload:
          - iam_architecture
          - maturity_assessment
        description: Identity architecture outputs back to orchestrator
      - type: trigger_agent
        target: sec-architecture-agent
        condition: iam.zero_trust_identity_ready == true AND architecture.zero_trust_network_pending == true
        payload:
          - iam_architecture
        description: Completed identity architecture triggers architecture agent for network zero-trust alignment
      - type: notify_human
        condition: maturity.critical_gap == true OR federation.compatibility_risk == true
        channel: alert
        description: Critical IAM maturity gaps and federation compatibility risks surface for specialist review
    consumes_toolboxes:
      - toolbox: security-architecture-outputs
        agent: sec-architecture-agent
        tools:
          - get-architecture-design
        reason: Security architecture provides trust boundary context for identity placement
      - toolbox: compliance-outputs
        agent: sec-compliance-agent
        tools:
          - get-compliance-mapping
        reason: Compliance requirements constrain MFA, PAM, and access control design choices
    dependencies:
      - agent: sec-compliance-agent
        toolbox: compliance-outputs
        tools:
          - get-compliance-mapping
        purpose: Compliance framework requirements drive MFA and PAM control requirements
