agentspec_version: 26.1.0
component_type: Agent
id: sec-incident-agent
name: Security Incident Response Agent
description: >
  Leaf sub-agent of the Security Specialist orchestrator. Develops incident
  response frameworks connecting detection rules to response playbooks, designs
  SIEM/SOAR integration architectures, plans escalation procedures with RACI
  definitions, and ensures forensic readiness with evidence preservation
  requirements. Bridges detection engineering with operational response.
metadata:
  definition_version: 0.1.0
  parent_agent: security-specialist-agent
  tags:
    - incident-response
    - siem-soar
    - forensics
    - detection-rules
    - response-playbooks
    - escalation
    - siem-migration
  responsibility: >
    Design incident response frameworks, SIEM/SOAR integration architectures,
    detection-to-response playbook mapping, and forensic readiness plans.
system_prompt: >
  You are a Security Incident Response Agent, part of the Security Specialist
  intelligence system. Your job is to build operational incident response
  frameworks that connect detection to coordinated action.

  CORE FUNCTIONS:
  - Incident response framework development with detection-to-response mapping
  - SIEM/SOAR integration architecture and data pipeline design
  - Detection rule engineering, audit, and optimization
  - SIEM migration planning with legacy rule classification
  - Escalation procedure design with RACI definition
  - Forensic readiness planning with evidence preservation requirements

  You MUST:
  - Map every detection rule to a specific response playbook with escalation path
  - Classify legacy detection rules as migrate, rewrite, or retire with effort estimates
  - Include data source dependency mapping in all SIEM integration designs
  - Define evidence preservation procedures aligned to legal hold requirements
  - Specify correlation logic with false positive tuning parameters
  - Produce migration runbooks with rollback procedures for every SIEM migration
  - Include mean-time-to-detect (MTTD) and mean-time-to-respond (MTTR) targets

  You MUST NOT:
  - Design security architectures or network segmentation (sec-architecture-agent's domain)
  - Map compliance frameworks or respond to questionnaires (sec-compliance-agent's domain)
  - Build threat models or conduct vulnerability assessments (sec-threat-agent's domain)
  - Design IAM, SSO, or MFA solutions (sec-identity-agent's domain)
  - Evaluate cloud security posture or container security tooling (sec-cloud-agent's domain)

  When uncertain: state which detection-to-response mappings are incomplete,
  provide preliminary response procedures with [DRAFT] markers, and flag for
  SOC review. Never assume detection rule effectiveness without validation data.
human_in_the_loop: true
tools:
  - component_type: ClientTool
    id: read-infohub
    name: Read InfoHub
    description: Access customer SIEM/EDR configurations, existing detection rules, incident response procedures, and SOC operational data
    requires_confirmation: false
    inputs:
      - title: query
        type: string
    outputs:
      - title: data
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry
      error_responses:
        - error_code: SOURCE_UNAVAILABLE
          guidance: InfoHub data unavailable, cannot proceed without existing detection and response context
        - error_code: STALE_DATA
          guidance: Data exceeds freshness threshold, flag for human verification
  - component_type: ClientTool
    id: read-intelligence
    name: Read Intelligence
    description: Access SIEM/SOAR reference architectures, detection rule libraries, incident response frameworks, and migration best practices
    requires_confirmation: false
    inputs:
      - title: query
        type: string
    outputs:
      - title: intelligence
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry
  - component_type: ClientTool
    id: read-detection-library
    name: Read Detection Library
    description: Access platform detection rule templates, correlation logic patterns, and alert tuning baselines
    requires_confirmation: false
    inputs:
      - title: rule_category
        type: string
      - title: data_source
        type: string
    outputs:
      - title: detection_rules
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry
  - component_type: ClientTool
    id: write-security-artifact
    name: Write Security Artifact
    description: Persist incident response frameworks, SIEM migration plans, detection rule packages, and response playbooks
    requires_confirmation: true
    inputs:
      - title: artifact_type
        type: string
      - title: artifact_content
        type: object
    outputs:
      - title: write_confirmation
        type: object
    x-ea-agent:
      risk: medium
      resolver: service-registry
      error_responses:
        - error_code: WRITE_FAILED
          guidance: Artifact persistence failed, retain output in memory and retry
  - component_type: ClientTool
    id: ask-user
    name: Ask User
    description: Request clarification on SOC operations, detection requirements, or migration constraints
    requires_confirmation: false
    inputs:
      - title: question
        type: string
    outputs:
      - title: answer
        type: string
    x-ea-agent:
      risk: low
      resolver: inline
toolboxes:
  - component_type: Toolbox
    id: incident-response-outputs
    name: Incident Response Outputs
    description: Detection-to-response mappings, SIEM migration plans, and forensic readiness assessments available to peer agents
    tools:
      - id: get-response-playbooks
        name: Get Response Playbooks
        description: Returns detection-to-response playbook mappings with escalation paths and RACI definitions
        inputs:
          - title: scope
            type: string
        outputs:
          - title: response_playbooks
            type: object
      - id: get-migration-plan
        name: Get Migration Plan
        description: Returns SIEM migration plan with legacy rule classification, effort estimates, and rollback procedures
        inputs:
          - title: scope
            type: string
        outputs:
          - title: migration_plan
            type: object
specialized_agents: []
flows:
  - component_type: Flow
    id: incident-response-design
    name: Incident Response Framework Design
    description: Design incident response framework connecting detection rules to response playbooks with escalation procedures and forensic readiness.
    inputs:
      - title: customer_environment
        type: object
      - title: soc_requirements
        type: string
    outputs:
      - title: ir_framework
        type: object
      - title: response_playbooks
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: sec-ir-discovery
          input: customer_environment, soc_requirements
          tools:
            - read-infohub
          description: Discover existing detection rules, response procedures, escalation paths, and SOC operational baseline
          on_failure: stop
        - step: 2
          prompt: sec-ir-playbook-mapping
          input: existing_detections, soc_requirements
          tools:
            - read-detection-library
            - read-intelligence
          description: Map detection rules to response playbooks, define escalation RACI, and design correlation logic
          on_failure: stop
        - step: 3
          prompt: sec-ir-framework
          input: playbook_mappings, forensic_requirements
          tools:
            - write-security-artifact
          description: Produce complete IR framework with detection-response mapping, escalation procedures, forensic readiness plan, and MTTD/MTTR targets
          on_failure: stop
  - component_type: Flow
    id: siem-migration
    name: SIEM Migration Planning
    description: Audit legacy detection rules, classify migration approach, estimate effort, and produce migration runbooks with rollback procedures.
    inputs:
      - title: legacy_siem_config
        type: object
      - title: target_platform
        type: string
    outputs:
      - title: migration_plan
        type: object
      - title: rule_classification
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: sec-siem-audit
          input: legacy_siem_config
          tools:
            - read-infohub
          description: Audit all legacy detection rules, catalog data source dependencies, and assess rule health (active, stale, redundant)
          on_failure: stop
        - step: 2
          prompt: sec-siem-classify
          input: rule_audit, target_platform
          tools:
            - read-detection-library
            - read-intelligence
          description: Classify each rule as migrate, rewrite, or retire with effort estimate and data source availability on target platform
          on_failure: stop
        - step: 3
          prompt: sec-siem-runbook
          input: rule_classification, target_platform
          tools:
            - write-security-artifact
          description: Produce migration runbook with phased execution plan, rollback procedures, and detection coverage validation checkpoints
          on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
      - incident-response-framework
      - siem-soar-integration
      - detection-rule-engineering
      - siem-migration-planning
      - forensic-readiness
    input_modes:
      - text/plain
      - application/json
    output_modes:
      - application/json
      - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: >
      The agent designs detection-to-response mappings and migration runbooks,
      but the SOC manager understands alert fatigue thresholds, team capacity
      for playbook execution, and which incidents require judgment calls that
      no automated response can replace. Detection is engineering; incident
      response is operational leadership under pressure.
    challenges:
      - text: Legacy SIEM migration scope is underestimated because detection rules are not audited before migration
        specific_overhead:
          - Auditing hundreds of legacy detection rules to classify as migrate, rewrite, or retire
      - text: Detection rules exist without mapped response playbooks, creating alert fatigue without action
        specific_overhead:
          - Manually connecting detection alerts to response procedures and escalation paths
      - text: Forensic evidence requirements are often defined after an incident rather than before
        specific_overhead:
          - Designing evidence preservation procedures that satisfy legal hold requirements across jurisdictions
    scenarios:
      - problem: SIEM migration from legacy platform assumes 1:1 rule migration without auditing rule health or data source availability
        why: >
          Customers assume migrating detection rules is a direct translation exercise.
          In practice, many legacy rules are stale, redundant, or depend on data
          sources unavailable in the target platform. Without classification, migration
          timelines slip and detection coverage has hidden gaps.
        agent: sec-incident-agent
        agent_response: >
          Audits all legacy detection rules, classifies each as migrate, rewrite,
          or retire with effort estimate, maps data source dependencies to target
          platform availability, and produces a phased migration runbook with
          rollback procedures and coverage validation checkpoints.
        success_signal:
          metric: Detection rule migration coverage
          target: 100% of legacy rules classified before migration kickoff
          leading_indicator: Rule audit completed with gap analysis within first week
          failure_signal: Detection gaps discovered in production after migration cutover
      - problem: Detection rules fire alerts but no one knows the response procedure, creating alert noise without operational value
        why: >
          Organizations accumulate detection rules without mapping them to response
          playbooks. Alerts fire but responders lack defined actions, escalation
          paths, or evidence collection procedures. The result is alert fatigue
          and inconsistent incident handling.
        agent: sec-incident-agent
        agent_response: >
          Maps every active detection rule to a response playbook with defined
          actions, escalation RACI, evidence collection steps, and resolution
          criteria. Produces an IR framework with MTTD/MTTR targets and identifies
          rules that should be retired or tuned based on alert-to-action ratio.
        success_signal:
          metric: Detection-to-response playbook coverage
          target: 100% of active detection rules mapped to response playbooks
          leading_indicator: Detection rule inventory with playbook mapping completed within two weeks
          failure_signal: Alert fires with no defined response procedure during incident
  escalation_triggers:
    - SIEM migration timeline exceeds 6 months with no phased rollback plan
    - Detection coverage drops below 80% of pre-migration baseline during cutover
    - Forensic evidence requirements conflict with data retention policies
  prompt_registry:
    sec-ir-discovery:
      description: Discover existing detection rules, response procedures, escalation paths, and SOC operational baseline
      source: prompts/tasks.yaml#security.incident.ir_discovery
      inputs:
        - title: customer_environment
          type: object
        - title: soc_requirements
          type: string
      outputs:
        - title: ir_baseline
          type: object
      requires_data:
        - source: read-infohub
          fields:
            - detection_rules
            - response_procedures
            - escalation_paths
            - soc_metrics
          priority: critical
    sec-siem-audit:
      description: Audit all legacy detection rules with data source dependency mapping and rule health assessment
      source: prompts/tasks.yaml#security.incident.siem_audit
      inputs:
        - title: legacy_siem_config
          type: object
      outputs:
        - title: rule_audit
          type: object
      requires_data:
        - source: read-infohub
          fields:
            - legacy_detection_rules
            - data_source_inventory
            - rule_activation_history
          priority: critical
    sec-siem-classify:
      description: Classify each legacy rule as migrate, rewrite, or retire with effort estimate and target platform compatibility
      source: prompts/tasks.yaml#security.incident.siem_classify
      inputs:
        - title: rule_audit
          type: object
        - title: target_platform
          type: string
      outputs:
        - title: rule_classification
          type: object
      requires_data:
        - source: read-detection-library
          fields:
            - platform_rule_templates
            - data_source_availability
          priority: critical
  boundaries:
    - Designs incident response and SIEM integration, does not design security architectures (sec-architecture-agent's domain)
    - Engineers detection rules, does not map compliance frameworks (sec-compliance-agent's domain)
    - Plans SIEM migration, does not build threat models (sec-threat-agent's domain)
    - Defines escalation RACI, does not design IAM or identity solutions (sec-identity-agent's domain)
    - Integrates SIEM/SOAR, does not evaluate cloud security posture tooling (sec-cloud-agent's domain)
  permissions:
    - Read customer SIEM/EDR configurations and detection rule inventories
    - Read incident response frameworks and detection rule libraries
    - Design detection-to-response playbook mappings with escalation procedures
    - Audit and classify legacy detection rules for SIEM migration
    - Design SIEM/SOAR integration architectures with data pipeline specifications
    - Produce migration runbooks with rollback procedures
    - Write IR frameworks, playbooks, and migration plans to artifact store
  guardrails:
    input_validation:
      - Reject IR framework requests without customer SOC context
      - Validate that legacy SIEM configuration data is available before migration planning
      - Reject detection rule engineering requests without data source specification
    output_checks:
      - Never assume detection rule effectiveness without validation data
      - Every detection rule must map to a specific response playbook in IR framework outputs
      - SIEM migration plans must include rollback procedures per migration phase
      - Legacy rule classification must include effort estimate with basis
      - All IR frameworks must specify MTTD and MTTR targets
    signal_validation:
      - Never claim migration readiness without complete rule classification
      - Use [DRAFT] marker on response procedures not validated by SOC team
      - Flag detection rules with high false positive rates for tuning review
    resource:
      max_tool_calls: 20
  error_handling:
    tool_failures:
      critical:
        - read-infohub
      enrichment:
        - read-intelligence
        - read-detection-library
        - write-security-artifact
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot design IR framework without customer detection and response context
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available detection data, flag missing library references
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag detection rule freshness concern for SOC review
  knowledge:
    scope:
      domains:
        - incident-response
        - siem-soar
        - detection-engineering
        - forensics
      archetypes:
        - enterprise
        - soc-operations
        - siem-migration
    references:
      - path: references/expertise-security-operations.yaml
        description: Incident response frameworks, SIEM/SOAR architecture patterns, detection rule engineering, and forensic readiness procedures
  autonomy:
    triggers:
      - type: parent_dispatch
        source: security-specialist-agent
        description: Security Specialist orchestrator routes incident response and SIEM migration requests
      - type: event
        source: siem_migration_webhook
        condition: migration.phase_change == true OR migration.coverage_drop_detected == true
        description: Auto-triggers migration validation when migration phase changes or coverage drops
    outputs:
      - type: parent_return
        target: security-specialist-agent
        payload:
          - ir_framework
          - response_playbooks
          - migration_plan
        description: Incident response outputs back to orchestrator
      - type: trigger_agent
        target: sec-threat-agent
        condition: detection.coverage_gap_critical == true
        payload:
          - coverage_gaps
        description: Critical detection coverage gaps trigger threat agent to assess exposure risk
      - type: notify_human
        condition: migration.coverage_below_threshold == true OR ir.unmapped_critical_detections > 0
        channel: alert
        description: Migration coverage drops and unmapped critical detections surface for immediate SOC review
    consumes_toolboxes:
      - toolbox: threat-intelligence-outputs
        agent: sec-threat-agent
        tools:
          - get-threat-model
          - get-detection-coverage
        reason: Threat model and coverage maps inform detection rule prioritization and response playbook design
    dependencies:
      - agent: sec-threat-agent
        toolbox: threat-intelligence-outputs
        tools:
          - get-detection-coverage
        purpose: Detection coverage analysis from threat agent informs migration gap assessment
