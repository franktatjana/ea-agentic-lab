      - MEDIUM: partial requirement or capability confirmation, 2-4 data points
      - LOW: requirement category only, no specific text
      Dimensions to assess: Requirement Clarity, Platform Capability Documentation,
      Certification Evidence, Reference Case Studies, Competitive Context.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      STEP 1: COMPLIANCE STATEMENT
      State how the platform meets this requirement.
      - Compliance level: FULLY COMPLIANT, PARTIALLY COMPLIANT, NOT COMPLIANT,
        COMPLIANT WITH CONDITIONS
      - Explanation of how the requirement is met (specific features, configurations)
      - Conditions or caveats (if PARTIALLY or WITH CONDITIONS)
      - Confidence: HIGH (documented, tested), MEDIUM (capability exists but not
        specifically validated for this use), LOW (theoretical compliance)
      If requirement text is vague, state "Compliance assessment is based on
      interpretation of requirement. Clarification recommended before final response."
      Deliverable: Compliance statement (Level | Explanation | Conditions | Confidence).

      STEP 2: CAPABILITY DESCRIPTION
      Provide detailed explanation of relevant platform features.
      For each relevant capability:
      - Feature name
      - How it addresses the requirement
      - Technical depth (architecture, implementation approach)
      - Maturity: GA (generally available), BETA, PLANNED (with timeline), N/A
      - Primary classification: Native, Integration, Custom, Partner
      - Secondary flags if capability spans categories
      - Evidence: documentation references, release notes, certification reports
      If capability documentation is limited, state which features are confirmed
      vs. inferred from general platform knowledge.
      Deliverable: Capability description (Feature | Relevance | Technical Detail |
      Maturity | Classification | Evidence).

      STEP 3: DIFFERENTIATORS
      Identify what makes the platform's approach superior for this requirement.
      For each differentiator:
      - Differentiator description
      - Customer benefit (what outcome it enables)
      - Competitive advantage (how it compares to alternatives)
      - Evidence (benchmark, case study, analyst report)
      - Confidence: HIGH (substantiated), MEDIUM (plausible but unverified),
        LOW (marketing claim, needs substantiation)
      Trend claims about market position require at least two analyst reports or
      data points. If only one exists, state "INSUFFICIENT DATA for market trend."
      If no differentiators exist for this requirement, state "Platform meets
      requirement at parity with market alternatives. No unique differentiator
      for this specific capability."
      Deliverable: Differentiator table (Differentiator | Benefit | Competitive
      Advantage | Evidence | Confidence).

      STEP 4: EVIDENCE REFERENCES
      Compile supporting evidence for the response.
      For each reference:
      - Reference type (documentation, certification, case study, analyst report,
        benchmark, white paper)
      - Title and source
      - Relevance to this requirement
      - Accessibility (public, NDA-required, available on request)
      If evidence is limited, state "Additional evidence available upon request"
      and specify what types of evidence could be provided.
      Deliverable: Evidence catalog (Type | Title | Source | Relevance | Access).

      STEP 5: CAVEATS AND LIMITATIONS
      Honestly document conditions and limitations.
      For each caveat:
      - Limitation description
      - Impact on compliance (what it means for the customer)
      - Mitigation or workaround if available
      - Timeline for resolution if the limitation is being addressed
      - Risk to the customer if they accept this limitation
      If no caveats exist, state "No caveats identified. Platform fully meets
      stated requirement without conditions."
      Deliverable: Caveat register (Limitation | Impact | Mitigation | Timeline |
      Risk).

      STEP 6: STATE DELTA
      Specify what this runbook's findings change in the RFx response record:
      - Fields updated (field path | old value | new value | evidence)
      - Compliance status recorded
      - Response quality flags
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed with all inputs classified and run mode declared
      - Data Availability Map shows richness per dimension
      - Compliance statement uses four-level scale, not binary yes/no
      - Every compliance claim is substantiated with a specific feature reference
      - Capability descriptions distinguish GA from BETA from PLANNED
      - Differentiators include confidence levels and evidence
      - Caveats are honest and specific, not hedged with vague language
      - Trend claims reference two or more data points, or state INSUFFICIENT DATA
      - Classification uses primary + secondary flags for capabilities
      - State delta specifies field-level changes with evidence
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only a signal acquisition plan (data gaps, questions to ask, sources to request, observation checklist, re-assessment date). Skip analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Write in professional RFx response style. Lead with an executive
      summary of exactly 3 sentences:
      (1) the compliance conclusion with confidence basis,
      (2) the weakest point or most significant caveat,
      (3) the single most urgent action to strengthen the response.
      Then produce all numbered deliverables as labeled sections.

  # =============================================================================
  # USE CASE PROMPTS
  # =============================================================================
  define_use_case:
    description: "Define a security use case specification"
    template: |
      As a Security Specialist, define the following security use case.

      **Use Case Name:** {use_case_name}
      **Category:** {category} (e.g., Threat Detection, Compliance, Insider Threat)
      **Business Context:**
      {business_context}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are producing a use case specification that a detection engineer can
      implement and a SOC analyst can operationalize. Every detection must have
      testable criteria. Every data source must be specific. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map, assess richness for each dimension:
      - HIGH: confirmed business requirements, known data sources, 5+ data points
      - MEDIUM: partial context or category only, 2-4 data points
      - LOW: use case name only, no context
      Dimensions to assess: Business Context, Threat Landscape, Data Source
      Availability, Regulatory Requirements, Existing Detection Coverage.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      STEP 1: USE CASE IDENTIFICATION
      Establish the identity and classification of this use case.
      - Use Case ID (structured identifier)
      - Name (descriptive, action-oriented)
      - Description: what this use case detects, prevents, or monitors
      - Primary classification: Threat Detection, Compliance Monitoring, Insider
        Threat, Operational Security, Fraud Detection
      - Secondary flags if the use case spans multiple categories
      - MITRE ATT&CK mapping if applicable (tactic, technique, sub-technique)
      - Confidence: HIGH (known threat pattern), MEDIUM (emerging threat),
        LOW (hypothetical scenario)
      Deliverable: Use case identity (ID | Name | Description | Classification |
      ATT&CK Mapping | Confidence).

      STEP 2: BUSINESS VALUE
      Articulate why this use case matters to the customer.
      - Business risk it addresses (what could happen without this detection)
      - Regulatory or compliance requirement it satisfies (specific regulation and clause)
      - Financial impact of the risk (quantified if data available)
      - Stakeholders who benefit (roles, not just "security team")
      - Priority relative to other use cases (with justification)
      - Confidence: HIGH (documented incidents or regulatory requirement),
        MEDIUM (industry benchmarks), LOW (theoretical)
      If business context is absent, state "Business value assessment requires
      customer-specific context. Generic industry value provided."
      Deliverable: Business value statement (Risk | Regulation | Impact |
      Stakeholders | Priority | Confidence).

      STEP 3: DATA SOURCE REQUIREMENTS
      Define what log and event data is needed.
      For each data source:
      - Source name and type (firewall, endpoint, identity, cloud, application)
      - Specific fields required (not just "firewall logs" but which fields matter)
      - Volume estimate (events per second or per day)
      - Format and protocol (syslog, API, file, agent)
      - Criticality: REQUIRED (detection fails without it), ENRICHMENT (improves
        detection but not essential), OPTIONAL (nice to have)
      - Availability: CONFIRMED, LIKELY, UNKNOWN
      If data source information is unavailable, state "Data source requirements
      are based on standard detection patterns. Customer environment review required."
      Deliverable: Data source matrix (Source | Type | Fields | Volume | Format |
      Criticality | Availability).

      STEP 4: DETECTION LOGIC
      Define how the detection works.
      - Detection approach (rule-based, statistical, ML-based, correlation, behavioral)
      - Logic description (pseudocode or natural language query)
      - Trigger conditions (what combination of events fires the detection)
      - Time windows and thresholds (with rationale for chosen values)
      - Correlation requirements (if multiple event types must combine)
      - False positive sources and tuning levers
      - Confidence: HIGH (tested in production), MEDIUM (tested in lab),
        LOW (theoretical, untested)
      Deliverable: Detection specification (Approach | Logic | Triggers |
      Thresholds | Correlations | FP Sources | Confidence).

      STEP 5: ALERT AND RESPONSE
      Define alert handling and response procedures.
      - Alert severity: CRITICAL, HIGH, MEDIUM, LOW with criteria for each level
      - Escalation path (who is notified, in what order, by what channel)
      - Response actions per severity level
      - Automated response options (if applicable, with safeguards)
      - Investigation checklist (steps an analyst follows after alert fires)
      - SLA targets (response time, resolution time per severity)
      - Prerequisites: SOC procedures updated, analyst training completed,
        escalation contacts confirmed
      Deliverable: Alert and response plan (Severity | Criteria | Escalation |
      Response Actions | SLA | Prerequisites).

      STEP 6: SUCCESS METRICS AND TESTING
      Define how to measure effectiveness and validate the detection.
      For each metric:
      - Metric name (true positive rate, false positive rate, MTTD, MTTR)
      - Target value
      - Measurement method
      - Measurement frequency
      - Baseline (if available, or "BASELINE TO BE ESTABLISHED")
      Testing approach:
      - Test scenarios (true positive, true negative, evasion attempts)
      - Test data requirements
      - Validation criteria
      - Retest frequency
      Trend claims require at least two data points. If only one exists, state
      "INSUFFICIENT DATA for effectiveness trend."
      Deliverable: Metrics and testing plan (Metric | Target | Method | Frequency |
      Baseline) + Test plan (Scenario | Data | Criteria | Frequency).

      STEP 7: MAINTENANCE REQUIREMENTS
      Define ongoing tuning and upkeep.
      - Tuning cadence (how often to review thresholds and rules)
      - Tuning triggers (alert volume spike, new false positive pattern, threat
        landscape change)
      - Review responsibilities (who tunes, who approves changes)
      - Retirement criteria (when this use case is no longer needed)
      - Dependencies on threat intelligence feeds or external data
      - Prerequisites: change management process, tuning playbook documented
      Deliverable: Maintenance plan (Activity | Cadence | Trigger | Owner |
      Prerequisites | Retirement Criteria).

      STEP 8: STATE DELTA
      Specify what this runbook's findings change in the account record:
      - Fields updated (field path | old value | new value | evidence)
      - Use case catalog updates
      - Detection coverage changes
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed with all inputs classified and run mode declared
      - Data Availability Map shows richness per dimension
      - Use case has structured ID and ATT&CK mapping where applicable
      - Classification uses primary + secondary flags
      - Business value includes quantified impact where data supports it
      - Data sources specify required fields, not just source names
      - Detection logic includes false positive sources and tuning levers
      - Alert severity uses four-level scale with defined criteria per level
      - Response plan includes prerequisites (procedures, training, contacts)
      - Success metrics include measurable targets with baselines
      - Maintenance plan includes retirement criteria
      - Trend claims reference two or more data points, or state INSUFFICIENT DATA
      - Confidence levels stated for every assessment with basis
      - State delta specifies field-level changes with evidence
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only a signal acquisition plan (data gaps, questions to ask, sources to request, observation checklist, re-assessment date). Skip analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Lead with an executive summary of exactly 3 sentences:
      (1) the use case viability and detection readiness with confidence basis,
      (2) the weakest point or biggest gap in the specification,
      (3) the single most urgent action to take next.
      Then produce all numbered deliverables as labeled sections.
