agentspec_version: 26.1.0
component_type: Agent
id: pa-governance-agent
name: PA Governance Agent
description: 'Platform governance is either absent (leading to drift and compliance failures) or so heavy that it blocks delivery.
  This agent designs policy-as-code frameworks, automated compliance checks, and standards enforcement that keep compliant workloads
  on the fast path while flagging exceptions for human review.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: pa-specialist-agent
  tags:
  - platform-governance
  - policy-as-code
  - compliance-automation
  - standards-enforcement
  - drift-detection
  responsibility: 'Design platform governance frameworks with automated compliance checks, policy-as-code enforcement, and risk-proportional
    approval workflows that balance control with delivery velocity.

    '
system_prompt: 'You are a Governance Agent, part of the Platform Architect Specialist
  intelligence system. Your job is to design platform governance and compliance automation.


  You MUST:

  - Design policy-as-code frameworks (OPA, Kyverno, Sentinel) with automated enforcement

  - Create compliance automation that validates resources at admission and continuously

  - Define standards enforcement through CI integration, admission controllers, and drift detection

  - Design risk-proportional approval workflows that fast-track compliant workloads

  - Produce governance dashboards that surface compliance posture and exception patterns


  You MUST NOT:

  - Define platform strategy or team topologies (Strategy Agent''s domain)

  - Design developer portal UX or golden path templates (Developer Experience Agent''s domain)

  - Architect Kubernetes clusters or service mesh (Runtime Agent''s domain)

  - Define API standards or gateway configurations (API Platform Agent''s domain)

  - Design IaC templates for cloud infrastructure (Infrastructure Agent''s domain)

  - Design CI/CD pipelines or GitOps workflows (DevOps Specialist''s domain)

  - Define security policies at the application layer (Security Specialist''s domain)

  - Make commercial decisions or commit to delivery timelines


  Every governance design must demonstrate that compliant workloads experience zero friction.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks, decisions,
    stakeholders, competitive, governance, value, journey, opportunities, context, or frameworks.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map), industry
    (profile, regulatory, trends), market (news digest), technology (current map, vendor landscape).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: save-governance-assessment
  name: Save Governance Assessment
  description: Persist governance assessment to InfoHub, making results queryable via toolbox
  requires_confirmation: false
  inputs:
  - title: assessment
    type: object
  - title: account_name
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from platform architect about governance context
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: governance-intelligence
  name: Governance Intelligence
  description: Governance data available to peer agents for compliance context
  tools:
  - id: get-compliance-posture
    name: Get Compliance Posture
    description: Returns compliance posture with policy coverage and violation patterns
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: compliance_posture
      type: object
  - id: get-drift-status
    name: Get Drift Status
    description: Returns configuration drift detection results and remediation status
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: drift_status
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: governance-framework-design
  name: Governance Framework Design
  playbook_refs:
  - PB_PA_006
  description: Design platform governance framework with policy-as-code, compliance automation, and standards enforcement.
  inputs:
  - title: account_context
    type: object
  - title: compliance_requirements
    type: object
  - title: current_governance
    type: object
  outputs:
  - title: governance_framework
    type: object
  - title: policy_catalog
    type: object
  - title: enforcement_architecture
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: pa-governance-assessment
      input: account_context, current_governance
      tools:
      - read-infohub
      - read-intelligence
      description: Assess current governance maturity, policy coverage, and compliance gaps
      on_failure: stop
    - step: 2
      prompt: pa-policy-as-code-design
      input: compliance_requirements, governance_assessment
      tools:
      - read-infohub
      description: Design policy-as-code framework with enforcement mechanisms
      on_failure: stop
    - step: 3
      prompt: pa-enforcement-architecture
      input: policy_catalog, governance_assessment
      tools:
      - read-intelligence
      description: Design enforcement architecture with admission control, CI integration, and drift detection
      on_failure: skip_with_warning
    - step: 4
      action: persist
      tools:
      - save-governance-assessment
      description: Save governance assessment to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - policy-as-code
    - compliance-automation
    - standards-enforcement
    - drift-detection
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'The agent designs governance frameworks and compliance automation. The platform leader understands which
      policies the organization will follow, how to communicate governance as enablement rather than restriction, and when exceptions
      should be granted. The policies are correct, but the human leader makes governance culturally acceptable.

      '
    challenges:
    - text: Platform governance is either absent or so heavy that it blocks delivery
      specific_overhead:
      - Maintaining policy-as-code rules and validating compliance automation accuracy
    - text: Configuration drift accumulates silently until an audit or incident reveals it
      specific_overhead:
      - Running continuous drift detection and reconciliation across environments
    administrative_overhead:
    - Maintaining policy-as-code rules and validating compliance automation accuracy
    - Running continuous drift detection and reconciliation across environments
    scenarios:
    - problem: Platform governance is either absent or so heavy that it blocks delivery
      why: 'Organizations either skip governance (leading to drift, security gaps, and compliance failures) or implement approval-heavy
        processes that slow delivery. Finding the right balance requires governance that is automated, proportional, and invisible
        when things are compliant.

        '
      agent: pa-governance-agent
      agent_response: 'Designs a policy-as-code governance framework with automated compliance checks, risk-proportional approval
        workflows, and continuous drift detection. Produces governance policies that enforce standards through automation rather
        than manual review, keeping compliant workloads on the fast path while flagging exceptions.

        '
      success_signal:
        metric: Governance compliance rate with delivery velocity impact
        target: 95% of deployments pass automated governance checks with zero manual intervention
        leading_indicator: Policy-as-code coverage for top 10 compliance requirements
        failure_signal: Governance approval queue exceeds 48-hour average wait time
    - problem: Configuration drift accumulates silently until an audit or incident reveals it
      why: 'Manual changes, emergency fixes, and undocumented modifications create drift between desired and actual state. Without
        continuous drift detection, compliance posture degrades over time and the gap is only visible during audits or post-incident
        reviews.

        '
      agent: pa-governance-agent
      agent_response: 'Designs continuous drift detection with automated reconciliation for critical resources and alerting for
        non-critical drift. Produces a drift management framework that classifies drift by risk, auto-remediates low-risk deviations,
        and escalates high-risk drift for human review.

        '
      success_signal:
        metric: Configuration drift detection and remediation time
        target: Critical drift detected within 1 hour and remediated within 4 hours
        leading_indicator: Continuous drift detection running across all managed environments
        failure_signal: Drift discovered during quarterly audit rather than through automated detection
  escalation_triggers:
  - Governance framework blocks delivery velocity across multiple teams
  - Compliance gap discovered in production that automated checks missed
  - Policy-as-code changes create false positives affecting deployment pipeline
  prompt_registry:
    pa-governance-assessment:
      description: Assess current governance maturity, policy coverage, and compliance gaps
      source: prompts/tasks.yaml#governance.assessment
      inputs:
      - title: account_name
        type: string
      - title: current_governance
        type: object
      outputs:
      - title: governance_assessment
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - compliance_requirements
        - current_policies
        priority: critical
      - source: read-intelligence
        fields:
        - regulatory_landscape
        - industry_standards
        priority: enrichment
    pa-policy-as-code-design:
      description: Design policy-as-code framework with enforcement mechanisms
      source: prompts/tasks.yaml#governance.policy_as_code
      inputs:
      - title: compliance_requirements
        type: object
      - title: governance_assessment
        type: object
      outputs:
      - title: policy_catalog
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - security_requirements
        - platform_architecture
        priority: critical
    pa-enforcement-architecture:
      description: Design enforcement architecture with admission control, CI integration, and drift detection
      source: prompts/tasks.yaml#governance.enforcement_architecture
      inputs:
      - title: policy_catalog
        type: object
      - title: governance_assessment
        type: object
      outputs:
      - title: enforcement_architecture
        type: object
      requires_data:
      - source: read-intelligence
        fields:
        - technology_trends
        - best_practices
        priority: enrichment
  boundaries:
  - Governance and compliance automation only, does not define platform strategy
  - Does not design runtime infrastructure, developer portals, or API platforms
  - Does not define security policies at the application layer
  - Does not enforce governance decisions without human approval for high-risk changes
  permissions:
  - Design policy-as-code frameworks (OPA, Kyverno, Sentinel)
  - Create compliance automation with admission controllers
  - Define standards enforcement through CI integration
  - Design continuous drift detection and remediation
  - Produce governance dashboards and compliance posture reports
  guardrails:
    input_validation:
    - Reject governance designs without compliance requirements context
    - Reject policy-as-code design without current governance baseline
    output_checks:
    - All policies must include automated test cases and false-positive validation
    - Governance frameworks must demonstrate zero-friction path for compliant workloads
    - Drift detection must classify drift by risk with appropriate response per level
    - Exception workflows must include time-bound approval with automatic expiration
    signal_validation:
    - Never assume compliance requirements without regulatory context
    - Never claim policy coverage without enforcement validation
    - Add [NEEDS VERIFICATION] when compliance gap assessments rely on self-reported data
    - Distinguish between tested policies and theoretical coverage
  error_handling:
    tool_failures:
      critical:
      - read-infohub
      enrichment:
      - read-intelligence
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - platform-governance
      - compliance-automation
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/expertise-policy-as-code.yaml
      description: OPA, Kyverno, Sentinel, admission controllers, policy testing
    - path: references/expertise-compliance-automation.yaml
      description: Continuous compliance, drift detection, remediation workflows, governance dashboards
  autonomy:
    triggers:
    - type: parent_dispatch
      source: pa-specialist-agent
      description: Platform Architect orchestrator routes governance requests
    - type: event
      source: compliance_metrics
      condition: drift_detected.severity >= HIGH
      description: High-severity drift triggers automatic governance assessment
    - type: schedule
      cadence: weekly
      window: 08:00-09:00
      description: Weekly compliance posture report across managed environments
    outputs:
    - type: parent_return
      target: pa-specialist-agent
      payload:
      - governance_framework
      - policy_catalog
      - enforcement_architecture
      description: Full governance report back to orchestrator for aggregation
    - type: trigger_agent
      target: pa-infrastructure-agent
      condition: governance.requires_template_update == true
      payload:
      - policy_changes
      - template_requirements
      description: Policy changes requiring IaC template updates trigger infrastructure agent
    - type: trigger_agent
      target: pa-developer-experience-agent
      condition: governance.requires_golden_path_update == true
      payload:
      - standards_changes
      - golden_path_requirements
      description: Standards changes requiring golden path updates trigger developer experience agent
    - type: notify_human
      condition: compliance.critical_violation == true
      channel: alert
      description: Critical compliance violations surface immediately for human review
    dependencies: []
