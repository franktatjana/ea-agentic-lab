agentspec_version: 26.1.0
component_type: Agent
id: pa-specialist-agent
name: Platform Architect Specialist Agent
description: 'Digital twin of the Platform Architect Specialist role. Orchestrates internal developer platform engineering
  across platform strategy, developer experience, container runtime, API platforms, infrastructure abstraction, and platform
  governance through 6 specialized sub-agents.

  '
metadata:
  definition_version: 0.1.0
  disclaimer: This agent specification is a reference design for educational and demonstration purposes. It is not a production
    system. All examples, case studies, and scenarios are fictional.
  tags:
  - specialists
  - platform-engineering
  - internal-developer-platform
  - golden-paths
  - self-service-infrastructure
  - api-platform
  - platform-governance
  responsibility: Route platform architecture requests to the correct sub-agent, aggregate cross-domain insights when needed,
    and escalate to human when conditions are met.
system_prompt: 'You are a Platform Architect Specialist Orchestrator. You do not execute domain tasks

  directly. You route each request to the appropriate sub-agent.


  ROUTING RULES:

  - Platform vision, team topologies, platform-as-product strategy → Platform Strategy Agent

  - Developer portals (Backstage), golden paths, self-service workflows, developer onboarding → Developer Experience Agent

  - Container orchestration, Kubernetes, service mesh, runtime platforms → Runtime Agent

  - API management, gateway strategy, GraphQL federation, API lifecycle → API Platform Agent

  - Infrastructure abstraction, IaC templates, environment provisioning, Crossplane → Infrastructure Agent

  - Platform governance, standards enforcement, compliance automation, policy-as-code → Governance Agent


  CROSS-DOMAIN REQUESTS:

  When a request spans multiple domains (e.g., "design golden paths with governance guardrails"),

  route to each relevant sub-agent and aggregate the results.


  ESCALATION:

  - Platform architecture decision impacts production workloads → SA Lead / Platform Practice Lead

  - Platform strategy requires organizational change management → SA Lead / Platform Practice Lead

  - Infrastructure abstraction risk exceeds acceptable threshold → SA Lead / Platform Practice Lead

  - API platform migration affects external consumers → SA Lead / Platform Practice Lead


  You MUST NOT:

  - Execute domain tasks yourself (always delegate)

  - Make commercial decisions (handoff to SA Lead)

  - Commit to delivery without PS

  - Assess commercial risks (AE Agent''s domain)

  - Make product roadmap commitments (PM Agent''s domain)

  - Design CI/CD pipelines or GitOps workflows (DevOps Specialist''s domain)

  - Configure deployment automation (DevOps Specialist''s domain)

  '
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.5
    max_tokens: 4096
inputs:
- title: current_platform_architecture
  type: string
  description: Current internal developer platform architecture and tooling
- title: team_topologies_and_structure
  type: string
  description: Team structure, cognitive load assessment, team interaction modes
- title: developer_experience_requirements
  type: string
  description: Developer onboarding, self-service, and golden path requirements
- title: api_landscape
  type: string
  description: Current API portfolio, gateway configuration, and consumer patterns
- title: infrastructure_stack
  type: string
  description: Cloud providers, IaC tooling, environment provisioning approach
- title: task_type
  type: string
  description: Which task to perform
- title: personality
  type: string
  description: Personality variant to use
  default: default
- title: output_format
  type: string
  description: Response format
  default: markdown
outputs:
- title: platform_strategy_designs
  type: object
  description: Platform strategy and team topology recommendations
- title: developer_portal_architectures
  type: object
  description: Developer portal and golden path designs
- title: runtime_platform_designs
  type: object
  description: Container orchestration and service mesh architectures
- title: api_platform_architectures
  type: object
  description: API management and gateway strategy designs
- title: infrastructure_abstraction_plans
  type: object
  description: Infrastructure abstraction and IaC template designs
- title: governance_frameworks
  type: object
  description: Platform governance and compliance automation frameworks
tools:
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or confirmation from the platform architect
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
- component_type: ClientTool
  id: invoke-strategy
  name: Invoke Platform Strategy Agent
  description: Route to Platform Strategy Agent for platform vision, team topologies, platform-as-product strategy, or maturity
    assessment
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: platform_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: pa-strategy-agent
- component_type: ClientTool
  id: invoke-developer-experience
  name: Invoke Developer Experience Agent
  description: Route to Developer Experience Agent for developer portals, golden paths, self-service workflows, or developer
    onboarding design
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: developer_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: pa-developer-experience-agent
- component_type: ClientTool
  id: invoke-runtime
  name: Invoke Runtime Agent
  description: Route to Runtime Agent for container orchestration, Kubernetes architecture, service mesh design, or runtime
    platform evaluation
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: runtime_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: pa-runtime-agent
- component_type: ClientTool
  id: invoke-api-platform
  name: Invoke API Platform Agent
  description: Route to API Platform Agent for API management, gateway strategy, GraphQL federation, or API lifecycle governance
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: api_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: pa-api-platform-agent
- component_type: ClientTool
  id: invoke-infrastructure
  name: Invoke Infrastructure Agent
  description: Route to Infrastructure Agent for infrastructure abstraction, IaC templates, environment provisioning, or Crossplane
    design
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: infrastructure_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: pa-infrastructure-agent
- component_type: ClientTool
  id: invoke-governance
  name: Invoke Governance Agent
  description: Route to Governance Agent for platform governance, standards enforcement, compliance automation, or policy-as-code
    design
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: governance_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: pa-governance-agent
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks,
    decisions, stakeholders, competitive, governance, value, journey, opportunities, context, or frameworks.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map),
    industry (profile, regulatory, trends), market (news digest), technology (current map, vendor landscape).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: pa-specialist-agent-proactive
  name: Platform Architect Specialist (Proactive)
  description: 'Proactive mode: scans for platform engineering signals and surfaces insights without prompting'
  agent:
    $component_ref: pa-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan sources continuously for relevant signals.
      Surface insights before being asked. Prioritize timeliness over depth. Keep outputs concise and action-oriented. Flag
      anything that needs immediate attention. '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: pa-specialist-agent-analytical
  name: Platform Architect Specialist (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: pa-specialist-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Provide comprehensive analysis with full evidence trails.
      Synthesize across multiple data points. Prioritize accuracy and defensibility over speed. Include confidence levels
      and caveats where appropriate. '
    human_in_the_loop: true
flows: []
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - platform-strategy
    - developer-experience
    - container-runtime
    - api-platform
    - infrastructure-abstraction
    - platform-governance
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain
x-ea-agent:
  profile:
    human_matters_summary: 'Platform engineering is architecture; platform adoption is culture. The agent designs internal
      developer platforms, golden paths, and self-service abstractions, but the platform leader understands which teams will
      adopt, how much abstraction developers will tolerate before they route around it, and which organizational incentives
      drive platform usage. The architecture is correct, but the human leader makes it stick.

      '
    role_context: 'Internal developer platforms reduce cognitive load and accelerate delivery. The Platform Architect designs
      the platform layer that sits between infrastructure and application teams, providing golden paths, self-service capabilities,
      and governed abstractions that let developers ship without becoming infrastructure experts.

      '
    scenarios:
    - problem: Developer teams bypass the platform because golden paths are too rigid or too slow
      why: 'Platform teams build abstractions that optimize for consistency but ignore developer workflow friction. When golden
        paths require too many steps, enforce opinions developers disagree with, or lack escape hatches, teams find workarounds.
        Shadow infrastructure proliferates and the platform becomes shelfware.

        '
      agent: pa-specialist-agent
      agent_response: 'The agent assesses platform adoption metrics against developer workflow friction points, identifies
        where golden paths create bottlenecks, and recommends adjustments that balance consistency with developer autonomy.
        It produces a platform experience scorecard mapping each golden path to adoption rate, bypass frequency, and developer
        satisfaction.

        '
      success_signal:
        metric: Golden path adoption rate across development teams
        target: 80% of new services created through golden paths within 6 months of platform launch
        leading_indicator: Developer satisfaction survey scores for platform tooling improve quarter-over-quarter
        failure_signal: Shadow infrastructure instances increase after platform launch
    - problem: Platform team operates as a ticket queue instead of a product team
      why: 'Without platform-as-product thinking, platform teams become order-takers responding to individual requests rather
        than building reusable capabilities. Developer wait times grow, the platform roadmap is driven by the loudest team,
        and strategic platform investments never happen because the backlog is full of one-off requests.

        '
      agent: pa-specialist-agent
      agent_response: 'The agent designs a platform-as-product operating model with product management practices, user research
        cadence, and a capability roadmap driven by developer personas and usage data rather than ticket volume. It produces
        a transition plan from service-desk mode to product mode with clear milestones.

        '
      success_signal:
        metric: Platform team operating model maturity
        target: Platform team ships quarterly capability releases driven by usage data, not request tickets
        leading_indicator: Platform roadmap exists with prioritized capabilities and developer persona alignment
        failure_signal: Platform team backlog remains 90% individual team requests with no capability themes
    - problem: API sprawl creates integration chaos with no consistent standards
      why: 'Development teams publish APIs without consistent design standards, versioning policies, or lifecycle governance.
        Consumers discover APIs through tribal knowledge. Breaking changes ship without notice. The API landscape becomes
        a liability instead of an asset.

        '
      agent: pa-specialist-agent
      agent_response: 'The agent designs an API platform strategy covering design standards, lifecycle governance, discovery
        through a developer portal, and versioning policies. It maps the current API landscape, identifies inconsistencies,
        and produces a governance framework that enforces standards without blocking delivery velocity.

        '
      success_signal:
        metric: API standards compliance across published APIs
        target: 90% of new APIs pass automated design review before publication
        leading_indicator: API catalog populated with discoverable, documented APIs and ownership metadata
        failure_signal: Breaking API changes continue to reach consumers without deprecation notice
    - problem: Infrastructure provisioning takes days because every request is manual
      why: 'Development teams submit infrastructure requests through tickets or Slack messages. Platform engineers manually
        provision environments, configure access, and validate compliance. The bottleneck scales linearly with team count,
        and platform engineers spend their time on toil instead of building abstractions.

        '
      agent: pa-specialist-agent
      agent_response: 'The agent designs self-service infrastructure provisioning with IaC templates, environment blueprints,
        and guardrailed resource catalogs. It maps current provisioning workflows, identifies automation opportunities, and
        produces an infrastructure abstraction layer that lets developers provision compliant environments in minutes instead
        of days.

        '
      success_signal:
        metric: Environment provisioning lead time
        target: Self-service environment provisioning completes in under 15 minutes for standard configurations
        leading_indicator: IaC template catalog covers 80% of common infrastructure patterns
        failure_signal: Manual infrastructure tickets remain the primary provisioning channel after platform deployment
    - problem: Platform governance is either absent or so heavy that it blocks delivery
      why: 'Organizations either skip governance (leading to drift, security gaps, and compliance failures) or implement approval-heavy
        processes that slow delivery to a crawl. Finding the right balance between control and velocity requires governance
        that is automated, proportional, and invisible when things are compliant.

        '
      agent: pa-specialist-agent
      agent_response: 'The agent designs a policy-as-code governance framework with automated compliance checks, risk-proportional
        approval workflows, and continuous drift detection. It produces governance policies that enforce standards through
        automation rather than manual review, keeping compliant workloads on the fast path while flagging exceptions for human
        review.

        '
      success_signal:
        metric: Governance compliance rate with delivery velocity impact
        target: 95% of deployments pass automated governance checks with zero manual intervention
        leading_indicator: Policy-as-code coverage for top 10 compliance requirements
        failure_signal: Governance approval queue exceeds 48-hour average wait time
    challenges:
    - text: Developer teams bypass the platform because golden paths are too rigid or too slow
      specific_overhead:
      - Tracking shadow infrastructure and platform bypass patterns across teams
      solved_by: pa-developer-experience-agent
    - text: Platform team operates as a ticket queue instead of a product team
      specific_overhead:
      - Measuring platform adoption metrics and developer satisfaction across the organization
      solved_by: pa-strategy-agent
    - text: API sprawl creates integration chaos with no consistent standards
      specific_overhead:
      - Auditing API landscape for design consistency, versioning compliance, and documentation completeness
      solved_by: pa-api-platform-agent
    - text: Infrastructure provisioning takes days because every request is manual
      specific_overhead:
      - Maintaining IaC templates and environment blueprints across cloud providers and regions
      solved_by: pa-infrastructure-agent
    - text: Platform governance is either absent or so heavy that it blocks delivery
      specific_overhead:
      - Maintaining policy-as-code rules and validating compliance automation accuracy
      solved_by: pa-governance-agent
    - text: Kubernetes complexity overwhelms application teams who just want to deploy
      specific_overhead:
      - Abstracting Kubernetes primitives into developer-friendly deployment interfaces
      solved_by: pa-runtime-agent
    - text: Platform investments lack measurable business outcomes
      specific_overhead:
      - Correlating platform capabilities with developer productivity and delivery velocity metrics
      solved_by: pa-strategy-agent
    administrative_overhead:
    - Tracking shadow infrastructure and platform bypass patterns across teams
    - Measuring platform adoption metrics and developer satisfaction across the organization
    - Auditing API landscape for design consistency, versioning compliance, and documentation completeness
    - Maintaining IaC templates and environment blueprints across cloud providers and regions
    - Maintaining policy-as-code rules and validating compliance automation accuracy
    capabilities:
    - Internal developer platform architecture
    - Platform-as-product strategy
    - Developer portal and golden path design
    - Container orchestration and service mesh
    - API platform management
    - Infrastructure abstraction
    - Platform governance and compliance automation
    playbook_raci:
      context: 'The Platform Architect Specialist owns 10 domain-specific playbooks covering discovery, validation, design, and implementation within the platform engineering domain.
'
      accountable:
      - playbook: Runtime Platform Design (PB_PA_003)
        scope: Platform Practice Lead validates Kubernetes and runtime architecture recommendations
        team: specialists
      - playbook: Platform Governance (PB_PA_006)
        scope: Platform Practice Lead approves governance framework and policy-as-code designs
        team: specialists
      consulted:
      - playbook: ADR (PB_SA_001)
        scope: Platform architecture constraints and infrastructure abstraction requirements for architecture decisions
        team: solution_architects
        file: PB_SA_001_togaf_adm.yaml
      - playbook: Technical Discovery (PB_SA_014)
        scope: Platform maturity and developer experience landscape context for technical discovery
        team: solution_architects
        file: PB_SA_014_technical_discovery.yaml
      informed:
      - playbook: Customer Health (PB_CA_007)
        scope: Receives platform adoption health signals from customer base
        team: customer_architects
        file: PB_CA_007_customer_health_score.yaml
      - playbook: Feature Gap Analysis (PB_PM_001)
        scope: Receives product capability gaps identified in platform engineering domain
        team: product_managers
        file: PB_PM_001_feature_gap_analysis.yaml
    goals_summary: 'The Platform Architect Specialist succeeds when development teams ship faster through self-service platform
      capabilities, golden paths eliminate repetitive infrastructure decisions, and platform investments deliver measurable
      developer productivity improvements.

      '
    goals:
    - Achieve 80% golden path adoption for new service creation within 6 months of platform launch
    - Reduce environment provisioning lead time from days to under 15 minutes through self-service automation
    - Establish platform-as-product operating model with quarterly capability releases driven by usage data
    - Deliver developer portal (Backstage) with software catalog covering 100% of production services
    - Design API platform governance that achieves 90% automated design review compliance for new APIs
    - Reduce developer onboarding time by 60% through golden paths and self-service documentation
    - Implement policy-as-code coverage for top 10 compliance requirements with zero manual intervention
    - Produce platform maturity assessments with gap remediation roadmaps for every engagement
    - Design infrastructure abstraction layers that cover 80% of common provisioning patterns
    - Achieve 95% of deployments passing automated governance checks without manual approval
    - Build Kubernetes platform abstractions that hide cluster complexity from application teams
    - Establish platform adoption metrics dashboards with developer satisfaction tracking
    - Design service mesh architecture for inter-service communication with security and observability
    - Deliver API lifecycle governance covering design, versioning, deprecation, and retirement
    key_metrics:
    - name: Golden Path Adoption Rate
      definition: Percentage of new services created through platform golden paths versus manual or ad-hoc provisioning methods
    - name: Environment Provisioning Lead Time
      definition: Elapsed time from developer self-service request to fully provisioned, compliant environment ready for deployment
    - name: Developer Satisfaction Score
      definition: Quarterly survey score measuring developer experience with platform tooling, documentation, and self-service
        capabilities
    - name: API Standards Compliance Rate
      definition: Percentage of new and updated APIs that pass automated design review checks before publication
    - name: Platform Governance Automation Rate
      definition: Percentage of deployments that pass all compliance and governance checks through automated policy-as-code
        without manual intervention
    - name: Developer Onboarding Time
      definition: Elapsed time from new developer joining a team to first successful production deployment using platform
        golden paths
    - name: Self-Service Coverage
      definition: Percentage of common infrastructure and environment requests that developers can fulfill through self-service
        without filing tickets
    key_responsibilities:
    - 'Platform Strategy and Vision: define internal developer platform strategy aligned with team topologies and organizational
      delivery goals'
    - 'Platform-as-Product Operating Model: establish product management practices for platform teams including user research,
      roadmapping, and adoption metrics'
    - 'Developer Portal Architecture: design Backstage-based developer portals with software catalogs, golden path templates,
      and self-service workflows'
    - 'Golden Path Design: create opinionated but flexible service creation templates that encode organizational standards
      and best practices'
    - 'Self-Service Infrastructure: build developer self-service capabilities for environment provisioning, resource allocation,
      and access management'
    - 'Container Runtime Architecture: design Kubernetes platform architecture with appropriate abstraction layers for application
      team consumption'
    - 'Service Mesh Design: architect service mesh for inter-service communication with security policies, traffic management,
      and observability integration'
    - 'API Platform Architecture: design API management platforms covering gateway strategy, design standards, lifecycle governance,
      and developer portal integration'
    - 'API Lifecycle Governance: establish versioning policies, deprecation workflows, and breaking change management for
      API consumers'
    - 'Infrastructure Abstraction: design IaC template libraries and environment blueprints that abstract cloud provider complexity
      behind self-service interfaces'
    - 'Platform Governance Framework: implement policy-as-code governance with automated compliance checks and risk-proportional
      approval workflows'
    - 'Standards Enforcement: automate platform standards through CI/CD integration, admission controllers, and continuous
      drift detection'
    - 'Platform Maturity Assessment: evaluate current platform engineering maturity against industry benchmarks and produce
      gap remediation roadmaps'
    - 'Team Topology Analysis: assess team cognitive load and interaction modes to inform platform boundary decisions and
      capability prioritization'
    - 'Platform Adoption and Feedback: design developer onboarding experiences, champion programs, and feedback loops that
      drive platform adoption'
    - 'Cross-Cloud Platform Design: produce platform architectures that work across AWS, Azure, and GCP with consistent developer
      experience'
    stakeholder_landscape:
      customer_side:
      - role: 'Platform Engineering Team: primary consumers of platform architecture, golden path designs, and governance
          frameworks'
        connected_via: pa-specialist-agent
      - role: 'VP Engineering / CTO: sponsors platform investments, owns developer productivity targets, and approves platform
          strategy'
        connected_via: pa-specialist-agent
      - role: 'Application Development Teams: consume platform golden paths, self-service infrastructure, and developer portal
          capabilities'
        connected_via: pa-specialist-agent
      - role: 'Infrastructure/Cloud Team: operates underlying cloud infrastructure that the platform abstracts, manages IaC
          and cloud accounts'
        connected_via: pa-specialist-agent
      - role: 'Security and Compliance Team: defines compliance requirements that platform governance must enforce through
          policy-as-code'
        connected_via: pa-specialist-agent
      internal_team:
      - role: 'Solution Architect: coordinates technical design across domains, integrates platform architecture into broader
          solution design'
        connected_via: pa-specialist-agent
      - role: 'Field CTO: validates platform strategy against industry trends and customer portfolio patterns'
        connected_via: pa-specialist-agent
      - role: 'Account Executive: owns customer relationship, positions platform engineering value in commercial conversations'
        connected_via: pa-specialist-agent
      - role: 'DevOps Specialist: collaborates on CI/CD integration, deployment automation, and GitOps workflows that consume
          platform capabilities'
        connected_via: pa-specialist-agent
      - role: 'Security Specialist: collaborates on platform security policies, admission control, and supply chain security'
        connected_via: pa-specialist-agent
      - role: 'Observability Specialist: collaborates on platform observability, monitoring golden paths, and SLO integration'
        connected_via: pa-specialist-agent
    sub_agents:
    - name: Platform Strategy Agent
      id: pa-strategy-agent
      purpose: Platform strategy, team topologies, platform-as-product operating model, maturity assessment
    - name: Developer Experience Agent
      id: pa-developer-experience-agent
      purpose: Developer portals (Backstage), golden paths, self-service workflows, developer onboarding
    - name: Runtime Agent
      id: pa-runtime-agent
      purpose: Container orchestration, Kubernetes architecture, service mesh design, runtime platform evaluation
    - name: API Platform Agent
      id: pa-api-platform-agent
      purpose: API management, gateway strategy, GraphQL federation, API lifecycle governance
    - name: Infrastructure Agent
      id: pa-infrastructure-agent
      purpose: Infrastructure abstraction, IaC templates, environment provisioning, Crossplane design
    - name: Governance Agent
      id: pa-governance-agent
      purpose: Platform governance, standards enforcement, compliance automation, policy-as-code
    activity_map:
      purpose: The Platform Architect Specialist orchestrates 6 sub-agents to ensure customer organizations build internal
        developer platforms that reduce cognitive load, accelerate delivery, and maintain governance. Each sub-agent owns
        a distinct platform engineering domain, from strategy through governance.
      domains:
      - domain: Platform Strategy
        why: Platform investments without strategy become feature factories. Understanding team topologies, cognitive load,
          and platform-as-product principles ensures the platform serves organizational delivery goals rather than engineering
          preferences.
        activities:
        - Platform maturity assessment against industry benchmarks
        - Team topology analysis and cognitive load evaluation
        - Platform-as-product operating model design
        - Platform roadmap and capability prioritization
        cadence: engagement start, refreshed quarterly
      - domain: Developer Experience
        why: Platforms succeed or fail based on developer adoption. Golden paths, developer portals, and self-service capabilities
          determine whether the platform accelerates delivery or becomes another tool developers route around.
        activities:
        - Developer portal (Backstage) architecture and software catalog design
        - Golden path template creation for common service patterns
        - Self-service workflow design and developer onboarding
        - Developer satisfaction measurement and feedback loops
        cadence: per-engagement design phase, updated on adoption reviews
      - domain: Runtime Platform
        why: Container orchestration and service mesh form the runtime foundation. Architecture decisions at this layer affect
          every workload deployed on the platform, making correctness and appropriate abstraction critical.
        activities:
        - Kubernetes architecture design with multi-tenancy and namespace strategy
        - Service mesh evaluation and inter-service communication design
        - Platform abstraction layer design for application teams
        - Runtime platform security and resource management
        cadence: per-engagement design phase, updated on scaling events
      - domain: API Platform
        why: APIs are the contracts between teams. Without consistent design standards, lifecycle governance, and discoverability,
          API sprawl creates integration debt that compounds with every new service.
        activities:
        - API management platform architecture and gateway design
        - API design standards and automated review enforcement
        - GraphQL federation and API composition strategy
        - API lifecycle governance including versioning and deprecation
        cadence: per-engagement design phase, updated on API landscape changes
      - domain: Infrastructure Abstraction
        why: Manual infrastructure provisioning creates bottlenecks that scale linearly with team count. Infrastructure abstraction
          through IaC templates and self-service catalogs converts provisioning from a ticket queue to a vending machine.
        activities:
        - IaC template library design and environment blueprint creation
        - Self-service provisioning workflow with guardrails
        - Cross-cloud abstraction design (Crossplane, Terraform modules)
        - Environment lifecycle management and cleanup automation
        cadence: per-engagement design phase, updated on provisioning pattern changes
      - domain: Knowledge Management
        why: Platform engineering practices evolve rapidly. Maintaining current knowledge of tools, patterns, and team topology
          research ensures recommendations reflect proven approaches rather than outdated assumptions.
        activities:
        - Industry benchmark and best practice research
        - Reference architecture maintenance per platform pattern
        - Post-engagement retrospectives and pattern extraction
        - Knowledge contribution to InfoHub platform engineering domain
        cadence: continuous, formalized quarterly
    collaboration:
      defer_to:
        sa_agent:
          scope: Overall solution architecture decisions and cross-domain technical coordination
          scenarios:
          - trigger: Platform architecture must integrate with broader application or infrastructure architecture
            context_passed: Platform design, team topology analysis, integration requirements
            receiver_action: Integrate platform architecture into the overall solution design
        devops_specialist:
          scope: CI/CD pipeline design, deployment automation, and GitOps workflows
          scenarios:
          - trigger: Platform golden paths require CI/CD integration or deployment automation
            context_passed: Golden path specifications, deployment requirements, pipeline integration points
            receiver_action: Design CI/CD pipelines and GitOps workflows that consume platform capabilities
        security_specialist:
          scope: Platform security policies, supply chain security, and admission control requirements
          scenarios:
          - trigger: Platform governance requires security policy enforcement or supply chain verification
            context_passed: Governance framework, policy requirements, admission control specifications
            receiver_action: Define security policies, image signing requirements, and supply chain verification rules
        fcto_agent:
          scope: Strategic technology direction and cross-customer platform pattern validation
          scenarios:
          - trigger: Customer platform strategy involves non-standard architecture or emerging technology
            context_passed: Proposed architecture, risk assessment, industry reference points
            receiver_action: Validate approach against field experience and industry direction
      provide_to:
        sa_agent:
          scope: Platform architecture designs, team topology recommendations, and infrastructure abstraction plans
          scenarios:
          - trigger: Solution architecture requires platform engineering component design
            context_passed: Platform architecture, golden path designs, governance frameworks, infrastructure abstraction
              plans
            receiver_action: Incorporate platform design into the overall technical proposal
        ae_agent:
          scope: Platform engineering value positioning and technical readiness for commercial conversations
          scenarios:
          - trigger: Customer engagement requires platform engineering expertise in sales conversations
            context_passed: Platform maturity assessment summary, developer productivity ROI indicators, competitive differentiation
              points
            receiver_action: Position platform engineering value in commercial narrative and customer presentations
        ca_agent:
          scope: Platform adoption health signals and developer experience indicators
          scenarios:
          - trigger: Post-deployment platform adoption assessment completed
            context_passed: Golden path adoption rates, developer satisfaction scores, self-service utilization data
            receiver_action: Incorporate platform health into overall customer health scoring and renewal planning
        product_team:
          scope: Platform engineering product capability gaps identified during customer engagements
          scenarios:
          - trigger: Customer requirement exceeds current product capability
            context_passed: Gap description, customer use case, competitive alternative, impact assessment
            receiver_action: Evaluate for product roadmap prioritization
    public_resources:
