agentspec_version: 26.1.0
component_type: Agent
id: ci-agent
name: Competitive Intelligence Agent
description: 'Monitors customer conversations, market content, and CI databases for competitor mentions and competitive risks. Surfaces threats early, enriches the InfoHub with competitive context, and
  supports win/loss pattern analysis across accounts and market segments.

  '
metadata:
  definition_version: 0.1.0
  disclaimer: 'This agent specification is a reference design for educational and demonstration purposes. It is not a production system. All examples, case studies, and scenarios are fictional.

    '
  tags:
  - competitive-intelligence
  - signal-detection
  - battlecard
  - win-loss
  - sales
  responsibility: 'Detect competitor mentions, classify competitive threat levels with evidence, generate quick battlecards, analyze win/loss patterns, and keep the InfoHub competitive section current.

    '
system_prompt: "You are a Competitive Intelligence Agent. Your job is to keep competitive\nawareness integrated across accounts and market segments.\n\nYou MUST:\n- Detect competitor mentions in customer\
  \ conversations and market content\n- Surface competitive risks (evaluation, displacement, feature comparison)\n- Track competitive positioning across accounts\n- Enrich InfoHub with CI context\n- Classify\
  \ threat levels: HIGH (chose competitor, preferred vendor, displacing),\n  MEDIUM (evaluating, comparing, competitive POC), LOW (mentioned in passing)\n- Quote exact customer statements about competitors\n\
  - Distinguish between evaluation and decision\n\nYou MUST NOT:\n- Make claims about competitor capabilities without evidence\n- Provide canonical battle cards (human PM/CI team owns those)\n- Recommend\
  \ sales strategies (AE Agent's domain)\n- Invent competitive dynamics not evidenced in source content\n- Assume competitive positioning without explicit mention\n\nKnown direct competitors: LegacySIEM,\
  \ ObservabilityVendorA,\nObservabilityVendorB, ObservabilityVendorC, LegacySIEM3.\nIndirect signals: \"current vendor\", \"incumbent\", \"existing solution\".\n\nWhen uncertain: classify as potential\
  \ rather than confirmed, flag for\nhuman CI team review, use \"customer mentioned\" not \"customer chose\".\n\nOutput format: markdown with evidence-based structure. Use tables for\ncompetitor comparisons.\
  \ Bold key threat levels. Quote customer verbatim.\n"
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.5
    max_tokens: 4096
inputs:
- title: account_context
  type: object
  description: Account name, known competitors, communication history
- title: market_context
  type: object
  description: Market segment, competitor list, current positioning
  default: null
- title: signal_source
  type: string
  description: Content to scan for competitive signals (meeting notes, Slack, email, market feed)
- title: task_type
  type: string
  description: Which competitive intelligence task to perform
- title: personality
  type: string
  description: Personality variant to use
  default: default
- title: output_format
  type: string
  description: Response format
  default: markdown
outputs:
- title: intelligence
  type: object
  description: Competitive intelligence output (signals, threat assessment, battlecard, analysis)
- title: risk_alerts
  type: array
  description: Competitive risks with severity classification (HIGH/MEDIUM/LOW) and evidence
- title: recommendations
  type: array
  description: Recommended competitive responses or positioning adjustments
tools:
- component_type: ClientTool
  id: scan-content
  name: Scan Content
  description: Scan communications and market content for competitor mentions and signals
  requires_confirmation: false
  inputs:
  - title: content_source
    type: string
  - title: scan_type
    type: string
  outputs:
  - title: signals
    type: array
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: read-ci-database
  name: Read CI Database
  description: Access competitive intelligence database, battlecard repository, and win/loss data
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: ci_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: write-ci-insight
  name: Write CI Insight
  description: Save competitive insight or threat assessment to InfoHub competitive section
  requires_confirmation: true
  inputs:
  - title: insight
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: ci-agent-reactive
  name: CI Agent (Reactive)
  description: Real-time competitive signals detected in conversations, quick threat classification
  agent:
    $component_ref: ci-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on speed and immediate actionability. When a competitor is

      mentioned in a live conversation or recent communication, classify

      the threat level immediately and generate a quick battlecard.

      Prioritize the most urgent signals. Keep output concise, action-ready.

      Skip deep market analysis in favor of fast positioning guidance.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: ci-agent-strategic
  name: CI Agent (Strategic)
  description: Market trends, win/loss patterns, and analyst preparation
  agent:
    $component_ref: ci-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Analyze win/loss trends over

      time, identify emerging competitive threats, and prepare comprehensive

      market positioning analysis. Synthesize across multiple data points.

      Prioritize accuracy and defensibility over speed. Include sample

      size caveats and confidence levels in trend analysis.

      '
    human_in_the_loop: true
flows:
- component_type: Flow
  id: competitive-signal-detection
  name: Competitive Signal Detection
  description: Scan communications for competitor mentions, assess threat levels, and analyze competitive bake-offs.
  inputs:
  - title: account_context
    type: object
  - title: time_period
    type: string
  - title: opportunity_name
    type: string
  - title: competitor_list
    type: array
  outputs:
  - title: competitor_signals
    type: object
  - title: threat_assessment
    type: object
  - title: bake_off_analysis
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: ci-competitor-mention-scan
      input: account_context, time_period
      description: Scan communications for competitor mentions, context, sentiment, threat level
    - step: 2
      prompt: ci-threat-assessment
      input: opportunity_name, deal_value, deal_stage, competitor_list
      description: Assess competitive threat per competitor with position, strengths, win probability
    - step: 3
      prompt: ci-bake-off-analysis
      input: competitors, evaluation_criteria, timeline
      description: Analyze competitive evaluation with criteria matrix and win strategy
- component_type: Flow
  id: battlecard-preparation
  name: Battlecard Preparation
  description: Generate quick battlecards, handle competitive objections, and develop displacement strategies.
  inputs:
  - title: competitor_name
    type: string
  - title: account_context
    type: object
  - title: objection
    type: string
  - title: contract_status
    type: string
  outputs:
  - title: quick_battlecard
    type: object
  - title: objection_response
    type: object
  - title: displacement_strategy
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: ci-quick-battlecard
      input: account_context, competitor_name
      description: Generate quick battlecard with differentiators, claims vs responses, trap questions
    - step: 2
      prompt: ci-objection-handling
      input: objection, competitor_name
      description: Handle competitive objection with validity, full truth, response, redirect
    - step: 3
      prompt: ci-displacement-playbook
      input: competitor_name, contract_status, pain_points
      description: Develop displacement strategy with entry point, switching cost, messaging
- component_type: Flow
  id: win-loss-analysis
  name: Win/Loss Analysis
  description: Analyze competitive wins and losses to extract patterns, learnings, and replicable strategies.
  inputs:
  - title: deal_context
    type: object
  - title: deal_name
    type: string
  - title: competitors
    type: array
  - title: stated_reasons
    type: string
  outputs:
  - title: win_analysis
    type: object
  - title: loss_analysis
    type: object
  - title: competitive_trends
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: ci-win-analysis
      input: deal_name, competitors, deal_value
      description: Analyze win factors, competitive advantages, close calls, replicable elements
    - step: 2
      prompt: ci-loss-analysis
      input: deal_name, competitor, deal_value, stated_reasons
      description: Analyze loss factors (stated vs real), competitor advantages, gaps, learnings
    - step: 3
      prompt: ci-competitive-trends
      input: time_period, segment
      description: Identify win/loss trends, common factors, emerging competitive threats
- component_type: Flow
  id: market-intelligence
  name: Market Intelligence
  description: Analyze competitor news, update market positioning, and prepare for analyst interactions.
  inputs:
  - title: market_context
    type: object
  - title: competitor_name
    type: string
  - title: news_summary
    type: string
  - title: analyst_name
    type: string
  outputs:
  - title: news_analysis
    type: object
  - title: positioning_update
    type: object
  - title: analyst_prep
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: ci-competitor-news
      input: competitor_name, news_summary
      description: Analyze competitor news implications, opportunity/threat, field messaging
    - step: 2
      prompt: ci-market-positioning
      input: segment, competitor_list
      description: Update market positioning with evolution, competitor moves, differentiation
    - step: 3
      prompt: ci-analyst-prep
      input: analyst_name, topic, current_position
      description: Prepare for analyst interaction with key messages, proof points, anticipated Q&A
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - competitive-signal-detection
    - battlecard-preparation
    - win-loss-analysis
    - market-intelligence
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain
x-ea-agent:
  profile:
    role_context: 'Every enterprise deal involves competitors. Competitive intelligence is scattered across call recordings, emails, and market signals, making it hard to build a consistent picture. By
      the time a battlecard is compiled manually, the competitive landscape has already shifted.

      '
    scenarios:
    - problem: Competitor mention in a live deal goes unclassified
      why: 'A customer casually references evaluating a competitor during a call, but the signal gets buried in meeting notes. Without immediate classification, the deal team doesn''t know whether this
        is exploratory posturing or a serious threat requiring a different engagement strategy.

        '
      agent: ci-agent
      agent_response: 'The agent scans communications for competitor mentions, classifies the threat level as HIGH, MEDIUM, or LOW with evidence, and generates a quick battlecard with differentiators and
        trap questions. The deal team gets actionable competitive context before the next customer interaction.

        '
      success_signal:
        metric: Time from competitor mention to deal team awareness
        target: Competitive signals classified and surfaced within 4 hours of detection
        leading_indicator: Deal teams reference battlecard content in follow-up conversations
        failure_signal: Competitive threats are discovered only at deal review or after a loss
    - problem: Win/loss patterns are buried in anecdotal feedback
      why: 'Post-deal analysis lives in scattered CRM notes and call recordings. The team loses to the same competitor for the same reasons across multiple deals because nobody aggregates the patterns into
        actionable learnings that inform future positioning.

        '
      agent: ci-agent
      agent_response: 'The agent analyzes win/loss data across deals, identifies recurring competitive factors, and surfaces patterns by competitor, segment, and deal size. It distinguishes stated reasons
        from real factors and highlights replicable win elements and addressable loss patterns.

        '
      success_signal:
        metric: Win rate improvement against repeat competitors
        target: Reduce repeat-loss patterns by 30% over two quarters
        leading_indicator: Win/loss trend reports are referenced in deal strategy sessions
        failure_signal: Same competitor wins on the same differentiators in consecutive quarters
    - problem: Battlecards are outdated by the time they reach the sales team
      why: 'Competitive intelligence teams build battlecards from product launches, pricing changes, and analyst reports, but the update cycle is quarterly at best. By the time a battlecard reaches the
        field, the competitor has shipped new features or changed positioning, leaving reps armed with stale talking points in live deals.

        '
      agent: ci-agent
      agent_response: 'The agent monitors competitor product releases, pricing announcements, and analyst coverage in real time. It updates battlecard sections as new signals arrive and pushes change notifications
        to deal teams with active competitive exposure, ensuring the field always has current differentiators and objection handling material.

        '
      success_signal:
        metric: Battlecard currency
        target: All active battlecards updated within 48 hours of a material competitor change
        leading_indicator: Deal teams confirm battlecard relevance in post-meeting feedback
        failure_signal: Reps cite competitor features or pricing that has already changed
    - problem: Competitive positioning varies from rep to rep
      why: 'Without a single source of competitive messaging, each rep develops their own interpretation of how to position against competitors. The inconsistency confuses customers who talk to multiple
        team members and weakens the competitive narrative when it matters most.

        '
      agent: ci-agent
      agent_response: 'The agent maintains a canonical competitive positioning framework per competitor, including approved differentiators, trap questions, and landmine topics. It detects deviations when
        reps submit deal notes that contradict approved messaging and flags alignment gaps for enablement follow-up.

        '
      success_signal:
        metric: Competitive messaging consistency across deal teams
        target: At least 85% of deal strategies reference approved positioning for the primary competitor
        leading_indicator: New reps adopt standard competitive messaging within their first competitive deal
        failure_signal: Customer receives contradictory competitive claims from different team members
    - problem: Market moves aren't connected to active deal strategies
      why: 'A competitor acquires a company, launches a new product tier, or signs a strategic partnership. The news circulates in Slack but never reaches the deal teams who are actively competing against
        that vendor. The market move changes the competitive landscape, but deal strategies remain unchanged.

        '
      agent: ci-agent
      agent_response: 'The agent correlates market events with the active deal pipeline, identifying which deals face a changed competitive landscape. It generates deal-specific impact assessments that
        explain how the market move affects positioning, pricing, or feature comparisons for each affected opportunity.

        '
      success_signal:
        metric: Market event-to-deal strategy connection rate
        target: Impact assessments delivered to affected deal teams within 24 hours of a market event
        leading_indicator: Deal strategies are revised within one week of a relevant competitive market event
        failure_signal: Deal team learns about a competitive market move from the customer
    challenges:
    - text: Battlecards are outdated by the time they reach the sales team
      solved_by: ci-battlecard-agent
      specific_overhead:
      - Manually scanning competitor websites, press releases, and social feeds
    - text: Win/loss patterns are buried in anecdotal feedback
      solved_by: ci-win-loss-agent
      specific_overhead:
      - Updating battlecard spreadsheets after each competitive encounter
    - text: Competitive positioning varies from rep to rep
      solved_by: ci-battlecard-agent
      specific_overhead:
      - Compiling win/loss reports from CRM notes and call recordings
    - text: Market moves aren't connected to active deal strategies
      solved_by: ci-market-intel-agent
      specific_overhead:
      - Distributing competitive updates to the right deal teams
    - text: Competitor mention in a live deal goes unclassified
      solved_by: ci-signal-detection-agent
    - text: Competitive signals in call recordings never reach CI because no conversation intelligence integration exists
      solved_by: ci-signal-detection-agent
      source: REF_CI_BP_001
    - text: Signal taxonomy covers direct mentions but misses leading indicators like hiring surges, funding rounds, patent filings, and tech stack changes
      solved_by: ci-signal-detection-agent
      source: REF_CI_BP_001
    - text: Battlecard refresh is manual and on-demand, not triggered automatically when new competitive signals are detected
      solved_by: ci-battlecard-agent
      source: REF_CI_BP_001
    - text: CI outputs stay in InfoHub and never reach reps in their daily tools (Slack, CRM, enablement platforms)
      solved_by: ci-market-intel-agent
      source: REF_CI_BP_001
    - text: Market events are analyzed in isolation without correlating to the active deal pipeline to identify affected opportunities
      solved_by: ci-market-intel-agent
      source: REF_CI_BP_001
    - text: Win/loss analysis relies on internal seller perspective without third-party buyer interview data that reveals real decision drivers
      solved_by: ci-win-loss-agent
      source: REF_CI_BP_001
    administrative_overhead:
    - Manually scanning competitor websites, press releases, and social feeds
    - Updating battlecard spreadsheets after each competitive encounter
    - Compiling win/loss reports from CRM notes and call recordings
    - Distributing competitive updates to the right deal teams
    capabilities:
    - Competitive signal detection
    - Battlecard generation
    - Win/loss pattern analysis
    - Market intelligence monitoring
    human_matters_summary: 'Competitor mentions are signals, not threats. The agent detects mentions and classifies risk level, but the AE understands whether the competitor is serious, how to address concerns
      without defensiveness, and whether the conversation is a real risk or exploratory posturing. The threat is surfaced, but human sales judgment decides how to respond.

      '
    playbook_raci:
      context: >
        The CI Analyst owns 1 competitive intelligence playbook and contributes competitive
        context to playbooks led by other roles.
      responsible:
        - playbook: Five Forces Competitive Analysis (PB_CI_001)
          scope: Competitive landscape mapping, battlecard generation, displacement strategy
          team: competitive_intelligence
          file: PB_CI_001_five_forces.yaml
      accountable:
        - playbook: Five Forces Competitive Analysis (PB_CI_001)
          scope: CI Lead validates competitive analysis accuracy and battlecard content before distribution
          team: competitive_intelligence
      consulted:
        - playbook: Account Planning (PB_AE_002)
          scope: Competitive intelligence for account strategy and displacement planning
          team: account_executives
          file: PB_AE_002_account_planning.yaml
        - playbook: Opportunity Consult (PB_AE_004)
          scope: Competitive positioning and win/loss pattern intelligence for deal review
          team: account_executives
          file: PB_AE_004_opportunity_consult.yaml
        - playbook: Cross-Account Pattern Synthesis (PB_FCTO_001)
          scope: Competitive pattern validation across customer portfolio
          team: field_cto
          file: PB_FCTO_001_cross_account_pattern_synthesis.yaml
      informed:
        - playbook: Deal Retrospective (PB_AE_001)
          scope: Receives win/loss outcomes for competitive intelligence enrichment
          team: account_executives
        - playbook: Field Intelligence (PB_FCTO_004)
          scope: Receives field-observed competitive patterns and signals
          team: field_cto
    human_matters_goal: 'The agent detects competitive signals and surfaces patterns, but the CI analyst applies market intuition, validates ambiguous intelligence, and shapes the competitive narrative that wins deals.'
    role_tab_intro: 'A CI analyst tracks dozens of competitors across hundreds of active deals and market segments. Competitive signals arrive from call recordings, emails, news feeds, and analyst reports, but without real-time detection and pattern recognition, threats surface too late and battlecards go stale. The challenges below map to where competitive awareness breaks down, each addressed by a dedicated sub-agent.'
    goals_summary: 'The CI function succeeds when competitive threats are detected early, battlecards stay current, win/loss patterns drive strategy changes, and deal teams never learn about a competitor move from the customer.'
    goals:
    - Detect competitor mentions within 24 hours of appearance in customer communications
    - Classify competitive threat levels with evidence-backed severity within 4 hours of signal detection
    - Update battlecards within 48 hours of a material competitor product or pricing change
    - Achieve 85% deal team adoption of battlecard content in competitive deal strategies
    - Reduce repeat-loss patterns against the same competitor by 30% over two quarters
    - Surface win/loss trend reports referenced in at least 70% of deal strategy sessions
    - Correlate market events to affected active deals within 24 hours of event occurrence
    - Maintain a signal taxonomy that covers direct mentions, indirect references, and leading indicators
    - Deliver displacement strategies for every deal where a competitor is the incumbent vendor
    - Ensure competitive positioning consistency across at least 85% of deal teams
    - Prepare analyst interaction briefs at least 5 business days before scheduled engagements
    - Enrich InfoHub competitive section with verified intelligence after every significant competitive event
    - Track competitive win rate trends by competitor, segment, and deal size on a quarterly basis
    - Achieve zero instances of deal teams learning about competitive market moves from the customer
    key_metrics:
    - name: Threat Detection Latency
      definition: Hours between competitor signal appearance in communications and alert delivery to the deal team
    - name: Battlecard Currency Rate
      definition: Percentage of active battlecards updated within 48 hours of a material competitor change
    - name: Competitive Win Rate Delta
      definition: Change in win rate against specific competitors after CI intervention compared to baseline
    - name: Signal Coverage Ratio
      definition: Percentage of closed-lost deals where competitive signals were detected and classified before the loss decision
    - name: Win/Loss Pattern Adoption
      definition: Percentage of deal strategy sessions that reference win/loss trend data from CI analysis
    - name: Deal Team CI Utilization
      definition: Percentage of competitive deals where the deal team accessed battlecard or threat assessment content before customer interaction
    - name: Market Event Response Time
      definition: Hours between a competitor market event and delivery of deal-specific impact assessments to affected deal teams
    key_responsibilities:
    - 'Competitive Signal Scanning: monitor all customer-facing communications for competitor mentions, pricing signals, and displacement attempts'
    - 'Threat Level Classification: assess and classify competitive threats as HIGH, MEDIUM, or LOW with evidence citation and customer verbatim'
    - 'Quick Battlecard Generation: produce deal-specific competitive reference cards with differentiators, claims-vs-response tables, and trap questions'
    - 'Competitive Objection Handling: develop evidence-based responses to competitor-driven objections with validity assessment and redirect strategies'
    - 'Displacement Strategy Development: build entry-point strategies for deals where a competitor is the incumbent, including switching cost analysis and messaging'
    - 'Win Analysis: extract replicable success factors from competitive wins, identifying which differentiators and strategies drove the outcome'
    - 'Loss Analysis: distinguish stated loss reasons from real decision drivers, surfacing addressable gaps and competitor advantages'
    - 'Competitive Trend Identification: aggregate win/loss patterns by competitor, segment, and deal size to identify systemic strengths and weaknesses'
    - 'Competitor News Monitoring: analyze competitor product launches, acquisitions, pricing changes, and partnerships for field impact'
    - 'Market Positioning Updates: maintain current competitive positioning maps per market segment with evolution tracking'
    - 'Analyst Interaction Preparation: prepare key messages, proof points, and anticipated Q&A for analyst briefings and report responses'
    - 'Deal Pipeline Correlation: connect market events and competitive moves to active deal pipeline to identify affected opportunities'
    - 'InfoHub Competitive Enrichment: keep the InfoHub competitive section current with verified intelligence, threat assessments, and trend data'
    - 'Competitive Messaging Consistency: detect deviations from approved competitive positioning across deal teams and flag alignment gaps'
    - 'Signal Taxonomy Maintenance: expand detection coverage beyond direct mentions to include indirect references, hiring surges, funding rounds, and tech stack changes'
    - 'Cross-Competitor Pattern Synthesis: identify when multiple competitors are converging on similar strategies or targeting the same customer segments'
    stakeholder_landscape:
      external:
      - role: 'Customer Champions: internal advocates who share competitive context during deal conversations'
        connected_via: ci-signal-detection-agent
      - role: 'Partner Contacts: channel and technology partners who surface competitive dynamics in joint accounts'
        connected_via: ci-market-intel-agent
      - role: 'Industry Analysts (Gartner, Forrester): publish competitive landscape reports and vendor evaluations'
        connected_via: ci-market-intel-agent
      internal:
      - role: 'Account Executives: primary consumers of battlecards, threat assessments, and competitive positioning'
        connected_via: ci-battlecard-agent
      - role: 'Solution Architects: need technical competitive context for architecture discussions and POC evaluations'
        connected_via: ci-signal-detection-agent
      - role: 'Product Management: receive competitive feature gap analysis and market positioning feedback'
        connected_via: ci-market-intel-agent
      - role: 'Marketing: consume competitive messaging frameworks and market positioning for campaign alignment'
        connected_via: ci-battlecard-agent
      - role: 'Sales Leadership: receive competitive trend reports, win/loss patterns, and strategic threat escalations'
        connected_via: ci-win-loss-agent
    sub_agents:
    - name: CI Signal Detection Agent
      id: ci-signal-detection-agent
      purpose: Scan communications for competitor mentions, assess threat levels, analyze competitive bake-offs
    - name: CI Battlecard Agent
      id: ci-battlecard-agent
      purpose: Generate quick battlecards, handle competitive objections, develop displacement strategies
    - name: CI Win/Loss Agent
      id: ci-win-loss-agent
      purpose: Analyze competitive wins and losses, extract patterns, identify replicable strategies
    - name: CI Market Intelligence Agent
      id: ci-market-intel-agent
      purpose: Analyze competitor news, update market positioning, prepare for analyst interactions
    with_this_agent:
    - domain: Competitive Signal Detection and Threat Assessment
      agent: ci-signal-detection-agent
      items:
      - 'Signal Scanning: detect competitor mentions in calls, emails, and market content before they become deal surprises'
      - 'Threat Classification: classify every competitive signal with evidence-backed severity and customer verbatim'
      - 'Bake-off Analysis: map competitive evaluations with criteria matrices, win probability, and recommended strategy'
    - domain: Battlecard Generation and Competitive Positioning
      agent: ci-battlecard-agent
      items:
      - 'Quick Battlecards: generate deal-specific competitive reference cards with differentiators and trap questions'
      - 'Objection Handling: prepare evidence-based responses to competitor-driven objections with redirect strategies'
      - 'Displacement Playbooks: build entry-point strategies for displacing incumbent competitors with switching cost analysis'
    - domain: Win/Loss Pattern Analysis
      agent: ci-win-loss-agent
      items:
      - 'Win Analysis: extract replicable success factors and identify which competitive strategies drove the outcome'
      - 'Loss Analysis: distinguish stated reasons from real decision drivers and surface addressable gaps'
      - 'Trend Identification: aggregate patterns by competitor, segment, and deal size to reveal systemic strengths and weaknesses'
    - domain: Market Intelligence and Analyst Relations
      agent: ci-market-intel-agent
      items:
      - 'Competitor News: analyze product launches, acquisitions, and pricing changes for field team impact'
      - 'Market Positioning: maintain current positioning maps per segment with competitor evolution tracking'
      - 'Analyst Preparation: prepare key messages, proof points, and anticipated Q&A for analyst engagements'
    activity_map:
      purpose: 'The CI Agent exists to keep competitive awareness integrated across accounts and market segments. Everything the CI function does falls into one of four operational domains, each owned by a sub-agent that operates independently with its own tools, flows, boundaries, and prompt registry.'
      domains:
      - domain: Competitive Signal Detection and Threat Assessment
        why: 'Competitor mentions in customer conversations and market content need real-time detection and classification. Without immediate signal processing, competitive threats surface too late for the deal team to adjust strategy.'
        agent: ci-signal-detection-agent
        activities:
        - Scan communications for competitor mentions and context
        - Classify threat levels with evidence and customer verbatim
        - Analyze competitive bake-offs with criteria matrices
        - Track competitive signals across accounts and segments
        cadence: continuous, triggered by new communication content
      - domain: Battlecard Generation and Competitive Positioning
        why: 'Deal teams need current, deal-specific competitive content before every customer interaction. Stale battlecards and inconsistent positioning erode competitive advantage and confuse customers.'
        agent: ci-battlecard-agent
        activities:
        - Generate quick battlecards with differentiators and trap questions
        - Handle competitive objections with validity assessment
        - Develop displacement strategies for incumbent competitors
        - Maintain approved competitive messaging consistency
        cadence: on-demand per deal, triggered by competitive signal or rep request
      - domain: Win/Loss Pattern Analysis
        why: 'Post-deal analysis must aggregate into actionable patterns, not stay buried in individual CRM notes. Recurring losses to the same competitor for the same reasons indicate a systemic gap that only trend analysis can reveal.'
        agent: ci-win-loss-agent
        activities:
        - Analyze competitive wins for replicable success factors
        - Analyze losses for stated vs real decision drivers
        - Identify competitive trends by competitor, segment, and deal size
        - Surface addressable loss patterns for product and enablement teams
        cadence: per-deal on close, quarterly trend synthesis
      - domain: Market Intelligence and Analyst Relations
        why: 'Competitor market moves change the competitive landscape for active deals. Without connecting market events to the deal pipeline, deal strategies remain based on outdated competitive assumptions.'
        agent: ci-market-intel-agent
        activities:
        - Analyze competitor news for field team implications
        - Update market positioning per segment with evolution tracking
        - Prepare for analyst interactions with proof points and Q&A
        - Correlate market events to affected active deals
        cadence: continuous monitoring, analyst prep triggered by scheduled engagement
    collaboration:
      defer_to:
        ae_agent:
          scope: Customer relationship ownership, deal strategy, and commercial decisions
          scenarios:
          - trigger: Competitive threat classified and battlecard prepared
            context_passed: Threat assessment, battlecard content, displacement strategy
            receiver_action: Incorporate competitive context into deal strategy and customer engagement
        sa_agent:
          scope: Technical architecture validation and POC evaluation
          scenarios:
          - trigger: Competitive bake-off requires technical depth
            context_passed: Competitor technical capabilities, evaluation criteria matrix, feature comparison
            receiver_action: Technical competitive positioning, architecture differentiation in POC
        product_team:
          scope: Product roadmap and feature gap decisions
          scenarios:
          - trigger: Recurring competitive loss pattern traced to product capability gap
            context_passed: Loss pattern data, competitor feature advantage analysis, customer feedback
            receiver_action: Evaluate gap for roadmap prioritization
      provide_to:
        ae_agent:
          scope: Competitive intelligence for deal strategy
          scenarios:
          - trigger: Competitive signal detected or battlecard updated
            context_passed: Threat assessment, battlecard content, win/loss patterns relevant to active deal
            receiver_action: Adjust deal strategy with current competitive context
        fcto_agent:
          scope: Competitive patterns across customer portfolio
          scenarios:
          - trigger: Cross-account competitive trend identified
            context_passed: Competitor trend data, win/loss patterns by segment, market positioning shifts
            receiver_action: Validate competitive patterns against field observations
        marketing_team:
          scope: Competitive messaging and market positioning for campaigns
          scenarios:
          - trigger: Market positioning update or competitor messaging change detected
            context_passed: Updated positioning framework, competitor messaging analysis, differentiation points
            receiver_action: Align campaign messaging with current competitive positioning
        sales_leadership:
          scope: Competitive trend reports and strategic threat escalations
          scenarios:
          - trigger: Quarterly competitive trend synthesis or high-severity threat detected
            context_passed: Win/loss trend report, competitive market shifts, strategic threat assessment
            receiver_action: Inform territory strategy, resource allocation, and executive engagement
    public_resources:
    - title: Crayon State of Competitive Intelligence Report
      url: https://www.crayon.co/state-of-competitive-intelligence
      context: Annual benchmark covering CI program maturity, activation rates, and ROI measurement across B2B organizations
    - title: Klue Competitive Intelligence 101 Guide
      url: https://klue.com/blog/competitive-intelligence
      context: End-to-end CI methodology covering collection, analysis, battlecard creation, and distribution to revenue teams
    - title: SCIP Competitive Intelligence Foundational Tools and Practices
      url: https://www.scip.org/page/Competitive-Intelligence-Foundational-Tools-and-Practices
      context: Industry association resource library with CI methods, templates, ethics guidelines, and professional certification standards
    - title: Gartner Market Guide for Competitive and Market Intelligence Tools
      url: https://www.gartner.com/en/documents/5487795
      context: Analyst framework for evaluating CI tools covering data gathering, analysis automation, and enterprise-wide stakeholder enablement
    - title: Clozd Definitive Guide to Win-Loss Analysis
      url: https://www.clozd.com/resources/definitive-guide-to-win-loss-analysis
      context: Win/loss methodology covering buyer interview techniques, pattern extraction, stated vs real loss reasons, and program maturity models
    - title: Crayon Competitive Intelligence Process Guide
      url: https://www.crayon.co/blog/competitive-intelligence-process
      context: Six-step CI process framework covering signal gathering, analysis, battlecard creation, distribution, and continuous improvement
  fallback_model: null
  prompt_registry:
