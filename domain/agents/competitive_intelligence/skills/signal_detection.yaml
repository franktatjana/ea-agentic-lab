# SK_CI_001: Signal Detection
# Extracted from: competitive_intelligence/prompts/tasks.yaml signal_detection section

skill_id: "SK_CI_001"
name: "Competitive Signal Detection"
description: "Scan communications for competitor mentions, assess threat levels, and analyze competitive bake-offs"
version: 1
owner: "ci_agent"
category: "competitive_analysis"

workflow:
  - step: 1
    action: "Scan for competitor mentions: which competitors, context, sentiment, threat level"
    prompt_ref: "prompts/tasks.yaml#signal_detection.competitor_mention_scan"
    inputs: ["account_context", "time_period"]
    outputs: ["competitor_signals"]

  - step: 2
    action: "Assess competitive threat: position per competitor, strengths, our advantages, win probability"
    prompt_ref: "prompts/tasks.yaml#signal_detection.threat_assessment"
    inputs: ["opportunity_name", "deal_value", "deal_stage", "competitor_list"]
    outputs: ["threat_assessment"]

  - step: 3
    action: "Analyze competitive bake-off: evaluation criteria, scoring comparison, risk areas, win strategy"
    prompt_ref: "prompts/tasks.yaml#signal_detection.bake_off_analysis"
    inputs: ["competitors", "evaluation_criteria", "timeline"]
    outputs: ["bake_off_analysis"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, communication history"
  optional:
    - name: "time_period"
      type: "string"
      description: "Scan period for signal detection"
    - name: "opportunity_name"
      type: "string"
      description: "Specific opportunity for threat assessment"
    - name: "competitor_list"
      type: "array"
      description: "Known competitors in the opportunity"
    - name: "evaluation_criteria"
      type: "array"
      description: "Customer evaluation criteria for bake-off"

outputs:
  - name: "competitor_signals"
    type: "object"
    format: "yaml"
    description: "Competitors table with context, sentiment, threat level; key quotes; actions"
  - name: "threat_assessment"
    type: "object"
    format: "yaml"
    description: "Threat level, competitor analysis table, our advantages/vulnerabilities, win probability"
  - name: "bake_off_analysis"
    type: "object"
    format: "yaml"
    description: "Evaluation matrix, strong points, risk areas, competitor attacks, win strategy"

quality_criteria:
  - "All competitor names explicitly mentioned in source content"
  - "Threat levels justified by specific evidence"
  - "Win probability based on objective criteria"
  - "Key quotes attributed to specific source"

guardrails:
  - "Never assume competitive positioning without explicit mention"
  - "Quote exact customer statements about competitors"
  - "Distinguish between evaluation and decision"
  - "Classify as potential rather than confirmed when uncertain"

imports: []

tags: ["competitive", "signal-detection", "threat", "bake-off"]
