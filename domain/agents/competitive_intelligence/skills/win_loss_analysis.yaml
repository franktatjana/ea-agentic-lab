# SK_CI_003: Win/Loss Analysis
# Extracted from: competitive_intelligence/prompts/tasks.yaml win_loss section

skill_id: "SK_CI_003"
name: "Win/Loss Analysis"
description: "Analyze competitive wins and losses to extract patterns, learnings, and replicable strategies"
version: 1
owner: "ci_agent"
category: "competitive_analysis"

workflow:
  - step: 1
    action: "Analyze competitive win: deciding factors, what we did well, close calls, replicable elements"
    prompt_ref: "prompts/tasks.yaml#win_loss.win_analysis"
    inputs: ["deal_name", "competitors", "deal_value"]
    outputs: ["win_analysis"]

  - step: 2
    action: "Analyze competitive loss: real reasons vs stated, competitor advantages, gaps, learnings"
    prompt_ref: "prompts/tasks.yaml#win_loss.loss_analysis"
    inputs: ["deal_name", "competitor", "deal_value", "stated_reasons"]
    outputs: ["loss_analysis"]

  - step: 3
    action: "Identify competitive trends: win rate by competitor, common win/loss factors, emerging threats"
    prompt_ref: "prompts/tasks.yaml#win_loss.competitive_trends"
    inputs: ["time_period", "segment"]
    outputs: ["competitive_trends"]

inputs:
  required:
    - name: "deal_context"
      type: "object"
      description: "Deal name, value, competitors involved"
  optional:
    - name: "deal_name"
      type: "string"
      description: "Specific deal for win/loss analysis"
    - name: "competitors"
      type: "array"
      description: "Competitors involved in the deal"
    - name: "stated_reasons"
      type: "string"
      description: "Customer-stated reasons for loss"
    - name: "time_period"
      type: "string"
      description: "Period for trend analysis"
    - name: "segment"
      type: "string"
      description: "Market segment for trend analysis"

outputs:
  - name: "win_analysis"
    type: "object"
    format: "yaml"
    description: "Win factors ranked, competitive advantages, close calls, replicable playbook elements"
  - name: "loss_analysis"
    type: "object"
    format: "yaml"
    description: "Stated vs real reasons, competitor advantages, gaps, learnings, pattern identification"
  - name: "competitive_trends"
    type: "object"
    format: "yaml"
    description: "Win/loss by competitor, rate trends, top factors, emerging threats, recommendations"

quality_criteria:
  - "Win/loss factors traceable to specific deal events"
  - "Stated vs real reasons distinguished in loss analysis"
  - "Trends based on sufficient sample size"
  - "Replicable elements are actionable"

guardrails:
  - "Never fabricate win/loss reasons"
  - "Distinguish between correlation and causation in trends"
  - "Note sample size limitations in trend analysis"
  - "Flag when loss reasons may be face-saving rather than genuine"

imports: []

tags: ["competitive", "win-loss", "analysis", "trends", "patterns"]
