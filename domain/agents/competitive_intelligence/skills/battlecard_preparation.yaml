# SK_CI_002: Battlecard Preparation
# Extracted from: competitive_intelligence/prompts/tasks.yaml battlecard section

skill_id: "SK_CI_002"
name: "Battlecard Preparation"
description: "Generate quick battlecards, handle competitive objections, and develop displacement strategies"
version: 1
owner: "ci_agent"
category: "competitive_analysis"

workflow:
  - step: 1
    action: "Generate quick battlecard: top differentiators, competitor claims vs our responses, trap questions"
    prompt_ref: "prompts/tasks.yaml#battlecard.quick_battlecard"
    inputs: ["account_context", "competitor_name"]
    outputs: ["quick_battlecard"]

  - step: 2
    action: "Handle competitive objection: validity assessment, full truth, recommended response, redirect"
    prompt_ref: "prompts/tasks.yaml#battlecard.objection_handling"
    inputs: ["objection", "competitor_name"]
    outputs: ["objection_response"]

  - step: 3
    action: "Develop displacement strategy: incumbent pain points, entry point, switching cost, messaging"
    prompt_ref: "prompts/tasks.yaml#battlecard.displacement_playbook"
    inputs: ["competitor_name", "contract_status", "pain_points"]
    outputs: ["displacement_strategy"]

inputs:
  required:
    - name: "competitor_name"
      type: "string"
      description: "Target competitor for battlecard preparation"
  optional:
    - name: "account_context"
      type: "object"
      description: "Account-specific context for tailored battlecard"
    - name: "objection"
      type: "string"
      description: "Specific competitive objection to address"
    - name: "contract_status"
      type: "string"
      description: "Incumbent contract status for displacement planning"
    - name: "pain_points"
      type: "array"
      description: "Known pain points with incumbent"

outputs:
  - name: "quick_battlecard"
    type: "object"
    format: "yaml"
    description: "3 differentiators, claims vs response table, trap questions, proof points"
  - name: "objection_response"
    type: "object"
    format: "yaml"
    description: "Validity assessment, full truth, recommended response, redirect question, proof point"
  - name: "displacement_strategy"
    type: "object"
    format: "yaml"
    description: "Incumbent analysis, entry strategy, switching cost mitigation, timeline, stakeholder messaging"

quality_criteria:
  - "Differentiators are factual and defensible"
  - "Objection validity honestly assessed"
  - "Displacement timeline is realistic"
  - "All claims supported by evidence"

guardrails:
  - "Never make claims about competitor capabilities without evidence"
  - "Acknowledge valid competitor strengths honestly"
  - "Battlecards supplement, not replace, canonical PM/CI team versions"
  - "Flag for human CI team review when information is uncertain"

imports: []

tags: ["competitive", "battlecard", "objection", "displacement"]
