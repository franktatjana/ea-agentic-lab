# SK_CI_004: Market Intelligence
# Extracted from: competitive_intelligence/prompts/tasks.yaml market_intel section

skill_id: "SK_CI_004"
name: "Market Intelligence"
description: "Analyze competitor news, update market positioning, and prepare for analyst interactions"
version: 1
owner: "ci_agent"
category: "competitive_analysis"

workflow:
  - step: 1
    action: "Analyze competitor news: implications, opportunity/threat, field messaging, recommended actions"
    prompt_ref: "prompts/tasks.yaml#market_intel.competitor_news"
    inputs: ["competitor_name", "news_summary"]
    outputs: ["news_analysis"]

  - step: 2
    action: "Update market positioning: market evolution, competitor positioning, our differentiation, messaging"
    prompt_ref: "prompts/tasks.yaml#market_intel.market_positioning"
    inputs: ["segment", "competitor_list"]
    outputs: ["positioning_update"]

  - step: 3
    action: "Prepare for analyst interaction: likely perspective, key messages, proof points, anticipated Q&A"
    prompt_ref: "prompts/tasks.yaml#market_intel.analyst_prep"
    inputs: ["analyst_name", "topic", "current_position"]
    outputs: ["analyst_prep"]

inputs:
  required:
    - name: "market_context"
      type: "object"
      description: "Market segment, key competitors, current positioning"
  optional:
    - name: "competitor_name"
      type: "string"
      description: "Specific competitor for news analysis"
    - name: "news_summary"
      type: "string"
      description: "Recent competitor news to analyze"
    - name: "segment"
      type: "string"
      description: "Market segment for positioning update"
    - name: "analyst_name"
      type: "string"
      description: "Analyst name for interaction preparation"
    - name: "topic"
      type: "string"
      description: "Analyst report or briefing topic"

outputs:
  - name: "news_analysis"
    type: "object"
    format: "yaml"
    description: "News summary, competitor impact, our opportunity/threat, field messaging, actions"
  - name: "positioning_update"
    type: "object"
    format: "yaml"
    description: "Market evolution, competitor positioning table, differentiation points, messaging"
  - name: "analyst_prep"
    type: "object"
    format: "yaml"
    description: "Analyst perspective, key messages, proof points, anticipated Q&A, competitor comparisons"

quality_criteria:
  - "News analysis based on verifiable sources"
  - "Positioning claims supported by market evidence"
  - "Analyst preparation anticipates likely questions"
  - "Field messaging is actionable and concise"

guardrails:
  - "Never speculate on competitor strategy without evidence"
  - "Distinguish between public facts and market rumor"
  - "Analyst preparation reflects honest positioning"
  - "Flag information that needs verification before external use"

imports: []

tags: ["competitive", "market", "intelligence", "positioning", "analyst"]
