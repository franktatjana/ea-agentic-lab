# CI Competitor Analysis Framework - Domain Knowledge
# Structures for battlecards, win/loss analysis, and market positioning

battlecard_structure:
  overview:
    - "Company background and positioning"
    - "Target market and ICP"
    - "Funding and growth trajectory"

  product_comparison:
    - "Core capabilities (what they do well)"
    - "Known limitations (where we win)"
    - "Feature gaps (our differentiators)"
    - "Integration ecosystem"

  commercial:
    - "Pricing model and typical deal size"
    - "Discount patterns and negotiation tactics"
    - "Common procurement objections"

  positioning:
    - "Their messaging and value props"
    - "Our counter-positioning"
    - "Proof points and customer references"

win_loss_factors:
  common_win_reasons:
    - "Superior technical capabilities"
    - "Better integration ecosystem"
    - "Stronger customer references"
    - "More favorable pricing/packaging"
    - "Executive relationship strength"

  common_loss_reasons:
    - "Incumbent advantage"
    - "Price undercutting"
    - "Feature-specific requirement gap"
    - "Relationship with decision maker"
    - "Faster time to value promised"

  analysis_dimensions:
    - "Deal stage when competitor entered"
    - "Decision maker persona"
    - "Primary evaluation criteria"
    - "Competitor strengths cited by customer"
    - "Our weaknesses cited by customer"

market_positioning:
  analyst_dimensions:
    - "Gartner Magic Quadrant position"
    - "Forrester Wave rating"
    - "G2/Peer Insights sentiment"

  segment_tracking:
    - "Enterprise (>10K employees)"
    - "Mid-market (1K-10K employees)"
    - "SMB (<1K employees)"
