# CI Threat Classification - Domain Knowledge
# Competitive threat severity definitions and response criteria

threat_severity:
  HIGH:
    - "Customer actively evaluating competitor for displacement"
    - "Competitor selected as preferred vendor in active deal"
    - "Customer running competitive POC alongside our solution"
    - "Competitor undercutting on pricing in strategic account"
    - "Key account champion advocating for competitor"

  MEDIUM:
    - "Competitor mentioned in discovery or requirements gathering"
    - "Customer requesting feature comparison with competitor"
    - "Competitor expanding into adjacent use cases at account"
    - "Market analyst report ranking competitor higher"

  LOW:
    - "Passing reference to competitor in conversation"
    - "Customer aware of competitor but not evaluating"
    - "Industry event where competitor presented"

response_criteria:
  immediate:
    - "HIGH severity threat in strategic account"
    - "Competitor displacement attempt in top-20 account"
    - "Loss of key deal to named competitor"

  within_48h:
    - "MEDIUM threat in active pipeline deal"
    - "New competitor entering our core market segment"
    - "Competitive win pattern emerging across accounts"

  weekly_review:
    - "LOW severity signals across portfolio"
    - "Market positioning shifts"
    - "Competitor hiring or product roadmap signals"
