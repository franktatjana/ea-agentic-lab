reference_id: REF_CI_BP_001
name: CI Industry Best Practices
description: >
  Industry best practices for AI-assisted Competitive Intelligence operations,
  sourced from CI platforms, analyst firms, methodology bodies, and enablement vendors.
  Used to validate CI agent capabilities against market expectations.
version: 1.0.0
last_audited: 2026-03-21
audit_cadence: quarterly

sources:
  ci_platforms:
    - name: Klue
      findings:
        - title: Deal-Triggered Competitive Briefings (Deal Tips)
          relevance: Push-based CI delivers intel to reps automatically when competitors detected in CRM or call transcripts, 28% win rate increase reported
          gap: CI agent is reactive (invoked by orchestrator), no CRM-trigger auto-push delivery to seller channels (Slack, email)
          priority: high
        - title: Conversation Intelligence Integration for Signal Detection
          relevance: Most competitive signals surface in live conversations, not written notes. Call monitoring catches signals that never reach CRM
          gap: scan-content tool accepts meeting notes, Slack, email but no call recording or conversation intelligence platform (Gong/Chorus) integration
          priority: high

    - name: Crayon
      findings:
        - title: Automated Competitor Digital Footprint Tracking (100+ Data Types)
          relevance: Teams enabling sales daily with CI saw 84% increase in competitive sales effectiveness (Crayon 2025 State of CI)
          gap: Signal taxonomy limited to direct/indirect mentions and four market signal types. Missing job postings, SEC filings, patent applications, hiring velocity, G2/review site monitoring, website change detection
          priority: high
        - title: Cross-Source Signal Synthesis
          relevance: Raw signal volume is overwhelming without synthesis. Value is in connecting signals across sources to identify patterns
          gap: CI agent processes signals per-source but lacks cross-source synthesis capability producing unified competitive picture with prioritized insights
          priority: medium
        - title: Conversational Competitive Q&A
          relevance: Reduces time-to-answer from minutes (find battlecard) to seconds (ask question). Meets reps in their workflow
          gap: CI agent has structured prompts but no free-form conversational Q&A interface for reps
          priority: medium

    - name: Kompyte (Semrush)
      findings:
        - title: AI-Powered Automatic Battlecard Updating
          relevance: Battlecard staleness is top CI problem. Automatic updates tied to signal detection solve the "outdated by the time it reaches field" challenge
          gap: Quick battlecards generated on demand, but no automated refresh mechanism connecting signal detection outputs to battlecard update triggers
          priority: high
        - title: Bi-Directional CRM Sync
          relevance: Without CRM integration, CI exists in a separate silo. Bi-directional sync ensures competitive context available where deals are managed
          gap: CI agent writes to InfoHub but has no CRM read/write integration tool (Salesforce/HubSpot)
          priority: high

  analyst_firms:
    - name: Gartner
      findings:
        - title: 75% of B2B Orgs Augmenting Playbooks with AI-Guided Selling by 2025
          relevance: Industry moving from content repository CI to real-time guided selling CI. Static battlecards are baseline, guided next-best-action is differentiator
          gap: CI agent provides content (battlecards, assessments) but does not guide seller behavior with stage-aware next-best-action recommendations
          priority: medium
        - title: 75% of B2B Buyers Prefer Human Interaction by 2030
          relevance: Validates human-in-the-loop design, agent augments not replaces customer-facing interactions
          gap: none
          status: already_aligned
          note: human_in_the_loop is true, human_matters_summary explicitly states human judgment decides response

    - name: Forrester
      findings:
        - title: M&CI Platforms Must Auto-Populate Deliverables, Not Just Source Data
          relevance: Gap between having intelligence and having a ready-to-use deliverable is where most CI programs lose adoption
          gap: Artifact generation is prompt-driven, not auto-populated from accumulated signals without explicit invocation
          priority: medium
        - title: Scale CI Delivery Into Daily Sales Workflows
          relevance: CI adoption depends on delivery channel. Intelligence must arrive in tools reps already use (Slack, CRM, email)
          gap: No delivery channel tools defined. Outputs are markdown artifacts stored in InfoHub. No Slack, email, or CRM field update integration
          priority: high

  methodology:
    - name: SCIP (Strategic Consortium of Intelligence Professionals)
      findings:
        - title: Four-Phase CI Lifecycle (Collection, Analysis, Dissemination, Governance)
          relevance: Professional CI treats dissemination and governance as first-class concerns. Most AI CI implementations over-index on analysis
          gap: Collection and analysis well covered. Dissemination weak (no delivery channel tools). Governance partial (guardrails exist but no source provenance, intelligence aging/expiration, or confidence scoring)
          priority: medium
        - title: AI Governance in Competitive Intelligence
          relevance: AI-generated competitive claims can be confidently wrong. Without governance, bad intelligence spreads faster than good
          gap: Guardrails exist (no claims without evidence). Missing explicit confidence scoring, source provenance metadata, intelligence freshness/expiration dates
          priority: medium

  win_loss_specialists:
    - name: Clozd
      findings:
        - title: Third-Party Buyer Interview Integration for Win/Loss
          relevance: 63% of companies report win rate increases from buyer interviews, jumping to 84% for mature programs (2+ years)
          gap: Win/loss analysis entirely internal-data-driven. No capability to process or integrate external buyer interview transcripts with decision driver extraction
          priority: medium
        - title: Standardized Decision Driver Taxonomy
          relevance: Without consistent taxonomy, win/loss patterns hard to aggregate. Same factor described differently across deals becomes invisible as trend
          gap: win_loss_factors uses free-text categories, not a structured taxonomy with controlled vocabulary enabling reliable cross-deal aggregation
          priority: medium

  enablement_platforms:
    - name: Highspot / Seismic / Showpad
      findings:
        - title: Sales Enablement Platform Integration for Battlecard Delivery
          relevance: Top-quartile teams show 72% battlecard adoption vs 34% when delivered outside workflow. Integration depth explains the adoption gap
          gap: Battlecards generated as markdown in InfoHub. No mechanism to push or sync content to enablement platforms where reps actually consume content
          priority: high

  signal_detection:
    - name: Signal Labs / Momentum.io
      findings:
        - title: 20+ Signal Types Beyond Competitor Mentions
          relevance: Hiring surges predict product direction months before announcements. Leading indicators more valuable than lagging mentions
          gap: Signal taxonomy limited to direct mentions and four market signal categories. Missing hiring signals, funding events, tech stack changes, executive movements, patent filings, regulatory actions
          priority: high
        - title: Workflow Automation from Signal to Action
          relevance: Gap between detecting a signal and taking action is where most intelligence dies. Automated orchestration closes this gap
          gap: Escalation triggers defined but no automated workflow connects HIGH threat detection to CRM task creation, Slack alert, or deal score update
          priority: high

  emerging_patterns:
    - name: Real-Time Pipeline-Signal Correlation
      findings:
        - title: Market Event to Active Pipeline Impact Assessment
          relevance: 68% of B2B deals involve at least one competitor. Correlating market events with specific affected deals enables proactive response
          gap: Scenario #5 describes this capability but no flow or tool connects market intelligence outputs to pipeline data. Correlation is aspirational, not operationalized
          priority: high

    - name: Cadenced Win/Loss Review
      findings:
        - title: Aggregate Win/Loss Analysis Tied to Sales Rhythm
          relevance: Deal-triggered analysis misses aggregate patterns that inform pipeline strategy. Weekly/monthly cadences needed
          gap: Win/loss analysis is deal-triggered only. No cadenced aggregate analysis linked to pipeline review or forecast lock dates
          priority: medium

    - name: Competitive Revenue Impact Tracking
      findings:
        - title: CI Adoption and Revenue Attribution Metrics
          relevance: CI value should be measured in revenue impact. Adoption metrics (battlecard view rates, usage in deals) matter more than content quality
          gap: Success signals defined per scenario but no mechanism to track adoption metrics or revenue attribution to CI-informed deals
          priority: medium

gap_summary:
  high:
    - Deal-triggered auto-push delivery to seller channels (Klue Deal Tips pattern)
    - Conversation intelligence integration for call transcript scanning (Gong/Chorus)
    - Expanded signal taxonomy beyond mentions (hiring, funding, patents, tech stack, reviews)
    - Automated battlecard refresh tied to signal detection triggers (Kompyte)
    - CRM bi-directional integration tools (Salesforce/HubSpot read/write)
    - Sales enablement platform delivery integration (Highspot/Seismic)
    - CI delivery channel tools (Slack, email, CRM field updates) (Forrester)
    - Workflow automation connecting signal detection to action routing (Momentum.io)
    - Market-event-to-pipeline correlation operationalized in flows (currently aspirational)

  medium:
    - Cross-source signal synthesis for unified competitive picture (Crayon)
    - Conversational competitive Q&A interface for reps (Crayon Answers)
    - Stage-aware next-best-action competitive guidance (Gartner guided selling)
    - Confidence scoring and intelligence freshness tracking (SCIP governance)
    - Third-party buyer interview integration for win/loss (Clozd)
    - Standardized Decision Driver taxonomy for cross-deal aggregation (Clozd)
    - Cadenced aggregate win/loss analysis tied to sales rhythm
    - CI adoption and revenue attribution metrics tracking
    - Auto-populated deliverables from accumulated signals (Forrester)
    - Source provenance metadata on competitive claims (SCIP)

  low:
    - Predictive competitor move forecasting and scenario simulation (Crayon roadmap)
    - Automated competitive scoring and benchmarking with trend tracking
