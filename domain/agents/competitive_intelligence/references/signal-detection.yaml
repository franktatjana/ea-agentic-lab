# CI Signal Detection - Domain Knowledge
# Competitive signal keywords, risk levels, and detection patterns

competitor_mentions:
  direct:
    - "LegacySIEM"
    - "ObservabilityVendorA"
    - "ObservabilityVendorB"
    - "ObservabilityVendorC"
    - "LegacySIEM3"

  indirect:
    - "current vendor"
    - "incumbent"
    - "existing solution"
    - "alternative provider"
    - "other platform"

competitive_risks:
  high:
    - "chose competitor"
    - "preferred vendor"
    - "displacing {vendor}"
    - "switching to"
    - "selected alternative"

  medium:
    - "evaluating alternatives"
    - "comparing with"
    - "competitive POC"
    - "running benchmarks against"
    - "shortlisted competitors"

  low:
    - "asked about competitor"
    - "mentioned in passing"
    - "heard about"
    - "aware of alternative"

market_signals:
  product_launches: ["new release", "GA announcement", "product update", "feature parity"]
  pricing_moves: ["price reduction", "new tier", "free tier", "bundle offer"]
  partnerships: ["integration with", "partnership announced", "acquired by", "merged with"]
  customer_wins: ["case study published", "reference customer", "logo added", "expansion announced"]
