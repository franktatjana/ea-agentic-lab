# Co-sell Qualification Criteria - Domain Knowledge
# Referenced by: ham-cosell-qualification-definition.yaml
# Sources: AWS ACE documentation, Microsoft Partner Center co-sell requirements, industry co-sell playbooks
# Last verified: 2026-03

qualification_gates:
  universal:
    description: "Criteria that apply regardless of hyperscaler"
    required:
      - gate: "Active hyperscaler presence"
        check: "Customer has existing cloud spend or committed budget with at least one hyperscaler"
      - gate: "Deal value threshold"
        check: "Opportunity meets minimum deal value for co-sell program eligibility"
      - gate: "Solution alignment"
        check: "ISV solution maps to a hyperscaler priority sales play or solution area"
      - gate: "Marketplace readiness"
        check: "Transactable listing exists in the relevant marketplace"
      - gate: "Timeline alignment"
        check: "Customer decision timeline aligns with co-sell engagement cycle (typically 30-90 days)"

  aws_ace:
    system: "ACE Pipeline Manager"
    eligibility:
      - "ISV Accelerate membership active"
      - "Opportunity involves AWS services consumption"
      - "Deal value meets ACE qualification threshold"
      - "Customer has AWS account with active workloads or migration plan"
    required_fields:
      - "Customer AWS Account ID"
      - "Expected monthly AWS consumption"
      - "Primary AWS services involved"
      - "Opportunity close date"
      - "ISV solution name and marketplace listing URL"
    co_sell_flags:
      - "AWS field team engagement requested"
      - "Technical validation needed"
      - "Executive sponsorship requested"
      - "EDP draw-down applicable"
    disqualifiers:
      - "No AWS account or commitment to AWS"
      - "Solution not listed on AWS Marketplace"
      - "Deal already closed without AWS involvement"
      - "Customer on AWS competitor's exclusive commitment"

  azure_partner_center:
    system: "Partner Center Referrals"
    eligibility:
      - "Co-sell Ready status in Partner Center"
      - "Solution mapped to Microsoft priority solution area"
      - "Deal involves Azure consumption or Microsoft 365 integration"
      - "Minimum $25K deal value for incentive eligibility"
    required_fields:
      - "Customer organization name and Azure tenant ID"
      - "Deal value and expected close date"
      - "Solution area (Azure, Business Applications, Modern Work, Security)"
      - "Type of help needed (joint selling, technical deployment, ISV connect)"
      - "Customer Azure consumption estimate"
    co_sell_flags:
      - "Azure IP Co-sell Eligible (required for MACC draw-down)"
      - "Incentive-eligible deal (minimum $25K)"
      - "Microsoft field engagement requested"
      - "MACC-applicable transaction"
    disqualifiers:
      - "Solution not published in commercial marketplace"
      - "No Azure consumption component"
      - "Co-sell Ready status not achieved"
      - "Customer has no MACC or Azure commitment"

  gcp_partner_advantage:
    system: "Partner Advantage Portal"
    eligibility:
      - "Active Partner Advantage enrollment"
      - "Solution involves Google Cloud services"
      - "Customer has GCP billing account"
    required_fields:
      - "Customer organization and GCP billing account"
      - "Google Cloud products involved"
      - "Expected deal value and timeline"
      - "Partner engagement type"
    co_sell_flags:
      - "Google Cloud field engagement requested"
      - "Customer credit program applicable"
      - "CUD draw-down potential"
    disqualifiers:
      - "No GCP presence or plans"
      - "Solution not listed on GCP Marketplace"

readiness_scoring:
  methodology: "Weighted scoring across five dimensions"
  dimensions:
    - name: "Hyperscaler Relationship"
      weight: 25
      scoring:
        HIGH:
          criteria: "Active hyperscaler account team engaged, existing partner relationship at account"
          score_range: "20-25"
        MEDIUM:
          criteria: "Hyperscaler presence confirmed, no active engagement yet"
          score_range: "10-19"
        LOW:
          criteria: "Uncertain hyperscaler involvement, no relationship at account"
          score_range: "0-9"

    - name: "Committed Spend Applicability"
      weight: 25
      scoring:
        HIGH:
          criteria: "Customer has active EDP/MACC/CUD with uncommitted balance, solution is draw-down eligible"
          score_range: "20-25"
        MEDIUM:
          criteria: "Customer has committed spend but eligibility for draw-down unclear or partially met"
          score_range: "10-19"
        LOW:
          criteria: "No committed spend program or solution not eligible for draw-down"
          score_range: "0-9"

    - name: "Marketplace Readiness"
      weight: 20
      scoring:
        HIGH:
          criteria: "Active transactable listing, pricing validated, private offer capability ready"
          score_range: "16-20"
        MEDIUM:
          criteria: "Listing exists but needs pricing update, SKU alignment, or private offer setup"
          score_range: "8-15"
        LOW:
          criteria: "No marketplace listing or listing not transactable"
          score_range: "0-7"

    - name: "Deal Value & Timeline"
      weight: 15
      scoring:
        HIGH:
          criteria: "Meets minimum deal value, close date within 90 days, decision process mapped"
          score_range: "12-15"
        MEDIUM:
          criteria: "Meets deal value but timeline uncertain or >90 days"
          score_range: "6-11"
        LOW:
          criteria: "Below minimum deal value or no defined timeline"
          score_range: "0-5"

    - name: "Solution Alignment"
      weight: 15
      scoring:
        HIGH:
          criteria: "Solution maps to hyperscaler priority sales play, use case validated"
          score_range: "12-15"
        MEDIUM:
          criteria: "General alignment with hyperscaler priorities, specific play not confirmed"
          score_range: "6-11"
        LOW:
          criteria: "No clear alignment with hyperscaler sales priorities"
          score_range: "0-5"

  overall_classification:
    HIGH:
      score_range: "75-100"
      action: "Proceed with co-sell registration, engage hyperscaler field team immediately"
    MEDIUM:
      score_range: "45-74"
      action: "Address gaps before registration, prepare materials, target registration within 2 weeks"
    LOW:
      score_range: "0-44"
      action: "Defer co-sell, focus on direct deal or resolve prerequisites first"

  confidence_metadata:
    requirement: "Every readiness score must include confidence level"
    levels:
      VERIFIED: "Score based on confirmed data from CRM, partner portal, or customer confirmation"
      ESTIMATED: "Score based on available signals but not all data points confirmed"
      ASSUMED: "Score based on patterns or assumptions, requires verification before acting"

industry_benchmarks:
  sources:
    - "Forrester TEI studies on cloud marketplace adoption"
    - "Canalys channel research"
    - "Tackle.io State of Cloud Marketplaces report"
  stats:
    marketplace_roi: "234% ROI for organizations with mature marketplace practices (Forrester)"
    deal_velocity: "50% faster deal closures through marketplace transactions (Forrester)"
    co_sell_revenue_growth: "51% higher revenue growth for ISVs that co-sell frequently (Canalys)"
    execution_gap: "89% of ISVs transact via marketplace, only 22% drive meaningful revenue from it (Tackle.io)"
    microsoft_tei: "587% ROI with payback under 6 months for Azure co-sell (Microsoft-commissioned Forrester TEI)"
    cloud_market_size: "$723.4B public cloud services forecast 2025 (Gartner)"
    marketplace_third_party: "$85B third-party marketplace transactions projected by 2028 (Canalys)"
