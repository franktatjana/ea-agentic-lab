# Hyperscaler Program Mechanics - Domain Knowledge
# Referenced by: ham-cosell-qualification-definition.yaml, ham-field-alignment-definition.yaml
# Sources: AWS Partner Network docs, Microsoft Partner Center docs, Google Cloud Partner Advantage docs
# Last verified: 2026-03

programs:
  aws_isv_accelerate:
    full_name: "AWS ISV Accelerate Program"
    pipeline_system: "ACE (AWS Co-sell Engine)"
    enrollment:
      prerequisites:
        - "Active AWS Partner Network (APN) membership"
        - "At least one AWS Foundational Technical Review (FTR) passed"
        - "Product listed on AWS Marketplace"
      tiers:
        - name: "ISV Accelerate"
          requirements:
            - "Minimum 15 qualified co-sell opportunities shared per year"
            - "Active AWS Marketplace listing with transactable offer"
            - "Bi-weekly pipeline status updates with AWS partner team"
    co_sell_mechanics:
      opportunity_sharing:
        system: "ACE Pipeline Manager"
        required_fields:
          - "Customer name and account ID"
          - "Opportunity title and description"
          - "Expected close date and deal value"
          - "AWS services involved"
          - "Co-sell ask (technical validation, executive sponsorship, funding)"
        response_window: "5 business days from AWS field team"
        status_tracking:
          - "Prospect: initial submission"
          - "Qualified: AWS validates opportunity"
          - "Technical Validation: AWS SA engaged"
          - "Business Validation: AWS AE engaged"
          - "Closed Won/Lost: outcome recorded"
      incentives:
        co_sell_benefit:
          description: "Cash incentive on net-new customer acquisition through co-sell"
          eligibility: "Deals sourced or co-sold with AWS field, transacted via Marketplace"
        saas_co_sell_benefit:
          description: "Reduced Marketplace fee for SaaS offers meeting co-sell criteria"
          standard_fee: "3-5% of transaction value"
          co_sell_fee: "Reduced rate for qualified co-sell deals"
    committed_spend:
      program: "EDP (Enterprise Discount Program)"
      mechanics:
        commitment: "$1M+ annual AWS spend commitment"
        benefit: "Marketplace purchases count toward EDP commitment"
        draw_down: "Customer can apply marketplace transactions against EDP balance"
        tracking: "Monthly consumption reports via AWS Cost Explorer"
      thresholds:
        minimum_annual: "$1,000,000"
        typical_range: "$1M - $100M+ annually"
        contract_term: "1-3 years"

  azure_ip_cosell:
    full_name: "Microsoft Azure IP Co-sell Program"
    pipeline_system: "Partner Center Referrals"
    enrollment:
      tiers:
        - name: "Co-sell Ready"
          requirements:
            - "Active Microsoft AI Cloud Partner Program membership"
            - "Commercial marketplace offer published"
            - "Sales team trained on co-sell with Microsoft"
        - name: "Azure IP Co-sell Eligible"
          requirements:
            - "Co-sell Ready status achieved"
            - "Minimum $100K Azure Consumed Revenue (ACR) generated in trailing 12 months"
            - "Solution mapped to at least one Microsoft priority sales play"
        - name: "Azure IP Co-sell Incentivized"
          requirements:
            - "Azure IP Co-sell Eligible status"
            - "Active incentive enrollment in Partner Center"
    co_sell_mechanics:
      opportunity_sharing:
        system: "Partner Center Referrals"
        required_fields:
          - "Customer name and organization details"
          - "Deal value and expected close date"
          - "Azure services consumed or planned"
          - "Co-sell request type (joint selling, technical deployment, incentive claim)"
          - "Solution area alignment"
        response_window: "Varies by deal size and Microsoft priority"
      incentives:
        azure_ip_co_sell_incentive:
          description: "Cash incentive for eligible Azure IP co-sell wins"
          eligibility: "Deals transacted via marketplace with $25K+ deal value"
          minimum_deal_value: "$25,000"
        macc_eligible:
          description: "Marketplace purchases count toward customer MACC commitment"
          benefit: "Removes procurement friction, customer uses existing committed budget"
    committed_spend:
      program: "MACC (Microsoft Azure Consumption Commitment)"
      mechanics:
        commitment: "Pre-committed Azure spend over contract term"
        benefit: "Third-party marketplace purchases eligible for MACC draw-down"
        eligibility: "Solution must be Azure IP Co-sell Eligible"
        tracking: "Partner Center reporting and Azure Cost Management"
      thresholds:
        typical_range: "$100K - $50M+ over contract term"
        contract_term: "1-3 years"
        acr_threshold_for_cosell: "$100,000 trailing 12 months"

  gcp_partner_advantage:
    full_name: "Google Cloud Partner Advantage Program"
    pipeline_system: "Partner Advantage Portal"
    enrollment:
      paths:
        - name: "Sell"
          focus: "Resell and co-sell Google Cloud solutions"
        - name: "Service"
          focus: "Implement and manage Google Cloud environments"
        - name: "Build"
          focus: "Build products on Google Cloud infrastructure"
      tiers:
        - name: "Member"
          requirements: ["Basic enrollment, no fee"]
        - name: "Partner"
          requirements: ["Training certifications", "Customer references", "Technical assessments"]
        - name: "Premier Partner"
          requirements: ["Advanced certifications", "Significant customer base", "Revenue thresholds"]
    co_sell_mechanics:
      opportunity_sharing:
        system: "Partner Advantage Portal"
        required_fields:
          - "Customer information and project scope"
          - "Google Cloud products involved"
          - "Expected deal value and timeline"
          - "Co-sell support requested"
      incentives:
        partner_credits:
          description: "Google Cloud credits for qualified partner-sourced deals"
        customer_credit_program:
          description: "Credits allocated to customers for partner-influenced deals"
          benefit: "Reduces customer cost barrier for adoption"
    committed_spend:
      program: "Committed Use Discounts (CUDs)"
      mechanics:
        commitment: "Pre-committed spend on specific Google Cloud services"
        benefit: "Significant discounts on committed resources"
        marketplace_eligibility: "Marketplace purchases may count toward certain commitment types"
      note: "GCP marketplace spend counting toward CUDs is evolving; verify current policy per deal"

cross_program_comparison:
  pipeline_systems:
    aws: "ACE Pipeline Manager"
    azure: "Partner Center Referrals"
    gcp: "Partner Advantage Portal"
  committed_spend_programs:
    aws: "EDP (Enterprise Discount Program)"
    azure: "MACC (Microsoft Azure Consumption Commitment)"
    gcp: "CUDs (Committed Use Discounts)"
  marketplace_fee_structure:
    aws: "3-5% standard, reduced for ISV Accelerate co-sell"
    azure: "3% standard reduced Marketplace fee"
    gcp: "3% standard Marketplace fee"
  co_sell_response_sla:
    aws: "5 business days"
    azure: "Varies by deal priority"
    gcp: "Varies by partner tier"
