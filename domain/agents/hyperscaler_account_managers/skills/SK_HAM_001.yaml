# SK_HAM_001: Co-sell Qualification
# Extracted from: hyperscaler_account_managers/prompts/tasks.yaml cosell_qualification section

skill_id: "SK_HAM_001"
name: "Co-sell Qualification"
description: "Assess co-sell eligibility, score readiness, validate committed spend applicability, and produce next steps"
version: 1
owner: "ham_agent"
category: "cosell_intelligence"

workflow:
  - step: 1
    action: "Check hyperscaler involvement: which hyperscaler(s) active, relationship tier"
    prompt_ref: "prompts/tasks.yaml#cosell_qualification.hyperscaler_involvement_check"
    inputs: ["account_context", "opportunity_name"]
    outputs: ["hyperscaler_involvement_assessment"]

  - step: 2
    action: "Assess committed spend applicability: uncommitted EDP/MACC/CUD balance"
    prompt_ref: "prompts/tasks.yaml#cosell_qualification.committed_spend_applicability"
    inputs: ["account_context", "hyperscaler_data"]
    outputs: ["committed_spend_assessment"]

  - step: 3
    action: "Evaluate ACE/Partner Center eligibility gates: deal size, use case, co-sell flags"
    prompt_ref: "prompts/tasks.yaml#cosell_qualification.ace_marketplace_fit"
    inputs: ["opportunity_name", "hyperscaler_data"]
    outputs: ["eligibility_assessment"]

  - step: 4
    action: "Produce co-sell readiness score with recommended next steps and contact"
    prompt_ref: "prompts/tasks.yaml#cosell_qualification.cosell_readiness_score"
    inputs: ["hyperscaler_involvement_assessment", "committed_spend_assessment", "eligibility_assessment"]
    outputs: ["readiness_score"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, CRM data, hyperscaler relationship data"
  optional:
    - name: "opportunity_name"
      type: "string"
      description: "Specific opportunity to qualify for co-sell"
    - name: "hyperscaler"
      type: "string"
      description: "Target hyperscaler (aws, azure, gcp) or 'all'"

outputs:
  - name: "readiness_score"
    type: "object"
    format: "yaml"
    description: "HIGH/MEDIUM/LOW readiness with dimension scores, gaps, and next steps"
  - name: "committed_spend_assessment"
    type: "object"
    format: "yaml"
    description: "EDP/MACC/CUD status, uncommitted balance, draw-down eligibility"

quality_criteria:
  - "Readiness score supported by five dimension scores with evidence"
  - "Every eligibility gap includes remediation action"
  - "Committed spend assessment cites confirmed amounts"
  - "Hyperscaler-specific terminology correct throughout"

guardrails:
  - "Never assume co-sell eligibility without checking program gates"
  - "Never invent committed spend amounts not in portal data"
  - "Use qualifiers when evidence is indirect"
  - "Add [NEEDS VERIFICATION] marker when uncertain"

imports: []

tags: ["cosell", "qualification", "readiness", "eligibility", "committed-spend"]
