# SK_HAM_003: Field Alignment
# Extracted from: hyperscaler_account_managers/prompts/tasks.yaml field_alignment section

skill_id: "SK_HAM_003"
name: "Field Alignment"
description: "Prepare, register, and debrief hyperscaler joint field sessions"
version: 1
owner: "ham_agent"
category: "field_engagement"

workflow:
  - step: 1
    action: "Prepare session: build joint account map, align pitch, define hyperscaler rep ask"
    prompt_ref: "prompts/tasks.yaml#field_alignment.field_session_prep"
    inputs: ["account_context", "hyperscaler", "session_date"]
    outputs: ["session_prep_brief"]

  - step: 2
    action: "Register opportunity: submit to ACE/Partner Center with required fields"
    prompt_ref: "prompts/tasks.yaml#field_alignment.opportunity_registration"
    inputs: ["opportunity_name", "hyperscaler", "cosell_readiness"]
    outputs: ["registration_status"]

  - step: 3
    action: "Debrief session: capture commitments, next steps, prioritization signals"
    prompt_ref: "prompts/tasks.yaml#field_alignment.field_session_debrief"
    inputs: ["session_notes", "account_context"]
    outputs: ["debrief_summary"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, CRM data, hyperscaler relationship data"
    - name: "hyperscaler"
      type: "string"
      description: "Target hyperscaler (aws, azure, gcp)"
  optional:
    - name: "session_date"
      type: "string"
      description: "Date of the joint session"
    - name: "session_notes"
      type: "string"
      description: "Raw notes from completed session for debrief"
    - name: "opportunity_name"
      type: "string"
      description: "Opportunity to register in ACE/Partner Center"

outputs:
  - name: "session_prep_brief"
    type: "object"
    format: "yaml"
    description: "Account map, co-sell pitch, hyperscaler rep ask, white space analysis"
  - name: "registration_status"
    type: "object"
    format: "yaml"
    description: "Registration outcome with portal confirmation"
  - name: "debrief_summary"
    type: "object"
    format: "yaml"
    description: "Commitments, next steps, prioritization signals"

quality_criteria:
  - "Session prep includes specific ask for hyperscaler rep"
  - "Registration includes all required fields per program"
  - "Debrief captures exact commitments with owners and dates"
  - "Account map cites verified data sources"

guardrails:
  - "Never fabricate hyperscaler rep statements or commitments"
  - "Never assume registration status without checking portal"
  - "Never make commitments on behalf of the hyperscaler"
  - "Add [NEEDS CONFIRMATION] for informal hyperscaler signals"

imports: []

tags: ["field-alignment", "joint-session", "registration", "debrief", "account-mapping"]
