# SK_HAM_002: Marketplace Transaction
# Extracted from: hyperscaler_account_managers/prompts/tasks.yaml marketplace_transaction section

skill_id: "SK_HAM_002"
name: "Marketplace Transaction"
description: "Track marketplace transactions from listing validation through consumption reporting"
version: 1
owner: "ham_agent"
category: "marketplace_operations"

workflow:
  - step: 1
    action: "Validate listing: verify SKU, pricing, and terms are live in marketplace"
    prompt_ref: "prompts/tasks.yaml#marketplace_transaction.listing_validation"
    inputs: ["account_context", "marketplace", "sku_id"]
    outputs: ["listing_validation_result"]

  - step: 2
    action: "Create private offer: generate parameters for pricing, terms, duration"
    prompt_ref: "prompts/tasks.yaml#marketplace_transaction.private_offer_creation"
    inputs: ["opportunity_name", "listing_validation_result"]
    outputs: ["private_offer_parameters"]

  - step: 3
    action: "Route procurement: confirm path (direct, reseller, CPPO) and blockers"
    prompt_ref: "prompts/tasks.yaml#marketplace_transaction.procurement_routing"
    inputs: ["account_context", "private_offer_parameters"]
    outputs: ["procurement_routing"]

  - step: 4
    action: "Report consumption: track usage against committed spend, flag shortfalls"
    prompt_ref: "prompts/tasks.yaml#marketplace_transaction.consumption_reporting"
    inputs: ["account_context", "committed_spend_data"]
    outputs: ["consumption_report"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, CRM data, marketplace account IDs"
  optional:
    - name: "marketplace"
      type: "string"
      description: "Target marketplace (aws, azure, gcp)"
    - name: "sku_id"
      type: "string"
      description: "Specific SKU to validate"
    - name: "opportunity_name"
      type: "string"
      description: "CRM opportunity for private offer creation"

outputs:
  - name: "transaction_status"
    type: "object"
    format: "yaml"
    description: "Lifecycle stage, blockers, and resolution actions"
  - name: "consumption_report"
    type: "object"
    format: "yaml"
    description: "Usage vs. commitment with burn rate and shortfall risk"

quality_criteria:
  - "SKU validation references specific listing ID"
  - "Private offer parameters include all required fields"
  - "Procurement routing identifies specific path with owner"
  - "Consumption reports cite marketplace billing data"

guardrails:
  - "Never assume SKU is live without marketplace verification"
  - "Never fabricate private offer terms not confirmed by deal desk"
  - "Never claim CPPO authorization without partner verification"
  - "Add [NEEDS DEAL DESK APPROVAL] for custom pricing"

imports: []

tags: ["marketplace", "transaction", "private-offer", "cppo", "consumption"]
