# SK_HAM_004: Program Health
# Extracted from: hyperscaler_account_managers/prompts/tasks.yaml program_health section

skill_id: "SK_HAM_004"
name: "Program Health"
description: "Review co-sell program performance, committed spend burn, and incentive utilization"
version: 1
owner: "ham_agent"
category: "program_monitoring"

workflow:
  - step: 1
    action: "Review registered pipeline: summarize by hyperscaler, stage, value, co-sell flags"
    prompt_ref: "prompts/tasks.yaml#program_health.pipeline_registered_review"
    inputs: ["period", "hyperscaler"]
    outputs: ["pipeline_summary"]

  - step: 2
    action: "Summarize closed transactions: deal count, value, hyperscaler split"
    prompt_ref: "prompts/tasks.yaml#program_health.transactions_closed_summary"
    inputs: ["period"]
    outputs: ["transaction_summary"]

  - step: 3
    action: "Assess committed spend health: consumption vs. baseline, burn rate, shortfall risk"
    prompt_ref: "prompts/tasks.yaml#program_health.committed_spend_health"
    inputs: ["period", "committed_spend_data"]
    outputs: ["spend_health"]

inputs:
  required:
    - name: "period"
      type: "string"
      description: "Review period (e.g., 'Q1 2026', 'March 2026')"
  optional:
    - name: "hyperscaler"
      type: "string"
      description: "Target hyperscaler (aws, azure, gcp) or 'all'"
    - name: "committed_spend_data"
      type: "object"
      description: "EDP/MACC/CUD baseline and consumption data"

outputs:
  - name: "pipeline_summary"
    type: "object"
    format: "yaml"
    description: "Registered pipeline by hyperscaler with stage breakdown"
  - name: "transaction_summary"
    type: "object"
    format: "yaml"
    description: "Closed transactions with deal count, value, and hyperscaler split"
  - name: "spend_health"
    type: "object"
    format: "yaml"
    description: "Consumption vs. commitment with burn rate and shortfall risk"

quality_criteria:
  - "Every trend cites two data points (current vs. prior period)"
  - "Burn rate projections include model assumptions"
  - "Pipeline summaries include stage breakdown with counts and values"
  - "Incentive claims include eligibility criteria and deadlines"

guardrails:
  - "Never invent pipeline or transaction data not from portal sources"
  - "Never claim trend without two data points"
  - "Never project burn rate without stating assumptions"
  - "Add [DATA GAP] for missing period comparisons"

imports: []

tags: ["program-health", "pipeline", "committed-spend", "transactions", "incentives"]
