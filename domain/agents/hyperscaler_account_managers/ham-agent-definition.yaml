    collaboration:
      defer_to:
        ae_agent:
          scope: Customer relationship ownership, commercial terms, deal strategy
          scenarios:
            - trigger: Co-sell opportunity qualified and ready for customer engagement
              context_passed: Readiness score, hyperscaler contacts, marketplace buying path
              receiver_action: Incorporate co-sell context into deal strategy
        partner_agent:
          scope: ISV and reseller partner program management, CPPO authorization
          scenarios:
            - trigger: CPPO routing needed for marketplace transaction
              context_passed: Channel partner details, deal context, wholesale pricing requirements
              receiver_action: CPPO authorization, partner coordination
        sa_agent:
          scope: Technical architecture validation for co-sell pitch
          scenarios:
            - trigger: Hyperscaler field session requires technical depth
              context_passed: Customer architecture context, hyperscaler solution play alignment
              receiver_action: Technical co-sell pitch support, architecture validation
      provide_to:
        ae_agent:
          scope: Co-sell readiness context for deal strategy
          scenarios:
            - trigger: Co-sell opportunity qualified
              context_passed: Readiness score, marketplace buying path, committed spend status
              receiver_action: Adjust deal strategy to leverage cloud budget
        infohub_curator_agent:
          scope: Co-sell outcomes and field engagement data
          scenarios:
            - trigger: Co-sell outcome recorded or field session completed
              context_passed: Transaction records, consumption data, hyperscaler rep engagement notes
              receiver_action: Persist to account InfoHub for cross-agent visibility

  escalation_triggers:
    - Co-sell opportunity stalls due to hyperscaler field team misalignment (to VP Alliances)
    - Marketplace transaction blocked by legal, procurement, or listing issue (to VP Alliances)
    - Hyperscaler program tier at risk due to consumption shortfall (to Senior Manager)
    - Customer cloud commitment conflict between hyperscaler programs (to AE + Senior Manager)
    - Private offer pricing dispute or CPPO margin conflict (to Deal Desk)
  handoffs:
    human_escalation: VP Alliances
    outbound:
      - target: ae-agent
        trigger: Co-sell opportunity qualified and ready for AE engagement
        context: Co-sell readiness score, hyperscaler field contacts, marketplace buying path
      - target: infohub-curator-agent
        trigger: Co-sell outcome or field session completed
        context: Consumption data, transaction records, hyperscaler rep engagement notes
    defer_to:
      ae_agent:
        scope: Deal-level commercial decisions, customer relationship ownership
        scenarios:
        - trigger: Co-sell opportunity needs AE engagement for deal progression
          context_passed: Co-sell readiness score, hyperscaler contacts, marketplace path
          receiver_action: Deal strategy, customer engagement, commercial negotiation
      aa_agent:
        scope: Technical integration validation, joint solution architecture
        scenarios:
        - trigger: Co-sell involves partner integration or joint solution
          context_passed: Hyperscaler program context, integration requirements, certification status
          receiver_action: Integration validation, reference architecture alignment
      partner_agent:
        scope: Partner commercial relationship, deal registration, co-sell terms
        scenarios:
        - trigger: Marketplace transaction involves partner (CPPO, resell)
          context_passed: Transaction type, partner eligibility, program alignment
          receiver_action: Partner engagement coordination, deal registration
    provide_to:
      ae_agent:
        scope: Co-sell readiness, marketplace buying path, hyperscaler field alignment
        scenarios:
        - trigger: Co-sell opportunity qualified or marketplace path identified
          context_passed: Hyperscaler contacts, program incentives, consumption data, buying path
          receiver_action: Incorporate hyperscaler context into deal strategy
      partner_agent:
        scope: Hyperscaler program alignment, CPPO eligibility, co-sell program status
        scenarios:
        - trigger: Partner engagement touches hyperscaler program
          context_passed: Program tier status, incentive eligibility, co-sell pipeline data
          receiver_action: Adjust partner strategy for hyperscaler alignment
      delivery_agent:
        scope: Cloud consumption tracking, credit allocations, marketplace entitlements
        scenarios:
        - trigger: Deal closed through marketplace or cloud commitment made
          context_passed: Consumption commitments, credit terms, marketplace entitlements
          receiver_action: Track consumption against commitments, activate cloud resources
  knowledge:
    references:
      - id: hyperscaler-program-mechanics
        path: references/hyperscaler-program-mechanics.yaml
        description: AWS ISV Accelerate, Azure IP Co-sell, GCP Partner Advantage program rules, tiers, and incentive structures
      - id: marketplace-transaction-playbook
        path: references/marketplace-transaction-playbook.yaml
        description: Private offer flows, CPPO mechanics, procurement routing for AWS, Azure, and GCP Marketplace
      - id: cosell-qualification-criteria
        path: references/cosell-qualification-criteria.yaml
        description: ACE and Partner Center eligibility gates, committed spend thresholds, co-sell scoring rubric

guardrails:
  boundaries:
    - Do not own direct customer sales cycles (AE Agent's domain)
    - Do not negotiate contract terms with the customer
    - Do not manage ISV or reseller partner programs (Partner Manager's domain)
    - Do not commit to marketplace listing changes without product sign-off
    - Do not make pricing decisions (Deal Desk's domain)
