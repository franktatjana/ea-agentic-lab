# HAM Agent Configuration
# Purpose: Orchestrate co-sell intelligence across hyperscaler programs

agent_id: "ham_agent"
team: "hyperscaler_account_managers"
category: "sales"
purpose: "Orchestrate co-sell intelligence and marketplace transactions across AWS, Azure, and GCP"

core_functions:
  - "Co-sell opportunity qualification and readiness scoring"
  - "Marketplace transaction lifecycle management"
  - "Hyperscaler field alignment and joint session coordination"
  - "Co-sell program health monitoring and committed spend tracking"
  - "ACE/Partner Center opportunity registration"
  - "Private offer creation and procurement routing"
  - "Committed spend (EDP/MACC/CUD) burn rate monitoring"
  - "Co-sell incentive utilization tracking"
  - "Cross-hyperscaler program comparison and reporting"
  - "Hyperscaler field rep engagement cadence management"

mechanics:
  - "Scans ACE, Partner Center, Partner Advantage portals"
  - "Pattern detection (eligibility gaps, spend shortfalls, expired offers)"
  - "Aggregates cross-hyperscaler data into unified views"

inputs:
  - "CRM opportunity and account data"
  - "ACE/Partner Center/Partner Advantage portal data"
  - "Marketplace listing and transaction data"
  - "Committed spend and consumption reports"
  - "Field session notes and debrief data"

outputs:
  - "Co-sell readiness scores with dimension breakdown"
  - "Marketplace transaction status and blocker reports"
  - "Field alignment briefs and session prep materials"
  - "Program health summaries with cross-hyperscaler comparison"
  - "Risk alerts for shortfalls, expirations, and tier threats"

escalation_to: "VP Alliances"

skills:
  owned:
    - "SK_HAM_001"  # Co-sell Qualification
    - "SK_HAM_002"  # Marketplace Transaction
    - "SK_HAM_003"  # Field Alignment
    - "SK_HAM_004"  # Program Health

playbooks:
  owned:
    - "PB_HAM_001"  # Co-sell Opportunity Qualification
    - "PB_HAM_002"  # Marketplace Transaction Management
    - "PB_HAM_003"  # Hyperscaler Field Alignment
    - "PB_HAM_004"  # Co-sell Program Health Review
  contributes_to:
    - "PB_AE_004"   # Opportunity Consult (consulted on co-sell readiness)

execution:
  trigger_sources:
    - "ace_pipeline_updates"
    - "partner_center_referrals"
    - "marketplace_transactions"
    - "committed_spend_reports"
    - "field_session_scheduling"
  output_destination: "{realm}/{node}/internal-infohub/cosell/"
  escalation_threshold: "committed_spend_burn_below_60pct"

personality_file: "teams/hyperscaler_account_managers/personalities/ham_personality.yaml"
prompts_dir: "teams/hyperscaler_account_managers/prompts"
