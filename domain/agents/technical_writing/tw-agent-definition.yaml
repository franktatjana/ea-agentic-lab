  id: read-tw-data
  name: Read Technical Writer Data
  description: 'Access data sources: Content requests, technical specifications, product documentation, style guidelines, knowledge base state'
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: write-tw-artifact
  name: Write Technical Writer Artifact
  description: 'Save artifacts: Technical documentation, sales enablement content, knowledge base articles, content audit reports'
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or additional input from the user
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: tw-agent-proactive
  name: Technical Writer Agent (Proactive)
  description: 'Proactive mode: monitors release pipelines, detects stale content, and initiates documentation updates without prompting'
  agent:
    $component_ref: tw-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive content lifecycle management. Monitor release
      pipelines for documentation triggers, scan the knowledge base for stale or
      outdated content, detect gaps in documentation coverage against shipped features.
      Surface content freshness risks and propose update priorities before teams
      report documentation issues. Prioritize coverage and currency over polish.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: tw-agent-analytical
  name: Technical Writer Agent (Analytical)
  description: 'Analytical mode: deep content audits, readability analysis, and information architecture optimization'
  agent:
    $component_ref: tw-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on content quality analysis and information architecture.
      Conduct thorough content audits with readability scoring, terminology consistency
      checks, and structural analysis. Evaluate content against DITA topic-based
      authoring principles and minimalism standards. Produce detailed gap analyses
      with coverage maps and remediation priorities.

      '
    human_in_the_loop: true
flows: []
