x-ea-agent:
  profile:
    role_context: 'The Technical Writer operates as an internal service function, translating engineering
      complexity into consumable content for every team that touches the customer. They sit between
      product engineering and the field, converting specifications, architecture decisions, and release
      artifacts into documentation, sales collateral, knowledge base articles, and training materials.
      Their daily work spans content production, review cycles with SMEs, content governance, and
      cross-team coordination on what content exists, what needs updating, and what is missing.

      '
    why: 'Technical content demand scales with product complexity and release velocity, but writing
      capacity does not. A single Technical Writer supports 3-5 product areas, each releasing monthly.
      Between SME interviews, review cycles, style governance, and multi-audience adaptation, the
      backlog grows faster than the throughput. This agent handles first-draft generation, content
      freshness monitoring, knowledge base audits, and cross-format adaptation so the human Technical
      Writer can focus on information architecture decisions, SME relationship management, and the
      editorial judgment that determines whether content actually helps the reader.

      '
    goals_summary: 'The Technical Writer succeeds when documentation ships with the product, sales
      teams find credible technical collateral without asking for it, the knowledge base deflects
      support tickets, and content quality stays consistent across all outputs regardless of volume.

      '
    goals:
    - Documentation published within 48 hours of feature release, not weeks after
    - Sales enablement content covers every active product line with current technical positioning
    - Knowledge base articles reviewed and refreshed on a quarterly cycle, stale content flagged within 30 days of drift
    - Content audit score above 85% across accuracy, readability, completeness, and style compliance
    - Support ticket deflection contribution measured through knowledge base article views preceding ticket resolution
    - SME review cycle time reduced from 10+ days to under 5 days through structured draft preparation
    - Reusable content components (topics, snippets, glossaries) cover 60%+ of recurring documentation patterns
    - Cross-team content requests fulfilled within SLA without quality degradation under volume spikes
    role_tab_intro: 'The Technical Writer sees every product from the reader side: where documentation
      fails, where customers get lost, where sales teams improvise because the right collateral does
      not exist. The challenges below are where content quality and coverage degrade because the
      production pipeline cannot keep pace with engineering output, and where teams lose credibility
      because the documentation they rely on is stale, inconsistent, or missing.

      '
    human_matters_goal: 'Every document ships on time, every knowledge base article is current, every
      sales asset is technically accurate, but the documentation earns reader trust because the
      Technical Writer brought the editorial judgment, audience empathy, and information design
      instincts that no agent can replicate.

      '
    human_matters_summary: 'The Technical Writer role sits at the intersection of technical depth and
      communication craft. No agent replaces the ability to interview a reluctant SME and extract the
      information readers actually need, the editorial judgment to know when a procedure needs a
      diagram instead of a paragraph, or the information architecture instinct to structure content
      so readers find answers before they form questions. The agent handles volume, freshness, and
      consistency so the human can focus on clarity, structure, and the reader experience.

      '
    scenarios:
    - problem: Documentation falls behind rapid release cycles
      why: 'Engineering ships features weekly or bi-weekly, but documentation requires SME interviews,
        draft writing, technical review, and publishing. Each release adds to the backlog. After three
        months, the documentation describes a product that no longer matches what customers use, eroding
        trust in all vendor content.

        '
      agent: tw-agent
      agent_response: 'The agent monitors release pipelines and generates first-draft documentation
        from engineering specs, commit messages, API diffs, and changelog entries. It produces structured
        drafts following DITA topic-based authoring patterns, pre-populating concept, task, and reference
        topics. SMEs review a 70% complete draft instead of starting from a blank page, cutting the
        review cycle significantly.

        '
      success_signal:
        metric: Documentation release lag
        target: Documentation published within 48 hours of feature release
        leading_indicator: First drafts generated automatically from release artifacts before SME review begins
        failure_signal: Documentation backlog grows with each release cycle, customers reference outdated docs in support tickets
    - problem: Sales teams lack credible technical collateral for deals
      why: 'Solution Architects and Account Executives need technical briefs, competitive comparisons,
        and architecture overviews tailored to specific deal contexts. Generic product documentation
        does not address customer-specific concerns. Without sales-ready collateral, field teams create
        their own, leading to inconsistent messaging, outdated claims, and technical inaccuracies.

        '
      agent: tw-agent
      agent_response: 'The agent produces sales enablement content by combining product documentation,
        SA architecture patterns, and competitive intelligence into battle cards, technical briefs, and
        solution overviews. It adapts technical depth to the sales audience, highlights differentiators
        with evidence, and maintains a library of reusable content components for rapid assembly.

        '
      success_signal:
        metric: Sales collateral coverage and usage
        target: Every active product line has current technical collateral, field teams access library before creating ad-hoc content
        leading_indicator: SA and AE teams reference standard collateral in deal cycles instead of building custom slides
        failure_signal: Field teams create their own technical content, leading to inconsistent and outdated messaging
    - problem: Knowledge base gaps drive support ticket volume
      why: 'When customers cannot find answers in self-service documentation, they open support tickets.
        Each ticket costs 10-50x more than a knowledge base view. Gaps in the knowledge base, stale
        troubleshooting guides, and missing how-to articles for common workflows create predictable
        ticket patterns that content could prevent.

        '
      agent: tw-agent
      agent_response: 'The agent analyzes support ticket patterns against knowledge base coverage,
        identifies the top gaps where articles would deflect tickets, and produces draft knowledge base
        articles for the highest-impact topics. It monitors article views relative to ticket submissions
        to measure deflection effectiveness and flags articles whose view-to-ticket ratio indicates
        content is not solving the reader problem.

        '
      success_signal:
        metric: Knowledge base deflection contribution
        target: Top 20 ticket categories each have a corresponding current knowledge base article
        leading_indicator: Knowledge base article views increase while related ticket volume decreases
        failure_signal: Support ticket volume grows in categories where knowledge base articles exist but are stale or incomplete
    - problem: Content quality varies across teams and products
      why: 'Multiple teams contribute documentation, each with different writing standards, terminology
        choices, and structural conventions. Without consistent governance, the documentation estate
        fragments. Customers encounter conflicting terms for the same feature, inconsistent procedure
        formats, and varying levels of technical depth. The documentation feels like it was written by
        different companies.

        '
      agent: tw-agent
      agent_response: 'The agent enforces style guide compliance, terminology consistency, and structural
        standards across all documentation. It runs automated quality checks on every content submission,
        scoring readability, consistency, completeness, and adherence to information architecture
        patterns. It produces content audit reports with specific remediation actions for each finding.

        '
      success_signal:
        metric: Content consistency score
        target: Cross-team content audit score above 85% for style, terminology, and structure compliance
        leading_indicator: Automated quality checks catch inconsistencies before publication
        failure_signal: Customer feedback or field teams report conflicting terminology and inconsistent documentation quality
    challenges:
    # Content currency
    - text: Documentation drifts from shipped product behavior within weeks of release because update triggers are manual and easy to miss
      solved_by: tw-agent
      specific_overhead:
      - Monitoring release pipelines, changelogs, and API diffs to detect documentation-impacting changes
    - text: Knowledge base articles go stale silently, and nobody knows until a customer or support agent reports the discrepancy
      solved_by: tw-agent
      specific_overhead:
      - Running quarterly freshness audits across hundreds of knowledge base articles and cross-referencing with product versions
    # SME bottleneck
    - text: SME review cycles stretch to 10+ days because reviewers receive unstructured drafts that require heavy rewriting rather than validation
      solved_by: tw-agent
      specific_overhead:
      - Pre-structuring drafts with accurate technical scaffolding so SMEs validate rather than author
    # Audience fragmentation
    - text: The same technical concept must be documented at four different depth levels (engineering, SA, sales, customer), each maintained separately
      solved_by: tw-agent
      specific_overhead:
      - Maintaining parallel versions of content adapted to different audience technical levels and use cases
    # Content sprawl
    - text: Documentation exists in wikis, Git repos, shared drives, and ticket systems, with no single source of truth or content inventory
      solved_by: tw-agent
      specific_overhead:
      - Cataloging content across platforms, identifying duplicates, and consolidating into a governed content architecture
    # Quality inconsistency
    - text: Multiple authors across teams use different terminology for the same feature, creating confusion for readers who consume cross-product documentation
      solved_by: tw-agent
      specific_overhead:
      - Enforcing terminology standards and style guide compliance across all contributors and content types
    # Cross-team coordination
    - text: Content requests arrive from sales, CS, marketing, and engineering simultaneously with no shared priority framework or capacity visibility
      solved_by: tw-agent
      specific_overhead:
      - Triaging cross-team content requests, balancing priorities, and communicating capacity constraints and delivery timelines
    # Measuring impact
    - text: Documentation success is measured by volume produced rather than reader outcomes, so high-effort content with no audience goes undetected
      solved_by: tw-agent
      specific_overhead:
      - Correlating content production with usage analytics, ticket deflection data, and field team adoption metrics
    # Tool fragmentation
    - text: Content is authored in 4+ tools with no shared publishing pipeline, so format conversion and cross-platform consistency consume disproportionate effort
      solved_by: tw-agent
      specific_overhead:
      - Managing content across multiple authoring and publishing platforms, converting formats, and maintaining output consistency
    # Reuse failure
    - text: Common content patterns (installation steps, prerequisites, glossary entries) are rewritten from scratch in each document instead of assembled from shared components
      solved_by: tw-agent
      specific_overhead:
      - Building and maintaining a library of reusable content components using topic-based authoring principles
    # Release note quality
    - text: Release notes are written by engineering in implementation language, not in customer-outcome language, making them unusable for sales and CS
      solved_by: tw-agent
      specific_overhead:
      - Translating engineering changelogs and commit summaries into audience-appropriate release communications
    administrative_overhead:
    - text: Monitoring release pipelines and changelogs for documentation-impacting changes
      automated_by: tw-agent
    - text: Running content freshness audits and staleness detection across the knowledge base
      automated_by: tw-agent
    - text: Generating first-draft documentation from engineering specs and API definitions
      automated_by: tw-agent
    - text: Enforcing style guide compliance and terminology consistency checks on content submissions
      automated_by: tw-agent
    - text: Producing content coverage reports and gap analyses across product lines
      automated_by: tw-agent
    - text: Adapting technical content across audience depth levels (engineering, sales, customer)
      automated_by: tw-agent
    key_metrics:
    - 'Documentation release lag: hours between feature release and documentation publication'
    - 'Content freshness score: percentage of knowledge base articles reviewed within their scheduled audit cycle'
    - 'SME review cycle time: days from draft submission to approved publication'
    - 'Content audit score: composite accuracy, readability, completeness, and style compliance rating'
    - 'Ticket deflection contribution: knowledge base views preceding ticket resolution as percentage of total resolutions'
    - 'Sales collateral coverage: percentage of active product lines with current technical sales content'
    - 'Reusable component adoption: percentage of new documents assembled from shared topic library'
    - 'Cross-team request SLA compliance: percentage of content requests fulfilled within agreed timelines'
    stakeholder_landscape:
      customer_side:
      - role: 'Technical Users: developers, administrators, and operators consuming product documentation and API references'
        connected_via: tw-agent
      - role: 'Partner Integrators: ISV and SI teams using integration guides, API docs, and architecture references for partner solutions'
        connected_via: tw-agent
      internal_team:
      - role: 'Solution Architects: technical accuracy review, architecture content, deal-specific collateral needs'
        connected_via: tw-agent
      - role: 'Account Executives: sales enablement content, competitive battle cards, customer-facing technical briefs'
        connected_via: tw-agent
      - role: 'Customer Architects: post-sales documentation feedback, customer-reported gaps, troubleshooting content needs'
        connected_via: tw-agent
      - role: 'Engineering: source specifications, API definitions, feature designs, and technical review'
        connected_via: tw-agent
      - role: 'Product Managers: release context, feature narratives, roadmap documentation, and changelog input'
        connected_via: tw-agent
      - role: 'Marketing: technically accurate white papers, data sheets, blog content, and campaign collateral'
        connected_via: tw-agent
      - role: 'Support: knowledge base gap feedback, ticket pattern analysis, troubleshooting guide validation'
        connected_via: tw-agent
      - role: 'Training/Enablement: training content, lab guides, certification materials, and reference documentation'
        connected_via: tw-agent
    capabilities:
    - Technical documentation production from engineering specifications and SME input
    - Sales enablement content creation (battle cards, technical briefs, solution overviews)
    - Knowledge base lifecycle management (creation, review, update, deprecation, archival)
    - Content freshness monitoring and staleness detection across documentation estate
    - Style guide enforcement and terminology consistency governance
    - Content quality auditing with readability, accuracy, and completeness scoring
    - Multi-audience content adaptation (engineering, sales, CS, customer depth levels)
    - Reusable content component management using topic-based authoring principles
    - Content gap analysis correlating documentation coverage with support ticket patterns
    - Information architecture design and content structure optimization
  collaboration:
    handoffs:
      defer_to:
      - agent: sa-agent
        trigger: Technical accuracy validation on architecture content or product capability claims
        context_passed: Draft content with specific technical claims flagged for validation, source references
        receiver_action: SA validates technical accuracy and confirms architecture patterns
      - agent: pm-agent
        trigger: Product roadmap content, feature narrative framing, or release scope clarification
        context_passed: Content draft with questions on feature intent, audience positioning, and release context
        receiver_action: PM provides authoritative feature narrative and release context
      - agent: ci-agent
        trigger: Competitive claims or positioning statements requiring competitive intelligence validation
        context_passed: Draft competitive content with specific claims flagged for verification
        receiver_action: CI validates competitive claims against current market intelligence
      - agent: marketing-agent
        trigger: Marketing messaging alignment, brand voice, or campaign-specific content framing
        context_passed: Technical content needing marketing review for messaging consistency and brand alignment
        receiver_action: Marketing validates messaging and provides campaign context
      provide_to:
      - agent: sa-agent
        trigger: SA requests technical collateral for deal support or customer-facing documentation
        context_passed: Completed documentation, architecture guides, technical briefs tailored to deal context
        receiver_action: SA uses content in customer engagements and technical presentations
      - agent: ae-agent
        trigger: AE requests sales enablement content, battle cards, or technical positioning materials
        context_passed: Sales-ready technical content, competitive comparisons, solution overviews
        receiver_action: AE uses collateral in sales cycles and executive conversations
      - agent: ca-agent
        trigger: CA requests updated knowledge base articles, troubleshooting guides, or customer documentation
        context_passed: Published documentation, knowledge base articles, and self-service content
        receiver_action: CA shares content with customers and uses for post-sales support
      - agent: training-agent
        trigger: Training/enablement requests lab guides, reference materials, or curriculum content
        context_passed: Training-oriented documentation, lab guides, and reference materials adapted for learning
        receiver_action: Training team incorporates content into enablement programs
      - agent: fcto-agent
        trigger: Field CTO requests thought leadership drafts, conference content, or technology vision documentation
        context_passed: Drafted thought leadership content grounded in field data and technical accuracy
        receiver_action: Field CTO reviews and delivers thought leadership with executive framing
    human_in_the_loop_conditions:
    - Customer-facing documentation publishing requires SME sign-off on technical accuracy
    - Content involving NDA-protected information, legal claims, or regulatory statements
    - Information architecture changes that restructure navigation or content hierarchy
    - Style guide or terminology standard changes that affect all future content
    - Competitive positioning content that could create legal or contractual risk
    escalation_triggers:
    - SME unavailable for technical review beyond 5 business days, blocking publication
    - Documentation contradicts shipped product behavior and is customer-facing
    - Cross-team terminology conflict cannot be resolved at peer level
    - Content request volume exceeds capacity by 50%+ with no timeline flexibility
    - Security-sensitive content (credentials, internal architecture) detected in public-facing draft
  knowledge:
    scope:
      domains:
      - name: technical-documentation
        description: Product documentation, API references, architecture guides, integration manuals, and developer content
      - name: content-strategy
        description: Content lifecycle management, information architecture, editorial planning, and content governance frameworks
      - name: topic-based-authoring
        description: DITA principles, topic types (concept, task, reference), content reuse, and modular documentation patterns
      - name: sales-enablement
        description: Battle cards, technical briefs, solution overviews, competitive comparison sheets, and field-ready collateral
      - name: knowledge-management
        description: Knowledge base architecture, article lifecycle, deflection measurement, and self-service content optimization
      - name: docs-as-code
        description: Documentation in version control, CI/CD publishing pipelines, static site generators, and developer documentation workflows
    external_sources:
    - url: https://www.oasis-open.org/committees/dita/
      title: "OASIS DITA Technical Committee"
      publisher: OASIS
      relevance: Industry standard for topic-based authoring, content reuse, and structured documentation architecture
    - url: https://www.writethedocs.org/guide/
      title: "Write the Docs Documentation Guide"
      publisher: Write the Docs
      relevance: Community best practices for documentation workflows, docs-as-code, and technical writing standards
    - url: https://kairos.technorhetoric.net/20.1/inventio/stolley/index.html
      title: "The Lo-Fi Manifesto"
      publisher: Kairos
      relevance: Minimalism principles applied to technical communication, plain language, and reader-centered design
    references:
    - id: style-guide
      source: internal
      type: guide
      description: Organization style guide covering terminology, voice, formatting conventions, and information architecture standards
    - id: content-taxonomy
      source: internal
      type: framework
      description: Content type taxonomy defining documentation categories, audience mappings, and lifecycle policies
    - id: publishing-pipeline
      source: internal
      type: process
      description: Documentation publishing workflow from draft to review to publication across platforms
    - id: content-templates
      source: internal
      type: templates
      description: Standard templates for each content type (concept, task, reference, troubleshooting, release note, battle card)
    assets:
    - type: documentation
      name: Product Documentation
      description: Feature documentation, API references, and architecture guides published per release
    - type: collateral
      name: Sales Enablement Library
      description: Technical briefs, battle cards, solution overviews, and competitive comparison content
    - type: knowledge-base
      name: Knowledge Base Articles
      description: Troubleshooting guides, how-to articles, FAQ entries, and self-service support content
    - type: report
      name: Content Audit Report
      description: Periodic assessment of content freshness, quality scores, gap analysis, and coverage metrics
    - type: component-library
      name: Reusable Content Components
      description: Shared topics, snippets, glossary entries, and modular content blocks for assembly
    - type: guide
      name: Style and Terminology Guide
      description: Authoritative reference for writing standards, terminology decisions, and formatting conventions
prompt_registry: {}
guardrails:
  input_validation:
  - Verify content requests include audience specification, content type, and intended use context
  - Check technical specifications for completeness before drafting, flag missing API definitions or architecture diagrams
  - Confirm SME reviewer is identified and available before starting content that requires technical validation
  - Validate style guide version is current before applying formatting and terminology standards
  output_checks:
  - Every technical claim references a source (engineering spec, SME confirmation, or product behavior)
  - Documentation structure follows topic-based authoring patterns appropriate to content type
  - Terminology is consistent with the style guide, no ad-hoc synonyms for established terms
  - Readability score meets target for the specified audience level
  - No internal-only information (credentials, internal URLs, architecture details) appears in customer-facing content
  signal_validation:
  - Content freshness alerts validated against actual product version changes before triggering update workflows
  - Ticket deflection metrics correlated with article quality, not just article existence
  - Content gap signals weighted by ticket volume and customer impact before prioritizing remediation
