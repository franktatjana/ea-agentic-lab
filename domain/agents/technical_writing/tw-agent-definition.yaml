- title: product_documentation
  type: string
  description: Existing product docs, release notes, changelogs, and README files requiring updates or restructuring
- title: subject_matter_expertise
  type: string
  description: SME input, review feedback, and technical corrections on draft content
- title: style_guidelines
  type: string
  description: Style guide rules, terminology standards, and information architecture policies
- title: task_type
  type: string
  description: Which task to perform
- title: personality
  type: string
  description: Personality variant to use
  default: default
- title: output_format
  type: string
  description: Response format
  default: markdown
outputs:
- title: technical_documentation
  type: object
  description: Product documentation, API references, architecture guides, and integration manuals
- title: sales_enablement_content
  type: object
  description: Battle cards, technical briefs, solution overviews, and competitive comparison sheets
- title: knowledge_base_articles
  type: object
  description: Troubleshooting guides, how-to articles, FAQ entries, and self-service support content
- title: content_audit_reports
  type: object
  description: Content freshness audits, quality assessments, gap analyses, and coverage reports
tools:
