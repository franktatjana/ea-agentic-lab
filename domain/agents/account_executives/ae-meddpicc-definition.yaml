agentspec_version: 26.1.0
component_type: Agent
id: ae-meddpicc-agent
name: AE MEDDPICC Agent
description: 'Enterprise deals stall when qualification gaps stay hidden until late in the cycle. This agent runs structured MEDDPICC assessments across all eight dimensions, scores completeness per deal,
  surfaces gaps early enough to close them, and produces qualification scorecards that turn gut feel into evidence-based deal confidence.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: ae-agent
  tags:
  - qualification
  - meddpicc
  - deal-readiness
  - gap-analysis
  - scorecard
  responsibility: 'Own the MEDDPICC qualification process end-to-end: assess each dimension, score completeness, identify gaps, recommend actions to close gaps, and produce qualification scorecards for
    deal review.

    '
system_prompt: 'You are a Qualification Agent, part of the Account Executive intelligence

  system. Your job is to assess deal qualification using MEDDPICC and

  produce actionable scorecards.


  MEDDPICC DIMENSIONS:

  - M (Metrics): Quantified value the customer expects. Score from CRM and discovery notes.

  - E (Economic Buyer): Person with budget authority. Verify from stakeholder data.

  - D (Decision Criteria): Technical, business, vendor criteria. Check against discovery.

  - D (Decision Process): Steps, stakeholders, timeline to approve. Map from deal data.

  - P (Paper Process): Procurement, legal, security review status. Check milestone tracking.

  - I (Identify Pain): Business pain driving urgency. Validate from communications.

  - C (Champion): Internal advocate health and engagement. Check contact frequency.

  - C (Competition): Competitors evaluated, positioning. Scan signal data.


  You MUST:

  - Score each dimension as STRONG / ADEQUATE / WEAK / UNKNOWN

  - Provide specific evidence for each score from source data

  - Calculate overall qualification confidence (0-100%)

  - Identify the top 3 gaps with recommended actions to close them

  - Produce a qualification scorecard with all dimensions and scores

  - Flag deals below 60% confidence for immediate attention


  You MUST NOT:

  - Diagnose deal health beyond qualification (Deal Diagnosis Agent''s domain)

  - Manage pipeline or forecast (Pipeline Management Agent''s domain)

  - Prepare meeting materials (Meeting Preparation Agent''s domain)

  - Auto-change CRM data (recommends updates for human review only)

  - Assess stakeholder sentiment beyond champion health (Stakeholder Agent''s domain)


  Your cadence is per-deal: triggered before stage transitions, before

  forecast commits, or on demand. You report qualification facts and gaps,

  not deal strategy.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-crm-data
  name: Read CRM Data
  description: Access opportunity data, stage, discovery notes, stakeholder contacts
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: crm_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: CRM unavailable, cannot proceed with pipeline data
    - error_code: RECORD_NOT_FOUND
      guidance: Record not found in CRM, verify identifiers with user
- component_type: ClientTool
  id: read-communications
  name: Read Communications
  description: Access meeting notes, emails, Slack threads for qualification evidence
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: content
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Cannot access communications, flag as data gap
    - error_code: NO_RECORDS
      guidance: No communications found for period, expand search or note gap
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks, decisions, stakeholders, competitive, governance, value, journey, opportunities,
    context, or frameworks.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: save-qualification-data
  name: Save Qualification Data
  description: Persist qualification scorecard and gap analysis to InfoHub
  requires_confirmation: false
  inputs:
  - title: scorecard
    type: object
  - title: opportunity_name
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification on qualification dimension data
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: qualification-data
  name: Qualification Data
  description: MEDDPICC scorecards and gap analysis available to peer agents and orchestrator
  tools:
  - id: get-qualification-scorecard
    name: Get Qualification Scorecard
    description: Returns current MEDDPICC scorecard with dimension scores and evidence for a specified opportunity
    inputs:
    - title: opportunity_name
      type: string
    outputs:
    - title: scorecard
      type: object
  - id: get-qualification-gaps
    name: Get Qualification Gaps
    description: Returns prioritized qualification gaps with recommended closing actions
    inputs:
    - title: opportunity_name
      type: string
    outputs:
    - title: gaps
      type: array
specialized_agents: []
flows:
- component_type: Flow
  id: meddpicc-qualification
  name: MEDDPICC Qualification Assessment
  playbook_refs:
  - PB_AE_006
  - PB_AE_003
  - PB_AE_001
  description: Run a full MEDDPICC qualification assessment for a deal, scoring all eight dimensions and producing a gap scorecard.
  inputs:
  - title: opportunity_name
    type: string
  - title: crm_data
    type: object
  - title: communications
    type: string
  outputs:
  - title: qualification_scorecard
    type: object
  - title: gap_analysis
    type: object
  - title: recommended_actions
    type: array
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: ae-meddpicc-data-collection
      input: opportunity_name, crm_data, communications
      tools:
      - read-crm-data
      - read-communications
      - read-infohub
      description: Collect evidence for each MEDDPICC dimension from CRM and communications
      on_failure: stop
    - step: 2
      prompt: ae-meddpicc-dimension-scoring
      input: dimension_evidence
      description: Score each dimension as STRONG/ADEQUATE/WEAK/UNKNOWN with evidence citations
      on_failure: stop
    - step: 3
      prompt: ae-meddpicc-gap-analysis
      input: dimension_scores
      description: Identify top gaps, calculate overall confidence, recommend actions to close gaps
      on_failure: stop
    - step: 4
      prompt: ae-meddpicc-scorecard
      input: dimension_scores, gap_analysis, opportunity_context
      description: Produce formatted qualification scorecard with scores, evidence, gaps, and next steps
      on_failure: skip_with_warning
    - step: 5
      action: persist
      tools:
      - save-qualification-data
      description: Save qualification scorecard and gap analysis to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - qualification-scoring
    - meddpicc-assessment
    - gap-analysis
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'MEDDPICC is a framework, not a checklist. The AE uses qualification data to decide how to run the deal: which gaps to close first, which dimensions matter most for this specific
      customer, and when to walk away from a deal that scores well on paper but feels wrong. The agent scores dimensions, but the AE interprets what the scores mean for this deal.

      '
    challenges:
    - text: Qualification data scattered across CRM fields, meeting notes, and the AE's memory
      specific_overhead:
      - Manually scoring MEDDPICC dimensions by re-reading call transcripts and emails
    - text: MEDDPICC gaps go unnoticed until a deal review exposes them too late
      specific_overhead:
      - Preparing qualification summaries for deal reviews and stage-gate approvals
    administrative_overhead:
    - Manually scoring MEDDPICC dimensions by re-reading call transcripts and emails
    - Preparing qualification summaries for deal reviews and stage-gate approvals
    scenarios:
    - problem: Qualification data scattered across CRM fields, meeting notes, and the AE's memory
      why: 'Without a single view of qualification status, the AE cannot tell which MEDDPICC dimensions are solid and which are guesswork. Deal reviews start with data collection instead of strategic discussion.

        '
      agent: ae-meddpicc-agent
      agent_response: 'Continuously extracts qualification signals from CRM updates, call transcripts, and email threads. Consolidates into a live MEDDPICC scorecard per deal with evidence links for each
        dimension.

        '
      success_signal:
        metric: Qualification data is consolidated and scored without manual assembly
        target: Active deals have an up-to-date scorecard that reflects available evidence
        leading_indicator: Scorecard auto-updated within 24h of new data source
        failure_signal: Deal review reveals unknown dimensions that had available data
    - problem: MEDDPICC gaps go unnoticed until a deal review exposes them too late
      why: 'Qualification gaps that surface at stage-gate reviews are expensive: the deal has already consumed resources, and backfilling missing dimensions means re-engaging stakeholders who have moved
        on.

        '
      agent: ae-meddpicc-agent
      agent_response: 'Proactively flags qualification gaps based on deal stage expectations. Alerts the AE when critical dimensions remain weak ahead of upcoming milestones or stage transitions, with suggested
        discovery questions.

        '
      success_signal:
        metric: Qualification gaps surface early enough to address before a stage-gate
        target: The AE enters deal reviews knowing where the gaps are, not discovering them live
        leading_indicator: AE addresses flagged gap before deal review
        failure_signal: Stage-gate blocked by qualification gap that was detectable earlier
  escalation_triggers:
  - Overall qualification confidence below 60%
  - 3+ MEDDPICC dimensions scored UNKNOWN
  - Champion dimension scored WEAK or UNKNOWN
  - Deal approaching stage transition with qualification gaps in critical dimensions
  prompt_registry:
    ae-meddpicc-data-collection:
      description: Collect and organize evidence for each MEDDPICC dimension from available data sources
      source: prompts/tasks.yaml#qualification.meddpicc_data_collection
      inputs:
      - title: opportunity_name
        type: string
      - title: account_name
        type: string
      - title: crm_data
        type: object
      - title: communications
        type: string
      outputs:
      - title: dimension_evidence
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - opportunity
        - discovery_notes
        - stage_history
        priority: critical
      - source: read-communications
        fields:
        - emails
        - meetings
        - slack_threads
        priority: critical
      - source: read-infohub
        fields:
        - qualification_history
        - stakeholder_map
        priority: enrichment
    ae-meddpicc-dimension-scoring:
      description: Score each MEDDPICC dimension as STRONG/ADEQUATE/WEAK/UNKNOWN with evidence
      source: prompts/tasks.yaml#qualification.meddpicc_dimension_scoring
      inputs:
      - title: dimension_evidence
        type: object
      - title: current_stage
        type: string
      outputs:
      - title: dimension_scores
        type: object
    ae-meddpicc-gap-analysis:
      description: Identify qualification gaps, calculate confidence, recommend closing actions
      source: prompts/tasks.yaml#qualification.meddpicc_gap_analysis
      inputs:
      - title: dimension_scores
        type: object
      - title: current_stage
        type: string
      - title: target_close_date
        type: string
      outputs:
      - title: gap_analysis
        type: object
    ae-meddpicc-scorecard:
      description: Produce formatted MEDDPICC qualification scorecard for deal review
      source: prompts/tasks.yaml#qualification.meddpicc_scorecard
      inputs:
      - title: dimension_scores
        type: object
      - title: gap_analysis
        type: object
      - title: opportunity_context
        type: object
      outputs:
      - title: scorecard
        type: object
  boundaries:
  - Qualification assessment only, does not diagnose deal health or strategy
  - Does not manage pipeline metrics or forecast
  - Does not prepare meeting materials or stakeholder briefs
  - Does not scan communications for new signals (uses existing signal data)
  - CRM update recommendations only, does not auto-change CRM data
  permissions:
  - Read CRM opportunity data including discovery notes and stage history
  - Read communications for qualification evidence
  - Score MEDDPICC dimensions and calculate qualification confidence
  - Produce qualification scorecards for deal review
  - Recommend gap-closing actions with owners and timelines
  guardrails:
    input_validation:
    - Reject qualification assessment without opportunity name and CRM data
    - Reject scoring without evidence collected for at least 4 of 8 dimensions
    output_checks:
    - Each dimension must be scored as STRONG/ADEQUATE/WEAK/UNKNOWN with evidence
    - Overall confidence (0-100%) must reflect dimension scores, not optimism
    - Top 3 gaps must include specific actions with owners and timelines
    - Deals below 60% confidence must be flagged for immediate attention
    signal_validation:
    - Never score a dimension as STRONG without explicit supporting evidence
    - Champion assessment based on contact frequency data, not assumptions
    - Paper process status from milestone tracking, not estimated timelines
    - Mark dimension UNKNOWN when evidence is insufficient, not ADEQUATE
  error_handling:
    tool_failures:
      critical:
      - read-crm-data
      - read-communications
      enrichment:
      - read-infohub
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - qualification
      - meddpicc
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/meddpicc-framework.yaml
      description: MEDDPICC dimension definitions, scoring rubric (STRONG/ADEQUATE/WEAK/UNKNOWN), evidence requirements per dimension
  autonomy:
    triggers:
    - type: parent_dispatch
      source: ae-agent
      description: AE orchestrator routes qualification and MEDDPICC requests
    - type: event
      source: crm_webhook
      condition: opportunity.stage_transition OR forecast_commit_pending
      description: Auto-qualifies before stage transitions and forecast commits
    - type: downstream
      source: ae-deal-diagnosis-agent
      condition: deal_health.score < 40
      description: Critical deal health triggers full re-qualification
    - type: downstream
      source: ae-signal-detection-agent
      condition: new_pain_point_detected == true OR budget_signal.type == constraint
      description: New pain points or budget constraints update qualification evidence
    - type: downstream
      source: PB_AE_001
      signal: SIG_AE_CALIBRATION
      condition: calibration_pass.completed == true
      description: Retrospective calibration compares MEDDPICC score accuracy against deal outcome, updates calibration-log.yaml
    outputs:
    - type: parent_return
      target: ae-agent
      payload:
      - qualification_scorecard
      - gap_analysis
      - recommended_actions
      description: Qualification results back to orchestrator
    - type: trigger_agent
      target: ae-stakeholder-agent
      condition: champion_dimension.score IN [WEAK, UNKNOWN]
      payload:
      - gap_analysis
      - champion_evidence
      description: Champion gap triggers stakeholder deep-dive and mapping
    - type: trigger_agent
      target: ae-meeting-prep-agent
      condition: unknown_dimensions >= 3
      payload:
      - gap_analysis
      - discovery_targets
      description: Multiple unknown dimensions trigger discovery meeting preparation
    - type: notify_human
      condition: overall_confidence < 60
      channel: alert
      description: Deals below 60% confidence flagged for immediate AE attention
    consumes_toolboxes:
    - toolbox: risk-intelligence
      agent: sa-risk-agent
      tools:
      - get-architecture-health
      reason: Technical readiness is MEDDPICC input
    - toolbox: compliance-intelligence
      agent: infosec-agent
      tools:
      - get-compliance-status
      reason: Compliance posture affects qualification
    dependencies:
    - agent: ae-signal-detection-agent
      toolbox: signal-intelligence
      tools:
      - get-commercial-signals
      purpose: Latest signals as evidence for qualification dimension scoring
    - agent: ae-deal-diagnosis-agent
      toolbox: deal-intelligence
      tools:
      - get-deal-health
      purpose: Deal health context for qualification assessment
