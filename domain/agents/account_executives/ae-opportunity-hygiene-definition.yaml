agentspec_version: 26.1.0
component_type: Agent
id: ae-opportunity-hygiene-agent
name: AE Opportunity Hygiene Agent
description: 'CRM data decays within days of the last update. This agent runs weekly health checks across every active opportunity,
  tracks paper process milestones (procurement, legal, security review), flags deals going stale before they slip through
  the cracks, and generates specific CRM update checklists so the pipeline reflects reality, not last month''s optimism.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: ae-agent
  tags:
  - hygiene
  - stale-deals
  - crm-updates
  - paper-process
  - weekly-checks
  - operational
  responsibility: 'Maintain CRM data quality and pipeline hygiene through scheduled checks, health scoring, stale deal detection,
    paper process milestone tracking, and actionable update checklists.

    '
system_prompt: 'You are an Opportunity Hygiene Agent, part of the Account Executive

  intelligence system. Your job is to keep the pipeline clean and accurate.


  You MUST:

  - Run weekly checks on stage accuracy, close dates, next steps, last contact

  - Track paper process milestones: procurement status, legal review stage, security approval

  - Evaluate health indicators as GREEN/YELLOW/RED with specific criteria

  - Detect stale opportunities: WARNING at 14 days, CRITICAL at 21 days

  - Flag paper process delays (legal >10 days, security >14 days, procurement >7 days without update)

  - Generate weekly reports with overall hygiene score and trends

  - Produce CRM update checklists with specific field updates needed


  You MUST NOT:

  - Perform strategic deal analysis (Deal Diagnosis Agent''s domain)

  - Prepare meeting materials (Meeting Preparation Agent''s domain)

  - Scan communications for commercial signals (Signal Detection Agent''s domain)

  - Auto-change CRM data (recommends updates for human review only)

  - Make forecast commitments (Pipeline Management Agent''s domain)


  Your cadence is operational: weekly hygiene runs, daily stale checks.

  You report what the data shows, not what it might mean strategically.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-crm-data
  name: Read CRM Data
  description: Access all opportunity data, stage history, last contact dates, CRM field states
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: crm_data
    type: object
  x-ea-agent:
    risk: low
- component_type: ClientTool
  id: write-risk-alert
  name: Write Risk Alert
  description: Save hygiene alerts (stale deals, data quality issues) to InfoHub
  requires_confirmation: true
  inputs:
  - title: risk
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
- component_type: ClientTool
  id: save-hygiene-report
  name: Save Hygiene Report
  description: Persist hygiene scores, health distribution, and CRM checklists to InfoHub
  requires_confirmation: false
  inputs:
  - title: report
    type: object
  - title: review_date
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: low
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification about opportunity status or CRM data
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
toolboxes:
- component_type: Toolbox
  id: hygiene-reports
  name: Hygiene Reports
  description: CRM hygiene scores and stale deal alerts available to peer agents and orchestrator
  tools:
  - id: get-hygiene-report
    name: Get Hygiene Report
    description: Returns overall hygiene score with health distribution and specific violations
    inputs:
    - title: review_date
      type: string
    outputs:
    - title: hygiene_report
      type: object
  - id: get-stale-alerts
    name: Get Stale Alerts
    description: Returns stale opportunity warnings with WARNING (14d) and CRITICAL (21d) severity
    inputs:
    - title: current_date
      type: string
    outputs:
    - title: stale_alerts
      type: array
specialized_agents: []
flows:
- component_type: Flow
  id: opportunity-hygiene
  name: Opportunity Hygiene
  description: Run weekly hygiene checks, assess health indicators, detect stale opportunities, and generate reports.
  inputs:
  - title: pipeline_summary
    type: object
  - title: review_date
    type: string
  - title: opportunity_name
    type: string
  - title: current_date
    type: string
  outputs:
  - title: hygiene_check
    type: object
  - title: health_indicators
    type: object
  - title: stale_alerts
    type: object
  - title: hygiene_report
    type: object
  - title: crm_checklist
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: ae-weekly-hygiene-check
      input: pipeline_summary, review_date
      tools:
      - read-crm-data
      description: Check stage accuracy, close dates, next steps, last contact, risk status
    - step: 2
      prompt: ae-opportunity-health-indicators
      input: opportunity_name, current_stage, days_in_stage, last_contact_date
      tools:
      - read-crm-data
      description: Evaluate GREEN/YELLOW/RED criteria, identify concerns, improvement actions
    - step: 3
      prompt: ae-stale-opportunity-alert
      input: pipeline_data, current_date
      tools:
      - read-crm-data
      description: Detect stale opportunities with WARNING (14d) and CRITICAL (21d) alert levels
    - step: 4
      prompt: ae-hygiene-report
      input: pipeline_summary, week_end_date
      description: Overall hygiene score, health distribution, activity metrics, recommendations
    - step: 5
      prompt: ae-crm-update-checklist
      input: opportunity_name, recent_activity, crm_state
      tools:
      - read-crm-data
      description: Generate CRM field updates, activity logging, and InfoHub update checklist
    - step: 6
      action: persist
      tools:
      - save-hygiene-report
      - write-risk-alert
      condition: write-risk-alert triggers for CRITICAL stale alerts (21d+)
      description: Save hygiene report and CRM checklist to InfoHub, write risk alerts for critical staleness
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - crm-hygiene
    - data-completeness
    - stage-validation
    - paper-process-tracking
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  prompt_registry:
    ae-weekly-hygiene-check:
      description: Weekly hygiene check on all active opportunities for stage, date, and contact accuracy
      source: prompts/tasks.yaml#opportunity_hygiene.weekly_hygiene_check
      inputs:
      - title: ae_name
        type: string
      - title: pipeline_summary
        type: object
      - title: review_date
        type: string
      outputs:
      - title: hygiene_check
        type: object
    ae-opportunity-health-indicators:
      description: Assess GREEN/YELLOW/RED health indicators for a specific opportunity
      source: prompts/tasks.yaml#opportunity_hygiene.opportunity_health_indicators
      inputs:
      - title: opportunity_name
        type: string
      - title: stage
        type: string
      - title: days_in_stage
        type: integer
      - title: last_contact_date
        type: string
      outputs:
      - title: health_indicators
        type: object
    ae-stale-opportunity-alert:
      description: Identify stale opportunities with WARNING (14d) and CRITICAL (21d) alert levels
      source: prompts/tasks.yaml#opportunity_hygiene.stale_opportunity_alert
      inputs:
      - title: ae_name
        type: string
      - title: current_date
        type: string
      outputs:
      - title: stale_alerts
        type: object
    ae-hygiene-report:
      description: Generate weekly hygiene report with score, health distribution, and activity metrics
      source: prompts/tasks.yaml#opportunity_hygiene.hygiene_report
      inputs:
      - title: ae_name
        type: string
      - title: week_end_date
        type: string
      - title: pipeline_summary
        type: object
      outputs:
      - title: hygiene_report
        type: object
    ae-crm-update-checklist:
      description: Generate CRM update checklist with field updates, activity logging, and InfoHub updates
      source: prompts/tasks.yaml#opportunity_hygiene.crm_update_checklist
      inputs:
      - title: opportunity_name
        type: string
      - title: recent_activity
        type: string
      - title: crm_state
        type: object
      outputs:
      - title: crm_checklist
        type: object
  boundaries:
  - Operational hygiene only, does not perform strategic deal analysis
  - Does not prepare meeting materials or stakeholder briefs
  - Does not scan communications for signals
  - CRM update recommendations only, does not auto-change CRM data
  permissions:
  - Read all CRM opportunity data including stage history and contact dates
  - Run weekly hygiene checks across all active opportunities
  - Evaluate health indicators and detect stale deals
  - Write hygiene alerts to InfoHub (stale deals, data quality issues)
  - Generate CRM update checklists for human review
  guardrails:
    input_validation:
    - Reject hygiene checks without pipeline data or review date
    - Reject health indicator assessment without stage and last contact date
    output_checks:
    - Health indicators must use consistent GREEN/YELLOW/RED criteria
    - Stale thresholds must be 14 days (WARNING) and 21 days (CRITICAL)
    - Hygiene score must be calculated from consistent formula
    - Week-over-week comparison must track trend direction
    signal_validation:
    - Never auto-change CRM stages, only recommend updates for human review
    - Stale detection based on data timestamps, not assumptions
    - Do not penalize gaps caused by customer holidays or known pauses
    - Close-lost recommendations are suggestions, not automatic changes
  knowledge:
    references:
    - name: Risk Classification
      description: Health indicator criteria (GREEN/YELLOW/RED), stale thresholds
      load_when: Evaluating opportunity health or detecting stale deals
      content:
        severity_classification:
          HIGH:
          - Deal at risk of being lost
          - Customer escalation to executive level
          - Budget eliminated or significantly cut
          - Competitor displacing vendor
          - Key champion departed
          MEDIUM:
          - Decision timeline pushed >30 days
          - Budget approval delayed
          - New stakeholders with unknown stance
          - Scope reduction discussed
          LOW:
          - Pricing questions
          - Procurement process clarifications
          - Contract terms negotiation
        escalation_triggers:
          immediate:
          - HIGH severity commercial risk
          - Customer threatens to cancel
          - Competitor mentioned as preferred choice
          within_24h:
          - Deal stuck in same stage >45 days
          - Multiple meeting cancellations
          - Unresponsive champion
        composite_risk_scoring:
          description: 'Individual risks rarely tell the full story. A single MEDIUM risk is manageable. Three MEDIUM risks
            on the same deal create a HIGH composite risk. Always assess risk as a portfolio of factors, not isolated items.

            '
          methodology:
            score_mapping:
              HIGH: 3
              MEDIUM: 2
              LOW: 1
            composite_formula: Sum of all active risk scores for a deal
            thresholds:
              critical: '>= 7 (immediate escalation required)'
              elevated: 5-6 (management review within 48 hours)
              moderate: 3-4 (monitor closely, update in next pipeline review)
              low: <= 2 (standard monitoring)
          compound_risk_patterns:
          - name: Triple Threat
            components:
            - Champion gone dark
            - Close date pushed
            - New stakeholder introduced
            composite_score: 7
            interpretation: Internal dynamics have shifted. Champion may have lost influence or been reassigned.
            action: Immediate outreach to champion for status. Activate secondary contacts. Prepare contingency.
          - name: Silent Stall
            components:
            - No stage movement >30 days
            - Contact frequency declining
            - Next steps vague
            composite_score: 6
            interpretation: Deal is stalling without explicit rejection. Often means competing priority won internally.
            action: Create a reason to re-engage. Bring new value (insight, reference, event). Ask directly about timeline.
          - name: Budget Squeeze
            components:
            - Budget review mentioned
            - Scope reduction discussed
            - Decision delayed
            composite_score: 7
            interpretation: Budget is under pressure. Deal may survive but at reduced scope or pushed timeline.
            action: Prepare phased approach. Quantify cost of delay. Engage economic buyer on minimum viable scope.
          - name: Competitive Ambush
            components:
            - Competitor mentioned
            - New evaluation criteria introduced
            - Champion less responsive
            composite_score: 8
            interpretation: Active competitive evaluation underway. Champion may be losing the internal argument.
            action: Activate competitive displacement playbook. Arm champion with differentiation. Request executive meeting.
        risk_trending:
          description: 'A static risk is less dangerous than a worsening trend. Track risk direction over time, not just current
            state.

            '
          trend_classification:
            improving:
              definition: Composite risk score decreased by 2+ points in last 14 days
              indicators:
              - Risk factors resolved
              - Champion re-engaged
              - New positive signals
              action: Maintain current approach. Document what worked for future reference.
            stable:
              definition: Composite risk score unchanged for 14+ days
              indicators:
              - Same risks persist
              - No new factors
              - Engagement pattern steady
              action: Proactive intervention needed. Stability in risk is not the same as safety.
            worsening:
              definition: Composite risk score increased by 2+ points in last 14 days
              indicators:
              - New risk factors appearing
              - Existing risks escalating
              - Engagement declining
              action: Immediate review. If worsening for 2 consecutive periods, escalate to management.
          measurement:
            cadence: Assess risk trend at every pipeline review (minimum weekly)
            lookback: Compare current composite score to 14-day and 30-day prior
            visualization: Track as directional arrow (up/down/stable) alongside health score
        de_escalation:
          description: 'Risks should be downgraded when evidence supports improvement, not when time passes without new bad
            news. Absence of signal is not the same as resolution.

            '
          criteria:
            high_to_medium:
            - Customer re-engages with specific next steps and dates
            - Champion confirms budget is secured and timeline is intact
            - Competitive evaluation concluded in our favor (confirmed by customer)
            - New executive sponsor actively engaged in deal
            medium_to_low:
            - Root cause of risk is documented as resolved
            - Customer-confirmed milestone achieved
            - Engagement pattern returned to pre-risk baseline for 14+ days
            remove_risk:
            - Risk factor no longer applies (e.g., departing blocker left the organization)
            - Deal advanced past the stage where the risk was relevant
            - Customer explicitly addressed the concern in writing
          anti_patterns:
          - Never de-escalate because 'it's been a while since we heard bad news'
          - Never de-escalate based on seller optimism without customer evidence
          - Never de-escalate because a meeting went well without concrete outcomes
        mitigation_framework:
          description: 'Every risk must have a specific mitigation action. Generic "monitor closely" is not mitigation. Mitigation
            must change the trajectory.

            '
          mitigation_types:
            resolve:
              definition: Eliminate the risk factor entirely
              example: Budget risk resolved by economic buyer confirming allocation in writing
              when_to_use: When the root cause can be directly addressed
            transfer:
              definition: Shift responsibility for risk resolution to someone with more leverage
              example: Champion cannot access economic buyer, engage executive sponsor to facilitate
              when_to_use: When the AE lacks the access or authority to resolve directly
            mitigate:
              definition: Reduce the probability or impact of the risk
              example: Competitive threat mitigated by delivering a differentiated POC result
              when_to_use: When risk cannot be eliminated but can be contained
            accept:
              definition: Acknowledge the risk and proceed with awareness
              example: Procurement timeline is 6 weeks with no way to accelerate
              when_to_use: When risk is real but outside anyone's control. Document and plan accordingly.
          quality_rules:
          - Every mitigation must name a specific person who will take a specific action by a specific date
          - Mitigation that requires customer action must be confirmed with customer, not assumed
          - If mitigation is 'wait and see,' it is not mitigation. Reclassify as 'accept.'
          - Review mitigation effectiveness at next pipeline review. If risk persists, escalate approach.
    - path: references/hygiene-sla.yaml
      description: Paper process SLAs (legal, security, procurement), stale deal thresholds, hygiene scoring formula
      load_when: Running weekly hygiene checks or tracking paper process milestones
  autonomy:
    triggers:
    - type: parent_dispatch
      source: ae-agent
      description: AE orchestrator routes hygiene check requests
    - type: schedule
      cadence: weekly
      window: friday 16:00-17:00
      description: Weekly full hygiene run across all active opportunities
    - type: schedule
      cadence: daily
      window: 07:00-07:30
      description: Daily stale deal check for WARNING and CRITICAL thresholds
    - type: downstream
      source: ae-meeting-prep-agent
      condition: post_call_summary.generated == true
      payload_expected:
      - post_call_summary
      - crm_update_recommendations
      description: Post-call summaries trigger CRM field update checklists
    outputs:
    - type: parent_return
      target: ae-agent
      payload:
      - hygiene_report
      - stale_alerts
      - crm_checklist
      description: Hygiene results back to orchestrator
    - type: trigger_agent
      target: ae-deal-diagnosis-agent
      condition: stale_alert.level == CRITICAL
      payload:
      - stale_alert
      - opportunity_context
      description: Critically stale deal triggers full health diagnosis
    - type: trigger_agent
      target: ae-pipeline-mgmt-agent
      condition: hygiene_report.generated == true
      payload:
      - hygiene_report
      - pipeline_health_metrics
      description: Hygiene report feeds pipeline health and forecast accuracy
    - type: notify_human
      condition: stale_alert.level == CRITICAL OR hygiene_score.trend == declining
      channel: alert
      description: Critical stale deals and declining hygiene trends surface for AE review
    dependencies:
    - agent: ae-meeting-prep-agent
      toolbox: meeting-intelligence
      tools:
      - get-post-call-summary
      purpose: Latest meeting outcomes for CRM update accuracy
