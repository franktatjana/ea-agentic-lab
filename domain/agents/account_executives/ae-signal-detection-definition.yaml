# AE Commercial Signal Detection Agent
# Sub-agent of Account Executive Agent (ae-agent)
# Owns: budget signal scanning, competitive threat detection, expansion opportunities
#
# LICENSE: CC BY 4.0 — https://creativecommons.org/licenses/by/4.0/

agentspec_version: "26.1.0"
component_type: Agent

id: ae-signal-detection-agent
name: AE Signal Detection Agent
description: >
  Budget shifts, competitive mentions, and expansion hints hide in emails,
  Slack threads, and meeting notes. This agent surfaces those commercial
  signals before they become surprises, classifying severity and citing the
  exact source so the AE can act with confidence.

metadata:
  definition_version: "0.1.0"
  parent_agent: ae-agent
  tags:
    - budget-signals
    - competitive-threat
    - expansion
    - signal-detection
  responsibility: >
    Detect commercial signals early from customer communications and surface
    them with evidence, severity classification, and recommended actions.

system_prompt: |
  You are a Commercial Signal Detection Agent, part of the Account Executive
  intelligence system. Your job is to find commercial signals in communications.

  You MUST:
  - Scan communications for budget signals (availability, constraints, fiscal timing)
  - Detect competitive activity with threat level assessment
  - Identify upsell/cross-sell opportunities from usage and conversation signals
  - Classify signal severity with specific evidence
  - Write risk alerts for HIGH severity signals

  You MUST NOT:
  - Access CRM data directly (you work from communications content)
  - Diagnose deal health or stall causes (Deal Diagnosis Agent's domain)
  - Manage pipeline metrics (Pipeline Management Agent's domain)
  - Invent competitive positioning without explicit mention in source content
  - Assume budget amounts not explicitly stated

  Every signal you detect must cite the source (email, Slack, meeting notes)
  and the specific text that triggered detection.

human_in_the_loop: true

tools:
  - component_type: ClientTool
    id: read-communications
    name: Read Communications
    description: Access Slack threads, email content, and meeting notes for signal detection
    requires_confirmation: false
    inputs:
      - title: source_type
        type: string
      - title: account_name
        type: string
    outputs:
      - title: content
        type: string
    x-ea-agent:
      risk: low

  - component_type: ClientTool
    id: write-risk-alert
    name: Write Risk Alert
    description: Save commercial signal alert to InfoHub risk register
    requires_confirmation: true
    inputs:
      - title: risk
        type: object
      - title: destination_path
        type: string
    outputs:
      - title: status
        type: string
    x-ea-agent:
      risk: medium

  - component_type: ClientTool
    id: save-signal-intelligence
    name: Save Signal Intelligence
    description: Persist signal assessment to InfoHub, making results queryable via toolbox
    requires_confirmation: false
    inputs:
      - title: assessment
        type: object
      - title: account_name
        type: string
    outputs:
      - title: status
        type: string
    x-ea-agent:
      risk: low

  - component_type: ClientTool
    id: ask-user
    name: Ask User
    description: Request clarification from account executive about signal context
    requires_confirmation: false
    inputs:
      - title: question
        type: string
    outputs:
      - title: answer
        type: string
    x-ea-agent:
      risk: low

toolboxes:
  - component_type: Toolbox
    id: signal-intelligence
    name: Signal Intelligence
    description: Commercial signal data available to peer agents for deal context enrichment
    tools:
      - id: get-commercial-signals
        name: Get Commercial Signals
        description: Returns classified commercial signals (budget, competitive, expansion) for an account
        inputs:
          - title: account_name
            type: string
          - title: time_period
            type: string
        outputs:
          - title: signals
            type: array
      - id: get-risk-signals
        name: Get Risk Signals
        description: Returns risk-classified signals with severity and source citations
        inputs:
          - title: account_name
            type: string
        outputs:
          - title: risk_signals
            type: array
specialized_agents: []

flows:
  - component_type: Flow
    id: commercial-signal-detection
    name: Commercial Signal Detection
    description: Detect budget signals, competitive threats, and expansion opportunities from customer communications.
    inputs:
      - title: account_context
        type: object
      - title: time_period
        type: string
      - title: usage_patterns
        type: object
    outputs:
      - title: budget_signals
        type: object
      - title: competitive_assessment
        type: object
      - title: expansion_opportunities
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: ae-budget-signal-scan
          input: account_context, time_period
          tools: [read-communications]
          description: Extract budget availability, constraints, fiscal timing, approval processes
        - step: 2
          prompt: ae-competitive-threat
          input: account_context
          tools: [read-communications]
          description: Assess competitive activity, threat levels, differentiation, defensive actions
        - step: 3
          prompt: ae-expansion-opportunity
          input: account_context, usage_patterns
          tools: [read-communications]
          description: Identify upsell/cross-sell signals, value estimates, stakeholders to engage
        - step: 4
          action: persist
          tools: [save-signal-intelligence, write-risk-alert]
          condition: write-risk-alert triggers when signal.severity >= HIGH
          description: Save signal assessment to InfoHub, write risk alerts for HIGH severity signals

a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: "0.1"
    capabilities:
      - budget-signal-detection
      - competitive-threat-assessment
      - expansion-opportunity-detection
    input_modes:
      - text/plain
      - application/json
    output_modes:
      - application/json
      - text/markdown

x-ea-agent:

  prompt_registry:
    ae-budget-signal-scan:
      description: Identify budget-related signals in communications (availability, constraints, timing)
      source: prompts/tasks.yaml#commercial_signals.budget_signal_scan
      inputs:
        - title: account_name
          type: string
        - title: time_period
          type: string
      outputs:
        - title: budget_signals
          type: object

    ae-competitive-threat:
      description: Identify competitive activity in account with threat level assessment
      source: prompts/tasks.yaml#commercial_signals.competitive_threat
      inputs:
        - title: account_name
          type: string
      outputs:
        - title: competitive_assessment
          type: object

    ae-expansion-opportunity:
      description: Identify upsell and cross-sell opportunities from usage and conversation signals
      source: prompts/tasks.yaml#commercial_signals.expansion_opportunity
      inputs:
        - title: account_name
          type: string
      outputs:
        - title: expansion_opportunities
          type: object

  boundaries:
    - Communications scanning only, does not access CRM data directly
    - Does not diagnose deal health or manage pipeline metrics
    - Does not prepare meeting materials
    - Does not infer competitive positioning without explicit mention

  permissions:
    - Read all customer communications (email, Slack, meeting notes)
    - Detect and classify commercial signals by severity
    - Write signal-based risk alerts to InfoHub
    - Forward competitive mentions to CI Agent via parent orchestrator

  guardrails:
    input_validation:
      - Reject signal scans without specified time period or account context
      - Reject competitive assessment without communication sources to scan
    output_checks:
      - All signals must be traceable to specific source, date, and text excerpt
      - Threat levels must be justified by cited evidence
      - Expansion estimates must be conservative and stated as ranges
      - Severity classification must match reference criteria
    signal_validation:
      - Never assume budget amounts not explicitly mentioned
      - Never infer competitive positioning without explicit mention in source
      - Add [NEEDS VERIFICATION] when signal is ambiguous
      - Distinguish between confirmed and inferred signals in output

  knowledge:
    references:
      - name: Signal Detection
        description: Commercial risk keywords, severity indicators, competitive signals, budget patterns, compound signal patterns, contextual interpretation
        load_when: Scanning any customer communication content
        content:
          commercial_risks:
            keywords:
              - "budget review"
              - "decision delayed"
              - "approval pending"
              - "procurement process"
              - "legal review"
              - "contract negotiation"
              - "pricing concern"
              - "competitor evaluation"
              - "scope reduction"
            severity_indicators:
              high: ["deal at risk", "pulling out", "cancellation", "lost", "chose competitor"]
              medium: ["delayed", "postponed", "reviewing options", "budget cut"]
              low: ["clarification needed", "questions about pricing"]
          relationship_health:
            positive_signals:
              - "executive sponsor engaged"
              - "expansion discussed"
              - "reference customer"
              - "success story"
              - "champion identified"
            negative_signals:
              - "unresponsive"
              - "missed meetings"
              - "escalation"
              - "dissatisfaction"
              - "churn risk"
          pipeline_signals:
            stage_changes: ["moved to", "advanced to", "returned to", "stuck in"]
            timeline_mentions: ["close date", "signature expected", "Q1/Q2/Q3/Q4"]
            value_mentions: ["ARR", "ACV", "contract value", "expansion opportunity"]
          signal_patterns:
            description: >
              Individual keywords are weak signals. Pattern combinations produce
              reliable intelligence. Always evaluate signal clusters, not isolated words.
            compound_patterns:
              budget_risk:
                signals: ["budget review", "delayed", "declining response frequency"]
                interpretation: "Active budget threat, likely reallocation under consideration"
                confidence: "HIGH when 3+ signals co-occur within 14-day window"
                action: "Escalate to champion for internal budget status confirmation"
              competitive_displacement:
                signals: ["evaluating options", "competitor name mentioned", "new stakeholder introduced"]
                interpretation: "Active competitive evaluation, deal at risk of displacement"
                confidence: "HIGH when competitor is named, MEDIUM when implied"
                action: "Activate competitive response: differentiation, executive alignment, champion coaching"
              champion_erosion:
                signals: ["declining contact frequency", "shorter responses", "meeting cancellations"]
                interpretation: "Champion engagement weakening, may indicate internal pressure or loss of influence"
                confidence: "MEDIUM after 14 days, HIGH after 21 days of declining pattern"
                action: "Direct conversation with champion about changes, begin multi-threading"
              expansion_opportunity:
                signals: ["new team", "additional use cases", "other departments interested"]
                interpretation: "Organic expansion signal from successful adoption"
                confidence: "HIGH when stated by multiple stakeholders"
                action: "Map whitespace, prepare expansion proposal, engage additional stakeholders"
              stall_formation:
                signals: ["no stage movement", "contact frequency stable but no decisions", "repeated 'we need more time'"]
                interpretation: "Deal entering stall, likely internal blocker or competing priority"
                confidence: "MEDIUM at 21 days, HIGH at 30 days with no milestone progress"
                action: "Diagnose stall root cause, engage champion on internal dynamics"
              urgency_acceleration:
                signals: ["board meeting", "fiscal year end", "executive mandate", "compressed timelines"]
                interpretation: "Compelling event creating genuine urgency, deal may accelerate"
                confidence: "HIGH when event has a specific date"
                action: "Align close plan to compelling event, confirm with economic buyer"
          contextual_interpretation:
            description: >
              The same keyword means different things in different contexts.
              Always evaluate signals against the current deal stage, time of year,
              and relationship history before classifying.
            context_modifiers:
              fiscal_calendar:
                - signal: "budget review"
                  during_q4_planning: "Normal process, LOW severity"
                  during_active_deal: "Potential risk, MEDIUM severity"
                  after_verbal_commit: "Serious risk, HIGH severity"
                - signal: "delayed"
                  during_holidays: "Expected, reduce severity by one level"
                  during_active_evaluation: "Concerning, maintain severity"
                  post_decision: "Critical, escalate"
              deal_stage:
                - signal: "evaluating options"
                  in_discovery: "Normal buyer behavior, LOW severity"
                  in_proposal: "Competitive risk, MEDIUM severity"
                  in_negotiation: "Deal at risk, HIGH severity"
                - signal: "need to involve more people"
                  in_discovery: "Positive (access expanding), treat as buying signal"
                  in_negotiation: "Negative (decision process expanding), treat as stall risk"
              relationship_baseline:
                rule: "Measure change from established pattern, not absolute behavior"
                examples:
                  - "Weekly contact dropping to bi-weekly is a signal. Monthly contact staying monthly is not."
                  - "Short replies from a typically brief communicator are normal. From a previously detailed communicator, it's a risk signal."
          false_positives:
            description: >
              Not every keyword match is a real signal. These patterns commonly
              produce false positives that waste AE attention.
            common_false_positives:
              - pattern: "Budget mentioned in casual conversation"
                reality: "Customer discussing general business context, not signaling budget risk"
                filter: "Only flag budget signals when tied to specific deal or procurement action"
              - pattern: "Competitor name in industry discussion"
                reality: "Customer comparing industry landscape, not actively evaluating"
                filter: "Only flag when competitor is mentioned in context of evaluation, RFP, or feature comparison"
              - pattern: "Meeting rescheduled once"
                reality: "Normal calendar management"
                filter: "Only flag when pattern of 2+ reschedules or cancellations within 30 days"
              - pattern: "New stakeholder CC'd on email"
                reality: "May be FYI inclusion, not decision process expansion"
                filter: "Flag only when new stakeholder asks questions or takes actions in the deal"
              - pattern: "Response time slightly longer than usual"
                reality: "Travel, vacation, busy week"
                filter: "Measure over 14-day rolling average, not individual responses"
          signal_freshness:
            description: >
              Signals lose relevance over time. A competitive mention from 6 months
              ago is not equivalent to one from last week.
            decay_rules:
              - age: "0-7 days"
                weight: "100%, full relevance"
                label: "Current"
              - age: "8-21 days"
                weight: "75%, still actionable"
                label: "Recent"
              - age: "22-45 days"
                weight: "50%, context has likely shifted"
                label: "Aging"
              - age: "46-90 days"
                weight: "25%, historical context only"
                label: "Stale"
              - age: ">90 days"
                weight: "10%, background reference only"
                label: "Archived"
            refresh_triggers:
              - "New communication from the same stakeholder on the same topic refreshes the signal"
              - "Stage change resets all signal weights for the deal to current"
              - "Contradictory signal from a more senior stakeholder supersedes earlier signals"
      - path: references/competitive-displacement.yaml
        description: Incumbent analysis framework, competitive positioning strategies, FUD patterns to detect
        load_when: Detecting competitive activity or evaluating competitive threat severity

  autonomy:
    triggers:
      - type: parent_dispatch
        source: ae-agent
        description: AE orchestrator routes signal analysis requests
      - type: event
        source: communications_feed
        condition: new_communication.type IN [email, slack, meeting_notes]
        description: Auto-scans when new customer communications arrive
      - type: schedule
        cadence: daily
        window: 06:00-07:00
        description: Daily signal sweep across all active accounts
    outputs:
      - type: parent_return
        target: ae-agent
        payload: [budget_signals, competitive_assessment, expansion_opportunities]
        description: Full signal report back to orchestrator for aggregation
      - type: trigger_agent
        target: ae-deal-diagnosis-agent
        condition: competitive_threat.severity >= HIGH
        payload: [signal_assessment, threat_details, affected_opportunity]
        description: Competitive threat triggers automatic deal health reassessment
      - type: trigger_agent
        target: ae-stakeholder-agent
        condition: org_change_detected == true OR champion_risk_signals > 0
        payload: [signal_assessment, change_details, affected_contacts]
        description: Org changes or champion risk triggers relationship map update
      - type: trigger_agent
        target: ae-qualification-agent
        condition: new_pain_point_detected == true OR budget_signal.type == constraint
        payload: [signal_assessment, pain_details, budget_context]
        description: New pain points or budget constraints trigger re-qualification
      - type: notify_human
        condition: signal.severity == HIGH
        channel: alert
        description: HIGH severity signals surface immediately for AE review
    dependencies: []
