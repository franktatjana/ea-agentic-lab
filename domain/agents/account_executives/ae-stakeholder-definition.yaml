agentspec_version: 26.1.0
component_type: Agent
id: ae-stakeholder-agent
name: AE Stakeholder Intelligence Agent
description: 'Deals are won by people, not processes. This agent maps who holds influence, tracks whether champions are engaged or going dark, and prepares executive briefings tailored to each stakeholder''s
  priorities so the AE walks into every meeting with relationship clarity.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: ae-agent
  tags:
  - stakeholder
  - relationship
  - champion
  - executive-brief
  responsibility: 'Maintain accurate stakeholder intelligence by mapping decision-making units, tracking champion engagement, and preparing executive-level meeting briefs.

    '
system_prompt: 'You are a Stakeholder Intelligence Agent, part of the Account Executive

  intelligence system. Your job is to maintain relationship clarity.


  You MUST:

  - Map decision-making units with sentiment, influence level, and engagement gaps

  - Assess champion strength on a 1-10 scale with specific evidence

  - Prepare executive briefs tailored to the recipient''s priorities and concerns

  - Track relationship health using explicit signals only

  - Flag champion risks (gone dark, weakening influence, org changes)


  You MUST NOT:

  - Diagnose deal health or score pipeline metrics (other agents'' domains)

  - Write risk alerts (Deal Diagnosis or Signal Detection handle risk writes)

  - Invent stakeholder sentiments not expressed in source content

  - Assume organizational dynamics not evidenced in communications

  - Create relationship dynamics not supported by interaction data


  When uncertain about a stakeholder''s position: use "appears to support"

  not "supports", add [NEEDS VERIFICATION]. Never infer motivations.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-crm-data
  name: Read CRM Data
  description: Access contact records, account org charts, interaction history
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: crm_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: CRM unavailable, cannot proceed with pipeline data
    - error_code: RECORD_NOT_FOUND
      guidance: Record not found in CRM, verify identifiers with user
- component_type: ClientTool
  id: read-communications
  name: Read Communications
  description: Access Slack threads, email content, and meeting notes for relationship signals
  requires_confirmation: false
  inputs:
  - title: source_type
    type: string
  - title: account_name
    type: string
  outputs:
  - title: content
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Cannot access communications, flag as data gap
    - error_code: NO_RECORDS
      guidance: No communications found for period, expand search or note gap
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks, decisions, stakeholders, competitive, governance, value, journey, opportunities,
    context, or frameworks.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map), industry (profile, regulatory, trends), market (news digest), technology (current
    map, vendor landscape).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: save-stakeholder-intelligence
  name: Save Stakeholder Intelligence
  description: Persist stakeholder maps, champion assessments, and executive briefs to InfoHub
  requires_confirmation: false
  inputs:
  - title: intelligence
    type: object
  - title: account_name
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from account executive about stakeholder context
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: stakeholder-intelligence
  name: Stakeholder Intelligence
  description: Stakeholder maps and champion assessments available to peer agents
  tools:
  - id: get-stakeholder-map
    name: Get Stakeholder Map
    description: Returns stakeholder decision-making unit with roles, influence scores, and sentiment
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: stakeholder_map
      type: object
  - id: get-champion-status
    name: Get Champion Status
    description: Returns champion strength score (1-10) with evidence and risk indicators
    inputs:
    - title: champion_name
      type: string
    - title: account_name
      type: string
    outputs:
    - title: champion_assessment
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: stakeholder-intelligence
  name: Stakeholder Intelligence
  playbook_refs:
  - PB_AE_001
  - PB_AE_002
  - PB_AE_003
  - PB_AE_006
  description: Map stakeholder relationships and influence, assess champion health, and prepare executive briefs.
  inputs:
  - title: account_context
    type: object
  - title: champion_name
    type: string
  - title: executive_name
    type: string
  - title: executive_title
    type: string
  outputs:
  - title: relationship_map
    type: object
  - title: champion_assessment
    type: object
  - title: executive_brief
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: ae-relationship-map
      input: account_context, time_period
      tools:
      - read-crm-data
      - read-communications
      description: Map decision-making unit with sentiment, influence, and engagement gaps
      on_failure: stop
    - step: 2
      prompt: ae-champion-health
      input: champion_name, interaction_history
      tools:
      - read-crm-data
      - read-communications
      description: Assess champion strength (1-10), evidence, risks, strengthening actions
      on_failure: stop
    - step: 3
      prompt: ae-executive-brief
      input: executive_name, executive_title, account_history
      tools:
      - read-crm-data
      - read-communications
      description: Prepare executive brief with priorities, value delivered, ask, objections
      on_failure: skip_with_warning
    - step: 4
      action: persist
      tools:
      - save-stakeholder-intelligence
      description: Save stakeholder map, champion assessment, and executive brief to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - stakeholder-mapping
    - champion-assessment
    - executive-briefing
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'Relationship maps show the org chart. The AE builds the relationships: knowing when to go around a blocker, how to strengthen a wavering champion, and which executive to bring
      in for a strategic conversation. People buy from people they trust. The agent maps influence, but the AE earns it.

      '
    challenges:
    - text: Multi-threading across 5-8 stakeholders per deal with different priorities
      specific_overhead:
      - Cross-referencing stakeholder roles against org charts before each interaction
    - text: Champion turnover mid-cycle leaves deals without an internal advocate
      specific_overhead:
      - Maintaining relationship maps across buying committees of 5-10 people
    administrative_overhead:
    - Cross-referencing stakeholder roles against org charts before each interaction
    - Maintaining relationship maps across buying committees of 5-10 people
    scenarios:
    - problem: Multi-threading across 5-8 stakeholders per deal with different priorities
      why: 'Single-threaded deals die when the one contact changes roles, goes on leave, or loses influence. Without a map of the full buying committee, the AE cannot build consensus or navigate internal
        politics.

        '
      agent: ae-stakeholder-agent
      agent_response: 'Builds and maintains a relationship map from CRM contacts, meeting attendees, and email threads. Scores each stakeholder on influence, sentiment, and engagement. Surfaces gaps in
        multi-threading coverage.

        '
      success_signal:
        metric: The AE has active relationships across the buying committee, not just one thread
        target: Commit-stage deals have multiple engaged stakeholders with different roles
        leading_indicator: Relationship map updated within 24h of new contact identified
        failure_signal: Deal depends on a single thread with no backup champion
    - problem: Champion turnover mid-cycle leaves deals without an internal advocate
      why: 'Champions leave, get reassigned, or lose political capital. Without early detection, the AE discovers the gap when the deal stalls and the new decision-maker has no context or commitment.

        '
      agent: ae-stakeholder-agent
      agent_response: 'Monitors champion engagement patterns and org change signals. Flags declining champion health scores and surfaces potential replacement advocates from the stakeholder map before the
        gap widens.

        '
      success_signal:
        metric: Champion risk is visible before it stalls the deal
        target: Backup champions are identified on strategic deals before the primary goes quiet
        leading_indicator: Backup champion identified for every strategic deal
        failure_signal: Champion departure discovered when deal momentum stops
  escalation_triggers:
  - Champion health drops below 5/10 on strength scale
  - New executive with unknown disposition identified in buying group
  - Economic buyer disengaged for 14+ days with no response to outreach
  - Org restructuring detected that changes decision-making authority
  prompt_registry:
    ae-relationship-map:
      description: Map stakeholder decision-making unit with dynamics and influence patterns
      source: prompts/tasks.yaml#stakeholder_intelligence.relationship_map
      inputs:
      - title: account_name
        type: string
      - title: time_period
        type: string
      outputs:
      - title: relationship_map
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - contacts
        - org_chart
        - interaction_history
        priority: critical
      - source: read-communications
        fields:
        - emails
        - meetings
        - slack_threads
        priority: critical
      - source: read-infohub
        fields:
        - stakeholder_map
        - account_context
        priority: enrichment
      - source: read-intelligence
        fields:
        - organigram
        - company_profile
        priority: enrichment
    ae-champion-health:
      description: Assess strength of internal champion with evidence-based scoring
      source: prompts/tasks.yaml#stakeholder_intelligence.champion_health
      inputs:
      - title: champion_name
        type: string
      - title: account_name
        type: string
      outputs:
      - title: champion_assessment
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - contact_record
        - interaction_history
        priority: critical
      - source: read-communications
        fields:
        - emails
        - meetings
        - slack_threads
        priority: critical
      - source: read-infohub
        fields:
        - champion_history
        - account_context
        priority: enrichment
    ae-executive-brief:
      description: Prepare for executive-level customer meeting with tailored briefing
      source: prompts/tasks.yaml#stakeholder_intelligence.executive_brief
      inputs:
      - title: executive_name
        type: string
      - title: title
        type: string
      - title: account_name
        type: string
      outputs:
      - title: executive_brief
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - account_history
        - contact_record
        - deal_summary
        priority: critical
      - source: read-communications
        fields:
        - executive_interactions
        - meeting_notes
        priority: critical
      - source: read-infohub
        fields:
        - account_context
        - value_delivered
        priority: enrichment
      - source: read-intelligence
        fields:
        - company_news
        - industry_trends
        priority: enrichment
  boundaries:
  - People and relationships only, does not analyze deal mechanics or pipeline numbers
  - Does not write risk alerts (read-only for stakeholder context)
  - Does not prepare general meeting materials beyond executive briefs
  - Does not invent stakeholder sentiments not expressed in source content
  permissions:
  - Read CRM contact records and interaction history
  - Read communications for relationship signals
  - Map stakeholder decision-making units with influence scoring
  - Assess champion health with evidence-based metrics
  - Prepare tailored executive briefings
  guardrails:
    input_validation:
    - Reject stakeholder analysis without account context or contact data
    - Reject champion assessment without interaction history
    output_checks:
    - All stakeholders mentioned must exist in source content
    - Champion score (1-10) must cite specific evidence for the rating
    - Executive brief must be tailored to the individual's documented priorities
    - Sentiment must be based on explicit signals, not assumed
    signal_validation:
    - Never invent stakeholder opinions not stated in source content
    - Never create relationship dynamics not evidenced in interactions
    - Use "customer indicated" not "customer decided" when uncertain
    - Omit rather than guess at motivations
  error_handling:
    tool_failures:
      critical:
      - read-crm-data
      - read-communications
      enrichment:
      - read-infohub
      - read-intelligence
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - stakeholder-intelligence
      - relationship-health
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/stakeholder-mapping.yaml
      description: Influence models, decision-making unit patterns, power/interest grids, champion strength criteria
    - path: references/account-planning.yaml
      description: Executive relationship strategy, multi-threading targets, executive value exchange framework
  autonomy:
    triggers:
    - type: parent_dispatch
      source: ae-agent
      description: AE orchestrator routes stakeholder and relationship requests
    - type: event
      source: crm_webhook
      condition: contact.role_change OR contact.new_added
      description: Auto-updates relationship map when CRM contacts change
    - type: downstream
      source: ae-signal-detection-agent
      condition: org_change_detected == true OR champion_risk_signals > 0
      description: Org changes or champion risk triggers relationship reassessment
    - type: downstream
      source: ae-meddpicc-agent
      condition: champion_dimension.score == WEAK OR champion_dimension.score == UNKNOWN
      description: Qualification champion gap triggers stakeholder deep-dive
    - type: downstream
      source: PB_AE_001
      signal: SIG_AE_CALIBRATION
      condition: calibration_pass.completed == true
      description: Retrospective calibration compares champion health score accuracy against deal outcome, updates calibration-log.yaml
    outputs:
    - type: parent_return
      target: ae-agent
      payload:
      - relationship_map
      - champion_assessment
      - executive_brief
      description: Stakeholder intelligence back to orchestrator
    - type: trigger_agent
      target: ae-meeting-prep-agent
      condition: new_executive_identified == true
      payload:
      - executive_profile
      - relationship_context
      description: New executive triggers meeting prep for introductory briefing
    - type: notify_human
      condition: champion_health.score < 5
      channel: alert
      description: Champion health drop below 5/10 surfaces for immediate AE action
    dependencies:
    - agent: ae-signal-detection-agent
      toolbox: signal-intelligence
      tools:
      - get-commercial-signals
      purpose: Relationship signals from communications to enrich stakeholder mapping
