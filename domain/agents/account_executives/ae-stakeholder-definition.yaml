agentspec_version: 26.1.0
component_type: Agent
id: ae-stakeholder-agent
name: AE Stakeholder Intelligence Agent
description: 'Deals are won by people, not processes. This agent maps who holds influence, tracks whether champions are engaged
  or going dark, and prepares executive briefings tailored to each stakeholder''s priorities so the AE walks into every meeting
  with relationship clarity.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: ae-agent
  tags:
  - stakeholder
  - relationship
  - champion
  - executive-brief
  responsibility: 'Maintain accurate stakeholder intelligence by mapping decision-making units, tracking champion engagement,
    and preparing executive-level meeting briefs.

    '
system_prompt: 'You are a Stakeholder Intelligence Agent, part of the Account Executive

  intelligence system. Your job is to maintain relationship clarity.


  You MUST:

  - Map decision-making units with sentiment, influence level, and engagement gaps

  - Assess champion strength on a 1-10 scale with specific evidence

  - Prepare executive briefs tailored to the recipient''s priorities and concerns

  - Track relationship health using explicit signals only

  - Flag champion risks (gone dark, weakening influence, org changes)


  You MUST NOT:

  - Diagnose deal health or score pipeline metrics (other agents'' domains)

  - Write risk alerts (Deal Diagnosis or Signal Detection handle risk writes)

  - Invent stakeholder sentiments not expressed in source content

  - Assume organizational dynamics not evidenced in communications

  - Create relationship dynamics not supported by interaction data


  When uncertain about a stakeholder''s position: use "appears to support"

  not "supports", add [NEEDS VERIFICATION]. Never infer motivations.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-crm-data
  name: Read CRM Data
  description: Access contact records, account org charts, interaction history
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: crm_data
    type: object
  x-ea-agent:
    risk: low
- component_type: ClientTool
  id: read-communications
  name: Read Communications
  description: Access Slack threads, email content, and meeting notes for relationship signals
  requires_confirmation: false
  inputs:
  - title: source_type
    type: string
  - title: account_name
    type: string
  outputs:
  - title: content
    type: string
  x-ea-agent:
    risk: low
- component_type: ClientTool
  id: save-stakeholder-intelligence
  name: Save Stakeholder Intelligence
  description: Persist stakeholder maps, champion assessments, and executive briefs to InfoHub
  requires_confirmation: false
  inputs:
  - title: intelligence
    type: object
  - title: account_name
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: low
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from account executive about stakeholder context
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
toolboxes:
- component_type: Toolbox
  id: stakeholder-intelligence
  name: Stakeholder Intelligence
  description: Stakeholder maps and champion assessments available to peer agents
  tools:
  - id: get-stakeholder-map
    name: Get Stakeholder Map
    description: Returns stakeholder decision-making unit with roles, influence scores, and sentiment
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: stakeholder_map
      type: object
  - id: get-champion-status
    name: Get Champion Status
    description: Returns champion strength score (1-10) with evidence and risk indicators
    inputs:
    - title: champion_name
      type: string
    - title: account_name
      type: string
    outputs:
    - title: champion_assessment
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: stakeholder-intelligence
  name: Stakeholder Intelligence
  description: Map stakeholder relationships and influence, assess champion health, and prepare executive briefs.
  inputs:
  - title: account_context
    type: object
  - title: champion_name
    type: string
  - title: executive_name
    type: string
  - title: executive_title
    type: string
  outputs:
  - title: relationship_map
    type: object
  - title: champion_assessment
    type: object
  - title: executive_brief
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: ae-relationship-map
      input: account_context, time_period
      tools:
      - read-crm-data
      - read-communications
      description: Map decision-making unit with sentiment, influence, and engagement gaps
    - step: 2
      prompt: ae-champion-health
      input: champion_name, interaction_history
      tools:
      - read-crm-data
      - read-communications
      description: Assess champion strength (1-10), evidence, risks, strengthening actions
    - step: 3
      prompt: ae-executive-brief
      input: executive_name, executive_title, account_history
      tools:
      - read-crm-data
      - read-communications
      description: Prepare executive brief with priorities, value delivered, ask, objections
    - step: 4
      action: persist
      tools:
      - save-stakeholder-intelligence
      description: Save stakeholder map, champion assessment, and executive brief to InfoHub
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - stakeholder-mapping
    - champion-assessment
    - executive-briefing
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  prompt_registry:
    ae-relationship-map:
      description: Map stakeholder decision-making unit with dynamics and influence patterns
      source: prompts/tasks.yaml#stakeholder_intelligence.relationship_map
      inputs:
      - title: account_name
        type: string
      - title: time_period
        type: string
      outputs:
      - title: relationship_map
        type: object
    ae-champion-health:
      description: Assess strength of internal champion with evidence-based scoring
      source: prompts/tasks.yaml#stakeholder_intelligence.champion_health
      inputs:
      - title: champion_name
        type: string
      - title: account_name
        type: string
      outputs:
      - title: champion_assessment
        type: object
    ae-executive-brief:
      description: Prepare for executive-level customer meeting with tailored briefing
      source: prompts/tasks.yaml#stakeholder_intelligence.executive_brief
      inputs:
      - title: executive_name
        type: string
      - title: title
        type: string
      - title: account_name
        type: string
      outputs:
      - title: executive_brief
        type: object
  boundaries:
  - People and relationships only, does not analyze deal mechanics or pipeline numbers
  - Does not write risk alerts (read-only for stakeholder context)
  - Does not prepare general meeting materials beyond executive briefs
  - Does not invent stakeholder sentiments not expressed in source content
  permissions:
  - Read CRM contact records and interaction history
  - Read communications for relationship signals
  - Map stakeholder decision-making units with influence scoring
  - Assess champion health with evidence-based metrics
  - Prepare tailored executive briefings
  guardrails:
    input_validation:
    - Reject stakeholder analysis without account context or contact data
    - Reject champion assessment without interaction history
    output_checks:
    - All stakeholders mentioned must exist in source content
    - Champion score (1-10) must cite specific evidence for the rating
    - Executive brief must be tailored to the individual's documented priorities
    - Sentiment must be based on explicit signals, not assumed
    signal_validation:
    - Never invent stakeholder opinions not stated in source content
    - Never create relationship dynamics not evidenced in interactions
    - Use "customer indicated" not "customer decided" when uncertain
    - Omit rather than guess at motivations
  knowledge:
    references:
    - name: Signal Detection
      description: Relationship health signals, engagement patterns, champion indicators
      load_when: Analyzing stakeholder interactions or assessing champion health
      content:
        commercial_risks:
          keywords:
          - budget review
          - decision delayed
          - approval pending
          - procurement process
          - legal review
          - contract negotiation
          - pricing concern
          - competitor evaluation
          - scope reduction
          severity_indicators:
            high:
            - deal at risk
            - pulling out
            - cancellation
            - lost
            - chose competitor
            medium:
            - delayed
            - postponed
            - reviewing options
            - budget cut
            low:
            - clarification needed
            - questions about pricing
        relationship_health:
          positive_signals:
          - executive sponsor engaged
          - expansion discussed
          - reference customer
          - success story
          - champion identified
          negative_signals:
          - unresponsive
          - missed meetings
          - escalation
          - dissatisfaction
          - churn risk
        pipeline_signals:
          stage_changes:
          - moved to
          - advanced to
          - returned to
          - stuck in
          timeline_mentions:
          - close date
          - signature expected
          - Q1/Q2/Q3/Q4
          value_mentions:
          - ARR
          - ACV
          - contract value
          - expansion opportunity
        signal_patterns:
          description: 'Individual keywords are weak signals. Pattern combinations produce reliable intelligence. Always evaluate
            signal clusters, not isolated words.

            '
          compound_patterns:
            budget_risk:
              signals:
              - budget review
              - delayed
              - declining response frequency
              interpretation: Active budget threat, likely reallocation under consideration
              confidence: HIGH when 3+ signals co-occur within 14-day window
              action: Escalate to champion for internal budget status confirmation
            competitive_displacement:
              signals:
              - evaluating options
              - competitor name mentioned
              - new stakeholder introduced
              interpretation: Active competitive evaluation, deal at risk of displacement
              confidence: HIGH when competitor is named, MEDIUM when implied
              action: 'Activate competitive response: differentiation, executive alignment, champion coaching'
            champion_erosion:
              signals:
              - declining contact frequency
              - shorter responses
              - meeting cancellations
              interpretation: Champion engagement weakening, may indicate internal pressure or loss of influence
              confidence: MEDIUM after 14 days, HIGH after 21 days of declining pattern
              action: Direct conversation with champion about changes, begin multi-threading
            expansion_opportunity:
              signals:
              - new team
              - additional use cases
              - other departments interested
              interpretation: Organic expansion signal from successful adoption
              confidence: HIGH when stated by multiple stakeholders
              action: Map whitespace, prepare expansion proposal, engage additional stakeholders
            stall_formation:
              signals:
              - no stage movement
              - contact frequency stable but no decisions
              - repeated 'we need more time'
              interpretation: Deal entering stall, likely internal blocker or competing priority
              confidence: MEDIUM at 21 days, HIGH at 30 days with no milestone progress
              action: Diagnose stall root cause, engage champion on internal dynamics
            urgency_acceleration:
              signals:
              - board meeting
              - fiscal year end
              - executive mandate
              - compressed timelines
              interpretation: Compelling event creating genuine urgency, deal may accelerate
              confidence: HIGH when event has a specific date
              action: Align close plan to compelling event, confirm with economic buyer
        contextual_interpretation:
          description: 'The same keyword means different things in different contexts. Always evaluate signals against the
            current deal stage, time of year, and relationship history before classifying.

            '
          context_modifiers:
            fiscal_calendar:
            - signal: budget review
              during_q4_planning: Normal process, LOW severity
              during_active_deal: Potential risk, MEDIUM severity
              after_verbal_commit: Serious risk, HIGH severity
            - signal: delayed
              during_holidays: Expected, reduce severity by one level
              during_active_evaluation: Concerning, maintain severity
              post_decision: Critical, escalate
            deal_stage:
            - signal: evaluating options
              in_discovery: Normal buyer behavior, LOW severity
              in_proposal: Competitive risk, MEDIUM severity
              in_negotiation: Deal at risk, HIGH severity
            - signal: need to involve more people
              in_discovery: Positive (access expanding), treat as buying signal
              in_negotiation: Negative (decision process expanding), treat as stall risk
            relationship_baseline:
              rule: Measure change from established pattern, not absolute behavior
              examples:
              - Weekly contact dropping to bi-weekly is a signal. Monthly contact staying monthly is not.
              - Short replies from a typically brief communicator are normal. From a previously detailed communicator, it's
                a risk signal.
        false_positives:
          description: 'Not every keyword match is a real signal. These patterns commonly produce false positives that waste
            AE attention.

            '
          common_false_positives:
          - pattern: Budget mentioned in casual conversation
            reality: Customer discussing general business context, not signaling budget risk
            filter: Only flag budget signals when tied to specific deal or procurement action
          - pattern: Competitor name in industry discussion
            reality: Customer comparing industry landscape, not actively evaluating
            filter: Only flag when competitor is mentioned in context of evaluation, RFP, or feature comparison
          - pattern: Meeting rescheduled once
            reality: Normal calendar management
            filter: Only flag when pattern of 2+ reschedules or cancellations within 30 days
          - pattern: New stakeholder CC'd on email
            reality: May be FYI inclusion, not decision process expansion
            filter: Flag only when new stakeholder asks questions or takes actions in the deal
          - pattern: Response time slightly longer than usual
            reality: Travel, vacation, busy week
            filter: Measure over 14-day rolling average, not individual responses
        signal_freshness:
          description: 'Signals lose relevance over time. A competitive mention from 6 months ago is not equivalent to one
            from last week.

            '
          decay_rules:
          - age: 0-7 days
            weight: 100%, full relevance
            label: Current
          - age: 8-21 days
            weight: 75%, still actionable
            label: Recent
          - age: 22-45 days
            weight: 50%, context has likely shifted
            label: Aging
          - age: 46-90 days
            weight: 25%, historical context only
            label: Stale
          - age: '>90 days'
            weight: 10%, background reference only
            label: Archived
          refresh_triggers:
          - New communication from the same stakeholder on the same topic refreshes the signal
          - Stage change resets all signal weights for the deal to current
          - Contradictory signal from a more senior stakeholder supersedes earlier signals
    - path: references/stakeholder-mapping.yaml
      description: Influence models, decision-making unit patterns, power/interest grids, champion strength criteria
      load_when: Mapping stakeholder relationships or scoring champion engagement
    - path: references/account-planning.yaml
      description: Executive relationship strategy, multi-threading targets, executive value exchange framework
      load_when: Planning executive engagement, assessing multi-threading health, or building relationship strategy
  autonomy:
    triggers:
    - type: parent_dispatch
      source: ae-agent
      description: AE orchestrator routes stakeholder and relationship requests
    - type: event
      source: crm_webhook
      condition: contact.role_change OR contact.new_added
      description: Auto-updates relationship map when CRM contacts change
    - type: downstream
      source: ae-signal-detection-agent
      condition: org_change_detected == true OR champion_risk_signals > 0
      description: Org changes or champion risk triggers relationship reassessment
    - type: downstream
      source: ae-qualification-agent
      condition: champion_dimension.score == WEAK OR champion_dimension.score == UNKNOWN
      description: Qualification champion gap triggers stakeholder deep-dive
    outputs:
    - type: parent_return
      target: ae-agent
      payload:
      - relationship_map
      - champion_assessment
      - executive_brief
      description: Stakeholder intelligence back to orchestrator
    - type: trigger_agent
      target: ae-meeting-prep-agent
      condition: new_executive_identified == true
      payload:
      - executive_profile
      - relationship_context
      description: New executive triggers meeting prep for introductory briefing
    - type: notify_human
      condition: champion_health.score < 5
      channel: alert
      description: Champion health drop below 5/10 surfaces for immediate AE action
    dependencies:
    - agent: ae-signal-detection-agent
      toolbox: signal-intelligence
      tools:
      - get-commercial-signals
      purpose: Relationship signals from communications to enrich stakeholder mapping
