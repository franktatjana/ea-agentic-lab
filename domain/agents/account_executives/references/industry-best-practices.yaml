reference_id: REF_AE_BP_001
name: AE Industry Best Practices
description: >
  Industry best practices for AI-assisted Account Executive operations,
  sourced from analyst firms, methodology vendors, and platform providers.
  Used to validate AE agent capabilities against market expectations.
version: 1.0.0
last_audited: 2026-03-21
audit_cadence: quarterly

sources:
  analyst_firms:
    - name: Gartner
      findings:
        - title: AI Agents Will Outnumber Sellers 10x by 2028
          relevance: Seller-side agents will negotiate with buyer-side procurement agents
          gap: No buyer-side AI agent interaction pattern
          priority: low
          rationale: Emerging capability, not yet table stakes
        - title: 90% of B2B Buying AI-Agent Intermediated by 2028
          relevance: $15T in B2B purchases through agent exchanges
          gap: No agent-to-agent commerce protocol
          priority: low
        - title: 75% of Buyers Prefer Human Interaction by 2030
          relevance: Validates human-in-the-loop design, agent augments not replaces
          gap: none
          status: already_aligned

    - name: Forrester
      findings:
        - title: Ungoverned GenAI Costs B2B $10B+ in Enterprise Value
          relevance: Guardrails must cover compliance and legal, not just accuracy
          gap: Guardrails focus on data accuracy, not regulatory compliance of AI-generated communications
          priority: medium

    - name: McKinsey
      findings:
        - title: State of AI 2025, Revenue Impact Highest in Sales
          relevance: Validates domain choice, sales is highest-ROI AI application
          gap: none
          status: already_aligned

    - name: HBR
      findings:
        - title: "How Successful Sales Teams Are Embracing Agentic AI (Sep 2025)"
          relevance: New metrics needed for agent-augmented selling
          gap: No agent performance self-monitoring (hallucination rates, quality scores, handover effectiveness)
          priority: low

  methodology_vendors:
    - name: Force Management
      findings:
        - title: Ascender AI, Methodology-Specific Real-Time Coaching
          relevance: Coaching adapts to individual AE learning history, not generic
          gap: MEDDPICC agent treats all AEs identically, no personalized skill gap coaching
          priority: low

    - name: Winning by Design
      findings:
        - title: SPICED Autopilot, Automated Methodology Tracking
          relevance: Agent auto-populates qualification fields from conversation data
          gap: Agent requires structured CRM input rather than extracting evidence from transcripts
          priority: medium

    - name: MEDDICC.com / Spotlight.ai
      findings:
        - title: Evidence-Based Qualification from Conversations
          relevance: 3.3-3.8x win rate improvement with autonomous qualification from call data
          gap: Qualification from CRM data, not raw conversation transcripts
          priority: high

  platform_providers:
    - name: Gong
      findings:
        - title: Conversation Intelligence, 300+ Signal Types
          relevance: Talk-time ratios, question depth, champion behavioral signals from calls
          gap: No conversation analytics capability, signal detection works from CRM not transcripts
          priority: high
        - title: Champion Identification Through Behavioral Signals
          relevance: Response timing, message depth, internal forwarding, meeting engagement
          gap: Stakeholder Intelligence maps relationships but lacks conversation-level behavioral analysis
          priority: high
        - title: Multi-Threading Boosts Win Rates 130%
          relevance: Prescriptive engagement sequencing based on deal stage patterns
          gap: Maps stakeholders but does not prescribe which to engage next, in what order, via which channel
          priority: medium

    - name: Clari
      findings:
        - title: Revenue Cadences as First-Class Objects
          relevance: Structured recurring workflows enforce operational rigor
          gap: No revenue cadences (weekly pipeline review, monthly forecast call, quarterly account review)
          priority: high
        - title: 98% Forecast Accuracy by Week 2
          relevance: Unified data context from CRM, email, calls, marketing
          gap: Pipeline Management works from CRM data, not unified cross-channel context
          priority: medium

    - name: Outreach
      findings:
        - title: Multichannel Sequence Orchestration
          relevance: Email + phone + social + SMS with conditional branching
          gap: Pipeline Generation handles outbound but lacks coordinated multi-channel cadence management
          priority: medium

    - name: Salesforce Agentforce
      findings:
        - title: Composable Action Libraries
          relevance: Reusable action primitives chained into workflows
          gap: none
          status: already_aligned
          note: Domain model's prompt + tool building blocks match this pattern

    - name: Microsoft Copilot for Sales
      findings:
        - title: Unified Conversational Interface (Sales Chat)
          relevance: Single interface surfaces insights proactively
          gap: Routing implies user must know which capability to request
          priority: low

  emerging_patterns:
    - name: Digital Sales Rooms / Mutual Action Plans
      findings:
        - title: AI-Powered Buyer-Seller Collaboration Layer
          relevance: 500% buyer engagement increase, 30% shorter cycles, 15% higher win rates
          gap: Deal management is internal only, no shared buyer-facing workspace
          priority: medium

    - name: Automated Battle Card Generation
      findings:
        - title: AI-Maintained Competitive Response Artifacts
          relevance: 65% of reps report outdated battlecards, 8-15h/week manual maintenance
          gap: Signal Detection detects competitive threats but does not produce battle card artifacts
          priority: medium

    - name: Real-Time In-Call Coaching
      findings:
        - title: Live Call Guidance with Contextual Cards
          relevance: 24% higher win rates with real-time coaching
          gap: Meeting Preparation is pre-call only, no in-call guidance
          priority: high
          note: Requires fundamentally different interaction pattern (streaming analysis)

gap_summary:
  high:
    - Conversation analytics / transcript intelligence (Signal Detection + Stakeholder)
    - Real-time in-call coaching (Meeting Preparation)
    - Revenue cadences as structured recurring workflows (Pipeline Management)
    - Evidence-based qualification from conversations, not CRM forms (MEDDPICC)

  medium:
    - Automated battle card generation and maintenance (Signal Detection)
    - Buyer-facing mutual action plans / digital sales rooms (Deal Diagnosis)
    - Multichannel sequence orchestration (Pipeline Generation)
    - Prescriptive multi-threading recommendations (Stakeholder Intelligence)
    - Automated methodology field population from transcripts (MEDDPICC / Hygiene)
    - Regulatory compliance guardrails for AI-generated communications (Guardrails)

  low:
    - Buyer-side AI agent interaction (Architecture, emerging by 2028)
    - Agent self-monitoring / hallucination detection (Architecture)
    - Personalized coaching per AE skill profile (MEDDPICC)
    - Unified conversational interface (Architecture)
