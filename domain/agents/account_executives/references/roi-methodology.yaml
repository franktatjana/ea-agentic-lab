# AE ROI / Business Case Methodology - Domain Knowledge
# Referenced by: ae-meeting-prep-definition.yaml, ae-pipeline-mgmt-definition.yaml

business_case_principles:
  - "The customer builds the business case, you help them with data and structure. A seller-built business case has less internal credibility."
  - "ROI must be grounded in the customer's own numbers, not industry benchmarks alone. Ask for their data."
  - "Conservative estimates are more credible than optimistic projections. Under-promise, over-deliver."
  - "Every business case must answer: what changes, what it costs, what it returns, and when."
  - "The economic buyer cares about payback period and risk. The CFO cares about cash flow timing. Tailor accordingly."

# ==============================================================================
# ROI MODEL STRUCTURE
# ==============================================================================

roi_model:
  description: >
    A structured approach to calculating return on investment. The model
    should be simple enough for the champion to present internally and
    rigorous enough for the CFO to validate.

  components:
    investment:
      definition: "Total cost of the solution over the evaluation period"
      line_items:
        - "Software licensing (annual or multi-year)"
        - "Implementation and professional services"
        - "Internal resource allocation for deployment"
        - "Training and change management"
        - "Integration development (if required)"
        - "Data migration costs"
      rules:
        - "Include all costs, not just the license. Hidden costs destroy credibility."
        - "Use the customer's loaded cost rate for internal resources, not just salary"
        - "If implementation is phased, show investment by phase"

    returns:
      definition: "Quantified benefits over the same evaluation period"
      categories:
        hard_savings:
          definition: "Direct cost reductions that appear on the P&L"
          examples:
            - "Headcount reduction or reallocation (hours saved * loaded cost)"
            - "Tool consolidation (licenses retired)"
            - "Infrastructure cost reduction"
            - "Reduced error rates and rework costs"
          credibility: "Highest. CFO can verify against budget."

        productivity_gains:
          definition: "Time saved that enables higher-value work"
          examples:
            - "Hours saved per process per week * number of affected employees"
            - "Faster time-to-completion for key workflows"
            - "Reduced context switching and manual data entry"
          credibility: "Medium. Requires assumption about what people do with saved time."

        revenue_impact:
          definition: "Revenue enabled or accelerated by the solution"
          examples:
            - "Faster sales cycles increasing quarterly deal volume"
            - "Improved win rates from better qualification"
            - "Expansion revenue from better customer visibility"
            - "Reduced churn preserving existing revenue"
          credibility: "Lower. Harder to attribute directly. Use conservative multipliers."

        risk_avoidance:
          definition: "Costs avoided by mitigating specific risks"
          examples:
            - "Regulatory compliance fines avoided"
            - "Security breach cost avoidance (probability * impact)"
            - "Business continuity: revenue protected during outage scenarios"
          credibility: "Variable. Strong when regulatory, weak when speculative."

  calculation:
    roi_formula: "(Total Returns - Total Investment) / Total Investment * 100"
    payback_period: "Month in which cumulative returns exceed cumulative investment"
    net_present_value: "Discount future returns at customer's cost of capital (typically 8-12%)"
    evaluation_period: "Typically 3 years for enterprise software. Match to contract term."

# ==============================================================================
# TCO COMPARISON
# ==============================================================================

tco_comparison:
  description: >
    Total Cost of Ownership compares the full cost of the proposed solution
    against the full cost of the status quo or a competing alternative.

  status_quo_costs:
    visible:
      - "Current tool licensing fees"
      - "Support and maintenance contracts"
      - "Infrastructure costs (hosting, storage)"
    hidden:
      - "Manual workaround labor (hours/week * loaded cost * 52 weeks)"
      - "Error correction and rework (defect rate * cost per correction)"
      - "Opportunity cost of delayed processes"
      - "Integration maintenance across disconnected systems"
      - "Training cost for complex or outdated tools"
      - "Employee frustration and turnover cost (harder to quantify, include qualitatively)"

  comparison_rules:
    - "Compare over the same time period (3 years is standard for enterprise)"
    - "Include implementation costs for the new solution, but also the ongoing hidden costs of the status quo"
    - "Use the customer's own cost data wherever possible, supplement with industry benchmarks only when needed"
    - "Explicitly state assumptions and allow the customer to adjust them"
    - "Show the crossover point: when does the new solution become cheaper than the status quo?"

# ==============================================================================
# BUSINESS CASE DOCUMENT
# ==============================================================================

business_case_format:
  description: >
    Structure the business case as a document the champion can present
    to the economic buyer and finance team without the seller present.

  sections:
    - section: "Executive Summary"
      content: "One paragraph: problem, solution, investment, return, payback period"
      length: "3-5 sentences"

    - section: "Business Problem"
      content: "Quantified description of the current pain with impact on the business"
      sources: "Discovery data, customer-provided metrics, operational observations"

    - section: "Proposed Solution"
      content: "What changes and how it addresses the business problem"
      rule: "Focus on outcomes, not features. The buyer cares what it does, not how it works."

    - section: "Investment Required"
      content: "Total cost broken down by category with timeline"
      format: "Table showing Year 1, Year 2, Year 3 costs"

    - section: "Expected Returns"
      content: "Quantified benefits by category with assumptions stated"
      format: "Table showing hard savings, productivity gains, revenue impact, risk avoidance"

    - section: "ROI Summary"
      content: "ROI percentage, payback period, NPV"
      visualization: "Graph showing cumulative investment vs cumulative returns over time"

    - section: "Risk Mitigation"
      content: "How transition risks are managed: phased rollout, parallel running, success criteria"
      purpose: "Address the CFO's concern: 'What if this doesn't work?'"

    - section: "Recommendation and Next Steps"
      content: "Clear recommendation with specific timeline and decision required"
      purpose: "Give the champion the words to use in the internal approval meeting"

# ==============================================================================
# SENSITIVITY ANALYSIS
# ==============================================================================

sensitivity_analysis:
  description: >
    Show how the business case holds up under different assumptions.
    This builds credibility because it acknowledges uncertainty instead
    of presenting a single optimistic scenario.

  scenarios:
    conservative:
      label: "Conservative"
      adjustments: "50% of estimated productivity gains, 75% of hard savings, 0% of revenue impact"
      purpose: "Shows ROI even with pessimistic assumptions"

    expected:
      label: "Expected"
      adjustments: "100% of estimated returns as calculated"
      purpose: "The base case, grounded in customer data and reasonable assumptions"

    optimistic:
      label: "Upside"
      adjustments: "100% of expected returns + additional adoption-driven value"
      purpose: "Shows potential if adoption exceeds expectations"

  presentation_rules:
    - "Always present the conservative case first. It sets a credible floor."
    - "If the conservative case still shows positive ROI, the business case is strong."
    - "If the conservative case is negative, be honest about it and discuss what needs to be true for the investment to pay off."
    - "Let the customer choose which scenario they believe. Their ownership of the numbers increases internal buy-in."

# ==============================================================================
# VALUE REALIZATION TIMELINE
# ==============================================================================

value_realization:
  description: >
    Show when the customer will start seeing returns, not just the
    total ROI over 3 years. Cash flow timing matters to finance teams.

  typical_phases:
    - phase: "Investment (Month 0-3)"
      description: "Implementation, integration, training. Net negative."
      customer_experience: "Cost without visible return. Set expectations clearly."

    - phase: "Early Value (Month 3-6)"
      description: "First workflows live. Measurable time savings begin."
      customer_experience: "Quick wins visible. Critical for maintaining executive support."

    - phase: "Productivity Gains (Month 6-12)"
      description: "Broader adoption. Process improvements measurable."
      customer_experience: "Teams report efficiency gains. Data available for internal ROI reporting."

    - phase: "Strategic Value (Month 12+)"
      description: "Full adoption. Revenue impact and risk reduction measurable."
      customer_experience: "Solution becomes part of the operating model. Expansion discussions natural."

  rules:
    - "Be honest about the investment phase. Overselling early value creates disappointment."
    - "Define success criteria for each phase before implementation starts"
    - "Schedule check-ins at phase transitions to measure and report progress"
    - "Early value phase is the most critical. If quick wins don't materialize, executive support erodes."
