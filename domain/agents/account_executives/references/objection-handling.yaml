# AE Objection Handling - Domain Knowledge
# Referenced by: ae-meeting-prep-definition.yaml

objection_handling_framework:
  principles:
    - "Acknowledge the objection before responding. Never dismiss or argue."
    - "Clarify to understand the real concern behind the stated objection."
    - "Respond with evidence (customer stories, data, third-party validation), not assertions."
    - "Confirm that the concern is addressed before moving forward."
    - "An objection is a buying signal. The customer is engaged enough to push back."

  process:
    - step: Acknowledge
      description: "Show you heard the concern. Validate it as reasonable."
      example: "That's a fair concern, and I appreciate you raising it."
    - step: Clarify
      description: "Ask questions to understand the root concern. The stated objection is often a proxy."
      example: "Can you help me understand what's driving that concern? Is it [specific aspect]?"
    - step: Respond
      description: "Address with relevant evidence. Match the response to the stakeholder's priorities."
      example: "Other organizations in [industry] had similar concerns. Here's how they approached it..."
    - step: Confirm
      description: "Check that the concern is resolved before proceeding."
      example: "Does that address your concern, or is there another angle we should explore?"

  common_categories:
    price_value:
      objections:
        - "It's too expensive"
        - "We can build this ourselves"
        - "Competitor X is cheaper"
      response_strategy: "Reframe around total cost of ownership, cost of delay, and value delivered. Never compete on price alone."

    timing:
      objections:
        - "We're not ready yet"
        - "This isn't a priority right now"
        - "Let's revisit next quarter"
      response_strategy: "Quantify the cost of waiting. Connect to the compelling event. Ask what would need to change."

    authority:
      objections:
        - "I need to check with my team"
        - "This decision isn't mine alone"
        - "We have a committee process"
      response_strategy: "Map the decision process. Offer to support internal presentations. Arm the champion with materials."

    trust:
      objections:
        - "How do we know this will work?"
        - "What if it doesn't deliver?"
        - "We've been burned by vendors before"
      response_strategy: "Offer proof points: POC, customer references, phased rollout. Reduce perceived risk."

    status_quo:
      objections:
        - "Our current solution is working fine"
        - "The switching cost is too high"
        - "We just renewed with incumbent"
      response_strategy: "Quantify hidden costs of status quo. Identify pain the customer has normalized. Show competitive risk."

    technical:
      objections:
        - "It doesn't integrate with our stack"
        - "Security requirements aren't met"
        - "It's not scalable enough"
      response_strategy: "Defer to SA for technical validation. Offer architecture review. Address with specific evidence."
