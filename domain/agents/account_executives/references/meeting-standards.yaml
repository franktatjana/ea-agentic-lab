# AE Meeting Preparation - Domain Knowledge
# Referenced by: ae-meeting-prep-definition.yaml

call_brief:
  structure:
    - section: "Account Snapshot"
      content: "ARR, contract end date, health score, last interaction date"
    - section: "Open Items"
      content: "Action items from previous meetings with status and owners"
    - section: "Objectives"
      content: "Max 3 specific, measurable goals for this meeting"
    - section: "Key Questions"
      content: "Discovery or validation questions tied to objectives"
    - section: "Risks to Address"
      content: "Active risks relevant to this conversation"
  rules:
    - "Objectives limited to 3 actionable items"
    - "All dates specific (never 'recently' or 'soon')"
    - "All values include currency units"
    - "Open items cite the meeting where they originated"

qbr_format:
  sections:
    - section: "Value Delivered"
      content: "Quantified outcomes with before/after metrics"
    - section: "Adoption Metrics"
      content: "Usage data, active users, feature adoption rates"
    - section: "Health Scorecard"
      content: "Support tickets, NPS, engagement frequency"
    - section: "Roadmap Alignment"
      content: "Upcoming features mapped to customer priorities"
    - section: "Expansion Discussion"
      content: "Upsell/cross-sell opportunities with estimated value"
    - section: "Next Quarter Goals"
      content: "Joint success criteria with measurable targets"
  rules:
    - "Value claims must be evidence-backed with data sources cited"
    - "Metrics must show trend (improving/declining/stable)"
    - "Expansion points grounded in usage signals or stated needs"

post_call_summary:
  structure:
    - section: "Executive Summary"
      content: "2-3 sentence meeting outcome"
    - section: "Decisions Made"
      content: "What was agreed, by whom, with any conditions"
    - section: "Action Items"
      content: "Each with owner, due date, and success criteria"
    - section: "Follow-Up Required"
      content: "Meetings to schedule, materials to send, approvals needed"
    - section: "CRM Updates"
      content: "Specific field changes recommended based on meeting outcomes"
  rules:
    - "Capture exactly what was said, no interpretations"
    - "Every action item must have an owner and due date"
    - "CRM updates are recommendations for human review"
    - "Sentiment based on stated content, not assumed mood"

# ==============================================================================
# OBJECTIVE PRIORITIZATION
# ==============================================================================

objective_prioritization:
  description: >
    Maximum 3 objectives per meeting. Prioritize by what most advances
    the deal and what cannot be achieved outside a live conversation.

  ranking_criteria:
    - rank: 1
      label: "Deal-advancing"
      test: "Does this objective move the deal to the next stage or remove a blocker?"
      examples:
        - "Confirm budget allocation with economic buyer"
        - "Get decision criteria documented and agreed"
        - "Secure access to a missing stakeholder"
    - rank: 2
      label: "Risk-reducing"
      test: "Does this objective address an active risk that threatens the deal?"
      examples:
        - "Validate champion's influence after org change"
        - "Address competitive concern raised in last meeting"
        - "Confirm timeline has not shifted"
    - rank: 3
      label: "Relationship-building"
      test: "Does this objective strengthen a relationship needed for future deal progress?"
      examples:
        - "Establish rapport with newly introduced stakeholder"
        - "Deliver insight that demonstrates thought leadership"
        - "Align on mutual success criteria"

  exclusion_rules:
    - "If it can be accomplished via email, it is not a meeting objective"
    - "If only the seller benefits, it is not a valid objective"
    - "If it requires more than the allotted meeting time, break it into phases"

# ==============================================================================
# MEETING TYPE SELECTION
# ==============================================================================

meeting_type_guidance:
  description: >
    Different meeting types serve different purposes. The preparation
    approach changes based on the meeting type and deal stage.

  types:
    discovery:
      purpose: "Understand the customer's world before presenting any solution"
      stage_relevance: "Stage 0-1 (Prospect to Discovery)"
      prep_focus: "Research the account, prepare questions, know the persona priorities"
      success_criteria: "Left the meeting knowing more than when you entered"
      anti_pattern: "Presenting a demo or solution before understanding the problem"

    technical_validation:
      purpose: "Prove the solution works in the customer's environment"
      stage_relevance: "Stage 2-3 (Scoping to Technical Validation)"
      prep_focus: "Align SA on requirements, prepare for integration questions, know the technical evaluation criteria"
      success_criteria: "Technical evaluator confirms fit or articulates specific remaining concerns"
      anti_pattern: "Running a generic demo instead of addressing documented requirements"

    business_case:
      purpose: "Quantify value and justify budget with the economic buyer"
      stage_relevance: "Stage 3-4 (Technical Validation to Proposal)"
      prep_focus: "Prepare ROI data, cost of inaction narrative, reference customers"
      success_criteria: "Economic buyer agrees the investment is justified and worth prioritizing"
      anti_pattern: "Presenting features instead of business outcomes"

    negotiation:
      purpose: "Agree on commercial terms that work for both parties"
      stage_relevance: "Stage 4-5 (Proposal to Negotiation)"
      prep_focus: "Know your walk-away, prepare packaging options, anticipate objections to pricing"
      success_criteria: "Terms agreed or next step to resolve outstanding items clearly defined"
      anti_pattern: "Discounting without getting something in return"

    executive_alignment:
      purpose: "Confirm strategic fit and secure executive sponsorship"
      stage_relevance: "Any stage where executive engagement is needed"
      prep_focus: "Tailor to executive's strategic priorities, prepare concise value narrative, know the ask"
      success_criteria: "Executive confirms support and commits to specific enabling action"
      anti_pattern: "Presenting technical details to a strategic audience"

    qbr:
      purpose: "Review value delivered, health, and plan the next quarter"
      stage_relevance: "Post-sale, active customers"
      prep_focus: "Quantified value delivered, adoption metrics, expansion opportunities"
      success_criteria: "Customer confirms value received and agrees on forward plan"
      anti_pattern: "Using QBR as a complaint session without a resolution framework"

# ==============================================================================
# CONTENT TAILORING BY SENIORITY
# ==============================================================================

seniority_tailoring:
  description: >
    The same information must be presented differently depending on the
    audience's seniority. Executives want outcomes. Managers want plans.
    Practitioners want details.

  levels:
    c_level:
      content_focus: "Strategic impact, competitive positioning, business outcomes"
      detail_level: "High-level, 3-5 key points maximum"
      time_sensitivity: "Respect short attention windows, lead with the conclusion"
      language: "Business language, no technical jargon, quantified outcomes"
      preparation_rule: "Know the executive's top 3 priorities before the meeting"

    vp_director:
      content_focus: "Operational impact, team efficiency, risk reduction, budget justification"
      detail_level: "Moderate detail with supporting data, ready to drill down on request"
      time_sensitivity: "Structured agenda, respect time boundaries"
      language: "Mix of business and functional domain language"
      preparation_rule: "Connect your value to their department's OKRs or KPIs"

    manager:
      content_focus: "Day-to-day impact, implementation effort, team readiness"
      detail_level: "Specific details with examples and timelines"
      time_sensitivity: "Thorough but focused, allow for Q&A"
      language: "Functional and some technical language appropriate to their domain"
      preparation_rule: "Understand their team's current pain and workload capacity"

    practitioner:
      content_focus: "How it works, integration points, workflow changes, hands-on details"
      detail_level: "Deep technical or operational detail"
      time_sensitivity: "Allow extended time for questions and exploration"
      language: "Technical or domain-specific language they use daily"
      preparation_rule: "Know their tools, stack, and daily workflow before presenting"

# ==============================================================================
# RISK RELEVANCE SCORING
# ==============================================================================

risk_relevance_for_meetings:
  description: >
    Not every active risk belongs in every meeting brief. Select risks
    that are relevant to the meeting's attendees and objectives.

  selection_criteria:
    include:
      - "Risk directly relates to a meeting objective"
      - "Attendee has the authority or information to address the risk"
      - "Risk has worsened since last meeting with this stakeholder"
      - "Risk blocks the next deal milestone"
    exclude:
      - "Risk is internal-only (e.g., CRM hygiene) with no customer-facing relevance"
      - "Risk is being addressed by a different stakeholder in a separate meeting"
      - "Risk is LOW severity with no trend change"
      - "Bringing up this risk would damage the relationship without advancing resolution"

  presentation_rules:
    - "Frame risks as questions, not accusations: 'How should we think about timeline?' not 'Your timeline has slipped'"
    - "Pair every risk mention with a proposed solution or next step"
    - "Maximum 2 risks per meeting brief. More than that signals the deal is in trouble."
    - "If the meeting purpose is celebration (QBR success review), lead with value before addressing risks"
