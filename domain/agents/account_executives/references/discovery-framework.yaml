# AE Discovery Framework - Domain Knowledge
# Referenced by: ae-meeting-prep-definition.yaml, ae-meddpicc-definition.yaml

discovery_structure:
  principles:
    - "Ask open-ended questions that uncover business context, not just requirements"
    - "Listen for pain indicators: frustration, workarounds, failed initiatives"
    - "Map answers back to MEDDPICC dimensions as evidence"
    - "Discovery is iterative, not a single call. Each interaction deepens understanding."
    - "Never pitch during discovery. Gather information first, present solutions later."

  question_hierarchy:
    situation:
      purpose: "Understand the customer's current state and context"
      examples:
        - "Walk me through how your team handles [process] today."
        - "What tools and systems are involved in [workflow]?"
        - "How many people are involved in [process] and what are their roles?"
        - "How has this process evolved over the past 12-18 months?"
    problem:
      purpose: "Identify pain points, inefficiencies, and challenges"
      examples:
        - "What is the biggest challenge your team faces with [process]?"
        - "Where do things break down or slow down most often?"
        - "What happens when [process] fails? What is the impact?"
        - "How much time does your team spend on [manual workaround]?"
    implication:
      purpose: "Quantify the impact and create urgency"
      examples:
        - "What does that cost you in terms of [time/money/resources] per [period]?"
        - "How does this affect your ability to [strategic goal]?"
        - "If this doesn't get resolved, what happens in 6-12 months?"
        - "How does this compare to where your competitors are?"
    need_payoff:
      purpose: "Establish the value of solving the problem"
      examples:
        - "If you could eliminate [problem], what would that mean for [metric]?"
        - "What would success look like 12 months from now?"
        - "How would solving this change your team's priorities?"
        - "What would you be able to do that you can't do today?"

  per_persona_focus:
    executive_sponsor:
      priorities: ["Strategic impact", "ROI", "Competitive positioning", "Board-level reporting"]
      questions:
        - "What are your top 3 strategic priorities for the next 12 months?"
        - "How does this initiative connect to your board's expectations?"
        - "What would a successful outcome mean for your organization's market position?"
    technical_evaluator:
      priorities: ["Architecture fit", "Integration complexity", "Security posture", "Scalability"]
      questions:
        - "What does your current architecture look like for [domain]?"
        - "What are your non-negotiable technical requirements?"
        - "How do you handle [security/compliance] requirements today?"
        - "What integrations are critical for this to work in your environment?"
    line_of_business:
      priorities: ["Day-to-day impact", "Adoption ease", "Team productivity", "Quick wins"]
      questions:
        - "What does a typical day look like for your team?"
        - "What tasks take the most time but add the least value?"
        - "If you could change one thing about your current process, what would it be?"
        - "How would your team react to a change in [current process]?"
    procurement:
      priorities: ["Vendor compliance", "Contract terms", "Budget alignment", "Risk mitigation"]
      questions:
        - "What does your typical procurement process look like?"
        - "Who needs to sign off and what are their review criteria?"
        - "Are there preferred vendor requirements or compliance standards we should know about?"
        - "What timeline are you working with for procurement approval?"

  evidence_mapping:
    rule: "Every discovery answer should map to at least one MEDDPICC dimension"
    mapping:
      - question_type: situation
        feeds: ["Decision Criteria", "Decision Process"]
      - question_type: problem
        feeds: ["Identify Pain", "Metrics"]
      - question_type: implication
        feeds: ["Metrics", "Economic Buyer justification"]
      - question_type: need_payoff
        feeds: ["Metrics", "Champion ammunition"]
