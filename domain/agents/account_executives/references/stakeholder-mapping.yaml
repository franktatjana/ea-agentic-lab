# AE Stakeholder Intelligence - Domain Knowledge
# Referenced by: ae-stakeholder-definition.yaml

decision_making_unit:
  roles:
    economic_buyer:
      definition: "Controls budget, has final authority"
      indicators: ["Budget discussions", "Final approval mentions", "C-level title"]
    technical_evaluator:
      definition: "Assesses technical fit and feasibility"
      indicators: ["Technical questions", "POC involvement", "Architecture discussions"]
    user_buyer:
      definition: "Day-to-day user who benefits from the solution"
      indicators: ["Feature requests", "Usage feedback", "Training interest"]
    champion:
      definition: "Internal advocate who sells when you are not in the room"
      indicators: ["Shares internal intelligence", "Facilitates meetings", "Proactive communication"]
    blocker:
      definition: "Opposes or delays the initiative"
      indicators: ["Raises objections", "Delays responses", "Favors competitor or status quo"]
    coach:
      definition: "Provides guidance on navigating the organization"
      indicators: ["Shares org dynamics", "Suggests strategy", "Warns about risks"]

influence_scoring:
  power_interest_grid:
    high_power_high_interest: "Manage closely, regular engagement"
    high_power_low_interest: "Keep satisfied, strategic touchpoints"
    low_power_high_interest: "Keep informed, potential future champion"
    low_power_low_interest: "Monitor, minimal investment"
  scoring_factors:
    - "Title and organizational position"
    - "Budget authority (confirmed or assumed)"
    - "Frequency of engagement in deal activities"
    - "Influence on other stakeholders (observed)"
    - "Historical deal involvement"

champion_strength:
  scale: "1-10"
  criteria:
    9_10: "Active advocate, weekly contact, shares internal intelligence, facilitates access"
    7_8: "Supportive, regular contact, provides some internal guidance"
    5_6: "Friendly but passive, responds when contacted, limited advocacy"
    3_4: "Neutral, engages only when required, no advocacy evidence"
    1_2: "Disengaged or potentially opposing, minimal response"
  risk_indicators:
    gone_dark: "No response in >14 days after regular engagement pattern"
    weakening: "Declining response frequency, shorter replies, fewer introductions"
    org_change: "Role change, reorg, or departure announced or rumored"

engagement_health:
  positive_signals:
    - "Proactive outreach from stakeholder"
    - "Introductions to new contacts"
    - "Sharing of internal documents or timelines"
    - "Meeting attendance consistency"
  negative_signals:
    - "Declining response times"
    - "Meeting cancellations or no-shows"
    - "Shorter, less detailed responses"
    - "Redirecting to subordinates"
  measurement: "Track trend over rolling 30-day windows"

champion_testing:
  definition: >
    A champion is someone who sells on your behalf when you are not in the room.
    Friendly contacts are not champions unless they demonstrate active advocacy.
    Test before trusting.

  tests:
    - test: "Access Test"
      question: "Will they introduce you to the economic buyer or other key stakeholders?"
      strong: "Proactively offers introductions, facilitates meetings"
      weak: "Agrees but doesn't follow through, or makes excuses"
      fail: "Refuses or deflects access requests"

    - test: "Information Test"
      question: "Will they share internal intelligence about the decision process?"
      strong: "Shares org dynamics, budget status, competitive activity, internal politics"
      weak: "Shares only what you could find publicly"
      fail: "Claims to not know or refuses to share"

    - test: "Coaching Test"
      question: "Will they tell you when you're making a mistake or losing ground?"
      strong: "Proactively warns about risks, gives candid feedback on positioning"
      weak: "Only answers direct questions, doesn't volunteer concerns"
      fail: "Tells you everything is fine when evidence suggests otherwise"

    - test: "Selling Test"
      question: "Will they advocate for your solution in meetings you don't attend?"
      strong: "Presents your value proposition, counters objections, drives consensus"
      weak: "Supports when asked directly but doesn't proactively advocate"
      fail: "Goes silent in internal discussions or defers to others"

    - test: "Event Test"
      question: "Will they help you create a compelling event or urgency for the deal?"
      strong: "Connects the initiative to a strategic priority with executive visibility"
      weak: "Acknowledges urgency but can't articulate it to others"
      fail: "Sees no urgency, comfortable with status quo timeline"

  scoring:
    all_strong: "True champion, invest heavily in this relationship"
    3_4_strong: "Emerging champion, coach them on weak areas"
    1_2_strong: "Friendly contact, not yet a champion. Develop or find alternative."
    0_strong: "Not a champion. Do not rely on this person for internal advocacy."
