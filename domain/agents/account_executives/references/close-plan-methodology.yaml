# AE Close Plan / Mutual Action Plan - Domain Knowledge
# Referenced by: ae-deal-diagnosis-definition.yaml

mutual_action_plan:
  definition: >
    A shared timeline between seller and buyer documenting every step
    required to reach a signed agreement. Both parties own milestones.
    The plan is customer-facing and collaborative, not a seller-only tracking tool.

  structure:
    - phase: Technical Validation
      milestones:
        - "Solution demo completed with key stakeholders"
        - "Technical requirements documented and validated"
        - "POC scope agreed (if applicable)"
        - "Architecture review completed"
      owner: "Joint (AE + SA + Technical Evaluator)"
      typical_duration: "2-4 weeks"

    - phase: Business Validation
      milestones:
        - "Business case presented to economic buyer"
        - "ROI model validated with customer data"
        - "Success criteria agreed and documented"
        - "Budget confirmed and allocated"
      owner: "Joint (AE + VE + Economic Buyer)"
      typical_duration: "2-3 weeks"

    - phase: Procurement and Legal
      milestones:
        - "Commercial proposal delivered"
        - "Legal redlines received and addressed"
        - "Security review completed"
        - "Procurement compliance requirements met"
        - "Final terms agreed"
      owner: "Joint (AE + Procurement + Legal)"
      typical_duration: "2-6 weeks"

    - phase: Executive Approval
      milestones:
        - "Executive sponsor briefed on final terms"
        - "Internal approval chain completed"
        - "Contract signed"
        - "PO issued"
      owner: "Customer (Champion + Economic Buyer)"
      typical_duration: "1-2 weeks"

  tracking_rules:
    - "Every milestone has a single owner and target date"
    - "Update weekly with both parties, not just internally"
    - "Missed milestones trigger immediate discussion on root cause and replan"
    - "Customer-confirmed dates only, never seller-assumed timelines"
    - "Plan is shared in a format the customer uses (not just CRM)"

risk_indicators:
  close_plan_health:
    green:
      - "All milestones on track or ahead of schedule"
      - "Customer actively participating in milestone completion"
      - "No unresolved blockers older than 5 business days"
    yellow:
      - "1-2 milestones delayed but recovery plan in place"
      - "Customer engagement declining on plan updates"
      - "New stakeholder introduced requiring additional validation"
    red:
      - "3+ milestones delayed with no recovery plan"
      - "Customer stopped updating or responding to plan"
      - "Budget, timeline, or scope changed without renegotiation"
      - "Champion unable to drive internal milestones"

  common_stall_patterns:
    - pattern: "Legal black hole"
      indicator: "Redlines submitted but no response for 10+ days"
      mitigation: "Escalate to economic buyer, offer legal-to-legal call"
    - pattern: "Procurement surprise"
      indicator: "New compliance requirements surface late in process"
      mitigation: "Map procurement requirements in discovery, not negotiation"
    - pattern: "Ghost champion"
      indicator: "Champion stops driving internal steps without explanation"
      mitigation: "Multi-thread early, never depend on single internal contact"
    - pattern: "Budget reallocation"
      indicator: "Verbal commitment but PO delayed repeatedly"
      mitigation: "Confirm budget allocation with economic buyer directly, document in writing"
