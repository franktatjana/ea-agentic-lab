# AE Pipeline Management - Domain Knowledge
# Referenced by: ae-pipeline-mgmt-definition.yaml

stage_progression:
  criteria:
    discovery: "Pain identified, stakeholders mapped, timeline discussed"
    qualification: "MEDDPICC score >=60%, budget confirmed, decision process mapped"
    proposal: "Solution scoped, pricing delivered, procurement engaged"
    negotiation: "Commercial terms under review, legal/security in progress"
    commit: "Verbal agreement, paper process on track, close date confirmed"

forecast_methodology:
  commit_confidence:
    high: "Verbal YES from economic buyer, paper process active, close date <30 days"
    medium: "Champion supportive, decision criteria met, close date <60 days"
    low: "Early stage, no economic buyer access, or stalled >21 days"
    exclude: "No recent engagement (>30 days), qualification score <40%"

  confidence_scoring:
    - signal: "Economic buyer engaged in last 14 days"
      weight: 25
    - signal: "Champion actively selling internally"
      weight: 20
    - signal: "Decision criteria documented and met"
      weight: 15
    - signal: "Paper process milestones on track"
      weight: 15
    - signal: "Close date confirmed by customer"
      weight: 15
    - signal: "No competitive threat detected"
      weight: 10

coverage_ratios:
  benchmarks:
    minimum: "3x pipeline-to-quota for healthy coverage"
    target: "4x pipeline-to-quota for buffer against slippage"
    critical: "<2x signals immediate pipeline generation needed"
  calculation: "Total weighted pipeline value / Quarterly target"
  weighted_pipeline: "Sum of (deal value * commit confidence %)"

priority_ranking:
  factors:
    - "Deal value relative to quota gap"
    - "Days until close date"
    - "Risk of slippage (stale signals, champion gone dark)"
    - "Effort required vs probability of impact"
  output: "Top 5 actions ranked by (value * urgency * probability)"

sales_stages:
  definitions:
    - stage: 0-Prospect
      entry_criteria: "Account identified, ICP fit confirmed"
      exit_criteria: "First meaningful conversation scheduled"
      key_activities: ["Prospecting research", "Outreach strategy", "SDR coordination"]
    - stage: 1-Discovery
      entry_criteria: "First meeting completed, pain discussed"
      exit_criteria: "Pain identified, stakeholders mapped, timeline discussed"
      key_activities: ["Discovery calls", "Stakeholder mapping", "Pain validation"]
    - stage: 2-Scoping
      entry_criteria: "MEDDPICC score >=40%, requirements understood"
      exit_criteria: "Solution scope defined, technical validation planned"
      key_activities: ["Requirements documentation", "Solution design", "Value framework"]
    - stage: 3-Technical Validation
      entry_criteria: "Solution presented, POC/demo completed"
      exit_criteria: "Technical fit confirmed, decision criteria met"
      key_activities: ["POC execution", "Architecture review", "Integration assessment"]
    - stage: 4-Proposal
      entry_criteria: "MEDDPICC score >=60%, budget confirmed"
      exit_criteria: "Pricing delivered, procurement engaged"
      key_activities: ["Commercial proposal", "Business case", "ROI presentation"]
    - stage: 5-Negotiation
      entry_criteria: "Proposal reviewed, terms under discussion"
      exit_criteria: "Commercial terms agreed, legal/security approved"
      key_activities: ["Contract negotiation", "Legal review", "Security questionnaire"]
    - stage: 6-Commit
      entry_criteria: "Verbal agreement, paper process active"
      exit_criteria: "Contract signed, PO received"
      key_activities: ["Close plan execution", "Executive alignment", "Procurement follow-up"]

forecast_categories:
  definitions:
    commit:
      criteria: "Verbal YES from economic buyer, paper process active, close date <30 days"
      accuracy_target: "90%+ should close in forecasted quarter"
    best_case:
      criteria: "Champion supportive, decision criteria met, close date <60 days, no major blockers"
      accuracy_target: "50-70% should close in forecasted quarter"
    pipeline:
      criteria: "Qualified opportunity, active engagement, close date in quarter"
      accuracy_target: "20-30% may close in forecasted quarter"
    omitted:
      criteria: "Early stage, stalled >21 days, qualification score <40%, or no recent engagement"
      accuracy_target: "Excluded from forecast, tracked for future quarters"
  accuracy_target: "+/-10% achievement against weekly forecast over 4-week period"

activity_targets:
  weekly:
    customer_meetings: "8-10 per week (mix of new and existing)"
    new_contacts: "5+ new customer/partner contacts per month"
    pipeline_reviews: "1 formal pipeline review with manager"
    forecast_update: "1 forecast commit update"
  daily:
    pipe_gen_activity: "Pipeline generation is daily discipline, not quarterly scramble"
    crm_updates: "Same-day updates after every customer interaction"
    signal_monitoring: "Review key account signals daily"

territory_planning:
  account_tiering:
    tier_1:
      criteria: "Strategic accounts, highest revenue potential, active engagement"
      time_allocation: "40% of selling time"
      review_cadence: "Weekly"
    tier_2:
      criteria: "Growth accounts, moderate revenue potential, intermittent engagement"
      time_allocation: "35% of selling time"
      review_cadence: "Bi-weekly"
    tier_3:
      criteria: "Develop accounts, future potential, nurture relationships"
      time_allocation: "15% of selling time"
      review_cadence: "Monthly"
    unassigned:
      criteria: "Not yet researched or qualified against ICP"
      time_allocation: "10% for prospecting research"
      review_cadence: "Quarterly territory review"
  three_horizon_map:
    horizon_1: "Current quarter, deals in pipeline, focus on close"
    horizon_2: "Next quarter, deals in early stages, focus on qualification and advancement"
    horizon_3: "Future quarters, prospecting and relationship building, focus on pipe gen"
