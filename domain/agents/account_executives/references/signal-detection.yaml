# Signal Detection Reference (Commercial)
# Scope: AE agent commercial signal patterns
# Load when: Processing meeting notes, CRM updates, email threads, or pipeline reviews

buying_signals:
  keywords:
    - "budget approved"
    - "executive sponsor"
    - "timeline confirmed"
    - "shortlist"
    - "proof of value"
    - "business case"
    - "procurement"
    - "contract review"
    - "legal review"
    - "reference check"
  strength_indicators:
    strong: ["signed off", "approved", "committed", "allocated budget", "selected vendor"]
    moderate: ["evaluating", "comparing", "building case", "seeking approval", "next steps"]
    early: ["exploring", "interested", "curious about", "heard about", "looking into"]

risk_signals:
  deal_risk:
    - "pushed to next quarter"
    - "budget freeze"
    - "reorganization"
    - "new stakeholder"
    - "competitor mentioned"
    - "going silent"
    - "missed meeting"
    - "scope change"
    - "champion left"
    - "procurement delay"
  severity_indicators:
    high: ["lost champion", "budget cut", "competitor selected", "deal on hold", "no response"]
    medium: ["timeline slipped", "new requirements", "additional approvers", "scope creep"]
    low: ["rescheduled", "questions about pricing", "needs more information"]

competitive_signals:
  patterns:
    - "also looking at"
    - "compared to"
    - "incumbent"
    - "alternative"
    - "bake-off"
    - "competitive eval"
    - "RFP issued"
  response_triggers:
    - "Request CI battlecard"
    - "Update competitive positioning"
    - "Escalate to deal strategy review"

qualification_signals:
  meddpicc_gaps:
    - pattern: "no identified champion"
      action: "Trigger stakeholder mapping"
    - pattern: "decision criteria undefined"
      action: "Schedule discovery session"
    - pattern: "no paper process"
      action: "Map procurement workflow"
    - pattern: "economic buyer not engaged"
      action: "Request executive alignment"
    - pattern: "competition unknown"
      action: "Request CI analysis"

pipeline_signals:
  velocity:
    - "deal stalled"
    - "stage regression"
    - "aging opportunity"
    - "no activity"
    - "close date moved"
  growth:
    - "upsell opportunity"
    - "cross-sell"
    - "expansion"
    - "additional use case"
    - "new business unit"
