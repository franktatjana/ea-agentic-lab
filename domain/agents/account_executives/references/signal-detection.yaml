# AE Signal Detection - Domain Knowledge
# Extracted from ae_personality.yaml per DDR-018

commercial_risks:
  keywords:
    - "budget review"
    - "decision delayed"
    - "approval pending"
    - "procurement process"
    - "legal review"
    - "contract negotiation"
    - "pricing concern"
    - "competitor evaluation"
    - "scope reduction"

  severity_indicators:
    high: ["deal at risk", "pulling out", "cancellation", "lost", "chose competitor"]
    medium: ["delayed", "postponed", "reviewing options", "budget cut"]
    low: ["clarification needed", "questions about pricing"]

relationship_health:
  positive_signals:
    - "executive sponsor engaged"
    - "expansion discussed"
    - "reference customer"
    - "success story"
    - "champion identified"

  negative_signals:
    - "unresponsive"
    - "missed meetings"
    - "escalation"
    - "dissatisfaction"
    - "churn risk"

pipeline_signals:
  stage_changes: ["moved to", "advanced to", "returned to", "stuck in"]
  timeline_mentions: ["close date", "signature expected", "Q1/Q2/Q3/Q4"]
  value_mentions: ["ARR", "ACV", "contract value", "expansion opportunity"]

# ==============================================================================
# SIGNAL PATTERN ANALYSIS
# ==============================================================================

signal_patterns:
  description: >
    Individual keywords are weak signals. Pattern combinations produce
    reliable intelligence. Always evaluate signal clusters, not isolated words.

  compound_patterns:
    budget_risk:
      signals:
        - "budget review"
        - "delayed"
        - "declining response frequency"
      interpretation: "Active budget threat, likely reallocation under consideration"
      confidence: "HIGH when 3+ signals co-occur within 14-day window"
      action: "Escalate to champion for internal budget status confirmation"

    competitive_displacement:
      signals:
        - "evaluating options"
        - "competitor name mentioned"
        - "new stakeholder introduced"
      interpretation: "Active competitive evaluation, deal at risk of displacement"
      confidence: "HIGH when competitor is named, MEDIUM when implied"
      action: "Activate competitive response: differentiation, executive alignment, champion coaching"

    champion_erosion:
      signals:
        - "declining contact frequency"
        - "shorter responses"
        - "meeting cancellations"
      interpretation: "Champion engagement weakening, may indicate internal pressure or loss of influence"
      confidence: "MEDIUM after 14 days, HIGH after 21 days of declining pattern"
      action: "Direct conversation with champion about changes, begin multi-threading"

    expansion_opportunity:
      signals:
        - "new team"
        - "additional use cases"
        - "other departments interested"
      interpretation: "Organic expansion signal from successful adoption"
      confidence: "HIGH when stated by multiple stakeholders"
      action: "Map whitespace, prepare expansion proposal, engage additional stakeholders"

    stall_formation:
      signals:
        - "no stage movement"
        - "contact frequency stable but no decisions"
        - "repeated 'we need more time'"
      interpretation: "Deal entering stall, likely internal blocker or competing priority"
      confidence: "MEDIUM at 21 days, HIGH at 30 days with no milestone progress"
      action: "Diagnose stall root cause, engage champion on internal dynamics"

    urgency_acceleration:
      signals:
        - "board meeting"
        - "fiscal year end"
        - "executive mandate"
        - "compressed timelines"
      interpretation: "Compelling event creating genuine urgency, deal may accelerate"
      confidence: "HIGH when event has a specific date"
      action: "Align close plan to compelling event, confirm with economic buyer"

# ==============================================================================
# CONTEXTUAL INTERPRETATION
# ==============================================================================

contextual_interpretation:
  description: >
    The same keyword means different things in different contexts.
    Always evaluate signals against the current deal stage, time of year,
    and relationship history before classifying.

  context_modifiers:
    fiscal_calendar:
      - signal: "budget review"
        during_q4_planning: "Normal process, LOW severity"
        during_active_deal: "Potential risk, MEDIUM severity"
        after_verbal_commit: "Serious risk, HIGH severity"
      - signal: "delayed"
        during_holidays: "Expected, reduce severity by one level"
        during_active_evaluation: "Concerning, maintain severity"
        post_decision: "Critical, escalate"

    deal_stage:
      - signal: "evaluating options"
        in_discovery: "Normal buyer behavior, LOW severity"
        in_proposal: "Competitive risk, MEDIUM severity"
        in_negotiation: "Deal at risk, HIGH severity"
      - signal: "need to involve more people"
        in_discovery: "Positive (access expanding), treat as buying signal"
        in_negotiation: "Negative (decision process expanding), treat as stall risk"

    relationship_baseline:
      rule: "Measure change from established pattern, not absolute behavior"
      example_1: "Weekly contact dropping to bi-weekly is a signal. Monthly contact staying monthly is not."
      example_2: "Short replies from a typically brief communicator are normal. From a previously detailed communicator, it's a risk signal."

# ==============================================================================
# FALSE POSITIVE INDICATORS
# ==============================================================================

false_positives:
  description: >
    Not every keyword match is a real signal. These patterns commonly
    produce false positives that waste AE attention.

  common_false_positives:
    - pattern: "Budget mentioned in casual conversation"
      reality: "Customer discussing general business context, not signaling budget risk"
      filter: "Only flag budget signals when tied to specific deal or procurement action"

    - pattern: "Competitor name in industry discussion"
      reality: "Customer comparing industry landscape, not actively evaluating"
      filter: "Only flag when competitor is mentioned in context of evaluation, RFP, or feature comparison"

    - pattern: "Meeting rescheduled once"
      reality: "Normal calendar management"
      filter: "Only flag when pattern of 2+ reschedules or cancellations within 30 days"

    - pattern: "New stakeholder CC'd on email"
      reality: "May be FYI inclusion, not decision process expansion"
      filter: "Flag only when new stakeholder asks questions or takes actions in the deal"

    - pattern: "Response time slightly longer than usual"
      reality: "Travel, vacation, busy week"
      filter: "Measure over 14-day rolling average, not individual responses"

# ==============================================================================
# SIGNAL FRESHNESS AND DECAY
# ==============================================================================

signal_freshness:
  description: >
    Signals lose relevance over time. A competitive mention from 6 months
    ago is not equivalent to one from last week.

  decay_rules:
    - age: "0-7 days"
      weight: "100%, full relevance"
      label: "Current"
    - age: "8-21 days"
      weight: "75%, still actionable"
      label: "Recent"
    - age: "22-45 days"
      weight: "50%, context has likely shifted"
      label: "Aging"
    - age: "46-90 days"
      weight: "25%, historical context only"
      label: "Stale"
    - age: ">90 days"
      weight: "10%, background reference only"
      label: "Archived"

  refresh_triggers:
    - "New communication from the same stakeholder on the same topic refreshes the signal"
    - "Stage change resets all signal weights for the deal to current"
    - "Contradictory signal from a more senior stakeholder supersedes earlier signals"
