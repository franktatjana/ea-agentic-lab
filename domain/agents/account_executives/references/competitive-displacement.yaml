# AE Competitive Displacement - Domain Knowledge
# Referenced by: ae-signal-detection-definition.yaml, ae-deal-diagnosis-definition.yaml, ae-meeting-prep-definition.yaml

displacement_principles:
  - "Never lead with a competitor attack. Lead with your value, differentiate when asked."
  - "The real competitor is the status quo. Until the customer decides to change, no vendor wins."
  - "Understand the incumbent's strengths, not just weaknesses. Customers chose them for a reason."
  - "Displacement requires a compelling event. Without one, switching cost always wins."
  - "Arm the champion to sell the switch internally. They need ammunition, not just enthusiasm."
  - "Technical superiority alone rarely wins displacement. Business case and risk mitigation do."

# ==============================================================================
# INCUMBENT ANALYSIS
# ==============================================================================

incumbent_analysis:
  description: >
    Before attempting displacement, understand why the customer chose
    the incumbent and what would make them reconsider.

  assessment_dimensions:
    - dimension: "Relationship depth"
      questions:
        - "How long has the incumbent been in place?"
        - "Who are the incumbent's champions inside the account?"
        - "What level of executive sponsorship does the incumbent have?"
      implications:
        deep: "Need executive-level engagement and a strong business case to overcome"
        shallow: "Transactional relationship, displacement is more feasible"

    - dimension: "Integration depth"
      questions:
        - "How deeply is the incumbent integrated into the customer's workflow?"
        - "What systems depend on the incumbent's APIs or data formats?"
        - "How much custom development has the customer built on the platform?"
      implications:
        deep: "Switching cost is high, need phased migration or coexistence strategy"
        shallow: "Standard integration, switching cost is manageable"

    - dimension: "Contract status"
      questions:
        - "When does the current contract expire?"
        - "Are there auto-renewal clauses?"
        - "What are the termination penalties?"
      implications:
        locked_in: "Long-term play, build the case for next renewal. Target 6-12 months before expiry."
        flexible: "Immediate opportunity if compelling event exists"

    - dimension: "Satisfaction level"
      questions:
        - "What is the customer's stated satisfaction with the incumbent?"
        - "Where are the friction points?"
        - "Has the customer expressed interest in alternatives?"
      implications:
        satisfied: "Need to create awareness of gaps they have normalized"
        dissatisfied: "Accelerate with proof points that address their specific complaints"

# ==============================================================================
# COMPETITIVE POSITIONING
# ==============================================================================

positioning_strategies:
  description: >
    Position against the competition without attacking them directly.
    Focus on what you uniquely enable, not what others cannot do.

  approaches:
    - strategy: "Reframe the evaluation criteria"
      description: "Shift the criteria to dimensions where you are strongest"
      tactic: "Introduce evaluation dimensions the customer hasn't considered"
      example: "'Most organizations at your stage also evaluate [dimension], which often becomes the decisive factor.'"
      risk: "If criteria shift is too obvious, customer sees it as manipulation"

    - strategy: "Expand the solution scope"
      description: "Show that your platform addresses adjacent needs the incumbent cannot"
      tactic: "Map the full workflow, not just the feature comparison"
      example: "'The real cost is not in the tool itself but in the manual work between [system A] and [system B] that our platform eliminates.'"
      risk: "Scope expansion can slow the deal if customer wants a focused solution"

    - strategy: "Quantify the switching benefit"
      description: "Make the case that switching cost is less than the cost of staying"
      tactic: "Build a TCO comparison that includes hidden costs of the status quo"
      example: "'Organizations similar to yours report spending [X hours/month] on workarounds. That is [Y annual cost] in productivity alone.'"
      risk: "Customer may dispute the productivity loss numbers"

    - strategy: "De-risk the transition"
      description: "Remove the customer's fear of switching"
      tactic: "Offer phased migration, parallel running, or guaranteed outcomes"
      example: "'We support coexistence during migration. You don't have to commit to a full switch before you see value.'"
      risk: "Parallel running extends timeline and delays full revenue"

# ==============================================================================
# SWITCHING COST NARRATIVE
# ==============================================================================

switching_cost:
  description: >
    The customer's biggest fear in displacement is disruption. Address
    switching cost proactively with quantified comparison.

  cost_categories:
    direct_costs:
      - "Contract termination fees (if applicable)"
      - "New platform licensing"
      - "Implementation and migration services"
      - "Data migration effort"
    indirect_costs:
      - "Team retraining time"
      - "Temporary productivity dip during transition"
      - "Integration rework"
      - "Change management effort"
    hidden_status_quo_costs:
      - "Manual workarounds compensating for incumbent gaps"
      - "Opportunity cost of features the incumbent cannot deliver"
      - "Technical debt accumulating from outdated architecture"
      - "Risk exposure from unaddressed security or compliance gaps"

  framing_rules:
    - "Always present switching cost alongside cost of staying. Never discuss switching cost in isolation."
    - "Quantify in the customer's units: hours per week, headcount, revenue at risk"
    - "Include a timeline showing when the investment pays back (typically 6-12 months)"
    - "Offer a phased approach that reduces upfront switching cost"

# ==============================================================================
# FUD DEFENSE
# ==============================================================================

fud_defense:
  description: >
    Incumbents and competitors will create Fear, Uncertainty, and Doubt
    to protect their position. Recognize and neutralize FUD patterns.

  common_fud_patterns:
    - fud: "Migration will take years and disrupt operations"
      defense: "Provide specific migration timeline with customer references who completed similar migrations"
      proof_point: "Reference customer case study with actual migration duration and effort"

    - fud: "They don't have feature X that you need"
      defense: "Confirm whether feature X is actually critical vs nice-to-have. Demonstrate how you achieve the same outcome."
      proof_point: "Live demo or POC showing the workflow, not just the feature checklist"

    - fud: "They are too small / too new / not proven at your scale"
      defense: "Provide customer logos at similar or greater scale. Share growth metrics and investment backing."
      proof_point: "Reference call with a customer in the same industry at similar scale"

    - fud: "Switching vendors is risky in your current business environment"
      defense: "Reframe: the risk of not switching (status quo cost) is greater than the transition risk"
      proof_point: "Quantified cost of inaction vs quantified migration investment with payback timeline"

    - fud: "We are about to release a new version that addresses all your concerns"
      defense: "Roadmap promises are not product. Ask for a beta, timeline, and commitment. Compare to what exists today."
      proof_point: "Competitive analysis of announced vs delivered features over the past 24 months"

# ==============================================================================
# COMPETITIVE TRAPS
# ==============================================================================

competitive_traps:
  description: >
    Strategic moves that make it harder for the competitor to win, without
    directly attacking them. These shape the evaluation in your favor.

  traps:
    - trap: "Evaluation criteria landmine"
      description: "Introduce evaluation criteria that align to your unique strengths early in the process"
      timing: "During discovery, before formal evaluation begins"
      example: "'When organizations evaluate this category, the three criteria that most correlate with success are [X, Y, Z].'"
      ethics: "Only introduce criteria that genuinely matter for the customer's success"

    - trap: "Reference customer match"
      description: "Offer a reference in the exact same industry, size, and use case"
      timing: "When customer is comparing vendors and seeking validation"
      example: "'Would it be helpful to speak with [Company] who made this same transition 12 months ago?'"
      ethics: "Reference must be genuine and willing. Never fabricate or pressure references."

    - trap: "POC design advantage"
      description: "Influence POC criteria to test scenarios where you excel"
      timing: "During POC scoping"
      example: "'Based on what you told us about [workflow], we recommend testing [scenario] as a POC criteria.'"
      ethics: "POC scenarios must reflect real customer workflows, not artificial tests"

    - trap: "Total cost of ownership framing"
      description: "Shift the comparison from license cost to total cost including implementation, maintenance, and hidden effort"
      timing: "When price comparison is the primary evaluation dimension"
      example: "'Let's compare the full 3-year cost including implementation, training, and the ongoing maintenance your team provides today.'"
      ethics: "TCO comparison must be honest and verifiable"
