# AE Account Planning - Domain Knowledge
# Referenced by: ae-pipeline-mgmt-definition.yaml, ae-stakeholder-definition.yaml, ae-pipeline-gen-definition.yaml

account_planning_principles:
  - "Account planning is investment allocation. Spend your limited selling time where it creates the most value."
  - "A plan without measurable goals is a wish list. Every account plan needs quantified targets."
  - "Account plans are living documents. Review quarterly, adjust monthly, reference weekly."
  - "The best account plan is co-created with the customer. Unilateral planning creates misalignment."
  - "Territory coverage and account planning are different exercises. Territory = breadth, Account = depth."

# ==============================================================================
# STRATEGIC ACCOUNT PLAN
# ==============================================================================

strategic_account_plan:
  description: >
    A strategic account plan is a 12-month roadmap for growing a Tier 1
    account. It covers current state, growth opportunities, relationship
    strategy, and a sequenced action plan.

  sections:
    - section: "Account Overview"
      content:
        - "Company profile: industry, size, revenue, key markets"
        - "Current relationship: ARR, products in use, contract dates"
        - "Account health: NPS, support ticket trends, adoption metrics"
        - "Key contacts: names, roles, engagement level"
      purpose: "Baseline snapshot. Anyone reading this section understands where we stand."

    - section: "Strategic Priorities"
      content:
        - "Customer's top 3 business priorities for the next 12 months"
        - "How each priority connects to our solution capabilities"
        - "Alignment score: how well our roadmap matches their direction"
      sources: "Annual reports, earnings calls, executive conversations, industry analysis"
      purpose: "Connect our value to what the customer cares about, not what we want to sell."

    - section: "Whitespace Analysis"
      content:
        - "Current footprint: which teams, departments, or use cases are using our solution"
        - "Expansion opportunities: adjacent teams, additional use cases, new geographies"
        - "Estimated value per expansion opportunity"
        - "Blockers to expansion: technical, political, budget"
      purpose: "Map the full potential of the account, not just the current deal."

    - section: "Competitive Landscape"
      content:
        - "Incumbent vendors and their footprint within the account"
        - "Competitive threats: who else is prospecting this account"
        - "Our differentiation relative to each competitor"
        - "Defensive actions needed to protect existing business"
      purpose: "Know who you are competing against and where you are vulnerable."

    - section: "Relationship Map"
      content:
        - "Power map: who has influence, who has authority, who blocks"
        - "Multi-threading status: how many independent relationships exist"
        - "Relationship gaps: key stakeholders we have not yet engaged"
        - "Executive alignment: our executive mapped to their executive"
      purpose: "Relationships are the account plan's immune system. Thin relationships create fragile accounts."

    - section: "Growth Plan"
      content:
        - "12-month revenue target: expansion ARR, renewal ARR, total"
        - "Quarterly milestones: what gets done each quarter"
        - "Specific deals in pipeline with stage and expected close"
        - "Pipeline generation actions for future quarters"
      purpose: "The financial roadmap. Makes the plan measurable."

    - section: "Action Plan"
      content:
        - "Top 5 actions for the current quarter with owners and due dates"
        - "Key meetings to schedule (QBR, executive alignment, technical review)"
        - "Resources needed from extended team (SA, VE, PM, leadership)"
      purpose: "What happens next. Without specific actions, the plan stays a document."

# ==============================================================================
# WHITESPACE MAPPING
# ==============================================================================

whitespace_mapping:
  description: >
    Whitespace is the gap between what the customer could buy and what
    they currently use. Mapping whitespace systematically reveals the
    full growth potential of an account.

  dimensions:
    by_department:
      description: "Which departments or business units use our solution vs which could"
      mapping_approach:
        - "List all departments/BUs in the organization"
        - "Mark current adoption: full, partial, none"
        - "Estimate potential value per department"
        - "Prioritize by: pain alignment, champion access, budget cycle"

    by_use_case:
      description: "Which use cases are deployed vs which are available"
      mapping_approach:
        - "List all solution capabilities and use cases"
        - "Map which are active, piloted, or unused"
        - "Identify 'land' use cases (easy to adopt) vs 'expand' use cases (require deeper engagement)"
        - "Prioritize by: customer pain, time to value, reference availability"

    by_geography:
      description: "Which regions or offices use the solution vs which could"
      mapping_approach:
        - "List all geographic presences of the customer"
        - "Map current deployment footprint"
        - "Identify regions with similar use cases but no deployment"
        - "Account for regional differences: language, compliance, decision authority"

  scoring:
    potential_value: "Estimated ARR if fully penetrated"
    accessibility: "Do we have a champion and executive sponsor for this whitespace?"
    time_to_value: "How quickly can the customer see results in this area?"
    competitive_risk: "Is a competitor already addressing this whitespace?"

# ==============================================================================
# LAND AND EXPAND
# ==============================================================================

land_and_expand:
  description: >
    The most reliable enterprise growth model. Win a focused initial
    deployment, prove value, then expand systematically.

  land_phase:
    objective: "Win the initial deal with a focused, high-value use case"
    success_criteria:
      - "Use case delivers measurable value within 90 days"
      - "Initial users become advocates (NPS > 8)"
      - "Champion can articulate value in the customer's language"
    common_mistakes:
      - "Landing too broad: trying to deploy everything at once, delaying time to value"
      - "Landing too narrow: use case too small to generate meaningful internal buzz"
      - "Discounting the land deal without expansion commitment"

  expand_triggers:
    description: "Signals that expansion readiness exists"
    signals:
      - "Initial team requests additional users or features"
      - "Adjacent team asks for a demo based on word of mouth"
      - "Executive asks about broader deployment at QBR"
      - "Adoption metrics exceed success criteria"
      - "Customer references the solution in internal communications"
    timing: "Expansion conversations should start at the 60-day mark, not after renewal"

  expand_motions:
    - motion: "User expansion"
      description: "More users in the same team or department"
      trigger: "Adoption > 80% of licensed users"
      approach: "Usage-based business case, volume pricing discussion"

    - motion: "Use case expansion"
      description: "Same team, additional workflows or capabilities"
      trigger: "Current use case successful, adjacent pain identified"
      approach: "Discovery for new use case, pilot, then full deployment"

    - motion: "Department expansion"
      description: "New department or business unit adopts the solution"
      trigger: "Internal referral or executive mandate"
      approach: "Treat as a new deal with its own champion, but leverage existing proof points"

    - motion: "Platform expansion"
      description: "Customer adopts additional platform capabilities"
      trigger: "Strategic alignment between customer roadmap and platform roadmap"
      approach: "Executive alignment meeting, strategic roadmap discussion, phased adoption plan"

# ==============================================================================
# MULTI-YEAR GROWTH PLANNING
# ==============================================================================

multi_year_planning:
  description: >
    For Tier 1 accounts, plan beyond the current year. A 3-year growth
    trajectory turns account management from reactive to strategic.

  year_1:
    focus: "Land and prove value"
    targets:
      - "Win initial deal or expand existing footprint"
      - "Achieve success criteria and documented ROI"
      - "Build 3+ independent relationships"
      - "Establish executive-to-executive alignment"

  year_2:
    focus: "Expand across departments and use cases"
    targets:
      - "2x initial ARR through expansion"
      - "Deploy in 2+ departments or business units"
      - "Customer becomes a reference account"
      - "Joint success planning with customer leadership"

  year_3:
    focus: "Strategic partnership"
    targets:
      - "3x initial ARR, approaching platform standard"
      - "Embedded in customer's operating model"
      - "Customer participates in advisory board or co-innovation"
      - "Multi-year renewal with expansion commitment"

  review_cadence:
    quarterly: "Review progress against annual targets, adjust actions"
    semi_annual: "Review multi-year trajectory, update growth assumptions"
    annual: "Full account plan refresh with new 3-year horizon"

# ==============================================================================
# EXECUTIVE RELATIONSHIP STRATEGY
# ==============================================================================

executive_relationship:
  description: >
    Executive relationships are the foundation of strategic accounts.
    Without executive alignment, expansion stalls at the department level
    and renewals are vulnerable to procurement pressure.

  principles:
    - "Executive relationships are peer-to-peer. Your VP meets their VP. Your CEO meets their CEO."
    - "Every executive meeting must deliver value to the executive, not just update them on the deal."
    - "Executive engagement is not a one-time event. Maintain a cadence of strategic touchpoints."
    - "Executive relationships protect against champion departure and organizational change."

  engagement_model:
    quarterly:
      - "Executive Business Review: value delivered, strategic alignment, forward plan"
      - "At least one meeting that is not about the deal: industry insight, peer connection, strategic advice"
    semi_annual:
      - "Strategy session: customer's direction + our roadmap alignment"
      - "Executive sponsor visit (if applicable)"
    annual:
      - "Joint planning session for the coming year"
      - "Customer advisory board invitation or innovation workshop"

  multi_threading_targets:
    minimum: "3 independent relationships at 3 different levels"
    healthy: "5+ relationships across 2+ departments and 2+ seniority levels"
    strategic: "Executive-to-executive mapping with regular engagement cadence"
    risk_indicator: "Single-threaded account where all communication goes through one contact"

  executive_value_exchange:
    description: "What you offer the executive in exchange for their time and sponsorship"
    value_types:
      - "Industry benchmarking: how they compare to peers"
      - "Peer connections: introductions to executives at similar organizations"
      - "Strategic insight: trends and research relevant to their priorities"
      - "Innovation access: early access to new capabilities or roadmap input"
      - "Brand elevation: speaking opportunities, case study co-authorship"
