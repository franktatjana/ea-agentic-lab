# AE Sales Team Meeting Cadences - Domain Knowledge
# Referenced by: ae-agent-definition.yaml, ae-pipeline-mgmt-definition.yaml
# Source: "4 Meetings Every Sales Team Actually Needs" (salesdaily.co)
# Adapted to AE agent context for pipeline rhythm and forecast discipline

cadence_framework:
  principle: >
    Four meeting cadences create the operational rhythm that keeps pipeline
    moving, deals progressing, and the team aligned on revenue targets.
    Each cadence serves a distinct purpose: daily for momentum, weekly for
    strategy, monthly for patterns, quarterly for direction.

  cadences:
    - cadence: Daily Pipeline Pulse
      id: daily-pipeline-pulse
      duration: "10-15 minutes"
      frequency: daily
      purpose: >
        Quick pipeline movement check. Surface blockers early, maintain
        deal momentum, keep the team aware of what moved and what stalled.
      format:
        - "60-90 seconds per rep: what moved, what is stuck, what needs help"
        - "Shared pipeline dashboard visible during standup"
        - "No deep-dives, flag items for offline follow-up"
      participants:
        - role: AE
          contribution: "Report pipeline movement, flag stuck deals, request support"
        - role: Sales Lead
          contribution: "Listen for patterns, assign coaching, remove blockers"
      agent_integration:
        primary_agent: ae-pipeline-mgmt-agent
        supporting_agents:
          - agent: ae-signal-detection-agent
            provides: "Overnight signals that changed deal status"
          - agent: ae-opportunity-hygiene-agent
            provides: "Stale deal alerts and missing field warnings"
        automation:
          - "Auto-generate daily pulse summary from CRM activity"
          - "Flag deals with no activity in 48+ hours"
          - "Surface overnight signals (budget shifts, org changes, competitive mentions)"
        output: "Daily pipeline movement digest with flagged items"
      success_criteria:
        - "Every deal that moved or stalled in the last 24 hours is mentioned"
        - "Blockers are identified with a next action, not just surfaced"
        - "Meeting ends on time, deep-dives happen separately"
      anti_patterns:
        - "Turning it into a status report where reps read CRM notes aloud"
        - "Deep-diving into deal strategy during standup"
        - "Skipping it because nothing big happened, small movements matter"

    - cadence: Weekly Deal Strategy Session
      id: weekly-deal-strategy
      duration: "45-60 minutes"
      frequency: weekly
      purpose: >
        Deep strategic review of 1-2 key deals per rep. Coach on decision
        process, identify blockers, plan next steps. This is where deal
        craft happens.
      format:
        - "Each rep brings 1-2 deals that need strategic input"
        - "Walk through decision process, stakeholder map, and blockers"
        - "Coach on next steps: what to do, who to engage, what to ask"
        - "Peer learning: other reps contribute from their experience"
      participants:
        - role: AE
          contribution: "Present deal situation, ask for coaching on specific blockers"
        - role: Sales Lead
          contribution: "Coach on strategy, challenge assumptions, model good discovery"
        - role: SA
          contribution: "Provide technical context when deal involves architecture decisions"
      agent_integration:
        primary_agent: ae-deal-diagnosis-agent
        supporting_agents:
          - agent: ae-meddpicc-agent
            provides: "Qualification gaps and evidence strength per deal"
          - agent: ae-stakeholder-agent
            provides: "Relationship map, champion health, missing stakeholders"
          - agent: ae-commercial-strategy-agent
            provides: "Pricing positioning and competitive pressure analysis"
        automation:
          - "Pre-generate deal health brief for each reviewed deal"
          - "Highlight MEDDPICC gaps that need attention"
          - "Surface stakeholder risks (champion gone quiet, new blocker identified)"
          - "Suggest next-best-actions based on deal stage and signals"
        output: "Deal strategy brief with coaching points and action items"
      success_criteria:
        - "Reps leave with a clear plan for their reviewed deals"
        - "At least one assumption per deal is challenged and validated"
        - "Action items have owners and deadlines"
      anti_patterns:
        - "Reviewing every deal superficially instead of 1-2 deeply"
        - "Manager dictating strategy instead of coaching through questions"
        - "No follow-up on action items from previous sessions"

    - cadence: Monthly Revenue Review
      id: monthly-revenue-review
      duration: "90-120 minutes"
      frequency: monthly
      purpose: >
        Step back from individual deals to examine patterns. Win/loss
        analysis, velocity trends, conversion rates, and process gaps.
        This is where the team learns and the process improves.
      format:
        - "Win/loss patterns: what are we winning and why, what are we losing and why"
        - "Pipeline velocity: average days per stage, where deals slow down"
        - "Conversion rates: stage-to-stage progression, drop-off points"
        - "Process gaps: where is the methodology breaking down"
        - "Involve RevOps for data accuracy and trend validation"
      participants:
        - role: AE
          contribution: "Share deal narratives behind the numbers, validate patterns"
        - role: Sales Lead
          contribution: "Identify systemic issues, adjust team priorities"
        - role: RevOps
          contribution: "Provide data, validate metrics, identify process gaps"
        - role: SA
          contribution: "Technical win/loss insights, solution fit patterns"
      agent_integration:
        primary_agent: ae-pipeline-mgmt-agent
        supporting_agents:
          - agent: ae-deal-diagnosis-agent
            provides: "Win/loss analysis summaries across closed deals"
          - agent: ae-signal-detection-agent
            provides: "Trend analysis on commercial signals over the month"
          - agent: ae-meddpicc-agent
            provides: "Qualification score trends and common gap patterns"
        automation:
          - "Generate monthly pipeline velocity report"
          - "Compile win/loss pattern analysis with root causes"
          - "Calculate stage-to-stage conversion rates with trend arrows"
          - "Identify top 3 process gaps based on deal data"
          - "Compare current month against rolling 3-month average"
        output: "Monthly revenue intelligence report with trend analysis"
      success_criteria:
        - "At least one process improvement action item comes out of each review"
        - "Win/loss patterns are specific, not generic (name the pattern, cite the deals)"
        - "Velocity bottlenecks are identified with proposed countermeasures"
      anti_patterns:
        - "Reviewing numbers without asking why they changed"
        - "Blaming individual reps instead of examining process gaps"
        - "No action items: interesting data discussion that leads nowhere"

    - cadence: Quarterly Sales Offsite
      id: quarterly-sales-offsite
      duration: "Half day to full day"
      frequency: quarterly
      purpose: >
        Step away from the pipeline entirely. Combine data review with
        strategy setting and team building. Set clear priorities for the
        next quarter and align on what matters most.
      format:
        - "Quarter retrospective: what worked, what did not, what surprised us"
        - "Data deep-dive: territory analysis, segment performance, market trends"
        - "Strategy setting: priorities, focus areas, new plays to run"
        - "Team building: celebrate wins, strengthen relationships"
        - "Clear priorities: leave with 3-5 team-level objectives for next quarter"
      participants:
        - role: AE
          contribution: "Share field insights, propose plays, commit to quarterly goals"
        - role: Sales Lead
          contribution: "Set direction, align on priorities, recognize contributions"
        - role: RevOps
          contribution: "Present quarterly data analysis and territory insights"
        - role: SA
          contribution: "Share technical market trends and solution positioning updates"
        - role: Field CTO
          contribution: "Cross-account patterns, technology direction, strategic themes"
      agent_integration:
        primary_agent: ae-pipeline-mgmt-agent
        supporting_agents:
          - agent: ae-deal-diagnosis-agent
            provides: "Quarterly win/loss deep-dive with competitive analysis"
          - agent: ae-pipeline-gen-agent
            provides: "Territory whitespace analysis and target account recommendations"
          - agent: ae-commercial-strategy-agent
            provides: "Pricing effectiveness review and packaging recommendations"
        automation:
          - "Generate quarterly performance dashboard"
          - "Compile territory analysis with whitespace opportunities"
          - "Prepare competitive landscape summary"
          - "Draft quarterly objectives based on pipeline gaps and market data"
        output: "Quarterly strategy pack with retrospective, analysis, and forward plan"
      success_criteria:
        - "Team leaves with 3-5 clear priorities for the quarter"
        - "Every priority has an owner and a measurable success metric"
        - "Retrospective insights are captured and fed back into process improvements"
      anti_patterns:
        - "Turning it into a pipeline review instead of stepping back strategically"
        - "Too many priorities: if everything is a priority, nothing is"
        - "No follow-through: great offsite, same behavior next week"

# ==============================================================================
# CADENCE GOVERNANCE
# ==============================================================================

governance:
  description: >
    The cadence system only works if it is protected. Meetings that get
    skipped, shortened, or hijacked lose their value fast.

  rules:
    - "Daily pulse is sacred: skip it and deals stall silently"
    - "Weekly strategy is coaching time, not reporting time"
    - "Monthly review requires data prepared in advance, not assembled live"
    - "Quarterly offsite must be off-site (physically or mentally): no laptops for email"
    - "Each cadence has a different facilitator rotation to build leadership skills"
    - "Action items from every cadence are tracked and reviewed at the next occurrence"

  escalation_triggers:
    - trigger: "Daily pulse skipped 3+ times in a row"
      action: "Sales Lead intervenes, identifies root cause (too many meetings, wrong time)"
    - trigger: "Weekly strategy becomes a status update"
      action: "Reset format: enforce 1-2 deal deep-dive rule, remove non-strategic items"
    - trigger: "Monthly review produces no action items"
      action: "RevOps pre-loads specific questions that require decisions, not just data review"
    - trigger: "Quarterly priorities ignored within 2 weeks"
      action: "Sales Lead checkpoints at weekly strategy, asks how this week advanced quarterly goals"
