# AE Pipeline Generation - Domain Knowledge
# Referenced by: ae-pipeline-gen-definition.yaml

ideal_customer_profile:
  firmographic_criteria:
    - dimension: Company Size
      indicators: ["Employee count", "Annual revenue", "Office locations"]
      scoring: "Match against target segment thresholds"
    - dimension: Industry Vertical
      indicators: ["Primary SIC/NAICS code", "Sub-industry", "Regulatory environment"]
      scoring: "Priority verticals score higher than adjacent"
    - dimension: Technology Stack
      indicators: ["Current vendors", "Platform maturity", "Integration requirements"]
      scoring: "Complementary stack = high fit, competing stack = displacement opportunity"
    - dimension: Growth Signals
      indicators: ["Funding rounds", "Hiring patterns", "M&A activity", "New product launches"]
      scoring: "Active growth signals indicate budget availability and urgency"

trigger_events:
  high_priority:
    - "Leadership change (new CTO, CIO, VP Engineering)"
    - "Funding round closed in last 90 days"
    - "Competitor contract renewal approaching"
    - "Public statement of strategic initiative aligned to solution"
    - "Regulatory change requiring compliance investment"
  medium_priority:
    - "Hiring surge in relevant departments"
    - "Technology stack change or migration announced"
    - "Industry award or recognition (signals growth)"
    - "Conference speaking or thought leadership activity"
  low_priority:
    - "Office expansion or relocation"
    - "Minor product launches"
    - "Press coverage without strategic relevance"

prospecting_cadence:
  daily_targets:
    research_accounts: "3-5 new accounts researched per day"
    outreach_attempts: "15-25 personalized touches per day across channels"
    sdr_coordination: "Daily alignment on target accounts and messaging"
  weekly_targets:
    new_conversations: "5-8 new meaningful conversations started"
    pipeline_created: "Track against weekly pipe gen target (quota / weeks remaining * coverage ratio)"
    marketing_leverage: "2-3 marketing activities or events leveraged for outreach"
  monthly_targets:
    new_contacts: "20+ new customer/partner contacts added to network"
    territory_review: "Monthly territory coverage review and reprioritization"
    conversion_review: "Analyze outreach-to-meeting conversion rates by channel"

outreach_channels:
  multi_channel_sequence:
    - channel: Email
      best_for: "Personalized value messaging, trigger event follow-up"
      cadence: "Max 3 emails per sequence before pivot"
    - channel: Phone
      best_for: "High-value prospects, warm introductions, follow-up on engagement"
      cadence: "2-3 attempts with voicemail strategy"
    - channel: Social
      best_for: "Relationship building, content sharing, warm connection requests"
      cadence: "Engage with prospect content before direct outreach"
    - channel: Events
      best_for: "Face-to-face relationship building, demo opportunities"
      cadence: "Pre-event outreach, event engagement, post-event follow-up"
    - channel: Referrals
      best_for: "Highest conversion rate, trust transfer from existing relationships"
      cadence: "Request introductions from champions, partners, and satisfied customers"
  personalization_requirements:
    - "Reference specific trigger event or business challenge"
    - "Connect to industry-relevant outcome or peer success"
    - "Demonstrate understanding of prospect's role and priorities"
    - "Never use generic templates without customization"

conversion_benchmarks:
  targets:
    outreach_to_meeting: "8-12% conversion rate (personalized outreach)"
    meeting_to_opportunity: "25-35% conversion rate"
    opportunity_to_pipeline: "60-70% properly qualified"
  by_source:
    inbound_marketing: "Higher conversion, lower volume"
    outbound_prospecting: "Lower conversion, higher volume, more control"
    partner_referral: "Highest conversion, variable volume"
    event_follow_up: "Medium conversion, time-sensitive"
