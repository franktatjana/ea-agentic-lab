# AE Opportunity Hygiene - Domain Knowledge
# Referenced by: ae-opportunity-hygiene-definition.yaml

stale_deal_thresholds:
  warning: 14  # days without engagement activity
  critical: 21  # days without engagement activity
  measurement: "Days since last customer-initiated or customer-attended interaction"
  exclusions:
    - "Customer holidays or known office closures"
    - "Agreed waiting periods (e.g., budget cycle, board meeting)"
    - "Pauses explicitly communicated by customer"

paper_process_sla:
  legal_review:
    expected_duration: 10  # business days
    alert_threshold: "No update after 10 business days"
    escalation: "Flag to AE for follow-up with customer legal"
  security_review:
    expected_duration: 14  # business days
    alert_threshold: "No update after 14 business days"
    escalation: "Flag to AE and SA for security questionnaire follow-up"
  procurement:
    expected_duration: 7  # business days
    alert_threshold: "No update after 7 business days"
    escalation: "Flag to AE for procurement contact engagement"

health_indicators:
  GREEN:
    - "Stage accurate based on latest activity"
    - "Close date within 90 days and realistic"
    - "Next step documented and scheduled"
    - "Last customer contact within 7 days"
    - "Paper process milestones on track"
  YELLOW:
    - "Close date pushed once without stage change"
    - "Last contact 8-14 days ago"
    - "Next step documented but not scheduled"
    - "Paper process delayed but under SLA"
  RED:
    - "Stage unchanged >30 days without documented reason"
    - "Close date pushed multiple times"
    - "Last contact >14 days ago"
    - "No next step documented"
    - "Paper process exceeds SLA threshold"

hygiene_scoring:
  formula: "(GREEN opportunities / Total active opportunities) * 100"
  thresholds:
    healthy: ">= 80%"
    needs_attention: "60-79%"
    critical: "< 60%"
  weekly_report_fields:
    - "Overall hygiene score with week-over-week trend"
    - "Health distribution (GREEN/YELLOW/RED counts)"
    - "Stale deals requiring immediate action"
    - "Paper process delays with SLA status"
    - "CRM update checklist (fields that need correction)"

crm_field_checks:
  required_fields:
    - field: "Close Date"
      rule: "Must be in the future for active opportunities"
    - field: "Next Step"
      rule: "Must be non-empty with a specific action"
    - field: "Amount"
      rule: "Must be >0 with currency specified"
    - field: "Stage"
      rule: "Must match latest activity evidence"
    - field: "Last Activity Date"
      rule: "Must reflect actual last customer interaction"
