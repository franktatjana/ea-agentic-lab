# AE Negotiation Framework - Domain Knowledge
# Referenced by: ae-deal-diagnosis-definition.yaml, ae-meeting-prep-definition.yaml

negotiation_principles:
  - "Never negotiate against yourself. Wait for the customer to make the first move on terms."
  - "Every concession must be traded for something of value, never given freely."
  - "Separate the people from the problem. Negotiate terms, not relationships."
  - "Know your walk-away before you enter the room. If you don't, you will concede too much."
  - "Silence is a negotiation tool. After stating your position, let the customer respond."
  - "The deal is not done until the contract is signed. Verbal agreements are intentions, not commitments."

# ==============================================================================
# NEGOTIATION PREPARATION
# ==============================================================================

preparation:
  description: >
    Negotiation outcomes are determined before the meeting starts.
    Preparation is the most important phase.

  pre_negotiation_checklist:
    - item: "Define your BATNA"
      description: "Best Alternative to Negotiated Agreement. What happens if this deal doesn't close?"
      questions:
        - "What is the revenue impact of walking away?"
        - "Is there a competing deal that could fill the pipeline gap?"
        - "What does the customer's BATNA look like? (competitor, build, do nothing)"

    - item: "Set your range"
      description: "Define the ideal, target, and walk-away points for every negotiable term"
      terms:
        - term: Price
          ideal: "List price"
          target: "Within approved discount band"
          walk_away: "Below floor price requires VP approval"
        - term: Contract length
          ideal: "Multi-year (3 years)"
          target: "Annual with auto-renewal"
          walk_away: "Month-to-month is not acceptable for enterprise"
        - term: Payment terms
          ideal: "Annual upfront"
          target: "Quarterly"
          walk_away: "Net 90+ requires finance approval"
        - term: Scope
          ideal: "Full platform"
          target: "Core platform with expansion path"
          walk_away: "Scope too narrow to demonstrate value"

    - item: "Map the decision makers"
      description: "Know who approves what and who can override terms"
      questions:
        - "Who has authority to sign?"
        - "Who controls procurement terms?"
        - "Who can override standard legal terms?"
        - "Is there an approval chain above your contact?"

    - item: "Anticipate objections"
      description: "Prepare responses for the 3 most likely pushback points"
      sources: ["Previous conversations", "Industry benchmarks", "Competitor pricing intelligence"]

# ==============================================================================
# PRICING STRATEGY
# ==============================================================================

pricing_strategy:
  anchoring:
    definition: "Set the initial price reference point high to frame the negotiation"
    rules:
      - "Always present list price first, even if you expect to discount"
      - "Anchor to value delivered, not cost to serve"
      - "If the customer anchors first with a low number, reframe around total value before countering"
      - "Never reveal your floor price. The first number sets the range."

  packaging:
    description: >
      Packaging creates negotiation flexibility without reducing price.
      Offer different bundles, not lower prices.
    strategies:
      - strategy: "Good / Better / Best"
        description: "Three tiers with clear value differentiation. Guide customer to the middle tier."
        rule: "The middle tier should be the target. The top tier makes it look reasonable."
      - strategy: "Modular add-ons"
        description: "Core platform plus optional modules. Allows scope-based negotiation."
        rule: "Never unbundle to the point where the core cannot demonstrate value."
      - strategy: "Multi-year incentive"
        description: "Better price per year in exchange for longer commitment."
        rule: "Multi-year discount should be funded by reduced churn risk, not margin erosion."

  discount_governance:
    rules:
      - "Discounts must be justified by a business reason, not just 'customer asked'"
      - "Standard discount authority: AE up to 10%, Sales Manager up to 20%, VP required above 20%"
      - "Document every discount with justification for deal review and precedent tracking"
      - "Never discount without getting something in return (longer term, faster close, reference, case study)"
    anti_patterns:
      - "Offering discount before being asked"
      - "Matching competitor price without understanding what competitor excludes"
      - "Discounting to 'make the deal happen' without confirming it actually will"
      - "Giving the same discount to every customer regardless of deal size or strategic value"

# ==============================================================================
# CONCESSION TRADING
# ==============================================================================

concession_trading:
  description: >
    Never give something for nothing. Every concession should be traded
    for something that advances the deal or increases its value.

  trade_matrix:
    - give: "Price reduction"
      get_options:
        - "Longer contract term"
        - "Upfront annual payment"
        - "Larger scope (more users, more modules)"
        - "Customer reference or case study commitment"
        - "Earlier close date"

    - give: "Extended payment terms"
      get_options:
        - "Higher total contract value"
        - "Auto-renewal clause"
        - "Reduced legal review scope (use standard terms)"

    - give: "Additional services (training, implementation)"
      get_options:
        - "Executive sponsor engagement for success planning"
        - "Joint marketing or co-presentation at event"
        - "Expansion commitment tied to successful adoption"

    - give: "Faster implementation timeline"
      get_options:
        - "Customer commits dedicated project resources"
        - "Customer provides data access on agreed schedule"
        - "Reduced scope for phase 1 with committed phase 2"

  rules:
    - "State concessions conditionally: 'If we can do X, would you be able to commit to Y?'"
    - "Never concede on price and terms simultaneously. Negotiate one dimension at a time."
    - "Make concessions progressively smaller. Large first concession signals room to keep going."
    - "Always get agreement on remaining items before finalizing any single concession."

# ==============================================================================
# NEGOTIATION STAGES
# ==============================================================================

stages:
  - stage: "Opening"
    objective: "Establish the framework for negotiation"
    tactics:
      - "Summarize mutual understanding of the business problem and agreed value"
      - "Confirm the decision process and remaining steps"
      - "Set expectations: 'Let's find terms that work for both sides'"
    avoid: "Jumping straight to price before establishing value context"

  - stage: "Exploration"
    objective: "Understand the customer's priorities and constraints"
    tactics:
      - "Ask what terms matter most to them and why"
      - "Listen for flexibility signals: 'ideally' and 'if possible' indicate negotiable items"
      - "Identify their constraints (budget cycle, approval thresholds, procurement rules)"
    avoid: "Assuming you know their constraints without asking"

  - stage: "Proposal"
    objective: "Present terms that align to both parties' interests"
    tactics:
      - "Lead with the package that matches their stated priorities"
      - "Present options, not a single take-it-or-leave-it offer"
      - "Connect every term back to the business value it enables"
    avoid: "Presenting the cheapest option first or leading with discounts"

  - stage: "Bargaining"
    objective: "Exchange concessions to reach agreement"
    tactics:
      - "Trade concessions, don't gift them"
      - "Make smaller concessions each round to signal approaching your limit"
      - "Use silence after counter-offers. Let them process."
      - "If stuck, change the dimension: move from price to scope, terms, or timeline"
    avoid: "Splitting the difference as default. It rewards extreme opening positions."

  - stage: "Closing"
    objective: "Confirm agreement and document terms"
    tactics:
      - "Summarize all agreed terms verbally before documenting"
      - "Confirm there are no remaining open items"
      - "Set specific next step for contract execution with dates and owners"
      - "Thank the customer for the partnership"
    avoid: "Introducing new terms or reopening resolved items at closing"

# ==============================================================================
# CUSTOMER NEGOTIATION TACTICS AND RESPONSES
# ==============================================================================

customer_tactics:
  description: >
    Recognize common negotiation tactics used by customers and their
    procurement teams. Respond strategically, not reactively.

  tactics:
    - tactic: "The Flinch"
      description: "Customer reacts with shock to the price to pressure a concession"
      response: "Acknowledge the reaction, then redirect to value. 'I understand. Let me walk through the ROI that supports this investment.'"

    - tactic: "Good Cop / Bad Cop"
      description: "One customer stakeholder is supportive, another plays the tough negotiator"
      response: "Address both parties. Acknowledge the concern, but negotiate on substance, not pressure."

    - tactic: "The Deadline"
      description: "Customer creates artificial urgency ('we need this done by Friday or we go with competitor')"
      response: "Validate the timeline concern, but don't panic-concede. 'What specifically needs to happen by Friday? Let's see if we can meet that without rushing the terms.'"

    - tactic: "Cherry-picking"
      description: "Customer wants to mix the lowest price from vendor A with the features of vendor B"
      response: "Reframe around total value and total cost of ownership. 'Comparing line items across vendors misses the integration and support differences that drive real cost.'"

    - tactic: "The Nibble"
      description: "After main terms are agreed, customer adds small requests ('can you throw in training?')"
      response: "Treat every ask as a negotiation point. 'We can include training if we can confirm the close date this week.'"

    - tactic: "Silence / Going Dark"
      description: "Customer stops responding to create pressure or test your patience"
      response: "Reach out once with a value-add (not a discount). If no response, engage through champion or alternate contact."
