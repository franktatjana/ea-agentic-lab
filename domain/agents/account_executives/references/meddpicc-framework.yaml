# AE Qualification - Domain Knowledge
# Referenced by: ae-qualification-definition.yaml

dimensions:
  metrics:
    definition: "Quantified value the customer expects from the solution"
    scoring:
      STRONG: "Customer has stated specific ROI targets with baseline measurements"
      ADEQUATE: "General value expectations discussed but not quantified"
      WEAK: "No metrics discussed, value proposition assumed by seller"
      UNKNOWN: "No evidence available"
    evidence_sources: ["Discovery notes", "Business case documents", "Customer presentations"]

  economic_buyer:
    definition: "Person with budget authority and final decision power"
    scoring:
      STRONG: "Identified by name, engaged in process, budget confirmed"
      ADEQUATE: "Identified but not yet engaged directly"
      WEAK: "Assumed based on title, no direct interaction"
      UNKNOWN: "Not identified"
    evidence_sources: ["CRM contacts", "Meeting attendees", "Org chart"]

  decision_criteria:
    definition: "Technical, business, and vendor criteria the customer uses to evaluate"
    scoring:
      STRONG: "Documented criteria shared by customer, solution maps to each"
      ADEQUATE: "Partial criteria known, some gaps in mapping"
      WEAK: "Criteria assumed from industry norms, not validated"
      UNKNOWN: "No criteria discussed"
    evidence_sources: ["RFP documents", "Discovery notes", "Technical evaluation results"]

  decision_process:
    definition: "Steps, stakeholders, and timeline required to reach approval"
    scoring:
      STRONG: "Full process mapped with named stakeholders and target dates"
      ADEQUATE: "General steps known, some stakeholders or dates missing"
      WEAK: "Process assumed, not validated with customer"
      UNKNOWN: "No process information available"
    evidence_sources: ["Customer-shared timeline", "Procurement team input", "Meeting notes"]

  paper_process:
    definition: "Procurement, legal, and security review steps required post-decision"
    scoring:
      STRONG: "All paper process steps identified with owners and timelines"
      ADEQUATE: "Known that paper process exists, partial steps mapped"
      WEAK: "Paper process not discussed, assumed standard"
      UNKNOWN: "No information on procurement requirements"
    evidence_sources: ["Procurement contacts", "Legal review status", "Security questionnaire"]

  identify_pain:
    definition: "Business pain driving urgency and budget allocation"
    scoring:
      STRONG: "Customer articulated pain with business impact and urgency"
      ADEQUATE: "Pain identified but impact or urgency unclear"
      WEAK: "Pain assumed by seller, not validated by customer"
      UNKNOWN: "No pain discussion on record"
    evidence_sources: ["Discovery call notes", "Customer emails", "Executive conversations"]

  champion:
    definition: "Internal advocate who sells on your behalf when you are not in the room"
    scoring:
      STRONG: "Active champion, regular contact (weekly), provides internal intelligence"
      ADEQUATE: "Supportive contact but passive, does not proactively advocate"
      WEAK: "Friendly contact but no evidence of internal advocacy"
      UNKNOWN: "No champion identified"
    evidence_sources: ["Contact frequency", "Internal information shared", "Meeting facilitation"]

  competition:
    definition: "Competitors being evaluated, their positioning, and your differentiation"
    scoring:
      STRONG: "Competitors identified, differentiation clear, customer prefers our approach"
      ADEQUATE: "Some competitors known, differentiation partially established"
      WEAK: "Competitor activity suspected but not confirmed"
      UNKNOWN: "No competitive intelligence available"
    evidence_sources: ["Signal detection data", "Customer mentions", "RFP vendor list"]

confidence_calculation:
  formula: "Average of dimension scores weighted equally"
  score_mapping:
    STRONG: 100
    ADEQUATE: 65
    WEAK: 30
    UNKNOWN: 0
  thresholds:
    high_confidence: ">= 75%"
    moderate_confidence: "60-74%"
    low_confidence: "40-59%"
    at_risk: "< 40%"
  flag_threshold: "Deals below 60% flagged for immediate attention"
