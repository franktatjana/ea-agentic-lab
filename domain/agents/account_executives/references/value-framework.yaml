# AE Value Framework - Domain Knowledge
# Referenced by: ae-signal-detection-definition.yaml, ae-meeting-prep-definition.yaml, ae-meddpicc-definition.yaml

value_articulation:
  structure:
    why_now:
      definition: "The compelling event driving urgency for a decision"
      questions:
        - "What happens if you don't solve this in the next 90 days?"
        - "What changed that makes this a priority now versus six months ago?"
        - "Is there a budget cycle, regulatory deadline, or strategic initiative driving timing?"
      evidence_required: "Customer-stated event with a date, not seller-assumed urgency"

    primary_value_driver:
      definition: "The business problem the customer is trying to solve, independent of any vendor"
      categories:
        - "Revenue growth: expanding markets, increasing deal velocity, improving win rates"
        - "Cost reduction: eliminating redundancy, automating manual processes, reducing headcount dependency"
        - "Risk mitigation: regulatory compliance, security posture, business continuity"
        - "Operational efficiency: faster time-to-market, reduced cycle times, improved quality"
      rule: "Value driver must be stated by the customer, not assumed by the seller"

    why_us:
      definition: "Why the customer chooses this solution over alternatives, from the customer's perspective"
      sources:
        - "Unique capability that competitors cannot match"
        - "Integration advantage with existing technology stack"
        - "Total cost of ownership advantage over build or buy alternatives"
        - "Proven results with similar organizations in the same industry"
        - "Strategic partnership value beyond the immediate product"
      rule: "Must be validated by customer statements, not internal marketing claims"

    cost_of_inaction:
      definition: "What happens if the customer does nothing? The negative consequences of maintaining status quo."
      dimensions:
        - "Financial: quantified cost of the problem per month/quarter/year"
        - "Operational: efficiency losses, manual workarounds, error rates"
        - "Competitive: market share erosion, slower time-to-market"
        - "Risk: compliance exposure, security vulnerabilities, business continuity gaps"
        - "People: team burnout, talent retention, productivity loss"
      rule: "Cost of inaction must be quantified where possible. Vague 'it would be bad' is not sufficient."

before_after_scenario:
  format:
    before:
      label: "Current State"
      captures: ["Current process", "Pain points", "Quantified cost/impact", "Who is affected"]
    after:
      label: "Desired Future State"
      captures: ["Improved process", "Expected outcomes", "Quantified value", "Timeline to achieve"]
    delta:
      label: "Value Gap"
      captures: ["Difference between before and after", "ROI calculation", "Payback period"]
  rule: "Before/after must be customer-validated, not seller-projected"

value_selling_principles:
  - "Lead with the business problem, not the product"
  - "Quantify the cost of the problem before presenting the solution"
  - "Connect every capability to a business outcome the customer cares about"
  - "Use customer language, not vendor terminology"
  - "Negative consequences of inaction create more urgency than positive outcomes"
  - "Value must be validated by the economic buyer, not just the champion"
