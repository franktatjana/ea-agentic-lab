# AE Pipeline Management Agent
# Sub-agent of Account Executive Agent (ae-agent)
# Owns: forecast accuracy, pipeline coverage, next-best-action prioritization
#
# LICENSE: CC BY 4.0 — https://creativecommons.org/licenses/by/4.0/

agentspec_version: "26.1.0"
component_type: Agent

id: ae-pipeline-mgmt-agent
name: AE Pipeline Management Agent
description: >
  Forecast calls fail when they rely on gut feel instead of engagement data.
  This agent scores commit confidence per deal, calculates whether pipeline
  coverage actually supports the target, and surfaces the five actions that
  will move the number most today.

metadata:
  definition_version: "0.1.0"
  parent_agent: ae-agent
  tags:
    - pipeline
    - forecast
    - coverage
    - prioritization
  responsibility: >
    Provide portfolio-level pipeline visibility with evidence-based forecast
    confidence scoring and actionable priority recommendations.

system_prompt: |
  You are a Pipeline Management Agent, part of the Account Executive
  intelligence system. Your job is to maintain portfolio-level visibility.

  You MUST:
  - Assess commit confidence per deal based on engagement signals
  - Calculate pipeline coverage ratios against quarterly targets
  - Identify the top 5 priority actions ranked by deal impact and urgency
  - Flag forecast risks with specific evidence
  - Quantify with dates, values (EUR/USD), and percentages

  You MUST NOT:
  - Diagnose individual deal health in depth (Deal Diagnosis Agent's domain)
  - Write risk alerts (you are read-only)
  - Prepare meeting materials (Meeting Preparation Agent's domain)
  - Scan communications for signals (Signal Detection Agent's domain)
  - Invent pipeline metrics not supported by CRM data

  Your output is always portfolio-level: patterns across deals, coverage
  gaps, forecast confidence distributions. If asked about a single deal,
  redirect to Deal Diagnosis Agent.

human_in_the_loop: true

tools:
  - component_type: ClientTool
    id: read-crm-data
    name: Read CRM Data
    description: Access pipeline summary, opportunity stages, close dates, and deal values
    requires_confirmation: false
    inputs:
      - title: query
        type: string
    outputs:
      - title: crm_data
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry
      error_responses:
      - error_code: SOURCE_UNAVAILABLE
        guidance: CRM unavailable, cannot proceed with pipeline data
      - error_code: RECORD_NOT_FOUND
        guidance: Record not found in CRM, verify identifiers with user

  - component_type: ClientTool
    id: read-infohub
    name: Read InfoHub
    description: >
      Access structured account data from the InfoHub vault. Use section parameter
      to target specific data: risks, decisions, stakeholders, competitive,
      governance, value, journey, opportunities, context, or frameworks.
    requires_confirmation: false
    inputs:
      - title: realm_id
        type: string
      - title: node_id
        type: string
      - title: section
        type: string
      - title: detail_level
        type: string
    outputs:
      - title: infohub_data
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry
      error_responses:
      - error_code: SOURCE_UNAVAILABLE
        guidance: Proceed with other data sources, flag output as incomplete
      - error_code: SECTION_NOT_FOUND
        guidance: Section does not exist for this account, skip and note gap
      - error_code: STALE_DATA
        guidance: Data exceeds freshness threshold, flag for human verification

  - component_type: ClientTool
    id: save-pipeline-intelligence
    name: Save Pipeline Intelligence
    description: Persist forecast assessments and coverage analysis to InfoHub
    requires_confirmation: false
    inputs:
      - title: assessment
        type: object
      - title: quarter
        type: string
    outputs:
      - title: status
        type: string
    x-ea-agent:
      risk: low
      resolver: service-registry

  - component_type: ClientTool
    id: ask-user
    name: Ask User
    description: Request clarification from account executive
    requires_confirmation: false
    inputs:
      - title: question
        type: string
    outputs:
      - title: answer
        type: string
    x-ea-agent:
      risk: low
      resolver: inline

toolboxes:
  - component_type: Toolbox
    id: pipeline-intelligence
    name: Pipeline Intelligence
    description: Forecast confidence and coverage analysis available to peer agents and leadership
    tools:
      - id: get-forecast-confidence
        name: Get Forecast Confidence
        description: Returns commit confidence per deal or across portfolio with supporting signals
        inputs:
          - title: quarter
            type: string
        outputs:
          - title: forecast_assessment
            type: object
      - id: get-coverage-analysis
        name: Get Coverage Analysis
        description: Returns pipeline coverage ratio against target with gap breakdown
        inputs:
          - title: quarter
            type: string
          - title: target_value
            type: number
        outputs:
          - title: coverage_analysis
            type: object
specialized_agents: []

flows:
  - component_type: Flow
    id: pipeline-management
    name: Pipeline Management
    description: Assess forecast accuracy, analyze pipeline coverage, and identify daily priority actions.
    inputs:
      - title: pipeline_deals
        type: array
      - title: quarter
        type: string
      - title: target_value
        type: number
      - title: win_rate
        type: number
    outputs:
      - title: forecast_risk_assessment
        type: object
      - title: coverage_analysis
        type: object
      - title: priority_actions
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: ae-forecast-accuracy
          input: pipeline_deals, quarter
          tools: [read-crm-data, read-infohub]
          description: Assess commit confidence per deal based on engagement and signals
          on_failure: stop
        - step: 2
          prompt: ae-pipeline-coverage
          input: pipeline_value, target_value, win_rate
          tools: [read-crm-data]
          description: Calculate coverage ratio, identify gap, recommend pipeline generation
          on_failure: stop
        - step: 3
          prompt: ae-next-best-action
          input: active_opportunities, recent_signals
          description: Top 5 priority actions ranked by deal impact and urgency
          on_failure: skip_with_warning
        - step: 4
          action: persist
          tools: [save-pipeline-intelligence]
          description: Save forecast assessment and coverage analysis to InfoHub
          on_failure: stop

  - component_type: Flow
    id: territory-planning
    name: Territory Planning
    description: Analyze territory coverage, tier accounts, identify whitespace, and build three-horizon pipeline plan.
    inputs:
      - title: territory_accounts
        type: array
      - title: quota_target
        type: number
      - title: current_pipeline
        type: object
    outputs:
      - title: account_tiers
        type: object
      - title: whitespace_analysis
        type: object
      - title: horizon_plan
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: ae-territory-analysis
          input: territory_accounts, quota_target, current_pipeline
          tools: [read-crm-data]
          description: Tier accounts by revenue potential and engagement, identify coverage gaps
          on_failure: stop
        - step: 2
          prompt: ae-horizon-plan
          input: account_tiers, whitespace_analysis
          description: Build three-horizon plan (close now, qualify next quarter, prospect for future)
          on_failure: skip_with_warning
        - step: 3
          action: persist
          tools: [save-pipeline-intelligence]
          description: Save territory plan and account tiers to InfoHub
          on_failure: stop

a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: "0.1"
    capabilities:
      - forecast-accuracy
      - pipeline-coverage
      - priority-actions
      - territory-planning
    input_modes:
      - text/plain
      - application/json
    output_modes:
      - application/json
      - text/markdown

x-ea-agent:

  prompt_registry:
    ae-forecast-accuracy:
      description: Identify deals that may slip from forecast with commit confidence assessment
      source: prompts/tasks.yaml#pipeline_management.forecast_accuracy
      inputs:
        - title: stage
          type: string
        - title: quarter
          type: string
      outputs:
        - title: forecast_risk_assessment
          type: object
      requires_data:
      - source: read-crm-data
        fields: [deal_stages, close_dates, deal_values, activity_log]
        priority: critical
      - source: read-infohub
        fields: [deal_health_scores, qualification_data]
        priority: enrichment

    ae-pipeline-coverage:
      description: Assess if pipeline is sufficient for target with coverage ratio and gap analysis
      source: prompts/tasks.yaml#pipeline_management.pipeline_coverage
      inputs:
        - title: pipeline_value
          type: number
        - title: target_value
          type: number
        - title: win_rate
          type: number
      outputs:
        - title: coverage_analysis
          type: object
      requires_data:
      - source: read-crm-data
        fields: [pipeline_summary, deal_values, win_rate_history]
        priority: critical

    ae-next-best-action:
      description: Identify highest-impact daily priority actions across active opportunities
      source: prompts/tasks.yaml#pipeline_management.next_best_action
      inputs: []
      outputs:
        - title: priority_actions
          type: object
      requires_data:
      - source: read-crm-data
        fields: [active_opportunities, close_dates, risk_levels]
        priority: critical
      - source: read-infohub
        fields: [deal_health_scores, meeting_schedule]
        priority: enrichment

    ae-territory-analysis:
      description: Tier territory accounts by revenue potential, engagement level, and ICP fit
      source: prompts/tasks.yaml#pipeline_management.territory_analysis
      inputs:
        - title: territory_accounts
          type: array
        - title: quota_target
          type: number
      outputs:
        - title: account_tiers
          type: object
      requires_data:
      - source: read-crm-data
        fields: [territory_accounts, revenue_data, pipeline_by_account]
        priority: critical
      - source: read-infohub
        fields: [account_profiles, icp_scores]
        priority: enrichment

    ae-horizon-plan:
      description: Build three-horizon pipeline plan mapping accounts to close/qualify/prospect timelines
      source: prompts/tasks.yaml#pipeline_management.horizon_plan
      inputs:
        - title: account_tiers
          type: object
        - title: whitespace_analysis
          type: object
      outputs:
        - title: horizon_plan
          type: object
      requires_data:
      - source: read-crm-data
        fields: [deal_pipeline, commit_values, stage_distribution]
        priority: critical
      - source: read-infohub
        fields: [account_context, historical_patterns]
        priority: enrichment

  boundaries:
    - Portfolio-level analysis only, does not diagnose individual deal health
    - Read-only, does not write risk alerts or modify CRM data
    - Does not prepare meeting materials or stakeholder briefs
    - Does not scan communications for signals

  permissions:
    - Read pipeline summary and all opportunity data from CRM
    - Assess forecast confidence per deal and across portfolio
    - Calculate pipeline coverage ratios and identify gaps
    - Recommend priority actions based on deal impact and urgency

  guardrails:
    input_validation:
      - Reject forecast requests without quarterly target or pipeline data
      - Reject coverage analysis without documented win rate
    output_checks:
      - Forecast confidence must be based on explicit evidence, not optimism
      - Coverage ratio must use documented win rate, not assumed
      - Priority actions must be specific and actionable with deal names
      - All values must include currency units (EUR, USD) and dates
    signal_validation:
      - Never extrapolate timeline commitments from vague language
      - All dates must be specific, reject "soon" or "next quarter"
      - Flag when underlying data is stale (>7 days) or incomplete
      - Confidence percentages must cite engagement signals as evidence
  error_handling:
    tool_failures:
      critical: [read-crm-data]
      enrichment: [read-infohub]
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification

  knowledge:
    scope:
      domains: [pipeline-management, forecasting]
      archetypes: [enterprise, mid-market]
    references:
      - path: references/pipeline-methodology.yaml
        description: Forecast methodology, stage progression criteria, coverage ratio benchmarks, commit confidence scoring
      - path: references/roi-methodology.yaml
        description: Business case strength indicators, value realization phases, ROI as forecast confidence input
      - path: references/account-planning.yaml
        description: Strategic account planning, whitespace mapping, land-and-expand motions, multi-year growth planning

  autonomy:
    triggers:
      - type: parent_dispatch
        source: ae-agent
        description: AE orchestrator routes pipeline, forecast, and territory requests
      - type: schedule
        cadence: weekly
        window: monday 08:00-09:00
        description: Weekly pipeline review with forecast confidence and coverage analysis
      - type: schedule
        cadence: quarterly
        window: first_week
        description: Quarterly territory planning and account re-tiering
      - type: downstream
        source: ae-deal-diagnosis-agent
        condition: deal_health.classification == RED
        payload_expected: [deal_health_assessment, risk_impact_on_forecast]
        description: RED deal triggers forecast and priority recalculation
      - type: downstream
        source: ae-opportunity-hygiene-agent
        condition: hygiene_report.generated == true
        payload_expected: [hygiene_report, pipeline_health_metrics]
        description: Hygiene report feeds pipeline health context
    outputs:
      - type: parent_return
        target: ae-agent
        payload: [forecast_risk_assessment, coverage_analysis, priority_actions]
        description: Pipeline analysis back to orchestrator
      - type: trigger_agent
        target: ae-pipeline-gen-agent
        condition: coverage_ratio < 3.0 OR pipeline_gap > 0
        payload: [coverage_analysis, gap_details, territory_context]
        description: Coverage gap triggers prospecting and pipeline generation
      - type: notify_human
        condition: forecast_variance > 15 OR coverage_ratio < 2.0
        channel: alert
        description: Forecast risk or critical coverage gap surfaces for AE review
    consumes_toolboxes:
      - toolbox: poc-intelligence
        agent: poc-agent
        tools: [get-poc-status]
        reason: POC status affects deal confidence
    dependencies:
      - agent: ae-deal-diagnosis-agent
        toolbox: deal-intelligence
        tools: [get-deal-health]
        purpose: Deal-level risk data for portfolio forecast confidence
      - agent: ae-opportunity-hygiene-agent
        toolbox: hygiene-reports
        tools: [get-hygiene-report]
        purpose: Pipeline cleanliness metrics for accurate forecasting
