      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: CALCULATE HEALTH DISTRIBUTION
      Classify every active opportunity as GREEN, YELLOW, or RED using the standard
      health indicator criteria. Calculate count and percentage for each status.
      Compare to last week's distribution to show trend.
      Deliverable: Health Distribution (Status | Count | % of Pipeline | Value | WoW Change).

      STEP 2: COMPILE ACTIVITY METRICS
      Aggregate this week's activity: opportunities updated, customer meetings held,
      deals advanced to next stage, new opportunities created, deals closed (won and lost),
      and total pipeline value change.
      Deliverable: Activity Metrics (Metric | This Week | Last Week | WoW Change | Target).

      STEP 3: IDENTIFY ATTENTION ITEMS
      List specific items requiring attention:
      - Stale opportunities (>14 days no contact)
      - Hygiene violations (missing next steps, stale close dates, inaccurate stages)
      - At-risk deals (YELLOW or RED status with high value)
      - Overdue commitments (actions promised but not completed)
      Deliverable: Attention Items (Item | Opportunity | Issue | Value at Risk | Commercial Impact: Renewal/Expansion/Neither | Priority).

      STEP 4: CALCULATE HYGIENE SCORE
      Compute overall hygiene score as percentage: (opportunities with all hygiene
      criteria met / total opportunities) * 100. Break down by criterion:
      stage accuracy %, close date realism %, engagement recency %, next steps quality %.
      Deliverable: Hygiene Score (Overall % | Stage % | Dates % | Engagement % | Steps % | WoW Trend).

      STEP 5: GENERATE RECOMMENDATIONS
      Based on the data, provide 3-5 specific recommendations for next week:
      - Which opportunities to focus on (name them)
      - Which hygiene issues to fix first (specific fields/updates)
      - Which deals to discuss with manager (if any)
      Deliverable: Weekly Recommendations (Recommendation | Opportunity | Expected Impact | Effort).


      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Data Availability Map completed first
      2. If 2+ dimensions LOW, Signal Acquisition Mode used and scoring steps NOT produced
      3. Scores on LOW-richness data marked "estimated" with basis
      4. Interpretive assessments include confidence levels
      5. All opportunities are counted, health distribution sums to 100%
      6. Activity metrics use precise counts, not estimates
      7. Week-over-week comparisons use same methodology both weeks
      8. Hygiene score formula is transparent and reproducible
      9. Recommendations name specific opportunities, not general advice
      10. Value at risk is calculated, not estimated

      Produce all deliverables (Data Availability Map + 5 step deliverables in normal mode,
      or Data Availability Map + Signal Acquisition Plan in signal acquisition mode).
      Lead with a 2-sentence summary: hygiene score this week, trend direction, and the
      single most important action for next week.

  crm_update_checklist:
    name: "CRM Update Checklist"
    description: "Generate CRM update checklist for opportunity"
    prompt: |
      You are generating a CRM update checklist for {opportunity_name} at {account_name}.
      Recent activity: {recent_activity}. Current CRM state: {crm_state}.
      Account state: {account_state}.

      This runbook identifies all CRM fields needing updates based on recent activity
      and generates specific update recommendations.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: COMPARE CRM STATE TO REALITY
      For each key CRM field, compare the current value against evidence from recent activity:
      - Stage: does activity support current stage, or has deal advanced/regressed?
      - Close date: is the date still realistic given timeline signals?
      - Amount: has deal size changed (scope change, additional products, reduced scope)?
      - Forecast category: does confidence support current category?
      - Next steps: are current next steps still relevant?
      Deliverable: Field Comparison (Field | CRM Value | Evidence-Based Value | Match Y/N | Update Needed).

      STEP 2: IDENTIFY ACTIVITIES TO LOG
      List all interactions from recent activity not yet logged in CRM: calls, emails,
      meetings, demos, and internal discussions about this account. For each, specify
      the activity type, date, participants, and key outcome.
      Deliverable: Activity Log (Activity | Type | Date | Participants | Outcome | Logged in CRM Y/N).

      STEP 3: DRAFT NOTES AND UPDATES
      For each field needing update (from Step 1), draft the specific text to enter:
      - Next steps: write the actual text (specific action + owner + date)
      - Notes: write the summary to add (key decisions, signals, risks)
      - Custom fields: identify any custom fields (MEDDPICC scores, health status) needing refresh
      Deliverable: Update Drafts (Field | Current | Recommended Update Text | Reason for Change).

      STEP 4: IDENTIFY CONTACT UPDATES
      Check for new contacts encountered or existing contacts with changed information:
      role changes, new stakeholders mentioned, contacts who left the account, and
      email/phone updates.
      Deliverable: Contact Updates (Contact | Action (Add/Update/Remove) | Details | Source).

      STEP 5: GENERATE CHECKLIST
      Compile all updates into a prioritized checklist grouped by: critical updates
      (stage, amount, close date), activity logging, notes and next steps, and contact
      management. Estimate total time to complete all updates.
      Deliverable: CRM Checklist (Priority | Update | Field | Action | Est. Time Minutes).


      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Stage recommendations are based on evidence, not assumption
      2. Close date recommendations account for remaining milestones
      3. Next steps text is specific (action + owner + date), not vague
      4. No activities are missed in the logging section
      5. Contact updates include evidence source
      6. Time estimate is realistic (total should be 5-15 minutes typically)

      Produce all 5 deliverables. Lead with a 1-sentence summary: number of fields
      needing update and estimated time to complete.

# ============================================================================
# PIPELINE GENERATION PROMPTS
# ============================================================================
pipeline_generation:

  prospect_research:
    name: "Prospect Research"
    description: "Research prospects against ICP, identify trigger events and whitespace"
    prompt: |
      You are researching prospective accounts for pipeline generation.
      Territory context: {territory_context}. Coverage gap: {coverage_gap}.
      ICP criteria: {icp_criteria}.
      Account state: {account_state}.

      This runbook produces an ICP-scored prospect list with trigger events,
      whitespace analysis, and recommended entry strategies.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: SCORE PROSPECTS AGAINST ICP
      For each potential prospect, score against ICP dimensions:
      - Industry fit (0-3): exact match, adjacent, tangential, no fit
      - Company size (0-3): sweet spot, acceptable, stretch, outside range
      - Tech stack alignment (0-3): complementary, neutral, competitive, incompatible
      - Pain signal presence (0-3): confirmed pain, likely pain, possible pain, no evidence
      Calculate total ICP score (0-12) and filter out scores below 6.
      Deliverable: ICP Scoring (Company | Industry | Size | Tech Stack | Pain Signals | Score /12 | Pass Y/N).

      STEP 2: IDENTIFY TRIGGER EVENTS
      For passing prospects, research recent trigger events that create urgency:
      - Leadership changes (new CTO, CIO, VP Engineering)
      - Funding events (Series B+, IPO prep, debt raise)
      - Expansion signals (new office, hiring surge, M&A)
      - Technology migration (cloud migration, vendor replacement, digital transformation)
      - Pain indicators (layoffs, negative reviews, compliance issues)
      Capture date, source, and relevance to our solution.
      Deliverable: Trigger Events (Company | Event | Date | Source | Relevance | Urgency Window).

      STEP 3: MAP WHITESPACE
      For each prospect, identify untapped areas: departments not using solutions like ours,
      use cases we serve that they likely need, geographic expansion creating new needs.
      Estimate the total addressable opportunity within each account.
      Deliverable: Whitespace Map (Company | Department | Use Case | Estimated Value | Confidence).

      STEP 4: IDENTIFY ENTRY POINTS
      For each top prospect, determine the best entry path:
      - Target persona (title, department, level)
      - Channel (LinkedIn, email, warm intro, event)
      - Message hook tied to their specific trigger event
      - Mutual connections or shared contexts
      Deliverable: Entry Points (Company | Target Persona | Channel | Message Hook | Mutual Connection | Priority).

      STEP 5: PRIORITIZE PROSPECT LIST
      Rank all passing prospects by: (ICP score * trigger urgency * deal size potential).
      Select top 10 for active pursuit. Distribute across the 30/60/90-day timeline
      based on trigger urgency.
      Deliverable: Prioritized List (Rank | Company | ICP Score | Trigger | Value Potential | Timeline | Entry Action).


      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. ICP scores use the defined 0-3 scale per dimension, not subjective assessment
      2. Trigger events have specific dates and sources, not "recently"
      3. Whitespace estimates include confidence levels
      4. Message hooks reference specific company events, not generic value props
      5. Top 10 is ranked by the formula, not alphabetical or by company size alone
      6. 30/60/90 distribution matches trigger urgency, not arbitrary assignment

      Produce all 5 deliverables. Lead with a 2-sentence summary: total qualified
      prospects identified and the top-priority prospect with trigger event.

  outreach_strategy:
    name: "Outreach Strategy"
    description: "Develop personalized outreach strategy per prospect with multi-channel approach"
    prompt: |
      You are developing personalized outreach strategies for pipeline generation.
      Prospect list: {prospect_list}. Market intelligence: {market_intelligence}.
      Available channels: {channels}.
      Account state: {account_state}.

      This runbook produces per-prospect multi-channel outreach plans with personalized
      messaging, cadence design, and conversion benchmarks.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: SEGMENT PROSPECTS
      Group prospects by shared characteristics: industry, pain profile, trigger type,
      and deal size range. Segmentation enables batch messaging while maintaining
      personalization. Identify 3-4 segments.
      Deliverable: Prospect Segments (Segment | Prospects | Shared Characteristics | Primary Pain | Message Theme).

      STEP 2: DESIGN CHANNEL STRATEGY
      For each prospect, select primary and secondary channels based on:
      persona preferences (C-level = LinkedIn/warm intro, technical = community/content),
      available data (email known, LinkedIn connected, mutual contact available),
      and channel engagement rates for this segment.
      Deliverable: Channel Strategy (Prospect | Primary Channel | Secondary Channel | Rationale | Data Available).

      STEP 3: CRAFT PERSONALIZED MESSAGES
      For each prospect, write the first-touch message:
      - Opening: reference their specific trigger event or situation (1 sentence)
      - Relevance: connect their situation to a relevant outcome we've delivered (1 sentence)
      - Ask: request a specific, low-friction action (15-min call, not a demo) (1 sentence)
      - Total length: 3-4 sentences maximum
      Deliverable: Message Drafts (Prospect | Channel | Subject Line | Message Body | Trigger Referenced).

      STEP 4: BUILD CADENCE TIMELINE
      Design a multi-touch cadence per segment:
      - Touch 1 (Day 1): primary channel, initial message
      - Touch 2 (Day 3): secondary channel, different angle
      - Touch 3 (Day 7): follow-up on primary channel, add value (share relevant content)
      - Touch 4 (Day 14): breakup message or executive escalation
      Customize cadence length and intensity by deal size potential.
      Deliverable: Cadence Timeline (Segment | Touch # | Day | Channel | Message Type | Content Theme).

      STEP 5: SET CONVERSION BENCHMARKS
      Define expected conversion rates by channel and segment:
      - Response rate (industry benchmark: cold email 2-5%, LinkedIn 10-15%)
      - Meeting conversion (responses to meetings: 30-50%)
      - Pipeline conversion (meetings to qualified pipeline: 20-30%)
      Calculate expected pipeline generation from this outreach effort.
      Deliverable: Conversion Model (Channel | Expected Volume | Response Rate | Meeting Rate | Pipeline Value | Total Expected).

      STEP 6: COORDINATE WITH SDR/BDR
      If SDR/BDR team is involved, define: which prospects are AE-owned outreach vs.
      SDR-assigned, handoff criteria (when does SDR pass to AE), shared messaging
      guidelines, and activity reporting.
      Deliverable: SDR Coordination (Prospect | Owner (AE/SDR) | Handoff Criteria | Shared Message Elements | Reporting).


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every message references a specific trigger event, not generic value prop
      2. Messages are 3-4 sentences max, not paragraphs
      3. Cadence has no more than 4 touches before breakup
      4. Conversion benchmarks use industry data, not aspirational targets
      5. SDR handoff criteria are specific, not "when ready"
      6. Subject lines are personalized, not template-looking

      Produce all 6 deliverables. Lead with a 2-sentence summary: total prospects
      receiving outreach, expected pipeline value, and the timeline for first results.

  pipe_gen_tracking:
    name: "Pipeline Generation Tracking"
    description: "Track pipeline generation targets, conversion rates, and source attribution"
    prompt: |
      You are tracking pipeline generation performance and optimizing the approach.
      Outreach plan: {outreach_plan}. Conversion data: {conversion_data}.
      Period: {tracking_period}.
      Account state: {account_state}.

      This runbook produces a pipeline generation performance report with conversion
      analysis, source attribution, and optimization recommendations.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: COMPILE ACTIVITY METRICS
      Aggregate all outreach activity for the period: total outreach sent (by channel),
      responses received, meetings booked, opportunities created, and pipeline value
      generated. Compare against targets.
      Deliverable: Activity Dashboard (Channel | Outreach Sent | Responses | Meetings | Opportunities | Pipeline Value | vs Target %).

      STEP 2: CALCULATE CONVERSION RATES
      Calculate stage-by-stage conversion rates:
      - Outreach → Response (by channel)
      - Response → Meeting (by channel and persona)
      - Meeting → Qualified Opportunity (by segment)
      - Qualified → Pipeline (by deal type)
      Compare to benchmarks from Step 5 of outreach_strategy.
      Deliverable: Conversion Funnel (Stage | Volume | Conversion Rate | Benchmark | Variance | Trend).

      STEP 3: ATTRIBUTE PIPELINE TO SOURCES
      Break down pipeline created by source: outbound (AE-generated), outbound (SDR-generated),
      inbound (marketing), referral, event, and partner. Calculate cost per pipeline dollar
      where cost data is available.
      Deliverable: Source Attribution (Source | Opportunities | Pipeline Value | Win Rate | Cost per $Pipeline | ROI).

      STEP 4: ANALYZE CADENCE EFFECTIVENESS
      Determine which touch number generates the most responses and meetings.
      Analyze: are later touches (3-4) converting or wasted effort? Which message
      themes/hooks get the best response rates? Which channels perform above benchmark?
      Deliverable: Cadence Analysis (Touch # | Channel | Responses | Response Rate | Message Theme | Insight).

      STEP 5: IDENTIFY OPTIMIZATION OPPORTUNITIES
      Based on Steps 2-4, identify what to change:
      - Channels underperforming: shift volume to better channels
      - Messages underperforming: A/B test alternatives
      - Segments underperforming: adjust targeting criteria
      - Cadence adjustments: add/remove touches, change timing
      Deliverable: Optimization Plan (Area | Current Performance | Target | Change | Expected Impact).


      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. All metrics are precise counts, not estimates
      2. Conversion rates are calculated at each stage, not just end-to-end
      3. Source attribution accounts for all pipeline created, nothing unattributed
      4. Cadence analysis identifies specific winning message themes, not just channels
      5. Optimization recommendations are specific (change X to Y), not generic (improve outreach)
      6. Benchmarks are referenced for comparison, not just raw numbers

      Produce all 5 deliverables. Lead with a 3-sentence summary: total pipeline
      generated vs. target, best-performing channel, and the top optimization recommendation.

# ============================================================================
# QUALIFICATION PROMPTS
# ============================================================================
qualification:

  meddpicc_data_collection:
    name: "MEDDPICC Data Collection"
    description: "Collect and organize evidence for each MEDDPICC dimension from available data"
    prompt: |
      You are collecting and organizing MEDDPICC qualification evidence for opportunity
      "{opportunity_name}" at {account_name}. CRM data: {crm_data}.
      Communications: {communications}.
      Account state: {account_state}.

      This runbook systematically extracts evidence for each MEDDPICC dimension and
      identifies gaps requiring investigation.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: EXTRACT METRICS EVIDENCE
      Search all data sources for quantified business impact statements: KPIs mentioned,
      success criteria stated, benchmarks referenced, and ROI expectations expressed.
      Capture exact quotes with source and date.
      Deliverable: Metrics Evidence (Quote | Source | Date | KPI/Metric | Quantified Y/N | Confidence).

      STEP 2: MAP ECONOMIC BUYER
      Identify the economic buyer: who has final budget authority for this purchase?
      Evidence to find: title, budget range they control, whether we've met them directly,
      their stated priorities, and their decision criteria (different from technical criteria).
      Deliverable: Economic Buyer Profile (Name | Title | Budget Authority | Direct Access Y/N | Priorities | Last Engagement).

      STEP 3: DOCUMENT DECISION CRITERIA AND PROCESS
      Extract all stated decision criteria: technical requirements, business requirements,
      vendor requirements (security, compliance, references). Document the decision process:
      steps, stakeholders involved at each step, timeline, and approval chain.
      Deliverable: Decision Map (Criteria Type | Criterion | Source | Importance | Our Fit | Gap) + Process Steps (Step | Stakeholders | Timeline | Status).

      STEP 4: MAP PAPER PROCESS
      Identify all steps from "decision to buy" to "contract signed": procurement review,
      legal review, security assessment, contract negotiation, PO issuance.
      For each, determine: who owns it, typical duration, and current status.
      Deliverable: Paper Process (Step | Owner | Typical Duration | Status | Known Requirements | Blocker Risk).

      STEP 5: CATALOG PAIN EVIDENCE
      Extract all statements of business pain: what hurts, why it matters, who it affects,
      how long it's been a problem, and what happens if it's not solved.
      Distinguish between: stated pain (customer said it), implied pain (inferred from data),
      and strategic pain (connected to executive initiatives).
      Deliverable: Pain Catalog (Pain Statement | Type | Affected Stakeholder | Duration | Cost of Inaction | Source).

      STEP 6: ASSESS CHAMPION AND COMPETITION
      Champion: compile evidence of champion activity (introductions made, information shared,
      coaching provided, internal advocacy).
      Competition: compile all competitor mentions, evaluations, and positioning signals.
      Deliverable: Champion Evidence (Activity | Date | Outcome) + Competitive Intelligence (Competitor | Activity | Positioning | Threat Level).

      STEP 7: PRODUCE EVIDENCE MATRIX
      Combine Steps 1-6 into a single evidence matrix. For each dimension, summarize:
      evidence strength (STRONG/PARTIAL/WEAK/NONE), key evidence reference, primary gap,
      and recommended next action to fill the gap.
      Deliverable: Evidence Matrix (Dimension | Strength | Key Evidence | Gap | Next Action | Priority).


      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Evidence includes exact quotes with dates and sources, not paraphrased
      2. All 8 MEDDPICC dimensions are assessed, none marked "N/A"
      3. Economic buyer identification is based on evidence, not title assumption
      4. Pain evidence distinguishes stated vs. implied vs. strategic
      5. Competitor intelligence includes status quo as a competitor
      6. Gaps have specific recommended actions, not "investigate further"

      Produce all deliverables from Steps 1-7. Lead with a 3-sentence summary:
      dimensions with strong evidence, dimensions with critical gaps, and the
      single highest-priority data collection action.

  meddpicc_dimension_scoring:
    name: "MEDDPICC Dimension Scoring"
    description: "Score each MEDDPICC dimension as STRONG/ADEQUATE/WEAK/UNKNOWN with evidence"
    prompt: |
      You are scoring MEDDPICC dimensions for an opportunity based on collected evidence.
      Dimension evidence: {dimension_evidence}. Opportunity stage: {current_stage}.
      Account state: {account_state}.

      This runbook produces a calibrated MEDDPICC scorecard with stage-appropriate
      assessment and qualification confidence.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: DEFINE STAGE-APPROPRIATE THRESHOLDS
      For the current stage ({current_stage}), define what evidence strength is required
      for each dimension:
      - Early stages (Discovery/Qualification): PARTIAL or better acceptable
      - Mid stages (Solution/Proposal): ADEQUATE or better required
      - Late stages (Negotiation/Close): STRONG required
      Deliverable: Stage Thresholds (Dimension | Required Strength at {current_stage} | Rationale).

      STEP 2: SCORE EACH DIMENSION
      Apply scoring criteria to collected evidence. For each dimension, separate into:
      - Layer A: Observable Indicators (documented facts, dates, counts, confirmed statements)
      - Layer B: Interpretive Assessments (scoring judgment) with confidence:
        HIGH (6+ months history / 5+ data points), MEDIUM (2-4 data points), LOW (1-2 data points)
      Scoring scale:
      - STRONG (3): multiple confirmed evidence points from different sources, no concerns,
        customer-validated data
      - ADEQUATE (2): some evidence with minor gaps, manageable risk, partially confirmed
      - WEAK (1): limited evidence, significant gaps, action required urgently
      - UNKNOWN (0): no evidence available, must investigate immediately
      For each score, cite the specific evidence or lack thereof.
      Deliverable: Dimension Scores (Dimension | Observable Data | Interpretive Score | Rating | Confidence | Key Evidence | Scoring Rationale).

      STEP 3: CALCULATE COMPOSITE CONFIDENCE
      Calculate overall qualification confidence:
      - Raw score: sum of all 8 dimension scores (max 24)
      - Weighted score: weight by stage importance (at late stage, Champion and Economic Buyer
        count double)
      - Confidence percentage: (weighted score / max weighted score) * 100
      Deliverable: Confidence Calculation (Raw Score /24 | Weighting Applied | Weighted Score | Confidence %).

      STEP 4: IDENTIFY STAGE-GATE VIOLATIONS
      Compare each dimension's score against the stage threshold (Step 1). Flag any dimension
      scoring below threshold as a stage-gate violation. These indicate the deal may not be
      qualified for its current stage.
      Deliverable: Stage-Gate Assessment (Dimension | Score | Threshold | Gap | Violation Y/N | Impact).

      STEP 5: RECOMMEND SCORING ACTIONS
      For each dimension below STRONG, recommend the specific action to improve the score.
      Prioritize by: stage-gate violations first, then by deal progression impact.
      Include the question to ask, the person to ask, and the evidence needed.
      Deliverable: Scoring Actions (Dimension | Current | Target | Action | Question | Who to Ask | Evidence Needed | Prerequisites/Dependencies).


      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Data Availability Map completed first
      2. If 2+ dimensions LOW, Signal Acquisition Mode used and scoring steps NOT produced
      3. Scores on LOW-richness data marked "estimated" with basis
      4. Interpretive assessments include confidence levels
      5. Every score has cited evidence, not "based on overall impression"
      6. Stage thresholds are applied consistently, not adjusted to make the deal look better
      7. Confidence calculation shows the formula and intermediate values
      8. Stage-gate violations are clearly flagged, not softened
      9. Actions target specific evidence gaps, not generic "learn more about X"
      10. Scoring does not assume positive intent where evidence is absent (UNKNOWN, not ADEQUATE)

      Produce all deliverables (Data Availability Map + 5 step deliverables in normal mode,
      or Data Availability Map + Signal Acquisition Plan in signal acquisition mode).
      Lead with a 2-sentence summary: overall confidence percentage and the number of
      stage-gate violations.

  meddpicc_gap_analysis:
    name: "MEDDPICC Gap Analysis"
    description: "Identify qualification gaps, calculate confidence, recommend closing actions"
    prompt: |
      You are analyzing MEDDPICC qualification gaps for an opportunity.
      Dimension scores: {dimension_scores}. Deal stage: {current_stage}.
      Target close: {target_close_date}.
      Account state: {account_state}.

      This runbook identifies critical qualification gaps, prioritizes them by deal impact,
      and produces a gap-closing action plan.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: IDENTIFY BELOW-THRESHOLD DIMENSIONS
      List all dimensions scoring below the stage-appropriate threshold. Calculate the
      gap severity: how many points below threshold. Rank by severity.
      Deliverable: Gap List (Dimension | Current Score | Required Score | Gap Points | Severity Rank).

      STEP 2: ASSESS GAP IMPACT ON DEAL
      For each gap, determine the impact if left unaddressed:
      - DEAL KILLER: will likely cause loss (e.g., no economic buyer access at negotiation stage)
      - STALL RISK: will slow or stall progression (e.g., decision process unclear at proposal stage)
      - WEAKNESS: reduces competitive position but doesn't kill deal (e.g., metrics partially quantified)
      Deliverable: Impact Assessment (Dimension | Gap | Impact Type | Consequence if Unaddressed | Time to Impact).

      STEP 3: DESIGN GAP-CLOSING ACTIONS
      For each gap, create a specific closing action:
      - What to do: specific meeting, question, or research task
      - Who should do it: AE, SA, executive sponsor, or champion
      - By when: specific date (work backward from {target_close_date})
      - Method: how to obtain the evidence (discovery question, executive meeting, reference check)
      - Success criteria: what evidence confirms the gap is closed
      Deliverable: Gap-Closing Plan (Dimension | Action | Owner | Deadline | Method | Success Criteria).

      STEP 4: CALCULATE RISK IF GAPS REMAIN
      Model the deal outcome if current gaps persist:
      - Compare deal profile against historical win/loss patterns
      - Identify which gap pattern most commonly leads to loss
      - Estimate probability of win with current gaps vs. if gaps are closed
      Deliverable: Risk Model (Scenario | Win Probability | Key Differentiating Gaps | Historical Pattern Match).

      STEP 5: PREPARE NEXT INTERACTION QUESTIONS
      For the next customer interaction, create a prioritized list of questions designed
      to close the most critical gaps. Limit to 3-5 questions that can be woven into
      a natural conversation (not an interrogation).
      Deliverable: Next Interaction Questions (Priority | Question | Target Gap | Expected Evidence | Persona to Ask).


      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. All below-threshold dimensions are identified, none omitted
      2. Impact assessment distinguishes deal killers from weaknesses
      3. Deadlines work backward from close date with realistic durations
      4. Success criteria are specific and evidence-based
      5. Questions are conversational, not interrogation-style
      6. Risk model references historical patterns, not speculation

      Produce all 5 deliverables. Lead with a 2-sentence summary: number of critical
      gaps and the estimated win probability if gaps remain unaddressed.

  meddpicc_scorecard:
    name: "MEDDPICC Qualification Scorecard"
    description: "Produce formatted MEDDPICC qualification scorecard for deal review"
    prompt: |
      You are producing a formatted MEDDPICC qualification scorecard for deal review.
      Dimension scores: {dimension_scores}. Gap analysis: {gap_analysis}.
      Opportunity context: {opportunity_context}.
      Account state: {account_state}.

      This runbook produces a deal-review-ready scorecard with stage-gate recommendation
      and win pattern comparison.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: BUILD DIMENSION SUMMARIES
      For each MEDDPICC dimension, create a concise summary separating:
      - Layer A: Observable Indicators (the factual evidence point)
      - Layer B: Interpretive Assessment (score judgment) with confidence:
        HIGH (6+ months history / 5+ data points), MEDIUM (2-4 data points), LOW (1-2 data points)
      Score: STRONG/ADEQUATE/WEAK/UNKNOWN. Each summary should be 1-2 sentences max.
      Deliverable: Dimension Summaries (Dimension | Score | Observable Evidence | Interpretive Assessment | Confidence | Risk/Gap | Next Action).

      STEP 2: CALCULATE OVERALL SCORE
      Compute the overall qualification score out of 100:
      - Each dimension scored 0-12.5 based on evidence strength
      - Apply stage-appropriate weighting (Champion and Economic Buyer weighted 1.5x at late stages)
      - Provide breakdown showing contribution of each dimension
      Deliverable: Overall Score (Score /100 | Dimension Breakdown | Stage Weighting Applied | Trend vs Last Assessment).

      STEP 3: MAKE STAGE-GATE RECOMMENDATION
      Based on the overall score and gap analysis, recommend one of:
      - ADVANCE: score ≥70, no deal-killer gaps → proceed to next stage
      - HOLD: score 50-69, gaps exist but are closeable → stay in stage, close gaps first
      - RE-QUALIFY: score <50, or deal-killer gaps present → step back and re-qualify
      Provide specific criteria driving the recommendation.
      Deliverable: Stage-Gate Recommendation (Decision | Score | Criteria Met/Unmet | Key Condition for Advance).

      STEP 4: COMPARE TO WIN PATTERNS
      Compare this deal's profile against historical win patterns:
      - Average winning deal score at this stage
      - Dimension profiles of won deals vs. this deal
      - Identify dimensions where this deal is stronger and weaker than typical wins
      Deliverable: Win Pattern Comparison (Dimension | This Deal | Avg Winner | Variance | Strength/Weakness).

      STEP 5: IDENTIFY MANAGEMENT ATTENTION ITEMS
      Flag items requiring management or leadership attention:
      - Deal-killer gaps needing executive intervention
      - Competitive threats requiring strategic response
      - Resource requests (executive sponsor meeting, POC resources, pricing approval)
      - Timeline risks requiring decision
      Deliverable: Management Attention (Item | Urgency | Commercial Impact: Renewal/Expansion/Neither | Required Action | Decision Needed By | Recommended Approach | Prerequisites/Dependencies).

      STEP 6: FORMAT EXECUTIVE SCORECARD
      Compile Steps 1-5 into a single-page executive scorecard format:
      - Header: deal name, value, stage, close date, AE
      - MEDDPICC grid: 8 dimensions with color-coded scores
      - Overall score and recommendation
      - Top 3 risks and actions
      - Win pattern alignment percentage
      Deliverable: Executive Scorecard (formatted summary).


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Data Availability Map completed first
      2. If 2+ dimensions LOW, Signal Acquisition Mode used and scoring steps NOT produced
      3. Scores on LOW-richness data marked "estimated" with basis
      4. Interpretive assessments include confidence levels
      5. Overall score calculation is transparent and reproducible
      6. Stage-gate recommendation strictly follows the defined criteria
      7. Win pattern comparison uses actual historical data references, not generic
      8. Management attention items have urgency and deadline, not just "FYI"
      9. Executive scorecard fits a single page (concise, no redundancy)
      10. Every recommendation is supported by evidence from the scorecard

      Produce all deliverables (Data Availability Map + 6 step deliverables in normal mode,
      or Data Availability Map + Signal Acquisition Plan in signal acquisition mode).
      Lead with a 3-sentence executive summary: overall score, stage-gate recommendation,
      and the deal's alignment to win patterns.
