      Deliverable: Executive Profile (Priority | Communication Style | Tenure | Career Path | Hot Buttons).

      STEP 3: SUMMARIZE RELATIONSHIP HISTORY
      Compile all previous interactions with this executive: dates, topics discussed,
      commitments made (by us and by them), and outcomes. Note any unfulfilled commitments
      on either side.
      Deliverable: Relationship History (Date | Topic | Commitments Made | Status | Follow-up Needed).

      STEP 4: QUANTIFY VALUE DELIVERED
      Aggregate measurable value delivered to this account: deployment metrics, adoption rates,
      ROI achieved, problems solved, and time/cost saved. Present as executive-level KPIs,
      not feature usage stats.
      Deliverable: Value Delivered Summary (KPI | Baseline | Current | Improvement | Business Impact).

      STEP 5: DEFINE MEETING OBJECTIVE AND ASK
      Articulate: what is the single outcome we want from this meeting? Frame it as a
      specific ask (not "strengthen the relationship" but "secure executive sponsorship
      for the Q3 expansion proposal"). Define the ask and the value proposition for the
      executive in accepting.
      Deliverable: Meeting Objective (Ask | Value to Executive | Evidence to Support | Fallback Ask).

      STEP 6: PREPARE TALKING POINTS AND OBJECTIONS
      Create 3-5 talking points aligned to the executive's priorities (Step 2). For each
      potential objection, prepare a response with evidence. Talking points should lead
      with business impact, not product features.
      Deliverable: Talking Points (Point | Executive Priority Alignment | Evidence) + Objection Responses (Objection | Response | Evidence).

      STEP 7: PLAN MEETING FLOW
      Design the meeting structure: opening (rapport + context, 2 min), value review
      (delivered results, 5 min), forward-looking discussion (strategic alignment, 10 min),
      the ask (3 min), next steps (2 min). Include specific transition phrases.
      Deliverable: Meeting Flow (Section | Duration | Content | Transition to Next).


      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Executive profile is based on researched data, not assumptions
      2. Value delivered uses quantified metrics, not "we've been a great partner"
      3. Meeting objective has ONE specific ask, not three vague goals
      4. Talking points lead with business impact, not technical features
      5. Objection responses have evidence, not just assertions
      6. Meeting flow totals to the allocated meeting time, not over or under
      7. No unfulfilled commitments from our side are left unaddressed

      Produce all 6 deliverables. Lead with a 2-sentence summary: the meeting objective
      and the executive's top priority we're aligning to.

# ============================================================================
# COMMERCIAL SIGNAL PROMPTS
# ============================================================================
commercial_signals:

  budget_signal_scan:
    name: "Budget Signal Detection"
    description: "Identify budget-related signals in communications"
    prompt: |
      You are scanning all communications with {account_name} in the last {time_period}
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      for budget-related signals.

      This runbook extracts and classifies budget signals to assess budget health and
      recommend actions to secure funding.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: EXTRACT BUDGET MENTIONS
      Scan all emails, call notes, meeting summaries, and CRM entries for any mention of:
      budget, funding, spend, cost, price, investment, ROI, fiscal year, procurement,
      approval, allocation, or financial terms. Capture exact quotes with context.
      Deliverable: Budget Mentions (Date | Source | Exact Quote | Context | Speaker).

      STEP 3: CLASSIFY SIGNALS
      Classify each mention into signal types:
      - POSITIVE: budget confirmed, funding approved, spend authorized, ROI recognized
      - NEUTRAL: budget discussed, timeline mentioned, process described
      - NEGATIVE: budget cut, freeze, competing priorities, pushback on cost
      - TIMING: fiscal year references, approval cycle mentions, budget window signals
      Deliverable: Signal Classification (Date | Signal | Type | Strength HIGH/MEDIUM/LOW | Implication).

      STEP 4: ASSESS BUDGET HEALTH
      From classified signals, determine overall budget health:
      - FUNDED: explicit confirmation of budget availability
      - LIKELY: positive signals but no explicit confirmation
      - AT RISK: mixed signals or timing concerns
      - UNFUNDED: negative signals or no budget evidence
      Document the evidence chain supporting the assessment. Classify commercial impact as:
      Renewal (threatens renewal), Expansion (blocks upsell/cross-sell), or Neither (operational only).
      Deliverable: Budget Health Assessment (Status | Evidence Chain | Confidence | Key Risk | Commercial Impact: Renewal/Expansion/Neither).

      STEP 5: MAP BUDGET TIMELINE
      Identify timing factors: fiscal year end/start, budget cycle deadlines,
      approval process duration, and any mentioned deadlines. Calculate whether
      our deal timeline aligns with their budget availability.
      Deliverable: Budget Timeline (Event | Date | Impact on Deal | Alignment Status).

      STEP 6: RECOMMEND BUDGET-SECURING ACTIONS
      Based on health status and timeline, recommend specific actions:
      - FUNDED: lock in purchase order, accelerate close
      - LIKELY: request budget confirmation meeting, provide cost justification materials
      - AT RISK: build business case, identify budget champion, explore alternative funding
      - UNFUNDED: qualify out or build long-term budget influence campaign
      Deliverable: Action Plan (Action | Owner | Deadline | Expected Outcome | Dependencies | Prerequisites/Dependencies).


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Data Availability Map completed first
      2. If 2+ dimensions LOW, Signal Acquisition Mode used and scoring steps NOT produced
      3. Scores on LOW-richness data marked "estimated" with basis
      4. Interpretive assessments include confidence levels
      5. Budget mentions include exact quotes, not paraphrased
      6. Signal classification distinguishes confirmed from assumed
      7. Health assessment is based on evidence, not optimism
      8. Timeline includes specific dates or fiscal periods, not "soon"
      9. Actions are differentiated by budget health status, not generic
      10. Competing budget priorities are identified if mentioned

      Produce all deliverables (Data Availability Map + 5 step deliverables in normal mode,
      or Data Availability Map + Signal Acquisition Plan in signal acquisition mode).
      Lead with a 2-sentence summary: budget health status and the most important
      budget-related action.

  competitive_threat:
    name: "Competitive Threat Assessment"
    description: "Identify competitive activity in account"
    prompt: |
      You are assessing competitive threats in {account_name} based on all available
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      communications and intelligence.

      This runbook identifies active competitors, assesses threat levels, and recommends
      defensive positioning strategies.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: EXTRACT COMPETITIVE MENTIONS
      Scan all communications for direct or indirect competitor references: vendor names,
      product names, feature comparisons, alternative solutions mentioned, and "we're also
      looking at" signals. Include status quo (doing nothing) as a competitor.
      Deliverable: Competitive Mentions (Date | Source | Competitor/Alternative | Context | Quote | Speaker).

      STEP 3: BUILD COMPETITOR PROFILES
      For each identified competitor, document: what they're offering, how they're positioning,
      their known strengths in this account, their weaknesses, and their relationship depth
      (who do they know, at what level).
      Deliverable: Competitor Profiles (Competitor | Offering | Positioning | Strengths | Weaknesses | Relationship Depth).

      STEP 4: ASSESS THREAT LEVEL
      Score each competitor on the following dimensions. Separate into:
      - Layer A: Observable Indicators (documented mentions, meeting attendance, known contract dates,
        stated feature comparisons, pricing data shared by customer)
      - Layer B: Interpretive Assessments (scoring 1-5) with confidence:
        HIGH (6+ months history / 5+ data points), MEDIUM (2-4 data points), LOW (1-2 data points)
      Dimensions: solution fit (1-5), relationship strength (1-5), pricing position (1-5),
      and momentum (gaining/stable/losing). Calculate composite threat score.
      Threat level: HIGH (score >15), MEDIUM (10-15), LOW (<10).
      Classify commercial impact as: Renewal (threatens renewal), Expansion (blocks upsell/cross-sell),
      or Neither (operational only).
      Deliverable: Threat Assessment (Competitor | Observable Data | Solution Fit | Relationship | Pricing | Momentum | Confidence | Score | Threat Level | Commercial Impact).

      STEP 5: MAP DECISION CRITERIA ALIGNMENT
      Against known decision criteria (technical, business, vendor), compare our position
      vs. each competitor. Identify criteria where we lead, where we're behind, and where
      it's unclear. These are the battleground criteria.
      Deliverable: Decision Criteria Map (Criterion | Weight | Our Position | Competitor Position | Gap | Battleground Y/N).

      STEP 6: BUILD COMPETITIVE STRATEGY
      For each HIGH/MEDIUM threat competitor, define:
      - Differentiation points to emphasize (where we clearly lead)
      - Traps to set (feature/capability questions that expose competitor weaknesses)
      - Landmines to defuse (competitor claims we need to proactively address)
      - Stakeholder-specific messaging (different value props for different buyers)
      Deliverable: Competitive Strategy (Competitor | Differentiation | Traps | Landmines | Stakeholder Messages | Prerequisites/Dependencies).


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Data Availability Map completed first
      2. If 2+ dimensions LOW, Signal Acquisition Mode used and scoring steps NOT produced
      3. Scores on LOW-richness data marked "estimated" with basis
      4. Interpretive assessments include confidence levels
      5. Status quo ("do nothing") is assessed as a competitor
      6. Threat scores use the defined 1-5 scale, not subjective labels
      7. Decision criteria include both technical and business criteria
      8. Differentiation points are evidence-based, not marketing claims
      9. Traps and landmines are specific questions/topics, not general areas
      10. No disparaging competitor language, focus on differentiation

      Produce all deliverables (Data Availability Map + 5 step deliverables in normal mode,
      or Data Availability Map + Signal Acquisition Plan in signal acquisition mode).
      Lead with a 2-sentence summary: number of active competitors, the highest threat,
      and our strongest differentiation.

  expansion_opportunity:
    name: "Expansion Signal Detection"
    description: "Identify upsell and cross-sell opportunities"
    prompt: |
      You are scanning {account_name} for expansion opportunities based on usage patterns,
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      conversations, and business context.

      This runbook identifies and prioritizes expansion opportunities with quantified
      revenue potential and engagement strategies.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: ANALYZE USAGE PATTERNS
      Review current product/service usage: feature adoption rates, usage growth trends,
      departments using the solution, and usage ceiling indicators (approaching limits,
      requesting features not in current tier).
      Deliverable: Usage Analysis (Feature/Product | Adoption % | Growth Trend | Ceiling Signal | Expansion Indicator).

      STEP 3: EXTRACT CONVERSATION SIGNALS
      From all communications, extract signals indicating expansion potential:
      - New use cases mentioned or requested
      - New departments or teams expressing interest
      - Pain points addressable by additional products/features
      - Strategic initiatives that align with our capabilities
      Deliverable: Expansion Signals (Date | Source | Signal | Type (Upsell/Cross-sell/New Dept) | Quote).

      STEP 4: RESEARCH BUSINESS CONTEXT
      Identify business growth indicators that create expansion opportunity:
      - Headcount growth (more users)
      - Geographic expansion (new regions)
      - M&A activity (new entities to onboard)
      - New product launches (new workflows)
      - Digital transformation initiatives
      Deliverable: Business Context (Indicator | Evidence | Expansion Impact | Timeline).

      STEP 5: QUANTIFY OPPORTUNITIES
      For each identified opportunity, estimate: annual revenue potential, confidence level
      (HIGH/MEDIUM/LOW), time to close, and effort to pursue. Calculate based on:
      current pricing * projected usage/seats, or comparable deal sizes.
      Deliverable: Opportunity Sizing (Opportunity | Type | Annual Value | Confidence | Time to Close | Effort).

      STEP 6: PRIORITIZE AND BUILD PURSUIT PLAN
      Rank opportunities by: (value * confidence) / effort. For the top 3 opportunities,
      identify: the stakeholder to engage, the value proposition specific to their role,
      the trigger event to reference, and the recommended approach (meeting, demo, proposal).
      Deliverable: Pursuit Plan (Rank | Opportunity | Value | Stakeholder | Value Prop | Approach | Next Step).


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Usage analysis includes specific metrics (%, growth rate), not "high adoption"
      2. Revenue estimates show the calculation formula, not just the number
      3. Confidence levels distinguish customer-confirmed from estimated
      4. Prioritization uses the formula, not subjective ranking
      5. Each opportunity has a specific stakeholder, not "the customer"
      6. Approach is tailored to the opportunity type, not generic "set up a meeting"

      Produce all 5 deliverables. Lead with a 2-sentence summary: total expansion
      revenue potential identified and the highest-priority opportunity.

# ============================================================================
# MEETING PREPARATION PROMPTS
# ============================================================================
meeting_prep:

  call_prep:
    name: "Customer Call Preparation"
    description: "Prepare for upcoming customer call"
    prompt: |
      You are preparing for an upcoming call with {account_name} on {date}.
      Attendees: {attendees}. Purpose: {meeting_purpose}.
      Account state: {account_state}.

      This runbook produces a structured call brief with context, objectives,
      questions, and risk mitigation for the upcoming interaction.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: COMPILE INTERACTION HISTORY
      Extract the last 3 interactions with this account: date, participants, topics discussed,
      commitments made, and outcomes. Flag any open commitments from our side that are
      unfulfilled (these must be addressed in this call).
      Deliverable: Interaction History (Date | Type | Participants | Key Topics | Commitments | Status).

      STEP 2: PREPARE ATTENDEE CONTEXT
      For each attendee on this call, capture: their role, previous interactions with us,
      known priorities, communication preferences, and any recent signals (positive or negative).
      Identify first-time attendees who need different handling.
      Deliverable: Attendee Profiles (Name | Role | Previous Interactions | Priorities | Recent Signals | First Time Y/N).

      STEP 3: DEFINE CALL OBJECTIVES
      Based on the meeting purpose and deal stage, define exactly 3 objectives for this call.
      Each objective must be: specific (not "move the deal forward"), measurable (what evidence
      of success), and achievable in this single interaction.
      Deliverable: Call Objectives (Objective | Success Metric | Priority | Fallback if Not Achieved).

      STEP 4: PREPARE QUESTIONS
      Create 5-7 questions to ask during the call, mapped to objectives from Step 3.
      Sequence them: 2 rapport/warmup questions, 3-4 discovery/qualification questions
      tied to MEDDPICC gaps, 1 closing question that confirms next steps.
      Deliverable: Question Plan (Sequence | Question | Objective Served | MEDDPICC Dimension | Expected Answer).

      STEP 5: ANTICIPATE RISKS AND PREPARE RESPONSES
      Identify 3 risks that could derail this call: objections, competitor mentions,
      budget pushback, or timeline changes. For each, prepare a response with evidence.
      Deliverable: Risk Preparation (Risk | Likelihood | Prepared Response | Evidence to Reference).


      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Open commitments from previous interactions are identified and addressed
      2. First-time attendees are flagged with introduction plan
      3. Objectives are specific and measurable, not "have a good conversation"
      4. Questions follow the rapport→discovery→close sequence
      5. Risk responses have evidence, not just assertions
      6. Call objectives are realistic for a single interaction

      Produce all 5 deliverables. Lead with a 2-sentence summary: the primary objective
      for this call and the key risk to prepare for.

  qbr_prep:
    name: "QBR Preparation"
    description: "Prepare Quarterly Business Review materials"
    playbooks:
      - "PB_AE_003"
      - "PB_CA_001"
    prompt: |
      You are preparing QBR materials for {account_name}. ARR: {arr}.
      Relationship length: {years}. QBR type: {internal_sales | customer_facing}.
      Account state: {account_state}.

      This runbook produces comprehensive QBR content with quantified value delivery,
      health metrics, and forward-looking expansion strategy.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: COMPILE VALUE DELIVERED
      Aggregate all measurable value delivered this quarter: deployment milestones,
      adoption metrics (MAU, feature usage, user growth), performance improvements
      (speed, accuracy, cost reduction), and business outcomes achieved.
      Quantify each with before/after metrics and calculated improvement percentage.
      Deliverable: Value Delivered (Category | Metric | Baseline | Current | Improvement % | Business Impact).

      STEP 2: BUILD HEALTH SCORECARD
      Assess account health across dimensions: product adoption (usage trends),
      relationship depth (executive access, champion strength), support health
      (ticket volume, resolution time, satisfaction), and commercial health
      (renewal timeline, expansion pipeline, risk signals).
      Score each dimension GREEN/YELLOW/RED with evidence.
      Deliverable: Health Scorecard (Dimension | Score | Evidence | Trend | Action if Yellow/Red).

      STEP 3: REVIEW OPEN ISSUES
      List all open issues, feature requests, and escalations. For each, document:
      status, owner, timeline to resolution, and customer impact. Prioritize by
      customer impact and identify any blockers to renewal or expansion.
      Deliverable: Open Issues (Issue | Status | Owner | Resolution Timeline | Customer Impact | Renewal Risk).

      STEP 4: MAP ROADMAP TO CUSTOMER PRIORITIES
      Identify 3-5 upcoming product/service updates relevant to this customer's
      stated priorities. For each, explain: what it does, when it's available,
      and how it addresses a specific customer need or request.
      Deliverable: Relevant Roadmap (Update | Availability | Customer Need Addressed | Impact).

      STEP 5: DEVELOP EXPANSION DISCUSSION
      Identify expansion opportunities: new use cases, departments, or products.
      Quantify each opportunity with estimated revenue and customer value.
      Prepare discussion framing that ties expansion to demonstrated value from Step 1.
      Deliverable: Expansion Discussion (Opportunity | Revenue Potential | Value Justification | Discussion Framing).

      STEP 6: COMPILE PIPELINE AND FORECAST (INTERNAL QBR ONLY)
      If internal QBR: compile pipeline health, forecast accuracy for this account,
      renewal risk assessment, and recommended account strategy for next quarter.
      Deliverable: Internal Pipeline Review (Pipeline Value | Forecast Category | Renewal Risk | Strategy Recommendation).

      STEP 7: BUILD QBR NARRATIVE
      Combine Steps 1-6 into a coherent QBR narrative with executive summary (1 paragraph),
      value story (what we achieved together), forward view (where we're going), and a
      specific ask or recommendation for the next quarter.
      Deliverable: QBR Narrative (Executive Summary | Value Story | Forward View | Ask/Recommendation).


      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Value delivered uses quantified metrics with before/after, not "we helped improve"
      2. Health scorecard scores follow defined criteria, not subjective feelings
      3. Open issues have specific resolution timelines, not "working on it"
      4. Roadmap items are relevant to this customer, not a generic product update
      5. Expansion opportunities tie to demonstrated value, not cold pitches
      6. Internal metrics are excluded from customer-facing version
      7. QBR narrative has a specific ask, not "let's continue the partnership"

      Produce all deliverables (Steps 1-5 + 7 for customer-facing, all 7 for internal).
      Lead with the executive summary paragraph.

