      8. Close-lost recommendations include rationale, not blanket cleanup
      9. RE-ENGAGE actions include a specific message hook, not "reach out"
      10. Pipeline impact shows the adjusted coverage ratio, exposing real risk

      Produce all deliverables (Data Availability Map + 5 step deliverables in normal mode,
