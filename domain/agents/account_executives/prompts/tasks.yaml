# AE Agent Task Prompts
# Purpose: Full runbook prompts with numbered steps, named deliverables, and quality checks
# Reference: Personality defined in personalities/ae_personality.yaml
# Standard: feedback_runbook_prompt_standard.md

# ============================================================================
# DEAL DIAGNOSIS PROMPTS
# ============================================================================
deal_diagnosis:

  analyze_deal_health:
    name: "Deal Health Analysis"
    description: "Diagnose current deal health based on recent signals"
    prompt: |
      You are analyzing deal health for {account_name} opportunity "{opportunity_name}"
      using data from the last {time_period}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook produces a comprehensive deal health assessment that surfaces risks,
      validates positive signals, and recommends specific mitigations.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: EXTRACT ENGAGEMENT SIGNALS
      Review all communications, meetings, and CRM activity entries for this opportunity.
      Classify each signal as positive (advancing the deal), negative (risk indicator),
      or neutral (informational). Capture: Date | Signal Type | Source | Detail | Classification.
      Deliverable: Signal Log table.

      STEP 3: ASSESS RISK FACTORS
      From negative signals in Step 2, identify the top risks. For each risk, determine:
      severity (HIGH/MEDIUM/LOW), evidence source, time sensitivity (days until impact),
      and a specific mitigation action with an owner. For each risk, assign secondary flags
      where the signal spans multiple dimensions (e.g., a risk that is primarily COMMERCIAL
      but also TECHNICAL and PROCESS). Include prerequisites: what must be true before each
      mitigation action can start.
      Deliverable: Risk Table (Risk | Severity | Secondary Flags | Evidence | Time Sensitivity | Mitigation | Owner | Prerequisites).

      STEP 4: VALIDATE POSITIVE SIGNALS
      From positive signals in Step 2, validate each: is the signal confirmed by multiple
      sources? Is it recent (within last 14 days)? Does it indicate forward movement
      (new stakeholder engaged, technical validation passed, budget confirmed)?
      Deliverable: Positive Signals table (Signal | Confirmed By | Recency | Forward Impact).

      STEP 5: ASSESS MEDDPICC DIMENSION HEALTH
      Map signals from Steps 3-4 to MEDDPICC dimensions. For each dimension, separate:
      - Layer A: Observable Indicators (dates, counts, meeting attendance, documented statements)
      - Layer B: Interpretive Assessments (direction, momentum, positioning) with confidence:
        HIGH (6+ months history / 5+ data points), MEDIUM (2-4 data points), LOW (1-2 data points)
      Flag dimensions with no recent signals as "stale, needs refresh."
      Deliverable: MEDDPICC Signal Map (Dimension | Observable Indicators | Interpretive Assessment | Confidence | Direction | Status).

      STEP 6: CALCULATE OVERALL HEALTH SCORE
      Score the deal RED/YELLOW/GREEN using these criteria:
      - RED: any HIGH severity risk unmitigated, or 3+ MEDDPICC dimensions stale/weakening
      - YELLOW: MEDIUM severity risks present, or 1-2 dimensions stale
      - GREEN: no HIGH/MEDIUM risks, all dimensions stable or strengthening
      Provide written justification referencing specific evidence from Steps 3-5.
      Assign secondary flags where the signal spans multiple dimensions (e.g., a risk
      that is primarily COMMERCIAL but also TECHNICAL and PROCESS).
      Deliverable: Health Score with justification paragraph and secondary dimension flags.


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Data Availability Map completed first
      2. If 2+ dimensions LOW, Signal Acquisition Mode used and scoring steps NOT produced
      3. Scores on LOW-richness data marked "estimated" with basis
      4. Interpretive assessments include confidence levels
      5. Every risk has a specific mitigation action, not generic advice
      6. Every positive signal is validated against recency and confirmation
      7. All 8 MEDDPICC dimensions are assessed, none skipped
      8. Health score justification references specific evidence, not feelings
      9. No vague language ("seems like," "probably," "might be")
      10. Time sensitivity on risks uses specific day counts, not "soon" or "urgent"
      11. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all deliverables (Data Availability Map + 5 step deliverables in normal mode,
      or Data Availability Map + Signal Acquisition Plan in signal acquisition mode).
      Lead with a 3-sentence executive summary stating: (1) the health score, (2) the
      weakest point or lowest confidence area, and (3) the single most urgent action.

  diagnose_stalled_deal:
    name: "Stalled Deal Diagnosis"
    description: "Understand why a deal has stopped progressing"
    prompt: |
      You are diagnosing why opportunity "{opportunity_name}" has stalled in {current_stage}
      stage for {days_in_stage} days.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook identifies the root cause of the stall, contributing factors, and produces
      a sequenced action plan to restart deal momentum.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: BUILD ACTIVITY TIMELINE
      Extract all touchpoints (emails, calls, meetings, CRM updates) since the deal entered
      {current_stage}. Plot them chronologically. Identify the last point of active forward
      movement and when engagement dropped off.
      Deliverable: Activity Timeline (Date | Activity Type | Participants | Outcome | Forward Movement Y/N).

      STEP 3: IDENTIFY STALL PATTERN
      Classify the stall into one of these primary patterns:
      - GHOSTING: customer stopped responding (last contact date, number of unanswered outreach attempts)
      - INTERNAL BLOCK: customer engaged but blocked internally (by whom, what blocker)
      - COMPETITOR DISPLACEMENT: competitor entered or gained ground (evidence)
      - PRIORITY SHIFT: customer's priorities changed (trigger event, new initiative)
      - MISSING CHAMPION: no internal advocate driving the deal (champion status)
      - PROCESS STALL: stuck in procurement/legal/security (which step, how long)
      Assign secondary flags where the signal spans multiple dimensions (e.g., a stall
      that is primarily INTERNAL BLOCK but also MISSING CHAMPION and PRIORITY SHIFT).
      Deliverable: Stall Classification with primary pattern name, secondary flags, evidence, and confidence level.

      STEP 4: ANALYZE STAKEHOLDER ENGAGEMENT
      For each stakeholder involved in this deal, separate:
      - Layer A: Observable Indicators (last contact date, meeting count, response times, emails sent/received)
      - Layer B: Interpretive Assessments (engagement trend: increasing/stable/declining/silent,
        stall role: blocker/neutral/potential ally) with confidence:
        HIGH (6+ months history / 5+ data points), MEDIUM (2-4 data points), LOW (1-2 data points)
      Deliverable: Stakeholder Stall Map (Name | Role | Observable Data | Interpretive Assessment | Confidence | Stall Role).

      STEP 5: IDENTIFY MISSING ACTIONS
      Compare the deal's progression against typical stage requirements. What actions were expected
      but never completed? (e.g., technical validation not done, economic buyer not engaged,
      business case not delivered, POC not scheduled).
      Deliverable: Missing Actions list (Expected Action | Stage Requirement | Status | Impact on Stall).

      STEP 6: BUILD UNSTALL PLAN
      Based on the stall pattern (Step 3), stakeholder map (Step 4), and missing actions (Step 5),
      create a sequenced 5-action plan. Each action must specify: what to do, who should do it,
      by when, and the expected outcome. Sequence actions so each builds on the prior.
      For each action, include prerequisites: what must be true before this action can start.
      Deliverable: Unstall Plan (Sequence | Action | Owner | Deadline | Expected Outcome | Dependency | Prerequisites).


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Data Availability Map completed first
      2. If 2+ dimensions LOW, Signal Acquisition Mode used and scoring steps NOT produced
      3. Scores on LOW-richness data marked "estimated" with basis
      4. Interpretive assessments include confidence levels
      5. Stall pattern is classified into exactly one primary pattern with evidence
      6. Every stakeholder has a last contact date, not "recently" or "a while ago"
      7. Unstall actions are sequenced with dependencies and prerequisites, not a random list
      8. Each action has a specific owner and deadline, not "the team" or "ASAP"
      9. No recommendations to "follow up" without specifying the message, channel, and hook
      10. Days in stage and days since last contact are calculated precisely
      11. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all deliverables (Data Availability Map + 5 step deliverables in normal mode,
      or Data Availability Map + Signal Acquisition Plan in signal acquisition mode).
      Lead with a 2-sentence diagnosis stating: (1) the stall pattern, (2) the weakest
      point or lowest confidence area, and (3) the single most important action to take first.

  loss_analysis:
    name: "Deal Loss Analysis"
    description: "Analyze a lost deal to extract learnings"
    prompt: |
      You are analyzing lost deal "{opportunity_name}" from first contact to loss to extract
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)
      actionable learnings for future deals.

      This runbook produces a structured post-mortem that identifies where the deal went wrong,
      what warning signs were missed, and what to do differently.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: BUILD DEAL TIMELINE
      Reconstruct the complete deal history from first touch to loss. For each milestone,
      capture: date, event, participants, outcome, and whether it advanced or stalled the deal.
      Mark the inflection point where momentum shifted against us.
      Deliverable: Deal Timeline (Date | Event | Participants | Outcome | Momentum Impact +/-/=).

      STEP 3: IDENTIFY WARNING SIGNS
      Review the timeline and flag every warning sign that, in retrospect, indicated the deal
      was at risk. For each, note: when it appeared, what we did in response, and what we should
      have done instead.
      Deliverable: Warning Signs table (Signal | Date Appeared | Our Response | Better Response | Days Before Loss).

      STEP 4: ANALYZE COMPETITIVE DYNAMICS
      Determine the competitive situation: who won, what they offered, how they positioned,
      and where they outperformed us. If no competitor won (customer chose status quo or
      postponed), analyze what made the status quo more attractive. For each decision factor,
      assign secondary flags where the signal spans multiple dimensions (e.g., a gap that
      is primarily TECHNICAL but also COMMERCIAL and RELATIONSHIP).
      Deliverable: Competitive Analysis (Competitor/Alternative | Their Strengths | Our Gaps | Secondary Flags | Decision Factor Weight).

      STEP 5: ASSESS QUALIFICATION GAPS
      Score the deal's MEDDPICC qualification at the time of loss. For each dimension, determine
      whether it was properly qualified. Identify which gaps, if filled earlier, would have
      changed the outcome.
      Deliverable: Qualification Gap Assessment (Dimension | Score at Loss | Gap Impact | Could Have Changed Outcome Y/N).

      STEP 6: EXTRACT LEARNINGS
      From Steps 3-5, distill the top 3 learnings applicable to future deals. Each learning must
      be specific and actionable (not "qualify better" but "confirm economic buyer access before
      Stage 3 by requesting a joint meeting").
      Deliverable: Learnings List (Learning | Evidence | Applicable When | Action to Take).

      STEP 7: ASSESS RESURRECTION POTENTIAL
      Evaluate whether this deal could be re-engaged: has the loss reason changed? Are there
      new triggers (leadership change, fiscal year, product updates)? Score resurrection
      potential as HIGH/MEDIUM/LOW/NONE with specific re-engagement conditions.
      Assign secondary flags where the signal spans multiple dimensions (e.g., a resurrection
      opportunity that is primarily TIMING but also PRODUCT and RELATIONSHIP).
      Deliverable: Resurrection Assessment (Potential Score | Secondary Flags | Conditions Required | Trigger to Watch | Earliest Re-engage Date).


      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Timeline has specific dates, not "early Q3" or "around that time"
      2. Warning signs include what we should have done differently, not just what went wrong
      3. Competitive analysis identifies specific decision factors, not "they were cheaper"
      4. Learnings are specific and actionable, not generic sales advice
      5. Resurrection assessment has concrete conditions, not "if things change"
      6. No blame language, focus on process improvements
      7. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 6 deliverables. Lead with a 3-sentence executive summary stating:
      (1) what we lost and why, (2) the weakest point or lowest confidence area in our
      approach, and (3) the single most important learning.

  resurrect_dead_deal:
    name: "Dead Deal Resurrection"
    description: "Find opportunities to re-engage lost or stalled deals"
    prompt: |
      You are scanning deals lost or gone dark in the last {time_period} for {account_name}
      or {segment} to identify viable resurrection candidates.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook produces a prioritized list of deals worth re-engaging with personalized
      re-engagement strategies based on changed conditions.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: BUILD CANDIDATE LIST
      Extract all closed-lost and stalled deals from the specified period. For each, capture:
      deal name, original value, loss date, loss reason, last contact person, and original
      champion status.
      Deliverable: Candidate Pool (Deal | Value | Loss Date | Loss Reason | Last Contact | Champion Status).

      STEP 3: SCAN FOR CHANGED CONDITIONS
      For each candidate, check whether the original loss reason has changed:
      - Budget: new fiscal year, funding round, budget reallocation signals
      - Priority: leadership change, new strategic initiative, reorganization
      - Competition: incumbent vendor issues, contract renewal timing
      - Timing: project timeline shifted, urgency triggers emerged
      - Product: our product now addresses gaps that caused the loss
      Deliverable: Changed Conditions table (Deal | Original Blocker | Current Status | Change Evidence | Confidence).

      STEP 4: ASSESS STAKEHOLDER VIABILITY
      For each candidate with changed conditions, verify stakeholder access:
      - Is the original champion still in role? Still reachable?
      - Have new decision makers joined who might be receptive?
      - Are there warm paths (mutual connections, events, content engagement)?
      Deliverable: Stakeholder Viability (Deal | Original Champion Status | New Contacts | Warm Path Available).

      STEP 5: SCORE AND PRIORITIZE
      Score each candidate on: deal value potential, condition change strength (HIGH/MEDIUM/LOW),
      stakeholder access, and effort to re-engage. Rank by composite score.
      Only candidates with condition change strength MEDIUM or higher qualify.
      Assign secondary flags where the signal spans multiple dimensions (e.g., a candidate
      that is primarily BUDGET-DRIVEN but also TIMING and PRODUCT-FIT).
      Deliverable: Prioritized Resurrection List (Rank | Deal | Value | Condition Change | Secondary Flags | Access Score | Priority).

      STEP 6: BUILD RE-ENGAGEMENT STRATEGY
      For the top 5 candidates, create a personalized re-engagement approach:
      - Opening hook tied to the changed condition (specific, not generic)
      - Channel (email, LinkedIn, phone, mutual connection intro)
      - Message draft (3-4 sentences, references their situation, not our product)
      - Follow-up cadence if no response (3 touches over 14 days)
      For each re-engagement action, include prerequisites: what must be true before
      this action can start.
      Deliverable: Re-engagement Plans per candidate (Hook | Channel | Message Draft | Cadence | Prerequisites).


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every candidate has a specific, verified changed condition, not assumptions
      2. Confidence level assigned to each condition change (HIGH/MEDIUM/LOW)
      3. Re-engagement messages reference the customer's situation, not product features
      4. Candidates without stakeholder access path are flagged, not recommended
      5. No more than 5 candidates in the final list (focus over breadth)
      6. Each message draft is 3-4 sentences max, personalized to the account
      7. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 5 deliverables. Lead with a 2-sentence summary stating: (1) number of
      viable candidates found, (2) the weakest point or lowest confidence area, and
      (3) the single highest-priority resurrection opportunity.

  close_plan_create:
    name: "Mutual Close Plan Creation"
    description: "Build mutual action plan with milestone phases and customer-confirmed dates"
    prompt: |
      You are building a mutual close plan for opportunity "{opportunity_name}" currently
      in {current_stage} stage with target close date {target_close_date}.
      Stakeholder map: {stakeholder_map}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook produces a milestone-based mutual action plan that aligns vendor and
      customer actions toward a confirmed close date.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: MAP REMAINING STAGES
      Identify all stages remaining from {current_stage} to closed-won. For each stage,
      list the exit criteria that must be met before advancing. Reference standard sales
      methodology stage definitions.
      Deliverable: Stage Map (Stage | Exit Criteria | Typical Duration Days | Key Stakeholder).

      STEP 3: DEFINE MILESTONE PHASES
      Break each remaining stage into concrete milestones (2-3 per stage). Each milestone
      must have: a clear completion criteria, a vendor-side owner, a customer-side owner,
      and dependencies on prior milestones.
      Deliverable: Milestone Plan (Phase | Milestone | Completion Criteria | Vendor Owner | Customer Owner | Dependencies).

      STEP 4: CALCULATE TIMELINE
      Working backward from {target_close_date}, assign target dates to each milestone.
      Account for: typical procurement timelines in this account's industry, holiday/vacation
      periods, known customer review cycles, and buffer for slippage.
      Flag if the timeline is unrealistic (total required days > available days).
      Deliverable: Timeline (Milestone | Target Date | Days Required | Critical Path Y/N | Buffer Days).

      STEP 5: IDENTIFY CUSTOMER COMMITMENTS
      For each milestone requiring customer action, specify exactly what the customer needs
      to do, who needs to do it, and by when. These become the "mutual" commitments that
      must be confirmed with the customer.
      Deliverable: Customer Commitments (Milestone | Customer Action | Customer Owner | Due Date | Confirmation Status).

      STEP 6: ASSESS PLAN RISKS
      Identify milestones most likely to slip: those with unconfirmed customer owners,
      dependencies on external parties (legal, procurement, security), or historically
      problematic steps. For each risk, define an early warning indicator and contingency.
      Assign secondary flags where the signal spans multiple dimensions (e.g., a risk
      that is primarily PROCESS but also STAKEHOLDER and TIMING). Include prerequisites:
      what must be true before each contingency action can start.
      Deliverable: Risk Register (Milestone | Risk | Probability | Secondary Flags | Early Warning | Contingency | Prerequisites).

      STEP 7: FORMAT SHAREABLE PLAN
      Combine Steps 3-6 into a customer-shareable close plan document. Remove internal-only
      notes. Frame milestones as joint commitments, not vendor demands. Include a header
      with deal name, parties, target date, and plan owner.
      Deliverable: Customer-Facing Close Plan (formatted for sharing).


      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every milestone has both a vendor and customer owner, not just vendor
      2. Timeline math is correct: milestone dates don't overlap or leave gaps
      3. Critical path is identified, total critical path days don't exceed available days
      4. Customer commitments are specific actions, not "provide feedback"
      5. No milestones without completion criteria
      6. Risk register covers procurement/legal/security steps (common blockers)
      7. Customer-facing plan uses collaborative language, not directive
      8. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 6 deliverables. Lead with a 2-sentence summary stating: (1) total
      milestones and critical path length, (2) the weakest point or highest-risk
      milestone, and (3) any timeline risk requiring immediate action.

  close_plan_health:
    name: "Close Plan Health Assessment"
    description: "Assess close plan health against milestone tracking and identify stall patterns"
    prompt: |
      You are assessing the health of the close plan for "{opportunity_name}".
      Current plan: {close_plan}. Milestone status: {milestone_status}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook evaluates close plan execution, identifies slipping milestones,
      detects stall patterns, and recommends corrective actions.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: MILESTONE STATUS AUDIT
      For each milestone in the plan, determine current status: COMPLETE, ON TRACK,
      AT RISK, DELAYED, or BLOCKED. Calculate days variance from target date
      (negative = behind, positive = ahead). Identify the blocker for any DELAYED/BLOCKED items.
      Deliverable: Milestone Status (Milestone | Target Date | Actual/Projected Date | Days Variance | Status | Blocker).

      STEP 3: CUSTOMER ENGAGEMENT CHECK
      For each customer-side owner in the plan, separate:
      - Layer A: Observable Indicators (last engagement date, commitments due count,
        commitments completed on time count, response times in days)
      - Layer B: Interpretive Assessments (engagement status: ENGAGED/FADING/DISENGAGED)
        with confidence: HIGH (6+ months history / 5+ data points), MEDIUM (2-4 data points),
        LOW (1-2 data points)
      Deliverable: Customer Engagement (Owner | Role | Observable Data | Commitments Due | Completed On Time | Last Engagement | Interpretive Status | Confidence).

      STEP 4: CRITICAL PATH ASSESSMENT
      Evaluate the critical path milestones specifically. If any critical path item is
      DELAYED or BLOCKED, calculate the downstream impact on the close date. Determine
      whether the target close date is still achievable.
      Deliverable: Critical Path Status (Milestone | Status | Downstream Impact Days | Close Date Impact).

      STEP 5: DETECT STALL PATTERNS
      Look for patterns that indicate the plan is stalling:
      - Multiple milestones delayed by the same owner → stakeholder problem
      - Sequential delays cascading → timeline was unrealistic
      - Customer milestones delayed but vendor milestones on track → customer not committed
      - No activity for 7+ days on next milestone → plan has gone cold
      Deliverable: Stall Pattern Analysis (Pattern | Evidence | Severity | Root Cause).

      STEP 6: CALCULATE PLAN HEALTH SCORE
      Score overall plan health as GREEN/YELLOW/RED:
      - GREEN: all milestones on track or ahead, all customer owners engaged
      - YELLOW: 1-2 milestones at risk, or 1 customer owner fading
      - RED: critical path delayed, or customer disengaged, or close date at risk
      Assign secondary flags where the signal spans multiple dimensions (e.g., a health
      issue that is primarily STAKEHOLDER but also PROCESS and TIMELINE).
      Deliverable: Health Score with justification, secondary dimension flags, referencing specific milestones and evidence.

      STEP 7: RECOMMEND CORRECTIVE ACTIONS
      For each DELAYED/BLOCKED/AT RISK milestone, recommend a specific corrective action.
      If RED, recommend an escalation plan with: who to escalate to, what to communicate,
      and revised timeline proposal. For each action, include prerequisites: what must be
      true before this action can start.
      Deliverable: Corrective Actions (Milestone | Issue | Action | Owner | Deadline | Prerequisites) + Escalation Plan if RED.


      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Data Availability Map completed first
      2. If 2+ dimensions LOW, Signal Acquisition Mode used and scoring steps NOT produced
      3. Scores on LOW-richness data marked "estimated" with basis
      4. Interpretive assessments include confidence levels
      5. Days variance is calculated precisely, not estimated
      6. Every DELAYED/BLOCKED milestone has an identified blocker
      7. Customer engagement status is based on evidence (dates, responses), not assumptions
      8. Stall patterns are backed by specific milestone evidence
      9. Health score directly follows the GREEN/YELLOW/RED criteria, no subjective overrides
      10. Corrective actions are specific to the milestone, not generic "follow up"
      11. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all deliverables (Data Availability Map + 6 step deliverables in normal mode,
      or Data Availability Map + Signal Acquisition Plan in signal acquisition mode).
      Lead with a 2-sentence summary stating: (1) plan health score, (2) the weakest
      point or lowest confidence area, and (3) the single biggest risk to the close date.

# ============================================================================
# PIPELINE MANAGEMENT PROMPTS
# ============================================================================
pipeline_management:

  forecast_accuracy:
    name: "Forecast Risk Assessment"
    description: "Identify deals that may slip from forecast"
    prompt: |
      You are assessing forecast accuracy for deals in {stage} or later stages
      with close dates in {quarter}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook identifies deals at risk of slipping from forecast and quantifies
      the total forecast exposure.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: INVENTORY FORECAST DEALS
      List all deals in scope with: deal name, value, current stage, close date,
      forecast category (commit/best case/pipeline), and days until projected close.
      Deliverable: Forecast Inventory (Deal | Value | Stage | Close Date | Category | Days to Close).

      STEP 3: ASSESS DEAL-LEVEL CONFIDENCE
      For each deal, evaluate confidence across 5 dimensions. Separate each into:
      - Layer A: Observable Indicators (contact dates, meeting counts, documented budget statements)
      - Layer B: Interpretive Assessments (confidence scoring) with confidence:
        HIGH (6+ months history / 5+ data points), MEDIUM (2-4 data points), LOW (1-2 data points)
      Dimensions:
      - Engagement: customer contact frequency and recency (last 7/14/21+ days)
      - Decision maker: economic buyer identified and engaged (Y/N, last meeting date)
      - Budget: confirmed, verbal, assumed, or unknown
      - Timeline: customer-confirmed date, vendor-assumed, or no signal
      - Competition: sole-source, preferred, competitive, or behind
      Score each dimension 1-3 and calculate composite confidence percentage.
      Deliverable: Confidence Matrix (Deal | Dimension | Observable Data | Interpretive Score 1-3 | Confidence Level | Composite %).

      STEP 4: IDENTIFY AT-RISK DEALS
      Flag deals with composite confidence below 60% as AT RISK. For each at-risk deal,
      identify the weakest dimension and the specific evidence driving the low score.
      Assign secondary flags where the risk spans multiple dimensions (e.g., a deal at risk
      primarily due to ENGAGEMENT but also BUDGET and TIMELINE).
      Deliverable: At-Risk Deals (Deal | Value | Confidence % | Weakest Dimension | Secondary Flags | Evidence | Risk Category | Commercial Impact: Renewal/Expansion/Neither).

      STEP 5: QUANTIFY FORECAST EXPOSURE
      Calculate total forecast at risk:
      - Sum value of all at-risk deals = gross exposure
      - Weight by inverse confidence (deal value * (1 - confidence%)) = weighted exposure
      - Compare weighted pipeline to quota gap = coverage shortfall
      Deliverable: Forecast Exposure Summary (Total Forecast | At-Risk Value | Weighted Exposure | Coverage Ratio).

      STEP 6: PRIORITIZE FOCUS DEALS
      Rank deals by impact potential: (deal value * confidence gap * time urgency).
      Select top 5 deals where focused action this week could most improve forecast accuracy.
      For each, specify the single most important action and its prerequisites: what must
      be true before this action can start.
      Deliverable: Weekly Focus List (Rank | Deal | Value | Action | Prerequisites | Expected Confidence Lift).


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Data Availability Map completed first
      2. If 2+ dimensions LOW, Signal Acquisition Mode used and scoring steps NOT produced
      3. Scores on LOW-richness data marked "estimated" with basis
      4. Interpretive assessments include confidence levels
      5. Every deal has all 5 confidence dimensions scored, none marked "N/A"
      6. Confidence percentages are calculated from the 5-dimension scoring, not gut feel
      7. Forecast exposure math is shown (formula + calculation), not just results
      8. Focus deals are ranked by calculated impact, not alphabetical or by value alone
      9. "Last contact" uses specific dates, not "recently"
      10. Budget status uses the 4-level scale (confirmed/verbal/assumed/unknown), not Y/N
      11. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all deliverables (Data Availability Map + 5 step deliverables in normal mode,
      or Data Availability Map + Signal Acquisition Plan in signal acquisition mode).
      Lead with a 3-sentence summary stating: (1) total forecast value and total at-risk
      exposure, (2) the weakest point or lowest confidence area, and (3) the number of
      focus deals needing action this week.

  pipeline_coverage:
    name: "Pipeline Coverage Analysis"
    description: "Assess if pipeline is sufficient for target"
    prompt: |
      You are analyzing pipeline coverage for {quarter}. Current pipeline: {pipeline_value}.
      Target: {target_value}. Historical win rate: {win_rate}%.
      Account state: {account_state}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook determines whether pipeline is sufficient to hit target and identifies
      specific gaps with generation recommendations.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: CALCULATE COVERAGE METRICS
      Compute: coverage ratio (pipeline / target), required coverage ratio at historical win rate,
      gap to required coverage, and pipeline needed to close the gap.
      Formula: Required pipeline = Target / Win Rate. Gap = Required - Current.
      Deliverable: Coverage Metrics (Target | Current Pipeline | Win Rate | Required Pipeline | Coverage Ratio | Gap).

      STEP 2: SEGMENT PIPELINE BY STAGE
      Break pipeline into stage buckets. For each stage, calculate: deal count, total value,
      average days in stage, and stage-specific win rate (if available). Identify stages
      with concentration risk (>40% of pipeline in one stage). Assign secondary flags where
      the concentration risk spans multiple dimensions (e.g., concentration that is primarily
      STAGE but also SEGMENT and DEAL-SIZE).
      Deliverable: Stage Distribution (Stage | Deal Count | Value | % of Pipeline | Avg Days in Stage | Stage Win Rate | Concentration Risk | Secondary Flags).

      STEP 3: IDENTIFY HIGHEST-PROBABILITY CLOSES
      Rank deals by close probability using: stage advancement, engagement recency,
      MEDDPICC strength, and close date proximity. Select top 5 most likely to close
      this quarter with probability estimate.
      Deliverable: Top 5 Closes (Deal | Value | Stage | Probability % | Key Evidence | Close Date).

      STEP 4: ANALYZE PIPELINE VELOCITY
      Calculate: average deal cycle time by stage, current quarter's velocity vs. prior quarters,
      and projected closes based on current velocity. Identify if velocity is trending up/down.
      Deliverable: Velocity Analysis (Metric | This Quarter | Last Quarter | Trend | Impact on Target).

      STEP 5: BUILD GENERATION PLAN
      If gap exists (Step 1), recommend where to source additional pipeline:
      - Expansion within existing accounts (upsell/cross-sell candidates)
      - Acceleration of early-stage deals (what would move them faster)
      - New pipeline sources (events, referrals, outbound campaigns)
      For each source, estimate: potential value, time to close, and effort required.
      Include prerequisites: what must be true before each generation action can start.
      Deliverable: Generation Plan (Source | Potential Value | Time to Close | Effort | Priority | Prerequisites).

      STEP 6: BUILD WEEK-BY-WEEK CLOSE PLAN
      Map expected closes to calendar weeks remaining in {quarter}. Identify weeks with
      no expected closes (dead weeks) and weeks overloaded with multiple closes. Balance
      the plan and flag unrealistic clustering.
      Deliverable: Weekly Close Calendar (Week | Expected Closes | Value | Cumulative vs Target).


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Coverage ratio math is shown, not just the result
      2. Win rate used is historical, not aspirational
      3. Top 5 closes have probability estimates based on evidence, not hope
      4. Generation plan sources have realistic time-to-close estimates
      5. Weekly close calendar accounts for remaining business days, not calendar days
      6. No "we need to sell more" recommendations without specific source and method
      7. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 6 deliverables. Lead with a 3-sentence summary stating: (1) coverage
      ratio and gap to target, (2) the weakest point or lowest confidence area, and
      (3) whether the pipeline is sufficient at current win rates.

  next_best_action:
    name: "Daily Priority Actions"
    description: "Identify highest-impact actions for today"
    prompt: |
      You are identifying the highest-impact actions for today across all active opportunities.

      Account state: {account_state}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)
      This runbook produces a prioritized daily action list ranked by deal impact,
      time sensitivity, and risk mitigation value.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: SCAN TIME-SENSITIVE ITEMS
      Review all active opportunities for items requiring action today:
      - Unanswered customer communications (>24 hours old)
      - Meetings in the next 48 hours needing preparation
      - Commitments made to customers with approaching deadlines
      - Close plan milestones due this week
      Deliverable: Time-Sensitive Items (Item | Deal | Due | Consequence if Missed | Hours Until Due).

      STEP 2: IDENTIFY RISK MITIGATION ACTIONS
      From deal health data, identify deals where action today could prevent a negative outcome:
      - Deals at risk of stalling (no activity in 7+ days)
      - Champions who haven't responded in 5+ days
      - Competitive threats detected but not addressed
      - Budget windows closing within 14 days
      Assign secondary flags where the risk spans multiple dimensions (e.g., a risk that
      is primarily COMPETITIVE but also STAKEHOLDER and TIMELINE).
      Deliverable: Risk Actions (Deal | Risk | Secondary Flags | Action Needed | Impact if Delayed | Urgency Score 1-5).

      STEP 3: IDENTIFY ADVANCEMENT ACTIONS
      Find opportunities where action today could advance the deal:
      - Deals ready for next stage but missing one action
      - Stakeholders who showed buying signals but weren't followed up
      - Technical validations completed but business case not sent
      Deliverable: Advancement Actions (Deal | Current Stage | Action | Expected Outcome | Value at Stake).

      STEP 4: PRIORITIZE AND RANK
      Combine all actions from Steps 1-3. Score each by: deal value weight (25%),
      time urgency (25%), risk of inaction (25%), and advancement potential (25%).
      Rank and select top 5.
      For each action, include prerequisites: what must be true before this action can start.
      Deliverable: Priority List (Rank | Action | Deal | Why Now | Expected Outcome | Est. Time Minutes | Prerequisites).

      STEP 5: ESTIMATE TIME BLOCKS
      For the top 5 actions, estimate time required and suggest a schedule for today.
      Flag if total time exceeds available hours and recommend what to defer.
      Deliverable: Today's Schedule (Time Block | Action | Deal | Duration).


      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every action is specific (not "follow up with customer" but "send POC results email to {name}")
      2. "Why now" is concrete (not "important" but "customer meeting in 36 hours")
      3. Time estimates are realistic (not 5 minutes for preparing a business case)
      4. No more than 5 priority actions (focus over completeness)
      5. Actions with dependencies on others are flagged
      6. Deferred actions have a recommended date, not "later"
      7. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 5 deliverables. Lead with a 2-sentence summary stating: (1) the single
      most important action for today, (2) the weakest point or highest-risk area across
      the pipeline, and (3) why the top action can't wait.

  territory_analysis:
    name: "Territory Account Tiering"
    description: "Tier territory accounts by revenue potential, engagement level, and ICP fit"
    prompt: |
      You are tiering territory accounts for strategic resource allocation.
      Territory accounts: {territory_accounts}. Quota target: {quota_target}.
      Current pipeline: {current_pipeline}.
      Account state: {account_state}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook produces an evidence-based account tiering with coverage gap analysis
      and effort rebalancing recommendations.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: SCORE ICP FIT
      For each account, score against ICP criteria: industry match (0-3), company size (0-3),
      tech stack alignment (0-3), and pain signal presence (0-3). Total ICP score out of 12.
      Deliverable: ICP Scoring (Account | Industry | Size | Tech Stack | Pain Signals | ICP Score /12).

      STEP 2: ESTIMATE REVENUE POTENTIAL
      For each account, estimate annual revenue potential based on: company size and typical
      deal sizes in that segment, number of addressable use cases, expansion potential
      (departments, regions, products). Assign confidence: HIGH (based on similar wins),
      MEDIUM (estimated from firmographics), LOW (rough estimate).
      Deliverable: Revenue Potential (Account | Est. Annual Value | Addressable Use Cases | Expansion Potential | Confidence).

      STEP 3: ASSESS ENGAGEMENT LEVEL
      For each account, measure current engagement: active pipeline (Y/N and value),
      last contact date, number of contacts in CRM, relationship depth (executive access Y/N),
      content engagement signals.
      Deliverable: Engagement Assessment (Account | Active Pipeline | Last Contact | Contacts in CRM | Exec Access | Engagement Score).

      STEP 4: ASSIGN TIERS
      Combine scores from Steps 1-3 to assign tiers:
      - Tier 1 (High-Touch): ICP score ≥9 AND revenue potential HIGH/MEDIUM AND engagement active → dedicated account plan, weekly touch
      - Tier 2 (Strategic): ICP score 6-8 OR revenue potential MEDIUM → quarterly outreach, event invites
      - Tier 3 (Opportunistic): ICP score <6 OR revenue potential LOW → react to inbound only
      Flag accounts that are Tier 1 by potential but Tier 3 by engagement (dormant high-value).
      Assign secondary flags where the account signal spans multiple dimensions (e.g., an
      account that is primarily HIGH-POTENTIAL but also STRATEGIC-FIT and EXPANSION-READY).
      Deliverable: Account Tier Map (Account | ICP Score | Revenue Potential | Engagement | Tier | Secondary Flags | Flag).

      STEP 5: IDENTIFY COVERAGE GAPS
      Cross-reference Tier 1 accounts against active pipeline. List Tier 1 accounts with
      no active opportunity, no recent contact (30+ days), or no executive relationship.
      These are the highest-priority coverage gaps.
      Deliverable: Coverage Gaps (Account | Tier | Gap Type | Days Since Contact | Revenue at Risk | Priority).

      STEP 6: RECOMMEND EFFORT REBALANCING
      Identify accounts consuming disproportionate effort relative to tier: Tier 3 accounts
      with high activity, Tier 1 accounts with low activity. Recommend specific rebalancing
      actions with time savings estimates.
      For each rebalancing action, include prerequisites: what must be true before this
      action can start.
      Deliverable: Rebalancing Plan (Account | Current Tier | Current Effort | Recommended Effort | Time Savings Hours/Week | Prerequisites).


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every account has all three scores (ICP, revenue, engagement), none skipped
      2. Revenue estimates have confidence levels, not presented as facts
      3. Tier assignments follow the defined criteria, no subjective overrides
      4. Coverage gaps focus on Tier 1 only (Tier 2-3 gaps are expected)
      5. Rebalancing recommendations quantify time savings, not just "spend less time"
      6. Dormant high-value accounts are explicitly flagged
      7. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 6 deliverables. Lead with a 3-sentence summary stating: (1) total
      accounts tiered and number of coverage gaps in Tier 1, (2) the weakest point or
      lowest confidence area, and (3) the top effort rebalancing opportunity.

  horizon_plan:
    name: "Three-Horizon Pipeline Plan"
    description: "Build three-horizon pipeline plan mapping accounts to close/qualify/prospect timelines"
    prompt: |
      You are building a three-horizon pipeline plan for strategic pipeline management.
      Account tiers: {account_tiers}. Whitespace analysis: {whitespace_analysis}.
      Quota: {quota_target}. Quarter: {quarter}.
      Account state: {account_state}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook produces a horizon-mapped pipeline plan that ensures coverage across
      immediate closes, near-term qualification, and long-term prospecting.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: MAP HORIZON 1 (THIS QUARTER: CLOSE)
      List all deals expected to close in {quarter}. Classify each as COMMIT (>80% confidence)
      or UPSIDE (40-80% confidence). Calculate: total commit value, total upside value,
      and gap to quota if only commits close. Assign secondary flags where the deal risk
      spans multiple dimensions (e.g., a deal classified as UPSIDE primarily due to TIMELINE
      but also STAKEHOLDER and BUDGET concerns).
      Deliverable: Horizon 1 (Deal | Value | Stage | Confidence % | Category | Secondary Flags | Close Week | Risk Factors).

      STEP 2: MAP HORIZON 2 (NEXT QUARTER: QUALIFY)
      List deals and opportunities targeted for next quarter. For each, identify: current stage,
      advancement actions needed this quarter, target stage by quarter end, and qualification
      gaps to fill. Calculate projected next-quarter pipeline value.
      Deliverable: Horizon 2 (Deal | Value | Current Stage | Target Stage | Actions This Quarter | Qualification Gap).

      STEP 3: MAP HORIZON 3 (TWO QUARTERS OUT: PROSPECT)
      Identify accounts to prospect based on whitespace analysis and account tiers.
      For each, specify: ICP rationale, entry strategy, target persona, and pipeline
      seed actions to start this quarter. Calculate prospecting effort budget.
      Deliverable: Horizon 3 (Account | Tier | ICP Score | Entry Strategy | Target Persona | Seed Action | Potential Value).

      STEP 4: CALCULATE COVERAGE BY HORIZON
      For each horizon, calculate coverage ratio against the relevant quota period.
      Horizon 1: pipeline/quota for this quarter. Horizon 2: projected pipeline/quota for next quarter.
      Horizon 3: prospecting pipeline potential/quota for Q+2.
      Deliverable: Coverage Summary (Horizon | Deal Count | Total Value | Quota | Coverage Ratio | Status).

      STEP 5: IDENTIFY CROSS-HORIZON GAPS
      Analyze: Is Horizon 1 sufficient? If not, can any Horizon 2 deals be accelerated?
      Is Horizon 2 pipeline being built fast enough? Is Horizon 3 generating enough seeds?
      Recommend specific actions to close gaps in each horizon. For each action, include
      prerequisites: what must be true before this action can start.
      Deliverable: Gap Analysis (Horizon | Gap | Root Cause | Recommended Action | Impact | Owner | Prerequisites).

      STEP 6: BUILD EXECUTION CALENDAR
      Map all actions across horizons to a weekly calendar for this quarter.
      Allocate time: 60% Horizon 1, 25% Horizon 2, 15% Horizon 3.
      Flag weeks where actions cluster and need redistribution.
      Deliverable: Execution Calendar (Week | H1 Actions | H2 Actions | H3 Actions | Total Effort Hours).


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Commit vs. upside classification uses specific confidence criteria, not feelings
      2. Coverage ratios use historical win rates, not 100% close assumption
      3. Horizon 3 prospects are from Tier 1-2 accounts, not random
      4. Time allocation across horizons sums to 100% and reflects deal maturity
      5. Gap analysis has specific actions, not "generate more pipeline"
      6. Execution calendar is realistic against available selling hours per week
      7. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 6 deliverables. Lead with a 3-sentence summary stating: (1) Horizon 1
      commit value vs. quota, (2) the weakest point or biggest gap across horizons, and
      (3) the key action this week.

# ============================================================================
# STAKEHOLDER INTELLIGENCE PROMPTS
# ============================================================================
stakeholder_intelligence:

  relationship_map:
    name: "Stakeholder Relationship Analysis"
    description: "Map stakeholder dynamics and influence"
    prompt: |
      You are mapping stakeholder dynamics for {account_name} based on all interactions
      in the last {time_period}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook produces a comprehensive stakeholder map that reveals decision-making
      dynamics, influence patterns, and engagement gaps.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: IDENTIFY ALL STAKEHOLDERS
      Extract every contact who has participated in meetings, emails, or been referenced
      in communications. For each, capture: name, title, department, first interaction date,
      and total interaction count.
      Deliverable: Contact Inventory (Name | Title | Department | First Interaction | Total Interactions).

      STEP 3: CLASSIFY ROLES IN BUYING PROCESS
      Map each stakeholder to their buying role: Economic Buyer, Technical Buyer, User Buyer,
      Coach/Champion, Influencer, Blocker, or Gatekeeper. One person may hold multiple roles.
      Identify the role gaps: which buying roles have no identified person?
      Deliverable: Role Map (Name | Title | Buying Role(s) | Evidence for Classification | Role Gaps Identified).

      STEP 4: ASSESS SENTIMENT AND ENGAGEMENT
      For each stakeholder, score: sentiment toward our solution (Advocate/Supportive/Neutral/
      Skeptical/Opponent), engagement level (Active/Occasional/Passive/Disengaged), and last
      meaningful contact date. Assign secondary flags where the sentiment spans multiple
      dimensions (e.g., a stakeholder who is primarily SUPPORTIVE on TECHNICAL merit but
      SKEPTICAL on COMMERCIAL terms and NEUTRAL on TIMELINE).
      Deliverable: Sentiment Matrix (Name | Buying Role | Sentiment | Secondary Flags | Engagement Level | Last Contact | Trend).

      STEP 5: MAP INFLUENCE DYNAMICS
      Identify reporting relationships and informal influence patterns:
      - Who reports to whom?
      - Who influences the Economic Buyer's decisions?
      - Who has veto power?
      - Are there alliance patterns (people who always align)?
      - Are there conflict patterns (people who oppose each other)?
      Deliverable: Influence Map (Person | Reports To | Influences | Influenced By | Alliance/Conflict Notes).

      STEP 6: IDENTIFY COVERAGE GAPS
      Compare the stakeholder map against ideal coverage for the deal stage:
      - Is the Economic Buyer engaged? If not, who is the path to them?
      - Is there a tested Champion? What evidence?
      - Are there unengaged Technical Buyers who could block?
      - Are procurement/legal/security contacts identified?
      For each recommended action, include prerequisites: what must be true before this
      action can start.
      Deliverable: Coverage Gap Analysis (Gap | Impact | Path to Fill | Recommended Action | Priority | Prerequisites).

      STEP 7: BUILD ENGAGEMENT PLAN
      Create a sequenced engagement plan: who to engage next, in what order, through
      which channel, and with what message. Sequence based on influence paths
      (engage Coach before approaching Economic Buyer).
      Deliverable: Engagement Sequence (Order | Person | Channel | Message Hook | Objective | Dependency).


      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every stakeholder has a classified buying role, not "unknown"
      2. Sentiment scores are based on evidence (what they said/did), not assumptions
      3. Influence dynamics identify at least one path to the Economic Buyer
      4. Coverage gaps are prioritized by deal impact, not alphabetical
      5. Engagement plan is sequenced with dependencies, not a flat list
      6. Last contact dates are specific, not "recently"
      7. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 6 deliverables. Lead with a 3-sentence summary stating: (1) total
      stakeholders mapped, (2) the most critical coverage gap or lowest confidence area,
      and (3) the recommended next engagement.

  champion_health:
    name: "Champion Health Check"
    description: "Assess strength of our internal champion"
    prompt: |
      You are assessing champion health for {champion_name} at {account_name}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook evaluates whether the champion is actively and effectively selling
      internally, and recommends actions to strengthen or supplement the relationship.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: ASSESS ENGAGEMENT EVIDENCE
      Review all interactions with {champion_name}: meeting attendance, email responsiveness,
      information sharing, and introduction facilitation. Calculate: response time trend
      (getting faster or slower), meeting frequency trend, and quality of information shared.
      Deliverable: Engagement Evidence (Metric | Last 30 Days | Prior 30 Days | Trend | Assessment).

      STEP 3: EVALUATE INTERNAL SELLING ACTIVITY
      Determine whether the champion is actively advocating internally:
      - Have they introduced us to new stakeholders? (who, when)
      - Have they shared our materials internally? (evidence)
      - Have they communicated our value proposition in their words? (evidence)
      - Have they warned us about internal obstacles? (what, when)
      - Have they helped navigate procurement/legal? (how)
      Score each activity: ACTIVE (evidence in last 14 days), HISTORICAL (evidence >14 days ago), NONE.
      Deliverable: Internal Selling Assessment (Activity | Status | Evidence | Last Occurrence).

      STEP 4: ASSESS CHAMPION POWER
      Evaluate whether the champion has sufficient organizational power. Separate into:
      - Layer A: Observable Indicators (title, reporting line, budget range, meeting access records,
        org chart position, tenure in role)
      - Layer B: Interpretive Assessments (power level, credibility, standing) with confidence:
        HIGH (6+ months history / 5+ data points), MEDIUM (2-4 data points), LOW (1-2 data points)
      Dimensions:
      - Budget authority: direct, influence, or none
      - Access to Economic Buyer: direct report, same division, or remote
      - Organizational standing: rising, stable, or at risk
      - Credibility on this topic: domain expert, general executive, or peripheral
      Deliverable: Power Assessment (Dimension | Observable Data | Interpretive Level | Confidence | Evidence | Impact on Deal).

      STEP 5: TEST CHAMPION RELIABILITY
      Apply the "Champion Test" criteria:
      - Will they meet without their boss? (shows personal investment)
      - Will they share internal political dynamics? (shows trust)
      - Will they coach us on how to win? (shows commitment)
      - Will they tell us bad news? (shows honesty)
      - Will they block competitors on our behalf? (shows advocacy)
      Score each: CONFIRMED (evidence), LIKELY (indirect evidence), UNCONFIRMED, FAILED.
      Deliverable: Champion Test Results (Criterion | Score | Evidence).

      STEP 6: CALCULATE HEALTH SCORE AND RECOMMEND
      Score champion health 1-10 based on Steps 2-5:
      - 8-10: Strong champion, maintain and leverage
      - 5-7: Adequate but needs strengthening, specific actions
      - 3-4: Weak champion, build backup
      - 1-2: Champion in name only, find alternative
      Recommend specific actions based on the score band. For each risk, classify
      commercial impact as: Renewal (threatens renewal), Expansion (blocks upsell/cross-sell),
      or Neither (operational only).
      Deliverable: Health Score (Score | Band | Key Strengths | Key Risks | Commercial Impact: Renewal/Expansion/Neither | Actions | Prerequisites/Dependencies).


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Data Availability Map completed first
      2. If 2+ dimensions LOW, Signal Acquisition Mode used and scoring steps NOT produced
      3. Scores on LOW-richness data marked "estimated" with basis
      4. Interpretive assessments include confidence levels
      5. Engagement trends use specific metrics (response time, frequency), not "they seem engaged"
      6. Internal selling evidence is specific (who was introduced, what was shared), not assumed
      7. Champion test criteria have evidence references, not just Y/N
      8. Health score follows the scoring criteria from Steps 2-5, not subjective override
      9. Actions are specific to the weakest areas, not generic relationship advice
      10. If champion is weak (score <5), backup champion identification is included

      Produce all deliverables (Data Availability Map + 5 step deliverables in normal mode,
      or Data Availability Map + Signal Acquisition Plan in signal acquisition mode).
      Lead with a 2-sentence assessment: champion health score and the single biggest risk
      to the champion relationship.

  executive_brief:
    name: "Executive Meeting Preparation"
    description: "Prepare for executive-level customer meeting"
    prompt: |
      You are preparing a briefing for a meeting with {executive_name} ({title})
      at {account_name}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.

      This runbook produces a comprehensive executive briefing that ensures the meeting
      is strategically focused, value-oriented, and drives a specific outcome.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
