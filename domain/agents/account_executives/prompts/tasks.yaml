        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: EXTRACT KEY DISCUSSION POINTS
      From call notes, identify the main topics discussed. For each, capture: the topic,
      what was said by the customer, what was said by our team, and the outcome
      (agreed, disagreed, deferred, information shared).
      Deliverable: Discussion Points (Topic | Customer Position | Our Position | Outcome).

      STEP 2: DOCUMENT DECISIONS AND COMMITMENTS
      Extract every decision made and commitment given during the call. Classify as:
      our commitment to them, their commitment to us, or mutual agreement.
      Flag any commitment that contradicts or modifies previous commitments.
      Deliverable: Decisions & Commitments (Decision/Commitment | Type | Owner | Due Date | Contradicts Previous Y/N).

      STEP 3: ASSESS SENTIMENT
      Evaluate overall call sentiment based on: customer tone, topics they raised proactively,
      questions asked, enthusiasm level, and concerns expressed. Score as POSITIVE, NEUTRAL,
      CAUTIOUS, or NEGATIVE with specific evidence.
      Deliverable: Sentiment Assessment (Score | Evidence | Sentiment Shift from Previous Call | Key Indicator).

      STEP 4: IDENTIFY SIGNALS FOR MEDDPICC
      Map any new information to MEDDPICC dimensions. Note: new metrics discussed, budget
      signals, decision criteria revealed, process steps clarified, pain points articulated,
      champion behavior, or competitive mentions.
      Deliverable: MEDDPICC Signal Update (Dimension | New Information | Source | Impact on Qualification).

      STEP 5: BUILD ACTION ITEMS
      Create a complete action item list with: specific action, owner (name, not "team"),
      due date (specific, not "next week"), and priority. Include both internal actions
      (prepare proposal, schedule demo) and follow-up communications.
      Deliverable: Action Items (Action | Owner | Due Date | Priority | Dependencies).

      STEP 6: GENERATE CRM UPDATE
      Produce CRM-ready updates: stage change recommendation (if warranted), close date
      adjustment, amount update, next steps field content, and any new contacts to add.
      Deliverable: CRM Updates (Field | Current Value | Recommended Value | Reason for Change).


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every commitment has a specific owner and due date
      2. Sentiment assessment cites specific evidence, not general impressions
      3. MEDDPICC updates reference specific quotes or observations from the call
      4. Action items have named owners, not "we" or "the team"
      5. CRM updates include the reason for each recommended change
      6. No action items are duplicated or contradictory

      Produce all 6 deliverables. Lead with a 3-sentence executive summary: overall
      call outcome, the most important decision made, and the highest-priority action item.

  discovery_plan:
    name: "Structured Discovery Plan"
    description: "Build structured discovery plan with persona-tailored questions and MEDDPICC mapping"
    prompt: |
      You are building a structured discovery plan for an upcoming call with {account_name}.
      Attendee roles: {attendee_roles}. Known pain points: {known_pain_points}.
      Account context: {account_context}.
      Account state: {account_state}.

      This runbook produces a discovery call plan with persona-tailored questions mapped
      to MEDDPICC dimensions and evidence targets.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: ASSESS CURRENT MEDDPICC STATE
      Review existing qualification data. For each MEDDPICC dimension, assess current
      status: STRONG (confirmed evidence), PARTIAL (some evidence), WEAK (minimal evidence),
      or UNKNOWN (no data). Identify the priority dimensions to fill in this call.
      Deliverable: MEDDPICC Status (Dimension | Current Status | Evidence Available | Priority to Fill | Target This Call Y/N).

      STEP 2: MAP QUESTIONS TO ATTENDEE PERSONAS
      For each attendee role, identify: what this persona typically cares about, what
      information they can provide, which MEDDPICC dimensions they can help fill, and
      their likely communication style (data-driven, story-driven, process-driven).
      Deliverable: Persona Map (Role | Cares About | Can Provide | MEDDPICC Dimensions | Style).

      STEP 3: BUILD QUESTION SEQUENCE
      Create 12-15 questions organized in discovery flow:
      - Opening (2-3): rapport-building, validate context, confirm agenda
      - Current State (3-4): process walk-through, pain exploration, impact quantification
      - Desired State (2-3): goals, success criteria, timeline expectations
      - Decision Process (2-3): criteria, stakeholders, process, timeline
      - Closing (1-2): next steps, additional stakeholders, decision timeline
      Map each question to: the persona it targets, the MEDDPICC dimension it fills,
      and the specific evidence to listen for.
      Deliverable: Question Sequence (Phase | Question | Target Persona | MEDDPICC Dimension | Evidence Target).

      STEP 4: PREPARE EVIDENCE LISTENING GUIDE
      For each MEDDPICC dimension targeted in this call, define: what specific evidence
      would confirm it as STRONG, what follow-up question to ask if the evidence is partial,
      and what red flag to watch for.
      Deliverable: Evidence Guide (Dimension | Strong Evidence Looks Like | Follow-up if Partial | Red Flag).

      STEP 5: DESIGN CALL STRUCTURE
      Map the question sequence to time blocks:
      - Opening/rapport: 5 minutes
      - Current state discovery: 15 minutes
      - Impact/pain quantification: 10 minutes
      - Decision process: 10 minutes
      - Next steps/close: 5 minutes
      Include transition phrases between sections.
      Deliverable: Call Structure (Time Block | Section | Duration | Questions to Cover | Transition).

      STEP 6: PREPARE CONTINGENCY QUESTIONS
      Create 5 backup questions for common discovery scenarios:
      - Customer is guarded and not sharing (softer, indirect approach)
      - Customer is talkative and going off-topic (refocusing questions)
      - Key persona doesn't attend (questions to ask proxy)
      - New pain point emerges (exploration questions)
      - Competitor is mentioned (competitive intelligence questions)
      Deliverable: Contingency Questions (Scenario | Questions | Objective).


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Questions are open-ended (no yes/no questions in discovery phase)
      2. Every priority MEDDPICC dimension has at least 2 questions targeting it
      3. Questions are persona-appropriate (don't ask technical buyer about budget)
      4. Time blocks sum to the total call duration
      5. No leading questions that suggest our solution (discovery, not pitching)
      6. Evidence targets are specific and observable, not vague

      Produce all 6 deliverables. Lead with a 2-sentence summary: the 2-3 most critical
      MEDDPICC dimensions to fill and the primary discovery objective.

# ============================================================================
# OPPORTUNITY HYGIENE PROMPTS
# ============================================================================
opportunity_hygiene:

  weekly_hygiene_check:
    name: "Weekly Opportunity Hygiene Check"
    description: "Perform weekly hygiene check on all active opportunities"
    prompt: |
      You are performing a weekly hygiene check on all active opportunities for {ae_name}.
      Current pipeline: {pipeline_summary}. Review date: {review_date}.
      Account state: {account_state}.

      This runbook audits every active opportunity for data accuracy, engagement recency,
      and stage-appropriate progression.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: AUDIT STAGE ACCURACY
      For each opportunity, compare the CRM stage against actual activity evidence.
      Determine if the stage is: ACCURATE (activity matches stage criteria), OVERSTATED
      (activity doesn't support current stage), or UNDERSTATED (activity supports advancement).
      Deliverable: Stage Audit (Opportunity | CRM Stage | Evidence-Based Stage | Assessment | Recommended Change).

      STEP 2: VALIDATE CLOSE DATES
      For each opportunity, assess close date realism: compare against typical stage-to-close
      timelines, customer-confirmed timeline signals, and remaining milestones.
      Flag dates that are: REALISTIC, AGGRESSIVE (insufficient time for remaining steps),
      or STALE (date passed or no supporting evidence).
      Deliverable: Close Date Validation (Opportunity | Close Date | Days Remaining | Milestones Remaining | Assessment | Recommended Date).

      STEP 3: CHECK ENGAGEMENT RECENCY
      For each opportunity, separate:
      - Layer A: Observable Indicators (last contact date, contact type, days since last
        meaningful two-way interaction, count of outreach attempts)
      - Layer B: Interpretive Assessments (engagement status: CURRENT/AGING/STALE/CRITICAL)
        with confidence: HIGH (6+ months history / 5+ data points), MEDIUM (2-4 data points),
        LOW (1-2 data points)
      Thresholds: CURRENT (<7 days), AGING (7-14 days), STALE (14-21 days), CRITICAL (21+ days).
      Deliverable: Engagement Check (Opportunity | Observable Data | Last Contact Date | Days Since | Interpretive Status | Confidence | Next Step Needed).

      STEP 4: VERIFY NEXT STEPS
      Check that every opportunity has a current, specific next step in CRM. Flag:
      CURRENT (specific action within 7 days), VAGUE ("follow up," "check in"),
      MISSING (no next step), or OVERDUE (next step date passed).
      Deliverable: Next Steps Audit (Opportunity | Next Step | Quality | Due Date | Status | Recommended Update).

      STEP 5: GENERATE HYGIENE SCORECARD
      Calculate per-opportunity hygiene score: stage accuracy (25%), close date realism (25%),
      engagement recency (25%), next steps quality (25%). Calculate portfolio-wide hygiene
      percentage. Flag the 3 opportunities most urgently needing attention.
      Deliverable: Hygiene Scorecard (Opportunity | Stage Score | Date Score | Engagement Score | Steps Score | Total % | Priority).


      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Data Availability Map completed first
      2. If 2+ dimensions LOW, Signal Acquisition Mode used and scoring steps NOT produced
      3. Scores on LOW-richness data marked "estimated" with basis
      4. Interpretive assessments include confidence levels
      5. Every opportunity is assessed, none skipped
      6. Stage recommendations reference specific criteria, not subjective judgment
      7. Close date assessments account for remaining milestones, not just calendar
      8. "Last contact" means two-way engagement, not one-way email
      9. Next steps flagged as VAGUE include a specific recommended replacement
      10. Top 3 priorities are ranked by deal value * hygiene deficit

      Produce all deliverables (Data Availability Map + 5 step deliverables in normal mode,
      or Data Availability Map + Signal Acquisition Plan in signal acquisition mode).
      Lead with a 2-sentence summary: portfolio hygiene score and the number of
      opportunities needing immediate attention.

  opportunity_health_indicators:
    name: "Opportunity Health Indicator Assessment"
    description: "Assess health indicators for opportunity"
    prompt: |
      You are assessing health indicators for {opportunity_name} at {account_name}.
      Current stage: {stage}. Days in stage: {days_in_stage}.
      Last customer contact: {last_contact_date}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.

      This runbook evaluates opportunity health against defined GREEN/YELLOW/RED criteria
      and recommends actions to improve health status.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: EVALUATE GREEN CRITERIA
      Check each GREEN criterion (all must be true for GREEN status). Separate into:
      - Layer A: Observable Indicators (contact dates, meeting schedules, documented issues)
      - Layer B: Interpretive Assessments (champion engagement quality, blocking issue severity)
        with confidence: HIGH (6+ months history / 5+ data points), MEDIUM (2-4 data points),
        LOW (1-2 data points)
      Criteria:
      - Customer engaged in last 7 days (evidence: meeting, email exchange, or call)
      - Next meeting scheduled (date, purpose, attendees)
      - Champion actively engaged (last interaction, quality of engagement)
      - No blocking issues (technical, commercial, or organizational)
      For each, provide evidence or explain why it's not met.
      Deliverable: GREEN Criteria (Criterion | Observable Data | Met Y/N | Interpretive Assessment | Confidence | Date).

      STEP 3: CHECK YELLOW TRIGGERS
      Evaluate YELLOW indicators (any single trigger moves status to YELLOW):
      - No customer contact in 14+ days (calculate exact days)
      - Decision maker not engaged (identify who, last contact attempt)
      - Competitive activity detected (what competitor, what signal)
      - Timeline slipping (original date vs. current projection, days of slip)
      - Stage duration exceeding 1.5x average (calculate ratio)
      Deliverable: YELLOW Triggers (Indicator | Triggered Y/N | Evidence | Days/Metric | Severity).

      STEP 4: CHECK RED TRIGGERS
      Evaluate RED indicators (any single trigger moves status to RED):
      - No customer contact in 21+ days (calculate exact days)
      - Champion gone dark (last contact, outreach attempts since)
      - Budget/priority changed (evidence of change, impact)
      - Competitor preferred (evidence: told directly, or inferred from behavior)
      - Internal reorganization affecting decision (what changed, impact)
      Deliverable: RED Triggers (Indicator | Triggered Y/N | Evidence | Severity | Reversible Y/N | Commercial Impact: Renewal/Expansion/Neither).

      STEP 5: DETERMINE HEALTH STATUS
      Apply criteria hierarchically: any RED trigger = RED, any YELLOW trigger = YELLOW,
      all GREEN met = GREEN. Document the determining factors.
      Deliverable: Health Status (Status | Determining Factors | Primary Concern | Trend vs Last Assessment).

      STEP 6: BUILD RECOVERY PLAN
      If YELLOW or RED, create a specific recovery plan:
      - For each triggered indicator, define the action to resolve it
      - Sequence actions by urgency (address RED triggers first)
      - Include escalation recommendation if RED and not self-recoverable
      Deliverable: Recovery Plan (Indicator | Action | Owner | Deadline | Escalation Needed Y/N | Prerequisites/Dependencies).


      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Data Availability Map completed first
      2. If 2+ dimensions LOW, Signal Acquisition Mode used and scoring steps NOT produced
      3. Scores on LOW-richness data marked "estimated" with basis
      4. Interpretive assessments include confidence levels
      5. Every criterion is evaluated with evidence, none marked "N/A"
      6. Days calculations are exact, not approximate
      7. Status follows the defined hierarchy strictly (RED > YELLOW > GREEN)
      8. Recovery actions target the specific triggered indicator
      9. Champion engagement assessment is based on behavior evidence, not assumptions
      10. Escalation recommendation includes who to escalate to and what to communicate

      Produce all deliverables (Data Availability Map + 5 step deliverables in normal mode,
      or Data Availability Map + Signal Acquisition Plan in signal acquisition mode).
      Lead with a 1-sentence health status declaration with the primary concern.

  stale_opportunity_alert:
    name: "Stale Opportunity Alert"
    description: "Identify and alert on stale opportunities"
    prompt: |
      You are scanning for stale opportunities in {ae_name}'s pipeline.
      Current date: {current_date}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.

      This runbook identifies opportunities that have gone stale and recommends
      actions from re-engagement to close-lost.


      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT -> proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL -> proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT -> STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: APPLY STALENESS CRITERIA
      For each active opportunity, check all staleness indicators:
      - Days since last customer contact (threshold: 14 days WARNING, 21 days CRITICAL)
      - Days since last activity logged (threshold: 7 days)
      - Days since next steps updated (threshold: 7 days)
      - Stage duration vs. expected (threshold: 2x expected duration)
      Calculate each metric precisely.
      Deliverable: Staleness Scan (Opportunity | Days No Contact | Days No Activity | Days Stale Next Steps | Stage Duration Ratio | Alert Level).

      STEP 3: CLASSIFY ALERT LEVELS
      Assign alert levels:
      - HEALTHY: no staleness indicators triggered
      - WATCH: 1 indicator triggered at WARNING threshold
      - WARNING: 2+ indicators at WARNING or 1 at CRITICAL
      - CRITICAL: 2+ indicators at CRITICAL threshold
      Deliverable: Alert Classification (Opportunity | Alert Level | Triggered Indicators | Total Value at Risk).

      STEP 4: ANALYZE STALE PATTERNS
      For WARNING and CRITICAL opportunities, determine the likely cause:
      - Customer disengagement (were they responsive before?)
      - AE bandwidth (too many opportunities, this one deprioritized)
      - Deal stuck in process (waiting on legal, security, procurement)
      - Deal effectively dead (all signals point to loss)
      Deliverable: Pattern Analysis (Opportunity | Alert Level | Likely Cause | Evidence | Recoverable Y/N | Commercial Impact: Renewal/Expansion/Neither).

      STEP 5: RECOMMEND ACTIONS
      For each stale opportunity, recommend one of:
      - RE-ENGAGE: specific outreach action with message hook
      - ESCALATE: bring in manager or executive for intervention
      - DOWNSTAGE: move to earlier stage to reflect reality
      - CLOSE-LOST: deal is effectively dead, clean the pipeline
      Deliverable: Recommended Actions (Opportunity | Action | Rationale | Message/Approach | Timeline | Prerequisites/Dependencies).

      STEP 6: CALCULATE PIPELINE IMPACT
      Sum the value of stale opportunities by alert level. Calculate what pipeline
      looks like if CRITICAL deals are removed (adjusted pipeline). Compare adjusted
      pipeline to quota for realistic coverage assessment.
