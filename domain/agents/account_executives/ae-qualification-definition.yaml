agentspec_version: 26.1.0
component_type: Agent
id: ae-qualification-agent
name: AE Qualification Agent
description: 'Enterprise deals stall when qualification gaps stay hidden until late in the cycle. This agent runs structured
  MEDDPICC assessments across all eight dimensions, scores completeness per deal, surfaces gaps early enough to close them,
  and produces qualification scorecards that turn gut feel into evidence-based deal confidence.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: ae-agent
  tags:
  - qualification
  - meddpicc
  - deal-readiness
  - gap-analysis
  - scorecard
  responsibility: 'Own the MEDDPICC qualification process end-to-end: assess each dimension, score completeness, identify
    gaps, recommend actions to close gaps, and produce qualification scorecards for deal review.

    '
system_prompt: 'You are a Qualification Agent, part of the Account Executive intelligence

  system. Your job is to assess deal qualification using MEDDPICC and

  produce actionable scorecards.


  MEDDPICC DIMENSIONS:

  - M (Metrics): Quantified value the customer expects. Score from CRM and discovery notes.

  - E (Economic Buyer): Person with budget authority. Verify from stakeholder data.

  - D (Decision Criteria): Technical, business, vendor criteria. Check against discovery.

  - D (Decision Process): Steps, stakeholders, timeline to approve. Map from deal data.

  - P (Paper Process): Procurement, legal, security review status. Check milestone tracking.

  - I (Identify Pain): Business pain driving urgency. Validate from communications.

  - C (Champion): Internal advocate health and engagement. Check contact frequency.

  - C (Competition): Competitors evaluated, positioning. Scan signal data.


  You MUST:

  - Score each dimension as STRONG / ADEQUATE / WEAK / UNKNOWN

  - Provide specific evidence for each score from source data

  - Calculate overall qualification confidence (0-100%)

  - Identify the top 3 gaps with recommended actions to close them

  - Produce a qualification scorecard with all dimensions and scores

  - Flag deals below 60% confidence for immediate attention


  You MUST NOT:

  - Diagnose deal health beyond qualification (Deal Diagnosis Agent''s domain)

  - Manage pipeline or forecast (Pipeline Management Agent''s domain)

  - Prepare meeting materials (Meeting Preparation Agent''s domain)

  - Auto-change CRM data (recommends updates for human review only)

  - Assess stakeholder sentiment beyond champion health (Stakeholder Agent''s domain)


  Your cadence is per-deal: triggered before stage transitions, before

  forecast commits, or on demand. You report qualification facts and gaps,

  not deal strategy.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-crm-data
  name: Read CRM Data
  description: Access opportunity data, stage, discovery notes, stakeholder contacts
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: crm_data
    type: object
  x-ea-agent:
    risk: low
- component_type: ClientTool
  id: read-communications
  name: Read Communications
  description: Access meeting notes, emails, Slack threads for qualification evidence
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: content
    type: string
  x-ea-agent:
    risk: low
- component_type: ClientTool
  id: save-qualification-data
  name: Save Qualification Data
  description: Persist qualification scorecard and gap analysis to InfoHub
  requires_confirmation: false
  inputs:
  - title: scorecard
    type: object
  - title: opportunity_name
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: low
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification on qualification dimension data
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
toolboxes:
- component_type: Toolbox
  id: qualification-data
  name: Qualification Data
  description: MEDDPICC scorecards and gap analysis available to peer agents and orchestrator
  tools:
  - id: get-qualification-scorecard
    name: Get Qualification Scorecard
    description: Returns current MEDDPICC scorecard with dimension scores and evidence for a specified opportunity
    inputs:
    - title: opportunity_name
      type: string
    outputs:
    - title: scorecard
      type: object
  - id: get-qualification-gaps
    name: Get Qualification Gaps
    description: Returns prioritized qualification gaps with recommended closing actions
    inputs:
    - title: opportunity_name
      type: string
    outputs:
    - title: gaps
      type: array
specialized_agents: []
flows:
- component_type: Flow
  id: meddpicc-qualification
  name: MEDDPICC Qualification Assessment
  description: Run a full MEDDPICC qualification assessment for a deal, scoring all eight dimensions and producing a gap scorecard.
  inputs:
  - title: opportunity_name
    type: string
  - title: crm_data
    type: object
  - title: communications
    type: string
  outputs:
  - title: qualification_scorecard
    type: object
  - title: gap_analysis
    type: object
  - title: recommended_actions
    type: array
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: ae-meddpicc-data-collection
      input: opportunity_name, crm_data, communications
      tools:
      - read-crm-data
      - read-communications
      description: Collect evidence for each MEDDPICC dimension from CRM and communications
    - step: 2
      prompt: ae-meddpicc-dimension-scoring
      input: dimension_evidence
      description: Score each dimension as STRONG/ADEQUATE/WEAK/UNKNOWN with evidence citations
    - step: 3
      prompt: ae-meddpicc-gap-analysis
      input: dimension_scores
      description: Identify top gaps, calculate overall confidence, recommend actions to close gaps
    - step: 4
      prompt: ae-meddpicc-scorecard
      input: dimension_scores, gap_analysis, opportunity_context
      description: Produce formatted qualification scorecard with scores, evidence, gaps, and next steps
    - step: 5
      action: persist
      tools:
      - save-qualification-data
      description: Save qualification scorecard and gap analysis to InfoHub
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - qualification-scoring
    - meddpicc-assessment
    - gap-analysis
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  prompt_registry:
    ae-meddpicc-data-collection:
      description: Collect and organize evidence for each MEDDPICC dimension from available data sources
      source: prompts/tasks.yaml#qualification.meddpicc_data_collection
      inputs:
      - title: opportunity_name
        type: string
      - title: crm_data
        type: object
      - title: communications
        type: string
      outputs:
      - title: dimension_evidence
        type: object
    ae-meddpicc-dimension-scoring:
      description: Score each MEDDPICC dimension as STRONG/ADEQUATE/WEAK/UNKNOWN with evidence
      source: prompts/tasks.yaml#qualification.meddpicc_dimension_scoring
      inputs:
      - title: dimension_evidence
        type: object
      outputs:
      - title: dimension_scores
        type: object
    ae-meddpicc-gap-analysis:
      description: Identify qualification gaps, calculate confidence, recommend closing actions
      source: prompts/tasks.yaml#qualification.meddpicc_gap_analysis
      inputs:
      - title: dimension_scores
        type: object
      outputs:
      - title: gap_analysis
        type: object
    ae-meddpicc-scorecard:
      description: Produce formatted MEDDPICC qualification scorecard for deal review
      source: prompts/tasks.yaml#qualification.meddpicc_scorecard
      inputs:
      - title: dimension_scores
        type: object
      - title: gap_analysis
        type: object
      - title: opportunity_context
        type: object
      outputs:
      - title: scorecard
        type: object
  boundaries:
  - Qualification assessment only, does not diagnose deal health or strategy
  - Does not manage pipeline metrics or forecast
  - Does not prepare meeting materials or stakeholder briefs
  - Does not scan communications for new signals (uses existing signal data)
  - CRM update recommendations only, does not auto-change CRM data
  permissions:
  - Read CRM opportunity data including discovery notes and stage history
  - Read communications for qualification evidence
  - Score MEDDPICC dimensions and calculate qualification confidence
  - Produce qualification scorecards for deal review
  - Recommend gap-closing actions with owners and timelines
  guardrails:
    input_validation:
    - Reject qualification assessment without opportunity name and CRM data
    - Reject scoring without evidence collected for at least 4 of 8 dimensions
    output_checks:
    - Each dimension must be scored as STRONG/ADEQUATE/WEAK/UNKNOWN with evidence
    - Overall confidence (0-100%) must reflect dimension scores, not optimism
    - Top 3 gaps must include specific actions with owners and timelines
    - Deals below 60% confidence must be flagged for immediate attention
    signal_validation:
    - Never score a dimension as STRONG without explicit supporting evidence
    - Champion assessment based on contact frequency data, not assumptions
    - Paper process status from milestone tracking, not estimated timelines
    - Mark dimension UNKNOWN when evidence is insufficient, not ADEQUATE
  knowledge:
    references:
    - name: Risk Classification
      description: Qualification confidence thresholds, dimension scoring criteria
      load_when: Scoring MEDDPICC dimensions or calculating confidence
      content:
        severity_classification:
          HIGH:
          - Deal at risk of being lost
          - Customer escalation to executive level
          - Budget eliminated or significantly cut
          - Competitor displacing vendor
          - Key champion departed
          MEDIUM:
          - Decision timeline pushed >30 days
          - Budget approval delayed
          - New stakeholders with unknown stance
          - Scope reduction discussed
          LOW:
          - Pricing questions
          - Procurement process clarifications
          - Contract terms negotiation
        escalation_triggers:
          immediate:
          - HIGH severity commercial risk
          - Customer threatens to cancel
          - Competitor mentioned as preferred choice
          within_24h:
          - Deal stuck in same stage >45 days
          - Multiple meeting cancellations
          - Unresponsive champion
        composite_risk_scoring:
          description: 'Individual risks rarely tell the full story. A single MEDIUM risk is manageable. Three MEDIUM risks
            on the same deal create a HIGH composite risk. Always assess risk as a portfolio of factors, not isolated items.

            '
          methodology:
            score_mapping:
              HIGH: 3
              MEDIUM: 2
              LOW: 1
            composite_formula: Sum of all active risk scores for a deal
            thresholds:
              critical: '>= 7 (immediate escalation required)'
              elevated: 5-6 (management review within 48 hours)
              moderate: 3-4 (monitor closely, update in next pipeline review)
              low: <= 2 (standard monitoring)
          compound_risk_patterns:
          - name: Triple Threat
            components:
            - Champion gone dark
            - Close date pushed
            - New stakeholder introduced
            composite_score: 7
            interpretation: Internal dynamics have shifted. Champion may have lost influence or been reassigned.
            action: Immediate outreach to champion for status. Activate secondary contacts. Prepare contingency.
          - name: Silent Stall
            components:
            - No stage movement >30 days
            - Contact frequency declining
            - Next steps vague
            composite_score: 6
            interpretation: Deal is stalling without explicit rejection. Often means competing priority won internally.
            action: Create a reason to re-engage. Bring new value (insight, reference, event). Ask directly about timeline.
          - name: Budget Squeeze
            components:
            - Budget review mentioned
            - Scope reduction discussed
            - Decision delayed
            composite_score: 7
            interpretation: Budget is under pressure. Deal may survive but at reduced scope or pushed timeline.
            action: Prepare phased approach. Quantify cost of delay. Engage economic buyer on minimum viable scope.
          - name: Competitive Ambush
            components:
            - Competitor mentioned
            - New evaluation criteria introduced
            - Champion less responsive
            composite_score: 8
            interpretation: Active competitive evaluation underway. Champion may be losing the internal argument.
            action: Activate competitive displacement playbook. Arm champion with differentiation. Request executive meeting.
        risk_trending:
          description: 'A static risk is less dangerous than a worsening trend. Track risk direction over time, not just current
            state.

            '
          trend_classification:
            improving:
              definition: Composite risk score decreased by 2+ points in last 14 days
              indicators:
              - Risk factors resolved
              - Champion re-engaged
              - New positive signals
              action: Maintain current approach. Document what worked for future reference.
            stable:
              definition: Composite risk score unchanged for 14+ days
              indicators:
              - Same risks persist
              - No new factors
              - Engagement pattern steady
              action: Proactive intervention needed. Stability in risk is not the same as safety.
            worsening:
              definition: Composite risk score increased by 2+ points in last 14 days
              indicators:
              - New risk factors appearing
              - Existing risks escalating
              - Engagement declining
              action: Immediate review. If worsening for 2 consecutive periods, escalate to management.
          measurement:
            cadence: Assess risk trend at every pipeline review (minimum weekly)
            lookback: Compare current composite score to 14-day and 30-day prior
            visualization: Track as directional arrow (up/down/stable) alongside health score
        de_escalation:
          description: 'Risks should be downgraded when evidence supports improvement, not when time passes without new bad
            news. Absence of signal is not the same as resolution.

            '
          criteria:
            high_to_medium:
            - Customer re-engages with specific next steps and dates
            - Champion confirms budget is secured and timeline is intact
            - Competitive evaluation concluded in our favor (confirmed by customer)
            - New executive sponsor actively engaged in deal
            medium_to_low:
            - Root cause of risk is documented as resolved
            - Customer-confirmed milestone achieved
            - Engagement pattern returned to pre-risk baseline for 14+ days
            remove_risk:
            - Risk factor no longer applies (e.g., departing blocker left the organization)
            - Deal advanced past the stage where the risk was relevant
            - Customer explicitly addressed the concern in writing
          anti_patterns:
          - Never de-escalate because 'it's been a while since we heard bad news'
          - Never de-escalate based on seller optimism without customer evidence
          - Never de-escalate because a meeting went well without concrete outcomes
        mitigation_framework:
          description: 'Every risk must have a specific mitigation action. Generic "monitor closely" is not mitigation. Mitigation
            must change the trajectory.

            '
          mitigation_types:
            resolve:
              definition: Eliminate the risk factor entirely
              example: Budget risk resolved by economic buyer confirming allocation in writing
              when_to_use: When the root cause can be directly addressed
            transfer:
              definition: Shift responsibility for risk resolution to someone with more leverage
              example: Champion cannot access economic buyer, engage executive sponsor to facilitate
              when_to_use: When the AE lacks the access or authority to resolve directly
            mitigate:
              definition: Reduce the probability or impact of the risk
              example: Competitive threat mitigated by delivering a differentiated POC result
              when_to_use: When risk cannot be eliminated but can be contained
            accept:
              definition: Acknowledge the risk and proceed with awareness
              example: Procurement timeline is 6 weeks with no way to accelerate
              when_to_use: When risk is real but outside anyone's control. Document and plan accordingly.
          quality_rules:
          - Every mitigation must name a specific person who will take a specific action by a specific date
          - Mitigation that requires customer action must be confirmed with customer, not assumed
          - If mitigation is 'wait and see,' it is not mitigation. Reclassify as 'accept.'
          - Review mitigation effectiveness at next pipeline review. If risk persists, escalate approach.
    - path: references/meddpicc-framework.yaml
      description: MEDDPICC dimension definitions, scoring rubric (STRONG/ADEQUATE/WEAK/UNKNOWN), evidence requirements per
        dimension
      load_when: Running qualification assessment or producing scorecards
  autonomy:
    triggers:
    - type: parent_dispatch
      source: ae-agent
      description: AE orchestrator routes qualification and MEDDPICC requests
    - type: event
      source: crm_webhook
      condition: opportunity.stage_transition OR forecast_commit_pending
      description: Auto-qualifies before stage transitions and forecast commits
    - type: downstream
      source: ae-deal-diagnosis-agent
      condition: deal_health.score < 40
      description: Critical deal health triggers full re-qualification
    - type: downstream
      source: ae-signal-detection-agent
      condition: new_pain_point_detected == true OR budget_signal.type == constraint
      description: New pain points or budget constraints update qualification evidence
    outputs:
    - type: parent_return
      target: ae-agent
      payload:
      - qualification_scorecard
      - gap_analysis
      - recommended_actions
      description: Qualification results back to orchestrator
    - type: trigger_agent
      target: ae-stakeholder-agent
      condition: champion_dimension.score IN [WEAK, UNKNOWN]
      payload:
      - gap_analysis
      - champion_evidence
      description: Champion gap triggers stakeholder deep-dive and mapping
    - type: trigger_agent
      target: ae-meeting-prep-agent
      condition: unknown_dimensions >= 3
      payload:
      - gap_analysis
      - discovery_targets
      description: Multiple unknown dimensions trigger discovery meeting preparation
    - type: notify_human
      condition: overall_confidence < 60
      channel: alert
      description: Deals below 60% confidence flagged for immediate AE attention
    dependencies:
    - agent: ae-signal-detection-agent
      toolbox: signal-intelligence
      tools:
      - get-commercial-signals
      purpose: Latest signals as evidence for qualification dimension scoring
    - agent: ae-deal-diagnosis-agent
      toolbox: deal-intelligence
      tools:
      - get-deal-health
      purpose: Deal health context for qualification assessment
