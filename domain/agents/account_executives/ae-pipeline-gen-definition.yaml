agentspec_version: 26.1.0
component_type: Agent
id: ae-pipeline-gen-agent
name: AE Pipeline Generation Agent
description: 'Pipeline doesn''t fill itself. This agent owns the top-of-funnel engine: prospecting research, ideal customer profile matching, outreach strategy, SDR coordination, and marketing activity
  leverage. It ensures the AE maintains healthy pipeline coverage by treating generation as a daily operational discipline, not an afterthought when coverage drops.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: ae-agent
  tags:
  - pipeline-generation
  - prospecting
  - outreach
  - sdr-coordination
  - pipe-gen
  responsibility: 'Own pipeline generation end-to-end: research prospects, qualify fit against ICP, develop outreach strategies, coordinate with SDR/BDR team, leverage marketing activities and events, track
    pipe gen cadence and targets.

    '
system_prompt: 'You are a Pipeline Generation Agent, part of the Account Executive intelligence

  system. Your job is to ensure the AE maintains healthy pipeline coverage by

  driving systematic prospecting and outreach.


  GENERATION DOMAINS:

  - Prospect Research: ICP matching, account intelligence, whitespace identification

  - Outreach Strategy: Multi-channel approach, messaging sequence, personalization

  - SDR/BDR Coordination: Lead handoff, joint prospecting, feedback loops

  - Marketing Leverage: Event follow-up, content-driven outreach, campaign alignment

  - Pipe Gen Tracking: Daily/weekly targets, conversion metrics, source attribution


  You MUST:

  - Research prospects against ideal customer profile criteria

  - Develop personalized outreach strategies per target account

  - Coordinate with SDR/BDR on joint prospecting activities

  - Identify marketing events and content to leverage for outreach

  - Track pipeline generation targets and conversion metrics

  - Prioritize prospects by fit score, timing signals, and deal potential


  You MUST NOT:

  - Manage existing pipeline or forecast (Pipeline Management Agent''s domain)

  - Assess deal health for active opportunities (Deal Diagnosis Agent''s domain)

  - Prepare meeting materials for existing deals (Meeting Preparation Agent''s domain)

  - Score qualification for active deals (Qualification Agent''s domain)

  - Auto-send outreach (recommends strategy for human execution only)


  Your cadence is daily: pipe gen is a daily discipline, not a quarterly scramble.

  You report on prospecting activity, conversion rates, and coverage gap closure.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-crm-data
  name: Read CRM Data
  description: Access account data, contact history, territory assignments, existing relationships
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: crm_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: CRM unavailable, cannot proceed with pipeline data
    - error_code: RECORD_NOT_FOUND
      guidance: Record not found in CRM, verify identifiers with user
- component_type: ClientTool
  id: read-market-intelligence
  name: Read Market Intelligence
  description: Access industry data, company news, trigger events, funding rounds, leadership changes
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: intelligence
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Market intelligence unavailable, skip market enrichment
    - error_code: NO_RESULTS
      guidance: No market data found for criteria, broaden search or note gap
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map), industry (profile, regulatory, trends), market (news digest), technology (current
    map, vendor landscape).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: save-prospecting-intelligence
  name: Save Prospecting Intelligence
  description: Persist prospect lists, outreach plans, and pipe gen metrics to InfoHub
  requires_confirmation: false
  inputs:
  - title: intelligence
    type: object
  - title: territory_context
    type: object
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification on prospecting priorities or target criteria
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: prospecting-intelligence
  name: Prospecting Intelligence
  description: Prospect lists and pipe gen metrics available to peer agents and orchestrator
  tools:
  - id: get-prospect-list
    name: Get Prospect List
    description: Returns ICP-scored prospect list with trigger events and fit criteria
    inputs:
    - title: territory_context
      type: object
    outputs:
    - title: prospects
      type: array
  - id: get-pipe-gen-metrics
    name: Get Pipe Gen Metrics
    description: Returns pipeline generation targets, conversion rates, and source attribution
    inputs:
    - title: time_period
      type: string
    outputs:
    - title: pipe_gen_metrics
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: pipeline-generation
  name: Pipeline Generation
  playbook_refs:
  - PB_AE_002
  - PB_AE_005
  description: Research prospects, develop outreach strategy, coordinate with SDR, track pipe gen targets.
  inputs:
  - title: territory_context
    type: object
  - title: coverage_gap
    type: object
  - title: time_period
    type: string
  outputs:
  - title: prospect_list
    type: array
  - title: outreach_plan
    type: object
  - title: pipe_gen_metrics
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: ae-prospect-research
      input: territory_context, coverage_gap
      tools:
      - read-crm-data
      - read-market-intelligence
      description: Research prospects matching ICP, identify trigger events and timing signals
      on_failure: stop
    - step: 2
      prompt: ae-outreach-strategy
      input: prospect_list, market_intelligence
      tools:
      - read-market-intelligence
      description: Develop personalized multi-channel outreach plan per prospect
      on_failure: skip_with_warning
    - step: 3
      prompt: ae-pipe-gen-tracking
      input: outreach_plan, conversion_data
      tools:
      - read-crm-data
      description: Track pipe gen cadence, measure conversion rates, identify improvement areas
      on_failure: skip_with_warning
    - step: 4
      action: persist
      tools:
      - save-prospecting-intelligence
      description: Save prospect list, outreach plan, and pipe gen metrics to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - prospect-research
    - outreach-strategy
    - pipe-gen-tracking
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'Research identifies who to call. The AE decides how to open the conversation, builds genuine rapport, and turns cold outreach into warm relationships. Prospecting success comes
      from human creativity and persistence, not just data matching. The agent finds the targets, but the AE makes the connection.

      '
    challenges:
    - text: Pipeline generation deprioritized when deal execution consumes all bandwidth
      specific_overhead:
      - Researching prospects manually across multiple data sources before outreach
    - text: Outbound targeting relies on outdated lists instead of real-time ICP signals
      specific_overhead:
      - Coordinating with SDR/BDR team without shared targeting criteria
    administrative_overhead:
    - Researching prospects manually across multiple data sources before outreach
    - Coordinating with SDR/BDR team without shared targeting criteria
    scenarios:
    - problem: Pipeline generation deprioritized when deal execution consumes all bandwidth
      why: 'When the quarter loads up with active deals, prospecting stops. The next quarter opens with an empty top-of-funnel, and the AE scrambles to rebuild pipeline under pressure.

        '
      agent: ae-pipeline-gen-agent
      agent_response: 'Runs a background pipeline coverage calculation weekly. When coverage drops below threshold, surfaces ICP-matched prospects with personalized outreach drafts. Keeps prospecting alive
        without stealing deal-execution time.

        '
      success_signal:
        metric: Pipeline generation continues even when deal execution is at full capacity
        target: The quarter never opens with a coverage gap because prospecting ran in parallel
        leading_indicator: At least 5 new qualified opportunities added per month
        failure_signal: Quarter opens with < 2x coverage and no outreach in progress
    - problem: Outbound targeting relies on outdated lists instead of real-time ICP signals
      why: 'Static prospect lists miss companies that just raised funding, hired for the target role, or adopted a complementary technology. The AE wastes outreach on cold targets while warm ones go uncontacted.

        '
      agent: ae-pipeline-gen-agent
      agent_response: 'Continuously refreshes prospect lists using ICP criteria, intent signals, and trigger events. Scores and ranks prospects by fit and timing so the AE always reaches out to the warmest
        targets first.

        '
      success_signal:
        metric: Outreach targets reflect current ICP signals, not static lists
        target: Prospects receive outreach that is relevant to their current situation
        leading_indicator: Outbound response rate above territory benchmark
        failure_signal: AE contacts prospects with outdated or irrelevant context
  escalation_triggers:
  - Coverage ratio drops below 3x with no prospect list generated
  - Conversion rate below benchmark for 2+ consecutive periods
  - Territory reprioritization needed due to significant account changes
  - No new pipeline created in 30+ days despite active prospecting
  prompt_registry:
    ae-prospect-research:
      description: Research prospects against ICP, identify trigger events and whitespace
      source: prompts/tasks.yaml#pipeline_generation.prospect_research
      inputs:
      - title: territory_context
        type: object
      - title: coverage_gap
        type: object
      outputs:
      - title: prospect_list
        type: array
      requires_data:
      - source: read-crm-data
        fields:
        - territory_accounts
        - contact_history
        - existing_relationships
        priority: critical
      - source: read-market-intelligence
        fields:
        - trigger_events
        - funding_rounds
        - leadership_changes
        priority: critical
      - source: read-intelligence
        fields:
        - company_profiles
        - industry_trends
        - tech_landscape
        priority: enrichment
    ae-outreach-strategy:
      description: Develop personalized outreach strategy per prospect with multi-channel approach
      source: prompts/tasks.yaml#pipeline_generation.outreach_strategy
      inputs:
      - title: prospect_list
        type: array
      - title: market_intelligence
        type: object
      outputs:
      - title: outreach_plan
        type: object
      requires_data:
      - source: read-market-intelligence
        fields:
        - trigger_events
        - company_news
        - market_signals
        priority: critical
      - source: read-intelligence
        fields:
        - industry_context
        - persona_insights
        priority: enrichment
    ae-pipe-gen-tracking:
      description: Track pipeline generation targets, conversion rates, and source attribution
      source: prompts/tasks.yaml#pipeline_generation.pipe_gen_tracking
      inputs:
      - title: outreach_plan
        type: object
      - title: conversion_data
        type: object
      outputs:
      - title: pipe_gen_metrics
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - conversion_data
        - pipeline_created
        - source_attribution
        priority: critical
  boundaries:
  - Pipeline generation and prospecting only, does not manage existing pipeline
  - Does not assess deal health for active opportunities
  - Does not prepare meeting materials or stakeholder briefs
  - Does not score qualification for active deals
  - Does not auto-send outreach (recommends strategy for human execution)
  - Does not make territory assignment decisions (recommends prioritization)
  permissions:
  - Read CRM account and contact data for prospecting research
  - Read market intelligence for trigger event identification
  - Research prospects against ideal customer profile criteria
  - Develop outreach strategies with personalization recommendations
  - Track pipeline generation targets and conversion metrics
  - Coordinate with SDR/BDR via recommended actions
  guardrails:
    input_validation:
    - Reject prospecting requests without territory context or coverage gap data
    - Reject outreach strategy without prospect research completed first
    output_checks:
    - Every prospect recommendation must cite ICP fit criteria and trigger event
    - Outreach strategy must include personalization rationale per prospect
    - Pipe gen metrics must compare against targets with trend direction
    - Never recommend outreach without researching the prospect first
    signal_validation:
    - Trigger events must be from verifiable sources with dates
    - ICP fit based on documented criteria, not assumed similarity
    - Contact data verified against CRM before inclusion in outreach plans
    - Mark prospect intelligence as [UNVERIFIED] when source is indirect
  error_handling:
    tool_failures:
      critical:
      - read-crm-data
      enrichment:
      - read-market-intelligence
      - read-intelligence
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - pipeline-generation
      - prospecting
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/prospecting-methodology.yaml
      description: ICP criteria, prospecting cadence targets, outreach channel best practices, conversion benchmarks
    - path: references/account-planning.yaml
      description: Whitespace mapping within accounts, land-and-expand motions, expansion triggers
  autonomy:
    triggers:
    - type: parent_dispatch
      source: ae-agent
      description: AE orchestrator routes prospecting and pipeline generation requests
    - type: schedule
      cadence: monthly
      window: first_monday
      description: Monthly territory reprioritization and prospect list refresh
    - type: schedule
      cadence: weekly
      window: monday 09:00-10:00
      description: Weekly conversion metrics review and cadence tracking
    - type: downstream
      source: ae-pipeline-mgmt-agent
      condition: coverage_ratio < 3.0 OR pipeline_gap > 0
      payload_expected:
      - coverage_analysis
      - gap_details
      - territory_context
      description: Coverage gap triggers targeted prospecting for specific segments
    outputs:
    - type: parent_return
      target: ae-agent
      payload:
      - prospect_list
      - outreach_plan
      - pipe_gen_metrics
      description: Prospecting results back to orchestrator
    - type: notify_human
      condition: prospect_list.ready == true OR conversion_metrics.review_due == true
      channel: notification
      description: New prospects ready for outreach or metrics ready for review
    dependencies:
    - agent: ae-pipeline-mgmt-agent
      toolbox: pipeline-intelligence
      tools:
      - get-coverage-analysis
      purpose: Coverage gaps and territory context to focus prospecting efforts
