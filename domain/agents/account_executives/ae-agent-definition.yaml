# AE Agent — Orchestrator
# Aligned with Oracle Agent Spec 26.1.0
#
# This agent is a routing orchestrator. It does not execute tasks directly.
# All domain work is delegated to specialized sub-agents, each owning its
# own tools, flows, boundaries, and prompt registry.
#
# Sub-agents:
#   ae-deal-diagnosis-agent      — Deal health, stall analysis, loss review
#   ae-pipeline-mgmt-agent       — Forecast accuracy, coverage, prioritization
#   ae-stakeholder-agent         — Relationship mapping, champion health, exec briefs
#   ae-signal-detection-agent    — Budget signals, competitive threats, expansion
#   ae-qualification-agent       — MEDDPICC assessment, gap analysis, scorecards
#   ae-meeting-prep-agent        — Call briefs, QBR materials, post-call summaries
#   ae-opportunity-hygiene-agent — Weekly checks, stale alerts, CRM checklists
#   ae-pipeline-gen-agent        — Prospecting, outreach strategy, SDR coordination

# ============================================================
# AGENT SPEC STANDARD ZONE
# ============================================================

agentspec_version: "26.1.0"
component_type: Agent

id: ae-agent
name: Account Executive Agent
description: >
  Routing orchestrator for the Account Executive role.
  Routes commercial intelligence requests to the correct sub-agent based on task type.
  Aggregates cross-domain insights when a request spans multiple agents.
  Escalates to human when deal conditions or risk thresholds require judgment.
  Does not execute domain tasks directly. All analysis, scoring, and preparation
  is delegated to 8 specialized sub-agents.

metadata:
  definition_version: "0.2.0"
  parent_agent: null
  disclaimer: >
    This agent specification is a reference design for educational and
    demonstration purposes. It is not a production system. All examples,
    case studies, and scenarios are fictional.
  tags:
    - account-executive
    - commercial
    - pipeline
    - forecast
    - deal-health
    - sales
    - orchestrator
  responsibility: >
    Route commercial intelligence requests to the correct sub-agent, aggregate
    cross-domain insights when needed, and escalate to human when conditions
    are met.

system_prompt: |
  You are an Account Executive Orchestrator. You do not execute domain tasks
  directly. You route each request to the appropriate sub-agent.

  ROUTING RULES:
  - Deal health, stall analysis, loss review, resurrection → Deal Diagnosis Agent
  - Forecast accuracy, pipeline coverage, next-best-action → Pipeline Management Agent
  - Relationship mapping, champion health, executive briefs → Stakeholder Intelligence Agent
  - Budget signals, competitive threats, expansion opportunities → Signal Detection Agent
  - MEDDPICC qualification, deal readiness scoring, gap analysis → Qualification Agent
  - Call prep, QBR materials, post-call summaries → Meeting Preparation Agent
  - Weekly hygiene checks, paper process tracking, stale alerts, CRM checklists → Opportunity Hygiene Agent
  - Prospecting, outreach strategy, SDR coordination, pipe gen targets → Pipeline Generation Agent
  - Close plan creation, mutual action plan tracking → Deal Diagnosis Agent (close-plan-management flow)
  - Discovery call preparation, structured questions → Meeting Preparation Agent (discovery-preparation flow)
  - Territory planning, account tiering, whitespace analysis → Pipeline Management Agent (territory-planning flow)

  CROSS-DOMAIN REQUESTS:
  When a request spans multiple domains (e.g., "prepare for QBR and check deal health"),
  route to each relevant sub-agent and aggregate the results.

  ESCALATION:
  - Forecast variance exceeds 15% → Sales Lead
  - HIGH severity commercial risk → Sales Lead
  - Customer threatens cancellation → Sales Lead and Senior Manager
  - Champion gone dark 21+ days → Sales Lead
  - Competitive threat at deal level → CI Agent for deeper analysis

  You MUST NOT:
  - Execute domain tasks yourself (always delegate)
  - Make pricing decisions or negotiate terms
  - Assess technical risks (SA Agent's domain)
  - Track delivery status (Delivery Agent's domain)
  - Make product roadmap commitments (PM Agent's domain)

human_in_the_loop: true

llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.6
    max_tokens: 4096

inputs:
  - title: account_context
    type: object
    description: Account name, CRM data, communication history
  - title: pipeline_context
    type: object
    description: Current pipeline, opportunities, stages, close dates
    default: null
  - title: signal_source
    type: string
    description: Source content (meeting notes, Slack thread, email, CRM update)
  - title: task_type
    type: string
    description: Which commercial analysis task to perform (used for routing)
  - title: output_format
    type: string
    description: Response format
    default: markdown

outputs:
  - title: assessment
    type: object
    description: Commercial assessment (deal health, pipeline status, stakeholder map)
  - title: risk_alerts
    type: array
    description: Identified risks with severity (HIGH/MEDIUM/LOW), evidence, and mitigation
  - title: action_items
    type: array
    description: Actions with owner, due date, and expected outcome

tools:
  - component_type: ClientTool
    id: ask-user
    name: Ask User
    description: Request clarification or confirmation from account executive
    requires_confirmation: false
    inputs:
      - title: question
        type: string
    outputs:
      - title: answer
        type: string
    x-ea-agent:
      risk: low
      resolver: inline

  - component_type: ClientTool
    id: invoke-deal-diagnosis
    name: Invoke Deal Diagnosis Agent
    description: Route to Deal Diagnosis Agent for deal health scoring, stall analysis, loss review, or resurrection candidates
    requires_confirmation: false
    inputs:
      - title: task
        type: string
      - title: account_context
        type: object
      - title: opportunity_name
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: agent-registry
      target_agent: ae-deal-diagnosis-agent

  - component_type: ClientTool
    id: invoke-pipeline-mgmt
    name: Invoke Pipeline Management Agent
    description: Route to Pipeline Management Agent for forecast accuracy, pipeline coverage, or next-best-action prioritization
    requires_confirmation: false
    inputs:
      - title: task
        type: string
      - title: pipeline_deals
        type: array
      - title: quarter
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: agent-registry
      target_agent: ae-pipeline-mgmt-agent

  - component_type: ClientTool
    id: invoke-stakeholder-intelligence
    name: Invoke Stakeholder Intelligence Agent
    description: Route to Stakeholder Intelligence Agent for relationship mapping, champion health, or executive briefings
    requires_confirmation: false
    inputs:
      - title: task
        type: string
      - title: account_context
        type: object
      - title: stakeholder_name
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: agent-registry
      target_agent: ae-stakeholder-agent

  - component_type: ClientTool
    id: invoke-signal-detection
    name: Invoke Signal Detection Agent
    description: Route to Signal Detection Agent for budget signals, competitive threats, or expansion opportunities
    requires_confirmation: false
    inputs:
      - title: task
        type: string
      - title: account_context
        type: object
      - title: time_period
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: agent-registry
      target_agent: ae-signal-detection-agent

  - component_type: ClientTool
    id: invoke-qualification
    name: Invoke Qualification Agent
    description: Route to Qualification Agent for MEDDPICC assessment, gap analysis, or qualification scorecards
    requires_confirmation: false
    inputs:
      - title: task
        type: string
      - title: opportunity_name
        type: string
      - title: crm_data
        type: object
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: agent-registry
      target_agent: ae-qualification-agent

  - component_type: ClientTool
    id: invoke-meeting-prep
    name: Invoke Meeting Preparation Agent
    description: Route to Meeting Preparation Agent for call briefs, QBR materials, or post-call summaries
    requires_confirmation: false
    inputs:
      - title: task
        type: string
      - title: account_context
        type: object
      - title: meeting_date
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: agent-registry
      target_agent: ae-meeting-prep-agent

  - component_type: ClientTool
    id: invoke-opportunity-hygiene
    name: Invoke Opportunity Hygiene Agent
    description: Route to Opportunity Hygiene Agent for weekly checks, stale alerts, paper process tracking, or CRM checklists
    requires_confirmation: false
    inputs:
      - title: task
        type: string
      - title: pipeline_summary
        type: object
      - title: review_date
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: agent-registry
      target_agent: ae-opportunity-hygiene-agent

  - component_type: ClientTool
    id: invoke-pipeline-gen
    name: Invoke Pipeline Generation Agent
    description: Route to Pipeline Generation Agent for prospecting research, outreach strategy, SDR coordination, or pipe gen tracking
    requires_confirmation: false
    inputs:
      - title: task
        type: string
      - title: territory_context
        type: object
      - title: coverage_gap
        type: object
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: agent-registry
      target_agent: ae-pipeline-gen-agent

# Orchestrator exposes no toolbox: all service queries route through sub-agent toolboxes
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: ae-agent-proactive
  name: Account Executive Agent (Proactive)
  description: 'Proactive mode: monitors signals across sub-agents and surfaces risks and opportunities before being asked'
  agent:
    $component_ref: ae-agent
  agent_specialization_parameters:
    additional_instructions: |
      Focus on early warning and opportunity surfacing. Continuously poll
      sub-agents for signals that need attention: stale deals from Hygiene,
      champion-gone-dark from Stakeholder Intelligence, forecast risks from
      Pipeline Management, competitive threats from Signal Detection.
      Prioritize timeliness over depth. Push alerts to the AE rather than
      waiting for requests. Keep outputs concise with clear severity and
      recommended next action.
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: ae-agent-analytical
  name: Account Executive Agent (Analytical)
  description: 'Analytical mode: deep cross-domain synthesis for deal strategy and portfolio review'
  agent:
    $component_ref: ae-agent
  agent_specialization_parameters:
    additional_instructions: |
      Focus on cross-domain synthesis and pattern recognition. When a request
      arrives, query multiple sub-agents and weave their outputs into a
      unified analysis. Connect deal health with qualification gaps, link
      stakeholder signals with pipeline risks, map competitive threats
      against champion strength. Prioritize depth and defensibility over
      speed. Include confidence levels, caveats, and evidence trails.
      Suitable for deal reviews, forecast commits, and QBR preparation.
    human_in_the_loop: true
# Orchestrator has no flows: all domain workflows are owned by sub-agents
flows: []

# --- A2A Discovery ---

a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: "0.1"
    capabilities:
      - qualification
      - deal-diagnosis
      - pipeline-management
      - pipeline-generation
      - stakeholder-intelligence
      - commercial-signal-detection
      - meeting-preparation
      - opportunity-hygiene
    input_modes:
      - text/plain
      - application/json
    output_modes:
      - application/yaml
      - application/json
      - text/markdown
      - text/plain

# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:

  # Orchestrator owns no prompts directly; all prompts are registered in sub-agent definitions
  prompt_registry: {}

  profile:
    why: >
      Enterprise AEs spend more time on admin work than selling.
      Between CRM updates, meeting prep, forecast compilation, and
      stakeholder tracking, the actual selling window shrinks to a
      fraction of the day. This agent gives the AE a digital
      workforce that handles the data-heavy, repetitive tasks so
      they can focus on relationships and closing deals.

    goals:
      - "Hit quota consistently by never missing a deal signal"
      - "Cut administrative overhead from 60% of time to under 20%"
      - "Maintain 3-5x pipeline coverage without manual territory planning"
      - "Keep CRM and forecast data current without field-by-field updates"
      - "Walk into every meeting fully prepared with zero prep time"

    role_context: >
      The enterprise Account Executive owns the full sales cycle:
      prospecting, qualification, discovery, solution presentation,
      negotiation, and close.

      They manage 10-30 active opportunities simultaneously, each
      involving multiple stakeholders across IT, finance, legal, and
      executive leadership.

      Enterprise deals run 60-90 days with complex approval chains
      including security reviews, procurement processes, and budget
      committee sign-offs.

      The AE must balance 60% of time advancing qualified deals with
      40% on prospecting to keep the pipeline replenished.

    key_metrics:
      - "Quota attainment: revenue closed vs. annual target (enterprise median ~$800K ACV)"
      - "Pipeline coverage: total pipeline / quota target (healthy = 3-5x)"
      - "Win rate: deals closed-won / total deals, tracked by stage and segment"
      - "Sales velocity: (opportunities x deal value x win rate) / cycle length"
      - "Average cycle length: days from qualification to close (enterprise = 60-90 days)"

    qualification_framework:
      name: MEDDPICC
      owner: ae-qualification-agent
      note: >
        The Qualification Agent owns the end-to-end MEDDPICC assessment.
        Each dimension's data is fed by the sub-agent listed in supported_by.
      dimensions:
        - letter: M
          name: Metrics
          description: Quantified value the customer expects from the solution
          supported_by: ae-pipeline-mgmt-agent
        - letter: E
          name: Economic Buyer
          description: Person with discretionary budget authority and final sign-off
          supported_by: ae-stakeholder-agent
        - letter: D
          name: Decision Criteria
          description: Technical, business, and vendor criteria the customer evaluates against
          supported_by: ae-deal-diagnosis-agent
        - letter: D
          name: Decision Process
          description: Steps, stakeholders, and timeline the customer follows to approve a purchase
          supported_by: ae-deal-diagnosis-agent
        - letter: P
          name: Paper Process
          description: Procurement, legal review, security review, and contract execution
          supported_by: ae-opportunity-hygiene-agent
        - letter: I
          name: Identify Pain
          description: Business pain driving purchase urgency and budget allocation
          supported_by: ae-signal-detection-agent
        - letter: C
          name: Champion
          description: Internal advocate who sells on your behalf when you are not in the room
          supported_by: ae-stakeholder-agent
        - letter: C
          name: Competition
          description: Competitors being evaluated, their positioning, and your differentiation
          supported_by: ae-signal-detection-agent

    stakeholder_landscape:
      customer_side:
        - role: "Economic Buyer (CFO, VP): budget authority and final sign-off"
          connected_via: ae-stakeholder-agent
        - role: "Technical Evaluator (CTO, IT Director): requirements, architecture fit, security review"
          connected_via: ae-stakeholder-agent
        - role: "Champion: internal advocate who drives consensus on your behalf"
          connected_via: ae-stakeholder-agent
        - role: "Procurement: contract terms, vendor compliance, paper process"
          connected_via: ae-opportunity-hygiene-agent
        - role: "Legal/Security: compliance review, data handling, infosec requirements"
          connected_via: ae-opportunity-hygiene-agent
        - role: "End Users: adoption signals, feedback, value realization"
          connected_via: ae-signal-detection-agent
      internal_team:
        - role: "Solution Architect: technical design, demo support, RFP response"
          connected_via: ae-deal-diagnosis-agent
        - role: "Value Engineer: business case construction, ROI quantification"
          connected_via: ae-deal-diagnosis-agent
        - role: "Delivery/PS: implementation scope, timeline, resource planning"
          connected_via: ae-deal-diagnosis-agent
        - role: "Partner Manager: co-sell coordination, partner leverage"
          connected_via: ae-pipeline-gen-agent
        - role: "Sales Leadership: forecast review, deal strategy, escalation"
          connected_via: ae-pipeline-mgmt-agent

    challenges:
      - text: "Managing 10-30 deals at different stages with different stakeholders simultaneously"
        solved_by: ae-pipeline-mgmt-agent
      - text: "Stakeholder sentiment shifts between meetings without warning"
        solved_by: ae-signal-detection-agent
      - text: "Competitive moves surface too late to adjust positioning"
        solved_by: ae-signal-detection-agent
      - text: "Forecast accuracy suffers when based on gut-feel instead of engagement data"
        solved_by: ae-pipeline-mgmt-agent
      - text: "Multi-threading across 5-8 stakeholders per deal with different priorities"
        solved_by: ae-stakeholder-agent
      - text: "Champion turnover mid-cycle leaves deals without an internal advocate"
        solved_by: ae-stakeholder-agent
      - text: "Extended approval chains (security, legal, procurement) stall deals unpredictably"
        solved_by: ae-opportunity-hygiene-agent
      - text: "CRM data goes stale within days of the last update"
        solved_by: ae-opportunity-hygiene-agent
      - text: "Pipeline generation deprioritized when deal execution consumes all bandwidth"
        solved_by: ae-pipeline-gen-agent
      - text: "Outbound targeting relies on outdated lists instead of real-time ICP signals"
        solved_by: ae-pipeline-gen-agent
      - text: "Discovery stays surface-level without structured question frameworks"
        solved_by: ae-meeting-prep-agent
      - text: "Close plans exist in the AE's head, not shared with the customer"
        solved_by: ae-deal-diagnosis-agent
      - text: "Objection handling is improvised rather than systematic"
        solved_by: ae-meeting-prep-agent
      - text: "Value articulation defaults to product features instead of business outcomes"
        solved_by: ae-deal-diagnosis-agent

    administrative_overhead:
      - text: "Manually updating CRM fields after every call, email, and meeting"
        automated_by: ae-opportunity-hygiene-agent
      - text: "Tracking procurement, legal, and security review status across multiple deals"
        automated_by: ae-opportunity-hygiene-agent
      - text: "Writing meeting briefs by pulling context from 4-5 different systems"
        automated_by: ae-meeting-prep-agent
      - text: "Capturing action items and follow-ups from meeting notes manually"
        automated_by: ae-meeting-prep-agent
      - text: "Compiling weekly forecast updates from scattered notes and gut feel"
        automated_by: ae-pipeline-mgmt-agent
      - text: "Building territory plans in spreadsheets with no automated prioritization"
        automated_by: ae-pipeline-mgmt-agent
      - text: "Cross-referencing stakeholder roles against org charts before each interaction"
        automated_by: ae-stakeholder-agent
      - text: "Maintaining relationship maps across buying committees of 5-10 people"
        automated_by: ae-stakeholder-agent
      - text: "Researching prospects manually across multiple data sources before outreach"
        automated_by: ae-pipeline-gen-agent
      - text: "Coordinating with SDR/BDR team without shared targeting criteria"
        automated_by: ae-pipeline-gen-agent

    capabilities:
      - "Deal health diagnosis"
      - "Pipeline forecasting"
      - "Stakeholder intelligence"
      - "Commercial signal detection"
      - "MEDDPICC qualification"
      - "Meeting preparation"
      - "CRM hygiene automation"
      - "Pipeline generation"

    with_this_agent:
      - "Know which deals are healthy and which need intervention right now"
      - "Forecast with evidence, not gut feel, and see coverage gaps before quarter end"
      - "Track who holds influence, whether champions are engaged, and where relationships are cooling"
      - "Catch budget shifts, competitive mentions, and expansion signals before they become surprises"
      - "Walk into every meeting prepared and walk out with captured actions"
      - "Keep CRM data current without manual field-by-field updates"
      - "Score deal qualification against MEDDPICC with evidence, not assumptions"
      - "Generate pipeline systematically with ICP-matched prospects and personalized outreach"
      - "Build and track mutual action plans shared with the customer, not just internal CRM"
      - "Run structured discovery with persona-tailored questions that map to qualification dimensions"
      - "Test whether contacts are true champions or just friendly, using evidence-based criteria"
      - "Articulate value through cost-of-inaction and business outcomes, not product features"
      - "Handle objections with a systematic process: acknowledge, clarify, respond with evidence, confirm"
      - "Plan territory with account tiering and three-horizon pipeline mapping"

    public_resources:
      - title: "B2B Sales Methodologies Overview"
        url: "https://salesmotion.io/blog/b-2-b-sales-methodologies"
        context: "Comparison of major B2B frameworks: when to use which"
      - title: "MEDDPICC Qualification"
        url: "https://meddicc.com/meddpicc-sales-methodology-and-process"
        context: "8-dimension deal qualification with evidence scoring"
      - title: "SPIN Selling (Rackham)"
        url: "https://www.lucidchart.com/blog/the-4-steps-to-spin-selling"
        context: "Situation, Problem, Implication, Need-payoff questioning"
      - title: "Challenger Sale (Dixon & Adamson)"
        url: "https://www.salesforce.com/blog/challenger-sales-methodology/"
        context: "Teach, tailor, take control of the conversation"
      - title: "Miller Heiman Strategic Selling"
        url: "https://www.lucidchart.com/blog/miller-heiman-sales-process"
        context: "Buying roles: Economic, User, Technical, Coach"
      - title: "Sandler Selling System"
        url: "https://sandler.com/sandler-sales-methodology/"
        context: "Pain funnel, upfront contracts, reversing objections"
      - title: "Solution Selling"
        url: "https://salesmotion.io/blog/b-2-b-sales-methodologies"
        context: "Diagnose pain first, tailor the solution, not the product"
      - title: "Value Selling"
        url: "https://salesmotion.io/blog/b-2-b-sales-methodologies"
        context: "Center on tangible ROI and business outcomes"
      - title: "Account-Based Selling"
        url: "https://salesmotion.io/blog/b-2-b-sales-methodologies"
        context: "Treat high-value accounts as markets of one"

    activity_map:
      purpose: >
        The AE exists to convert pipeline into closed revenue and to provide
        the commercial signal layer that feeds leadership decisions. Everything
        the AE does falls into one of these operational domains. Each domain
        is owned by a sub-agent that operates independently with its own
        tools, flows, boundaries, and prompt registry.
      domains:
        - domain: Deal Progression
          why: >
            Advance deals by diagnosing health, unsticking stalls,
            learning from losses, resurrecting winnable opportunities.
          agent: ae-deal-diagnosis-agent
          contributing_agents:
            - agent: ae-qualification-agent
              provides: MEDDPICC readiness score before stage transitions
            - agent: ae-signal-detection-agent
              provides: Competitive threats and pain validation for deal context
            - agent: ae-stakeholder-agent
              provides: Champion health and decision-maker engagement status
          activities:
            - Deal health assessment before stage transitions
            - Stall root cause analysis when deals stop moving
            - Win/loss review after deal close
            - Resurrection candidate identification from closed-lost
          cadence: per-deal, triggered by stage change or stall detection

        - domain: Pipeline & Forecast
          why: >
            Own forecast accuracy and pipeline coverage.
            Leadership plans hiring and targets from commit confidence.
          agent: ae-pipeline-mgmt-agent
          contributing_agents:
            - agent: ae-deal-diagnosis-agent
              provides: Deal health scores feeding forecast confidence
            - agent: ae-qualification-agent
              provides: Qualification confidence per deal for commit validation
            - agent: ae-opportunity-hygiene-agent
              provides: Data quality scores affecting pipeline accuracy
          activities:
            - Forecast commit scoring per deal with evidence
            - Pipeline coverage analysis against quota target
            - Next-best-action prioritization across portfolio
            - Territory and account planning for pipeline generation
          cadence: weekly pipeline review, quarterly territory planning

        - domain: Stakeholder Alignment
          why: >
            Track influence flows across 5-8 stakeholders per deal,
            if champions are engaged, if relationships are cooling.
          agent: ae-stakeholder-agent
          contributing_agents:
            - agent: ae-signal-detection-agent
              provides: Sentiment shifts and relationship signals from communications
            - agent: ae-meeting-prep-agent
              provides: Meeting history and interaction frequency data
          activities:
            - Decision-making unit mapping per opportunity
            - Champion health and engagement tracking
            - Executive briefing preparation tailored to stakeholder priorities
            - Relationship transfer during customer handoff
          cadence: continuous per active deal

        - domain: Commercial Signal Intelligence
          why: >
            Surface budget shifts, competitive mentions, expansion
            hints from emails, Slack, notes before they become surprises.
          agent: ae-signal-detection-agent
          contributing_agents:
            - agent: ae-stakeholder-agent
              provides: Contact frequency data indicating engagement changes
            - agent: ae-opportunity-hygiene-agent
              provides: CRM field changes that correlate with commercial signals
          activities:
            - Budget and procurement signal scanning
            - Competitive threat detection and positioning intelligence
            - Expansion and upsell opportunity identification
            - Pain point validation from customer communications
          cadence: continuous, processes new communications as they arrive

        - domain: Deal Qualification
          why: >
            Expose qualification gaps early. Turn gut feel into
            evidence-based deal confidence via MEDDPICC.
          agent: ae-qualification-agent
          contributing_agents:
            - agent: ae-stakeholder-agent
              provides: Economic Buyer and Champion data for E and C dimensions
            - agent: ae-signal-detection-agent
              provides: Pain and Competition evidence for I and C dimensions
            - agent: ae-deal-diagnosis-agent
              provides: Decision Criteria and Process data for D dimensions
            - agent: ae-pipeline-mgmt-agent
              provides: Metrics data for M dimension
            - agent: ae-opportunity-hygiene-agent
              provides: Paper Process status for P dimension
          activities:
            - MEDDPICC dimension scoring with evidence from CRM and communications
            - Qualification gap identification and closing recommendations
            - Qualification scorecard generation for deal review
            - Pre-commit qualification validation before forecast submission
          cadence: per-deal, before stage transitions and forecast commits

        - domain: Meeting Lifecycle
          why: >
            Prepare every meeting, capture every action.
            Without this, context is lost between touches.
          agent: ae-meeting-prep-agent
          contributing_agents:
            - agent: ae-deal-diagnosis-agent
              provides: Current deal health and risks for call brief context
            - agent: ae-stakeholder-agent
              provides: Attendee profiles, preferences, and relationship history
            - agent: ae-qualification-agent
              provides: Open qualification gaps to address in the meeting
          activities:
            - Call brief assembly with deal context, risks, and stakeholder history
            - QBR material preparation around value delivered and expansion
            - Post-call summary with captured actions and next steps
            - Demo preparation with tailored talking points
          cadence: per meeting, weekly for recurring internal syncs

        - domain: Operational Hygiene
          why: >
            CRM data decays within days, paper processes stall silently.
            Keep data clean without manual updates.
          agent: ae-opportunity-hygiene-agent
          contributing_agents:
            - agent: ae-meeting-prep-agent
              provides: Post-call summaries with field updates to propagate
            - agent: ae-signal-detection-agent
              provides: Detected signals that should be reflected in CRM
          activities:
            - Weekly health checks across all active opportunities
            - Paper process milestone tracking (procurement, legal, security)
            - Stale deal detection and alert escalation
            - CRM update checklist generation for human review
          cadence: weekly hygiene run, daily stale checks

        - domain: Pipeline Generation
          why: >
            Systematic prospecting, not ad-hoc outreach when coverage drops.
            Keep the funnel healthy across all three horizons.
          agent: ae-pipeline-gen-agent
          contributing_agents:
            - agent: ae-pipeline-mgmt-agent
              provides: Coverage gap data and territory tier priorities
            - agent: ae-signal-detection-agent
              provides: Market signals and trigger events for prospect targeting
            - agent: ae-stakeholder-agent
              provides: Existing relationship network for referral-based outreach
          activities:
            - Prospect research against ideal customer profile criteria
            - Personalized outreach strategy development per target account
            - SDR/BDR coordination on joint prospecting activities
            - Marketing event and content leverage for outreach campaigns
            - Pipe gen cadence tracking against daily and weekly targets
          cadence: daily pipe gen activity, weekly conversion review, monthly territory reprioritization

    sub_agents:
      - name: Deal Diagnosis Agent
        id: ae-deal-diagnosis-agent
        purpose: Deal health scoring, stall analysis, loss review, resurrection candidates
      - name: Pipeline Management Agent
        id: ae-pipeline-mgmt-agent
        purpose: Forecast accuracy, coverage gaps, next-best-action prioritization
      - name: Stakeholder Intelligence Agent
        id: ae-stakeholder-agent
        purpose: Relationship mapping, champion health tracking, executive briefings
      - name: Signal Detection Agent
        id: ae-signal-detection-agent
        purpose: Budget signals, competitive threats, expansion opportunities
      - name: Qualification Agent
        id: ae-qualification-agent
        purpose: MEDDPICC assessment, qualification gap analysis, deal readiness scorecards
      - name: Meeting Preparation Agent
        id: ae-meeting-prep-agent
        purpose: Call briefs, QBR materials, post-call summaries with action items
      - name: Opportunity Hygiene Agent
        id: ae-opportunity-hygiene-agent
        purpose: Weekly health checks, paper process tracking, stale deal alerts, CRM update checklists
      - name: Pipeline Generation Agent
        id: ae-pipeline-gen-agent
        purpose: Prospecting research, outreach strategy, SDR coordination, pipe gen cadence tracking

  fallback_model: null

  validation:
    required_dimensions:
      - name: account_context
        description: Which account and what is the commercial situation?
      - name: signal_source
        description: What content is being analyzed? (CRM, meeting notes, Slack, email)
      - name: time_context
        description: What is the relevant time period?
    on_incomplete: >
      State what's missing, provide a preliminary assessment based on available
      information with [NEEDS VERIFICATION] markers, and ask for clarification.
      Do not generate a full commercial analysis from incomplete input.

  output_constraints:
    risk_format: "Risk | Severity | Evidence | Mitigation table"
    actions: "Action | Owner | Due Date | Expected Outcome table"
    commercial_values: "Must include currency units (EUR, USD)"
    dates: "Specific dates only, never 'soon' or 'next quarter'"
    health_scores: "RED/YELLOW/GREEN with justification"
    total_word_limit: 400
    hard_rule: "Every risk has a mitigation action, every action has an owner"

  guardrails:
    input_validation:
      - Reject commercial analysis without account context or signal source
      - Stop and clarify if stakeholder names are not verifiable in source content
    output_checks:
      - Always include risk severity classification with evidence
      - Every action item has owner and due date
      - No assumed stakeholder sentiments or motivations
      - All commercial values include currency units
    signal_validation:
      - Never extrapolate stakeholder sentiment from indirect signals
      - Routing decisions must match documented sub-agent boundaries
      - Escalation to human must cite specific threshold or trigger
    resource:
      - max_tool_calls: 30

  boundaries:
    - Does not execute domain tasks directly (delegates to sub-agents)
    - Does not make pricing decisions or negotiate terms
    - Does not assess technical risks (handoff to SA Agent)
    - Does not track delivery status (handoff to Delivery Agent)
    - Does not make product roadmap commitments (handoff to PM Agent)
    - Does not auto-change CRM data (recommends updates for human review)
    - Does not invent stakeholder sentiments not expressed in source content

  permissions:
    - Route requests to appropriate sub-agent based on task type
    - Aggregate cross-domain results from multiple sub-agents
    - Escalate to human when conditions are met
    - Write risk alerts to InfoHub risk register (via sub-agents)

  handoffs:
    human_escalation: Sales Lead
    defer_to:
      sa_agent:
        scope: Technical risk assessment, architecture decisions, solution design
        scenarios:
          - trigger: Technical questions beyond commercial scope
            context_passed: Account context, deal requirements, customer technical questions
            receiver_action: Architecture review, risk assessment, solution design
          - trigger: Discovery complete, technical validation needed
            context_passed: Discovery notes, stakeholder priorities, timeline
            receiver_action: Technical feasibility assessment, solution scoping
      delivery_agent:
        scope: Implementation status, delivery risks, post-sale tracking
        scenarios:
          - trigger: Contract signed
            context_passed: Deal commitments, SLAs, stakeholder map, success criteria
            receiver_action: Implementation planning, resource allocation, kickoff scheduling
      pm_agent:
        scope: Product roadmap commitments, feature feasibility
        scenarios:
          - trigger: Customer requests roadmap commitment or feature timeline
            context_passed: Feature request details, customer priority, deal impact
            receiver_action: Feasibility assessment, roadmap alignment check
      ci_agent:
        scope: Deep competitive analysis beyond deal-level mentions
        scenarios:
          - trigger: Competitor identified in deal
            context_passed: Competitor name, context of mention, deal stage, customer sentiment
            receiver_action: Battlecard creation, positioning strategy, win themes
      ve_agent:
        scope: Business case construction, ROI quantification
        scenarios:
          - trigger: Customer requires business justification or ROI model
            context_passed: Customer pain points, current costs, expected outcomes
            receiver_action: ROI model construction, value framework mapping
      partner_agent:
        scope: Partner engagement strategy, co-sell coordination
        scenarios:
          - trigger: Partner involvement needed for deal advancement
            context_passed: Account context, deal requirements, partner capabilities needed
            receiver_action: Co-sell strategy, partner resource coordination
      rfp_agent:
        scope: RFP/RFI response orchestration
        scenarios:
          - trigger: RFP or RFI received from customer
            context_passed: RFP document, account context, deal timeline, compliance requirements
            receiver_action: Bid strategy assessment, compliance matrix, response orchestration
      poc_agent:
        scope: Proof of concept execution planning
        scenarios:
          - trigger: Customer requests proof of concept
            context_passed: Success criteria, timeline, stakeholders, technical requirements
            receiver_action: POC scope definition, execution plan, resource allocation
      infosec_agent:
        scope: Security and compliance questionnaire management
        scenarios:
          - trigger: Customer sends security or compliance questionnaire
            context_passed: Questionnaire document, customer security requirements, deal timeline
            receiver_action: Response coordination, internal security team engagement
      senior_manager_agent:
        scope: Strategic oversight and executive engagement
        scenarios:
          - trigger: Deal exceeds $500K threshold or forecast variance >15%
            context_passed: Deal context, pipeline health, forecast risks, escalation reason
            receiver_action: Strategic oversight, executive engagement, deal strategy guidance
    provide_to:
      sa_agent:
        scope: Commercial context, deal timeline, customer priorities
        scenarios:
          - trigger: Discovery complete, technical evaluation needed
            context_passed: Account context, opportunity data, customer requirements, deal timeline
            receiver_action: Technical discovery, architecture assessment, risk identification
          - trigger: Deal timeline change impacts technical workstream
            context_passed: New timeline, milestone shifts, customer urgency signals
            receiver_action: Adjust POC/solution design schedule, reprioritize technical tasks
      ci_agent:
        scope: Competitive mentions detected in deal conversations
        scenarios:
          - trigger: Competitor identified or repositioned in active deal
            context_passed: Competitor name, deal context, customer sentiment, stage
            receiver_action: Battlecard update, positioning strategy, win theme refinement
      delivery_agent:
        scope: Deal terms, customer expectations, success criteria
        scenarios:
          - trigger: Deal closed or close imminent (Commit stage)
            context_passed: Deal terms, customer expectations, success criteria, stakeholder map
            receiver_action: Implementation planning, resource allocation, kickoff preparation
      senior_manager_agent:
        scope: Pipeline health, forecast risks, escalation context
        scenarios:
          - trigger: Forecast variance exceeds threshold or strategic deal at risk
            context_passed: Pipeline health metrics, at-risk deals, forecast delta, mitigation options
            receiver_action: Executive intervention planning, resource reallocation, escalation decisions
      all_agents:
        scope: Relationship health signals via InfoHub
        scenarios:
          - trigger: Significant relationship health change detected (champion exit, org change)
            context_passed: Signal type, affected accounts, severity, evidence
            receiver_action: Domain-specific impact assessment within each agent's scope

  escalation_triggers:
    - Forecast variance exceeds 15% (to Sales Lead)
    - HIGH severity commercial risk detected (to Sales Lead)
    - Customer threatens cancellation (to Sales Lead and Senior Manager)
    - Champion gone dark for 21+ days (to Sales Lead)
    - Competitive threat at deal level (to CI Agent for deeper analysis)

  human_in_the_loop_conditions:
    - Review required before publishing commercial risk assessments
    - Approval needed for forecast adjustment recommendations
    - Human validates stakeholder sentiment interpretations
    - CRM update recommendations require AE confirmation before execution

  playbook_raci:
    context: >
      Outside of agent-owned operations, the AE participates in cross-role
      scenarios orchestrated by playbooks. In these scenarios the AE
      provides commercial context while other roles lead their domain.
      The AE's sub-agents feed context into these playbooks but do not
      orchestrate them.
    responsible:
      - playbook: Sales QBR (PB_AE_603)
        scope: Pipeline health, revenue attainment, forecast accuracy presentation
        team: account_executives
        file: PB_AE_603_sales_qbr.yaml
      - playbook: Account Planning (PB_AE_602)
        scope: Strategic account planning with blocker analysis and territory plans
        team: account_executives
        file: PB_AE_602_account_planning.yaml
      - playbook: MEDDPICC Qualification (PB_AE_801)
        scope: Qualification assessment, deal scoring, gap identification
        team: account_executives
        file: PB_AE_801_meddpicc.yaml
      - playbook: Update Commercial Fields (OP_COM_001)
        scope: CRM field updates ensuring pipeline accuracy
        team: operational
        file: OP_COM_001_update_commercial_fields.yaml
      - playbook: Opportunity Consult (PB_AE_604)
        scope: Deal review preparation, qualification scorecard assembly, close plan status, help needed
        team: account_executives
        file: PB_AE_604_opportunity_consult.yaml
    accountable:
      - playbook: Sales QBR (PB_AE_603)
        scope: Sales Leadership approves forecast commits and pipeline narrative
        team: account_executives
        file: PB_AE_603_sales_qbr.yaml
      - playbook: Account Planning (PB_AE_602)
        scope: Sales Leadership approves strategic account plans and territory priorities
        team: account_executives
        file: PB_AE_602_account_planning.yaml
      - playbook: MEDDPICC Qualification (PB_AE_801)
        scope: Sales Leadership validates qualification gate decisions on strategic deals
        team: account_executives
        file: PB_AE_801_meddpicc.yaml
      - playbook: Deal Retrospective (PB_AE_601)
        scope: Sales Leadership reviews win/loss outcomes and learnings
        team: account_executives
        file: PB_AE_601_retrospective.yaml
      - playbook: Update Commercial Fields (OP_COM_001)
        scope: Sales Operations validates CRM data hygiene and field accuracy
        team: operational
        file: OP_COM_001_update_commercial_fields.yaml
    consulted:
      - playbook: Deal Retrospective (PB_AE_601)
        scope: Deal overview, outcome analysis, commercial learnings
        team: account_executives
        file: PB_AE_601_retrospective.yaml
      - playbook: Implementation Kickoff (PB_DEL_001)
        scope: Deal context, stakeholder identification, success criteria handoff
        team: delivery
        file: PB_DEL_001_implementation_kickoff.yaml
      - playbook: Joint Account Planning (PB_PTR_003)
        scope: Account strategy alignment, revenue targets, customer relationship context
        team: partners
        file: PB_PTR_003_joint_account_planning.yaml
      - playbook: RFP Response
        scope: Commercial requirements, pricing input, customer priorities
      - playbook: POC Execution
        scope: Customer expectations, success criteria, deal timeline
    informed:
      - playbook: Competitive Displacement
        scope: Competitive analysis outcomes affecting active deals
      - playbook: Value Engineering
        scope: ROI models and business case outputs for deal support
      - playbook: Executive Alignment
        scope: Leadership strategy decisions impacting account approach

  memory:
    conversation: "Current commercial analysis session state"
    working:
      - Deal health scores and risk classifications in progress
      - Stakeholder signals detected during scan
      - Pipeline metrics calculated during session
      - Action items accumulated across analysis steps
    persistent:
      - Historical deal health trends per account
      - Known stakeholder preferences and communication styles
      - Previous forecast accuracy and pipeline patterns
      - Win/loss patterns from past deal analyses
    shared:
      - Commercial context passed to SA Agent for technical decisions
      - Relationship health signals shared with all agents via InfoHub
      - Competitive mentions forwarded to CI Agent for deeper analysis

  context:
    strategy: "Commercial accuracy first, prioritize risks by severity and deal value"
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
      - System prompt with identity and routing rules
      - Current account context and pipeline data
      - Working memory (risks detected, actions accumulated)
      - Sub-agent results to aggregate
    include:
      - Full CRM data for active opportunities (critical for accuracy)
      - Exact stakeholder quotes (never paraphrase commercial commitments)
      - Risk classification criteria from references
    exclude:
      - Technical architecture details (SA domain)
      - Delivery tracking data (Delivery domain)
      - Generic sales methodology advice

  knowledge:
    scope:
      domains: [deal-health, pipeline, signal-detection, qualification]
      archetypes: [enterprise, mid-market]
    references:
      - path: references/meddpicc-framework.yaml
        description: Qualification dimensions, scoring criteria, evidence requirements
      - path: references/signal-detection.yaml
        description: Commercial signals, budget patterns, competitive threat indicators
      - path: references/pipeline-methodology.yaml
        description: Forecast methodology, coverage ratios, commit confidence scoring
      - path: references/account-planning.yaml
        description: Territory planning, account tiering, whitespace mapping

  assets:
    - name: deal-health-report
      filename: "{account}-deal-health.md"
      description: Deal health assessment for a specific opportunity
    - name: pipeline-report
      filename: "{ae_name}-pipeline-report.md"
      description: Pipeline status and forecast risk report
    - name: hygiene-report
      filename: "{ae_name}-weekly-hygiene.md"
      description: Weekly opportunity hygiene report
    - name: call-brief
      filename: "{account}-call-brief.md"
      description: Customer call preparation brief

  quality:
    - All stakeholders mentioned exist in tags or content
    - All commercial values have units (EUR, USD, etc.)
    - All dates are specific, not "soon" or "next quarter"
    - Every risk has a mitigation suggestion
    - No assumed motivations or sentiments
    - Health scores supported by specific evidence

  autonomy:
    role: orchestrator
    description: >
      Watches sub-agent outputs and routes follow-up actions.
      Sub-agents declare triggers and outputs in their own specs.
      The orchestrator enforces the routing contracts.

    triggers:
      - source: crm_webhook
        condition: opportunity.stage_changed == true OR opportunity.created == true
        action: Route to ae-signal-detection-agent for initial signal scan
        context_received: [opportunity_data, account_context, stage_transition]
      - source: crm_webhook
        condition: activity.type IN [meeting_completed, email_received, call_logged]
        action: Route to ae-meeting-prep-agent for post-call processing
        context_received: [activity_record, account_context, opportunity_data]
      - source: scheduled_cadence
        condition: weekly_pipeline_review == true
        action: Route to ae-pipeline-mgmt-agent for coverage and forecast analysis
        context_received: [pipeline_snapshot, forecast_data, territory_context]
      - source: sa-agent
        condition: technical_discovery.complete == true
        action: Route to ae-qualification-agent for Decision Criteria update
        context_received: [technical_assessment, risk_findings, architecture_fit]

    reactive_routing:
      - watch: ae-signal-detection-agent
        on: competitive_threat.severity >= HIGH
        route_to: ae-deal-diagnosis-agent
        context_forward: [signal_assessment, threat_details, affected_opportunity]
        description: Competitive threat triggers deal health reassessment

      - watch: ae-signal-detection-agent
        on: org_change_detected == true OR champion_risk_signals > 0
        route_to: ae-stakeholder-agent
        context_forward: [signal_assessment, change_details, affected_contacts]
        description: Org changes trigger relationship map update

      - watch: ae-signal-detection-agent
        on: new_pain_point_detected == true OR budget_signal.type == constraint
        route_to: ae-qualification-agent
        context_forward: [signal_assessment, pain_details, budget_context]
        description: New pain or budget constraint triggers re-qualification

      - watch: ae-deal-diagnosis-agent
        on: deal_health.score < 40
        route_to: ae-qualification-agent
        context_forward: [deal_health_assessment, affected_opportunity]
        description: Critical deal health forces re-qualification

      - watch: ae-deal-diagnosis-agent
        on: deal_health.classification == RED
        route_to: ae-pipeline-mgmt-agent
        context_forward: [deal_health_assessment, risk_impact_on_forecast]
        description: RED deal triggers pipeline reprioritization

      - watch: ae-qualification-agent
        on: champion_dimension.score IN [WEAK, UNKNOWN]
        route_to: ae-stakeholder-agent
        context_forward: [gap_analysis, champion_evidence]
        description: Champion gap triggers stakeholder deep-dive

      - watch: ae-qualification-agent
        on: unknown_dimensions >= 3
        route_to: ae-meeting-prep-agent
        context_forward: [gap_analysis, discovery_targets]
        description: Multiple unknowns trigger discovery meeting prep

      - watch: ae-stakeholder-agent
        on: new_executive_identified == true
        route_to: ae-meeting-prep-agent
        context_forward: [executive_profile, relationship_context]
        description: New executive triggers introductory meeting briefing

      - watch: ae-meeting-prep-agent
        on: post_call_summary.generated == true
        route_to: ae-opportunity-hygiene-agent
        context_forward: [post_call_summary, crm_update_recommendations]
        description: Post-call summary triggers CRM hygiene update

      - watch: ae-opportunity-hygiene-agent
        on: stale_alert.level == CRITICAL
        route_to: ae-deal-diagnosis-agent
        context_forward: [stale_alert, opportunity_context]
        description: Critically stale deal triggers full health check

      - watch: ae-opportunity-hygiene-agent
        on: hygiene_report.generated == true
        route_to: ae-pipeline-mgmt-agent
        context_forward: [hygiene_report, pipeline_health_metrics]
        description: Hygiene report feeds pipeline health context

      - watch: ae-pipeline-mgmt-agent
        on: coverage_ratio < 3.0 OR pipeline_gap > 0
        route_to: ae-pipeline-gen-agent
        context_forward: [coverage_analysis, gap_details, territory_context]
        description: Coverage gap triggers prospecting

      # Cross-role: watch SA for technical risk that impacts deal health
      - watch: sa-agent
        on: technical_risk.severity == CRITICAL
        route_to: ae-deal-diagnosis-agent
        context_forward: [risk_assessment, affected_architecture, deal_impact]
        description: Critical technical risk from SA triggers deal health reassessment

      - watch: sa-agent
        on: solution_validation.status == BLOCKED
        route_to: ae-qualification-agent
        context_forward: [blocker_details, technical_constraints, timeline_impact]
        description: Blocked solution triggers re-qualification of deal feasibility

    cascade_limits:
      max_depth: 3
      max_agents_per_chain: 4
      circuit_breaker: Stop chain if same agent triggered twice in one cascade
      description: >
        Prevents infinite loops. A signal can trigger at most 3 downstream
        hops before requiring human review of the accumulated results.
