      purpose: Forecast accuracy, coverage gaps, next-best-action prioritization
    - name: Stakeholder Intelligence Agent
      id: ae-stakeholder-agent
      purpose: Relationship mapping, champion health tracking, executive briefings
    - name: Signal Detection Agent
      id: ae-signal-detection-agent
      purpose: Budget signals, competitive threats, expansion opportunities
    - name: Qualification Agent
      id: ae-meddpicc-agent
      purpose: MEDDPICC assessment, qualification gap analysis, deal readiness scorecards
    - name: Meeting Preparation Agent
      id: ae-meeting-prep-agent
      purpose: Call briefs, QBR materials, post-call summaries with action items
    - name: Opportunity Hygiene Agent
      id: ae-opportunity-hygiene-agent
      purpose: Weekly health checks, paper process tracking, stale deal alerts, CRM update checklists
    - name: Pipeline Generation Agent
      id: ae-pipeline-gen-agent
      purpose: Prospecting research, outreach strategy, SDR coordination, pipe gen cadence tracking
    - name: Commercial Strategy Agent
      id: ae-commercial-strategy-agent
      purpose: Pricing strategy, discount analysis, contract negotiation preparation, value communication, business case construction
  fallback_model: null
  validation:
    required_dimensions:
    - name: account_context
      description: Which account and what is the commercial situation?
    - name: signal_source
      description: What content is being analyzed? (CRM, meeting notes, Slack, email)
    - name: time_context
      description: What is the relevant time period?
    on_incomplete: 'State what''s missing, provide a preliminary assessment based on available information with [NEEDS VERIFICATION] markers, and ask for clarification. Do not generate a full commercial
      analysis from incomplete input.

      '
  output_constraints:
    risk_format: Risk | Severity | Evidence | Mitigation table
    actions: Action | Owner | Due Date | Expected Outcome table
    commercial_values: Must include currency units (EUR, USD)
    dates: Specific dates only, never 'soon' or 'next quarter'
    health_scores: RED/YELLOW/GREEN with justification
    total_word_limit: 400
    hard_rule: Every risk has a mitigation action, every action has an owner
  guardrails:
    input_validation:
    - Reject commercial analysis without account context or signal source
    - Stop and clarify if stakeholder names are not verifiable in source content
    output_checks:
    - Always include risk severity classification with evidence
    - Every action item has owner and due date
    - No assumed stakeholder sentiments or motivations
    - All commercial values include currency units
    signal_validation:
    - Never extrapolate stakeholder sentiment from indirect signals
    - Routing decisions must match documented sub-agent boundaries
    - Escalation to human must cite specific threshold or trigger
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not execute domain tasks directly (delegates to sub-agents)
  - Does not make pricing decisions or negotiate terms
  - Does not assess technical risks (handoff to SA Agent)
  - Does not track delivery status (handoff to Delivery Agent)
  - Does not make product roadmap commitments (handoff to PM Agent)
  - Does not auto-change CRM data (recommends updates for human review)
  - Does not invent stakeholder sentiments not expressed in source content
  permissions:
  - Route requests to appropriate sub-agent based on task type
  - Aggregate cross-domain results from multiple sub-agents
  - Escalate to human when conditions are met
  - Write risk alerts to InfoHub risk register (via sub-agents)
  handoffs:
    human_escalation: Sales Lead
    defer_to:
      sa_agent:
        scope: Technical risk assessment, architecture decisions, solution design
        scenarios:
        - trigger: Technical questions beyond commercial scope
          context_passed: Account context, deal requirements, customer technical questions
          receiver_action: Architecture review, risk assessment, solution design
        - trigger: Discovery complete, technical validation needed
          context_passed: Discovery notes, stakeholder priorities, timeline
          receiver_action: Technical feasibility assessment, solution scoping
      delivery_agent:
        scope: Implementation status, delivery risks, post-sale tracking
        scenarios:
        - trigger: Contract signed
          context_passed: Deal commitments, SLAs, stakeholder map, success criteria
          receiver_action: Implementation planning, resource allocation, kickoff scheduling
      pm_agent:
        scope: Product roadmap commitments, feature feasibility
        scenarios:
        - trigger: Customer requests roadmap commitment or feature timeline
          context_passed: Feature request details, customer priority, deal impact
          receiver_action: Feasibility assessment, roadmap alignment check
      ci_agent:
        scope: Deep competitive analysis beyond deal-level mentions
        scenarios:
        - trigger: Competitor identified in deal
          context_passed: Competitor name, context of mention, deal stage, customer sentiment
          receiver_action: Battlecard creation, positioning strategy, win themes
      ve_agent:
        scope: Business case construction, ROI quantification
        scenarios:
        - trigger: Customer requires business justification or ROI model
          context_passed: Customer pain points, current costs, expected outcomes
          receiver_action: ROI model construction, value framework mapping
      partner_agent:
        scope: Partner engagement strategy, co-sell coordination
        scenarios:
        - trigger: Partner involvement needed for deal advancement
          context_passed: Account context, deal requirements, partner capabilities needed
          receiver_action: Co-sell strategy, partner resource coordination
      rfp_agent:
        scope: RFP/RFI response orchestration
        scenarios:
        - trigger: RFP or RFI received from customer
          context_passed: RFP document, account context, deal timeline, compliance requirements
          receiver_action: Bid strategy assessment, compliance matrix, response orchestration
      poc_agent:
        scope: Proof of concept execution planning
        scenarios:
        - trigger: Customer requests proof of concept
          context_passed: Success criteria, timeline, stakeholders, technical requirements
          receiver_action: POC scope definition, execution plan, resource allocation
      infosec_agent:
        scope: Security and compliance questionnaire management
        scenarios:
        - trigger: Customer sends security or compliance questionnaire
          context_passed: Questionnaire document, customer security requirements, deal timeline
          receiver_action: Response coordination, internal security team engagement
      senior_manager_agent:
        scope: Strategic oversight and executive engagement
        scenarios:
        - trigger: Deal exceeds $500K threshold or forecast variance >15%
          context_passed: Deal context, pipeline health, forecast risks, escalation reason
          receiver_action: Strategic oversight, executive engagement, deal strategy guidance
    provide_to:
      sa_agent:
        scope: Commercial context, deal timeline, customer priorities
        scenarios:
        - trigger: Discovery complete, technical evaluation needed
          context_passed: Account context, opportunity data, customer requirements, deal timeline
          receiver_action: Technical discovery, architecture assessment, risk identification
        - trigger: Deal timeline change impacts technical workstream
          context_passed: New timeline, milestone shifts, customer urgency signals
          receiver_action: Adjust POC/solution design schedule, reprioritize technical tasks
      ci_agent:
        scope: Competitive mentions detected in deal conversations
        scenarios:
        - trigger: Competitor identified or repositioned in active deal
          context_passed: Competitor name, deal context, customer sentiment, stage
          receiver_action: Battlecard update, positioning strategy, win theme refinement
      delivery_agent:
        scope: Deal terms, customer expectations, success criteria
        scenarios:
        - trigger: Deal closed or close imminent (Commit stage)
          context_passed: Deal terms, customer expectations, success criteria, stakeholder map
          receiver_action: Implementation planning, resource allocation, kickoff preparation
      senior_manager_agent:
        scope: Pipeline health, forecast risks, escalation context
        scenarios:
        - trigger: Forecast variance exceeds threshold or strategic deal at risk
          context_passed: Pipeline health metrics, at-risk deals, forecast delta, mitigation options
          receiver_action: Executive intervention planning, resource reallocation, escalation decisions
      all_agents:
        scope: Relationship health signals via InfoHub
        scenarios:
        - trigger: Significant relationship health change detected (champion exit, org change)
          context_passed: Signal type, affected accounts, severity, evidence
          receiver_action: Domain-specific impact assessment within each agent's scope
  escalation_triggers:
  - Forecast variance exceeds 15% from commit (to Sales Lead)
  - HIGH severity commercial risk detected on active deal (to Sales Lead)
  - Customer threatens cancellation or evaluation of alternatives (to Sales Lead and Senior Manager)
  - Champion gone dark for 21+ days with no response to outreach (to Sales Lead)
  - Competitive threat identified at deal level (to CI Agent)
  - Deal stalled for 2+ weeks with no stage progression (to Sales Lead)
  - Negotiation requires discount beyond standard authority (to Senior Manager)
  - Executive sponsor disengaged or replaced mid-cycle (to Sales Lead)
  - Cross-functional dependency blocking deal progress for 5+ days (to Senior Manager)
  - Discovery findings reveal technical requirements beyond current product scope (to SA Agent and PM)
  - Renewal risk detected 90+ days before contract end (to CA Agent and Sales Lead)
  - Win/loss pattern indicates systemic issue across multiple deals (to Senior Manager)
  human_in_the_loop_conditions:
  - Review required before publishing commercial risk assessments
  - Approval needed for forecast adjustment recommendations
  - Human validates stakeholder sentiment interpretations
  - CRM update recommendations require AE confirmation before execution
  playbook_raci:
    context: 'Outside of agent-owned operations, the AE participates in cross-role scenarios orchestrated by playbooks. In these scenarios the AE provides commercial context while other roles lead their
      domain. The AE''s sub-agents feed context into these playbooks but do not orchestrate them.

      '
    responsible:
    - playbook: Sales QBR (PB_AE_003)
      scope: Pipeline health, revenue attainment, forecast accuracy presentation
      team: account_executives
      file: PB_AE_003_sales_qbr.yaml
    - playbook: Account Planning (PB_AE_002)
      scope: Strategic account planning with blocker analysis and territory plans
      team: account_executives
      file: PB_AE_002_account_planning.yaml
    - playbook: MEDDPICC Qualification (PB_AE_006)
      scope: Qualification assessment, deal scoring, gap identification
      team: account_executives
      file: PB_AE_006_meddpicc.yaml
    - playbook: Update Commercial Fields (OP_COM_001)
      scope: CRM field updates ensuring pipeline accuracy
      team: operational
      file: OP_COM_001_update_commercial_fields.yaml
    - playbook: Opportunity Consult (PB_AE_004)
      scope: Deal review preparation, qualification scorecard assembly, close plan status, help needed
      team: account_executives
      file: PB_AE_004_opportunity_consult.yaml
    accountable:
    - playbook: Sales QBR (PB_AE_003)
      scope: Sales Leadership approves forecast commits and pipeline narrative
      team: account_executives
      file: PB_AE_003_sales_qbr.yaml
    - playbook: Account Planning (PB_AE_002)
      scope: Sales Leadership approves strategic account plans and territory priorities
      team: account_executives
      file: PB_AE_002_account_planning.yaml
    - playbook: MEDDPICC Qualification (PB_AE_006)
      scope: Sales Leadership validates qualification gate decisions on strategic deals
      team: account_executives
      file: PB_AE_006_meddpicc.yaml
    - playbook: Deal Retrospective (PB_AE_001)
      scope: Sales Leadership reviews win/loss outcomes and learnings
      team: account_executives
      file: PB_AE_001_retrospective.yaml
    - playbook: Update Commercial Fields (OP_COM_001)
      scope: Sales Operations validates CRM data hygiene and field accuracy
      team: operational
      file: OP_COM_001_update_commercial_fields.yaml
    consulted:
    - playbook: Deal Retrospective (PB_AE_001)
      scope: Deal overview, outcome analysis, commercial learnings
      team: account_executives
      file: PB_AE_001_retrospective.yaml
    - playbook: Implementation Kickoff (PB_DEL_001)
      scope: Deal context, stakeholder identification, success criteria handoff
      team: delivery
      file: PB_DEL_001_implementation_kickoff.yaml
    - playbook: Joint Account Planning (PB_PTR_003)
      scope: Account strategy alignment, revenue targets, customer relationship context
      team: partners
      file: PB_PTR_003_joint_account_planning.yaml
    - playbook: RFP Response
      scope: Commercial requirements, pricing input, customer priorities
    - playbook: POC Execution
      scope: Customer expectations, success criteria, deal timeline
    informed:
    - playbook: Competitive Displacement
      scope: Competitive analysis outcomes affecting active deals
    - playbook: Value Engineering
      scope: ROI models and business case outputs for deal support
    - playbook: Executive Alignment
      scope: Leadership strategy decisions impacting account approach
  memory:
    conversation: Current commercial analysis session state
    working:
    - Deal health scores and risk classifications in progress
    - Stakeholder signals detected during scan
    - Pipeline metrics calculated during session
    - Action items accumulated across analysis steps
    persistent:
    - Historical deal health trends per account
    - Known stakeholder preferences and communication styles
    - Previous forecast accuracy and pipeline patterns
    - Win/loss patterns from past deal analyses
    shared:
    - Commercial context passed to SA Agent for technical decisions
    - Relationship health signals shared with all agents via InfoHub
    - Competitive mentions forwarded to CI Agent for deeper analysis
  context:
    strategy: Commercial accuracy first, prioritize risks by severity and deal value
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and routing rules
    - Current account context and pipeline data
    - Working memory (risks detected, actions accumulated)
    - Sub-agent results to aggregate
    include:
    - Full CRM data for active opportunities (critical for accuracy)
    - Exact stakeholder quotes (never paraphrase commercial commitments)
    - Risk classification criteria from references
    exclude:
    - Technical architecture details (SA domain)
    - Delivery tracking data (Delivery domain)
    - Generic sales methodology advice
  knowledge:
    scope:
      domains:
      - deal-health
      - pipeline
      - signal-detection
      - qualification
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/meddpicc-framework.yaml
      description: Qualification dimensions, scoring criteria, evidence requirements
    - path: references/signal-detection.yaml
      description: Commercial signals, budget patterns, competitive threat indicators
    - path: references/pipeline-methodology.yaml
      description: Forecast methodology, coverage ratios, commit confidence scoring
    - path: references/account-planning.yaml
      description: Territory planning, account tiering, whitespace mapping
    - path: references/sales-team-cadences.yaml
      description: Four meeting cadences (daily pulse, weekly strategy, monthly review, quarterly offsite) that drive pipeline rhythm
    - path: references/industry-best-practices.yaml
      description: Industry best practices audit (Gartner, Forrester, Gong, Clari, Outreach, methodology vendors), gap analysis, quarterly refresh
  assets:
  - name: deal-health-report
    filename: '{account}-deal-health.md'
    description: Deal health assessment for a specific opportunity
  - name: pipeline-report
    filename: '{ae_name}-pipeline-report.md'
    description: Pipeline status and forecast risk report
  - name: hygiene-report
    filename: '{ae_name}-weekly-hygiene.md'
    description: Weekly opportunity hygiene report
  - name: call-brief
    filename: '{account}-call-brief.md'
    description: Customer call preparation brief
  quality:
  - All stakeholders mentioned exist in tags or content
  - All commercial values have units (EUR, USD, etc.)
  - All dates are specific, not "soon" or "next quarter"
  - Every risk has a mitigation suggestion
  - No assumed motivations or sentiments
  - Health scores supported by specific evidence
  autonomy:
    role: orchestrator
    description: 'Watches sub-agent outputs and routes follow-up actions. Sub-agents declare triggers and outputs in their own specs. The orchestrator enforces the routing contracts.

      '
    triggers:
    - source: crm_webhook
      condition: opportunity.stage_changed == true OR opportunity.created == true
      action: Route to ae-signal-detection-agent for initial signal scan
      context_received:
      - opportunity_data
      - account_context
      - stage_transition
    - source: crm_webhook
      condition: activity.type IN [meeting_completed, email_received, call_logged]
      action: Route to ae-meeting-prep-agent for post-call processing
      context_received:
      - activity_record
      - account_context
      - opportunity_data
    - source: scheduled_cadence
      condition: weekly_pipeline_review == true
      action: Route to ae-pipeline-mgmt-agent for coverage and forecast analysis
      context_received:
      - pipeline_snapshot
      - forecast_data
      - territory_context
    - source: sa-agent
      condition: technical_discovery.complete == true
      action: Route to ae-meddpicc-agent for Decision Criteria update
      context_received:
      - technical_assessment
      - risk_findings
      - architecture_fit
    reactive_routing:
    - watch: ae-signal-detection-agent
      true: competitive_threat.severity >= HIGH
      route_to: ae-deal-diagnosis-agent
      context_forward:
      - signal_assessment
      - threat_details
      - affected_opportunity
      description: Competitive threat triggers deal health reassessment
    - watch: ae-signal-detection-agent
      true: org_change_detected == true OR champion_risk_signals > 0
      route_to: ae-stakeholder-agent
      context_forward:
      - signal_assessment
      - change_details
      - affected_contacts
      description: Org changes trigger relationship map update
    - watch: ae-signal-detection-agent
      true: new_pain_point_detected == true OR budget_signal.type == constraint
      route_to: ae-meddpicc-agent
      context_forward:
      - signal_assessment
      - pain_details
      - budget_context
      description: New pain or budget constraint triggers re-qualification
    - watch: ae-deal-diagnosis-agent
      true: deal_health.score < 40
      route_to: ae-meddpicc-agent
      context_forward:
      - deal_health_assessment
      - affected_opportunity
      description: Critical deal health forces re-qualification
    - watch: ae-deal-diagnosis-agent
      true: deal_health.classification == RED
      route_to: ae-pipeline-mgmt-agent
      context_forward:
      - deal_health_assessment
      - risk_impact_on_forecast
      description: RED deal triggers pipeline reprioritization
    - watch: ae-meddpicc-agent
      true: champion_dimension.score IN [WEAK, UNKNOWN]
      route_to: ae-stakeholder-agent
      context_forward:
      - gap_analysis
      - champion_evidence
      description: Champion gap triggers stakeholder deep-dive
    - watch: ae-meddpicc-agent
      true: unknown_dimensions >= 3
      route_to: ae-meeting-prep-agent
      context_forward:
      - gap_analysis
      - discovery_targets
      description: Multiple unknowns trigger discovery meeting prep
    - watch: ae-stakeholder-agent
      true: new_executive_identified == true
      route_to: ae-meeting-prep-agent
      context_forward:
      - executive_profile
      - relationship_context
      description: New executive triggers introductory meeting briefing
    - watch: ae-meeting-prep-agent
      true: post_call_summary.generated == true
      route_to: ae-opportunity-hygiene-agent
      context_forward:
      - post_call_summary
      - crm_update_recommendations
      description: Post-call summary triggers CRM hygiene update
    - watch: ae-opportunity-hygiene-agent
      true: stale_alert.level == CRITICAL
      route_to: ae-deal-diagnosis-agent
      context_forward:
      - stale_alert
      - opportunity_context
      description: Critically stale deal triggers full health check
    - watch: ae-opportunity-hygiene-agent
      true: hygiene_report.generated == true
      route_to: ae-pipeline-mgmt-agent
      context_forward:
      - hygiene_report
      - pipeline_health_metrics
      description: Hygiene report feeds pipeline health context
    - watch: ae-pipeline-mgmt-agent
      true: coverage_ratio < 3.0 OR pipeline_gap > 0
      route_to: ae-pipeline-gen-agent
      context_forward:
      - coverage_analysis
      - gap_details
      - territory_context
      description: Coverage gap triggers prospecting
    - watch: sa-agent
      true: technical_risk.severity == CRITICAL
      route_to: ae-deal-diagnosis-agent
      context_forward:
      - risk_assessment
      - affected_architecture
      - deal_impact
      description: Critical technical risk from SA triggers deal health reassessment
    - watch: sa-agent
      true: solution_validation.status == BLOCKED
      route_to: ae-meddpicc-agent
      context_forward:
      - blocker_details
      - technical_constraints
      - timeline_impact
      description: Blocked solution triggers re-qualification of deal feasibility
    - watch:
      - ae-signal-detection-agent
      - ae-meddpicc-agent
      true: competitive_threat.severity >= HIGH AND competition_dimension.score IN [STRONG, ADEQUATE]
      route_to: ae-deal-diagnosis-agent
      context_forward:
      - signal_assessment
      - qualification_scorecard
      - deal_context
      description: Conflicting competitive signals require deal diagnosis reconciliation
    - watch: delivery-agent
      true: post_implementation_review.completed == true
      route_to: ae-deal-diagnosis-agent
      context_forward:
      - commitment_accuracy
      - sla_achievability
      - stakeholder_map_validity
      description: Delivery feedback calibrates future commitment realism scoring
    - watch: knowledge-vault-curator-agent
      true: SIG_VAULT_PATTERN.frequency >= 3 AND pattern_domain == "deal_retrospective"
      route_to: ae-meddpicc-agent
      context_forward:
      - pattern_category
      - frequency
      - affected_dimensions
      - suggested_threshold_adjustment
      description: Recurring loss patterns across accounts trigger qualification threshold review
    cascade_limits:
      max_depth: 3
      max_agents_per_chain: 4
      circuit_breaker: Stop chain if same agent triggered twice in one cascade
      on_halt:
        action: create_action_item
        via: OP_ACT_001
        assigned_to: ae_human
        payload:
        - cascade_trace
        - accumulated_outputs
        - halt_reason
        notify: nudger-agent
      description: 'Prevents infinite loops. A signal can trigger at most 3 downstream hops before requiring human review of the accumulated results. When the breaker trips, an action item is created via
        OP_ACT_001 so the nudger tracks it and the human sees the full cascade trace.

        '
