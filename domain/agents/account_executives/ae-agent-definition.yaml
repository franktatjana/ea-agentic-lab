- component_type: ClientTool
  id: invoke-commercial-strategy
  name: Invoke Commercial Strategy Agent
  description: Route to Commercial Strategy Agent for pricing strategy, discount analysis, contract terms, value communication, or business case construction
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  - title: deal_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: ae-commercial-strategy-agent
- component_type: ClientTool
  id: invoke-pipeline-gen
  name: Invoke Pipeline Generation Agent
  description: Route to Pipeline Generation Agent for prospecting research, outreach strategy, SDR coordination, or pipe gen tracking
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: territory_context
    type: object
  - title: coverage_gap
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: ae-pipeline-gen-agent
toolboxes: []
specialized_agents: []
flows: []
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - qualification
    - deal-diagnosis
    - pipeline-management
    - pipeline-generation
    - stakeholder-intelligence
    - commercial-signal-detection
    - meeting-preparation
    - opportunity-hygiene
    - commercial-strategy
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain
x-ea-agent:
  prompt_registry: {}
  profile:
    why: 'Enterprise AEs spend more time on admin work than selling. Between CRM updates, meeting prep, forecast compilation, and stakeholder tracking, the actual selling window shrinks to a fraction of
      the day. This agent gives the AE a digital workforce that handles the data-heavy, repetitive tasks so they can focus on relationships and closing deals.

      '
    human_matters_summary: 'The agent surfaces signals, prepares materials, and keeps data current, but the AE brings relationship instinct, negotiation judgment, and the credibility that closes enterprise
      deals.

      '
    human_matters_goal: 'Every meeting is prepared, every decision is data-informed, but the deal closes because the AE built trust no agent can replicate.

      '
    role_tab_intro: 'An AE holds 10-30 complex deals in their head simultaneously and needs to know exactly where each one is stalling. The challenges below are where selling time gets lost, confidence
      erodes, and deals quietly die — each mapped to the sub-agent built to handle it.

      '
    goals_summary: 'The AE succeeds when pipeline stays healthy, deals progress on signal not gut feel, and admin work never crowds out selling time.

      '
    goals:
    - Hit quota consistently by never missing a deal signal
    - Cut administrative overhead from 60% of time to under 20%
    - Maintain 3-5x pipeline coverage without manual territory planning
    - Keep CRM and forecast data current without field-by-field updates
    - Walk into every meeting fully prepared with zero prep time
    - Every deal has a documented close plan shared with the customer
    - Account plans refreshed quarterly with tiered prioritization
    - Negotiation positions backed by competitive intelligence and value evidence
    - Executive sponsor identified and engaged on every strategic deal
    - Value articulated through business outcomes, not product features
    - Cross-functional coordination with zero dropped handoffs
    - Competitive positioning updated before every customer-facing interaction
    - Win/loss patterns documented and applied to active deals
    - Expansion opportunities identified in every renewal conversation
    role_context: 'The enterprise Account Executive owns the full sales cycle: prospecting, qualification, discovery, solution presentation, negotiation, and close.

      They manage 10-30 active opportunities simultaneously, each involving multiple stakeholders across IT, finance, legal, and executive leadership.

      Enterprise deals run 60-90 days with complex approval chains including security reviews, procurement processes, and budget committee sign-offs.

      The AE must balance 60% of time advancing qualified deals with 40% on prospecting to keep the pipeline replenished.

      '
    key_metrics:
    - 'Quota attainment: revenue closed vs. annual target (enterprise median ~$800K ACV)'
    - 'Pipeline coverage: total pipeline / quota target (healthy = 3-5x)'
    - 'Win rate: deals closed-won / total deals, tracked by stage and segment'
    - 'Sales velocity: (opportunities x deal value x win rate) / cycle length'
    - 'Average cycle length: days from qualification to close (enterprise = 60-90 days)'
    qualification_framework:
      name: MEDDPICC
      owner: ae-meddpicc-agent
      note: 'The Qualification Agent owns the end-to-end MEDDPICC assessment. Each dimension''s data is fed by the sub-agent listed in supported_by.

        '
      dimensions:
      - letter: M
        name: Metrics
        description: Quantified value the customer expects from the solution
        supported_by: ae-pipeline-mgmt-agent
      - letter: E
        name: Economic Buyer
        description: Person with discretionary budget authority and final sign-off
        supported_by: ae-stakeholder-agent
      - letter: D
        name: Decision Criteria
        description: Technical, business, and vendor criteria the customer evaluates against
        supported_by: ae-deal-diagnosis-agent
      - letter: D
        name: Decision Process
        description: Steps, stakeholders, and timeline the customer follows to approve a purchase
        supported_by: ae-deal-diagnosis-agent
      - letter: P
        name: Paper Process
        description: Procurement, legal review, security review, and contract execution
        supported_by: ae-opportunity-hygiene-agent
      - letter: I
        name: Identify Pain
        description: Business pain driving purchase urgency and budget allocation
        supported_by: ae-signal-detection-agent
      - letter: C
        name: Champion
        description: Internal advocate who sells on your behalf when you are not in the room
        supported_by: ae-stakeholder-agent
      - letter: C
        name: Competition
        description: Competitors being evaluated, their positioning, and your differentiation
        supported_by: ae-signal-detection-agent
    stakeholder_landscape:
      customer_side:
      - role: 'Economic Buyer (CFO, VP): budget authority and final sign-off'
        connected_via: ae-stakeholder-agent
      - role: 'Technical Evaluator (CTO, IT Director): requirements, architecture fit, security review'
        connected_via: ae-stakeholder-agent
      - role: 'Champion: internal advocate who drives consensus on your behalf'
        connected_via: ae-stakeholder-agent
      - role: 'Procurement: contract terms, vendor compliance, paper process'
        connected_via: ae-opportunity-hygiene-agent
      - role: 'Legal/Security: compliance review, data handling, infosec requirements'
        connected_via: ae-opportunity-hygiene-agent
      - role: 'End Users: adoption signals, feedback, value realization'
        connected_via: ae-signal-detection-agent
      internal_team:
      - role: 'Solution Architect: technical design, demo support, RFP response'
        connected_via: ae-deal-diagnosis-agent
      - role: 'Value Engineer: business case construction, ROI quantification'
        connected_via: ae-deal-diagnosis-agent
      - role: 'Delivery/PS: implementation scope, timeline, resource planning'
        connected_via: ae-deal-diagnosis-agent
      - role: 'Partner Manager: co-sell coordination, partner leverage'
        connected_via: ae-pipeline-gen-agent
      - role: 'Sales Leadership: forecast review, deal strategy, escalation'
        connected_via: ae-pipeline-mgmt-agent
    challenges:
    - text: Managing 10-30 deals at different stages with different stakeholders simultaneously
      solved_by: ae-pipeline-mgmt-agent
      specific_overhead:
      - Compiling weekly forecast updates from scattered notes and gut feel
    - text: Stakeholder sentiment shifts between meetings without warning
      solved_by: ae-signal-detection-agent
      specific_overhead:
      - Scanning news feeds, competitor announcements, and customer press releases for deal-relevant changes
    - text: Competitive moves surface too late to adjust positioning
      solved_by: ae-signal-detection-agent
      specific_overhead:
      - Manually checking customer social media and earnings calls for buying signals
    - text: Forecast accuracy suffers when based on gut-feel instead of engagement data
      solved_by: ae-pipeline-mgmt-agent
      specific_overhead:
      - Building territory plans in spreadsheets with no automated prioritization
    - text: Multi-threading across 5-8 stakeholders per deal with different priorities
      solved_by: ae-stakeholder-agent
      specific_overhead:
      - Cross-referencing stakeholder roles against org charts before each interaction
    - text: Champion turnover mid-cycle leaves deals without an internal advocate
      solved_by: ae-stakeholder-agent
      specific_overhead:
      - Maintaining relationship maps across buying committees of 5-10 people
    - text: Extended approval chains (security, legal, procurement) stall deals unpredictably
      solved_by: ae-opportunity-hygiene-agent
      specific_overhead:
      - Manually updating CRM fields after every call, email, and meeting
    - text: CRM data goes stale within days of the last update
      solved_by: ae-opportunity-hygiene-agent
      specific_overhead:
      - Tracking procurement, legal, and security review status across multiple deals
    - text: Pipeline generation deprioritized when deal execution consumes all bandwidth
      solved_by: ae-pipeline-gen-agent
      specific_overhead:
      - Researching prospects manually across multiple data sources before outreach
    - text: Outbound targeting relies on outdated lists instead of real-time ICP signals
      solved_by: ae-pipeline-gen-agent
      specific_overhead:
      - Coordinating with SDR/BDR team without shared targeting criteria
    - text: Discovery stays surface-level without structured question frameworks
      solved_by: ae-meeting-prep-agent
      specific_overhead:
      - Writing meeting briefs by pulling context from 4-5 different systems
    - text: Close plans exist in the AE's head, not shared with the customer
      solved_by: ae-deal-diagnosis-agent
      specific_overhead:
      - Manually building mutual close plans from scattered deal notes and meeting summaries
    - text: Objection handling is improvised rather than systematic
      solved_by: ae-meeting-prep-agent
      specific_overhead:
      - Capturing action items and follow-ups from meeting notes manually
    - text: Value articulation defaults to product features instead of business outcomes
      solved_by: ae-deal-diagnosis-agent
      specific_overhead:
      - Assembling value narratives by hunting through case studies and ROI data
    - text: Qualification evidence lives in call recordings and email threads, not CRM fields
      solved_by: ae-meddpicc-agent
      specific_overhead:
      - Re-listening to call recordings to extract MEDDPICC dimension evidence manually
      source: REF_AE_BP_001 (Gong, MEDDICC.com/Spotlight.ai)
    - text: No structured recurring cadences for pipeline review, forecast, and account review
      solved_by: ae-pipeline-mgmt-agent
      specific_overhead:
      - Ad-hoc pipeline reviews with inconsistent format and missing data
      source: REF_AE_BP_001 (Clari)
    - text: Competitive battle cards go stale within days of creation
      solved_by: ae-signal-detection-agent
      specific_overhead:
      - Manually updating battle cards from competitor press releases and product changes
      source: REF_AE_BP_001 (Klue, Crayon, Seismic)
    - text: Meeting prep covers pre-call only, no guidance during live customer conversations
      solved_by: ae-meeting-prep-agent
      specific_overhead:
      - Improvising objection responses and messaging pivots without real-time support
      source: REF_AE_BP_001 (Gong, Outreach)
    - text: Multi-threading strategy is reactive, not prescriptive about who to engage next
      solved_by: ae-stakeholder-agent
      specific_overhead:
      - Deciding which stakeholder to engage next based on intuition rather than engagement pattern data
      source: REF_AE_BP_001 (Gong)
    - text: Mutual close plans are internal documents, not shared buyer-seller workspaces
      solved_by: ae-deal-diagnosis-agent
      specific_overhead:
      - Maintaining separate internal and customer-facing versions of the same deal timeline
      source: REF_AE_BP_001 (SalesHood, Aligned)
    administrative_overhead:
    - text: Manually updating CRM fields after every call, email, and meeting
      automated_by: ae-opportunity-hygiene-agent
    - text: Tracking procurement, legal, and security review status across multiple deals
      automated_by: ae-opportunity-hygiene-agent
    - text: Writing meeting briefs by pulling context from 4-5 different systems
      automated_by: ae-meeting-prep-agent
    - text: Capturing action items and follow-ups from meeting notes manually
      automated_by: ae-meeting-prep-agent
    - text: Compiling weekly forecast updates from scattered notes and gut feel
      automated_by: ae-pipeline-mgmt-agent
    - text: Building territory plans in spreadsheets with no automated prioritization
      automated_by: ae-pipeline-mgmt-agent
    - text: Cross-referencing stakeholder roles against org charts before each interaction
      automated_by: ae-stakeholder-agent
    - text: Maintaining relationship maps across buying committees of 5-10 people
      automated_by: ae-stakeholder-agent
    - text: Researching prospects manually across multiple data sources before outreach
      automated_by: ae-pipeline-gen-agent
    - text: Coordinating with SDR/BDR team without shared targeting criteria
      automated_by: ae-pipeline-gen-agent
    - text: Manually building mutual close plans from scattered deal notes and meeting summaries
      automated_by: ae-deal-diagnosis-agent
    - text: Assembling value narratives by hunting through case studies and ROI data
      automated_by: ae-deal-diagnosis-agent
    - text: Scanning news feeds, competitor announcements, and customer press releases for deal-relevant changes
      automated_by: ae-signal-detection-agent
    - text: Manually checking customer social media and earnings calls for buying signals
      automated_by: ae-signal-detection-agent
    - text: Pulling data from 4-5 systems to build a cross-domain deal health view
      automated_by: ae-agent
    - text: Manually triaging alerts from different tools to decide what to work on first
      automated_by: ae-agent
    - text: Coordinating follow-ups across stakeholder, deal, and pipeline teams after a trigger event
      automated_by: ae-agent
    - text: Building a portfolio-level quarter-close plan by aggregating individual deal statuses
      automated_by: ae-agent
    scenarios:
    - problem: A complete deal health picture requires data from qualification, stakeholder, signals, and pipeline, but each lives in a different system
      why: 'When each dimension is assessed in isolation, the AE misses interaction effects: a weak champion combined with a new competitor and a stalling paper process is not three small problems, it is
        one critical deal at risk. No single sub-agent sees the full picture.

        '
      agent: ae-agent
      agent_response: 'Triggers parallel assessments from deal diagnosis, stakeholder intelligence, signal detection, and qualification agents. Aggregates findings into a unified deal health view with cross-domain
        risk flags that no single agent could surface alone.

        '
      success_signal:
        metric: Cross-domain deal health report produced
        target: < 5 minutes vs 45+ minutes of manual aggregation
        leading_indicator: AE uses unified view instead of checking 4 separate dashboards
        failure_signal: Deal review starts with 20 minutes of data collection
    - problem: Multiple sub-agents flag urgent actions simultaneously, and the AE cannot determine which deserves attention first
      why: 'Without priority arbitration, the AE either context-switches between competing alerts or defaults to the loudest signal. The highest-impact action gets buried under lower-priority noise from
        well-meaning agents.

        '
      agent: ae-agent
      agent_response: 'Evaluates all pending agent outputs against deal value, stage urgency, and signal severity. Produces a single prioritized action list for the day with clear rationale for sequencing.
        Defers low-priority items without losing them.

        '
      success_signal:
        metric: AE starts day with single prioritized action list
        target: One consolidated view vs 5+ separate agent alerts
        leading_indicator: Highest-value action completed first each day
        failure_signal: AE manually checks each sub-agent dashboard to decide what to do
    - problem: A champion departure triggers stakeholder re-mapping, meeting prep for the new contact, deal reassessment, and qualification re-scoring, but each agent acts independently
      why: 'If each sub-agent responds to the same trigger in isolation, the AE gets fragmented recommendations with no coordinated response plan. Actions contradict or duplicate each other, and timing
        is uncoordinated.

        '
      agent: ae-agent
      agent_response: 'Detects cascade triggers and routes the signal to all affected sub-agents simultaneously. Collects their outputs and assembles a coordinated response plan with sequenced actions and
        clear ownership per step.

        '
      success_signal:
        metric: Cascade response coordinated across 3+ agents
        target: Coordinated plan delivered within 2 hours of trigger
        leading_indicator: No duplicate or contradicting recommendations from sub-agents
        failure_signal: AE discovers conflicting sub-agent suggestions days after the trigger
    - problem: Quarter close demands forecast accuracy, deal acceleration, and next-quarter pipeline gen simultaneously across the full portfolio
      why: 'Without portfolio-level orchestration, the AE treats each deal as an island. Cross-deal patterns like common objections, shared stakeholders, or overlapping procurement timelines go unnoticed,
        and next-quarter pipeline gen stops entirely during the close push.

        '
      agent: ae-agent
      agent_response: 'Runs a portfolio-level assessment across all agents. Surfaces cross-deal patterns, identifies the highest-leverage actions for the remaining quarter, and ensures pipeline gen continues
        in parallel with current-quarter close activities.

        '
      success_signal:
        metric: Portfolio-level priorities visible in one view
        target: Zero deals missed in quarter-close push
        leading_indicator: Next-quarter pipeline gen runs uninterrupted during close
        failure_signal: New quarter opens with pipeline gap because gen stopped during close
    - problem: Stakeholder sentiment shifts between meetings without warning
      why: 'Deals stall or die when stakeholder enthusiasm fades between touchpoints and the AE only discovers the shift at the next call. By then, a detractor may have influenced the buying committee and
        repositioned the evaluation criteria without the AE''s knowledge.

        '
      agent: ae-agent
      agent_response: 'Orchestrates signal-detection to monitor engagement indicators between meetings and routes sentiment changes to the stakeholder agent for relationship risk assessment. Surfaces a
        consolidated alert with recommended re-engagement actions before the next scheduled interaction.

        '
      success_signal:
        metric: Sentiment shift detected before next meeting
        target: 90% of material sentiment changes flagged within 48 hours
        leading_indicator: AE adjusts meeting agenda based on pre-meeting sentiment alert
        failure_signal: AE learns about sentiment change only during the live call
    - problem: Competitive moves surface too late to adjust positioning
      why: 'When a competitor announces a new feature, drops pricing, or engages a key stakeholder, the AE needs time to reposition. Late awareness means the prospect has already reframed the evaluation
        around the competitor''s narrative, and the AE is playing defense instead of shaping the criteria.

        '
      agent: ae-agent
      agent_response: 'Routes competitive signals from signal-detection to deal-diagnosis for impact assessment and to meeting-prep for updated positioning materials. Delivers a consolidated competitive
        response brief with displacement tactics and talk tracks tailored to the affected deal context.

        '
      success_signal:
        metric: Competitive response brief available within 24 hours of signal
        target: AE adjusts positioning before next prospect interaction
        leading_indicator: Win rate holds steady when competitor enters active deal
        failure_signal: AE discovers competitor involvement from the prospect during a call
    - problem: Multi-threading across 5-8 stakeholders per deal with different priorities
      why: 'Enterprise deals collapse when the AE relies on a single thread. Each stakeholder has distinct success metrics and risk tolerances, and a generic pitch that works for IT does not resonate with
        finance or operations. Without structured multi-threading, the AE loses influence as the buying committee expands.

        '
      agent: ae-agent
      agent_response: 'Coordinates the stakeholder agent to map influence, priorities, and communication preferences for each contact, then routes persona-specific messaging needs to meeting-prep and commercial-strategy.
        Produces a unified stakeholder coverage plan showing which contacts need engagement and with what message.

        '
      success_signal:
        metric: Active engagement threads per deal
        target: 3+ stakeholder threads active on deals above stage 3
        leading_indicator: Each stakeholder receives persona-tailored outreach within the same week
        failure_signal: Deal progresses with only one active contact and no multi-thread plan
    - problem: Extended approval chains (security, legal, procurement) stall deals unpredictably
      why: 'Deals that clear technical and business validation still die in procurement limbo. Security reviews, legal redlines, and budget approvals each add weeks, and the AE often has no visibility into
        where the paperwork is stuck or who is blocking progress.

        '
      agent: ae-agent
      agent_response: 'Triggers opportunity-hygiene to track approval milestones and surface blockers, while coordinating stakeholder intelligence for procurement contact mapping. Assembles a mutual action
        plan with clear dates and owners for each approval step so the AE and champion can jointly manage the paper process.

        '
      success_signal:
        metric: Approval chain milestones tracked with named owners
        target: Paper process duration reduced by 25% vs untracked deals
        leading_indicator: Blocker identified within 3 days of approval step stalling
        failure_signal: Deal slips quarter because procurement delay was discovered at commit deadline
    - problem: CRM data goes stale within days of the last update
      why: 'Stale CRM records undermine forecast accuracy, deal reviews, and manager visibility. When next-step dates, close amounts, or stage values lag reality, the entire pipeline view becomes unreliable,
        and leadership decisions are based on outdated information.

        '
      agent: ae-agent
      agent_response: 'Orchestrates opportunity-hygiene to run scheduled freshness checks against engagement data and routes discrepancies to the AE as pre-populated update suggestions. Reduces manual CRM
        entry by surfacing field-level changes inferred from meeting notes, email activity, and deal-diagnosis outputs.

        '
      success_signal:
        metric: CRM fields updated within 24 hours of material deal change
        target: 95% of active deals have current next-step and close date
        leading_indicator: AE accepts pre-populated CRM updates instead of manual entry
        failure_signal: Weekly pipeline review reveals 30%+ of deals with stale next-step dates
    - problem: Outbound targeting relies on outdated lists instead of real-time ICP signals
      why: 'Static prospect lists decay quickly as companies change priorities, hire new leaders, and shift budgets. When outbound efforts target accounts that no longer fit the ICP or miss accounts showing
        active buying signals, conversion rates drop and the AE wastes limited prospecting bandwidth.

        '
      agent: ae-agent
      agent_response: 'Coordinates pipeline-gen to refresh target lists using real-time ICP signals and routes enriched account data through signal-detection for intent validation. Delivers a prioritized
        prospect list with trigger events and personalized outreach angles for each target account.

        '
      success_signal:
        metric: Outbound list refreshed with real-time signals weekly
        target: Outbound-to-meeting conversion rate above 8%
        leading_indicator: Prospects on enriched list show 2x higher response rate than static list
        failure_signal: Outbound campaigns target accounts with no recent buying signals
    - problem: Discovery stays surface-level without structured question frameworks
      why: 'Surface-level discovery produces thin qualification data, weak business cases, and deals that stall when the real decision criteria emerge later. Without structured frameworks, the AE asks generic
        questions that do not uncover the prospect''s compelling event, decision process, or cost-of-inaction.

        '
      agent: ae-agent
      agent_response: 'Routes pre-meeting context to meeting-prep for persona-specific discovery question generation and aligns those questions with qualification gaps identified by the qualification agent.
        Delivers a structured discovery guide that maps each question to a MEDDPICC dimension so the AE captures actionable qualification data during the conversation.

        '
      success_signal:
        metric: Discovery calls produce qualification data for 5+ MEDDPICC dimensions
        target: 80% of first discoveries yield enough data for initial qualification score
        leading_indicator: AE uses structured discovery guide and captures mapped responses
        failure_signal: Post-discovery qualification scorecard has 3+ blank dimensions
    - problem: Close plans exist in the AE's head, not shared with the customer
      why: 'Internal-only close plans create misalignment between the AE''s timeline and the buyer''s actual process. When the customer does not see or agree to the remaining steps, surprises emerge at
        critical moments, and the AE loses the ability to jointly manage the path to signature.

        '
      agent: ae-agent
      agent_response: 'Triggers deal-diagnosis to extract remaining close steps and routes them to opportunity-hygiene for mutual action plan formatting. Produces a customer-facing close plan with shared
        milestones, owners, and dates that the AE can present to the champion for joint tracking and accountability.

        '
      success_signal:
        metric: Customer-facing mutual action plan created for stage 4+ deals
        target: 90% of commit-stage deals have a shared close plan
        leading_indicator: Champion references mutual action plan dates in internal meetings
        failure_signal: Deal slips because customer's internal steps were unknown to the AE
    - problem: Objection handling is improvised rather than systematic
      why: 'Ad-hoc objection handling produces inconsistent responses and misses the root concern behind the stated objection. Without a systematic approach, the AE either over-concedes to avoid friction
        or dismisses valid concerns, both of which erode buyer confidence and stall deals.

        '
      agent: ae-agent
      agent_response: 'Coordinates meeting-prep to match reported objections against a structured response library and routes deal context to commercial-strategy for concession analysis. Delivers a prepared
        objection response with the acknowledge-clarify-respond-confirm framework and supporting evidence drawn from deal-diagnosis and qualification data.

        '
      success_signal:
        metric: Objections addressed with structured response framework
        target: 70% of recurring objections have pre-built response playbooks
        leading_indicator: AE resolves objection in the same meeting instead of deferring to follow-up
        failure_signal: Same objection stalls multiple deals with no consistent response approach
    - problem: Value articulation defaults to product features instead of business outcomes
      why: 'Feature-led conversations lose executive attention and commoditize the solution. When the AE cannot translate capabilities into the buyer''s language of revenue impact, cost reduction, or risk
        mitigation, the deal competes on price alone and procurement gains leverage.

        '
      agent: ae-agent
      agent_response: 'Routes deal context and stakeholder priorities to deal-diagnosis for cost-of-inaction framing and to commercial-strategy for outcome-based value messaging. Produces a value narrative
        that connects the prospect''s stated pain to quantified business outcomes, with supporting proof points from similar customer scenarios.

        '
      success_signal:
        metric: Value conversations framed in business outcomes, not features
        target: Executive sponsors reference business case metrics in internal approvals
        leading_indicator: AE presents cost-of-inaction analysis in discovery follow-up
        failure_signal: Prospect feedback cites 'unclear ROI' or 'too technical' as evaluation concern
