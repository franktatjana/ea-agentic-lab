    activity_map:
      purpose: 'The AE exists to convert pipeline into closed revenue and to provide the commercial signal layer that feeds leadership decisions. Everything the AE does falls into one of these operational
        domains. Each domain is owned by a sub-agent that operates independently with its own tools, flows, boundaries, and prompt registry.

        '
      domains:
      - domain: Deal Progression and Close Planning
        why: 'The AE advances deals through stages with clear close plans, mutual action plans shared with the customer, and structured intervention when deals stall.

          '
        agent: ae-deal-diagnosis-agent
        contributing_agents:
        - agent: ae-meddpicc-agent
          provides: MEDDPICC readiness score before stage transitions
        - agent: ae-stakeholder-agent
          provides: Champion health and decision-maker engagement status
        activities:
        - Deal health assessment before stage transitions
        - Close plan creation with mutual action milestones
        - Stall root cause analysis and intervention
        - Resurrection assessment for closed-lost opportunities
        cadence: per-deal, triggered by stage change or stall detection
      - domain: Pipeline Health and Forecast Accuracy
        why: 'The AE owns forecast accuracy. Leadership plans hiring, targets, and investments based on commit confidence the AE provides.

          '
        agent: ae-pipeline-mgmt-agent
        contributing_agents:
        - agent: ae-deal-diagnosis-agent
          provides: Deal health scores feeding forecast confidence
        - agent: ae-meddpicc-agent
          provides: Qualification confidence per deal for commit validation
        - agent: ae-opportunity-hygiene-agent
          provides: Data quality scores affecting pipeline accuracy
        activities:
        - Evidence-based forecast commit scoring per deal
        - Pipeline coverage analysis against quota target
        - Next-best-action prioritization across portfolio
        - Quarterly pipeline review with leadership
        cadence: weekly pipeline review, quarterly territory planning
      - domain: Stakeholder Mapping and Relationship Building
        why: 'The AE builds and maintains relationships across 5-8 stakeholders per deal: champions, economic buyers, technical evaluators, and blockers. Relationship depth determines deal velocity.

          '
        agent: ae-stakeholder-agent
        contributing_agents:
        - agent: ae-signal-detection-agent
          provides: Sentiment shifts and relationship signals
        - agent: ae-meeting-prep-agent
          provides: Meeting history and interaction frequency
        activities:
        - Decision-making unit mapping per opportunity
        - Champion development and engagement
        - Multi-threading across buying committee
        - Relationship handoff during customer transition
        cadence: continuous per active deal
      - domain: Commercial Awareness and Market Intelligence
        why: 'The AE stays informed about budget shifts, competitive moves, and expansion signals across their accounts and acts on them before they become surprises or missed opportunities.

          '
        agent: ae-signal-detection-agent
        contributing_agents:
        - agent: ae-stakeholder-agent
          provides: Contact frequency and engagement changes
        - agent: ae-opportunity-hygiene-agent
          provides: CRM field changes correlating with commercial signals
        activities:
        - Budget and procurement timing awareness
        - Competitive positioning intelligence gathering
        - Expansion and upsell opportunity identification
        - Customer pain point validation and deepening
        cadence: continuous, acting on signals as they emerge
      - domain: Deal Qualification (MEDDPICC)
        why: 'The AE qualifies deals with evidence, not gut feel. Structured qualification exposes gaps early and prevents investment in unwinnable opportunities.

          '
        agent: ae-meddpicc-agent
        contributing_agents:
        - agent: ae-stakeholder-agent
          provides: Economic Buyer and Champion data
        - agent: ae-signal-detection-agent
          provides: Pain and Competition evidence
        - agent: ae-deal-diagnosis-agent
          provides: Decision Criteria and Process data
        - agent: ae-pipeline-mgmt-agent
          provides: Metrics data
        - agent: ae-opportunity-hygiene-agent
          provides: Paper Process status
        activities:
        - MEDDPICC dimension scoring with evidence
        - Qualification gap identification and closing plan
        - Deal review scorecard preparation
        - Pre-commit qualification validation
        cadence: per-deal, before stage transitions and forecast commits
      - domain: Meeting Preparation and Follow-Through
        why: 'The AE prepares for every customer interaction and ensures actions are captured and followed through. Context lost between meetings is trust lost with the customer.

          '
        agent: ae-meeting-prep-agent
        contributing_agents:
        - agent: ae-deal-diagnosis-agent
          provides: Current deal health and risks
        - agent: ae-stakeholder-agent
          provides: Attendee profiles and relationship history
        - agent: ae-meddpicc-agent
          provides: Open qualification gaps to address
        activities:
        - Pre-meeting brief with deal context and objectives
        - QBR preparation around value delivered and expansion
        - Post-meeting action capture and follow-up
        - Demo and workshop talking point preparation
        cadence: per meeting, weekly for recurring syncs
      - domain: Deal Record Accuracy and Visibility
        why: 'The AE is accountable for accurate, current deal data that leadership relies on for forecasting and resource decisions. Inaccurate records cascade into bad business decisions.

          '
        agent: ae-opportunity-hygiene-agent
        contributing_agents:
        - agent: ae-meeting-prep-agent
          provides: Post-call summaries with field updates
        - agent: ae-signal-detection-agent
          provides: Signals that should be reflected in deal records
        activities:
        - Deal data accuracy review across active opportunities
        - Paper process milestone tracking (procurement, legal, security)
        - Stale deal identification and status updates
        - Stage and close date accuracy maintenance
        cadence: weekly review, daily stale checks
      - domain: Pipeline Generation and Prospecting
        why: 'The AE builds pipeline systematically, not through ad-hoc outreach when coverage drops. Consistent prospecting keeps the funnel healthy across all three horizons.

          '
        agent: ae-pipeline-gen-agent
        contributing_agents:
        - agent: ae-pipeline-mgmt-agent
          provides: Coverage gap data and territory tier priorities
        - agent: ae-signal-detection-agent
          provides: Market signals and trigger events for targeting
        - agent: ae-stakeholder-agent
          provides: Existing relationship network for referrals
        activities:
        - ICP-matched prospect research and prioritization
        - Personalized outreach strategy per target account
        - SDR/BDR coordination on joint prospecting
        - Pipe gen cadence tracking against targets
        cadence: daily prospecting, weekly conversion review
      - domain: Account Planning and Territory Strategy
        why: 'The AE segments accounts by potential, builds account plans, and prioritizes where to invest time. Territory strategy drives systematic coverage rather than reactive deal chasing.

          '
        agent: ae-pipeline-mgmt-agent
        contributing_agents:
        - agent: ae-pipeline-gen-agent
          provides: Prospect data and ICP scoring
        - agent: ae-signal-detection-agent
          provides: Account-level buying signals and timing
        activities:
        - Account tiering by revenue potential and strategic value
        - Quarterly account plan creation and refresh
        - Three-horizon pipeline mapping (close, build, seed)
        - Territory coverage gap analysis
        cadence: quarterly planning, monthly territory review
      - domain: Negotiation and Commercial Structuring
        why: 'The AE navigates pricing, discounting, contract terms, and procurement processes to close deals that protect margin and meet customer needs.

          '
        agent: ae-commercial-strategy-agent
        contributing_agents:
        - agent: ae-meddpicc-agent
          provides: Decision criteria and paper process requirements
        - agent: ae-opportunity-hygiene-agent
          provides: Procurement milestone tracking
        - agent: ae-signal-detection-agent
          provides: Competitive pricing intelligence
        activities:
        - Pricing and discount strategy per deal
        - Contract term negotiation and trade-off analysis
        - Procurement process navigation and timeline management
        - Commercial proposal preparation
        cadence: per-deal, late stage through close
      - domain: Executive Engagement and Sponsorship
        why: 'The AE builds executive relationships, secures sponsors, and ensures C-level alignment on strategic deals. Deals without executive sponsorship stall at procurement.

          '
        agent: ae-stakeholder-agent
        contributing_agents:
        - agent: ae-meeting-prep-agent
          provides: Executive briefing preparation
        - agent: ae-deal-diagnosis-agent
          provides: Deal context for executive conversations
        activities:
        - Executive sponsor identification and engagement plan
        - C-level meeting preparation and follow-through
        - Executive alignment on business outcomes and value
        - Sponsor transition planning during org changes
        cadence: per strategic deal, quarterly for key accounts
      - domain: Value Communication and Business Case
        why: 'The AE articulates value through cost-of-inaction, business outcomes, and ROI. Product features do not close deals, business impact does.

          '
        agent: ae-commercial-strategy-agent
        contributing_agents:
        - agent: ae-meddpicc-agent
          provides: Identified pain points and metrics
        - agent: ae-meeting-prep-agent
          provides: Audience-adapted talking points
        - agent: ae-deal-diagnosis-agent
          provides: Deal context for value framing
        activities:
        - Cost-of-inaction framing for customer stakeholders
        - Business outcome articulation per buyer persona
        - ROI and business case co-creation with customer
        - Value proof during evaluation and POC stages
        cadence: per-deal, starting at discovery through close
      - domain: Cross-Functional Deal Coordination
        why: 'The AE is the deal quarterback, coordinating SA, legal, procurement, delivery, and specialists to move deals forward. Dropped handoffs between functions kill deal momentum.

          '
        agent: ae-opportunity-hygiene-agent
        contributing_agents:
        - agent: ae-deal-diagnosis-agent
          provides: Deal context and resource requirements
        - agent: ae-meeting-prep-agent
          provides: Meeting coordination across functions
        activities:
        - SA engagement coordination for technical validation
        - Legal and procurement process orchestration
        - Delivery handoff preparation and timing
        - Specialist resource request and coordination
        cadence: continuous per active deal
      - domain: Competitive Positioning
        why: 'The AE positions against competitors at the deal level, leveraging differentiation, win themes, and displacement strategies tailored to each competitive scenario.

          '
        agent: ae-signal-detection-agent
        contributing_agents:
        - agent: ae-deal-diagnosis-agent
          provides: Competitive context from deal health analysis
        - agent: ae-meeting-prep-agent
          provides: Competitive talking points for customer meetings
        activities:
        - Competitive landscape assessment per deal
        - Battlecard application to specific deal scenarios
        - Win theme development and messaging
        - Competitive objection preparation
        cadence: per-competitive-deal, refreshed at stage transitions
      - domain: Deal Review and Win/Loss Learning
        why: 'The AE participates in deal reviews, retrospectives, and win/loss analysis. Patterns from past deals, applied to active ones, compound into higher win rates over time.

          '
        agent: ae-deal-diagnosis-agent
        contributing_agents:
        - agent: ae-pipeline-mgmt-agent
          provides: Portfolio-level patterns and trends
        - agent: ae-meddpicc-agent
          provides: Qualification patterns across won/lost deals
        activities:
        - Structured deal review with leadership
        - Win/loss retrospective after deal close
        - Pattern identification across deal outcomes
        - Lessons applied to active deal strategies
        cadence: per-deal-close, quarterly pattern review
      - domain: Renewal, Expansion, and Customer Growth
        why: 'The AE identifies expansion opportunities in existing accounts, manages renewal risk early, and partners with CA on growth strategies. The cheapest pipeline is the installed base.

          '
        agent: ae-pipeline-mgmt-agent
        contributing_agents:
        - agent: ae-stakeholder-agent
          provides: Relationship health and expansion contacts
        - agent: ae-signal-detection-agent
          provides: Usage signals and expansion indicators
        activities:
        - Renewal risk assessment 90+ days before contract end
        - Expansion opportunity identification from usage patterns
        - Cross-sell and upsell strategy per account
        - CA partnership on growth planning
        cadence: quarterly account review, triggered by renewal timeline
    sub_agents:
