# SK_AE_001: Deal Diagnosis
# Extracted from: account_executives/prompts/tasks.yaml deal_diagnosis section

skill_id: "SK_AE_001"
name: "Deal Diagnosis"
description: "Diagnose deal health, identify stall causes, analyze losses, and find resurrection opportunities"
version: 1
owner: "ae_agent"
category: "commercial_analysis"

workflow:
  - step: 1
    action: "Analyze deal health: top risks, positive signals, mitigation actions, health score"
    prompt_ref: "prompts/tasks.yaml#deal_diagnosis.analyze_deal_health"
    inputs: ["account_context", "opportunity_name", "time_period"]
    outputs: ["deal_health_assessment"]

  - step: 2
    action: "Diagnose stalled deals: stall causes, contributing factors, unstall actions"
    prompt_ref: "prompts/tasks.yaml#deal_diagnosis.diagnose_stalled_deal"
    inputs: ["current_stage", "days_in_stage"]
    outputs: ["stall_diagnosis"]

  - step: 3
    action: "Analyze lost deals: timeline, warning signs, competitor actions, learnings"
    prompt_ref: "prompts/tasks.yaml#deal_diagnosis.loss_analysis"
    inputs: ["opportunity_name"]
    outputs: ["loss_analysis"]

  - step: 4
    action: "Identify resurrection candidates: changed conditions, new triggers, re-engagement approach"
    prompt_ref: "prompts/tasks.yaml#deal_diagnosis.resurrect_dead_deal"
    inputs: ["time_period"]
    outputs: ["resurrection_candidates"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, CRM data, communication history"
  optional:
    - name: "opportunity_name"
      type: "string"
      description: "Specific opportunity to diagnose"
    - name: "current_stage"
      type: "string"
      description: "Current deal stage"
    - name: "days_in_stage"
      type: "number"
      description: "Days in current stage"
    - name: "time_period"
      type: "string"
      description: "Lookback period for analysis"

outputs:
  - name: "deal_health_assessment"
    type: "object"
    format: "yaml"
    description: "Risk table, positive signals, health score (RED/YELLOW/GREEN), mitigation actions"
  - name: "stall_diagnosis"
    type: "object"
    format: "yaml"
    description: "Primary stall reason, contributing factors, recommended actions, stakeholder to engage"
  - name: "loss_analysis"
    type: "object"
    format: "yaml"
    description: "Timeline, warning signs, competitor analysis, learnings, resurrection potential"
  - name: "resurrection_candidates"
    type: "object"
    format: "yaml"
    description: "Prioritized candidates with original issue, current trigger, suggested approach"

quality_criteria:
  - "Health score supported by specific evidence"
  - "Risks have severity classification and mitigation"
  - "Loss analysis includes actionable learnings"
  - "All assessments traceable to source data"

guardrails:
  - "Never invent stakeholder opinions not stated in source content"
  - "Never assume budget amounts not explicitly mentioned"
  - "Use qualifiers when evidence is indirect"
  - "Add [NEEDS VERIFICATION] marker when uncertain"

imports: []

tags: ["commercial", "deal-health", "pipeline", "risk", "diagnosis"]
