# SK_AE_006: Opportunity Hygiene
# Extracted from: account_executives/prompts/tasks.yaml opportunity_hygiene section

skill_id: "SK_AE_006"
name: "Opportunity Hygiene"
description: "Run weekly hygiene checks, assess health indicators, detect stale opportunities, and generate hygiene reports"
version: 1
owner: "ae_agent"
category: "commercial_analysis"

workflow:
  - step: 1
    action: "Weekly hygiene check: stage accuracy, close date, next steps, last contact, risk status"
    prompt_ref: "prompts/tasks.yaml#opportunity_hygiene.weekly_hygiene_check"
    inputs: ["pipeline_summary", "review_date"]
    outputs: ["hygiene_check"]

  - step: 2
    action: "Assess health indicators: GREEN/YELLOW/RED criteria evaluation, improvement actions"
    prompt_ref: "prompts/tasks.yaml#opportunity_hygiene.opportunity_health_indicators"
    inputs: ["opportunity_name", "current_stage", "days_in_stage", "last_contact_date"]
    outputs: ["health_indicators"]

  - step: 3
    action: "Detect stale opportunities: contact gaps, activity gaps, stage duration, alert levels"
    prompt_ref: "prompts/tasks.yaml#opportunity_hygiene.stale_opportunity_alert"
    inputs: ["pipeline_data", "current_date"]
    outputs: ["stale_alerts"]

  - step: 4
    action: "Generate hygiene report: overall score, health distribution, activity metrics, recommendations"
    prompt_ref: "prompts/tasks.yaml#opportunity_hygiene.hygiene_report"
    inputs: ["pipeline_summary", "week_end_date"]
    outputs: ["hygiene_report"]

inputs:
  required:
    - name: "pipeline_summary"
      type: "object"
      description: "Current pipeline with opportunity details"
  optional:
    - name: "review_date"
      type: "string"
      description: "Date of hygiene review"
    - name: "opportunity_name"
      type: "string"
      description: "Specific opportunity for health assessment"
    - name: "current_date"
      type: "string"
      description: "Current date for stale detection"

outputs:
  - name: "hygiene_check"
    type: "object"
    format: "yaml"
    description: "Per-opportunity checklist, stale list, stage change and close date recommendations"
  - name: "health_indicators"
    type: "object"
    format: "yaml"
    description: "Health status (GREEN/YELLOW/RED), indicator assessment, actions to move to GREEN"
  - name: "stale_alerts"
    type: "object"
    format: "yaml"
    description: "Stale opportunities table with alert levels (WARNING/CRITICAL), actions, close-lost candidates"
  - name: "hygiene_report"
    type: "object"
    format: "yaml"
    description: "Hygiene score, health distribution, activity metrics, week-over-week comparison"

quality_criteria:
  - "Health indicators use consistent GREEN/YELLOW/RED criteria"
  - "Stale thresholds are 14 days (WARNING) and 21 days (CRITICAL)"
  - "Hygiene score calculated from consistent formula"
  - "Week-over-week comparison tracks trend direction"

guardrails:
  - "Never auto-change CRM stages, only recommend"
  - "Stale detection based on data timestamps, not assumptions"
  - "Close-lost recommendations are suggestions for human review"
  - "Do not penalize gaps caused by customer holidays or known pauses"

imports: []

tags: ["commercial", "hygiene", "pipeline", "health", "stale-detection"]
