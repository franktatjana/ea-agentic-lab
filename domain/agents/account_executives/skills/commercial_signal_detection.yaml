# SK_AE_004: Commercial Signal Detection
# Extracted from: account_executives/prompts/tasks.yaml commercial_signals section

skill_id: "SK_AE_004"
name: "Commercial Signal Detection"
description: "Detect budget signals, competitive threats, and expansion opportunities from customer communications"
version: 1
owner: "ae_agent"
category: "commercial_analysis"

workflow:
  - step: 1
    action: "Scan for budget signals: availability, constraints, fiscal timing, approval processes"
    prompt_ref: "prompts/tasks.yaml#commercial_signals.budget_signal_scan"
    inputs: ["account_context", "time_period"]
    outputs: ["budget_signals"]

  - step: 2
    action: "Assess competitive threats: active competitors, offerings, customer response, win/loss position"
    prompt_ref: "prompts/tasks.yaml#commercial_signals.competitive_threat"
    inputs: ["account_context"]
    outputs: ["competitive_assessment"]

  - step: 3
    action: "Identify expansion opportunities: new use cases, departments, usage signals, growth indicators"
    prompt_ref: "prompts/tasks.yaml#commercial_signals.expansion_opportunity"
    inputs: ["account_context", "usage_patterns"]
    outputs: ["expansion_opportunities"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, communication history, CRM data"
  optional:
    - name: "time_period"
      type: "string"
      description: "Scan period for signal detection"
    - name: "usage_patterns"
      type: "object"
      description: "Product usage data for expansion signal detection"

outputs:
  - name: "budget_signals"
    type: "object"
    format: "yaml"
    description: "Budget signals table with date, source, signal, implication; health assessment; actions"
  - name: "competitive_assessment"
    type: "object"
    format: "yaml"
    description: "Competitor activity table, position summary, differentiation points, defensive actions"
  - name: "expansion_opportunities"
    type: "object"
    format: "yaml"
    description: "Opportunities table with signal, value estimate; pursuit order; stakeholders; approach"

quality_criteria:
  - "All signals traceable to specific source and date"
  - "Threat levels justified by evidence"
  - "Expansion estimates conservative and stated as ranges"
  - "No assumed competitive dynamics"

guardrails:
  - "Never assume budget amounts not explicitly mentioned"
  - "Never infer competitive positioning without explicit mention"
  - "Add [NEEDS VERIFICATION] when signal is ambiguous"
  - "Distinguish between confirmed and inferred signals"

imports: []

tags: ["commercial", "signals", "budget", "competitive", "expansion"]
