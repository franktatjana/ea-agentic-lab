# SK_AE_002: Pipeline Management
# Extracted from: account_executives/prompts/tasks.yaml pipeline_management section

skill_id: "SK_AE_002"
name: "Pipeline Management"
description: "Assess forecast accuracy, analyze pipeline coverage, and identify daily priority actions"
version: 1
owner: "ae_agent"
category: "commercial_analysis"

workflow:
  - step: 1
    action: "Assess forecast risk: commit confidence per deal, engagement level, decision maker access"
    prompt_ref: "prompts/tasks.yaml#pipeline_management.forecast_accuracy"
    inputs: ["pipeline_deals", "quarter"]
    outputs: ["forecast_risk_assessment"]

  - step: 2
    action: "Analyze pipeline coverage: coverage ratio, gap to target, generation recommendations"
    prompt_ref: "prompts/tasks.yaml#pipeline_management.pipeline_coverage"
    inputs: ["pipeline_value", "target_value", "win_rate"]
    outputs: ["coverage_analysis"]

  - step: 3
    action: "Identify daily priorities: highest-impact actions based on deal proximity, risk, and signals"
    prompt_ref: "prompts/tasks.yaml#pipeline_management.next_best_action"
    inputs: ["active_opportunities", "recent_signals"]
    outputs: ["priority_actions"]

inputs:
  required:
    - name: "pipeline_deals"
      type: "array"
      description: "Active pipeline deals with stage, value, close date"
  optional:
    - name: "quarter"
      type: "string"
      description: "Target quarter for forecast assessment"
    - name: "target_value"
      type: "number"
      description: "Revenue target for coverage analysis"
    - name: "win_rate"
      type: "number"
      description: "Historical win rate percentage"

outputs:
  - name: "forecast_risk_assessment"
    type: "object"
    format: "yaml"
    description: "At-risk deals table, total forecast at risk, recommended focus deals"
  - name: "coverage_analysis"
    type: "object"
    format: "yaml"
    description: "Coverage ratio, gap, top-5 likely closes, generation recommendations, close plan"
  - name: "priority_actions"
    type: "object"
    format: "yaml"
    description: "Prioritized action list with deal, rationale, expected outcome, time estimate"

quality_criteria:
  - "Forecast confidence based on explicit evidence"
  - "Coverage ratio uses documented win rate"
  - "Priority actions are specific and actionable"
  - "All values have units (EUR, USD)"

guardrails:
  - "Never extrapolate timeline commitments from vague language"
  - "Confidence percentages based on evidence, not optimism"
  - "All dates are specific, not 'soon' or 'next quarter'"
  - "Flag when data is stale or incomplete"

imports: []

tags: ["commercial", "pipeline", "forecast", "coverage", "prioritization"]
