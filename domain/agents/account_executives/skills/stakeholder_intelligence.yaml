# SK_AE_003: Stakeholder Intelligence
# Extracted from: account_executives/prompts/tasks.yaml stakeholder_intelligence section

skill_id: "SK_AE_003"
name: "Stakeholder Intelligence"
description: "Map stakeholder relationships and influence, assess champion health, and prepare executive briefs"
version: 1
owner: "ae_agent"
category: "commercial_analysis"

workflow:
  - step: 1
    action: "Map decision-making unit: key players, sentiment, influence dynamics, engagement gaps"
    prompt_ref: "prompts/tasks.yaml#stakeholder_intelligence.relationship_map"
    inputs: ["account_context", "time_period"]
    outputs: ["relationship_map"]

  - step: 2
    action: "Assess champion health: internal selling, authority, engagement, weakening signals"
    prompt_ref: "prompts/tasks.yaml#stakeholder_intelligence.champion_health"
    inputs: ["champion_name", "interaction_history"]
    outputs: ["champion_assessment"]

  - step: 3
    action: "Prepare executive brief: priorities, value delivered, ask, objection handling"
    prompt_ref: "prompts/tasks.yaml#stakeholder_intelligence.executive_brief"
    inputs: ["executive_name", "executive_title", "account_history"]
    outputs: ["executive_brief"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, interaction history, CRM data"
  optional:
    - name: "time_period"
      type: "string"
      description: "Lookback period for relationship analysis"
    - name: "champion_name"
      type: "string"
      description: "Champion name for health check"
    - name: "executive_name"
      type: "string"
      description: "Executive name for brief preparation"
    - name: "executive_title"
      type: "string"
      description: "Executive title and role"

outputs:
  - name: "relationship_map"
    type: "object"
    format: "yaml"
    description: "Stakeholder table, relationship gaps, power dynamics, engagement sequence"
  - name: "champion_assessment"
    type: "object"
    format: "yaml"
    description: "Champion strength score (1-10), evidence, risks, strengthening actions"
  - name: "executive_brief"
    type: "object"
    format: "yaml"
    description: "Executive profile, talking points, value summary, ask, objection responses"

quality_criteria:
  - "All stakeholders mentioned exist in source content"
  - "Sentiment based on explicit signals, not assumed"
  - "Champion score supported by specific evidence"
  - "Executive brief tailored to individual priorities"

guardrails:
  - "Never invent stakeholder opinions not stated in source content"
  - "Never create relationship dynamics not evidenced"
  - "Use 'customer indicated' not 'customer decided' when uncertain"
  - "Omit rather than guess at motivations"

imports: []

tags: ["commercial", "stakeholder", "champion", "executive", "relationship"]
