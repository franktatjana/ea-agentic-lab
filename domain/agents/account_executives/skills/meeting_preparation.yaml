# SK_AE_005: Meeting Preparation
# Extracted from: account_executives/prompts/tasks.yaml meeting_prep section

skill_id: "SK_AE_005"
name: "Meeting Preparation"
description: "Prepare customer call briefs, QBR materials, and generate post-call summaries with action items"
version: 1
owner: "ae_agent"
category: "commercial_analysis"

workflow:
  - step: 1
    action: "Prepare call brief: last interaction summary, open items, objectives, questions, risks"
    prompt_ref: "prompts/tasks.yaml#meeting_prep.call_prep"
    inputs: ["account_context", "meeting_date", "attendees", "meeting_purpose"]
    outputs: ["call_brief"]

  - step: 2
    action: "Prepare QBR: value delivered, adoption metrics, open issues, expansion points, forecast"
    prompt_ref: "prompts/tasks.yaml#meeting_prep.qbr_prep"
    inputs: ["account_context", "arr", "qbr_type"]
    outputs: ["qbr_materials"]

  - step: 3
    action: "Create post-call summary: discussion points, decisions, commitments, sentiment, CRM updates"
    prompt_ref: "prompts/tasks.yaml#meeting_prep.post_call_summary"
    inputs: ["call_notes"]
    outputs: ["post_call_summary"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, relationship history, CRM data"
  optional:
    - name: "meeting_date"
      type: "string"
      description: "Upcoming meeting date"
    - name: "attendees"
      type: "array"
      description: "Meeting attendees and their roles"
    - name: "meeting_purpose"
      type: "string"
      description: "Purpose of the upcoming meeting"
    - name: "arr"
      type: "number"
      description: "Account ARR for QBR context"
    - name: "qbr_type"
      type: "string"
      description: "QBR type: internal_sales or customer_facing"
    - name: "call_notes"
      type: "string"
      description: "Raw call notes for post-call summary"

outputs:
  - name: "call_brief"
    type: "object"
    format: "yaml"
    description: "Last interaction summary, open items, objectives, questions, risks to address"
  - name: "qbr_materials"
    type: "object"
    format: "yaml"
    description: "Executive summary, value delivered, health scorecard, discussion points, ask"
  - name: "post_call_summary"
    type: "object"
    format: "yaml"
    description: "3-sentence summary, decisions, action items with owners, follow-up, CRM updates"

quality_criteria:
  - "Call objectives limited to 3 actionable items"
  - "QBR content quantified where possible"
  - "Post-call action items have owners and due dates"
  - "Sentiment assessment based on explicit signals"

guardrails:
  - "Never fabricate prior interactions"
  - "Post-call sentiment based on stated content, not assumed mood"
  - "QBR value claims must be evidence-backed"
  - "CRM update recommendations are suggestions, not automatic changes"

imports: []

tags: ["commercial", "meeting", "preparation", "qbr", "post-call"]
