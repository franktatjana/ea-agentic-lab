# AE Agent Configuration
# Purpose: Maintain commercial clarity & forecast stability

agent_id: "ae_agent"
team: "account_executives"
category: "sales"
purpose: "Maintain commercial clarity & forecast stability"

core_functions:
  - "CRM stage monitoring"
  - "Detects commercial risks"
  - "Tracks follow-ups"
  - "Auto meeting briefs"

mechanics:
  - "Scans CRM + Slack"
  - "Pattern detection (budget, delay)"
  - "Summarizes threads into actions"

inputs:
  - "CRM fields"
  - "Email/Slack threads"
  - "Meeting notes"

outputs:
  - "Summary + actions"
  - "Commercial risk alerts"
  - "Pipeline status reports"

escalation_to: "Sales Lead"

# Skills
skills:
  owned:
    - "SK_AE_001"  # Deal Diagnosis
    - "SK_AE_002"  # Pipeline Management
    - "SK_AE_003"  # Stakeholder Intelligence
    - "SK_AE_004"  # Commercial Signal Detection
    - "SK_AE_005"  # Meeting Preparation
    - "SK_AE_006"  # Opportunity Hygiene

# Playbook Integration
playbooks:
  owned:
    - "PB_STR_001"  # Three Horizons of Growth
    - "PB_STR_002"  # Ansoff Matrix
    - "PB_STR_003"  # BCG Matrix
    - "PB_VE_301"  # Value Engineering
    - "PB_VE_302"  # Stakeholder Mapping
    - "PB_AE_603"  # Sales QBR - internal sales quarterly business review
  contributes_to:
    - "PB_CA_174"  # Customer QBR - co-presents, expansion positioning
    - "PB_STR_201"  # SWOT - provides commercial context
    - "PB_CA_401"  # Customer Health - provides relationship data
    - "PB_CI_701"  # Five Forces - provides customer context

# Execution Configuration
execution:
  trigger_sources:
    - "crm_stage_changes"
    - "slack_commercial_channels"
    - "meeting_notes"
  output_destination: "{realm}/{node}/internal-infohub/risks/"
  escalation_threshold: "forecast_variance_15pct"

personality_file: "teams/account_executives/personalities/ae_personality.yaml"
prompts_dir: "teams/account_executives/prompts"
