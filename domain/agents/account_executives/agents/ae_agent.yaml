# AE Agent Configuration
# Purpose: Maintain commercial clarity & forecast stability

agent_id: "ae_agent"
team: "account_executives"
category: "sales"
purpose: "Maintain commercial clarity & forecast stability"

core_functions:
  - "Deal progression and close planning"
  - "Pipeline health and forecast accuracy"
  - "Stakeholder mapping and relationship building"
  - "Commercial awareness and market intelligence"
  - "Deal qualification (MEDDPICC)"
  - "Meeting preparation and follow-through"
  - "Deal record accuracy and visibility"
  - "Pipeline generation and prospecting"
  - "Account planning and territory strategy"
  - "Negotiation and commercial structuring"
  - "Executive engagement and sponsorship"
  - "Value communication and business case"
  - "Cross-functional deal coordination"
  - "Competitive positioning"
  - "Deal review and win/loss learning"
  - "Renewal, expansion, and customer growth"

mechanics:
  - "Scans CRM + Slack"
  - "Pattern detection (budget, delay)"
  - "Summarizes threads into actions"

inputs:
  - "CRM fields"
  - "Email/Slack threads"
  - "Meeting notes"

outputs:
  - "Summary + actions"
  - "Commercial risk alerts"
  - "Pipeline status reports"

escalation_to: "Sales Lead"

# Skills
skills:
  owned:
    - "SK_AE_001"  # Deal Diagnosis
    - "SK_AE_002"  # Pipeline Management
    - "SK_AE_003"  # Stakeholder Intelligence
    - "SK_AE_004"  # Commercial Signal Detection
    - "SK_AE_005"  # Meeting Preparation
    - "SK_AE_006"  # Opportunity Hygiene

# Playbook Integration (aligned with ae-definition.yaml playbook_raci)
playbooks:
  owned:
    - "PB_AE_002"  # Account Planning
    - "PB_AE_003"  # Sales QBR
    - "PB_AE_004"  # Opportunity Consult
    - "PB_AE_006"  # MEDDPICC Qualification
    - "PB_AE_005"  # Pipeline Generation Review
  contributes_to:
    - "PB_AE_001"  # Deal Retrospective (consulted, retrospective-agent owns)
    - "OP_COM_001"  # Update Commercial Fields
    - "PB_STR_001"  # Three Horizons (consulted)
    - "PB_STR_002"  # Ansoff Matrix (consulted)
    - "PB_STR_003"  # BCG Matrix (consulted)
    - "PB_STR_004"  # SWOT (consulted)
    - "PB_CA_001"  # Customer QBR (consulted)
    - "PB_CA_007"  # Customer Health (consulted)
    - "PB_CI_001"  # Five Forces (consulted)

# Execution Configuration
execution:
  trigger_sources:
    - "crm_stage_changes"
    - "slack_commercial_channels"
    - "meeting_notes"
  output_destination: "{realm}/{node}/internal-infohub/risks/"
  escalation_threshold: "forecast_variance_15pct"

personality_file: "teams/account_executives/personalities/ae_personality.yaml"
prompts_dir: "teams/account_executives/prompts"
