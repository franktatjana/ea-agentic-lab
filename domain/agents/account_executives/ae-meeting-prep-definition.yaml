# AE Meeting Preparation Agent
# Sub-agent of Account Executive Agent (ae-agent)
# Owns: call preparation briefs, QBR materials, post-call summaries
#
# LICENSE: CC BY 4.0 — https://creativecommons.org/licenses/by/4.0/

agentspec_version: "26.1.0"
component_type: Agent

id: ae-meeting-prep-agent
name: AE Meeting Preparation Agent
description: >
  The AE's biggest time sink is pulling context from five different systems
  before a call. This agent assembles call briefs with commercial context
  and risks, builds QBR materials around value delivered, and captures
  post-call action items so nothing agreed in the meeting gets lost.

metadata:
  definition_version: "0.1.0"
  parent_agent: ae-agent
  tags:
    - meeting-prep
    - call-brief
    - qbr
    - post-call
  responsibility: >
    Ensure every customer meeting has preparation context and every call
    produces a structured summary with captured actions and decisions.

system_prompt: |
  You are a Meeting Preparation Agent, part of the Account Executive
  intelligence system. Your job is to make every meeting productive.

  You MUST:
  - Prepare call briefs with last interaction summary, open items, objectives, risks
  - Generate QBR materials with value delivered, adoption metrics, expansion points
  - Produce post-call summaries with decisions, action items (owner + due date), CRM updates
  - Pull context from CRM and recent communications
  - All dates must be specific, all values must include currency units

  You MUST NOT:
  - Write risk alerts (you are read-only)
  - Diagnose deal health or pipeline metrics (other agents' domains)
  - Scan communications for commercial signals (Signal Detection Agent's domain)
  - Invent discussion points not grounded in account data
  - Assume meeting outcomes not stated in call notes

  Post-call summaries must capture exactly what was said and decided.
  Never add interpretations or assumed commitments.

human_in_the_loop: true

tools:
  - component_type: ClientTool
    id: read-crm-data
    name: Read CRM Data
    description: Access account history, opportunity data, and recent interactions
    requires_confirmation: false
    inputs:
      - title: query
        type: string
    outputs:
      - title: crm_data
        type: object
    x-ea-agent:
      risk: low

  - component_type: ClientTool
    id: read-communications
    name: Read Communications
    description: Access recent emails, Slack threads, and meeting notes for context
    requires_confirmation: false
    inputs:
      - title: source_type
        type: string
      - title: account_name
        type: string
    outputs:
      - title: content
        type: string
    x-ea-agent:
      risk: low

  - component_type: ClientTool
    id: ask-user
    name: Ask User
    description: Request clarification about meeting purpose or attendee context
    requires_confirmation: false
    inputs:
      - title: question
        type: string
    outputs:
      - title: answer
        type: string
    x-ea-agent:
      risk: low

toolboxes:
  - component_type: Toolbox
    id: meeting-intelligence
    name: Meeting Intelligence
    description: Call briefs and post-call summaries available to peer agents for context
    tools:
      - id: get-call-brief
        name: Get Call Brief
        description: Returns preparation brief for upcoming meeting with context, open items, and risks
        inputs:
          - title: account_name
            type: string
          - title: meeting_date
            type: string
        outputs:
          - title: call_brief
            type: object
      - id: get-post-call-summary
        name: Get Post-Call Summary
        description: Returns structured call summary with decisions, action items, and CRM update recommendations
        inputs:
          - title: account_name
            type: string
          - title: call_date
            type: string
        outputs:
          - title: post_call_summary
            type: object
specialized_agents: []

flows:
  - component_type: Flow
    id: meeting-preparation
    name: Meeting Preparation
    description: Prepare customer call briefs, QBR materials, and generate post-call summaries with action items.
    inputs:
      - title: account_context
        type: object
      - title: meeting_date
        type: string
      - title: attendees
        type: array
      - title: call_notes
        type: string
    outputs:
      - title: call_brief
        type: object
      - title: qbr_materials
        type: object
      - title: post_call_summary
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: ae-call-prep
          input: account_context, meeting_date, attendees, meeting_purpose
          description: Last interaction summary, open items, objectives, questions, risks
        - step: 2
          prompt: ae-qbr-prep
          input: account_context, arr, qbr_type
          description: Value delivered, adoption metrics, health scorecard, expansion points
        - step: 3
          prompt: ae-post-call-summary
          input: call_notes
          description: Executive summary, decisions, action items with owners, follow-up, CRM updates

  - component_type: Flow
    id: discovery-preparation
    name: Discovery Call Preparation
    description: Prepare structured discovery call with persona-tailored questions mapped to MEDDPICC dimensions.
    inputs:
      - title: account_context
        type: object
      - title: attendee_roles
        type: array
      - title: known_pain_points
        type: array
    outputs:
      - title: discovery_plan
        type: object
      - title: question_set
        type: array
      - title: evidence_mapping
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: ae-discovery-plan
          input: account_context, attendee_roles, known_pain_points
          description: Build discovery plan with persona-specific questions, MEDDPICC mapping, and objection preparation

a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: "0.1"
    capabilities:
      - call-preparation
      - qbr-materials
      - post-call-summaries
      - discovery-planning
    input_modes:
      - text/plain
      - application/json
    output_modes:
      - application/json
      - text/markdown

x-ea-agent:

  prompt_registry:
    ae-call-prep:
      description: Prepare for upcoming customer call with brief covering context, open items, and risks
      source: prompts/tasks.yaml#meeting_prep.call_prep
      inputs:
        - title: account_name
          type: string
        - title: date
          type: string
        - title: attendees
          type: array
        - title: meeting_purpose
          type: string
      outputs:
        - title: call_brief
          type: object

    ae-qbr-prep:
      description: Prepare Quarterly Business Review materials with value delivered and forward-looking discussion
      source: prompts/tasks.yaml#meeting_prep.qbr_prep
      inputs:
        - title: account_name
          type: string
        - title: arr
          type: number
        - title: qbr_type
          type: string
      outputs:
        - title: qbr_materials
          type: object

    ae-post-call-summary:
      description: Summarize call and extract action items, decisions, and CRM update recommendations
      source: prompts/tasks.yaml#meeting_prep.post_call_summary
      inputs:
        - title: account_name
          type: string
        - title: call_notes
          type: string
      outputs:
        - title: post_call_summary
          type: object

    ae-discovery-plan:
      description: Build structured discovery plan with persona-tailored questions and MEDDPICC evidence mapping
      source: prompts/tasks.yaml#meeting_prep.discovery_plan
      inputs:
        - title: account_context
          type: object
        - title: attendee_roles
          type: array
        - title: known_pain_points
          type: array
      outputs:
        - title: discovery_plan
          type: object

  boundaries:
    - Meeting lifecycle only (before, during debrief, after)
    - Read-only, does not write risk alerts or modify CRM data
    - Does not diagnose deals, manage pipeline, or scan for signals
    - Does not add interpretations beyond what's stated in source content

  permissions:
    - Read CRM account history and opportunity context
    - Read recent communications for meeting preparation context
    - Generate call briefs, QBR materials, and post-call summaries
    - Recommend CRM updates based on call outcomes (for human review)

  guardrails:
    input_validation:
      - Reject call prep without account context and meeting date
      - Reject QBR prep without ARR data and QBR type
      - Reject post-call summary without call notes
    output_checks:
      - Call objectives limited to 3 actionable items
      - QBR value claims must be quantified and evidence-backed
      - Post-call action items must have owners and due dates
      - All dates specific, all values with currency units
    signal_validation:
      - Never fabricate prior interactions not in account history
      - Post-call sentiment based on stated content, not assumed mood
      - Discussion points must be grounded in account data
      - CRM update recommendations are suggestions, not automatic changes

  knowledge:
    references:
      - path: references/meeting-standards.yaml
        description: Call brief structure, QBR format and sections, post-call summary template, action item standards
        load_when: Preparing call briefs, QBR materials, or post-call summaries
      - path: references/discovery-framework.yaml
        description: Discovery question hierarchy (situation/problem/implication/need-payoff), per-persona focus areas, MEDDPICC evidence mapping
        load_when: Preparing discovery calls or structuring qualification-focused meetings
      - path: references/objection-handling.yaml
        description: Objection handling process (acknowledge/clarify/respond/confirm), common objection categories with response strategies
        load_when: Preparing for meetings where objections are expected or value justification is needed
      - path: references/value-framework.yaml
        description: Value articulation structure (why now, value driver, why us, cost of inaction), before/after scenario format
        load_when: Preparing value-focused meetings, executive presentations, or business case discussions
      - path: references/negotiation-framework.yaml
        description: Negotiation preparation, pricing strategy, concession trading rules, customer tactics
        load_when: Preparing for negotiation meetings or commercial term discussions
      - path: references/competitive-displacement.yaml
        description: Incumbent analysis, positioning strategies, FUD defense, competitive traps
        load_when: Preparing for meetings where competitive positioning or displacement is expected
      - path: references/roi-methodology.yaml
        description: ROI model structure, TCO comparison, business case format, sensitivity analysis, value realization timeline
        load_when: Preparing business case presentations, executive value meetings, or QBR value sections

  autonomy:
    triggers:
      - type: parent_dispatch
        source: ae-agent
        description: AE orchestrator routes meeting prep and debrief requests
      - type: event
        source: calendar_api
        condition: meeting.time - now <= 24h AND meeting.type IN [customer, prospect]
        description: Auto-generates call brief 24h before customer meetings
      - type: downstream
        source: ae-stakeholder-agent
        condition: new_executive_identified == true
        payload_expected: [executive_profile, relationship_context]
        description: New executive triggers introductory meeting briefing
      - type: downstream
        source: ae-qualification-agent
        condition: unknown_dimensions >= 3
        payload_expected: [gap_analysis, discovery_targets]
        description: Qualification gaps trigger discovery meeting preparation
    outputs:
      - type: parent_return
        target: ae-agent
        payload: [call_brief, qbr_materials, post_call_summary, discovery_plan]
        description: Meeting materials back to orchestrator
      - type: trigger_agent
        target: ae-opportunity-hygiene-agent
        condition: post_call_summary.generated == true
        payload: [post_call_summary, crm_update_recommendations]
        description: Post-call summary triggers CRM hygiene update
      - type: notify_human
        condition: call_brief.ready == true
        channel: notification
        description: Call brief ready notification sent to AE before meeting
    dependencies:
      - agent: ae-stakeholder-agent
        toolbox: stakeholder-intelligence
        tools: [get-stakeholder-map, get-champion-status]
        purpose: Attendee relationships and champion health for meeting context
      - agent: ae-signal-detection-agent
        toolbox: signal-intelligence
        tools: [get-commercial-signals]
        purpose: Latest signals to include in call briefs and talking points
      - agent: ae-qualification-agent
        toolbox: qualification-data
        tools: [get-qualification-gaps]
        purpose: Qualification gaps to address during meetings
