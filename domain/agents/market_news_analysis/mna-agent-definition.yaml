  description: node_data
- title: task_type
  type: string
  description: Which task to perform
- title: personality
  type: string
  description: Personality variant to use
  default: default
- title: output_format
  type: string
  description: Response format
  default: markdown
outputs:
- title: artifacts
  type: object
  description: artifacts
- title: signals
  type: object
  description: signals
tools:
- component_type: ClientTool
