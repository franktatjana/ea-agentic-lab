x-ea-agent:
  profile:
    human_matters_goal: >
      Every deal team receives timely, relevant market intelligence, but the AE decides
      what the news means for the customer relationship, whether it warrants an immediate
      conversation, and how to translate a market event into a commercial opportunity or
      defensive action that no automated digest can replace.
    role_tab_intro: >
      The Market News Analyst is the early-warning system for account teams. Earnings
      releases, M&A announcements, leadership changes, and regulatory shifts all carry
      signals that affect active deals. The challenges below show where critical
      intelligence arrives too late, lacks context, or never reaches the right team,
      each mapped to the sub-agent built to close the gap.
    goals_summary: >
      The Market News Analyst succeeds when high-impact news reaches deal teams before
      the next customer interaction, every digest connects events to active opportunities,
      and no material market development goes undetected.
    goals:
      - High-impact news (M&A, leadership change, earnings signal) reaches affected deal teams within 24 hours of public disclosure
      - 100% of target-account earnings reports scanned and technology-relevant signals extracted within 48 hours of release
      - Weekly realm digests delivered every Monday covering the prior 7-day window with zero missed material events
      - Weekly node digests delivered for every active node with solution-domain and competitor developments
      - Impact assessments cross-reference at least 3 contextual data points per affected account
      - Trend pattern reports surface emerging themes within 30 days of third occurrence across accounts
      - News classification accuracy (realm vs. node) validated at 90%+ against human review
      - Regulatory impact scans cover all active nodes within 72 hours of new regulation or guidance publication
      - Strategic initiative tracking updates delivered within 1 week of any public progress indicator
      - Leadership change alerts include stakeholder relationship impact and suggested next steps
      - False-positive rate on urgent alerts stays below 15% so deal teams trust the signal
      - Competitor news scans identify positioning-relevant moves before the next customer meeting
    key_metrics:
      - "Detection latency: hours between public disclosure and alert delivery to affected deal teams"
      - "Signal coverage: percentage of target-account material events detected vs. total events confirmed post-hoc"
      - "Digest completeness: percentage of weekly digests delivered on schedule with zero missed material events"
      - "Impact assessment depth: average contextual data points cross-referenced per assessment"
      - "Alert precision: percentage of urgent alerts confirmed as actionable by deal teams (target >85%)"
      - "Trend detection lead time: days between pattern emergence and first trend report delivery"
    key_responsibilities:
      - "Company News Scanning: monitor public sources for M&A, earnings, partnerships, restructuring, and strategic announcements at target accounts"
      - "Leadership Monitoring: detect C-suite and VP-level changes at realm companies and assess impact on active stakeholder relationships"
      - "Strategic Initiative Tracking: track progress on publicly announced digital transformation, cloud migration, and platform consolidation programs"
      - "Solution Domain Scanning: monitor industry and technology news relevant to active node solution domains"
      - "Competitor News Monitoring: scan for competitor announcements, product launches, partnerships, and positioning changes affecting active nodes"
      - "Regulatory Impact Scanning: detect regulatory and compliance changes that affect solution domains of active engagements"
      - "Realm Digest Generation: compile weekly company-level news digests connecting events to active opportunities and risks"
      - "Node Digest Generation: compile weekly solution-domain digests with competitor and industry context per active node"
      - "News Impact Assessment: score individual news items for urgency and relevance, cross-referencing deal stage, competitive exposure, and account context"
      - "Trend Pattern Analysis: detect emerging patterns across multiple news items and surface themes before they become obvious"
      - "Urgent Alert Routing: trigger immediate signals to downstream agents when high-impact events are detected"
      - "Source Evidence Management: maintain source attribution and evidence trails for every insight delivered"
      - "Signal Enrichment: connect raw news events to realm profiles, node contexts, and active engagement data for contextual delivery"
    sub_agents:
      - name: MNA Realm News Agent
        id: mna-realm-news-agent
        purpose: Company news scanning, initiative tracking, leadership monitoring. Detects realm-level developments at target accounts and enriches realm profiles with verified recent intelligence.
      - name: MNA Node News Agent
        id: mna-node-news-agent
        purpose: Solution domain and competitor news at node level. Scans industry, technology, regulatory, and competitive developments relevant to active node solution domains.
      - name: MNA Digest Agent
        id: mna-digest-agent
        purpose: Weekly realm and node digest generation. Compiles structured weekly digests that connect news events to active opportunities, risks, and engagement context.
      - name: MNA Impact Agent
        id: mna-impact-agent
        purpose: News impact assessment and trend pattern analysis. Scores news items for urgency and relevance, cross-references contextual data, and surfaces emerging patterns across accounts.
    role_context: 'M&A activity, earnings announcements, and leadership changes at target accounts can make or break active deals. This information needs to reach the account team quickly, with context
      about how it affects their specific opportunity.

      '
    scenarios:
    - problem: M&A activity at a target account is noticed days late
      why: 'Mergers, acquisitions, and divestitures reshape buying authority, budget allocation, and technology strategy overnight. When the account team learns about it from a customer mention rather than
        from proactive monitoring, they lose the window to reposition the engagement and risk being caught flat-footed.

        '
      agent: mna-agent
      agent_response: 'The agent continuously scans public news sources for company developments, scores them for relevance and urgency against active engagements, and triggers immediate alerts for high-impact
        events like M&A activity. The deal team receives a structured impact assessment connecting the news to their specific opportunity before the next customer interaction.

        '
      success_signal:
        metric: High-impact news detection latency
        target: Alert deal teams within 24 hours of public M&A or leadership announcements
        leading_indicator: Account teams adjust engagement strategy based on news alerts
        failure_signal: Deal teams learn about major account events from customers rather than internal alerts
    - problem: Buying signals in earnings reports go unnoticed
      why: 'Earnings calls and financial disclosures contain technology investment signals, strategic priority shifts, and budget indicators. These signals are buried in hours of transcripts and filings
        that nobody on the account team has time to read, so technology-relevant mentions are missed.

        '
      agent: mna-agent
      agent_response: 'The agent scans earnings call transcripts and financial disclosures for technology-relevant mentions, classifies them as realm-level or node-level signals, and generates structured
        digests with actionable insights. It connects financial signals to active engagement opportunities so deal teams can adjust their positioning.

        '
      success_signal:
        metric: Financial signal capture rate from target account disclosures
        target: Extract and classify technology-relevant signals from 100% of target account earnings reports
        leading_indicator: Weekly digests contain actionable financial signals linked to active deals
        failure_signal: Technology investment signals from earnings calls are only discovered months later
    - problem: Impact assessment requires cross-referencing multiple sources
      why: 'A single market event, such as a competitor acquisition or a regulatory change, affects different accounts in different ways. Assessing impact requires combining the event with account context,
        deal stage, competitive exposure, and industry dynamics. This cross-referencing happens manually and slowly, so assessments arrive too late to inform strategy.

        '
      agent: mna-agent
      agent_response: 'The agent correlates market events with account profiles, deal stages, and competitive context to generate multi-dimensional impact assessments. It classifies each event by urgency
        and relevance per affected account, links the assessment to specific deal risks or opportunities, and delivers a structured brief that eliminates manual cross-referencing.

        '
      success_signal:
        metric: Cross-referenced impact assessment delivery time
        target: Multi-source impact assessments delivered within 48 hours of event detection
        leading_indicator: Assessments reference at least 3 contextual data points per affected account
        failure_signal: Impact assessments are single-source or arrive after the deal team has already responded
    challenges:
    - text: Market events at target accounts are noticed days after public disclosure, so deal teams react instead of anticipate
      solved_by: mna-realm-news-agent
      specific_overhead:
        - Setting up and maintaining Google Alerts for every target account
        - Checking 5-10 news sources daily per account for relevant developments
      source: "Meltwater: organizations with automated news monitoring detect material events 3-5x faster than manual approaches"
    - text: Impact assessment requires cross-referencing news with account context, deal stage, and competitive exposure, which happens too slowly to inform strategy
      solved_by: mna-impact-agent
      specific_overhead:
        - Manually combining news events with CRM data, stakeholder maps, and competitive context
        - Assessing how the same event affects different deals differently
      source: "Cision: news impact analysis without contextual automation averages 4-6 hours per event per account"
    - text: Deal teams miss buying signals hidden in earnings calls and financial disclosures because nobody has time to read hours of transcripts
      solved_by: mna-realm-news-agent
      specific_overhead:
        - Scanning earnings call transcripts for technology-relevant mentions
        - Extracting investment signals from financial filings and investor presentations
    - text: Solution-domain and competitor news at the node level is scattered across industry publications, and nobody aggregates it per engagement
      solved_by: mna-node-news-agent
      specific_overhead:
        - Monitoring multiple industry publications and analyst feeds per active node
        - Correlating competitor product announcements with active deal positioning
    - text: Weekly digests are either not produced or arrive without connecting news events to active opportunities, so they get ignored
      solved_by: mna-digest-agent
      specific_overhead:
        - Manually compiling weekly summaries from bookmarked articles and forwarded emails
        - Formatting news items with deal context for each account team
    - text: Regulatory and compliance changes affecting solution domains surface only when customers raise them, putting the vendor on the back foot
      solved_by: mna-node-news-agent
      specific_overhead:
        - Tracking government and regulatory body publications across jurisdictions
        - Assessing which active nodes are affected by new regulations
    - text: Emerging market patterns (e.g., industry consolidation, technology adoption waves) are only recognized after they are obvious, eliminating first-mover advantage
      solved_by: mna-impact-agent
      specific_overhead:
        - Reviewing months of accumulated news items to detect themes retroactively
    administrative_overhead:
    - text: Setting up and maintaining Google Alerts for every target account
      automated_by: mna-realm-news-agent
    - text: Scanning earnings call transcripts for technology-relevant mentions
      automated_by: mna-realm-news-agent
    - text: Forwarding relevant news articles to deal teams with manual context
      automated_by: mna-digest-agent
    - text: Monitoring industry publications for solution-domain developments per node
      automated_by: mna-node-news-agent
    - text: Cross-referencing news events with account profiles and deal stages
      automated_by: mna-impact-agent
    - text: Compiling weekly news summaries with engagement context
      automated_by: mna-digest-agent
    capabilities:
    - M&A monitoring and impact assessment
    - Earnings and financial signal tracking
    - Leadership change detection
    - Competitive move assessment
    human_matters_summary: 'News is noise without context. The agent detects relevant developments and scores urgency, but the AE understands what the news really means for the customer''s strategy, decides
      whether it requires an immediate conversation, and translates the business implication into an opportunity or threat. The news is surfaced, but human judgment decides whether it changes the engagement.

      '
    playbook_raci:
      context: >
        The Market News Analyst does not own engagement-level playbooks but contributes
        market intelligence and news analysis to playbooks led by other roles.
      responsible: []
      accountable: []
      consulted:
        - playbook: Industry Deep Dive (PB_II_001)
          scope: Current market news and event context for industry analysis
          team: industry_intelligence
          file: PB_II_001_industry_deep_dive.yaml
        - playbook: Five Forces Competitive Analysis (PB_CI_001)
          scope: Competitor news events and market positioning changes for competitive analysis
          team: competitive_intelligence
          file: PB_CI_001_five_forces.yaml
      informed:
        - playbook: Field Intelligence (PB_FCTO_004)
          scope: Receives field-observed market signals for news correlation
          team: field_cto
        - playbook: Cross-Account Pattern Synthesis (PB_FCTO_001)
          scope: Receives cross-account patterns for market context enrichment
          team: field_cto
    stakeholder_landscape:
      external:
        - role: "CEO / Managing Director: strategic announcements, M&A decisions, corporate direction changes"
          connected_via: mna-realm-news-agent
        - role: "CFO / Investor Relations: earnings disclosures, financial signals, budget allocation indicators"
          connected_via: mna-realm-news-agent
        - role: "CTO / CIO: technology investment signals, digital transformation announcements, platform decisions"
          connected_via: mna-realm-news-agent
        - role: "VP Engineering / IT Director: solution-domain adoption signals, technology bets, vendor evaluations"
          connected_via: mna-node-news-agent
        - role: "Compliance / Regulatory Affairs: regulatory changes, compliance requirements, policy shifts"
          connected_via: mna-node-news-agent
      internal:
        - role: "Account Executives: deal context, engagement priorities, urgency calibration for news alerts"
          connected_via: mna-digest-agent
        - role: "Solution Architects: solution-domain context, technical relevance assessment for node news"
          connected_via: mna-node-news-agent
        - role: "Competitive Intelligence Agent: competitor news events, market positioning changes"
          connected_via: mna-node-news-agent
        - role: "Account Intelligence Agent: account profile data, stakeholder maps, org charts for impact context"
          connected_via: mna-impact-agent
        - role: "Industry Intelligence Agent: industry-level analysis, sector trends, macro-economic context"
          connected_via: mna-impact-agent
        - role: "Field CTO: cross-account patterns, technology direction, executive engagement context"
          connected_via: mna-impact-agent
        - role: "Sales Leadership: escalation for high-impact events, strategic account news briefings"
          connected_via: mna-agent
    activity_map:
      purpose: >
        The Market News Analyst exists to keep account teams ahead of market events that
        affect their deals. Everything the agent does falls into one of these operational
        domains. Each domain is owned by a sub-agent that operates independently with its
        own tools, flows, boundaries, and prompt registry.
      domains:
        - domain: Realm News Intelligence
          why: >
            M&A, earnings, leadership changes, and strategic initiatives at target accounts
            can reshape buying authority, budget allocation, and technology strategy overnight.
            When account teams learn about these events from customers rather than from
            proactive monitoring, they lose the window to reposition.
          agent: mna-realm-news-agent
          contributing_agents:
            - agent: mna-impact-agent
              provides: Urgency scoring and cross-contextual relevance assessment for realm events
          owner: mna-realm-news-agent
          receives: Company names, realm profiles, stakeholder lists, strategic initiative records
          provides: Company news alerts, leadership change notifications, initiative progress updates, earnings signal extracts
          activities:
            - Company news scanning across public sources
            - Strategic initiative progress tracking
            - Leadership and C-suite change detection
            - Earnings and financial disclosure signal extraction
          cadence: continuous scanning, immediate alerts for high-impact events, daily batch for routine signals
        - domain: Node News Intelligence
          why: >
            Solution-domain developments, competitor moves, and regulatory changes at the
            node level directly affect deal positioning and competitive strategy. Without
            systematic scanning, account teams discover these developments from customers
            or after competitors have already acted.
          agent: mna-node-news-agent
          contributing_agents:
            - agent: mna-impact-agent
              provides: Relevance scoring and competitive exposure context for node-level events
          owner: mna-node-news-agent
          receives: Node profiles, solution domains, competitor lists, compliance requirements, operating modes
          provides: Solution-domain news, competitor announcements, regulatory change alerts, technology trend signals
          activities:
            - Solution-domain and industry news scanning
            - Competitor news and product launch monitoring
            - Regulatory and compliance change detection
            - Technology adoption signal tracking
          cadence: continuous scanning, immediate alerts for competitor moves, daily batch for domain news
        - domain: Digest Generation
          why: >
            Individual news items are noise without aggregation and engagement context.
            Account teams need structured weekly summaries that connect events to their
            specific opportunities and risks so they can act on intelligence rather than
            drown in raw alerts.
          agent: mna-digest-agent
          contributing_agents:
            - agent: mna-realm-news-agent
              provides: Realm-level news items with source evidence for digest compilation
            - agent: mna-node-news-agent
              provides: Node-level news items with domain context for digest compilation
          owner: mna-digest-agent
          receives: Realm news items, node news items, active node lists, deal stages, engagement context
          provides: Weekly realm digests, weekly node digests, engagement-contextualized summaries
          activities:
            - Weekly realm digest compilation with engagement context
            - Weekly node digest compilation with competitive and domain context
            - Digest formatting with actionable insight extraction
            - Digest scheduling and delivery coordination
          cadence: weekly on Monday, ad-hoc digests on request
        - domain: Impact Assessment and Trend Analysis
          why: >
            A single market event affects different accounts in different ways. Assessing
            impact requires combining the event with account context, deal stage, competitive
            exposure, and industry dynamics. Without systematic cross-referencing, assessments
            arrive too late or miss critical connections.
          agent: mna-impact-agent
          contributing_agents:
            - agent: mna-realm-news-agent
              provides: Realm context and account profile data for impact scoring
            - agent: mna-node-news-agent
              provides: Node context and competitive exposure data for impact assessment
          owner: mna-impact-agent
          receives: News items, realm profiles, node profiles, deal stages, affected node lists, competitive context
          provides: Impact assessments, urgency scores, trend pattern reports, emerging theme alerts
          activities:
            - Individual news item impact scoring with multi-dimensional context
            - Cross-account trend pattern detection
            - Emerging theme identification and early warning
            - Urgency classification and alert routing
          cadence: per-event for high-impact items, weekly trend review, monthly pattern synthesis
    with_this_agent:
      - domain: Realm News Intelligence
        agent: mna-realm-news-agent
        items:
          - "Company news scanning: detect M&A activity, partnerships, restructuring, and strategic announcements at target accounts"
          - "Earnings signal extraction: scan transcripts and financial disclosures for technology investment and budget signals"
          - "Leadership monitoring: detect C-suite and VP-level changes and assess stakeholder relationship impact"
          - "Initiative tracking: monitor progress on publicly announced digital transformation and platform programs"
      - domain: Node News Intelligence
        agent: mna-node-news-agent
        items:
          - "Solution domain scanning: monitor industry and technology news relevant to active node solution areas"
          - "Competitor monitoring: track competitor announcements, product launches, and positioning changes per node"
          - "Regulatory scanning: detect compliance and regulatory changes affecting node solution domains"
          - "Technology signal tracking: identify emerging technology adoption patterns relevant to active engagements"
      - domain: Digest Generation
        agent: mna-digest-agent
        items:
          - "Realm digests: compile weekly company-level summaries connecting news to active opportunities and risks"
          - "Node digests: compile weekly solution-domain summaries with competitive and industry context"
          - "Insight extraction: surface actionable takeaways from aggregated news items per engagement"
          - "Delivery coordination: ensure digests reach the right teams on schedule with correct context"
      - domain: Impact Assessment and Trend Analysis
        agent: mna-impact-agent
        items:
          - "Impact scoring: assess individual news items for urgency and relevance across affected accounts"
          - "Context cross-referencing: combine news events with deal stage, competitive exposure, and account profile"
          - "Trend detection: identify emerging patterns across multiple news items within and across accounts"
          - "Alert routing: trigger immediate signals to downstream agents for high-impact developments"
    collaboration:
      defer_to:
        - agent: ci-agent
          scope: Competitive strategy development and market positioning analysis
          scenarios:
            - "Competitor news detected that requires strategic competitive response beyond factual reporting"
            - "Market positioning shift identified that needs competitive intelligence framework analysis"
        - agent: ii-agent
          scope: Industry-level analysis, sector trend interpretation, macro-economic context
          scenarios:
            - "News event has industry-wide implications beyond target account scope"
            - "Regulatory change requires deep industry structure analysis"
        - agent: aci-agent
          scope: Account structure research, org chart analysis, stakeholder mapping
          scenarios:
            - "Leadership change requires updated org chart and power map beyond news-level detection"
            - "M&A event requires deep account structure analysis"
        - agent: ae-agent
          scope: Commercial interpretation of news events, engagement strategy decisions
          scenarios:
            - "News event requires commercial judgment on whether to accelerate, pause, or reposition a deal"
            - "Impact assessment needs AE input on deal-specific context not available in data"
      provide_to:
        - agent: ae-agent
          scope: Market intelligence alerts, weekly digests, impact assessments for active deals
          scenarios:
            - "High-impact news detected at target account requiring immediate deal team awareness"
            - "Weekly digest delivered with engagement-contextualized insights"
        - agent: ci-agent
          scope: Competitor news events and market positioning changes for competitive analysis enrichment
          scenarios:
            - "Competitor acquisition or product launch detected that informs competitive positioning"
            - "Market share shift signals from financial disclosures"
        - agent: sa-agent
          scope: Solution-domain news and technology trend signals relevant to active technical engagements
          scenarios:
            - "Technology adoption signal detected that affects active solution design"
            - "Regulatory change impacts architecture requirements for active node"
        - agent: fcto-agent
          scope: Cross-account market patterns and trend signals for field intelligence aggregation
          scenarios:
            - "Market pattern detected across multiple accounts informing cross-account synthesis"
            - "Technology trend signal from news correlates with field observations"
        - agent: ii-agent
          scope: Current market events and news context for industry analysis enrichment
          scenarios:
            - "Industry-relevant news events that add context to ongoing industry deep-dives"
        - agent: risk-radar-agent
          scope: High-impact news events that may affect engagement risk profiles
          scenarios:
            - "M&A or leadership change at target account introduces new engagement risks"
            - "Regulatory change alters compliance landscape for active deal"
    public_resources:
      - title: "Meltwater: Media Intelligence Platform"
        url: https://www.meltwater.com/en/media-monitoring
        context: Enterprise media monitoring and news intelligence platform, reference for automated news scanning workflows and alert design
      - title: "Cision: PR and Media Monitoring"
        url: https://www.cision.com/resources/guides/media-monitoring/
        context: Media monitoring methodology and best practices for tracking company, industry, and competitor news systematically
      - title: "Google Alerts: Web Monitoring"
        url: https://support.google.com/websearch/answer/4815696
        context: Baseline news monitoring approach used by most account teams, represents the manual process this agent automates
      - title: "Gartner: Market Intelligence Best Practices"
        url: https://www.gartner.com/en/sales/topics/market-intelligence
        context: Analyst framework for structuring market intelligence programs and measuring intelligence quality
      - title: "SCIP: Competitive and Market Intelligence"
        url: https://www.scip.org/page/CI-MI-Resources
        context: Strategic and Competitive Intelligence Professionals resources for news impact analysis and intelligence cycle methodology
      - title: "Harvard Business Review: Executive Briefing Design"
        url: https://hbr.org/topic/decision-making-and-problem-solving
        context: Frameworks for structuring executive briefings and distilling market intelligence into actionable decision support
