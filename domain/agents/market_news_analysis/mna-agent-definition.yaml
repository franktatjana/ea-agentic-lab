- component_type: ClientTool
  id: write-mna-artifact
  name: Write Market Artifact
  description: 'Save artifacts: artifacts, signals'
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or additional input from the user
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: mna-agent-proactive
  name: Market News Agent (Proactive)
  description: 'Proactive mode: scans for signals and surfaces insights without prompting'
  agent:
    $component_ref: mna-agent
  agent_specialization_parameters:
    additional_instructions: |
      Focus on proactive detection and early warning. Scan sources
      continuously for relevant signals. Surface insights before being
      asked. Prioritize timeliness over depth. Keep outputs concise and
      action-oriented. Flag anything that needs immediate attention.
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: mna-agent-analytical
  name: Market News Agent (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: mna-agent
  agent_specialization_parameters:
    additional_instructions: |
      Focus on depth and pattern recognition. Provide comprehensive
      analysis with full evidence trails. Synthesize across multiple
      data points. Prioritize accuracy and defensibility over speed.
      Include confidence levels and caveats where appropriate.
    human_in_the_loop: true
flows:
- component_type: Flow
  id: realm-news
  name: Realm News
  description: Flow for realm news tasks.
  inputs:
  - title: company_name
    type: string
  - title: industry
    type: string
  - title: key_relationships
    type: string
  - title: last_updated
    type: string
  - title: realm_id
    type: string
  - title: region
    type: string
  - title: scan_days
    type: string
  - title: stakeholder_names
    type: string
  outputs:
  - title: realm_news_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: mna-company-news-scan
      input: company_name, realm_id, industry, sub_industry
      description: Scan news sources for realm-associated company developments
    - step: 2
      prompt: mna-strategic-initiative-tracking
      input: company_name, strategic_initiatives_list, last_updated
      description: Track progress of known company strategic initiatives
    - step: 3
      prompt: mna-leadership-monitoring
      input: company_name, stakeholder_names, key_relationships
      description: Detect leadership changes at realm companies
- component_type: Flow
  id: node-news
  name: Node News
  description: Flow for node news tasks.
  inputs:
  - title: competitive_summary
    type: string
  - title: competitors
    type: string
  - title: compliance_requirements
    type: string
  - title: domain
    type: string
  - title: industry
    type: string
  - title: node_id
    type: string
  - title: node_name
    type: string
  - title: operating_mode
    type: string
  outputs:
  - title: node_news_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: mna-solution-domain-scan
      input: node_name, node_id, domain, operating_mode
      description: Scan industry and solution news relevant to a specific node
    - step: 2
      prompt: mna-competitor-news-scan
      input: node_name, primary_competitor, secondary_competitors, competitive_summary
      description: Focused scan on competitors active in a node
    - step: 3
      prompt: mna-regulatory-impact-scan
      input: domain, industry, region, compliance_requirements
      description: Scan for regulatory changes affecting node's solution domain
- component_type: Flow
  id: digests
  name: Digests
  description: Flow for digests tasks.
  inputs:
  - title: active_nodes
    type: string
  - title: competitors
    type: string
  - title: deal_stage
    type: string
  - title: domain
    type: string
  - title: end_date
    type: string
  - title: industry
    type: string
  - title: node_id
    type: string
  - title: node_name
    type: string
  outputs:
  - title: digests_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: mna-weekly-realm-digest
      input: realm_name, realm_id, industry, active_nodes
      description: Generate weekly news digest for a realm
    - step: 2
      prompt: mna-weekly-node-digest
      input: node_name, node_id, domain, operating_mode
      description: Generate weekly solution-domain digest for a node
- component_type: Flow
  id: impact
  name: Impact
  description: Flow for impact tasks.
  inputs:
  - title: affected_nodes
    type: string
  - title: date
    type: string
  - title: headline
    type: string
  - title: news_items_summary
    type: string
  - title: period
    type: string
  - title: realm_name
    type: string
  - title: source
    type: string
  outputs:
  - title: impact_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: mna-news-impact-assessment
      input: headline, source, date, realm_name
      description: Assess impact of specific news item on engagement
    - step: 2
      prompt: mna-trend-pattern-analysis
      input: realm_name, news_items_summary, period
      description: Analyze emerging patterns across multiple news items
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - realm-news
    - node-news
    - digests
    - impact
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain

# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:
  profile:
    role_context: >
      M&A activity, earnings announcements, and leadership changes at target
      accounts can make or break active deals. This information needs to reach
      the account team quickly, with context about how it affects their specific
      opportunity.
    challenges:
      - "Market events are noticed days after they happen"
      - "Impact assessment requires cross-referencing multiple sources"
      - "Deal teams miss buying signals hidden in financial events"
    administrative_overhead:
      - "Setting up and maintaining Google Alerts for every target account"
      - "Scanning earnings call transcripts for technology-relevant mentions"
      - "Forwarding relevant news articles to deal teams with manual context"
    capabilities:
      - "M&A monitoring and impact assessment"
      - "Earnings and financial signal tracking"
      - "Leadership change detection"
      - "Competitive move assessment"

  fallback_model: null
  prompt_registry:
    mna-company-news-scan:
      description: Scan news sources for realm-associated company developments
      source: prompts/tasks.yaml#realm_news.company_news_scan
      inputs:
      - title: company_name
        type: string
      - title: industry
        type: string
      - title: realm_id
        type: string
      - title: region
        type: string
      - title: scan_days
        type: string
      - title: strategic_initiatives
        type: string
      outputs:
      - title: company-news-scan_result
        type: object
    mna-strategic-initiative-tracking:
      description: Track progress of known company strategic initiatives
      source: prompts/tasks.yaml#realm_news.strategic_initiative_tracking
      inputs:
      - title: company_name
        type: string
      - title: last_updated
        type: string
      - title: strategic_initiatives_list
