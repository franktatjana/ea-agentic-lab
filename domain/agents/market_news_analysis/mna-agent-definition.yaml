x-ea-agent:
  profile:
    why: >
      Market-moving events, earnings releases, M&A announcements, leadership changes, and
      regulatory shifts, carry signals that affect active deals, but these signals are scattered
      across dozens of news sources with no systematic process to detect, classify, and route
      them to the right deal team before the next customer interaction. AEs and SAs learn about
      critical customer events days or weeks late, miss opportunities to proactively reach out
      after a leadership change, and lack the context to connect a market event to an active
      engagement. The operational cost is reactive account management, missed first-mover
      advantage on breaking news, and deal teams that are consistently less informed than
      their customers expect.
    human_matters_goal: >
      Every deal team receives timely, relevant market intelligence, but the AE decides
      what the news means for the customer relationship, whether it warrants an immediate
      conversation, and how to translate a market event into a commercial opportunity or
      defensive action that no automated digest can replace.
    role_tab_intro: >
      The Market News Analyst is the early-warning system for account teams. Earnings
      releases, M&A announcements, leadership changes, and regulatory shifts all carry
      signals that affect active deals. The challenges below show where critical
      intelligence arrives too late, lacks context, or never reaches the right team,
      each mapped to the sub-agent built to close the gap.
    goals_summary: >
      The Market News Analyst succeeds when high-impact news reaches deal teams before
      the next customer interaction, every digest connects events to active opportunities,
      and no material market development goes undetected.
    goals:
      - High-impact news (M&A, leadership change, earnings signal) reaches affected deal teams within 24 hours of public disclosure
      - 100% of target-account earnings reports scanned and technology-relevant signals extracted within 48 hours of release
      - Weekly realm digests delivered every Monday covering the prior 7-day window with zero missed material events
      - Weekly node digests delivered for every active node with solution-domain and competitor developments
      - Impact assessments cross-reference at least 3 contextual data points per affected account
      - Trend pattern reports surface emerging themes within 30 days of third occurrence across accounts
      - News classification accuracy (realm vs. node) validated at 90%+ against human review
      - Regulatory impact scans cover all active nodes within 72 hours of new regulation or guidance publication
      - Strategic initiative tracking updates delivered within 1 week of any public progress indicator
      - Leadership change alerts include stakeholder relationship impact and suggested next steps
      - False-positive rate on urgent alerts stays below 15% so deal teams trust the signal
      - Competitor news scans identify positioning-relevant moves before the next customer meeting
    key_metrics:
      - "Detection latency: hours between public disclosure and alert delivery to affected deal teams"
      - "Signal coverage: percentage of target-account material events detected vs. total events confirmed post-hoc"
      - "Digest completeness: percentage of weekly digests delivered on schedule with zero missed material events"
      - "Impact assessment depth: average contextual data points cross-referenced per assessment"
      - "Alert precision: percentage of urgent alerts confirmed as actionable by deal teams (target >85%)"
      - "Trend detection lead time: days between pattern emergence and first trend report delivery"
    key_responsibilities:
      - "Company News Scanning: monitor public sources for M&A, earnings, partnerships, restructuring, and strategic announcements at target accounts"
      - "Leadership Monitoring: detect C-suite and VP-level changes at realm companies and assess impact on active stakeholder relationships"
      - "Strategic Initiative Tracking: track progress on publicly announced digital transformation, cloud migration, and platform consolidation programs"
      - "Solution Domain Scanning: monitor industry and technology news relevant to active node solution domains"
      - "Competitor News Monitoring: scan for competitor announcements, product launches, partnerships, and positioning changes affecting active nodes"
      - "Regulatory Impact Scanning: detect regulatory and compliance changes that affect solution domains of active engagements"
      - "Realm Digest Generation: compile weekly company-level news digests connecting events to active opportunities and risks"
      - "Node Digest Generation: compile weekly solution-domain digests with competitor and industry context per active node"
      - "News Impact Assessment: score individual news items for urgency and relevance, cross-referencing deal stage, competitive exposure, and account context"
      - "Trend Pattern Analysis: detect emerging patterns across multiple news items and surface themes before they become obvious"
      - "Urgent Alert Routing: trigger immediate signals to downstream agents when high-impact events are detected"
      - "Source Evidence Management: maintain source attribution and evidence trails for every insight delivered"
      - "Signal Enrichment: connect raw news events to realm profiles, node contexts, and active engagement data for contextual delivery"
    sub_agents:
      - name: MNA Realm News Agent
        id: mna-realm-news-agent
        purpose: Company news scanning, initiative tracking, leadership monitoring. Detects realm-level developments at target accounts and enriches realm profiles with verified recent intelligence.
      - name: MNA Node News Agent
        id: mna-node-news-agent
        purpose: Solution domain and competitor news at node level. Scans industry, technology, regulatory, and competitive developments relevant to active node solution domains.
      - name: MNA Digest Agent
        id: mna-digest-agent
        purpose: Weekly realm and node digest generation. Compiles structured weekly digests that connect news events to active opportunities, risks, and engagement context.
      - name: MNA Impact Agent
        id: mna-impact-agent
        purpose: News impact assessment and trend pattern analysis. Scores news items for urgency and relevance, cross-references contextual data, and surfaces emerging patterns across accounts.
    role_context: 'M&A activity, earnings announcements, and leadership changes at target accounts can make or break active deals. This information needs to reach the account team quickly, with context
      about how it affects their specific opportunity.

      '
    scenarios:
    - problem: M&A activity at a target account is noticed days late
      why: 'Mergers, acquisitions, and divestitures reshape buying authority, budget allocation, and technology strategy overnight. When the account team learns about it from a customer mention rather than
        from proactive monitoring, they lose the window to reposition the engagement and risk being caught flat-footed.

        '
      agent: mna-agent
      agent_response: 'The agent continuously scans public news sources for company developments, scores them for relevance and urgency against active engagements, and triggers immediate alerts for high-impact
        events like M&A activity. The deal team receives a structured impact assessment connecting the news to their specific opportunity before the next customer interaction.

        '
      success_signal:
        metric: High-impact news detection latency
        target: Alert deal teams within 24 hours of public M&A or leadership announcements
        leading_indicator: Account teams adjust engagement strategy based on news alerts
        failure_signal: Deal teams learn about major account events from customers rather than internal alerts
    - problem: Buying signals in earnings reports go unnoticed
      why: 'Earnings calls and financial disclosures contain technology investment signals, strategic priority shifts, and budget indicators. These signals are buried in hours of transcripts and filings
        that nobody on the account team has time to read, so technology-relevant mentions are missed.

        '
      agent: mna-agent
      agent_response: 'The agent scans earnings call transcripts and financial disclosures for technology-relevant mentions, classifies them as realm-level or node-level signals, and generates structured
        digests with actionable insights. It connects financial signals to active engagement opportunities so deal teams can adjust their positioning.

        '
      success_signal:
        metric: Financial signal capture rate from target account disclosures
        target: Extract and classify technology-relevant signals from 100% of target account earnings reports
        leading_indicator: Weekly digests contain actionable financial signals linked to active deals
        failure_signal: Technology investment signals from earnings calls are only discovered months later
    - problem: Impact assessment requires cross-referencing multiple sources
      why: 'A single market event, such as a competitor acquisition or a regulatory change, affects different accounts in different ways. Assessing impact requires combining the event with account context,
        deal stage, competitive exposure, and industry dynamics. This cross-referencing happens manually and slowly, so assessments arrive too late to inform strategy.

        '
      agent: mna-agent
      agent_response: 'The agent correlates market events with account profiles, deal stages, and competitive context to generate multi-dimensional impact assessments. It classifies each event by urgency
        and relevance per affected account, links the assessment to specific deal risks or opportunities, and delivers a structured brief that eliminates manual cross-referencing.

        '
      success_signal:
        metric: Cross-referenced impact assessment delivery time
        target: Multi-source impact assessments delivered within 48 hours of event detection
        leading_indicator: Assessments reference at least 3 contextual data points per affected account
        failure_signal: Impact assessments are single-source or arrive after the deal team has already responded
    challenges:
    - text: Market events at target accounts are noticed days after public disclosure, so deal teams react instead of anticipate
      solved_by: mna-realm-news-agent
      category: "Company News Scanning"
      specific_overhead:
        - Setting up and maintaining Google Alerts for every target account
        - Checking 5-10 news sources daily per account for relevant developments
      source: "Meltwater: organizations with automated news monitoring detect material events 3-5x faster than manual approaches"
    - text: Impact assessment requires cross-referencing news with account context, deal stage, and competitive exposure, which happens too slowly to inform strategy
      solved_by: mna-impact-agent
      category: "News Impact Assessment"
      specific_overhead:
        - Manually combining news events with CRM data, stakeholder maps, and competitive context
        - Assessing how the same event affects different deals differently
      source: "Cision: news impact analysis without contextual automation averages 4-6 hours per event per account"
    - text: Deal teams miss buying signals hidden in earnings calls and financial disclosures because nobody has time to read hours of transcripts
      solved_by: mna-realm-news-agent
      category: "Company News Scanning"
      specific_overhead:
        - Scanning earnings call transcripts for technology-relevant mentions
        - Extracting investment signals from financial filings and investor presentations
    - text: Solution-domain and competitor news at the node level is scattered across industry publications, and nobody aggregates it per engagement
      solved_by: mna-node-news-agent
      category: "Solution Domain Intelligence"
      specific_overhead:
        - Monitoring multiple industry publications and analyst feeds per active node
        - Correlating competitor product announcements with active deal positioning
    - text: Weekly digests are either not produced or arrive without connecting news events to active opportunities, so they get ignored
      solved_by: mna-digest-agent
      category: "Realm Digest Generation"
      specific_overhead:
        - Manually compiling weekly summaries from bookmarked articles and forwarded emails
        - Formatting news items with deal context for each account team
    - text: Regulatory and compliance changes affecting solution domains surface only when customers raise them, putting the vendor on the back foot
      solved_by: mna-node-news-agent
      category: "Regulatory and Compliance Scanning"
      specific_overhead:
        - Tracking government and regulatory body publications across jurisdictions
        - Assessing which active nodes are affected by new regulations
    - text: Emerging market patterns (e.g., industry consolidation, technology adoption waves) are only recognized after they are obvious, eliminating first-mover advantage
      solved_by: mna-impact-agent
      category: "Trend Pattern Detection"
      specific_overhead:
        - Reviewing months of accumulated news items to detect themes retroactively
        - Identifying cross-account signal clusters that indicate a developing trend
    - text: Leadership changes at VP level and above alter buying authority and vendor relationships, but account teams learn about appointments through customer conversations rather than proactive monitoring
      solved_by: mna-realm-news-agent
      category: "Leadership and Initiative Tracking"
      specific_overhead:
        - Manually tracking executive appointment and departure announcements for every target account
        - Re-mapping stakeholder relationships after leadership transitions that affect deal sponsorship
      source: "Korn Ferry: 40% of new C-suite hires replace incumbent vendors within 18 months of appointment"
    - text: Node-level digests reach account teams without competitive framing, so a competitor product launch appears in the same digest as routine domain news with no signal that it demands immediate attention
      solved_by: mna-digest-agent
      category: "Node Digest Generation"
      specific_overhead:
        - Manually separating high-urgency competitive events from routine industry updates within digest compilation
        - Applying deal-stage relevance context to each digest item before distribution
    - text: Cross-account budget freeze signals and adoption waves go undetected because each account is analyzed in isolation without aggregating patterns across the portfolio
      solved_by: mna-impact-agent
      category: "Trend Pattern Detection"
      specific_overhead:
        - Manually comparing news timelines across multiple accounts to identify shared patterns
        - Producing cross-portfolio trend summaries from individually reviewed event logs
    - text: Strategic initiative announcements at target accounts (digital transformation programs, platform consolidations) go untracked because monitoring focuses on product news rather than corporate program updates
      solved_by: mna-realm-news-agent
      category: "Leadership and Initiative Tracking"
      specific_overhead:
        - Monitoring investor day presentations, annual reports, and press releases for initiative announcements
        - Mapping announced strategic programs to active opportunities and timing windows
    - text: Competitive product launches in active solution domains reach deal teams through customer mentions at discovery calls rather than through proactive intelligence, eliminating the positioning window
      solved_by: mna-node-news-agent
      category: "Solution Domain Intelligence"
      specific_overhead:
        - Tracking competitor product roadmaps, release announcements, and beta program signals across analyst and press coverage
        - Assessing how each competitor launch shifts the positioning of active proposals in the same node
    administrative_overhead:
    - text: Setting up and maintaining Google Alerts for every target account
      automated_by: mna-realm-news-agent
    - text: Scanning earnings call transcripts for technology-relevant mentions
      automated_by: mna-realm-news-agent
    - text: Forwarding relevant news articles to deal teams with manual context
      automated_by: mna-digest-agent
    - text: Monitoring industry publications for solution-domain developments per node
      automated_by: mna-node-news-agent
    - text: Cross-referencing news events with account profiles and deal stages
      automated_by: mna-impact-agent
    - text: Compiling weekly news summaries with engagement context
      automated_by: mna-digest-agent
    capabilities:
    - M&A monitoring and impact assessment
    - Earnings and financial signal tracking
    - Leadership change detection
    - Competitive move assessment
    human_matters_summary: 'News is noise without context. The agent detects relevant developments and scores urgency, but the AE understands what the news really means for the customer''s strategy, decides
      whether it requires an immediate conversation, and translates the business implication into an opportunity or threat. The news is surfaced, but human judgment decides whether it changes the engagement.

      '
    playbook_raci:
      context: 'The Market News Analyst does not own engagement-level playbooks but contributes market intelligence and news analysis to playbooks led by other roles.
'
      responsible:
      - playbook: News Digest Generation (PB_MNA_001)
        scope: Generate prioritized news digests for realm and node contexts, connecting market
        team: market_news_analysis
        file: PB_MNA_001_news_digest.yaml
      - playbook: News Impact Assessment (PB_MNA_002)
        scope: Assess the impact of a specific market event on active engagements, quantify dea
        team: market_news_analysis
        file: PB_MNA_002_impact_assessment.yaml
      consulted:
      - playbook: Industry Deep Dive (PB_II_001)
        scope: Current market news and event context for industry analysis
        team: industry_intelligence
        file: PB_II_001_industry_deep_dive.yaml
      - playbook: Five Forces Competitive Analysis (PB_CI_001)
        scope: Competitor news events and market positioning changes for competitive analysis
        team: competitive_intelligence
        file: PB_CI_001_five_forces.yaml
      informed:
      - playbook: Field Intelligence (PB_FCTO_004)
        scope: Receives field-observed market signals for news correlation
        team: field_cto
        file: PB_FCTO_004_field_intelligence.yaml
      - playbook: Cross-Account Pattern Synthesis (PB_FCTO_001)
        scope: Receives cross-account patterns for market context enrichment
        team: field_cto
        file: PB_FCTO_001_cross_account_pattern_synthesis.yaml
    stakeholder_landscape:
      customer_side:
      - "CEO/Managing Director: strategic announcements, M&A decisions, corporate direction changes"
      - "CFO/Investor Relations: earnings disclosures, financial signals, budget allocation indicators"
      - "CTO/CIO: technology investment signals, digital transformation announcements, platform decisions"
      - "VP Engineering/IT Director: solution-domain adoption signals, technology bets, vendor evaluations"
      - "Compliance/Regulatory Affairs: regulatory changes, compliance requirements, policy shifts"
      internal_team:
      - "Account Executive: deal context, engagement priorities, urgency calibration for news alerts"
      - "Solution Architect: solution-domain context, technical relevance assessment for node news"
      - "Competitive Intelligence Agent: competitor news events, market positioning changes"
      - "Account Intelligence Agent: account profile data, stakeholder maps, org charts for impact context"
      - "Industry Intelligence Agent: industry-level analysis, sector trends, macro-economic context"
      - "Field CTO: cross-account patterns, technology direction, executive engagement context"
      - "Sales Leadership: escalation for high-impact events, strategic account news briefings"
    activity_map:
      purpose: >
        The Market News Analyst exists to keep account teams ahead of market events that
        affect their deals. Everything the agent does falls into one of these operational
        domains. Each domain is owned by a sub-agent that operates independently with its
        own tools, flows, boundaries, and prompt registry.
      domains:
        - domain: Company News Scanning
          why: >
            M&A activity, earnings disclosures, partnerships, and corporate restructuring at
            target accounts can shift budget authority and technology priorities before account
            teams are aware. Continuous monitoring of company-level news ensures the team
            reacts to structural changes before they affect deal momentum.
          agent: mna-realm-news-agent
          contributing_agents:
            - agent: mna-impact-agent
              provides: Urgency scoring and relevance classification for company-level events
          receives: Company names, realm profiles, active deal lists
          provides: M&A alerts, earnings signal extracts, partnership announcements, restructuring notifications
          activities:
            - Public company news scanning across press, filings, and news aggregators
            - M&A, partnership, and divestiture announcement detection
            - Earnings and financial disclosure signal extraction for technology investment indicators
            - Corporate restructuring and subsidiary change tracking
            - Strategic announcement monitoring tied to active realms
          cadence: continuous scanning, immediate alerts for M&A and earnings events, daily batch for routine signals
        - domain: Leadership and Initiative Tracking
          why: >
            Leadership changes at VP level and above alter buying authority, vendor relationships,
            and technology preferences within months of appointment. Strategic initiative announcements
            signal where budget is moving and open positioning windows that close quickly if missed.
          agent: mna-realm-news-agent
          contributing_agents:
            - agent: mna-impact-agent
              provides: Stakeholder impact scores and deal-stage relevance for leadership events
          receives: Stakeholder lists, realm profiles, strategic initiative records, engagement history
          provides: Leadership change notifications, initiative progress updates, executive appointment alerts
          activities:
            - C-suite and VP-level appointment and departure detection
            - Strategic initiative progress tracking against publicly announced programs
            - Digital transformation and platform program milestone monitoring
            - Board and governance change detection at key accounts
            - Leadership signal enrichment with stakeholder relationship context
          cadence: continuous scanning, immediate alerts for C-suite changes, weekly batch for initiative updates
        - domain: Solution Domain Intelligence
          why: >
            New product launches, technology announcements, and competitor moves within an active
            node's solution domain directly affect how the account team should position. Teams
            that scan this domain reactively arrive to conversations after customers have already
            formed opinions from what they read elsewhere.
          agent: mna-node-news-agent
          contributing_agents:
            - agent: mna-impact-agent
              provides: Competitive relevance scores and deal-stage exposure context for domain events
          receives: Node profiles, solution domain definitions, competitor lists, active engagement context
          provides: Solution-domain news alerts, competitor product announcements, technology trend signals
          activities:
            - Industry and solution-domain news scanning per active node
            - Competitor product launch and positioning change detection
            - Technology adoption signal tracking across solution domains
            - Analyst and media coverage monitoring for node-relevant topics
            - Cross-node domain overlap identification for shared intelligence
          cadence: continuous scanning, immediate alerts for competitor launches, daily batch for domain news
        - domain: Regulatory and Compliance Scanning
          why: >
            Regulatory changes affecting an active node's solution domain can accelerate or block
            purchasing decisions with little warning. Missing a compliance deadline or upcoming
            mandate means the account team loses a natural entry point for an urgent conversation.
          agent: mna-node-news-agent
          contributing_agents:
            - agent: mna-impact-agent
              provides: Compliance urgency scores and affected-account mapping for regulatory events
          receives: Node profiles, compliance requirements per node, industry classification, operating modes
          provides: Regulatory change alerts, compliance mandate signals, enforcement action notifications
          activities:
            - Regulatory body announcement monitoring per solution domain
            - Compliance mandate and enforcement deadline tracking
            - Industry-specific regulatory change detection tied to active nodes
            - Cross-border regulatory impact identification for multi-region accounts
            - Standards body and certification change monitoring
          cadence: continuous scanning, immediate alerts for enforcement deadlines, weekly batch for regulatory updates
        - domain: Realm Digest Generation
          why: >
            Company-level news items accumulate across the week without a structured synthesis layer
            that connects them to specific opportunities. Account teams need a weekly company digest
            that prioritizes events by their relevance to active deals and surfaces the action each
            item implies, rather than leaving interpretation to the reader.
          agent: mna-digest-agent
          contributing_agents:
            - agent: mna-realm-news-agent
              provides: Realm-level news items with source evidence and timestamp for compilation
            - agent: mna-impact-agent
              provides: Urgency scores and opportunity relevance ratings for digest prioritization
          receives: Realm news items, active opportunity lists, deal stages, engagement history
          provides: Weekly realm digests, engagement-contextualized company summaries, prioritized action signals
          activities:
            - Weekly company-level news aggregation per monitored realm
            - Event-to-opportunity connection mapping within each digest
            - Digest section prioritization by deal-stage relevance
            - Actionable insight extraction with suggested next steps
            - Digest formatting and delivery scheduling per account team
          cadence: weekly on Monday, ad-hoc digests triggered by high-impact realm events
        - domain: Node Digest Generation
          why: >
            Solution-domain developments and competitor moves accumulate in volume that is difficult
            for account teams to process without a curated summary. A weekly node digest structures
            this information around active engagements and surfaces competitive context that changes
            how the team should approach each deal.
          agent: mna-digest-agent
          contributing_agents:
            - agent: mna-node-news-agent
              provides: Node-level news items with domain and competitor context for compilation
            - agent: mna-impact-agent
              provides: Competitive exposure scores and regulatory urgency ratings for node digest prioritization
          receives: Node news items, active node lists, competitor profiles, compliance context, deal stages
          provides: Weekly node digests, solution-domain competitive summaries, regulatory action signals
          activities:
            - Weekly solution-domain news aggregation per active node
            - Competitor move and product launch synthesis with positioning implications
            - Regulatory and compliance change surfacing with deal-relevance framing
            - Node-level insight extraction with suggested competitive responses
            - Digest formatting and delivery scheduling per node team
          cadence: weekly on Monday, ad-hoc digests triggered by high-impact competitor events
        - domain: News Impact Assessment
          why: >
            Not every news item carries the same weight for every account. Impact assessment
            combines the event with deal stage, competitive exposure, stakeholder relationships,
            and account context to produce a relevance score the downstream agents and account
            teams can act on without re-reading the raw item themselves.
          agent: mna-impact-agent
          contributing_agents:
            - agent: mna-realm-news-agent
              provides: Realm context and account profile data for impact scoring
            - agent: mna-node-news-agent
              provides: Node context and competitive exposure data for relevance assessment
          receives: News items, realm profiles, node profiles, deal stages, affected account lists, competitive context
          provides: Impact assessments, urgency scores, relevance ratings, deal-stage correlation outputs
          activities:
            - Individual news item urgency scoring against account and deal context
            - Relevance rating across affected realm and node combinations
            - Deal-stage correlation to identify items that accelerate or threaten active opportunities
            - Stakeholder sensitivity flagging for leadership and political events
            - Immediate alert routing for items crossing urgency thresholds
          cadence: per-event for all incoming news items, immediate escalation for high-urgency signals
        - domain: Trend Pattern Detection
          why: >
            Individual events become strategically significant when they form a pattern across
            accounts, solution domains, or time periods. Detecting these patterns early gives
            account teams a positioning advantage before the pattern becomes common knowledge
            and competitors adjust their approach.
          agent: mna-impact-agent
          contributing_agents:
            - agent: mna-realm-news-agent
              provides: Historical realm event sequences for cross-account pattern analysis
            - agent: mna-node-news-agent
              provides: Domain event sequences and competitor move history for trend synthesis
          receives: Accumulated news items, historical impact scores, realm and node event logs, time-series signals
          provides: Trend pattern reports, emerging theme alerts, cross-account signal summaries, early warning flags
          activities:
            - Cross-account event pattern detection within and across solution domains
            - Competitor behavior trend synthesis from accumulated node events
            - Emerging theme identification from repeated low-urgency signals that aggregate to high impact
            - Early warning flag generation for developing market shifts
            - Monthly pattern synthesis report generation for account planning
          cadence: weekly trend review across accumulated events, monthly pattern synthesis, immediate flag for sharp signal spikes
    with_this_agent:
      - domain: Company News Scanning
        agent: mna-realm-news-agent
        items:
          - "M&A and partnership detection: surface acquisition activity, joint ventures, and strategic partnerships at target accounts before they reshape buying dynamics"
          - "Earnings signal extraction: scan financial disclosures and earnings transcripts for technology investment and budget allocation indicators"
          - "Corporate restructuring alerts: detect divestitures, subsidiary changes, and cost-restructuring programs that affect technology spend authority"
      - domain: Leadership and Initiative Tracking
        agent: mna-realm-news-agent
        items:
          - "Leadership change detection: identify C-suite and VP-level appointments and departures with stakeholder relationship impact assessment"
          - "Initiative progress monitoring: track publicly announced digital transformation and platform programs against reported milestones"
          - "Executive signal enrichment: connect leadership events to active engagement history so account teams understand the relationship context"
      - domain: Solution Domain Intelligence
        agent: mna-node-news-agent
        items:
          - "Domain news scanning: monitor industry and technology news relevant to each active node's solution area on a continuous basis"
          - "Competitor product monitoring: track competitor announcements, product launches, and market positioning changes per solution domain"
          - "Technology adoption signals: identify emerging adoption patterns and analyst coverage shifts that affect how accounts evaluate solutions"
      - domain: Regulatory and Compliance Scanning
        agent: mna-node-news-agent
        items:
          - "Regulatory change detection: monitor announcements from regulatory bodies affecting active node solution domains"
          - "Compliance mandate tracking: identify upcoming enforcement deadlines and certification changes that create buying urgency"
          - "Cross-border impact identification: flag regulatory changes with multi-region implications for accounts operating across jurisdictions"
      - domain: Realm Digest Generation
        agent: mna-digest-agent
        items:
          - "Weekly realm digests: compile company-level news summaries that connect events to active opportunities with deal-stage prioritization"
          - "Opportunity-to-event mapping: link each news item to the specific deals and stakeholders it affects so account teams know where to act"
          - "Actionable insight extraction: surface suggested next steps for each digest section rather than leaving interpretation open"
      - domain: Node Digest Generation
        agent: mna-digest-agent
        items:
          - "Weekly node digests: compile solution-domain summaries with competitor context and positioning implications per active node"
          - "Competitive synthesis: aggregate competitor moves into a structured view of how the competitive landscape has shifted since the last digest"
          - "Regulatory framing: surface compliance changes within the node digest alongside their deal-relevance context"
      - domain: News Impact Assessment
        agent: mna-impact-agent
        items:
          - "Urgency scoring: rate each incoming news item against deal stage, competitive exposure, and account profile to produce an actionable priority signal"
          - "Relevance rating: assess which realm and node combinations are affected by each event so routing is precise and noise is minimized"
          - "Deal-stage correlation: identify items that accelerate or threaten specific active opportunities based on event type and account context"
      - domain: Trend Pattern Detection
        agent: mna-impact-agent
        items:
          - "Cross-account pattern detection: identify recurring signal types across multiple accounts and solution domains that indicate a developing market shift"
          - "Emerging theme alerts: aggregate low-urgency signals over time and flag when their combined weight crosses a threshold warranting account team attention"
          - "Monthly pattern synthesis: generate a structured summary of trend patterns across the monitored account base for account planning input"
    collaboration:
      defer_to:
        - agent: ci-agent
          scope: Competitive strategy development and market positioning analysis
          scenarios:
            - "Competitor news detected that requires strategic competitive response beyond factual reporting"
            - "Market positioning shift identified that needs competitive intelligence framework analysis"
        - agent: ii-agent
          scope: Industry-level analysis, sector trend interpretation, macro-economic context
          scenarios:
            - "News event has industry-wide implications beyond target account scope"
            - "Regulatory change requires deep industry structure analysis"
        - agent: aci-agent
          scope: Account structure research, org chart analysis, stakeholder mapping
          scenarios:
            - "Leadership change requires updated org chart and power map beyond news-level detection"
            - "M&A event requires deep account structure analysis"
        - agent: ae-agent
          scope: Commercial interpretation of news events, engagement strategy decisions
          scenarios:
            - "News event requires commercial judgment on whether to accelerate, pause, or reposition a deal"
            - "Impact assessment needs AE input on deal-specific context not available in data"
      provide_to:
        - agent: ae-agent
          scope: Market intelligence alerts, weekly digests, impact assessments for active deals
          scenarios:
            - "High-impact news detected at target account requiring immediate deal team awareness"
            - "Weekly digest delivered with engagement-contextualized insights"
        - agent: ci-agent
          scope: Competitor news events and market positioning changes for competitive analysis enrichment
          scenarios:
            - "Competitor acquisition or product launch detected that informs competitive positioning"
            - "Market share shift signals from financial disclosures"
        - agent: sa-agent
          scope: Solution-domain news and technology trend signals relevant to active technical engagements
          scenarios:
            - "Technology adoption signal detected that affects active solution design"
            - "Regulatory change impacts architecture requirements for active node"
        - agent: fcto-agent
          scope: Cross-account market patterns and trend signals for field intelligence aggregation
          scenarios:
            - "Market pattern detected across multiple accounts informing cross-account synthesis"
            - "Technology trend signal from news correlates with field observations"
        - agent: ii-agent
          scope: Current market events and news context for industry analysis enrichment
          scenarios:
            - "Industry-relevant news events that add context to ongoing industry deep-dives"
        - agent: risk-radar-agent
          scope: High-impact news events that may affect engagement risk profiles
          scenarios:
