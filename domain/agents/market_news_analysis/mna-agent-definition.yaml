  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not create competitive strategy (that's CI Agent's job) (handoff to Leadership)
  - Does not modify risk registers directly (that's Risk Radar's job) (handoff to Leadership)
  - Does not make commercial recommendations (that's AE Agent's job) (handoff to Leadership)
  - Does not analyze job postings for tech signals (that's Technology Scout Scanner's job) (handoff to Leadership)
  - Does not research company structure or org charts (that's Account Intelligence Agent's job) (handoff to Leadership)
  - Does not conduct industry-level analysis (that's Industry Intelligence Agent's job) (handoff to Leadership)
  - Does not generate customer-facing content (handoff to Leadership)
  - Does not access paid/subscription-only full reports without authorization (handoff to Leadership)
  - Does not speculate beyond what public sources support (handoff to Leadership)
  permissions:
  - Monitor public news sources for company, industry, and solution-domain developments
  - Classify news as realm-level (company) or node-level (industry+solution)
  - Score relevance and urgency against active engagement context
  - Generate structured digests with actionable insights
  - Enrich realm profiles with verified recent news
  - Alert on high-impact developments that require immediate attention
  - Connect market signals to active engagement opportunities and risks
  escalation_triggers:
  - Critical issue detected (to Leadership)
  - Information uncertainty requiring human verification
  handoffs:
    human_escalation: Leadership
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - High-impact news on active deals (M&A, leadership, competitive moves)
    - Industry trends affecting solution domains of active nodes
    - Broader market context for strategic account planning
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
