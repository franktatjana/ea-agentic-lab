# Delivery Agent Configuration
# Purpose: Maintain continuity between delivery & account teams

agent_id: "delivery_agent"
team: "delivery"
category: "delivery"
purpose: "Maintain continuity between delivery & account teams"

core_functions:
  - "Tracks delivery progress"
  - "Flags delivery risks"
  - "Pushes status updates to account team"

mechanics:
  - "Analyzes Jira/status reports"
  - "Detects signals (blocked, rescope)"
  - "Generates concise health summaries"

inputs:
  - "Slack"
  - "Jira"
  - "Customer escalations"

outputs:
  - "Status note"
  - "Delivery risk alerts"
  - "Health summaries"

escalation_to: "Delivery Manager"

playbooks:
  owned:
    - id: "PB_DEL_001"
      name: "Implementation Kickoff"
      path: "domain/playbooks/delivery/PB_DEL_001_implementation_kickoff.yaml"
      description: "Structures pre-sales to implementation transition with handoff validation"
    - id: "PB_DEL_002"
      name: "Go-Live Readiness Assessment"
      path: "domain/playbooks/delivery/PB_DEL_002_go_live_readiness.yaml"
      description: "Validates all prerequisites before production go-live"
    - id: "PB_DEL_003"
      name: "Implementation Risk Review"
      path: "domain/playbooks/delivery/PB_DEL_003_implementation_risk_review.yaml"
      description: "Periodic review of delivery risks, blockers, and scope changes"
    - id: "PB_DEL_004"
      name: "Post-Implementation Review"
      path: "domain/playbooks/delivery/PB_DEL_004_post_implementation_review.yaml"
      description: "Retrospective capturing lessons learned and handoff to post-sales"
  contributed:
    - id: "PB_DEL_101"
      name: "Security Stage Adoption"
      path: "domain/playbooks/delivery/PB_DEL_101_security_stage_adoption.yaml"
      role: "secondary_agent"
      description: "Supports CA Agent with delivery context during adoption journey"
    - id: "PB_DEL_902"
      name: "Technology Trend Response"
      path: "domain/playbooks/delivery/PB_DEL_902_tech_trend_response.yaml"
      role: "secondary_agent"
      description: "Provides delivery impact context for technology trend responses"

skills:
  owned: []

execution:
  trigger_sources:
    - "delivery_status_updated"
    - "customer_escalation_received"
    - "milestone_approaching"
  output_destination: "{realm}/{node}/internal-infohub/delivery/"
  escalation_threshold: "delivery_blocked_48h"

personality_file: "teams/delivery/personalities/delivery_personality.yaml"
prompts_dir: "teams/delivery/prompts"
