    risk: low
    resolver: agent-registry
    target_agent: delivery-readiness-agent
- component_type: ClientTool
  id: invoke-commitment
  name: Invoke Commitment Agent
  description: Route SOW extraction, SLA alignment, commitment register, and handoff validation requests
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: context
    type: object
  outputs:
  - title: result
    type: object
