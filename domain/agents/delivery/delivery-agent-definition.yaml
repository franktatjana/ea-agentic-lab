# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:
  profile:
    role_context: >
      The Delivery Manager ensures what was sold matches what gets built. They
      translate deal commitments, SLAs, and stakeholder expectations into
      implementation plans that engineering can execute. The gap between sales
      promises and delivery reality is where most customer friction originates.
    challenges:
      - "Deal commitments aren't always documented with enough precision"
      - "SLA expectations drift between the sale and implementation kickoff"
      - "Stakeholder handoffs lose critical context about customer priorities"
    administrative_overhead:
      - "Extracting commitments from SOWs, emails, and meeting notes"
      - "Building implementation plans from scattered deal documentation"
      - "Coordinating handoff meetings between sales and delivery teams"
    capabilities:
      - "Commitment and SLA translation"
      - "Implementation planning"
      - "Stakeholder handoff management"
      - "Delivery risk tracking"

  fallback_model: null
  prompt_registry:
    delivery-status-summary:
      description: Generate concise project status for account team
      source: prompts/tasks.yaml#project_health.status_summary
      inputs:
      - title: account_name
        type: string
      - title: current_phase
        type: string
      - title: date
        type: string
      - title: go_live_date
        type: string
      - title: project_name
        type: string
      outputs:
      - title: status-summary_result
        type: object
    delivery-go-live-readiness:
      description: Assess readiness for production go-live
      source: prompts/tasks.yaml#project_health.go_live_readiness
      inputs:
      - title: account_name
        type: string
      - title: current_phase
        type: string
      - title: days
        type: string
      - title: go_live_date
        type: string
      - title: percentage
        type: string
      outputs:
      - title: go-live-readiness_result
        type: object
    delivery-weekly-report:
      description: Generate weekly delivery report for stakeholders
      source: prompts/tasks.yaml#project_health.weekly_report
      inputs:
      - title: project_list
        type: string
      - title: week_end_date
        type: string
      outputs:
      - title: weekly-report_result
        type: object
    delivery-blocker-analysis:
      description: Analyze blocker impact and resolution path
      source: prompts/tasks.yaml#blocker_management.blocker_analysis
      inputs:
      - title: blocker_description
        type: string
      - title: date
        type: string
      - title: name
        type: string
      - title: project_name
        type: string
