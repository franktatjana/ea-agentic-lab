a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - delivery-risk-monitoring
    - go-live-readiness
    - commitment-tracking
    - stakeholder-communication
    - blocker-analysis
    - sla-alignment
    - handoff-validation
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain
x-ea-agent:
  profile:
    why: 'Delivery signal is scattered across Jira, Slack, email threads, and status calls that the Delivery Manager monitors manually every day. By the time a risk surfaces in a report, the window
      for low-cost mitigation has already closed. Commitment drift starts at deal close when SOW language is vague and sales context isn''t transferred, then compounds with every missed SLA conversation.
      Stakeholder communication happens reactively, after something breaks, rather than proactively when there is still time to act. This agent gives the Delivery Manager a system that monitors continuously,
      tracks commitments from the moment the deal closes, and surfaces the right information to the right stakeholder before a problem becomes a relationship issue.

      '
    human_matters_summary: 'Delivery data tells you what happened; the Delivery Manager decides what it means. The agent aggregates signals, flags risks, and generates status reports, but the
      experienced manager reads the political context behind an escalation, knows when a stakeholder needs a phone call instead of a written update, and decides which risks are real versus noise.
      Implementation trust is earned in how the Delivery Manager responds under pressure, and that judgment no agent can replicate.

      '
    human_matters_goal: 'Every risk is visible before it becomes a surprise, every commitment is tracked, but implementations succeed because the Delivery Manager brought the right judgment at the right moment.

      '
    role_tab_intro: 'A Delivery Manager translates deal promises into working software and maintains trust across the implementation lifecycle. The challenges below are where commitment drift begins,
      risks stay hidden too long, and stakeholder confidence erodes before anyone acts.

      '
    goals_summary: 'The Delivery Manager succeeds when every implementation runs with full risk visibility, go-live dates are met because readiness was assessed early, commitments from the deal are
      tracked without exception, and stakeholders receive proactive communication before they need to ask.

      '
    goals:
    - Every implementation has a commitment register created within 48 hours of deal close
    - Delivery risks flagged at least 5 business days before they reach the customer
    - Go-live readiness assessments completed at least 14 days before target date
    - SLA alignment report reviewed by both sales and delivery before kickoff
    - Zero untracked commitments raised by customers in the first 30 days of implementation
    - Blocker-to-resolution time reduced by 40% through early detection and structured analysis
    - Weekly status reports generated automatically for every active implementation
    - Escalation briefs prepared within 4 hours of a critical issue classification
    - Dependency register maintained with ownership and resolution status current within 48 hours
    - Handoff brief with stakeholder profiles delivered for every implementation kickoff
    - Post-implementation review completed within 2 weeks of go-live for every project
    - Go-live dates met without last-minute scope changes on at least 80% of implementations
    role_context: 'The Delivery Manager ensures what was sold matches what gets built. They translate deal commitments, SLAs, and stakeholder expectations into implementation plans that engineering can
      execute. The gap between sales promises and delivery reality is where most customer friction originates.

      Implementation projects generate risk signals continuously: blocked Jira tickets, dependency delays, resource conflicts, and scope creep discussions that never reach the account team until
      a customer escalation forces the issue. The Delivery Manager is the connective tissue between the execution layer and the relationship layer. This agent routes each domain to the right sub-agent
      so risk detection, readiness assessment, commitment tracking, and stakeholder communication operate continuously rather than episodically.

      '
    key_responsibilities:
    - 'Risk Monitoring: scan Jira tickets, Slack threads, and status notes for early warning signals using severity keywords and pattern recognition'
    - 'Blocker Analysis: assess blocker impact on project timeline, identify resolution paths, and escalate when no viable mitigation exists'
    - 'Health Summaries: generate delivery health reports connecting project status to account context for the broader team'
    - 'Go-Live Readiness: aggregate milestone completion, testing status, open blockers, and dependency state into structured readiness assessments'
    - 'Dependency Tracking: maintain a live dependency register with ownership, status, and projected resolution dates'
    - 'Commitment Extraction: parse SOWs, proposal decks, and meeting notes to build a consolidated commitment register within 48 hours of deal close'
    - 'SLA Alignment: cross-reference contract SLAs against informal commitments from pre-sales conversations and flag discrepancies before kickoff'
    - 'Handoff Validation: verify that all deal context, stakeholder profiles, and commitment details transfer completely from sales to delivery'
    - 'Status Reporting: generate weekly status updates tailored per stakeholder audience (executive summary, technical detail, operational update)'
    - 'Escalation Routing: classify issues by severity, prepare escalation briefs, and route to the appropriate stakeholder with resolution context'
    - 'Cross-Team Communication: coordinate delivery updates across engineering, product, customer success, and account teams'
    - 'Phase Transition Documentation: capture deliverables, open items, and acceptance criteria at each implementation phase boundary'
    - 'Customer Impact Assessment: evaluate the downstream effect of delivery issues on customer operations and SLA performance'
    - 'Post-Implementation Review: capture lessons learned and delivery quality metrics after go-live for process improvement'
    key_metrics:
    - 'Risk detection lead time: business days between internal risk flag and customer-reported escalation (target >= 5 days)'
    - 'Commitment register coverage: percentage of active implementations with a complete commitment register at kickoff (target 100%)'
    - 'Go-live readiness lead: days before target go-live that a structured readiness assessment is completed (target >= 14 days)'
    - 'SLA alignment rate: percentage of implementations with zero SLA discrepancies reported in the first 60 days post-kickoff'
    - 'Blocker resolution time: average days from blocker detection to resolution (track trend, target 40% reduction)'
    - 'Status report timeliness: percentage of weekly status reports delivered on schedule without manual follow-up (target >= 95%)'
    - 'Escalation brief accuracy: percentage of escalation briefs rated complete and actionable by receiving stakeholder (target >= 90%)'
    scenarios:
    - problem: Delivery risks surface as surprises to the account team
      why: 'Project blockers and milestone slips are discussed in Jira tickets and delivery stand-ups but never reach the account team until a customer escalation forces it. The disconnect between delivery
        execution and account awareness turns manageable risks into relationship damage.

        '
      agent: delivery-agent
      agent_response: 'The agent tracks delivery progress signals from Jira, status reports, and customer escalations. It flags risks using severity keywords like blocked, rescoped, and delayed, then generates
        health summaries that connect delivery status to account context so the team sees problems early.

        '
      success_signal:
        metric: Delivery risk detection lead time before customer escalation
        target: Flag delivery risks at least 5 business days before they reach the customer
        leading_indicator: Account teams acknowledge delivery risk alerts in their planning
        failure_signal: Delivery issues are first learned about through customer complaints
    - problem: Go-live readiness is assessed too late
      why: 'Readiness for production go-live depends on testing completion, open blockers, and milestone progress scattered across multiple systems. Teams often discover unresolved dependencies days before
        the target date, forcing last-minute scrambles or embarrassing delays.

        '
      agent: delivery-agent
      agent_response: 'The agent assesses go-live readiness by aggregating milestone progress, open blockers, and testing status into a structured readiness report. It tracks the gap between current state
        and go-live criteria, giving the team a clear view of what needs resolution with enough lead time to act.

        '
      success_signal:
        metric: Go-live readiness assessment accuracy
        target: Provide readiness assessments at least 14 days before target go-live date
        leading_indicator: Go-live dates are met without last-minute scope changes
        failure_signal: Go-live dates are pushed due to issues that could have been caught earlier
    - problem: Deal commitments aren't always documented with enough precision
      why: 'During the sales cycle, commitments are made in calls, emails, and slide decks that never consolidate into a single deliverable list. When delivery begins, the team inherits vague expectations
        that the customer considers firm promises, creating friction before the first milestone.

        '
      agent: delivery-agent
      agent_response: 'The agent extracts commitments from SOWs, proposal decks, and meeting notes, then cross-references them to build a consolidated commitment register. It flags ambiguous language, identifies
        commitments without clear acceptance criteria, and surfaces gaps between what was sold and what delivery has scoped.

        '
      success_signal:
        metric: Commitment extraction completeness
        target: Consolidated commitment register created within 48 hours of deal close
        leading_indicator: Delivery kickoff references the commitment register with no customer-reported omissions
        failure_signal: Customer raises an untracked commitment during the first 30 days of implementation
    - problem: SLA expectations drift between the sale and implementation kickoff
      why: 'Service level expectations discussed during the sales cycle evolve through negotiations, side conversations, and informal assurances. By kickoff, the delivery team works from contract SLAs while
        the customer remembers verbal commitments that were never formalized, creating misalignment from day one.

        '
      agent: delivery-agent
      agent_response: 'The agent tracks SLA references across deal artifacts including contracts, pre-sales emails, and meeting transcripts. It highlights discrepancies between documented SLAs and informal
        commitments, producing an SLA alignment report for the handoff meeting so both sides start with shared expectations.

        '
      success_signal:
        metric: SLA alignment accuracy at kickoff
        target: Zero SLA discrepancies reported by customers in the first 60 days post-kickoff
        leading_indicator: SLA alignment report reviewed and confirmed by both sales and delivery before kickoff
        failure_signal: Customer escalates an SLA expectation that was discussed in pre-sales but not documented
    - problem: Stakeholder handoffs lose critical context about customer priorities
      why: 'The sales team builds months of relationship context, including personal priorities, political dynamics, and communication preferences. During handoff, this knowledge is compressed into a single
        transition meeting or a brief email. The delivery team starts without the context needed to maintain trust.

        '
      agent: delivery-agent
      agent_response: 'The agent compiles a structured handoff brief that includes stakeholder profiles, communication preferences, known priorities, and political dynamics captured during the sales cycle.
        It extracts context from CRM notes, meeting summaries, and deal history to ensure the delivery team inherits relationship intelligence, not just contract terms.

        '
      success_signal:
        metric: Handoff context completeness
        target: Structured handoff brief with stakeholder profiles delivered for every implementation kickoff
        leading_indicator: Delivery leads reference handoff context in their first customer interaction
        failure_signal: Delivery team asks the customer to re-explain priorities already shared during the sales cycle
    challenges:
    - text: Delivery risks stay invisible until they become customer escalations because no one is continuously monitoring Jira for early warning signals
      solved_by: delivery-risk-monitoring-agent
      category: Delivery Risk Monitoring
      specific_overhead:
      - Manually reviewing Jira board every morning to spot blocked tickets before stand-up
      - Correlating Slack mentions of "blocked" or "delayed" with open issues to determine severity
    - text: Blocker analysis happens ad hoc, producing inconsistent severity ratings that under-communicate timeline impact to account teams
      solved_by: delivery-risk-monitoring-agent
      category: Blocker Analysis and Escalation
      specific_overhead:
      - Writing blocker impact summaries from scratch for each issue with no standard format
      - Estimating timeline impact without access to the dependency chain across workstreams
    - text: Health summaries are written manually for each account team update, creating inconsistent information across concurrent implementations
      solved_by: delivery-risk-monitoring-agent
      category: Stakeholder Status Reporting
      specific_overhead:
      - Synthesizing status from Jira, Slack, and email into a single narrative for each project
      - Reformatting the same information for engineering leads versus account team audiences
    - text: Go-live readiness is assessed informally, without a structured view of what is open and what the acceptance criteria are
      solved_by: delivery-readiness-agent
      category: Go-Live Readiness
      specific_overhead:
      - Manually checking milestone completion across multiple project tracking tools before each readiness call
      - Building go-live checklists from memory or prior project templates that may be outdated
    - text: Dependency tracking is reactive, discovered when a downstream team reports they are blocked rather than proactively monitored
      solved_by: delivery-readiness-agent
      category: Dependency and Phase Tracking
      specific_overhead:
      - Scheduling dependency review calls across teams because there is no shared dependency register
      - Updating a spreadsheet dependency tracker after each stand-up rather than having a live view
    - text: Deal commitments made during the sales cycle are scattered across SOWs, emails, and slide decks with no single consolidated reference
      solved_by: delivery-commitment-agent
      category: Commitment Extraction
      specific_overhead:
      - Reading through full SOW documents and proposal decks to extract commitment language before kickoff
      - Building a commitment register manually from notes taken across multiple pre-sales meetings
    - text: SLA expectations drift between the sales cycle and implementation kickoff because informal verbal commitments are never reconciled with the contract
      solved_by: delivery-commitment-agent
      category: SLA Alignment and Handoff Validation
      specific_overhead:
      - Comparing contract SLA terms against pre-sales email threads to identify discrepancies before kickoff
      - Coordinating SLA alignment meetings between sales and delivery to reconcile informal commitments
    - text: Handoff from sales to delivery loses stakeholder context, priorities, and political dynamics that took months to build during the sales cycle
      solved_by: delivery-commitment-agent
      category: SLA Alignment and Handoff Validation
      specific_overhead:
      - Compiling stakeholder profiles from CRM notes and meeting summaries into a handoff document
      - Scheduling multiple transition calls because the first handoff meeting covered logistics, not relationship context
    - text: Status reports are written from scratch each week for every active project, consuming several hours without adding analytical value
      solved_by: delivery-stakeholder-agent
      category: Stakeholder Status Reporting
      specific_overhead:
      - Aggregating status from Jira, email, and Slack into a formatted report for each stakeholder audience
      - Adjusting language and detail level per audience (executive summary versus engineering update) manually
    - text: Escalation briefs are delayed because there is no standard structure, requiring time to frame the issue, impact, and recommended action under pressure
      solved_by: delivery-stakeholder-agent
      category: Blocker Analysis and Escalation
      specific_overhead:
      - Writing escalation narratives from scratch under time pressure when a critical issue surfaces
      - Identifying the right escalation recipient and routing path without a defined decision matrix
    - text: Cross-team coordination for shared dependencies produces duplicate communication threads with no single source of truth
      solved_by: delivery-stakeholder-agent
      category: Cross-Team Communication and Post-Implementation Review
      specific_overhead:
      - Sending separate update emails to each team about the same dependency issue with slightly different context
      - Following up individually with each stakeholder to confirm they received and understood the escalation
    - text: Phase transition documentation is incomplete, leaving open items and acceptance criteria ambiguous at the boundary between implementation phases
      solved_by: delivery-readiness-agent
      category: Dependency and Phase Tracking
      specific_overhead:
      - Drafting phase completion summaries from scratch at the end of each project phase
      - Chasing sign-off from customer stakeholders without a clear acceptance criteria checklist
    administrative_overhead:
    - text: Reviewing Jira boards daily to identify blocked tickets and risk signals across concurrent implementations
      automated_by: delivery-risk-monitoring-agent
    - text: Writing project health summaries that translate delivery status into account-team-readable format
      automated_by: delivery-risk-monitoring-agent
    - text: Building and updating go-live readiness checklists by aggregating milestone and testing status from multiple systems
      automated_by: delivery-readiness-agent
    - text: Maintaining the dependency register with current ownership, status, and resolution dates
      automated_by: delivery-readiness-agent
    - text: Extracting commitments from SOWs, proposals, and meeting notes to create the commitment register at deal close
      automated_by: delivery-commitment-agent
    - text: Cross-referencing contract SLA terms against informal pre-sales commitments to produce an alignment report before kickoff
      automated_by: delivery-commitment-agent
    - text: Generating weekly status reports tailored to each stakeholder audience across all active implementations
      automated_by: delivery-stakeholder-agent
    - text: Preparing escalation briefs with issue classification, impact analysis, and routing recommendation under time pressure
      automated_by: delivery-stakeholder-agent
    capabilities:
    - Delivery risk signal detection and early warning
    - Blocker impact analysis and resolution path assessment
    - Project health summary generation
    - Go-live readiness assessment with structured criteria
    - Dependency register maintenance and tracking
    - Commitment extraction from deal artifacts
    - SLA alignment and discrepancy reporting
    - Handoff brief and stakeholder profile compilation
    - Automated weekly status report generation
    - Escalation brief preparation and routing
    - Cross-team dependency communication
    - Phase transition documentation
    stakeholder_landscape:
      customer_side:
      - "Project Sponsor: executive accountable for implementation success, approves milestone sign-offs and go-live decisions"
      - "Technical Lead: customer-side architect owning integration, data migration, and testing readiness"
      - "Business Process Owner: defines acceptance criteria, validates that delivered solution meets operational requirements"
      - "End Users: adoption group whose readiness and feedback determine whether go-live is viable"
      - "IT Operations: owns infrastructure, access provisioning, and production environment handoff"
      internal_team:
      - "Solution Architect: architecture decisions and design authority during implementation, consulted on technical blockers"
      - "Account Executive: commercial relationship owner, leads scope change negotiations and customer expectation management"
      - "Customer Architect: post-go-live handoff recipient, receives implementation summary and adoption baseline"
      - "Professional Services: specialist resources providing implementation expertise for complex workstreams"
      - "Product Manager: product limitation guidance, bug prioritization, and release coordination for implementation blockers"
    playbook_raci:
      context: >
        The Delivery Manager owns 7 implementation lifecycle playbooks and contributes
        delivery context to playbooks led by other roles.
      responsible:
        - playbook: Implementation Kickoff (PB_DEL_001)
          scope: Pre-implementation planning, handoff from sales, environment readiness
          team: delivery
          file: PB_DEL_001_implementation_kickoff.yaml
        - playbook: Go-Live Readiness (PB_DEL_002)
          scope: Go-live criteria validation, cutover planning, rollback procedures
          team: delivery
