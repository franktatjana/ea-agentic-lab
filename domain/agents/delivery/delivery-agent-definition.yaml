    risk: low
    resolver: agent-registry
    target_agent: delivery-commitment-agent
- component_type: ClientTool
  id: invoke-stakeholder
  name: Invoke Stakeholder Agent
  description: Route status report generation, escalation routing, and cross-team communication requests
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: delivery-stakeholder-agent
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: delivery-agent-proactive
  name: Delivery Agent (Proactive)
  description: 'Proactive mode: scans for signals and surfaces insights without prompting'
  agent:
    $component_ref: delivery-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan sources

      continuously for relevant signals. Surface insights before being

      asked. Prioritize timeliness over depth. Keep outputs concise and

      action-oriented. Flag anything that needs immediate attention.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: delivery-agent-analytical
  name: Delivery Agent (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: delivery-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Provide comprehensive

      analysis with full evidence trails. Synthesize across multiple

      data points. Prioritize accuracy and defensibility over speed.

      Include confidence levels and caveats where appropriate.

      '
    human_in_the_loop: true
