    with_this_agent:
    - domain: Delivery Risk Monitoring
      items:
      - 'Risk Scanning: Continuously scan Jira tickets, Slack threads, and status notes for early warning signals using severity keywords and pattern matching'
      - 'Health Summaries: Generate delivery health reports that connect project status to account context for the broader team with evidence-backed claims'
    - domain: Blocker Analysis and Escalation
      items:
      - 'Blocker Analysis: Assess each blocker for timeline impact, identify resolution paths, and classify severity so the account team has an actionable summary'
      - 'Escalation Briefs: Prepare structured escalation briefs with issue classification, timeline impact, and routing recommendation within 4 hours of critical issue detection'
      - 'Customer Impact Assessment: Evaluate the downstream effect of delivery issues on customer operations and SLA performance'
    - domain: Go-Live Readiness
      items:
      - 'Milestone Tracking: Aggregate milestone completion rates, testing status, and acceptance criteria gaps into a structured readiness dashboard'
      - 'Readiness Assessment: Produce go-live readiness reports at least 14 days before target date with a clear list of open items and owners'
    - domain: Dependency and Phase Tracking
      items:
      - 'Dependency Register: Maintain a live dependency register with ownership, resolution status, and projected completion dates'
      - 'Phase Transitions: Document deliverables, open items, and acceptance criteria at each implementation phase boundary'
    - domain: Commitment Extraction
      items:
      - 'SOW Parsing: Parse SOWs, proposal decks, and pre-sales meeting notes to build a consolidated commitment register within 48 hours of deal close'
      - 'Commitment Gap Detection: Identify discrepancies between sales scope and the delivery plan before the first milestone'
    - domain: SLA Alignment and Handoff Validation
      items:
      - 'SLA Alignment: Cross-reference contract SLAs against informal commitments from pre-sales conversations and flag discrepancies before kickoff'
      - 'Handoff Brief: Compile structured handoff documentation including stakeholder profiles, communication preferences, and deal context for the delivery team'
      - 'Handoff Validation: Verify that all deal context, stakeholder profiles, and commitment details transfer completely from sales to delivery'
    - domain: Stakeholder Status Reporting
      items:
      - 'Status Reports: Generate weekly status updates tailored per stakeholder audience (executive summary, technical detail, operational update) for every active implementation'
      - 'Audience Tailoring: Adapt report structure and detail level to each stakeholder group so every update is immediately actionable'
    - domain: Cross-Team Communication and Post-Implementation Review
      items:
      - 'Cross-Team Coordination: Draft and distribute cross-team dependency updates with a single source of truth to eliminate duplicate communication threads'
      - 'Post-Implementation Review: Facilitate lessons learned capture and delivery quality metrics within 2 weeks of go-live for every project'
    activity_map:
      purpose: 'The Delivery Manager exists to ensure what was sold gets built on time and to the agreed standard, with every risk visible before it becomes a customer surprise.
        The orchestrator routes requests to 4 specialized sub-agents covering eight domains of the implementation lifecycle. Risk signal detection and blocker escalation are
        the early-warning layer. Readiness assessment and dependency tracking are the verification layer. Commitment extraction and SLA alignment are the trust foundation.
        Stakeholder reporting and cross-team communication are the accountability layer. Together, they give the Delivery Manager continuous coverage without manual aggregation.

        '
      domains:
      - domain: Delivery Risk Monitoring
        why: 'Undetected risks compound silently. A Jira ticket marked blocked on Monday becomes a customer escalation by Friday if no one is continuously scanning the signal stream.
          Early detection gives the Delivery Manager days of lead time instead of hours.

          '
        agent: delivery-risk-monitoring-agent
        activities:
        - Continuous Jira scanning for blocked, escalated, and at-risk tickets
        - Slack and status note monitoring for severity keywords and risk signals
        - Health summary generation connecting delivery status to account context
        - Early warning alerts routed to account team before signals reach the customer
        cadence: continuous monitoring, health summaries weekly, alerts on detection
      - domain: Blocker Analysis and Escalation
        why: 'Detecting a blocker is not enough. Without structured impact analysis and a routed escalation brief, the same blocker sits unresolved across stand-ups until the customer
          reports the delay first. Analysis without routing leaves risk at the detection layer.

          '
        agent: delivery-risk-monitoring-agent
        activities:
        - Blocker impact analysis with timeline and dependency chain assessment
        - Severity classification against project milestones and contractual commitments
        - Escalation brief preparation with resolution options and routing recommendation within 4 hours
        - Customer impact assessment for active delivery issues
        - Resolution path tracking until blocker is closed
        cadence: blocker analysis on detection, escalation briefs within 4 hours of critical classification
      - domain: Go-Live Readiness
        why: 'Go-live failures are rarely surprises on the day. They are surprises only because nobody aggregated the warning signs early enough. Structured readiness assessment forces
          an honest view of what is open with enough lead time to act.

          '
        agent: delivery-readiness-agent
        activities:
        - Milestone completion tracking across all active implementation workstreams
        - Go-live readiness assessment against defined criteria at least 14 days before target
        - Testing status and acceptance criteria gap analysis
        - Open items resolution tracking between readiness assessment and go-live date
        cadence: readiness assessment at T-14 and T-7, milestone status updated weekly
      - domain: Dependency and Phase Tracking
        why: 'Dependencies missed before go-live and deliverables not captured at phase boundaries are the two most common sources of scope disputes. A live register with clear ownership
          removes the ambiguity that generates those disputes.

          '
        agent: delivery-readiness-agent
        activities:
        - Dependency register maintenance with ownership, status, and projected resolution dates
        - Phase transition documentation with deliverables and acceptance criteria
        - Cross-workstream dependency conflict detection
        - Phase exit criteria verification before transition approval
        cadence: dependency register updated bi-weekly, phase transitions documented at each gate
      - domain: Commitment Extraction
        why: 'Every commitment dispute at month three of an implementation was created at deal close when nobody consolidated what was promised. A commitment register built within 48 hours
          of deal close eliminates the ambiguity before the first delivery stand-up.

          '
        agent: delivery-commitment-agent
        activities:
        - SOW extraction and commitment register creation within 48 hours of deal close
        - Proposal deck and meeting note parsing for informal commitments
        - Commitment gap detection between sales scope and delivery plan
        - Commitment register version control as scope evolves
        cadence: commitment register at deal close, updated on each scope change
      - domain: SLA Alignment and Handoff Validation
        why: 'Service level expectations evolve through negotiations and side conversations. By kickoff, the delivery team works from contract SLAs while the customer expects the informal
          assurances the sales team made. Alignment before kickoff prevents disputes from becoming relationship damage.

          '
        agent: delivery-commitment-agent
        activities:
        - SLA cross-reference between contract terms and informal pre-sales commitments
        - SLA alignment report generation for kickoff meeting review
        - Handoff brief compilation with stakeholder profiles and deal context
        - Handoff validation to confirm all context transfers completely from sales to delivery
        cadence: SLA alignment report before kickoff, handoff brief for every implementation start
        contributing_agents: ae-agent
      - domain: Stakeholder Status Reporting
        why: 'Stakeholders without a consistent update cadence fill the information gap with assumptions. Weekly status reports tailored per audience replace assumption with evidence
          and keep every stakeholder aligned without consuming delivery capacity.

          '
        agent: delivery-stakeholder-agent
        activities:
        - Weekly status report generation tailored per stakeholder audience
        - Executive summary, technical detail, and operational update variants per report cycle
        - Report distribution tracking to confirm delivery and flag non-acknowledgement
        - Status report quality review against completeness and actionability criteria
        cadence: weekly for every active implementation
      - domain: Cross-Team Communication and Post-Implementation Review
        why: 'A delivery issue communicated clearly and early maintains trust. The same issue discovered by the customer first destroys it. Capturing lessons after go-live closes the
          loop so the next implementation starts better than the last one ended.

          '
        agent: delivery-stakeholder-agent
        activities:
        - Cross-team dependency update distribution with single source of truth
        - Duplicate communication thread elimination across engineering, product, and account teams
        - Post-implementation review facilitation within 2 weeks of go-live
        - Lessons learned capture and delivery quality metrics documentation
        cadence: cross-team updates on dependency changes, post-implementation review within 2 weeks of go-live
        contributing_agents: ae-agent, ca-agent
    sub_agents:
    - name: Risk Monitoring Agent
      id: delivery-risk-monitoring-agent
