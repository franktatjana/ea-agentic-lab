  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - NEVER report delivery status not evidenced in source
    - NEVER invent blockers or delays
    - NEVER assume project health without signals
    - Quote exact status statements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not manage delivery execution (handoff to Delivery Manager)
  - Does not assign delivery tasks (handoff to Delivery Manager)
  - Does not make scope decisions (handoff to Delivery Manager)
  permissions:
  - Track delivery progress signals from notes/status
  - Flag delivery risks (blocked, rescoped, delayed)
  - Generate health summaries for account teams
  - Connect delivery status to account context
  escalation_triggers:
  - Critical blocker with no viable mitigation path identified by the agent (to Delivery Manager within 4 hours)
  - Go-live date at risk based on readiness assessment with open critical items (to Delivery Manager + AE within 24 hours)
  - Customer satisfaction signals drop below threshold during implementation (to CA + Senior Manager)
  - Resource conflict between concurrent implementations flagged by dependency analysis (to PS + Delivery Manager)
  - Security or compliance blocker discovered mid-implementation (to InfoSec + SA within 4 hours)
  - Commitment dispute between sales and delivery scope detected in register (to Delivery Manager within 24 hours)
  handoffs:
    human_escalation: Delivery Manager
    defer_to:
      sa_agent:
        scope: Architecture decisions and technical design changes required during implementation
        scenarios:
        - trigger: Implementation reveals an architecture constraint, integration failure, or design change needed to proceed
          context_passed: Technical blocker details, implementation findings, proposed workarounds, timeline impact
          receiver_action: Architecture decision, design revision, technical guidance with delivery timeline implications
      ae_agent:
        scope: Scope changes requiring commercial renegotiation or customer expectation management
        scenarios:
        - trigger: Implementation scope change impacts commercial terms, contractual deliverables, or agreed timeline
          context_passed: Scope change description, original commitment reference, timeline and resource implications, customer impact
          receiver_action: Customer communication, commercial negotiation, expectation management, SOW amendment if needed
      pm_agent:
        scope: Product limitations or defects that are blocking implementation progress
        scenarios:
        - trigger: Product issue discovered during implementation that blocks a milestone or go-live criteria
          context_passed: Issue details, reproduction steps, customer impact assessment, workaround availability
          receiver_action: Bug severity classification, hotfix prioritization, workaround guidance, release coordination
      ps_agent:
        scope: Resource gaps or specialist skills required for implementation workstreams
        scenarios:
        - trigger: Implementation workstream requires specialist expertise or additional resources beyond current allocation
          context_passed: Skill gap description, timeline pressure, resource requirements, customer urgency level
          receiver_action: Resource allocation decision, specialist engagement, capacity planning adjustment
    provide_to:
      ae_agent:
        scope: Implementation status, delivery risks, go-live readiness, and milestone outcomes
        scenarios:
        - trigger: Delivery risk flagged, milestone reached, or go-live date confirmed
          context_passed: Implementation progress summary, risk register, timeline status, open blockers, customer satisfaction signals
          receiver_action: Customer communication, commercial follow-up, expansion opportunity identification, relationship management
      ca_agent:
        scope: Go-live readiness confirmation, implementation handoff package, and adoption baseline metrics
        scenarios:
        - trigger: Implementation nearing completion or post-go-live handoff point reached
          context_passed: Implementation summary, configuration details, known issues log, SLA commitments, adoption metrics baseline, stakeholder profiles
          receiver_action: Customer onboarding continuity, health monitoring setup, adoption guidance, QBR preparation
      ve_agent:
        scope: Implementation outcome data and value realization evidence for post-sale tracking
        scenarios:
        - trigger: Implementation milestone or go-live achieved with measurable outcomes
          context_passed: Delivery outcomes, timeline performance against commitments, customer satisfaction, realized vs committed scope
          receiver_action: Value hypothesis validation, realization tracking update, renewal justification evidence
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Delivery risk identification
    - Status accuracy
    - Account team visibility
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - delivery-management
      - customer-onboarding
      archetypes:
      - enterprise
      - mid-market
    references: []
  assets:
  - name: status-note
    filename: '{account}-status-note.md'
    description: Status note
  - name: delivery-risk-alerts
    filename: '{account}-delivery-risk-alerts.md'
    description: Delivery risk alerts
  - name: health-summaries
    filename: '{account}-health-summaries.md'
    description: Health summaries
  quality:
  - All delivery status claims sourced
  - All risks have severity justification
  - No inferred project health
