# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:
  profile:
    role_context: >
      The Delivery Manager ensures what was sold matches what gets built. They
      translate deal commitments, SLAs, and stakeholder expectations into
      implementation plans that engineering can execute. The gap between sales
      promises and delivery reality is where most customer friction originates.
    scenarios:
      - problem: "Delivery risks surface as surprises to the account team"
        why: >
          Project blockers and milestone slips are discussed in Jira tickets and
          delivery stand-ups but never reach the account team until a customer
          escalation forces it. The disconnect between delivery execution and
          account awareness turns manageable risks into relationship damage.
        agent: delivery-agent
        agent_response: >
          The agent tracks delivery progress signals from Jira, status reports,
          and customer escalations. It flags risks using severity keywords like
          blocked, rescoped, and delayed, then generates health summaries that
          connect delivery status to account context so the team sees problems early.
        success_signal:
          metric: "Delivery risk detection lead time before customer escalation"
          target: "Flag delivery risks at least 5 business days before they reach the customer"
          leading_indicator: "Account teams acknowledge delivery risk alerts in their planning"
          failure_signal: "Delivery issues are first learned about through customer complaints"
      - problem: "Go-live readiness is assessed too late"
        why: >
          Readiness for production go-live depends on testing completion, open
          blockers, and milestone progress scattered across multiple systems. Teams
          often discover unresolved dependencies days before the target date, forcing
          last-minute scrambles or embarrassing delays.
        agent: delivery-agent
        agent_response: >
          The agent assesses go-live readiness by aggregating milestone progress,
          open blockers, and testing status into a structured readiness report.
          It tracks the gap between current state and go-live criteria, giving
          the team a clear view of what needs resolution with enough lead time to act.
        success_signal:
          metric: "Go-live readiness assessment accuracy"
          target: "Provide readiness assessments at least 14 days before target go-live date"
          leading_indicator: "Go-live dates are met without last-minute scope changes"
          failure_signal: "Go-live dates are pushed due to issues that could have been caught earlier"
      - problem: "Deal commitments aren't always documented with enough precision"
        why: >
          During the sales cycle, commitments are made in calls, emails, and slide decks
          that never consolidate into a single deliverable list. When delivery begins,
          the team inherits vague expectations that the customer considers firm promises,
          creating friction before the first milestone.
        agent: delivery-agent
        agent_response: >
          The agent extracts commitments from SOWs, proposal decks, and meeting notes,
          then cross-references them to build a consolidated commitment register. It
          flags ambiguous language, identifies commitments without clear acceptance
          criteria, and surfaces gaps between what was sold and what delivery has scoped.
        success_signal:
          metric: "Commitment extraction completeness"
          target: "Consolidated commitment register created within 48 hours of deal close"
          leading_indicator: "Delivery kickoff references the commitment register with no customer-reported omissions"
          failure_signal: "Customer raises an untracked commitment during the first 30 days of implementation"
      - problem: "SLA expectations drift between the sale and implementation kickoff"
        why: >
          Service level expectations discussed during the sales cycle evolve through
          negotiations, side conversations, and informal assurances. By kickoff, the
          delivery team works from contract SLAs while the customer remembers verbal
          commitments that were never formalized, creating misalignment from day one.
        agent: delivery-agent
        agent_response: >
          The agent tracks SLA references across deal artifacts including contracts,
          pre-sales emails, and meeting transcripts. It highlights discrepancies between
          documented SLAs and informal commitments, producing an SLA alignment report
          for the handoff meeting so both sides start with shared expectations.
        success_signal:
          metric: "SLA alignment accuracy at kickoff"
          target: "Zero SLA discrepancies reported by customers in the first 60 days post-kickoff"
          leading_indicator: "SLA alignment report reviewed and confirmed by both sales and delivery before kickoff"
          failure_signal: "Customer escalates an SLA expectation that was discussed in pre-sales but not documented"
      - problem: "Stakeholder handoffs lose critical context about customer priorities"
        why: >
          The sales team builds months of relationship context, including personal
          priorities, political dynamics, and communication preferences. During handoff,
          this knowledge is compressed into a single transition meeting or a brief email.
          The delivery team starts without the context needed to maintain trust.
        agent: delivery-agent
        agent_response: >
          The agent compiles a structured handoff brief that includes stakeholder
          profiles, communication preferences, known priorities, and political dynamics
          captured during the sales cycle. It extracts context from CRM notes, meeting
          summaries, and deal history to ensure the delivery team inherits relationship
          intelligence, not just contract terms.
        success_signal:
          metric: "Handoff context completeness"
          target: "Structured handoff brief with stakeholder profiles delivered for every implementation kickoff"
          leading_indicator: "Delivery leads reference handoff context in their first customer interaction"
          failure_signal: "Delivery team asks the customer to re-explain priorities already shared during the sales cycle"
    challenges:
      - "Deal commitments aren't always documented with enough precision"
      - "SLA expectations drift between the sale and implementation kickoff"
      - "Stakeholder handoffs lose critical context about customer priorities"
    administrative_overhead:
      - "Extracting commitments from SOWs, emails, and meeting notes"
      - "Building implementation plans from scattered deal documentation"
      - "Coordinating handoff meetings between sales and delivery teams"
    capabilities:
      - "Commitment and SLA translation"
      - "Implementation planning"
      - "Stakeholder handoff management"
      - "Delivery risk tracking"
    human_matters_summary: >
      Delivery status is data; delivery health is judgment. The agent extracts
      progress signals from notes and flags risks, but the account leader
      understands which risks are real blockers, how to communicate concerns
      without alarming the customer, and when escalation is required. The status
      is visible, but human judgment decides how serious it is and what to do.

  fallback_model: null
  prompt_registry:
    delivery-status-summary:
      description: Generate concise project status for account team
      source: prompts/tasks.yaml#project_health.status_summary
      inputs:
      - title: account_name
        type: string
      - title: current_phase
        type: string
      - title: date
        type: string
      - title: go_live_date
        type: string
      - title: project_name
        type: string
      outputs:
      - title: status-summary_result
        type: object
      requires_data:
        - source: read-delivery-data
          fields: [project_status, milestone_progress, open_blockers]
          priority: critical
    delivery-go-live-readiness:
