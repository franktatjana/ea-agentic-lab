          fields: [project_status, jira_tickets, slack_signals, customer_escalations]
          priority: critical
    delivery-issue-triage:
      description: Triage and prioritize open issues
      source: prompts/tasks.yaml#risk_issue.issue_triage
      inputs:
      - title: issue_categories
        type: string
      - title: issue_count
        type: string
      - title: project_name
        type: string
