  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information,
      and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - NEVER report delivery status not evidenced in source
    - NEVER invent blockers or delays
    - NEVER assume project health without signals
    - Quote exact status statements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not manage delivery execution (handoff to Delivery Manager)
  - Does not assign delivery tasks (handoff to Delivery Manager)
  - Does not make scope decisions (handoff to Delivery Manager)
  permissions:
  - Track delivery progress signals from notes/status
  - Flag delivery risks (blocked, rescoped, delayed)
  - Generate health summaries for account teams
  - Connect delivery status to account context
  escalation_triggers:
  - Critical delivery risk identification exceeding agent authority (to Delivery Manager)
  handoffs:
    human_escalation: Delivery Manager
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Delivery risk identification
    - Status accuracy
    - Account team visibility
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    references: []
  assets:
  - name: status-note
    filename: '{account}-status-note.md'
    description: Status note
  - name: delivery-risk-alerts
    filename: '{account}-delivery-risk-alerts.md'
    description: Delivery risk alerts
  - name: health-summaries
    filename: '{account}-health-summaries.md'
    description: Health summaries
  quality:
  - All delivery status claims sourced
  - All risks have severity justification
  - No inferred project health
