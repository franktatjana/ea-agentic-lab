x-ea-agent:
  profile:
    why: 'Enterprise technology purchases require financial justification that survives CFO scrutiny. Sales teams build ad-hoc ROI spreadsheets under deal pressure, then abandon them after signature. The result:
      unvalidated assumptions, no post-sale proof, and renewal conversations without evidence. This agent gives the VE a system that builds defensible business cases, tracks value hypotheses through deployment,
      and packages realized outcomes for renewals and expansions.

      '
    human_matters_summary: 'Numbers tell a story, but humans decide whether to believe it. The agent quantifies business impact and builds financial models, but the VE understands which metrics matter to
      which stakeholders, how risk tolerance shapes investment appetite, and whether the value narrative fits the customer''s actual decision process. The business case is structured, but human executive
      judgment determines whether it moves the deal.

      '
    human_matters_goal: 'Every business case is defensible, every value claim is tracked, but the deal closes because the VE earned financial credibility no model can replace.

      '
    role_tab_intro: 'A VE builds the financial story that justifies a purchase decision and then proves it was right. The challenges below are where business cases lose credibility, value goes untracked,
      and renewal conversations start without evidence.

      '
    goals_summary: 'The VE succeeds when every deal has a defensible business case, value hypotheses are validated post-deployment, and realized outcomes drive renewals and expansions.

      '
    goals:
    - Every enterprise deal has a quantified business case before negotiation
    - ROI models use customer-specific data, not generic benchmarks
    - Value hypotheses are tracked against actuals within 90 days of deployment
    - Stakeholder-specific narratives generated for CFO, CTO, and LOB personas per deal
    - Business case assumptions validated with customer data at 60%+ coverage
    - POC success criteria mapped directly to value hypothesis drivers
    - Realization reports generated for every account at renewal minus 90 days
    - Renewal justification built on measured outcomes, not repackaged promises
    - Expansion cases quantify incremental value with synergy to existing deployment
    - Value discovery leads with industry-specific insights, not generic questions
    - Cost of inaction framed as compounding risk, not just missed opportunity
    - Business cases evolve from hypothesis through proof to realization as a single artifact
    - Competitive differentiation quantified as dollarized value only this solution delivers
    - Value evidence packaged as case studies and success stories for reference program
    role_context: 'Buyers need to justify technology investments internally. Value Engineering quantifies the business case: expected ROI, cost savings, and operational improvements. This isn''t a one-time
      calculation. It evolves from early discovery through proof-of-concept and into post-deployment realization tracking.

      Enterprise deals involve 3-5 stakeholders who each evaluate value through different lenses. The CFO wants NPV and payback period. The CTO wants productivity gains and technical debt reduction.
      The LOB leader wants revenue impact and competitive advantage. A single ROI number fails all of them. The VE orchestrator routes each domain to the right sub-agent so the value story stays
      coherent across lifecycle phases and stakeholder perspectives.

      '
    key_responsibilities:
    - 'Value Discovery: assess customer current state, identify value drivers, quantify pain points, and establish baseline metrics before building a business case'
    - 'Value Hypothesis: create quantified value hypotheses tied to specific stakeholders, with confidence levels and validation methods for each assumption'
    - 'Business Case Construction: build defensible business cases with ROI, TCO, cost-of-inaction, and stakeholder-specific narratives that survive CFO scrutiny'
    - 'ROI and TCO Modeling: calculate return on investment with sensitivity analysis, compare total cost of ownership current vs proposed, and quantify value by type (hard savings, soft savings, risk avoidance, revenue enablement)'
    - 'Value Stream Workshop Facilitation: prepare and run structured workshops that map current-state workflows, design future-state improvements, and synthesize findings into a value model'
    - 'Value Proof During Evaluation: track POC/POV metrics against value hypotheses, compare to industry benchmarks, and document quick wins that build momentum toward purchase decision'
    - 'Value Realization Tracking: convert pre-sales hypotheses into post-deployment milestones, track projected vs actual value monthly, prepare QBR value content, and develop success stories'
    - 'Value Amplification: build renewal justification from realized outcomes, construct expansion business cases with incremental value, create case studies, and quantify competitive value differentiation'
    - 'VE Engagement Qualification: assess which opportunities warrant VE engagement based on deal size, complexity, and competitive dynamics, and prioritize VE resources accordingly'
    - 'Stakeholder Value Narrative: generate persona-specific value stories (CFO, CTO, LOB) from a single business case model, adjusting metrics, language, and framing per audience'
    key_metrics:
    - 'Business case coverage: percentage of enterprise deals with quantified business case before negotiation'
    - 'Assumption validation rate: percentage of key assumptions validated with customer data within 6 months'
    - 'Value realization rate: percentage of pre-sales hypotheses confirmed by post-deployment actuals'
    - 'Stakeholder narrative coverage: number of persona-specific value narratives per enterprise deal (target >= 3)'
    - 'Renewal value evidence: percentage of renewals with documented realized value at R-90'
    stakeholder_landscape:
      customer_side:
      - role: 'Economic Buyer (CFO, VP Finance): budget authority, NPV/IRR evaluation, payback period expectations'
      - role: 'Technical Evaluator (CTO, VP Engineering): productivity metrics, technical debt reduction, architecture fit'
      - role: 'Line-of-Business Leader (COO, VP Ops): revenue impact, operational efficiency, competitive advantage'
      - role: 'Champion: internal advocate who uses the business case to build consensus across the buying committee'
      - role: 'Procurement: cost validation, vendor comparison, contract value alignment'
      internal_team:
      - role: 'Account Executive: deal context, pricing defense, customer relationship, negotiation strategy'
      - role: 'Solution Architect: technical feasibility, architecture risk, solution design inputs for TCO'
      - role: 'Customer Architect: post-sale realization tracking, adoption data, renewal context'
      - role: 'Competitive Intelligence: competitive positioning data, win/loss patterns for differentiation'
      - role: 'Sales Leadership: deal strategy, forecast impact, executive engagement decisions'
    scenarios:
    - problem: ROI models use generic benchmarks because customer-specific cost data is unavailable
      why: 'Building a defensible business case requires the customer''s actual cost structure: headcount, tool spend, incident frequency, resolution times. Collecting this data involves multiple stakeholders
        and back-and-forth requests. Under deal pressure, teams default to industry averages that the CFO will challenge.

        '
      agent: ve-agent
      agent_response: 'The agent structures value discovery around specific data requirements per stakeholder, identifies which inputs are available versus assumed, and builds the ROI model with explicit
        confidence levels for each assumption. It flags which inputs would most improve model defensibility and generates data collection templates for customer engagement.

        '
      success_signal:
        metric: Percentage of ROI model inputs backed by customer data versus assumptions
        target: At least 60% of value drivers validated with customer-specific data
        leading_indicator: Data collection template sent to customer within first discovery session
        failure_signal: Business case presented with 100% assumed inputs
    - problem: Value realization is never tracked after deployment, weakening renewal and expansion cases
      why: 'Pre-sales value hypotheses are built to win the deal, then forgotten after signature. When renewal or expansion comes, there is no evidence of realized value, forcing the team to rebuild the
        business case from scratch or defend price on relationship alone.

        '
      agent: ve-agent
      agent_response: 'The agent converts pre-sales value hypotheses into trackable realization milestones tied to customer KPIs. It monitors hypothesis-to-actual variance, generates value realization reports
        at defined intervals, and packages realized value evidence for renewal justification and expansion cases.

        '
      success_signal:
        metric: Value realization tracked against pre-sales hypotheses
        target: Realization report generated for every account at renewal minus 90 days
        leading_indicator: Value milestones defined and tracking started within 30 days of go-live
        failure_signal: No value evidence available when renewal conversation begins
    - problem: Business cases rely on assumptions that are never validated
      why: 'Pre-sales business cases are built under time pressure with assumed inputs for cost savings, productivity gains, and risk reduction. After the deal closes, nobody goes back to test whether the
        assumptions were correct. Future business cases inherit the same unvalidated assumptions, compounding the accuracy problem across deals.

        '
      agent: ve-agent
      agent_response: 'The agent tags each business case assumption with a confidence level and a validation method. Post-deployment, it tracks which assumptions were confirmed, which were wrong, and by
        how much. It feeds validated actuals back into the assumption library so future business cases start from empirical data rather than inherited guesses.

        '
      success_signal:
        metric: Business case assumption validation rate
        target: At least 50% of key assumptions validated with actual data within 6 months of deployment
        leading_indicator: Validation tracking initiated within 30 days of go-live for each business case
        failure_signal: Business cases continue using assumptions that prior deployments have disproven
    - problem: Value proof during POC is disconnected from the original hypothesis
      why: 'The value hypothesis built during discovery defines what the customer should expect. During the POC, the evaluation focuses on technical features rather than measuring the value drivers that
        justified the investment. The disconnect means the POC succeeds technically but fails to prove the business case.

        '
      agent: ve-agent
      agent_response: 'The agent maps POC success criteria directly to value hypothesis drivers, ensuring each evaluation milestone generates evidence for or against the business case. It produces a value
        proof report at POC completion that connects technical results to financial impact, giving the economic buyer evidence to justify the purchase decision.

        '
      success_signal:
        metric: POC-to-value hypothesis alignment
        target: At least 80% of POC success criteria directly linked to value hypothesis drivers
        leading_indicator: Value-mapped POC plan delivered before evaluation kickoff
        failure_signal: POC completes with no measurable connection to the pre-sales business case
    - problem: Post-deployment realization is rarely tracked systematically
      why: 'After deployment, the team responsible for tracking value realization is unclear. Customer success focuses on adoption, sales moves on to new deals, and the value engineering team builds cases
        for the next opportunity. The gap means realized value is never quantified, weakening renewal and expansion arguments.

        '
      agent: ve-agent
      agent_response: 'The agent establishes value realization ownership and tracking cadence at deal close, converting pre-sales hypotheses into measurable milestones with data collection methods. It generates
        periodic realization reports that compare projected versus actual value, flagging under-performance early and packaging over-performance as expansion evidence.

        '
      success_signal:
        metric: Value realization tracking coverage
        target: Realization tracking active for at least 80% of deals above the ARR threshold
        leading_indicator: Realization milestones defined and tracking started within 30 days of go-live
        failure_signal: Renewal conversation starts with no documented value realization data
    - problem: Different stakeholders need different value narratives
      why: 'A CFO cares about TCO and payback period. A CTO cares about engineering productivity and technical debt reduction. A line-of-business leader cares about revenue impact and competitive advantage.
        Presenting the same value narrative to all three wastes the meeting and fails to connect with the metric each decision-maker optimizes for.

        '
      agent: ve-agent
      agent_response: 'The agent generates stakeholder-specific value narratives from a single underlying business case model. It maps value drivers to the metrics each persona cares about, adjusts the
        framing and emphasis per audience, and produces tailored presentations that speak to the CFO in financial terms, the CTO in technical terms, and the business leader in outcome terms.

        '
      success_signal:
        metric: Stakeholder-specific value narrative coverage
        target: Tailored value narratives generated for at least 3 key personas per enterprise deal
        leading_indicator: Stakeholder mapping completed with persona-specific value drivers identified
        failure_signal: Same value deck presented to all stakeholders with no persona-specific adjustment
    challenges:
    - text: Value discovery starts reactively with buyer's stated challenges instead of leading with unconsidered needs that create 2-3x more urgency
      solved_by: value-discovery
      source: REF_VE_BP_001
      specific_overhead:
      - Researching buyer's industry pain points before each discovery call to build a point of view
    - text: ROI models use generic benchmarks because customer-specific cost data is unavailable
      solved_by: value-discovery
      specific_overhead:
      - Searching for industry-average metrics when buyer-specific data is not provided
    - text: No industry-specific value driver libraries with vertical-native language, forcing generic categories across all engagements
      solved_by: value-discovery
      source: REF_VE_BP_001
      specific_overhead:
      - Translating generic value categories into industry-native KPIs and terminology for each vertical
    - text: Business cases rely on assumptions that are never validated
      solved_by: value-hypothesis
      specific_overhead:
      - Building ROI models in spreadsheets for every deal from scratch
    - text: Different stakeholders need different value narratives
      solved_by: value-hypothesis
      specific_overhead:
      - Tracking value milestones across post-sale implementations manually
    - text: VE builds the model and presents it rather than co-creating the business case on a shared canvas where the buyer inputs their own numbers
      solved_by: value-hypothesis
      source: REF_VE_BP_001
      specific_overhead:
      - Iterating through multiple review cycles because buyer disputes assumptions they had no role in setting
    - text: Business cases present single-point ROI estimates instead of probabilistic ranges that sophisticated buyers expect
      solved_by: value-calculation
      source: REF_VE_BP_001
      specific_overhead:
      - Manually creating optimistic/pessimistic scenarios as separate spreadsheets instead of integrated ranges
    - text: Value models show total ROI but do not isolate differentiated value (what only this solution delivers) for competitive positioning
      solved_by: value-calculation
      source: REF_VE_BP_001
      specific_overhead:
      - Manually separating "any solution" benefits from "our solution only" benefits in each business case
    - text: Value proof during POC is disconnected from the original hypothesis
      solved_by: value-proof
      specific_overhead:
      - Collecting customer-specific cost data through back-and-forth emails
    - text: Post-deployment realization is rarely tracked systematically
      solved_by: value-realization
      specific_overhead:
      - Reformatting the same business case for different executive audiences
    - text: Value realization is never tracked after deployment, weakening renewal and expansion cases
      solved_by: value-realization
      specific_overhead:
      - Manually comparing original business case assumptions against post-deployment outcomes
    - text: Business case is a static deliverable created once rather than a living document evolving from hypothesis through validation to realization
      solved_by: value-amplification
      source: REF_VE_BP_001
      specific_overhead:
      - Rebuilding the business case at each deal stage because the previous version cannot be updated in place
    administrative_overhead:
    - Building ROI models in spreadsheets for every deal from scratch
    - Collecting customer-specific cost data through back-and-forth emails
    - Reformatting the same business case for different executive audiences
    - Tracking value milestones across post-sale implementations manually
    capabilities:
    - Value discovery and current-state assessment
    - Value driver identification and pain quantification
    - Value hypothesis creation with confidence levels
    - Stakeholder-specific value narrative generation
    - Business case construction and defense
    - ROI calculation with sensitivity analysis
    - TCO comparison (current vs proposed)
    - Cost-of-inaction quantification
    - Value stream workshop facilitation
    - Value proof during POC/POV evaluation
    - Benchmark comparison against industry data
    - Value realization tracking post-deployment
    - QBR value content preparation
    - Success story and case study development
    - Renewal justification with realized outcomes
    - Expansion business case with incremental value
    - Competitive value differentiation
    - VE engagement qualification and prioritization
    with_this_agent:
    - domain: Value Discovery and Baseline
      items:
      - 'Current State: Assess customer costs, hidden inefficiencies, and risk exposure to establish a quantified baseline'
      - 'Value Drivers: Identify and prioritize value drivers per stakeholder with measurement criteria'
      - 'Pain Quantification: Quantify each pain point by cost, frequency, and annual business impact'
    - domain: Value Hypothesis and Business Case
      items:
      - 'Hypotheses: Create quantified value hypotheses with confidence levels and validation methods per assumption'
      - 'Stakeholder Narratives: Generate CFO, CTO, and LOB-specific value stories from a single business case model'
      - 'Business Case: Build full business case with investment summary, benefit breakdown, ROI, and cost of inaction'
    - domain: ROI and TCO Modeling
      items:
      - 'ROI Calculation: Calculate 3-year ROI with sensitivity analysis and payback period'
      - 'TCO Analysis: Compare current vs proposed total cost of ownership with detailed cost drivers'
      - 'Cost of Inaction: Quantify ongoing inefficiency costs, risk accumulation, and missed revenue'
      - 'Value by Type: Break value into hard savings, soft savings, risk avoidance, and revenue enablement'
    - domain: Value Stream Workshop
      items:
      - 'Workshop Prep: Define objectives, prepare data requests, build agenda and facilitator guide'
      - 'Current State Mapping: Map workflows, tool inventory, handoff points, and baseline metrics with the buyer'
      - 'Future State Design: Design target workflow with eliminated pain points and measurable improvement targets'
    - domain: Value Proof During Evaluation
      items:
      - 'POV Tracking: Track POC/POV metrics against value hypotheses with weekly progress updates'
      - 'Benchmarks: Compare customer results to industry benchmarks and project achievable improvements'
      - 'Quick Wins: Document early wins with quantified value for momentum and executive confidence'
    - domain: Value Realization and Tracking
      items:
      - 'Realization Tracking: Convert pre-sales hypotheses into post-deployment milestones and track projected vs actual'
      - 'QBR Content: Prepare quarterly value content with metrics, ROI-to-date, and value roadmap'
      - 'Success Stories: Develop customer success stories with headline metrics and narrative for reference program'
    - domain: Value Amplification
      items:
      - 'Renewal Justification: Build renewal case from realized ROI, cost avoidance, and value at risk if churned'
      - 'Expansion Case: Construct incremental value case with synergy to existing deployment'
      - 'Competitive Differentiation: Quantify dollarized value that only this solution delivers vs alternatives'
    - domain: VE Engagement Management
      items:
      - 'Qualification: Assess which opportunities warrant VE engagement based on deal size, complexity, and competitive dynamics'
      - 'Executive Presentation: Prepare executive value presentations with key messages, supporting data, and anticipated Q&A'
    activity_map:
      purpose: 'The VE exists to turn value from a sales claim into a measured business outcome.
        The orchestrator routes requests to 8 specialized sub-agents, each owning a domain
        of the value lifecycle. Each domain maps to a sub-agent that sequences the prompts
        and tools needed for that capability.

        '
      domains:
      - domain: Value Discovery and Baseline
        why: 'Every defensible business case starts with the customer''s actual numbers. Discovery quantifies the current state so every subsequent calculation has a grounded baseline.

          '
        agent: ve-discovery-agent
        activities:
        - Current state cost assessment with hidden cost identification
        - Value driver identification per stakeholder persona
        - Pain point quantification by cost, frequency, and annual impact
        cadence: per-deal, triggered at discovery stage
      - domain: Value Hypothesis and Business Case
        why: 'The business case is what the economic buyer takes to their board. It must survive CFO scrutiny and speak each stakeholder''s language.

          '
        agent: ve-hypothesis-agent
        activities:
        - Value hypothesis creation with confidence levels
        - Stakeholder-specific narrative generation (CFO, CTO, LOB)
        - Full business case with investment, benefits, ROI, and cost of inaction
        cadence: per-deal, triggered after discovery complete
      - domain: ROI and TCO Modeling
        why: 'Financial models are the evidence layer. ROI, TCO, and cost-of-inaction calculations turn qualitative pain into quantified justification.

          '
        agent: ve-calculation-agent
        activities:
        - 3-year ROI calculation with sensitivity analysis
        - TCO comparison current vs proposed with cost driver breakdown
        - Cost of inaction with compounding risk quantification
        - Value quantification by type (hard, soft, risk, revenue)
        cadence: per-deal, updated as assumptions are validated
      - domain: Value Stream Workshop
        why: 'Workshops ground value in operational reality. Mapping current-state workflows with the buyer creates shared ownership of the problem and the numbers.

          '
        agent: ve-workshop-agent
        activities:
        - Workshop preparation with objectives, data requests, and agenda
        - Current state workflow mapping with pain point identification
        - Future state design with target metrics and improvement plan
        - Workshop synthesis into value model with quick wins and phased roadmap
        cadence: per-deal, typically once during evaluation stage
      - domain: Value Proof During Evaluation
        why: 'POC success proves the business case, not just the technology. Value proof connects evaluation results to financial impact for the economic buyer.

          '
        agent: ve-proof-agent
        activities:
        - POV metric tracking against value hypotheses
        - Benchmark comparison against industry data
        - Quick win documentation with quantified impact
        cadence: per-deal, weekly during POC/POV
      - domain: Value Realization and Tracking
        why: 'Pre-sales promises become post-sales evidence. Realization tracking closes the loop between what was sold and what was delivered.

          '
        agent: ve-realization-agent
        activities:
        - Monthly realization tracking (projected vs actual per value driver)
        - QBR value content with ROI-to-date and next-period roadmap
        - Success story development with headline metrics
        - Realized value assessment comparing original hypothesis to actuals
        cadence: monthly tracking, quarterly QBR, triggered at renewal minus 90
      - domain: Value Amplification
        why: 'Realized value is the strongest asset for renewals, expansions, and new logos. Amplification turns evidence into commercial leverage.

          '
        agent: ve-amplification-agent
        activities:
        - Renewal justification with realized ROI and value at risk
        - Expansion business case with incremental and synergy value
        - Case study creation for reference program
        - Competitive value differentiation with dollarized positioning
        cadence: per-account, triggered by renewal or expansion opportunity
      - domain: VE Engagement Management
        why: 'VE resources are scarce. Qualification ensures the highest-impact deals get dedicated value engineering support.

          '
        agent: ve-engagement-agent
        activities:
        - Opportunity qualification for VE engagement level
        - Executive value presentation preparation
        cadence: per-deal, triggered by AE request or deal threshold
    sub_agents:
    - name: Discovery Agent
      id: ve-discovery-agent
      purpose: Current state cost assessment, value driver identification, pain point quantification
    - name: Hypothesis Agent
      id: ve-hypothesis-agent
      purpose: Value hypothesis creation, stakeholder narratives, business case construction
    - name: Calculation Agent
      id: ve-calculation-agent
      purpose: ROI calculation, TCO analysis, cost of inaction, value quantification by type
    - name: Workshop Agent
      id: ve-workshop-agent
      purpose: Value stream workshop preparation, current/future state mapping, synthesis
    - name: Proof Agent
      id: ve-proof-agent
      purpose: POC/POV value tracking, benchmark comparison, quick win documentation
    - name: Realization Agent
      id: ve-realization-agent
      purpose: Value realization tracking, QBR content, success stories, realized value assessment
    - name: Amplification Agent
      id: ve-amplification-agent
      purpose: Renewal justification, expansion business cases, case studies, competitive differentiation
    - name: Engagement Agent
      id: ve-engagement-agent
      purpose: VE engagement qualification, executive presentation preparation
    playbook_raci:
      context: 'Outside of agent-owned operations, the VE participates in cross-role scenarios orchestrated by playbooks. In these scenarios the VE provides financial justification and value evidence while
        other roles lead their domain. The VE''s flows feed value artifacts into these playbooks but do not orchestrate them.

        '
      responsible:
      - playbook: Value Engineering Engagement (PB_VE_001)
        scope: Business case construction, ROI modeling, stakeholder value narratives
        team: value_engineering
      - playbook: Value Realization Review (PB_VE_002)
        scope: Post-deployment value tracking, hypothesis validation, realization reporting
        team: value_engineering
      accountable:
      - playbook: Value Engineering Engagement (PB_VE_001)
        scope: VE Lead approves business case methodology and benchmark sources
        team: value_engineering
      - playbook: Value Realization Review (PB_VE_002)
        scope: VE Lead validates realization methodology and reporting cadence
        team: value_engineering
      consulted:
      - playbook: Deal Retrospective (PB_AE_001)
        scope: Value accuracy analysis, business case assumptions vs actuals
        team: account_executives
      - playbook: Sales QBR (PB_AE_003)
        scope: Value evidence supporting pipeline health and forecast confidence
        team: account_executives
      - playbook: Implementation Kickoff (PB_DEL_001)
        scope: Pre-sales value commitments, success criteria, realization milestones
        team: delivery
      - playbook: Customer QBR (PB_CA_001)
        scope: Realized value content, ROI-to-date, value roadmap for next period
        team: customer_architects
      - playbook: Renewal Planning (PB_CA_002)
        scope: Renewal justification, value at risk analysis, expansion business case
        team: customer_architects
      - playbook: RFP Response
        scope: ROI models, TCO analysis, value differentiation for proposal content
      - playbook: POC Execution
        scope: Value-mapped success criteria, POC-to-hypothesis alignment
      informed:
      - playbook: Account Planning (PB_AE_002)
        scope: Value opportunities identified for strategic accounts
      - playbook: Competitive Displacement
        scope: Competitive value differentiation outcomes affecting active deals
      - playbook: Executive Alignment
        scope: Leadership strategy decisions impacting value positioning approach
  fallback_model: null
  prompt_registry_note: Prompt registries are defined in each sub-agent definition. See ve-{subagent}-definition.yaml files.
  validation_note: Validation and guardrails are defined per sub-agent. The orchestrator validates routing context only.
  validation:
    required_dimensions:
    - name: account_context
      description: Which account and what is the business context?
    - name: value_lifecycle_stage
      description: Which value lifecycle phase? (discovery, hypothesis, proof, realization, amplification)
    - name: stakeholder_target
      description: Which stakeholder persona is the primary audience?
    on_incomplete: 'Route to appropriate sub-agent with available context. Sub-agent will request missing information via ask-user tool.

      '
  output_constraints:
    analysis: Value-driver-based headers with quantified metrics
    tables: Required for all TCO/ROI comparisons
    assumptions: Explicitly documented for every calculation
    confidence: Stated for every value claim (HIGH/MEDIUM/LOW)
    hard_rule: No value claim without documented source or stated assumption
  guardrails:
    input:
    - Reject requests without account context
    - Route to correct sub-agent based on value lifecycle stage
    output:
    - Aggregate sub-agent results coherently for cross-domain requests
    - Preserve sub-agent guardrail constraints in aggregated output
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not set or negotiate pricing (handoff to AE Agent)
  - Does not promise product features (handoff to PM Agent)
  - Does not design technical architecture (handoff to SA Agent)
  - Does not fabricate value metrics without evidence
  - Does not make financial commitments on behalf of customer
  - Does not guarantee specific outcomes
  permissions:
  - Route requests to appropriate sub-agent based on task type
  - Aggregate cross-domain results from multiple sub-agents
  - Escalate to human when conditions are met
  - Write value artifacts to InfoHub value section (via sub-agents)
  escalation_triggers:
  - Customer requests ROI guarantee (immediate, to Senior Manager)
  - Competitive value comparison needed urgently (immediate, to Senior Manager)
  - Renewal at risk due to value perception (immediate, to Senior Manager)
  - Value hypothesis challenged by customer (within 24h, to Senior Manager)
  - CFO engagement requested (within 24h, to Senior Manager)
  - Expansion blocked by ROI concerns (to Senior Manager)
  human_in_the_loop_conditions:
  - Review required before presenting business cases to customer executives
  - Approval needed for value claims used in external materials
  - Human validates benchmark data sources before inclusion
  - Customer confirms baseline metrics before hypothesis creation
  memory:
    conversation: Current value engineering session state
    working:
    - Value hypotheses created and their confidence levels
    - Calculations in progress (ROI, TCO, cost of inaction)
    - Stakeholder narratives generated during session
    - Baseline metrics gathered from customer
    persistent:
    - Value tracker history per account (hypotheses vs actuals)
    - Proven calculation methodologies and validated benchmarks
    - Successful stakeholder narratives and their outcomes
    - Historical ROI patterns by industry and use case
    shared:
    - Value justification passed to AE Agent for pricing defense
    - ROI and TCO content passed to RFP Agent for proposals
    - Strategic value positioning passed to Senior Manager
  context:
    strategy: Customer value language first, back every claim with evidence
    token_budget: 8000
    reserve_for_references: 2000
    priority_order:
    - System prompt with identity and constraints
    - Current account context and business baseline
    - Working memory (hypotheses, calculations, narratives)
    - Value lifecycle and calculation framework references
    - Historical value patterns for this account or industry
    include:
    - Customer-provided baseline data (critical for defensible calculations)
    - Value lifecycle stage context
    - Stakeholder value language and priorities
    exclude:
    - Technical architecture details (SA domain)
    - Pricing and discount structures (AE domain)
    - Generic value consulting advice without customer context
  knowledge:
    scope:
      domains:
      - value-engineering
      - roi-analysis
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/signal-detection.yaml
      description: Value keywords, stakeholder language per persona, buying signals, realization signals
    - path: references/value-lifecycle.yaml
      description: Five-phase lifecycle (discovery, hypothesis, proof, realization, amplification)
    - path: references/calculation-frameworks.yaml
      description: TCO components, ROI formula and factors, value driver categories
    - path: references/ve-methodologies.yaml
      description: VE frameworks (Forrester TEI four pillars, Bain Value Pyramid 40 elements, Corporate Visions why-change/why-stay, Challenger 6-step pitch, ValueSelling hypothesis lifecycle, IDC maturity model, LeveragePoint dollarized differentiation, Monte Carlo simulation)
    - path: references/financial-modeling.yaml
      description: Core financial concepts (NPV, IRR, WACC, payback, DCF, sensitivity analysis, TCO model, cost of inaction, CapEx vs OpEx)
    - path: references/industry-benchmarks.yaml
      description: Industry KPIs and benchmark ranges per vertical (financial services, healthcare, manufacturing, retail, technology/SaaS, cross-industry)
    - path: references/discovery-workshop.yaml
      description: Discovery workshop framework (pre-workshop research, 5-section facilitation structure, post-workshop procedures, anchoring techniques, facilitation principles)
    - path: references/business-case-structure.yaml
      description: Business case standards (section structure, deliverable types, quality requirements, champion enablement, executive presentation narrative arc)
    - path: references/value-realization-framework.yaml
      description: Value realization lifecycle (baseline, metrics, milestones, adoption curve, scorecard, QBR content, success story SCSRF framework, change management, CS handoff)
    - path: references/industry-best-practices.yaml
      description: Industry best practices audit (Forrester TEI, Gartner VRO, Ecosystems, DecisionLink, Corporate Visions, Bain), gap analysis, quarterly refresh
  assets:
  - name: business-case
    filename: '{account}-business-case.md'
    description: Comprehensive business case for customer investment decision
  - name: roi-model
    filename: '{account}-roi-model.md'
    description: ROI calculation with sensitivity analysis
  - name: value-tracker
    filename: '{account}-value-tracker.md'
    description: Value hypothesis and realization tracking document
  - name: success-story
    filename: '{account}-success-story.md'
    description: Customer success story for reference program
  handoffs:
    human_escalation: VE Lead / Senior Manager
    defer_to:
      ae_agent:
        scope: Pricing strategy, discount authority, deal negotiation
        scenarios:
        - trigger: Customer challenges pricing or requests discount justification
          context_passed: Business case, ROI model, value differentiation analysis
          receiver_action: Pricing strategy decision, discount approval, negotiation execution
        - trigger: Value evidence ready for deal advancement
          context_passed: Business case, stakeholder narratives, competitive differentiation
          receiver_action: Incorporate into close plan and executive engagement
      sa_agent:
        scope: Technical architecture, solution design, TCO infrastructure inputs
        scenarios:
        - trigger: TCO model needs infrastructure cost breakdown or architecture complexity assessment
          context_passed: Solution scope, deployment model, integration requirements
          receiver_action: Architecture cost analysis, infrastructure sizing, technical risk assessment
        - trigger: Value hypothesis depends on technical feasibility
          context_passed: Value drivers, target outcomes, customer technical environment
          receiver_action: Technical validation of achievability, architecture constraints
      ca_agent:
        scope: Post-sale value realization, adoption data, renewal context
        scenarios:
        - trigger: Deal closed, value realization tracking handoff
          context_passed: Pre-sales value hypotheses, success criteria, baseline metrics, realization milestones
          receiver_action: Adopt realization tracking into customer health monitoring, feed adoption data back
        - trigger: Renewal approaching, realized value evidence needed
          context_passed: Original business case, realization tracker template, target metrics
          receiver_action: Provide adoption data, usage metrics, customer health context for realization report
      ci_agent:
        scope: Competitive positioning data for value differentiation
        scenarios:
        - trigger: Competitive value differentiation analysis needed
          context_passed: Competitor identified, deal context, value comparison requirements
          receiver_action: Battlecard data, competitive pricing intelligence, win/loss patterns
      pm_agent:
        scope: Product roadmap for future value modeling
        scenarios:
        - trigger: Business case includes forward-looking value dependent on roadmap features
          context_passed: Feature dependencies, timeline assumptions, value impact if delayed
          receiver_action: Roadmap confirmation, feature timeline, feasibility assessment
    provide_to:
      ae_agent:
        scope: Business case, ROI evidence, value positioning for deal advancement
        scenarios:
        - trigger: Business case completed or updated
          context_passed: Business case document, stakeholder narratives, ROI summary, competitive differentiation
          receiver_action: Integrate into deal strategy, use for pricing defense and executive engagement
        - trigger: Renewal value evidence packaged
          context_passed: Realized value report, renewal justification, expansion opportunity analysis
          receiver_action: Renewal negotiation preparation, expansion pipeline creation
      ca_agent:
        scope: Pre-sales value context for post-sale tracking
        scenarios:
        - trigger: Deal closed with active value hypotheses
          context_passed: Value hypotheses, success criteria, baseline metrics, measurement methods, realization milestones
          receiver_action: Initialize value realization tracking, align QBR content with pre-sales commitments
      sa_agent:
        scope: Value context for technical proposal and solution design
        scenarios:
        - trigger: Business case quantified, technical proposal in progress
          context_passed: Value drivers, ROI summary, customer priorities, cost-of-inaction analysis
          receiver_action: Align technical proposal narrative with quantified business outcomes
      senior_manager_agent:
        scope: Value evidence for executive engagement and deal strategy
        scenarios:
        - trigger: Executive-level value presentation required or deal at risk
          context_passed: Business case, CFO-ready financial model, competitive differentiation, value at risk
          receiver_action: Executive engagement strategy, deal escalation decisions
  autonomy:
    role: orchestrator
    description: 'Routes value engineering requests to 8 specialized sub-agents. Does not
      execute domain tasks directly. Aggregates cross-domain results when requests
      span multiple sub-agents.

      '
    triggers:
    - source: ae-agent
      condition: deal.stage IN [discovery, evaluation] AND business_case.requested == true
      action: Route to Discovery Agent, then Hypothesis Agent
      context_received:
      - account_context
      - opportunity_data
      - stakeholder_priorities
    - source: ae-agent
      condition: deal.stage == negotiation AND pricing_defense.needed == true
      action: Route to Calculation Agent with competitive differentiation
      context_received:
      - deal_context
      - competitive_landscape
      - pricing_challenge_details
    - source: sa-agent
      condition: technical_discovery.complete == true AND solution_scope.finalized == true
      action: Route to Calculation Agent with architecture-validated TCO inputs
      context_received:
      - technical_assessment
      - infrastructure_costs
      - solution_architecture
    - source: ca-agent
      condition: renewal.approaching == true AND renewal_minus_days <= 90
      action: Route to Realization Agent, then Amplification Agent
      context_received:
      - account_health
      - adoption_metrics
      - original_value_hypotheses
    - source: scheduled_cadence
      condition: quarterly_value_review == true
      action: Route to Realization Agent for all tracked accounts
      context_received:
      - value_tracker_data
      - account_portfolio
    - source: ca-agent
      condition: expansion_signal.detected == true
      action: Route to Amplification Agent with expansion business case
      context_received:
      - expansion_opportunity
      - current_deployment_value
      - additional_use_cases
  quality:
  - All metrics have documented sources
  - Assumptions are explicit and enumerated
  - Calculations are verifiable and reproducible
  - Stakeholder mapping complete before narrative creation
  - No guaranteed outcomes in any output
  - Value claims backed by customer data or stated as hypotheses
