# VE Agent — Portable Agent Definition
# Aligned with Oracle Agent Spec 26.1.0
#
# Standard fields follow Agent Spec component model.
# EA-Agentic-Lab extensions use the x-ea-agent namespace.
#
# Derived from ve-agent.md, ve_personality.yaml, ve_agent.yaml (sources of truth).

# ============================================================
# AGENT SPEC STANDARD ZONE
# ============================================================

agentspec_version: "26.1.0"
component_type: Agent

id: ve-agent
name: Value Engineering Agent
description: >
  Builds and defends the business case for investment across the full customer
  lifecycle, from pre-sales value discovery through post-sales realization
  tracking. Quantifies outcomes in the customer's language, tracks hypotheses
  against actuals, and packages realized value for renewals and expansions.

metadata:
  definition_version: "0.1.0"
  disclaimer: >
    This agent specification is a reference design for educational and
    demonstration purposes. It is not a production system. All examples,
    case studies, and scenarios are fictional.
  tags:
    - value-engineering
    - business-case
    - roi
    - tco
    - value-realization
    - sales
  responsibility: >
    Quantify, track, and prove business value throughout the customer
    lifecycle. Build defensible ROI models, track hypotheses against actuals,
    create stakeholder-specific value narratives, and turn value from a
    sales claim into a measured business outcome.

system_prompt: |
  You are a Value Engineering Intelligence Agent. Your job is to quantify,
  track, and prove business value throughout the customer lifecycle.

  Core principle: if you can't prove the value, you can't defend the price.

  You MUST:
  - Build value hypotheses with customer stakeholders during discovery
  - Quantify business impact using TCO, ROI, and value driver frameworks
  - Design value realization tracking tied to customer KPIs
  - Create stakeholder-specific value narratives (CFO, CTO, CISO, COO)
  - Document realized value for renewal justification and expansion cases
  - Defend pricing with evidence-based value positioning
  - Speak the stakeholder's financial language
  - Quantify in currency, percentages, or time
  - Back every value claim with customer data
  - State assumptions explicitly
  - Use ranges with confidence levels when precision is impossible

  You MUST NOT:
  - Set or negotiate pricing (AE Agent's domain)
  - Promise product features (PM Agent's domain)
  - Design technical architecture (SA Agent's domain)
  - Fabricate value metrics without evidence
  - Make financial commitments on behalf of customer
  - Guarantee specific outcomes

  NEVER fabricate benchmark data. NEVER guarantee specific ROI outcomes.
  NEVER invent customer cost structures. NEVER claim realized value without
  evidence. NEVER use generic case studies as specific proof.

  When uncertain: present as hypothesis (not fact), use ranges with
  confidence levels, state "estimate pending validation."

  Output format: markdown with value-driver-based headers, tables for
  TCO comparisons and ROI calculations, bold for key metrics and
  stakeholder benefits.

human_in_the_loop: true

llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.5
    max_tokens: 4096

inputs:
  - title: account_context
    type: object
    description: Account name, industry, tier, strategic priorities, stakeholders
  - title: business_context
    type: string
    description: Current environment, tools, costs, pain points, baseline metrics
  - title: opportunity_context
    type: object
    description: Opportunity name, stage, ARR, close date, use cases
    default: null
  - title: task_type
    type: string
    description: Which value engineering task to perform
  - title: personality
    type: string
    description: Personality variant to use
    default: default
  - title: output_format
    type: string
    description: Response format
    default: markdown

outputs:
  - title: analysis
    type: object
    description: Value analysis output (varies by task type, e.g., business case, ROI model, value tracker)
  - title: actions
    type: array
    description: Recommended next steps with owners and timelines
  - title: artifacts
    type: array
    description: Generated documents (business case, ROI model, value tracker update, success story)

tools:
  - component_type: ClientTool
    id: read-account-data
    name: Read Account Data
    description: Access account context, stakeholder data, and business context from vault
    requires_confirmation: false
    inputs:
      - title: account_path
        type: string
    outputs:
      - title: account_data
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry

  - component_type: ClientTool
    id: read-value-tracker
    name: Read Value Tracker
    description: Access value hypothesis and realization data from InfoHub
    requires_confirmation: false
    inputs:
      - title: tracker_path
        type: string
    outputs:
      - title: tracker_data
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry

  - component_type: ClientTool
    id: write-value-artifact
    name: Write Value Artifact
    description: Save business case, ROI model, or value tracker update to InfoHub
    requires_confirmation: true
    inputs:
      - title: artifact_type
        type: string
      - title: content
        type: object
      - title: destination_path
        type: string
    outputs:
      - title: status
        type: string
    x-ea-agent:
      risk: medium
      resolver: service-registry

  - component_type: ClientTool
    id: ask-user
    name: Ask User
    description: Request additional information, baseline data, or validation from user
    requires_confirmation: false
    inputs:
      - title: question
        type: string
    outputs:
      - title: answer
        type: string
    x-ea-agent:
      risk: low
      resolver: inline

toolboxes: []

# --- Specialized Agents (personality variants) ---

specialized_agents:
  - component_type: SpecializedAgent
    id: ve-agent-pre-sales
    name: VE Agent (Pre-Sales)
    description: Discovery, hypothesis, and calculation for new deals
    agent:
      $component_ref: ve-agent
    agent_specialization_parameters:
      additional_instructions: |
        Focus on building compelling forward-looking business cases. Emphasize
        value discovery, hypothesis creation, and ROI/TCO calculations for
        new opportunities. Use competitive value differentiation when
        positioning against alternatives. Build urgency through cost-of-
        inaction analysis. Keep calculations conservative and defensible.
        Tailor narratives to the primary decision maker's language.
      human_in_the_loop: true

  - component_type: SpecializedAgent
    id: ve-agent-post-sales
    name: VE Agent (Post-Sales)
    description: Realization tracking, amplification, and renewal justification
    agent:
      $component_ref: ve-agent
    agent_specialization_parameters:
      additional_instructions: |
        Focus on realized value evidence and proven outcomes. Track
        hypotheses against actuals, document value delivered, and build
        renewal justification from evidence. Create success stories and
        case studies from verified results. Support expansion business
        cases by building on current proven value. Be conservative on
        claims, only report value that is documented and validated.
      human_in_the_loop: true

# --- Flows (skills as Agent Spec Flows) ---

flows:
  - component_type: Flow
    id: value-discovery
    name: Value Discovery
    description: Assess customer current state costs, identify value drivers, and quantify pain points to establish a value baseline.
    inputs:
      - title: account_context
        type: object
      - title: business_context
        type: string
      - title: current_tools
        type: array
    outputs:
      - title: current_state_assessment
        type: object
      - title: value_driver_map
        type: object
      - title: pain_point_quantification
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: ve-current-state-assessment
          input: account_name, business_context, current_tools
          description: Assess current spending, hidden costs, inefficiencies, and risk exposure
        - step: 2
          prompt: ve-value-driver-identification
          input: stakeholder_list, priorities
          description: Map value drivers per stakeholder with priority and measurement criteria
        - step: 3
          prompt: ve-pain-point-quantification
          input: pain_points, context
          description: Quantify each pain point by cost, frequency, and annual impact

  - component_type: Flow
    id: value-hypothesis
    name: Value Hypothesis
    description: Create quantified value hypotheses, stakeholder-specific narratives, and comprehensive business cases.
    inputs:
      - title: account_context
        type: object
      - title: baseline_metrics
        type: object
      - title: target_outcomes
        type: object
    outputs:
      - title: value_hypothesis
        type: object
      - title: stakeholder_narrative
        type: object
      - title: business_case
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: ve-create-value-hypothesis
          input: account_name, baseline_metrics, target_outcomes
          description: Create hypothesis with baseline, target, timeline, and confidence level
        - step: 2
          prompt: ve-stakeholder-value-narrative
          input: stakeholder_role, stakeholder_priorities, hypothesis
          description: Create targeted narrative with metrics, language, and objection handling
        - step: 3
          prompt: ve-business-case-development
          input: opportunity_value, hypothesis, decision_maker
          description: Build full business case with investment, benefits, ROI, and cost of inaction

  - component_type: Flow
    id: value-calculation
    name: Value Calculation
    description: Calculate ROI, analyze TCO, assess cost of inaction, and quantify value across all value types.
    inputs:
      - title: account_context
        type: object
      - title: investment_details
        type: object
      - title: benefit_details
        type: object
      - title: current_tools
        type: array
    outputs:
      - title: roi_calculation
        type: object
      - title: tco_analysis
        type: object
      - title: cost_of_inaction
        type: object
      - title: value_quantification
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: ve-roi-calculation
          input: account_name, investment_details, benefit_details, timeline
          description: Calculate 3-year ROI with sensitivity analysis and payback period
        - step: 2
          prompt: ve-tco-analysis
          input: account_name, current_tools, solution, years
          description: Compare current vs proposed TCO with cost drivers and net savings
        - step: 3
          prompt: ve-cost-of-inaction
          input: pain_points, risks, growth
          description: Calculate ongoing inefficiency costs, risk accumulation, and missed opportunities
        - step: 4
          prompt: ve-value-quantification-by-type
          input: use_cases, baselines
          description: Quantify hard savings, soft savings, risk avoidance, and revenue enablement

  - component_type: Flow
    id: value-stream-workshop
    name: Value Stream Workshop
    description: Prepare and facilitate value stream workshops, map current and future state, and synthesize into value model.
    inputs:
      - title: account_context
        type: object
      - title: workshop_date
        type: string
      - title: attendees
        type: array
      - title: focus_area
        type: string
    outputs:
      - title: workshop_plan
        type: object
      - title: current_state_map
        type: object
      - title: future_state_design
        type: object
      - title: workshop_synthesis
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: ve-workshop-preparation
          input: account_name, date, attendees, focus
          description: Define objectives, prepare data request, build agenda and facilitator guide
        - step: 2
          prompt: ve-current-state-mapping
          input: process_area, findings
          description: Map workflows, tool inventory, handoff points, pain points, baseline metrics
        - step: 3
          prompt: ve-future-state-design
          input: current_state, capabilities
          description: Design future workflow with eliminated pain points and target metrics
        - step: 4
          prompt: ve-workshop-synthesis
          input: current_state, future_state, metrics
          description: Synthesize into value opportunity, quick wins, phased roadmap, prioritization

  - component_type: Flow
    id: value-proof
    name: Value Proof
    description: Track value metrics during POV, compare to benchmarks, and document quick wins.
    inputs:
      - title: account_context
        type: object
      - title: success_criteria
        type: object
      - title: customer_metrics
        type: object
    outputs:
      - title: pov_tracker
        type: object
      - title: benchmark_comparison
        type: object
      - title: quick_wins
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: ve-pov-value-tracking
          input: account_name, success_criteria, duration, status
          description: Track POV metrics against baseline, document early wins, forecast success
        - step: 2
          prompt: ve-benchmark-comparison
          input: customer_metrics, industry, use_case
          description: Compare to industry benchmarks, identify gaps, project achievable improvement
        - step: 3
          prompt: ve-quick-win-documentation
          input: quick_wins, timeline
          description: Document quick wins with quantified value, validation, and amplification plan

  - component_type: Flow
    id: value-realization
    name: Value Realization
    description: Track realized value monthly, prepare QBR value content, develop success stories, and assess comprehensive value delivered.
    inputs:
      - title: account_context
        type: object
      - title: tracker_data
        type: object
      - title: review_period
        type: string
    outputs:
      - title: value_tracker_update
        type: object
      - title: qbr_value_content
        type: object
      - title: success_story
        type: object
      - title: realized_value_assessment
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: ve-value-tracker-update
          input: account_name, tracker_link, review_period
          description: Update hypothesis vs actual, evidence log, highlights, forecast
        - step: 2
          prompt: ve-qbr-value-content
          input: account_name, quarter, tracker, stakeholders
          description: Prepare QBR value content with metrics, ROI to date, and roadmap
        - step: 3
          prompt: ve-success-story-development
          input: value_summary, metrics
          description: Develop success story with narrative, headline metrics, and customer quote
        - step: 4
          prompt: ve-realized-value-assessment
          input: duration, original_case
          description: Full assessment comparing original hypothesis to realized value

  - component_type: Flow
    id: value-amplification
    name: Value Amplification
    description: Build renewal justification, expansion business cases, case studies, and competitive value differentiation.
    inputs:
      - title: account_context
        type: object
      - title: value_summary
        type: object
      - title: expansion_scope
        type: object
    outputs:
      - title: renewal_justification
        type: object
      - title: expansion_case
        type: object
      - title: case_study
        type: object
      - title: value_differentiation
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: ve-renewal-value-justification
          input: account_name, arr, value_summary
          description: Build renewal case with ROI, cost avoidance, value at risk, price justification
        - step: 2
          prompt: ve-expansion-business-case
          input: current_deployment, expansion_scope, investment
          description: Build expansion case with incremental value, synergies, and expansion ROI
        - step: 3
          prompt: ve-case-study-creation
          input: value_summary, approval_status
          description: Create formal case study with challenge, solution, results, and customer quote
        - step: 4
          prompt: ve-competitive-value-differentiation
          input: vendor_value, competitive_context
          description: Differentiate on value with TCO comparison, unique value points, proof points

  - component_type: Flow
    id: ve-engagement
    name: VE Engagement
    description: Qualify opportunities for VE engagement and prepare executive value presentations.
    inputs:
      - title: account_context
        type: object
      - title: opportunity_details
        type: object
      - title: business_case
        type: object
    outputs:
      - title: qualification
        type: object
      - title: presentation_plan
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: ve-engagement-qualification
          input: account_name, opportunity_details, stage, arr
          description: Qualify for VE engagement with criteria checklist and recommended level
        - step: 2
          prompt: ve-executive-presentation-prep
          input: executive_audience, business_case, objective
          description: Prepare executive presentation with outline, key messages, and Q&A

# --- A2A Discovery ---

a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: "0.1"
    capabilities:
      - value-discovery
      - value-hypothesis
      - value-calculation
      - value-stream-workshop
      - value-proof
      - value-realization
      - value-amplification
      - ve-engagement
    input_modes:
      - text/plain
      - application/json
    output_modes:
      - application/yaml
      - application/json
      - text/markdown
      - text/plain

# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:

  profile:
    role_context: >
      Buyers need to justify technology investments internally. Value
      Engineering quantifies the business case: expected ROI, cost savings, and
      operational improvements. This isn't a one-time calculation. It evolves
      from early discovery through proof-of-concept and into post-deployment
      realization tracking.
    scenarios:
      - problem: "ROI models use generic benchmarks because customer-specific cost data is unavailable"
        why: >
          Building a defensible business case requires the customer's actual cost structure:
          headcount, tool spend, incident frequency, resolution times. Collecting this data
          involves multiple stakeholders and back-and-forth requests. Under deal pressure,
          teams default to industry averages that the CFO will challenge.
        agent: ve-agent
        agent_response: >
          The agent structures value discovery around specific data requirements per
          stakeholder, identifies which inputs are available versus assumed, and builds
          the ROI model with explicit confidence levels for each assumption. It flags
          which inputs would most improve model defensibility and generates data
          collection templates for customer engagement.
        success_signal:
          metric: "Percentage of ROI model inputs backed by customer data versus assumptions"
          target: "At least 60% of value drivers validated with customer-specific data"
          leading_indicator: "Data collection template sent to customer within first discovery session"
          failure_signal: "Business case presented with 100% assumed inputs"
      - problem: "Value realization is never tracked after deployment, weakening renewal and expansion cases"
        why: >
          Pre-sales value hypotheses are built to win the deal, then forgotten after
          signature. When renewal or expansion comes, there is no evidence of realized
          value, forcing the team to rebuild the business case from scratch or defend
          price on relationship alone.
        agent: ve-agent
        agent_response: >
          The agent converts pre-sales value hypotheses into trackable realization
          milestones tied to customer KPIs. It monitors hypothesis-to-actual variance,
          generates value realization reports at defined intervals, and packages
          realized value evidence for renewal justification and expansion cases.
        success_signal:
          metric: "Value realization tracked against pre-sales hypotheses"
          target: "Realization report generated for every account at renewal minus 90 days"
          leading_indicator: "Value milestones defined and tracking started within 30 days of go-live"
          failure_signal: "No value evidence available when renewal conversation begins"
      - problem: "Business cases rely on assumptions that are never validated"
        why: >
          Pre-sales business cases are built under time pressure with assumed inputs
          for cost savings, productivity gains, and risk reduction. After the deal
          closes, nobody goes back to test whether the assumptions were correct. Future
          business cases inherit the same unvalidated assumptions, compounding the
          accuracy problem across deals.
        agent: ve-agent
        agent_response: >
          The agent tags each business case assumption with a confidence level and a
          validation method. Post-deployment, it tracks which assumptions were confirmed,
          which were wrong, and by how much. It feeds validated actuals back into the
          assumption library so future business cases start from empirical data rather
          than inherited guesses.
        success_signal:
          metric: "Business case assumption validation rate"
          target: "At least 50% of key assumptions validated with actual data within 6 months of deployment"
          leading_indicator: "Validation tracking initiated within 30 days of go-live for each business case"
          failure_signal: "Business cases continue using assumptions that prior deployments have disproven"
      - problem: "Value proof during POC is disconnected from the original hypothesis"
        why: >
          The value hypothesis built during discovery defines what the customer should
          expect. During the POC, the evaluation focuses on technical features rather
          than measuring the value drivers that justified the investment. The disconnect
          means the POC succeeds technically but fails to prove the business case.
        agent: ve-agent
        agent_response: >
          The agent maps POC success criteria directly to value hypothesis drivers,
          ensuring each evaluation milestone generates evidence for or against the
          business case. It produces a value proof report at POC completion that
          connects technical results to financial impact, giving the economic buyer
          evidence to justify the purchase decision.
        success_signal:
          metric: "POC-to-value hypothesis alignment"
          target: "At least 80% of POC success criteria directly linked to value hypothesis drivers"
          leading_indicator: "Value-mapped POC plan delivered before evaluation kickoff"
          failure_signal: "POC completes with no measurable connection to the pre-sales business case"
      - problem: "Post-deployment realization is rarely tracked systematically"
        why: >
          After deployment, the team responsible for tracking value realization is
          unclear. Customer success focuses on adoption, sales moves on to new deals,
          and the value engineering team builds cases for the next opportunity. The
          gap means realized value is never quantified, weakening renewal and
          expansion arguments.
        agent: ve-agent
        agent_response: >
          The agent establishes value realization ownership and tracking cadence at
          deal close, converting pre-sales hypotheses into measurable milestones with
          data collection methods. It generates periodic realization reports that
          compare projected versus actual value, flagging under-performance early
          and packaging over-performance as expansion evidence.
        success_signal:
          metric: "Value realization tracking coverage"
          target: "Realization tracking active for at least 80% of deals above the ARR threshold"
          leading_indicator: "Realization milestones defined and tracking started within 30 days of go-live"
          failure_signal: "Renewal conversation starts with no documented value realization data"
      - problem: "Different stakeholders need different value narratives"
        why: >
          A CFO cares about TCO and payback period. A CTO cares about engineering
          productivity and technical debt reduction. A line-of-business leader cares
          about revenue impact and competitive advantage. Presenting the same value
          narrative to all three wastes the meeting and fails to connect with the
          metric each decision-maker optimizes for.
        agent: ve-agent
        agent_response: >
          The agent generates stakeholder-specific value narratives from a single
          underlying business case model. It maps value drivers to the metrics each
          persona cares about, adjusts the framing and emphasis per audience, and
          produces tailored presentations that speak to the CFO in financial terms,
          the CTO in technical terms, and the business leader in outcome terms.
        success_signal:
          metric: "Stakeholder-specific value narrative coverage"
          target: "Tailored value narratives generated for at least 3 key personas per enterprise deal"
          leading_indicator: "Stakeholder mapping completed with persona-specific value drivers identified"
          failure_signal: "Same value deck presented to all stakeholders with no persona-specific adjustment"
    challenges:
      - "Business cases rely on assumptions that are never validated"
      - "Value proof during POC is disconnected from the original hypothesis"
      - "Post-deployment realization is rarely tracked systematically"
      - "Different stakeholders need different value narratives"
      - "ROI models use generic benchmarks because customer-specific cost data is unavailable"
      - "Value realization is never tracked after deployment, weakening renewal and expansion cases"
    administrative_overhead:
      - "Building ROI models in spreadsheets for every deal from scratch"
      - "Collecting customer-specific cost data through back-and-forth emails"
      - "Reformatting the same business case for different executive audiences"
      - "Tracking value milestones across post-sale implementations manually"
    capabilities:
      - "Value discovery and hypothesis"
      - "Business case construction"
      - "ROI modeling and calculation"
      - "Value proof during evaluation"
      - "Realization tracking post-deployment"
    human_matters_summary: >
      Numbers tell a story, but humans decide whether to believe it. The agent
      quantifies business impact and builds financial models, but the VE
      understands which metrics matter to which stakeholders, how risk tolerance
      shapes investment appetite, and whether the value narrative fits the
      customer's actual decision process. The business case is structured, but
      human executive judgment determines whether it moves the deal.

  fallback_model: null

  prompt_registry:
    # Value Discovery (3 prompts)
    ve-current-state-assessment:
      description: Assess customer current state costs, hidden costs, inefficiencies, and risk exposure
      source: prompts/tasks.yaml#value_discovery.current_state_assessment
      inputs:
        - title: account_name
          type: string
        - title: business_context
          type: string
        - title: current_tools
          type: array
      outputs:
        - title: current_state_assessment
          type: object
      requires_data:
        - source: read-account-data
          fields: [account_profile, business_context, current_tools, cost_structure]
          priority: critical

    ve-value-driver-identification:
      description: Identify and map customer value drivers per stakeholder with priority and measurement
      source: prompts/tasks.yaml#value_discovery.value_driver_identification
      inputs:
        - title: stakeholder_list
          type: array
        - title: priorities
          type: string
      outputs:
        - title: value_driver_map
          type: object
      requires_data:
        - source: read-account-data
          fields: [stakeholder_map, strategic_priorities]
          priority: critical

    ve-pain-point-quantification:
      description: Quantify business impact of customer pain points by cost, frequency, and annual impact
      source: prompts/tasks.yaml#value_discovery.pain_point_quantification
      inputs:
        - title: pain_points
          type: array
        - title: context
          type: string
      outputs:
        - title: pain_quantification
          type: object
      requires_data:
        - source: read-account-data
          fields: [business_context, cost_structure]
          priority: enrichment

    # Value Hypothesis (3 prompts)
    ve-create-value-hypothesis:
      description: Create quantified value hypothesis with baseline, target, timeline, and confidence
      source: prompts/tasks.yaml#value_hypothesis.create_value_hypothesis
      inputs:
        - title: account_name
          type: string
        - title: baseline_metrics
          type: object
        - title: target_outcomes
          type: object
      outputs:
        - title: value_hypothesis
          type: object
      requires_data:
        - source: read-account-data
          fields: [account_profile, baseline_metrics, strategic_priorities]
          priority: critical
        - source: read-value-tracker
          fields: [existing_hypotheses, historical_baselines]
          priority: enrichment

    ve-stakeholder-value-narrative:
      description: Create stakeholder-specific value narrative with metrics, language, and objection handling
