          priority: enrichment

  validation:
    required_dimensions:
      - name: account_context
        description: Which account and what is the business context?
      - name: value_lifecycle_stage
        description: Which value lifecycle phase? (discovery, hypothesis, proof, realization, amplification)
      - name: stakeholder_target
        description: Which stakeholder persona is the primary audience?
    on_incomplete: >
      State what's missing, provide a preliminary value framework based on
      available information, and ask for the missing context. Do not generate
      a full business case from incomplete input.

  output_constraints:
    analysis: "Value-driver-based headers with quantified metrics"
    tables: "Required for all TCO/ROI comparisons"
    assumptions: "Explicitly documented for every calculation"
    confidence: "Stated for every value claim (HIGH/MEDIUM/LOW)"
    total_word_limit: 500
    hard_rule: "No value claim without documented source or stated assumption"

  guardrails:
    input:
      - Reject value analysis requests without account context or baseline data
      - Stop and clarify if stakeholder personas are unspecified for narrative creation
    output:
      - Always include assumptions and methodology for calculations
      - No guaranteed outcomes in any output
      - Ranges with confidence levels when precision is impossible
      - All metrics have documented sources
    resource:
      - max_tool_calls: 30

  boundaries:
    - Does not set or negotiate pricing (handoff to AE Agent)
    - Does not promise product features (handoff to PM Agent)
    - Does not design technical architecture (handoff to SA Agent)
    - Does not fabricate value metrics without evidence
    - Does not make financial commitments on behalf of customer
    - Does not guarantee specific outcomes

  permissions:
    - Build value hypotheses with customer stakeholders
    - Quantify business impact using TCO, ROI, and value driver frameworks
    - Design value realization tracking tied to customer KPIs
    - Create stakeholder-specific value narratives (CFO, CTO, CISO, COO)
    - Document realized value for renewal justification
    - Write value artifacts to InfoHub value section
    - Access benchmark and industry reference data

  escalation_triggers:
    - Customer requests ROI guarantee (immediate, to Senior Manager)
    - Competitive value comparison needed urgently (immediate, to Senior Manager)
    - Renewal at risk due to value perception (immediate, to Senior Manager)
    - Value hypothesis challenged by customer (within 24h, to Senior Manager)
    - CFO engagement requested (within 24h, to Senior Manager)
    - Expansion blocked by ROI concerns (to Senior Manager)

  human_in_the_loop_conditions:
    - Review required before presenting business cases to customer executives
    - Approval needed for value claims used in external materials
    - Human validates benchmark data sources before inclusion
    - Customer confirms baseline metrics before hypothesis creation

  memory:
    conversation: "Current value engineering session state"
    working:
      - Value hypotheses created and their confidence levels
      - Calculations in progress (ROI, TCO, cost of inaction)
      - Stakeholder narratives generated during session
      - Baseline metrics gathered from customer
    persistent:
      - Value tracker history per account (hypotheses vs actuals)
      - Proven calculation methodologies and validated benchmarks
      - Successful stakeholder narratives and their outcomes
      - Historical ROI patterns by industry and use case
    shared:
      - Value justification passed to AE Agent for pricing defense
      - ROI and TCO content passed to RFP Agent for proposals
      - Strategic value positioning passed to Senior Manager

  context:
    strategy: "Customer value language first, back every claim with evidence"
    token_budget: 8000
    reserve_for_references: 2000
    priority_order:
      - System prompt with identity and constraints
      - Current account context and business baseline
      - Working memory (hypotheses, calculations, narratives)
      - Value lifecycle and calculation framework references
      - Historical value patterns for this account or industry
    include:
      - Customer-provided baseline data (critical for defensible calculations)
      - Value lifecycle stage context
      - Stakeholder value language and priorities
    exclude:
      - Technical architecture details (SA domain)
      - Pricing and discount structures (AE domain)
      - Generic value consulting advice without customer context

  knowledge:
    scope:
      domains: [value-engineering, roi-analysis]
      archetypes: [enterprise, mid-market]
    references:
      - path: references/signal-detection.yaml
        description: Value keywords, stakeholder language per persona, buying signals, realization signals
      - path: references/value-lifecycle.yaml
        description: Five-phase lifecycle (discovery, hypothesis, proof, realization, amplification)
      - path: references/calculation-frameworks.yaml
        description: TCO components, ROI formula and factors, value driver categories

  assets:
    - name: business-case
      filename: "{account}-business-case.md"
      description: Comprehensive business case for customer investment decision
    - name: roi-model
      filename: "{account}-roi-model.md"
      description: ROI calculation with sensitivity analysis
    - name: value-tracker
      filename: "{account}-value-tracker.md"
      description: Value hypothesis and realization tracking document
    - name: success-story
      filename: "{account}-success-story.md"
      description: Customer success story for reference program

  quality:
    - All metrics have documented sources
    - Assumptions are explicit and enumerated
    - Calculations are verifiable and reproducible
    - Stakeholder mapping complete before narrative creation
    - No guaranteed outcomes in any output
    - Value claims backed by customer data or stated as hypotheses
