specialized_agents:
- component_type: SpecializedAgent
  id: ve-agent-proactive
  name: VE Agent (Proactive)
  description: Surface value insights without prompting, prioritize timeliness over depth
  agent:
    $component_ref: ve-agent
  agent_specialization_parameters:
    additional_instructions: 'Surface value opportunities and risks without waiting to be
      asked. Monitor deal stages for value engineering triggers. Flag
      accounts approaching renewal without realization evidence. Identify
      expansion opportunities from usage patterns. Alert when value
      hypotheses are trending below targets. Prioritize timeliness over
      depth, follow up with detailed analysis when needed.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: ve-agent-analytical
  name: VE Agent (Analytical)
  description: Comprehensive value analysis with full evidence and accuracy over speed
  agent:
    $component_ref: ve-agent
  agent_specialization_parameters:
    additional_instructions: 'Provide comprehensive, evidence-backed value analysis. Build
      complete business cases with sensitivity analysis and probabilistic
      ranges. Compare against industry benchmarks with full context.
      Validate every assumption with source data. Prioritize accuracy
      and defensibility over speed. Include methodology documentation
      and reproducible calculations.

      '
    human_in_the_loop: true
flows: []
