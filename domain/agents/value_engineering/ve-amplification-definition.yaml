agentspec_version: 26.1.0
component_type: Agent
id: ve-amplification-agent
name: VE Amplification Agent
description: 'Turns realized value into commercial leverage. Builds renewal justification from
  measured outcomes, constructs expansion business cases with incremental and synergy
  value, creates case studies for reference programs, and quantifies competitive
  value differentiation. Realized value is the strongest asset for renewals.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: ve-agent
  tags:
  - value-amplification
  - renewal
  - expansion
  - case-study
  - competitive-differentiation
  - value-engineering
  responsibility: 'Build renewal justification from realized ROI, construct expansion business cases
    with incremental value and synergy, create case studies from verified results,
    and quantify dollarized competitive value differentiation.

    '
system_prompt: 'You are a Value Amplification Agent, part of the Value Engineering
  intelligence system. Your job is to turn proven value into commercial leverage
  for renewals, expansions, and new logos.


  You MUST:

  - Build renewal justification from realized ROI, cost avoidance, and value at risk

  - Construct expansion business cases with incremental value and synergy to existing

  - Create formal case studies with challenge, solution, results, and customer quote

  - Quantify competitive value differentiation with dollarized positioning

  - Evolve business cases from hypothesis through validation to realization as living documents

  - Package value evidence for executive consumption


  You MUST NOT:

  - Conduct value discovery (VE Discovery Agent''s domain)

  - Build original pre-sales business cases (VE Hypothesis Agent''s domain)

  - Track realization metrics (VE Realization Agent''s domain)

  - Claim value not documented in realization data

  - Publish case studies without customer approval status


  Realized value is the strongest commercial asset. Build on documented evidence,

  never repackage promises as proof.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-account-data
  name: Read Account Data
  description: Access account context, stakeholder data, contract details, and business context from vault
  requires_confirmation: false
  inputs:
  - title: account_path
    type: string
  outputs:
  - title: account_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Account data unavailable, cannot proceed with amplification
    - error_code: RECORD_NOT_FOUND
      guidance: Account not found in vault, verify identifiers with user
- component_type: ClientTool
  id: read-value-tracker
  name: Read Value Tracker
  description: Access realized value data, evidence logs, and hypothesis-to-actual comparisons from InfoHub
  requires_confirmation: false
  inputs:
  - title: tracker_path
    type: string
  outputs:
  - title: tracker_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Value tracker unavailable, cannot build renewal justification without evidence
    - error_code: NO_RECORDS
      guidance: No realization data found, flag to VE Realization Agent for tracking
- component_type: ClientTool
  id: write-value-artifact
  name: Write Value Artifact
  description: Save renewal justification, expansion case, case study, or differentiation analysis to InfoHub
  requires_confirmation: true
  inputs:
  - title: artifact_type
    type: string
  - title: content
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
    error_responses:
    - error_code: WRITE_FAILED
      guidance: Failed to persist amplification artifact, retry or flag for manual save
    - error_code: VALIDATION_ERROR
      guidance: Artifact failed schema validation, review content structure
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from value engineer about renewal context, expansion scope, or case study approval
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
    error_responses:
    - error_code: NO_RESPONSE
      guidance: User did not respond, proceed with available data and flag gaps
toolboxes:
- component_type: Toolbox
  id: amplification-intelligence
  name: Amplification Intelligence
  description: Renewal justification and expansion cases available to peer agents
  tools:
  - id: get-renewal-justification
    name: Get Renewal Justification
    description: Returns renewal case with realized ROI, cost avoidance, and value at risk
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: renewal_justification
      type: object
  - id: get-expansion-case
    name: Get Expansion Case
    description: Returns expansion business case with incremental value and synergy to existing
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: expansion_case
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: value-amplification
  name: Value Amplification
  playbook_refs:
  - PB_VE_007
  description: Build renewal justification, expansion business case, case study, and competitive value differentiation from realized value evidence.
  inputs:
  - title: account_context
    type: object
  - title: value_summary
    type: object
  - title: expansion_scope
    type: object
  outputs:
  - title: renewal_justification
    type: object
  - title: expansion_case
    type: object
  - title: case_study
    type: object
  - title: value_differentiation
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: ve-renewal-value-justification
      input: account_name, arr, value_summary
      tools:
      - read-account-data
      - read-value-tracker
      description: Build renewal case with ROI achieved, cost avoidance, value at risk, and price justification
      on_failure: stop
    - step: 2
      prompt: ve-expansion-business-case
      input: current_deployment, expansion_scope, investment
      tools:
      - read-account-data
      - read-value-tracker
      description: Build expansion case with incremental value, synergies, and expansion ROI
      on_failure: skip_with_warning
    - step: 3
      prompt: ve-case-study-creation
      input: value_summary, approval_status
      tools:
      - read-value-tracker
      - ask-user
      description: Create formal case study with challenge, solution, results, and customer quote
      on_failure: skip_with_warning
    - step: 4
      prompt: ve-competitive-value-differentiation
      input: vendor_value, competitive_context
      tools:
      - read-account-data
      - read-value-tracker
      description: Differentiate on value with TCO comparison, unique value points, and proof points
      on_failure: skip_with_warning
    - step: 5
      action: persist
      tools:
      - write-value-artifact
      description: Save renewal justification, expansion case, case study, and differentiation to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - renewal-justification
    - expansion-case
    - case-study
    - competitive-differentiation
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'The agent packages the evidence, but the VE decides which value story will
      land with the renewal committee, whether expansion timing aligns with the
      customer''s budget cycle, and which competitive differentiators to lead with
      based on the customer''s recent experiences.

      '
    challenges:
    - text: Business case is a static deliverable rather than a living document evolving from hypothesis through validation to realization
      solved_by: value-amplification
      source: REF_VE_BP_001
      specific_overhead:
      - Rebuilding the business case at each deal stage because the previous version cannot be updated
    - text: Renewal conversations rely on repackaged promises rather than measured outcomes because realized value is not systematically packaged
      solved_by: value-amplification
      specific_overhead:
      - Manually gathering value evidence from scattered sources for each renewal cycle
    - text: Expansion business cases do not isolate incremental value from existing deployment, making the ROI case unconvincing
      solved_by: value-amplification
      specific_overhead:
      - Separating new value from existing value manually for each expansion proposal
    - text: Case studies lack quantified metrics because realized value data is not connected to the content creation process
      solved_by: value-amplification
      specific_overhead:
      - Chasing down verified numbers from multiple teams to populate case study templates
    - text: Competitive value differentiation relies on feature comparison rather than dollarized unique value
      solved_by: value-amplification
      source: REF_VE_BP_001
      specific_overhead:
      - Translating feature advantages into financial impact for each competitive situation
    administrative_overhead:
    - Manually gathering value evidence from scattered sources for each renewal cycle
    - Rebuilding the business case at each deal stage because the previous version cannot be updated
    - Separating new value from existing value manually for each expansion proposal
    - Chasing down verified numbers from multiple teams to populate case study templates
    scenarios:
    - problem: Business case is a static deliverable rather than a living document
      why: 'Pre-sales business cases are created once, then archived. At renewal, the team
        rebuilds from scratch because the original case cannot evolve. The disconnect
        between the original hypothesis and realized outcomes means renewal justification
        starts without the strongest evidence available.

        '
      agent: ve-amplification-agent
      agent_response: 'Maintains the business case as a living artifact that evolves from hypothesis
        through proof to realization, adding evidence at each stage. At renewal, the
        case already contains realized ROI, validated assumptions, and value at risk,
        eliminating the rebuild cycle.

        '
      success_signal:
        metric: Business case continuity from pre-sales through renewal
        target: Single evolving artifact used from initial hypothesis through renewal justification
        leading_indicator: Business case updated with proof data within 30 days of POC completion
        failure_signal: Renewal case built from scratch with no connection to original business case
    - problem: Renewal conversations lack quantified evidence of value delivered
      why: 'When renewal approaches, the team has no packaged evidence of what the customer
        actually gained. They fall back on relationship and feature roadmap arguments,
        which weakens pricing defense and invites competitive pressure.

        '
      agent: ve-amplification-agent
      agent_response: 'Builds renewal justification from realized ROI data, cost avoidance evidence,
        and value at risk if the customer churns. The renewal case connects original
        hypothesis to actual outcomes with documented evidence, giving the VE a defensible
        price justification.

        '
      success_signal:
        metric: Renewal justification backed by realized value evidence
        target: 100% of renewals above ARR threshold have quantified value justification at R-90
        leading_indicator: Realization data linked to renewal case within 30 days of evidence availability
        failure_signal: Renewal conversation starts with no quantified value evidence
  escalation_triggers:
  - Renewal at risk due to value perception gap (immediate, to VE Lead)
  - Case study approval blocked by customer legal (within 24h, to VE Lead)
  - Competitive displacement threat with no differentiated value evidence (immediate, to Senior Manager)
  - Expansion opportunity exceeds current deployment scope significantly (within 24h, to VE Lead)
  prompt_registry:
    ve-renewal-value-justification:
      description: Build value case for renewal with ROI achieved, cost avoidance, and price justification
      source: prompts/tasks.yaml#value_amplification.renewal_value_justification
      inputs:
      - title: account_name
        type: string
      - title: arr
        type: number
      - title: months
        type: string
      - title: value_summary
        type: object
      outputs:
      - title: renewal_justification
        type: object
      requires_data:
      - source: read-value-tracker
        fields:
        - realization_data
        - roi_to_date
        - value_hypotheses
        priority: critical
      - source: read-account-data
        fields:
        - account_profile
        - opportunity_details
        - contract_details
        priority: critical
    ve-expansion-business-case:
      description: Build expansion business case with incremental value, synergies, and expansion ROI
      source: prompts/tasks.yaml#value_amplification.expansion_business_case
      inputs:
      - title: account_name
        type: string
      - title: current_deployment
        type: string
      - title: expansion_scope
        type: string
      - title: investment
        type: object
      outputs:
      - title: expansion_case
        type: object
      requires_data:
      - source: read-value-tracker
        fields:
        - realization_data
        - current_deployment_value
        priority: critical
      - source: read-account-data
        fields:
        - account_profile
        - current_deployment
        - expansion_opportunities
        priority: critical
    ve-case-study-creation:
      description: Create formal case study with challenge, solution, results, customer quote, and visuals
      source: prompts/tasks.yaml#value_amplification.case_study_creation
      inputs:
      - title: account_name
        type: string
      - title: value_summary
        type: object
      - title: approval_status
        type: string
      outputs:
      - title: case_study
        type: object
      requires_data:
      - source: read-value-tracker
        fields:
        - realization_data
        - verified_metrics
        - evidence_log
        priority: critical
      - source: read-account-data
        fields:
        - account_profile
        - stakeholder_map
        priority: enrichment
    ve-competitive-value-differentiation:
      description: Differentiate value vs competitor with TCO comparison, unique value, and proof points
      source: prompts/tasks.yaml#value_amplification.competitive_value_differentiation
      inputs:
      - title: account_name
        type: string
      - title: competitor
        type: string
      - title: vendor_value
        type: object
      - title: competitive_context
        type: object
      outputs:
      - title: value_differentiation
        type: object
      requires_data:
      - source: read-account-data
        fields:
        - account_profile
        - competitive_landscape
        priority: critical
      - source: read-value-tracker
        fields:
        - realization_data
        - verified_metrics
        priority: enrichment
  boundaries:
  - Value amplification and commercial leverage only
  - Does not conduct value discovery (VE Discovery Agent)
  - Does not build original pre-sales business cases (VE Hypothesis Agent)
  - Does not track realization metrics (VE Realization Agent)
  - Does not claim value not documented in realization data
  - Does not publish case studies without customer approval status
  permissions:
  - Read realized value data and evidence logs
  - Build renewal justification from documented outcomes
  - Construct expansion business cases with incremental value
  - Create case studies from verified results
  - Quantify competitive value differentiation
  - Write amplification artifacts to InfoHub
  guardrails:
    input_validation:
    - Reject renewal justification without realized value data
    - Reject case study without customer approval status field
    - Reject expansion case without current deployment value baseline
    output_checks:
    - Renewal justification builds on documented realized value, not re-projected promises
    - Expansion cases show incremental value separate from existing deployment value
    - Case studies include validated metrics with customer attribution
    - Competitive differentiation isolates dollarized unique value
    - All value claims cite evidence source and confidence level
    signal_validation:
    - Never use unrealized hypotheses in renewal justification
    - Never publish case studies without noting approval status
    - Flag renewal cases without positive realization evidence
    - Mark competitive claims as [NEEDS VALIDATION] when based on indirect evidence
  error_handling:
    tool_failures:
      critical:
      - read-value-tracker
      - read-account-data
      enrichment: []
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable amplification output without realized value and account data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - value-amplification
      - renewal-justification
      - competitive-differentiation
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/business-case-structure.yaml
      description: Business case templates, living document evolution patterns, and renewal frameworks
    - path: references/calculation-frameworks.yaml
      description: ROI calculation models, TCO comparison templates, and value quantification methods
    - path: references/industry-best-practices.yaml
      description: Industry benchmarks, competitive positioning data, and case study best practices
  autonomy:
    triggers:
    - type: parent_dispatch
      source: ve-agent
      description: VE orchestrator routes amplification, renewal, and case study requests
    - type: downstream
      source: ve-realization-agent
      condition: realization.evidence_ready == true
      description: Completed realization evidence triggers amplification packaging
    - type: event
      source: renewal_calendar
      condition: renewal.approaching AND renewal_minus_days <= 90
      description: Auto-triggers renewal justification preparation at R-90
    - type: event
      source: expansion_pipeline
      condition: expansion.opportunity_identified == true
      description: New expansion opportunity triggers business case construction
    outputs:
    - type: parent_return
      target: ve-agent
      payload:
      - renewal_justification
      - expansion_case
      - case_study
      - value_differentiation
      description: Amplification results back to VE orchestrator
    - type: notify_human
      condition: renewal_justification.complete == true OR case_study.ready == true
      channel: alert
      description: Completed renewal justification or case study surfaces for VE review
    consumes_toolboxes:
    - toolbox: realization-intelligence
      agent: ve-realization-agent
      tools:
      - get-realization-report
      purpose: Realized value evidence and hypothesis-to-actual comparisons for renewal cases
    - toolbox: calculation-intelligence
      agent: ve-calculation-agent
      tools:
      - get-roi-calculation
      - get-tco-analysis
      purpose: Financial model methodology for expansion cases and competitive differentiation
    dependencies:
    - agent: ve-realization-agent
      toolbox: realization-intelligence
      tools:
      - get-realization-report
      purpose: Realized value data as foundation for renewal justification and case studies
    - agent: ve-calculation-agent
      toolbox: calculation-intelligence
      tools:
      - get-roi-calculation
      - get-tco-analysis
      purpose: Financial models for expansion ROI and competitive TCO comparison
