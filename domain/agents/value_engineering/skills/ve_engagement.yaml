# SK_VE_008: VE Engagement
# Extracted from: value_engineering/prompts/tasks.yaml ve_engagement section

skill_id: "SK_VE_008"
name: "VE Engagement"
description: "Qualify opportunities for VE engagement and prepare executive value presentations"
version: 1
owner: "ve_agent"
category: "value_analysis"

workflow:
  - step: 1
    action: "Qualify engagement: criteria assessment, engagement level, expected deliverables, resource needs"
    prompt_ref: "prompts/tasks.yaml#ve_engagement.engagement_qualification"
    inputs: ["opportunity_details", "stage", "arr"]
    outputs: ["qualification_assessment"]

  - step: 2
    action: "Prepare executive presentation: key messages, metrics to highlight, objection handling, leave-behinds"
    prompt_ref: "prompts/tasks.yaml#ve_engagement.executive_presentation_prep"
    inputs: ["business_case", "executive_audience", "meeting_objective"]
    outputs: ["executive_presentation"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, opportunity context"
  optional:
    - name: "opportunity_details"
      type: "object"
      description: "Opportunity details for qualification"
    - name: "stage"
      type: "string"
      description: "Current deal stage"
    - name: "arr"
      type: "number"
      description: "Opportunity ARR value"
    - name: "business_case"
      type: "object"
      description: "Business case for executive presentation"
    - name: "executive_audience"
      type: "array"
      description: "Executive audience members and their roles"
    - name: "meeting_objective"
      type: "string"
      description: "Objective for the executive meeting"

outputs:
  - name: "qualification_assessment"
    type: "object"
    format: "yaml"
    description: "Qualification decision, criteria checklist, engagement level, deliverables, timeline"
  - name: "executive_presentation"
    type: "object"
    format: "yaml"
    description: "Presentation outline, key messages, metrics, anticipated Q&A, leave-behind materials"

quality_criteria:
  - "Qualification criteria are consistently applied"
  - "Engagement level matches opportunity value"
  - "Executive presentation tailored to audience roles"
  - "Objection handling prepared for anticipated concerns"

guardrails:
  - "Do not over-commit VE resources to unqualified opportunities"
  - "Executive messaging must be defensible and evidence-based"
  - "Never guarantee outcomes in presentations"
  - "All metrics in presentations must have documented sources"

imports: []

tags: ["value", "engagement", "qualification", "executive", "presentation"]
