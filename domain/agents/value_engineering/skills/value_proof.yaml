# SK_VE_005: Value Proof
# Extracted from: value_engineering/prompts/tasks.yaml value_proof section

skill_id: "SK_VE_005"
name: "Value Proof"
description: "Track value metrics during POV, compare against benchmarks, and document early wins as proof points"
version: 1
owner: "ve_agent"
category: "value_analysis"

workflow:
  - step: 1
    action: "Track POV value: capture metrics, compare to baseline, assess demonstrated value, identify gaps"
    prompt_ref: "prompts/tasks.yaml#value_proof.pov_value_tracking"
    inputs: ["success_criteria", "pov_status"]
    outputs: ["pov_value_tracker"]

  - step: 2
    action: "Compare to benchmarks: industry average, best in class, achievable improvement, proof points"
    prompt_ref: "prompts/tasks.yaml#value_proof.benchmark_comparison"
    inputs: ["customer_metrics", "industry", "use_case"]
    outputs: ["benchmark_analysis"]

  - step: 3
    action: "Document quick wins: quantified value, validation source, stakeholder communication plan"
    prompt_ref: "prompts/tasks.yaml#value_proof.quick_win_documentation"
    inputs: ["quick_wins_observed", "timeline"]
    outputs: ["quick_win_report"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, POV/deployment context"
    - name: "success_criteria"
      type: "array"
      description: "Defined success criteria for the POV"
  optional:
    - name: "pov_status"
      type: "object"
      description: "Current POV status and duration"
    - name: "customer_metrics"
      type: "object"
      description: "Customer's current metrics for benchmark comparison"
    - name: "quick_wins_observed"
      type: "array"
      description: "Early wins observed during POV or deployment"

outputs:
  - name: "pov_value_tracker"
    type: "object"
    format: "yaml"
    description: "Metric tracker with baseline/current/target, demonstrated value, gaps, forecast"
  - name: "benchmark_analysis"
    type: "object"
    format: "yaml"
    description: "Benchmark comparison table, gap analysis, achievable improvements, proof points"
  - name: "quick_win_report"
    type: "object"
    format: "yaml"
    description: "Win summary with date, impact, validation, quantified value, communication plan"

quality_criteria:
  - "All metrics compared against documented baselines"
  - "Benchmark sources identified"
  - "Quick wins validated by customer stakeholder"
  - "Gaps to success criteria explicitly documented"
  - "Forecast to achieve criteria is data-driven"

guardrails:
  - "Never claim realized value without documented evidence"
  - "Benchmark data must have identified source"
  - "Quick wins must be customer-validated, not self-assessed"
  - "Distinguish between demonstrated and projected value"

imports: []

tags: ["value", "proof", "pov", "benchmark", "quick-wins"]
