# SK_VE_001: Value Discovery
# Extracted from: value_engineering/prompts/tasks.yaml value_discovery section

skill_id: "SK_VE_001"
name: "Value Discovery"
description: "Assess customer current state costs, identify value drivers, and quantify pain points to establish a value baseline"
version: 1
owner: "ve_agent"
category: "value_analysis"

workflow:
  - step: 1
    action: "Assess current state costs: tools, infrastructure, personnel, hidden costs, inefficiencies, risk exposure"
    prompt_ref: "prompts/tasks.yaml#value_discovery.current_state_assessment"
    inputs: ["account_context", "business_context", "current_tools"]
    outputs: ["current_state_assessment"]

  - step: 2
    action: "Identify value drivers per stakeholder: priorities, success metrics, value language"
    prompt_ref: "prompts/tasks.yaml#value_discovery.value_driver_identification"
    inputs: ["stakeholder_list", "strategic_priorities"]
    outputs: ["value_driver_map"]

  - step: 3
    action: "Quantify pain points: cost, frequency, affected parties, annual impact"
    prompt_ref: "prompts/tasks.yaml#value_discovery.pain_point_quantification"
    inputs: ["pain_points", "business_context"]
    outputs: ["pain_quantification"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, industry, known context from realm profile"
    - name: "business_context"
      type: "string"
      description: "Business context and current environment description"
  optional:
    - name: "current_tools"
      type: "array"
      description: "List of current tools and technologies in use"
    - name: "stakeholder_list"
      type: "array"
      description: "Known stakeholders and their roles"
    - name: "strategic_priorities"
      type: "array"
      description: "Customer's stated strategic priorities"

outputs:
  - name: "current_state_assessment"
    type: "object"
    format: "yaml"
    description: "Cost summary, hidden costs, inefficiency inventory, risk exposure, baseline metrics"
  - name: "value_driver_map"
    type: "object"
    format: "yaml"
    description: "Driver-to-stakeholder matrix with priorities, measurements, and value language"
  - name: "pain_quantification"
    type: "object"
    format: "yaml"
    description: "Quantified pain points with frequency, impact, annual cost, and total addressable pain"

quality_criteria:
  - "Current costs have documented sources and methodology"
  - "Value drivers mapped to specific stakeholders"
  - "Pain points quantified with assumptions stated"
  - "Baseline metrics defined for future comparison"
  - "Total addressable pain calculated"

guardrails:
  - "Never fabricate cost structures or benchmark data"
  - "Use ranges with confidence levels when precision is impossible"
  - "All assumptions explicitly documented"
  - "State 'estimate pending validation' when data is incomplete"

imports: []

tags: ["value", "discovery", "pre-sales", "baseline", "pain-points"]
