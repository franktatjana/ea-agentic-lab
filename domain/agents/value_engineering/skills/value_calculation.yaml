# SK_VE_003: Value Calculation
# Extracted from: value_engineering/prompts/tasks.yaml value_calculation section

skill_id: "SK_VE_003"
name: "Value Calculation"
description: "Calculate ROI, TCO, cost of inaction, and comprehensive value quantification across all value types"
version: 1
owner: "ve_agent"
category: "value_analysis"

workflow:
  - step: 1
    action: "Calculate ROI: 3-year investment, projected benefits, ROI percentage, payback period, sensitivity analysis"
    prompt_ref: "prompts/tasks.yaml#value_calculation.roi_calculation"
    inputs: ["investment_details", "benefit_details", "timeline"]
    outputs: ["roi_model"]

  - step: 2
    action: "Analyze TCO: current vs proposed state comparison, cost drivers, hidden costs, net savings"
    prompt_ref: "prompts/tasks.yaml#value_calculation.tco_analysis"
    inputs: ["current_tools", "proposed_solution", "evaluation_period"]
    outputs: ["tco_comparison"]

  - step: 3
    action: "Calculate cost of inaction: ongoing inefficiency, risk accumulation, growth amplification, missed opportunities"
    prompt_ref: "prompts/tasks.yaml#value_calculation.cost_of_inaction"
    inputs: ["pain_points", "risk_factors", "growth_projections"]
    outputs: ["cost_of_inaction"]

  - step: 4
    action: "Quantify value by type: hard savings, soft savings, risk avoidance, revenue enablement"
    prompt_ref: "prompts/tasks.yaml#value_calculation.value_quantification_by_type"
    inputs: ["use_cases", "baseline_metrics"]
    outputs: ["value_quantification"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, use case, deployment context"
  optional:
    - name: "investment_details"
      type: "object"
      description: "Licensing, implementation, training costs"
    - name: "benefit_details"
      type: "object"
      description: "Expected benefits by category"
    - name: "current_tools"
      type: "array"
      description: "Current state tool inventory with costs"
    - name: "proposed_solution"
      type: "object"
      description: "Proposed solution details and pricing"
    - name: "pain_points"
      type: "array"
      description: "Quantified pain points from discovery"
    - name: "baseline_metrics"
      type: "object"
      description: "Baseline metrics for comparison"

outputs:
  - name: "roi_model"
    type: "object"
    format: "yaml"
    description: "3-year investment/benefits breakdown, ROI percentage, payback period, sensitivity analysis"
  - name: "tco_comparison"
    type: "object"
    format: "yaml"
    description: "Current vs proposed TCO tables, cost drivers, hidden costs, net savings projection"
  - name: "cost_of_inaction"
    type: "object"
    format: "yaml"
    description: "Year-by-year projection, risk accumulation, competitive disadvantage, urgency recommendation"
  - name: "value_quantification"
    type: "object"
    format: "yaml"
    description: "Hard savings, soft savings, risk avoidance, revenue enablement tables with totals"

quality_criteria:
  - "All calculations use documented formulas"
  - "Assumptions explicitly stated per calculation"
  - "Sensitivity analysis included for ROI"
  - "TCO includes hidden cost categories"
  - "Value types clearly separated and not double-counted"

guardrails:
  - "Never fabricate benchmark data"
  - "Never guarantee specific financial outcomes"
  - "Document methodology for all calculations"
  - "Use conservative estimates when data is uncertain"

imports: []

tags: ["value", "calculation", "roi", "tco", "financial-analysis"]
