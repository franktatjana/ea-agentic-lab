# SK_VE_007: Value Amplification
# Extracted from: value_engineering/prompts/tasks.yaml value_amplification section

skill_id: "SK_VE_007"
name: "Value Amplification"
description: "Leverage proven value for renewals, expansions, case studies, and competitive differentiation"
version: 1
owner: "ve_agent"
category: "value_analysis"

workflow:
  - step: 1
    action: "Build renewal justification: value delivered, ROI achieved, value at risk, forward projection"
    prompt_ref: "prompts/tasks.yaml#value_amplification.renewal_value_justification"
    inputs: ["value_summary", "current_arr", "renewal_timeline"]
    outputs: ["renewal_justification"]

  - step: 2
    action: "Build expansion business case: additional value, incremental investment, expansion ROI, synergies"
    prompt_ref: "prompts/tasks.yaml#value_amplification.expansion_business_case"
    inputs: ["current_deployment", "expansion_scope", "additional_investment"]
    outputs: ["expansion_case"]

  - step: 3
    action: "Create formal case study: story structure, headline metrics, visuals, usage plan"
    prompt_ref: "prompts/tasks.yaml#value_amplification.case_study_creation"
    inputs: ["value_summary", "customer_approval"]
    outputs: ["case_study"]

  - step: 4
    action: "Differentiate on value vs competitor: value matrix, TCO comparison, unique points, proof"
    prompt_ref: "prompts/tasks.yaml#value_amplification.competitive_value_differentiation"
    inputs: ["vendor_value", "competitive_context"]
    outputs: ["value_differentiation"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, deployment context, lifecycle stage"
    - name: "value_summary"
      type: "object"
      description: "Realized value summary from value tracker"
  optional:
    - name: "current_arr"
      type: "number"
      description: "Current ARR for renewal justification"
    - name: "renewal_timeline"
      type: "string"
      description: "Months until renewal"
    - name: "expansion_scope"
      type: "object"
      description: "Scope of proposed expansion"
    - name: "competitive_context"
      type: "object"
      description: "Competitive positioning context"
    - name: "customer_approval"
      type: "string"
      description: "Customer approval status for external reference"

outputs:
  - name: "renewal_justification"
    type: "object"
    format: "yaml"
    description: "Value delivered, ROI, cost avoidance, value at risk, forward projection, price-to-value"
  - name: "expansion_case"
    type: "object"
    format: "yaml"
    description: "Current value foundation, additional opportunity, incremental ROI, synergies, recommendation"
  - name: "case_study"
    type: "object"
    format: "yaml"
    description: "Title, profile, challenge, solution, results, quote, usage rights, visual recommendations"
  - name: "value_differentiation"
    type: "object"
    format: "yaml"
    description: "Differentiation matrix, TCO comparison, unique value points, proof points, positioning"

quality_criteria:
  - "Renewal justification includes documented ROI"
  - "Expansion ROI calculated separately from base value"
  - "Case studies have customer approval documented"
  - "Competitive differentiation uses factual comparisons only"
  - "All claims supported by evidence"

guardrails:
  - "Never use customer success data without approval"
  - "Never fabricate competitive comparisons"
  - "Distinguish between realized and projected value in renewal cases"
  - "Case studies require explicit customer consent for external use"

imports: []

tags: ["value", "amplification", "renewal", "expansion", "case-study", "competitive"]
