# SK_VE_004: Value Stream Workshop
# Extracted from: value_engineering/prompts/tasks.yaml value_stream_workshop section

skill_id: "SK_VE_004"
name: "Value Stream Workshop"
description: "Prepare, facilitate, and synthesize value stream discovery workshops covering current and future state mapping"
version: 1
owner: "ve_agent"
category: "value_analysis"

workflow:
  - step: 1
    action: "Prepare workshop: objectives, pre-workshop data request, agenda, facilitator guide, materials"
    prompt_ref: "prompts/tasks.yaml#value_stream_workshop.workshop_preparation"
    inputs: ["account_context", "workshop_date", "attendees", "focus_area"]
    outputs: ["workshop_prep"]

  - step: 2
    action: "Map current state: workflows, tool inventory, handoff points, pain points, baseline metrics"
    prompt_ref: "prompts/tasks.yaml#value_stream_workshop.current_state_mapping"
    inputs: ["process_area", "workshop_findings"]
    outputs: ["current_state_map"]

  - step: 3
    action: "Design future state: workflow changes, eliminated pain points, new capabilities, target metrics"
    prompt_ref: "prompts/tasks.yaml#value_stream_workshop.future_state_design"
    inputs: ["current_state_map", "vendor_capabilities"]
    outputs: ["future_state_design"]

  - step: 4
    action: "Synthesize into value model: total opportunity, quick wins, phased roadmap, prioritization matrix"
    prompt_ref: "prompts/tasks.yaml#value_stream_workshop.workshop_synthesis"
    inputs: ["current_state_map", "future_state_design", "metrics_captured"]
    outputs: ["workshop_synthesis"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, industry, engagement context"
    - name: "focus_area"
      type: "string"
      description: "Primary workflow or process area for the workshop"
  optional:
    - name: "workshop_date"
      type: "string"
      description: "Scheduled workshop date"
    - name: "attendees"
      type: "array"
      description: "Workshop participants and their roles"
    - name: "vendor_capabilities"
      type: "array"
      description: "Relevant vendor capabilities for future state design"

outputs:
  - name: "workshop_prep"
    type: "object"
    format: "yaml"
    description: "Objectives, pre-workshop data request, agenda, facilitator guide, materials checklist"
  - name: "current_state_map"
    type: "object"
    format: "yaml"
    description: "Workflow description, tool inventory, handoffs, pain points, baseline metrics"
  - name: "future_state_design"
    type: "object"
    format: "yaml"
    description: "Before/after comparison, eliminated pain points, new capabilities, target metrics"
  - name: "workshop_synthesis"
    type: "object"
    format: "yaml"
    description: "Executive summary, value opportunity, quick wins, phased roadmap, prioritization matrix"

quality_criteria:
  - "Workshop objectives are specific and measurable"
  - "Current state includes quantified baselines"
  - "Future state maps to specific vendor capabilities"
  - "Synthesis includes phased transformation roadmap"
  - "Quick wins identified with 0-30 day timeline"

guardrails:
  - "Never assume customer workflows without workshop evidence"
  - "All baseline metrics captured from customer data"
  - "Future state design validated against vendor capabilities"
  - "Do not over-promise transformation timelines"

imports: []

tags: ["value", "workshop", "value-stream", "current-state", "future-state"]
