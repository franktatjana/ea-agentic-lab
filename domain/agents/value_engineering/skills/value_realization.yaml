# SK_VE_006: Value Realization
# Extracted from: value_engineering/prompts/tasks.yaml value_realization section

skill_id: "SK_VE_006"
name: "Value Realization"
description: "Track realized value post-deployment: monthly updates, QBR content, success stories, and comprehensive assessments"
version: 1
owner: "ve_agent"
category: "value_analysis"

workflow:
  - step: 1
    action: "Update value tracker: hypothesis vs actuals, evidence log, period highlights, acceleration actions"
    prompt_ref: "prompts/tasks.yaml#value_realization.value_tracker_update"
    inputs: ["value_tracker", "review_period"]
    outputs: ["updated_tracker"]

  - step: 2
    action: "Prepare QBR value content: delivered value, metric improvements, ROI to date, roadmap"
    prompt_ref: "prompts/tasks.yaml#value_realization.qbr_value_content"
    inputs: ["value_tracker", "quarter", "stakeholders"]
    outputs: ["qbr_value_content"]

  - step: 3
    action: "Develop success story: narrative, headline metrics, customer quotes, usage rights"
    prompt_ref: "prompts/tasks.yaml#value_realization.success_story_development"
    inputs: ["value_summary", "key_metrics"]
    outputs: ["success_story"]

  - step: 4
    action: "Comprehensive assessment: original vs realized, total value delivered, remaining potential"
    prompt_ref: "prompts/tasks.yaml#value_realization.realized_value_assessment"
    inputs: ["original_business_case", "deployment_duration"]
    outputs: ["realized_value_assessment"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, deployment context"
    - name: "value_tracker"
      type: "object"
      description: "Current value tracker with hypotheses and evidence"
  optional:
    - name: "review_period"
      type: "string"
      description: "Period for tracker update (monthly)"
    - name: "quarter"
      type: "string"
      description: "Quarter for QBR preparation"
    - name: "stakeholders"
      type: "array"
      description: "QBR audience stakeholders"
    - name: "original_business_case"
      type: "object"
      description: "Original business case for comparison"

outputs:
  - name: "updated_tracker"
    type: "object"
    format: "yaml"
    description: "Hypothesis vs actual table, evidence log, highlights, acceleration actions, forecast"
  - name: "qbr_value_content"
    type: "object"
    format: "yaml"
    description: "Executive value summary, quarterly value, metric dashboard, ROI, value roadmap"
  - name: "success_story"
    type: "object"
    format: "yaml"
    description: "Story headline, challenge, solution, results, customer quote, referenceable status"
  - name: "realized_value_assessment"
    type: "object"
    format: "yaml"
    description: "Original vs realized comparison, total value, ROI achieved, remaining potential"

quality_criteria:
  - "Hypothesis vs actual comparison is quantified"
  - "Evidence has documented sources and dates"
  - "QBR content tailored to audience stakeholders"
  - "Success stories have customer validation"
  - "Unrealized value has actionable plan to unlock"

guardrails:
  - "Never claim realized value without documented evidence"
  - "Use customer-validated data only"
  - "Success stories require customer approval before external use"
  - "Distinguish between realized, projected, and potential value"

imports: []

tags: ["value", "realization", "post-sales", "qbr", "success-story"]
