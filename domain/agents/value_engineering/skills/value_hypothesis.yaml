# SK_VE_002: Value Hypothesis
# Extracted from: value_engineering/prompts/tasks.yaml value_hypothesis section

skill_id: "SK_VE_002"
name: "Value Hypothesis"
description: "Create quantified value hypotheses, stakeholder-specific narratives, and comprehensive business cases"
version: 1
owner: "ve_agent"
category: "value_analysis"

workflow:
  - step: 1
    action: "Create value hypothesis: expected improvements, measurement plan, timeline, confidence levels"
    prompt_ref: "prompts/tasks.yaml#value_hypothesis.create_value_hypothesis"
    inputs: ["account_context", "baseline_metrics", "target_outcomes"]
    outputs: ["value_hypothesis"]

  - step: 2
    action: "Build stakeholder-specific narratives: priorities, resonant metrics, compelling story"
    prompt_ref: "prompts/tasks.yaml#value_hypothesis.stakeholder_value_narrative"
    inputs: ["value_hypothesis", "stakeholder_role", "stakeholder_priorities"]
    outputs: ["stakeholder_narrative"]

  - step: 3
    action: "Develop business case: investment, benefits, ROI, payback, cost of inaction"
    prompt_ref: "prompts/tasks.yaml#value_hypothesis.business_case_development"
    inputs: ["value_hypothesis", "opportunity_value", "decision_maker"]
    outputs: ["business_case"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, use cases under evaluation"
    - name: "baseline_metrics"
      type: "object"
      description: "Current state baseline metrics from value discovery"
  optional:
    - name: "target_outcomes"
      type: "array"
      description: "Customer-stated target outcomes"
    - name: "stakeholder_role"
      type: "string"
      description: "Target stakeholder role for narrative (CFO, CTO, CISO, COO)"
    - name: "stakeholder_priorities"
      type: "array"
      description: "Stakeholder-specific priorities and concerns"
    - name: "opportunity_value"
      type: "number"
      description: "Opportunity ARR value"
    - name: "decision_maker"
      type: "string"
      description: "Primary decision maker for the business case"

outputs:
  - name: "value_hypothesis"
    type: "object"
    format: "yaml"
    description: "Hypothesis table with baseline, target, timeline, confidence, measurement plan, and validation approach"
  - name: "stakeholder_narrative"
    type: "object"
    format: "yaml"
    description: "Stakeholder profile, value narrative, key metrics, evidence, objection responses"
  - name: "business_case"
    type: "object"
    format: "yaml"
    description: "Executive summary, investment, benefits by driver, ROI, cost of inaction, recommendation"

quality_criteria:
  - "Hypotheses are specific and measurable"
  - "Confidence levels stated for each hypothesis"
  - "Narratives use stakeholder's value language"
  - "Business case includes sensitivity analysis"
  - "Assumptions explicitly enumerated"

guardrails:
  - "Never guarantee specific ROI outcomes"
  - "Present as hypothesis, not fact, until validated"
  - "Use ranges when precision is impossible"
  - "All calculations verifiable and reproducible"

imports: []

tags: ["value", "hypothesis", "business-case", "stakeholder", "pre-sales"]
