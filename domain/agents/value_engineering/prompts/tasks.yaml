# VE Agent Task Prompts
# Purpose: Task-specific prompts using CAF framework (Context, Action, Format)
# Reference: Personality defined in personalities/ve_personality.yaml
# Framework: Based on industry business value consulting best practices

# ============================================================================
# VALUE DISCOVERY PROMPTS
# ============================================================================
# Full runbook prompts: multi-step with phase gates, deliverable specs,
# and quality checks. Each step produces a named deliverable.
# ============================================================================
value_discovery:

  current_state_assessment:
    name: "Current State Value Assessment"
    description: "Assess customer current-state cost structure across direct spend, hidden costs, operational inefficiencies, and risk exposure to establish a quantified baseline"
    prompt: |
      Context: Conducting value discovery for {account_name}.
      Business context: {business_context}
      Current tools: {current_tools}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are building a quantified picture of the customer's current-state costs.
      This baseline becomes the "before" for all downstream value calculations.
      Every number must have a source. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Direct Costs, Hidden Costs, Inefficiencies, Risk Exposure,
      Baseline Metrics.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: DIRECT COST INVENTORY
      Catalog all identifiable direct costs in the focus area.
      For each cost line:
      - Category (software licensing, infrastructure, personnel, services, training)
      - Item description (specific tool, role, or service)
      - Annual cost (dollar amount or FTE-equivalent)
      - Source: CONFIRMED (customer-provided), ESTIMATED (derived from headcount
        or public pricing), or UNKNOWN (flag for data request)
      - Growth trend (increasing, stable, decreasing) if known
      Include costs the customer may not attribute to this area (shared infrastructure,
      platform fees, support contracts billed to IT rather than the team).
      Deliverable: Direct cost table (Category | Item | Annual Cost | Source | Trend)
      with total.

      STEP 2: HIDDEN COST ANALYSIS
      Identify costs not visible in budgets but real in operational impact.
      For each hidden cost:
      - Description (what is happening)
      - Root cause (why it exists)
      - Affected roles and headcount
      - Time consumed (hours/week or hours/incident)
      - Monetized impact: hours × fully loaded hourly rate
      - Frequency (continuous, per incident, per release, per audit)
      Common hidden cost categories to investigate:
      - Context switching between tools (average switches/day × time per switch)
      - Manual data transfer between systems (export, transform, import cycles)
      - Tribal knowledge dependencies (single points of failure, onboarding time)
      - Waiting time between process steps (handoff delays)
      - Rework from errors in manual processes
      - Shadow IT costs (teams buying their own tools outside procurement)
      Deliverable: Hidden cost table (Description | Root Cause | Roles | Hours/Week |
      Annual Cost | Frequency) with total.

      STEP 3: INEFFICIENCY INVENTORY
      Map operational inefficiencies that consume resources without producing value.
      For each inefficiency:
      - Process step where it occurs
      - What happens (description of the waste)
      - Primary type: duplication, over-processing, unnecessary motion, waiting, defects,
        over-production, underutilized skills (Lean waste categories)
      - Secondary type(s): if applicable, list additional waste categories that also apply
      - Scale (how many people, how often, how much time)
      - Estimated annual cost (time × rate, or throughput impact)
      - Difficulty to fix (quick win, process change, tooling change, organizational change)
      Rank by annual cost descending.
      Deliverable: Inefficiency table (Process Step | Primary Waste Type | Secondary Type(s) |
      Description | Scale | Annual Cost | Fix Difficulty).

      STEP 4: RISK EXPOSURE ASSESSMENT
      Quantify risks the customer carries due to current-state gaps.
      For each risk, separate observable facts from interpretive assessments:

      Observable layer (facts):
      - Risk description (specific scenario, not generic)
      - Likelihood (frequency or probability per year)
      - Impact if realized (dollar cost, revenue loss, regulatory penalty, reputation)
      - Expected annual loss: likelihood × impact
      - Current mitigation (what they do today to manage it)
      - Residual risk (what remains after mitigation)

      Interpretive layer (with confidence):
      - Improvement potential with intervention (confidence: HIGH/MEDIUM/LOW)
      - Value attribution to proposed solution vs process change (confidence: HIGH/MEDIUM/LOW)

      Commercial impact classification for each risk:
      - Renewal: threatens renewal if unaddressed
      - Expansion: blocks upsell/cross-sell opportunities
      - Neither: operational impact only

      Confidence level: HIGH (incident history available), MEDIUM (industry data),
        LOW (theoretical estimate). Mark LOW-richness scores as "estimated."
      Categories: security breach, compliance violation, service outage, data loss,
      audit failure, skill dependency, vendor lock-in.
      Deliverable: Risk table (Risk | Likelihood | Impact | Expected Annual Loss |
      Mitigation | Residual Risk | Confidence | Commercial Impact).

      STEP 5: BASELINE METRICS COMPILATION
      Compile all quantitative metrics into a single baseline table.
      Organize by category:
      - Cost metrics (total direct, total hidden, total inefficiency, total risk)
      - Time metrics (cycle times, wait times, resolution times)
      - Volume metrics (incidents, tickets, deployments, transactions)
      - Quality metrics (error rates, rework rates, false positive rates)
      For each metric: current value, source, industry benchmark (from references),
      and gap to benchmark.
      Calculate Total Current State Cost: direct + hidden + inefficiency + risk.
      Deliverable: Baseline metrics table (Metric | Category | Value | Source |
      Benchmark | Gap) with total current state cost.

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Every cost line has a source classification (CONFIRMED, ESTIMATED, UNKNOWN)
      - Hidden costs are monetized, not just described qualitatively
      - Risk exposure uses expected annual loss, not worst-case scare numbers
      - LOW-richness dimension scores are marked "estimated" throughout
      - Interpretive assessments include confidence levels
      - Risk items classified with three-value commercial impact (Renewal/Expansion/Neither)
      - Baseline metrics include industry benchmarks for comparison
      - Total current state cost is calculated as the sum of all categories
      - Data gaps are flagged with specific follow-up data requests
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: If Signal Acquisition Mode was triggered, produce the signal acquisition
      plan only. Otherwise, produce all 5 deliverables plus the Data Availability Map
      as labeled sections. Lead with a summary that states: (1) total current state cost
      and data richness profile, (2) the weakest point or lowest confidence area across
      all assessments, and (3) the single most urgent action to take next. Include number
      of cost lines, number of risks, and number of data gaps requiring follow-up.

  value_driver_identification:
    name: "Value Driver Identification"
    description: "Identify value drivers per stakeholder, map to measurable business outcomes, and create a stakeholder-to-driver matrix with value language guide"
    prompt: |
      Context: Discovery with {account_name}.
      Stakeholders: {stakeholder_list}
      Strategic priorities: {priorities}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are mapping what each stakeholder values, how they measure success, and
      what language they use when talking about value. This drives all downstream
      narratives and ensures the business case speaks each stakeholder's language.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: STAKEHOLDER PROFILING
      For each stakeholder in the list, build a profile:
      - Name and role
      - Decision authority (economic buyer, technical evaluator, champion, influencer, blocker)
      - Strategic priorities they own (from account context)
      - How they are measured (KPIs their performance is evaluated against)
      - Value language: the words and metrics they use when discussing outcomes
        (CFO: NPV, payback, TCO; CTO: velocity, tech debt, MTTR; COO: SLA, uptime, throughput)
      - Risk tolerance (conservative, moderate, progressive)
      - Known objections or concerns (from AE discovery notes if available)
      Deliverable: Stakeholder profile table (Name | Role | Authority | KPIs |
      Value Language | Risk Tolerance | Known Concerns).

      STEP 2: VALUE DRIVER EXTRACTION
      From the stakeholder profiles and strategic priorities, extract value drivers.
      A value driver is a measurable business outcome the customer wants to achieve.
      For each driver:
      - Driver name (outcome-oriented: "Reduce incident response time", not "SIEM deployment")
      - Primary business outcome category (cost reduction, revenue enablement, risk reduction,
        operational efficiency, compliance, competitive advantage)
      - Secondary category(ies): if applicable, list additional outcome categories that also apply
      - Primary stakeholder (who cares most)
      - Supporting stakeholders (who also benefits)
      - How it is measured today (metric, frequency, owner of the metric)
      - Target state (what "better" looks like, quantified if possible)
      - Priority (critical, important, nice-to-have) based on stakeholder emphasis
      Aim for 5-8 drivers. More than 10 dilutes focus. Fewer than 3 suggests
      insufficient discovery.
      Deliverable: Value driver table (Driver | Primary Category | Secondary Category(ies) |
      Primary Stakeholder | Measurement | Target | Priority).

      STEP 3: STAKEHOLDER-TO-DRIVER MATRIX
      Build a matrix mapping every stakeholder to every driver with their level
      of interest:
      - HIGH: this driver directly impacts their KPIs
      - MEDIUM: this driver supports their goals indirectly
      - LOW: aware but not a priority for this stakeholder
      - NONE: not relevant to this stakeholder's role
      This matrix reveals which drivers have broad consensus (multiple HIGH ratings)
      and which are single-stakeholder interests.
      Deliverable: Matrix table (Driver rows × Stakeholder columns, cells = HIGH/MEDIUM/LOW/NONE).

      STEP 4: SUCCESS METRIC DEFINITIONS
      For each value driver, define the success metric precisely:
      - Metric name (unambiguous, measurable)
      - Definition (exactly what is counted or measured)
      - Current baseline (value today, from discovery data)
      - Target value (what the customer considers success)
      - Measurement method (data source, calculation, frequency)
      - Owner (who is accountable for tracking this metric)
      - Validation approach (how the customer confirms the metric is accurate)
      Deliverable: Success metrics table (Driver | Metric | Definition | Baseline |
      Target | Method | Owner | Validation).

      STEP 5: VALUE LANGUAGE GUIDE
      Create a translation guide for presenting value to each stakeholder persona.
      For each stakeholder type (CFO, CTO, COO, LOB leader, champion):
      - Opening frame (how to position the conversation)
      - Metrics that resonate (specific KPIs they track)
      - Language to use (their vocabulary, not vendor vocabulary)
      - Language to avoid (terms that trigger resistance or feel like sales pitch)
      - Proof they trust (analyst reports, peer references, internal data, benchmarks)
      - Decision trigger (what moves them from "interesting" to "approved")
      Deliverable: Value language guide organized by persona.

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Every driver is outcome-oriented, not feature-oriented
      - Every driver has at least one stakeholder with HIGH interest
      - Success metrics have baselines (even if estimated), not just targets
      - Value language guide avoids vendor jargon in the "language to use" section
      - Matrix reveals consensus drivers (2+ stakeholders with HIGH)
      - 5-8 drivers identified (flag if outside this range with reasoning)
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all 5 deliverables as labeled sections. Lead with a summary that
      states: (1) number of stakeholders profiled, number of drivers identified, and
      consensus drivers (2+ HIGH), (2) the weakest point or lowest confidence area
      across all assessments, and (3) the single most urgent action to take next.
      Include data gaps in baseline metrics.

  pain_point_quantification:
    name: "Pain Point Quantification"
    description: "Quantify each customer pain point with frequency, cost per occurrence, annual impact, and confidence level to calculate total addressable pain"
    prompt: |
      Context: {account_name} has identified pain points: {pain_points}
      Business context: {context}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are converting qualitative pain statements into quantified business impact.
      Every pain point must have a dollar value attached. Vague pain is not actionable
      for a business case. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: PAIN POINT CLASSIFICATION
      Take each stated pain point and classify it:
      - Pain ID (PP-001, PP-002, etc. for reference in downstream documents)
      - Description (restate in specific, measurable terms)
      - Primary category: time waste, cost overrun, revenue leakage, risk exposure,
        quality degradation, compliance gap, opportunity cost
      - Secondary category(ies): if applicable, list additional categories that also apply
      - Affected scope: which teams, how many people, which processes
      - Stated severity (how the customer described it: critical, frustrating,
        annoying, accepted as normal)
      If a pain point is vague ("we have visibility issues"), break it into
      specific sub-pains with distinct impacts.
      Deliverable: Pain classification table (ID | Description | Primary Category |
      Secondary Category(ies) | Scope | Severity).

      STEP 2: FREQUENCY ANALYSIS
      For each pain point, determine how often it occurs:
      - Frequency unit (per day, per week, per month, per incident, per release, per audit)
      - Occurrences per unit (number)
      - Annualized frequency (calculated)
      - Trend (increasing, stable, decreasing, seasonal)
      - Source: CUSTOMER (they provided the number), DERIVED (calculated from
        volume data), BENCHMARK (industry average applied)
      If the customer said "constantly" or "all the time", probe for specifics
      using volume data. Example: "You mentioned 500 alerts per day with a 70%
      false positive rate. That means 350 false positive investigations per day."
      Deliverable: Frequency table (Pain ID | Frequency Unit | Occurrences | Annual | Trend | Source).

      STEP 3: COST PER OCCURRENCE
      Calculate what each occurrence costs the business:
      - Labor cost: people involved × time per occurrence × fully loaded hourly rate
      - Direct cost: any out-of-pocket spend per occurrence (tools, penalties, overtime)
      - Downstream cost: impact on other processes (delays, rework, escalation)
      - Opportunity cost: what those people or resources would otherwise produce
      Document the calculation formula for each pain point so the customer can
      validate the math.
      Deliverable: Cost table (Pain ID | Labor Cost | Direct Cost | Downstream Cost |
      Opportunity Cost | Total per Occurrence | Calculation Formula).

      STEP 4: ANNUAL IMPACT CALCULATION
      Multiply frequency × cost per occurrence for each pain point:
      - Annual impact = annualized frequency × total cost per occurrence
      - Confidence level:
        HIGH: frequency AND cost are customer-confirmed
        MEDIUM: one of frequency or cost is estimated
        LOW: both are benchmark-derived or estimated
      - Sensitivity range: best case (conservative) to worst case (if frequency
        or cost is higher than estimated)
      Sort by annual impact descending.
      Deliverable: Annual impact table (Pain ID | Annual Frequency | Cost/Occurrence |
      Annual Impact | Confidence | Range Low | Range High).

      STEP 5: TOTAL ADDRESSABLE PAIN (TAP)
      Calculate aggregate metrics:
      - TAP (total): sum of all pain point annual impacts
      - TAP by confidence: total HIGH + total MEDIUM + total LOW separately
      - TAP by category: total per pain category (time waste, cost overrun, etc.)
      - Confidence-weighted TAP: HIGH at 100% + MEDIUM at 70% + LOW at 40%
      The confidence-weighted TAP is the defensible number for the business case.
      The full TAP is the aspirational ceiling.
      Deliverable: TAP summary with breakdowns by confidence and category.

      STEP 6: ASSUMPTIONS AND DATA GAPS
      Document every assumption made during quantification:
      - Assumption (what was assumed)
      - Impact on calculation (which pain points are affected)
      - Sensitivity (if this assumption is wrong by 20%, what changes)
      - Validation method (how the customer can confirm or correct)
      Flag pain points where confidence is LOW with specific data requests.
      Deliverable: Assumptions table (Assumption | Pain IDs Affected | Sensitivity |
      Validation Method) and data gaps list.

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Every pain point has a dollar value, not just a description
      - Frequency sources are classified (customer, derived, benchmark)
      - Cost calculations show the formula, not just the result
      - Confidence levels are assigned consistently
      - TAP equals the sum of individual pain point impacts (arithmetic check)
      - Confidence-weighted TAP is calculated for business case use
      - No pain point is quantified at LOW confidence without a benchmark citation
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all 6 deliverables as labeled sections. Lead with a summary that
      states: (1) TAP total and confidence-weighted TAP with number of pain points
      quantified, (2) the weakest point or lowest confidence area across all assessments,
      and (3) the single most urgent action to take next. Include number of
      HIGH/MEDIUM/LOW confidence items.

# ============================================================================
# VALUE HYPOTHESIS PROMPTS
# ============================================================================
# Full runbook prompts: multi-step with deliverable specs and quality checks.
# ============================================================================
value_hypothesis:

  create_value_hypothesis:
    name: "Value Hypothesis Creation"
    description: "Create quantified value hypotheses with baselines, targets, confidence levels, validation methods, and measurement plans per stakeholder"
    prompt: |
      Context: {account_name} evaluation for {use_cases}.
      Current state baseline: {baseline_metrics}
      Target outcomes: {target_outcomes}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are creating testable value hypotheses that connect current-state pain
      to measurable future-state outcomes. Each hypothesis must be falsifiable:
      it either proves true or it does not. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: BASELINE VALIDATION
      Review the provided baseline metrics. For each metric:
      - Confirm the metric name, value, and source
      - Flag metrics with LOW confidence or ESTIMATED source
      - Identify missing baselines needed for hypothesis creation
      - Note industry benchmarks for context
      If critical baselines are missing, define what data is needed and from whom
      before proceeding. A hypothesis without a baseline is an opinion.
      Deliverable: Validated baseline table (Metric | Value | Source | Confidence |
      Benchmark | Gap | Status).

      STEP 2: HYPOTHESIS FORMULATION
      For each use case and target outcome, create a value hypothesis.
      Structure each hypothesis as:
      - Hypothesis ID (VH-001, VH-002, etc.)
      - Statement: "By deploying [capability], {account_name} will [measurable outcome]
        within [timeframe], improving [metric] from [baseline] to [target]"
      - Primary value type: hard savings, soft savings, risk avoidance, or revenue enablement
      - Secondary value type(s): if applicable, list additional value types that also apply
      - Primary stakeholder (who this matters to most)
      - Baseline value (from Step 1)
      - Target value (conservative estimate)
      - Improvement percentage
      - Annual value: monetized impact of achieving the target
      - Confidence level:
        HIGH: proven in comparable deployments with similar customer profile
        MEDIUM: demonstrated capability, customer-specific factors may vary
        LOW: theoretical, requires POC validation
      - Dependencies (what must be true for this hypothesis to hold)
      Aim for 5-10 hypotheses. Fewer than 3 suggests shallow discovery.
      More than 12 dilutes focus and makes tracking unmanageable.
      Deliverable: Hypothesis table (ID | Statement | Primary Value Type |
      Secondary Type(s) | Stakeholder | Baseline | Target | Improvement % |
      Annual Value | Confidence | Dependencies).

      STEP 3: MEASUREMENT PLAN
      For each hypothesis, define how it will be validated:
      - What to measure (specific metric, matching the hypothesis statement)
      - Data source (system, report, API, manual collection)
      - Measurement frequency (daily, weekly, monthly, quarterly)
      - Measurement owner (customer role responsible for providing data)
      - First measurement point (when the first meaningful data will be available)
      - Validation threshold (what constitutes "achieved" vs "partially achieved" vs "failed")
      - Comparison method (before/after, A/B, cohort, time series)
      Deliverable: Measurement plan table (Hypothesis ID | Metric | Data Source |
      Frequency | Owner | First Measurement | Validation Threshold | Method).

      STEP 4: VALIDATION APPROACH
      Define the validation sequence for the hypothesis set:
      - POC validation: which hypotheses can be tested during evaluation (before purchase)
      - Early validation (0-90 days): which hypotheses show signal within first quarter
      - Full validation (90-365 days): which require a full year of data
      - Ongoing tracking: which are tracked continuously post-deployment
      For POC validation, specify: success criteria, minimum POC duration, data
      required, and what a "pass" vs "fail" looks like for the deal.
      Deliverable: Validation timeline (Hypothesis ID | Validation Stage | Timeline |
      Success Criteria | Pass/Fail Definition).

      STEP 5: ASSUMPTIONS AND RISKS
      Document every assumption underlying the hypotheses:
      - Assumption statement
      - Which hypotheses depend on it (Hypothesis IDs)
      - Sensitivity: if this assumption is wrong by 25%, what happens to the value
      - Risk level (HIGH: central to the business case, MEDIUM: affects one hypothesis,
        LOW: marginal impact)
      - Mitigation: how to validate or hedge this assumption
      Deliverable: Assumptions table (Assumption | Hypothesis IDs | Sensitivity |
      Risk Level | Mitigation).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Every hypothesis has a quantified baseline and target, not just direction
      - Annual value calculations show the formula (not just the result)
      - Confidence levels are defensible (HIGH requires comparable proof points)
      - Measurement plan identifies real data sources, not aspirational ones
      - Assumptions are explicit, not embedded invisibly in calculations
      - Total annual value across hypotheses aligns with TAP from discovery
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all 5 deliverables as labeled sections. Lead with a summary that
      states: (1) total annual value (full and confidence-weighted) with number of
      hypotheses, (2) the weakest point or lowest confidence area across all hypotheses,
      and (3) the single most urgent action to take next. Include number of
      HIGH/MEDIUM/LOW confidence hypotheses and key assumptions count.

  stakeholder_value_narrative:
    name: "Stakeholder Value Narrative"
    description: "Create persona-specific value narrative with tailored metrics, language, evidence, objection responses, and decision triggers for a target stakeholder"
    prompt: |
      Context: Preparing value narrative for {stakeholder_role} at {account_name}.
      Role priorities: {stakeholder_priorities}
      Value hypothesis: {hypothesis}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are translating the business case into a narrative that speaks this specific
      stakeholder's language and addresses their specific concerns. A CFO narrative
      and a CTO narrative for the same deal should look fundamentally different.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: STAKEHOLDER ANALYSIS
      Build a detailed profile of this stakeholder:
      - Role and title
      - Primary decision authority (economic buyer, technical evaluator, champion, blocker)
      - Secondary role(s): if applicable, list additional decision roles this person plays
      - What they are measured on (their personal KPIs and OKRs)
      - Strategic priorities they own or contribute to
      - Known concerns or objections (from AE discovery, previous interactions)
      - Communication preference (data-heavy, narrative-driven, visual, executive summary)
      - Value vocabulary (the terms they use when discussing business outcomes)
      - Trust anchors (what evidence they find credible: analyst reports, peer references,
        internal data, benchmarks, executive testimonials)
      Deliverable: Stakeholder profile with all fields populated.

      STEP 2: HYPOTHESIS FILTERING AND RANKING
      From the full hypothesis set, select the hypotheses most relevant to this
      stakeholder's KPIs and priorities.
      For each selected hypothesis:
      - Why this stakeholder cares (link to their KPI or priority)
      - Metric to highlight (in their language, not vendor language)
      - Magnitude of impact on their specific goals
      Rank by relevance to this stakeholder. Typically 3-5 hypotheses per narrative.
      Leading with the one that addresses their biggest stated concern.
      Deliverable: Filtered hypothesis table (Hypothesis | Stakeholder KPI Link |
      Metric in Their Language | Rank).

      STEP 3: NARRATIVE CONSTRUCTION
      Write the value narrative in 3 parts:

      Opening (2-3 sentences): State the problem in the stakeholder's language.
      Reference their priority or concern. Do not mention the solution yet.
      Example for CFO: "Your security operations budget has grown 40% over 3 years
      while MTTD has improved only 12%. The cost per investigated alert is $47,
      and 68% of those investigations are false positives."

      Bridge (2-3 sentences): Connect the problem to a quantified outcome.
      Use the stakeholder's metrics. State the improvement in their terms.
      Example for CFO: "By consolidating detection and response onto a single
      platform, the analysis shows a potential 55% reduction in false positive
      investigation time, recovering approximately $1.2M annually in analyst
      capacity without adding headcount."

      Close (1-2 sentences): State what happens next and what you need from them.
      Example for CFO: "The attached business case models a 14-month payback with
      NPV of $2.8M over 3 years. We would like 30 minutes to walk through the
      assumptions with your team."

      Deliverable: Written narrative (7-8 sentences, labeled Opening/Bridge/Close).

      STEP 4: SUPPORTING EVIDENCE PACKAGE
      Select evidence that this stakeholder finds credible (from trust anchors):
      - 2-3 data points from the business case (specific numbers, not ranges)
      - 1-2 external proof points (analyst report, industry benchmark, peer reference)
      - 1 internal proof point (POC result, quick win, or pilot metric if available)
      For each evidence item, note why it is credible to THIS stakeholder.
      Deliverable: Evidence table (Evidence | Type | Source | Why Credible to This Role).

      STEP 5: OBJECTION PREPARATION
      Anticipate 3-5 objections this stakeholder is likely to raise.
      For each objection:
      - Objection statement (in their words, not paraphrased vendor-speak)
      - Why they raise it (underlying concern)
      - Response approach (acknowledge, reframe, evidence, concede)
      - Supporting data for the response
      - Redirect (how to move the conversation forward after addressing)
      Common objection patterns by persona:
      - CFO: "The ROI assumptions are aggressive" / "What is the payback if adoption is slower?"
      - CTO: "Integration complexity will delay time-to-value" / "How does this fit our architecture?"
      - COO: "Change management will disrupt operations" / "What is the productivity dip during transition?"
      Deliverable: Objection table (Objection | Underlying Concern | Response |
      Evidence | Redirect).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Narrative uses the stakeholder's vocabulary, not vendor vocabulary
      - Opening states the problem without mentioning the solution
      - All metrics are in the stakeholder's preferred format (%, $, time, ratio)
      - Evidence items match the stakeholder's trust anchors
      - Objection responses are honest (concede where appropriate, do not deflect)
      - Narrative is 7-8 sentences, not a multi-page document
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all 5 deliverables as labeled sections. Lead with a summary that
      states: (1) the core value narrative conclusion for this stakeholder, (2) the
      weakest point or lowest confidence area in the narrative, and (3) the single most
      urgent action to take next.

  business_case_development:
    name: "Business Case Development"
    description: "Build a defensible business case with investment summary, benefit projections by value driver, ROI with sensitivity analysis, cost of inaction, stakeholder-specific sections, and executive recommendation"
    prompt: |
      Context: Developing business case for {account_name}.
      Opportunity: {opportunity_value}
      Value hypothesis: {hypothesis}
      Decision maker: {decision_maker}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are building a business case that must survive CFO scrutiny. Every number
      must be traceable to a source. Every assumption must be stated explicitly.
      The document must work for the economic buyer who reads the executive summary
      and the technical evaluator who reads the appendix. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: EXECUTIVE SUMMARY
      Write a 1-paragraph executive summary (5-7 sentences) that stands alone.
      Structure: problem → solution → value → ask.
      Include: total investment, total benefit (3-year), ROI percentage, payback period,
      and recommended next step.
      The economic buyer reads this and only this. It must contain enough information
      to approve or request a deeper review. The executive summary must explicitly state:
      (1) the conclusion or overall score (ROI, payback), (2) the weakest point or
      lowest confidence area in the business case, and (3) the single most urgent action.
      Deliverable: Executive summary paragraph.

      STEP 2: INVESTMENT SUMMARY
      Itemize the total investment required:
      Categories:
      - Software licensing (annual or multi-year, per-unit pricing model)
      - Implementation services (partner or vendor, fixed or T&M)
      - Training (initial enablement, ongoing certification)
      - Internal effort (customer staff time for deployment, migration, integration)
      - Infrastructure (if on-prem or hybrid, additional compute/storage)
      - Ongoing operational cost (admin FTE, support tier, maintenance)
      Present as Year 1, Year 2, Year 3, and 3-year total.
      Distinguish one-time costs (implementation) from recurring costs (licensing).
      Deliverable: Investment table (Category | Year 1 | Year 2 | Year 3 | Total |
      Cost Type).

      STEP 3: BENEFIT PROJECTIONS BY VALUE DRIVER
      For each value hypothesis, project benefits over 3 years:
      - Value driver name and hypothesis ID
      - Primary benefit type (hard savings, soft savings, risk avoidance, revenue enablement)
      - Secondary benefit type(s): if applicable, list additional benefit types that also apply
      - Year 1 benefit (accounting for ramp-up: typically 50-75% of steady state)
      - Year 2 benefit (full run rate)
      - Year 3 benefit (full run rate + growth factor if applicable)
      - 3-year total
      - Confidence level (from hypothesis)
      - Assumptions (what must hold for this benefit to materialize)
      Calculate subtotals by benefit type and grand total.
      Apply ramp-up factors: Year 1 benefits are typically reduced due to deployment
      timeline, adoption curve, and change management. State the ramp factor used.
      Deliverable: Benefits table (Driver | Type | Year 1 | Year 2 | Year 3 | Total |
      Confidence | Key Assumption) with subtotals by type.

      STEP 4: ROI AND FINANCIAL ANALYSIS
      Calculate core financial metrics:
      - ROI: (Total Benefits - Total Investment) / Total Investment × 100
      - Net Present Value (NPV): using customer's discount rate (default 10% if unknown)
      - Payback period: month when cumulative benefits exceed cumulative investment
      - Internal Rate of Return (IRR): if data supports it
      Run sensitivity analysis on 3 scenarios:
      - Conservative: benefits at 70% of projection, costs at 110%
      - Base case: benefits and costs as projected
      - Optimistic: benefits at 120% of projection, costs at 95%
      For each scenario, recalculate ROI, NPV, and payback.
      Deliverable: Financial summary table (Metric | Conservative | Base | Optimistic)
      and sensitivity analysis narrative.

      STEP 5: COST OF INACTION
      Calculate what happens if the customer does nothing:
      - Ongoing pain costs: annualized TAP continuing (from discovery)
      - Growth amplification: how pain scales with business growth (headcount,
        data volume, transaction volume)
      - Risk accumulation: probability of risk events increasing over time
      - Competitive disadvantage: what peers are achieving that this customer is not
      - Opportunity cost: what the organization cannot pursue while current-state
        constraints persist
      Project cost of inaction over 1, 2, and 3 years.
      Frame as compounding cost, not just repeated annual cost.
      Deliverable: Cost of inaction table (Category | Year 1 | Year 2 | Year 3 | Total)
      with growth factors noted.

      STEP 6: RISK MITIGATION
      Address risks to achieving projected benefits:
      For each risk:
      - Risk description
      - Probability (HIGH, MEDIUM, LOW)
      - Impact on business case (which benefits are affected, by how much)
      - Mitigation approach (what reduces this risk)
      - Residual risk after mitigation
      Common business case risks: slower adoption than projected, integration delays,
      organizational change resistance, data quality issues, scope changes.
      Deliverable: Risk table (Risk | Probability | Impact | Mitigation | Residual).

      STEP 7: STAKEHOLDER-SPECIFIC VIEWS
      Create 1-page value summaries for each key stakeholder persona:
      - CFO view: investment, ROI, payback, NPV, cost of inaction
      - CTO view: integration architecture, time-to-value, technical risk, engineering productivity
      - COO/LOB view: operational improvement metrics, process changes, timeline to impact
      Each view highlights the 2-3 hypotheses most relevant to that persona and uses
      their value language (from discovery).
      Deliverable: Stakeholder summaries (1 paragraph + 3-4 metrics per persona).

      STEP 8: RECOMMENDATION AND NEXT STEPS
      State the recommendation clearly:
      - Recommended action (proceed, proceed with conditions, defer)
      - Key conditions (if any: e.g., "contingent on POC validating VH-003")
      - Immediate next steps as action table:
        Priority | Action | Owner | Timeline | Prerequisites | Expected Impact
        Prerequisites = what must be true before this action can start
      - Decision timeline (when the business case expires due to changing conditions)
      Deliverable: Recommendation section with action table (Priority | Action |
      Owner | Timeline | Prerequisites | Expected Impact).

      STEP 9: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Executive summary contains specific numbers (ROI %, payback period, NPV)
      - Investment and benefit totals are arithmetically consistent
      - Year 1 benefits include ramp-up reduction, not full run rate
      - Sensitivity analysis shows the business case holds even at conservative scenario
      - Cost of inaction exceeds Year 1 investment (otherwise the urgency case is weak)
      - Every assumption is stated, not embedded in calculations
      - Risk mitigation addresses the top 3 threats to benefit realization
      - Stakeholder views use different metrics and language per persona
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all 8 deliverables as labeled sections. The document should
      work as a standalone business case that can be forwarded to the economic buyer.

# ============================================================================
# VALUE CALCULATION PROMPTS
# ============================================================================
# Full runbook prompts: multi-step with financial methodology, sensitivity
# analysis, and quality checks on arithmetic consistency.
# ============================================================================
value_calculation:

  roi_calculation:
    name: "ROI Calculation"
    description: "Calculate 3-year return on investment with investment breakdown, benefit projections with ramp-up, payback period, NPV, and 3-scenario sensitivity analysis"
    prompt: |
      Context: ROI calculation for {account_name} {use_case} deployment.
      Investment: {investment_details}
      Expected benefits: {benefit_details}
      Timeline: {timeline}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are building a defensible ROI model. Every input must be sourced,
      every formula must be visible, and the model must survive a CFO asking
      "what happens if your assumptions are wrong by 30%?" Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: INVESTMENT STRUCTURE
      Break down the total investment into categories and years:
      - Software licensing: list each component, pricing model (per user, per GB,
        per endpoint, flat fee), quantity, and annual cost
      - Implementation: vendor services, partner services, internal effort (FTE hours × rate)
      - Training: initial enablement, ongoing certification, train-the-trainer
      - Data migration: effort, tooling, validation time
      - Infrastructure: additional compute, storage, network (if not SaaS)
      - Ongoing operations: admin FTE, support tier, maintenance, annual price escalation
      For each line: Year 1, Year 2, Year 3, and 3-year total.
      Separate one-time costs from recurring costs.
      Apply known price escalation (typically 3-5% annually for SaaS).
      Deliverable: Investment table (Category | Type | Year 1 | Year 2 | Year 3 | Total).

      STEP 2: BENEFIT PROJECTIONS
      For each value hypothesis, project annual benefits:
      - Hypothesis ID and description
      - Primary benefit type (hard savings, soft savings, risk avoidance, revenue enablement)
      - Secondary benefit type(s): if applicable, list additional benefit types that also apply
      - Calculation formula (visible, not just the result)
      - Year 1: apply ramp-up factor. Typical ramp-up:
        Month 1-3: 0% (deployment and configuration)
        Month 4-6: 25-50% (early adoption)
        Month 7-12: 75-100% (full adoption)
        Effective Year 1 benefit = approximately 40-60% of steady-state annual benefit
      - Year 2: full run rate (100% of annual benefit)
      - Year 3: full run rate + growth factor (if customer is growing, benefits scale)
      - Confidence level (from hypothesis)
      Calculate subtotals by benefit type and grand total.
      Deliverable: Benefits table (Hypothesis | Type | Formula | Year 1 | Year 2 |
      Year 3 | Total | Confidence) with subtotals.

      STEP 3: ROI CALCULATION
      Apply the standard ROI formula:
      ROI = (Total Benefits - Total Investment) / Total Investment × 100

      Calculate for 1-year, 2-year, and 3-year horizons.
      Present the progression: when does ROI turn positive?
      Deliverable: ROI summary (Horizon | Total Benefits | Total Investment | Net Value | ROI %).

      STEP 4: PAYBACK PERIOD
      Calculate the month when cumulative benefits exceed cumulative investment.
      Build a monthly cumulative table for the first 24 months:
      - Month | Cumulative Investment | Cumulative Benefit | Net Position
      Identify the crossover month.
      If payback exceeds 24 months, flag as extended payback and note the
      implications for deal positioning.
      Deliverable: Payback analysis with crossover month and monthly progression.

      STEP 5: NET PRESENT VALUE (NPV)
      Calculate NPV using the customer's weighted average cost of capital (WACC).
      If WACC is unknown, use 10% as default and note the assumption.
      - Discount each year's net cash flow: Net Cash Flow / (1 + WACC)^year
      - NPV = sum of discounted cash flows - initial investment
      Present NPV for conservative, base, and optimistic scenarios.
      Deliverable: NPV table (Year | Net Cash Flow | Discount Factor | Present Value)
      with total NPV.

      STEP 6: SENSITIVITY ANALYSIS
      Model 3 scenarios:
      - Conservative: benefits at 70%, costs at 110%, ramp-up 6 months longer
      - Base case: as projected
      - Optimistic: benefits at 120%, costs at 95%, ramp-up 3 months faster
      For each scenario: recalculate ROI, payback, and NPV.
      Additionally, test single-variable sensitivity:
      - What ROI if the largest benefit hypothesis fails completely?
      - What ROI if implementation takes 2x longer?
      - What break-even benefit level is needed to achieve 100% ROI?
      Deliverable: Sensitivity table (Scenario | ROI | Payback | NPV) and
      single-variable sensitivity analysis.

      STEP 7: ASSUMPTIONS REGISTER
      List every assumption in the model:
      - Assumption text
      - Impact: which line items depend on this
      - Source: where the assumption came from
      - Sensitivity: HIGH (changes ROI by >10%), MEDIUM (5-10%), LOW (<5%)
      - Validation: how the customer can confirm or adjust
      Deliverable: Assumptions table (Assumption | Line Items | Source | Sensitivity | Validation).

      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Total investment = sum of all investment lines (arithmetic check)
      - Total benefits = sum of all benefit lines (arithmetic check)
      - Year 1 benefits are reduced by ramp-up factor, not at full run rate
      - ROI formula is applied correctly (verify arithmetic)
      - NPV discount rate is stated and sourced
      - Sensitivity analysis shows the model holds at conservative scenario
      - Payback month is consistent with the cumulative table
      - Every assumption is stated, none embedded invisibly in formulas
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all 7 deliverables as labeled sections. Lead with a financial
      summary that states: (1) 3-year ROI, payback month, and NPV, (2) the weakest
      point or lowest confidence area in the model, and (3) the single most urgent
      action to take next. Include sensitivity range.

  tco_analysis:
    name: "Total Cost of Ownership Analysis"
    description: "Compare total cost of ownership between current state and proposed state across all cost categories, including hidden costs, with net savings projection and cost driver analysis"
    prompt: |
      Context: TCO comparison for {account_name}.
      Current state: {current_tools}
      Proposed state: {vendor} {solution}
      Evaluation period: {years} years
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are building a side-by-side TCO comparison. The goal is to show the full
      cost picture, including costs the customer may not currently track. Hidden
      costs often determine whether the TCO story favors the current state or the
      proposed state. Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TCO CATEGORY FRAMEWORK
      Define the cost categories for both current and proposed state:
      - Software licensing (all tools, all tiers, all modules)
      - Infrastructure (compute, storage, network, cloud services)
      - Personnel: dedicated (FTEs assigned full-time to this function)
      - Personnel: shared (FTE fraction from teams that partially support this function)
      - Implementation and migration (one-time costs for the proposed state)
      - Training and enablement (initial and ongoing)
      - Integration and customization (connectors, custom rules, workflows)
      - Maintenance and upgrades (version upgrades, patch management, regression testing)
      - Support (vendor support tier, internal helpdesk, escalation)
      - Compliance and audit (audit preparation, certification, reporting)
      - Downtime and incident cost (outage impact, incident response, recovery)
      - Opportunity cost (what cannot be done because resources are consumed here)
      Deliverable: Category framework table (Category | Description | Applies to Current | Applies to Proposed).

      STEP 2: CURRENT STATE TCO
      For each category, calculate annual cost in the current state:
      - Line item description (specific tool, role, or service)
      - Annual cost
      - Source: CONFIRMED (invoice, contract), ESTIMATED (headcount × rate),
        HIDDEN (not budgeted but real)
      - Growth rate (annual cost escalation: price increases, volume growth)
      Project over the evaluation period with growth applied.
      Include hidden costs most TCO analyses miss:
      - Context switching time between multiple tools
      - Manual data transfer and reconciliation between systems
      - Tribal knowledge dependencies (single person who knows the system)
      - Technical debt from deferred upgrades or unsupported versions
      - Shadow IT (team-level purchases outside central procurement)
      Deliverable: Current state TCO table (Category | Item | Year 1 | Year 2 | Year 3 | Total | Source).

      STEP 3: PROPOSED STATE TCO
      For each category, calculate annual cost with the proposed solution:
      - Line item description
      - Annual cost (from vendor pricing, implementation estimate, staffing plan)
      - Source: QUOTED (vendor proposal), ESTIMATED (scoping estimate), ASSUMED
      - Year 1 includes one-time costs (implementation, migration, training)
      Account for:
      - Transition period overlap (running both current and proposed state during migration)
      - Decommission costs (terminating current contracts, data export, archive)
      - Learning curve productivity impact (staff slower during first 3-6 months)
      Deliverable: Proposed state TCO table (same format as current state).

      STEP 4: TCO COMPARISON AND NET SAVINGS
      Build a side-by-side comparison:
      - Category | Current State | Proposed State | Difference | Savings %
      Calculate:
      - Total current state TCO (evaluation period)
      - Total proposed state TCO (evaluation period)
      - Net savings (current - proposed)
      - Net savings percentage
      - Year when proposed state becomes cheaper than current state (crossover)
      If Year 1 proposed state is more expensive (due to implementation), note the
      crossover point where cumulative savings turn positive.
      Deliverable: TCO comparison table and net savings summary.

      STEP 5: COST DRIVER ANALYSIS
      Identify the top 5 cost drivers that determine the TCO difference:
      - Cost driver (what is it)
      - Direction (favors current or proposed)
      - Magnitude (dollar impact)
      - Sensitivity (if this driver changes by 20%, how does TCO comparison shift)
      - Customer control (can the customer influence this cost)
      This analysis shows the customer which levers matter most. If 80% of the
      savings come from 2 cost drivers, those drivers need strong evidence.
      Deliverable: Cost driver table (Driver | Direction | Magnitude | Sensitivity | Control).

      STEP 6: ASSUMPTIONS AND CAVEATS
      Document every assumption:
      - Pricing assumptions (contract terms, discount levels, volume tiers)
      - Staffing assumptions (current and proposed headcount)
      - Growth assumptions (data volume, user count, transaction volume)
      - Timeline assumptions (implementation duration, migration approach)
      Note caveats: what the TCO does NOT include (business value of new capabilities,
      risk reduction value, revenue enablement). TCO is a cost comparison only.
      Deliverable: Assumptions and caveats list.

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Same categories used for both current and proposed state (apples to apples)
      - Hidden costs are included in current state (not just license costs)
      - One-time costs are in Year 1 only, not spread across years
      - Growth rates are applied consistently to both states
      - Net savings arithmetic matches the individual category differences
      - Transition overlap costs are included in proposed state Year 1
      - Sources are classified for every cost line
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all 6 deliverables as labeled sections. Lead with TCO summary
      that states: (1) current state total, proposed state total, net savings, and
      savings %, (2) the weakest point or lowest confidence area in the TCO model,
      and (3) the single most urgent action to take next. Include crossover year.

  cost_of_inaction:
    name: "Cost of Inaction Analysis"
    description: "Calculate the compounding cost of maintaining status quo across ongoing pain, risk accumulation, growth amplification, competitive gap, and missed opportunities"
    prompt: |
      Context: {account_name} considering delaying decision.
      Current pain points: {pain_points}
      Risk factors: {risks}
      Growth projections: {growth}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are building the urgency case. Cost of inaction is not just "pain continues."
      It compounds: costs grow with business volume, risks accumulate over time, and
      competitors who act gain advantages that widen. Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: ONGOING PAIN CONTINUATION
      Take each quantified pain point from discovery and project it forward:
      - Pain point (with current annual cost)
      - Annual cost continuation (same cost repeating each year)
      - Growth adjustment: apply the customer's business growth rate to scale
        volume-dependent costs (more endpoints = more alerts = more investigation time)
      - Inflation adjustment: apply labor cost inflation (typically 3-4% annually)
      Project for 1, 2, and 3 years of delay.
      Deliverable: Pain continuation table (Pain Point | Year 0 | Year 1 | Year 2 |
      Year 3 | 3-Year Total | Growth Factor Applied).

      STEP 2: RISK ACCUMULATION
      Risks do not stay static. They compound:
      - Expanding attack surface (more systems, more users, more data)
      - Aging infrastructure (end-of-support dates, unpatched vulnerabilities)
      - Regulatory tightening (new compliance requirements, higher penalties)
      - Skill attrition (key personnel leave, knowledge walks out the door)
      For each risk factor:
      - Current annual expected loss (probability × impact)
      - Annual escalation rate (how probability or impact increases per year)
      - Projected expected loss at Year 1, 2, 3
      - Trigger events that could accelerate the risk (audit, breach, regulation change)
      Deliverable: Risk accumulation table (Risk | Current EAL | Escalation Rate |
      Year 1 EAL | Year 2 EAL | Year 3 EAL | Trigger Events).

      STEP 3: GROWTH AMPLIFICATION
      Show how business growth makes current-state problems worse:
      - Customer's stated growth projections (revenue, headcount, data volume, transaction volume)
      - Which pain points scale linearly with growth (more users = more licenses, more tickets)
      - Which pain points scale super-linearly (complexity increases faster than volume:
        10x data may require 15x analyst time due to correlation complexity)
      - Cost projection at growth rate vs current flat cost
      Deliverable: Growth amplification table (Pain Point | Current Cost | Growth Rate |
      Year 1 at Growth | Year 2 at Growth | Year 3 at Growth | Amplification Factor).

      STEP 4: COMPETITIVE DISADVANTAGE
      Quantify what competitors and peers are achieving:
      - Industry benchmark improvements (from references/industry-benchmarks.yaml)
      - What peers who have already invested are reporting (analyst data, case studies)
      - Specific metrics where the customer falls behind each year of delay
      - Market consequences: customer churn risk, talent retention, regulatory readiness
      Frame as widening gap: "Each year of delay increases the gap from X to Y."
      Deliverable: Competitive gap analysis (Metric | Customer Current | Peer Average |
      Gap Today | Gap at Year 1 | Gap at Year 2 | Gap at Year 3).

      STEP 5: OPPORTUNITY COST
      Identify what the organization cannot do while current-state constraints persist:
      - Strategic initiatives blocked or delayed by current limitations
      - Revenue opportunities that require capabilities the current state cannot provide
      - Talent impact (difficulty hiring or retaining with outdated tooling)
      - Innovation capacity consumed by operational maintenance
      Quantify where possible. For non-quantifiable items, note the strategic impact.
      Deliverable: Opportunity cost table (Opportunity | Blocked By | Estimated Value |
      Confidence | Strategic Impact).

      STEP 6: TOTAL COST OF INACTION
      Aggregate all components:
      - Total COI = pain continuation + risk accumulation + growth amplification
        + competitive gap (quantifiable portion) + opportunity cost (quantifiable portion)
      Present as:
      - 6-month delay cost
      - 12-month delay cost
      - 24-month delay cost
      - 36-month delay cost
      Compare to the proposed investment: "A 12-month delay costs $X, which exceeds
      the total 3-year investment of $Y."
      Deliverable: Total COI summary with comparison to investment and urgency statement.

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Pain continuation uses actual quantified pain points, not new estimates
      - Growth rates match the customer's stated projections
      - Risk escalation rates are justified, not arbitrary
      - Competitive gap uses real benchmark data, not invented comparisons
      - Total COI arithmetic matches the sum of components
      - Comparison to investment makes the urgency case concrete
      - Tone is factual, not alarmist (compounding costs, not scare tactics)
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all 6 deliverables as labeled sections. Lead with the COI headline
      that states: (1) total cost of inaction per month and over 3 years, (2) the weakest
      point or lowest confidence area in the COI analysis, and (3) the single most urgent
      action to take next. Include: "Each month of delay costs {account_name}
      approximately $X in ongoing pain, accumulating risk, and widening competitive gap."

  value_quantification_by_type:
    name: "Value Quantification by Type"
    description: "Quantify all value across four types: hard savings, soft savings, risk avoidance, and revenue enablement, with calculation formulas, confidence levels, and total value summary"
    prompt: |
      Context: Comprehensive value quantification for {account_name}.
      Use cases: {use_cases}
      Baseline metrics: {baselines}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are categorizing and quantifying all value the customer can expect.
      Different stakeholders weight value types differently: CFOs prioritize
      hard savings, CTOs value soft savings (productivity), CISOs value risk
      avoidance, and COOs value revenue enablement. Separating value by type
      makes the business case work for every audience. Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: HARD SAVINGS (DIRECT COST REDUCTION)
      Identify every direct, measurable cost reduction:
      - Tool consolidation (licenses eliminated or reduced)
      - Infrastructure reduction (servers, storage, cloud instances decommissioned)
      - Vendor contract elimination (services no longer needed)
      - Headcount avoidance (roles not needed with automation, not layoffs)
      - Reduced support/maintenance costs
      For each:
      - Current annual cost (from baseline)
      - Projected annual cost (with proposed solution)
      - Annual savings = current - projected
      - Calculation formula (visible and verifiable)
      - Confidence: HIGH (contract values known), MEDIUM (estimates from scoping),
        LOW (assumptions applied)
      - First savings date (when does this cost actually stop)
      Deliverable: Hard savings table (Item | Current | Projected | Annual Savings |
      Formula | Confidence | First Savings Date) with total.

      STEP 2: SOFT SAVINGS (PRODUCTIVITY AND EFFICIENCY)
      Quantify time and productivity gains that free capacity but do not directly
      eliminate a cost line:
      - Automated tasks (manual hours eliminated × frequency × hourly rate)
      - Faster processes (time reduction per task × volume × rate)
      - Reduced context switching (estimated switches avoided × time per switch × rate)
      - Simplified workflows (steps eliminated × time per step × volume × rate)
      - Faster onboarding (reduced time-to-productivity for new hires)
      For each:
      - Activity description
      - Current time per occurrence
      - Projected time per occurrence
      - Time saved per occurrence
      - Annual volume (occurrences per year)
      - Hourly rate (fully loaded)
      - Annual value = time saved × volume × rate
      - Confidence level
      Note: soft savings represent capacity recovery. State whether the customer
      plans to redeploy this capacity (to higher-value work) or reduce it (headcount).
      The redeployment narrative is stronger than the reduction narrative.
      Deliverable: Soft savings table (Activity | Current Time | Projected Time |
      Time Saved | Volume | Rate | Annual Value | Confidence) with total.

      STEP 3: RISK AVOIDANCE (COST OF INCIDENTS PREVENTED)
      Quantify the value of risks reduced or eliminated:
      - Security incidents (breach cost × probability reduction)
      - Compliance violations (penalty × probability reduction)
      - Service outages (downtime cost × frequency reduction)
      - Data loss events (recovery cost × probability reduction)
      - Audit failures (remediation cost × probability reduction)
      For each:
      - Risk scenario
      - Current probability (per year)
      - Current impact (dollar cost if realized)
      - Current expected annual loss = probability × impact
      - Projected probability (with proposed solution)
      - Projected expected annual loss
      - Risk avoidance value = current EAL - projected EAL
      - Confidence level
      - Source for probability and impact estimates (incident history, industry data, benchmark)
      Risk avoidance is often the largest value category for security use cases
      but the hardest to defend. Source every probability and impact estimate.
      Deliverable: Risk avoidance table (Scenario | Current Prob | Impact | Current EAL |
      Projected Prob | Projected EAL | Avoidance Value | Confidence | Source) with total.

      STEP 4: REVENUE ENABLEMENT (BUSINESS OUTCOMES ENABLED)
      Quantify capabilities that create or protect revenue:
      - Faster time-to-market (development velocity improvement → earlier revenue capture)
      - Customer experience improvement (reduced churn, higher satisfaction)
      - New market entry (capabilities that enable previously impossible offerings)
      - Sales velocity (faster deal closure, higher win rates from better security posture)
      - Customer trust (security certifications that unlock enterprise deals)
      For each:
      - Capability enabled
      - Revenue mechanism (how it translates to dollars)
      - Estimated annual revenue impact
      - Confidence level (typically LOW unless directly measurable)
      - Measurement approach (how to validate post-deployment)
      Revenue enablement is often speculative. Use conservative estimates and
      flag confidence clearly. Do not inflate this category to hit a target ROI.
      Deliverable: Revenue enablement table (Capability | Revenue Mechanism |
      Annual Impact | Confidence | Measurement Approach) with total.

      STEP 5: TOTAL VALUE SUMMARY
      Aggregate all value types:
      - Hard savings total
      - Soft savings total
      - Risk avoidance total
      - Revenue enablement total
      - Grand total
      Calculate confidence-weighted total:
      HIGH at 100% + MEDIUM at 70% + LOW at 40%
      Present value breakdown as percentages to show the composition.
      Create stakeholder mapping: which value types matter to which roles.
      Deliverable: Value summary table (Type | Total | % of Grand Total | Confidence-Weighted |
      Primary Stakeholder) and stakeholder value map.

      STEP 6: METHODOLOGY AND ASSUMPTIONS
      Document the calculation methodology:
      - Hourly rate used for FTE calculations (and source)
      - Growth rates applied (and source)
      - Benchmark sources cited for risk probabilities
      - Ramp-up factors applied to Year 1 projections
      List all assumptions with sensitivity classification.
      Deliverable: Methodology section and assumptions register.

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Every value line has a visible calculation formula
      - Hard savings reference specific cost lines that will be eliminated
      - Soft savings state whether capacity is redeployed or reduced
      - Risk avoidance probabilities cite sources (not invented)
      - Revenue enablement uses conservative estimates with LOW confidence flags
      - Grand total matches the sum of type totals (arithmetic check)
      - Confidence-weighted total is calculated and presented alongside full total
      - No double counting between categories (dollar value attributed to primary category;
        secondary categories noted for context but not double-counted)
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all 6 deliverables as labeled sections. Lead with value summary
      that states: (1) grand total and confidence-weighted total with breakdown by type,
      (2) the weakest point or lowest confidence area across all value types, and (3) the
      single most urgent action to take next. Include primary stakeholder per type.

# ============================================================================
# VALUE STREAM WORKSHOP PROMPTS
# ============================================================================
# Full runbook prompts: each prompt is a multi-step runbook with phase gates,
# methodology steps, deliverable specs, and quality checks.
# Reference: discovery-workshop.yaml, VE Job Plan, SAFe VSM, Forrester TEI
# ============================================================================
value_stream_workshop:

  workshop_preparation:
    name: "Value Stream Workshop Preparation"
    description: "Prepare value stream discovery workshop with objectives, pre-work data request, agenda, facilitator guide, and materials checklist"
    prompt: |
      Context: Planning value stream workshop for {account_name}.
      Workshop date: {date}
      Attendees: {attendees}
      Focus area: {focus}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are preparing a structured value stream workshop. Follow these steps in order.
      Each step produces a specific deliverable. Do not skip steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: PRE-WORKSHOP RESEARCH
      Pull account context from read-account-data and read-value-tracker.
      From account data, extract: industry segment, company size, strategic priorities,
      current tooling, known pain points, and stakeholder roles for each attendee.
      From value tracker, extract: existing value hypotheses, prior workshop findings,
      and baseline metrics already captured.
      If read-value-tracker returns no records, this is a first engagement. Note this
      and proceed with account data only.
      Deliverable: Research summary with key findings per attendee role.

      STEP 2: DEFINE WORKSHOP OBJECTIVES
      Based on the research, define 3-5 measurable workshop objectives.
      Each objective must state what will be produced (not discussed), who owns
      the output, and how success is measured.
      Bad: "Discuss current challenges"
      Good: "Capture baseline metrics for top 3 workflows with frequency, cost per
      occurrence, and annual impact, validated by process owners in the room"
      Deliverable: Numbered objectives list with owner and success criteria per objective.

      STEP 3: BUILD PRE-WORKSHOP DATA REQUEST
      Create a structured data request to send to the customer 5-7 business days
      before the workshop. Tailor items to the focus area and industry.
      Include these categories:
      - Headcount in affected departments (roles, FTE count, fully loaded cost rates)
      - Annual spend on current tools and solutions (license, maintenance, services)
      - Volume metrics (transactions, tickets, incidents, deployments per month)
      - Process time for key workflows in focus area (end-to-end cycle time)
      - Known pain points the customer has already identified
      For each item, explain why it is needed so the customer understands the ask.
      Mark items as REQUIRED (workshop cannot proceed without) or HELPFUL (enriches
      analysis but can be collected during session).
      Deliverable: Data request table (Item | Category | Why Needed | Priority).

      STEP 4: DESIGN WORKSHOP AGENDA
      Build a timed agenda for a 60-90 minute session with 5 sections.
      Allocate time based on the focus area complexity:

      Section 1: Context Setting (10 min)
      - Welcome, ground rules (no sales pitch, data-driven conversation)
      - Confirm attendee roles and decision authority
      - Share preliminary value hypothesis as a starting anchor
      - State expected outcomes and how findings will be used

      Section 2: Current State Walk-Through (25 min)
      - Process walk-through from trigger event to completion
      - Tool inventory at each step
      - Handoff points between teams or systems
      - Quantify: time per step, frequency, people involved

      Section 3: Impact Quantification (20 min)
      - For each pain point: frequency, cost per occurrence, annual impact
      - Distinguish hard costs (dollars) from soft costs (time, productivity)
      - Capture downstream effects (what breaks when this process fails)
      - Record confidence level: HIGH (customer data), MEDIUM (customer estimate), LOW (benchmark)

      Section 4: Future State Vision (15 min)
      - Define success at 12 months
      - Which metrics improve and by how much
      - What the team does with recovered time or resources
      - What strategic initiatives this enables

      Section 5: Prioritization and Next Steps (10 min)
      - Rank value drivers by magnitude and confidence
      - Identify data gaps requiring follow-up with specific owners
      - Agree on business case delivery timeline (5-10 business days)
      - Confirm review session date

      For each section, note the facilitator's role (ask vs present vs capture).
      Deliverable: Timed agenda table (Section | Duration | Purpose | Facilitator Role | Output).

      STEP 5: CREATE FACILITATOR GUIDE
      For each agenda section, provide:
      - 3-5 specific questions to ask (not generic, tailored to account and focus area)
      - Anchoring technique: use industry benchmarks as starting points
        ("Other companies in your industry typically see X. Does that sound right?")
      - Probing technique: when the customer says "a lot" or "significant", follow up
        with "Can you help me put a number on that? Even a rough estimate helps."
      - Silence technique: after asking a quantification question, wait. Do not fill
        the silence. The customer will provide real numbers.
      - Capture instruction: what to record and in what format during this section
      - Transition prompt: how to move to the next section naturally
      Include a "facilitator traps" list: common mistakes to avoid during each section.
      Deliverable: Facilitator guide organized by agenda section.

      STEP 6: MATERIALS CHECKLIST AND LOGISTICS
      List all materials needed:
      - Pre-populated templates (current state map, pain point table, value driver matrix)
      - Whiteboard or shared document for live capture
      - Industry benchmark reference data relevant to the focus area
      - Preliminary value hypothesis document
      - Printed attendee list with roles
      - Post-workshop follow-up template
      Note virtual vs in-person logistics differences.
      Deliverable: Materials checklist with preparation status (Ready | Needs Prep | Depends on Data Request).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Every objective is measurable, not aspirational
      - Data request items are specific to this account and focus area, not generic
      - Agenda sections sum to 60-90 minutes total
      - Facilitator questions reference account-specific context from Step 1
      - No section asks the customer to "discuss" without specifying what data to capture
      - Industry benchmarks cited are relevant to the customer's vertical
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all 6 deliverables as labeled sections. Use tables where specified.
      Lead with a summary that states: (1) workshop readiness assessment and key objectives,
      (2) the weakest point or lowest confidence area in preparation, and (3) the single
      most urgent action to take next.

  current_state_mapping:
    name: "Current State Value Stream Mapping"
    description: "Map customer current-state workflows with tool inventory, handoff points, pain points, baseline metrics, and cost structure"
    prompt: |
      Context: Current state mapping for {account_name}.
      Process area: {process_area}
      Workshop findings: {findings}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are mapping the customer's current-state value stream from workshop findings.
      The goal is a structured, quantified map that becomes the baseline for all
      downstream value calculations. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: WORKFLOW RECONSTRUCTION
      From the workshop findings, reconstruct the end-to-end workflow for the process area.
      For each step in the workflow, capture:
      - Step name and description (what happens)
      - Trigger (what initiates this step)
      - Owner (role or team responsible)
      - Duration (time to complete this step)
      - Wait time (time waiting before this step begins)
      - Systems/tools used at this step
      - Output (what this step produces for the next step)
      Map the sequence: which steps are sequential, which are parallel, which have
      decision branches.
      Deliverable: Workflow table (Step | Trigger | Owner | Duration | Wait Time | Tools | Output).

      STEP 2: TOOL INVENTORY
      Extract all tools, systems, and manual processes mentioned during the workshop.
      For each tool, capture:
      - Tool name and vendor
      - Purpose in the workflow (what it does)
      - Users (roles and approximate headcount)
      - Annual cost (license + maintenance + services if available)
      - Integration points (what other tools it connects to)
      - Pain points specific to this tool (manual workarounds, limitations, outages)
      Flag overlapping tools that serve similar purposes.
      Deliverable: Tool inventory table (Tool | Purpose | Users | Annual Cost | Integrations | Pain Points).

      STEP 3: HANDOFF ANALYSIS
      Identify every point where work transfers between people, teams, or systems.
      For each handoff:
      - From (role/system) to (role/system)
      - Handoff mechanism (email, ticket, manual export, API, verbal)
      - Average delay at this handoff (hours or days)
      - Failure rate (how often the handoff drops, duplicates, or requires rework)
      - Cost of failure (rework hours, escalation, customer impact)
      Rank handoffs by total delay and failure cost.
      Deliverable: Handoff table (From | To | Mechanism | Avg Delay | Failure Rate | Cost of Failure).

      STEP 4: PAIN POINT MAP
      From workshop findings, extract every stated pain point.
      For each pain point:
      - Description (specific, not generic)
      - Workflow step where it occurs (reference Step 1)
      - Root cause (why it happens, not just what happens)
      - Frequency (times per week/month/year)
      - Impact per occurrence (hours lost, dollars, risk exposure)
      - Annual cost: Frequency × Impact per occurrence
      - Confidence level: HIGH (customer provided numbers), MEDIUM (customer estimate),
        LOW (VE estimate from benchmarks)
      - Affected stakeholders (who feels this pain)
      Sort by annual cost descending.
      Deliverable: Pain point table (Pain | Step | Root Cause | Frequency | Impact | Annual Cost | Confidence | Stakeholders).

      STEP 5: BASELINE METRICS
      Compile all quantitative metrics captured during the workshop into a baseline
      metrics table. These baselines become the "before" against which future-state
      improvements are measured.
      Categories:
      - Time metrics (MTTD, MTTR, cycle time, lead time, wait time)
      - Volume metrics (incidents/month, deployments/week, tickets/day)
      - Cost metrics (tool spend, FTE cost, rework cost, incident cost)
      - Quality metrics (error rate, false positive rate, rework rate)
      - Risk metrics (compliance gaps, unpatched systems, audit findings)
      For each metric, record: current value, source (customer data vs estimate),
      and industry benchmark for comparison.
      Deliverable: Baseline metrics table (Metric | Category | Current Value | Source | Industry Benchmark | Gap).

      STEP 6: IMPROVEMENT OPPORTUNITY IDENTIFICATION
      Based on the pain points, handoffs, and baseline gaps, identify the top
      improvement opportunities. For each opportunity:
      - What changes (process, tool, automation, elimination)
      - Which pain points it addresses (reference Step 4)
      - Estimated improvement range (conservative to optimistic)
      - Feasibility (quick win, moderate effort, major initiative)
      - Dependencies (what must be true for this to work)
      Do not design the future state here. Only identify where improvement is possible
      and estimate the magnitude. Future state design is a separate step.
      Deliverable: Opportunity table (Opportunity | Pain Points Addressed | Improvement Range | Feasibility | Dependencies).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Every pain point has a quantified annual cost, not just a description
      - Every baseline metric cites its source (customer data vs estimate vs benchmark)
      - Handoff delays are quantified in hours or days, not "slow" or "delayed"
      - Tool inventory includes cost data where available, flags where missing
      - Opportunities reference specific pain points by ID, not generic statements
      - Total addressable pain (sum of all pain point annual costs) is calculated
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all 6 deliverables as labeled sections. Include a summary at the
      top that states: (1) total workflow steps, total tools, total handoffs, and total
      addressable pain (TAP), (2) the weakest point or lowest confidence area across
      all mappings, and (3) the single most urgent action to take next. Include number
      of improvement opportunities identified.

  future_state_design:
    name: "Future State Value Stream Design"
    description: "Design target-state workflow with eliminated pain points, measurable improvement targets per baseline metric, and phased transformation roadmap"
    prompt: |
      Context: Future state design for {account_name}.
      Current state analysis: {current_state}
      {vendor} capabilities: {capabilities}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are designing the future-state value stream based on the current-state map.
      The future state must trace every improvement back to a specific current-state
      pain point and baseline metric. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: PAIN POINT TO CAPABILITY MAPPING
      Take each pain point from the current-state map and identify which {vendor}
      capability addresses it.
      For each mapping:
      - Pain point (from current state, with annual cost)
      - {vendor} capability that addresses it
      - How it addresses the pain (specific mechanism, not marketing language)
      - Estimated improvement percentage (conservative, target, optimistic)
      - Confidence level for the estimate (HIGH: proven in similar deployment,
        MEDIUM: demonstrated in POC/demo, LOW: theoretical based on capability)
      If a pain point has no matching capability, mark it as OUT OF SCOPE and note
      whether a partner, custom development, or process change addresses it.
      Deliverable: Mapping table (Pain Point | Annual Cost | Capability | Mechanism | Improvement % | Confidence).

      STEP 2: FUTURE STATE WORKFLOW REDESIGN
      Redesign the workflow from Step 1 of the current-state map.
      For each step in the future workflow:
      - What changes from current state (automated, eliminated, consolidated, unchanged)
      - New duration vs current duration
      - New owner (if responsibility shifts)
      - Tools used (current tool replaced, new tool added, or unchanged)
      - Handoffs eliminated or simplified
      Mark which steps are net-new (did not exist in current state).
      Deliverable: Future state workflow table (Step | Change Type | Current Duration |
      Future Duration | Time Saved | Tools | Handoff Change).

      STEP 3: BEFORE/AFTER METRIC TARGETS
      For every baseline metric from the current-state map, define the target
      future-state value.
      For each metric:
      - Metric name and category
      - Current baseline value (from current-state map)
      - Target future-state value
      - Improvement percentage
      - How it will be measured post-deployment
      - Timeline to achieve (30 days, 90 days, 6 months, 12 months)
      - Dependency (what must be deployed or configured for this to be measurable)
      Use conservative estimates. Overpromising erodes credibility at realization.
      Deliverable: Target metrics table (Metric | Baseline | Target | Improvement % |
      Measurement Method | Timeline | Dependency).

      STEP 4: ELIMINATED AND REMAINING PAIN POINTS
      Categorize all current-state pain points into:
      - ELIMINATED: fully addressed by {vendor} capability (cite the capability)
      - REDUCED: partially addressed, with estimated residual cost
      - UNCHANGED: not addressed by this deployment (explain why)
      Calculate the total value captured (sum of eliminated + reduction in reduced)
      vs total addressable pain from current state.
      Deliverable: Pain point resolution table (Pain Point | Status | Capability |
      Residual Cost | Value Captured).

      STEP 5: NEW CAPABILITIES ENABLED
      Identify capabilities the customer gains that did not exist in current state.
      These are not pain point fixes but net-new value.
      For each new capability:
      - What it enables (specific operational outcome, not feature name)
      - Business value (revenue enablement, risk avoidance, strategic positioning)
      - Who benefits (stakeholder role)
      - How to quantify the value (metric and measurement approach)
      Deliverable: New capabilities table (Capability | Outcome | Value Type |
      Beneficiary | Quantification Approach).

      STEP 6: TRANSFORMATION ROADMAP
      Sequence the changes into implementation phases:
      Phase 0 (pre-deployment, weeks 1-4): configuration, integration setup, data migration
      Phase 1 (quick wins, weeks 1-8): changes delivering measurable value within 60 days
      Phase 2 (core deployment, months 2-6): primary workflow transformation
      Phase 3 (optimization, months 6-12): advanced capabilities, process refinement
      For each phase:
      - Changes included (reference specific workflow steps and capabilities)
      - Prerequisites from previous phase
      - Expected value delivered (dollar amount or percentage of total)
      - Risk factors and mitigation
      - Success criteria to gate progression to next phase
      Deliverable: Roadmap table (Phase | Timeline | Changes | Prerequisites |
      Value Delivered | Risks | Gate Criteria).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Every improvement traces to a specific current-state pain point with cost
      - No improvement claims lack a confidence level and measurement method
      - Conservative estimates used throughout (not marketing benchmarks)
      - Unchanged pain points are acknowledged, not hidden
      - Roadmap phases have gate criteria, not just timelines
      - Total value captured does not exceed total addressable pain from current state
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all 6 deliverables as labeled sections. Include a summary at the
      top that states: (1) total pain points addressed and total value captured vs TAP,
      (2) the weakest point or lowest confidence area in the future state design, and
      (3) the single most urgent action to take next. Include number of metrics with
      targets and number of roadmap phases.

  workshop_synthesis:
    name: "Value Stream Workshop Synthesis"
    description: "Synthesize current-state and future-state findings into structured value model with prioritized opportunities, quick wins, phased roadmap, and executive summary"
    prompt: |
      Context: Completed value stream workshop for {account_name}.
      Current state findings: {current_state}
      Future state design: {future_state}
      Metrics captured: {metrics}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are synthesizing the full workshop output into a value model that feeds
      directly into business case construction and stakeholder presentations.
      This is the bridge between workshop findings and financial modeling.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: EXECUTIVE VALUE SUMMARY
      Write a 3-sentence executive summary that a CFO can read in 30 seconds:
      Sentence 1: The problem (total addressable pain in dollars, number of affected workflows)
      Sentence 2: The solution (what changes, total value captured, timeline)
      Sentence 3: The ask (investment needed, expected ROI range, recommended next step)
      Then write a 1-paragraph narrative (5-7 sentences) expanding on the summary
      with key evidence from the workshop. Reference specific metrics and pain points,
      not generic statements. The executive summary must explicitly state: (1) the
      conclusion or overall value captured, (2) the weakest point or lowest confidence
      area across all findings, and (3) the single most urgent action to take next.
      Deliverable: Executive summary (3 sentences + 1 paragraph).

      STEP 2: VALUE OPPORTUNITY INVENTORY
      Consolidate all value opportunities from current-state pain points and
      future-state new capabilities into a single inventory.
      For each opportunity:
      - Opportunity name (action-oriented: "Eliminate X" or "Automate Y")
      - Source (pain point elimination, pain point reduction, or new capability)
      - Primary value type (hard savings, soft savings, risk avoidance, revenue enablement)
      - Secondary value type(s): if applicable, list additional value types that also apply
        (dollar value attributed to primary type to avoid double counting)
      - Annual value (conservative estimate)
      - Confidence level (HIGH, MEDIUM, LOW)
      - Stakeholder who benefits most
      Calculate totals by primary value type and by confidence level.
      Deliverable: Value opportunity table (Opportunity | Source | Primary Value Type |
      Secondary Type(s) | Annual Value | Confidence | Stakeholder) with subtotals.

      STEP 3: QUICK WINS (0-30 DAYS)
      Extract opportunities that can deliver measurable value within 30 days of
      deployment with minimal configuration or change management.
      Criteria for quick win:
      - Requires no custom development or complex integration
      - Can be measured with existing data sources
      - Delivers visible improvement to a stakeholder in the room
      - Low risk of disruption to existing workflows
      For each quick win:
      - What to do (specific action, not "implement X")
      - Expected value (dollar amount or metric improvement)
      - Prerequisites (what must be true before this action can start)
      - How to measure it (data source, frequency, owner)
      - Who sees the benefit first (stakeholder name/role)
      Quick wins build momentum. They are the evidence that the larger transformation
      is worth pursuing.
      Deliverable: Quick wins table (Action | Value | Prerequisites | Measurement |
      Beneficiary | Day to Measure).

      STEP 4: PHASED OPPORTUNITY ROADMAP
      Organize remaining opportunities into phases:

      Phase 1 (30-90 days): Core value delivery
      - Opportunities requiring standard deployment and configuration
      - Value expected: 40-60% of total captured value
      - Gate to Phase 2: specific metrics achieved, stakeholder sign-off

      Phase 2 (90-180 days): Extended value
      - Opportunities requiring integration, workflow redesign, or training
      - Value expected: 25-35% of total captured value
      - Gate to Phase 3: adoption metrics, process change completion

      Phase 3 (180-365 days): Optimization
      - Advanced capabilities, process refinement, cross-team expansion
      - Value expected: remaining 10-25% of total captured value
      - Review point: annual value realization assessment

      For each phase, list the specific opportunities, cumulative value delivered,
      and dependencies on prior phases.
      Deliverable: Phased roadmap table (Phase | Timeline | Opportunities | Phase Value |
      Cumulative Value | Dependencies | Gate Criteria).

      STEP 5: PRIORITIZATION MATRIX
      Plot all opportunities on a 2x2 matrix:
      - X-axis: Implementation complexity (Low to High)
      - Y-axis: Business value (Low to High)
      Quadrant classification:
      - High Value + Low Complexity: DO FIRST (quick wins and Phase 1)
      - High Value + High Complexity: PLAN CAREFULLY (Phase 2-3, need project plan)
      - Low Value + Low Complexity: OPPORTUNISTIC (include if effort is minimal)
      - Low Value + High Complexity: DEFER (not worth pursuing now)
      For each opportunity, provide a 1-line rationale for its quadrant placement.
      Deliverable: Prioritization matrix with quadrant assignments and rationale.

      STEP 6: DOWNSTREAM HANDOFF PACKAGE
      Prepare the data package that feeds into downstream agents:

      For VE Hypothesis Agent:
      - Value hypotheses derived from workshop (hypothesis statement, baseline,
        target, confidence, validation method)

      For VE Calculation Agent:
      - Baseline metrics, cost structure, improvement targets, and assumptions
        needed for ROI/TCO modeling

      For VE Proof Agent (if POC follows):
      - Success criteria mapped to workshop value drivers
      - Baseline metrics for POC comparison

      For AE Agent:
      - Executive summary for deal positioning
      - Quick wins for early momentum narrative
      - Stakeholder-specific value highlights

      Deliverable: Handoff data structured by receiving agent with required fields populated.

      STEP 7: DATA GAPS AND FOLLOW-UP
      List all data gaps identified during the workshop and synthesis.
      For each gap:
      - What data is missing
      - Why it matters (which calculation or hypothesis depends on it)
      - Who can provide it (customer role)
      - Deadline (when it is needed relative to business case delivery)
      - Fallback approach (benchmark or estimate to use if data is not provided)
      Deliverable: Data gaps table (Gap | Impact | Owner | Deadline | Fallback).

      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Executive summary states dollar amounts, not qualitative statements
      - Value opportunity totals match the sum of individual opportunities
      - Quick wins are achievable in 30 days with evidence, not aspirational
      - Phase value percentages sum to approximately 100% of captured value
      - Every opportunity in the prioritization matrix appears in the phased roadmap
      - Handoff package contains data in the format downstream agents expect
      - Data gaps include fallback approaches, not just "TBD"
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all 7 deliverables as labeled sections. Include a synthesis
      header: total value opportunity, confidence-weighted value, number of quick wins,
      number of phases, and number of data gaps requiring follow-up.

# ============================================================================
# VALUE PROOF PROMPTS
# ============================================================================
# Full runbook prompts: POC/POV tracking with hypothesis-to-metric tracing,
# benchmark contextualization, and evidence packaging for deal progression.
# ============================================================================
value_proof:

  pov_value_tracking:
    name: "POV Value Tracking"
    description: "Track POV metrics against value hypotheses with baseline comparison, success criteria assessment, early win documentation, gap identification, and forecast to achieve"
    prompt: |
      Context: POV underway for {account_name}.
      Success criteria: {success_criteria}
      POV duration: {duration}
      Current status: {status}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are tracking whether the POV proves the value hypotheses. The POV
      exists to convert "we believe" into "we measured." Every metric must
      trace back to a hypothesis, and every result must be compared to the
      baseline established during discovery. Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Success Criteria Baselines, Current Metric Data, POV
      Telemetry, Customer Validation Evidence, Trend Data.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: SUCCESS CRITERIA MAPPING
      Map each POV success criterion to its underlying value hypothesis:
      - Success criterion (as agreed with the customer)
      - Hypothesis ID (from value hypothesis document)
      - Baseline metric (from discovery)
      - Target metric (from success criteria)
      - Measurement method (how this is being tracked during POV)
      - Data source (system, report, manual collection)
      - Measurement owner (who provides the data)
      - Measurement frequency (daily, weekly, at POV end)
      Flag any success criteria that lack a baseline. Without a baseline,
      "improvement" is unmeasurable.
      Deliverable: Criteria mapping table (Criterion | Hypothesis | Baseline |
      Target | Method | Source | Owner | Frequency).

      STEP 2: CURRENT METRIC STATUS
      For each tracked metric, capture current performance and separate observable
      facts from interpretive assessments:

      Observable layer (facts):
      - Metric name
      - Baseline value (from discovery)
      - Current value (latest measurement)
      - Target value (from success criteria)
      - Progress percentage: (current - baseline) / (target - baseline) × 100
      - Trend (improving, flat, declining) with data points over time
      - Evidence: specific data supporting the current value

      Interpretive layer (with confidence):
      - Status classification:
        GREEN: on track to meet target by POV end
        YELLOW: behind pace but achievable with adjustments
        RED: unlikely to meet target without significant change
      - Confidence in status assessment: HIGH/MEDIUM/LOW
      - Mark any metric relying on LOW-richness data as "estimated"

      Commercial impact for RED/YELLOW metrics:
      - Renewal: threatens renewal if unresolved
      - Expansion: blocks upsell/cross-sell opportunities
      - Neither: operational impact only

      Deliverable: POV tracker table (Metric | Baseline | Current | Target |
      Progress % | Trend | Status | Status Confidence | Commercial Impact | Evidence).

      STEP 3: EARLY WINS DOCUMENTATION
      Identify value that has already been demonstrated during the POV:
      - Win description (specific, measurable outcome)
      - Date achieved
      - Metric improvement (from X to Y)
      - Dollar value (if quantifiable)
      - Stakeholder who witnessed or validated the win
      - Quote or acknowledgment from the customer (if captured)
      - Relevance to purchase decision (which buying concern this addresses)
      Early wins are deal accelerators. Package them for the AE to use in
      stakeholder conversations.
      Deliverable: Early wins table (Win | Date | Metric Change | Value |
      Validator | Quote | Buying Concern Addressed).

      STEP 4: GAP ANALYSIS
      Identify metrics that are behind target:
      - Metric name and current status (YELLOW or RED)
      - Gap: target minus current value
      - Root cause analysis: why is this metric behind?
        Primary category: deployment incomplete, adoption low, data quality issue,
        integration gap, scope mismatch, baseline was inaccurate
        Secondary category(ies): if applicable, list additional contributing root causes
      - Impact on deal: if this metric does not improve, what happens to the
        business case? (critical, reduces ROI, cosmetic)
      - Remediation action: specific steps to close the gap
      - Prerequisites/Dependencies: what must be in place before remediation can proceed
      - Owner and timeline for remediation
      Deliverable: Gap analysis table (Metric | Gap | Root Cause | Deal Impact |
      Remediation | Prerequisites/Dependencies | Owner | Timeline).

      STEP 5: FORECAST TO ACHIEVE
      Project whether each success criterion will be met by POV end:
      - Criterion
      - Current trajectory (linear projection from trend data)
      - Projected end-of-POV value
      - Probability of achieving target: HIGH (>80%), MEDIUM (50-80%), LOW (<50%)
      - What must happen for the target to be met (specific actions, remaining days)
      - Recommendation: continue as-is, adjust approach, extend POV, redefine criterion
      Deliverable: Forecast table (Criterion | Trajectory | Projected Value |
      Probability | Required Actions | Recommendation).

      STEP 6: STAKEHOLDER COMMUNICATION PACKAGE
      Prepare a concise update for deal stakeholders:
      - For the AE: deal-relevant wins, risk flags, recommended next conversation
      - For the customer champion: progress summary to share internally
      - For the economic buyer: value demonstrated to date in their language
      Deliverable: Stakeholder updates (1 paragraph each for AE, champion, and buyer).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Every metric traces to a value hypothesis and success criterion
      - Progress percentages are calculated correctly
      - RED/YELLOW/GREEN status is evidence-based, not intuition
      - LOW-richness metric scores are marked "estimated"
      - Interpretive assessments (status classifications) include confidence levels
      - RED/YELLOW metrics classified with three-value commercial impact (Renewal/Expansion/Neither)
      - Early wins have specific dates and validator names
      - Gap remediation actions include prerequisites/dependencies
      - Gap root causes identify the actual problem, not symptoms
      - Forecast uses trend data, not hope
      - Stakeholder updates use appropriate language per audience
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: If Signal Acquisition Mode was triggered, produce the signal acquisition
      plan only. Otherwise, produce all 6 deliverables plus the Data Availability Map
      as labeled sections. Lead with POV health summary that states: (1) data richness
      profile, criteria on track (GREEN), at risk (YELLOW), off track (RED), and total
      value demonstrated to date, (2) the weakest point or lowest confidence area across
      all tracked metrics, and (3) the single most urgent action to take next.

  benchmark_comparison:
    name: "Benchmark Comparison Analysis"
    description: "Compare customer metrics to industry benchmarks, identify gaps, map achievable improvements, and package proof points from references and analyst data"
    prompt: |
      Context: Benchmark analysis for {account_name}.
      Customer metrics: {customer_metrics}
      Industry: {industry}
      Use case: {use_case}
      Account state: {account_state}
      Signal history for the last 30 days: {signal_history_30d}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are contextualizing the customer's performance against their peers.
      Benchmarks answer the question: "Am I behind, ahead, or average?" They
      create urgency when the customer is behind and credibility when improvements
      are achievable. Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Customer Metric Actuals, Industry Benchmark Sources,
      Peer Comparison Data, Proof Points/References, Competitive Intelligence.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: BENCHMARK DATA COLLECTION
      For each customer metric, find the relevant industry benchmarks:
      - Metric name
      - Customer value (from provided data)
      - Industry average (from references/industry-benchmarks.yaml or analyst data)
      - Top quartile (best-in-class performers)
      - Bottom quartile (worst performers)
      - Benchmark source (analyst firm, industry report, vendor study, customer data aggregate)
      - Benchmark date (how recent is the data)
      - Applicability: does this benchmark match the customer's industry, size, and geography?
      If a benchmark is not available for the specific industry, note the closest
      available benchmark and the limitation.
      Deliverable: Benchmark data table (Metric | Customer | Industry Avg | Top Quartile |
      Bottom Quartile | Source | Date | Applicability).

      STEP 3: GAP ANALYSIS
      For each metric, calculate the gap:
      - Gap to industry average (customer value vs average)
      - Gap to top quartile (customer value vs best-in-class)
      - Position classification (primary):
        LEADING: customer exceeds top quartile
        ABOVE AVERAGE: between average and top quartile
        AVERAGE: within 10% of industry average
        BELOW AVERAGE: between average and bottom quartile
        LAGGING: below bottom quartile
      - Position qualifier (secondary): if the metric is near a boundary, note the
        adjacent classification and direction of movement (e.g., "BELOW AVERAGE,
        trending toward AVERAGE")
      - Trend: is the gap widening or closing (if historical data available)
      Rank metrics by gap magnitude and strategic importance.
      Deliverable: Gap analysis table (Metric | Customer | Avg | Gap to Avg |
      Top Quartile | Gap to Top | Position | Trend).

      STEP 4: ACHIEVABLE IMPROVEMENT MAPPING
      For each metric where the customer is BELOW AVERAGE or LAGGING, separate
      observable facts from interpretive assessments:

      Observable layer (facts):
      - Current metric value and source
      - Benchmark gap (absolute and percentage)
      - Proof points: specific customer references or case studies showing this improvement

      Interpretive layer (with confidence):
      - Achievable improvement with {vendor} (based on deployment data and case studies)
        Confidence: HIGH/MEDIUM/LOW
      - Target value (conservative: industry average; stretch: top quartile)
      - Improvement potential attribution: how much is vendor capability vs process change
        Confidence: HIGH/MEDIUM/LOW
      - Mark any improvement estimate relying on LOW-richness data as "estimated"

      - Timeline to achieve (based on typical deployment patterns)
      - Prerequisites/Dependencies (what must be deployed, configured, or adopted)

      Commercial impact classification for each gap:
      - Renewal: gap threatens renewal if unaddressed
      - Expansion: gap blocks upsell/cross-sell opportunities
      - Neither: operational impact only

      Do not claim improvements beyond what has been demonstrated in comparable deployments.
      Deliverable: Improvement mapping table (Metric | Current | Target | Improvement % |
      Confidence | Timeline | Prerequisites/Dependencies | Commercial Impact | Proof Points).

      STEP 5: PROOF POINT PACKAGE
      Compile supporting evidence:
      - Customer references (anonymized if needed): company profile, metric improved,
        magnitude, timeline, deployment context
      - Analyst validation: Forrester TEI, Gartner peer insights, IDC studies
      - Industry certifications and compliance achievements
      - POC/POV results from this customer (if available)
      For each proof point: relevance to this customer's situation (industry match,
      size match, use case match).
      Deliverable: Proof points table (Reference | Type | Metric | Result | Relevance).

      STEP 6: COMPETITIVE CONTEXTUALIZATION
      If competitive context is available:
      - How does {vendor} benchmark performance compare to competitor claims?
      - Where are competitor claims unsubstantiated by independent data?
      - Which benchmarks are {vendor}-unique (no competitor equivalent)?
      Frame competitively without disparaging. Let the data speak.
      Deliverable: Competitive benchmark table (Metric | {vendor} | Competitor | Source | Advantage).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Benchmark sources are cited with dates (no uncited claims)
      - Gap calculations are arithmetic-correct
      - Achievable improvements cite proof points, not marketing claims
      - LOW-richness dimension scores are marked "estimated"
      - Interpretive assessments (improvement potential, value attribution) include confidence levels
      - Gap items classified with three-value commercial impact (Renewal/Expansion/Neither)
      - Position classifications use defined thresholds consistently
      - Improvement mapping includes prerequisites/dependencies
      - Proof points match the customer's industry and size where possible
      - No improvement claim exceeds what has been demonstrated in comparable deployments
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: If Signal Acquisition Mode was triggered, produce the signal acquisition
      plan only. Otherwise, produce all 5 deliverables plus the Data Availability Map
      as labeled sections. Lead with benchmark position summary that states: (1) data
      richness profile, number of metrics LEADING/ABOVE/AVERAGE/BELOW/LAGGING and
      total addressable improvement, (2) the weakest point or lowest confidence area
      across all benchmarked metrics, and (3) the single most urgent action to take next.

  quick_win_documentation:
    name: "Quick Win Documentation"
    description: "Document early value wins with quantification, customer validation, stakeholder communication plan, and business case integration"
    prompt: |
      Context: {account_name} POV/early deployment showing results.
      Quick wins observed: {quick_wins}
      Timeline: {timeline}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are packaging early value evidence into deal ammunition. Quick wins
      build momentum, validate hypotheses, and give the champion evidence to
      sell internally. Every win must be specific, quantified, and validated.
      Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Win Observations, Baseline Metrics, Measurement Data,
      Customer Validation, Hypothesis Traceability.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: WIN IDENTIFICATION AND CLASSIFICATION
      For each observed quick win:
      - Win ID (QW-001, QW-002, etc.)
      - Description (specific outcome, not generic improvement)
      - Date achieved
      - Primary category: time savings, cost reduction, risk reduction, capability unlock,
        process improvement
      - Secondary category(ies): if applicable, list additional categories that also apply
      - Value hypothesis it validates (Hypothesis ID from business case)
      - Stakeholder who experienced or observed the win
      - How it was detected (automated metric, user report, incident comparison)
      Deliverable: Win classification table (ID | Description | Date | Category |
      Hypothesis | Stakeholder | Detection Method).

      STEP 2: QUANTIFICATION
      For each win, quantify the value and separate observable facts from
      interpretive assessments:

      Observable layer (facts):
      - Before metric (baseline)
      - After metric (current)
      - Improvement (absolute and percentage)
      - Monetized value: improvement × volume × rate (show the formula)

      Interpretive layer (with confidence):
      - Annualized projection: if this win sustains, what is the annual value?
        Confidence: HIGH/MEDIUM/LOW
      - Value attribution: how much improvement is from the solution vs other changes
        Confidence: HIGH/MEDIUM/LOW
      - Mark any quantification relying on LOW-richness data as "estimated"

      Confidence classification: HIGH (measured with system data), MEDIUM (observed
      and estimated), LOW (reported anecdotally).

      Commercial impact classification for each win:
      - Renewal: strengthens renewal case
      - Expansion: supports upsell/cross-sell narrative
      - Neither: operational improvement only

      For wins that cannot be monetized, capture the operational impact
      (e.g., "reduced alert investigation from 45 minutes to 8 minutes").
      Deliverable: Quantification table (Win ID | Before | After | Improvement |
      Formula | Annualized Value | Confidence | Commercial Impact).

      STEP 3: CUSTOMER VALIDATION
      For each win, document customer validation:
      - Who validated (name, role)
      - Validation method (reviewed data together, customer confirmed in meeting,
        customer provided their own measurement)
      - Customer statement (direct quote if captured, paraphrased if not)
      - Permission to use (internal reference, external reference, quote approved,
        not yet requested)
      - Follow-up needed (additional data, formal sign-off, executive validation)
      Deliverable: Validation table (Win ID | Validator | Method | Statement |
      Permission | Follow-up).

      STEP 4: STAKEHOLDER COMMUNICATION PLAN
      Package each win for different audiences:

      For the champion:
      - 1-2 sentence summary they can forward to their leadership
      - Key metric in executive language
      - "So what" statement (why this matters for their business)

      For the economic buyer:
      - Dollar value or efficiency gain
      - Connection to business case hypothesis
      - What this implies for full deployment value

      For the evaluation committee:
      - Technical detail on what produced the win
      - Comparison to success criteria
      - Implications for remaining evaluation

      Deliverable: Communication package per audience (1-2 sentences each per win).

      STEP 5: BUSINESS CASE INTEGRATION
      Connect wins back to the business case:
      - Which hypotheses are now partially or fully validated
      - How the annualized value of quick wins relates to total projected value
      - Updated confidence levels (wins move hypotheses from MEDIUM to HIGH)
      - Remaining hypotheses that still need validation
      - Prerequisites/Dependencies for remaining validation (data access, deployment
        milestones, stakeholder availability)
      Deliverable: Hypothesis validation update (Hypothesis | Original Confidence |
      Quick Win Evidence | Updated Confidence | Remaining Validation Needed |
      Prerequisites/Dependencies).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Every win has a specific date and validator
      - Quantification shows the calculation formula, not just results
      - LOW-richness dimension scores are marked "estimated"
      - Interpretive assessments (annualized projections, value attribution) include confidence levels
      - Wins classified with three-value commercial impact (Renewal/Expansion/Neither)
      - Annualized projections are conservative (not extrapolating from 1 week of data)
      - Customer quotes are attributed (or marked as needing permission)
      - Communication messages use audience-appropriate language
      - Business case integration updates confidence levels with evidence
      - Remaining validation items include prerequisites/dependencies

      Format: If Signal Acquisition Mode was triggered, produce the signal acquisition
      plan only. Otherwise, produce all 5 deliverables plus the Data Availability Map
      as labeled sections. Lead with quick win summary: data richness profile, number
      of wins documented, total annualized value, hypotheses validated, and wins with
      customer-approved quotes.

# ============================================================================
# VALUE REALIZATION PROMPTS (Post-Sales)
# ============================================================================
# Full runbook prompts: post-deployment value tracking with hypothesis-to-actual
# tracing, evidence logging, QBR content, and success story development.
# ============================================================================
value_realization:

  value_tracker_update:
    name: "Value Tracker Update"
    description: "Monthly value realization update with hypothesis-to-actual comparison, evidence log, variance analysis, acceleration actions, and updated forecast"
    prompt: |
      Context: Monthly value update for {account_name}.
      Current value tracker: {tracker_link}
      Period: {review_period}
      Account state: {account_state}
      Signal history for the last 30 days: {signal_history_30d}

      You are updating the value realization tracker that bridges pre-sales promises
      to post-deployment reality. This tracker is the evidence base for renewals,
      QBRs, and expansion conversations. Every entry must be evidence-backed.
      Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: HYPOTHESIS STATUS REVIEW
      For each value hypothesis from the original business case:
      - Hypothesis ID and statement
      - Target metric and value (from business case)
      - Current measured value (from deployment data)
      - Variance: actual vs target (absolute and percentage)
      - Status classification:
        EXCEEDED: actual exceeds target by >10%
        ON TRACK: actual within 10% of target
        BEHIND: actual below target by 10-30%
        AT RISK: actual below target by >30%
        NOT YET MEASURABLE: deployment not mature enough or data not available
      - Trend since last update (improving, stable, declining)
      - Root cause for variance (if BEHIND or AT RISK)
      Deliverable: Hypothesis tracker table (ID | Statement | Target | Actual |
      Variance | Status | Trend | Root Cause).

      STEP 3: EVIDENCE LOG
      For each realized value, document the evidence:
      - Value description (what was achieved)
      - Evidence type: SYSTEM DATA (automated metric), CUSTOMER REPORT (customer
        provided), CALCULATED (derived from multiple data points), ANECDOTAL
        (stated but not measured)
      - Data source (system name, report, dashboard)
      - Date captured
      - Validated by (customer name and role who confirmed)
      - Dollar value (if quantifiable)
      Prioritize SYSTEM DATA and CUSTOMER REPORT over CALCULATED and ANECDOTAL.
      Deliverable: Evidence log table (Value | Evidence Type | Source | Date |
      Validator | Dollar Value).

      STEP 4: PERIOD HIGHLIGHTS
      Select the top 3-5 value highlights from this period:
      - Highlight description (specific achievement)
      - Metric improvement (before → after, this period)
      - Business impact (what this means for the customer's operations)
      - Stakeholder relevance (who should hear about this)
      - Quotable moment (did anyone say something that captures the value?)
      These highlights feed QBR preparation and renewal conversations.
      Deliverable: Highlights list (3-5 items with metric, impact, and stakeholder).

      STEP 5: ACCELERATION ACTIONS
      For hypotheses that are BEHIND or AT RISK:
      - Action: specific step to close the gap
      - Owner: who is responsible (customer or vendor side)
      - Timeline: when the action should be completed
      - Expected impact: how much this action will improve the metric
      - Dependency: what must be true for this action to work
      For hypotheses that are ON TRACK or EXCEEDED:
      - Amplification action: how to increase or publicize this value
      Deliverable: Actions table (Hypothesis | Action | Owner | Timeline |
      Expected Impact | Dependency).

      STEP 6: UPDATED FORECAST
      Project value realization for the next period and for the full year:
      - Hypothesis | Current Run Rate | Projected Year-End | Original Target | Forecast Status
      - Total projected value (sum of all hypotheses at current run rates)
      - Confidence-adjusted total (apply confidence based on current trajectory)
      - Value realization rate: projected total / original business case total × 100
      Flag if realization rate is below 70% (triggers escalation per guardrails).
      Deliverable: Forecast table with realization rate and escalation flag.

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Every hypothesis has a current measured value or is marked NOT YET MEASURABLE
      - Evidence log entries have specific dates, sources, and validators
      - BEHIND/AT RISK hypotheses have root cause analysis, not just the gap
      - Acceleration actions have owners and timelines, not just "improve X"
      - Forecast uses current run rates, not the original projections
      - Realization rate is calculated and compared to escalation threshold

      Format: Produce all 5 deliverables as labeled sections. Lead with realization
      summary: hypotheses on track, behind, at risk, total realized value this period,
      cumulative realized value, and realization rate.

  qbr_value_content:
    name: "QBR Value Content Preparation"
    description: "Prepare quarterly business review value content with executive summary, metric improvements, ROI to date, success highlights, forward value roadmap, and discussion topics"
    playbooks:
      - "PB_CA_001"  # Customer-facing QBR value evidence
      - "PB_AE_003"  # Internal sales QBR value-based pipeline analysis
    prompt: |
      Context: QBR preparation for {account_name}.
      Period: {quarter}
      Value tracker: {tracker}
      Stakeholders: {stakeholders}
      Account state: {account_state}
      Signal history for the last 30 days: {signal_history_30d}

      You are preparing value content for a quarterly business review. The QBR
      is the primary venue where value moves from a tracking spreadsheet into an
      executive conversation. The content must work for three audiences: the
      customer executive, the customer champion, and the internal account team.
      Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: EXECUTIVE VALUE SUMMARY
      Write a 3-sentence executive summary for the quarter:
      Sentence 1: Total value delivered this quarter (dollar amount and key metric)
      Sentence 2: Cumulative value since deployment (dollar amount and ROI to date)
      Sentence 3: Value planned for next quarter (what is coming and expected impact)
      This summary opens the QBR slide deck. It must stand alone.
      Deliverable: Executive summary (3 sentences).

      STEP 3: QUARTERLY VALUE DELIVERED
      Detail the value delivered this quarter:
      - Primary value category (hard savings, soft savings, risk avoidance, revenue enablement)
      - Secondary category(ies): if applicable, list additional categories that also apply
        (dollar value is attributed to the primary category to avoid double counting)
      - Specific achievements per category
      - Dollar value per achievement
      - Comparison to previous quarter (trend)
      - Year-to-date cumulative value
      Present as a structured table with quarterly and YTD columns.
      Deliverable: Quarterly value table (Category | Achievement | Q Value | Previous Q |
      Trend | YTD Value) with totals.

      STEP 4: METRIC IMPROVEMENT DASHBOARD
      For each tracked metric, create a dashboard-ready summary:
      - Metric name
      - Baseline (at deployment start)
      - Previous quarter value
      - Current quarter value
      - Quarter-over-quarter improvement
      - Target value (from business case)
      - Progress to target (percentage)
      - Visual indicator: UP (improving), FLAT (stable), DOWN (declining)
      Select 5-7 metrics that tell the strongest value story for the QBR audience.
      Deliverable: Dashboard table (Metric | Baseline | Prev Q | Current Q | QoQ Change |
      Target | Progress % | Direction).

      STEP 5: ROI TO DATE
      Calculate the actual ROI achieved since deployment:
      - Total investment to date (actual spend, not projected)
      - Total benefit to date (realized value, evidence-backed)
      - ROI to date: (benefit - investment) / investment × 100
      - Payback status: has the investment been recovered? If yes, when did payback occur?
        If no, projected payback date based on current run rate
      - Comparison to original business case ROI projection
      Deliverable: ROI summary (Investment | Benefit | ROI % | Payback Status |
      vs Original Projection).

      STEP 6: SUCCESS HIGHLIGHTS
      Select 3-5 stories that make the value tangible:
      - Headline (specific achievement in plain language)
      - Metric (before → after)
      - Business impact (what changed operationally)
      - Quote or anecdote from the customer team (if available)
      - Visual recommendation (chart type, data to include)
      These become the "hero slides" in the QBR deck.
      Deliverable: Success highlight cards (3-5 items with headline, metric, impact, quote).

      STEP 7: FORWARD VALUE ROADMAP
      Present the value plan for the next quarter:
      - Planned activities (new capabilities, expanded deployment, process improvements)
      - Expected value from each activity (with timeline)
      - Dependencies (what must happen for this value to materialize)
      - Investment needed (if any additional spend is required)
      - Cumulative value projection through next quarter
      This section sets the agenda for the next 90 days and builds expectation
      for continued value growth.
      Deliverable: Forward roadmap table (Activity | Expected Value | Timeline |
      Dependencies | Investment Needed).

      STEP 8: DISCUSSION TOPICS
      Prepare 3-5 discussion topics for the QBR meeting:
      - Topic (specific question or decision point)
      - Why now (why this topic matters this quarter)
      - Desired outcome (what decision or alignment is needed)
      - Supporting data (what evidence informs the discussion)
      Include at least one expansion or growth topic if the customer is
      realizing value above target.
      Deliverable: Discussion topics list (Topic | Why Now | Desired Outcome | Data).

      STEP 9: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Executive summary contains specific dollar amounts, not directional statements
      - Quarterly value is evidence-backed, not projected
      - Dashboard metrics include baselines for context
      - ROI calculation uses actual investment and realized benefit, not projections
      - Success highlights include measurable outcomes, not activity descriptions
      - Forward roadmap is realistic (connected to actual deployment plans)
      - Discussion topics include an expansion or growth topic if value is on track

      Format: Produce all 7 deliverables as labeled sections. Content should be
      ready to populate a QBR slide deck.

  success_story_development:
    name: "Success Story Development"
    description: "Develop a customer success story with challenge-solution-results structure, headline metrics, customer quotes, and usage rights classification"
    prompt: |
      Context: {account_name} has achieved significant value.
      Value realized: {value_summary}
      Key metrics: {metrics}
      Account state: {account_state}
      Signal history for the last 30 days: {signal_history_30d}

      You are creating a success story that can be used for references, case studies,
      and marketing. The story must be compelling to prospects while being accurate
      and approved by the customer. Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: STORY FRAMEWORK
      Define the narrative structure:
      - Headline: a specific, measurable achievement in one line
        Good: "Financial services firm reduces MTTD from 4 hours to 23 minutes"
        Bad: "Company improves security operations"
      - Industry and company profile (size, vertical, geography, without naming
        the customer if permission is pending)
      - Story arc: challenge → turning point → solution → results → what is next
      Deliverable: Story framework (headline, profile, arc outline).

      STEP 3: CHALLENGE SECTION
      Write 2-3 paragraphs describing the customer's situation before:
      - Business context (what they were trying to achieve)
      - Specific pain points (quantified with baseline metrics)
      - Impact on the business (what the pain was costing them)
      - What they had tried before (previous solutions, why they fell short)
      - Trigger event (what made them decide to act now)
      Use the customer's language, not vendor language. The reader should
      recognize their own situation in this description.
      Deliverable: Challenge section (2-3 paragraphs).

      STEP 4: SOLUTION SECTION
      Write 2-3 paragraphs describing what changed:
      - What was deployed (capabilities, not product names where possible)
      - Implementation approach (timeline, phases, key decisions)
      - How it integrated with existing environment
      - Adoption story (how the team adapted, any change management)
      Focus on the transformation, not the product features. The reader should
      understand the journey, not read a feature list.
      Deliverable: Solution section (2-3 paragraphs).

      STEP 5: RESULTS SECTION
      Present quantified outcomes:
      - 3-5 headline metrics (the numbers that go in bold in the case study)
        Format each as: "X% improvement in [metric], from [before] to [after]"
      - Business impact per metric (what this means operationally)
      - Timeline to achieve each result (how quickly value appeared)
      - Unexpected benefits (value the customer did not anticipate)
      - ROI or payback if available
      Separate results into: proven (measured with data) and projected (based on
      current trajectory).
      Deliverable: Results section with headline metrics callout box and detail paragraphs.

      STEP 6: CUSTOMER VOICE
      Capture the customer's perspective:
      - Primary quote: 2-3 sentences from a senior stakeholder summarizing the impact
      - Supporting quote: 1-2 sentences from a practitioner describing the day-to-day change
      - Attribution: name, title, company (or "anonymized" if not yet approved)
      If direct quotes are not available, draft suggested quotes based on
      statements made during meetings and flag as [NEEDS CUSTOMER APPROVAL].
      Deliverable: Quotes section with attribution and approval status.

      STEP 7: USAGE RIGHTS AND DISTRIBUTION
      Classify the story's usage rights:
      - Internal only: can be shared with AEs and internal teams
      - External reference: can be shared verbally in prospect calls
      - Published case study: approved for website, collateral, events
      - Logo use: company logo can appear in materials
      - Analyst submission: approved for inclusion in Forrester, Gartner studies
      - Status: APPROVED, PENDING APPROVAL, NOT YET REQUESTED
      Note the customer contact for approval and any restrictions.
      Deliverable: Usage rights classification and approval status.

      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Headline contains a specific metric, not generic improvement language
      - Challenge section quantifies the pain with baseline numbers
      - Solution section describes the transformation, not product features
      - Results metrics have before/after values and timelines
      - Quotes are attributed or flagged as needing approval
      - Usage rights are classified and actionable

      Format: Produce all 6 deliverables as labeled sections. The document should
      be ready for a marketing team to produce a published case study.

  realized_value_assessment:
    name: "Comprehensive Realized Value Assessment"
    description: "Full assessment comparing original business case to actual realized value, with ROI achieved, unrealized value root causes, acceleration actions, and updated forecast for renewal"
    prompt: |
      Context: Value assessment for {account_name}.
      Deployment duration: {duration}
      Original business case: {original_case}
      Account state: {account_state}
      Signal history for the last 30 days: {signal_history_30d}

      You are conducting a comprehensive assessment of value delivered vs value
      promised. This assessment is typically triggered at renewal minus 90 days
      or at annual review. It determines whether the renewal story is "we delivered
      what we promised" or "here is what needs to change." Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Original Business Case Data, Deployment Metrics, Realized
      Value Evidence, Variance Root Cause Data, Forward Forecast Inputs.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: BUSINESS CASE RECONSTRUCTION
      Reconstruct the original business case commitments:
      - Hypothesis ID and statement (from original business case)
      - Original baseline (at time of sale)
      - Original target (what was promised)
      - Original annual value (dollar amount projected)
      - Original confidence level
      - Original timeline to achieve
      Present the complete original commitment for side-by-side comparison.
      Deliverable: Original business case table (ID | Statement | Baseline | Target |
      Annual Value | Confidence | Timeline).

      STEP 3: REALIZED VALUE MEASUREMENT
      For each hypothesis, measure what was actually achieved and separate observable
      facts from interpretive assessments:

      Observable layer (facts):
      - Current measured value (from deployment data)
      - Realized annual value (dollar amount based on actuals)
      - Evidence type (system data, customer report, calculated)
      - Time to achieve (how long it took vs original projection)

      Interpretive layer (with confidence):
      - Achievement level:
        EXCEEDED: actual > 110% of target
        ACHIEVED: actual within 90-110% of target
        PARTIAL: actual at 50-89% of target
        MISSED: actual below 50% of target
        NOT MEASURED: data not available to assess
      - Confidence in achievement assessment: HIGH/MEDIUM/LOW
      - Value attribution: how much of the realized value is attributable to the
        solution vs organic improvement or other changes (confidence: HIGH/MEDIUM/LOW)
      - Mark any measurement relying on LOW-richness data as "estimated"

      Commercial impact classification for PARTIAL/MISSED hypotheses:
      - Renewal: threatens renewal if value gap persists
      - Expansion: blocks upsell/cross-sell opportunities
      - Neither: operational impact only

      Deliverable: Realized value table (ID | Target | Actual | Achievement |
      Achievement Confidence | Realized Value | Commercial Impact | Evidence |
      Time to Achieve).

      STEP 4: VARIANCE ANALYSIS
      For each hypothesis, analyze the variance:
      - Variance: actual vs target (absolute and percentage)
      - Direction: over-delivered or under-delivered
      - Root cause:
        For over-delivery: adoption exceeded expectations, use case expanded,
        efficiency greater than modeled
        For under-delivery: adoption lower than projected, scope reduced,
        integration incomplete, data quality issues, organizational change
        resistance, baseline was inaccurate
      - Controllability: was this variance within the vendor's control,
        the customer's control, or external factors?
      - Corrective action taken (if any) and result
      Deliverable: Variance analysis table (ID | Target | Actual | Variance |
      Direction | Root Cause | Controllability | Corrective Action).

      STEP 5: TOTAL VALUE SCORECARD
      Calculate aggregate realized value metrics:
      - Total original business case value (sum of all hypothesis annual values)
      - Total realized value (sum of all realized annual values)
      - Value realization rate: realized / original × 100
      - ROI achieved: (realized value - total investment) / total investment × 100
      - Payback achieved: month when cumulative realized value exceeded investment
      - Value by type (hard savings, soft savings, risk avoidance, revenue enablement)
      - Hypotheses exceeded / achieved / partial / missed / not measured (counts)
      Present as a scorecard with red/yellow/green indicators.
      Deliverable: Value scorecard with aggregate metrics and visual indicators.

      STEP 6: UNREALIZED VALUE RECOVERY PLAN
      For hypotheses at PARTIAL or MISSED:
      - Remaining value opportunity (target - actual)
      - Recovery feasibility: RECOVERABLE (with specific actions), PARTIALLY
        RECOVERABLE (with caveats), NOT RECOVERABLE (explain why)
      - Required actions to recover (specific steps)
      - Prerequisites/Dependencies: what must be in place before recovery actions can proceed
      - Owner (customer, vendor, or joint)
      - Timeline to recover
      - Investment needed (additional spend, services, effort)
      For hypotheses NOT MEASURED:
      - Data required to measure
      - Who can provide it
      - Timeline to establish measurement
      - Prerequisites/Dependencies for establishing measurement
      Deliverable: Recovery plan table (ID | Remaining Value | Feasibility |
      Actions | Prerequisites/Dependencies | Owner | Timeline | Investment).

      STEP 7: UPDATED FORWARD FORECAST
      Project value for the next 12 months based on current actuals:
      - Run rate value (current realized value annualized)
      - Recovery value (from Step 5, if actions are taken)
      - New value opportunities (capabilities not in original business case)
      - Total projected value for next period
      - Updated ROI projection
      This forecast feeds the renewal value justification.
      Deliverable: Forward forecast table (Source | Annual Value | Confidence) with
      total and updated ROI.

      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Original business case values match the actual signed business case
      - Realized values are evidence-backed, not self-reported
      - LOW-richness dimension scores are marked "estimated"
      - Interpretive assessments (achievement levels, value attribution) include confidence levels
      - PARTIAL/MISSED hypotheses classified with three-value commercial impact (Renewal/Expansion/Neither)
      - Variance root causes are honest (do not blame customer for vendor issues)
      - Value realization rate is calculated correctly
      - Recovery plan includes prerequisites/dependencies for each action
      - Recovery plan is realistic (actions have owners and timelines)
      - Forward forecast uses current run rates plus recovery, not original projections
      - Scorecard indicators use consistent thresholds

      Format: If Signal Acquisition Mode was triggered, produce the signal acquisition
      plan only. Otherwise, produce all 6 deliverables plus the Data Availability Map
      as labeled sections. Lead with value scorecard summary: data richness profile,
      realization rate, ROI achieved, hypotheses achieved vs missed, and total
      realized value.

# ============================================================================
# VALUE AMPLIFICATION PROMPTS
# ============================================================================
# Full runbook prompts: renewal justification, expansion cases, case studies,
# and competitive value differentiation with evidence-based positioning.
# ============================================================================
value_amplification:

  renewal_value_justification:
    name: "Renewal Value Justification"
    description: "Build renewal justification with realized value evidence, ROI achieved, value at risk if not renewed, forward value projection, and price-to-value analysis"
    prompt: |
      Context: {account_name} renewal in {months} months.
      Current ARR: {arr}
      Value delivered: {value_summary}
      Account state: {account_state}

      You are building the value case that justifies renewal pricing. The renewal
      conversation shifts from "what will you do for us" to "look at what has
      been delivered." The justification must make the renewal decision obvious
      by showing that the value received far exceeds the investment made.
      Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Realized Value Evidence, ROI Actuals, Value-at-Risk Data,
      Forward Projection Inputs, Price-to-Value Benchmarks.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: VALUE DELIVERED SUMMARY
      Compile all realized value since deployment:
      - Value by type (hard savings, soft savings, risk avoidance, revenue enablement)
      - Total realized value (annual run rate)
      - Total cumulative value (over deployment lifetime)
      - Key headline metrics (top 3-5 improvements with before/after)
      - Value realization rate (realized vs original business case)
      - Evidence quality (percentage backed by system data vs estimates)
      Deliverable: Value delivered table (Type | Annual Value | Cumulative |
      Evidence Quality) with headline metrics callout.

      STEP 2: ROI ACHIEVED
      Calculate the actual return on investment:
      - Total investment to date (all license, services, internal effort)
      - Total realized benefit to date
      - ROI achieved: (benefit - investment) / investment × 100
      - Payback: when cumulative benefit exceeded cumulative investment
      - Comparison to original business case projection
      - Value multiple: total benefit / annual license cost
        (e.g., "For every $1 spent on licensing, {account_name} received $X in value")
      Deliverable: ROI summary with value multiple.

      STEP 3: VALUE AT RISK
      Calculate what the customer loses if they do not renew, separating observable
      facts from interpretive assessments:

      Observable layer (facts):
      - Ongoing savings that stop (hard savings revert to previous cost)
      - Productivity gains lost (soft savings capacity recaptured)
      - Risk exposure that returns (incidents, compliance gaps, audit failures)
      - Migration cost (effort to move to alternative, data export, retraining)

      Interpretive layer (with confidence):
      - Operational disruption estimate (transition period impact)
        Confidence: HIGH/MEDIUM/LOW
      - Competitive regression (falling behind peers who continue to invest)
        Confidence: HIGH/MEDIUM/LOW
      - Mark any value-at-risk estimate relying on LOW-richness data as "estimated"

      Commercial impact classification for each risk category:
      - Renewal: directly threatens renewal decision
      - Expansion: blocks future upsell/cross-sell opportunities
      - Neither: operational impact only

      Total value at risk = sum of all categories for the first 12 months post-lapse.
      Frame as: "Not renewing costs more than renewing."
      Deliverable: Value at risk table (Category | Annual Value at Risk | Confidence |
      Commercial Impact | Impact Description) with total.

      STEP 4: FORWARD VALUE PROJECTION
      Project value for the next contract period:
      - Current run rate value (annualized realized value)
      - Additional value from planned capabilities (new features, expanded deployment)
      - Value from increased adoption (more users, more use cases)
      - Total projected value for next period
      - Projected ROI for next period
      Show that value increases over time as adoption deepens and new
      capabilities are deployed. The second contract period should deliver
      more value than the first.
      Deliverable: Forward projection table (Source | Year 1 | Year 2 | Year 3 | Total)
      with projected ROI.

      STEP 5: PRICE-TO-VALUE ANALYSIS
      Compare the renewal price to the value delivered:
      - Annual license cost (renewal price)
      - Annual realized value (current run rate)
      - Value-to-price ratio: realized value / license cost
        (e.g., "4.2x value-to-price ratio: $4.20 in value for every $1 in license cost")
      - Benchmark: how does this ratio compare to industry norms for similar investments?
      - Price increase justification (if renewal includes a price increase):
        additional value expected from new capabilities vs incremental cost
        Confidence in additional value estimate: HIGH/MEDIUM/LOW
      Deliverable: Price-to-value analysis with ratio, confidence levels, and
      benchmark comparison.

      STEP 6: RENEWAL RECOMMENDATION
      Provide a clear recommendation:
      - Recommendation: RENEW AS-IS, RENEW WITH EXPANSION, RENEW WITH CONDITIONS
      - Key arguments (3-5 bullet points for the AE to use)
      - Risk if delayed (what changes if the customer waits)
      - Stakeholder-specific talking points (for each executive in the renewal discussion)
      - Competitive defense (if the customer is evaluating alternatives)
      - Prerequisites/Dependencies for each recommended action (stakeholder alignment,
        data availability, contractual requirements)
      Deliverable: Recommendation section with talking points per stakeholder and
      prerequisites/dependencies.

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Realized value uses actual data, not original projections
      - ROI calculation uses actual investment, not estimated
      - LOW-richness dimension scores are marked "estimated"
      - Interpretive assessments (disruption estimates, regression projections) include confidence levels
      - Value-at-risk items classified with three-value commercial impact (Renewal/Expansion/Neither)
      - Value at risk is realistic, not inflated to scare
      - Forward projection is based on current trajectory plus planned changes
      - Price-to-value ratio uses realized value, not projected
      - Recommendation actions include prerequisites/dependencies
      - Recommendation addresses specific renewal risks

      Format: If Signal Acquisition Mode was triggered, produce the signal acquisition
      plan only. Otherwise, produce all 6 deliverables plus the Data Availability Map
      as labeled sections. Lead with renewal headline: data richness profile, ROI
      achieved, value-to-price ratio, and total value at risk.

  expansion_business_case:
    name: "Expansion Business Case"
    description: "Build an expansion business case with incremental value over current deployment, synergy analysis, expansion ROI, implementation approach, and stakeholder justification"
    prompt: |
      Context: {account_name} expansion opportunity.
      Current deployment: {current_deployment}
      Expansion opportunity: {expansion_scope}
      Additional investment: {investment}
      Account state: {account_state}

      You are building a business case for expanding the deployment. The expansion
      case is different from the original business case: it leverages existing
      infrastructure, proven adoption, and realized value as a foundation.
      The incremental investment should deliver incremental value at a better
      ratio than the original deployment. Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Current Deployment Value Data, Expansion Use Case Data,
      Synergy Evidence, Incremental Cost Estimates, Risk Assessment Inputs.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: CURRENT VALUE FOUNDATION
      Summarize the current deployment's proven value:
      - What is deployed today (scope, users, use cases)
      - Realized value to date (from value tracker)
      - Key metrics achieved (before/after for top improvements)
      - Adoption level (users active, features utilized, workflows changed)
      - ROI achieved on current investment
      This establishes credibility: "Here is what we know works."
      Deliverable: Current value summary with key metrics.

      STEP 2: EXPANSION VALUE OPPORTUNITY
      Quantify the incremental value the expansion delivers, separating observable
      facts from interpretive assessments:

      Observable layer (facts):
      - New use cases enabled (describe each with expected outcome)
      - New teams or departments covered
      - Additional metrics that will improve
      - Net-new capabilities not available in current deployment

      Interpretive layer (with confidence):
      - Annual value estimate (using same methodology as original business case)
        Confidence: HIGH/MEDIUM/LOW
      - Value attribution: proportion from expansion vs optimization of current deployment
        Confidence: HIGH/MEDIUM/LOW
      - Mark any value estimate relying on LOW-richness data as "estimated"

      For each value opportunity:
      - Confidence level (HIGH if similar to proven current deployment,
        MEDIUM if new use case, LOW if speculative)
      - Timeline to realize (faster than original due to existing infrastructure)

      Commercial impact classification for each opportunity:
      - Renewal: strengthens renewal case
      - Expansion: directly supports this upsell/cross-sell
      - Neither: operational improvement only

      Deliverable: Expansion value table (Opportunity | Annual Value | Confidence |
      Commercial Impact | Timeline | Methodology).

      STEP 3: SYNERGY ANALYSIS
      Quantify advantages of expanding vs deploying a separate solution:
      - Infrastructure reuse (no new deployment, existing integrations)
      - Reduced implementation effort (existing team, processes, runbooks)
      - Faster time-to-value (adoption learnings from current deployment)
      - Consolidated management (single platform vs multi-vendor)
      - Data synergy (cross-domain correlation, unified analytics)
      - Volume economics (better pricing at higher volume)
      Monetize each synergy where possible.
      Deliverable: Synergy table (Synergy | Description | Monetized Value | vs Standalone Cost).

      STEP 4: INCREMENTAL INVESTMENT AND ROI
      Calculate the expansion economics:
      - Incremental license cost (additional users, modules, or capacity)
      - Incremental implementation cost (configuration, integration, training)
      - Incremental ongoing cost (admin effort, support tier change)
      - Total incremental investment (Year 1, Year 2, Year 3)
      - Total incremental benefit (from Step 2)
      - Expansion ROI: (incremental benefit - incremental investment) / incremental investment × 100
      - Combined ROI: (total benefit including expansion - total investment) / total investment × 100
      - Expansion payback period
      The expansion ROI should be higher than the original ROI due to synergies.
      If it is not, explain why (e.g., the expansion addresses a different value type).
      Deliverable: Expansion financial summary (Investment | Benefit | ROI | Payback)
      for incremental and combined views.

      STEP 5: RISK ASSESSMENT
      Identify risks specific to the expansion:
      - Adoption risk (will new teams adopt as well as current teams?)
      - Integration complexity (new data sources, new workflows)
      - Change management (organizational readiness for expanded scope)
      - Resource availability (internal team capacity for expansion project)

      For each risk: probability, impact, mitigation, owner, and
      prerequisites/dependencies for mitigation actions.

      Commercial impact classification for each risk:
      - Renewal: threatens renewal if risk materializes
      - Expansion: blocks this or future expansion opportunities
      - Neither: operational impact only

      Deliverable: Risk table (Risk | Probability | Impact | Commercial Impact |
      Mitigation | Prerequisites/Dependencies | Owner).

      STEP 6: RECOMMENDATION AND STAKEHOLDER JUSTIFICATION
      Provide expansion recommendation with stakeholder-specific justification:
      - For the economic buyer: incremental ROI, payback, total value trajectory
      - For the technical buyer: architecture fit, integration simplicity, reduced complexity
      - For the LOB buyer: operational improvements specific to their team
      - Implementation approach: phased or big-bang, timeline, resource needs
      Deliverable: Recommendation with stakeholder justification and implementation approach.

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Current value uses realized data, establishing credibility
      - Expansion value uses consistent methodology with the original business case
      - LOW-richness dimension scores are marked "estimated"
      - Interpretive assessments (value estimates, value attribution) include confidence levels
      - Opportunities and risks classified with three-value commercial impact (Renewal/Expansion/Neither)
      - Synergies are monetized where possible
      - Expansion ROI is calculated on incremental investment, not total
      - Combined ROI shows the overall value trajectory improving
      - Risks include adoption risk for new teams
      - Risk mitigation actions include prerequisites/dependencies
      - Recommendation addresses each stakeholder's perspective

      Format: If Signal Acquisition Mode was triggered, produce the signal acquisition
      plan only. Otherwise, produce all 6 deliverables plus the Data Availability Map
      as labeled sections. Lead with expansion headline: data richness profile,
      incremental value, expansion ROI, payback period, and key synergies.

  case_study_creation:
    name: "Case Study Creation"
    description: "Create a publication-ready case study with challenge-solution-results structure, headline metrics, customer quotes, visual recommendations, and distribution plan"
    prompt: |
      Context: Creating case study for {account_name}.
      Value delivered: {value_summary}
      Customer approval: {approval_status}
      Account state: {account_state}

      You are creating a formal case study for external publication. This is the
      highest-quality value artifact: it must be accurate, approved, and compelling
      to prospects in similar situations. Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: AUDIENCE AND DISTRIBUTION DESIGN
      Before writing, define who will read this and how:
      - Primary audience persona (role, industry, company size)
      - Reading context (website, sales collateral, analyst submission, event presentation)
      - Prospect's likely situation (what problem they recognize in themselves)
      - Competitor context (is the customer likely evaluating alternatives?)
      - Distribution channels (website, sales enablement, analyst programs, PR)
      This shapes the tone, detail level, and metrics emphasized.
      Deliverable: Audience profile and distribution plan.

      STEP 2: HEADLINE AND TITLE
      Create a headline that would make a prospect click:
      - Lead with the most impressive metric
      - Include the industry or company type (for relevance signaling)
      - Keep under 15 words
      - Avoid vendor name in the headline (make it about the customer's achievement)
      Create 3 headline options for the customer to choose from.
      Deliverable: 3 headline options.

      STEP 3: CUSTOMER PROFILE
      Provide context without revealing confidential information:
      - Industry and vertical
      - Company size (revenue range, employee count range)
      - Geographic scope
      - Use case summary (what they needed to accomplish)
      - Environment complexity (number of tools, scale of operations)
      If the customer wants to remain anonymous, create a profile that is
      recognizable to peers without identifying the company.
      Deliverable: Customer profile section (1 paragraph).

      STEP 4: CHALLENGE SECTION
      Write 2-3 paragraphs describing the problem:
      - Business trigger (what forced them to act)
      - Specific challenges (quantified: "4-hour MTTD", "$2M annual tool spend")
      - Impact on the business (operational, financial, competitive)
      - What they tried before (and why it fell short)
      The challenge must resonate with the target audience. A prospect should
      read this and think "that is exactly my situation."
      Deliverable: Challenge section (2-3 paragraphs).

      STEP 5: SOLUTION SECTION
      Write 2-3 paragraphs describing the transformation:
      - Decision criteria (why they chose this approach)
      - Implementation approach (timeline, phases, key milestones)
      - Integration with existing environment
      - Adoption story (how teams adapted, change management approach)
      - Key decision points or turning moments during deployment
      Focus on the journey and decisions, not product features.
      Deliverable: Solution section (2-3 paragraphs).

      STEP 6: RESULTS SECTION
      Present the outcomes with impact:
      - Headline metrics callout box: 3-5 metrics in large format
        Each metric: "X% [improvement/reduction] in [metric]"
        Include before and after values
      - Detailed results narrative (2-3 paragraphs expanding on the metrics)
      - Time to value (how quickly results appeared)
      - Unexpected benefits (value they did not anticipate)
      - ROI or payback if approved for disclosure
      - Forward trajectory (what they plan to achieve next)
      Deliverable: Results section with headline metrics callout and detail narrative.

      STEP 7: CUSTOMER VOICE
      Include authentic customer perspective:
      - Executive quote (2-3 sentences on strategic impact, attributed to senior leader)
      - Practitioner quote (1-2 sentences on day-to-day improvement, attributed to user)
      - If quotes are not yet approved: draft suggestions based on customer statements
        during meetings, flagged as [DRAFT, NEEDS APPROVAL]
      - Attribution format: "Name, Title, Company" or "Senior Leader, [Industry] Company"
      Deliverable: Quotes section with approval status.

      STEP 8: VISUAL AND DESIGN RECOMMENDATIONS
      Recommend visuals to enhance the case study:
      - Before/after comparison chart (which metrics to visualize)
      - Timeline graphic (deployment to results)
      - Architecture diagram (if technical audience)
      - Metric callout design (layout for headline numbers)
      - Photography or illustration needs
      Deliverable: Visual recommendations with data specifications.

      STEP 9: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Headline contains a specific metric, not generic improvement language
      - Challenge section is relatable to the target audience persona
      - Solution section describes the journey, not product features
      - Results metrics have before/after values and timeframes
      - Quotes are attributed or flagged for approval
      - Case study works without the vendor name (customer's achievement is the hero)
      - Length is appropriate for distribution channel (2-3 pages for web, 1 page for sales collateral)

      Format: Produce all 8 deliverables as labeled sections. The document should
      be ready for a content team to produce a published case study.

  competitive_value_differentiation:
    name: "Competitive Value Differentiation"
    description: "Quantify value differentiation vs a specific competitor across TCO, capability, risk, and customer outcomes, with proof points and objection handling"
    prompt: |
      Context: {account_name} comparing {vendor} to {competitor}.
      {vendor} value proposition: {vendor_value}
      Competitive positioning: {competitive_context}
      Account state: {account_state}

      You are building a value-based competitive differentiation. The goal is not
      to disparage the competitor but to quantify where {vendor} delivers more
      value and to arm the AE with defensible data for competitive conversations.
      Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: DIFFERENTIATION DIMENSION IDENTIFICATION
      Identify the dimensions where the comparison matters to this customer:
      - Cost dimensions (TCO, pricing model, hidden costs, scale economics)
      - Capability dimensions (what each can do, integration depth, automation level)
      - Risk dimensions (security posture, compliance coverage, vendor viability)
      - Outcome dimensions (measured results at comparable customers)
      - Experience dimensions (time-to-value, support quality, product velocity)
      For each dimension, note which stakeholder at {account_name} cares about it.
      Deliverable: Differentiation framework (Dimension | Category | Stakeholder Interest).

      STEP 2: VALUE DIFFERENTIATION MATRIX
      For each dimension, compare {vendor} and {competitor}:
      - Dimension name
      - {vendor} position (specific capability or metric)
      - {competitor} position (specific capability or metric, from competitive intelligence)
      - Advantage: {vendor}, {competitor}, or PARITY
      - Magnitude of difference (quantified where possible)
      - Evidence source: customer data, analyst report, public documentation,
        competitive intelligence, or UNVERIFIED (flag clearly)
      Do not claim advantages without evidence. Where evidence is unavailable,
      mark as PARITY or UNVERIFIED.
      Deliverable: Differentiation matrix (Dimension | {vendor} | {competitor} |
      Advantage | Magnitude | Evidence Source).

      STEP 3: TCO COMPARISON
      Build a side-by-side TCO model:
      - License cost comparison (normalize to same scope and term)
      - Implementation cost comparison (effort, timeline, services)
      - Ongoing operational cost comparison (admin effort, support, maintenance)
      - Hidden cost comparison (integration complexity, migration effort, lock-in cost)
      - Scale economics (how costs change at 2x and 5x current scale)
      Present as Year 1, Year 2, Year 3, and total.
      Note where {competitor} costs are estimated vs confirmed.
      Deliverable: TCO comparison table (Category | {vendor} | {competitor} |
      Difference) with total and notes on data confidence.

      STEP 4: UNIQUE VALUE IDENTIFICATION
      Identify value that only {vendor} can deliver:
      - Capability or outcome that {competitor} cannot match
      - Why it matters to {account_name} specifically
      - Dollarized value of this unique capability (using the customer's context)
      - Proof point (customer reference or analyst validation)
      These are the conversation-ending differentiators. If the customer values
      these capabilities, the competitive comparison is resolved.
      Deliverable: Unique value table (Capability | Why It Matters | Dollarized Value | Proof).

      STEP 5: OBJECTION HANDLING
      Prepare responses for competitor claims the customer may hear:
      - Competitor claim (what they are likely saying in their pitch)
      - Reality check (what the data actually shows)
      - {vendor} response (how to reframe the conversation)
      - Evidence to support the response
      - Redirect (move the conversation to a dimension where {vendor} is stronger)
      Common competitive claims to address:
      - Lower price (but higher hidden costs or lower capability)
      - Better feature X (but {vendor} has better outcome Y)
      - Faster implementation (but {vendor} delivers more value post-deployment)
      Deliverable: Objection handling table (Claim | Reality | Response | Evidence | Redirect).

      STEP 6: RECOMMENDED POSITIONING
      Provide the AE with a competitive positioning strategy:
      - Lead with (which differentiation dimension to emphasize first)
      - Avoid (which dimensions are parity or disadvantage, do not contest)
      - Reframe (how to shift conversations from competitor strengths to {vendor} strengths)
      - Proof sequence (which evidence to present in which order)
      - Trap questions (questions to ask the customer that expose competitor weaknesses
        without naming the competitor)
      Deliverable: Positioning strategy with lead/avoid/reframe guidance and trap questions.

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Every advantage claim has an evidence source
      - UNVERIFIED claims are clearly flagged
      - TCO comparison normalizes scope (same users, same capabilities, same term)
      - Unique value is dollarized, not just described
      - Objection responses are honest (concede where {competitor} is genuinely better)
      - Positioning strategy is practical for a sales conversation, not a slide deck
      - Tone is professional, not disparaging

      Format: Produce all 6 deliverables as labeled sections. Lead with competitive
      summary: dimensions where {vendor} leads, parity dimensions, and total
      dollarized differentiation value.

# ============================================================================
# VE ENGAGEMENT PROMPTS
# ============================================================================
# Full runbook prompts: engagement qualification with scoring criteria and
# executive presentation preparation with audience-tailored content.
# ============================================================================
ve_engagement:

  engagement_qualification:
    name: "VE Engagement Qualification"
    description: "Qualify an opportunity for VE engagement with scoring criteria, engagement level recommendation, resource allocation, deliverable plan, and disqualification reasoning"
    prompt: |
      Context: Request for VE support on {account_name}.
      Opportunity: {opportunity_details}
      Stage: {stage}
      ARR: {arr}
      Account state: {account_state}

      You are determining whether this opportunity warrants VE resources. VE
      capacity is limited, so engagement must be allocated to deals where value
      engineering materially impacts the outcome. Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Deal Financials, Opportunity Context, Stakeholder Access,
      Competitive Intelligence, Value Conversation Readiness.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (framed as value to customer, not our need)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: QUALIFICATION CRITERIA ASSESSMENT
      Score the opportunity against each qualification criterion, separating
      observable facts from interpretive assessments:

      Observable layer (facts):
      - Deal size: ARR threshold (typically >$100K for standard VE, >$500K for deep VE)
        Score: MEETS / BELOW THRESHOLD / EXCEPTION (explain)
      - Deal stage: is the opportunity at a stage where VE can influence the outcome?
        (Too early = no data to work with, too late = decision already made)
        Score: OPTIMAL (discovery/evaluation) / ACCEPTABLE (negotiation) / SUBOPTIMAL (closed-won/lost)
      - Stakeholder access: can VE engage directly with the economic buyer or value-sensitive stakeholders?
        Score: DIRECT ACCESS / INDIRECT (through champion) / NO ACCESS

      Interpretive layer (with confidence):
      - Competitive pressure: is value differentiation a factor in the decision?
        Score: HIGH (active competitive evaluation) / MEDIUM (alternatives considered) / LOW (sole source)
        Confidence in assessment: HIGH/MEDIUM/LOW
      - Value conversation opportunity: is there a quantifiable value story to tell?
        Score: STRONG (clear pain with cost data) / MODERATE (pain identified, not quantified) / WEAK (no clear pain)
        Confidence in assessment: HIGH/MEDIUM/LOW
      - Strategic importance: is this a must-win, reference account, or market-maker deal?
        Score: HIGH / MEDIUM / LOW
        Confidence in assessment: HIGH/MEDIUM/LOW
      - Mark any criterion scored with LOW-richness data as "estimated"

      Commercial impact classification for the overall engagement:
      - Renewal: VE engagement protects an existing renewal
      - Expansion: VE engagement supports upsell/cross-sell opportunity
      - Neither: new logo or operational engagement only

      Deliverable: Qualification scorecard (Criterion | Score | Confidence |
      Evidence | Notes) with overall commercial impact classification.

      STEP 2: QUALIFICATION DECISION
      Based on the scorecard:
      - QUALIFIED: meets minimum thresholds on deal size, stage, and value opportunity
      - QUALIFIED WITH CONDITIONS: meets some thresholds, requires specific conditions
        (e.g., "qualified if AE secures CFO access before VE engagement")
      - NOT QUALIFIED: does not meet thresholds, provide specific reasons
      - EXCEPTION: does not meet standard thresholds but qualifies due to strategic
        importance (document the exception rationale)
      Deliverable: Qualification decision with reasoning.

      STEP 3: ENGAGEMENT LEVEL RECOMMENDATION
      If qualified, recommend the engagement level:
      - LIGHT (4-8 hours): provide business case template, benchmark data, and
        value talking points for AE to deliver
      - STANDARD (16-40 hours): conduct discovery workshop, build business case,
        create stakeholder narratives, support 1-2 customer meetings
      - DEEP (40-80+ hours): full value engagement including workshops, custom
        financial modeling, executive presentations, POC value tracking, ongoing
        stakeholder engagement
      Recommendation based on deal size, complexity, competitive pressure, and
      strategic importance.
      Deliverable: Engagement level recommendation with scope definition.

      STEP 4: DELIVERABLE PLAN
      Define what VE will deliver for this engagement:
      - Deliverable name (specific document or artifact)
      - Purpose (what decision or conversation it supports)
      - Timeline (when it is needed relative to deal milestones)
      - Input needed (what data from AE, SA, or customer is required)
      - Prerequisites/Dependencies (what must happen before this deliverable can be
        created, including data availability, stakeholder access, prior deliverables)
      Common VE deliverables: current state assessment, value hypothesis, ROI model,
      TCO comparison, business case, stakeholder narrative, QBR value content,
      executive presentation.
      Deliverable: Deliverable plan table (Deliverable | Purpose | Timeline |
      Input Needed | Prerequisites/Dependencies).

      STEP 5: RESOURCE AND TIMELINE PLAN
      Estimate the effort and timeline:
      - VE hours required (by activity: research, modeling, meetings, documentation)
      - VE resource assigned (or requested)
      - Key milestones with dates (aligned to deal timeline)
      - Customer engagement points (meetings, workshops, review sessions)
      - AE/SA collaboration points (input sessions, joint customer meetings)
      Deliverable: Resource plan (Activity | Hours | Milestone | Date | Participants).

      STEP 6: DISQUALIFICATION REASONING (IF NOT QUALIFIED)
      If not qualified, provide:
      - Specific criteria that were not met
      - What would change the qualification (e.g., "deal size increases to $X",
        "AE secures access to CFO")
      - Alternative support: what VE can provide without a full engagement
        (templates, benchmark data, coaching session for AE)
      - Re-evaluation trigger: when to reassess qualification
      Deliverable: Disqualification reasoning with re-evaluation criteria.

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Qualification criteria use defined thresholds, not gut feeling
      - LOW-richness criterion scores are marked "estimated"
      - Interpretive assessments (competitive pressure, value opportunity, strategic importance) include confidence levels
      - Overall engagement classified with three-value commercial impact (Renewal/Expansion/Neither)
      - Engagement level matches the deal complexity and VE capacity
      - Deliverable plan includes prerequisites/dependencies for each deliverable
      - Deliverable plan aligns with deal timeline milestones
      - Resource hours are realistic for the engagement level
      - Disqualification provides actionable re-qualification criteria
      - Exception approvals document the strategic rationale

      Format: If Signal Acquisition Mode was triggered, produce the signal acquisition
      plan only. Otherwise, produce all applicable deliverables plus the Data
      Availability Map as labeled sections. Lead with qualification decision: data
      richness profile, QUALIFIED / NOT QUALIFIED, engagement level, and estimated
      VE hours.

  executive_presentation_prep:
    name: "Executive Value Presentation Preparation"
    description: "Prepare an executive value presentation with audience analysis, slide-by-slide content, metrics visualization, objection preparation, and leave-behind materials"
    prompt: |
      Context: Executive presentation for {account_name}.
      Audience: {executive_audience}
      Business case: {business_case}
      Meeting objective: {objective}
      Account state: {account_state}

      You are preparing a value presentation for executives. Executives have
      limited time and high expectations. Every slide must earn its place.
      The presentation must land the key message within the first 3 minutes
      and survive interruption at any point. Follow these steps.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: AUDIENCE ANALYSIS
      Profile each executive who will be in the room:
      - Name, title, and role in the decision
      - What they care about (from stakeholder discovery)
      - Value language they use
      - Known concerns or objections
      - Decision authority (approver, influencer, blocker)
      - Communication preference (data-driven, narrative, visual, interactive)
      Identify the primary audience (who are you presenting FOR) vs supporting
      audience (who is in the room but not the target).
      Deliverable: Audience profile table (Name | Role | Cares About | Concerns |
      Authority | Preference).

      STEP 2: MESSAGE ARCHITECTURE
      Design the presentation's message hierarchy:
      - Core message: 1 sentence that captures the entire presentation
        (if the executive remembers only one thing, what should it be?)
      - Supporting messages: 3 key points that prove the core message
      - Evidence per message: the strongest data point for each supporting message
      - Call to action: what you want the executive to do after the presentation
      Test: if the presentation is interrupted at minute 3, has the core message
      been delivered? If not, restructure.
      Deliverable: Message architecture (core message, 3 supporting messages,
      evidence per message, call to action).

      STEP 3: SLIDE-BY-SLIDE CONTENT
      Design each slide with content and speaker notes:

      Slide 1: Title and context (10 seconds)
      - Meeting objective stated clearly
      - Attendee acknowledgment

      Slide 2: The problem (2 minutes)
      - Customer's current state pain in their language
      - Key metric: total addressable pain or cost of current state
      - Why this matters now (urgency trigger)
      Speaker note: do not mention the solution yet. Let the problem resonate.

      Slide 3: The value opportunity (2 minutes)
      - Total value available (dollar amount)
      - Top 3 value drivers ranked by the primary audience's priorities
      - Timeline to achieve
      Speaker note: lead with the metric that matters most to the primary audience.

      Slide 4: How it works (3 minutes)
      - High-level approach (not product features, but transformation steps)
      - Proof points: 1-2 comparable results (anonymized references if needed)
      - Implementation timeline and quick wins
      Speaker note: keep technical detail minimal. Offer to dive deeper if asked.

      Slide 5: Financial case (3 minutes)
      - Investment summary (total, not line items)
      - ROI headline (percentage, payback period)
      - Sensitivity: "Even at 70% of projected benefits, ROI is X%"
      - Cost of inaction comparison
      Speaker note: present the sensitivity analysis proactively. It builds credibility.

      Slide 6: Recommendation and next steps (2 minutes)
      - Clear recommendation (proceed / proceed with POC / etc.)
      - Specific next steps with owners and dates
      - What you need from them (decision, access, data)
      Speaker note: end with the ask. Do not end with "any questions?"

      Appendix slides (for depth if requested):
      - Detailed ROI breakdown
      - Full hypothesis table
      - TCO comparison
      - Implementation plan detail

      For each slide: title, content bullets, key metric callout, speaker notes,
      and visual recommendation.
      Deliverable: Slide-by-slide content table (Slide | Title | Content | Metric |
      Speaker Notes | Visual).

      STEP 4: METRICS VISUALIZATION
      For each key metric in the presentation:
      - Chart type recommendation (bar, line, waterfall, before/after, gauge)
      - Data to include (specific values, labels, comparisons)
      - Color coding (green for positive, red for risk/cost)
      - Callout text (the headline that goes with the visual)
      - Source footnote (where the data comes from)
      Keep visualizations simple. One chart, one message.
      Deliverable: Visualization specs table (Metric | Chart Type | Data | Callout | Source).

      STEP 5: OBJECTION PREPARATION
      Prepare for executive pushback:
      - Anticipated question (what will they ask)
      - Prepared response (concise, evidence-based)
      - Supporting slide (which appendix slide to pull up if needed)
      - Redirect (how to move the conversation back to the core message)
      Common executive objections:
      - "Your ROI assumptions are too aggressive"
      - "We have other priorities right now"
      - "How does this compare to [competitor]?"
      - "What happens if adoption is lower than projected?"
      - "Can you do a POC first?"
      For each: have a 30-second response ready, not a 3-minute explanation.
      Deliverable: Objection table (Question | Response | Supporting Slide | Redirect).

      STEP 6: LEAVE-BEHIND MATERIALS
      Prepare materials the executive can review after the meeting:
      - 1-page executive summary (core message, key metrics, recommendation)
      - Full business case document (for the team to review in detail)
      - ROI model (if the executive wants to run their own scenarios)
      - Reference list (comparable customers willing to speak)
      Each leave-behind should work standalone (the reader may not have attended
      the presentation).
      Deliverable: Leave-behind materials list with content specification.

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Core message is deliverable in the first 3 minutes
      - Slides for a 15-minute meeting, not a 45-minute deep dive
      - Metrics use the primary audience's value language
      - Sensitivity analysis is presented proactively, not defensively
      - Objection responses are concise (30 seconds each)
      - Leave-behinds work standalone without the verbal presentation
      - No slide has more than 3 bullet points (executive attention span)

      Format: Produce all 6 deliverables as labeled sections. The output should
      be ready for a content team to build the slide deck.
