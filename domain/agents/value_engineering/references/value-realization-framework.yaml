# VE Value Realization Framework
# Post-sale tracking methodology, scorecard design, QBR content, and success story framework
# Sources: Gainsight, Ecosystems.io, TSIA value realization research, Forrester TEI follow-up methodology

value_realization_purpose: >
  Bridge the gap between what was promised (business case) and what was delivered.
  Convert pre-sales claims into post-sales evidence. Enable renewals built on
  measured outcomes, not repackaged promises.

realization_lifecycle:
  baseline_establishment:
    timing: Before implementation begins
    activities:
      - "Document current-state metrics from the business case as 'before' measurements"
      - "Confirm measurement methodology with customer (data source, calculation method)"
      - "Identify metric owners on customer side"
      - "Record baseline date and data quality"
    deliverable: Baseline measurement document signed off by customer stakeholder

  success_metrics_definition:
    timing: At deal close, before implementation kickoff
    activities:
      - "Agree on 3-5 KPIs to track"
      - "Define measurement methodology for each"
      - "Identify data source and collection method"
      - "Set measurement frequency (monthly, quarterly)"
      - "Define success thresholds"
    principles:
      - "Fewer metrics are better. 3-5 tracked well beats 15 tracked poorly."
      - "Choose metrics the customer already measures. Don't create new measurement burden."
      - "Include at least one leading indicator (predicts value) and one lagging indicator (confirms value)"

  milestone_based_tracking:
    milestones:
      go_live:
        timing: "Month 0"
        expectation: "System operational, no value yet, readiness confirmed"
        metrics: "Deployment complete, users provisioned, integrations live"
      initial_adoption:
        timing: "Month 1-3"
        expectation: "First measurable improvements, early adopters active"
        typical_adoption: "25-50% of target users"
        metrics: "Feature utilization, user login frequency, first workflow completions"
      steady_state:
        timing: "Month 6-12"
        expectation: "Full adoption, majority of projected value realized"
        typical_adoption: "70-90% of target users"
        metrics: "Business outcome metrics tracking against baseline"
      optimization:
        timing: "Month 12+"
        expectation: "Additional value from advanced use cases, process optimization"
        metrics: "Value exceeding original projections, new use case identification"

  adoption_curve_modeling:
    description: >
      Value realization depends on adoption. Model a ramp-up period,
      not instant full adoption on day one.
    typical_curve:
      month_1: "25% adoption"
      month_3: "50% adoption"
      month_6: "75-80% adoption"
      month_12: "85-90% steady state"
    risk_factors:
      - "Change management quality"
      - "Executive sponsorship strength"
      - "Integration complexity"
      - "User training completeness"
      - "Process redesign scope"

value_scorecard:
  description: Dashboard or report comparing projected to actual value
  sections:
    headline_metrics:
      - "Total projected value (from business case)"
      - "Total realized value (from actual measurements)"
      - "Realization rate (realized / projected as percentage)"
      - "Time to first value (days from go-live to first measurable improvement)"
    per_value_driver:
      columns:
        - "Value driver name"
        - "Projected annual value"
        - "Actual value this period"
        - "Cumulative actual value"
        - "Variance (actual vs projected)"
        - "Status (GREEN / YELLOW / RED)"
        - "Action required"
    adoption_metrics:
      - "Active users vs licensed users"
      - "Feature utilization by module"
      - "Usage trends (growing, stable, declining)"
    leading_indicators:
      - "Metrics that predict future value (e.g., training completion predicts adoption)"
      - "Engagement signals (support tickets, feature requests, executive meetings)"
  status_definitions:
    green: "Actual >= 80% of projected"
    yellow: "Actual 50-80% of projected, intervention may be needed"
    red: "Actual < 50% of projected, immediate attention required"
  escalation:
    yellow: "Review with customer success, identify adoption blockers"
    red: "Executive escalation, remediation plan within 2 weeks"

qbr_value_content:
  description: Quarterly Business Review content that leads with value, not product usage
  structure:
    value_headlines:
      slides: 1-2
      content:
        - "Total quantified value delivered since go-live"
        - "Value delivered this quarter specifically"
        - "Comparison to original business case projections"
      rule: "Use concrete numbers. '$1.2M saved this quarter' not 'significant savings'"
    value_deep_dive:
      slides: 2-3
      content:
        - "Breakdown by category (cost savings, productivity, risk reduction)"
        - "Trend lines (improving, stable, declining)"
        - "Specific wins with named internal champions"
    adoption_as_value_enabler:
      slides: 1-2
      content:
        - "Frame usage as value enabler, not the goal"
        - "Connect adoption to value: 'Feature X adoption increased from 60% to 85%, driving $200K in gains'"
        - "Identify adoption gaps as unrealized value opportunities"
    forward_looking_value:
      slides: 1-2
      content:
        - "New use cases or expansion opportunities with projected value"
        - "Product roadmap items relevant to customer's value drivers"
        - "Recommendations for increasing value realization"

success_story_framework:
  name: "SCSRF (Situation, Challenge, Solution, Results, Future)"
  sections:
    situation:
      length: 2-3 sentences
      content: "Who is the customer? Industry, size, relevant context. No puffery."
    challenge:
      length: 1 paragraph
      content: "Specific business problem, quantified."
      example: "Processing 50,000 invoices monthly with 4% error rate, costing $2M annually in rework."
    solution:
      length: 1 paragraph
      content: "What was implemented. Brief, outcome-focused, not feature-focused."
    results:
      length: 3-5 bullet points
      content: "Each quantified with before/after metrics"
      example_bullets:
        - "Reduced invoice error rate from 4% to 0.3%, saving $1.8M annually"
        - "Cut processing time from 12 days to 2 days"
        - "Redeployed 15 FTEs from manual processing to strategic activities"
        - "Achieved full ROI payback in 7 months"
    future:
      length: 1-2 sentences
      content: "Expansion plans, additional use cases, broader impact"
  best_practices:
    - "Lead with result in title: 'Bank Saves $1.8M' not 'Bank Deploys New System'"
    - "Include executive pull-quote with quantified statement"
    - "Provide context: company size, industry, implementation scope"
    - "Create multiple formats: full write-up, one-page infographic, 2-min video, QBR slide"

change_management_context:
  prosci_adkar:
    name: ADKAR Model
    source: https://www.prosci.com/methodology/adkar
    stages:
      - Awareness (of the need for change)
      - Desire (to participate and support)
      - Knowledge (of how to change)
      - Ability (to implement on a day-to-day basis)
      - Reinforcement (to sustain the change)
    ve_relevance: >
      VE should account for change management costs in the business case
      and reference ADKAR when discussing adoption risk with the buyer.
  change_management_costs:
    description: Real costs that belong in the business case
    items:
      - "Training program development and delivery"
      - "Internal communication campaigns"
      - "Process redesign workshops"
      - "Temporary productivity loss during transition (typically 2-4 weeks)"
      - "Dedicated change management resources (if not provided by vendor)"

handoff_to_customer_success:
  timing: At deal close or implementation kickoff
  artifacts_to_transfer:
    - "Original business case with all assumptions"
    - "Baseline measurements documented"
    - "Success metrics and measurement plan"
    - "Value scorecard template"
    - "Realization milestone timeline"
    - "Stakeholder map with value priorities per persona"
  critical_requirement: >
    Value hypotheses must survive the handoff and be adopted by the post-sales team.
    Document-centric handoff fails when no one reads the documents.
    Outcomes-centric handoff succeeds when success metrics are built into QBR cadence.
