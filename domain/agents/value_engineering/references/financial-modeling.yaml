# VE Financial Modeling Reference
# Core financial concepts, formulas, and methods that economic buyers use to evaluate investments
# VE must be fluent in these to speak CFO language and build defensible models

core_metrics:
  npv:
    name: Net Present Value
    formula: "NPV = Sum of [Cash Flow_t / (1 + r)^t] for t = 0 to n"
    description: >
      Sum of all projected cash flows (benefits minus costs) discounted to present value.
      The primary metric in most business cases. Positive NPV means the investment creates value.
    inputs:
      - Projected annual benefits (net of costs)
      - Discount rate (typically buyer's WACC)
      - Analysis period (typically 3 or 5 years)
    interpretation:
      positive: Investment creates value, proceed
      zero: Investment breaks even at the discount rate
      negative: Investment destroys value at the discount rate

  irr:
    name: Internal Rate of Return
    formula: "Discount rate at which NPV = 0"
    description: >
      Useful for comparing investments of different sizes. Companies have a hurdle rate
      (minimum acceptable IRR). If IRR > hurdle rate, the investment is attractive.
    typical_hurdle_rates:
      conservative: "8-12% (regulated industries, financial services)"
      moderate: "12-18% (manufacturing, healthcare)"
      aggressive: "18-25% (technology, high-growth)"
    caveat: IRR can be misleading for projects with non-standard cash flow patterns

  wacc:
    name: Weighted Average Cost of Capital
    formula: "WACC = (E/V * Re) + (D/V * Rd * (1 - Tc))"
    description: >
      Blended cost of a company's debt and equity financing. Used as the discount rate
      in NPV calculations. Publicly traded company WACCs available from financial databases.
    components:
      E_V: Proportion of equity financing
      Re: Cost of equity
      D_V: Proportion of debt financing
      Rd: Cost of debt
      Tc: Corporate tax rate
    sources:
      - Company annual reports (capital structure)
      - Bloomberg, Capital IQ, or Yahoo Finance (public companies)
      - Damodaran datasets (industry averages)

  payback_period:
    name: Payback Period
    formula: "Time until cumulative benefits >= cumulative costs"
    description: >
      Time required for cumulative benefits to equal cumulative costs.
      CFOs often have payback period requirements.
    typical_thresholds:
      aggressive: "< 12 months"
      standard: "12-18 months"
      acceptable: "18-24 months"
      requires_justification: "> 24 months"
    note: Does not account for time value of money. Use discounted payback period for rigor.

  roi:
    name: Return on Investment
    formula: "ROI = (Total Benefits - Total Costs) / Total Costs * 100"
    description: >
      Percentage return on the total investment. Simple and widely understood,
      but does not account for timing of cash flows.
    three_year_calculation:
      total_benefits: Sum of risk-adjusted benefits over analysis period
      total_costs: Sum of all costs (license, implementation, internal, ongoing)
      roi_percent: "(Benefits - Costs) / Costs * 100"

  dcf:
    name: Discounted Cash Flow
    description: >
      The general methodology of discounting future cash flows to present value.
      NPV is the output of a DCF analysis. Foundation for all rigorous financial modeling.

sensitivity_analysis:
  description: >
    Testing how changes in key assumptions affect the overall outcome.
    Identifies which 2-3 assumptions drive 80% of variance.
  methods:
    tornado_diagram:
      description: Bar chart showing each variable's impact on NPV when varied by +/- a percentage
      use: Identifies the most sensitive variables to focus validation effort
    scenario_table:
      description: Best case, base case, worst case with different assumption sets
      typical_scenarios:
        conservative: "P10, low adoption, delayed implementation"
        base: "P50, expected adoption, on-time implementation"
        optimistic: "P90, high adoption, accelerated implementation"
    data_table:
      description: Two-variable sensitivity showing outcome for combinations of key inputs
      example: "Adoption rate (60/75/90%) vs. Headcount growth (0/5/10%)"

tco_model:
  name: Total Cost of Ownership
  description: All-in cost over the analysis period
  categories:
    direct_costs:
      - Software licensing (subscription or perpetual)
      - Infrastructure (cloud compute, storage, network)
      - Implementation and professional services
      - Training and certification
    indirect_costs:
      - Internal project team time (FTE allocation)
      - IT operations and administration
      - Integration development and maintenance
      - Change management and communications
    hidden_costs:
      - Opportunity cost of internal resources
      - Switching costs from current solution
      - Temporary productivity loss during transition
      - Vendor lock-in risk premium
      - Technical debt from customizations

cost_of_inaction:
  name: Cost of Inaction / Status Quo Cost
  description: >
    Quantifies the accumulating cost of not investing. More effective than
    "missed opportunity" framing because it shows compounding deterioration.
  framing: Time-decay model showing compounding cost over time
  categories:
    ongoing_inefficiency: "Current manual costs multiplied by growth rate"
    risk_accumulation: "Probability of adverse event * impact, compounding over time"
    competitive_erosion: "Revenue at risk from competitors with better capabilities"
    talent_cost: "Attrition risk from employees stuck with outdated tools"
  calculation: >
    Year 1 inaction cost + Year 2 inaction cost (with growth) + Year 3 inaction cost.
    Present as cumulative cost that exceeds the investment by Year X.

capex_vs_opex:
  description: >
    Cloud/SaaS solutions are OpEx (operating expense), often easier to approve than CapEx.
    VE should frame the investment model according to buyer preference.
  capex:
    characteristics: Large upfront, depreciated over time, requires capital budget approval
    buyer_preference: Companies with strong balance sheets, tax optimization strategies
  opex:
    characteristics: Spread over time, expensed immediately, fits operating budget
    buyer_preference: Companies prioritizing cash flow, subscription-friendly finance teams
