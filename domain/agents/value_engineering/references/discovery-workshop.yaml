# VE Discovery Workshop Framework
# Structure, preparation, facilitation guide, and post-workshop procedures
# Sources: Value Selling Associates, Corporate Visions, Forrester TEI interview methodology

workshop_purpose: >
  Gather customer-specific data to build a defensible business case.
  Replace assumptions with actual numbers. Create shared ownership of the problem
  and the quantification with the buyer.

pre_workshop:
  timeline: 1-2 weeks before workshop
  research:
    public_sources:
      - "10-K / annual report (revenue, margins, headcount, IT spend)"
      - "Earnings call transcripts (strategic priorities, challenges mentioned)"
      - "Press releases (recent initiatives, partnerships, expansions)"
      - "LinkedIn profiles of attendees (role, tenure, focus areas)"
      - "Glassdoor / industry reports (organizational culture, pain indicators)"
    internal_sources:
      - "CRM data (deal history, stakeholder map, previous interactions)"
      - "AE discovery notes (stated challenges, timeline, budget signals)"
      - "CI competitive intelligence (incumbent vendor, alternatives evaluated)"
  prepare:
    value_hypothesis:
      description: Initial estimate using industry benchmarks as starting assumptions
      content:
        - "3-5 value drivers relevant to this prospect's industry and size"
        - "Benchmark ranges for each driver"
        - "Preliminary total value estimate (will be refined with customer data)"
    data_request:
      description: Send to attendees 5-7 days before workshop
      typical_items:
        - "Current headcount in affected departments"
        - "Annual spend on current tools / solutions"
        - "Volume metrics (transactions, tickets, deployments per month)"
        - "Current process time for key workflows"
        - "Known pain points and their frequency"
    logistics:
      - "Confirm attendees and their roles"
      - "60-90 minutes, virtual or in-person"
      - "Whiteboard or shared document for live capture"
      - "Send pre-read agenda with expected outcomes"

workshop_structure:
  total_duration: "60-90 minutes"

  context_setting:
    duration: "10 minutes"
    activities:
      - Establish agenda and expected outcomes
      - Confirm attendees and their roles
      - Set ground rules (no sales pitch, data-driven conversation)
      - Share preliminary value hypothesis as a starting point

  current_state_assessment:
    duration: "25 minutes"
    technique: Process walk-through with quantification
    questions:
      process:
        - "Walk me through what happens when [trigger event] occurs"
        - "How many people are involved in this process?"
        - "How long does each step take?"
        - "What tools do you use at each step?"
      cost:
        - "What does this process cost you annually (people, tools, overhead)?"
        - "How often does this process fail or require rework?"
        - "What is the cost of each failure (rework hours, revenue impact, customer impact)?"
      pain:
        - "Where do you lose the most time?"
        - "What is the most frustrating part of the current process?"
        - "If you could fix one thing tomorrow, what would it be?"
    anchoring_technique: >
      Use industry benchmarks as anchors: "Other companies in your industry typically see X.
      Does that sound about right for your organization?" This grounds the conversation
      and makes it easier for buyers to share numbers.

  impact_quantification:
    duration: "20 minutes"
    activities:
      - "For each pain point, quantify: frequency, cost per occurrence, annual impact"
      - "Distinguish hard costs (dollars out the door) from soft costs (time, productivity)"
      - "Identify downstream effects (what happens when this process fails?)"
      - "Capture confidence level for each number (customer-confirmed vs estimated)"
    formula_per_pain_point:
      - "Frequency (times per year)"
      - "Cost per occurrence (labor hours * rate + direct costs)"
      - "Annual impact = Frequency * Cost per occurrence"
      - "Confidence level: HIGH (customer data), MEDIUM (customer estimate), LOW (benchmark)"

  future_state_vision:
    duration: "15 minutes"
    questions:
      - "What does success look like in 12 months?"
      - "Which metrics would improve, and by how much?"
      - "What would your team do with recovered time or resources?"
      - "What strategic initiatives does this enable?"
    output: Target state metrics with customer-agreed improvement percentages

  prioritization_and_next_steps:
    duration: "10 minutes"
    activities:
      - "Rank value drivers by magnitude and confidence"
      - "Identify data gaps that need follow-up"
      - "Agree on timeline for business case delivery (typically 5-10 business days)"
      - "Confirm review session date"

post_workshop:
  day_1:
    - "Send summary notes and captured data within 24 hours"
    - "Highlight any data gaps and request follow-up information"
  day_5_10:
    - "Deliver draft business case"
    - "Include assumptions clearly marked for customer validation"
  day_10_15:
    - "Review session with prospect"
    - "Walk through model, validate assumptions, refine numbers"
    - "Agree on final version for executive presentation"

facilitation_principles:
  - "Ask, don't tell. The buyer owns their numbers."
  - "Quantify everything. 'It takes too long' becomes 'It takes 3 days and costs $4,500 per occurrence.'"
  - "Use silence. After asking a question, wait. The buyer will fill the gap with real data."
  - "Capture in real time. Shared screen or whiteboard so the buyer sees their data being recorded."
  - "Validate as you go. Repeat back numbers: 'So you're saying this happens about 50 times per month?'"
  - "Lead with unconsidered needs when appropriate (Corporate Visions research)"

common_mistakes:
  - "Presenting a solution before quantifying the problem"
  - "Using vendor benchmarks without customer validation"
  - "Accepting 'a lot' or 'significant' without quantifying"
  - "Running over time and losing executive attention"
  - "Not sending follow-up within 24 hours"
