# VE Industry Benchmarks Reference
# Key performance indicators and benchmark ranges per vertical
# Used to pre-populate business case assumptions before customer-specific data is available
# Sources: Forrester TEI studies, IDC Business Value, McKinsey, Gartner, SEC filings, industry associations

benchmark_sources:
  - name: Forrester TEI Studies
    type: Third-party validated
    access: Published studies available on vendor websites
  - name: IDC Business Value Studies
    type: Third-party validated
    access: Similar to TEI, commissioned by vendors
  - name: McKinsey / Bain Industry Reports
    type: Analyst research
    access: Published articles, HBR, mckinsey.com/insights
  - name: SEC Filings (10-K, 10-Q)
    type: Public financial data
    access: SEC EDGAR, company investor relations pages
  - name: Industry Associations
    type: Industry-specific
    examples:
      - ABA (banking)
      - HIMSS (healthcare IT)
      - MESA (manufacturing)
      - NRF (retail)

financial_services:
  typical_metrics:
    - name: Cost per trade / transaction
      benchmark_range: "$0.50 - $5.00 depending on asset class"
    - name: Regulatory compliance cost as % of revenue
      benchmark_range: "5-10% for large banks"
    - name: Fraud loss rate
      benchmark_range: "0.05-0.15% of transaction volume"
    - name: Customer acquisition cost
      benchmark_range: "$200-$500 retail banking, $2K-$10K wealth management"
    - name: Time to onboard new products
      benchmark_range: "6-18 months for regulated products"
    - name: Manual reconciliation hours per month
      benchmark_range: "500-2,000 FTE hours for mid-size bank"
    - name: IT spend as % of revenue
      benchmark_range: "7-12% for banking, 3-5% for insurance"
  common_value_drivers:
    - Regulatory compliance automation
    - Fraud detection and prevention
    - Customer onboarding acceleration
    - Manual process elimination (reconciliation, reporting)
    - Risk modeling and stress testing

healthcare:
  typical_metrics:
    - name: Cost per patient encounter
      benchmark_range: "$150-$500 depending on setting"
    - name: Claims processing time
      benchmark_range: "15-45 days average"
    - name: Claims denial rate
      benchmark_range: "5-15% of submitted claims"
    - name: Readmission rate
      benchmark_range: "10-20% within 30 days"
    - name: Clinician time on documentation vs patient care
      benchmark_range: "30-50% on documentation"
    - name: Revenue cycle length
      benchmark_range: "40-60 days average"
    - name: IT spend as % of revenue
      benchmark_range: "3-5% for health systems"
  common_value_drivers:
    - Clinical documentation time reduction
    - Claims denial reduction
    - Patient throughput improvement
    - Regulatory compliance (HIPAA, HITECH)
    - Interoperability and data exchange

manufacturing:
  typical_metrics:
    - name: OEE (Overall Equipment Effectiveness)
      benchmark_range: "60-85% (world-class > 85%)"
    - name: Unplanned downtime cost per hour
      benchmark_range: "$10K-$250K depending on industry"
    - name: Inventory carrying cost as % of value
      benchmark_range: "20-30% annually"
    - name: Supply chain lead time
      benchmark_range: "Highly variable, 2-12 weeks typical"
    - name: Quality defect rate
      benchmark_range: "0.1-5% depending on process"
    - name: Cost per unit produced
      benchmark_range: Varies by product, track improvement percentage
    - name: IT spend as % of revenue
      benchmark_range: "1-3%"
  common_value_drivers:
    - Unplanned downtime reduction
    - Quality defect reduction
    - Supply chain visibility and optimization
    - Predictive maintenance
    - Production throughput increase

retail_ecommerce:
  typical_metrics:
    - name: Customer acquisition cost (CAC)
      benchmark_range: "$10-$50 mass market, $50-$200 specialty"
    - name: Customer lifetime value (CLV)
      benchmark_range: "3-5x CAC for healthy business"
    - name: Cart abandonment rate
      benchmark_range: "65-80% for e-commerce"
    - name: Inventory turnover
      benchmark_range: "4-8x annually for general retail"
    - name: Shrinkage rate
      benchmark_range: "1-3% of revenue"
    - name: Omnichannel fulfillment cost per order
      benchmark_range: "$5-$15 depending on channel mix"
    - name: IT spend as % of revenue
      benchmark_range: "2-4%"
  common_value_drivers:
    - Customer experience and conversion improvement
    - Inventory optimization
    - Omnichannel fulfillment efficiency
    - Personalization and recommendation
    - Loss prevention

technology_saas:
  typical_metrics:
    - name: Customer acquisition cost (CAC)
      benchmark_range: "$5K-$50K enterprise, $500-$5K mid-market"
    - name: "LTV:CAC ratio"
      benchmark_range: "3:1 healthy, 5:1+ excellent"
    - name: Net revenue retention (NRR)
      benchmark_range: "100-130% for enterprise SaaS"
    - name: Time to deploy
      benchmark_range: "Days for SaaS, weeks-months for enterprise"
    - name: Mean time to resolution (MTTR)
      benchmark_range: "Minutes for P1, hours for P2"
    - name: Engineering velocity
      benchmark_range: Deployment frequency, lead time for changes
    - name: Infrastructure cost per transaction
      benchmark_range: Varies, track cost efficiency improvement
  common_value_drivers:
    - Developer productivity improvement
    - Infrastructure cost optimization
    - Deployment velocity acceleration
    - Incident reduction and faster resolution
    - Customer retention improvement

cross_industry:
  typical_metrics:
    - name: Employee productivity
      benchmark_range: "Revenue per employee varies by industry"
    - name: IT help desk cost per ticket
      benchmark_range: "$15-$40 for L1, $40-$100 for L2"
    - name: Employee turnover cost
      benchmark_range: "50-200% of annual salary to replace"
    - name: Meeting cost per hour (fully loaded)
      benchmark_range: "$50-$150 per attendee-hour"
    - name: Manual data entry error rate
      benchmark_range: "1-5% for human entry"
  common_value_drivers:
    - Process automation (RPA, workflow)
    - Employee experience and retention
    - Data quality improvement
    - Collaboration and communication efficiency
    - Security and compliance posture
