# VE Business Case Structure Reference
# Standard sections, deliverable types, and quality standards
# Sources: Forrester TEI structure, enterprise procurement requirements, VE platform best practices

business_case_sections:
  executive_summary:
    max_length: 1 page
    content:
      - "Headline metrics: ROI %, NPV, payback period"
      - "One-paragraph summary of the opportunity"
      - "Recommendation with investment ask"
    rule: Write last, after all other sections. Distill, don't introduce new content.

  current_state_analysis:
    length: 2-3 pages
    content:
      - "Description of current processes and tools"
      - "Quantified costs and inefficiencies (customer-provided data preferred)"
      - "Risk and compliance exposure with financial impact"
      - "Organizational context (growth plans, strategic initiatives, competitive pressure)"
    data_quality:
      customer_confirmed: "Marked as validated, highest confidence"
      customer_estimated: "Marked as estimate, medium confidence"
      benchmark_derived: "Marked as benchmark, lower confidence, source cited"

  proposed_solution_and_benefits:
    length: 3-5 pages
    content:
      - "Solution overview (brief, outcome-focused, not a product pitch)"
      - "Benefit categories with individual quantification"
    benefit_categories:
      cost_reduction:
        description: Direct cost savings (tool consolidation, license reduction, labor reduction)
        quantification: "Current cost - Future cost = Annual savings"
      productivity_gains:
        description: Time saved, capacity freed, throughput improved
        quantification: "Hours saved * Fully loaded hourly rate * Affected headcount"
      risk_mitigation:
        description: Reduced probability or impact of adverse events
        quantification: "Probability reduction * Expected loss = Annual risk value"
      revenue_impact:
        description: Revenue acceleration, retention improvement, expansion enablement
        quantification: "Revenue at risk * Retention improvement % = Revenue protected"
    per_benefit_requirements:
      - "Baseline metric (current state)"
      - "Target metric (future state with solution)"
      - "Improvement percentage with justification"
      - "Dollar quantification"
      - "Risk adjustment percentage (per Forrester TEI methodology)"
      - "Confidence level (HIGH / MEDIUM / LOW)"
      - "Data source (customer, benchmark, estimate)"

  investment_summary:
    length: 1-2 pages
    content:
      - "Software licensing costs (3-year view, annual breakdown)"
      - "Implementation and professional services"
      - "Internal costs (project team FTE allocation, training, change management)"
      - "Ongoing operational costs (administration, support, upgrades)"
    presentation: "Year 0 (implementation) + Year 1-3 annual costs, with total"

  financial_analysis:
    length: 1-2 pages
    content:
      - "Three-year or five-year cash flow model"
      - "NPV at customer's discount rate (use WACC if known, 10% default)"
      - "ROI percentage"
      - "Payback period (months)"
      - "Sensitivity analysis (tornado diagram or scenario table)"
    scenarios:
      conservative: "P10, low adoption, delayed implementation"
      base_case: "P50, expected adoption, on-time implementation"
      optimistic: "P90, high adoption, accelerated implementation"

  implementation_roadmap:
    length: 1 page
    content:
      - "Phased approach with milestones"
      - "Value realization timeline (when benefits start accruing)"
      - "Success metrics and measurement plan"
      - "Key dependencies and assumptions"

  appendix:
    content:
      - "Detailed calculations with cell-level formulas"
      - "Benchmark sources with citations"
      - "Methodology notes"
      - "Glossary of financial terms"

deliverable_types:
  full_business_case:
    audience: Economic buyer, investment committee
    length: 10-15 pages + appendix
    timing: After discovery workshop, before executive presentation
    format: Document (PDF/Word) + financial model (Excel)

  value_assessment:
    audience: Sales team, initial prospect qualification
    length: 2-3 pages
    timing: Early pipeline, before deep discovery
    format: Slide deck or one-pager
    basis: Industry benchmarks, minimal customer data
    purpose: Qualify opportunity for deeper VE engagement

  executive_presentation:
    audience: C-suite (CFO, COO, CTO)
    length: 10-15 slides
    timing: After business case review with champion
    narrative_arc:
      - "Current state pain (Challenger Reframe)"
      - "Quantified cost of inaction"
      - "Solution approach and expected outcomes"
      - "Financial summary (NPV, ROI, payback)"
      - "Implementation roadmap"
      - "Risk mitigation"
      - "Recommendation and next steps"

  renewal_justification:
    audience: Economic buyer approaching renewal
    length: 3-5 pages
    timing: Renewal minus 90 days
    content:
      - "Realized value to date vs original business case"
      - "Value at risk if subscription lapses"
      - "Forward-looking value for next contract period"
      - "Expansion opportunity quantification"

  self_service_calculator:
    audience: Early pipeline prospects, marketing leads
    format: Web-based interactive tool
    inputs: 5-10 high-level metrics the prospect can estimate
    output: Directional ROI range with comparison to benchmark
    purpose: Lead generation, initial qualification, prospect self-education

champion_enablement:
  description: >
    The internal sponsor must sell the deal without the VE in the room.
    All deliverables should be designed to be "forwardable."
  requirements:
    - "Self-explanatory without verbal walkthrough"
    - "Executive summary fits in one email"
    - "Key metrics visible without opening attachment"
    - "No vendor jargon, uses customer's language"
    - "Includes 'how we calculated this' for credibility"

quality_standards:
  - "Every number has a documented source (customer data, benchmark, or stated assumption)"
  - "Assumptions are explicit and enumerated, not hidden in formulas"
  - "Calculations are verifiable and reproducible"
  - "Risk adjustments applied per line item, not as blanket discount"
  - "Confidence levels stated for every value claim"
  - "No guaranteed outcomes in any deliverable"
  - "Customer's terminology and KPIs used, not vendor language"
