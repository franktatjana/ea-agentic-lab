# VE Calculation Frameworks Reference
# Domain knowledge extracted to references/ per DDR-018

tco_analysis:
  components:
    - "License/subscription costs"
    - "Infrastructure costs"
    - "Personnel costs"
    - "Training and enablement"
    - "Integration and maintenance"
    - "Opportunity cost"

roi_calculation:
  formula: "(Gain - Cost) / Cost * 100"
  factors:
    - "Time to value"
    - "Risk adjustment"
    - "Confidence level"

value_drivers:
  cost_reduction:
    - "Tool consolidation"
    - "Automation"
    - "Efficiency improvement"

  risk_reduction:
    - "Security posture improvement"
    - "Compliance achievement"
    - "Downtime prevention"

  revenue_impact:
    - "Faster time to market"
    - "Customer experience improvement"
    - "New capability enablement"
