# VE Signal Detection Reference
# Domain knowledge extracted to references/ per DDR-018

value_signals:
  keywords:
    - "ROI"
    - "payback"
    - "TCO"
    - "cost savings"
    - "efficiency"
    - "productivity"
    - "risk reduction"
    - "revenue impact"
    - "time to value"

  stakeholder_language:
    cfo: ["cost reduction", "capital efficiency", "payback period"]
    cto: ["technical debt reduction", "developer productivity", "innovation"]
    ciso: ["risk reduction", "compliance cost", "breach prevention"]
    coo: ["operational efficiency", "automation", "process improvement"]

buying_signals:
  positive:
    - "building business case"
    - "need to justify investment"
    - "proving value to board"
    - "comparing alternatives"

  negative:
    - "too expensive"
    - "can't justify"
    - "no clear ROI"
    - "budget concerns"

realization_signals:
  keywords:
    - "achieved"
    - "realized"
    - "measured"
    - "improvement"
    - "reduction"
