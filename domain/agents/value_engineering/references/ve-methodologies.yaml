# VE Methodologies Reference
# Industry-standard frameworks for value quantification, messaging, and maturity assessment
# Sources: Forrester, Bain/HBR, Corporate Visions, Value Selling Associates, Challenger, IDC, LeveragePoint

forrester_tei:
  name: Total Economic Impact (TEI)
  source: Forrester Research
  url: https://www.forrester.com/research/total-economic-impact/
  description: >
    The gold standard for third-party technology value assessments.
    Evaluates investments across four pillars with risk-adjusted, composite-organization modeling.
    Over 1,000 published TEI studies used as benchmark sources by VE teams globally.
  four_pillars:
    benefits:
      description: Quantified financial gains (cost savings, revenue increases, productivity improvements)
      method: Each benefit identified from customer interviews, individually risk-adjusted
      risk_adjustment: 5-25% per line item based on interview confidence data
    costs:
      description: Total cost of ownership including direct and indirect costs
      components:
        - Licensing and subscription
        - Implementation and professional services
        - Training and change management
        - Ongoing maintenance and support
        - Internal labor (project team, IT operations)
    flexibility:
      description: Strategic option value created by the investment
      method: Real options theory applied to future capabilities enabled but not yet deployed
      example: Platform investment creates optionality to expand into adjacent use cases without re-platforming
    risk:
      description: Probability-weighted adjustment applied to each benefit and cost line
      method: Each line item gets its own risk percentage (not blanket discount)
      example: "85% confidence on license savings, 50% confidence on productivity gains"
  composite_organization:
    description: Anonymized profile representing the typical buyer, not a single customer
    purpose: Enables broad use by prospects who match the profile characteristics
    dimensions:
      - Revenue range
      - Employee count
      - Industry vertical
      - Geographic scope
      - IT maturity level
  study_structure:
    - Executive summary with headline ROI, NPV, payback period
    - Customer interviews and methodology description
    - Benefits section with individual calculations and risk adjustments
    - Costs section with three-year cost model
    - Flexibility section with option value
    - Financial summary (NPV, ROI, payback as composite)
    - Sensitivity analysis

bain_value_pyramid:
  name: B2B Elements of Value
  source: Bain & Company
  url: https://hbr.org/2018/03/the-b2b-elements-of-value
  description: >
    40 distinct elements of value across 5 levels (pyramid structure inspired by Maslow).
    Most VE operates at Level 2 only. Companies delivering on higher levels command
    significant price premiums and loyalty.
  levels:
    table_stakes:
      level: 1
      description: Necessary but not sufficient for differentiation
      elements:
        - Meeting specifications
        - Acceptable price
        - Regulatory compliance
        - Ethical standards
    functional:
      level: 2
      description: Economic and performance value, where most VE focuses
      categories:
        economic:
          - Improved top line
          - Cost reduction
        performance:
          - Product quality
          - Scalability
          - Innovation
      elements:
        - Reduces cost
        - Saves time
        - Simplifies
        - Reduces effort
        - Organizes
        - Integrates
        - Connects
        - Reduces risk
        - Informs
    ease_of_business:
      level: 3
      description: Productivity, access, relationships, operational ease
      elements:
        - Increased availability
        - Variety
        - Configurability
        - Responsiveness
        - Expertise
        - Commitment
        - Stability
        - Cultural fit
        - Time savings
    individual:
      level: 4
      description: Personal motivations of the individual buyer
      career:
        - Network expansion
        - Marketability
        - Reputational assurance
      personal:
        - Reduced anxiety
        - Design and aesthetics
        - Growth and development
    inspirational:
      level: 5
      description: Highest-order value, rarely quantified but highly influential
      elements:
        - Vision (helps see the future)
        - Hope (optimism about direction)
        - Social responsibility (alignment with values)
  ve_implication: >
    Identify which elements matter most to each buyer persona and quantify where possible.
    Career risk reduction (Level 4) is often the hidden decision driver in enterprise deals.

corporate_visions:
  name: Corporate Visions / B2B DecisionLabs
  source: Corporate Visions (now Mediafly)
  urls:
    - https://corporatevisions.com/
    - https://b2bdecisionlabs.com/
  research_partners:
    - Dr. Zakary Tormala (Stanford)
    - Dr. Nick Lee (Warwick Business School)
  key_findings:
    unconsidered_needs:
      description: >
        Buyers cannot articulate all problems. Introducing problems they haven't identified
        increases perceived differentiation by up to 10%.
      ve_application: Discovery should surface unconsidered needs, not just confirm stated challenges
    status_quo_bias:
      description: >
        40-60% of qualified pipeline ends in "no decision." The biggest competitor is inaction.
      ve_application: Business case must defeat "do nothing" before competing on features
    why_change_vs_why_stay:
      why_change:
        context: New customer acquisition
        approach: Emphasize contrast between current state and potential future state
        language: "You're currently losing $X due to Y"
        technique: Lead with unconsidered needs to disrupt status quo
      why_stay:
        context: Renewal and expansion
        approach: Emphasize what has been accomplished
        language: "You've already achieved $X"
        technique: Focus on realized value, avoid introducing uncertainty
  three_value_conversations:
    create_value:
      stage: Prospecting and discovery
      goal: Differentiate from status quo
    elevate_value:
      stage: Business case and executive engagement
      goal: Justify the investment to economic buyer
    capture_value:
      stage: Negotiation
      goal: Protect margins with evidence-based pricing defense

value_selling_framework:
  name: ValueSelling Framework
  source: Value Selling Associates
  url: https://www.valueselling.com/
  value_hypothesis_lifecycle:
    stages:
      - name: Hypothesis creation
        description: Build initial value hypothesis from industry benchmarks and public prospect data before engagement
      - name: Hypothesis validation
        description: During discovery, replace estimates with actual customer data
      - name: Value quantification
        description: Build detailed model with customer-specific inputs and confidence levels
      - name: Mutual value plan
        description: VE and customer agree on expected outcomes, metrics, and timeline as a living document
      - name: Value realization
        description: Post-sale tracking of actual outcomes against the original hypothesis
  qualified_prospect_formula:
    dimensions:
      - name: VisionMatch
        question: Does the prospect have a business issue your solution addresses?
      - name: Value
        question: Can you quantify the financial impact?
      - name: Power
        question: Do you have access to the person who can authorize spend?
      - name: Plan
        question: Is there a compelling event or timeline driving the decision?

challenger_commercial_teaching:
  name: Challenger Sale Commercial Teaching
  source: Matthew Dixon and Brent Adamson (CEB/Gartner), 2011
  six_step_pitch:
    - step: 1
      name: The Warmer
      description: Lead with insight about a trend the buyer recognizes. Build credibility.
      example: "Most companies in your industry are struggling with X."
    - step: 2
      name: The Reframe
      description: Introduce an unconsidered perspective. The "teach" moment.
      example: "But what most don't realize is the root cause is actually Y."
    - step: 3
      name: Rational Drowning
      description: Present data, benchmarks, and quantified impact. Make cost of inaction concrete.
      example: "Companies like yours lose $X per year due to Y, compounding at Z%."
      ve_connection: This is where ROI models and TCO analyses live
    - step: 4
      name: Emotional Impact
      description: Connect data to personal or organizational story. Make it real.
      example: "Your team of 500 spends 20% of time on manual processes that could be automated."
    - step: 5
      name: A New Way
      description: Present the solution approach (not product) as the logical response
    - step: 6
      name: Your Solution
      description: Only now connect specific product capabilities to the approach

idc_value_maturity:
  name: Value Selling Maturity Model
  source: IDC (International Data Corporation)
  url: https://www.idc.com/
  stages:
    - level: 1
      name: Ad Hoc
      description: No formal VE function. Reps create their own inconsistent ROI estimates.
    - level: 2
      name: Emerging
      description: Small VE team (1-3 people) supporting only largest deals. Basic ROI calculators.
    - level: 3
      name: Defined
      description: Dedicated VE team with standardized methodology. Third-party validation commissioned.
    - level: 4
      name: Managed
      description: VE integrated at every sales stage. Value realization active post-sale. Vertical-specific content.
    - level: 5
      name: Optimized
      description: Value embedded in culture. Predictive models from historical data. Self-service assessment tools.
  benchmark: Most enterprise tech companies at Stage 2-3. Salesforce, ServiceNow among few at Stage 4-5.

dollarized_differentiation:
  name: Dollarized Differentiation / Economic Value to Customer (EVC)
  source: LeveragePoint (now Ecosystems.io family)
  url: https://www.leveragepoint.com/
  methodology:
    - step: Identify reference value (price/cost of next-best alternative)
    - step: Identify positive differentiators and quantify each in dollar terms
    - step: Identify negative differentiators and quantify shortfalls
    - step: "EVC = Reference Value + Positive Differentiation - Negative Differentiation"
  output: Value stack visualization showing total economic value vs alternative with labeled differentiator blocks
  use_case: Competitive displacement deals where prospect evaluates against specific incumbent

monte_carlo_simulation:
  name: Probabilistic ROI Ranges
  description: >
    Move beyond single-point ROI estimates by assigning probability distributions
    to each input variable and running 1,000-10,000 simulation iterations.
  output_format:
    p10: "10th percentile, conservative worst realistic case"
    p50: "50th percentile, median most likely outcome"
    p90: "90th percentile, optimistic best realistic case"
  example: >
    90% probability ROI exceeds 150% (P10),
    50% probability exceeds 250% (P50),
    10% probability exceeds 400% (P90)
  tools:
    - Crystal Ball (Oracle)
    - "@RISK (Palisade)"
    - Python (numpy/scipy)
    - Excel with VBA macros
  credibility: CFOs and finance teams trust ranges more than suspiciously precise single numbers
