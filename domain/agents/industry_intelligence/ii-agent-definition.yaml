    - text/plain

# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:
  profile:
    role_context: >
      Enterprise sales conversations need industry context. Buyers expect their
      vendors to understand regulatory shifts, market dynamics, and
      vertical-specific challenges that shape technology decisions. Building
      this context manually across multiple verticals doesn't scale.
    challenges:
      - "Industry knowledge is inconsistent across the team"
      - "Regulatory changes surface too late for deal positioning"
      - "Vertical-specific messaging requires hours of manual research"
    administrative_overhead:
      - "Reading industry analyst reports and extracting relevant takeaways"
      - "Monitoring regulatory body announcements across multiple verticals"
      - "Summarizing vertical trends into internal enablement materials"
    capabilities:
      - "Industry trend analysis"
      - "Regulatory shift monitoring"
      - "Vertical-specific insights"

  fallback_model: null
  prompt_registry:
    ii-industry-deep-dive:
      description: Comprehensive industry structure and dynamics analysis
      source: prompts/tasks.yaml#industry_analysis.industry_deep_dive
      inputs:
      - title: company_name
        type: string
      - title: industry
        type: string
      - title: realm_id
        type: string
      - title: regions
        type: string
      - title: source_registry
        type: string
      - title: sub_industry
        type: string
      outputs:
      - title: industry-deep-dive_result
        type: object
    ii-sector-comparison:
      description: Compare company positioning against industry benchmarks
      source: prompts/tasks.yaml#industry_analysis.sector_comparison
      inputs:
      - title: company_name
        type: string
      - title: company_profile
        type: string
      - title: industry
        type: string
      - title: industry_benchmarks
        type: string
      outputs:
      - title: sector-comparison_result
        type: object
    ii-regulatory-scan:
      description: Scan for regulations affecting the customer's industry
      source: prompts/tasks.yaml#regulatory.regulatory_scan
      inputs:
      - title: company_name
        type: string
      - title: existing_regulatory
        type: string
      - title: industry
        type: string
      - title: realm_id
        type: string
      - title: regions
        type: string
      outputs:
      - title: regulatory-scan_result
        type: object
    ii-regulatory-impact-assessment:
      description: Assess impact of a specific regulatory change on engagement
      source: prompts/tasks.yaml#regulatory.regulatory_impact_assessment
      inputs:
      - title: active_nodes
        type: string
      - title: company_name
        type: string
      - title: company_profile
        type: string
      - title: regulation_details
        type: string
      - title: regulation_name
        type: string
      outputs:
      - title: regulatory-impact-assessment_result
        type: object
    ii-trend-identification:
      description: Identify and classify industry trends
      source: prompts/tasks.yaml#trends.trend_identification
      inputs:
      - title: industry
        type: string
      - title: industry_profile
        type: string
      - title: previous_trends
        type: string
      - title: realm_id
        type: string
      - title: recent_news_digest
        type: string
      outputs:
      - title: trend-identification_result
        type: object
    ii-trend-impact-analysis:
      description: Deep analysis of a specific trend's impact on engagement
      source: prompts/tasks.yaml#trends.trend_impact_analysis
      inputs:
      - title: active_nodes
        type: string
      - title: company_profile
        type: string
      - title: realm_id
        type: string
      - title: trend_details
        type: string
      - title: trend_name
        type: string
      outputs:
      - title: trend-impact-analysis_result
        type: object
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information,
      and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not research individual company structure (that's Account Intelligence Agent's job) (handoff
    to Leadership)
  - Does not monitor daily news feeds (that's MNA Agent's job) (handoff to Leadership)
  - Does not analyze competitor-specific positioning (that's CI Agent's job) (handoff to Leadership)
  - Does not scan technology adoption at company level (that's Technology Scout's job) (handoff to Leadership)
  - Does not make commercial or pricing recommendations (that's AE Agent's job) (handoff to Leadership)
  - Does not generate customer-facing content (handoff to Leadership)
  - Does not access paid full-text analyst reports without authorization (handoff to Leadership)
  - Does not predict regulatory outcomes or lobby positions (handoff to Leadership)
  permissions:
  - Analyze industry structure, market dynamics, and competitive landscape at sector level
  - Track regulatory changes and compliance requirements affecting customer industries
  - Identify and classify industry trends by maturity and vendor relevance
  - Extract industry benchmarks and best practices from analyst reports
  - Monitor sector-level developments that create opportunities or threats
  - Produce structured industry profiles for realm context
  - Register all sources in shared source registry for cluster-wide reuse
  escalation_triggers:
  - Critical issue detected (to Leadership)
  - Information uncertainty requiring human verification
  handoffs:
    human_escalation: Leadership
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Regulatory changes with compliance deadlines (time-sensitive, creates urgency)
    - Industry trends directly affecting active engagements
    - Market dynamics and competitive landscape at sector level
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    references:
    - path: references/research_sources.yaml
      description: Primary Sources, Secondary Sources
      load_when: Performing tasks related to research sources
  assets:
  - name: artifacts
    filename: '{account}-artifacts.md'
    description: artifacts
  - name: signals
    filename: '{account}-signals.md'
    description: signals
  quality:
  - All claims supported by evidence
  - No assumed dynamics
  - Sources cited
