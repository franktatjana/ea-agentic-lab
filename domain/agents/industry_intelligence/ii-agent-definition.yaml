x-ea-agent:
  profile:
    why: 'Industry context decays faster than teams can maintain it. Regulatory changes, market shifts, and vertical trends affect how customers evaluate technology investments, but tracking these dynamics across multiple industries manually does not scale. SAs enter customer conversations without knowing recent regulatory shifts, miss vertical-specific positioning opportunities, and reuse generic messaging instead of industry-tailored narratives. The operational cost is engagements that lack credibility with industry-savvy buyers and positioning that ignores the sector dynamics shaping the customer''s priorities.

      '
    human_matters_goal: 'Every industry profile is structured, every regulatory change is tracked, but the engagement succeeds because the industry expert connects sector dynamics to customer-specific strategy
      no model can replicate.

      '
    role_tab_intro: 'An II analyst tracks sector dynamics, regulatory shifts, and vertical trends across multiple industries simultaneously. The challenges below are where industry context gets stale, regulatory
      changes get missed, and vertical messaging falls flat, each mapped to the sub-agent built to handle it.

      '
    goals_summary: 'The II analyst succeeds when industry profiles stay current, regulatory changes surface before they affect deals, and vertical messaging is consistent across all account teams.

      '
    role_context: 'Enterprise sales conversations need industry context. Buyers expect their vendors to understand regulatory shifts, market dynamics, and vertical-specific challenges that shape technology
      decisions. Building this context manually across multiple verticals doesn''t scale.

      '
    goals:
    - Maintain current industry profiles for all active verticals, refreshed within 30 days of major developments
    - Surface regulatory changes with compliance deadlines at least 30 days before they affect deal positioning
    - Reduce vertical-specific research time by 75% per customer engagement
    - Achieve consistent industry messaging across all account teams within the same vertical
    - Track and classify industry trends by maturity stage with vendor relevance scoring
    - Produce structured industry benchmarks extracted from analyst reports within 5 business days of publication
    - Monitor sector-level developments across all active customer industries continuously
    - Register all intelligence sources in shared source registry for cluster-wide reuse
    - Deliver regulatory impact assessments within 48 hours of significant regulatory announcements
    - Map industry pain points to vendor capabilities for at least 3 verticals per quarter
    - Provide industry context briefs for every new enterprise engagement within 24 hours of request
    - Generate pre-built vertical messaging frameworks that reps can use without additional research
    - Track regulatory compliance deadlines with zero missed deadlines across active engagements
    - Identify cross-vertical patterns that create horizontal positioning opportunities
    key_responsibilities:
    - 'Industry Structure Analysis: analyze market dynamics, competitive landscape, value chain structure, and growth drivers at the sector level for customer verticals'
    - 'Regulatory Scanning: monitor regulatory body announcements, track compliance deadlines, and identify regulations affecting customer industries across multiple jurisdictions'
    - 'Regulatory Impact Assessment: evaluate how specific regulatory changes affect active engagements, customer priorities, and budget allocation'
    - 'Trend Identification: identify and classify industry trends by maturity stage (emerging, growing, mature, declining) with vendor relevance scoring'
    - 'Trend Impact Analysis: assess how specific trends reshape customer operations, create opportunities, or threaten existing positioning'
    - 'Industry Benchmarking: extract and structure industry benchmarks and best practices from analyst reports for vertical-specific positioning'
    - 'Sector Comparison: compare company positioning against industry benchmarks to identify gaps and differentiation opportunities'
    - 'Industry Profile Maintenance: produce and maintain structured industry profiles covering market dynamics, competitive landscape, and regulatory context'
    - 'Vertical Messaging Frameworks: build pre-built vertical messaging that maps industry pain points to product capabilities with supporting data'
    - 'Source Registry Management: register all intelligence sources in shared source registry for cluster-wide reuse and cross-agent reference'
    - 'Cross-Vertical Pattern Recognition: identify patterns across verticals that create horizontal positioning opportunities'
    - 'Analyst Report Processing: extract relevant takeaways from industry analyst reports and synthesize into actionable intelligence'
    - 'Industry Context Briefing: deliver rapid industry context briefs for new engagement preparation'
    - 'Compliance Timeline Tracking: maintain compliance deadline calendars across active customer industries'
    - 'Sector Signal Monitoring: monitor sector-level developments that create opportunities or threats for active engagements'
    - 'Intelligence Distribution: distribute structured industry intelligence to account teams, SAs, and leadership for consistent vertical positioning'
    key_metrics:
    - 'Industry profile coverage: percentage of active verticals with current industry profiles (target >= 90%)'
    - 'Regulatory lead time: average days between regulatory change detection and team notification (target >= 30 days before deal impact)'
    - 'Vertical research time reduction: time saved per engagement through pre-built industry context (target >= 75% reduction)'
    - 'Industry messaging consistency: percentage of account teams using standardized vertical messaging (target >= 85%)'
    - 'Trend classification accuracy: percentage of identified trends confirmed by analyst reports within 6 months (target >= 70%)'
    - 'Source registry utilization: percentage of intelligence outputs with registered, reusable sources (target >= 95%)'
    - 'Benchmark freshness: average age of industry benchmarks in active profiles (target <= 90 days)'
    stakeholder_landscape:
      customer_side:
      - "Industry Analyst Firms (Gartner, Forrester, IDC): primary sources for market sizing, trend validation, and competitive landscape data"
      - "Regulatory Bodies: source of compliance requirements, policy changes, and enforcement timelines"
      - "Industry Associations: sector-specific standards, best practices, and benchmarking data"
      - "Financial Analysts: earnings reports, market forecasts, and sector investment trends"
      internal_team:
      - "Account Executive: consumes industry context for customer conversations, deal positioning, and vertical messaging"
      - "Solution Architect: uses industry benchmarks and regulatory context for technical proposal alignment"
      - "Field CTO: leverages industry trends for technology vision and cross-account pattern synthesis"
      - "Competitive Intelligence: uses industry structure data for competitive analysis and positioning"
      - "Sales Leadership: consumes sector-level intelligence for territory planning and vertical strategy"
      - "Customer Architect: uses industry context for customer health assessment and renewal preparation"
    scenarios:
    - problem: Regulatory changes are missed until deal positioning is too late
      why: 'New regulations and compliance deadlines reshape customer priorities and budget allocation. When the team learns about a regulatory shift after competitors have already positioned against it,
        the window for differentiation has closed and the deal strategy needs rework.

        '
      agent: ii-agent
      agent_response: 'The agent scans for regulations affecting customer industries, tracks compliance deadlines, and assesses the impact of regulatory changes on active engagements. It produces structured
        regulatory briefs that connect compliance requirements to vendor capabilities, giving deal teams positioning material before competitors react.

        '
      success_signal:
        metric: Regulatory change awareness lead time
        target: Surface regulatory changes with compliance deadlines at least 30 days before they affect deal positioning
        leading_indicator: Deal teams reference regulatory context in customer conversations
        failure_signal: Regulatory shifts are discovered through customer objections or competitor positioning
    - problem: Industry context is inconsistent across account teams
      why: 'Different reps approach the same vertical with varying levels of industry knowledge. Some spend hours reading analyst reports, others rely on outdated talking points. The inconsistency weakens
        credibility when customers expect their vendor to understand sector-specific challenges.

        '
      agent: ii-agent
      agent_response: 'The agent produces structured industry profiles covering market dynamics, competitive landscape, and trend classifications by maturity stage. It extracts benchmarks from analyst reports
        and creates a shared industry intelligence baseline that any team member can reference for consistent vertical positioning.

        '
      success_signal:
        metric: Industry profile coverage and freshness
        target: Maintain current industry profiles for all active verticals, refreshed within 30 days of major developments
        leading_indicator: Reps across the team use consistent industry messaging in customer meetings
        failure_signal: Account teams present contradictory industry narratives to the same customer
    - problem: Vertical-specific messaging requires hours of manual research
      why: 'Tailoring a pitch to a specific vertical means reading analyst reports, understanding regulatory context, and mapping industry pain points to product capabilities. This research takes hours
        per vertical, and the results are rarely shared or reused, so the next rep repeats the same work.

        '
      agent: ii-agent
      agent_response: 'The agent pre-builds vertical messaging frameworks that map industry pain points to product capabilities with supporting data from analyst reports and regulatory sources. It generates
        ready-to-use talk tracks, objection handling, and customer-relevant proof points per vertical, cutting research time from hours to minutes.

        '
      success_signal:
        metric: Vertical messaging preparation time
        target: Reduce vertical-specific research time by 75% per customer engagement
        leading_indicator: Pre-built vertical frameworks are referenced in deal preparation notes
        failure_signal: Reps spend more than 2 hours on vertical research before a single customer meeting
    challenges:
    - text: Industry knowledge is inconsistent across the team, leading to contradictory vertical narratives in customer conversations
      solved_by: ii-industry-analysis-agent
      category: Industry Structure and Market Dynamics
      specific_overhead:
      - Reading industry analyst reports and extracting relevant takeaways
      - Cross-referencing multiple analyst sources to validate industry claims
    - text: Industry profiles go stale between refresh cycles because nobody tracks when market events invalidate current analysis
      solved_by: ii-industry-analysis-agent
      category: Industry Structure and Market Dynamics
      specific_overhead:
      - Manually checking whether recent M&A activity or market shifts have changed the competitive landscape for a vertical
      - Re-reading analyst reports that may have been updated since the last profile build
    - text: Vertical-specific messaging requires hours of manual research per customer engagement
      solved_by: ii-industry-analysis-agent
      category: Vertical Messaging and Positioning
      specific_overhead:
      - Summarizing vertical trends into internal enablement materials
      - Mapping industry pain points to product capabilities without a reusable framework
    - text: Analyst report insights are consumed individually rather than synthesized across sources, producing fragmented industry views
      solved_by: ii-industry-analysis-agent
      category: Vertical Messaging and Positioning
      specific_overhead:
      - Reading multiple analyst reports on the same vertical without a structured extraction framework
      - Reconciling conflicting analyst perspectives on market size, growth drivers, or competitive positioning
    - text: Regulatory changes surface too late for deal positioning, after competitors have already adapted their messaging
      solved_by: ii-regulatory-agent
      category: Regulatory Scanning and Monitoring
      specific_overhead:
      - Monitoring regulatory body announcements across multiple verticals and jurisdictions
      - Tracking compliance deadline calendars for each active customer industry
    - text: Regulatory changes in adjacent jurisdictions are overlooked because scanning is limited to the customer's primary market
      solved_by: ii-regulatory-agent
      category: Regulatory Scanning and Monitoring
      specific_overhead:
      - Expanding regulatory scans beyond the customer's home market to include relevant international regulations
      - Identifying which cross-border regulatory shifts create positioning opportunities or compliance risks
    - text: Regulatory impact on active engagements is assessed ad hoc with no structured methodology, causing inconsistent risk evaluation
      solved_by: ii-regulatory-agent
      category: Regulatory Impact and Compliance
      specific_overhead:
      - Manually evaluating how each regulatory change affects specific deals and customer priorities
      - Coordinating with legal and compliance teams to validate regulatory interpretations
    - text: Compliance deadline tracking is manual and fragmented across spreadsheets, risking missed deadlines that affect deal timing
      solved_by: ii-regulatory-agent
      category: Regulatory Impact and Compliance
      specific_overhead:
      - Maintaining separate compliance calendars per customer vertical in personal spreadsheets
      - Cross-checking whether upcoming compliance dates affect active deal timelines
    - text: Industry trends are identified reactively after competitors have already positioned against them
      solved_by: ii-trends-agent
      category: Trend Identification and Classification
      specific_overhead:
      - Scanning analyst reports, news, and conference proceedings for emerging trends
      - Classifying trend maturity and assessing vendor relevance without a structured methodology
    - text: Trend maturity classification is subjective without a structured methodology, leading to premature or delayed positioning recommendations
      solved_by: ii-trends-agent
      category: Trend Identification and Classification
      specific_overhead:
      - Assessing whether a trend is emerging, growing, or mature based on personal judgment rather than evidence criteria
      - Disagreements across team members on whether a trend warrants proactive positioning or watchful waiting
    - text: Cross-vertical patterns go undetected because industry analysis is siloed per account team
      solved_by: ii-trends-agent
      category: Cross-Vertical Pattern Analysis
      specific_overhead:
      - Comparing industry dynamics across verticals to find horizontal positioning opportunities
      - Synthesizing field observations with formal analyst research to validate cross-sector signals
    - text: Sector signal monitoring lacks consistent coverage because scanning priority shifts with deal urgency rather than strategic importance
      solved_by: ii-trends-agent
      category: Cross-Vertical Pattern Analysis
      specific_overhead:
      - Deprioritizing industry scanning for verticals without active deals, creating blind spots when new engagements start
      - Reacting to leadership requests for industry context rather than maintaining a proactive scanning cadence
    administrative_overhead:
    - Reading industry analyst reports and extracting relevant takeaways
    - Monitoring regulatory body announcements across multiple verticals
    - Summarizing vertical trends into internal enablement materials
    capabilities:
    - Industry trend analysis
    - Regulatory shift monitoring
    - Vertical-specific insights
    human_matters_summary: 'Industry data is background; industry judgment is strategy. The agent identifies sector trends and regulatory changes, but the industry expert brings deep context on what those
      changes mean for customer operations, how budget cycles shift with regulation, and which trends signal genuine industry inflection. The trend is documented, but human expertise frames it for engagement.

      '
    playbook_raci:
      context: >
        The Industry Intelligence Analyst owns 2 industry research playbooks and contributes
        market context to playbooks led by other roles.
      responsible:
        - playbook: Industry Deep Dive (PB_II_001)
          scope: Comprehensive industry analysis, market dynamics, regulatory landscape
          team: industry_intelligence
          file: PB_II_001_industry_deep_dive.yaml
        - playbook: Trend Analysis (PB_II_002)
          scope: Industry trend identification, impact assessment, strategic implications
          team: industry_intelligence
          file: PB_II_002_trend_analysis.yaml
      accountable:
        - playbook: Industry Deep Dive (PB_II_001)
          scope: II Lead validates industry analysis depth and source credibility
          team: industry_intelligence
          file: PB_II_001_industry_deep_dive.yaml
        - playbook: Trend Analysis (PB_II_002)
          scope: II Lead approves trend classification and impact ratings
          team: industry_intelligence
          file: PB_II_002_trend_analysis.yaml
      consulted:
        - playbook: Account Planning (PB_AE_002)
          scope: Industry context and market dynamics for account strategy
          team: account_executives
          file: PB_AE_002_account_planning.yaml
        - playbook: Technology Vision (PB_FCTO_003)
          scope: Industry-specific technology adoption patterns for vision planning
          team: field_cto
          file: PB_FCTO_003_technology_vision.yaml
        - playbook: Five Forces Competitive Analysis (PB_CI_001)
          scope: Industry structure and competitive dynamics for competitive analysis
          team: competitive_intelligence
          file: PB_CI_001_five_forces.yaml
      informed:
        - playbook: Field Intelligence (PB_FCTO_004)
          scope: Receives field-observed industry signals for validation against research
          team: field_cto
          file: PB_FCTO_004_field_intelligence.yaml
        - playbook: Cross-Account Pattern Synthesis (PB_FCTO_001)
          scope: Receives cross-account patterns contextualized by industry
          team: field_cto
          file: PB_FCTO_001_cross_account_pattern_synthesis.yaml
    with_this_agent:
    - domain: Industry Structure and Market Dynamics
      agent: ii-industry-analysis-agent
      items:
      - 'Industry Profiles: Get structured industry profiles covering market dynamics, competitive landscape, and growth drivers for any active vertical'
      - 'Sector Comparison: Compare company positioning against industry benchmarks to identify gaps and differentiation angles'
      - 'Benchmarking: Quantify performance gaps against sector peers to build a credible case for change in customer conversations'
    - domain: Vertical Messaging and Positioning
      agent: ii-industry-analysis-agent
      items:
      - 'Vertical Messaging Frameworks: Access pre-built frameworks that map industry pain points to product capabilities for faster deal preparation'
      - 'Industry Context Briefings: Receive concise industry briefings that give engagement teams the context needed for credible first meetings'
    - domain: Analyst Report Processing and Profile Maintenance
      agent: ii-industry-analysis-agent
      items:
      - 'Analyst Report Processing: Extract and synthesize key takeaways from Gartner, Forrester, and IDC reports into actionable intelligence'
      - 'Industry Profile Maintenance: Keep vertical profiles current with a 30-day refresh cycle so teams always work from accurate sector data'
    - domain: Regulatory Scanning and Monitoring
      agent: ii-regulatory-agent
      items:
      - 'Regulatory Scanning: Track regulations affecting customer industries across multiple jurisdictions with compliance deadlines'
      - 'Jurisdiction Coverage: Monitor regulatory developments across relevant geographies so no enforcement deadline surfaces as a surprise'
    - domain: Regulatory Impact Assessment and Compliance
      agent: ii-regulatory-agent
      items:
      - 'Impact Assessment: Assess how specific regulatory changes affect active engagements, customer priorities, and budget allocation'
      - 'Compliance Timelines: Maintain compliance deadline calendars so deal teams can position ahead of enforcement dates'
      - 'Regulatory Briefs: Receive concise briefs connecting compliance obligations to vendor capabilities for use in customer conversations'
    - domain: Trend Identification and Classification
      agent: ii-trends-agent
      items:
      - 'Trend Identification: Identify and classify industry trends by maturity stage with vendor relevance scoring'
      - 'Trend Impact: Analyze how specific trends reshape customer operations and create engagement opportunities'
    - domain: Cross-Vertical Pattern Analysis
      agent: ii-trends-agent
      items:
      - 'Cross-Vertical Patterns: Detect patterns across verticals that create horizontal positioning opportunities'
      - 'Sector Signal Monitoring: Surface weak signals from adjacent sectors before they become mainstream in a customer''s primary vertical'
    - domain: Source Management and Intelligence Distribution
      agent: ii-industry-analysis-agent
      items:
      - 'Source Registry: Manage the registry of approved intelligence sources with quality ratings and coverage gaps flagged for review'
      - 'Intelligence Distribution: Route synthesized intelligence packages to the right agents and deal teams based on engagement context'
      - 'Coverage Audits: Identify gaps in vertical and regulatory coverage so source registry stays aligned with active account mix'
    public_resources:
    - title: IBISWorld Industry Research Methodology
      url: https://help.ibisworld.com/en/collections/10450356-methodology
      context: Industry analysis methodology covering data sourcing, forecasting, and quality control for sector-level research
    - title: Gartner Research Methodologies
      url: https://www.gartner.com/en/research/methodologies
      context: Proprietary research frameworks including Magic Quadrant, Hype Cycle, and Market Guide for technology market analysis
    - title: Statista Market Insights Methodology
      url: https://www.statista.com/outlook/methodology
      context: Six-step data creation process (sourcing, processing, modelling, forecasting, quality control, updating) for industry statistics
    - title: Corporate Finance Institute Industry Analysis Methods
      url: https://corporatefinanceinstitute.com/resources/management/industry-analysis-methods/
      context: Top 3 industry analysis methods including Porter Five Forces, PEST analysis, and competitive positioning frameworks
    - title: CUBE Regulatory Intelligence
      url: https://cube.global/
      context: Automated regulatory intelligence platform for monitoring regulatory change across jurisdictions and mapping to compliance obligations
    - title: Euromonitor Trend Analysis Methodology
      url: https://www.euromonitor.com/who-we-are/research-methods/trend-analysis
      context: Structured trend analysis methodology combining quantitative data with qualitative research for market trend identification
    activity_map:
      purpose: 'The II analyst exists to provide sector-level intelligence that engagement teams need for credible, vertical-specific customer conversations. The orchestrator routes requests to 3 specialized
        sub-agents covering 8 domains of the industry intelligence lifecycle. Multiple domains per sub-agent reflect that each agent owns a coherent capability cluster, not a single narrow task.

        '
      domains:
      - domain: Industry Structure and Market Dynamics
        why: 'Engagement teams need structured industry context to position credibly in customer conversations. Without consistent sector-level analysis, reps approach the same vertical with varying depth
          and accuracy, creating uneven customer experiences and weakening competitive credibility.

          '
        agent: ii-industry-analysis-agent
        contributing_agents:
        - agent: ii-trends-agent
          provides: Trend maturity data for industry profile enrichment
        - agent: ii-regulatory-agent
          provides: Regulatory landscape context for industry profiles
        activities:
        - Comprehensive industry structure and market dynamics analysis
        - Sector comparison and benchmarking against industry standards
        - Competitive landscape mapping within the vertical
        cadence: per-vertical, triggered by new engagement or 30-day refresh cycle
      - domain: Vertical Messaging and Positioning
        why: 'Vertical messaging frameworks shorten deal preparation time and ensure consistent positioning across the field. When messaging is built ad hoc, the same industry pain point gets framed
          differently by different reps, reducing team coherence in competitive situations.

          '
        agent: ii-industry-analysis-agent
        contributing_agents:
        - agent: ii-trends-agent
          provides: Trend-driven pain points for messaging relevance
        activities:
        - Vertical messaging framework construction mapping pain points to product capabilities
        - Industry context briefing production for new engagement preparation
        - Messaging refresh triggered by major market or competitive shifts
        cadence: per-vertical, refreshed when industry profile or product positioning changes
      - domain: Analyst Report Processing and Profile Maintenance
        why: 'Analyst reports from Gartner, Forrester, and IDC contain high-value intelligence that is rarely translated into actionable field content. Without systematic processing, insights stay locked
          in PDF attachments and never reach deal teams before windows close.

          '
        agent: ii-industry-analysis-agent
        activities:
        - Analyst report ingestion and key takeaway extraction
        - Industry profile maintenance and scheduled refresh
        - Source quality scoring and coverage gap identification
        cadence: triggered by new analyst publications, profiles refreshed on 30-day cycle
      - domain: Regulatory Scanning and Monitoring
        why: 'Regulatory change happens continuously across jurisdictions and can shift a customer''s priorities overnight. Teams without systematic scanning rely on customers to surface regulatory news,
          surrendering the first-mover advantage that proactive positioning provides.

          '
        agent: ii-regulatory-agent
        contributing_agents:
        - agent: ii-industry-analysis-agent
          provides: Vertical coverage scope for jurisdiction prioritization
        activities:
        - Continuous regulatory scanning across jurisdictions for all active verticals
        - Regulatory signal classification by relevance, urgency, and jurisdictional scope
        - New regulation alerts routed to relevant deal teams and agents
        cadence: continuous, alert triggered within 24 hours of material regulatory announcement
      - domain: Regulatory Impact Assessment and Compliance
        why: 'Knowing a regulation exists is not enough. Deal teams need to understand how a specific regulation affects a specific customer''s priorities and budget, and which vendor capabilities address
          the compliance obligation, or the regulatory context remains background noise.

          '
        agent: ii-regulatory-agent
        contributing_agents:
        - agent: ii-industry-analysis-agent
          provides: Industry structure context for assessing operational impact
        activities:
        - Regulatory impact assessment on active engagements and deal priorities
        - Compliance timeline tracking and enforcement deadline calendar maintenance
        - Regulatory brief production connecting compliance obligations to vendor capabilities
        cadence: triggered by new regulatory announcement or deal team request
      - domain: Trend Identification and Classification
        why: 'Trend identification only creates value when trends are classified by maturity stage and scored for vendor relevance. Raw trend lists without maturity context lead teams to over-invest in
          early-stage signals or miss adoption windows on trends that are already reshaping buyer priorities.

          '
        agent: ii-trends-agent
        contributing_agents:
        - agent: ii-industry-analysis-agent
          provides: Industry structure context for trend relevance scoring
        - agent: ii-regulatory-agent
          provides: Regulatory drivers that accelerate or constrain trend adoption
        activities:
        - Industry trend identification from primary and secondary sources
        - Trend classification by maturity stage with vendor relevance scoring
        - Trend-to-vendor-capability mapping for deal positioning
        - Trend impact analysis on active engagements
        cadence: continuous monitoring, deep analysis triggered by trend detection or engagement request
      - domain: Cross-Vertical Pattern Analysis
        why: 'Patterns that originate in one vertical frequently propagate to adjacent sectors before analysts formally document the shift. Detecting these cross-vertical signals early gives engagement
          teams a positioning window that is unavailable to teams relying solely on vertical-specific sources.

          '
        agent: ii-trends-agent
        contributing_agents:
        - agent: ii-industry-analysis-agent
          provides: Vertical structure data for cross-sector pattern contextualization
        activities:
        - Cross-vertical pattern detection and horizontal opportunity identification
        - Sector signal monitoring for weak signals from adjacent industries
        - Pattern synthesis into horizontal positioning recommendations
        cadence: continuous, synthesis produced when pattern confidence threshold is reached
      - domain: Source Management and Intelligence Distribution
        why: 'Intelligence quality depends on the quality and coverage of the source registry. Without active source management and deliberate distribution routing, the system produces uneven depth
          across verticals and insights fail to reach the deal teams and agents that need them.

          '
        agent: ii-industry-analysis-agent
        activities:
        - Source registry management with quality ratings and coverage gap flagging
        - Intelligence package assembly and distribution to deal teams and downstream agents
        - Coverage audit against active account mix to identify vertical or regulatory blind spots
        cadence: source registry reviewed monthly, distribution triggered by intelligence production
    sub_agents:
    - name: II Industry Analysis Agent
      id: ii-industry-analysis-agent
      purpose: Comprehensive industry structure analysis, sector comparison, benchmarking, and vertical messaging frameworks
    - name: II Regulatory Agent
      id: ii-regulatory-agent
      purpose: Regulatory scanning across jurisdictions, impact assessment on active engagements, compliance deadline tracking
    - name: II Trends Agent
      id: ii-trends-agent
      purpose: Industry trend identification and classification by maturity stage, trend impact analysis, cross-vertical pattern detection
    collaboration:
      defer_to:
        ai_agent:
          scope: Individual company structure, org charts, financial analysis at account level
          scenarios:
          - trigger: Intelligence request requires company-specific research rather than sector-level analysis
            context_passed: Industry context, sector benchmarks, vertical positioning relevant to the company
            receiver_action: Account-level deep dive with company-specific data sources
        ci_agent:
          scope: Competitor-specific positioning, competitive battlecards, win/loss analysis
          scenarios:
          - trigger: Analysis requires competitor-specific positioning rather than industry-wide competitive landscape
            context_passed: Industry competitive dynamics, market share data, sector-level competitive positioning
            receiver_action: Competitor-specific battlecard creation, deal-level competitive strategy
        mna_agent:
          scope: Daily news monitoring, real-time event detection, breaking news analysis
          scenarios:
          - trigger: Request requires real-time news monitoring rather than structured industry analysis
            context_passed: Industry context, known trends, regulatory landscape for signal relevance filtering
            receiver_action: News event detection, real-time signal processing, breaking development alerts
        ti_agent:
          scope: Technology adoption at company level, technology stack analysis
          scenarios:
          - trigger: Analysis requires company-level technology adoption rather than sector-level technology trends
            context_passed: Industry technology adoption patterns, sector-level digital maturity benchmarks
            receiver_action: Company-specific technology stack assessment, adoption readiness evaluation
      provide_to:
        ae_agent:
          scope: Industry context for deal positioning, vertical messaging, and customer conversation preparation
          scenarios:
          - trigger: New enterprise engagement or deal preparation requires industry context
            context_passed: Industry profile, vertical messaging framework, regulatory briefs, trend summaries
            receiver_action: Incorporate industry context into deal strategy, customer presentations, and positioning
          - trigger: Regulatory change affects active deal positioning
            context_passed: Regulatory impact assessment, compliance timeline, vendor capability alignment
            receiver_action: Adjust deal positioning and customer messaging to address regulatory context
        sa_agent:
          scope: Industry benchmarks and regulatory context for technical proposal alignment
          scenarios:
          - trigger: Technical proposal requires industry-specific context and benchmarks
            context_passed: Industry benchmarks, sector comparison data, regulatory requirements affecting architecture
            receiver_action: Align technical proposal with industry standards and regulatory compliance requirements
        fcto_agent:
          scope: Industry trends and sector dynamics for technology vision and cross-account patterns
          scenarios:
          - trigger: Technology vision planning requires industry trend context
            context_passed: Industry trends by maturity stage, sector-level technology adoption patterns, regulatory drivers
            receiver_action: Incorporate industry trends into technology vision, validate cross-account patterns against sector data
        ci_agent:
          scope: Industry structure and competitive dynamics for competitive analysis
          scenarios:
          - trigger: Competitive analysis requires industry-level context
            context_passed: Industry competitive landscape, market structure, sector dynamics, growth drivers
            receiver_action: Contextualize competitive positioning within industry structure and market dynamics
        ca_agent:
          scope: Industry context for customer health assessment and renewal preparation
          scenarios:
          - trigger: Customer health assessment or renewal requires industry context
            context_passed: Industry trends affecting the customer, regulatory changes, sector benchmarks for health scoring
            receiver_action: Factor industry dynamics into customer health scoring and renewal strategy
        senior_manager_agent:
          scope: Sector-level intelligence for territory planning and vertical strategy decisions
          scenarios:
          - trigger: Leadership needs sector-level intelligence for strategic planning
            context_passed: Industry profiles, trend summaries, regulatory landscape, cross-vertical patterns
            receiver_action: Inform territory planning, vertical investment decisions, and team enablement priorities
