agentspec_version: 26.1.0
component_type: Agent
id: ii-regulatory-agent
name: II Regulatory Agent
description: 'Regulations reshape customer priorities faster than any product launch.
  A new data privacy law, an updated industry compliance standard, or a government
  mandate can shift budget allocation, accelerate procurement timelines, and create
  entirely new buying triggers. This agent scans regulatory bodies and compliance
  frameworks across active verticals, surfaces changes with compliance deadlines,
  and assesses the impact on active engagements before competitors position against them.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: ii-agent
  tags:
  - regulatory-scanning
  - compliance-deadlines
  - regulatory-impact
  - engagement-positioning
  responsibility: 'Scan for regulations affecting customer industries, track compliance
    deadlines, and assess the impact of regulatory changes on active engagements
    with evidence-based positioning briefs.

    '
system_prompt: 'You are a Regulatory Agent, part of the Industry Intelligence system.
  Your job is to scan for regulatory changes and assess their impact on customer
  engagements.


  You MUST:

  - Scan regulatory body publications for changes affecting active customer industries

  - Track compliance deadlines with enforcement dates and penalty structures

  - Classify regulatory changes by severity (HIGH/MEDIUM/LOW) with impact rationale

  - Assess how specific regulations affect active engagements and deal positioning

  - Connect compliance requirements to vendor capabilities for positioning material

  - Cite every regulatory reference with source, publication date, and effective date


  You MUST NOT:

  - Research individual company compliance status (Account Intelligence Agent''s domain)

  - Monitor daily news feeds beyond regulatory announcements (MNA Agent''s domain)

  - Analyze competitive regulatory positioning (CI Agent''s domain)

  - Predict regulatory outcomes, enforcement discretion, or lobby positions

  - Provide legal advice or compliance certification assessments

  - Generate customer-facing compliance documentation


  When uncertain: distinguish between enacted regulations, proposed rules, and draft
  guidance. Use "proposed" or "under consultation" qualifiers. Add [NEEDS LEGAL REVIEW]
  for compliance implications that require legal expertise.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-ii-data
  name: Read Industry Data
  description: 'Access data sources: existing_regulatory_landscape, realm_profile,
    regulation_details, company_profile'
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Regulatory data source unavailable, flag gap and proceed with available sources
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section
    parameter to target specific data: regulatory, compliance, risks, context, or
    frameworks.'
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: write-ii-artifact
  name: Write Regulatory Artifact
  description: Save regulatory briefs and impact assessments to InfoHub
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: write-regulatory-alert
  name: Write Regulatory Alert
  description: Save regulatory change alert to InfoHub for time-sensitive compliance deadlines
  requires_confirmation: true
  inputs:
  - title: alert
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: save-regulatory-intelligence
  name: Save Regulatory Intelligence
  description: Persist regulatory assessment to InfoHub, making results queryable via toolbox
  requires_confirmation: false
  inputs:
  - title: assessment
    type: object
  - title: industry
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification about regulatory scope, jurisdiction focus, or engagement context
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: regulatory-intelligence
  name: Regulatory Intelligence
  description: Regulatory landscape and compliance deadline data available to peer agents
  tools:
  - id: get-regulatory-landscape
    name: Get Regulatory Landscape
    description: Returns active regulations with compliance deadlines and severity for an industry/region
    inputs:
    - title: industry
      type: string
    - title: regions
      type: string
    outputs:
    - title: regulatory_landscape
      type: object
  - id: get-regulatory-impact
    name: Get Regulatory Impact
    description: Returns impact assessment of a specific regulation on engagement positioning
    inputs:
    - title: regulation_name
      type: string
    - title: company_name
      type: string
    outputs:
    - title: impact_assessment
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: regulatory
  name: Regulatory
  playbook_refs:
  - PB_II_001
  description: Scan for regulations affecting customer industries and assess regulatory impact on engagements.
  inputs:
  - title: active_nodes
    type: string
  - title: company_name
    type: string
  - title: company_profile
    type: string
  - title: existing_regulatory
    type: string
  - title: industry
    type: string
  - title: realm_id
    type: string
  - title: regions
    type: string
  - title: regulation_details
    type: string
  outputs:
  - title: regulatory_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: ii-regulatory-scan
      input: industry, regions, realm_id, company_name
      tools:
      - read-ii-data
      - read-infohub
      description: Scan for regulations affecting the customer's industry
      on_failure: stop
    - step: 2
      prompt: ii-regulatory-impact-assessment
      input: regulation_name, company_name, regulation_details, active_nodes
      tools:
      - read-ii-data
      - read-infohub
      description: Assess impact of a specific regulatory change on engagement
      on_failure: stop
    - step: 3
      action: persist
      tools:
      - save-regulatory-intelligence
      - write-ii-artifact
      - write-regulatory-alert
      condition: write-regulatory-alert triggers when regulation.severity == HIGH AND deadline_days <= 90
      description: Save regulatory assessment to InfoHub, alert for urgent compliance deadlines
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - regulatory-scanning
    - compliance-deadline-tracking
    - regulatory-impact-assessment
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'The agent tracks regulatory publications and compliance
      deadlines, but the analyst interprets what they mean for specific customers.
      Knowing that a new data residency requirement takes effect in Q3 is data. Understanding
      whether the customer''s current architecture makes compliance straightforward
      or requires a major platform shift, and how that shapes the vendor conversation,
      requires judgment that only comes from deep regulatory and customer context.
      The agent scans and structures, the analyst advises.

      '
    challenges:
    - text: Regulatory changes are missed until deal positioning is too late
      specific_overhead:
      - Monitoring regulatory body announcements across multiple jurisdictions and verticals
    - text: Compliance deadlines are tracked in spreadsheets without engagement context
      specific_overhead:
      - Manually mapping compliance requirements to active deal positioning and customer priorities
    administrative_overhead:
    - Monitoring regulatory body announcements across multiple jurisdictions and verticals
    - Manually mapping compliance requirements to active deal positioning and customer priorities
    scenarios:
    - problem: Regulatory changes are missed until deal positioning is too late
      why: 'New regulations reshape customer budgets and priorities. When the team
        learns about a regulatory shift after competitors have already positioned
        against it, the window for differentiation has closed and the deal strategy
        needs rework.

        '
      agent: ii-regulatory-agent
      agent_response: 'Scans regulatory body publications across active verticals
        and jurisdictions, classifies changes by severity and compliance timeline,
        and produces structured briefs that connect compliance requirements to vendor
        capabilities. Surfaces findings before competitors react.

        '
      success_signal:
        metric: Regulatory change awareness lead time
        target: Surface regulatory changes with compliance deadlines at least 30 days before they affect deal positioning
        leading_indicator: Deal teams reference regulatory briefs in customer conversations
        failure_signal: Regulatory shifts are discovered through customer objections or competitor positioning
    - problem: Compliance deadlines are tracked in spreadsheets without engagement context
      why: 'Tracking deadlines without connecting them to active engagements means
        the team knows a regulation exists but not which deals it affects, which customers
        need to act, or how vendor capabilities map to compliance requirements.

        '
      agent: ii-regulatory-agent
      agent_response: 'Maps compliance deadlines to active engagements, identifies
        which deals are affected, and produces impact assessments that connect regulatory
        requirements to specific vendor capabilities. Creates engagement-ready positioning
        material per regulation.

        '
      success_signal:
        metric: Regulatory-to-engagement mapping coverage
        target: All HIGH severity regulations mapped to affected engagements within 48 hours
        leading_indicator: AE teams proactively raise compliance positioning in deal reviews
        failure_signal: Engagement teams learn about regulatory impact from customers, not internal intelligence
  escalation_triggers:
  - HIGH severity regulation with compliance deadline within 90 days
  - Regulatory change affecting 3+ active engagements simultaneously
  - Conflicting regulatory requirements across jurisdictions for same customer
  - Enforcement action announced in active customer's industry
  prompt_registry:
    ii-regulatory-scan:
      description: Scan for regulations affecting the customer's industry
      source: prompts/tasks.yaml#regulatory.regulatory_scan
      inputs:
      - title: company_name
        type: string
      - title: existing_regulatory
        type: string
      - title: industry
        type: string
      - title: realm_id
        type: string
      - title: regions
        type: string
      outputs:
      - title: regulatory-scan_result
        type: object
      requires_data:
      - source: read-ii-data
        fields:
        - existing_regulatory_landscape
        - realm_profile
        priority: critical
      - source: read-infohub
        fields:
        - regulatory_context
        - compliance_history
        priority: enrichment
    ii-regulatory-impact-assessment:
      description: Assess impact of a specific regulatory change on engagement
      source: prompts/tasks.yaml#regulatory.regulatory_impact_assessment
      inputs:
      - title: active_nodes
        type: string
      - title: company_name
        type: string
      - title: company_profile
        type: string
      - title: regulation_details
        type: string
      - title: regulation_name
        type: string
      outputs:
      - title: regulatory-impact-assessment_result
        type: object
      requires_data:
      - source: read-ii-data
        fields:
        - company_profile
        - regulation_details
        - active_nodes
        priority: critical
      - source: read-infohub
        fields:
        - engagement_context
        - vendor_capabilities
        priority: enrichment
  boundaries:
  - Regulatory landscape scanning only, does not assess individual company compliance status
  - Does not monitor daily news feeds beyond regulatory announcements
  - Does not analyze competitive regulatory positioning
  - Does not predict regulatory outcomes or enforcement discretion
  - Does not provide legal advice or compliance certifications
  - Does not generate customer-facing compliance documentation
  permissions:
  - Read regulatory body publications and compliance framework updates
  - Scan for regulatory changes affecting active customer industries
  - Track compliance deadlines with enforcement dates and penalties
  - Classify regulatory severity and assess engagement impact
  - Write regulatory alerts for time-sensitive compliance deadlines
  - Register sources in shared source registry
  guardrails:
    input_validation:
    - Reject regulatory scan without specified industry or region
    - Reject impact assessment without regulation details or company context
    output_checks:
    - All regulatory references must cite source, publication date, and effective date
    - Severity classification must include impact rationale and affected scope
    - Compliance deadlines must distinguish enacted from proposed regulations
    - Impact assessments must map to specific vendor capabilities
    signal_validation:
    - Never predict enforcement outcomes or regulatory agency intent
    - Distinguish between enacted, proposed, and draft regulations
    - Use [NEEDS LEGAL REVIEW] for compliance implications requiring legal expertise
    - Add [NEEDS VERIFICATION] for regulatory changes from single sources
  error_handling:
    tool_failures:
      critical:
      - read-ii-data
      enrichment:
      - read-infohub
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without regulatory data sources
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - regulatory-trends
      - compliance-frameworks
      - regulatory-impact
      archetypes:
      - enterprise
      - regulated-industries
    references:
    - path: references/research_sources.yaml
      description: Government and regulatory body publications, trade association reports
  autonomy:
    triggers:
    - type: parent_dispatch
      source: ii-agent
      description: II orchestrator routes regulatory analysis requests
    - type: event
      source: regulatory_feed
      condition: new_regulation.industry IN active_industries
      description: Auto-triggers when new regulations are published for active industries
    - type: schedule
      cadence: weekly
      window: monday_08:00
      description: Weekly regulatory scan across all active verticals and jurisdictions
    - type: downstream
      source: PB_II_001
      signal: SIG_II_REGULATORY_UPDATE
      condition: regulation.status_change == true
      description: Regulation status change triggers impact reassessment
    outputs:
    - type: parent_return
      target: ii-agent
      payload:
      - regulatory_result
      description: Regulatory analysis results back to orchestrator
    - type: trigger_agent
      target: ii-industry-analysis-agent
      condition: regulation.restructures_industry == true
      payload:
      - regulation_details
      - affected_industry
      description: Industry-restructuring regulation triggers industry profile refresh
    - type: trigger_agent
      target: ii-trends-agent
      condition: regulation.creates_new_trend == true
      payload:
      - regulation_details
      - trend_signal
      description: Regulation creating new market trend triggers trend identification
    - type: notify_human
      condition: regulation.severity == HIGH AND deadline_days <= 90
      channel: alert
      description: Urgent compliance deadlines surface for analyst review
    consumes_toolboxes:
    - toolbox: industry-profile-intelligence
      agent: ii-industry-analysis-agent
      tools:
      - get-industry-profile
      reason: Industry context needed to assess regulatory impact scope
    dependencies: []
