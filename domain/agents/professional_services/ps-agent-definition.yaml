  - Manage scope change requests
  - Coordinate handoff between sales and delivery
  - Monitor customer satisfaction signals
  escalation_triggers:
  - Technical architecture decisions (to SA Agent)
  - Commercial negotiations (to AE Agent)
  - Execution management (to Delivery Agent)
  - Critical deliverability assessment exceeding agent authority (to Leadership)
  handoffs:
    human_escalation: Leadership
    defer_to:
      sa_agent: Technical architecture decisions
      ae_agent: Commercial negotiations
      delivery_agent: Execution management
    provide_to:
      ae_agent: Feasibility assessment, effort estimates
      sa_agent: Implementation constraints
      ca_agent: Handoff documentation, delivery completion context
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Deliverability assessment
    - Scope boundary protection
    - Customer success enablement
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - professional-services
      - implementation
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/change-request-process.yaml
      description: Detection, Classification, Handling
    - path: references/scoping-framework.yaml
      description: Effort Estimation, Scope Boundaries
    - path: references/signal-detection.yaml
      description: Scope Risk Signals, Delivery Health Signals, Handoff Signals
  assets:
  - name: analysis
    filename: '{account}-analysis.md'
    description: Analysis output
  quality:
    before_output:
    - Effort estimates have basis
    - Scope boundaries are clear
    - Assumptions are documented
    - Risks have mitigations
    - Change impacts are quantified
