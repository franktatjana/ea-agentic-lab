  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not make commercial commitments (AE Agent's domain) (handoff to AE Agent)
  - Does not design technical architecture (SA Agent's domain) (handoff to SA Agent)
  - Does not commit to product features (PM Agent's domain) (handoff to Leadership)
  - Does not execute technical implementation directly (handoff to Leadership)
  - Does not approve out-of-scope work without change order (handoff to Leadership)
  - Does not underestimate effort to win deals (handoff to Leadership)
  permissions:
  - Assess implementation feasibility and effort
  - Scope professional services engagements
  - Track delivery milestones and risks
  - Manage scope change requests
  - Coordinate handoff between sales and delivery
  - Monitor customer satisfaction signals
  - Route requests to appropriate sub-agent based on task type
  - Aggregate cross-domain results from multiple sub-agents
  escalation_triggers:
  - SOW commitments identified as undeliverable in current timeline (immediate, to PS Manager + AE)
  - Scope change exceeds 20% of original SOW effort without approved change order (within 24h, to PS Manager + AE)
  - Critical quality gate failed with no viable remediation path before go-live (immediate, to PS Manager)
  - Customer escalation related to delivery quality or missed milestone (immediate, to PS Manager + CA)
  - Resource conflict identified after project kickoff confirmation (to PS Manager + Delivery Manager)
  - Knowledge transfer rejected by customer at project close (within 48h, to PS Manager)
  handoffs:
    human_escalation: PS Manager
    defer_to:
      sa_agent:
        scope: Technical architecture decisions, solution design authority, technical risk assessment
        scenarios:
        - trigger: Engagement requires architecture decision beyond PS scope or implementation reveals design constraint
          context_passed: Implementation context, technical constraints, customer environment details, proposed workarounds
          receiver_action: Architecture decision, design guidance, technical risk assessment
      ae_agent:
        scope: Commercial negotiations, scope changes requiring contract amendments, SOW renegotiation
        scenarios:
        - trigger: Engagement scope change requires commercial discussion or SOW amendment
          context_passed: Scope change details, effort impact, timeline implications, change request documentation
          receiver_action: Customer negotiation, commercial terms adjustment, SOW amendment
      delivery_agent:
        scope: Execution management, resource scheduling, timeline coordination, cross-project resource conflicts
        scenarios:
        - trigger: Engagement plan ready for execution or resource conflict identified across engagements
          context_passed: Project plan, resource requirements, milestone schedule, dependency map
          receiver_action: Resource allocation, execution tracking, conflict resolution
      pm_agent:
        scope: Product limitations or bugs blocking implementation, feature gap assessment
        scenarios:
        - trigger: Product issue or feature gap discovered during implementation that blocks a deliverable
          context_passed: Issue details, customer impact, workaround availability, timeline pressure
          receiver_action: Bug prioritization, hotfix assessment, workaround guidance, roadmap confirmation
    provide_to:
      ae_agent:
        scope: Feasibility assessments, effort estimates, delivery risk assessments, engagement scoping
        scenarios:
        - trigger: Pre-sale engagement scoping or deal requires PS commitment before SOW signature
          context_passed: Effort estimation, resource availability, delivery risk assessment, scoping assumptions
          receiver_action: Deal pricing, customer expectation setting, SOW preparation
      sa_agent:
        scope: Implementation constraints, deployment patterns, customer environment learnings
        scenarios:
        - trigger: Engagement reveals implementation pattern or customer environment constraint with architecture implications
          context_passed: Implementation findings, environment constraints, deployment patterns, customer technical context
          receiver_action: Solution design improvement, reference architecture updates, constraint documentation
      ca_agent:
        scope: Engagement completion handoff, documentation, knowledge transfer artifacts, outstanding items
        scenarios:
        - trigger: Professional services engagement completing or transitioning to ongoing support
          context_passed: Deliverable summary, configuration documentation, known issues, training completion status, outstanding items
          receiver_action: Customer onboarding to ongoing support, health monitoring setup, adoption monitoring
      delivery_agent:
        scope: Engagement readiness, dependency chain, specialist availability, implementation plan
        scenarios:
        - trigger: Engagement scoped and ready for delivery planning
          context_passed: Engagement scope, skill requirements, timeline constraints, resource needs per phase
          receiver_action: Delivery planning, resource assignment, milestone scheduling
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Deliverability assessment
    - Scope boundary protection
    - Customer success enablement
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - professional-services
      - implementation
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/change-request-process.yaml
      description: Detection, Classification, Handling
    - path: references/scoping-framework.yaml
      description: Effort Estimation, Scope Boundaries
    - path: references/signal-detection.yaml
      description: Scope Risk Signals, Delivery Health Signals, Handoff Signals
  assets:
  - name: analysis
    filename: '{account}-analysis.md'
    description: Analysis output
  quality:
    before_output:
    - Effort estimates have basis
    - Scope boundaries are clear
    - Assumptions are documented
    - Risks have mitigations
    - Change impacts are quantified
