x-ea-agent:
  profile:
    role_context: 'Professional Services scopes and delivers implementation projects. They allocate specialist resources, manage timelines, and coordinate from kickoff through go-live. Getting the customer
      to value quickly depends on accurate scoping and smooth execution.

      '
    scenarios:
    - problem: SOW promises more than the team can deliver in the timeline
      why: 'Sales closes deals with aggressive timelines and loosely scoped deliverables. PS inherits commitments that were never validated against resource availability or implementation complexity, leading
        to overruns and strained customer relationships.

        '
      agent: ps-agent
      agent_response: 'The agent validates SOWs against effort benchmarks and past engagement data before signature. It flags mismatches between promised scope and available resources, producing a delivery
        risk assessment with specific gap callouts.

        '
      success_signal:
        metric: SOW delivery risk flags raised pre-signature
        target: 100% of SOWs reviewed before customer commitment
        leading_indicator: Delivery risk assessment generated within 24 hours of SOW draft
        failure_signal: Post-signature scope renegotiations or change orders in first 30 days
    - problem: Scope creep accumulates silently during project execution
      why: 'Customer requests trickle in through emails, calls, and side conversations. Without a systematic way to detect scope drift, small additions compound into significant unplanned work that erodes
        margins and delays milestones.

        '
      agent: ps-agent
      agent_response: 'The agent tracks project progress against the original plan and flags deviations as they emerge. It compares effort consumed versus planned, identifies undocumented scope additions,
        and generates change request documentation for formal processing.

        '
      success_signal:
        metric: Scope deviations detected and documented before they impact delivery
        target: Scope creep flagged within 1 week of first deviation signal
        leading_indicator: Weekly progress tracking shows effort-to-plan variance
        failure_signal: Unplanned work discovered only at milestone reviews or go-live
    - problem: Project scope creep starts before the kickoff meeting
      why: 'Between deal close and project kickoff, customer expectations expand through informal conversations with the sales team. By the time PS leads the kickoff, the customer''s understanding of scope
        has already grown beyond the SOW, and the project starts with a gap between contract and expectation.

        '
      agent: ps-agent
      agent_response: 'The agent monitors post-close communications for scope-expanding language and new requirements introduced between signature and kickoff. It flags discrepancies between SOW deliverables
        and emerging customer expectations, providing the PS lead with a pre-kickoff alignment brief that addresses gaps before they become project risks.

        '
      success_signal:
        metric: Pre-kickoff scope alignment accuracy
        target: Zero undocumented scope expectations at project kickoff
        leading_indicator: Pre-kickoff alignment brief delivered at least 3 days before the kickoff meeting
        failure_signal: Customer raises deliverable expectations at kickoff that exceed the signed SOW
    - problem: Resource allocation conflicts across simultaneous engagements
      why: 'PS teams run multiple projects concurrently, each competing for the same senior consultants and technical leads. Without visibility into committed capacity, new projects are staffed optimistically.
        Overcommitted resources deliver lower quality across all engagements instead of excelling at fewer.

        '
      agent: ps-agent
      agent_response: 'The agent tracks resource commitments across active engagements, including planned versus actual utilization per team member. It flags conflicts when new projects are staffed against
        already-committed resources, models the impact of overallocation on delivery timelines, and recommends rebalancing options before quality degrades.

        '
      success_signal:
        metric: Resource allocation conflict rate
        target: Zero projects staffed with resources committed above 100% utilization
        leading_indicator: Resource conflict alerts raised before project assignment confirmation
        failure_signal: Project milestone missed because a key resource was overallocated across engagements
    - problem: Go-live readiness is assessed subjectively, not systematically
      why: 'Go-live decisions are made in review meetings where readiness is a matter of opinion. Different workstream leads have different thresholds for what constitutes ready. Without a structured assessment
        framework, teams approve go-lives that fail in production or delay go-lives that were actually ready.

        '
      agent: ps-agent
      agent_response: 'The agent applies a structured go-live readiness checklist that evaluates testing completion, open defect severity, data migration status, and user acceptance criteria. It produces
        a quantified readiness score with specific blockers and risk items, replacing subjective judgment with evidence-based assessment.

        '
      success_signal:
        metric: Go-live readiness assessment objectivity
        target: All go-live decisions backed by a quantified readiness assessment with zero critical open items
        leading_indicator: Readiness score trending upward across weekly assessments in the final sprint
        failure_signal: Post-go-live rollback or critical issue that was present in pre-go-live data
    challenges:
    - text: Project scope creep starts before the kickoff meeting
      specific_overhead:
      - Building project plans from SOWs and scattered pre-sales documentation
    - text: Resource allocation conflicts across simultaneous engagements
      specific_overhead:
      - Tracking resource availability across overlapping engagements
    - text: Go-live readiness is assessed subjectively, not systematically
      specific_overhead:
      - Compiling go-live readiness checklists from multiple workstreams
    - text: SOW promises more than the team can deliver in the timeline
      specific_overhead:
      - Writing status reports and customer-facing progress updates
    - Scope creep accumulates silently during project execution
    administrative_overhead:
    - Building project plans from SOWs and scattered pre-sales documentation
    - Tracking resource availability across overlapping engagements
    - Compiling go-live readiness checklists from multiple workstreams
    - Writing status reports and customer-facing progress updates
    capabilities:
    - Project scoping and estimation
    - Resource allocation
    - Delivery management
    - Go-live coordination
    - Workshop facilitation
    human_matters_summary: 'Scope exists in every conversation, not just contracts. The agent estimates effort and surfaces delivery risks, but the PS manager navigates the complexity of feature creep,
      balances customer expectations against reality, and decides when to escalate scope mismatches before they become delivery crises. The SOW is validated, but human judgment preserves both the customer
      relationship and delivery health.

      '
    playbook_raci:
      context: >
        Professional Services contributes implementation expertise to playbooks led by other
        roles. PS does not own engagement-level playbooks but provides delivery feasibility,
        effort estimation, and implementation constraints.
      responsible: []
      accountable: []
      consulted:
        - playbook: Implementation Kickoff (PB_DEL_001)
          scope: Implementation feasibility, resource availability, effort estimation for delivery planning
          team: delivery
          file: PB_DEL_001_implementation_kickoff.yaml
        - playbook: Sizing (PB_SA_002)
          scope: Implementation effort validation and resource estimation for capacity planning
          team: solution_architects
          file: PB_SA_002_sizing_estimation.yaml
        - playbook: Go-Live Readiness (PB_DEL_002)
          scope: Implementation completeness verification and operational readiness assessment
          team: delivery
          file: PB_DEL_002_go_live_readiness.yaml
      informed:
        - playbook: Deal Retrospective (PB_AE_001)
          scope: Receives delivery quality feedback for service improvement
          team: account_executives
          file: PB_AE_001_retrospective.yaml
        - playbook: Post-Implementation Review (PB_DEL_004)
          scope: Receives implementation outcome assessment for methodology refinement
          team: delivery
          file: PB_DEL_004_post_implementation_review.yaml
  fallback_model: null
