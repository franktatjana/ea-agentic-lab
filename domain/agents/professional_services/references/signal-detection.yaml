# PS Signal Detection Reference
# Domain knowledge extracted to references/ per DDR-018

scope_risk_signals:
  keywords:
    - "can you also"
    - "while you're at it"
    - "small addition"
    - "quick change"
    - "scope creep"
    - "additional requirements"

  severity_indicators:
    high: ["major change", "redesign", "new integration", "extended timeline"]
    medium: ["modification", "adjustment", "enhancement"]
    low: ["clarification", "minor tweak"]

delivery_health_signals:
  positive:
    - "on track"
    - "milestone achieved"
    - "customer satisfied"
    - "sign-off received"
    - "go-live successful"

  negative:
    - "blocked"
    - "delayed"
    - "customer frustrated"
    - "resource gap"
    - "requirements unclear"

handoff_signals:
  sales_to_delivery:
    - "contract signed"
    - "SOW approved"
    - "kickoff scheduled"

  delivery_to_ca:
    - "go-live complete"
    - "training delivered"
    - "documentation handed over"
