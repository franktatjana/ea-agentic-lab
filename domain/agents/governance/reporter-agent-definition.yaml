    reporter-month-end-report:
      description: Generate comprehensive month-end report
      source: prompts/tasks.yaml#reporter.month_end_report
      inputs:
      - title: Month
        type: string
      - title: account_name
        type: string
      - title: count
        type: string
      - title: description
        type: string
      - title: month
        type: string
      outputs:
      - title: month-end-report_result
        type: object
      requires_data:
      - source: read-reporter-data
        fields: [governance_metrics, decision_log, action_tracker, risk_register, health_scores]
        priority: critical
    reporter-extract-decisions-analyze:
      description: Analyze input
      source: skills/extract-decisions#step-1
      inputs:
      - title: context
        type: string
      outputs:
      - title: result
        type: object
      requires_data:
      - source: read-reporter-data
        fields: [source_content, governance_metrics]
        priority: critical
    reporter-extract-decisions-synthesize:
      description: Synthesize findings
      source: skills/extract-decisions#step-2
      inputs:
      - title: analysis
        type: string
      outputs:
      - title: result
        type: object
    reporter-extract-decisions-output:
      description: Generate output
      source: skills/extract-decisions#step-3
      inputs:
      - title: synthesis
        type: string
      outputs:
      - title: result
        type: object
    reporter-process-meeting-notes-analyze:
      description: Analyze input
      source: skills/process-meeting-notes#step-1
      inputs:
      - title: context
        type: string
      outputs:
      - title: result
        type: object
      requires_data:
      - source: read-reporter-data
        fields: [meeting_transcript, meeting_metadata]
        priority: critical
    reporter-process-meeting-notes-synthesize:
      description: Synthesize findings
      source: skills/process-meeting-notes#step-2
      inputs:
      - title: analysis
        type: string
      outputs:
      - title: result
        type: object
    reporter-process-meeting-notes-output:
      description: Generate output
      source: skills/process-meeting-notes#step-3
      inputs:
      - title: synthesis
        type: string
      outputs:
      - title: result
        type: object
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information,
      and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not track individual actions (Nudger's domain) (handoff to Leadership)
  - Does not validate actions (Task Shepherd's domain) (handoff to Leadership)
  - Does not extract meeting content (Meeting Notes' domain) (handoff to Leadership)
  - Does not make governance decisions (handoff to Leadership)
  - Does not assign blame or praise (handoff to Leadership)
  - Does not fabricate statistics (handoff to Leadership)
  permissions:
  - Generate governance dashboards
  - Calculate follow-through metrics
  - Identify governance trends
  - Surface accountability patterns
  - Produce executive summaries
  - Track governance health scores
  escalation_triggers:
  - Critical data accuracy exceeding agent authority (to Leadership)
  handoffs:
    human_escalation: Leadership
    receives_from:
      nudger: Follow-through metrics
      task_shepherd: Action quality metrics
      decision_registrar: Decision statistics
      risk_radar: Risk metrics
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Data accuracy
    - Trend identification
    - Actionable insights
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains: [reporting, analytics]
      archetypes: [enterprise, mid-market]
    references:
    - path: references/reporter-health-scoring.yaml
      description: Governance Health
    - path: references/reporter-metrics-framework.yaml
      description: Metrics, Dashboards
  assets:
  - name: artifacts
    filename: '{account}-artifacts.md'
    description: artifacts
  - name: distribution
    filename: '{account}-distribution.md'
    description: distribution
  quality:
  - All claims supported by evidence
  - No assumed dynamics
  - Sources cited
