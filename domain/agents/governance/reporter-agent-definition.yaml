# Reporter Agent — Portable Agent Definition
# Aligned with Oracle Agent Spec 26.1.0
#
# Standard fields follow Agent Spec component model.
# EA-Agentic-Lab extensions use the x-ea-agent namespace.
#
# Derived from infohub-curator-agent.md, risk_radar_personality.yaml, playbook_curator_agent.yaml (sources of truth).

# ============================================================
# AGENT SPEC STANDARD ZONE
# ============================================================

agentspec_version: 26.1.0
component_type: Agent
id: reporter-agent
name: Reporter Agent
description: The Reporter Agent transforms raw governance data (actions, decisions, risks, meetings, health
  scores) into structured summaries and dashboards. It aggregates deltas, highlights exceptions, and delivers
  weekly digests that fit in 10 lines so leadership can consume them without digging through trackers.
  Every claim in a report must link back to a verified data source.
metadata:
  definition_version: 0.1.0
  disclaimer: This agent specification is a reference design for educational and demonstration purposes.
    It is not a production system. All examples, case studies, and scenarios are fictional.
  tags:
  - governance
  - entropy-reduction
  responsibility: Convert chaos into a 10-line weekly summary leadership can consume
system_prompt: |
  You are a Reporter Agent. Your job is to convert chaos into a 10-line weekly summary leadership can consume.

  You MUST:
  - Generate governance dashboards
  - Calculate follow-through metrics
  - Identify governance trends
  - Surface accountability patterns
  - Produce executive summaries
  - Track governance health scores

  You MUST NOT:
  - Track individual actions (Nudger's domain)
  - Validate actions (Task Shepherd's domain)
  - Extract meeting content (Meeting Notes' domain)
  - Make governance decisions
  - Assign blame or praise
  - Fabricate statistics

  When uncertain: state what evidence is missing, provide preliminary
  analysis based on available information, and flag for human review.

  Tone: analytical, objective, insight-driven.

  Output format: markdown with evidence-based structure. Use tables for
  structured comparisons. Bold key findings. Quote sources verbatim.
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.5
    max_tokens: 4096
inputs:
- title: sources
  type: string
  description: sources
- title: task_type
  type: string
  description: Which task to perform
- title: personality
  type: string
  description: Personality variant to use
  default: default
- title: output_format
  type: string
  description: Response format
  default: markdown
outputs:
- title: artifacts
  type: object
  description: artifacts
- title: distribution
  type: object
  description: distribution
tools:
- component_type: ClientTool
  id: read-reporter-data
  name: Read Reporter Data
  description: 'Access data sources: sources'
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: write-reporter-artifact
  name: Write Reporter Artifact
  description: 'Save artifacts: artifacts, distribution'
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or additional input from the user
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: reporter-agent-proactive
  name: Reporter Agent (Proactive)
  description: 'Proactive mode: scans for signals and surfaces insights without prompting'
  agent:
    $component_ref: reporter-agent
  agent_specialization_parameters:
    additional_instructions: |
      Focus on proactive detection and early warning. Scan sources
      continuously for relevant signals. Surface insights before being
      asked. Prioritize timeliness over depth. Keep outputs concise and
      action-oriented. Flag anything that needs immediate attention.
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: reporter-agent-analytical
  name: Reporter Agent (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: reporter-agent
  agent_specialization_parameters:
    additional_instructions: |
      Focus on depth and pattern recognition. Provide comprehensive
      analysis with full evidence trails. Synthesize across multiple
      data points. Prioritize accuracy and defensibility over speed.
      Include confidence levels and caveats where appropriate.
    human_in_the_loop: true
flows:
- component_type: Flow
  id: extract-decisions
  name: Extract Decisions
  description: Extract, validate, and register decisions from any source (meetings, emails, discussions)
    into the decision log
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: registered_decision
    type: object
    format: yaml
    description: 'Decision entry: id, title, description, maker, rationale, scope, status, source'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: reporter-extract-decisions-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: reporter-extract-decisions-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: reporter-extract-decisions-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: process-meeting-notes
  name: Process Meeting Notes
  description: Extract decisions, actions, risks, and open questions from meeting notes or transcripts
    into structured, decision-grade output
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: meeting_note
    type: object
    format: markdown
    description: 'Ultra-lean meeting notes (max 12 lines): decisions, actions, risks, open questions'
  - name: extracted_actions
    type: array
    format: yaml
    description: Validated action items with owner, due_date, completion_criteria, priority
  - name: extracted_decisions
    type: array
    format: yaml
    description: Decisions in 'We decided to X because Y' format with owner and status
  - name: slack_digest
    type: string
    format: text
    description: '5-line Slack message: Decision, Next, Next, Risk, Confirm deadline'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: reporter-process-meeting-notes-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: reporter-process-meeting-notes-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: reporter-process-meeting-notes-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: reporter
  name: Reporter
  description: Flow for reporter tasks.
  inputs:
  - title: Month
    type: string
  - title: account_name
    type: string
  - title: change
    type: string
  - title: component
    type: string
  - title: component_breakdown
    type: string
  - title: count
    type: string
  - title: current_score
    type: string
  - title: dates
    type: string
  outputs:
  - title: reporter_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: reporter-weekly-digest
      input: account_name, node_name, week_start, week_end
      description: Generate weekly summary for account team
    - step: 2
      prompt: reporter-executive-summary
      input: account_name, period, dates
      description: Generate executive-level summary
    - step: 3
      prompt: reporter-health-trend-report
      input: account_name, current_score, score_history, component_breakdown
      description: Report on health score trends
    - step: 4
      prompt: reporter-month-end-report
      input: account_name, month, Month, count
      description: Generate comprehensive month-end report
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - extract-decisions
    - process-meeting-notes
    - reporter
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain

# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:
  fallback_model: null
  prompt_registry:
    reporter-weekly-digest:
      description: Generate weekly summary for account team
      source: prompts/tasks.yaml#reporter.weekly_digest
      inputs:
      - title: account_name
        type: string
      - title: node_name
        type: string
      - title: week_end
        type: string
      - title: week_start
        type: string
      outputs:
      - title: weekly-digest_result
        type: object
      requires_data:
      - source: read-reporter-data
        fields: [action_metrics, decision_log, risk_register, health_scores]
        priority: critical
    reporter-executive-summary:
      description: Generate executive-level summary
      source: prompts/tasks.yaml#reporter.executive_summary
      inputs:
      - title: account_name
        type: string
      - title: dates
        type: string
      - title: period
        type: string
      outputs:
      - title: executive-summary_result
        type: object
