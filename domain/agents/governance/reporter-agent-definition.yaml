x-ea-agent:
  fallback_model: null
  profile:
    human_matters_summary: 'Metrics without interpretation are just numbers. The agent produces dashboards and highlights exceptions, but leadership understands which trends signal actual problems, how
      to translate patterns into coaching conversations, and what actions to take. The summary is delivered, but human judgment converts data into decisions.

      '
    challenges:
    - text: Governance data is scattered across action trackers, decision logs, risk registers, and health scores with no unified view
      specific_overhead:
      - Manually pulling metrics from action trackers, decision logs, risk registers, and health scoring systems each week
    - text: Leadership has no time to dig through raw trackers, so governance health goes unmonitored between quarterly reviews
      specific_overhead:
      - Calculating follow-through rates, decision velocity, and risk resolution times across multiple data sources
    - text: Trends in follow-through rates and risk accumulation are invisible without longitudinal aggregation across weeks
      specific_overhead:
      - Formatting governance summaries into executive-consumable digests that fit leadership's 10-line attention window
    - text: Reports that lack source traceability erode trust because leadership cannot verify the underlying data
      specific_overhead:
      - Ensuring every statistic and claim in a report links back to a verified source before distribution
    administrative_overhead:
    - Manually pulling metrics from action trackers, decision logs, risk registers, and health scoring systems each week
    - Calculating follow-through rates, decision velocity, and risk resolution times across multiple data sources
    - Formatting governance summaries into executive-consumable digests that fit leadership's 10-line attention window
    - Ensuring every statistic and claim in a report links back to a verified source before distribution
    scenarios:
    - problem: Leadership has no visibility into governance health between quarterly reviews
      why: 'Without regular reporting, governance metrics degrade silently. Follow-through rates drop, risks accumulate, and decision backlogs grow, but no one sees the trend until a quarterly review reveals
        months of compounded problems that are now difficult to reverse.

        '
      agent: reporter-agent
      agent_response: 'Aggregates data from all governance agents (Nudger follow-through rates, Decision Registrar decision counts, Risk Radar open risks, health scores) and generates a weekly digest that
        fits in 10 lines. Highlights exceptions, trend changes, and items requiring leadership attention.

        '
      success_signal:
        metric: Weekly governance digest delivery rate
        target: 100% of weeks have a governance digest delivered by end of business Monday
        leading_indicator: Leadership opens and acknowledges the digest within 24 hours
        failure_signal: More than 2 consecutive weeks without a governance summary reaching leadership
    - problem: Governance metrics are reported without source traceability, so leadership cannot verify claims
      why: 'When a report says "follow-through rate is 72%" but does not link to the underlying action tracker data, leadership either trusts blindly or dismisses the number. Both outcomes undermine governance,
        the first by hiding problems, the second by destroying the reporting system''s credibility.

        '
      agent: reporter-agent
      agent_response: 'Ensures every metric in a governance report includes a source reference (which tracker, which time period, which filters). Generates reports with inline evidence links so any claim
        can be verified by drilling into the source data within one click.

        '
      success_signal:
        metric: Percentage of report claims with source traceability
        target: 100% of statistics in governance reports link to verified source data
        leading_indicator: Zero leadership requests for 'where did this number come from' after report delivery
        failure_signal: Leadership questions report accuracy or requests raw data to verify claims
    - problem: Governance data is scattered across action trackers, decision logs, risk registers, and health scores with no unified view
      why: 'Each governance agent maintains its own data store, but no single view aggregates metrics across all of them. Leadership must open multiple tools to understand overall governance health, which
        means they either spend too much time assembling the picture manually or they skip the review and rely on anecdotal updates that miss systemic patterns.

        '
      agent: reporter-agent
      agent_response: 'Pulls data from all governance agent outputs (Nudger follow-through, Decision Registrar logs, Risk Radar registers, Task Shepherd quality metrics, health scores) into a unified dashboard
        view. Calculates cross-system metrics like governance velocity and exception density so leadership gets a single artifact that represents the full governance picture.

        '
      success_signal:
        metric: Governance data sources included in unified reporting
        target: 100% of governance agent data sources represented in the weekly dashboard
        leading_indicator: Leadership stops requesting data from individual agent trackers
        failure_signal: Leadership reports that governance summaries miss data from one or more governance agents
    - problem: Trends in follow-through rates and risk accumulation are invisible without longitudinal aggregation across weeks
      why: 'A single weekly snapshot shows current state but hides trajectory. Without multi-week trend analysis, leadership cannot tell whether a 72% follow-through rate is improving or declining, whether
        risk counts are stable or accelerating, or whether governance interventions are producing results. Decisions about resource allocation and process changes happen without trend evidence.

        '
      agent: reporter-agent
      agent_response: 'Maintains rolling multi-week metric histories and generates trend overlays in governance reports showing direction and velocity of change for key indicators. Highlights inflection
        points (sudden drops in follow-through, risk accumulation spikes) with annotations linking to potential causes so leadership can intervene based on trajectory, not just current state.

        '
      success_signal:
        metric: Governance reports with multi-week trend analysis included
        target: 100% of weekly digests include 4-week trend data for key governance metrics
        leading_indicator: Leadership references trend data when making governance decisions
        failure_signal: Governance decisions are made based on single-week snapshots without awareness of trajectory
  prompt_registry:
