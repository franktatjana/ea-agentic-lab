        priority: critical
    reporter-health-trend-report:
      description: Report on health score trends
      source: prompts/tasks.yaml#reporter.health_trend_report
      inputs:
      - title: account_name
        type: string
      - title: change
        type: string
      - title: component
        type: string
      - title: component_breakdown
