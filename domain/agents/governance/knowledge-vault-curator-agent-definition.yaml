x-ea-agent:
  fallback_model: null
  profile:
    human_matters_summary: 'Knowledge codification only works if it reflects real learning. The agent validates anonymization and tracks usage patterns, but humans decide which lessons are broadly applicable,
      which are context-specific, and whether knowledge candidates represent true institutional wisdom or just recent memory. The vault is maintained, but human judgment decides what persists.

      '
    playbook_raci:
      responsible:
      - playbook: PB_GOV_007_vault_structure_review
        scope: PB_GOV_007_vault_structure_review
        team: governance
        file: PB_GOV_007_vault_structure_review.yaml
    challenges:
    - text: Knowledge proposals arrive with customer-identifiable information that must be caught before vault entry
      specific_overhead:
      - Manually reviewing every knowledge proposal for anonymization compliance before it can enter the vault
    - text: Duplicate or contradictory knowledge items accumulate because submissions come from different engagements without cross-referencing
      specific_overhead:
      - Cross-referencing new submissions against existing vault items to detect duplicates and contradictions
    - text: Vault items lose relevance over time but no one triggers a review, so outdated guidance persists alongside current best practices
      specific_overhead:
      - Tracking which vault items are consumed by which playbooks and at what frequency across engagements
    - text: Knowledge consumption is invisible, making it impossible to know which vault items actually influence playbook execution
      specific_overhead:
      - Preparing confidence promotion recommendations by assembling usage evidence and outcome data for human reviewers
    administrative_overhead:
    - Manually reviewing every knowledge proposal for anonymization compliance before it can enter the vault
    - Cross-referencing new submissions against existing vault items to detect duplicates and contradictions
    - Tracking which vault items are consumed by which playbooks and at what frequency across engagements
    - Preparing confidence promotion recommendations by assembling usage evidence and outcome data for human reviewers
    scenarios:
    - problem: Knowledge proposals contain customer-identifiable information that would violate anonymization rules
      why: 'Agents and humans submit knowledge candidates directly from engagement context, often including customer names, deal sizes, or internal contact details. If these slip into the global vault,
        they become visible across teams and violate the anonymization contract that makes shared knowledge safe.

        '
      agent: knowledge-vault-curator-agent
      agent_response: 'Scans every incoming knowledge proposal for customer-identifiable patterns (names, account IDs, deal values, internal references), rejects non-compliant submissions with specific
        redaction guidance, and re-validates after the submitter corrects the content.

        '
      success_signal:
        metric: Percentage of vault items passing anonymization audit
        target: 100% of vault items contain zero customer-identifiable information
        leading_indicator: Anonymization rejections decrease as submitters learn the rules
        failure_signal: Customer-identifiable information discovered in vault during periodic audit
    - problem: Contradictory knowledge items give conflicting guidance for the same playbook context
      why: 'Different engagements produce different lessons about the same scenario. Without contradiction detection, a playbook may pull guidance that says "always do X" from one vault item and "never
        do X" from another, leaving the executing agent or human with no clear path forward.

        '
      agent: knowledge-vault-curator-agent
      agent_response: 'Detects semantic contradictions across vault items sharing the same domain tags or playbook associations, surfaces a contradiction report with source evidence from both items, and
        recommends consolidation or deprecation for human decision.

        '
      success_signal:
        metric: Contradictory vault items identified and resolved
        target: Zero unresolved contradictions per playbook domain at any time
        leading_indicator: Contradiction detection runs flag new conflicts within 48 hours of submission
        failure_signal: Playbook execution produces conflicting recommendations from different vault sources
    - problem: Vault items lose relevance over time but no one triggers a review, so outdated guidance persists alongside current best practices
      why: 'Knowledge that was accurate when submitted becomes stale as products evolve, market conditions shift, or better practices emerge. Without periodic relevance checks, playbooks pull outdated vault
        guidance and apply it to current engagements, leading to suboptimal recommendations that erode practitioner trust in the knowledge system.

        '
      agent: knowledge-vault-curator-agent
      agent_response: 'Tracks vault item age, last-consumption date, and confidence level over time. Flags items exceeding configurable staleness thresholds for human review, generates a relevance audit
        report with usage trends and recommended actions (revalidate, update, or deprecate) so human reviewers can prioritize which items to refresh first.

        '
      success_signal:
        metric: Percentage of vault items reviewed within their relevance cycle
        target: 100% of vault items reviewed at least once per 180-day cycle
        leading_indicator: Staleness flags generated proactively before items are consumed in stale state
        failure_signal: Playbook execution references vault items that practitioners flag as outdated or incorrect
    - problem: Knowledge consumption is invisible, making it impossible to know which vault items actually influence playbook execution
      why: 'Without consumption tracking, the team cannot distinguish high-impact vault items from unused ones. Confidence promotions happen based on gut feeling rather than evidence, retirement candidates
        go undetected, and knowledge gaps remain invisible because no one can see which playbook contexts lack vault coverage.

        '
      agent: knowledge-vault-curator-agent
      agent_response: 'Instruments vault reads by tracking which items are consumed, by which playbooks, at what frequency, and in which engagement contexts. Generates consumption dashboards showing high-usage
        items for confidence promotion and zero-usage items for retirement review, and identifies playbook contexts with no vault coverage as knowledge gaps.

        '
      success_signal:
        metric: Vault items with consumption data tracked
        target: 100% of vault item reads logged with playbook context and engagement identifier
        leading_indicator: Consumption reports surface clear patterns within 30 days of tracking activation
        failure_signal: Confidence promotions or retirement decisions made without consumption evidence
  prompt_registry:
    knowledge-vault-curator-extract-decisions-analyze:
      description: Analyze input
      source: skills/extract_decisions.yaml#step-1
      inputs:
