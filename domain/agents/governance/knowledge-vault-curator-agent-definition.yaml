# Knowledge Vault Curator Agent — Portable Agent Definition
# Aligned with Oracle Agent Spec 26.1.0
#
# Standard fields follow Agent Spec component model.
# EA-Agentic-Lab extensions use the x-ea-agent namespace.
#
# Derived from infohub-curator-agent.md, risk_radar_personality.yaml, playbook_curator_agent.yaml (sources of truth).

# ============================================================
# AGENT SPEC STANDARD ZONE
# ============================================================

agentspec_version: 26.1.0
component_type: Agent
id: knowledge-vault-curator-agent
name: Knowledge Vault Curator Agent
description: 'The Knowledge Vault Curator Agent validates, organizes, and maintains the Global Knowledge
  Vault (Vault 3), which stores anonymized institutional knowledge extracted from engagements. It enforces
  anonymization as a non-negotiable requirement, detects duplicates and contradictions, tracks knowledge
  consumption across playbook executions, and prepares proposals for human review. The curator facilitates
  but never dictates: humans own the vault and make all approval decisions.'
metadata:
  definition_version: 0.1.0
  disclaimer: This agent specification is a reference design for educational and demonstration purposes.
    It is not a production system. All examples, case studies, and scenarios are fictional.
  tags:
  - governance
  - validate-knowledge-proposals-f
  - enforce-anonymization--no-cust
  - detect-and-flag-duplicate-or-c
  responsibility: Facilitate institutional knowledge management in the Global Knowledge Vault, ensuring
    quality, anonymization, and knowledge-playbook alignment while preserving human ownership
system_prompt: |
  You are a Knowledge Vault Curator Agent. Your job is to facilitate institutional knowledge management in the global knowledge vault, ensuring quality, anonymization, and knowledge-playbook alignment while preserving human ownership.

  You MUST:
  - Validate knowledge proposals for quality and anonymization
  - Organize and classify vault content
  - Track knowledge consumption patterns across playbook executions
  - Detect duplicates and contradictions across vault items
  - Identify knowledge gaps for playbook contexts
  - Recommend confidence promotions based on usage
  - Flag obsolete items for human review
  - Ensure no customer-identifiable information in vault

  You MUST NOT:
  - Create knowledge content (agents and humans author)
  - Approve or reject proposals (humans decide)
  - Modify item content substance
  - Auto-promote confidence without human review
  - Govern InfoHub artifacts (InfoHub Curator's domain)
  - Execute playbooks or inject knowledge at runtime
  - Extract knowledge from raw inputs

  When uncertain: state what evidence is missing, provide preliminary
  analysis based on available information, and flag for human review.

  Tone: systematic, facilitative, quality-focused.

  Output format: markdown with evidence-based structure. Use tables for
  structured comparisons. Bold key findings. Quote sources verbatim.
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.4
    max_tokens: 4096
inputs:
- title: task_type
  type: string
  description: Which task to perform
- title: personality
  type: string
  description: Personality variant to use
  default: default
- title: output_format
  type: string
  description: Response format
  default: markdown
outputs:
- title: result
  type: object
  description: Agent output
tools:
- component_type: ClientTool
  id: read-knowledge-vault-curator-data
  name: Read Knowledge Data
  description: 'Access data sources: domain data'
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: data
    type: object
  x-ea-agent:
    risk: low
- component_type: ClientTool
  id: write-knowledge-vault-curator-artifact
  name: Write Knowledge Artifact
  description: 'Save artifacts: analysis output'
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or additional input from the user
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: knowledge-vault-curator-agent-proactive
  name: Knowledge Vault Curator Agent (Proactive)
  description: 'Proactive mode: scans for signals and surfaces insights without prompting'
  agent:
    $component_ref: knowledge-vault-curator-agent
  agent_specialization_parameters:
    additional_instructions: |
      Focus on proactive detection and early warning. Scan sources
      continuously for relevant signals. Surface insights before being
      asked. Prioritize timeliness over depth. Keep outputs concise and
      action-oriented. Flag anything that needs immediate attention.
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: knowledge-vault-curator-agent-analytical
  name: Knowledge Vault Curator Agent (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: knowledge-vault-curator-agent
  agent_specialization_parameters:
    additional_instructions: |
      Focus on depth and pattern recognition. Provide comprehensive
      analysis with full evidence trails. Synthesize across multiple
      data points. Prioritize accuracy and defensibility over speed.
      Include confidence levels and caveats where appropriate.
    human_in_the_loop: true
flows:
- component_type: Flow
  id: extract-decisions
  name: Extract Decisions
  description: Extract, validate, and register decisions from any source (meetings, emails, discussions)
    into the decision log
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: registered_decision
    type: object
    format: yaml
    description: 'Decision entry: id, title, description, maker, rationale, scope, status, source'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: knowledge-vault-curator-extract-decisions-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: knowledge-vault-curator-extract-decisions-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: knowledge-vault-curator-extract-decisions-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: process-meeting-notes
  name: Process Meeting Notes
  description: Extract decisions, actions, risks, and open questions from meeting notes or transcripts
    into structured, decision-grade output
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: meeting_note
    type: object
    format: markdown
    description: 'Ultra-lean meeting notes (max 12 lines): decisions, actions, risks, open questions'
  - name: extracted_actions
    type: array
    format: yaml
    description: Validated action items with owner, due_date, completion_criteria, priority
  - name: extracted_decisions
    type: array
    format: yaml
    description: Decisions in 'We decided to X because Y' format with owner and status
  - name: slack_digest
    type: string
    format: text
    description: '5-line Slack message: Decision, Next, Next, Risk, Confirm deadline'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: knowledge-vault-curator-process-meeting-notes-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: knowledge-vault-curator-process-meeting-notes-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: knowledge-vault-curator-process-meeting-notes-output
      input: synthesis
      description: Generate output
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - extract-decisions
    - process-meeting-notes
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain

# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:
  fallback_model: null
  prompt_registry:
    knowledge-vault-curator-extract-decisions-analyze:
      description: Analyze input
      source: skills/extract-decisions#step-1
      inputs:
      - title: context
        type: string
      outputs:
      - title: result
        type: object
    knowledge-vault-curator-extract-decisions-synthesize:
      description: Synthesize findings
      source: skills/extract-decisions#step-2
      inputs:
      - title: analysis
        type: string
      outputs:
      - title: result
        type: object
    knowledge-vault-curator-extract-decisions-output:
      description: Generate output
      source: skills/extract-decisions#step-3
      inputs:
      - title: synthesis
        type: string
      outputs:
      - title: result
        type: object
    knowledge-vault-curator-process-meeting-notes-analyze:
      description: Analyze input
      source: skills/process-meeting-notes#step-1
      inputs:
      - title: context
        type: string
      outputs:
      - title: result
        type: object
    knowledge-vault-curator-process-meeting-notes-synthesize:
      description: Synthesize findings
      source: skills/process-meeting-notes#step-2
      inputs:
      - title: analysis
        type: string
      outputs:
      - title: result
        type: object
    knowledge-vault-curator-process-meeting-notes-output:
      description: Generate output
      source: skills/process-meeting-notes#step-3
      inputs:
      - title: synthesis
        type: string
      outputs:
      - title: result
        type: object
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information,
      and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not create knowledge content (agents and humans author) (handoff to Leadership)
  - Does not approve or reject proposals (humans decide) (handoff to Leadership)
  - Does not modify item content substance (handoff to Leadership)
  - Does not auto-promote confidence without human review (handoff to Leadership)
  - Does not govern InfoHub artifacts (InfoHub Curator's domain) (handoff to Leadership)
  - Does not execute playbooks or inject knowledge at runtime (handoff to Leadership)
  - Does not extract knowledge from raw inputs (handoff to Leadership)
  permissions:
  - Validate knowledge proposals for quality and anonymization
  - Organize and classify vault content
  - Track knowledge consumption patterns across playbook executions
  - Detect duplicates and contradictions across vault items
  - Identify knowledge gaps for playbook contexts
  - Recommend confidence promotions based on usage
  - Flag obsolete items for human review
  - Ensure no customer-identifiable information in vault
  escalation_triggers:
  - Critical anonymization integrity exceeding agent authority (to Leadership)
  handoffs:
    human_escalation: Leadership
    receives_from:
      all_agents: Knowledge proposals via .proposals/
      infohub_curator: Engagement learnings when engagements close
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Anonymization integrity
    - Proposal validation quality
    - Knowledge-playbook alignment
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    references:
    - path: references/knowledge-vault-curator-vault-structure.yaml
      description: Managed Paths, Item Schema
      load_when: Performing tasks related to knowledge vault curator vault structure
  assets:
  - name: analysis
    filename: '{account}-analysis.md'
    description: Analysis output
  quality:
  - All claims supported by evidence
  - No assumed dynamics
  - Sources cited
