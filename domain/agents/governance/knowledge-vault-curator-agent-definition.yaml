        - vault_inventory
        priority: critical
    knowledge-vault-curator-extract-decisions-synthesize:
      description: Synthesize findings
      source: skills/extract_decisions.yaml#step-2
      inputs:
      - title: analysis
        type: string
      outputs:
      - title: result
        type: object
    knowledge-vault-curator-extract-decisions-output:
      description: Generate output
      source: skills/extract_decisions.yaml#step-3
      inputs:
      - title: synthesis
        type: string
      outputs:
      - title: result
        type: object
    knowledge-vault-curator-process-meeting-notes-analyze:
      description: Analyze input
      source: skills/process_meeting.yaml#step-1
      inputs:
      - title: context
        type: string
      outputs:
      - title: result
        type: object
      requires_data:
      - source: read-knowledge-vault-curator-data
        fields:
        - meeting_transcript
        - meeting_metadata
        priority: critical
    knowledge-vault-curator-process-meeting-notes-synthesize:
      description: Synthesize findings
      source: skills/process_meeting.yaml#step-2
      inputs:
      - title: analysis
        type: string
      outputs:
      - title: result
        type: object
    knowledge-vault-curator-process-meeting-notes-output:
      description: Generate output
      source: skills/process_meeting.yaml#step-3
      inputs:
      - title: synthesis
        type: string
      outputs:
      - title: result
        type: object
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not create knowledge content (agents and humans author) (handoff to Leadership)
  - Does not approve or reject proposals (humans decide) (handoff to Leadership)
  - Does not modify item content substance (handoff to Leadership)
  - Does not auto-promote confidence without human review (handoff to Leadership)
  - Does not govern InfoHub artifacts (InfoHub Curator's domain) (handoff to Leadership)
  - Does not execute playbooks or inject knowledge at runtime (handoff to Leadership)
  - Does not extract knowledge from raw inputs (handoff to Leadership)
  permissions:
  - Validate knowledge proposals for quality and anonymization
  - Organize and classify vault content
  - Track knowledge consumption patterns across playbook executions
  - Detect duplicates and contradictions across vault items
  - Identify knowledge gaps for playbook contexts
  - Recommend confidence promotions based on usage
  - Flag obsolete items for human review
  - Ensure no customer-identifiable information in vault
  escalation_triggers:
  - Critical anonymization integrity exceeding agent authority (to Leadership)
  handoffs:
    human_escalation: Leadership
    receives_from:
      all_agents: Knowledge proposals via .proposals/
      infohub_curator: Engagement learnings when engagements close
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Anonymization integrity
    - Proposal validation quality
    - Knowledge-playbook alignment
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - knowledge-curation
      - quality-assurance
      archetypes:
      - enterprise
      - mid-market
      - regulated-industries
    references:
    - path: references/knowledge-vault-curator-vault-structure.yaml
      description: Managed Paths, Item Schema
  assets:
  - name: analysis
    filename: '{account}-analysis.md'
    description: Analysis output
  quality:
  - All claims supported by evidence
  - No assumed dynamics
  - Sources cited
