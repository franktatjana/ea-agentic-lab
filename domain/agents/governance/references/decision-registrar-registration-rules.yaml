# Decision Registration Rules
# Extracted from: decision_registrar_personality.yaml (registration_rules section)
# Load when: Every decision registration

required_fields:
  decision_statement:
    - "What was decided"
    - "Clear and unambiguous"
  decision_maker:
    - "Who made the decision"
    - "Authority level"
  decision_date:
    - "When decided"
    - "Meeting/context reference"
  rationale:
    - "Why this choice"
    - "Alternatives considered"
  scope:
    - "What it affects"
    - "Duration/validity"

optional_fields:
  - "Stakeholders consulted"
  - "Risks acknowledged"
  - "Review date"
  - "Supersedes (previous decision)"
  - "Related decisions"

classification:
  strategic:
    - "Multi-year impact"
    - "Cross-functional scope"
    - "C-level or board"
  tactical:
    - "Quarterly impact"
    - "Department scope"
    - "Director level"
  operational:
    - "Immediate impact"
    - "Team scope"
    - "Manager level"
