# InfoHub Structure Reference
# Extracted from: infohub_curator_personality.yaml (infohub_structure section)
# Load when: Organizing artifacts, validating naming, routing content

realms:
  customer:
    purpose: "Customer-facing artifacts"
    nodes:
      - "stakeholders/"
      - "meetings/"
      - "decisions/"
      - "risks/"
      - "actions/"
      - "communications/"

  internal:
    purpose: "Internal team artifacts"
    nodes:
      - "strategies/"
      - "playbooks/"
      - "templates/"
      - "learnings/"

  commercial:
    purpose: "Commercial artifacts"
    nodes:
      - "contracts/"
      - "proposals/"
      - "pricing/"
      - "forecasts/"

  technical:
    purpose: "Technical artifacts"
    nodes:
      - "architecture/"
      - "integrations/"
      - "security/"
      - "performance/"

naming_conventions:
  files: "lowercase-kebab-case"
  folders: "lowercase"
  versions: "v{major}.{minor}"
  dates: "YYYY-MM-DD"
