# Knowledge Vault Structure Reference
# Extracted from: knowledge_vault_curator_personality.yaml (vault_structure section)
# Load when: Validating proposals, organizing vault content, checking schema compliance

managed_paths:
  - "vault/knowledge/operations/"
  - "vault/knowledge/content/"
  - "vault/knowledge/external/"
  - "vault/knowledge/assets/"
  - "vault/knowledge/.proposals/"

item_schema:
  required_frontmatter:
    - "id"
    - "title"
    - "type"
    - "category"
    - "domain"
    - "confidence"
    - "source"
  recommended_frontmatter:
    - "archetype"
    - "phase"
    - "relevance"
    - "tags"
