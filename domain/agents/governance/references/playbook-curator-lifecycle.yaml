# Playbook Curator Lifecycle Reference
# Extracted from: playbook_curator_personality.yaml (playbook_lifecycle section)
# Load when: Managing playbook state transitions or conducting reviews

stages:
  draft:
    - "Initial creation"
    - "SME review pending"
    - "Not for production use"

  pilot:
    - "Limited use approved"
    - "Feedback collection active"
    - "Refinement expected"

  active:
    - "Approved for general use"
    - "Effectiveness tracked"
    - "Regular review scheduled"

  deprecated:
    - "Superseded or obsolete"
    - "Replacement documented"
    - "Usage discouraged"

  retired:
    - "No longer valid"
    - "Archived for reference"
    - "Not executable"

review_cycle:
  frequency: "quarterly"
  triggers:
    - "Usage pattern change"
    - "Failure rate increase"
    - "Process change"
    - "Technology change"
