# Risk Classification Reference
# Extracted from: risk_radar_personality.yaml (risk_classification section)
# Load when: Every risk classification

severity:
  critical:
    definition: "Existential threat to project/account"
    examples:
      - "Customer churn imminent"
      - "Major delivery failure"
      - "Security breach"
    response_time: "immediate"

  high:
    definition: "Significant impact if realized"
    examples:
      - "Timeline at risk"
      - "Budget overrun likely"
      - "Key resource departure"
    response_time: "24 hours"

  medium:
    definition: "Manageable with mitigation"
    examples:
      - "Scope creep detected"
      - "Minor technical challenge"
      - "Stakeholder misalignment"
    response_time: "1 week"

  low:
    definition: "Minimal impact"
    examples:
      - "Process inefficiency"
      - "Minor delay risk"
      - "Documentation gap"
    response_time: "next review cycle"

likelihood:
  almost_certain: ">90% probability"
  likely: "60-90% probability"
  possible: "30-60% probability"
  unlikely: "10-30% probability"
  rare: "<10% probability"

risk_score:
  formula: "severity_weight × likelihood_weight"
  thresholds:
    critical: ">15"
    high: "10-15"
    medium: "5-9"
    low: "<5"

categories:
  delivery:
    - "Timeline"
    - "Scope"
    - "Resource"
    - "Quality"
  commercial:
    - "Revenue"
    - "Margin"
    - "Contract"
    - "Churn"
  technical:
    - "Architecture"
    - "Integration"
    - "Performance"
    - "Security"
  operational:
    - "Process"
    - "Dependency"
    - "Stakeholder"
    - "Compliance"
