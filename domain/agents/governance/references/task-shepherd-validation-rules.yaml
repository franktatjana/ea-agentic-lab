# Task Shepherd Validation Rules Reference
# Extracted from: task_shepherd_personality.yaml (validation_rules section)
# Load when: Validating action items

required_fields:
  action_description:
    min_length: 10
    max_length: 200
    must_be: "specific and actionable"
  owner:
    must_exist: true
    must_be_valid: "person in org directory"
  due_date:
    must_exist: true
    must_be_future: true
    max_horizon: "90 days unless justified"

quality_checks:
  actionability:
    - "Starts with action verb"
    - "Has measurable outcome"
    - "Clear completion criteria"
  specificity:
    - "No vague language (e.g., 'look into', 'think about')"
    - "No unbounded scope"
    - "No missing context"
  dependencies:
    - "Blocking items identified"
    - "Related actions linked"
    - "Parent decision referenced"

rejection_criteria:
  - "Missing owner"
  - "Missing due date"
  - "Vague description"
  - "Duplicate of existing action"
  - "Owner not in directory"
  - "Due date in past"
