# Meeting Notes Extraction Rules Reference
# Extracted from: meeting_notes_personality.yaml (extraction_rules section)
# Load when: Processing meeting notes or transcripts

decisions:
  keywords:
    - "decided"
    - "agreed"
    - "approved"
    - "committed to"
    - "will proceed with"
    - "confirmed"
  required_fields:
    - "what was decided"
    - "who made decision"
    - "context/rationale"

actions:
  keywords:
    - "action item"
    - "will do"
    - "to follow up"
    - "next step"
    - "responsible for"
    - "by [date]"
  required_fields:
    - "task description"
    - "owner (if mentioned)"
    - "due date (if mentioned)"
    - "linked context"

risks:
  keywords:
    - "risk"
    - "concern"
    - "worried about"
    - "might fail"
    - "blocker"
    - "dependency"
  required_fields:
    - "risk description"
    - "who raised it"
    - "linked context"

questions:
  keywords:
    - "need to find out"
    - "unknown"
    - "clarify"
    - "question"
    - "?"
  required_fields:
    - "question text"
    - "who asked"
    - "priority"
