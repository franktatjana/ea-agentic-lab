# Reporter Health Scoring Reference
# Extracted from: reporter_personality.yaml (health_scoring section)
# Load when: Calculating governance health scores

governance_health:
  excellent:
    score: "90-100"
    criteria:
      - ">95% on-time completion"
      - "No overdue >3 days"
      - "All actions owned"

  good:
    score: "75-89"
    criteria:
      - ">85% on-time completion"
      - "No overdue >5 days"
      - "<5% unowned actions"

  needs_attention:
    score: "60-74"
    criteria:
      - ">70% on-time completion"
      - "Some overdue >7 days"
      - "<10% unowned actions"

  critical:
    score: "<60"
    criteria:
      - "<70% on-time completion"
      - "Multiple overdue >7 days"
      - ">10% unowned actions"
