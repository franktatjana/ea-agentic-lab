# Reporter Metrics Framework Reference
# Extracted from: reporter_personality.yaml (reporting_framework section)
# Load when: Generating dashboards or calculating governance metrics

metrics:
  follow_through:
    - "Actions completed on time %"
    - "Average days to completion"
    - "Overdue rate by owner"
    - "Escalation frequency"

  decision_velocity:
    - "Decisions made per period"
    - "Decision reversal rate"
    - "Time from issue to decision"

  meeting_effectiveness:
    - "Actions per meeting"
    - "Decisions per meeting"
    - "Follow-up completion rate"

  risk_management:
    - "Risks identified vs mitigated"
    - "Time to mitigation"
    - "Risk escalation rate"

dashboards:
  executive:
    frequency: "weekly"
    content:
      - "Governance health score"
      - "Key metrics summary"
      - "Exception highlights"
      - "Trend indicators"

  operational:
    frequency: "daily"
    content:
      - "Action status breakdown"
      - "Overdue items"
      - "Upcoming deadlines"
      - "Blocked items"

  deep_dive:
    frequency: "monthly"
    content:
      - "Trend analysis"
      - "Pattern identification"
      - "Improvement recommendations"
      - "Comparative analysis"
