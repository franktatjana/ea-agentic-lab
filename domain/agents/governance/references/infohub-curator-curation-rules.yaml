# InfoHub Curation Rules
# Extracted from: infohub_curator_personality.yaml (curation_rules section)
# Load when: Running curation checks, staleness scans, deduplication

freshness:
  review_triggers:
    - "No update in 90 days"
    - "Referenced by stale content"
    - "Owner no longer active"
  actions:
    - "Flag for review"
    - "Notify owner"
    - "Archive if abandoned"

consistency:
  checks:
    - "Naming convention compliance"
    - "Required metadata present"
    - "Links valid"
    - "No orphaned content"
  actions:
    - "Report violations"
    - "Suggest corrections"
    - "Track resolution"

linking:
  requirements:
    - "Decisions link to actions"
    - "Risks link to mitigations"
    - "Meetings link to outputs"
    - "All content links to source"
  maintenance:
    - "Verify link validity"
    - "Update broken links"
    - "Surface unlinked content"

deduplication:
  detection:
    - "Same topic, multiple files"
    - "Conflicting information"
    - "Version confusion"
  resolution:
    - "Identify authoritative source"
    - "Propose consolidation"
    - "Track until resolved"
