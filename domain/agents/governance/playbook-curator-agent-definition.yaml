x-ea-agent:
  fallback_model: null
  profile:
    human_matters_summary: 'Playbooks are only useful if they match reality. The agent maintains inventory and flags low-usage playbooks, but the practitioner understands whether a playbook is outdated,
      whether low usage means irrelevance or just poor visibility, and how to update it so teams actually follow it. The playbook is versioned, but human judgment keeps it alive.

      '
    playbook_raci:
      responsible:
      - playbook: PB_ADM_003_validate_playbook (PB_ADM_003)
        scope: Ensure playbook executions meet quality standards and governance requirements
        team: admins
        file: PB_ADM_003_validate_playbook.yaml
      - playbook: PB_ADM_004_blueprint_gap_scan (PB_ADM_004)
        scope: Detect missing artifacts, stale data, and governance violations across the syste
        team: admins
        file: PB_ADM_004_blueprint_gap_scan.yaml
    challenges:
    - text: New playbooks are created without governance validation, leading to inconsistent structure and missing required sections
      specific_overhead:
      - Manually validating every new or modified playbook against governance structure standards and required sections
    - text: Low-usage playbooks accumulate as technical debt because no one owns the decision to retire or update them
      specific_overhead:
      - Tracking playbook usage frequency and execution patterns across all engagements to identify adoption gaps
    - text: Playbook violations go undetected because execution patterns are not monitored against governance rules
      specific_overhead:
      - Scanning the playbook inventory for governance violations such as missing steps, outdated references, or broken links
    - text: Knowledge vault updates are not reflected in playbooks that reference outdated guidance
      specific_overhead:
      - Preparing retirement recommendations by assembling usage data, age metrics, and replacement options for human review
    administrative_overhead:
    - Manually validating every new or modified playbook against governance structure standards and required sections
    - Tracking playbook usage frequency and execution patterns across all engagements to identify adoption gaps
    - Scanning the playbook inventory for governance violations such as missing steps, outdated references, or broken links
    - Preparing retirement recommendations by assembling usage data, age metrics, and replacement options for human review
    scenarios:
    - problem: New playbooks skip governance validation and enter the system with inconsistent structure
      why: 'When playbooks are created by domain experts without curator review, they often lack required sections (prerequisites, success criteria, rollback steps), use inconsistent step formats, or reference
        tools that do not exist. Agents executing these playbooks fail silently or produce inconsistent results across engagements.

        '
      agent: playbook-curator-agent
      agent_response: 'Validates every new or modified playbook against governance standards (required sections, step format, knowledge references, tool availability), returns a validation report with pass/fail
        per criterion and specific remediation guidance for any failures.

        '
      success_signal:
        metric: Percentage of playbooks passing governance validation before activation
        target: 100% of playbooks validated before entering the active inventory
        leading_indicator: Validation turnaround time under 4 hours for new submissions
        failure_signal: Agents execute playbooks that fail governance standards because validation was skipped
    - problem: Unused playbooks accumulate and dilute the inventory with outdated or irrelevant guidance
      why: 'Playbooks are created for specific situations but never retired when those situations become irrelevant. Over time, the inventory grows to dozens of playbooks, agents pull guidance from outdated
        processes, and practitioners lose trust in the playbook system because too many entries feel stale.

        '
      agent: playbook-curator-agent
      agent_response: 'Analyzes playbook usage data and age metrics, identifies playbooks with zero or declining execution over configurable thresholds, and generates a retirement recommendation with usage
        evidence so humans can decide whether to retire, update, or keep each candidate.

        '
      success_signal:
        metric: Playbook inventory freshness rate
        target: Less than 10% of active playbooks have zero usage in the trailing 90 days
        leading_indicator: Retirement recommendations reviewed by human curator within one week
        failure_signal: More than 25% of active playbooks show no execution in trailing 90 days
    - problem: Playbook violations go undetected because execution patterns are not monitored against governance rules
      why: 'Agents and practitioners execute playbooks but skip steps, use unauthorized tool substitutions, or deviate from prescribed sequences without detection. Without violation monitoring, governance
        standards exist on paper but are not enforced in practice, and the gap between intended process and actual execution widens silently over time.

        '
      agent: playbook-curator-agent
      agent_response: 'Scans playbook execution logs against governance rules (required steps, step ordering, tool usage, knowledge references) to detect deviations. Generates a violation report with specific
        evidence (which playbook, which step, what was expected versus what happened) so governance owners can address systemic compliance gaps.

        '
      success_signal:
        metric: Playbook governance violations detected per reporting cycle
        target: 100% of playbook executions scanned for violations within 48 hours of completion
        leading_indicator: Violation types shift from structural (missing steps) to nuanced (ordering deviations)
        failure_signal: Governance audits discover systemic playbook deviations that were never flagged by automated scans
    - problem: Knowledge vault updates are not reflected in playbooks that reference outdated guidance
      why: 'When the Knowledge Vault Curator updates or deprecates vault items, playbooks that reference those items continue pointing to stale guidance. Agents executing the playbook pull outdated knowledge
        without awareness that newer guidance exists, producing recommendations that contradict the current institutional learning.

        '
      agent: playbook-curator-agent
      agent_response: 'Maintains a dependency map between playbooks and knowledge vault items. When the Knowledge Vault Curator flags an item as updated or deprecated, the Playbook Curator identifies all
        affected playbooks and generates an update recommendation report listing which playbooks need revision and what knowledge references are now stale.

        '
      success_signal:
        metric: Playbooks with stale knowledge references identified after vault updates
        target: 100% of affected playbooks flagged within 72 hours of a vault item update or deprecation
        leading_indicator: Playbook-to-vault dependency map covers all active playbooks
        failure_signal: Playbook execution produces recommendations based on deprecated vault knowledge
