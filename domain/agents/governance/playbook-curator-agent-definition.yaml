toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: playbook-curator-agent-proactive
  name: Playbook Curator Agent (Proactive)
  description: 'Proactive mode: scans for signals and surfaces insights without prompting'
  agent:
    $component_ref: playbook-curator-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan sources

      continuously for relevant signals. Surface insights before being

      asked. Prioritize timeliness over depth. Keep outputs concise and

      action-oriented. Flag anything that needs immediate attention.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: playbook-curator-agent-analytical
  name: Playbook Curator Agent (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: playbook-curator-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Provide comprehensive

      analysis with full evidence trails. Synthesize across multiple

      data points. Prioritize accuracy and defensibility over speed.

      Include confidence levels and caveats where appropriate.

      '
    human_in_the_loop: true
flows:
- component_type: Flow
  id: extract-decisions
  name: Extract Decisions
  description: Extract, validate, and register decisions from any source (meetings, emails, discussions) into the decision log
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: registered_decision
    type: object
    format: yaml
    description: 'Decision entry: id, title, description, maker, rationale, scope, status, source'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: playbook-curator-extract-decisions-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: playbook-curator-extract-decisions-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: playbook-curator-extract-decisions-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: process-meeting-notes
  name: Process Meeting Notes
  description: Extract decisions, actions, risks, and open questions from meeting notes or transcripts into structured, decision-grade output
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: meeting_note
    type: object
    format: markdown
    description: 'Ultra-lean meeting notes (max 12 lines): decisions, actions, risks, open questions'
  - name: extracted_actions
    type: array
    format: yaml
    description: Validated action items with owner, due_date, completion_criteria, priority
  - name: extracted_decisions
    type: array
    format: yaml
    description: Decisions in 'We decided to X because Y' format with owner and status
  - name: slack_digest
    type: string
    format: text
    description: '5-line Slack message: Decision, Next, Next, Risk, Confirm deadline'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: playbook-curator-process-meeting-notes-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: playbook-curator-process-meeting-notes-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: playbook-curator-process-meeting-notes-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: playbook-curator
  name: Playbook Curator
  description: Flow for playbook curator tasks.
  inputs:
  - title: age_data
    type: string
  - title: category
    type: string
  - title: count
    type: string
  - title: date
    type: string
  - title: description
    type: string
  - title: execution_data
    type: string
  - title: list
    type: string
  - title: playbook_content
    type: string
  outputs:
  - title: playbook_curator_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: playbook-curator-validate-playbook
      input: playbook_id, category, playbook_content, playbook_id
      description: Validate new or modified playbook
    - step: 2
      prompt: playbook-curator-playbook-usage-report
      input: week_start, week_end, execution_data, date
      description: Generate weekly playbook usage report
    - step: 3
      prompt: playbook-curator-detect-violations
      input: playbook_list, playbook_id, description, playbook_id
      description: Scan for playbook governance violations
    - step: 4
      prompt: playbook-curator-recommend-retirement
      input: usage_data, age_data, playbook_id, date
      description: Identify playbooks for retirement
