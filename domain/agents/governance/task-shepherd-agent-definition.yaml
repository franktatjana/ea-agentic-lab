# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:
  fallback_model: null
  profile:
    human_matters_summary: >
      Action items are only real if someone will do them. The agent validates
      structure and rejects vague commitments, but the task owner understands
      whether deadlines are realistic, whether the person assigned can actually
      deliver, and how to frame the work so it gets done. The validation is
      applied, but human judgment determines whether commitments are real.
    challenges:
      - "Action items arrive from meetings with vague descriptions like 'follow up on that' and no clear owner"
      - "Duplicate actions pile up because the same commitment gets captured in multiple meetings under different wording"
      - "Due dates are either missing or unrealistic, set without considering the owner's existing workload"
      - "Actions without clear completion criteria stay open indefinitely because no one can confirm when they are done"
    administrative_overhead:
      - "Manually reviewing each incoming action item for completeness: owner, due date, description, and done_means"
      - "Cross-checking new actions against the existing tracker to identify and merge duplicates"
      - "Sending rejection feedback to action submitters with specific guidance on what fields are missing or inadequate"
      - "Running weekly action hygiene audits to catch items that degraded in quality after initial validation"
    scenarios:
      - problem: "Vague action items enter the tracker and clog the system with unactionable work"
        why: >
          Meeting Notes Agent extracts actions verbatim from discussions, which
          often include phrases like "someone should look into this" or "we need
          to figure that out." Without a validation gate, these vague items enter
          the tracker, the Nudger sends reminders for work no one can execute,
          and the whole governance pipeline loses credibility.
        agent: task-shepherd-agent
        agent_response: >
          Validates every incoming action against quality criteria: named owner
          (real person, not a team), concrete due date, and explicit done_means.
          Rejects non-compliant actions with specific feedback explaining what
          is missing and how to fix it, then re-validates on resubmission.
        success_signal:
          metric: "Action validation pass rate on first submission"
          target: "70% of actions pass validation on first attempt within 30 days of adoption"
          leading_indicator: "Rejection reasons shift from missing fields to quality improvements"
          failure_signal: "More than 40% of actions in the tracker lack owner, due date, or done_means"
      - problem: "Duplicate actions from different meetings create conflicting ownership and double work"
        why: >
          The same commitment gets discussed in multiple meetings and captured each
          time as a new action. Two people end up owning the same deliverable with
          different due dates, leading to confusion about who is accountable and
          wasted effort when both deliver independently.
        agent: task-shepherd-agent
        agent_response: >
          Compares incoming actions against existing tracker entries using semantic
          similarity and owner overlap detection. When a probable duplicate is found,
          surfaces a merge recommendation with both versions side-by-side so humans
          can confirm which record to keep and which to retire.
        success_signal:
          metric: "Duplicate actions detected before entering the tracker"
          target: "90% of semantic duplicates flagged before both become active"
          leading_indicator: "Merge recommendations accepted by humans within 24 hours"
          failure_signal: "Multiple active actions for the same deliverable with different owners discovered in weekly audit"
      - problem: "Due dates are either missing or unrealistic, set without considering the owner's existing workload"
        why: >
          Actions enter the tracker with due dates that are either absent or set
          arbitrarily during the meeting without checking the owner's capacity. When
          due dates are unrealistic, the Nudger sends reminders for work that cannot
          physically be completed in time, owners learn to ignore governance deadlines,
          and follow-through metrics become meaningless because misses reflect bad
          planning rather than poor execution.
        agent: task-shepherd-agent
        agent_response: >
          Validates that every incoming action includes a due date, flags dates that
          fall within unrealistic windows (e.g., same-day for complex deliverables),
          and cross-references the owner's existing active actions to surface
          overcommitment warnings. Returns constructive feedback suggesting revised
          timelines when due dates appear infeasible.
        success_signal:
          metric: "Percentage of validated actions with realistic due dates"
          target: "85% of actions with validated due dates are completed within one business day of the original deadline"
          leading_indicator: "Overcommitment warnings trigger due date revisions before actions enter the tracker"
          failure_signal: "More than 30% of actions miss their due date by 5+ days despite passing validation"
      - problem: "Actions without clear completion criteria stay open indefinitely because no one can confirm when they are done"
        why: >
          When an action lacks explicit done_means criteria, neither the owner nor the
          Signal Matcher Agent can determine what constitutes completion. The action
          remains open in the tracker indefinitely, cluttering the active list, skewing
          follow-through metrics, and creating friction every time someone asks whether
          the work is finished.
        agent: task-shepherd-agent
        agent_response: >
          Requires a done_means field on every action and rejects submissions where
          the completion criteria are vague (e.g., "done when resolved" without
          specifying what "resolved" means). Provides examples of well-formed
          completion criteria in rejection feedback so submitters can rewrite and
          resubmit with observable, confirmable definitions of done.
        success_signal:
          metric: "Percentage of active actions with explicit, testable completion criteria"
          target: "95% of actions in the tracker have done_means that the Signal Matcher can evaluate"
          leading_indicator: "Signal Matcher match rate improves as completion criteria quality increases"
          failure_signal: "Actions remain open for 30+ days because no one can determine if the work satisfies the criteria"
  prompt_registry:
    task-shepherd-validate-action:
      description: Ensure action meets quality standards
      source: prompts/tasks.yaml#task_shepherd.validate_action
      inputs:
      - title: action_text
        type: string
      - title: source
