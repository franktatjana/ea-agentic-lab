    type: object
    format: yaml
    description: 'Decision entry: id, title, description, maker, rationale, scope, status, source'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: task-shepherd-extract-decisions-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: task-shepherd-extract-decisions-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: task-shepherd-extract-decisions-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: process-meeting-notes
  name: Process Meeting Notes
  description: Extract decisions, actions, risks, and open questions from meeting notes or transcripts
    into structured, decision-grade output
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: meeting_note
    type: object
    format: markdown
    description: 'Ultra-lean meeting notes (max 12 lines): decisions, actions, risks, open questions'
  - name: extracted_actions
    type: array
    format: yaml
    description: Validated action items with owner, due_date, completion_criteria, priority
  - name: extracted_decisions
    type: array
    format: yaml
    description: Decisions in 'We decided to X because Y' format with owner and status
  - name: slack_digest
    type: string
    format: text
    description: '5-line Slack message: Decision, Next, Next, Risk, Confirm deadline'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: task-shepherd-process-meeting-notes-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: task-shepherd-process-meeting-notes-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: task-shepherd-process-meeting-notes-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: task-shepherd
  name: Task Shepherd
  description: Flow for task shepherd tasks.
  inputs:
  - title: account_name
    type: string
  - title: action_list
    type: string
  - title: action_text
    type: string
  - title: action_tracker
    type: string
  - title: audit_date
    type: string
  - title: count
    type: string
  - title: existing_action_id
    type: string
  - title: id
    type: string
  outputs:
  - title: task_shepherd_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: task-shepherd-validate-action
      input: action_text, source, action_text
      description: Ensure action meets quality standards
    - step: 2
      prompt: task-shepherd-weekly-action-audit
      input: account_name, action_tracker, audit_date, count
      description: Audit all actions for hygiene
    - step: 3
      prompt: task-shepherd-merge-duplicate-actions
      input: new_action, action_list, new_action, existing_action_id
      description: Identify and merge duplicate actions
    - step: 4
      prompt: task-shepherd-priority-inference
      input: action_text, source_context, action_text
      description: Infer priority from context
