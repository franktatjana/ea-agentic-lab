      outputs:
      - title: validate-action_result
        type: object
      requires_data:
      - source: read-task-shepherd-data
        fields: [action_item, existing_action_tracker]
        priority: critical
    task-shepherd-weekly-action-audit:
      description: Audit all actions for hygiene
      source: prompts/tasks.yaml#task_shepherd.weekly_action_audit
      inputs:
      - title: account_name
        type: string
      - title: action_tracker
        type: string
      - title: audit_date
        type: string
      - title: count
        type: string
      - title: list
        type: string
      outputs:
      - title: weekly-action-audit_result
        type: object
      requires_data:
      - source: read-task-shepherd-data
        fields: [action_tracker, action_quality_metrics]
        priority: critical
    task-shepherd-merge-duplicate-actions:
      description: Identify and merge duplicate actions
      source: prompts/tasks.yaml#task_shepherd.merge_duplicate_actions
      inputs:
      - title: action_list
        type: string
      - title: existing_action_id
        type: string
      - title: id
        type: string
      - title: new_action
        type: string
      outputs:
      - title: merge-duplicate-actions_result
        type: object
      requires_data:
      - source: read-task-shepherd-data
        fields: [action_list, action_tracker]
        priority: critical
    task-shepherd-priority-inference:
      description: Infer priority from context
      source: prompts/tasks.yaml#task_shepherd.priority_inference
      inputs:
      - title: action_text
        type: string
      - title: source_context
        type: string
      outputs:
      - title: priority-inference_result
        type: object
      requires_data:
