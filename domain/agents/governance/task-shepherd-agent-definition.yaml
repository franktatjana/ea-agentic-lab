        fields: [action_item, source_context]
        priority: critical
    task-shepherd-extract-decisions-analyze:
      description: Analyze input
      source: skills/extract-decisions#step-1
      inputs:
      - title: context
        type: string
      outputs:
      - title: result
        type: object
      requires_data:
      - source: read-task-shepherd-data
        fields: [source_content, action_tracker]
        priority: critical
    task-shepherd-extract-decisions-synthesize:
      description: Synthesize findings
      source: skills/extract-decisions#step-2
      inputs:
      - title: analysis
        type: string
      outputs:
      - title: result
        type: object
    task-shepherd-extract-decisions-output:
      description: Generate output
      source: skills/extract-decisions#step-3
      inputs:
      - title: synthesis
        type: string
      outputs:
      - title: result
        type: object
    task-shepherd-process-meeting-notes-analyze:
      description: Analyze input
      source: skills/process-meeting-notes#step-1
      inputs:
      - title: context
        type: string
      outputs:
      - title: result
        type: object
      requires_data:
      - source: read-task-shepherd-data
        fields: [meeting_transcript, meeting_metadata]
        priority: critical
    task-shepherd-process-meeting-notes-synthesize:
      description: Synthesize findings
      source: skills/process-meeting-notes#step-2
      inputs:
      - title: analysis
        type: string
      outputs:
      - title: result
        type: object
    task-shepherd-process-meeting-notes-output:
      description: Generate output
      source: skills/process-meeting-notes#step-3
      inputs:
      - title: synthesis
        type: string
      outputs:
      - title: result
        type: object
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information,
      and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not extract actions from meetings (Meeting Notes' domain) (handoff to Leadership)
  - Does not send reminders (Nudger's domain) (handoff to Leadership)
  - Does not complete actions on behalf of owners (handoff to Leadership)
  - Does not modify action content (handoff to Leadership)
  - Does not extend due dates autonomously (handoff to Leadership)
  - Does not prioritize actions (Reporter's domain) (handoff to Leadership)
  permissions:
  - Validate action item completeness
  - Ensure owners are assigned and valid
  - Verify due dates are realistic
  - Check for duplicate actions
  - Link actions to parent decisions
  - Route validated actions to Nudger
  escalation_triggers:
  - Critical owner validation exceeding agent authority (to Leadership)
  handoffs:
    human_escalation: Leadership
    receives_from:
      meeting_notes: Raw actions for validation
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Owner validation
    - Due date verification
    - Description quality
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains: [task-management, quality-gates]
      archetypes: [enterprise, mid-market]
    references:
    - path: references/task-shepherd-validation-rules.yaml
      description: Required Fields, Quality Checks, Rejection Criteria
  assets:
  - name: artifacts
    filename: '{account}-artifacts.md'
    description: artifacts
  - name: reports
    filename: '{account}-reports.md'
    description: reports
  quality:
  - All claims supported by evidence
  - No assumed dynamics
  - Sources cited
