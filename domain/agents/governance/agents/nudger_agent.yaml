# Nudger Agent (Reminder Agent)
# Purpose: Make follow-through unavoidable without babysitting

agent_id: "nudger_agent"
team: "governance"
category: "entropy_reduction"
purpose: "Make follow-through unavoidable without babysitting adults"

core_functions:
  - "Scan action tracker for overdue and approaching-due items"
  - "Issue reminder nudges via declared output channel"
  - "Escalate to human when item overdue > threshold"
  - "Log nudge history to prevent duplicate noise"

inputs:
  - "{realm}/{node}/internal-infohub/actions/action_tracker.yaml"
  - "OP_ACT_001 output, newly created action items"

outputs:
  - "{realm}/{node}/internal-infohub/actions/nudge_log.yaml"
  - "Slack/email notification to action owner"

mechanics:
  - "Runs on schedule (daily 9am + 2pm) and on action_created event"
  - "Compares due_date against today; classifies as approaching / overdue"
  - "Issues nudge if no nudge sent in last 24h for same item"
  - "Escalates to human after 3 missed nudges on same item"

escalation_to: "Governance Lead"

trigger:
  schedule:
    - cron: "0 9 * * 1-5"      # Daily 9am weekdays
    - cron: "0 14 * * 1-5"     # Daily 2pm weekdays (escalation check)
  events:
    - "action_created"
    - "action_due_approaching"
    - "action_overdue"

processing:
  checks:
    - id: "due_soon"
      condition: "due_date within 2 days"
      action: "Send reminder to owner"
      template: "friendly_reminder"
    - id: "overdue"
      condition: "due_date passed"
      action: "Send escalation notice"
      template: "overdue_notice"
      escalate_after: "2 days"
    - id: "missing_owner"
      condition: "owner is null or 'TBD'"
      action: "Flag for assignment"
      notify: "meeting_organizer"
    - id: "missing_date"
      condition: "due_date is null and age > 3 days"
      action: "Request due date"
      notify: "owner"
    - id: "stalled"
      condition: "status unchanged for > 7 days"
      action: "Check-in with owner"
      template: "status_check"

escalation_rules:
  - trigger: "overdue > 2 days"
    action: "Notify owner's manager"
  - trigger: "overdue > 5 days"
    action: "Escalate to governance lead"
  - trigger: "blocked > 3 days"
    action: "Route to blocker_resolver"

quality_gates:
  - "No spam: max 1 reminder per action per day"
  - "Escalation requires overdue proof"
  - "Owner must exist before reminder"

integrations:
  reads_from:
    - "action_tracker"
    - "decision_log"
    - "org_chart"
  writes_to:
    - "nudge_log"
  notifies:
    - "action_owners"
    - "managers"
    - "governance_lead"

skills:
  owned: []

playbooks:
  owned:
    - "PB_GOV_001"   # Nudge Effectiveness Review
  contributes_to:
    - "OP_ESC_001"   # Escalate Blocked Action

execution:
  trigger_sources:
    - "scheduled_cadence"
    - "action_created"
    - "action_overdue"
  output_destination: "{realm}/{node}/internal-infohub/actions/"
  escalation_threshold: "action overdue > 3 nudges with no response"
