# Risk Radar Agent (Risk & Signals Agent)
# Purpose: Surface risks early and keep them visible

agent_id: "risk_radar_agent"
team: "governance"
category: "entropy_reduction"
purpose: "Surface risks early and keep them visible"

core_functions:
  - "Scan meeting notes, decisions, and action blocks for risk signals"
  - "Classify risks by type and severity using risk-classification.yaml"
  - "Register new risks to the risk register via OP_RSK_001"
  - "Maintain weekly risk review cadence and surface trending risks"
  - "Alert stakeholders when risk severity escalates"

inputs:
  - "{realm}/{node}/internal-infohub/meetings/"
  - "{realm}/{node}/internal-infohub/decisions/"
  - "{realm}/{node}/internal-infohub/risks/risk_register.yaml"

outputs:
  - "{realm}/{node}/internal-infohub/risks/risk_register.yaml"
  - "Risk alert notifications to relevant agents and owners"

mechanics:
  - "Keyword scan across infohub content on each trigger event"
  - "Scores risk confidence against references/risk-classification.yaml"
  - "Deduplicates against existing register before creating new entry"
  - "Weekly review aggregates open risks and produces trending summary"

escalation_to: "Governance Lead"

trigger:
  events:
    - "meeting_note_published"
    - "decision_made"
    - "action_blocked"
    - "health_score_dropped"
  schedule:
    - cron: "0 9 * * 1-5"       # Daily scan
    - cron: "0 10 * * 1"        # Weekly risk review
  keywords:
    - "risk"
    - "concern"
    - "blocker"
    - "delay"
    - "issue"
    - "problem"
    - "worried"
    - "might not"

processing:
  detection:
    - id: "explicit_risks"
      description: "Risks explicitly mentioned"
      patterns:
        - "risk:"
        - "concern:"
        - "blocker:"
    - id: "implicit_risks"
      description: "Signals that suggest risk"
      patterns:
        - "might not make"
        - "running behind"
        - "waiting on"
        - "no response from"
        - "competitor mentioned"
        - "budget concern"
        - "stakeholder change"
    - id: "derived_risks"
      description: "Risks inferred from data"
      rules:
        - "Action overdue > 5 days → delivery risk"
        - "Decision pending > 10 days → stall risk"
        - "No champion contact > 14 days → relationship risk"
        - "Health score < 70 → account risk"

  classification:
    severity_levels:
      - critical: "Deal/account threatening, immediate action"
      - high: "Significant impact, action within 48h"
      - medium: "Moderate impact, action within week"
      - low: "Minor impact, monitor"
    categories:
      - "technical"
      - "commercial"
      - "relationship"
      - "competitive"
      - "timeline"
      - "resource"
      - "compliance"

  enrichment:
    - assign_owner: "Based on risk category"
    - set_review_date: "Based on severity"
    - link_mitigations: "From action tracker"
    - calculate_exposure: "Impact × probability"

risk_lifecycle:
  states:
    - "Identified"
    - "Assessed"
    - "Mitigating"
    - "Monitoring"
    - "Mitigated"
    - "Accepted"
    - "Materialized"
  review_cadence:
    critical: "Daily"
    high: "Every 2 days"
    medium: "Weekly"
    low: "Bi-weekly"

quality_gates:
  - "All risks have owner"
  - "All risks have severity"
  - "Critical risks have mitigation plan"
  - "No duplicate risks"
  - "Stale risks flagged (no update > 14 days)"

integrations:
  reads_from:
    - "meeting_notes"
    - "action_tracker"
    - "decision_log"
    - "health_score"
  writes_to:
    - "risk_register"
  notifies:
    - "risk_owner"
    - "account_lead"
    - "governance_lead"

skills:
  owned: []

playbooks:
  owned:
    - "PB_GOV_004"   # Risk Review
  contributes_to:
    - "OP_RSK_001"   # Register New Risk
    - "OP_HLT_001"   # Health Score Alert

execution:
  trigger_sources:
    - "meeting_note_published"
    - "decision_made"
    - "action_blocked"
    - "health_score_dropped"
    - "scheduled_cadence"
  output_destination: "{realm}/{node}/internal-infohub/risks/"
  escalation_threshold: "risk.severity == CRITICAL and owner unassigned > 24h"
