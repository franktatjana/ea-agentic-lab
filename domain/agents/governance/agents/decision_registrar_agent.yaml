# Decision Registrar Agent (Decision Log Keeper)
# Purpose: Kill "who decided this?" forever

agent_id: "decision_registrar_agent"
team: "governance"
category: "entropy_reduction"
purpose: "Kill 'who decided this?' forever"

core_functions:
  - "Extracts decisions from meetings, Slack, and email"
  - "Validates decision completeness (owner, context, scope)"
  - "Tracks decision lifecycle (Proposed → Confirmed → Implemented)"
  - "Maintains audit trail for all decision changes"

mechanics:
  - "NLP detection of decision language patterns"
  - "Validates required fields before registration"
  - "Links decisions to affected scope and alternatives"

escalation_to: "Governance Lead"

trigger:
  events:
    - "decision_mentioned"        # NLP detection in notes
    - "meeting_note_published"
    - "decision_submitted"
  keywords:
    - "decided"
    - "agreed"
    - "approved"
    - "rejected"
    - "committed to"
    - "will proceed with"

inputs:
  sources:
    - "{realm}/{node}/meetings/"
    - "{realm}/{node}/external-infohub/decisions/decision_log.yaml"
    - "slack_threads"             # If integrated
    - "email_threads"             # If integrated

processing:
  extraction:
    - id: "detect_decision"
      patterns:
        - "We decided to..."
        - "Decision: ..."
        - "Approved: ..."
        - "Go/No-go: ..."
      output: "candidate_decisions"

  validation:
    required_fields:
      - decision_id
      - description
      - status            # Proposed | Confirmed | Reverted
      - owner             # Decision maker
      - date
      - context           # Why this decision
    optional_fields:
      - affected_scope    # What areas impacted
      - alternatives      # Options considered
      - evidence          # Supporting data
      - expiry            # Review date if temporary

  lifecycle:
    states:
      - "Proposed"        # Under discussion
      - "Confirmed"       # Approved and active
      - "Implemented"     # Executed
      - "Reverted"        # Rolled back
      - "Superseded"      # Replaced by another decision
    transitions:
      - from: "Proposed"
        to: ["Confirmed", "Reverted"]
        requires: "decision_maker_approval"
      - from: "Confirmed"
        to: ["Implemented", "Reverted", "Superseded"]

outputs:
  artifacts:
    - type: "decision_log_entry"
      path: "{realm}/{node}/external-infohub/decisions/decision_log.yaml"
    - type: "decision_digest"
      format: "markdown"
      destination: "stakeholders"
  reports:
    - type: "decisions_this_week"
      content:
        - new_decisions
        - status_changes
        - pending_approvals

audit_trail:
  track:
    - who_made_decision
    - when_made
    - what_context
    - who_was_present
    - what_alternatives_rejected

quality_gates:
  - "Decision has single owner"
  - "Context/rationale documented"
  - "Affected scope identified"
  - "No duplicate decisions"

integrations:
  reads_from:
    - "meeting_notes"
    - "slack"
    - "email"
  writes_to:
    - "decision_log"
  notifies:
    - "stakeholders"
    - "affected_teams"

skills:
  owned:
    - "SK_GOV_002"  # Extract Decisions

playbooks:
  owned:
    - "PB_GOV_003"  # Weekly Decision Digest
  contributes_to:
    - "OP_MTG_001"  # Process Meeting Notes (receives extracted decisions)

execution:
  trigger_sources:
    - "meeting_note_published"
    - "decision_submitted"
    - "slack_decision_detected"
  output_destination: "{realm}/{node}/external-infohub/decisions/"
  escalation_threshold: "conflicting_decisions_detected"
