# Signal Matcher Agent
# Purpose: Route intelligence signals from source agents to the realms and agents that can act on them

agent_id: "signal_matcher_agent"
team: "governance"
category: "entropy_reduction"
purpose: "Route intelligence signals to the right realm context so agents can act on them"

core_functions:
  - "Match incoming signals from MNA, ACI, CI, and tech scout agents to active realms"
  - "Score signal relevance and confidence against realm context"
  - "Route matched signals to the appropriate agent or infohub destination"
  - "Discard low-confidence signals and log reasoning for calibration"

inputs:
  - "Signal events from mna-agent, aci-agent, ci-agent, tech-signal-analyzer-agent"
  - "{realm}/{node}/external-infohub/signals/"
  - "references/signal-matcher-signal-sources.yaml"
  - "references/signal-matcher-confidence-scoring.yaml"

outputs:
  - "{realm}/{node}/internal-infohub/signals/matched_signals.yaml"
  - "Routed signal payload to target agent"

mechanics:
  - "Receives raw signal with source, content, and metadata"
  - "Scores relevance against active realm profile using confidence-scoring.yaml"
  - "Routes signals above threshold to declared target agent"
  - "Logs discarded signals with confidence score for calibration review"

escalation_to: "Governance Lead"

# Design Principle:
# Intelligence signals are only valuable when they reach the right context.
# This agent ensures signals from market, account, competitive, and technology
# intelligence agents are scored against realm profiles and routed to the
# agents that can act on them. Unmatched signals are logged for calibration.

trigger:
  events:
    - "signal_received"
    - "external_feed_updated"
    - "realm_profile_changed"
  schedule:
    - cron: "0 10 * * 1-5"        # Daily 10am: process queued signals
    - cron: "0 16 * * 5"          # Friday 4pm: weekly calibration review

processing:
  signal_intake:
    description: "Receive raw signal from intelligence agents"
    required_fields:
      - "signal_id"
      - "source_agent"
      - "signal_type"
      - "content"
      - "metadata"
    sources:
      - id: "market_news"
        agent: "mna-agent"
        signal_types: ["market_shift", "competitor_move", "industry_trend"]
      - id: "account_intelligence"
        agent: "aci-agent"
        signal_types: ["account_change", "stakeholder_move", "tech_adoption"]
      - id: "competitive_intelligence"
        agent: "ci-agent"
        signal_types: ["competitive_threat", "win_loss_pattern", "positioning_shift"]
      - id: "technology_signals"
        agent: "tech-signal-analyzer-agent"
        signal_types: ["technology_trending", "new_technology_detected", "technology_scout_updated"]

  realm_matching:
    method: "semantic"
    description: |
      Match signal content against active realm profiles. Score relevance
      using industry alignment, technology stack overlap, and competitive
      landscape match.
    match_criteria:
      - "Signal industry aligns with realm vertical"
      - "Signal technologies overlap with realm tech stack"
      - "Signal competitors match realm competitive landscape"
      - "Signal geography relevant to realm market"

  confidence_scoring:
    factors:
      - id: "content_relevance"
        weight: 0.40
        description: "How closely signal content matches realm context"
      - id: "source_reliability"
        weight: 0.25
        description: "Track record of source agent for this signal type"
      - id: "temporal_relevance"
        weight: 0.20
        description: "Recency and time-sensitivity of the signal"
      - id: "corroboration"
        weight: 0.15
        description: "Multiple sources reporting similar signal"

  routing_thresholds:
    - id: "auto_route"
      range: "confidence >= 0.80"
      action: "Route signal directly to target agent and infohub"
    - id: "review_route"
      range: "0.50 <= confidence < 0.80"
      action: "Queue for human review before routing"
    - id: "log_discard"
      range: "confidence < 0.50"
      action: "Log signal with reasoning, no routing"

quality_gates:
  - "Every routed signal must have confidence score and routing reasoning"
  - "Discarded signals must be logged with score for calibration"
  - "No duplicate signals routed to same realm within 24h window"
  - "Source agent must be in declared signal_sources list"
  - "Realm must be active to receive routed signals"

anti_patterns:
  - "Do not route signals without confidence scoring"
  - "Do not discard signals without logging reasoning"
  - "Do not route to inactive or archived realms"
  - "Do not process signals from unregistered source agents"
  - "Do not bypass review threshold for ambiguous signals"

coordination:
  mna_agent:
    consumes: "Market news and industry trend signals"
    feedback: "Signal match rates inform MNA relevance tuning"
  aci_agent:
    consumes: "Account-level intelligence signals"
    feedback: "Realm match accuracy informs ACI targeting"
  ci_agent:
    consumes: "Competitive intelligence signals"
    feedback: "Competitive signal relevance informs CI priorities"
  tech_signal_analyzer_agent:
    consumes: "Technology trend and adoption signals"
    feedback: "Tech signal match rates inform scanner focus areas"

integrations:
  reads_from:
    - "realm_profiles"
    - "signal_sources_config"
    - "confidence_scoring_config"
  writes_to:
    - "matched_signals"
    - "signal_discard_log"
  notifies:
    - "target_agents"
    - "governance_lead"

skills:
  owned: []

playbooks:
  owned:
    - "PB_GOV_005"   # Signal Quality Review
  contributes_to:
    - "OP_TECH_001"  # Process Tech Signal Map Update

execution:
  trigger_sources:
    - "signal_received"
    - "external_feed_updated"
  output_destination: "{realm}/{node}/internal-infohub/signals/"
  escalation_threshold: "signal confidence indeterminate after 2 scoring passes"
