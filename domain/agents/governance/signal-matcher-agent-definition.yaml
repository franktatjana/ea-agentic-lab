    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or additional input from the user
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: signal-matcher-agent-proactive
  name: Signal Matcher Agent (Proactive)
  description: 'Proactive mode: scans for signals and surfaces insights without prompting'
  agent:
    $component_ref: signal-matcher-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan sources

      continuously for relevant signals. Surface insights before being

      asked. Prioritize timeliness over depth. Keep outputs concise and

      action-oriented. Flag anything that needs immediate attention.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: signal-matcher-agent-analytical
  name: Signal Matcher Agent (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: signal-matcher-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Provide comprehensive

      analysis with full evidence trails. Synthesize across multiple

      data points. Prioritize accuracy and defensibility over speed.

      Include confidence levels and caveats where appropriate.

      '
    human_in_the_loop: true
flows:
- component_type: Flow
  id: extract-decisions
  name: Extract Decisions
  description: Extract, validate, and register decisions from any source (meetings, emails, discussions) into the decision log
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: registered_decision
    type: object
    format: yaml
    description: 'Decision entry: id, title, description, maker, rationale, scope, status, source'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: signal-matcher-extract-decisions-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: signal-matcher-extract-decisions-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: signal-matcher-extract-decisions-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: process-meeting-notes
  name: Process Meeting Notes
  description: Extract decisions, actions, risks, and open questions from meeting notes or transcripts into structured, decision-grade output
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: meeting_note
    type: object
    format: markdown
    description: 'Ultra-lean meeting notes (max 12 lines): decisions, actions, risks, open questions'
  - name: extracted_actions
    type: array
    format: yaml
    description: Validated action items with owner, due_date, completion_criteria, priority
  - name: extracted_decisions
    type: array
    format: yaml
    description: Decisions in 'We decided to X because Y' format with owner and status
  - name: slack_digest
    type: string
    format: text
    description: '5-line Slack message: Decision, Next, Next, Risk, Confirm deadline'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: signal-matcher-process-meeting-notes-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: signal-matcher-process-meeting-notes-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: signal-matcher-process-meeting-notes-output
      input: synthesis
      description: Generate output
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - extract-decisions
    - process-meeting-notes
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain
x-ea-agent:
  fallback_model: null
  profile:
    human_matters_summary: 'Evidence of work is not evidence of completion. The agent detects completion signals from natural artifacts and flags matches, but humans validate whether completion is real,
      whether the evidence indicates true progress or just activity, and how to credit work people actually did. The signal is matched, but human judgment validates it.

      '
    challenges:
    - text: Completion evidence exists in meeting notes, emails, and daily ops but is never connected to the action it fulfills
      specific_overhead:
      - Manually scanning meeting notes, daily ops updates, and POC logs to find evidence that an action was completed
    - text: False positive matches waste human review time when signals look like completion but reflect unrelated activity
      specific_overhead:
      - Cross-referencing completion evidence against open action items to determine which action the work satisfies
    - text: Low-confidence matches pile up without resolution because humans defer validation and the queue grows stale
      specific_overhead:
      - Reviewing and validating signal matches flagged by the agent before updating the action tracker status
    - text: Signal sources are inconsistent across engagements, making it hard to establish reliable matching patterns
      specific_overhead:
      - Maintaining and tuning signal source configurations as new artifact types and work patterns emerge across engagements
    - Action owners complete work but forget to update the tracker, leaving actions falsely open
    - Governance metrics are inaccurate because the tracker lags behind actual work by days or weeks
    administrative_overhead:
    - Manually scanning meeting notes, daily ops updates, and POC logs to find evidence that an action was completed
    - Cross-referencing completion evidence against open action items to determine which action the work satisfies
    - Reviewing and validating signal matches flagged by the agent before updating the action tracker status
    - Maintaining and tuning signal source configurations as new artifact types and work patterns emerge across engagements
    scenarios:
    - problem: Action owners complete work but forget to update the tracker, leaving actions falsely open
      why: 'Sellers and practitioners do the work but do not update administrative systems afterward. The Nudger sends reminders for work that is already done, owners feel nagged for completed tasks, and
        governance metrics underreport actual follow-through rates because the tracker does not reflect reality.

        '
      agent: signal-matcher-agent
      agent_response: 'Scans natural work artifacts (meeting notes, daily ops logs, POC updates, decision records) for evidence that matches open action completion criteria. When a high-confidence match
        is found, flags the action as potentially complete and routes it to the owner for one-click confirmation.

        '
      success_signal:
        metric: Actions auto-matched to completion evidence from natural artifacts
        target: 50% of action completions detected from signals before manual tracker update
        leading_indicator: Owner confirmation rate above 85% for high-confidence matches
        failure_signal: Nudger sends reminders for actions that owners report were already completed
    - problem: Governance metrics are inaccurate because the tracker lags behind actual work by days or weeks
      why: 'When the action tracker does not reflect real completion status, the Reporter Agent generates governance summaries based on stale data. Follow-through rates appear worse than reality, leadership
        draws incorrect conclusions, and teams lose trust in governance reporting.

        '
      agent: signal-matcher-agent
      agent_response: 'Continuously correlates incoming signals from all configured sources against open actions, reducing tracker latency by surfacing completion evidence as it appears rather than waiting
        for manual updates. Provides the Reporter Agent with signal-matched completion data to improve metric accuracy.

        '
      success_signal:
        metric: Tracker-to-reality latency for action completion status
        target: Average latency under 24 hours between work completion and tracker reflection
        leading_indicator: Signal match volume increases as new artifact sources are configured
        failure_signal: Reporter Agent governance summaries consistently contradict team-reported completion status
    - problem: False positive matches waste human review time when signals look like completion but reflect unrelated activity
      why: 'When signal matching produces too many incorrect matches, human reviewers spend time evaluating completions that turn out to be unrelated activity. Review fatigue sets in, reviewers start rubber-stamping
        or ignoring match queues, and the system''s value proposition collapses because it creates more work than it eliminates.

        '
      agent: signal-matcher-agent
      agent_response: 'Applies multi-factor confidence scoring that weighs signal source relevance, semantic alignment with completion criteria, temporal proximity to the action, and owner overlap. Surfaces
        only matches above a configurable confidence threshold for human review, and tracks false positive rates to continuously refine matching heuristics.

        '
      success_signal:
        metric: False positive rate for signal matches presented to human reviewers
        target: False positive rate below 20% for matches surfaced to humans
        leading_indicator: Confidence scores correlate with actual confirmation rates after tuning
        failure_signal: Human reviewers reject more than 40% of surfaced matches as unrelated
    - problem: Low-confidence matches pile up without resolution because humans defer validation and the queue grows stale
      why: 'Matches below the auto-confirm threshold require human validation, but reviewers deprioritize the queue when it contains ambiguous cases. Unresolved matches accumulate, the queue becomes overwhelming,
        and the system loses its ability to keep the tracker current because the validation bottleneck blocks status updates.

        '
      agent: signal-matcher-agent
      agent_response: 'Tracks match queue age and sends escalating review reminders when matches remain unresolved beyond configurable thresholds. Groups related low-confidence matches for batch review
        to reduce per-item effort, and auto-expires matches that exceed a maximum queue age with a notification to the action owner explaining that the evidence window has passed.

        '
      success_signal:
        metric: Average match queue resolution time
        target: 90% of queued matches resolved (confirmed or rejected) within 72 hours
        leading_indicator: Queue depth remains stable or decreasing week over week
        failure_signal: Match queue exceeds 50 unresolved items or average age exceeds 7 days
    - problem: Signal sources are inconsistent across engagements, making it hard to establish reliable matching patterns
      why: 'Different engagements use different tools, artifact formats, and work patterns for daily operations. A signal source that reliably indicates completion in one engagement (e.g., POC update logs)
        may not exist in another, forcing the agent to recalibrate matching rules per engagement and reducing overall matching reliability.

        '
      agent: signal-matcher-agent
      agent_response: 'Maintains a signal source registry that maps available artifact types per engagement and adapts matching rules based on source availability. Generates a source coverage report showing
        which engagements have full signal coverage versus gaps, and recommends source additions for engagements with low matching effectiveness.

        '
      success_signal:
        metric: Signal source coverage across active engagements
        target: 80% of active engagements have at least 3 configured signal sources
        leading_indicator: Matching effectiveness improves as new signal sources are added per engagement
        failure_signal: Engagements with fewer than 2 signal sources show matching rates below 20%
    - problem: Completion evidence exists in meeting notes, emails, and daily ops but is never connected to the action it fulfills
      why: 'Work artifacts contain implicit proof that tasks were completed, but these signals live in separate systems with no link to the action tracker. A meeting note might confirm that a deliverable
        was reviewed, an email might acknowledge receipt of a document, and a daily ops log might record a deployment, yet none of these ever updates the corresponding action status. The gap between where
        work is documented and where completion is tracked creates permanent administrative lag.

        '
      agent: signal-matcher-agent
      agent_response: 'Ingests natural work artifacts from configured sources, extracts completion-relevant signals using semantic matching against open action completion criteria, and correlates matches
        with confidence scores. When a high-confidence match is found, it links the evidence to the specific action and routes the proposed completion to the owner for validation, closing the loop between
        where work happens and where it is tracked.

        '
      success_signal:
        metric: Completion evidence successfully linked to open actions
        target: 60% of action completions have signal-matched evidence linked before manual tracker update
        leading_indicator: New artifact sources produce actionable matches within the first week of configuration
        failure_signal: Completion evidence continues to exist only in source artifacts with no link to the action tracker
  prompt_registry:
    signal-matcher-extract-decisions-analyze:
      description: Analyze input
      source: skills/extract_decisions.yaml#step-1
      inputs:
      - title: context
        type: string
      outputs:
      - title: result
        type: object
      requires_data:
      - source: read-signal-matcher-data
        fields:
        - source_content
        - open_actions
        - signal_sources
        priority: critical
    signal-matcher-extract-decisions-synthesize:
      description: Synthesize findings
      source: skills/extract_decisions.yaml#step-2
      inputs:
      - title: analysis
        type: string
      outputs:
      - title: result
        type: object
    signal-matcher-extract-decisions-output:
      description: Generate output
      source: skills/extract_decisions.yaml#step-3
      inputs:
      - title: synthesis
        type: string
      outputs:
      - title: result
        type: object
    signal-matcher-process-meeting-notes-analyze:
      description: Analyze input
      source: skills/process_meeting.yaml#step-1
      inputs:
      - title: context
        type: string
      outputs:
      - title: result
        type: object
      requires_data:
      - source: read-signal-matcher-data
        fields:
        - meeting_transcript
        - meeting_metadata
        priority: critical
    signal-matcher-process-meeting-notes-synthesize:
      description: Synthesize findings
      source: skills/process_meeting.yaml#step-2
      inputs:
      - title: analysis
        type: string
      outputs:
      - title: result
        type: object
    signal-matcher-process-meeting-notes-output:
      description: Generate output
      source: skills/process_meeting.yaml#step-3
      inputs:
      - title: synthesis
        type: string
      outputs:
      - title: result
        type: object
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - Always include evidence for claims
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not operate outside defined scope (handoff to Leadership)
  permissions:
  - Operate within defined scope
  escalation_triggers:
  - Critical issue detected (to Leadership)
  - Information uncertainty requiring human verification
  handoffs:
    human_escalation: Leadership
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - signal-matching
      - pattern-detection
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/signal-matcher-confidence-scoring.yaml
      description: Factors, Thresholds
    - path: references/signal-matcher-signal-sources.yaml
      description: Lookback, Sources, Match Criteria
  assets:
  - name: artifacts
    filename: '{account}-artifacts.md'
    description: artifacts
  - name: notifications
    filename: '{account}-notifications.md'
    description: notifications
  quality:
  - All claims supported by evidence
  - No assumed dynamics
  - Sources cited
