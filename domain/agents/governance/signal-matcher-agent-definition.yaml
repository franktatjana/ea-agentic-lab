agentspec_version: 26.1.0
component_type: Agent
id: signal-matcher-agent
name: Signal Matcher Agent
description: The Signal Matcher Agent reads signals from natural work artifacts (meeting notes, daily ops, POC updates, decisions) and correlates them to open actions. Instead of asking sellers to remember
  what to click, it detects completion evidence automatically. Humans validate completions, they do not administrate them. This is the bridge between "work happened" and "the tracker reflects it."
metadata:
  definition_version: 0.1.0
  disclaimer: This agent specification is a reference design for educational and demonstration purposes. It is not a production system. All examples, case studies, and scenarios are fictional.
  tags:
  - governance
  - entropy-reduction
  responsibility: Eliminate admin burden by inferring action completion from daily operations signals
system_prompt: 'TODO: Synthesize system_prompt from config and spec'
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.5
    max_tokens: 4096
inputs:
- title: primary
  type: string
  description: primary
- title: signal_sources
  type: string
  description: signal_sources
- title: task_type
  type: string
  description: Which task to perform
- title: personality
  type: string
  description: Personality variant to use
  default: default
- title: output_format
  type: string
  description: Response format
  default: markdown
outputs:
