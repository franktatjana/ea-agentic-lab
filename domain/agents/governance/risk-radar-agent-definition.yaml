      source: prompts/tasks.yaml#risk_radar.classify_risk
      inputs:
      - title: YYYY
        type: string
      - title: account_name
        type: string
      - title: assigned_owner
        type: string
      - title: based_on_severity
        type: string
      - title: category
        type: string
      - title: level
        type: string
      - title: risk_signal
        type: object
      - title: source
        type: string
      outputs:
