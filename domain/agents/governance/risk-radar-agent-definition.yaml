x-ea-agent:
  fallback_model: null
  profile:
    human_matters_summary: 'Risk classification is technical; risk response is judgment. The agent categorizes by severity and likelihood, but the leader understands which risks are acceptable given strategy,
      how to communicate risk without creating panic, and which require immediate action. The risk is flagged, but human judgment decides whether to act.

      '
    playbook_raci:
      responsible:
      - playbook: PB_GOV_004_risk_review
        scope: PB_GOV_004_risk_review
        team: governance
        file: PB_GOV_004_risk_review.yaml
      - playbook: OP_HLT_001_health_score_alert (OP_HLT_001)
        scope: OP_HLT_001_health_score_alert
        team: operational
        file: OP_HLT_001_health_score_alert.yaml
      - playbook: OP_RSK_001_register_new_risk (OP_RSK_001)
        scope: OP_RSK_001_register_new_risk
        team: operational
        file: OP_RSK_001_register_new_risk.yaml
    challenges:
    - text: Risks are mentioned in meetings and emails but never formally classified, so severity and likelihood remain unknown
      specific_overhead:
      - Manually classifying each surfaced risk by severity, likelihood, category, and assigning an owner
    - text: Risk ownership is unclear because risks are surfaced without a named person responsible for mitigation
      specific_overhead:
      - Tracking mitigation progress for every open risk and updating the risk register with current status
    - text: Cross-account risk patterns go undetected because each engagement tracks risks in isolation
      specific_overhead:
      - Scanning across multiple engagement risk registers to detect recurring patterns or systemic issues
    - text: High-severity risks sit in the register without escalation because thresholds and timelines are not enforced
      specific_overhead:
      - Preparing weekly risk review summaries with status changes, new risks, and escalation recommendations
    administrative_overhead:
    - Manually classifying each surfaced risk by severity, likelihood, category, and assigning an owner
    - Tracking mitigation progress for every open risk and updating the risk register with current status
    - Scanning across multiple engagement risk registers to detect recurring patterns or systemic issues
    - Preparing weekly risk review summaries with status changes, new risks, and escalation recommendations
    scenarios:
    - problem: Risks are surfaced in meetings but never classified, so the team cannot prioritize response
      why: 'The Meeting Notes Agent extracts risk mentions from discussions, but raw risk signals arrive without severity, likelihood, or category. Without classification, all risks appear equal, leadership
        cannot focus attention, and critical risks get the same treatment as minor concerns.

        '
      agent: risk-radar-agent
      agent_response: 'Receives raw risk signals from the Meeting Notes Agent, classifies each by severity (critical/high/medium/low) and likelihood, assigns a category, identifies the appropriate owner,
        and enters the enriched record into the risk register with full traceability to the source.

        '
      success_signal:
        metric: Percentage of surfaced risks with complete classification
        target: 100% of risks classified within 24 hours of being surfaced
        leading_indicator: Classification completeness rate above 95% in weekly risk review
        failure_signal: Unclassified risks persist in the register for more than 48 hours
    - problem: Critical risks do not reach leadership because escalation happens too late or not at all
      why: 'Without automated escalation enforcement, critical risks depend on someone remembering to flag them upward. In fast-moving engagements, escalation gets deprioritized by day-to-day urgency, and
        leadership learns about critical exposure only when the impact has already materialized.

        '
      agent: risk-radar-agent
      agent_response: 'Monitors risk register for items that breach severity and exposure thresholds, generates escalation alerts with full risk context and recommended response urgency, and routes the
        alert to the designated leadership escalation path.

        '
      success_signal:
        metric: Critical risks escalated within defined timeline
        target: 100% of critical risks escalated within 4 hours of threshold breach
        leading_indicator: Escalation alerts include full context and reach designated recipients
        failure_signal: Leadership learns about critical risk from customer or external source before internal escalation
    - problem: Risk ownership is unclear because risks are surfaced without a named person responsible for mitigation
      why: 'Risks enter the register with severity and category but no assigned owner. Without a named person responsible for mitigation, the risk sits as an acknowledged problem that no one is accountable
        for resolving. Mitigation actions never start, and the risk persists until it materializes as an incident that forces reactive response.

        '
      agent: risk-radar-agent
      agent_response: 'Identifies the appropriate risk owner based on risk category, engagement context, and organizational responsibility mapping. Flags risks without a valid owner as incomplete and generates
        an ownership assignment recommendation so the account team can confirm the responsible person before the risk enters the active register.

        '
      success_signal:
        metric: Percentage of registered risks with a named mitigation owner
        target: 100% of risks in the active register have a named owner within 48 hours of entry
        leading_indicator: Ownership assignment recommendations accepted without modification
        failure_signal: Risks remain in the register for 7+ days without a named owner
    - problem: Cross-account risk patterns go undetected because each engagement tracks risks in isolation
      why: 'When the same risk type appears across multiple engagements (e.g., recurring integration failures, repeated stakeholder misalignment), each engagement treats it as a local issue. Without cross-account
        pattern detection, the organization misses systemic risks that require portfolio-level mitigation rather than engagement-level workarounds.

        '
      agent: risk-radar-agent
      agent_response: 'Scans risk registers across all active engagements for recurring risk categories, similar severity patterns, and shared root causes. Generates a cross-account risk pattern report
        highlighting systemic themes, frequency of recurrence, and recommended portfolio-level actions for leadership review.

        '
      success_signal:
        metric: Cross-account risk patterns identified per reporting cycle
        target: All risk categories appearing in 3+ engagements flagged as systemic within one reporting cycle
        leading_indicator: Pattern reports trigger portfolio-level discussions in leadership reviews
        failure_signal: Same risk type causes incidents in multiple engagements without being identified as a pattern
  prompt_registry:
    risk-radar-scan-for-risks:
      description: Scan sources for risk signals and update risk register
      source: prompts/tasks.yaml#risk_radar.scan_for_risks
      inputs:
      - title: account_name
        type: string
      - title: days
        type: string
      - title: node_name
        type: string
      outputs:
