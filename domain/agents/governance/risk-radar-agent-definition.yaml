        priority: critical
    risk-radar-extract-decisions-analyze:
      description: Analyze input
      source: skills/extract_decisions.yaml#step-1
      inputs:
      - title: context
        type: string
      outputs:
      - title: result
        type: object
      requires_data:
      - source: read-risk-radar-data
        fields:
        - source_content
        - risk_register
        priority: critical
    risk-radar-extract-decisions-synthesize:
      description: Synthesize findings
      source: skills/extract_decisions.yaml#step-2
      inputs:
      - title: analysis
        type: string
      outputs:
      - title: result
        type: object
    risk-radar-extract-decisions-output:
      description: Generate output
      source: skills/extract_decisions.yaml#step-3
      inputs:
      - title: synthesis
        type: string
      outputs:
      - title: result
        type: object
    risk-radar-process-meeting-notes-analyze:
      description: Analyze input
      source: skills/process_meeting.yaml#step-1
      inputs:
      - title: context
        type: string
      outputs:
      - title: result
        type: object
      requires_data:
      - source: read-risk-radar-data
        fields:
        - meeting_transcript
        - meeting_metadata
        priority: critical
    risk-radar-process-meeting-notes-synthesize:
      description: Synthesize findings
      source: skills/process_meeting.yaml#step-2
      inputs:
      - title: analysis
        type: string
      outputs:
      - title: result
        type: object
    risk-radar-process-meeting-notes-output:
      description: Generate output
      source: skills/process_meeting.yaml#step-3
      inputs:
      - title: synthesis
        type: string
      outputs:
      - title: result
        type: object
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not extract risks from meetings (Meeting Notes' domain) (handoff to Leadership)
  - Does not create mitigation plans (owner responsibility) (handoff to Leadership)
  - Does not make risk acceptance decisions (handoff to Leadership)
  - Does not assess technical feasibility (SA Agent's domain) (handoff to Leadership)
  - Does not evaluate commercial risk (AE Agent's domain) (handoff to Leadership)
  - Does not invent risks not raised (handoff to Leadership)
  permissions:
  - Classify risks by severity and likelihood
  - Track risk status and mitigation
  - Surface emerging risk patterns
  - Link risks to owners and actions
  - Escalate high-severity risks
  - Maintain risk register
  escalation_triggers:
  - Critical critical risk identification exceeding agent authority (to Leadership)
  handoffs:
    human_escalation: Leadership
    receives_from:
      meeting_notes: Risks mentioned in meetings
      support: Support-identified risks
      delivery: Delivery risks
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Critical risk identification
    - Accurate classification
    - Pattern detection
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - risk-monitoring
      - signal-detection
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/classification-examples.yaml
      description: Risk Classification, Pattern Detection
    - path: references/error-handling.yaml
      description: Insufficient Evidence, Conflicting Evidence, Ambiguous Severity
    - path: references/output-schemas.yaml
      description: Risk Classification, Risk Register Summary
  assets:
  - name: artifacts
    filename: '{account}-artifacts.md'
    description: artifacts
  - name: alerts
    filename: '{account}-alerts.md'
    description: alerts
  - name: reports
    filename: '{account}-reports.md'
    description: reports
  quality:
  - All claims supported by evidence
  - No assumed dynamics
  - Sources cited
