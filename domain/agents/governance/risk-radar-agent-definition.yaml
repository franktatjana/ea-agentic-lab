  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: risk-radar-agent-proactive
  name: Risk Radar Agent (Proactive)
  description: 'Proactive mode: scans for signals and surfaces insights without prompting'
  agent:
    $component_ref: risk-radar-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan sources

      continuously for relevant signals. Surface insights before being

      asked. Prioritize timeliness over depth. Keep outputs concise and

      action-oriented. Flag anything that needs immediate attention.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: risk-radar-agent-analytical
  name: Risk Radar Agent (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: risk-radar-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Provide comprehensive

      analysis with full evidence trails. Synthesize across multiple

      data points. Prioritize accuracy and defensibility over speed.

      Include confidence levels and caveats where appropriate.

      '
    human_in_the_loop: true
flows:
- component_type: Flow
  id: extract-decisions
  name: Extract Decisions
  description: Extract, validate, and register decisions from any source (meetings, emails, discussions) into the decision log
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: registered_decision
    type: object
    format: yaml
    description: 'Decision entry: id, title, description, maker, rationale, scope, status, source'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: risk-radar-extract-decisions-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: risk-radar-extract-decisions-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: risk-radar-extract-decisions-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: process-meeting-notes
  name: Process Meeting Notes
  description: Extract decisions, actions, risks, and open questions from meeting notes or transcripts into structured, decision-grade output
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: meeting_note
    type: object
    format: markdown
    description: 'Ultra-lean meeting notes (max 12 lines): decisions, actions, risks, open questions'
  - name: extracted_actions
    type: array
    format: yaml
    description: Validated action items with owner, due_date, completion_criteria, priority
  - name: extracted_decisions
    type: array
    format: yaml
    description: Decisions in 'We decided to X because Y' format with owner and status
  - name: slack_digest
    type: string
    format: text
    description: '5-line Slack message: Decision, Next, Next, Risk, Confirm deadline'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: risk-radar-process-meeting-notes-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: risk-radar-process-meeting-notes-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: risk-radar-process-meeting-notes-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: risk-radar
  name: Risk Radar
  description: Flow for risk radar tasks.
  inputs:
  - title: YYYY
    type: string
  - title: account_name
    type: string
  - title: assigned_owner
    type: string
  - title: based_on_severity
    type: string
  - title: category
    type: string
  - title: date
    type: string
  - title: days
    type: string
  - title: exposure
    type: string
  outputs:
  - title: risk_radar_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: risk-radar-scan-for-risks
      input: account_name, node_name, days
      description: Scan sources for risk signals and update risk register
    - step: 2
      prompt: risk-radar-classify-risk
      input: risk_signal, source, account_name, YYYY
      description: Classify and enrich newly detected risk
    - step: 3
      prompt: risk-radar-weekly-risk-review
      input: account_name, node_name, risk_count, week_start
      description: Prepare weekly risk review summary
    - step: 4
      prompt: risk-radar-risk-escalation
      input: risk_id, risk_title, severity, exposure
      description: Generate escalation alert for critical risk
a2a:
  agent_url: null
  connection_config: null
  agent_card:
