        - risk_status_changes
        priority: critical
    risk-radar-risk-escalation:
      description: Generate escalation alert for critical risk
      source: prompts/tasks.yaml#risk_radar.risk_escalation
      inputs:
      - title: date
        type: string
      - title: exposure
