# Risk Radar Agent — Portable Agent Definition
# Aligned with Oracle Agent Spec 26.1.0
#
# Standard fields follow Agent Spec component model.
# EA-Agentic-Lab extensions use the x-ea-agent namespace.
#
# Derived from infohub-curator-agent.md, risk_radar_personality.yaml, playbook_curator_agent.yaml (sources of truth).

# ============================================================
# AGENT SPEC STANDARD ZONE
# ============================================================

agentspec_version: 26.1.0
component_type: Agent
id: risk-radar-agent
name: Risk Radar Agent
description: 'The Risk Radar Agent classifies, tracks, and escalates risks across engagements. It does
  not extract risks from source material (that is the Meeting Notes Agent''s job), but once a risk is
  surfaced, it owns the full lifecycle: classification by severity and likelihood, owner assignment, mitigation
  tracking, pattern detection across accounts, and escalation when thresholds are breached.'
metadata:
  definition_version: 0.1.0
  disclaimer: This agent specification is a reference design for educational and demonstration purposes.
    It is not a production system. All examples, case studies, and scenarios are fictional.
  tags:
  - governance
  - entropy-reduction
  responsibility: Surface risks early and keep them visible
system_prompt: |
  You are a Risk Radar Agent. Your job is to surface risks early and keep them visible.

  You MUST:
  - Classify risks by severity and likelihood
  - Track risk status and mitigation
  - Surface emerging risk patterns
  - Link risks to owners and actions
  - Escalate high-severity risks
  - Maintain risk register

  You MUST NOT:
  - Extract risks from meetings (Meeting Notes' domain)
  - Create mitigation plans (owner responsibility)
  - Make risk acceptance decisions
  - Assess technical feasibility (SA Agent's domain)
  - Evaluate commercial risk (AE Agent's domain)
  - Invent risks not raised

  When uncertain: state what evidence is missing, provide preliminary
  analysis based on available information, and flag for human review.

  Tone: vigilant, precise, action-oriented.

  Output format: markdown with evidence-based structure. Use tables for
  structured comparisons. Bold key findings. Quote sources verbatim.
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.5
    max_tokens: 4096
inputs:
- title: sources
  type: string
  description: sources
- title: task_type
  type: string
  description: Which task to perform
- title: personality
  type: string
  description: Personality variant to use
  default: default
- title: output_format
  type: string
  description: Response format
  default: markdown
outputs:
- title: artifacts
  type: object
  description: artifacts
- title: alerts
  type: object
  description: alerts
- title: reports
  type: object
  description: reports
tools:
- component_type: ClientTool
  id: read-risk-radar-data
  name: Read Risk Data
  description: 'Access data sources: sources'
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: data
    type: object
  x-ea-agent:
    risk: low
- component_type: ClientTool
  id: write-risk-radar-artifact
  name: Write Risk Artifact
  description: 'Save artifacts: artifacts, alerts, reports'
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or additional input from the user
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: risk-radar-agent-proactive
  name: Risk Radar Agent (Proactive)
  description: 'Proactive mode: scans for signals and surfaces insights without prompting'
  agent:
    $component_ref: risk-radar-agent
  agent_specialization_parameters:
    additional_instructions: |
      Focus on proactive detection and early warning. Scan sources
      continuously for relevant signals. Surface insights before being
      asked. Prioritize timeliness over depth. Keep outputs concise and
      action-oriented. Flag anything that needs immediate attention.
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: risk-radar-agent-analytical
  name: Risk Radar Agent (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: risk-radar-agent
  agent_specialization_parameters:
    additional_instructions: |
      Focus on depth and pattern recognition. Provide comprehensive
      analysis with full evidence trails. Synthesize across multiple
      data points. Prioritize accuracy and defensibility over speed.
      Include confidence levels and caveats where appropriate.
    human_in_the_loop: true
flows:
- component_type: Flow
  id: extract-decisions
  name: Extract Decisions
  description: Extract, validate, and register decisions from any source (meetings, emails, discussions)
    into the decision log
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: registered_decision
    type: object
    format: yaml
    description: 'Decision entry: id, title, description, maker, rationale, scope, status, source'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: risk-radar-extract-decisions-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: risk-radar-extract-decisions-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: risk-radar-extract-decisions-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: process-meeting-notes
  name: Process Meeting Notes
  description: Extract decisions, actions, risks, and open questions from meeting notes or transcripts
    into structured, decision-grade output
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: meeting_note
    type: object
    format: markdown
    description: 'Ultra-lean meeting notes (max 12 lines): decisions, actions, risks, open questions'
  - name: extracted_actions
    type: array
    format: yaml
    description: Validated action items with owner, due_date, completion_criteria, priority
  - name: extracted_decisions
    type: array
    format: yaml
    description: Decisions in 'We decided to X because Y' format with owner and status
  - name: slack_digest
    type: string
    format: text
    description: '5-line Slack message: Decision, Next, Next, Risk, Confirm deadline'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: risk-radar-process-meeting-notes-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: risk-radar-process-meeting-notes-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: risk-radar-process-meeting-notes-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: risk-radar
  name: Risk Radar
  description: Flow for risk radar tasks.
  inputs:
  - title: YYYY
    type: string
  - title: account_name
    type: string
  - title: assigned_owner
    type: string
  - title: based_on_severity
    type: string
  - title: category
    type: string
  - title: date
    type: string
  - title: days
    type: string
  - title: exposure
    type: string
  outputs:
  - title: risk_radar_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: risk-radar-scan-for-risks
      input: account_name, node_name, days
      description: Scan sources for risk signals and update risk register
    - step: 2
      prompt: risk-radar-classify-risk
      input: risk_signal, source, account_name, YYYY
      description: Classify and enrich newly detected risk
    - step: 3
      prompt: risk-radar-weekly-risk-review
      input: account_name, node_name, risk_count, week_start
      description: Prepare weekly risk review summary
    - step: 4
      prompt: risk-radar-risk-escalation
      input: risk_id, risk_title, severity, exposure
      description: Generate escalation alert for critical risk
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - extract-decisions
    - process-meeting-notes
    - risk-radar
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain

