toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: decision-registrar-agent-proactive
  name: Decision Registrar Agent (Proactive)
  description: 'Proactive mode: scans for signals and surfaces insights without prompting'
  agent:
    $component_ref: decision-registrar-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan sources

      continuously for relevant signals. Surface insights before being

      asked. Prioritize timeliness over depth. Keep outputs concise and

      action-oriented. Flag anything that needs immediate attention.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: decision-registrar-agent-analytical
  name: Decision Registrar Agent (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: decision-registrar-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition. Provide comprehensive

      analysis with full evidence trails. Synthesize across multiple

      data points. Prioritize accuracy and defensibility over speed.

      Include confidence levels and caveats where appropriate.

      '
    human_in_the_loop: true
flows:
- component_type: Flow
  id: extract-decisions
  name: Extract Decisions
  description: Extract, validate, and register decisions from any source (meetings, emails, discussions) into the decision log
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: registered_decision
    type: object
    format: yaml
    description: 'Decision entry: id, title, description, maker, rationale, scope, status, source'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: decision-registrar-extract-decisions-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: decision-registrar-extract-decisions-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: decision-registrar-extract-decisions-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: process-meeting-notes
  name: Process Meeting Notes
  description: Extract decisions, actions, risks, and open questions from meeting notes or transcripts into structured, decision-grade output
  inputs:
  - title: required
    type: string
  - title: optional
    type: string
  outputs:
  - name: meeting_note
    type: object
    format: markdown
    description: 'Ultra-lean meeting notes (max 12 lines): decisions, actions, risks, open questions'
  - name: extracted_actions
    type: array
    format: yaml
    description: Validated action items with owner, due_date, completion_criteria, priority
  - name: extracted_decisions
    type: array
    format: yaml
    description: Decisions in 'We decided to X because Y' format with owner and status
  - name: slack_digest
    type: string
    format: text
    description: '5-line Slack message: Decision, Next, Next, Risk, Confirm deadline'
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: decision-registrar-process-meeting-notes-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: decision-registrar-process-meeting-notes-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: decision-registrar-process-meeting-notes-output
      input: synthesis
      description: Generate output
- component_type: Flow
  id: decision-registrar
  name: Decision Registrar
  description: Flow for decision registrar tasks.
  inputs:
  - title: YYYY
    type: string
  - title: account_name
    type: string
  - title: current_status
    type: string
  - title: date
    type: string
  - title: decision
    type: string
  - title: decision_id
    type: string
  - title: decision_log
    type: string
  - title: decision_text
    type: string
  outputs:
  - title: decision_registrar_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: decision-registrar-register-decision
      input: source, account_name, decision_text, YYYY
      description: Add decision to decision log
    - step: 2
      prompt: decision-registrar-decision-status-update
      input: decision_id, current_status, new_status, reason_for_change
      description: Update status of existing decision
    - step: 3
      prompt: decision-registrar-weekly-decision-digest
      input: account_name, week_start, week_end, decision_log
      description: Summarize decisions from past week
    - step: 4
      prompt: decision-registrar-find-related-decisions
      input: topic, account_name, decision_log, topic
      description: Find decisions related to a topic
