x-ea-agent:
  fallback_model: null
  profile:
    human_matters_summary: 'Decisions recorded are not decisions understood. The agent maintains the audit trail with archival precision, but humans understand which decisions matter strategically, what
      context will be essential later, and whether a reversal signals learning or chaos. The decision is logged, but human judgment determines what gets remembered and why.

      '
    challenges:
    - text: Decisions are made in meetings, emails, and side conversations but never formally registered anywhere
      specific_overhead:
      - Manually logging each decision with full context, owner, rationale, scope, and lifecycle status into the decision log
    - text: Decision records lack rationale, so six months later no one knows why a choice was made
      specific_overhead:
      - Tracking decision status changes over time and ensuring updates create linked records rather than overwriting history
    - text: Reversals and updates to past decisions are not linked to the original record, creating a fragmented audit trail
      specific_overhead:
      - Compiling weekly decision digests that summarize new, updated, and reversed decisions for the account team
    - text: Decision search is impossible because records are scattered across notes, emails, and tribal memory
      specific_overhead:
      - Cross-referencing decisions against related actions and risks to maintain traceability across governance artifacts
    administrative_overhead:
    - Manually logging each decision with full context, owner, rationale, scope, and lifecycle status into the decision log
    - Tracking decision status changes over time and ensuring updates create linked records rather than overwriting history
    - Compiling weekly decision digests that summarize new, updated, and reversed decisions for the account team
    - Cross-referencing decisions against related actions and risks to maintain traceability across governance artifacts
    scenarios:
    - problem: Critical decisions have no formal record, leading to disputes about what was agreed
      why: 'When decisions are communicated verbally or buried in email threads, the team has no authoritative source to reference. Stakeholders recall different versions of what was decided, scope disagreements
        escalate, and the same decision gets revisited multiple times because no one can prove it was already made.

        '
      agent: decision-registrar-agent
      agent_response: 'Receives structured decision records from the Meeting Notes Agent, logs each with full context (who decided, why, what scope, what status), assigns a unique decision ID, and makes
        the record searchable so any team member can retrieve the authoritative version.

        '
      success_signal:
        metric: Percentage of decisions with formal registry entries
        target: 100% of decisions extracted from meetings are registered within 24 hours
        leading_indicator: Decision log entry count matches Meeting Notes Agent decision output count
        failure_signal: Team members report decisions they know were made but cannot find in the registry
    - problem: Decision reversals happen informally and break downstream actions that depended on the original choice
      why: 'A decision gets reversed in a follow-up conversation, but the original record is never updated. Actions, risks, and deliverables that depend on the original decision continue executing against
        an outdated commitment, wasting effort and creating misalignment.

        '
      agent: decision-registrar-agent
      agent_response: 'Tracks all decision status changes as linked records (never modifying the original), flags decisions that have dependent actions or risks, and surfaces a reversal impact report so
        humans can assess downstream effects before confirming the change.

        '
      success_signal:
        metric: Decision reversals formally tracked with impact assessment
        target: 100% of reversals create linked records with dependency analysis
        leading_indicator: Reversal records include downstream dependency list within 4 hours
        failure_signal: Actions continue executing against reversed decisions without notification
    - problem: Decision records lack rationale, so six months later no one knows why a choice was made
      why: 'When decisions are logged as bare outcomes without the reasoning behind them, future teams cannot evaluate whether the original context still applies. Six months later, someone revisits the
        decision, finds no rationale, and either blindly follows an outdated choice or re-litigates the entire discussion from scratch.

        '
      agent: decision-registrar-agent
      agent_response: 'Enforces rationale as a required field on every decision record, rejects entries that lack a "because Y" justification, and links the rationale to supporting evidence (meeting notes,
        analysis documents) so future reviewers can reconstruct the original reasoning without re-asking the decision maker.

        '
      success_signal:
        metric: Percentage of decision records with documented rationale
        target: 100% of registered decisions include rationale linked to supporting evidence
        leading_indicator: Rejection rate for rationale-missing submissions decreases over time
        failure_signal: Team members report they cannot find the reasoning behind a past decision
    - problem: Decision search is impossible because records are scattered across notes, emails, and tribal memory
      why: 'Without a centralized, searchable decision registry, finding a past decision requires asking whoever might remember or digging through multiple tools. Teams waste hours searching, sometimes
        give up and make the same decision again, and contradictory decisions accumulate because no one can verify what was already agreed.

        '
      agent: decision-registrar-agent
      agent_response: 'Maintains a structured, indexed decision registry where every record includes searchable metadata (topic, account, date, maker, status). Provides a find-related-decisions capability
        that retrieves decisions by topic, account, or time range so any team member can locate relevant prior decisions in seconds.

        '
      success_signal:
        metric: Decision retrieval time for past decisions
        target: Any team member can find a relevant past decision within 2 minutes using the registry
        leading_indicator: Search queries to the decision registry increase as adoption grows
        failure_signal: Team members resort to asking colleagues or searching email instead of using the registry
