# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:
  fallback_model: null
  profile:
    human_matters_summary: >
      Reminders are easy; unblocking is political. The agent tracks actions and
      escalates overdue items, but the manager understands when someone needs
      help versus accountability, how to escalate without damage, and whether
      the real problem is capacity or a genuine blocker. The reminder is sent,
      but human judgment decides how to help.
    challenges:
      - "Action owners ignore reminders because they receive too many notifications from too many systems"
      - "Stalled actions sit in 'in progress' status for weeks because no one triggers an escalation check"
      - "Escalation timelines are unclear, so overdue actions linger without reaching the right decision maker"
      - "Orphaned actions with no owner or an invalid owner cannot be nudged and silently fall off the tracker"
      - "Overdue actions accumulate silently because no one is actively tracking due dates"
      - "Blocked actions stay in limbo because the blocker is never formally surfaced"
    administrative_overhead:
      - "Manually scanning action trackers daily to identify which items are approaching or past their due dates"
      - "Drafting and sending individual follow-up messages to action owners with context about what is overdue and why"
      - "Tracking escalation state for each overdue action, including how many reminders were sent and when to escalate further"
      - "Compiling daily nudge summaries that report which reminders were sent, who responded, and what remains unresolved"
    scenarios:
      - problem: "Overdue actions accumulate silently because no one is actively tracking due dates"
        why: >
          Action items are created in meetings and validated by the Task Shepherd,
          but without persistent tracking, they drift past their due dates. Owners
          get busy with new priorities, and the original commitment fades from
          memory. By the time someone notices, the delay has cascaded into downstream
          dependencies.
        agent: nudger-agent
        agent_response: >
          Monitors all active actions against their due dates, sends graduated
          reminders (approaching, due today, overdue) to the assigned owner,
          and triggers escalation to the owner's manager when the overdue
          threshold is breached.
        success_signal:
          metric: "Follow-through rate on action items"
          target: "85% of actions completed by original due date"
          leading_indicator: "Owners respond to pre-due-date reminders and confirm progress"
          failure_signal: "More than 20% of actions are overdue by 7+ days without escalation"
      - problem: "Blocked actions stay in limbo because the blocker is never formally surfaced"
        why: >
          When an action owner cannot make progress due to a dependency or external
          factor, they often just stop updating status rather than formally flagging
          the block. The action appears stalled but the root cause is invisible,
          preventing anyone from helping clear the path.
        agent: nudger-agent
        agent_response: >
          Detects actions with no status update beyond a configurable threshold,
          sends a status-check prompt to the owner asking whether the action is
          blocked, and if confirmed, routes the blocker detail to the appropriate
          escalation path for resolution.
        success_signal:
          metric: "Stalled actions surfaced and unblocked"
          target: "100% of actions with no update for 5+ days receive a status check"
          leading_indicator: "Status check response rate above 75% within 24 hours"
          failure_signal: "Actions remain in 'in progress' with no update for 14+ days"
      - problem: "Action owners ignore reminders because they receive too many notifications from too many systems"
        why: >
          When reminders arrive alongside dozens of other notifications from email,
          Slack, project tools, and CRM systems, they become noise. Owners develop
          notification blindness, critical action reminders get buried, and the nudging
          system loses effectiveness because recipients stop distinguishing governance
          reminders from general information overload.
        agent: nudger-agent
        agent_response: >
          Applies graduated reminder intensity (gentle pre-due, standard at-due,
          urgent overdue) with concise, context-rich messages that include the action
          title, due date, and one-click response options. Limits reminder frequency
          per owner per day to avoid saturation and tracks acknowledgment rates to
          adjust delivery timing for maximum attention.
        success_signal:
          metric: "Reminder acknowledgment rate by action owners"
          target: "70% of reminders acknowledged or responded to within 24 hours"
          leading_indicator: "Owners respond to reminders without reporting notification fatigue"
          failure_signal: "Acknowledgment rate drops below 40% or owners explicitly request to stop receiving reminders"
      - problem: "Escalation timelines are unclear, so overdue actions linger without reaching the right decision maker"
        why: >
          Without defined escalation rules, overdue actions depend on someone manually
          deciding when and to whom to escalate. Different team members have different
          thresholds for what counts as "too late," and the result is inconsistent
          escalation where some overdue actions get immediate attention while others
          drift for weeks without reaching leadership.
        agent: nudger-agent
        agent_response: >
          Enforces configurable escalation timelines (e.g., 3 days overdue to owner's
          manager, 7 days to senior leadership) with automatic escalation triggers.
          Each escalation includes full action context, reminder history, and the
          number of days overdue so the escalation recipient can act immediately
          without researching the background.
        success_signal:
          metric: "Overdue actions escalated within defined timeline"
          target: "100% of actions breaching escalation threshold are escalated within 24 hours"
          leading_indicator: "Escalation recipients resolve or reassign escalated actions within 48 hours"
          failure_signal: "Actions remain overdue for 14+ days without any escalation being triggered"
      - problem: "Orphaned actions with no owner or an invalid owner cannot be nudged and silently fall off the tracker"
        why: >
          When an action owner leaves the team, changes roles, or was entered as a
          team name rather than a person, the Nudger has no valid recipient for
          reminders. These orphaned actions accumulate invisibly in the tracker,
          never completed and never followed up, creating governance blind spots
          that only surface in periodic audits.
        agent: nudger-agent
        agent_response: >
          Scans the action tracker for items with missing, invalid, or inactive owners
          on a daily cycle. Flags orphaned actions in the daily nudge summary and
          routes reassignment requests to the action's source (meeting organizer or
          team lead) so a valid owner can be assigned before the action falls through
          the cracks.
        success_signal:
          metric: "Orphaned actions detected and reassignment-requested"
          target: "100% of orphaned actions flagged within 48 hours of owner becoming invalid"
          leading_indicator: "Reassignment requests result in new valid owners within 3 business days"
          failure_signal: "Orphaned actions discovered in weekly audit that were not flagged by daily scans"
      - problem: "Stalled actions sit in 'in progress' status for weeks because no one triggers an escalation check"
        why: >
          Actions marked "in progress" create the illusion of forward motion.
          Without a mechanism to detect that status has not changed over a defined
          period, these items avoid both reminder triggers (which target overdue
          items) and escalation rules (which require an explicit block signal).
          The result is a growing backlog of silently stalled work that only
          surfaces during manual audits or post-mortems.
        agent: nudger-agent
        agent_response: >
          Monitors all "in progress" actions for status staleness by tracking the
          interval since the last meaningful update. When an action exceeds the
          configurable stale threshold without a status change or progress note,
          the agent sends a status-check prompt to the owner and, if no response
          is received within 48 hours, automatically triggers the escalation path
          defined for that action's priority level.
        success_signal:
          metric: "Stalled in-progress actions detected and escalated"
          target: "100% of actions stalled for 7+ days receive an automated escalation check"
          leading_indicator: "Owners respond to stale-status prompts and either update progress or declare a block within 48 hours"
          failure_signal: "Actions remain in 'in progress' with no update for 14+ days without any escalation being triggered"
  prompt_registry:
    nudger-generate-reminder:
      description: Create reminder for upcoming due date
      source: prompts/tasks.yaml#nudger.generate_reminder
      inputs:
      - title: action_text
        type: string
      - title: action_title
        type: string
      - title: days
        type: string
      - title: due_date
        type: string
      - title: owner_name
        type: string
      outputs:
      - title: generate-reminder_result
        type: object
      requires_data:
