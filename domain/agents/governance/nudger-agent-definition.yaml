        priority: critical
    nudger-extract-decisions-analyze:
      description: Analyze input
      source: skills/extract-decisions#step-1
      inputs:
      - title: context
        type: string
      outputs:
      - title: result
        type: object
      requires_data:
      - source: read-nudger-data
        fields: [source_content, action_tracker]
        priority: critical
    nudger-extract-decisions-synthesize:
      description: Synthesize findings
      source: skills/extract-decisions#step-2
