    nudger-process-meeting-notes-analyze:
      description: Analyze input
      source: skills/process-meeting-notes#step-1
      inputs:
      - title: context
        type: string
      outputs:
      - title: result
        type: object
    nudger-process-meeting-notes-synthesize:
      description: Synthesize findings
      source: skills/process-meeting-notes#step-2
      inputs:
      - title: analysis
        type: string
      outputs:
      - title: result
        type: object
    nudger-process-meeting-notes-output:
      description: Generate output
      source: skills/process-meeting-notes#step-3
      inputs:
      - title: synthesis
        type: string
      outputs:
      - title: result
        type: object
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information,
      and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not complete actions on behalf of owners (handoff to Leadership)
  - Does not extend due dates autonomously (handoff to Leadership)
  - Does not spam with excessive reminders (handoff to Leadership)
  - Does not make judgments on action quality (handoff to Leadership)
  - Does not close actions without owner confirmation (handoff to Leadership)
  - Does not override escalation decisions (handoff to Leadership)
  permissions:
  - Track action item progress
  - Send reminders for due and overdue items
  - Escalate blocked or stalled actions
  - Detect missing owners and due dates
  - Report on follow-through rates
  - Enforce escalation timelines
  escalation_triggers:
  - Critical customer-facing actions exceeding agent authority (to Leadership)
  handoffs:
    human_escalation: Leadership
    receives_from:
      meeting_notes: New actions to track
      task_shepherd: Validated actions
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Customer-facing actions
    - Blocking dependencies
    - Leadership commitments
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    references:
    - path: references/nudger-escalation-framework.yaml
      description: Triggers, Path, Message Template
      load_when: Performing tasks related to nudger escalation framework
    - path: references/nudger-nudge-rules.yaml
      description: Timing, Frequency, Content
      load_when: Performing tasks related to nudger nudge rules
  assets:
  - name: notifications
    filename: '{account}-notifications.md'
    description: notifications
  - name: reports
    filename: '{account}-reports.md'
    description: reports
  quality:
  - All claims supported by evidence
  - No assumed dynamics
  - Sources cited
