        priority: critical
    nudger-status-check:
      description: Check in on stalled action
      source: prompts/tasks.yaml#nudger.status_check
      inputs:
      - title: action_text
        type: string
      - title: action_title
        type: string
      - title: current_status
        type: string
      - title: days
        type: string
      - title: last_update_date
        type: string
      - title: owner_name
        type: string
      outputs:
      - title: status-check_result
        type: object
      requires_data:
      - source: read-nudger-data
        fields: [action_tracker, action_status_history]
        priority: critical
    nudger-daily-nudge-summary:
      description: Generate daily summary of nudges sent
      source: prompts/tasks.yaml#nudger.daily_nudge_summary
      inputs:
      - title: count
        type: string
      - title: date
        type: string
      - title: nudge_list
        type: string
      outputs:
      - title: daily-nudge-summary_result
        type: object
