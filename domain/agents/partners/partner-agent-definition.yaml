        source: "Maritz Channel Solutions: 67% of channel managers cite conflict resolution as top time drain"
      - text: "Partner delays block deal execution without warning because deliverables are tracked in separate systems with different cadences"
        solved_by: partner-risk-agent
        specific_overhead:
          - "Discovering partner delivery slippage only when it cascades into customer timeline"
        source: "Forrester: 52% of partner-involved deals experience at least one partner-caused delay"
      - text: "Joint business plans produce documents that sit in shared drives instead of driving mutual accountability and quarterly commitments"
        solved_by: partner-cosell-agent
