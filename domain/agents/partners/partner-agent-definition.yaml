        source: "Crossbeam: partner referrals represent 10% of pipeline but 31% of closed revenue"
      - text: "Channel conflict escalates in hybrid selling models where direct and partner motions target the same accounts without coordination"
        solved_by: partner-risk-agent
        specific_overhead:
