        source: "AchieveUnite: JBPs fail when roles are unclear and metrics are not shared"
      - text: "Partner program health is assessed reactively at QBR time instead of continuously, missing early warning signals that a partner is disengaging"
        solved_by: partner-program-health-agent
        specific_overhead:
