      requires_data:
        - source: read-partner-data
          fields: [partner_engagement_records, account_plan_partner_section, communication_history]
          priority: critical
    partner-dependency-status:
      description: Track status of partner dependencies
      source: prompts/tasks.yaml#program_health.dependency_status
      inputs:
        - title: partner_name
          type: string
        - title: account_name
          type: string
      outputs:
        - title: dependency_status_result
          type: object
      requires_data:
        - source: read-partner-data
          fields: [partner_deliverables, dependency_tracking, account_plan_partner_section]
          priority: critical
    partner-performance-scorecard:
      description: Generate partner performance scorecard
      source: prompts/tasks.yaml#program_health.performance_scorecard
      inputs:
        - title: partner_name
          type: string
        - title: review_period
          type: string
        - title: scorecard_metrics
          type: string
      outputs:
        - title: performance_scorecard_result
          type: object
      requires_data:
        - source: read-partner-data
          fields: [performance_metrics, partner_deliverables, commitment_tracking, revenue_data]
          priority: critical
    partner-program-review:
      description: Comprehensive program health review for QBR or leadership
      source: prompts/tasks.yaml#program_health.program_review
      inputs:
        - title: partner_name
          type: string
        - title: review_period
          type: string
      outputs:
        - title: program_review_result
          type: object
      requires_data:
        - source: read-partner-data
          fields: [all_partner_metrics, engagement_history, pipeline_contribution, certification_status]
          priority: critical
    partner-risk-identification:
      description: Identify and classify partner-related risks
      source: prompts/tasks.yaml#risk.risk_identification
      inputs:
        - title: partner_name
          type: string
        - title: account_name
          type: string
        - title: engagement_status
          type: string
      outputs:
        - title: risk_identification_result
          type: object
      requires_data:
        - source: read-partner-data
          fields: [partner_engagement_records, dependency_tracking, communication_history]
          priority: critical
    partner-issue-resolution:
      description: Plan resolution for partner issue
      source: prompts/tasks.yaml#risk.issue_resolution
      inputs:
        - title: partner_name
          type: string
        - title: issue_description
          type: string
      outputs:
        - title: issue_resolution_result
          type: object
      requires_data:
        - source: read-partner-data
          fields: [partner_issue_history, partner_agreements, escalation_contacts]
          priority: critical
    partner-escalation-prep:
      description: Prepare partner escalation package
      source: prompts/tasks.yaml#risk.escalation_prep
      inputs:
        - title: partner_name
          type: string
        - title: issue_description
          type: string
      outputs:
        - title: escalation_prep_result
          type: object
      requires_data:
        - source: read-partner-data
          fields: [partner_issue_history, previous_resolution_attempts, partner_agreements]
          priority: critical
    partner-channel-conflict:
      description: Detect and assess channel conflict scenarios
      source: prompts/tasks.yaml#risk.channel_conflict
      inputs:
        - title: partner_name
          type: string
        - title: account_name
          type: string
      outputs:
        - title: channel_conflict_result
          type: object
      requires_data:
        - source: read-partner-data
          fields: [deal_registration_records, crm_opportunity, partner_portal_data, territory_assignments]
          priority: critical
  validation:
    required_dimensions:
      - name: context
        description: What account, partner, or program is being analyzed?
      - name: source_data
        description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 500
    hard_rule: No claim without source evidence
  guardrails:
    input:
      - Reject requests without partner name or account context
      - Validate partner exists in partner registry before analysis
    output:
      - NEVER invent partner names or capabilities
      - NEVER assume partner scope without explicit mention
      - NEVER create partner commitments or promises
      - Quote exact partner-related statements from sources
      - Include confidence level for any interpretive assessment
    resource:
      - max_tool_calls: 30
  boundaries:
    - Does not manage partner relationships directly (Partner Manager human's domain)
    - Does not make partner commitments or promises
    - Does not design joint solution architectures (Alliance Architect Agent's domain)
    - Does not validate technical integration patterns (Alliance Architect Agent's domain)
    - Does not assess partner technical capabilities beyond certification status
  permissions:
    - Track partner involvement and commitments in accounts
    - Flag partner-related risks and certification lapses
    - Monitor partner deliverables against commitments
    - Coordinate co-sell pipeline and deal registration
    - Generate partner performance scorecards
    - Assess partner maturity and enablement readiness
  escalation_triggers:
    - Critical partner dependency blocking deal timeline (to Partner Manager)
    - Partner relationship conflict requiring executive intervention (to VP Partnerships)
    - Channel conflict requiring territory resolution (to Sales Leadership)
  handoffs:
    human_escalation: Partner Manager
    outbound:
      - target: aa-agent
        trigger: Technical integration question or joint solution architecture needed
        context: Commercial partner context, deal requirements, partner certification status
      - target: ae-agent
        trigger: Deal-level partner coordination affecting opportunity progression
        context: Partner engagement status, co-sell pipeline, deal registration status
      - target: ham-agent
        trigger: Hyperscaler co-sell or marketplace transaction involving partner
        context: Partner type, CPPO eligibility, hyperscaler program alignment
      - target: delivery-agent
        trigger: Partner delivery dependency affecting implementation timeline
        context: Partner deliverables, dependency status, risk level
  knowledge:
    scope:
      domains:
        - partner-management
        - channel-management
        - co-sell
        - partner-enablement
      archetypes:
        - enterprise
        - mid-market
    references:
      - path: references/partner-ecosystem-frameworks.yaml
        description: Partner maturity models, JBP methodology, PRM frameworks, channel management best practices
      - path: references/cosell-methodology.yaml
        description: Co-sell execution frameworks, deal registration, account mapping, pipeline coordination
      - path: references/partner-enablement-benchmarks.yaml
        description: Industry benchmarks for partner programs, certification ROI, revenue impact data
  profile:
    why: >
      Partner ecosystems generate up to 28% of enterprise software revenue, but most partner
      managers spend their time on administrative coordination rather than strategic partner
      development. Between certification tracking across dozens of partners, deal registration
      reconciliation, joint business plan preparation, and partner performance reporting, the
      actual relationship building and co-sell strategy work shrinks to a fraction of the week.
    human_matters_summary: >
      The agent tracks commitments, surfaces risks, monitors certifications, and identifies
      co-sell overlap, but the partner manager builds the trust that makes partners prioritize
      your deals over a competitor's. Partner relationships are built on personal credibility,
      mutual wins, and the political judgment to know when to push for more commitment versus
      when to protect a fragile alignment. No agent can read the room in a QBR where the
      partner is quietly evaluating whether to invest more or pull back.
    human_matters_goal: >
      Every partner engagement is tracked, every certification is current, every co-sell
      opportunity is surfaced, but the partnership thrives because the partner manager earned
      the trust that makes partners lean in rather than hold back.
    role_tab_intro: >
      A Partner Manager juggles dozens of partner relationships, each with its own certification
      requirements, co-sell motions, and delivery dependencies. The challenges below are where
      partner momentum stalls, co-sell opportunities are missed, and certification lapses create
      deal risk, each mapped to the sub-agent built to handle it.
    goals_summary: >
      The Partner Manager succeeds when partner-sourced pipeline grows predictably, co-sell
      motions close faster than direct deals, certifications never lapse mid-deal, and partner
      QBRs produce joint commitments rather than status updates.
    goals:
      - Grow partner-sourced pipeline as a percentage of total bookings
      - Achieve partner-involved deal win rate above 2.5x direct-only baseline
      - Maintain 100% certification compliance across active partners (zero lapses mid-deal)
      - Reduce partner-involved deal cycle time by 20% through structured co-sell motions
      - Complete joint business plans with all strategic partners within Q1
      - Surface at least 3 co-sell opportunities per strategic partner per quarter
      - Achieve partner engagement health score of GREEN for 80%+ of strategic partners
      - Resolve partner-related deal risks within 5 business days of detection
      - Increase partner attach rate on enterprise deals to target threshold
      - Drive partner enablement completion rate above 85% for program tier requirements
    role_context: >
      The Partner Manager owns the commercial relationship between the vendor and its partner
      ecosystem, which includes system integrators, ISVs, resellers, and technology alliance
      partners. Enterprise deals increasingly involve one or more partners for implementation,
      integration, or co-sell, making partner alignment critical to deal velocity and customer
      success. The Partner Manager works across 15-40 partner relationships simultaneously, each
      with different certification requirements, competency tiers, co-sell motions, and delivery
      capabilities. They coordinate with AEs on deal-level partner involvement, with HAMs on
      hyperscaler co-sell, with delivery on implementation handoffs, and with the Alliance
      Architect on technical integration.
    key_metrics:
      - "Partner-sourced pipeline: revenue in pipeline originated by or through partners"
      - "Partner attach rate: percentage of enterprise deals with partner involvement"
      - "Co-sell conversion rate: co-sell opportunities progressed to closed-won"
      - "Certification compliance: percentage of active partners with current certifications"
      - "Partner engagement health: GREEN/YELLOW/RED score across strategic partner portfolio"
      - "Deal registration accuracy: registrations accepted vs. submitted across partner portals"
      - "Joint business plan completion: percentage of strategic partners with active JBPs"
    stakeholder_landscape:
      customer_side:
        - role: "Partner Account Manager: primary vendor relationship owner at the partner organization"
          connected_via: partner-cosell-agent
        - role: "Partner Practice Lead: owns partner's delivery capability and resource allocation"
          connected_via: partner-enablement-agent
        - role: "Partner Sales Rep: partner's field seller pursuing co-sell opportunities"
          connected_via: partner-cosell-agent
        - role: "Partner Executive Sponsor: senior leader who sets strategic direction for the partnership"
          connected_via: partner-program-health-agent
        - role: "Partner Technical Lead: owns partner's certification, training, and technical competency"
          connected_via: partner-enablement-agent
      internal_team:
        - role: "VP Partnerships / Channel Chief: sets partner strategy, approves JBPs, resolves escalations"
          connected_via: partner-agent
        - role: "Account Executive: deal owner who needs partner involvement for specific opportunities"
          connected_via: partner-cosell-agent
        - role: "Alliance Architect: technical counterpart who validates partner integration and solution design"
          connected_via: partner-enablement-agent
        - role: "Hyperscaler Account Manager: coordinates hyperscaler co-sell motions involving partners (CPPO, ISV)"
          connected_via: partner-cosell-agent
        - role: "Delivery Manager: receives partner handoff for implementation, tracks partner delivery dependencies"
          connected_via: partner-risk-agent
        - role: "RevOps: partner attribution, deal registration reconciliation, commission tracking"
          connected_via: partner-program-health-agent
    challenges:
