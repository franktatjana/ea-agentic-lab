        - title: pipeline_data
          type: string
      outputs:
        - title: cosell_opportunity_result
          type: object
      requires_data:
        - source: read-partner-data
          fields: [vendor_pipeline, partner_pipeline, account_overlap, solution_fit]
          priority: critical
    partner-deal-registration:
      description: Coordinate deal registration and attribution
