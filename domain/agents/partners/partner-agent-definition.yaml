        source: "WorkSpan: mature programs monitor 6+ health dimensions continuously, not quarterly"
    administrative_overhead:
      - text: "Maintaining partner capability matrices across dozens of partners"
        automated_by: partner-enablement-agent
      - text: "Chasing certification renewal dates and compliance documents"
        automated_by: partner-enablement-agent
      - text: "Coordinating co-sell registrations across partner portals"
        automated_by: partner-cosell-agent
      - text: "Reconciling partner deal registrations with internal CRM records"
        automated_by: partner-cosell-agent
      - text: "Compiling partner performance data for scorecards and QBR decks"
        automated_by: partner-program-health-agent
      - text: "Tracking partner deliverable status across accounts"
        automated_by: partner-program-health-agent
    scenarios:
      - problem: "Partner delays block deal execution without warning"
        why: >
          Partner deliverables are tracked in separate systems with different cadences.
          When a partner falls behind on a commitment, the account team finds out only
          when the delay cascades into the deal timeline. By then, the customer is already
          frustrated and recovery options are limited.
        agent: partner-risk-agent
        agent_response: >
          Monitors partner deliverables against commitments continuously. Flags dependencies
          at risk before they cascade. Produces a dependency status report with impact
          assessment and recommended mitigation actions for the account team.
        success_signal: "Account teams receive partner delay alerts at least 10 business days before deal impact"
      - problem: "Co-sell opportunities are discovered reactively instead of through systematic pipeline analysis"
        why: >
          Partner and vendor sales teams pursue separate pipelines with limited visibility
          into overlap. The co-sell conversation happens only when someone remembers to bring
          it up in a partner sync, by which point the opportunity may have progressed past
          the stage where partner involvement adds maximum value.
        agent: partner-cosell-agent
        agent_response: >
          Runs pipeline overlap analysis matching active vendor opportunities against partner
          customer bases and complementary solution areas. Surfaces co-sell candidates with
          deal context, joint value proposition, and recommended engagement approach.
        success_signal: "Partner co-sell pipeline grows 25%+ through systematic opportunity identification"
      - problem: "Partner QBR preparation takes days of manual data compilation with no standard format"
        why: >
          Partner performance data lives in CRM, partner portals, certification databases,
          and email threads. The partner manager spends days before each QBR pulling data
          together into a deck, leaving minimal time for the strategic conversation that
          the QBR is supposed to enable.
        agent: partner-program-health-agent
        agent_response: >
          Generates a pre-built QBR package with engagement health scores, pipeline contribution,
          certification status, and JBP progress tracked against commitments. The partner
          manager reviews and refines rather than building from scratch.
        success_signal: "QBR preparation time drops from days to hours with pre-populated health dashboards"
    key_responsibilities:
      - "Partner Enablement: assess onboarding readiness, track certifications, identify training gaps, and evaluate partner maturity across six dimensions to ensure partners meet program tier requirements"
      - "Co-sell Execution: identify pipeline overlap, coordinate deal registration, prepare joint business plans, and develop joint positioning to drive partner-sourced and partner-influenced revenue"
      - "Program Health Monitoring: assess engagement health with GREEN/YELLOW/RED scoring, track dependencies, generate performance scorecards, and produce QBR-ready program reviews"
      - "Risk Governance: identify and classify partner risks, plan issue resolution, prepare escalation packages, and detect channel conflict before it impacts deals"
      - "Certification Compliance: monitor certification expiry dates, flag lapses before they affect active deals, and track competency tier requirements across the partner portfolio"
      - "Deal Registration Coordination: reconcile partner deal registrations with CRM records, resolve attribution disputes, and ensure proper partner credit for sourced and influenced revenue"
      - "Joint Business Planning: prepare JBP sessions with mutual objectives, shared metrics, activity plans with owners, and quarterly review cadence that drives accountability"
      - "Partner Performance Reporting: generate scorecards benchmarked against industry data, track partner contribution to pipeline and bookings, and surface trends for leadership"
      - "Account-Level Partner Coordination: ensure partner activities align with account plans, coordinate handoffs between partner and vendor teams, and maintain communication cadence"
      - "Ecosystem Strategy Support: provide partner capability data and co-sell performance metrics to inform VP Partnerships strategy decisions on partner mix and investment"
    sub_agents:
      - name: Partner Enablement Agent
        id: partner-enablement-agent
        purpose: Assess partner onboarding readiness, track certification compliance, identify training gaps, and evaluate partner maturity across six dimensions against program tier requirements.
      - name: Partner Co-sell Agent
        id: partner-cosell-agent
        purpose: Identify co-sell opportunities through pipeline overlap analysis, coordinate deal registration, prepare joint business plans, and develop joint positioning for partner-involved deals.
      - name: Partner Program Health Agent
        id: partner-program-health-agent
        purpose: Assess partner engagement health with GREEN/YELLOW/RED scoring, track deliverable dependencies, generate performance scorecards, and produce QBR-ready program health reviews.
      - name: Partner Risk Agent
        id: partner-risk-agent
        purpose: Identify and classify partner risks, plan issue resolution, prepare escalation packages, and detect channel conflict scenarios before they impact deal timelines.
    with_this_agent:
      - domain: Partner Enablement and Certification
        agent: partner-enablement-agent
        items:
          - "Onboarding: assess partner readiness against program requirements and onboarding checklist"
          - "Certification: track expiry dates, flag approaching lapses, validate compliance for active deals"
          - "Training: identify gaps between partner skills and program tier requirements"
          - "Maturity: evaluate partner across six dimensions (onboarding, enablement, collaboration, performance, governance, KPIs)"
      - domain: Co-sell Pipeline and Joint Planning
        agent: partner-cosell-agent
        items:
          - "Pipeline overlap: match vendor and partner pipelines to identify co-sell opportunities"
          - "Deal registration: coordinate registration, resolve attribution, ensure proper partner credit"
          - "Joint planning: prepare JBP sessions with mutual objectives, shared metrics, and activity owners"
          - "Joint positioning: develop aligned value propositions and success stories for joint engagements"
      - domain: Program Health and Reporting
        agent: partner-program-health-agent
        items:
          - "Engagement health: assess partner engagement with GREEN/YELLOW/RED scoring per account"
          - "Dependencies: track partner deliverables against commitments, flag at-risk items"
          - "Scorecards: generate performance scorecards with pipeline contribution, certification status, and engagement metrics"
          - "Program review: produce QBR-ready health summaries with trends and recommendations"
      - domain: Risk Governance and Conflict Resolution
        agent: partner-risk-agent
        items:
          - "Risk identification: classify partner risks by severity (high/medium/low) with evidence"
          - "Issue resolution: develop resolution plans with timeline, owners, and success criteria"
          - "Escalation: prepare escalation packages with impact assessment and recommended actions"
          - "Channel conflict: detect direct vs. partner territory overlap and propose resolution"
    activity_map:
      purpose: >
        The Partner Manager exists to turn partner relationships into a predictable revenue
        multiplier for enterprise deals. Everything the Partner Manager does falls into one
        of these operational domains. Each domain is owned by a sub-agent that operates
        independently with its own tools, flows, boundaries, and prompt registry.
      domains:
        - domain: Partner Enablement and Certification
          why: >
            Certified partners earn 6x more revenue and close deals 38% faster. When
            certifications lapse or training gaps exist, the partner cannot deliver at the
            level the customer expects, creating risk that surfaces too late in the deal cycle.
          agent: partner-enablement-agent
          contributing_agents:
            - agent: partner-program-health-agent
              provides: Engagement health context for maturity assessment
            - agent: partner-risk-agent
              provides: Certification lapse risk alerts
          owner: partner-enablement-agent
          receives: Partner profiles, certification databases, training records, program tier requirements
          provides: Onboarding readiness assessments, certification compliance reports, maturity scores
          activities:
            - Partner onboarding readiness assessment
            - Certification compliance tracking and lapse alerting
            - Training gap analysis against tier requirements
            - Partner maturity scoring across six dimensions
          cadence: monthly certification scan, per-partner onboarding, quarterly maturity review
        - domain: Co-sell Pipeline and Joint Planning
          why: >
            Partner referrals represent only 10% of pipeline but drive 31% of closed revenue.
            Systematic pipeline overlap analysis and structured co-sell motions unlock revenue
            that ad-hoc partner coordination consistently misses.
          agent: partner-cosell-agent
          contributing_agents:
            - agent: partner-enablement-agent
              provides: Partner capability and certification context for deal matching
            - agent: partner-program-health-agent
              provides: Engagement health for co-sell prioritization
          owner: partner-cosell-agent
          receives: Vendor pipeline, partner pipeline, account plans, CRM opportunity data
          provides: Co-sell opportunity reports, deal registration status, JBP drafts, joint positioning briefs
          activities:
            - Pipeline overlap analysis and co-sell opportunity identification
            - Deal registration coordination and attribution reconciliation
            - Joint business plan preparation and commitment tracking
            - Joint positioning and success story development
          cadence: weekly pipeline scan, per-deal registration, quarterly JBP review
        - domain: Program Health and Reporting
          why: >
            Partner program health is typically assessed reactively at QBR time, missing early
            warning signals. Continuous health monitoring with GREEN/YELLOW/RED scoring catches
            partner disengagement before it impacts the pipeline.
          agent: partner-program-health-agent
          contributing_agents:
            - agent: partner-cosell-agent
              provides: Pipeline contribution and co-sell conversion data
            - agent: partner-enablement-agent
              provides: Certification and maturity status for health scoring
          owner: partner-program-health-agent
          receives: CRM data, partner portal data, engagement records, deliverable tracking
          provides: Engagement health scores, performance scorecards, dependency alerts, QBR packages
          activities:
            - Partner engagement health assessment (GREEN/YELLOW/RED)
            - Dependency status tracking and at-risk flagging
            - Performance scorecard generation with benchmarks
            - QBR-ready program health review
          cadence: weekly dependency scan, monthly scorecard, quarterly program review
        - domain: Risk Governance and Conflict Resolution
          why: >
            Partner delays and channel conflicts are the two most common partner-related deal
            killers. Without structured risk identification and conflict detection, these issues
            surface only when they have already impacted customer timelines or sales team morale.
          agent: partner-risk-agent
          contributing_agents:
            - agent: partner-program-health-agent
              provides: Engagement health trends and dependency status
            - agent: partner-cosell-agent
              provides: Deal registration data for conflict detection
          owner: partner-risk-agent
          receives: Engagement records, dependency tracking, deal registrations, territory data
          provides: Risk assessments, resolution plans, escalation packages, conflict reports
          activities:
            - Partner risk identification and severity classification
            - Issue resolution planning with timeline and owners
            - Escalation package preparation for leadership
            - Channel conflict detection and resolution recommendation
          cadence: continuous risk monitoring, per-issue resolution, triggered by threshold breach
