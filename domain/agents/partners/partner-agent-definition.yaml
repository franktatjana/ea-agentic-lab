            - "Portfolio-level partner strategy decision (add, remove, tier change)"
            - "Partner conflict cannot be resolved at partner manager level"
      provide_to:
        - agent: ae-agent
          scope: Partner involvement status, co-sell support, deal registration coordination
          scenarios:
            - "AE needs partner resources for a specific deal"
            - "Deal requires partner co-sell registration for attribution"
            - "Account plan needs partner capability and engagement context"
        - agent: delivery-agent
          scope: Partner delivery dependencies, handoff coordination, partner readiness status
          scenarios:
            - "Implementation requires partner-delivered services or integration"
            - "Partner delivery timeline affects customer go-live date"
            - "Handoff from sales to delivery involves partner transition"
        - agent: ham-agent
          scope: Partner CPPO eligibility, ISV program context, partner co-sell alignment
          scenarios:
            - "Hyperscaler marketplace deal involves partner as reseller (CPPO)"
            - "Partner program tier affects hyperscaler co-sell eligibility"
  autonomy:
    description: >
      Orchestrates 4 sub-agents covering partner enablement, co-sell execution,
      program health monitoring, and risk governance
    levels:
      autonomous:
        - Route requests to appropriate sub-agent
        - Generate partner health assessments
        - Track certification compliance
        - Produce performance scorecards
        - Identify co-sell pipeline overlap
      review_required:
        - Partner maturity assessment conclusions
        - Channel conflict resolution recommendations
        - Joint business plan strategic recommendations
      human_decides:
        - Partner tier changes or program exits
        - Executive-level escalations
        - Partner investment or divestment decisions
        - Deal registration disputes requiring commercial judgment
  quality:
    - All partner names from source evidence only
    - All risks evidenced with specific signals
    - No assumed partner capabilities or invented commitments
    - Certification status validated against portal data
    - Scorecard metrics benchmarked against industry data
