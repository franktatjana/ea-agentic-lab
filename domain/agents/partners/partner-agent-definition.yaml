x-ea-agent:
  profile:
    role_context: 'Most enterprise deals involve technology partners, system integrators, or co-sell
      relationships. The Partner Manager owns the commercial side: alignment tracking, dependency
      visibility, co-sell coordination, certification compliance, and partner performance. Technical
      integration design and joint solution architecture sit with the Alliance Architect, the
      Partner Manager''s technical counterpart.

      '
    scenarios:
    - problem: Partner delays block deal execution without warning
      why: 'Partner deliverables are tracked in separate systems with different cadences. When a partner falls behind on a commitment, the account team finds out only when the delay cascades into the deal
        timeline. By then, the customer is already frustrated and the recovery options are limited.

        '
      agent: partner-agent
      agent_response: 'The agent tracks partner involvement in accounts, monitors deliverables against commitments, and flags partner-related risks like misalignment and delays. It links partner work to
        account plans so the team sees dependency status alongside deal progress, catching delays before they cascade.

        '
      success_signal:
        metric: Partner risk detection lead time
        target: Flag partner delays at least 10 business days before they impact deal timelines
        leading_indicator: Account teams proactively adjust plans based on partner risk alerts
        failure_signal: Partner delays are first discovered when customers report timeline slips
    - problem: Partner coordination gaps create account surprises
      why: 'When multiple partners or a partner and vendor are engaged in the same account, communication gaps lead to conflicting messages, duplicated effort, or dropped responsibilities. Without visibility
        into who owns what, the customer experiences confusion that erodes confidence in the overall engagement.

        '
      agent: partner-agent
      agent_response: 'The agent maintains alignment visibility by tracking partner roles, deliverables, and communication threads across accounts. It prepares coordination sync materials, identifies scope
        overlaps or gaps, and generates partner updates for the account team so everyone operates from the same picture.

        '
      success_signal:
        metric: Partner coordination gap incidents per account
        target: Reduce partner-related account surprises by 50% per quarter
        leading_indicator: Account teams have current partner status in weekly planning
        failure_signal: Customers report conflicting information from partner and vendor teams
    - problem: Partner capabilities are hard to match to specific deal needs
      why: 'The partner ecosystem spans dozens of firms with overlapping and evolving capabilities. When a deal requires a specific integration or vertical expertise, the account team guesses based on past
        experience or asks around instead of querying a structured capability inventory. The wrong partner match wastes weeks and damages customer confidence.

        '
      agent: partner-agent
      agent_response: 'The agent maintains a structured partner capability matrix covering technical skills, vertical expertise, geographic reach, and implementation track record. It matches deal requirements
        against partner profiles, ranks candidates by fit score, and surfaces relevant case studies so the account team makes evidence-based partner selections.

        '
      success_signal:
        metric: Partner-deal match accuracy
        target: At least 80% of partner recommendations result in successful deal collaboration
        leading_indicator: Account teams use capability match reports instead of ad-hoc referrals
        failure_signal: Partner is swapped mid-engagement due to capability mismatch
    - problem: Certification status goes out of date without active tracking
      why: 'Partner certifications expire, competency tiers change, and specialization requirements evolve. Without active monitoring, the team recommends partners based on credentials that have lapsed,
        creating risk when the customer validates qualifications during procurement.

        '
      agent: partner-agent
      agent_response: 'The agent tracks certification expiration dates, competency tier changes, and specialization renewals across the partner ecosystem. It alerts the partnership team when credentials
        are approaching expiry and flags any active deals that reference partners with lapsed certifications.

        '
      success_signal:
        metric: Partner certification accuracy
        target: Zero deals reference partners with expired or lapsed certifications
        leading_indicator: Certification renewal alerts triggered at least 30 days before expiry
        failure_signal: Customer discovers a recommended partner's certification has expired during due diligence
    - problem: Co-sell opportunities are missed due to lack of visibility
      why: 'Partner sales teams pursue their own pipelines with limited visibility into the vendor''s active accounts. Overlapping customer relationships and complementary solutions exist, but neither side
        surfaces the opportunity because there is no systematic way to match pipelines and identify co-sell potential.

        '
      agent: partner-agent
      agent_response: 'The agent identifies co-sell opportunities by matching active pipeline accounts with partner customer bases and complementary solution areas. It surfaces overlap reports with deal
        context, recommends co-sell motions based on joint value propositions, and tracks co-sell pipeline to measure partnership effectiveness.

        '
      success_signal:
        metric: Co-sell opportunity identification rate
        target: Surface at least 2 co-sell opportunities per strategic partner per quarter
        leading_indicator: Pipeline overlap analysis is reviewed in monthly partner sync meetings
        failure_signal: Co-sell opportunities are discovered only when a partner mentions them reactively
    - problem: Joint solution positioning varies across deals
      why: 'When vendor and partner present together, each team tells its own story. Without aligned positioning, the joint value proposition sounds like two separate pitches stitched together. Customers
        question whether the partnership is real or just a slide in a deck.

        '
      agent: partner-agent
      agent_response: 'The agent maintains joint solution positioning frameworks per partner, including agreed value propositions, reference architectures, and customer proof points. It generates deal-specific
        joint positioning briefs that align both teams on messaging, responsibilities, and customer-facing materials before joint engagements.

        '
      success_signal:
        metric: Joint positioning consistency
        target: Joint engagements use aligned positioning materials in at least 90% of deals
        leading_indicator: Both partner and vendor teams reference the same value proposition in customer meetings
        failure_signal: Customer feedback indicates partner and vendor messages were disconnected
    challenges:
    - text: Partner capabilities are hard to match to specific deal needs
      specific_overhead:
      - Maintaining partner capability matrices across dozens of partners
    - text: Certification status goes out of date without active tracking
      specific_overhead:
      - Chasing certification renewal dates and compliance documents
    - text: Co-sell opportunities are missed due to lack of visibility
      specific_overhead:
      - Coordinating co-sell registrations across partner portals
    - text: Joint solution positioning varies across deals
      specific_overhead:
      - Reconciling partner deal registrations with internal CRM records
    - Partner delays block deal execution without warning
    - Partner coordination gaps create account surprises
    administrative_overhead:
    - Maintaining partner capability matrices across dozens of partners
    - Chasing certification renewal dates and compliance documents
    - Coordinating co-sell registrations across partner portals
    - Reconciling partner deal registrations with internal CRM records
    capabilities:
    - Partner capability alignment
    - Certification and competency tracking
    - Co-sell opportunity mapping and pipeline coordination
    - Partner performance scorecards
    - Partner dependency tracking and risk alerting
    - Deal registration coordination
    - Joint planning facilitation
    human_matters_summary: 'Partners are people with their own agendas. The agent tracks commitments and surfaces delays, but the partner manager understands the relationship dynamics, decides when to escalate
      versus resolve directly, and translates partner responses into account reality. The dependency is visible, but human judgment navigates the politics that determine whether partner work happens.

      '
