      - text: "Tracking partner deliverable status across accounts"
        automated_by: partner-program-health-agent
    scenarios:
      - problem: "Partner delays block deal execution without warning"
        why: >
          Partner deliverables are tracked in separate systems with different cadences.
          When a partner falls behind on a commitment, the account team finds out only
          when the delay cascades into the deal timeline. By then, the customer is already
          frustrated and recovery options are limited.
        agent: partner-risk-agent
        agent_response: >
          Monitors partner deliverables against commitments continuously. Flags dependencies
          at risk before they cascade. Produces a dependency status report with impact
          assessment and recommended mitigation actions for the account team.
        success_signal: "Account teams receive partner delay alerts at least 10 business days before deal impact"
      - problem: "Co-sell opportunities are discovered reactively instead of through systematic pipeline analysis"
        why: >
          Partner and vendor sales teams pursue separate pipelines with limited visibility
          into overlap. The co-sell conversation happens only when someone remembers to bring
          it up in a partner sync, by which point the opportunity may have progressed past
          the stage where partner involvement adds maximum value.
        agent: partner-cosell-agent
        agent_response: >
          Runs pipeline overlap analysis matching active vendor opportunities against partner
          customer bases and complementary solution areas. Surfaces co-sell candidates with
          deal context, joint value proposition, and recommended engagement approach.
        success_signal: "Partner co-sell pipeline grows 25%+ through systematic opportunity identification"
      - problem: "Partner QBR preparation takes days of manual data compilation with no standard format"
        why: >
          Partner performance data lives in CRM, partner portals, certification databases,
          and email threads. The partner manager spends days before each QBR pulling data
          together into a deck, leaving minimal time for the strategic conversation that
          the QBR is supposed to enable.
        agent: partner-program-health-agent
        agent_response: >
          Generates a pre-built QBR package with engagement health scores, pipeline contribution,
          certification status, and JBP progress tracked against commitments. The partner
          manager reviews and refines rather than building from scratch.
        success_signal: "QBR preparation time drops from days to hours with pre-populated health dashboards"
    key_responsibilities:
      - "Partner Enablement: assess onboarding readiness, track certifications, identify training gaps, and evaluate partner maturity across six dimensions to ensure partners meet program tier requirements"
      - "Co-sell Execution: identify pipeline overlap, coordinate deal registration, prepare joint business plans, and develop joint positioning to drive partner-sourced and partner-influenced revenue"
      - "Program Health Monitoring: assess engagement health with GREEN/YELLOW/RED scoring, track dependencies, generate performance scorecards, and produce QBR-ready program reviews"
      - "Risk Governance: identify and classify partner risks, plan issue resolution, prepare escalation packages, and detect channel conflict before it impacts deals"
      - "Certification Compliance: monitor certification expiry dates, flag lapses before they affect active deals, and track competency tier requirements across the partner portfolio"
      - "Deal Registration Coordination: reconcile partner deal registrations with CRM records, resolve attribution disputes, and ensure proper partner credit for sourced and influenced revenue"
      - "Joint Business Planning: prepare JBP sessions with mutual objectives, shared metrics, activity plans with owners, and quarterly review cadence that drives accountability"
      - "Partner Performance Reporting: generate scorecards benchmarked against industry data, track partner contribution to pipeline and bookings, and surface trends for leadership"
      - "Account-Level Partner Coordination: ensure partner activities align with account plans, coordinate handoffs between partner and vendor teams, and maintain communication cadence"
      - "Ecosystem Strategy Support: provide partner capability data and co-sell performance metrics to inform VP Partnerships strategy decisions on partner mix and investment"
