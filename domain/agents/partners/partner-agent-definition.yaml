# Partner Manager Agent - Orchestrator Definition
# Oracle Agent Spec 26.1.0
# Sub-agents: partner-enablement, partner-cosell, partner-program-health, partner-risk
# Role: Digital twin of the Partner Manager
agentspec_version: 26.1.0
component_type: Agent
id: partner-agent
name: Partner Manager Agent
description: >
  Digital twin of the Partner Manager role. Orchestrates partner ecosystem
  management across enablement, co-sell execution, program health, and risk
  governance through 4 specialized sub-agents. Owns the commercial side of
  partner relationships while the Alliance Architect Agent owns technical
  integration and joint solution architecture.
metadata:
  definition_version: 1.0.0
  disclaimer: This agent specification is a reference design for educational and demonstration purposes. It is not a production system. All examples, case studies, and scenarios are fictional.
  tags:
    - partners
    - sales
    - partner-enablement
    - co-sell
    - channel-management
    - partner-ecosystem
  responsibility: >
    Orchestrate 4 sub-agents covering partner enablement, co-sell execution,
    program health monitoring, and partner risk governance
  parent_agent: null
system_prompt: >
  You are the Partner Manager Orchestrator. You are a PURE ROUTER.
  You DO NOT answer partner questions directly.
  You route every request to exactly one of your 4 sub-agents.

  ROUTING TABLE:

  partner-enablement-agent
    - Partner onboarding readiness
    - Certification tracking and compliance
    - Training gap analysis
    - Partner maturity assessment
    - Competency tier monitoring

  partner-cosell-agent
    - Co-sell opportunity identification and pipeline matching
    - Deal registration coordination
    - Joint planning and business plan preparation
    - Account mapping and overlap analysis
    - Joint positioning and success story development

  partner-program-health-agent
    - Partner engagement health assessment
    - Performance scorecard generation
    - Dependency status tracking
    - Partner contribution metrics and reporting
    - Program tier health monitoring

  partner-risk-agent
    - Partner risk identification and classification
    - Issue resolution planning
    - Escalation preparation
    - Channel conflict detection
    - Compliance and certification lapse alerting

  ROUTING RULES:
  1. Parse the user request for domain signals
  2. Route to exactly ONE sub-agent
  3. If the request spans multiple domains, route to the PRIMARY domain
     and note which secondary sub-agents should be consulted
  4. NEVER generate partner analysis yourself

  AGGREGATION: When a request requires cross-domain synthesis (e.g.,
  "full partner review"), trigger parallel assessments from relevant
  sub-agents and aggregate their outputs into a unified view.

  MUST NOT:
  - Perform partner analysis directly
  - Design joint solution architectures (Alliance Architect's domain)
  - Validate technical integration patterns (Alliance Architect's domain)
  - Make partner commitments or promises
  - Manage partner relationships directly (Partner Manager human's domain)
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.4
    max_tokens: 4096
inputs:
  - title: partner_request
    type: string
    description: The partner-related request to route
  - title: account_context
    type: string
    description: Account and partner context
outputs:
  - title: routed_response
    type: object
    description: Response from the appropriate sub-agent
tools:
  - component_type: ClientTool
    id: invoke-partner-enablement
    name: Invoke Partner Enablement Agent
    description: Route to enablement sub-agent for onboarding, certification, training, maturity assessment
    requires_confirmation: false
    inputs:
      - title: task
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: sub-agent
  - component_type: ClientTool
    id: invoke-partner-cosell
    name: Invoke Partner Co-sell Agent
    description: Route to co-sell sub-agent for deal registration, joint planning, account mapping, pipeline coordination
    requires_confirmation: false
    inputs:
      - title: task
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: sub-agent
  - component_type: ClientTool
    id: invoke-partner-program-health
    name: Invoke Partner Program Health Agent
    description: Route to program health sub-agent for engagement health, scorecards, dependency tracking, reporting
    requires_confirmation: false
    inputs:
      - title: task
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: sub-agent
  - component_type: ClientTool
    id: invoke-partner-risk
    name: Invoke Partner Risk Agent
    description: Route to risk sub-agent for risk identification, issue resolution, escalation, channel conflict
    requires_confirmation: false
    inputs:
      - title: task
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: sub-agent
  - component_type: ClientTool
    id: read-partner-data
    name: Read Partner Data
    description: "Access data sources: partner records, account plans, communication threads, deliverables, certifications"
    requires_confirmation: false
    inputs:
      - title: query
        type: string
    outputs:
      - title: data
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry
  - component_type: ClientTool
    id: write-partner-artifact
    name: Write Partner Artifact
    description: "Save artifacts: alignment notes, risk alerts, scorecards, enablement reports"
    requires_confirmation: true
    inputs:
      - title: artifact
        type: object
      - title: destination_path
        type: string
    outputs:
      - title: status
        type: string
    x-ea-agent:
      risk: medium
      resolver: service-registry
  - component_type: ClientTool
    id: ask-user
    name: Ask User
    description: Request clarification or additional input from the user
    requires_confirmation: false
    inputs:
      - title: question
        type: string
    outputs:
      - title: answer
        type: string
    x-ea-agent:
      risk: low
      resolver: inline
toolboxes: []
specialized_agents:
  - component_type: SpecializedAgent
    id: partner-agent-proactive
    name: Partner Agent (Proactive)
    description: "Proactive mode: scans for partner signals, surfaces risks, flags certification lapses, identifies co-sell opportunities"
    agent:
      $component_ref: partner-agent
    agent_specialization_parameters:
      additional_instructions: >
        Focus on proactive detection and early warning. Scan sources
        for partner signals: certification approaching expiry, engagement
        cadence dropping, deal registration gaps, co-sell pipeline overlap.
        Surface insights before being asked. Prioritize timeliness.
      human_in_the_loop: true
  - component_type: SpecializedAgent
    id: partner-agent-analytical
    name: Partner Agent (Analytical)
    description: "Analytical mode: deep analysis with comprehensive evidence, trend identification, and pattern recognition"
    agent:
      $component_ref: partner-agent
    agent_specialization_parameters:
      additional_instructions: >
        Focus on depth and pattern recognition. Provide comprehensive
        analysis with full evidence trails. Synthesize across multiple
        data points. Include confidence levels and caveats. Compare
        partner performance against benchmarks.
      human_in_the_loop: true
flows:
  - component_type: Flow
    id: partner-enablement
    name: Partner Enablement
    description: Flow for partner onboarding, certification, training, and maturity assessment.
    inputs:
      - title: partner_name
        type: string
      - title: program_tier
        type: string
      - title: certification_data
        type: string
      - title: training_records
        type: string
    outputs:
      - title: enablement_result
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: partner-onboarding-readiness
          input: partner_name, program_tier
          description: Assess partner readiness for onboarding or tier advancement
        - step: 2
          prompt: partner-certification-compliance
          input: partner_name, certification_data
          description: Track certification status and flag lapses or approaching expiry
        - step: 3
          prompt: partner-training-gap
          input: partner_name, training_records
          description: Identify training gaps against program tier requirements
        - step: 4
          prompt: partner-maturity-assessment
          input: partner_name, program_tier
          description: Assess partner maturity across six dimensions
  - component_type: Flow
    id: partner-cosell
    name: Partner Co-sell
    description: Flow for co-sell execution, deal registration, joint planning, and account mapping.
    inputs:
      - title: partner_name
        type: string
      - title: account_name
        type: string
      - title: planning_objective
        type: string
      - title: pipeline_data
        type: string
    outputs:
      - title: cosell_result
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: partner-cosell-opportunity
          input: partner_name, account_name, pipeline_data
          description: Identify co-sell opportunities from pipeline overlap
        - step: 2
          prompt: partner-deal-registration
          input: partner_name, account_name
          description: Coordinate deal registration and attribution
        - step: 3
          prompt: partner-joint-planning
          input: partner_name, account_name, planning_objective
          description: Prepare for joint business planning session
        - step: 4
          prompt: partner-joint-positioning
          input: partner_name, account_name
          description: Develop joint positioning and success story
  - component_type: Flow
    id: partner-program-health
    name: Partner Program Health
    description: Flow for engagement health, scorecards, dependency tracking, and reporting.
    inputs:
      - title: partner_name
        type: string
      - title: account_name
        type: string
      - title: review_period
        type: string
      - title: scorecard_metrics
        type: string
    outputs:
      - title: program_health_result
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: partner-engagement-health
          input: partner_name, account_name
          description: Assess health of partner engagement in account
        - step: 2
          prompt: partner-dependency-status
          input: partner_name, account_name
          description: Track status of partner dependencies
        - step: 3
          prompt: partner-performance-scorecard
          input: partner_name, review_period, scorecard_metrics
          description: Generate partner performance scorecard
        - step: 4
          prompt: partner-program-review
          input: partner_name, review_period
          description: Comprehensive program health review for QBR or leadership
  - component_type: Flow
    id: partner-risk
    name: Partner Risk
    description: Flow for risk identification, issue resolution, escalation, and channel conflict.
    inputs:
      - title: partner_name
        type: string
      - title: account_name
        type: string
      - title: issue_description
        type: string
      - title: engagement_status
        type: string
    outputs:
      - title: risk_result
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: partner-risk-identification
          input: partner_name, account_name, engagement_status
          description: Identify and classify partner-related risks
        - step: 2
          prompt: partner-issue-resolution
          input: partner_name, issue_description
          description: Plan resolution for partner issue
        - step: 3
          prompt: partner-escalation-prep
          input: partner_name, issue_description
          description: Prepare partner escalation package
        - step: 4
          prompt: partner-channel-conflict
          input: partner_name, account_name
          description: Detect and assess channel conflict scenarios
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: "0.1"
    capabilities:
      - partner-enablement
      - partner-cosell
      - partner-program-health
      - partner-risk
    input_modes:
      - text/plain
      - application/json
    output_modes:
      - application/yaml
      - application/json
      - text/markdown
      - text/plain
x-ea-agent:
  prompt_registry:
    partner-onboarding-readiness:
      description: Assess partner readiness for onboarding or tier advancement
      source: prompts/tasks.yaml#enablement.onboarding_readiness
      inputs:
        - title: partner_name
          type: string
        - title: program_tier
          type: string
      outputs:
        - title: onboarding_readiness_result
          type: object
      requires_data:
        - source: read-partner-data
          fields: [partner_profile, program_requirements, onboarding_checklist]
          priority: critical
    partner-certification-compliance:
      description: Track certification status and flag lapses
      source: prompts/tasks.yaml#enablement.certification_compliance
      inputs:
        - title: partner_name
          type: string
        - title: certification_data
          type: string
      outputs:
        - title: certification_compliance_result
          type: object
      requires_data:
        - source: read-partner-data
          fields: [certification_records, program_tier_requirements, expiry_dates]
          priority: critical
    partner-training-gap:
      description: Identify training gaps against tier requirements
      source: prompts/tasks.yaml#enablement.training_gap
      inputs:
        - title: partner_name
          type: string
        - title: training_records
          type: string
      outputs:
        - title: training_gap_result
          type: object
      requires_data:
        - source: read-partner-data
          fields: [training_completion, tier_training_requirements, skill_inventory]
          priority: critical
    partner-maturity-assessment:
      description: Assess partner maturity across six dimensions
      source: prompts/tasks.yaml#enablement.maturity_assessment
      inputs:
        - title: partner_name
          type: string
        - title: program_tier
          type: string
      outputs:
        - title: maturity_assessment_result
          type: object
      requires_data:
        - source: read-partner-data
          fields: [partner_profile, engagement_history, certification_records, revenue_data]
          priority: critical
    partner-cosell-opportunity:
      description: Identify co-sell opportunities from pipeline overlap
      source: prompts/tasks.yaml#cosell.cosell_opportunity
      inputs:
        - title: partner_name
          type: string
        - title: account_name
