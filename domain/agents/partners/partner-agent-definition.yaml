    activity_map:
      purpose: >
        The Partner Manager exists to turn partner relationships into a predictable revenue
        multiplier for enterprise deals. Everything the Partner Manager does falls into one
        of eight operational domains, two per sub-agent, each covering a distinct slice of
        partner ecosystem responsibility. Every domain is owned by a sub-agent that operates
        independently with its own tools, flows, boundaries, and prompt registry.
      domains:
        - domain: Partner Enablement and Certification
          why: >
            Certified partners earn 6x more revenue and close deals 38% faster. When
            certifications lapse or training gaps exist, the partner cannot deliver at the
            level the customer expects, creating risk that surfaces too late in the deal cycle.
          agent: partner-enablement-agent
          contributing_agents:
            - agent: partner-program-health-agent
              provides: Engagement health context for maturity assessment
            - agent: partner-risk-agent
              provides: Certification lapse risk alerts
          owner: partner-enablement-agent
          receives: Partner profiles, certification databases, training records, program tier requirements
          provides: Certification compliance reports, training gap analyses, lapse alerts
          activities:
            - Certification compliance tracking across the partner portfolio
            - Lapse alerting before certifications affect active deals
            - Training gap identification against program tier requirements
            - Competency tier monitoring and compliance validation
          cadence: monthly certification scan, triggered on approaching expiry, per-deal compliance check
        - domain: Partner Onboarding and Maturity Development
          why: >
            Partners who complete structured onboarding reach profitability 3x faster. Without
            continuous maturity assessment, enablement investments stay misaligned with partner
            capability gaps, and underperformance is diagnosed only after deal outcomes suffer.
          agent: partner-enablement-agent
          contributing_agents:
            - agent: partner-program-health-agent
              provides: Engagement health trends that signal maturity stagnation
          owner: partner-enablement-agent
          receives: Onboarding checklists, maturity frameworks, engagement history, deal outcome data
          provides: Onboarding readiness reports, maturity scores, remediation plans, re-assessment triggers
          activities:
            - Partner onboarding readiness assessment against program checklist
            - Maturity scoring across six dimensions with trend comparison
            - Remediation plan generation for partners with identified gaps
            - Periodic re-assessment triggered by engagement drift or deal outcome signals
          cadence: per-partner onboarding, quarterly maturity review, triggered by deal outcome anomalies
        - domain: Co-sell Pipeline and Joint Planning
          why: >
            Partner referrals represent only 10% of pipeline but drive 31% of closed revenue.
            Systematic pipeline overlap analysis and structured co-sell motions unlock revenue
            that ad-hoc partner coordination consistently misses.
          agent: partner-cosell-agent
          contributing_agents:
            - agent: partner-enablement-agent
              provides: Partner capability and certification context for deal matching
            - agent: partner-program-health-agent
              provides: Engagement health for co-sell prioritization
          owner: partner-cosell-agent
          receives: Vendor pipeline, partner pipeline, account plans, CRM opportunity data
          provides: Co-sell opportunity reports, JBP drafts, joint positioning briefs
          activities:
            - Pipeline overlap analysis and co-sell opportunity identification
            - Joint business plan preparation with mutual objectives and shared metrics
            - Joint positioning and co-sell success story development
            - Co-sell motion tracking against committed activity plans
          cadence: weekly pipeline scan, quarterly JBP review, per-partner planning session
        - domain: Deal Registration and Attribution
          why: >
            Deal registration disputes are the top reason partners reduce program investment.
            When attribution is unclear or contested, partner trust erodes, revenue reporting
            is distorted, and the partner manager loses credibility with both RevOps and partners.
          agent: partner-cosell-agent
          contributing_agents:
            - agent: partner-risk-agent
              provides: Conflict signals from duplicate registrations or territory overlap
          owner: partner-cosell-agent
          receives: Partner portal registration data, CRM opportunity records, territory assignments
          provides: Registration status reports, attribution reconciliation briefs, dispute documentation
          activities:
            - Deal registration submission and acceptance tracking across partner portals
            - CRM reconciliation to validate partner registration against internal records
            - Attribution dispute preparation with timestamped evidence for RevOps
            - Partner credit tracking through deal close to ensure proper revenue assignment
          cadence: per-deal registration event, weekly reconciliation scan, per-dispute as triggered
        - domain: Program Health and Reporting
          why: >
            Partner program health is typically assessed reactively at QBR time, missing early
            warning signals. Continuous health monitoring with GREEN/YELLOW/RED scoring catches
            partner disengagement before it impacts the pipeline.
          agent: partner-program-health-agent
          contributing_agents:
            - agent: partner-cosell-agent
              provides: Pipeline contribution and co-sell conversion data
            - agent: partner-enablement-agent
              provides: Certification and maturity status for health scoring
          owner: partner-program-health-agent
          receives: CRM data, partner portal data, engagement records, performance metrics
          provides: Engagement health scores, performance scorecards, QBR packages
          activities:
            - Partner engagement health assessment (GREEN/YELLOW/RED) per account
            - Performance scorecard generation with benchmarked metrics
            - QBR-ready program health review with trends and recommendations
            - Continuous health signal aggregation from CRM, portal, and communication records
          cadence: weekly health scan, monthly scorecard, quarterly program review
        - domain: Partner Dependency Tracking
          why: >
            52% of partner-involved deals experience at least one partner-caused delay. Without
            continuous dependency monitoring, slippage is discovered only when it cascades into
            the customer timeline, leaving the account team with limited recovery options.
          agent: partner-program-health-agent
          contributing_agents:
            - agent: partner-risk-agent
              provides: Risk classification for high-severity dependency failures
          owner: partner-program-health-agent
          receives: Partner deliverable commitments, project timelines, account plan dependencies
          provides: Dependency status reports, at-risk alerts, impact assessments, dashboard updates
          activities:
            - Continuous tracking of partner deliverables against committed timelines
            - At-risk flagging with quantified deal and timeline impact
            - Dependency status dashboards for account teams and delivery managers
            - Proactive alert generation before partner delays reach customer-facing impact
          cadence: continuous monitoring, daily status updates on at-risk items, triggered by milestone changes
        - domain: Risk Governance and Conflict Resolution
          why: >
            Channel conflict and partner-related risks surface only when they have already
            impacted customer timelines or sales team morale. Structured risk identification
            with severity classification gives the Partner Manager lead time to intervene.
          agent: partner-risk-agent
          contributing_agents:
            - agent: partner-program-health-agent
              provides: Engagement health trends and dependency status for risk context
            - agent: partner-cosell-agent
              provides: Deal registration data for conflict detection
          owner: partner-risk-agent
          receives: Engagement records, dependency tracking, deal registrations, territory data
          provides: Risk assessments, conflict reports, resolution recommendations
          activities:
            - Partner risk identification and severity classification (high/medium/low)
            - Channel conflict detection from deal registration and territory overlap signals
            - Resolution recommendation development with evidence and proposed next steps
            - Risk portfolio monitoring across all active partner engagements
          cadence: continuous risk monitoring, triggered by threshold breach, weekly portfolio scan
        - domain: Escalation Management and Issue Resolution
          why: >
            58% of partner escalations that reach VP level lack documented resolution history,
            extending time-to-resolution by 2-3x. Structured escalation packages with full
            incident context reduce leadership decision time and demonstrate program rigor.
          agent: partner-risk-agent
          contributing_agents:
            - agent: partner-program-health-agent
              provides: Engagement history and performance context for escalation brief
          owner: partner-risk-agent
          receives: Issue descriptions, incident history, prior resolution attempts, partner agreements
          provides: Issue resolution plans, escalation packages, resolution tracking reports
          activities:
            - Issue resolution planning with timeline, owners, and measurable success criteria
            - Escalation package assembly with incident history, impact assessment, and recommended actions
            - Resolution progress tracking against agreed timelines
            - Overdue escalation surfacing to Partner Manager before SLA breach
          cadence: per-issue as triggered, weekly tracking review on open escalations
