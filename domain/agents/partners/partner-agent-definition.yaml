          team: partners
          file: PB_PTR_001_partner_engagement_health.yaml
        - playbook: Partner Dependency Tracking (PB_PTR_002)
          scope: Dependency tracking between account delivery and partner activities
          team: partners
          file: PB_PTR_002_partner_dependency_tracking.yaml
        - playbook: Joint Account Planning (PB_PTR_003)
          scope: Joint planning sessions between vendor and partner for shared accounts
          team: partners
          file: PB_PTR_003_joint_account_planning.yaml
      accountable:
        - playbook: Partner Engagement Health (PB_PTR_001)
          scope: Partner Manager validates health scorecard accuracy and escalation triggers
          team: partners
        - playbook: Partner Dependency Tracking (PB_PTR_002)
          scope: Partner Manager approves dependency impact assessments and mitigation plans
          team: partners
        - playbook: Joint Account Planning (PB_PTR_003)
          scope: Partner Manager validates joint plan alignment and resource commitments
          team: partners
      consulted:
