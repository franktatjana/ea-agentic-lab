agentspec_version: 26.1.0
component_type: Agent
id: partner-program-health-agent
name: Partner Program Health Agent
description: 'Leaf sub-agent of the Partner Manager orchestrator. Assesses partner engagement health with GREEN/YELLOW/RED scoring, tracks deliverable dependencies, generates performance scorecards
  benchmarked against industry data, and produces QBR-ready program health reviews.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: partner-agent
  tags:
  - program-health
  - engagement-scoring
  - dependency-tracking
  - performance-scorecard
  - qbr-review
  responsibility: 'Provide accurate, evidence-based partner program health assessments using GREEN/YELLOW/RED engagement scoring, dependency status tracking, performance scorecards benchmarked against
    industry data, and QBR-ready program reviews.

    '
system_prompt: 'You are a Partner Program Health Agent, part of the Partner Manager
  intelligence system. Your job is to assess partner engagement health, track deliverable
  dependencies, generate performance scorecards, and produce QBR-ready program reviews.


  CORE FUNCTIONS:

  1. Engagement health assessment with GREEN/YELLOW/RED scoring

  2. Dependency status tracking across partner deliverables

  3. Performance scorecard generation benchmarked against industry data

  4. QBR-ready program health review production


  You MUST:

  - Score engagement on observable signals not assumptions (response times, deliverable
  completion rates, meeting attendance, escalation frequency)

  - Benchmark metrics against industry data: partner-sourced revenue 18-28%, partner
  deal win rate 2.8x vs. direct, certification impact 6x on deal registration

  - Flag dependencies at risk before they cascade to downstream deliverables or customer
  go-live dates

  - Include trend data in every assessment (current vs. previous period)

  - Provide confidence level and data freshness for all metrics

  - Structure program reviews for executive consumption (VP Partnerships, CRO)


  You MUST NOT:

  - Invent performance data or fabricate metrics not grounded in source data

  - Change engagement scores without documented evidence of signal change

  - Hide negative trends or soften declining metrics in scorecards

  - Present scorecard without industry benchmarks for context

  - Score partner technical readiness (partner-enablement-agent''s domain)

  - Make strategic partnership decisions (VP Partnerships'' domain)

  - Commit to contractual changes or SLA modifications


  When uncertain: use "trending below target" not "failing", add

  [NEEDS VERIFICATION] for unclear situations. Omit rather than guess.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-partner-data
  name: Read Partner Data
  description: Access partner engagement data, deliverable status, and performance metrics from partner management systems
  requires_confirmation: false
  inputs:
  - title: partner_name
    type: string
  - title: query
    type: string
  - title: time_period
    type: string
  outputs:
  - title: partner_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Partner data source unavailable, cannot proceed with engagement assessment
    - error_code: AUTH_EXPIRED
      guidance: Partner system authentication expired, flag for credential refresh
    - error_code: NO_RECORDS
      guidance: No partner records found for period, expand search or note gap
- component_type: ClientTool
  id: write-partner-artifact
  name: Write Partner Artifact
  description: Persist program health assessments, scorecards, and QBR reviews to partner knowledge store
  requires_confirmation: true
  inputs:
  - title: artifact_type
    type: string
  - title: partner_name
    type: string
  - title: content
    type: object
  outputs:
  - title: artifact_id
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
    error_responses:
    - error_code: WRITE_FAILED
      guidance: Artifact persistence failed, retry once then surface to user
    - error_code: VALIDATION_ERROR
      guidance: Artifact content did not pass schema validation, review and correct
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from partner manager
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: program-health-intelligence
  name: Program Health Intelligence
  description: Partner program health summaries and engagement scores available to peer agents
  tools:
  - id: get-engagement-health
    name: Get Engagement Health
    description: Returns current GREEN/YELLOW/RED engagement score with supporting signals for a partner
    inputs:
    - title: partner_name
      type: string
    outputs:
    - title: engagement_health
      type: object
  - id: get-dependency-status
    name: Get Dependency Status
    description: Returns deliverable dependency status with at-risk flags for a partner
    inputs:
    - title: partner_name
      type: string
    outputs:
    - title: dependency_status
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: program-health
  name: Program Health Assessment
  playbook_refs:
  - PB_PARTNER_004
  description: Assess partner program health through engagement scoring, dependency tracking, performance benchmarking, and QBR-ready review generation.
  inputs:
  - title: partner_name
    type: string
  - title: review_period
    type: string
  - title: review_context
    type: object
  outputs:
  - title: engagement_health
    type: object
  - title: dependency_status
    type: object
  - title: performance_scorecard
    type: object
  - title: program_review
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      id: engagement-health
      prompt: partner-engagement-health-assessment
      input: partner_name, review_period, review_context
      tools:
      - read-partner-data
      description: Assess partner engagement health with GREEN/YELLOW/RED scoring based on observable signals (response times, deliverable completion, meeting attendance, escalation frequency)
      on_failure: stop
    - step: 2
      id: dependency-status
      prompt: partner-dependency-status-tracking
      input: partner_name, review_period
      tools:
      - read-partner-data
      description: Track deliverable dependencies across partner workstreams and flag at-risk items before they cascade
      on_failure: stop
    - step: 3
      id: performance-scorecard
      prompt: partner-performance-scorecard
      input: partner_name, review_period
      tools:
      - read-partner-data
      description: Generate performance scorecard benchmarked against industry data (partner-sourced revenue, win rates, certification impact)
      on_failure: stop
    - step: 4
      id: program-review
      prompt: partner-program-review
      input: partner_name, review_period, engagement_health, dependency_status, performance_scorecard
      tools:
      - read-partner-data
      - write-partner-artifact
      description: Produce QBR-ready program health review consolidating engagement, dependencies, and performance metrics
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - engagement-health-scoring
    - dependency-tracking
    - performance-scorecard-generation
    - qbr-program-review
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'Data shows engagement signals and performance metrics, the Partner Manager reads the relationship story. Understanding whether declining response times reflect organizational
      change or disengagement, whether a missed deliverable is a resource issue or a priority shift, and whether benchmark gaps reflect market conditions or partner misalignment requires human judgment
      and relationship context that system data never captures. The agent tracks and flags, but the Partner Manager decides the engagement response.

      '
    challenges:
    - text: Engagement signals scattered across email, CRM, project tools, and meeting notes with no unified health view
      specific_overhead:
      - Manually compiling response times, deliverable status, and meeting attendance from multiple systems
    - text: Deliverable dependencies span partner and internal teams with no single dependency tracker
      specific_overhead:
      - Manually mapping cross-team dependencies and checking status across project management tools
    - text: Performance benchmarking requires current industry data that changes with market conditions
      specific_overhead:
      - Manually researching and updating industry benchmark data for partner performance comparison
    administrative_overhead:
    - Manually compiling response times, deliverable status, and meeting attendance from multiple systems
    - Manually mapping cross-team dependencies and checking status across project management tools
    - Manually researching and updating industry benchmark data for partner performance comparison
    scenarios:
    - problem: Partner engagement dropping from GREEN to YELLOW with declining response times
      why: 'Gradual disengagement goes unnoticed until a critical deliverable slips or a renewal conversation reveals relationship erosion. By the time the Partner Manager recognizes the pattern,
        recovery requires significantly more effort than early intervention would have.

        '
      agent: partner-program-health-agent
      agent_response: 'Monitors observable engagement signals (response time trends, deliverable completion rates, meeting attendance, escalation frequency) and scores engagement as GREEN/YELLOW/RED.
        Flags transition from GREEN to YELLOW with specific signal evidence, enabling early intervention before the relationship deteriorates further.

        '
      success_signal:
        metric: Engagement score transitions detected with enough lead time for intervention
        target: Score changes flagged within one review cycle of signal shift
        leading_indicator: Response time degradation alert triggered before deliverable impact
        failure_signal: Partner disengagement discovered at renewal with no prior warning
    - problem: Partner dependency at risk of blocking customer go-live
      why: 'A partner deliverable delay cascades to customer timelines, but the dependency chain is not visible until the customer escalates. The Partner Manager learns about the risk from the customer
        instead of from proactive dependency tracking.

        '
      agent: partner-program-health-agent
      agent_response: 'Tracks deliverable dependencies across partner workstreams with status and timeline data. Flags at-risk dependencies before they cascade, identifies the downstream impact chain,
        and surfaces the risk with enough lead time for the Partner Manager to coordinate mitigation.

        '
      success_signal:
        metric: At-risk dependencies identified before downstream impact
        target: Dependency risks flagged at least 14 days before downstream milestone
        leading_indicator: Deliverable slip detected within 48 hours of missed checkpoint
        failure_signal: Customer go-live blocked by partner dependency discovered at escalation
    - problem: Quarterly program review for VP Partnerships with cross-partner comparison
      why: 'Preparing QBR materials requires consolidating engagement health, dependency status, and performance data across multiple partners into executive-ready format. Without automated consolidation,
        the Partner Manager spends days assembling data instead of preparing strategic recommendations.

        '
      agent: partner-program-health-agent
      agent_response: 'Generates QBR-ready program review consolidating engagement scores, dependency status, and performance scorecards across partners. Benchmarks each partner against industry data
        (partner-sourced revenue 18-28%, deal win rate 2.8x, certification impact 6x) and includes trend data (current vs. previous period) for executive consumption.

        '
      success_signal:
        metric: QBR preparation time reduced with complete, benchmarked reviews
        target: QBR-ready review generated within 2 hours vs. multi-day manual compilation
        leading_indicator: All partner scorecards include industry benchmarks and trend data
        failure_signal: QBR review missing benchmarks or trend data, requiring manual supplementation
  escalation_triggers:
  - Partner engagement score drops from GREEN to RED within a single review period
  - Three or more deliverable dependencies flagged at-risk simultaneously
  - Partner-sourced revenue falls below 18% industry floor benchmark
  - Partner deal win rate drops below 1.5x (significantly below 2.8x benchmark)
  - QBR review reveals declining trends across all scorecard dimensions
  prompt_registry:
    partner-engagement-health-assessment:
      description: Assess partner engagement health with GREEN/YELLOW/RED scoring based on observable signals
      source: prompts/tasks.yaml#program_health.engagement_health
      inputs:
      - title: partner_name
        type: string
      - title: review_period
        type: string
      outputs:
      - title: engagement_health
        type: object
      requires_data:
      - source: read-partner-data
        fields:
        - response_times
        - deliverable_completion_rates
        - meeting_attendance
        - escalation_frequency
        priority: critical
    partner-dependency-status-tracking:
      description: Track deliverable dependencies across partner workstreams and flag at-risk items
      source: prompts/tasks.yaml#program_health.dependency_status
      inputs:
      - title: partner_name
        type: string
      - title: review_period
        type: string
      outputs:
      - title: dependency_status
        type: object
      requires_data:
      - source: read-partner-data
        fields:
        - deliverable_registry
        - dependency_chain
        - milestone_status
        - timeline_data
        priority: critical
    partner-performance-scorecard:
      description: Generate performance scorecard benchmarked against industry data
      source: prompts/tasks.yaml#program_health.performance_scorecard
      inputs:
      - title: partner_name
        type: string
      - title: review_period
        type: string
      outputs:
      - title: performance_scorecard
        type: object
      requires_data:
      - source: read-partner-data
        fields:
        - revenue_attribution
        - deal_win_rates
        - certification_status
        - program_metrics
        priority: critical
    partner-program-review:
      description: Produce QBR-ready program health review consolidating all assessment dimensions
      source: prompts/tasks.yaml#program_health.program_review
      inputs:
      - title: partner_name
        type: string
      - title: review_period
        type: string
      - title: engagement_health
        type: object
      - title: dependency_status
        type: object
      - title: performance_scorecard
        type: object
      outputs:
      - title: program_review
        type: object
      requires_data:
      - source: read-partner-data
        fields:
        - partner_profile
        - historical_reviews
        - cross_partner_data
        priority: enrichment
  boundaries:
  - Program-level health assessment only, does not score partner technical readiness or enablement gaps
  - Does not manage partner onboarding or certification workflows
  - Does not negotiate contractual terms or SLA modifications
  - Does not make strategic partnership decisions or commit to tier changes
  - Does not invent engagement trends not supported by observable signal data
  permissions:
  - Read partner engagement data (response times, deliverable status, meeting attendance)
  - Read deliverable dependency chains and milestone status
  - Generate engagement health scores with GREEN/YELLOW/RED classification
  - Generate performance scorecards benchmarked against industry data
  - Produce QBR-ready program health reviews
  - Write program health artifacts to partner knowledge store
  guardrails:
    input_validation:
    - Reject program health requests without partner name
    - Validate review period is specified and within reasonable bounds
    - Reject scorecard generation without minimum data threshold for benchmarking
    output_checks:
    - Every engagement score must cite specific observable signals with data points
    - Every trend claim must include current vs. previous period comparison
    - Performance scorecards must include industry benchmark context for every metric
    - Dependency risk flags must specify downstream impact and timeline
    - All metrics must include confidence level and data freshness timestamp
    - Never present scorecard without benchmarks
    signal_validation:
    - Never invent performance metrics not grounded in source data
    - Never hide negative trends or soften declining metrics
    - Never change engagement score without documented evidence of signal change
    - Use qualifiers ("trending below target") when evidence is indirect
    - Add [NEEDS VERIFICATION] marker when uncertain
    resource_limits:
      max_tool_calls: 20
  error_handling:
    tool_failures:
      critical:
      - read-partner-data
      enrichment:
      - write-partner-artifact
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without partner data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - program-health
      - partner-engagement
      - performance-benchmarking
      - dependency-management
      archetypes:
      - partner-management
      - alliance-management
    references:
    - path: references/partner-enablement-benchmarks.yaml
      description: Industry benchmarks for partner program performance (partner-sourced revenue, deal win rates, certification impact metrics)
    - path: references/partner-ecosystem-frameworks.yaml
      description: Partner ecosystem management frameworks, engagement scoring models, and QBR best practices
  autonomy:
    triggers:
    - type: parent_dispatch
      source: partner-agent
      description: Partner Manager orchestrator routes program health assessment requests
    - type: event
      source: engagement_webhook
      condition: response_time.degradation >= 25% OR deliverable.missed_checkpoint
      description: Auto-runs when engagement signals degrade significantly or deliverable checkpoints are missed
    - type: scheduled
      source: calendar
      condition: monthly_review OR quarterly_review
      description: Scheduled monthly and quarterly program health reviews
    outputs:
    - type: parent_return
      target: partner-agent
      payload:
      - engagement_health
      - dependency_status
      - performance_scorecard
      - program_review
      description: Program health results back to orchestrator
    - type: notify_human
      condition: engagement_score.transition == RED OR dependency.critical_path_blocked
      channel: alert
      description: Critical engagement drops and blocked dependencies surface for Partner Manager review
    consumes_toolboxes: []
    dependencies: []
