# Partner Manager Agent Configuration
# Purpose: Orchestrate partner ecosystem management across enablement, co-sell, program health, and risk
# Sub-agents: partner-enablement, partner-cosell, partner-program-health, partner-risk

agent_id: "partner_agent"
team: "partners"
category: "sales"
purpose: "Orchestrate partner ecosystem management through 4 specialized sub-agents"

core_functions:
  - "Route partner requests to correct sub-agent"
  - "Aggregate cross-domain partner assessments"
  - "Partner enablement: onboarding, certification, training, maturity"
  - "Co-sell execution: pipeline overlap, deal registration, JBP, joint positioning"
  - "Program health: engagement scoring, dependency tracking, scorecards, QBR"
  - "Risk governance: risk classification, issue resolution, escalation, channel conflict"

mechanics:
  - "Parse request for domain signals and route to sub-agent"
  - "Aggregate parallel sub-agent outputs for cross-domain views"
  - "Monitor partner data sources for proactive alerting"

inputs:
  - "Partner profiles and engagement records"
  - "CRM opportunity data and deal registrations"
  - "Certification databases and training records"
  - "Account plans and communication threads"
  - "Partner deliverables and dependency tracking"

outputs:
  - "Enablement reports (onboarding, certification, maturity)"
  - "Co-sell briefs (opportunity reports, JBPs, positioning)"
  - "Health reports (engagement scores, scorecards, QBR packages)"
  - "Risk assessments (risk reports, escalation packages, conflict analysis)"

escalation_to: "Partner Manager"

sub_agents:
  - id: "partner-enablement-agent"
    name: "Partner Enablement"
    skill: "SK_PTR_001"
  - id: "partner-cosell-agent"
    name: "Partner Co-sell"
    skill: "SK_PTR_002"
  - id: "partner-program-health-agent"
    name: "Partner Program Health"
    skill: "SK_PTR_003"
  - id: "partner-risk-agent"
    name: "Partner Risk"
    skill: "SK_PTR_004"

playbooks:
  owned:
    - id: "PB_PTR_001"
      name: "Partner Engagement Health"
      path: "domain/playbooks/partners/PB_PTR_001_partner_engagement_health.yaml"
      description: "Periodic assessment of partner engagement health with GREEN/YELLOW/RED scorecard"
    - id: "PB_PTR_002"
      name: "Partner Dependency Tracking"
      path: "domain/playbooks/partners/PB_PTR_002_partner_dependency_tracking.yaml"
      description: "Tracks dependencies between account delivery and partner activities"
    - id: "PB_PTR_003"
      name: "Joint Account Planning"
      path: "domain/playbooks/partners/PB_PTR_003_joint_account_planning.yaml"
      description: "Structures joint planning sessions between vendor and partner"
  contributes_to:
    - id: "PB_AE_002"
      name: "Account Planning"
      role: "secondary_agent"
      description: "Provides partner context and alignment status"
    - id: "PB_AE_004"
      name: "Deal Progression"
      role: "secondary_agent"
      description: "Provides partner involvement and co-sell support"
    - id: "PB_DEL_001"
      name: "Implementation Kickoff"
      role: "secondary_agent"
      description: "Provides partner readiness and dependency context"
    - id: "PB_HAM_001"
      name: "Hyperscaler Co-sell"
      role: "secondary_agent"
      description: "Provides partner CPPO eligibility and co-sell alignment"

skills:
  owned:
    - "SK_PTR_001"
    - "SK_PTR_002"
    - "SK_PTR_003"
    - "SK_PTR_004"

execution:
  trigger_sources:
    - "partner_deliverable_updated"
    - "certification_approaching_expiry"
    - "deal_registration_submitted"
    - "joint_meeting_scheduled"
    - "partner_risk_detected"
    - "pipeline_data_refreshed"
  output_destination: "{realm}/{node}/internal-infohub/partners/"
  escalation_threshold: "partner_misalignment_detected"

personality_file: "teams/partners/personalities/partner_personality.yaml"
prompts_dir: "teams/partners/prompts"
