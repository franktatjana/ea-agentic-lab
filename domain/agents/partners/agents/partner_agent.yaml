# Partner Agent Configuration
# Purpose: Maintain partner alignment & dependency visibility

agent_id: "partner_agent"
team: "partners"
category: "sales"
purpose: "Maintain partner alignment & dependency visibility"

core_functions:
  - "Tracks partner activities"
  - "Flags partner-related risks"
  - "Links partner work to account plan"

mechanics:
  - "Scans joint threads/documents"
  - "Compares partner plans vs. account plan"
  - "Updates partner section automatically"

inputs:
  - "Account plan partner section"
  - "Joint communication threads"
  - "Partner deliverables"

outputs:
  - "Alignment note"
  - "Partner risk alerts"
  - "Dependency tracking"

escalation_to: "Partner Manager"

playbooks:
  owned:
    - id: "PB_PTR_001"
      name: "Partner Engagement Health"
      path: "domain/playbooks/partners/PB_PTR_001_partner_engagement_health.yaml"
      description: "Periodic assessment of partner engagement health with GREEN/YELLOW/RED scorecard"
    - id: "PB_PTR_002"
      name: "Partner Dependency Tracking"
      path: "domain/playbooks/partners/PB_PTR_002_partner_dependency_tracking.yaml"
      description: "Tracks dependencies between account delivery and partner activities, flags at-risk items"
    - id: "PB_PTR_003"
      name: "Joint Account Planning"
      path: "domain/playbooks/partners/PB_PTR_003_joint_account_planning.yaml"
      description: "Structures joint planning sessions between vendor and partner for shared accounts"
  contributes_to:
    - id: "PB_AE_002"
      name: "Account Planning"
      role: "secondary_agent"
      description: "Provides partner context and alignment status for account planning"
    - id: "PB_DEL_001"
      name: "Implementation Kickoff"
      role: "secondary_agent"
      description: "Provides partner readiness and dependency context for delivery kickoff"

skills:
  owned: []

execution:
  trigger_sources:
    - "partner_deliverable_updated"
    - "joint_meeting_scheduled"
    - "partner_risk_detected"
  output_destination: "{realm}/{node}/internal-infohub/partners/"
  escalation_threshold: "partner_misalignment_detected"

personality_file: "teams/partners/personalities/partner_personality.yaml"
prompts_dir: "teams/partners/prompts"
