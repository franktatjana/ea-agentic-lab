# Partner Ecosystem Frameworks - Domain Knowledge
# Referenced by: partner agent definitions requiring maturity assessment, JBP planning, channel governance
# Sources: Knack Collective, Crossbeam, WorkSpan, AchieveUnite, Introw, ITONICS
# Last verified: 2026-03

maturity_models:

  knack_collective_three_phase:
    full_name: "Knack Collective Three-Phase Partner Maturity Model"
    source_url: "https://knackcollective.com/partner-maturity-model/"
    phases:
      - name: "Phase 1: Building Framework"
        focus: "Establish foundational partner program infrastructure"
        characteristics:
          - "Defining ideal partner profile and recruitment criteria"
          - "Creating initial partner onboarding and enablement processes"
          - "Setting up basic tracking and reporting mechanisms"
          - "Establishing partner communication cadence"
      - name: "Phase 2: Scaling for Growth"
        focus: "Systematize and expand partner operations"
        characteristics:
          - "Automating partner onboarding and certification workflows"
          - "Implementing tiered partner program with clear advancement criteria"
          - "Building co-marketing and co-selling playbooks"
          - "Developing partner success metrics and scorecards"
      - name: "Phase 3: Harnessing Ecosystem Power"
        focus: "Leverage partner network as strategic growth multiplier"
        characteristics:
          - "Orchestrating multi-partner solutions for complex customer needs"
          - "Running ecosystem-level demand generation campaigns"
          - "Driving partner-to-partner referrals and collaboration"
          - "Measuring ecosystem-wide impact on customer lifetime value"
    assessment_dimensions:
      - dimension: "Strategy & Planning"
        description: "Clarity of partner strategy, alignment to corporate goals, executive sponsorship"
      - dimension: "Partner Recruitment & Onboarding"
        description: "Ideal partner profile definition, recruitment pipeline, time-to-first-deal"
      - dimension: "Enablement & Training"
        description: "Certification programs, sales enablement content, technical training depth"
      - dimension: "Co-sell & Go-to-Market"
        description: "Joint selling motions, pipeline sharing, co-marketing execution"
      - dimension: "Technology & Operations"
        description: "PRM tooling, automation maturity, data integration across systems"
      - dimension: "Measurement & Optimization"
        description: "KPI tracking, partner scorecards, program ROI analysis, continuous improvement"

  crossbeam_partner_success:
    full_name: "Crossbeam Partner Success Maturity Model"
    source_url: "https://www.crossbeam.com/resources/partner-maturity-model/"
    stages:
      - name: "Stage 1: Discovery"
        description: "Identifying potential partners and understanding overlap"
        activities:
          - "Account mapping to find customer and prospect overlap"
          - "Identifying high-potential partner candidates based on ICP alignment"
          - "Running initial co-sell experiments with 1-2 partners"
      - name: "Stage 2: Building"
        description: "Formalizing partnerships and creating repeatable processes"
        activities:
          - "Drafting partner agreements with defined co-sell terms"
          - "Building shared account lists and territory plans"
          - "Establishing regular partner sync cadence"
      - name: "Stage 3: Managing"
        description: "Operating partner programs at scale with dedicated resources"
        activities:
          - "Assigning partner managers to top-tier partners"
          - "Implementing PRM system for pipeline tracking"
          - "Running joint QBRs with strategic partners"
      - name: "Stage 4: Measuring"
        description: "Quantifying partner impact and optimizing resource allocation"
        activities:
          - "Tracking partner-sourced vs partner-influenced revenue"
          - "Measuring partner engagement scores and health metrics"
          - "Attributing marketing ROI to partner co-marketing activities"
      - name: "Stage 5: Optimizing"
        description: "Continuously improving partner ecosystem for maximum leverage"
        activities:
          - "Predictive analytics for partner success likelihood"
          - "Automated partner tiering based on performance data"
          - "Ecosystem orchestration across partner-to-partner motions"

  workspan_ecosystem_maturity:
    full_name: "WorkSpan Ecosystem Maturity Model"
    source_url: "https://www.workspan.com/resources/ecosystem-maturity-model/"
    stages:
      - name: "Early"
        description: "Ad hoc partner engagement, reactive co-sell"
        indicators:
          - "Fewer than 5 active co-sell partners"
          - "Partner-sourced revenue below 10% of total"
          - "No dedicated partner operations team"
          - "Manual tracking via spreadsheets and email"
      - name: "Growth"
        description: "Structured partner program with repeatable motions"
        indicators:
          - "5-20 active co-sell partners"
          - "Partner-sourced revenue between 10-20% of total"
          - "Dedicated partner team with defined roles"
          - "PRM system deployed, basic automation in place"
      - name: "Mature"
        description: "Ecosystem-driven growth as core business strategy"
        indicators:
          - "20+ active co-sell partners across multiple categories"
          - "Partner-sourced revenue above 20% of total"
          - "Ecosystem operations fully integrated with sales and marketing"
          - "Real-time partner analytics and automated workflows"

joint_business_planning:

  achieveunite_jbp_methodology:
    full_name: "AchieveUnite Joint Business Planning Methodology"
    source_url: "https://www.achieveunite.com/insights/joint-business-planning/"
    purpose: "Structured process for vendor and partner to align on shared goals, activities, and metrics over a defined period"
    components:
      mutual_objectives:
        description: "Jointly defined goals that serve both vendor and partner interests"
        examples:
          - "Revenue targets: partner-sourced and partner-influenced"
          - "Customer acquisition: net-new logos via partner motion"
          - "Market expansion: entry into new verticals or geographies"
          - "Solution adoption: joint solution attach rate targets"
      activity_plans:
        description: "Specific actions with assigned owners and deadlines"
        categories:
          - category: "Sales Activities"
            examples:
              - "Joint pipeline reviews (weekly/biweekly)"
              - "Co-sell opportunity identification sessions"
              - "Executive-to-executive introductions"
          - category: "Marketing Activities"
            examples:
              - "Co-branded content development"
              - "Joint webinars and events"
              - "Partner inclusion in demand generation campaigns"
          - category: "Technical Activities"
            examples:
              - "Integration development and testing"
              - "Joint solution architecture workshops"
              - "Technical certification for partner sales engineers"
          - category: "Enablement Activities"
            examples:
              - "Sales team training on partner solution"
              - "Partner certification on vendor platform"
              - "Joint battlecard and competitive positioning development"
      shared_metrics:
        description: "KPIs both parties track and review together"
        metrics:
          - "Partner-sourced pipeline value and velocity"
          - "Co-sell win rate vs. solo sell win rate"
          - "Joint solution attach rate"
          - "Partner certification completion rate"
          - "Co-marketing campaign conversion rates"
          - "Customer satisfaction scores on joint deployments"
      review_cadence:
        description: "Regular checkpoints to assess progress and adjust plans"
        schedule:
          - frequency: "Weekly"
            focus: "Pipeline review, opportunity updates, blockers"
          - frequency: "Monthly"
            focus: "Activity plan progress, metric review, resource adjustments"
          - frequency: "Quarterly"
            focus: "Strategic review, goal recalibration, executive alignment"
          - frequency: "Annually"
            focus: "Full JBP refresh, next-year planning, relationship assessment"

channel_management:

  introw_best_practices:
    full_name: "Introw Channel Management Best Practices"
    source_url: "https://www.introw.io/blog/channel-partner-management-best-practices"
    strategies:
      - strategy: "Define Clear Partner Selection Criteria"
        description: "Establish ideal partner profile based on market coverage, technical capability, customer base overlap, and cultural fit"
      - strategy: "Segment Partners by Strategic Value"
        description: "Tier partners (strategic, growth, transactional) and allocate resources proportionally to potential impact"
      - strategy: "Invest in Structured Onboarding"
        description: "Standardized 30-60-90 day onboarding program with milestones, training modules, and certification checkpoints"
      - strategy: "Provide Continuous Enablement"
        description: "Regular training updates, new product briefings, competitive intelligence sharing, and sales tool access"
      - strategy: "Establish Transparent Communication"
        description: "Consistent cadence of partner newsletters, advisory boards, slack channels, and escalation paths"
      - strategy: "Implement Deal Registration"
        description: "Clear deal registration process with defined SLAs, conflict resolution rules, and margin protection"
      - strategy: "Co-invest in Demand Generation"
        description: "Shared MDF budgets, co-branded campaigns, joint events, and lead sharing programs"
      - strategy: "Track Partner Performance Rigorously"
        description: "Partner scorecards with revenue, pipeline, certification, and customer satisfaction metrics reviewed quarterly"
      - strategy: "Leverage Technology for Scale"
        description: "PRM platforms, partner portals, automated lead distribution, and integrated CRM/PRM data flows"
      - strategy: "Recognize and Reward Top Partners"
        description: "Partner awards, tiered benefits, executive access, and preferential deal support for high performers"

partner_governance:

  itonics_raci_framework:
    full_name: "ITONICS Partner Governance RACI Framework"
    source_url: "https://www.itonics-innovation.com/blog/raci-matrix"
    purpose: "Clarify decision rights and accountability across vendor-partner activities"
    raci_roles:
      responsible: "Does the work, executes the activity"
      accountable: "Owns the outcome, has final decision authority (one per activity)"
      consulted: "Provides input before decision or action (two-way communication)"
      informed: "Kept updated on progress or outcome (one-way communication)"
    typical_governance_areas:
      - area: "Deal Registration & Approval"
        vendor: "Accountable"
        partner: "Responsible"
        notes: "Partner submits, vendor approves within SLA"
      - area: "Pricing & Discounting"
        vendor: "Accountable"
        partner: "Consulted"
        notes: "Vendor sets pricing framework, partner provides market input"
      - area: "Customer Success & Support"
        vendor: "Consulted"
        partner: "Responsible"
        notes: "Partner delivers first-line support, vendor provides escalation path"
      - area: "Co-marketing Campaigns"
        vendor: "Consulted"
        partner: "Responsible"
        notes: "Shared responsibility, vendor provides brand guidelines and co-funding"
      - area: "Product Roadmap Input"
        vendor: "Accountable"
        partner: "Consulted"
        notes: "Partner provides field feedback, vendor owns product decisions"
      - area: "Compliance & Certification"
        vendor: "Accountable"
        partner: "Responsible"
        notes: "Vendor defines requirements, partner maintains certifications"
