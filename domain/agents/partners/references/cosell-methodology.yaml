# Co-sell Methodology - Domain Knowledge
# Referenced by: partner agent definitions requiring co-sell execution, deal registration, account mapping
# Sources: Crossbeam, PartnerStack, Reveal, WorkSpan
# Last verified: 2026-03

cosell_frameworks:

  crossbeam_source_decide_execute:
    full_name: "Crossbeam Source-Decide-Execute Framework"
    source_url: "https://www.crossbeam.com/resources/co-selling-guide/"
    purpose: "Structured methodology for identifying, qualifying, and executing co-sell opportunities with ecosystem partners"
    phases:
      - phase: "Source"
        description: "Identify co-sell opportunities through data-driven account mapping and overlap analysis"
        activities:
          - "Run account mapping to identify customer and prospect overlap between partners"
          - "Segment overlapping accounts by revenue potential, stage, and fit"
          - "Identify greenfield accounts where partner has relationship but vendor does not"
          - "Flag at-risk accounts where partner intel can support retention"
          - "Prioritize opportunities based on deal size, close probability, and partner influence"
        tools:
          - "Crossbeam or Reveal for secure account mapping"
          - "CRM integration for real-time overlap visibility"
          - "Enrichment platforms for firmographic and technographic context"
      - phase: "Decide"
        description: "Qualify and triage co-sell opportunities against readiness criteria"
        decision_criteria:
          - "Partner has active relationship with target account decision-maker"
          - "Combined solution addresses a validated customer pain point"
          - "Deal size justifies joint resource investment"
          - "Partner sales team has capacity and motivation to engage"
          - "No channel conflict with existing direct sales engagement"
        qualification_gates:
          - "Both parties agree on customer need and joint value proposition"
          - "Named account owner and partner contact identified on both sides"
          - "Co-sell engagement plan drafted with clear roles"
      - phase: "Execute"
        description: "Run the co-sell motion with coordinated engagement and tracking"
        activities:
          - "Joint discovery call with customer to validate need and present combined solution"
          - "Coordinated proposal with clear vendor and partner responsibilities"
          - "Shared pipeline tracking in both CRM systems with synced status"
          - "Regular co-sell standup calls to coordinate next steps"
          - "Joint close plan with aligned timelines and decision-maker access"
          - "Post-close handoff to implementation and customer success teams"

cosell_process:

  end_to_end_cosell:
    full_name: "End-to-End Co-sell Process"
    source_url: "https://www.crossbeam.com/blog/co-selling/"
    stages:
      - stage: "Account Mapping"
        description: "Securely share and compare account lists to find overlap"
        inputs:
          - "CRM account data (customer list, prospect list, opportunity pipeline)"
          - "Partner's CRM data shared via ecosystem platform (Crossbeam, Reveal)"
        outputs:
          - "Overlap report: shared customers, shared prospects, greenfield accounts"
          - "Prioritized target list ranked by co-sell potential"
        best_practices:
          - "Map at minimum quarterly, monthly for strategic partners"
          - "Include both closed-won customers and active pipeline"
          - "Filter by ICP criteria before sharing to reduce noise"
      - stage: "Opportunity Identification"
        description: "Select high-value co-sell targets from overlap data"
        criteria:
          - "Partner has executive-level relationship in target account"
          - "Customer has expressed need that joint solution addresses"
          - "Deal is in early-to-mid stage where partner intro adds value"
          - "No existing channel conflict or competing engagement"
        output: "Qualified co-sell opportunity list with partner engagement request"
      - stage: "Joint Engagement"
        description: "Coordinate sales activities across vendor and partner teams"
        activities:
          - "Warm introduction from partner contact to customer stakeholder"
          - "Joint discovery session to map customer requirements to combined solution"
          - "Co-developed business case showing integrated value"
          - "Coordinated demo or proof-of-concept with both solutions"
          - "Joint executive sponsorship for strategic deals"
      - stage: "Tracking"
        description: "Maintain synchronized pipeline visibility across both organizations"
        requirements:
          - "Opportunity registered in both vendor and partner CRM"
          - "Shared status updates via partner portal or co-sell platform"
          - "Defined escalation path for stalled or at-risk deals"
          - "Attribution model agreed upon before deal progresses past qualification"
      - stage: "Close"
        description: "Coordinate final negotiation, contracting, and handoff"
        activities:
          - "Aligned pricing and packaging between vendor and partner components"
          - "Coordinated contract execution (single or dual contracts)"
          - "Joint customer success handoff with shared onboarding plan"
          - "Revenue attribution recorded per agreed model"
          - "Win/loss retrospective to improve future co-sell motions"

deal_registration:

  best_practices:
    source_url: "https://www.workspan.com/resources/deal-registration-best-practices/"
    registration_timing:
      description: "When and how partners should register deals to protect margins and ensure attribution"
      guidelines:
        - "Register at first qualified engagement, not at proposal stage"
        - "Registration window: typically 90-180 days with renewal option"
        - "Early registration correlates with higher win rates (partner investment signal)"
        - "Expired registrations can be re-submitted with updated justification"
    attribution_models:
      - model: "Partner-Sourced"
        definition: "Partner identified the opportunity and made the initial customer introduction"
        typical_compensation: "Highest margin tier, full co-sell incentive eligibility"
      - model: "Partner-Influenced"
        definition: "Vendor sourced the deal but partner contributed to advancement or close"
        typical_compensation: "Reduced margin, partial incentive eligibility"
      - model: "Partner-Assisted"
        definition: "Partner provided technical or delivery support but did not source or influence"
        typical_compensation: "Standard margin, implementation revenue only"
    conflict_resolution:
      description: "Rules for handling overlapping registrations or channel conflicts"
      principles:
        - "First-to-register with qualified engagement gets priority"
        - "Direct sales override requires VP-level approval and partner notification"
        - "Multi-partner deals use split registration with pre-agreed attribution"
        - "Disputes escalated to partner operations team with 5-business-day SLA"
        - "Transparent audit trail maintained in PRM system"

cosell_agreements:

  agreement_components:
    source_url: "https://www.partnerstack.com/resources/co-sell-agreements/"
    purpose: "Formalize co-sell terms between vendor and partner before active engagement"
    sections:
      - component: "Roles & Responsibilities"
        content:
          - "Which party leads customer engagement at each stage"
          - "Technical resource commitments (SE, SA, CSM) from each side"
          - "Marketing and demand generation responsibilities"
          - "Customer support and escalation ownership post-sale"
      - component: "Lead Sharing Rules"
        content:
          - "Lead qualification criteria before sharing"
          - "Response SLA after lead is shared (typically 48-72 hours)"
          - "Lead acceptance and rejection process with reason codes"
          - "Bi-directional lead flow expectations and volume commitments"
      - component: "Commission & Revenue Splits"
        content:
          - "Revenue split model: percentage-based, fixed fee, or tiered"
          - "Payment timing: upon booking, upon cash collection, or milestone-based"
          - "Margin protection for registered deals"
          - "Incentive bonuses for exceeding joint targets"
      - component: "Customer Ownership"
        content:
          - "Primary customer relationship owner defined per deal"
          - "Renewal and expansion rights and responsibilities"
          - "Data sharing boundaries (what customer data each party can access)"
          - "Non-compete and non-solicitation clauses for shared accounts"
      - component: "Term & Termination"
        content:
          - "Agreement duration (typically 12 months with auto-renewal)"
          - "Termination notice period (typically 30-90 days)"
          - "Treatment of in-flight deals upon termination"
          - "Surviving obligations (customer support, data handling)"

pipeline_overlap_analysis:

  methodology:
    source_url: "https://www.crossbeam.com/blog/account-mapping/"
    purpose: "Systematic approach to analyzing pipeline overlap between vendor and partner to maximize co-sell yield"
    steps:
      - step: "Data Preparation"
        activities:
          - "Export CRM data: accounts, opportunities, stages, close dates, deal values"
          - "Normalize company names and domains for accurate matching"
          - "Define sharing rules (which fields to expose, which to keep private)"
      - step: "Overlap Mapping"
        activities:
          - "Run bidirectional account match across customer and prospect lists"
          - "Categorize matches: mutual customers, vendor-customer/partner-prospect, partner-customer/vendor-prospect, mutual prospects"
          - "Quantify overlap by deal value, stage, and segment"
      - step: "Opportunity Scoring"
        activities:
          - "Score each overlap by co-sell potential: deal size x partner influence x stage alignment"
          - "Flag high-priority opportunities where partner has active relationship and deal is in early stage"
          - "Identify churn risk accounts where partner intel can support retention"
      - step: "Action Planning"
        activities:
          - "Create prioritized co-sell target list (top 10-25 accounts per partner)"
          - "Assign account owners and partner contacts for each target"
          - "Schedule joint pipeline review to validate and activate targets"
      - step: "Ongoing Refresh"
        activities:
          - "Re-run overlap analysis monthly for strategic partners, quarterly for others"
          - "Track conversion rates from overlap identification to co-sell engagement"
          - "Measure co-sell pipeline velocity vs solo pipeline velocity"
    key_metrics:
      - "Overlap percentage: accounts in common as percentage of total accounts"
      - "Activation rate: overlapping accounts with active co-sell engagement"
      - "Conversion rate: co-sell engaged accounts that progress to qualified pipeline"
      - "Influence rate: closed deals where partner contributed to outcome"
