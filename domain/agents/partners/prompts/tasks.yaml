    prompt: |
      Context: Sync with {partner_name} regarding {account_name}.
      Open items: {open_items}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are preparing a structured sync meeting with a partner. The output
      ensures the meeting has clear agenda items, decisions are identified in
      advance, and action items are tracked. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
