  issue_resolution:
    name: "Partner Issue Resolution"
    description: "Plan resolution for a specific partner issue with root cause analysis, resolution options with pros and cons, and an owned action plan"
    prompt: |
      Context: Issue with {partner_name}: {issue_description}
      Impact: {current_impact}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are planning resolution for a specific partner issue. The output drives
      the resolution process with clear options, ownership, and timeline. Every
      assessment must be evidence-based. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map, for each scoring dimension assess data richness:
      - HIGH: documented issue history, impact metrics, 5+ data points
      - MEDIUM: partial records, 2-4 data points
      - LOW: no records, reported verbally only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Issue Description Clarity, Impact Quantification,
      Root Cause Visibility, Resolution History, Stakeholder Alignment.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode
      declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at issue understanding gaps)
      - Data sources to request access to (incident logs, communication records, impact reports)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: ISSUE SUMMARY
      Document the issue with precision.
      If {issue_description} is empty: state that no issue description is
      provided, note the implication (cannot analyze root cause), proceed
      without fabrication.
      - What is happening (observable symptoms)
      - When it started or was first noticed
      - Who is affected (internal teams, customer, partner)
      - Current scope (single account, multiple accounts, systemic)
      - Severity classification: CRITICAL / HIGH / MEDIUM / LOW,
        confidence: HIGH/MEDIUM/LOW with basis
      Deliverable: Issue Summary (Symptom | Start Date | Affected Parties |
      Scope | Severity | Confidence).

      STEP 2: ROOT CAUSE ANALYSIS
      Identify the root cause of the issue.
      If insufficient data to determine root cause: state what is missing, note
      the implication, and list hypotheses ranked by probability.
      For each potential root cause:
      - Description
      - Evidence supporting this as root cause
      - Evidence against
      - Probability: HIGH/MEDIUM/LOW, confidence: HIGH/MEDIUM/LOW with basis
      - Whether this is a recurring pattern
      Assign one primary root cause for routing. Add secondary flags where
      multiple causes contribute.
      Deliverable: Root Cause table (Cause | Supporting Evidence | Counter Evidence |
      Probability | Confidence | Recurring YES/NO | Primary/Secondary).

      STEP 3: RESOLUTION OPTIONS
      Present resolution options with analysis.
      For each option:
      - Option description
      - Pros (specific benefits)
      - Cons (specific drawbacks or risks)
      - Timeline to implement
      - Resource requirements
      - Success probability: HIGH/MEDIUM/LOW, confidence: HIGH/MEDIUM/LOW with basis
      - Dependencies or prerequisites
      Deliverable: Resolution Options table (Option | Pros | Cons | Timeline |
      Resources | Success Probability | Confidence | Prerequisites).

      STEP 4: RECOMMENDED APPROACH
      State the recommended resolution approach with justification.
      - Which option is recommended and why
      - What conditions would change this recommendation
      - Fallback if recommended approach fails
      Deliverable: Recommendation (Approach | Justification | Change Conditions |
