      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: AGENDA ITEMS
      Structure the sync agenda by priority.
      If {open_items} is empty: state that no open items are documented, note the
      implication (sync may lack focus), proceed without fabrication.
      For each agenda item:
      - Topic
      - Type: DECISION / UPDATE / DISCUSSION / ESCALATION
      - Priority: HIGH/MEDIUM/LOW
      - Time allocation (minutes)
      - Lead (who drives this topic)
      - Expected outcome
      Deliverable: Agenda table (Topic | Type | Priority | Time | Lead |
      Expected Outcome).

      STEP 2: DECISIONS NEEDED
      List decisions that should be made during the sync.
      For each decision:
      - Decision description
      - Options available (if known)
      - Recommended option, confidence: HIGH/MEDIUM/LOW with basis
      - Decision maker (who has authority)
      - Deadline (what happens if not decided in this sync)
      Deliverable: Decisions table (Decision | Options | Recommendation |
      Confidence | Decision Maker | Deadline).

      STEP 3: UPDATES TO SHARE
      Prepare updates from our side to share with the partner.
      For each update:
