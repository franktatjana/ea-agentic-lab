# Partner Agent Task Prompts
# Purpose: Full runbook prompts with numbered steps, named deliverables, and quality checks
# Reference: Personality defined in personalities/partner_personality.yaml
# Standard: docs/architecture/playbooks/runbook-design-principles.md

# ============================================================================
# PARTNER HEALTH PROMPTS
# ============================================================================
partner_health:

  engagement_health:
    name: "Partner Engagement Health Check"
    description: "Assess health of partner engagement in account across commitment delivery, communication quality, and alignment to produce a scored health status with action plan"
    prompt: |
      Context: Partner {partner_name} engaged with {account_name}.
      Engagement type: {engagement_type}
      Duration: {engagement_duration}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are assessing whether this partner engagement is healthy, at risk, or
      in trouble. The output drives escalation decisions and account team actions.
      Every assessment must be evidence-based. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map, for each scoring dimension assess data richness:
      - HIGH: documented evidence, meeting notes, 5+ data points
      - MEDIUM: partial evidence, 2-4 data points
      - LOW: no direct evidence, anecdotal only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Commitment Delivery, Communication Quality, Strategic
      Alignment, Risk Indicators, Engagement Trajectory.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode
      declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at highest-leverage data gaps)
      - Data sources to request access to (partner status reports, meeting cadence logs)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: COMMITMENT SCORECARD
      For each commitment made by the partner, assess delivery status.
      If {engagement_type} or commitment data is empty: state that no commitments
      are documented, note the implication (cannot assess delivery performance),
      proceed without fabrication.
      For each commitment:
      - Commitment description
      - Agreed deadline
      - Actual delivery date or current status
      - Variance (on time, delayed by N days, not started)
      - Impact of delay (if applicable)
      Deliverable: Commitment table (Commitment | Agreed Date | Actual/Status |
      Variance | Delay Impact) with delivery rate percentage.

      STEP 2: COMMUNICATION ASSESSMENT
      Evaluate communication quality between partner and account team.
      If communication records are empty: state that no communication history is
      available, note the implication (cannot assess responsiveness), proceed
      without fabrication.
      For each dimension:
      - Responsiveness (typical response time, escalation response time)
      - Proactiveness (does partner raise issues before they become problems)
      - Transparency (does partner share risks and challenges openly)
      - Cadence adherence (are regular syncs happening as scheduled)
      Each dimension: score 1-5, confidence (HIGH/MEDIUM/LOW), evidence basis.
      Deliverable: Communication table (Dimension | Score 1-5 | Confidence |
      Evidence) with overall communication score.

      STEP 3: ALIGNMENT ASSESSMENT
      Evaluate strategic alignment between partner activities and account objectives.
      Assign one primary classification for routing. Add secondary flags where the
      signal spans multiple dimensions.
      Alignment dimensions:
      - Goal alignment (partner actions support account strategy)
      - Technical alignment (partner approach compatible with architecture direction)
      - Timeline alignment (partner timeline matches deal/project milestones)
      - Resource alignment (partner staffing adequate for scope)
      Each dimension: classification ALIGNED/PARTIALLY ALIGNED/MISALIGNED (primary),
      confidence (HIGH/MEDIUM/LOW), evidence basis. Add secondary flags if a
      dimension shows mixed signals.
      Deliverable: Alignment table (Dimension | Primary Classification | Secondary
      Flags | Confidence | Evidence) with overall alignment status.

      STEP 4: HEALTH STATUS DETERMINATION
      Synthesize Steps 1-3 into an overall engagement health status.
      Assign one primary classification for routing. Add secondary flags where the
      signal spans multiple dimensions.
      - GREEN: commitments on track, communication strong, aligned. Confidence: HIGH/MEDIUM/LOW with basis.
      - YELLOW: minor gaps in commitments or communication, partial alignment. Confidence: HIGH/MEDIUM/LOW with basis.
      - RED: significant delivery failures, communication breakdown, or misalignment. Confidence: HIGH/MEDIUM/LOW with basis.
      State the weakest dimension driving the health score.
      Deliverable: Health Status (Status | Confidence | Basis | Weakest Dimension |
      Escalation Needed YES/NO).

      STEP 5: ACTION PLAN
      Define actions to maintain or improve engagement health.
      Deliverable: Action table (Priority | Action | Owner | Timeline |
      Prerequisites | Expected Impact).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed, Data Availability Map present, Signal Acquisition Mode check performed
      - Every commitment status has evidence (not assumed)
      - Communication scores include confidence levels and evidence basis
      - Alignment classifications include primary and secondary flags
      - Health status includes confidence level with basis
      - Action table includes prerequisites and expected impact for every action
      - Escalation recommendation is justified by evidence
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Lead with a 3-sentence executive summary stating: (1) the health status and
      confidence, (2) the weakest dimension or lowest-confidence area, and (3) the
      single most urgent action.

  dependency_status:
    name: "Partner Dependency Status"
    description: "Track and assess status of partner dependencies to surface risks, blockers, and required mitigations with ownership and timelines"
    prompt: |
      Context: {account_name} has dependencies on {partner_name}.
      Dependencies: {dependency_list}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are tracking whether partner dependencies are on track, at risk, or
      blocked. The output drives risk mitigation and account team coordination.
      Every status must be evidence-based. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map, for each scoring dimension assess data richness:
      - HIGH: documented status, tracking artifacts, 5+ data points
      - MEDIUM: partial tracking, 2-4 data points
      - LOW: no tracking data, verbal updates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Dependency Clarity, Delivery Status, Risk Exposure,
      Ownership Clarity, Timeline Accuracy.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode
      declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at dependency visibility gaps)
      - Data sources to request access to (project trackers, partner delivery reports)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: DEPENDENCY STATUS ASSESSMENT
      For each dependency in the list, assess current status.
      If {dependency_list} is empty: state that no dependencies are documented,
      note the implication (cannot track partner delivery risk), proceed without
      fabrication.
      For each dependency:
      - Dependency description
      - Status: ON TRACK / AT RISK / BLOCKED / UNKNOWN
      - Confidence: HIGH/MEDIUM/LOW with basis
      - Evidence supporting status determination
      - Owner (who is responsible on each side)
      - Expected completion date
      - Downstream impact if delayed (what breaks, what slips)
      Deliverable: Dependency table (Dependency | Status | Confidence | Evidence |
      Partner Owner | Internal Owner | Expected Date | Downstream Impact).

      STEP 2: AT-RISK ITEM DETAIL
      For each dependency classified as AT RISK or BLOCKED, provide deeper analysis.
      If no items are at risk: state "No at-risk dependencies identified" and
      proceed to Step 3.
      For each at-risk item:
      - What is causing the risk or block
      - How long it has been in this state
      - What has been tried to resolve it
      - What is the impact on the account if unresolved
      Deliverable: At-Risk Detail (Dependency | Root Cause | Duration | Resolution
      Attempts | Account Impact).

      STEP 3: MITIGATION ACTIONS
      Define mitigation actions for all at-risk or blocked dependencies.
      Deliverable: Action table (Priority | Action | Owner | Timeline |
      Prerequisites | Expected Impact).

      STEP 4: ACCOUNT TEAM COMMUNICATION
      Draft the communication to the account team summarizing dependency status.
      Include: overall dependency health, items requiring attention, specific asks
      from the account team, and timeline for next status update.
      Deliverable: Account team communication brief (3-5 sentences summary +
      action items for account team).

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed, Data Availability Map present, Signal Acquisition Mode check performed
      - Every dependency has a status with confidence level and evidence
      - At-risk items include root cause, not just status label
      - Mitigation actions include prerequisites and expected impact
      - Downstream impacts are specific (named deliverables or milestones), not generic
      - Account team communication is actionable, not informational only
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Lead with a 3-sentence executive summary stating: (1) the overall dependency
      health and count of at-risk items, (2) the highest-risk dependency or
      lowest-confidence area, and (3) the single most urgent mitigation action.

  partner_performance:
    name: "Partner Performance Review"
    description: "Review partner performance over a defined period comparing commitments against delivery with trend analysis and improvement actions"
    prompt: |
      Context: Review {partner_name} performance in {account_name}.
      Period: {review_period}
      Deliverables: {committed_deliverables}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are comparing what the partner committed to deliver against what was
      actually delivered. The output drives performance conversations and
      continuation decisions. Every gap must have evidence. Follow these steps
      in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map, for each scoring dimension assess data richness:
      - HIGH: documented deliverables, tracked milestones, 5+ data points
      - MEDIUM: partial records, 2-4 data points
      - LOW: no delivery records, verbal confirmations only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Commitment Records, Delivery Evidence, Quality Metrics,
      Timeline Adherence, Trend Data.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode
      declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at performance visibility gaps)
      - Data sources to request access to (delivery reports, quality metrics, milestone trackers)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: COMMITTED VS DELIVERED
      For each committed deliverable, compare against actual delivery.
      If {committed_deliverables} is empty: state that no commitments are
      documented, note the implication (cannot measure performance), proceed
      without fabrication.
      For each deliverable:
      - Deliverable description
      - Committed date
      - Actual delivery date or status
      - Quality assessment: MEETS EXPECTATIONS / BELOW EXPECTATIONS / EXCEEDS EXPECTATIONS
      - Confidence: HIGH/MEDIUM/LOW with basis
      - Variance notes (what was different from commitment)
      Deliverable: Committed vs Delivered table (Deliverable | Committed Date |
      Actual Date | Quality | Confidence | Variance Notes).

      STEP 2: PERFORMANCE SCORE
      Calculate overall performance score as percentage of commitments met.
      Include score breakdown:
      - On-time delivery rate (percentage, confidence: HIGH/MEDIUM/LOW with basis)
      - Quality delivery rate (percentage, confidence: HIGH/MEDIUM/LOW with basis)
      - Combined performance score (percentage, confidence: HIGH/MEDIUM/LOW with basis)
      Deliverable: Performance Score (Metric | Value | Confidence | Basis).

      STEP 3: TREND ANALYSIS
      Assess whether performance is improving, stable, or declining.
      Trend requires comparison of at least two time-separated observations. If
      only one observation exists, trend is INSUFFICIENT DATA.
      If prior period data is available:
      - Compare current period score to prior period(s)
      - Identify which dimensions are improving or declining
      - Confidence: HIGH/MEDIUM/LOW with basis
      Trend classification: IMPROVING / STABLE / DECLINING / INSUFFICIENT DATA.
      Deliverable: Trend Assessment (Period | Score | Delta | Trend Classification |
      Confidence | Basis).

      STEP 4: ISSUES AND ROOT CAUSES
      For each performance gap identified in Steps 1-2, analyze root cause.
      If no gaps: state "No performance gaps identified" and proceed to Step 5.
      For each gap:
      - Gap description
      - Root cause (partner capacity, skill gap, scope change, external factor)
      - Assign one primary classification for routing. Add secondary flags where
        the signal spans multiple dimensions.
      - Whether this is a recurring pattern or one-time issue
      Deliverable: Issues table (Gap | Primary Root Cause | Secondary Flags |
      Recurring YES/NO | Severity HIGH/MEDIUM/LOW).

      STEP 5: ACTIONS FOR NEXT PERIOD
      Define actions to improve or maintain performance.
      Deliverable: Action table (Priority | Action | Owner | Timeline |
      Prerequisites | Expected Impact).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed, Data Availability Map present, Signal Acquisition Mode check performed
      - Every deliverable has quality assessment with confidence level
      - Performance score has confidence level with basis
      - Trend analysis uses at least two time-separated observations or declares INSUFFICIENT DATA
      - Root causes are specific (not "partner underperformed"), with primary/secondary classification
      - Actions include prerequisites and expected impact
      - Escalation recommendations are evidence-based, not opinion-based
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Lead with a 3-sentence executive summary stating: (1) the overall performance
      score and confidence, (2) the weakest area or lowest-confidence metric, and
      (3) the single most urgent action for the next period.

# ============================================================================
# PARTNER COORDINATION PROMPTS
# ============================================================================
coordination:

  joint_planning:
    name: "Joint Planning Session Prep"
    description: "Prepare for joint planning with partner by structuring objectives, mutual asks and offers, risk areas, and success metrics into a session-ready brief"
    prompt: |
      Context: Joint planning with {partner_name} for {account_name}.
      Objective: {planning_objective}
      Current status: {current_status}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are preparing a structured brief for a joint planning session with a
      partner. The output ensures the session is productive, objectives are clear,
      and both parties leave with aligned commitments. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map, for each scoring dimension assess data richness:
      - HIGH: documented objectives, prior meeting notes, 5+ data points
      - MEDIUM: partial context, 2-4 data points
      - LOW: no documented context, assumptions only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Planning Objectives, Current Engagement Status, Partner
      Capabilities, Account Requirements, Historical Collaboration.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode
      declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at planning preparation gaps)
      - Data sources to request access to (partner capability docs, prior engagement records)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: MUTUAL OBJECTIVES
      Define what both parties should aim to achieve from the planning session.
      If {planning_objective} is empty: state that no planning objective is
      documented, note the implication (session risks being unfocused), proceed
      without fabrication.
      For each objective:
      - Objective description
      - Owner (our side, partner side, or joint)
      - Priority: HIGH/MEDIUM/LOW, confidence: HIGH/MEDIUM/LOW with basis
      - Success criteria (how we know this objective is met)
      Deliverable: Objectives table (Objective | Owner | Priority | Confidence |
      Success Criteria).

      STEP 2: ASKS AND OFFERS
      Structure what we need from the partner and what we can offer.
      For each ask:
      - What we need
      - Why it matters (business justification)
      - Timeline required
      - Fallback if partner cannot deliver
      For each offer:
      - What we can provide
      - Value to partner (why they should care)
      - Conditions or dependencies
      Deliverable: Asks table (Ask | Business Justification | Timeline | Fallback)
      + Offers table (Offer | Value to Partner | Conditions).

      STEP 3: RISK AREAS
      Identify risks that should be discussed during the planning session.
      For each risk:
      - Risk description
      - Likelihood: HIGH/MEDIUM/LOW, confidence: HIGH/MEDIUM/LOW with basis
      - Impact if unaddressed
      - Proposed discussion approach (how to raise it constructively)
      Deliverable: Risk table (Risk | Likelihood | Confidence | Impact |
      Discussion Approach).

      STEP 4: SUCCESS METRICS
      Define metrics both parties should agree to track post-session.
      For each metric:
      - Metric name
      - Measurement method
      - Target value
      - Review cadence
      - Owner
      Deliverable: Metrics table (Metric | Measurement | Target | Review Cadence |
      Owner).

      STEP 5: SESSION AGENDA
      Synthesize Steps 1-4 into a structured agenda for the planning session.
      Include time allocation recommendations for each topic.
      Deliverable: Agenda (Topic | Time Allocation | Lead | Expected Outcome).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed, Data Availability Map present, Signal Acquisition Mode check performed
      - Objectives are mutual (not one-sided), with confidence levels
      - Asks include business justification and fallback options
      - Offers include value to partner (not just what we want to give)
      - Risk discussion approaches are constructive, not confrontational
      - Success metrics are measurable with clear owners
      - Agenda has time allocation that sums to a realistic session duration
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Lead with a 3-sentence executive summary stating: (1) the primary planning
      objective and session readiness, (2) the highest-risk area or biggest
      open question, and (3) the single most important topic to resolve in the
      session.

  handoff_coordination:
    name: "Partner Handoff Coordination"
    description: "Coordinate handoff to or from partner with structured scope definition, context transfer checklist, risk mitigation, and success criteria"
    prompt: |
      Context: Handoff between {vendor} and {partner_name}.
      Direction: {handoff_direction}
      Scope: {handoff_scope}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are coordinating a handoff between our team and a partner. The output
      ensures nothing is lost in transition, risks are mitigated, and success
      criteria are defined before the handoff occurs. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map, for each scoring dimension assess data richness:
      - HIGH: documented scope, clear ownership, 5+ data points
      - MEDIUM: partial documentation, 2-4 data points
      - LOW: no documentation, verbal agreements only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Handoff Scope, Context Documentation, Open Items,
      Risk Inventory, Success Criteria.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode
      declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at handoff clarity gaps)
      - Data sources to request access to (project docs, architecture diagrams, contact lists)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: HANDOFF SCOPE DEFINITION
      Define precisely what is being handed off.
      If {handoff_scope} is empty: state that no scope is documented, note the
      implication (handoff cannot proceed safely without scope agreement), proceed
      without fabrication.
      For each scope element:
      - Component or workstream being transferred
      - Current state (in progress, completed, not started)
      - Transferring party responsibilities that end
      - Receiving party responsibilities that begin
      - Gray areas requiring clarification
      Deliverable: Scope table (Component | Current State | Transferring Party
      Exits | Receiving Party Assumes | Clarification Needed YES/NO).

      STEP 2: CONTEXT TRANSFER CHECKLIST
      List all context that must be transferred for the receiving party to succeed.
      For each context item:
      - Information or artifact
      - Format (document, meeting, system access, code repository)
      - Status: TRANSFERRED / PENDING / NOT AVAILABLE
      - Confidence: HIGH/MEDIUM/LOW with basis
      - Owner responsible for transfer
      - Deadline
      Deliverable: Context Transfer table (Item | Format | Status | Confidence |
      Owner | Deadline).

      STEP 3: OPEN ITEMS RESOLUTION
      List items that must be resolved before or during the handoff.
      If no open items exist: state "No open items identified" and proceed to
      Step 4.
      For each open item:
      - Description
      - Blocking or non-blocking for handoff
      - Owner
      - Resolution deadline
      - Fallback if not resolved in time
      Deliverable: Open Items table (Item | Blocking YES/NO | Owner | Deadline |
      Fallback).

      STEP 4: RISK MITIGATION
      Identify risks specific to this handoff and define mitigations.
      For each risk:
      - Risk description
      - Likelihood: HIGH/MEDIUM/LOW, confidence: HIGH/MEDIUM/LOW with basis
      - Impact if realized
      - Mitigation action
      - Owner
      Deliverable: Risk table (Risk | Likelihood | Confidence | Impact |
      Mitigation | Owner).

      STEP 5: SUCCESS CRITERIA AND ESCALATION PATH
      Define how both parties will know the handoff succeeded.
      For each criterion:
      - Criterion description
      - Measurement method
      - Timeline for validation
      - Responsible party
      Define escalation path: who to contact, in what order, for what types of
      issues post-handoff.
      Deliverable: Success Criteria table (Criterion | Measurement | Timeline |
      Owner) + Escalation Path (Issue Type | First Contact | Escalation To |
      Timeline).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed, Data Availability Map present, Signal Acquisition Mode check performed
      - Scope definition covers all components with no ambiguous ownership
      - Context transfer items have owners and deadlines
      - Open items distinguish blocking from non-blocking
      - Risk mitigations include confidence levels
      - Success criteria are measurable, not subjective
      - Escalation path is defined with specific contacts and timelines
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Lead with a 3-sentence executive summary stating: (1) the handoff readiness
      status and scope clarity, (2) the highest-risk element or biggest open item,
      and (3) the single most urgent action before the handoff can proceed.

  communication_sync:
