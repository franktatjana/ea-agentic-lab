      - How the answer will be used
      - Fallback if partner cannot answer
      Deliverable: Questions table (Question | Purpose | Usage | Fallback).

      STEP 5: ACTION ITEM TRACKING
      Compile action items from prior syncs and new items to confirm.
      For each action item:
