      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed, Data Availability Map present, Signal Acquisition Mode check performed
      - Escalation summary is executive-ready (no jargon, quantified impact)
      - Issue history is chronological with evidence references
      - Previous resolution attempts are documented with evidence (not just "we tried")
      - Impact assessment includes confidence levels with basis
      - Ask is specific and actionable, not "please help"
      - Consequences of inaction are factual, not threatening
      - Tone is professional and fact-based throughout
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Lead with a 3-sentence executive summary stating: (1) the issue and its
      duration, (2) the quantified business impact and confidence level, and
      (3) the specific ask with timeline.

# ============================================================================
# PARTNER REPORTING PROMPTS
# ============================================================================
reporting:

  account_team_update:
    name: "Partner Update for Account Team"
    description: "Prepare a structured partner status update for the account team covering health, risks, dependencies, and required actions"
    prompt: |
      Context: Update account team on {partner_name} status.
      Account: {account_name}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are preparing a partner status update for the internal account team.
      The output must be concise, actionable, and highlight what the account team
      needs to know and do. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map, for each scoring dimension assess data richness:
      - HIGH: documented partner status, recent sync notes, 5+ data points
      - MEDIUM: partial records, 2-4 data points
      - LOW: no recent data, last update stale
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Partner Engagement Status, Delivery Progress, Risk
      Visibility, Dependency Tracking, Communication Cadence.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode
      declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at partner visibility gaps)
      - Data sources to request access to (partner reports, sync notes, delivery trackers)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: PARTNER STATUS SUMMARY
      Provide a concise status overview.
      - Overall engagement health: GREEN/YELLOW/RED, confidence: HIGH/MEDIUM/LOW
        with basis
      - Assign one primary classification for routing. Add secondary flags where
        the signal spans multiple dimensions.
      - Key headline (one sentence capturing the most important thing to know)
      - Status since last update: IMPROVED / STABLE / DEGRADED / INSUFFICIENT DATA
      Trend requires comparison of at least two time-separated observations. If
      only one observation exists, trend is INSUFFICIENT DATA.
      Deliverable: Status Summary (Health | Confidence | Headline | Trend |
      Trend Basis).

      STEP 2: KEY UPDATES
      List significant updates since the last account team communication.
      If no updates are available: state "No new updates since last report" and
      proceed to Step 3.
      For each update:
      - Update description
      - Impact on account (positive, neutral, negative)
      - Action required YES/NO
      Deliverable: Updates table (Update | Impact | Action Required).

      STEP 3: ACCOUNT TEAM ACTIONS NEEDED
      Define specific actions the account team needs to take regarding the partner.
      Deliverable: Action table (Priority | Action | Owner | Timeline |
      Prerequisites | Expected Impact).

      STEP 4: RISKS AND DEPENDENCIES
      Summarize current partner-related risks and dependencies for the account
      team's awareness.
      For each item:
      - Description
      - Type: RISK / DEPENDENCY
      - Severity: HIGH/MEDIUM/LOW, confidence: HIGH/MEDIUM/LOW with basis
      - Status: NEW / ONGOING / RESOLVED
      - Account team role (what they need to do, if anything)
      Deliverable: Risks and Dependencies table (Item | Type | Severity |
      Confidence | Status | Account Team Role).

      STEP 5: NEXT MILESTONE
      Identify the next significant milestone in the partner engagement.
      - Milestone description
      - Expected date
      - Readiness assessment: ON TRACK / AT RISK / BLOCKED,
        confidence: HIGH/MEDIUM/LOW with basis
      - Account team preparation needed
      Deliverable: Next Milestone (Milestone | Date | Readiness | Confidence |
      Preparation Needed).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed, Data Availability Map present, Signal Acquisition Mode check performed
      - Status summary includes health classification with confidence and basis
      - Trend assessment uses two observations or declares INSUFFICIENT DATA
      - Health classification includes primary and secondary flags
      - Account team actions include prerequisites and expected impact
      - Risks distinguish NEW from ONGOING
      - Next milestone has readiness assessment with confidence
      - Update is concise enough to scan in 2 minutes
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Lead with a 3-sentence executive summary stating: (1) the partner engagement
      health and confidence, (2) the most significant risk or dependency, and
      (3) the single most important action the account team should take.

  partner_scorecard:
    name: "Partner Scorecard Update"
    description: "Update partner scorecard metrics with trend analysis, confidence levels, and improvement actions"
    prompt: |
      Context: Update scorecard for {partner_name} in {account_name}.
      Metrics: {scorecard_metrics}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are updating the partner scorecard with current metrics, trends, and
      improvement actions. The output drives partner performance management and
      continuation decisions. Every metric must have evidence. Follow these steps
      in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map, for each scoring dimension assess data richness:
      - HIGH: tracked metrics with history, 5+ data points per metric
      - MEDIUM: partial metric tracking, 2-4 data points
      - LOW: no metric tracking, qualitative assessment only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Metric Coverage, Data Freshness, Historical Trend
      Data, Target Definitions, Benchmark Availability.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode
      declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at metric visibility gaps)
      - Data sources to request access to (partner dashboards, delivery reports, SLA trackers)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: SCORECARD TABLE
      For each metric on the scorecard, provide current status.
      If {scorecard_metrics} is empty: state that no metrics are defined, note
      the implication (cannot produce a scorecard without defined metrics),
      proceed without fabrication.
      For each metric:
      - Metric name
      - Target value
      - Actual value
      - Variance (actual vs target, percentage)
      - Status: EXCEEDS / MEETS / BELOW / CRITICAL
      - Confidence: HIGH/MEDIUM/LOW with basis (measurement reliability)
      - Trend: IMPROVING / STABLE / DECLINING / INSUFFICIENT DATA
      Trend requires comparison of at least two time-separated observations. If
      only one observation exists, trend is INSUFFICIENT DATA.
      Deliverable: Scorecard table (Metric | Target | Actual | Variance | Status |
      Confidence | Trend).

      STEP 2: OVERALL SCORE
      Calculate the overall partner score.
      - Weighted or unweighted average (state which and why)
      - Overall score as percentage
      - Overall classification: EXCEEDS / MEETS / BELOW / CRITICAL
      - Confidence: HIGH/MEDIUM/LOW with basis
      - Overall trend: IMPROVING / STABLE / DECLINING / INSUFFICIENT DATA
      Trend requires comparison of at least two time-separated observations. If
      only one observation exists, trend is INSUFFICIENT DATA.
      Deliverable: Overall Score (Score | Classification | Confidence | Trend |
      Trend Basis | Methodology).

      STEP 3: AREAS OF EXCELLENCE
      Identify metrics where the partner exceeds expectations.
      If no metrics exceed: state "No metrics currently exceeding targets" and
      proceed to Step 4.
      For each area:
      - Metric and performance level
      - What the partner is doing well
      - How to sustain this performance
      Deliverable: Excellence table (Metric | Performance | Success Factor |
      Sustainability Action).

      STEP 4: AREAS NEEDING IMPROVEMENT
      Identify metrics where the partner is below target.
      If no metrics are below target: state "All metrics meeting or exceeding
      targets" and proceed to Step 5.
      For each area:
      - Metric and gap to target
      - Root cause of underperformance
      - Improvement action required
      - Timeline for improvement
      Deliverable: Improvement table (Metric | Gap | Root Cause | Improvement
      Action | Timeline).

      STEP 5: ACTIONS TO IMPROVE SCORE
      Define actions to improve the overall partner score.
      Deliverable: Action table (Priority | Action | Owner | Timeline |
      Prerequisites | Expected Impact).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed, Data Availability Map present, Signal Acquisition Mode check performed
      - Every metric has actual value with confidence level and evidence
      - Trends use at least two time-separated observations or declare INSUFFICIENT DATA
      - Overall score methodology is stated (weighted vs unweighted)
      - Areas of excellence are specific, not just "good performance"
      - Improvement actions include root cause, not just "improve metric X"
      - Action table includes prerequisites and expected impact
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Lead with a 3-sentence executive summary stating: (1) the overall partner
      score and confidence, (2) the weakest metric or lowest-confidence area, and
      (3) the single most impactful improvement action.

  joint_success_story:
    name: "Partner Joint Success Story"
    description: "Develop a joint success story with the partner documenting challenge, solution, contributions, and quantified results"
    prompt: |
      Context: Joint success with {partner_name} at {account_name}.
      Achievement: {achievement}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are developing a joint success story that both parties can use for
      internal and external communication. The output must be factual, balanced
      in attribution, and include quantified results. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map, for each scoring dimension assess data richness:
      - HIGH: documented results, metrics, 5+ data points
      - MEDIUM: partial documentation, 2-4 data points
      - LOW: anecdotal only, no metrics
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Dimensions to assess: Challenge Documentation, Solution Detail, Contribution
      Attribution, Results Quantification, Customer Approval Status.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode
      declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP the assessment.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Questions to ask in next 2-3 interactions (targeted at success story evidence gaps)
      - Data sources to request access to (project reports, customer feedback, metrics dashboards)
      - Observation checklist for implicit signals in upcoming interactions
      - Re-assessment gate with minimum data threshold and target date
      If in Signal Acquisition Mode, end with: "Assessment deferred due to insufficient
      signal in {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to remaining steps.

      STEP 1: SUCCESS HEADLINE
      Write a compelling, factual headline for the success story.
      If {achievement} is empty: state that no achievement is documented, note
      the implication (cannot develop a success story without defined achievement),
      proceed without fabrication.
      - Headline (one sentence, includes the quantified result)
      - Sub-headline (one sentence, names both parties)
      Deliverable: Headline + Sub-headline.

      STEP 2: CHALLENGE ADDRESSED
      Document the challenge that was solved.
      - Business challenge the customer faced
      - Technical or operational dimensions of the challenge
      - Impact of the challenge on the customer's business (quantified where possible)
      - Why the challenge required a joint approach
      - Confidence: HIGH/MEDIUM/LOW with basis for impact quantification
      Deliverable: Challenge narrative (3-5 sentences) + Impact Quantification
      (Metric | Before Value | Confidence | Source).

      STEP 3: JOINT SOLUTION
      Describe the solution delivered jointly.
      - Solution overview (what was built, implemented, or delivered)
      - How the solution addressed the challenge
      - What made this approach distinctive
      - Timeline from start to value realization
      Deliverable: Solution narrative (3-5 sentences) + Solution Components table
      (Component | Description | Delivered By).

      STEP 4: CONTRIBUTION ATTRIBUTION
      Document what each party contributed, ensuring balanced attribution.
      For {vendor} contribution:
      - Specific contributions (technology, expertise, resources)
      - Value added by each contribution
      For partner contribution:
      - Specific contributions (services, expertise, customer relationship)
      - Value added by each contribution
      Deliverable: Contribution table ({vendor} Contribution | Value Added) +
      (Partner Contribution | Value Added).

      STEP 5: RESULTS ACHIEVED
      Document quantified results.
      For each result:
      - Result description
      - Metric
      - Before value (baseline)
      - After value (current)
      - Improvement (percentage or absolute)
      - Confidence: HIGH/MEDIUM/LOW with basis
      - Measurement method
      Deliverable: Results table (Result | Metric | Before | After | Improvement |
      Confidence | Measurement Method).

      STEP 6: KEY QUOTE
      Draft a potential customer quote for the success story.
      - Draft quote (2-3 sentences, in customer voice)
      - Suggested speaker (role, not name, unless confirmed)
      - Note: quote is a draft requiring customer review and approval
      Deliverable: Draft quote + Speaker suggestion + Approval status.

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed, Data Availability Map present, Signal Acquisition Mode check performed
      - Headline includes a quantified result
      - Challenge is documented from the customer's perspective, not ours
      - Solution description is factual, not promotional
      - Contributions are balanced between both parties
      - Results include confidence levels and measurement methods
      - No fabricated metrics: all numbers have sources
      - Draft quote is clearly marked as draft requiring customer approval
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Lead with a 3-sentence executive summary stating: (1) the joint achievement
      and its quantified impact, (2) the lowest-confidence result or biggest
      evidence gap, and (3) the single most important next step (customer
      approval, metric validation, or publication).
