# Partner Agent - Task Prompts (Runbook Format)
# Purpose: Full runbook prompts with numbered steps, named deliverables, and quality checks
# Reference: Personality defined in personalities/partner_personality.yaml
# Standard: docs/architecture/playbooks/runbook-design-principles.md
# 16 prompts across 4 runbook domains

# ============================================================================
# ENABLEMENT PROMPTS
# ============================================================================
enablement:

  onboarding_readiness:
    id: partner-onboarding-readiness
    name: "Partner Onboarding Readiness Assessment"
    description: "Assess partner readiness for onboarding or tier advancement by inventorying current state, analyzing gaps against program requirements, and producing a scored readiness plan"
    domain: enablement
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name
      - name: target_program
        required: true
        description: Target partner program or tier (e.g., Silver to Gold, new onboarding)
      - name: current_partner_profile
        required: true
        description: Current partner profile including certifications, competencies, and program enrollments
      - name: program_requirements
        required: true
        description: Requirements for the target program or tier
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Assessing onboarding or tier advancement readiness for {partner_name}.
      Target program: {target_program}
      Current partner profile: {current_partner_profile}
      Program requirements: {program_requirements}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are determining whether this partner is ready to onboard into a new program or advance to a higher tier. The output drives onboarding decisions and identifies gaps that must be closed before the partner can qualify.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode selection:
      - FULL: all required inputs PRESENT
      - DEGRADED: 1+ inputs PARTIAL, flag gaps in every affected deliverable
      - DEFER: 2+ required inputs ABSENT, STOP and produce: (a) missing inputs with specific ask, (b) who can provide each, (c) re-run deadline
      If program_requirements is ABSENT, DEFER: cannot assess readiness without defined target criteria.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: CURRENT STATE INVENTORY
      Document the partner's current standing across all relevant dimensions.
      For each dimension:
      - Dimension name (certifications, revenue, customer references, technical capabilities, support capacity)
      - Current value or status
      - Evidence basis (portal data, CRM record, partner self-report)
      - Confidence: VERIFIED (portal/contract data) / ESTIMATED (CRM fields) / ASSUMED (verbal)
      If current_partner_profile is sparse, state what is missing rather than inferring status.
      Deliverable: Current State table (Dimension | Current Value | Evidence | Confidence).

      STEP 2: GAP ANALYSIS AGAINST PROGRAM REQUIREMENTS
      Compare current state to target program requirements.
      For each requirement:
      - Requirement description
      - Required value or threshold
      - Current value (from Step 1)
      - Gap: MET / PARTIAL / NOT MET
      - Gap magnitude (how far from requirement)
      - Effort to close: LOW (< 30 days) / MEDIUM (30-90 days) / HIGH (> 90 days)
      - Dependencies (what must happen before this gap can be closed)
      Deliverable: Gap matrix (Requirement | Required | Current | Status | Gap Size | Effort | Dependencies).

      STEP 3: READINESS SCORE
      Calculate an overall readiness score:
      - Percentage of requirements MET
      - Percentage PARTIAL
      - Percentage NOT MET
      - Overall readiness: READY (90%+ MET) / CONDITIONAL (70-89% MET) / NOT READY (< 70% MET)
      - Confidence: aggregate of individual confidence levels
      - Blocking gaps: list any NOT MET requirements that are hard prerequisites (cannot be waived)
      Deliverable: Readiness score card (Score | Classification | Confidence | Blocking Gaps).

      STEP 4: ACTION PLAN
      For each gap identified in Step 2, define the closure action.
      Prioritize by: blocking gaps first, then by effort (LOW first for quick wins).
      Deliverable: Action table (Priority | Gap | Action | Owner | Timeline | Prerequisites | Expected Impact).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - Every program requirement explicitly assessed (no silent skips)
      - Gap magnitude quantified, not just flagged
      - Blocking gaps distinguished from nice-to-have gaps
      - Effort estimates include dependencies
      - Confidence attached to every current state value
      - Action plan prioritizes blocking gaps before optional improvements
      - Executive summary is self-sufficient: reader can act without reading details

      RUN MODE EXECUTION:
      - QUICK: executive summary + readiness score + top blocking gap action + state delta
      - DISCOVERY: signal acquisition plan (what partner data to collect, from whom, by when)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) readiness classification with score and confidence, (2) count of blocking gaps and the most critical one, (3) single most urgent action with owner and timeline.

  certification_compliance:
    id: partner-certification-compliance
    name: "Partner Certification Compliance Check"
    description: "Track certification status across the partner organization, flag expirations and lapses, and assess impact on active deals and program tier standing"
    domain: enablement
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name
      - name: certification_records
        required: true
        description: Current certification inventory with dates, holders, and status
      - name: program_tier_requirements
        required: true
        description: Certification requirements for current and target program tier
      - name: active_deals
        required: false
        description: Active deals requiring certified partner resources
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Checking certification compliance for {partner_name}.
      Certification records: {certification_records}
      Program tier requirements: {program_tier_requirements}
      Active deals: {active_deals}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are auditing whether the partner's certifications are current, sufficient for their program tier, and adequate for active deal requirements. Certification lapses can trigger tier demotion or disqualify the partner from deal participation.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If certification_records is ABSENT, DEFER: cannot audit compliance without certification data.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: CERTIFICATION INVENTORY
      List every certification held by the partner organization.
      For each certification:
      - Certification name and issuing body
      - Holder (individual name and role)
      - Issue date
      - Expiry date
      - Status: ACTIVE / EXPIRING (within 90 days) / EXPIRED / SUSPENDED
      - Renewal pathway (exam, continuing education, re-certification)
      - Confidence: VERIFIED (portal lookup) / ESTIMATED (partner-reported) / ASSUMED (inferred)
      If certification_records is sparse, state what is missing.
      Deliverable: Certification inventory table (Certification | Holder | Issued | Expires | Status | Renewal Path | Confidence).

      STEP 2: EXPIRY ANALYSIS
      Identify certifications at risk of lapsing.
      For each EXPIRING or EXPIRED certification:
      - Days until expiry (or days since expiry)
      - Renewal cost and effort estimate
      - Single-point-of-failure risk: is this the only holder of this certification? YES / NO
      - Backup holder available? YES / NO (name if yes)
      Sort by urgency (expired first, then nearest expiry).
      Deliverable: Expiry risk table (Certification | Holder | Days to Expiry | SPOF Risk | Backup Available | Renewal Effort).

      STEP 3: ACTIVE DEAL IMPACT
      If active_deals data is available, cross-reference certification requirements against deals.
      For each deal requiring certified resources:
      - Deal name and value
      - Required certifications
      - Coverage: COVERED (certified resource assigned) / AT RISK (certification expiring before deal close) / GAP (no certified resource)
      - Impact if gap materializes (deal delay, disqualification, customer escalation)
      If active_deals is ABSENT, state "Active deal impact not assessed, deal data not provided."
      Deliverable: Deal impact table (Deal | Value | Required Cert | Coverage | Impact if Gap).

      STEP 4: COMPLIANCE REPORT
      Summarize compliance against program tier requirements.
      For each tier requirement:
      - Requirement (e.g., "minimum 3 certified architects")
      - Current count vs. required count
      - Compliance: COMPLIANT / NON-COMPLIANT / AT RISK (will become non-compliant within 90 days)
      - Tier demotion risk: if non-compliant, what is the grace period and consequence?
      Deliverable: Compliance report table (Requirement | Required | Current | Status | Demotion Risk).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - Every certification has explicit status with expiry date (no assumptions about "probably current")
      - SPOF risk assessed for every EXPIRING/EXPIRED certification
      - Deal impact quantified where deal data is available
      - Tier compliance assessed against specific numeric thresholds
      - Confidence attached to every certification status
      - Executive summary actionable without reading full inventory

      RUN MODE EXECUTION:
      - QUICK: executive summary + expiring/expired list + top action + state delta
      - DISCOVERY: signal plan (certification portal access, partner HR contact for holder list, renewal deadlines)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) overall compliance status with count of active/expiring/expired certifications, (2) most urgent certification risk and its deal or tier impact, (3) single most urgent action with owner and deadline.

  training_gap:
    id: partner-training-gap
    name: "Partner Training Gap Analysis"
    description: "Identify training gaps against tier requirements by mapping completed training to requirements, highlighting shortfalls, and producing a prioritized training plan"
    domain: enablement
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name
      - name: training_records
        required: true
        description: Completed training courses, dates, and participants
      - name: tier_requirements
        required: true
        description: Training requirements for current and target tier
      - name: partner_headcount
        required: false
        description: Partner team size and role breakdown for coverage analysis
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Analyzing training gaps for {partner_name}.
      Training records: {training_records}
      Tier requirements: {tier_requirements}
      Partner headcount: {partner_headcount}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are identifying where the partner's training completion falls short of tier requirements. Training gaps directly affect certification eligibility, deal qualification, and tier maintenance.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If training_records is ABSENT, DEFER: cannot identify gaps without completion data.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: TRAINING COMPLETION INVENTORY
      List all completed training by the partner organization.
      For each completed course:
      - Course name and provider
      - Completion date
      - Participant name and role
      - Validity period (if applicable)
      - Status: CURRENT / EXPIRED (completion outside validity window)
      - Confidence: VERIFIED (LMS record) / ESTIMATED (partner-reported) / ASSUMED (inferred)
      Deliverable: Training inventory table (Course | Provider | Completed | Participant | Valid Until | Status | Confidence).

      STEP 2: TIER REQUIREMENT MAPPING
      Map tier requirements to completed training.
      For each required training area:
      - Requirement description (e.g., "2 staff complete Advanced Sales Methodology")
      - Required count of completions
      - Actual count of valid completions
      - Coverage: COVERED / PARTIAL / GAP
      - Prerequisite chains: does this training require prior courses? Are prerequisites met?
      Deliverable: Requirement mapping table (Requirement | Required Count | Actual Count | Coverage | Prerequisites Met).

      STEP 3: GAP IDENTIFICATION
      For each GAP or PARTIAL requirement, detail the shortfall.
      - Gap description
      - Shortfall magnitude (e.g., "need 2 more completions")
      - Blocking: does this gap prevent tier qualification? YES / NO
      - Available training dates (if known)
      - Estimated time to close (calendar days from enrollment to completion)
      - Cost estimate per participant (if known)
      Deliverable: Gap detail table (Requirement | Shortfall | Blocking | Next Available | Time to Close | Cost).

      STEP 4: TRAINING PLAN
      Produce a prioritized training plan to close all gaps.
      Prioritize: blocking gaps first, then by time-to-close (shortest first for quick wins).
      For each training action:
      - Course to complete
      - Recommended participant(s) and role
      - Enrollment deadline (to meet tier timeline)
      - Prerequisites that must be completed first
      - Owner responsible for enrollment
      Deliverable: Training plan table (Priority | Course | Participant | Enroll By | Prerequisites | Owner | Expected Completion).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - Every tier requirement explicitly mapped to training completions (no gaps silently ignored)
      - Expired completions not counted toward current requirements
      - Prerequisite chains validated (no plan recommends an advanced course before prerequisites are met)
      - Blocking gaps distinguished from optional improvements
      - Confidence attached to every completion status
      - Executive summary actionable without reading the full mapping

      RUN MODE EXECUTION:
      - QUICK: executive summary + blocking gaps + top action + state delta
      - DISCOVERY: signal plan (LMS access, partner training coordinator contact, course catalog)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) overall training coverage percentage with count of gaps, (2) most critical blocking gap and its tier impact, (3) single most urgent training enrollment with deadline.

  maturity_assessment:
    id: partner-maturity-assessment
    name: "Partner Maturity Assessment"
    description: "Assess partner maturity across six dimensions with 1-5 scoring, trend analysis, benchmark comparison, and a maturity advancement roadmap"
    domain: enablement
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name
      - name: engagement_data
        required: true
        description: Partner engagement history, delivery records, and collaboration metrics
      - name: prior_assessment
        required: false
        description: Previous maturity assessment results for trend analysis
      - name: benchmark_data
        required: false
        description: Peer partner maturity benchmarks for comparison
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Assessing maturity for {partner_name}.
      Engagement data: {engagement_data}
      Prior assessment: {prior_assessment}
      Benchmark data: {benchmark_data}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are scoring partner maturity across six dimensions to determine where the partner stands today and what advancement looks like. The output drives enablement investment decisions and partner tiering conversations.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If engagement_data is ABSENT, DEFER: cannot score maturity without engagement evidence.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: DIMENSION SCORING
      Score each of six dimensions on a 1-5 scale:
      1. Onboarding: program enrollment completion, initial training, portal access, first engagement
      2. Enablement: certification depth, training breadth, self-service capability, knowledge currency
      3. Collaboration: communication quality, joint planning maturity, responsiveness, proactiveness
      4. Performance: delivery reliability, quality consistency, SLA adherence, customer satisfaction
      5. Governance: reporting compliance, process adherence, escalation handling, contract compliance
      6. KPIs: revenue contribution, pipeline generation, deal velocity impact, reference-ability

      For each dimension:
      - Score (1-5): 1=Ad Hoc, 2=Developing, 3=Defined, 4=Managed, 5=Optimizing
      - Evidence basis (specific data points supporting the score)
      - Confidence: HIGH / MEDIUM / LOW with basis
      - Limiting factor (what prevents a higher score)
      Deliverable: Maturity score table (Dimension | Score | Evidence | Confidence | Limiting Factor).

      STEP 2: TREND ANALYSIS
      If prior_assessment is available, compare current scores to previous scores.
      For each dimension:
      - Previous score and date
      - Current score
      - Delta
      - Trend: IMPROVING / STABLE / DECLINING
      - Driver of change (what caused movement)
      If prior_assessment is ABSENT, state "Trend analysis not available, baseline assessment only."
      Deliverable: Trend table (Dimension | Previous Score | Current Score | Delta | Trend | Driver).

      STEP 3: BENCHMARK COMPARISON
      If benchmark_data is available, compare partner scores to peer benchmarks.
      For each dimension:
      - Partner score
      - Peer average
      - Peer top quartile
      - Position: ABOVE AVERAGE / AVERAGE / BELOW AVERAGE
      If benchmark_data is ABSENT, state "Benchmark comparison not available, peer data not provided."
      Deliverable: Benchmark table (Dimension | Partner Score | Peer Average | Top Quartile | Position).

      STEP 4: MATURITY ROADMAP
      For each dimension scoring below 4 (Managed), define advancement actions.
      Prioritize by: dimensions with the largest gap to 4, then by business impact.
      For each action:
      - Dimension and current score
      - Target score and timeline
      - Actions to reach target
      - Owner (partner-side, our-side, or joint)
      - Dependencies
      - Investment required (time, budget, resources)
      Deliverable: Roadmap table (Dimension | Current | Target | Actions | Owner | Timeline | Dependencies | Investment).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - All six dimensions scored independently (no averaged single number without breakdown)
      - Evidence cited for every score (not subjective impressions)
      - Confidence attached to every dimension score
      - Trend analysis uses time-separated observations or declares "baseline only"
      - Roadmap actions include dependencies and investment estimates
      - Limiting factors are specific and actionable
      - Executive summary is self-sufficient: reader can act without reading dimension details

      RUN MODE EXECUTION:
      - QUICK: executive summary + dimension scores + top advancement action + state delta
      - DISCOVERY: signal acquisition plan (data to collect per dimension, sources, contacts, timeline)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) overall maturity level with average score and confidence, (2) lowest-scoring dimension and its limiting factor, (3) single highest-impact advancement action with owner and timeline.

# ============================================================================
# CO-SELL PROMPTS
# ============================================================================
cosell:

  cosell_opportunity:
    id: partner-cosell-opportunity
    name: "Co-Sell Opportunity Identification"
    description: "Identify co-sell opportunities from pipeline overlap analysis, score each opportunity, and recommend co-sell motions with engagement sequencing"
    domain: cosell
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name
      - name: partner_pipeline
        required: true
        description: Partner pipeline data including accounts, stages, and values
      - name: internal_pipeline
        required: true
        description: Internal pipeline data for overlap analysis
      - name: partner_capabilities
        required: false
        description: Partner solution capabilities and vertical expertise
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Identifying co-sell opportunities with {partner_name}.
      Partner pipeline: {partner_pipeline}
      Internal pipeline: {internal_pipeline}
      Partner capabilities: {partner_capabilities}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are finding opportunities where joint selling with this partner creates more value than selling independently. The output drives co-sell activation decisions and pipeline coordination.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If partner_pipeline or internal_pipeline is ABSENT, DEFER: overlap analysis requires both pipelines.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: PIPELINE DATA COLLECTION
      Normalize and summarize both pipelines for comparison.
      For each pipeline (partner and internal):
      - Total deal count and aggregate value
      - Stage distribution (early, mid, late)
      - Vertical and solution area breakdown
      - Top 10 accounts by deal value
      - Data freshness (date of last update)
      - Confidence: VERIFIED (CRM export) / ESTIMATED (partner-shared) / ASSUMED (indirect)
      Deliverable: Pipeline summary (Source | Deal Count | Total Value | Stage Mix | Top Accounts | Data Date | Confidence).

      STEP 2: OVERLAP ANALYSIS
      Identify accounts and opportunities that appear in both pipelines.
      For each overlap:
      - Account name
      - Internal deal stage, value, and expected close
      - Partner deal stage, value, and expected close
      - Overlap type: SAME OPPORTUNITY / SAME ACCOUNT DIFFERENT OPPORTUNITY / COMPLEMENTARY WORKLOAD
      - Conflict risk: does overlap create competition or collaboration potential?
      If no overlaps found, state "No pipeline overlap detected" and recommend account mapping session.
      Deliverable: Overlap table (Account | Internal Deal | Partner Deal | Overlap Type | Conflict Risk).

      STEP 3: OPPORTUNITY SCORING
      Score each overlap opportunity for co-sell potential (0-10):
      - Solution complementarity (0-10): do solutions combine to create more customer value?
      - Stage alignment (0-10): are deals at compatible stages for joint motion?
      - Revenue uplift potential (0-10): does co-selling increase deal size or win probability?
      - Relationship leverage (0-10): does partner have access or influence we lack?
      - Weighted total with confidence
      Classify: HIGH (7-10) / MEDIUM (4-6.9) / LOW (0-3.9)
      Deliverable: Scoring table (Account | Complementarity | Stage | Uplift | Leverage | Total | Classification | Confidence).

      STEP 4: CO-SELL MOTION RECOMMENDATION
      For each HIGH and MEDIUM scored opportunity, recommend a co-sell motion:
      - Motion type: JOINT PITCH / REFERRAL / RESELL / TECHNOLOGY PARTNERSHIP / SERVICES ATTACH
      - Engagement sequence: who reaches out first, what the ask is, timeline
      - Internal preparation needed before activation
      - Partner preparation needed
      - Success metric for this motion
      Deliverable: Recommendation table (Account | Motion | Sequence | Our Prep | Partner Prep | Success Metric).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - Both pipelines normalized to comparable format before overlap analysis
      - Overlap type classified (same opp vs. same account vs. complementary), not just flagged
      - Conflict risk assessed for every overlap
      - Opportunity scores use four dimensions, not a single subjective rating
      - Motion recommendations include preparation steps for both sides
      - Executive summary actionable without reading scoring details

      RUN MODE EXECUTION:
      - QUICK: executive summary + top 3 scored opportunities + state delta
      - DISCOVERY: signal plan (pipeline data requests, account mapping session agenda, CRM access)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) count of overlap opportunities with HIGH/MEDIUM/LOW breakdown, (2) highest-scored opportunity and recommended motion, (3) single most urgent activation step with owner and timeline.

  deal_registration:
    id: partner-deal-registration
    name: "Deal Registration Coordination"
    description: "Coordinate deal registration and attribution between internal pipeline and partner registrations, reconcile CRM records, and identify conflicts"
    domain: cosell
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name
      - name: registration_data
        required: true
        description: Deal registrations submitted by or involving the partner
      - name: crm_pipeline
        required: true
        description: Internal CRM pipeline for reconciliation
      - name: attribution_rules
        required: false
        description: Partner program attribution and compensation rules
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Coordinating deal registration with {partner_name}.
      Registration data: {registration_data}
      CRM pipeline: {crm_pipeline}
      Attribution rules: {attribution_rules}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are ensuring deal registrations are accurate, matched to CRM records, and attributed correctly. Mismatched registrations cause compensation disputes, partner dissatisfaction, and program compliance issues.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If registration_data is ABSENT, DEFER: cannot coordinate without registration records.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: REGISTRATION INVENTORY
      List all deal registrations involving this partner.
      For each registration:
      - Registration ID and date
      - Deal name and customer account
      - Registered deal value
      - Registration status: APPROVED / PENDING / EXPIRED / REJECTED
      - Registering party (partner, internal, or joint)
      - Expiry date (if applicable)
      - Confidence: VERIFIED (portal record) / ESTIMATED (partner-reported) / ASSUMED (inferred)
      Deliverable: Registration inventory table (Reg ID | Date | Deal | Value | Status | Registrant | Expires | Confidence).

      STEP 2: CRM RECONCILIATION
      Match registrations to CRM pipeline records.
      For each registration:
      - Matching CRM opportunity (ID, name, value)
      - Match status: MATCHED / PARTIAL MATCH / NO MATCH / MULTIPLE MATCHES
      - Value discrepancy: registration value vs. CRM value (delta and percentage)
      - Stage discrepancy: registration stage vs. CRM stage
      - Owner discrepancy: registered owner vs. CRM owner
      If no CRM match found, flag as "Unmatched registration, requires investigation."
      Deliverable: Reconciliation table (Reg ID | CRM Opp | Match Status | Value Delta | Stage Delta | Owner Delta | Action).

      STEP 3: ATTRIBUTION ANALYSIS
      Assess whether attribution is correct per program rules.
      For each matched registration:
      - Current attribution (who gets credit)
      - Correct attribution per rules (if attribution_rules available)
      - Attribution status: CORRECT / INCORRECT / DISPUTED / UNCLEAR
      - Revenue impact of incorrect attribution (partner compensation affected)
      If attribution_rules is ABSENT, state "Attribution accuracy not validated, program rules not provided."
      Deliverable: Attribution table (Reg ID | Current Attribution | Correct Attribution | Status | Revenue Impact).

      STEP 4: CONFLICT IDENTIFICATION
      Identify registration conflicts requiring resolution.
      For each conflict:
      - Conflict type: DUPLICATE REGISTRATION / TERRITORY OVERLAP / ATTRIBUTION DISPUTE / EXPIRED REGISTRATION ON ACTIVE DEAL
      - Parties involved
      - Business impact (compensation, relationship, program compliance)
      - Recommended resolution
      - Resolution owner and timeline
      If no conflicts found, state "No registration conflicts identified."
      Deliverable: Conflict table (Type | Parties | Impact | Resolution | Owner | Timeline).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - Every registration matched against CRM (no registrations left unreconciled)
      - Value discrepancies quantified with exact delta, not just flagged
      - Attribution assessed against specific program rules where available
      - Conflicts classified by type with resolution path
      - Expired registrations on active deals flagged as urgent
      - Executive summary actionable without reading reconciliation details

      RUN MODE EXECUTION:
      - QUICK: executive summary + conflict list + top action + state delta
      - DISCOVERY: signal plan (portal access, CRM export, attribution rules documentation)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) registration count with match/mismatch breakdown, (2) most critical conflict or discrepancy and its revenue impact, (3) single most urgent resolution action with owner and deadline.

  joint_planning:
    id: partner-joint-planning
    name: "Joint Business Planning Session Prep"
    description: "Prepare for joint business planning by tracking current JBP status, commitment delivery, mutual objective alignment, and producing a session-ready agenda"
    domain: cosell
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name
      - name: current_jbp
        required: true
        description: Current Joint Business Plan including objectives, commitments, and metrics
      - name: commitment_tracking
        required: true
        description: Status of commitments made in prior JBP sessions
      - name: planning_horizon
        required: false
        description: Planning period for the upcoming session (e.g., next quarter, next year)
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Preparing joint business planning session with {partner_name}.
      Current JBP: {current_jbp}
      Commitment tracking: {commitment_tracking}
      Planning horizon: {planning_horizon}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are preparing a structured brief for a joint business planning session. The output ensures the session builds on prior commitments, addresses gaps, and produces aligned objectives for the next period.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If current_jbp and commitment_tracking are both ABSENT, DEFER: cannot prepare without baseline context.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: CURRENT JBP STATUS
      Summarize the current state of the joint business plan.
      - JBP period and creation date
      - Number of objectives (total, on track, at risk, missed)
      - Revenue targets: committed vs. actual
      - Key milestones: completed vs. pending
      - Overall JBP health: ON TRACK / AT RISK / OFF TRACK
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: JBP status summary (Period | Objectives Status | Revenue Status | Milestone Status | Health | Confidence).

      STEP 2: COMMITMENT TRACKING
      Review delivery against commitments from prior sessions.
      For each commitment:
      - Commitment description
      - Owner (our side or partner side)
      - Agreed timeline
      - Current status: DELIVERED / IN PROGRESS / DELAYED / NOT STARTED / ABANDONED
      - Evidence of delivery or delay reason
      - Impact of non-delivery on JBP objectives
      Calculate: our delivery rate, partner delivery rate, joint delivery rate.
      Deliverable: Commitment table (Commitment | Owner | Timeline | Status | Evidence | Impact) + delivery rate summary.

      STEP 3: MUTUAL OBJECTIVE ALIGNMENT
      Assess whether objectives remain aligned and propose new objectives for the next period.
      For each existing objective:
      - Still relevant? YES / NO / MODIFIED (state modification)
      - Progress toward objective
      - Carry forward to next period? YES / NO with rationale
      For proposed new objectives:
      - Objective description
      - Owner (our side, partner side, or joint)
      - Success criteria
      - Resource requirements
      Deliverable: Alignment table (Objective | Still Relevant | Progress | Carry Forward) + new objectives table (Objective | Owner | Success Criteria | Resources).

      STEP 4: SESSION AGENDA
      Synthesize Steps 1-3 into a structured agenda for the planning session.
      - Opening: JBP status review (time allocation)
      - Commitment accountability review (time allocation)
      - Objective alignment and new objectives (time allocation)
      - Risk and blocker discussion (time allocation)
      - Next-period commitments and close (time allocation)
      Deliverable: Agenda table (Topic | Time | Lead | Expected Outcome | Pre-read Required).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - Every prior commitment tracked with status and evidence
      - Delivery rates calculated for both sides (not just partner)
      - Objectives assessed for continued relevance, not blindly carried forward
      - Agenda time allocations sum to a realistic session duration
      - Pre-read materials identified for each topic
      - Executive summary is self-sufficient: reader can act without reading details

      RUN MODE EXECUTION:
      - QUICK: executive summary + JBP health + delivery rates + top agenda item + state delta
      - DISCOVERY: signal plan (prior JBP docs, commitment tracker, partner contact for pre-session alignment)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) current JBP health with delivery rate for both sides, (2) the most critical unmet commitment or misaligned objective, (3) single most important topic to resolve in the session.

  joint_positioning:
    id: partner-joint-positioning
    name: "Joint Positioning and Success Story"
    description: "Develop joint positioning by aligning value propositions, reviewing reference architectures, collecting proof points, and producing a positioning brief"
    domain: cosell
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name
      - name: our_value_proposition
        required: true
        description: Our solution value proposition and messaging
      - name: partner_value_proposition
        required: true
        description: Partner's solution value proposition and capabilities
      - name: reference_architectures
        required: false
        description: Joint reference architectures or validated designs
      - name: customer_wins
        required: false
        description: Joint customer wins and proof points
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Developing joint positioning with {partner_name}.
      Our value proposition: {our_value_proposition}
      Partner value proposition: {partner_value_proposition}
      Reference architectures: {reference_architectures}
      Customer wins: {customer_wins}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are creating a joint positioning brief that shows how the combined solution delivers more value than either solution alone. The output is used in customer-facing presentations, partner marketing, and co-sell motions.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If our_value_proposition or partner_value_proposition is ABSENT, DEFER: cannot build joint positioning without both value propositions.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: VALUE PROPOSITION ALIGNMENT
      Map where both value propositions complement, overlap, or conflict.
      For each alignment area:
      - Domain or capability area
      - Our positioning
      - Partner positioning
      - Alignment: COMPLEMENTARY (1+1=3) / OVERLAPPING (same claim) / CONFLICTING (contradictory)
      - Joint message: how to position the combined offering in this area
      Deliverable: Alignment table (Domain | Our Position | Partner Position | Alignment Type | Joint Message).

      STEP 2: REFERENCE ARCHITECTURE REVIEW
      If reference_architectures is available, validate joint technical positioning.
      For each reference architecture:
      - Architecture name and use case
      - Our components and partner components
      - Integration points and validation status: VALIDATED / DRAFT / CONCEPTUAL
      - Customer applicability (which segments benefit)
      If reference_architectures is ABSENT, state "No joint reference architectures available, recommend creation as co-sell enablement priority."
      Deliverable: Architecture table (Name | Use Case | Our Components | Partner Components | Integration Status | Applicability).

      STEP 3: PROOF POINT COLLECTION
      Gather evidence supporting joint value claims.
      For each proof point:
      - Type: CUSTOMER WIN / CASE STUDY / BENCHMARK / ANALYST VALIDATION / CERTIFICATION
      - Description
      - Quantified result (metric, before/after, percentage improvement)
      - Customer-referenceable: YES / NO / PENDING APPROVAL
      - Confidence: VERIFIED / ESTIMATED / ASSUMED
      If customer_wins is ABSENT, state "No proof points available, recommend customer reference development."
      Deliverable: Proof point table (Type | Description | Result | Referenceable | Confidence).

      STEP 4: POSITIONING BRIEF
      Synthesize Steps 1-3 into a customer-ready positioning brief.
      Structure:
      - Joint value headline (one sentence)
      - Combined capability summary (3-5 bullet points)
      - Differentiation from standalone alternatives
      - Proof points (top 3, quantified)
      - Target customer profile (who benefits most)
      - Call to action (next step for interested customers)
      Deliverable: Positioning brief (structured narrative, customer-facing tone).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - Alignment analysis covers all major capability areas, not just areas of agreement
      - Conflicting positions identified and resolution proposed (not hidden)
      - Reference architectures validated, not assumed to work because both logos appear
      - Proof points include confidence levels and reference-ability status
      - Positioning brief is factual, not promotional (no unsubstantiated superlatives)
      - Executive summary actionable without reading full alignment analysis

      RUN MODE EXECUTION:
      - QUICK: executive summary + positioning brief + state delta
      - DISCOVERY: signal plan (partner marketing contact, reference architecture needs, customer reference candidates)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) joint positioning strength with count of complementary vs. conflicting areas, (2) strongest proof point and biggest positioning gap, (3) single most impactful action to strengthen joint positioning with owner.

# ============================================================================
# PROGRAM HEALTH PROMPTS
# ============================================================================
program_health:

  engagement_health:
    id: partner-engagement-health
    name: "Partner Engagement Health Check"
    description: "Assess partner engagement health with GREEN/YELLOW/RED scoring across commitment delivery, communication quality, and strategic alignment"
    domain: program_health
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name
      - name: account_name
        required: true
        description: Customer account name
      - name: engagement_data
        required: true
        description: Engagement signals including meeting cadence, responsiveness, delivery status
      - name: prior_health_check
        required: false
        description: Previous health check results for trend analysis
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Assessing engagement health for {partner_name} on {account_name}.
      Engagement data: {engagement_data}
      Prior health check: {prior_health_check}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are determining whether this partner engagement is healthy, at risk, or in trouble. The health classification drives escalation decisions and resource allocation.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If engagement_data is ABSENT, DEFER: cannot assess health without engagement signals.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: SIGNAL COLLECTION
      Gather and categorize engagement signals across five dimensions.
      For each dimension, collect available data points:
      1. Commitment Delivery: commitments made vs. delivered, on-time rate, quality
      2. Communication Quality: responsiveness, proactiveness, transparency, cadence adherence
      3. Strategic Alignment: goal alignment, technical alignment, timeline alignment
      4. Resource Investment: staffing levels, skill match, continuity (turnover rate)
      5. Engagement Trajectory: direction of change over last 2-3 interactions
      For each signal:
      - Signal description
      - Positive / Neutral / Negative
      - Confidence: HIGH / MEDIUM / LOW with basis
      If a dimension has no signals, state "No data available for [dimension]."
      Deliverable: Signal inventory table (Dimension | Signal | Polarity | Confidence | Source).

      STEP 2: DIMENSION SCORING
      Score each dimension: GREEN (healthy) / YELLOW (at risk) / RED (in trouble).
      For each dimension:
      - Score with rationale
      - Key signal driving the score
      - Confidence: HIGH / MEDIUM / LOW with basis
      - If no signals available, score as GRAY (insufficient data) rather than guessing
      Deliverable: Dimension score table (Dimension | Score | Key Signal | Confidence | Basis).

      STEP 3: TREND ANALYSIS
      If prior_health_check is available, compare current to previous scores.
      For each dimension:
      - Previous score and date
      - Current score
      - Direction: IMPROVING / STABLE / DECLINING
      - Driver of change
      If no prior check, state "Trend analysis not available, baseline assessment."
      Deliverable: Trend table (Dimension | Previous | Current | Direction | Driver).

      STEP 4: HEALTH CLASSIFICATION
      Synthesize dimension scores into overall engagement health.
      - Overall health: GREEN / YELLOW / RED
      - Classification rule: overall = worst dimension score if any RED; YELLOW if 2+ YELLOW and no RED; GREEN otherwise
      - Confidence: lowest confidence across all scored dimensions
      - Weakest dimension and its escalation implication
      - Escalation needed: YES / NO with threshold basis
      Deliverable: Health classification (Overall | Confidence | Weakest Dimension | Escalation Needed | Action Required).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - All five dimensions assessed or explicitly marked GRAY (no silent omissions)
      - Overall classification follows the stated rule (worst-score-drives-overall)
      - Confidence is the minimum across dimensions, not an average
      - Trend analysis uses time-separated observations or declares "baseline only"
      - GRAY dimensions trigger a signal acquisition note in the action plan
      - Executive summary is self-sufficient: reader can act without reading dimension details

      RUN MODE EXECUTION:
      - QUICK: executive summary + health classification + top action + state delta
      - DISCOVERY: signal acquisition plan (per-dimension data gaps, collection sources, contacts, timeline)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) overall engagement health with confidence and weakest dimension, (2) trend direction or "baseline assessment," (3) single most urgent action (escalation, intervention, or monitoring continuation).

  dependency_status:
    id: partner-dependency-status
    name: "Partner Dependency Status Tracker"
    description: "Track status of partner dependencies, identify at-risk items, assess downstream impact, and produce mitigation actions with ownership"
    domain: program_health
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name
      - name: dependency_registry
        required: true
        description: List of dependencies on the partner with expected delivery dates
      - name: project_timeline
        required: false
        description: Project timeline for downstream impact analysis
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Tracking dependency status for {partner_name}.
      Dependency registry: {dependency_registry}
      Project timeline: {project_timeline}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are tracking whether partner dependencies are on track, at risk, or blocked. The output drives risk mitigation and account team coordination. Every status must be evidence-based.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If dependency_registry is ABSENT, DEFER: cannot track dependencies without a registry.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: DEPENDENCY INVENTORY
      Document every dependency on the partner.
      For each dependency:
      - Dependency description
      - Category: DELIVERABLE / ACCESS / DECISION / RESOURCE / INFORMATION
      - Expected delivery date
      - Status: ON TRACK / AT RISK / BLOCKED / DELIVERED / UNKNOWN
      - Confidence: HIGH / MEDIUM / LOW with basis
      - Evidence supporting status
      - Partner owner and internal owner
      If dependency_registry is sparse, state what is missing.
      Deliverable: Dependency table (Dependency | Category | Expected Date | Status | Confidence | Evidence | Partner Owner | Internal Owner).

      STEP 2: STATUS ASSESSMENT
      Classify overall dependency health.
      - Total dependencies and status distribution (on track / at risk / blocked / delivered / unknown)
      - Overall health: GREEN (90%+ on track or delivered) / YELLOW (70-89%) / RED (< 70%)
      - Confidence: aggregate of individual dependency confidence levels
      Deliverable: Status summary (Total | On Track | At Risk | Blocked | Delivered | Unknown | Health | Confidence).

      STEP 3: AT-RISK IDENTIFICATION
      For each AT RISK or BLOCKED dependency, provide detailed analysis.
      - Root cause of risk or block
      - Duration in current state
      - Escalation history (previous attempts to unblock)
      - Workaround available: YES / NO (describe if yes)
      If no dependencies are at risk, state "No at-risk dependencies identified."
      Deliverable: At-risk detail table (Dependency | Root Cause | Duration | Escalation History | Workaround).

      STEP 4: IMPACT ANALYSIS
      For each AT RISK or BLOCKED dependency, assess downstream impact.
      If project_timeline is available:
      - Affected milestone(s)
      - Delay estimate (days/weeks)
      - Cascade effect (what else slips if this dependency is late)
      - Revenue or deal impact (if applicable)
      If project_timeline is ABSENT, state "Downstream impact estimated without project timeline data."
      Deliverable: Impact table (Dependency | Affected Milestone | Delay Estimate | Cascade Effect | Revenue Impact).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - Every dependency has explicit status with confidence (no silent assumptions)
      - AT RISK vs. BLOCKED clearly distinguished (at risk = may slip; blocked = cannot proceed)
      - Root causes are specific, not generic ("partner resource constraint" vs. "partner issue")
      - Impact analysis includes cascade effects, not just immediate delay
      - UNKNOWN status triggers investigation action in the plan
      - Executive summary actionable without reading dependency details

      RUN MODE EXECUTION:
      - QUICK: executive summary + at-risk/blocked list + top action + state delta
      - DISCOVERY: signal plan (dependency tracking tool access, partner PM contact, status meeting schedule)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) dependency health with count distribution, (2) highest-impact at-risk or blocked dependency and its downstream effect, (3) single most urgent mitigation action with owner and timeline.

  performance_scorecard:
    id: partner-performance-scorecard
    name: "Partner Performance Scorecard"
    description: "Generate partner performance scorecard with metric collection, benchmark comparison, trend analysis, and improvement actions"
    domain: program_health
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name
      - name: scorecard_metrics
        required: true
        description: Defined scorecard metrics with targets and current values
      - name: benchmark_data
        required: false
        description: Peer partner benchmarks for comparison
      - name: prior_scorecard
        required: false
        description: Previous scorecard for trend analysis
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Generating performance scorecard for {partner_name}.
      Scorecard metrics: {scorecard_metrics}
      Benchmark data: {benchmark_data}
      Prior scorecard: {prior_scorecard}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are producing a performance scorecard that measures partner contribution and effectiveness. The scorecard drives performance conversations, tier decisions, and investment allocation.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If scorecard_metrics is ABSENT, DEFER: cannot generate scorecard without defined metrics.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: METRIC COLLECTION
      Document current performance for each defined metric.
      For each metric:
      - Metric name and category (Revenue, Pipeline, Delivery, Engagement, Enablement)
      - Target value
      - Actual value
      - Variance (actual vs. target, percentage and absolute)
      - Status: EXCEEDS (>110% of target) / MEETS (90-110%) / BELOW (70-89%) / CRITICAL (<70%)
      - Measurement source and date
      - Confidence: VERIFIED (system data) / ESTIMATED (calculated) / ASSUMED (self-reported)
      If a metric has no actual value available, state "DATA NOT AVAILABLE" rather than estimating.
      Deliverable: Scorecard table (Metric | Category | Target | Actual | Variance | Status | Source | Confidence).

      STEP 2: BENCHMARK COMPARISON
      If benchmark_data is available, compare partner performance to peers.
      For each metric:
      - Partner value
      - Peer median
      - Peer top quartile
      - Percentile rank
      - Position: LEADER / ABOVE AVERAGE / AVERAGE / BELOW AVERAGE / LAGGING
      If benchmark_data is ABSENT, state "Benchmark comparison not available, peer data not provided."
      Deliverable: Benchmark table (Metric | Partner | Peer Median | Top Quartile | Percentile | Position).

      STEP 3: TREND ANALYSIS
      If prior_scorecard is available, compare current to previous period.
      For each metric:
      - Previous value and period
      - Current value
      - Delta (absolute and percentage)
      - Trend: IMPROVING / STABLE / DECLINING
      - Driver of change
      If prior_scorecard is ABSENT, state "Trend analysis not available, first scorecard period."
      Deliverable: Trend table (Metric | Previous | Current | Delta | Trend | Driver).

      STEP 4: SCORECARD GENERATION
      Produce the composite scorecard.
      - Overall score: weighted average across all metrics (state weights and methodology)
      - Overall status: EXCEEDS / MEETS / BELOW / CRITICAL
      - Confidence: minimum confidence across all metrics
      - Top 3 strengths (highest-performing metrics)
      - Top 3 improvement areas (lowest-performing metrics)
      - Trend summary: IMPROVING / STABLE / DECLINING / INSUFFICIENT DATA
      Deliverable: Composite scorecard (Overall Score | Status | Confidence | Strengths | Improvement Areas | Trend).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - Every defined metric has an explicit value or "DATA NOT AVAILABLE" (no silent omissions)
      - Variance calculated in both absolute and percentage terms
      - Weights stated and justified for composite scoring
      - Confidence is the minimum across all metrics, not an average
      - Trend analysis uses time-separated data or declares "first period"
      - Improvement areas include root cause, not just "metric X is below target"
      - Executive summary actionable without reading metric details

      RUN MODE EXECUTION:
      - QUICK: executive summary + composite scorecard + top improvement action + state delta
      - DISCOVERY: signal plan (metric data sources, measurement methodology, benchmark sources)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) overall scorecard status and score with confidence, (2) weakest metric and its root cause, (3) single most impactful improvement action with owner and expected score impact.

  program_review:
    id: partner-program-review
    name: "Comprehensive Partner Program Review"
    description: "Cross-dimension program health review for QBR or leadership, covering pipeline contribution, certification status, engagement trends, and program ROI"
    domain: program_health
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name
      - name: review_period
        required: true
        description: Period under review (e.g., Q1 2026, H1 2026)
      - name: pipeline_data
        required: true
        description: Partner-influenced and partner-sourced pipeline data
      - name: certification_status
        required: false
        description: Current certification and compliance status
      - name: engagement_history
        required: false
        description: Engagement signals and health check history for the period
      - name: financial_data
        required: false
        description: Partner program costs, revenue attribution, and ROI inputs
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Comprehensive program review for {partner_name}.
      Review period: {review_period}
      Pipeline data: {pipeline_data}
      Certification status: {certification_status}
      Engagement history: {engagement_history}
      Financial data: {financial_data}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are producing a comprehensive partner program review suitable for QBR presentation or leadership briefing. The review synthesizes data across multiple dimensions to assess program health and inform investment decisions.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If pipeline_data is ABSENT, DEFER: pipeline contribution is the core measure of program value.
      Note which optional inputs are absent and what dimensions will be incomplete.
      Deliverable: Input Gate table + Run Mode declaration + data coverage note.

      STEP 1: CROSS-DIMENSION ANALYSIS
      Assess program health across five dimensions.
      For each dimension, provide a status (GREEN / YELLOW / RED / GRAY) and summary:
      1. Pipeline Contribution: partner-sourced and partner-influenced pipeline vs. targets
      2. Revenue Impact: closed revenue through partner motions, attribution accuracy
      3. Enablement Status: certification coverage, training completion, maturity level
      4. Engagement Quality: communication, responsiveness, strategic alignment
      5. Program Compliance: contract adherence, reporting, governance
      Each dimension: status, key metric, confidence, supporting evidence.
      If data is ABSENT for a dimension, score as GRAY with note on what data is needed.
      Deliverable: Cross-dimension summary table (Dimension | Status | Key Metric | Confidence | Evidence).

      STEP 2: PIPELINE CONTRIBUTION
      Detail the partner's pipeline contribution.
      - Partner-sourced pipeline: count, value, win rate
      - Partner-influenced pipeline: count, value, win rate
      - Pipeline velocity: average days in each stage for partner deals vs. non-partner deals
      - Contribution to overall pipeline: percentage of total
      - Target vs. actual: variance and status
      Deliverable: Pipeline contribution table (Metric | Target | Actual | Variance | Status | Confidence).

      STEP 3: CERTIFICATION STATUS
      If certification_status is available, summarize certification health.
      - Total certifications: active, expiring, expired
      - Compliance with tier requirements
      - Certification depth vs. breadth
      If ABSENT, state "Certification status not included, data not provided."
      Deliverable: Certification summary (Total | Active | Expiring | Expired | Tier Compliance).

      STEP 4: ENGAGEMENT TRENDS
      If engagement_history is available, show engagement trajectory.
      - Health score trend over the review period
      - Communication frequency and quality trend
      - Issue count and resolution time trend
      - Escalation frequency
      If ABSENT, state "Engagement trend data not available for this period."
      Deliverable: Engagement trend table (Period | Health Score | Communication Quality | Issues | Escalations).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - All five dimensions assessed with explicit status (GREEN/YELLOW/RED/GRAY)
      - GRAY dimensions documented with specific data requests
      - Pipeline contribution split between partner-sourced and partner-influenced
      - Win rates compared to non-partner baseline where available
      - Trends use multi-period data or state "single period, no trend"
      - Review is balanced (strengths and gaps), not advocacy or criticism
      - Executive summary suitable for leadership consumption (no jargon, quantified claims)

      RUN MODE EXECUTION:
      - QUICK: executive summary + cross-dimension summary + top action + state delta
      - DISCOVERY: signal plan (per-dimension data sources, reporting contacts, system access needed)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) overall program health with dimension status distribution, (2) pipeline contribution vs. target with win rate, (3) single highest-priority recommendation for the next period with owner.

# ============================================================================
# RISK PROMPTS
# ============================================================================
risk:

  risk_identification:
    id: partner-risk-identification
    name: "Partner Risk Identification"
    description: "Identify and classify partner risks through signal scanning, risk classification at high/medium/low, impact assessment, and mitigation options"
    domain: risk
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name
      - name: engagement_status
        required: true
        description: Current engagement status and recent signals
      - name: market_signals
        required: false
        description: External market signals (partner financials, M&A activity, leadership changes)
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Identifying risks for partner {partner_name}.
      Engagement status: {engagement_status}
      Market signals: {market_signals}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are scanning for risks that the partner relationship introduces to the business. The output drives mitigation planning and escalation decisions. Every risk must have evidence, not assumption.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If engagement_status is ABSENT, DEFER: cannot assess risk without baseline engagement data.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: SIGNAL SCANNING
      Scan for risk signals across six categories.
      For each category, identify available signals:
      1. Delivery Risk: missed deadlines, quality issues, scope creep, resource gaps
      2. Relationship Risk: communication breakdown, strategic misalignment, champion loss
      3. Financial Risk: partner financial instability, pricing disputes, payment issues
      4. Competitive Risk: partner engaging with competitors, channel conflict, divided loyalty
      5. Compliance Risk: certification lapses, contract violations, regulatory exposure
      6. Strategic Risk: M&A activity, leadership changes, market position shifts
      For each signal:
      - Signal description
      - Category assignment (primary + secondary if applicable)
      - Polarity: NEGATIVE / NEUTRAL / EARLY WARNING
      - Confidence: VERIFIED / ESTIMATED / ASSUMED with source
      If no signals in a category, state "No risk signals detected in [category]."
      Deliverable: Signal table (Signal | Primary Category | Secondary | Polarity | Confidence | Source).

      STEP 2: RISK CLASSIFICATION
      For each identified risk signal, classify severity.
      - Risk description (specific scenario, not generic label)
      - Likelihood: HIGH / MEDIUM / LOW with rationale
      - Impact: HIGH / MEDIUM / LOW with specific consequences
      - Combined severity: HIGH (any H+H or H+M) / MEDIUM (M+M or M+L) / LOW (L+L)
      - Time horizon: IMMEDIATE (< 30 days) / NEAR-TERM (30-90 days) / LONG-TERM (> 90 days)
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Risk classification table (Risk | Likelihood | Impact | Severity | Time Horizon | Confidence).

      STEP 3: IMPACT ASSESSMENT
      For each HIGH and MEDIUM severity risk, assess business impact.
      - Revenue at risk (quantified where possible)
      - Deal impact (specific deals affected)
      - Relationship damage (escalation required, trust erosion)
      - Operational impact (resource reallocation, timeline changes)
      - Reputational exposure
      Deliverable: Impact detail table (Risk | Revenue at Risk | Deals Affected | Relationship Impact | Operational Impact | Reputational Exposure).

      STEP 4: MITIGATION OPTIONS
      For each HIGH and MEDIUM severity risk, propose mitigation strategies.
      For each option:
      - Mitigation action
      - Risk reduction: what severity level this brings the risk to
      - Owner
      - Timeline
      - Prerequisites
      - Cost or resource requirement
      Deliverable: Mitigation table (Risk | Action | Target Severity | Owner | Timeline | Prerequisites | Cost).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - All six risk categories scanned (even if no signals found, explicitly stated)
      - Risks are specific scenarios, not generic labels ("partner may lose AWS certification by Q2" not "certification risk")
      - Likelihood and impact scored independently, combined severity follows stated rules
      - Impact quantified where data allows (revenue, deal count), estimated where not
      - Mitigation options include target severity level (what risk becomes after mitigation)
      - No risks fabricated: every risk has a signal source
      - Executive summary actionable without reading classification details

      RUN MODE EXECUTION:
      - QUICK: executive summary + HIGH severity risks + top mitigation action + state delta
      - DISCOVERY: signal plan (per-category monitoring sources, market intelligence contacts, review cadence)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) total risk count with severity distribution and confidence, (2) highest-severity risk and its business impact, (3) single most urgent mitigation action with owner and timeline.

  issue_resolution:
    id: partner-issue-resolution
    name: "Partner Issue Resolution Plan"
    description: "Plan resolution for a partner issue with documentation, root cause analysis, resolution options with tradeoffs, and an owned action plan"
    domain: risk
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name
      - name: issue_description
        required: true
        description: Description of the partner issue to resolve
      - name: current_impact
        required: true
        description: Current business impact of the issue
      - name: previous_attempts
        required: false
        description: Prior resolution attempts and their outcomes
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Resolving issue with {partner_name}: {issue_description}
      Current impact: {current_impact}
      Previous attempts: {previous_attempts}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are planning resolution for a specific partner issue. The output drives the resolution process with clear options, ownership, and timeline. Analysis must be fact-based and blame-free.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If issue_description is ABSENT, DEFER: cannot plan resolution without issue definition.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: ISSUE DOCUMENTATION
      Document the issue with precision.
      - Observable symptoms (what is happening)
      - First occurrence date or detection date
      - Affected parties (internal teams, customer, partner)
      - Scope: ISOLATED (single account) / LIMITED (few accounts) / SYSTEMIC (pattern across accounts)
      - Severity: CRITICAL / HIGH / MEDIUM / LOW
      - Severity rationale (quantified where possible)
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Issue summary (Symptom | First Seen | Affected | Scope | Severity | Confidence).

      STEP 2: ROOT CAUSE ANALYSIS
      Identify the root cause(s) of the issue.
      For each potential root cause:
      - Description
      - Supporting evidence
      - Counter-evidence
      - Probability: HIGH / MEDIUM / LOW
      - Recurring: YES / NO (has this pattern occurred before?)
      Assign one primary root cause for resolution targeting. Note secondary contributors.
      If root cause cannot be determined, list hypotheses ranked by probability and define diagnostic steps.
      Deliverable: Root cause table (Cause | Supporting Evidence | Counter Evidence | Probability | Recurring | Primary/Secondary).

      STEP 3: RESOLUTION OPTIONS
      Present 2-4 resolution options with analysis.
      For each option:
      - Option description
      - Pros (specific benefits)
      - Cons (specific drawbacks)
      - Timeline to implement
      - Resource requirements
      - Success probability: HIGH / MEDIUM / LOW with confidence
      - Dependencies or prerequisites
      - Relationship impact: POSITIVE / NEUTRAL / NEGATIVE
      Recommend one option with justification and fallback if it fails.
      Deliverable: Resolution options table (Option | Pros | Cons | Timeline | Resources | Success Probability | Prerequisites | Relationship Impact) + Recommendation.

      STEP 4: ACTION PLAN WITH OWNERS
      Detail the execution plan for the recommended option.
      For each action:
      - Action description
      - Owner (named role or individual)
      - Timeline (start date, due date)
      - Prerequisites (what must be true before this action starts)
      - Success criterion (how to know this action worked)
      - Escalation trigger (what happens if this action fails)
      Deliverable: Action plan table (Priority | Action | Owner | Start | Due | Prerequisites | Success Criterion | Escalation Trigger).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - Issue symptoms distinguished from root cause (not conflated)
      - Root cause analysis includes counter-evidence, not just confirmation bias
      - Resolution options include relationship impact assessment
      - Recommended option has justification and fallback plan
      - Action plan includes escalation triggers, not just actions
      - Tone is factual and blame-free throughout
      - Executive summary actionable without reading full analysis

      RUN MODE EXECUTION:
      - QUICK: executive summary + recommendation + top action + state delta
      - DISCOVERY: signal plan (diagnostic data to collect, stakeholders to interview, root cause investigation steps)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) issue severity and root cause confidence, (2) recommended resolution option and its success probability, (3) single most urgent first action with owner and timeline.

  escalation_prep:
    id: partner-escalation-prep
    name: "Partner Escalation Package"
    description: "Prepare a structured escalation package with issue history, impact documentation, previous resolution attempts, and a specific escalation recommendation"
    domain: risk
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name
      - name: issue_description
        required: true
        description: Issue being escalated
      - name: issue_history
        required: true
        description: Timeline of the issue from first occurrence to present
      - name: previous_attempts
        required: true
        description: Prior resolution attempts and their outcomes
      - name: current_impact
        required: true
        description: Current business impact of the unresolved issue
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Preparing escalation package for issue with {partner_name}.
      Issue: {issue_description}
      Issue history: {issue_history}
      Previous attempts: {previous_attempts}
      Current impact: {current_impact}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are preparing an escalation package for a partner issue that has not been resolved through normal channels. The package must be compelling, evidence-based, and include a specific ask that leadership can act on.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If issue_description or current_impact is ABSENT, DEFER: escalation requires both issue definition and impact quantification.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: ISSUE HISTORY
      Document the chronological timeline of the issue.
      For each event:
      - Date
      - Event description
      - Participants
      - Outcome
      - Evidence reference (email, ticket, meeting notes)
      Timeline must show that normal resolution channels were exhausted.
      Deliverable: Issue timeline table (Date | Event | Participants | Outcome | Evidence).

      STEP 2: IMPACT DOCUMENTATION
      Quantify the current business impact.
      - Revenue impact: at risk, delayed, or lost (amount, confidence)
      - Timeline impact: project delays, milestone slippage (days/weeks)
      - Customer impact: satisfaction risk, relationship damage
      - Resource cost: internal time spent managing the issue (hours or FTE equivalent)
      - Reputational exposure: competitive risk, reference-ability impact
      Each impact area: quantification with confidence (HIGH / MEDIUM / LOW) and basis.
      Deliverable: Impact table (Impact Area | Description | Quantification | Confidence | Basis).

      STEP 3: PREVIOUS ATTEMPTS
      Document all resolution attempts before escalation.
      For each attempt:
      - Date and approach
      - Who was involved (names and roles)
      - Partner response
      - Why it did not resolve the issue
      - Evidence of good-faith effort
      This section must demonstrate that escalation is warranted, not premature.
      Deliverable: Attempts table (Date | Approach | Participants | Partner Response | Why Unsuccessful | Evidence).

      STEP 4: ESCALATION RECOMMENDATION
      Define the escalation request.
      - Specific ask: what action is needed from escalation recipients
      - Desired outcome: what success looks like
      - Escalation target: who should receive this (name, role, or level)
      - Timeline required: by when must this be resolved
      - Consequences of inaction: what happens if the issue persists
      - Recommended tone and approach: collaborative, firm, or formal
      Deliverable: Escalation recommendation (Ask | Outcome | Target | Timeline | Consequences | Approach).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - Issue timeline is chronological with evidence references at every step
      - Impact quantified where data exists, estimated with confidence where not
      - Previous attempts documented with enough detail to demonstrate good faith
      - Escalation ask is specific and actionable, not "please help"
      - Consequences of inaction are factual, not threatening or emotional
      - Package is executive-ready: professional tone, no jargon, quantified claims
      - Executive summary is self-sufficient: reader can decide whether to escalate from summary alone

      RUN MODE EXECUTION:
      - QUICK: executive summary + impact summary + escalation ask + state delta
      - DISCOVERY: signal plan (evidence collection, impact quantification, stakeholder mapping for escalation path)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) the issue, its duration, and why escalation is warranted, (2) quantified business impact with confidence, (3) the specific ask with timeline and escalation target.

  channel_conflict:
    id: partner-channel-conflict
    name: "Channel Conflict Detection and Assessment"
    description: "Detect and assess channel conflict through territory overlap analysis, deal registration conflict check, impact assessment, and resolution recommendation"
    domain: risk
    inputs:
      - name: partner_name
        required: true
        description: Partner organization name (or names if conflict is between partners)
      - name: territory_data
        required: true
        description: Territory assignments, account ownership, and coverage maps
      - name: deal_registrations
        required: true
        description: Deal registrations from all involved parties
      - name: channel_policies
        required: false
        description: Channel conflict resolution policies and rules of engagement
      - name: account_state
        required: true
        description: Current account state object
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Detecting channel conflict involving {partner_name}.
      Territory data: {territory_data}
      Deal registrations: {deal_registrations}
      Channel policies: {channel_policies}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are detecting and assessing channel conflict to prevent partner relationship damage, customer confusion, and revenue leakage. The output drives conflict resolution and policy enforcement.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If territory_data and deal_registrations are both ABSENT, DEFER: conflict detection requires at least one data source.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: TERRITORY OVERLAP ANALYSIS
      Identify accounts or regions where multiple parties have overlapping coverage.
      For each overlap:
      - Account or territory name
      - Party A coverage claim (partner, direct sales, or another partner)
      - Party B coverage claim
      - Overlap type: GEOGRAPHIC / ACCOUNT / VERTICAL / PRODUCT LINE
      - Documented assignment: which party has documented rights (if any)
      - Conflict severity: HIGH (active deal contention) / MEDIUM (potential future contention) / LOW (theoretical overlap, no active deals)
      If no overlaps found, state "No territory overlaps detected."
      Deliverable: Overlap table (Account/Territory | Party A | Party B | Overlap Type | Documented Rights | Severity).

      STEP 2: DEAL REGISTRATION CONFLICT CHECK
      Cross-reference deal registrations for conflicts.
      For each potential conflict:
      - Account and deal name
      - Registration by Party A: date, value, status
      - Registration by Party B: date, value, status
      - Conflict type: DUPLICATE REGISTRATION / FIRST-IN-TIME DISPUTE / SPLIT TERRITORY / PROGRAM RULE VIOLATION
      - Policy resolution: what do channel_policies say about this case? (if policies available)
      If no registration conflicts found, state "No deal registration conflicts detected."
      Deliverable: Conflict table (Account | Deal | Party A Reg | Party B Reg | Conflict Type | Policy Resolution).

      STEP 3: IMPACT ASSESSMENT
      For each identified conflict, assess business impact.
      - Revenue at risk (total deal value in dispute)
      - Partner relationship damage: which relationship(s) are at risk and why
      - Customer impact: is the customer aware of the conflict? How does it affect their experience?
      - Precedent risk: does this conflict set a pattern that will repeat?
      - Timeline urgency: when must this be resolved (deal close date, registration expiry)
      Deliverable: Impact table (Conflict | Revenue at Risk | Relationship Impact | Customer Impact | Precedent Risk | Resolution Deadline).

      STEP 4: RESOLUTION RECOMMENDATION
      For each conflict, recommend a resolution path.
      - Recommended resolution (split, first-in-time, strategic assignment, joint pursuit)
      - Rationale (based on policy, precedent, or strategic value)
      - Communication plan: who needs to be informed and in what order
      - Prevention measure: what should change to prevent recurrence
      - Escalation path: who decides if parties cannot agree
      Deliverable: Resolution table (Conflict | Resolution | Rationale | Communication Plan | Prevention | Escalation Path).

      STEP 5: ACCOUNT STATE DELTA
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS:
      - Territory overlaps assessed using documented rights, not assumptions
      - Deal registration conflicts checked against policy rules where available
      - Impact includes customer perspective, not just internal revenue dispute
      - Resolutions are fair and defensible (based on policy or precedent)
      - Prevention measures address root cause, not just this instance
      - Communication plan considers sequencing (talk to affected parties before announcing)
      - Executive summary actionable without reading conflict details

      RUN MODE EXECUTION:
      - QUICK: executive summary + active conflicts + top resolution action + state delta
      - DISCOVERY: signal plan (territory documentation, registration portal access, policy document location, stakeholder mapping)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) count of conflicts detected with severity distribution, (2) highest-impact conflict and revenue at risk, (3) single most urgent resolution action with owner and deadline.
