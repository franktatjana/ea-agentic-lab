      - Source (prior sync date or new)
      - Owner
      - Status: COMPLETE / IN PROGRESS / NOT STARTED / BLOCKED
      - Confidence: HIGH/MEDIUM/LOW with basis
      Deliverable: Action Items table (Action | Source | Owner | Status |
