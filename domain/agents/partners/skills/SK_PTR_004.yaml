# SK_PTR_004 - Partner Risk Governance
skill_id: SK_PTR_004
name: Partner Risk Governance
domain: partner-risk
owner: partner-risk-agent
description: >
  Identify and classify partner risks by severity, plan issue
  resolution with timeline and owners, prepare escalation packages
  for leadership, and detect channel conflict scenarios.
capabilities:
  - Partner risk identification and severity classification
  - Issue resolution planning with timeline and owners
  - Escalation package preparation for leadership
  - Channel conflict detection and resolution recommendation
inputs:
  - partner_name
  - account_name
  - issue_description
  - engagement_status
outputs:
  - risk_assessment_report
  - issue_resolution_plan
  - escalation_package
  - channel_conflict_report
prompts:
  - partner-risk-identification
  - partner-issue-resolution
  - partner-escalation-prep
  - partner-channel-conflict
tools:
  - read-partner-data
  - write-partner-artifact
quality_gates:
  - Every risk backed by specific evidence
  - Severity classification includes impact assessment
  - Resolution plans include timeline and owners
  - Channel conflicts cite territory and registration data
