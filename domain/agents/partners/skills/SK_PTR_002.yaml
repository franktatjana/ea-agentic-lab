# SK_PTR_002 - Partner Co-sell Execution
skill_id: SK_PTR_002
name: Partner Co-sell Execution
domain: partner-cosell
owner: partner-cosell-agent
description: >
  Identify co-sell opportunities through pipeline overlap analysis,
  coordinate deal registration, prepare joint business plans, and
  develop joint positioning for partner-involved deals.
capabilities:
  - Pipeline overlap analysis and co-sell opportunity identification
  - Deal registration coordination and attribution reconciliation
  - Joint business plan preparation with commitment tracking
  - Joint positioning and success story development
inputs:
  - partner_name
  - account_name
  - pipeline_data
  - planning_objective
outputs:
  - cosell_opportunity_report
  - deal_registration_status
  - joint_business_plan
  - joint_positioning_brief
prompts:
  - partner-cosell-opportunity
  - partner-deal-registration
  - partner-joint-planning
  - partner-joint-positioning
tools:
  - read-partner-data
  - write-partner-artifact
quality_gates:
  - All pipeline data validated against CRM
  - Co-sell recommendations include deal context
  - JBP commitments tracked against outcomes
