# SK_PTR_001 - Partner Enablement
skill_id: SK_PTR_001
name: Partner Enablement
domain: partner-enablement
owner: partner-enablement-agent
description: >
  Assess partner onboarding readiness, track certification compliance,
  identify training gaps, and evaluate partner maturity across six
  dimensions against program tier requirements.
capabilities:
  - Onboarding readiness assessment against program requirements
  - Certification compliance tracking with expiry alerting
  - Training gap analysis mapped to tier requirements
  - Partner maturity scoring (1-5) across six dimensions
inputs:
  - partner_name
  - program_tier
  - certification_data
  - training_records
outputs:
  - onboarding_readiness_report
  - certification_compliance_report
  - training_gap_analysis
  - maturity_assessment
prompts:
  - partner-onboarding-readiness
  - partner-certification-compliance
  - partner-training-gap
  - partner-maturity-assessment
tools:
  - read-partner-data
  - write-partner-artifact
quality_gates:
  - All certification dates from portal records
  - Maturity scores evidence-backed per dimension
  - Training gaps mapped to specific tier requirements
