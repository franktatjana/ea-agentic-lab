# SK_PTR_003 - Partner Program Health
skill_id: SK_PTR_003
name: Partner Program Health
domain: partner-program-health
owner: partner-program-health-agent
description: >
  Assess partner engagement health with GREEN/YELLOW/RED scoring,
  track deliverable dependencies, generate performance scorecards
  benchmarked against industry data, and produce QBR-ready program
  health reviews.
capabilities:
  - Engagement health assessment with GREEN/YELLOW/RED scoring
  - Dependency status tracking and at-risk flagging
  - Performance scorecard generation with industry benchmarks
  - QBR-ready program health review production
inputs:
  - partner_name
  - account_name
  - review_period
  - scorecard_metrics
outputs:
  - engagement_health_report
  - dependency_status_report
  - performance_scorecard
  - program_health_review
prompts:
  - partner-engagement-health
  - partner-dependency-status
  - partner-performance-scorecard
  - partner-program-review
tools:
  - read-partner-data
  - write-partner-artifact
quality_gates:
  - All metrics sourced from partner data systems
  - Engagement scores justified with signal evidence
  - Scorecards include benchmark comparison
  - Negative trends surfaced, not buried
