# CA Proof Point Management Reference
# Domain knowledge extracted to references/ per DDR-018

proof_point_types:
  - customer_quotes: "Direct attributable statements from named stakeholders"
  - validated_metrics: "Quantified outcomes with source and validation date"
  - deployment_details: "Scale, timeline, integration complexity, adoption figures"
  - roi_data: "Return on investment calculations with methodology disclosed"
  - competitive_win_stories: "Displacement narratives with before/after context"

freshness_policy:
  metric_validation_window: "12 months"
  refresh_trigger: "Metrics older than 12 months require re-validation interview"
  case_study_review_cycle: "Annual review for continued accuracy"
  stale_handling: "Archive proof points that cannot be refreshed, do not delete"

quality_standards:
  - "No fabricated or projected outcomes, all metrics must be sourced"
  - "Customer-specific language preserved, no paraphrasing without approval"
  - "All metrics include source attribution and validation date"
  - "Customer approval required before any external use"
  - "Competitive claims verified against documented win details"

usage_tracking:
  tracked_dimensions:
    - "Which proof points are used in which deals"
    - "Which sales stages consume which proof point types"
    - "Win rate correlation with proof point usage"
    - "Most requested proof points by segment"
  outcome_measurement: "Track influence on deal progression and close rates"

alignment_checks:
  - "Cross-reference proof points against current product positioning"
  - "Validate messaging alignment with latest marketing framework"
  - "Flag proof points referencing deprecated features or retired products"
  - "Ensure geographic and regulatory claims remain accurate"
  - "Sync with product marketing on competitive narrative updates"
