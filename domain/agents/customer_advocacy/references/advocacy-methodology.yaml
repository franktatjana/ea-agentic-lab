# CA Advocacy Methodology Reference
# Domain knowledge extracted to references/ per DDR-018

advocate_maturity_tiers:
  tier_1_passive:
    label: "Passive"
    description: "Consents to be named as customer"
    activities: ["logo usage", "customer list inclusion"]

  tier_2_active:
    label: "Active"
    description: "Participates in reference calls"
    activities: ["reference calls", "survey responses", "brief testimonials"]

  tier_3_champion:
    label: "Champion"
    description: "Speaks at events, co-creates content"
    activities: ["conference speaking", "webinar co-hosting", "case study co-authoring", "video testimonials"]

  tier_4_strategic:
    label: "Strategic"
    description: "Advisory board member, analyst references"
    activities: ["customer advisory board", "analyst briefing references", "joint press releases", "product co-innovation"]

case_study_framework:
  structure: "Challenge-Solution-Results"
  required_sections:
    - customer_profile: "Company overview, industry, size, geography"
    - challenge_context: "Business problem, prior state, pain points, stakes"
    - solution_implemented: "Product capabilities used, implementation approach, timeline"
    - measurable_results: "Quantified outcomes, before/after metrics, ROI"
    - customer_quote: "Direct attribution from named stakeholder"

reference_matching_dimensions:
  - industry: "Vertical alignment between prospect and advocate"
  - use_case: "Functional or technical use case similarity"
  - deployment_scale: "Comparable size, user count, or transaction volume"
  - buyer_persona: "Role and seniority match for peer credibility"
  - geography: "Regional or market relevance"

participation_thresholds:
  max_per_quarter: 4
  fatigue_detection_threshold: 3
  cooldown_after_max: "Minimum 1 quarter reduced activity"
  escalation: "Flag to advocacy manager when threshold reached"

peer_review_platforms:
  - platform: "G2"
    campaign_types: ["seasonal review drives", "post-implementation review requests"]

  - platform: "Gartner Peer Insights"
    campaign_types: ["strategic review campaigns", "analyst-aligned review timing"]

  - platform: "TrustRadius"
    campaign_types: ["category-specific campaigns", "competitive positioning reviews"]
