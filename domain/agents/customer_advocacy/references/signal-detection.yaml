# CA Signal Detection Reference
# Domain knowledge extracted to references/ per DDR-018

advocate_readiness_signals:
  keywords:
    - "strong outcomes achieved"
    - "willing to share experience"
    - "enthusiastic about product"
    - "expansion success"
    - "exceeded expectations"
    - "would recommend to peers"
    - "happy to be a reference"
    - "transformed our process"

fatigue_risk_signals:
  positive:
    - "engaged and responsive"
    - "volunteering for activities"
    - "proactive outreach"
    - "sharing success unprompted"
    - "referring new prospects"

  negative:
    - "declining reference requests"
    - "slow response times"
    - "reduced enthusiasm"
    - "complaint during reference call"
    - "requesting fewer engagements"
    - "canceling scheduled activities"
    - "delegating to junior staff"

reference_match_signals:
  match_quality_indicators:
    strong: ["exact industry match", "identical use case", "similar deployment scale", "same buyer persona", "same geography"]
    moderate: ["adjacent industry", "related use case", "comparable scale", "similar persona level"]
    weak: ["different vertical", "partial use case overlap", "mismatched scale", "geographic mismatch"]

case_study_opportunity_signals:
  triggers:
    - "strong ROI achieved"
    - "executive quote available"
    - "unique use case implemented"
    - "competitive displacement win"
    - "measurable business impact"
    - "industry-first deployment"
    - "rapid time-to-value"

coverage_gap_signals:
  pool_health_warnings:
    - "segment with fewer than 3 advocates"
    - "no recent case study for tier-1 industry"
    - "geographic blind spot in key region"
    - "no executive-level references available"
    - "single advocate covering high-demand segment"
    - "stale proof points older than 12 months"
