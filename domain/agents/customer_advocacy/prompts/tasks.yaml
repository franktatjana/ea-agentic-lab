# Customer Advocacy Agent Task Prompts
# Purpose: Full runbook prompts with numbered steps, named deliverables, and quality checks
# Reference: Agent config defined in agents/cad_agent.yaml
# Standard: docs/architecture/playbooks/runbook-design-principles.md

# ============================================================================
# ADVOCATE IDENTIFICATION & RECRUITMENT
# ============================================================================
advocate_identification:

  identify_advocate_candidates:
    name: "Identify Advocate Candidates"
    description: "Scan customer success data, score against advocacy maturity thresholds, map coverage gaps by industry/use-case/geo, and produce a ranked candidate list with recruitment priority"
    prompt: |
      Context: Advocate candidate identification needed.
      Customer portfolio: {customer_portfolio}
      Customer success data: {cs_data}
      Current advocate roster: {advocate_roster}
      Coverage requirements: {coverage_requirements}
      Industry verticals: {industry_verticals}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are identifying new advocate candidates from the customer base.
      The output drives recruitment prioritization and ensures the advocacy
      program covers critical industry, use-case, and geographic gaps.
      Every candidate score must have a basis. Every gap must have a
      remediation path. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map: for each identification dimension, assess data richness:
      - HIGH: CS data available, NPS/CSAT scores present, usage metrics, 5+ data points
      - MEDIUM: partial CS data, 2-4 data points
      - LOW: no CS data, anecdotal observations only
      Dimensions to assess: Customer Health Scores, Product Usage Depth,
      Relationship Strength, Story Potential, Current Roster Coverage.
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP identification.
      Switch to SIGNAL ACQUISITION MODE and produce instead:
      - Data sources to connect (CRM, CS platform, NPS surveys, support tickets)
      - Questions to ask CSMs about top-performing accounts
      - Observation checklist for implicit advocacy signals (unsolicited referrals, community activity, conference attendance)
      - Minimum data threshold and target date for re-assessment
      Do not proceed to remaining steps.

      STEP 1: ADVOCACY MATURITY SCORING
      Score each potential candidate across five maturity dimensions.
      For each customer:
      - Customer name and account tier
      - Health score (from CS data)
      - Product adoption depth: DEEP (5+ modules, API usage), MODERATE (3-4 modules), SHALLOW (1-2 modules)
      - Relationship tenure: months as customer, renewal history
      - Satisfaction signals: NPS score, CSAT, support ticket sentiment, executive sponsor engagement
      - Story potential: measurable outcomes achieved, transformation narrative, uniqueness of use case
      - Composite advocacy score: weighted average (adoption 25%, satisfaction 30%, story 25%, tenure 10%, relationship 10%)
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Scoring thresholds:
      - PRIME (score >= 80): ready for immediate recruitment
      - EMERGING (score 60-79): nurture before recruitment
      - DEVELOPING (score 40-59): monitor, not ready
      - UNSUITABLE (score < 40): exclude from pipeline
      If CS data is absent: state "No customer success data available. Scoring
      based on available account signals only. All scores marked as estimated."
      Deliverable: Candidate scoring table (Customer | Tier | Health | Adoption |
      Tenure | Satisfaction | Story Potential | Composite Score | Maturity Tier |
      Confidence).

      STEP 2: COVERAGE GAP ANALYSIS
      Map current advocate roster against coverage requirements.
      For each coverage dimension:
      - Dimension (Industry, Use Case, Geography, Company Size, Deployment Model)
      - Required coverage: segments that sales and marketing need references for
      - Current coverage: existing advocates mapped to each segment
      - Gap: segments with zero or insufficient advocate coverage
      - Gap severity: CRITICAL (active deals blocked), HIGH (pipeline deals need), MEDIUM (strategic), LOW (nice-to-have)
      - Candidate availability: PRIME or EMERGING candidates that could fill this gap
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      If coverage requirements are absent: state "No coverage requirements provided.
      Gap analysis based on common enterprise reference request patterns."
      Deliverable: Coverage gap matrix (Dimension | Segment | Required | Current Count |
      Gap Severity | Available Candidates | Confidence).

      STEP 3: RECRUITMENT PRIORITY RANKING
      Combine maturity scores with coverage gap urgency to produce a ranked list.
      For each candidate:
      - Rank position
      - Customer name
      - Maturity tier (from Step 1)
      - Coverage gaps filled (from Step 2)
      - Gap severity of filled segments
      - Recruitment priority: IMMEDIATE / NEXT_QUARTER / NURTURE / DEFER
      - Recruitment approach recommendation (executive ask, CSM-led, event-based)
      - Risk factors (contract renewal timing, open support issues, champion departure risk)
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Ranked candidate list (Rank | Customer | Maturity Tier | Gaps Filled |
      Gap Severity | Priority | Approach | Risk Factors | Confidence).

      STEP 4: RECRUITMENT WAVE PLAN
      Group candidates into recruitment waves with timing and resource requirements.
      For each wave:
      - Wave number and target quarter
      - Candidates included (from ranked list)
      - Recruitment method per candidate
      - Owner (CAD, CSM, AE, executive sponsor)
      - Prerequisites (relationship health check, executive alignment, legal review)
      - Expected conversion rate based on maturity tier
      - Success metrics for the wave
      Action plan:
      Priority | Action | Owner | Timeline | Prerequisites | Expected Impact
      Deliverable: Wave plan table + Action table.

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Every candidate score has a basis across all five dimensions
      - Coverage gap analysis maps against all five dimension types
      - Recruitment priority combines maturity score AND gap urgency, not just one
      - Risk factors assessed for each candidate (renewal timing, support issues, champion risk)
      - Confidence levels stated for all scores and classifications
      - Empty states handled explicitly (what is missing, what it means, proceed)
      - Action plan includes prerequisites column
      - State delta specifies field path, old value, new value, evidence
      - Trend claims reference two or more data points, or state "INSUFFICIENT DATA"
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: If Signal Acquisition Mode was triggered, produce the signal acquisition
      plan only. Otherwise, produce all deliverables as labeled sections. Lead with
      an executive summary that states: (1) total candidates identified by maturity
      tier with coverage gap fill rate, (2) the most critical unfilled coverage gap,
      and (3) the single highest-priority recruitment action.

  recruit_advocate:
    name: "Recruit Advocate"
    description: "Execute advocate recruitment for a specific customer, including value proposition, ask calibration, agreement terms, onboarding plan, and mutual benefit framework"
    prompt: |
      Context: Advocate recruitment for specific customer.
      Customer: {customer_name}
      Customer contact: {contact_name}
      Contact role: {contact_role}
      Customer success summary: {cs_summary}
      Advocacy maturity score: {maturity_score}
      Coverage gaps to fill: {coverage_gaps}
      Relationship history: {relationship_history}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are recruiting a specific customer as an advocate. This is a relationship-
      sensitive conversation that must balance our needs with genuine value for the
      advocate. The recruitment approach must be tailored to the contact's role,
      motivations, and the customer's situation. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map: for each recruitment dimension, assess data richness:
      - HIGH: CS data, relationship history, contact profile, success metrics all available
      - MEDIUM: partial data, 2-4 sources
      - LOW: no direct data, assumptions only
      Dimensions to assess: Contact Profile, Customer Health, Success Metrics,
      Relationship Strength, Motivation Indicators.
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP recruitment.
      Produce a signal acquisition plan: relationship-building activities before
      recruitment ask, information to gather from CSM and AE, observation checklist
      for advocacy readiness signals, re-assessment date. Do not proceed.

      STEP 1: CONTACT AND MOTIVATION ANALYSIS
      Profile the recruitment target and identify likely motivations.
      - Contact role and seniority level
      - Professional motivations: thought leadership, peer networking, industry visibility,
        career advancement, vendor relationship deepening
      - Personal brand goals: speaking profile, publication aspirations, community standing
      - Organizational constraints: legal/PR approval requirements, time availability,
        travel willingness, social media policy
      - Prior advocacy signals: conference attendance, social media mentions, community
        contributions, unsolicited referrals
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      If contact profile data is absent: state "Contact profile inferred from role
      title. Motivation analysis based on typical patterns for this seniority level."
      Deliverable: Contact profile with motivation map and constraint assessment.

      STEP 2: VALUE PROPOSITION DESIGN
      Craft a tailored value proposition for this specific advocate.
      For each benefit category:
      - Benefit description (specific to this contact's motivations)
      - Delivery mechanism (how we provide this benefit)
      - Exclusivity factor (available to all customers vs. advocates only)
      - Evidence of value (examples from other advocates who received this benefit)
      Benefit categories:
      - Professional visibility: speaking slots, byline opportunities, analyst briefings
      - Peer network: executive peer community, advisory board membership, private events
      - Product influence: roadmap input sessions, early access programs, beta features
      - Business value: premium support tier, dedicated CSM, training credits
      - Personal brand: co-authored content, award nominations, media opportunities
      Calibrate the ask level against the value offered:
      - LOW ask (reference call only) → basic benefits
      - MEDIUM ask (case study + 2 references/quarter) → enhanced benefits
      - HIGH ask (speaking + case study + advisory board) → premium benefits
      Deliverable: Value proposition summary with ask/benefit calibration table.

      STEP 3: RECRUITMENT CONVERSATION PLAN
      Design the recruitment conversation flow.
      - Setting recommendation: in-person, video, phone (with rationale)
      - Who should make the ask: CAD, CSM, AE, executive (with rationale)
      - Conversation structure:
        1. Appreciation and relationship context
        2. Success acknowledgment (specific metrics and outcomes)
        3. Advocacy opportunity introduction (framed as mutual benefit)
        4. Specific ask (calibrated from Step 2)
        5. Value proposition presentation
        6. Objection handling (prepared responses for common objections)
        7. Agreement terms and next steps
      - Common objections to prepare for:
        - "I don't have time" → response strategy
        - "I need to check with legal/PR" → response strategy
        - "What's in it for me?" → response strategy
        - "We're not ready to be public" → response strategy
        - "I've had a bad experience with vendor advocacy" → response strategy
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Conversation plan with objection handling playbook.

      STEP 4: AGREEMENT AND ONBOARDING PLAN
      Define the advocacy agreement terms and onboarding process.
      Agreement terms:
      - Participation scope (what activities the advocate agrees to)
      - Time commitment (hours/quarter)
      - Approval process (how we get consent before each activity)
      - Content review rights (advocate review and approval of any published content)
      - Opt-out terms (how the advocate can pause or exit)
      - Benefits delivered (mapped from Step 2)
      Onboarding plan:
      - Week 1: welcome package, program overview, preferences survey
      - Week 2: profile creation, first reference call scheduling
      - Week 3-4: first activity (lowest friction, highest value)
      - Month 2: feedback check-in, activity cadence establishment
      Action plan:
      Priority | Action | Owner | Timeline | Prerequisites | Expected Impact
      Deliverable: Agreement terms summary + Onboarding timeline + Action table.

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Value proposition tailored to contact's specific motivations, not generic
      - Ask level calibrated against benefits offered (proportional exchange)
      - Objection handling covers at least four common objections with specific responses
      - Agreement terms include opt-out provisions and content review rights
      - Onboarding plan has specific timeline with milestones
      - Confidence levels stated for all assessments
      - Empty states handled explicitly (what is missing, what it means, proceed)
      - Action plan includes prerequisites column
      - State delta specifies field path, old value, new value, evidence
      - Trend claims reference two or more data points, or state "INSUFFICIENT DATA"
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with an executive
      summary that states: (1) recruitment readiness assessment with maturity score
      and motivation alignment, (2) the primary risk to successful recruitment, and
      (3) the single most important preparation action before the recruitment conversation.

# ============================================================================
# REFERENCE MATCHING & FULFILLMENT
# ============================================================================
reference_matching:

  match_reference_to_deal:
    name: "Match Reference to Deal"
    description: "Parse deal requirements, score advocates across five match dimensions, check fatigue limits, and produce a ranked match list with talking points and backup options"
    prompt: |
      Context: Reference request for active deal.
      Deal: {deal_name}
      Deal stage: {deal_stage}
      Requesting AE: {ae_name}
      Prospect industry: {prospect_industry}
      Prospect company size: {prospect_size}
      Prospect use case: {prospect_use_case}
      Prospect deployment model: {deployment_model}
      Prospect concerns: {prospect_concerns}
      Urgency: {urgency_level}
      Advocate roster: {advocate_roster}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are matching advocates to a reference request from sales. The match
      quality directly impacts deal outcomes. A poor match wastes advocate
      goodwill and damages credibility with the prospect. Every match
      recommendation must be justified. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map: for each matching dimension, assess data richness:
      - HIGH: prospect requirements detailed, roster data current, advocate history available
      - MEDIUM: partial requirements or outdated roster data
      - LOW: no prospect details or incomplete roster
      Dimensions to assess: Prospect Requirements, Advocate Roster Completeness,
      Advocate Activity History, Fatigue Data, Talking Point Material.
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP matching.
      Produce a signal acquisition plan: data to collect from AE about prospect,
      roster data to update, advocate availability to confirm, minimum data
      threshold, target date. Do not proceed.

      STEP 1: DEAL REQUIREMENTS PARSING
      Extract and structure the reference requirements from the deal context.
      - Industry match required: exact match, adjacent, or any
      - Company size band: enterprise, mid-market, SMB
      - Use case alignment: specific product/module, deployment pattern, integration scenario
      - Deployment model: cloud, on-prem, hybrid
      - Geographic proximity: same region, same country, global acceptable
      - Seniority match: prospect evaluator role vs. advocate contact role
      - Specific concerns to address: security, scalability, migration, ROI, competitive displacement
      - Timeline constraint: when the reference call must happen
      - Format preference: live call, written testimonial, video, site visit
      If prospect concerns are absent: state "No specific concerns documented.
      Matching will prioritize industry and use-case alignment."
      Deliverable: Structured requirements profile with priority weighting.

      STEP 2: ADVOCATE MATCH SCORING
      Score each available advocate against the deal requirements across five dimensions.
      For each advocate:
      - Advocate name and company
      - Industry match score (0-100): exact industry = 100, adjacent = 60, unrelated = 20
      - Use case match score (0-100): identical use case = 100, similar = 70, partial = 40
      - Company profile match (0-100): size band + deployment model + geo proximity
      - Story relevance score (0-100): how well their success story addresses prospect concerns
      - Articulation ability (0-100): past reference performance, presentation skills, enthusiasm level
      - Composite match score: weighted average (industry 25%, use case 25%, company profile 15%,
        story relevance 20%, articulation 15%)
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      If roster data is incomplete: state which advocates lack sufficient data for
      scoring and mark their scores as "estimated."
      Deliverable: Match scoring table (Advocate | Company | Industry Match | Use Case Match |
      Profile Match | Story Relevance | Articulation | Composite Score | Confidence).

      STEP 3: FATIGUE AND AVAILABILITY CHECK
      For each top-scoring advocate, assess availability and fatigue risk.
      - Last reference activity date
      - Reference activities in last 30/60/90 days
      - Fatigue threshold: LOW (0-1 in 30 days), MODERATE (2 in 30 days),
        HIGH (3+ in 30 days or 5+ in 90 days)
      - Current availability: AVAILABLE / BUSY / ON_HOLD / OPTED_OUT
      - Upcoming commitments (conferences, case studies in progress)
      - Fatigue risk level: GREEN / YELLOW / RED
      - Recommendation: PROCEED / USE_SPARINGLY / REST_PERIOD / DO_NOT_USE
      If fatigue data is absent: state "No activity history available. Recommend
      confirming directly with advocate before scheduling."
      Deliverable: Fatigue assessment table (Advocate | Last Activity | 30-Day Count |
      90-Day Count | Fatigue Level | Availability | Recommendation).

      STEP 4: RANKED MATCH LIST WITH TALKING POINTS
      Produce the final ranked match list combining match score and availability.
      For each recommended advocate (top 3-5):
      - Rank position
      - Advocate name and company
      - Composite match score
      - Fatigue status
      - Why this advocate fits (2-3 sentences connecting their story to prospect needs)
      - Suggested talking points for the reference call (3-5 specific topics)
      - Preparation needed before the call (briefing the advocate, updating them on product changes)
      - Backup advocate if this one declines
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Action plan:
      Priority | Action | Owner | Timeline | Prerequisites | Expected Impact
      Deliverable: Ranked match list with talking points + Backup options + Action table.

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - All five match dimensions scored for every candidate advocate
      - Fatigue check performed for every recommended advocate
      - Top recommendations include specific talking points, not generic descriptions
      - Backup advocates identified for each primary recommendation
      - Match scores combine prospect-side requirements AND advocate-side capability
      - Confidence levels stated for all scores
      - Empty states handled explicitly (what is missing, what it means, proceed)
      - Action plan includes prerequisites column
      - State delta specifies field path, old value, new value, evidence
      - Trend claims reference two or more data points, or state "INSUFFICIENT DATA"
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with an executive
      summary that states: (1) top match recommendation with composite score and
      match rationale in one sentence, (2) the primary matching gap or risk, and
      (3) the single most urgent action to fulfill this reference request.

  fulfill_urgent_reference:
    name: "Fulfill Urgent Reference Request"
    description: "Handle time-critical reference requests with accelerated matching, rapid advocate outreach, fallback strategies, and same-day/next-day fulfillment tracking"
    prompt: |
      Context: Urgent reference request requiring rapid fulfillment.
      Deal: {deal_name}
      Deal stage: {deal_stage}
      Requesting AE: {ae_name}
      Deadline: {deadline}
      Prospect requirements: {prospect_requirements}
      Prospect concerns: {prospect_concerns}
      Available advocates: {available_advocates}
      Escalation context: {escalation_context}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are fulfilling an urgent reference request. Speed is critical but
      match quality cannot be sacrificed. A rushed, poorly matched reference
      is worse than a brief delay. This runbook prioritizes rapid execution
      while maintaining quality gates. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map: for each fulfillment dimension, assess data richness:
      - HIGH: prospect needs clear, advocate availability confirmed, contact info current
      - MEDIUM: partial requirements, unconfirmed availability
      - LOW: vague requirements, unknown advocate availability
      Dimensions to assess: Prospect Requirements Clarity, Advocate Availability,
      Contact Reachability, Deal Context, Fallback Options.
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP and escalate.
      Produce: minimum information needed from AE to proceed, alternative proof
      points (case studies, video testimonials) that can serve as interim references,
      escalation path, re-assessment timeline measured in hours not days.

      STEP 1: URGENCY CLASSIFICATION AND TIMELINE
      Classify the urgency and establish the fulfillment timeline.
      - Urgency tier: SAME_DAY / NEXT_DAY / WITHIN_WEEK
      - Basis for urgency (deal stage, competitive pressure, executive request)
      - Fulfillment window: hours available before deadline
      - Parallel vs. sequential: can multiple advocates be contacted simultaneously?
      - Escalation authority: who can override advocate rest periods if needed?
      - Quality floor: minimum match score acceptable given urgency
      Deliverable: Urgency classification with timeline and quality floor.

      STEP 2: RAPID MATCH AND OUTREACH PLAN
      Identify and rank available advocates with accelerated scoring.
      For each available advocate:
      - Advocate name and company
      - Match relevance (HIGH/MEDIUM/LOW based on industry + use case + concerns)
      - Current availability status
      - Last activity date and fatigue level
      - Reachability: confirmed contact method, response time history
      - Willingness indicator: past responsiveness to urgent requests
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Outreach sequence (parallel tracks):
      - Track A: top match advocate, outreach via preferred channel
      - Track B: second match advocate, outreach simultaneously
      - Track C: fallback advocate if A and B unavailable
      For each track:
      - Outreach method (phone, email, text, CSM warm introduction)
      - Message script (personalized, brief, clear ask with timeline)
      - Follow-up timing (if no response within X hours)
      - Escalation if unresponsive
      Deliverable: Rapid match table + Outreach sequence plan with scripts.

      STEP 3: FALLBACK STRATEGIES
      Define alternatives if live reference matching fails.
      For each fallback option:
      - Option type: recorded video testimonial, written case study, analyst reference,
        partner reference, executive letter, community review site link
      - Relevance to prospect concerns
      - Availability (ready now vs. needs preparation)
      - Credibility level compared to live reference
      - Time to prepare
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Rank fallback options by combination of relevance and readiness.
      Deliverable: Fallback options table (Option | Type | Relevance | Readiness |
      Credibility | Prep Time | Confidence).

      STEP 4: FULFILLMENT TRACKING AND HANDOFF
      Establish tracking for the fulfillment process.
      - Fulfillment status: OUTREACH_IN_PROGRESS / ADVOCATE_CONFIRMED /
        CALL_SCHEDULED / FALLBACK_ACTIVATED / FULFILLED / FAILED
      - SLA tracking: time from request to first outreach, time to advocate confirmation,
        time to call scheduled
      - AE communication plan: when and how to update AE on progress
      - Advocate briefing plan: pre-call preparation if advocate is confirmed
      - Post-call follow-up: thank advocate, collect feedback, update fatigue tracker
      Action plan:
      Priority | Action | Owner | Timeline | Prerequisites | Expected Impact
      Deliverable: Fulfillment tracker + AE communication plan + Action table.

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Urgency tier justified with specific deal context, not assumed
      - Quality floor defined to prevent poor matches even under time pressure
      - Parallel outreach tracks established, not sequential-only
      - Fallback strategies identified before outreach begins
      - Advocate fatigue checked even in urgent scenarios
      - Confidence levels stated for all match and availability assessments
      - Empty states handled explicitly (what is missing, what it means, proceed)
      - Action plan includes prerequisites column
      - State delta specifies field path, old value, new value, evidence
      - Trend claims reference two or more data points, or state "INSUFFICIENT DATA"
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with an executive
      summary that states: (1) urgency tier with fulfillment deadline and top
      advocate recommendation, (2) the primary risk to on-time fulfillment, and
      (3) the single most urgent action measured in hours.

# ============================================================================
# CASE STUDY PRODUCTION
# ============================================================================
case_study_production:

  produce_case_study:
    name: "Produce Case Study"
    description: "Plan and execute case study production from interview through multi-format publication, using Challenge-Solution-Results framework with measurable outcomes and customer approval workflow"
    prompt: |
      Context: Case study production for customer advocate.
      Customer: {customer_name}
      Advocate contact: {advocate_contact}
      Product/solution: {product_solution}
      Success metrics: {success_metrics}
      Target audience: {target_audience}
      Distribution channels: {distribution_channels}
      Customer approval process: {approval_process}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are producing a case study for a customer advocate. The case study
      is the most durable advocacy asset, serving sales, marketing, and analyst
      relations for years. Quality and accuracy are non-negotiable. Every claim
      must be verifiable. Every metric must be customer-approved. Follow these
      steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map: for each production dimension, assess data richness:
      - HIGH: success metrics quantified, interview conducted, approval process known
      - MEDIUM: partial metrics, interview not yet done, approval process unclear
      - LOW: no metrics, no interview access, unknown approval requirements
      Dimensions to assess: Success Metrics, Customer Story Details, Interview Access,
      Approval Process, Distribution Requirements.
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP production.
      Produce a signal acquisition plan: metrics to collect from CSM, interview
      access to arrange, approval contacts to identify, minimum content threshold,
      target date. Do not proceed.

      STEP 1: INTERVIEW PLANNING
      Design the customer interview to extract a compelling narrative.
      - Interview participants: advocate contact, technical lead, executive sponsor
      - Interview format: video call (for potential video clips), duration 45-60 min
      - Pre-interview brief to advocate: topics to prepare, metrics to have ready
      - Interview guide structured around Challenge-Solution-Results:
        CHALLENGE questions (5-7):
        - What business problem or pain point existed before?
        - What was the quantified impact of the problem (cost, time, risk)?
        - What alternatives were considered and why were they insufficient?
        - Who were the stakeholders affected?
        - What was the urgency or catalyst for change?
        SOLUTION questions (5-7):
        - Why was our solution selected over alternatives?
        - How was the implementation approached (phases, timeline)?
        - What was the team's experience during deployment?
        - What surprised you (positively or negatively) during implementation?
        - How does the solution integrate with existing systems?
        RESULTS questions (5-7):
        - What measurable outcomes have been achieved (with specific numbers)?
        - How has the solution changed daily operations?
        - What is the ROI or payback period?
        - What unexpected benefits emerged?
        - What would you tell a peer evaluating similar solutions?
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Interview plan with question guide and participant list.

      STEP 2: NARRATIVE DRAFT (CHALLENGE-SOLUTION-RESULTS)
      Structure the case study draft using the CSR framework.
      - Title: outcome-focused, not company-name-focused (e.g., "40% Reduction in
        Deployment Time" not "Company X Uses Product Y")
      - Executive summary: 2-3 sentences capturing the full story arc
      - CHALLENGE section:
        - Business context and pain point (2-3 paragraphs)
        - Quantified impact of the problem
        - Stakeholders affected
        - Previous approaches and their limitations
      - SOLUTION section:
        - Why our solution was selected (buying criteria)
        - Implementation approach and timeline
        - Key capabilities leveraged
        - Integration with existing environment
      - RESULTS section:
        - Primary metric: headline number with context
        - Secondary metrics: 2-3 supporting outcomes
        - Qualitative benefits: team impact, process improvement
        - Future plans: expansion, additional use cases
      - Customer quote: direct attribution with name and title
      - Call to action: next step for readers
      Every metric must be flagged for customer verification.
      Every quote must be flagged for customer approval.
      Deliverable: CSR narrative draft with verification flags.

      STEP 3: CUSTOMER REVIEW AND APPROVAL CYCLE
      Manage the approval process to protect both accuracy and timeline.
      - Review cycle plan:
        - Draft submission to advocate contact (target date)
        - Advocate review period (5 business days standard)
        - Legal/PR review period (if required by customer, 5-10 business days)
        - Revision round (3 business days)
        - Final approval sign-off
      - Approval tracking:
        - Content element | Reviewer | Status | Due Date | Notes
        Elements: narrative text, metrics, quotes, company name usage, logo usage
      - Escalation triggers:
        - Review overdue by 5+ business days → CSM follow-up
        - Customer requests major changes → re-scope with advocate
        - Legal blocks publication → negotiate anonymized version
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Approval workflow with tracking table and escalation plan.

      STEP 4: MULTI-FORMAT PRODUCTION
      Plan production across distribution formats.
      For each format:
      - Format type: PDF (long-form), web page, one-pager, slide insert,
        video testimonial, social media snippets, analyst brief
      - Content adaptation needed
      - Design requirements
      - Production owner
      - Timeline to produce
      - Distribution channel mapping
      - SEO and discoverability plan (for web formats)
      Format priority based on target audience and distribution channels.
      Deliverable: Multi-format production plan (Format | Adaptation | Design |
      Owner | Timeline | Channel | Priority).

      STEP 5: PRODUCTION ACTION PLAN
      Consolidate all actions into a sequenced production plan.
      Action plan:
      Priority | Action | Owner | Timeline | Prerequisites | Expected Impact
      Include go/no-go gates:
      - Gate 1: interview completed with sufficient content
      - Gate 2: customer approves all metrics and quotes
      - Gate 3: legal/PR clearance obtained
      - Gate 4: final design review
      Deliverable: Production action plan with gates.

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Interview guide covers all three CSR sections with 5+ questions each
      - Every metric in the draft is flagged for customer verification
      - Every quote is flagged for customer approval
      - Approval workflow includes legal/PR path if customer requires it
      - Multi-format plan maps each format to distribution channels
      - Go/no-go gates defined at each critical dependency point
      - Confidence levels stated for all timeline and production assessments
      - Empty states handled explicitly (what is missing, what it means, proceed)
      - Action plan includes prerequisites column
      - State delta specifies field path, old value, new value, evidence
      - Trend claims reference two or more data points, or state "INSUFFICIENT DATA"
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with an executive
      summary that states: (1) case study production readiness with content availability
      and approval complexity, (2) the primary risk to on-time publication, and
      (3) the single most urgent production action.

  refresh_case_study:
    name: "Refresh Case Study"
    description: "Evaluate existing case studies for staleness, update metrics and narrative, re-validate with customer, and produce refreshed versions across all distribution formats"
    prompt: |
      Context: Case study refresh assessment.
      Customer: {customer_name}
      Existing case study: {existing_case_study}
      Case study age: {case_study_age_months}
      Current success metrics: {current_metrics}
      Product changes since publication: {product_changes}
      Customer evolution: {customer_evolution}
      Advocate contact: {advocate_contact}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are assessing whether an existing case study needs refreshing and, if so,
      planning the refresh. Stale case studies damage credibility with prospects.
      Updated case studies with current metrics outperform original versions.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map: for each refresh dimension, assess data richness:
      - HIGH: original case study available, current metrics known, product changes documented
      - MEDIUM: original available but current metrics partial
      - LOW: original case study text unavailable or customer relationship unclear
      Dimensions to assess: Original Content, Current Metrics, Product Evolution,
      Customer Relationship Status, Distribution Inventory.
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP refresh.
      Produce a signal acquisition plan: original content to locate, metrics to
      request from CSM, advocate relationship status to verify, re-assessment date.

      STEP 1: STALENESS ASSESSMENT
      Evaluate the existing case study across staleness dimensions.
      For each dimension:
      - Dimension name
      - Current state
      - Staleness indicator: CURRENT / AGING / STALE / OBSOLETE
      - Impact on credibility if not updated
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Dimensions:
      - Metrics currency: are published metrics still the best available numbers?
      - Product accuracy: do product descriptions match current capabilities?
      - Customer evolution: has the customer's use expanded beyond what's described?
      - Competitive context: do competitive differentiators still hold?
      - Visual/branding: does the design match current brand standards?
      - Contact accuracy: is the quoted person still in the same role?
      Staleness scoring:
      - 0-1 dimensions STALE/OBSOLETE → minor update
      - 2-3 dimensions STALE/OBSOLETE → significant refresh
      - 4+ dimensions STALE/OBSOLETE → full rewrite recommended
      Deliverable: Staleness assessment table (Dimension | Current State | Staleness |
      Credibility Impact | Confidence) + Overall refresh recommendation.

      STEP 2: REFRESH SCOPE DEFINITION
      Define what needs updating based on staleness assessment.
      For each content element:
      - Element (title, executive summary, challenge section, solution section,
        results section, quotes, metrics, visuals, call to action)
      - Current content summary
      - Required change: KEEP / UPDATE / REWRITE / ADD_NEW
      - Source for updated content (customer interview, CSM data, product docs)
      - Customer approval needed: YES / NO
      - Effort estimate (hours)
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Refresh scope table (Element | Current | Change Type | Source |
      Approval Needed | Effort | Confidence).

      STEP 3: CUSTOMER RE-ENGAGEMENT
      Plan the re-engagement with the advocate for updated content.
      - Advocate relationship status: active, dormant, at-risk, departed
      - Re-engagement approach based on status:
        - Active: direct request with appreciation for continued partnership
        - Dormant: re-engagement with value offering before ask
        - At-risk: address relationship concerns before content request
        - Departed: identify new champion, potentially new case study
      - Updated metrics collection: what specific numbers to request
      - New quote opportunity: updated quote reflecting longer-term outcomes
      - Approval process: confirm current legal/PR requirements
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Re-engagement plan with approach strategy and metrics request.

      STEP 4: REFRESH PRODUCTION PLAN
      Plan the production of refreshed content across formats.
      - Content refresh timeline (writing, review, approval, production)
      - Format inventory: list all existing formats and their refresh needs
      - Distribution update: channels where old version must be replaced
      - SEO impact: URL preservation, redirect strategy, metadata update
      - Retirement plan for obsolete versions
      Action plan:
      Priority | Action | Owner | Timeline | Prerequisites | Expected Impact
      Deliverable: Refresh production plan + Format inventory + Action table.

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - All six staleness dimensions assessed with specific evidence
      - Refresh scope specifies change type per content element, not a blanket "update all"
      - Re-engagement approach calibrated to advocate relationship status
      - Format inventory covers all existing distribution channels
      - Retirement plan for obsolete versions included
      - Confidence levels stated for all assessments
      - Empty states handled explicitly (what is missing, what it means, proceed)
      - Action plan includes prerequisites column
      - State delta specifies field path, old value, new value, evidence
      - Trend claims reference two or more data points, or state "INSUFFICIENT DATA"
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with an executive
      summary that states: (1) overall staleness verdict with count of stale/obsolete
      dimensions and refresh scope (minor/significant/rewrite), (2) the primary
      risk to refresh success, and (3) the single most urgent refresh action.

# ============================================================================
# PROOF POINT MANAGEMENT
# ============================================================================
proof_point_management:

  curate_proof_points:
    name: "Curate Proof Points"
    description: "Inventory, classify, and score all proof points across the advocacy portfolio, identify gaps by sales motion and deal stage, and produce a searchable proof point catalog"
    prompt: |
      Context: Proof point curation and catalog maintenance.
      Proof point inventory: {proof_point_inventory}
      Sales motions: {sales_motions}
      Deal stage requirements: {deal_stage_requirements}
      Industry coverage: {industry_coverage}
      Competitive landscape: {competitive_landscape}
      Usage analytics: {usage_analytics}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are curating the proof point catalog that sales, marketing, and
      analyst relations depend on. Proof points include case studies,
      testimonial quotes, reference customers, ROI data points, analyst
      endorsements, review site ratings, and award recognitions. The catalog
      must be complete, current, and mapped to sales needs. Follow these
      steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map: for each curation dimension, assess data richness:
      - HIGH: full inventory available, usage data present, sales motion mapping exists
      - MEDIUM: partial inventory, some usage data
      - LOW: no systematic inventory, anecdotal knowledge only
      Dimensions to assess: Current Inventory, Usage Analytics, Sales Motion Mapping,
      Competitive Coverage, Content Freshness.
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP curation.
      Produce a signal acquisition plan: inventory audit approach, data sources
      to connect, stakeholders to interview about existing proof points,
      minimum catalog threshold, target date.

      STEP 1: PROOF POINT INVENTORY AND CLASSIFICATION
      Catalog every existing proof point with structured metadata.
      For each proof point:
      - Proof point ID (PP-001, etc.)
      - Type: CASE_STUDY / TESTIMONIAL_QUOTE / REFERENCE_CUSTOMER / ROI_METRIC /
        ANALYST_ENDORSEMENT / REVIEW_SITE / AWARD / VIDEO_TESTIMONIAL / LOGO_PERMISSION
      - Customer name (or "anonymous" if NDA-restricted)
      - Industry vertical
      - Company size band
      - Use case / product area
      - Geography
      - Key metric or claim
      - Publication date
      - Freshness: CURRENT (<12 months) / AGING (12-24 months) / STALE (>24 months)
      - Customer approval status: APPROVED / EXPIRED / PENDING_RENEWAL
      - Format availability: list of formats (PDF, web, video, slide, quote card)
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      If no systematic inventory exists: state "No centralized inventory. Catalog
      built from available sources. Coverage likely incomplete."
      Deliverable: Proof point catalog table (ID | Type | Customer | Industry | Size |
      Use Case | Geo | Key Metric | Date | Freshness | Approval | Formats | Confidence).

      STEP 2: SALES MOTION GAP ANALYSIS
      Map proof points against sales motion requirements.
      For each sales motion:
      - Sales motion name (new business, expansion, competitive displacement, renewal)
      - Deal stages requiring proof points
      - Industry/vertical needs
      - Required proof point types per stage
      - Current coverage: count of available proof points per requirement
      - Gap identification: requirements with zero or insufficient proof points
      - Gap severity: CRITICAL (deals blocked), HIGH (credibility at risk),
        MEDIUM (suboptimal but workable), LOW (nice-to-have)
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      If sales motion requirements are absent: state "No formal sales motion mapping.
      Gap analysis based on standard enterprise sales cycle stages."
      Deliverable: Sales motion coverage matrix (Motion | Stage | Requirement | Type Needed |
      Current Count | Gap | Severity | Confidence).

      STEP 3: COMPETITIVE PROOF POINT ASSESSMENT
      Evaluate proof point strength against competitive claims.
      For each major competitor:
      - Competitor name
      - Their public proof points (case studies, references, analyst positioning)
      - Our comparative strength: STRONGER / COMPARABLE / WEAKER / NO_COVERAGE
      - Gaps where competitors have proof points and we do not
      - Counter-narrative opportunities: where our proof points directly refute competitor claims
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      If competitive landscape data is absent: state "Competitive proof point
      assessment based on publicly available information only."
      Deliverable: Competitive proof point comparison (Competitor | Their Strength |
      Our Strength | Comparison | Gaps | Counter-Narratives | Confidence).

      STEP 4: CATALOG HEALTH SCORECARD AND ACTION PLAN
      Produce an overall health assessment of the proof point catalog.
      - Total proof points by type
      - Freshness distribution (current/aging/stale percentages)
      - Coverage score by industry vertical (0-100)
      - Coverage score by sales motion (0-100)
      - Top 5 gaps by business impact
      - Top 5 proof points at risk (approaching staleness or approval expiry)
      Action plan:
      Priority | Action | Owner | Timeline | Prerequisites | Expected Impact
      Deliverable: Catalog health scorecard + Action table.

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Every proof point classified with structured metadata (type, industry, size, geo)
      - Freshness assessment uses objective date-based criteria, not subjective judgment
      - Sales motion gap analysis maps to specific deal stages, not generic "sales needs"
      - Competitive assessment based on observable evidence, not assumptions
      - Gap severity reflects business impact (deals blocked, credibility risk)
      - Confidence levels stated for all classifications and assessments
      - Empty states handled explicitly (what is missing, what it means, proceed)
      - Action plan includes prerequisites column
      - State delta specifies field path, old value, new value, evidence
      - Trend claims reference two or more data points, or state "INSUFFICIENT DATA"
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with an executive
      summary that states: (1) catalog health score with total proof points,
      freshness distribution, and critical coverage gaps, (2) the single most
      impactful gap affecting deals, and (3) the highest-priority curation action.

  align_proof_points:
    name: "Align Proof Points to Campaign"
    description: "Map proof points to a specific marketing campaign, product launch, or sales initiative, identify content gaps, and produce a proof point package with usage guidance"
    prompt: |
      Context: Proof point alignment to campaign or initiative.
      Campaign: {campaign_name}
      Campaign objectives: {campaign_objectives}
      Target audience: {target_audience}
      Target industries: {target_industries}
