      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are aligning proof points to a specific campaign or initiative. The
      goal is to arm the campaign with the strongest possible social proof
      for each key message and audience segment. Gaps identified here drive
      urgent proof point production. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map: for each alignment dimension, assess data richness:
      - HIGH: campaign brief detailed, proof point catalog current, audience defined
      - MEDIUM: partial campaign brief or incomplete catalog
      - LOW: vague campaign goals, no proof point inventory
      Dimensions to assess: Campaign Requirements, Proof Point Catalog, Audience Definition,
      Channel Requirements, Timeline.
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP alignment.
      Produce a signal acquisition plan: campaign brief details needed, catalog
      audit to complete, audience research to conduct, target date.

      STEP 1: KEY MESSAGE MAPPING
      Map each campaign key message to available proof points.
      For each key message:
      - Message statement
      - Target audience segment
      - Proof point type needed (metric, quote, case study, analyst endorsement)
      - Available proof points that support this message
      - Relevance score per proof point (0-100)
      - Best match recommendation
      - Gap: message without adequate proof point support
      - Gap urgency: BLOCKING (campaign cannot launch), HIGH (weakens campaign),
        MEDIUM (suboptimal), LOW (supplementary)
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Key message mapping table (Message | Audience | Type Needed |
      Available Proof Points | Best Match | Relevance Score | Gap | Gap Urgency | Confidence).

      STEP 2: AUDIENCE-CHANNEL PROOF POINT MATRIX
      Map proof points to audience segments and distribution channels.
      For each audience-channel combination:
      - Audience segment (e.g., CTO, line-of-business VP, procurement)
      - Distribution channel (e.g., email, web, event, sales enablement, analyst brief)
      - Format requirements (one-pager, video, quote card, slide)
      - Assigned proof points (from catalog)
      - Format availability: READY / NEEDS_ADAPTATION / NEEDS_CREATION
      - Production effort if not ready
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Audience-channel matrix (Audience | Channel | Format | Proof Points |
      Format Status | Effort | Confidence).

      STEP 3: GAP REMEDIATION PLAN
      For each identified gap, define the remediation approach.
      - Gap ID (from Steps 1-2)
      - Gap description
      - Remediation option A: produce new proof point (source, timeline, effort)
      - Remediation option B: adapt existing proof point (source, adaptation needed)
      - Remediation option C: alternative social proof (analyst quote, data point, award)
      - Recommended option with rationale
      - Timeline to fill gap relative to campaign launch
      - Feasibility: ACHIEVABLE_BEFORE_LAUNCH / TIGHT / POST_LAUNCH_ONLY
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Gap remediation table (Gap ID | Description | Option A | Option B |
      Option C | Recommendation | Timeline | Feasibility | Confidence).

      STEP 4: PROOF POINT PACKAGE AND USAGE GUIDE
      Assemble the final proof point package for the campaign team.
      - Package contents: list of all proof points included with metadata
      - Usage guide per proof point: when to use, with which audience, in which channel
      - Messaging alignment: how each proof point connects to campaign key messages
      - Legal/approval notes: any restrictions on usage (geography, named vs. anonymous)
      - Refresh schedule: when proof points in this package expire or need updating
      Action plan:
      Priority | Action | Owner | Timeline | Prerequisites | Expected Impact
      Deliverable: Proof point package manifest + Usage guide + Action table.

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Every campaign key message mapped to at least one proof point or flagged as gap
      - Audience-channel matrix covers all combinations, not just primary audience
      - Gap remediation offers multiple options, not single-path solutions
      - Feasibility assessment tied to campaign launch date
      - Usage guide includes legal/approval restrictions
      - Confidence levels stated for all relevance scores and feasibility assessments
      - Empty states handled explicitly (what is missing, what it means, proceed)
      - Action plan includes prerequisites column
      - State delta specifies field path, old value, new value, evidence
      - Trend claims reference two or more data points, or state "INSUFFICIENT DATA"
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with an executive
      summary that states: (1) campaign proof point coverage with percentage of
      key messages supported and critical gaps count, (2) the single most impactful
      gap that could weaken the campaign, and (3) the highest-priority remediation
      action before campaign launch.

# ============================================================================
# ADVOCATE HEALTH
# ============================================================================
advocate_health:

  assess_advocate_health:
    name: "Assess Advocate Health"
    description: "Analyze advocate participation frequency, detect fatigue signals, assess coverage gaps across the roster, assign maturity tiers, and produce health improvement recommendations"
    prompt: |
      Context: Advocate health assessment for the advocacy program.
      Advocate roster: {advocate_roster}
      Activity history: {activity_history}
      Participation metrics: {participation_metrics}
      Customer health scores: {customer_health_scores}
      Coverage requirements: {coverage_requirements}
      Program benefits delivered: {benefits_delivered}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are assessing the health of the advocate roster. Advocate burnout,
      disengagement, and coverage concentration are program-level risks that
      compound silently. This assessment must surface problems before they
      become visible through failed reference requests. Follow these steps
      in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map: for each health dimension, assess data richness:
      - HIGH: activity logs, participation counts, customer health data all available
      - MEDIUM: partial activity data, some health scores
      - LOW: no systematic tracking, anecdotal knowledge only
      Dimensions to assess: Activity Tracking, Participation Frequency,
      Customer Underlying Health, Benefits Delivery Tracking, Coverage Distribution.
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP assessment.
      Produce a signal acquisition plan: tracking systems to implement, data
      to backfill, CSM surveys to conduct, minimum tracking threshold, target date.

      STEP 1: PARTICIPATION FREQUENCY ANALYSIS
      Analyze each advocate's participation patterns over time.
      For each advocate:
      - Advocate name and company
      - Total activities (lifetime)
      - Activities in last 90 days
      - Activities in last 30 days
      - Activity types breakdown (reference calls, case studies, speaking, reviews)
      - Participation trend: INCREASING / STABLE / DECLINING / INACTIVE
      - Days since last activity
      - Average response time to requests (days)
      - Acceptance rate: percentage of requests accepted vs. declined
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Thresholds:
      - HIGHLY_ACTIVE: 3+ activities in 90 days, acceptance rate > 80%
      - ACTIVE: 1-2 activities in 90 days, acceptance rate > 60%
      - PASSIVE: 0 activities in 90 days but responded to requests
      - DORMANT: no activity or response in 90+ days
      - AT_RISK: declining trend with recent declines
      If activity history is absent: state "No activity tracking data available.
      Participation analysis based on available records only."
      Deliverable: Participation table (Advocate | Company | Total | 90-Day | 30-Day |
      Types | Trend | Last Activity | Response Time | Acceptance Rate | Status | Confidence).

      STEP 2: FATIGUE DETECTION
      Identify advocates showing fatigue signals.
      Fatigue indicators (check each):
      - Request volume exceeds 3 per 30 days or 8 per quarter
      - Declining acceptance rate (compare last 90 days vs. prior 90 days)
      - Increasing response time (compare last 90 days vs. prior 90 days)
      - Reduced enthusiasm in feedback or post-activity surveys
      - Requests for "a break" or reduced involvement
      - Customer health score declining simultaneously
      - Champion role change or departure signals
      For each advocate showing fatigue signals:
      - Advocate name
      - Fatigue signals present (list specific indicators)
      - Fatigue severity: EARLY_WARNING / MODERATE / SEVERE
      - Root cause hypothesis (overuse, insufficient value return, role change, product issues)
      - Recommended intervention:
        EARLY_WARNING → reduce request frequency, increase value delivery
        MODERATE → mandatory rest period, relationship re-engagement
        SEVERE → pause all requests, executive-level relationship repair
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Fatigue detection table (Advocate | Signals | Severity | Root Cause |
      Intervention | Confidence).

      STEP 3: COVERAGE GAP AND CONCENTRATION ANALYSIS
      Assess roster coverage against program requirements.
      - Total advocates by industry, use case, geography, company size
      - Coverage concentration: identify segments over-dependent on 1-2 advocates
      - Single point of failure: segments where losing one advocate eliminates coverage
      - Coverage gaps: segments with zero advocate coverage
      - Upcoming risk: advocates with renewal in next 6 months, advocates with
        departing champions, advocates with declining health scores
      For each coverage segment:
      - Segment (industry/use case/geo/size)
      - Advocate count
      - Concentration risk: HEALTHY (3+), CONCENTRATED (2), SINGLE_POINT (1), NONE (0)
      - At-risk advocates in segment
      - Projected coverage in 6 months
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Coverage analysis table (Segment | Advocate Count | Concentration Risk |
      At-Risk | 6-Month Projection | Confidence).

      STEP 4: MATURITY TIER ASSESSMENT
      Assign each advocate to a maturity tier based on holistic assessment.
      Tiers:
      - CHAMPION: highly active, strong relationship, willing to do high-visibility activities,
        proactively refers peers, low fatigue
      - ENGAGED: regularly active, responsive, participates in requested activities,
        moderate visibility comfort
      - WILLING: accepts occasional requests, low-friction activities only,
        needs nurturing to increase engagement
      - PASSIVE: enrolled but rarely participates, responds slowly, may be disengaging
      - AT_RISK: showing fatigue, declining participation, relationship issues,
        or underlying customer health problems
      For each advocate:
      - Maturity tier assignment with basis
      - Tier movement since last assessment: PROMOTED / STABLE / DEMOTED / NEW
      - Recommended actions to maintain or improve tier
      Deliverable: Maturity tier table (Advocate | Company | Tier | Movement |
      Basis | Recommended Actions).

      STEP 5: HEALTH IMPROVEMENT ACTION PLAN
      Produce a prioritized action plan for roster health improvement.
      Focus areas:
      - Fatigue intervention (advocates needing immediate attention)
      - Re-engagement (dormant advocates worth reactivating)
      - Coverage gap filling (recruitment priorities from gap analysis)
      - Value delivery (benefits owed but not yet delivered)
      - Relationship deepening (advocates ready for tier promotion)
      Action plan:
      Priority | Action | Owner | Timeline | Prerequisites | Expected Impact
      Deliverable: Health improvement action plan.

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Participation analysis uses quantitative thresholds, not subjective assessment
      - Fatigue detection checks all seven indicator types
      - Coverage analysis identifies single points of failure, not just gaps
      - Maturity tier assignment has explicit basis for each advocate
      - 6-month projection considers renewal dates, champion departure signals, health trends
      - Confidence levels stated for all tier assignments and risk assessments
      - Empty states handled explicitly (what is missing, what it means, proceed)
      - Action plan includes prerequisites column
      - State delta specifies field path, old value, new value, evidence
      - Trend claims reference two or more data points, or state "INSUFFICIENT DATA"
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with an executive
      summary that states: (1) roster health overview with tier distribution,
      fatigue count, and coverage gap count, (2) the single highest-risk advocate
      or coverage gap, and (3) the most urgent health intervention action.

# ============================================================================
# SPEAKER PIPELINE
# ============================================================================
speaker_pipeline:

  manage_speaker_pipeline:
    name: "Manage Speaker Pipeline"
    description: "Build and manage a pipeline of customer speakers for conferences, webinars, and events, matching advocates to opportunities by topic, audience, and speaking readiness"
    prompt: |
      Context: Speaker pipeline management for upcoming events.
      Event calendar: {event_calendar}
      Speaking opportunities: {speaking_opportunities}
      Advocate roster: {advocate_roster}
      Speaker history: {speaker_history}
      Topic requirements: {topic_requirements}
      Speaker readiness assessments: {readiness_assessments}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are managing the customer speaker pipeline. Customer speakers
      are the highest-impact advocacy activity, delivering credibility at
      scale. Speaker placement requires matching topic expertise, audience
      relevance, speaking ability, and availability. Poor speaker placement
      damages both the event and the advocate relationship. Follow these
      steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map: for each pipeline dimension, assess data richness:
      - HIGH: event calendar confirmed, speaker history available, readiness assessed
      - MEDIUM: partial event list, some speaker history
      - LOW: no event calendar, no speaker tracking data
      Dimensions to assess: Event Calendar, Speaking Opportunities Detail,
      Speaker History, Readiness Data, Topic Coverage.
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP pipeline work.
      Produce a signal acquisition plan: event calendar sources, speaker tracking
      to implement, readiness assessment process to design, target date.

      STEP 1: SPEAKING OPPORTUNITY INVENTORY
      Catalog all upcoming speaking opportunities with requirements.
      For each opportunity:
      - Event name, date, location (in-person/virtual/hybrid)
      - Audience size and composition (practitioners, executives, mixed)
      - Topic requirement or open call for papers
      - Format: keynote, breakout, panel, fireside chat, webinar, podcast
      - Submission deadline (if CFP)
      - Speaker support offered (travel, coaching, co-presentation)
      - Strategic value: HIGH (tier-1 industry event), MEDIUM (regional/vertical),
        LOW (webinar/podcast)
      - Submission status: OPEN / SUBMITTED / ACCEPTED / DECLINED / WAITLISTED
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Speaking opportunity table (Event | Date | Location | Audience |
      Topic | Format | Deadline | Value | Status | Confidence).

      STEP 2: SPEAKER READINESS ASSESSMENT
      Evaluate each potential speaker advocate across readiness dimensions.
      For each advocate with speaker potential:
      - Advocate name and company
      - Topic expertise areas (mapped to opportunity requirements)
      - Speaking experience: EXPERIENCED (5+ public talks), DEVELOPING (1-4 talks),
        NOVICE (no public speaking history)
      - Presentation skills: STRONG / ADEQUATE / NEEDS_COACHING
      - Story strength: how compelling their customer story is for the target audience
      - Availability for speaking: EAGER / WILLING / SELECTIVE / UNAVAILABLE
      - Travel willingness: YES / LIMITED / NO
      - Legal/PR constraints: any employer restrictions on public speaking
      - Fatigue status (from advocate health assessment)
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Speaker readiness table (Advocate | Company | Topics | Experience |
      Skills | Story Strength | Availability | Travel | Constraints | Fatigue | Confidence).

      STEP 3: SPEAKER-OPPORTUNITY MATCHING
      Match speakers to opportunities based on multi-dimensional fit.
      For each opportunity:
      - Top 3 speaker candidates
      - For each candidate:
        - Topic fit score (0-100)
        - Audience relevance (0-100): speaker profile resonates with event audience
        - Speaking readiness (0-100): experience + presentation skills
        - Availability (CONFIRMED / TENTATIVE / UNCONFIRMED)
        - Composite fit score: weighted average (topic 30%, audience 30%, readiness 25%, availability 15%)
        - Risk factors (first-time speaker, travel logistics, competing commitments)
        - Speaker preparation needed (coaching, rehearsal, content development support)
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Speaker-opportunity match table (Opportunity | Speaker | Topic Fit |
      Audience Fit | Readiness | Availability | Composite | Risks | Prep Needed | Confidence).

      STEP 4: SPEAKER DEVELOPMENT AND PIPELINE PLAN
      Plan speaker development for pipeline health.
      - Speaker pipeline health: ratio of ready speakers to upcoming opportunities
      - Development needs:
        - Advocates who need speaking coaching
        - Topics without any qualified speaker
        - Geographic gaps (no speakers available for regional events)
      - Speaker development program:
        - Coaching sessions planned
        - Co-presentation opportunities (pair novice with experienced)
        - Content development support (slide templates, story frameworks)
        - Practice opportunities (internal events, webinars before main stage)
      Action plan:
      Priority | Action | Owner | Timeline | Prerequisites | Expected Impact
      Deliverable: Pipeline health summary + Development plan + Action table.

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Every speaking opportunity has at least one matched speaker candidate
      - Speaker readiness assessment covers experience, skills, AND fatigue status
      - Matching uses multi-dimensional scoring, not just topic fit
      - Development plan addresses novice speakers with specific coaching actions
      - Pipeline health ratio calculated (ready speakers : opportunities)
      - Confidence levels stated for all fit scores and readiness assessments
      - Empty states handled explicitly (what is missing, what it means, proceed)
      - Action plan includes prerequisites column
      - State delta specifies field path, old value, new value, evidence
      - Trend claims reference two or more data points, or state "INSUFFICIENT DATA"
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with an executive
      summary that states: (1) pipeline health with count of upcoming opportunities,
      matched speakers, and unmatched gaps, (2) the highest-priority unfilled
      speaking slot, and (3) the single most urgent speaker pipeline action.

# ============================================================================
# PROGRAM METRICS
# ============================================================================
program_metrics:

  report_program_roi:
    name: "Report Program ROI"
    description: "Calculate and report advocacy program ROI including influenced pipeline, reference-assisted win rates, cost per advocate, and program maturity metrics with trend analysis"
    prompt: |
      Context: Advocacy program ROI reporting.
      Reporting period: {reporting_period}
      Program budget: {program_budget}
      Advocate roster size: {roster_size}
      Activity log: {activity_log}
      Influenced pipeline: {influenced_pipeline}
      Reference-assisted deals: {reference_assisted_deals}
      Win rate data: {win_rate_data}
      Program costs: {program_costs}
      Prior period metrics: {prior_period_metrics}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are producing the advocacy program ROI report. This report justifies
      program investment and guides resource allocation. Every metric must be
      traceable to source data. Correlation claims must be clearly distinguished
      from causation. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map: for each ROI dimension, assess data richness:
      - HIGH: pipeline data, win rates, cost data, activity logs all available
      - MEDIUM: partial pipeline data or incomplete cost tracking
      - LOW: no systematic tracking, estimates only
      Dimensions to assess: Pipeline Attribution, Win Rate Data, Cost Data,
      Activity Volume, Prior Period Comparison.
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP reporting.
      Produce a signal acquisition plan: tracking systems needed, data integration
      with CRM, minimum data collection period before meaningful ROI reporting,
      interim metrics to track, target date.

      STEP 1: ACTIVITY VOLUME METRICS
      Quantify program activity during the reporting period.
      - Total advocacy activities completed
      - Breakdown by type:
        - Reference calls completed
        - Case studies published (new + refreshed)
        - Speaking engagements delivered
        - Peer review contributions
        - Video testimonials produced
        - Analyst reference calls
      - Advocate utilization: percentage of roster that participated
      - Request fulfillment rate: requests received vs. fulfilled
      - Average time to fulfill reference requests (days)
      - Activity trend vs. prior period: increase/decrease with percentage
      If prior period data is available: compute trend. If only one period exists:
      state "First reporting period. Trend data insufficient."
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Activity metrics table (Type | Count | Prior Period | Trend | Confidence).

      STEP 2: PIPELINE AND REVENUE IMPACT
      Calculate the advocacy program's influence on pipeline and revenue.
      - Advocacy-influenced pipeline: total value of deals where advocacy
        activity occurred (reference call, case study shared, speaker event attended)
      - Attribution model: state the attribution methodology used
        (first touch, last touch, multi-touch, self-reported by AE)
      - Reference-assisted win rate vs. overall win rate
      - Win rate delta: percentage point difference
      - Revenue influenced: closed-won revenue from reference-assisted deals
      - Average deal size comparison: reference-assisted vs. non-assisted
      - Deal velocity comparison: average sales cycle length with vs. without references
      Important: clearly label whether metrics show correlation or causation.
      State "Reference-assisted deals show X% higher win rate. This is a correlation.
      Causation would require controlled experiment."
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Pipeline impact table (Metric | Value | Prior Period | Trend |
      Attribution Method | Confidence) + Revenue impact summary.

      STEP 3: COST AND EFFICIENCY ANALYSIS
      Calculate program cost efficiency.
      - Total program cost (staff, technology, events, benefits delivered to advocates)
      - Cost per advocate (total cost / active roster size)
      - Cost per activity (total cost / total activities)
      - Cost per influenced dollar (total cost / influenced pipeline value)
      - ROI calculation: (influenced revenue - program cost) / program cost
      - Benchmark comparison (if industry benchmarks available)
      - Budget utilization: actual vs. planned spend
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      If cost data is incomplete: state which cost categories are missing and
      mark ROI calculation as "partial, based on available cost data."
      Deliverable: Cost analysis table (Metric | Value | Prior Period | Trend |
      Benchmark | Confidence).

      STEP 4: PROGRAM MATURITY ASSESSMENT
      Assess overall program maturity across dimensions.
      For each dimension:
      - Dimension name
      - Maturity level: INITIAL / DEVELOPING / ESTABLISHED / OPTIMIZED
      - Evidence for maturity level
      - Next maturity target
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Dimensions:
      - Roster depth: advocate count, coverage breadth, tier distribution
      - Process maturity: request handling, matching, fulfillment SLAs
      - Content engine: case study production cadence, freshness maintenance
      - Technology: advocate tracking, analytics, self-service portal
      - Executive alignment: leadership support, budget stability, strategic integration
      - Advocate experience: satisfaction, benefit delivery, relationship health
      Deliverable: Maturity scorecard (Dimension | Level | Evidence | Next Target | Confidence).

      STEP 5: RECOMMENDATIONS AND INVESTMENT CASE
      Synthesize findings into recommendations.
      - Program strengths (evidence-based, not aspirational)
      - Program weaknesses (with impact quantified where possible)
      - Investment recommendations for next period:
        - Maintain: what's working and should continue
        - Increase: where additional investment would yield returns
        - Reduce: where spending exceeds value
        - Introduce: new capabilities or initiatives to add
      Action plan:
      Priority | Action | Owner | Timeline | Prerequisites | Expected Impact
      Deliverable: Recommendations + Investment case + Action table.

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Pipeline attribution methodology stated, not assumed
      - Correlation vs. causation clearly labeled for all impact claims
      - ROI calculation shows formula and inputs, not just result
      - Cost analysis covers all program cost categories or states what is missing
      - Maturity assessment has evidence for each dimension rating
      - Trend claims reference two or more data points, or state "INSUFFICIENT DATA"
      - Confidence levels stated for all metrics and assessments
      - Empty states handled explicitly (what is missing, what it means, proceed)
      - Action plan includes prerequisites column
      - State delta specifies field path, old value, new value, evidence
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with an executive
      summary that states: (1) program ROI with influenced pipeline value and
      reference-assisted win rate delta, (2) the program's weakest dimension or
      biggest efficiency gap, and (3) the single highest-impact investment
      recommendation for next period.

# ============================================================================
# PEER REVIEW CAMPAIGNS
# ============================================================================
peer_review_campaigns:

  coordinate_peer_review:
    name: "Coordinate Peer Review Campaign"
    description: "Plan and execute peer review campaigns on third-party sites (G2, Gartner Peer Insights, TrustRadius), including candidate identification, outreach, sentiment monitoring, and response management"
    prompt: |
      Context: Peer review campaign coordination.
      Review sites: {review_sites}
      Current review status: {current_review_status}
      Advocate roster: {advocate_roster}
      Customer segments: {customer_segments}
      Competitive review landscape: {competitive_reviews}
      Campaign timeline: {campaign_timeline}
      Prior campaign results: {prior_campaign_results}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are coordinating a peer review campaign on third-party review sites.
      Reviews on sites like G2, Gartner Peer Insights, and TrustRadius
      influence buyer decisions independent of vendor marketing. Campaign
      execution must balance volume goals with authenticity and site compliance.
      Manufactured or incentivized reviews violate most site policies and
      destroy credibility. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Availability Map: for each campaign dimension, assess data richness:
      - HIGH: current review counts, competitive data, advocate roster current, prior campaigns documented
      - MEDIUM: partial review data, some competitive intel
      - LOW: no review site data, no prior campaign history
      Dimensions to assess: Current Review Inventory, Competitive Review Landscape,
      Reviewer Candidate Pool, Site Compliance Requirements, Prior Campaign Results.
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP campaign planning.
      Produce a signal acquisition plan: review site accounts to set up, baseline
      review audit to conduct, competitive review analysis to run, compliance
      policies to review, target date.

      STEP 1: REVIEW SITE INVENTORY AND COMPETITIVE BASELINE
      Assess current standing on each target review site.
      For each review site:
      - Site name (G2, Gartner Peer Insights, TrustRadius, etc.)
      - Current review count
      - Average rating
      - Review freshness: percentage from last 12 months
      - Category/segment ranking
      - Competitive comparison:
        - Top 3 competitors: their review count, average rating, freshness
        - Our relative position: LEADING / COMPETITIVE / TRAILING / ABSENT
      - Review sentiment themes (positive and negative)
      - Minimum review threshold for category recognition or badge eligibility
      - Gap to next tier or badge
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      If competitive data is absent: state "Competitive review baseline based on
      publicly available data only."
      Deliverable: Review site inventory (Site | Count | Rating | Freshness | Ranking |
      Competitive Position | Sentiment Themes | Gap to Badge | Confidence).

      STEP 2: REVIEWER CANDIDATE IDENTIFICATION
      Identify customers to invite for reviews, ensuring authenticity.
      Candidate selection criteria:
      - Active product users (not just purchasers)
      - Have not reviewed in last 12 months on target site
      - Customer health score above threshold (do not invite dissatisfied customers)
      - Represent diverse segments (industry, size, use case, geography)
      - Not currently in fatigue zone from other advocacy activities
      For each candidate:
      - Customer name and contact
      - Product usage depth
      - Health score
      - Segment representation
      - Review site preference (if known)
      - Prior review history (have they reviewed us or competitors before?)
      - Outreach priority: HIGH / MEDIUM / LOW
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Compliance check:
      - Confirm site policies on solicited reviews
      - Confirm no monetary incentives offered (gift cards, discounts)
      - Confirm reviewer independence (no script, no required rating)
      Deliverable: Candidate list (Customer | Contact | Usage | Health | Segment |
      Site | Prior Reviews | Priority | Confidence) + Compliance checklist.

      STEP 3: CAMPAIGN OUTREACH PLAN
      Design the outreach campaign for review solicitation.
      - Campaign timeline: start date, outreach waves, target completion
      - Volume targets per site (realistic based on candidate pool)
      - Outreach method per wave:
        - Wave 1: email from CSM (warmest relationship)
        - Wave 2: in-app prompt or post-interaction survey redirect
        - Wave 3: event-based ask (post-conference, post-training)
      - Message templates per wave (personalized, non-prescriptive):
        - Acknowledge relationship and value delivered
        - Explain why peer reviews matter to the community
        - Provide direct link to review site
        - No suggested rating or talking points (authenticity requirement)
      - Follow-up cadence: one reminder max, respectful of decline
      - Opt-out handling: immediate removal from campaign
      - Confidence level (HIGH/MEDIUM/LOW with basis)
      Deliverable: Outreach plan (Wave | Method | Candidates | Message Template |
      Timeline | Volume Target | Confidence).

      STEP 4: SENTIMENT MONITORING AND RESPONSE MANAGEMENT
      Plan ongoing monitoring during and after the campaign.
      - Monitoring cadence: daily during active campaign, weekly ongoing
      - Metrics to track:
        - New reviews posted (count and rating)
        - Sentiment distribution (positive, neutral, negative)
        - Response rate from outreach (invited vs. posted)
        - Competitive movement (did competitors also run campaigns?)
      - Response management:
        - Positive reviews: thank publicly on site (if site allows), internal recognition
        - Neutral reviews: acknowledge feedback, note for product team
        - Negative reviews: immediate escalation to CS, root cause analysis,
          response draft for vendor reply (factual, empathetic, solution-oriented)
        - Fraudulent/inaccurate reviews: site reporting process
      - Post-campaign analysis:
        - Conversion rate (invited vs. reviewed)
        - Net rating impact
        - Competitive position change
        - Lessons for next campaign
      Action plan:
      Priority | Action | Owner | Timeline | Prerequisites | Expected Impact
      Deliverable: Monitoring plan + Response playbook + Action table.

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Data Availability Map completed first, Signal Acquisition Mode check performed
      - Compliance with review site policies verified before outreach planning
      - No incentivized review tactics included (violates site policies)
      - Outreach messages do not prescribe ratings or suggest specific content
      - Negative review response plan included with escalation path
      - Candidate selection filters out unhealthy accounts
      - Campaign volume targets are realistic given candidate pool size
      - Confidence levels stated for all assessments and projections
      - Empty states handled explicitly (what is missing, what it means, proceed)
      - Action plan includes prerequisites column
      - State delta specifies field path, old value, new value, evidence
      - Trend claims reference two or more data points, or state "INSUFFICIENT DATA"
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Produce all deliverables as labeled sections. Lead with an executive
      summary that states: (1) current review site standing with ratings, counts,
      and competitive position per site, (2) the highest-priority review gap or
      competitive vulnerability, and (3) the single most urgent campaign action.
