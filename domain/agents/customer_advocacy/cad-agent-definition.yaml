        trigger: Advocate shows declining health score, open support escalation, or dissatisfaction signals
        context_passed: Advocate participation history, recent reference activities, observed sentiment shift
        receiver_action: CA investigates customer health and determines if advocacy activities should pause
      - agent: ae-agent
        trigger: Reference activity surfaces upsell signal or contract renewal context
        context_passed: Customer enthusiasm level, expanded use case mentions, willingness for deeper engagement
        receiver_action: AE evaluates commercial opportunity without compromising advocacy relationship
      - agent: senior-manager-agent
        trigger: Legal or PR blocks case study approval beyond SLA, or advocate pool coverage drops below threshold
        context_passed: Blocked content details, approval timeline, coverage gap analysis
        receiver_action: Senior Manager escalates through appropriate channels
      - agent: marketing-agent
        trigger: Content production needs exceed advocacy team capacity or require campaign-level coordination
        context_passed: Available customer stories, proof point assets, advocate availability windows
        receiver_action: Marketing coordinates production resources and campaign integration
      provide_to:
      - agent: ae-agent
        trigger: Reference request for active deal or competitive situation
        context_passed: Ranked advocate matches with context, talking points, participation history, and suggested approach
        receiver_action: AE coordinates reference call with prospect and provides feedback on outcome
      - agent: ca-agent
        trigger: Advocate identification signals or customer success milestones that indicate advocacy readiness
        context_passed: Advocate maturity criteria met, suggested tier placement, recommended first activity
        receiver_action: CA validates customer readiness and supports advocacy onboarding conversation
      - agent: ve-agent
        trigger: Technical proof point request or architecture reference need
        context_passed: Technical case studies, deployment architecture details, performance metrics from customer environments
        receiver_action: VE integrates customer evidence into technical validation and business case materials
      - agent: marketing-agent
        trigger: New case study published, proof points refreshed, or customer quote available
        context_passed: Published content, updated proof points, approved quotes with usage permissions
        receiver_action: Marketing incorporates into campaigns, website, and sales enablement materials
      - agent: events-agent
        trigger: Customer speaker nomination for event, webinar, or analyst engagement
        context_passed: Speaker profile, topic alignment, availability, past speaking experience, preparation needs
        receiver_action: Events team coordinates logistics, session preparation, and speaker support
    human_in_the_loop_conditions:
    - Customer interview scheduling and relationship-sensitive outreach
    - Case study editorial review and final approval before publication
    - Advocate recruitment conversations requiring personal relationship building
    - Escalation when advocate signals dissatisfaction during a reference activity
    - Legal and PR negotiation on case study content and approval terms
    escalation_triggers:
    - Advocate with open support escalation receives a reference request
    - Proof point library has zero coverage for an industry generating active pipeline
    - Case study approval blocked by legal or PR beyond 10 business days
    - Top-tier advocate declines participation or signals disengagement
    - Reference fulfillment rate drops below 80% for two consecutive weeks
