activity_map:
  purpose: >
    The Customer Advocate role spans six knowledge domains and several operational functions
    that together sustain a healthy, high-performing reference program. Each domain below
    maps to a distinct accountability: building the advocate pool, matching references to
    active deals, producing case studies, keeping proof points current, measuring program
    impact, managing peer review presence, coordinating customer speakers, and covering
    emerging segments. The two specialized agents split this work by orientation: proactive
    covers pipeline-building and gap-closing functions, analytical covers measurement and
    alignment functions. Separating these modes prevents reactive fulfillment pressure from
    crowding out the strategic program development that keeps the library ahead of sales needs.
  domains:
  - domain: Advocate Identification and Recruitment
    why: >
      Advocate pools decay over time as champions change roles, companies get acquired, or
      customers become less willing to participate. Without a continuous recruitment motion
      tied to customer success signals, the pool concentrates in a handful of overused
      advocates while willing customers with strong outcomes sit unrecognized. Coverage gaps
      in emerging verticals or geographies surface only when deals are already in progress,
      too late to recruit the right reference.
    agent: cad-agent-proactive
    activities:
    - Scan customer success data for new advocate candidates meeting maturity thresholds
    - Evaluate candidate fit by industry, use case, deployment scale, and persona alignment
    - Initiate outreach coordination and onboarding workflow for approved candidates
    - Assign initial maturity tier and configure participation preferences
    - Track maturity progression and flag candidates ready for tier advancement
    cadence: Continuous scan with weekly candidate review cycle
  - domain: Reference Matching and Fulfillment
    why: >
      Reference requests arrive with five or more matching dimensions (industry, use case,
      scale, persona, geography) and carry deal urgency that varies from informational to
      final-stage competitive. Manual registry searches cannot reliably match all dimensions
      simultaneously, and without urgency-based prioritization, competitive late-stage
      requests wait in the same queue as routine inquiries. Slow or poor-quality matches
      stall deals and erode sales confidence in the reference program.
    agent: cad-agent-proactive
    activities:
    - Parse reference requests and extract all matching dimensions and deal urgency signals
    - Search and rank the advocate registry against request dimensions with fatigue weighting
    - Flag advocates approaching participation thresholds and surface alternative candidates
    - Deliver ranked match list with talking points and advocate context to the requesting AE
    - Record fulfillment outcome and collect post-call feedback for match quality scoring
    cadence: On-demand; SLA 48 hours per request; competitive escalations within 4 hours
  - domain: Advocate Health and Fatigue Monitoring
    why: >
      The most articulate, senior advocates attract the majority of reference requests, creating
      a utilization concentration that burns out the highest-value voices. Fatigue rarely
      announces itself; advocates stop responding gradually rather than declining formally,
      making participation frequency the only reliable leading indicator. Losing a top advocate
      damages the program disproportionately because rebuilding that trust and track record
      takes months.
    agent: cad-agent-proactive
    activities:
    - Track participation frequency per advocate against configurable quarterly thresholds
    - Generate early-warning flags when advocates approach their participation limit
    - Identify and surface underutilized advocates with profiles similar to high-demand advocates
    - Produce monthly advocate health reports with utilization distribution and coverage status
    - Recommend recognition activities for high-participation advocates to reinforce the relationship
    cadence: Continuous monitoring; monthly health report; threshold alerts triggered in real time
  - domain: Customer Speaker Pipeline Management
    why: >
      Event and webinar teams request customer speakers with short lead times, often two weeks
      before a deadline, leaving no time to vet candidates, align topics, or prepare talking points.
      Without a ready-to-activate speaker pipeline maintained ahead of requests, the advocacy team
      scrambles and risks presenting unprepared customers or declining speaker slots that could
      drive significant pipeline. A proactively maintained pipeline turns last-minute requests into
      straightforward lookups.
    agent: cad-agent-proactive
    activities:
    - Maintain a standing pipeline of pre-vetted customer speakers with topic alignment and availability windows
    - Match speaker nominations to event requirements by audience, theme, and customer profile
    - Prepare speaker briefing packages with talking points, key messages, and logistics
    - Track speaker history and rotate candidates to prevent over-exposure
    - Coordinate speaker readiness check-ins with the Events Agent ahead of confirmed engagements
    cadence: Pipeline refreshed monthly; speaker nominations delivered within 48 hours of event request
  - domain: Case Study Production and Pipeline Tracking
    why: >
      Case study production fails at the handoff points: candidate identification, interview
      scheduling, draft approval, legal clearance, and final publication each create queue
      bottlenecks that stall stories for months. Without a managed pipeline with stage tracking
      and escalation triggers, high-value stories slip through the cracks and the library fills
      with aging content while fresh wins go undocumented. The coverage gap becomes visible
      only when a sales rep searches for a story that should exist but does not.
    agent: cad-agent-analytical
    activities:
    - Identify case study candidates from closed-won deals based on outcome strength and coverage gap fit
    - Maintain the production pipeline with stage tracking from candidate to published story
    - Flag stalled stories by stage and trigger escalation for approval delays beyond SLA
    - Prioritize production backlog against proof point library gaps and upcoming campaign needs
    - Coordinate draft review workflow between advocacy, marketing, legal, and customer contacts
    cadence: Pipeline reviewed weekly; escalation triggered at 10-business-day approval delay
  - domain: Proof Point Library Curation and Freshness
    why: >
      Proof points published 12 to 18 months ago cite metrics that customers have since surpassed,
      and case studies written under old product positioning no longer map to current messaging themes.
      Sales using outdated or misaligned proof points undermines credibility with informed buyers and
      contradicts the story marketing is telling in parallel campaigns. The library only works as a
      sales asset if its content is current, validated, and indexed in a way that matches how deals
      are qualified.
    agent: cad-agent-analytical
    activities:
    - Monitor proof point freshness and flag entries with metrics older than 12 months
    - Cross-reference library content against current product positioning and messaging frameworks
    - Identify stories requiring refresh interviews to capture updated outcomes and messaging alignment
    - Validate new proof point entries for metric specificity, quote authenticity, and consent documentation
    - Maintain the library index by industry, use case, deployment scale, and persona for retrieval matching
    cadence: Freshness audit quarterly; alignment cross-reference at each major messaging update
  - domain: Reference Program Metrics and ROI Attribution
    why: >
      Reference programs are frequently measured by activity volume (calls completed, case studies
      published) rather than business impact (pipeline influenced, win rate lift). Leadership cannot
      defend program investment without attribution data linking reference activities to deal progression
      and close rates. Without systematic measurement, the program cannot demonstrate its strategic
      value or prioritize investment toward the activities that move the most pipeline.
    agent: cad-agent-analytical
    activities:
    - Track reference activity timestamps against CRM deal stage progression for attribution analysis
    - Calculate influenced pipeline value by correlating reference calls with subsequent stage movement
    - Measure win rate delta between deals with reference activity and deals without
    - Produce quarterly ROI reports with program contribution to pipeline and revenue
    - Monitor fulfillment rate, production velocity, and fatigue score as leading program health indicators
    cadence: Attribution updated weekly; quarterly ROI report; real-time fulfillment rate dashboard
  - domain: Peer Review Site Campaign Coordination
    why: >
      G2, Gartner Peer Insights, and TrustRadius ratings influence enterprise buying decisions at the
      research stage before sales ever engages. Without an active campaign to solicit reviews from
      satisfied customers, ratings stagnate while competitors with coordinated programs accumulate
      recency and volume. A single wave of disengaged reviews can drop a rating below threshold and
      change category positioning in analyst-curated reports that buyers reference directly.
    agent: cad-agent-analytical
    activities:
    - Identify review campaign candidates from the advocate pool based on satisfaction signals and review history
    - Coordinate outreach timing to comply with platform guidelines and avoid review-gating violations
    - Monitor rating trends across G2, Gartner Peer Insights, and TrustRadius with alert thresholds
    - Track review recency and volume against category competitors and analyst evaluation windows
    - Report rating trajectory and campaign outcomes to marketing and analyst relations stakeholders
    cadence: Campaign cadence quarterly; rating monitoring continuous; analyst window alerts triggered on schedule
