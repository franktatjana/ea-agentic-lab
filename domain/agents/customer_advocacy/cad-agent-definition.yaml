    - id: reference-matching-methodology
      source: internal
      type: process
      description: Multi-dimensional matching algorithm weighting industry, use case, scale, persona, and geography
    - id: proof-point-validation-guide
      source: internal
      type: guide
      description: Validation standards for customer metrics, outcome claims, and quote accuracy
    assets:
    - type: report
      name: Advocate Health Dashboard
      description: Monthly advocate pool health report showing participation distribution, fatigue risk, coverage gaps, and maturity progression
    - type: template
      name: Case Study Template
      description: Challenge-Solution-Results case study template with interview guide and metric validation checklist
    - type: report
      name: Reference Program ROI Report
      description: Quarterly attribution report connecting reference activities to influenced pipeline and win rate lift
    - type: library
      name: Proof Point Library
      description: Indexed collection of validated customer quotes, metrics, deployment details, and outcomes by industry and use case
    - type: playbook
      name: Advocate Recruitment Playbook
      description: Recruitment workflows, outreach templates, and onboarding checklists for new advocate identification
    - type: dashboard
      name: Reference Fulfillment Tracker
      description: Real-time view of open reference requests, match status, fulfillment time, and requester satisfaction
prompt_registry: {}
guardrails:
  input_validation:
  - Verify reference requests include minimum context: industry, use case, deal stage, and timeline
  - Confirm advocate consent status is current before including in any match recommendation
  - Check customer health score before recommending any advocate for a reference activity
  - Validate deal context against CRM data to ensure reference match relevance
  output_checks:
  - Every case study includes measurable outcomes with validated metrics, not just qualitative claims
  - Reference match recommendations include advocate participation history and fatigue risk assessment
  - Proof point entries cite specific, dated customer outcomes with documented consent for use
  - Advocate health reports flag any advocate exceeding participation thresholds with specific counts
  - Case study content preserves authentic customer voice rather than genericizing language
  signal_validation:
  - Advocate enthusiasm signals validated against recent participation patterns before tier advancement
  - Customer success milestones cross-referenced with CA health data before triggering advocate recruitment
  - Reference activity impact on deal progression validated against CRM stage movement before attribution
