  description: 'Proactive mode: scans for new advocate candidates, detects fatigue risk, and surfaces reference gaps before they block deals'
  agent:
    $component_ref: cad-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive advocate pipeline health. Scan customer success
      data for new advocate candidates meeting maturity thresholds. Monitor participation
      frequency to detect fatigue risk before advocates disengage. Identify coverage
      gaps by industry, use case, and geography before reference requests fail.
      Prioritize advocate pool sustainability over short-term fulfillment.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: cad-agent-analytical
  name: Customer Advocate Agent (Analytical)
  description: 'Analytical mode: deep analysis of reference program effectiveness, advocate segmentation, and proof point impact'
  agent:
    $component_ref: cad-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and program effectiveness analysis. Evaluate reference
      program ROI by tracking influenced pipeline and win rate lift. Segment the advocate
      pool by maturity tier, participation pattern, and coverage contribution. Analyze
      proof point usage and impact across deal stages. Include confidence levels and
      data quality notes.

      '
    human_in_the_loop: true
