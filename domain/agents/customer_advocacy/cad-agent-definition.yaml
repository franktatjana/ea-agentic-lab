x-ea-agent:
  profile:
    role_context: 'The Customer Advocate operates at the intersection of customer success and go-to-market
      execution. They cultivate relationships with happy customers and channel those relationships into
      references, case studies, event speakers, and peer review content. Their daily work spans recruiting
      new advocates, fulfilling reference requests from sales, producing case study content, and ensuring
      the proof point library reflects current, validated customer outcomes.

      '
    why: 'Customer Advocate teams manage advocate pools of 100-500+ customers across tiers, while fielding
      15-30 reference requests per week from sales. Between coordinating customer interviews, writing and
      approving case studies, managing peer review campaigns, and matching references to deals, the time
      for strategic program development shrinks. This agent handles advocate matching, fatigue monitoring,
      proof point curation, and content pipeline tracking so the human Customer Advocate can focus on the
      relationship building, editorial judgment, and customer interview skills that require a human touch.

      '
    goals_summary: 'The Customer Advocate succeeds when every qualified reference request gets a strong match
      within 48 hours, advocates feel valued rather than over-used, case study production keeps pace with
      customer wins, and the proof point library gives sales and marketing current, validated evidence for
      every major use case and industry.

      '
    goals:
    - Reference requests fulfilled with qualified matches within 48 hours, with 90%+ fulfillment rate
    - Case study production cadence of 2-4 new studies per quarter per major product line
    - Advocate pool health maintained with no advocate participating more than 4 times per quarter
    - Proof point library covers all tier-1 industries and top 10 use cases with metrics less than 12 months old
    - Influenced pipeline from reference activities tracked and reported quarterly with attribution
    - Advocate maturity progression moves 20% of new advocates to higher tiers within 6 months
    - Peer review site ratings maintained above 4.2 across G2, Gartner Peer Insights, and TrustRadius
    - Customer speaker pipeline provides 3+ vetted speakers per quarter for events and webinars
    role_tab_intro: 'The Customer Advocate sees customer stories from a unique vantage point: which customers
      are thriving, which stories resonate with buyers, and where the gaps in proof points cost deals. The
      challenges below are where reference programs break down because advocate pools are unbalanced, case
      study production cannot keep pace with wins, and proof points go stale before sales can use them.

      '
    human_matters_goal: 'Every reference request is matched with precision, every case study captures authentic
      customer voice, but the advocacy program endures because the human Customer Advocate built the trust,
      conducted the interviews, and exercised the editorial judgment that no agent can replicate.

      '
    human_matters_summary: 'The Customer Advocate role depends on relationship skills that cannot be automated.
      Convincing a busy VP to spend 45 minutes on a case study interview, sensing when a customer champion
      is losing enthusiasm, knowing which quotes will resonate with a CFO versus a CTO, and navigating
      internal politics to get legal and PR approval all require human empathy, persuasion, and judgment.
      The agent handles matching, tracking, and curation so the human can invest fully in the relationships
      and editorial craft that make advocacy programs succeed.

      '
    scenarios:
    - problem: Sales cannot find matching customer references for active deals
      why: 'Reference requests specify industry, use case, deployment scale, and buyer persona. With
        hundreds of advocates at different tiers and with varying availability, manually searching
        the registry for the right match takes hours. When the match is slow, deals stall because
        prospects wait for peer validation before committing.

        '
      agent: cad-agent
      agent_response: 'The agent indexes the advocate registry by industry, use case, deployment
        characteristics, persona alignment, and availability. When a reference request arrives, it
        produces a ranked list of matching advocates with participation history, consent status,
        and suggested talking points tailored to the deal context. It flags fatigue risk for
        frequently-used advocates and suggests alternatives.

        '
      success_signal:
        metric: Reference match fulfillment time
        target: Qualified reference match delivered within 48 hours of request
        leading_indicator: Sales teams submit reference requests through the system rather than ad-hoc outreach
        failure_signal: Deals stall in late stage because reference matching takes more than 5 business days
    - problem: Top advocates get over-requested and burn out
      why: 'A small number of articulate, senior advocates become the default reference for every request.
        Without systematic tracking of participation frequency, these top advocates get asked 8-12 times
        per quarter until they stop responding. Losing a top advocate damages the program far more than
        gaining three average ones.

        '
      agent: cad-agent
      agent_response: 'The agent tracks participation frequency per advocate and enforces configurable
        thresholds (default: 4 activities per quarter). When an advocate approaches their threshold,
        the agent flags the risk, suggests alternative advocates with similar profiles, and recommends
        recognition activities to reinforce the relationship. It produces monthly advocate health
        reports showing utilization distribution across the pool.

        '
      success_signal:
        metric: Advocate fatigue rate
        target: Zero advocates exceed participation threshold in any quarter
        leading_indicator: Participation distribution shows even spread across advocate pool rather than concentration
        failure_signal: Top-tier advocates decline reference requests or stop responding to outreach
    - problem: Case study production cannot keep pace with customer wins
      why: 'Every closed-won deal with strong outcomes is a potential case study, but production bottlenecks
        at every stage: identifying candidates, scheduling interviews, drafting content, getting customer
        approval, navigating legal review, and publishing. Without pipeline tracking, promising stories
        slip through the cracks and the library goes stale.

        '
      agent: cad-agent
      agent_response: 'The agent maintains a case study pipeline with stages from candidate identification
        through publication. It scans customer success data for case study candidates based on outcome
        strength, logo value, and coverage gap fit. It tracks each story through the production workflow,
        flags bottlenecks (approval delays, interview scheduling gaps), and prioritizes production based
        on proof point library gaps and upcoming campaign needs.

        '
      success_signal:
        metric: Case study production velocity
        target: 2-4 new case studies published per quarter per major product line
        leading_indicator: Case study pipeline has 3x more candidates than production target at all times
        failure_signal: Proof point library has industries or use cases with no case study less than 18 months old
    - problem: Customer stories do not align with current product positioning
      why: 'Product messaging evolves faster than case study libraries. Marketing launches new positioning
        around AI, platform consolidation, or developer experience, but existing case studies still
        highlight last year''s value propositions. Sales uses outdated proof points that contradict
        current messaging, confusing prospects.

        '
      agent: cad-agent
      agent_response: 'The agent cross-references the proof point library against current product positioning
        and messaging frameworks. It identifies stories that no longer align, flags case studies that need
        refresh interviews to capture updated outcomes, and prioritizes new case study candidates whose
        stories match current positioning themes. It produces alignment reports showing coverage gaps
        against the active messaging framework.

        '
      success_signal:
        metric: Proof point alignment to current positioning
        target: 80%+ of proof points in active use map to current messaging framework themes
        leading_indicator: Marketing references proof point library content in campaign briefs without requesting custom assets
        failure_signal: Sales creates ad-hoc customer references because library content does not match current pitch
    challenges:
    # Advocate fatigue and pool balance
    - text: A handful of articulate advocates get requested for every reference call, burning out the best voices while hundreds of willing advocates sit idle
      solved_by: cad-agent
      category: "Advocate Psychology"
      specific_overhead:
      - Manually tracking participation frequency across advocates and redistributing requests to maintain balance
    - text: Advocate enthusiasm decays silently because nobody tracks engagement signals between active reference requests
      solved_by: cad-agent
      category: "Advocate Psychology"
      specific_overhead:
      - Monitoring advocate responsiveness, sentiment, and willingness signals across touchpoints
    # Reference matching at scale
    - text: Reference requests specify five dimensions (industry, use case, scale, persona, geography) but the registry is a flat spreadsheet with inconsistent tagging
      solved_by: cad-agent
      category: "Customer Advocacy"
      specific_overhead:
      - Manually searching and cross-referencing advocate attributes against deal requirements for each request
    - text: Urgent reference requests for competitive deals get the same response time as routine requests because no prioritization framework exists
      solved_by: cad-agent
      category: "Customer Advocacy"
      specific_overhead:
      - Triaging reference requests by deal urgency, stage, and competitive pressure to allocate matching effort
    # Cross-functional coordination
    - text: Case study production stalls because five teams (advocacy, marketing, legal, PR, customer) must coordinate on approvals with no shared workflow
      solved_by: cad-agent
      category: "Case Study Production"
      specific_overhead:
      - Tracking approval status across teams, sending follow-ups, and escalating bottlenecks manually
    - text: Event teams request customer speakers two weeks before deadlines, leaving no time to vet candidates and prepare talking points
      solved_by: cad-agent
      category: "Customer Advocacy"
      specific_overhead:
      - Maintaining a ready-to-go speaker pipeline with pre-vetted topics and availability windows
    # Program ROI and measurement
    - text: Reference program influence on pipeline and win rate is unmeasured because no attribution connects reference activities to deal outcomes
      solved_by: cad-agent
      category: "Reference Program Metrics"
      specific_overhead:
      - Manually correlating reference call timestamps with deal stage progression and close dates
    - text: Leadership questions program value because metrics track activity volume (calls completed) not business impact (influenced revenue)
      solved_by: cad-agent
      category: "Reference Program Metrics"
      specific_overhead:
      - Building attribution reports that connect advocacy activities to pipeline influence and win rate lift
    # Content freshness and quality
    - text: Case studies published 18 months ago cite outdated metrics while the customer has achieved significantly better outcomes since then
      solved_by: cad-agent
      category: "Proof Point Management"
      specific_overhead:
      - Scheduling refresh interviews with existing case study customers to update metrics and outcomes
    - text: Proof points use generic language that sounds the same across all case studies instead of capturing the authentic customer voice and specific context
      solved_by: cad-agent
      category: "Proof Point Management"
      specific_overhead:
      - Reviewing and editing proof points to preserve customer-specific language and measurable outcomes
    # Coverage gaps
    - text: Three industries generate 80% of references while emerging verticals have zero referenceable customers, blocking expansion deals
      solved_by: cad-agent
      category: "Case Study Production"
      specific_overhead:
      - Analyzing advocate pool distribution against market segment priorities and recruiting to fill gaps
    - text: International deals cannot find local-language references because the advocate pool skews heavily toward North American English-speaking customers
      solved_by: cad-agent
      category: "Case Study Production"
      specific_overhead:
      - Identifying and recruiting advocates across geographies and languages to match global sales coverage
    administrative_overhead:
    - text: Searching the advocate registry to match references against deal requirements
      automated_by: cad-agent
    - text: Tracking advocate participation frequency and flagging fatigue risk
      automated_by: cad-agent
    - text: Monitoring case study pipeline stages and escalating approval bottlenecks
      automated_by: cad-agent
    - text: Cross-referencing proof point library against current product positioning for alignment gaps
      automated_by: cad-agent
    - text: Compiling advocate health reports showing pool coverage, utilization, and maturity distribution
      automated_by: cad-agent
    - text: Generating reference program metrics and attribution reports for leadership
      automated_by: cad-agent
    key_metrics:
    - 'Reference fulfillment rate: percentage of reference requests matched with qualified advocates within 48 hours'
    - 'Case study production velocity: new case studies published per quarter per product line'
    - 'Advocate fatigue score: percentage of advocates exceeding participation threshold per quarter'
    - 'Proof point freshness: percentage of library entries with validated metrics less than 12 months old'
    - 'Influenced pipeline: total pipeline value where reference activity occurred before stage progression'
    - 'Advocate pool coverage: percentage of tier-1 industries and top use cases with 3+ active advocates'
    - 'Win rate lift: win rate delta between deals with reference activity and deals without'
    - 'Advocate maturity progression: percentage of advocates advancing to higher tiers within 6 months'
    stakeholder_landscape:
      customer_side:
      - role: 'Customer champions: executives and practitioners willing to serve as references and share outcomes'
        connected_via: cad-agent
      - role: 'Customer marketing and PR contacts: approval gatekeepers for public case studies, logos, and quotes'
        connected_via: cad-agent
      internal_team:
      - role: 'Account Executives: reference request originators, deal context providers, win story sources'
        connected_via: cad-agent
      - role: 'Customer Architects: customer health signals, adoption metrics, success milestone data'
        connected_via: cad-agent
      - role: 'Value Engineers: ROI data, business case validation, technical proof points'
        connected_via: cad-agent
      - role: 'Product Marketing: messaging frameworks, positioning themes, campaign content needs'
        connected_via: cad-agent
      - role: 'Events and Field Marketing: speaker requests, webinar panelists, conference session candidates'
        connected_via: cad-agent
      - role: 'Analyst Relations: customer references for analyst inquiries, wave/quadrant evaluations'
        connected_via: cad-agent
      - role: 'Content Marketing: blog co-authors, podcast guests, long-form customer narrative sources'
        connected_via: cad-agent
    capabilities:
    - Customer reference program lifecycle management
    - Case study production using Challenge-Solution-Results framework
    - Advocate identification, recruitment, and maturity progression
    - Multi-dimensional reference matching (industry, use case, scale, persona, geography)
    - Advocate fatigue monitoring and participation load balancing
    - Proof point library curation and freshness management
    - Peer review site campaign coordination (G2, Gartner Peer Insights, TrustRadius)
    - Customer speaker pipeline management for events and webinars
    - Reference program ROI measurement and attribution reporting
    - Tiered advocate engagement model with maturity progression tracking
    playbook_raci:
