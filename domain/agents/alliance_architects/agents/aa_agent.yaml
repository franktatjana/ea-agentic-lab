# Alliance Architect Agent Configuration
# Purpose: Orchestrate technical partner ecosystem management across integration validation, solution architecture, technical enablement, and due diligence
# Sub-agents: aa-integration-validation, aa-solution-architecture, aa-technical-enablement, aa-due-diligence

agent_id: "aa_agent"
team: "alliance_architects"
category: "strategic"
purpose: "Orchestrate technical partner ecosystem management through 4 specialized sub-agents"

core_functions:
  - "Route technical partner requests to correct sub-agent"
  - "Aggregate cross-domain integration assessments"
  - "Integration validation: API compatibility, testing, version tracking, change impact"
  - "Solution architecture: joint design, reference architectures, deployment patterns, integration patterns"
  - "Technical enablement: co-sell readiness, documentation review, catalog validation, field enablement"
  - "Due diligence: technical assessment, API maturity scoring, effort estimation, risk analysis"

mechanics:
  - "Parse request for domain signals and route to sub-agent"
  - "Aggregate parallel sub-agent outputs for cross-domain views"
  - "Monitor partner platform changes for proactive alerting"

inputs:
  - "Partner API documentation and SDK references"
  - "Integration test results and certification records"
  - "Partner platform release notes and changelogs"
  - "Solution requirements and architecture context"
  - "Partner platform evaluation materials"

outputs:
  - "Compatibility assessments (API/SDK validation, version matrices)"
  - "Architecture artifacts (reference architectures, deployment patterns, integration patterns)"
  - "Enablement packages (co-sell readiness, catalog entries, field materials)"
  - "Due diligence reports (feasibility, API maturity, effort estimates, risk analysis)"

escalation_to: "Alliance Architect"

sub_agents:
  - id: "aa-integration-validation-agent"
    name: "Integration Validation"
    skill: "SK_AA_001"
  - id: "aa-solution-architecture-agent"
    name: "Solution Architecture"
    skill: "SK_AA_002"
  - id: "aa-technical-enablement-agent"
    name: "Technical Enablement"
    skill: "SK_AA_003"
  - id: "aa-due-diligence-agent"
    name: "Due Diligence"
    skill: "SK_AA_004"

playbooks:
  owned:
    - id: "PB_AA_001"
      name: "Integration Validation"
      path: "domain/playbooks/alliance_architects/PB_AA_001_integration_validation.yaml"
      description: "Continuous partner integration validation with API compatibility assessment and certification"
    - id: "PB_AA_002"
      name: "Co-sell Technical Readiness"
      path: "domain/playbooks/alliance_architects/PB_AA_002_cosell_technical_readiness.yaml"
      description: "Prepare validated technical readiness packages for joint customer engagements"
    - id: "PB_AA_003"
      name: "Partner Due Diligence"
      path: "domain/playbooks/alliance_architects/PB_AA_003_partner_due_diligence.yaml"
      description: "Technical due diligence assessment for prospective partnerships"
    - id: "PB_AA_004"
      name: "Partner Solution Catalog"
      path: "domain/playbooks/alliance_architects/PB_AA_004_partner_solution_catalog.yaml"
      description: "Maintain and validate partner solution catalog entries"
  contributes_to:
    - id: "PB_AE_002"
      name: "Account Planning"
      role: "secondary_agent"
      description: "Provides partner technical readiness status and integration capabilities"
    - id: "PB_AE_004"
      name: "Deal Progression"
      role: "secondary_agent"
      description: "Validates joint solution technical feasibility for partner-involved deals"
    - id: "PB_PTR_003"
      name: "Joint Account Planning"
      role: "secondary_agent"
      description: "Provides technical integration context and reference architectures"
    - id: "PB_HAM_001"
      name: "Hyperscaler Co-sell"
      role: "secondary_agent"
      description: "Validates marketplace listing technical requirements and co-sell readiness"
    - id: "PB_DEL_001"
      name: "Implementation Kickoff"
      role: "secondary_agent"
      description: "Provides deployment patterns, integration guides, and known issues"

skills:
  owned:
    - "SK_AA_001"
    - "SK_AA_002"
    - "SK_AA_003"
    - "SK_AA_004"

execution:
  trigger_sources:
    - "partner_platform_update_detected"
    - "api_deprecation_announced"
    - "integration_test_completed"
    - "cosell_engagement_scheduled"
    - "new_partnership_requested"
    - "catalog_review_due"
  output_destination: "{realm}/{node}/internal-infohub/alliance_architects/"
  escalation_threshold: "integration_validation_failure_detected"

personality_file: "teams/alliance_architects/personalities/aa_personality.yaml"
prompts_dir: "teams/alliance_architects/prompts"
