# Partner Technical Validation - Domain Knowledge
# Referenced by: alliance architect agent definitions requiring ISV validation, marketplace readiness, and certification assessment
# Sources: AWS ISV Partner Path, Microsoft ISV Success, Salesforce AppExchange, GCP Marketplace, Well-Architected Frameworks
# Last verified: 2026-03

description: >
  Reference knowledge for validating partner technical readiness across cloud vendor programs,
  marketplace listing requirements, and integration certification criteria. Alliance Architects
  use these frameworks to assess ISV partners against platform-specific requirements, guide
  partners through certification processes, and evaluate platform quality for joint solutions.

isv_program_technical_requirements:

  aws_foundational_technical_review:
    full_name: "AWS Foundational Technical Review (FTR)"
    source_url: "https://aws.amazon.com/partners/foundational-technical-review/"
    description: "Mandatory technical validation for AWS Partner Network ISVs, verifying that solutions meet AWS best practices for security, reliability, and operational excellence"
    requirement_categories:
      - category: "Security"
        requirements:
          - "IAM: use least-privilege policies, no wildcard (*) permissions in production"
          - "Data encryption: encrypt data at rest (KMS) and in transit (TLS 1.2+)"
          - "Secrets management: no hardcoded credentials, use AWS Secrets Manager or Parameter Store"
          - "Logging: enable CloudTrail, VPC Flow Logs, and application-level audit logging"
          - "Network security: use security groups and NACLs with minimal open ports"
      - category: "Reliability"
        requirements:
          - "Multi-AZ deployment for production workloads"
          - "Automated backup and recovery with defined RPO/RTO"
          - "Health checks and auto-scaling configuration"
          - "Disaster recovery plan documented and tested"
      - category: "Operational Excellence"
        requirements:
          - "Infrastructure as Code (CloudFormation, Terraform, CDK)"
          - "CI/CD pipeline for automated testing and deployment"
          - "Monitoring and alerting with CloudWatch or equivalent"
          - "Runbooks for common operational procedures"
          - "Incident response plan with escalation procedures"
      - category: "Cost Optimization"
        requirements:
          - "Right-sized compute resources with evidence of sizing analysis"
          - "Use of Reserved Instances or Savings Plans where applicable"
          - "Cost allocation tags for customer billing attribution"
    review_process:
      steps:
        - "Self-assessment against FTR checklist"
        - "Submit architecture diagrams and documentation"
        - "AWS partner solutions architect review"
        - "Remediation of identified gaps"
        - "Final validation and FTR approval"
      typical_duration: "4-8 weeks from initial submission to approval"
      renewal: "Annual re-validation required"

  azure_ip_cosell:
    full_name: "Azure IP Co-sell Eligible Program"
    source_url: "https://learn.microsoft.com/en-us/partner-center/co-sell-requirements"
    description: "Microsoft program enabling ISVs to co-sell with Microsoft field sellers, requiring technical validation and marketplace listing"
    technical_requirements:
      - category: "Solution Architecture"
        requirements:
          - "Solution must run on or extend Azure services"
          - "Architecture diagram showing Azure service dependencies"
          - "Deployment guide with ARM templates, Bicep, or Terraform"
          - "Support for Azure Active Directory (Entra ID) authentication"
      - category: "Marketplace Listing"
        requirements:
          - "Published transactable offer in Azure Marketplace"
          - "Minimum one pricing plan (PAYG, BYOL, or subscription)"
          - "Customer landing page with deployment instructions"
          - "Support contact and SLA documentation"
      - category: "Security and Compliance"
        requirements:
          - "SOC 2 Type II or equivalent certification"
          - "GDPR compliance documentation"
          - "Vulnerability management process with evidence"
          - "Penetration test results (within last 12 months)"
    co_sell_benefits:
      - "Visibility to Microsoft field sellers in Partner Center co-sell pipeline"
      - "Access to Microsoft-sourced leads and referrals"
      - "Joint sales engagement with Microsoft account teams"
      - "Azure consumption commitment (MACC) eligible for customer Azure spend credits"

  salesforce_security_review:
    full_name: "Salesforce AppExchange Security Review"
    source_url: "https://developer.salesforce.com/docs/atlas.en-us.packagingGuide.meta/packagingGuide/security_review_guidelines.htm"
    description: "Mandatory security assessment for all Salesforce AppExchange listings, evaluating code security, data handling, and platform compliance"
    review_areas:
      - area: "CRUD/FLS Compliance"
        description: "Enforce object-level (CRUD) and field-level security (FLS) in all data operations"
        requirements:
          - "Check isAccessible(), isCreateable(), isUpdateable(), isDeletable() before operations"
          - "Use WITH SECURITY_ENFORCED in SOQL queries"
          - "Never bypass sharing rules with 'without sharing' unless justified"
      - area: "SOQL/SOSL Injection"
        description: "Prevent injection attacks in dynamic queries"
        requirements:
          - "Use bind variables in all dynamic SOQL/SOSL queries"
          - "Use String.escapeSingleQuotes() for user-supplied input"
          - "Avoid dynamic query construction with string concatenation"
      - area: "Cross-Site Scripting (XSS)"
        description: "Prevent script injection in Visualforce and Lightning components"
        requirements:
          - "Use JSENCODE, HTMLENCODE, URLENCODE in Visualforce"
          - "Lightning Locker Service enforcement for component isolation"
          - "Content Security Policy headers on external callouts"
      - area: "Data Storage and Transmission"
        description: "Protect sensitive data at rest and in transit"
        requirements:
          - "No storage of credentials or PII in custom settings (use Custom Metadata or Named Credentials)"
          - "All external callouts over HTTPS with TLS 1.2+"
          - "Remote site settings configured for all external endpoints"
      - area: "Governor Limits"
        description: "Adherence to Salesforce platform limits"
        requirements:
          - "Bulkified triggers and batch processing for large data volumes"
          - "SOQL query count within transaction limits (100 queries)"
          - "Heap size and CPU time optimization"
    review_process:
      submission_requirements:
        - "Managed package with namespace"
        - "Completed security self-assessment questionnaire"
        - "Test org with sample data and admin credentials"
        - "Architecture document describing data flows and external integrations"
      typical_duration: "4-6 weeks for initial review, 2-4 weeks for re-review after remediation"
      annual_renewal: true

marketplace_listing_criteria:

  aws_marketplace:
    full_name: "AWS Marketplace Listing Requirements"
    source_url: "https://docs.aws.amazon.com/marketplace/latest/userguide/product-and-ami-policies.html"
    listing_types:
      - type: "AMI-based"
        requirements:
          - "AMI built on supported OS (Amazon Linux 2, Ubuntu, Windows Server)"
          - "No default passwords or hardcoded credentials"
          - "Automated provisioning via CloudFormation or Terraform"
          - "Metering integration for usage-based pricing"
      - type: "Container-based"
        requirements:
          - "Container images hosted in ECR with vulnerability scanning"
          - "Helm chart or ECS task definition for deployment"
          - "Resource limits defined for CPU and memory"
          - "Health check endpoints for container orchestration"
      - type: "SaaS"
        requirements:
          - "SaaS contract or subscription model with AWS Marketplace metering API"
          - "Customer onboarding via AWS Marketplace registration redirect"
          - "Entitlement verification via AWS Marketplace Entitlement Service"
          - "Usage reporting for pay-as-you-go models"
    common_requirements:
      - "Product description with clear value proposition and use cases"
      - "Pricing model documentation with all tiers and dimensions"
      - "End User License Agreement (EULA) or standard contract"
      - "Support policy with response time SLAs"
      - "Architecture diagram showing AWS service dependencies"
      - "Deployment guide with step-by-step instructions"

  azure_marketplace:
    full_name: "Azure Marketplace Listing Requirements"
    source_url: "https://learn.microsoft.com/en-us/partner-center/marketplace/marketplace-criteria-content-validation"
    listing_types:
      - type: "Azure Application (Managed)"
        requirements:
          - "ARM template or Bicep for resource deployment"
          - "Managed application definition with publisher and customer access controls"
          - "Metering API integration for custom meter dimensions"
          - "Notification endpoint for subscription lifecycle events"
      - type: "Azure Application (Solution Template)"
        requirements:
          - "ARM template deploying complete solution stack"
          - "No runtime access to customer subscription required"
          - "Template validation passing Azure Resource Manager checks"
      - type: "SaaS"
        requirements:
          - "SaaS fulfillment API v2 integration for subscription lifecycle"
          - "Landing page for customer configuration and onboarding"
          - "Webhook endpoint for subscription change notifications"
          - "Marketplace metering service integration for overage billing"
      - type: "Virtual Machine"
        requirements:
          - "Generalized VHD image without customer-specific configuration"
          - "Support for multiple VM sizes with recommended minimums"
          - "Azure Compute Gallery image version management"
    common_requirements:
      - "Offer listing with description, screenshots, and demo video"
      - "Technical configuration with deployment topology documentation"
      - "Plans with pricing and availability by Azure region/market"
      - "Customer leads integration (CRM connector or HTTPS endpoint)"
      - "Co-sell materials: solution one-pager and reference architecture"

  gcp_marketplace:
    full_name: "Google Cloud Marketplace Listing Requirements"
    source_url: "https://cloud.google.com/marketplace/docs/partners"
    listing_types:
      - type: "VM Solution"
        requirements:
          - "Compute Engine image with Deployment Manager or Terraform template"
          - "Automated provisioning without manual SSH access"
          - "Support for multiple machine types and regions"
          - "OS Login integration for access management"
      - type: "Kubernetes Application"
        requirements:
          - "GKE-compatible container images with Kubernetes manifests"
          - "Application CRD (Custom Resource Definition) for lifecycle management"
          - "Resource requests and limits defined"
          - "Marketplace-provided usage metering sidecar integration"
      - type: "SaaS"
        requirements:
          - "Procurement API integration for entitlement management"
          - "Partner Portal registration for offer management"
          - "SSO via Google Sign-In or SAML federation"
          - "Usage reporting API for consumption-based billing"
    common_requirements:
      - "Product listing with description, pricing, and support information"
      - "Compliance documentation: SOC 2, ISO 27001, or equivalent"
      - "Technical deployment guide and getting-started documentation"
      - "Support tiers with response time commitments"
      - "Usage and billing integration with Google Cloud billing"

well_architected_frameworks:

  aws_well_architected_isv_lens:
    full_name: "AWS Well-Architected ISV SaaS Lens"
    source_url: "https://docs.aws.amazon.com/wellarchitected/latest/saas-lens/saas-lens.html"
    description: "ISV-specific extension of AWS Well-Architected Framework addressing multi-tenancy, onboarding, billing, and operational concerns unique to SaaS providers"
    pillars:
      - pillar: "Operational Excellence"
        isv_focus:
          - "Tenant-aware monitoring: per-tenant health dashboards and alerts"
          - "Automated tenant provisioning and deprovisioning"
          - "Feature flag management for tenant-specific capabilities"
          - "Tenant impact analysis for change management"
      - pillar: "Security"
        isv_focus:
          - "Tenant isolation: compute, storage, and network boundary enforcement"
          - "Tenant-scoped IAM policies preventing cross-tenant data access"
          - "Encryption key management: shared vs. per-tenant keys"
          - "Compliance posture tracking per tenant (SOC 2, HIPAA, GDPR)"
      - pillar: "Reliability"
        isv_focus:
          - "Noisy neighbor mitigation: resource quotas and throttling per tenant"
          - "Tenant-aware auto-scaling based on individual tenant load patterns"
          - "Blast radius containment: partition tenants to limit failure impact"
          - "Tenant-specific backup and recovery with configurable RPO/RTO"
      - pillar: "Performance Efficiency"
        isv_focus:
          - "Tenant tiering: different compute/storage profiles for tier levels"
          - "Caching strategy per tenant with eviction policies"
          - "Database partitioning: silo (database per tenant) vs. pool (shared database)"
          - "CDN and edge optimization for multi-region tenant base"
      - pillar: "Cost Optimization"
        isv_focus:
          - "Per-tenant cost attribution and metering"
          - "Tenant density optimization: right-sizing shared infrastructure"
          - "Idle tenant resource management: spin down unused environments"
          - "Margin analysis by tenant tier"
      - pillar: "Sustainability"
        isv_focus:
          - "Resource utilization efficiency across tenant fleet"
          - "Right-region placement minimizing data transfer"
          - "Efficient storage tiering for tenant data lifecycle"

  azure_well_architected:
    full_name: "Azure Well-Architected Framework"
    source_url: "https://learn.microsoft.com/en-us/azure/well-architected/"
    description: "Microsoft's framework for evaluating and improving cloud workload quality across five pillars"
    pillars:
      - pillar: "Reliability"
        key_principles:
          - "Design for failure: assume any component can fail at any time"
          - "Self-healing: automated detection and recovery without human intervention"
          - "Availability targets: define and measure against composite SLA"
      - pillar: "Security"
        key_principles:
          - "Zero Trust: verify explicitly, use least privilege, assume breach"
          - "Defense in depth: multiple security layers (network, identity, data, application)"
          - "DevSecOps: integrate security into development lifecycle"
      - pillar: "Cost Optimization"
        key_principles:
          - "Provision to actual demand, not peak capacity"
          - "Monitor and optimize continuously with Azure Advisor recommendations"
          - "Use consumption-based pricing where workload patterns are variable"
      - pillar: "Operational Excellence"
        key_principles:
          - "Infrastructure as Code for repeatable, auditable deployments"
          - "Observability: logs, metrics, traces correlated for rapid diagnosis"
          - "Safe deployment practices: progressive rollout with automated rollback"
      - pillar: "Performance Efficiency"
        key_principles:
          - "Scale horizontally rather than vertically where possible"
          - "Cache aggressively at appropriate layers"
          - "Use managed services to offload undifferentiated heavy lifting"

  gcp_architecture_framework:
    full_name: "Google Cloud Architecture Framework"
    source_url: "https://cloud.google.com/architecture/framework"
    description: "Google's recommendations and best practices for designing and operating cloud workloads on Google Cloud"
    pillars:
      - pillar: "System Design"
        key_principles:
          - "Design for scale: horizontal scaling, stateless services, distributed systems"
          - "Loose coupling: event-driven communication, API contracts, service boundaries"
          - "Managed services first: use Cloud Run, Cloud Functions, BigQuery over self-managed alternatives"
      - pillar: "Operational Excellence"
        key_principles:
          - "Automate everything: deployment, scaling, monitoring, incident response"
          - "SRE practices: SLIs, SLOs, error budgets for reliability management"
          - "Blameless postmortems for continuous improvement"
      - pillar: "Security, Privacy, and Compliance"
        key_principles:
          - "BeyondCorp zero-trust access model"
          - "VPC Service Controls for data exfiltration prevention"
          - "Customer-managed encryption keys (CMEK) for sensitive workloads"
      - pillar: "Reliability"
        key_principles:
          - "Define clear SLOs before designing for reliability"
          - "Chaos engineering: regularly test failure scenarios"
          - "Multi-region active-active for critical workloads"
      - pillar: "Cost Optimization"
        key_principles:
          - "Committed use discounts for predictable workloads"
          - "Preemptible/Spot VMs for fault-tolerant batch processing"
          - "Active monitoring with billing alerts and budget controls"
      - pillar: "Performance Optimization"
        key_principles:
          - "Benchmark and profile before optimizing"
          - "Use Cloud CDN and global load balancing for latency reduction"
          - "Choose appropriate storage class for access patterns"

integration_certification_criteria:

  functional_testing:
    description: "Verify that partner integration performs all documented operations correctly under normal conditions"
    test_categories:
      - category: "Data Flow Validation"
        tests:
          - "All documented data fields map correctly between systems"
          - "Create, read, update, delete operations complete successfully"
          - "Bidirectional sync maintains data consistency within defined SLA"
          - "Bulk operations handle 10x expected volume without data loss"
      - category: "Business Logic Validation"
        tests:
          - "Workflow triggers fire on correct conditions"
          - "Conditional routing follows documented business rules"
          - "Calculated fields produce correct results across edge cases"
          - "Deduplication logic correctly identifies and merges duplicate records"
      - category: "Edge Case Handling"
        tests:
          - "Empty fields, null values, and missing optional data handled gracefully"
          - "Special characters in text fields (unicode, emoji, HTML entities) preserved"
          - "Maximum field lengths respected with appropriate truncation or rejection"
          - "Timezone handling consistent across systems"

  performance_testing:
    description: "Validate that partner integration meets throughput, latency, and resource consumption requirements under load"
    test_categories:
      - category: "Throughput"
        tests:
          - "Sustain target transactions per second for 30-minute continuous load"
          - "Burst capacity handles 3x baseline for 5-minute spikes"
          - "Batch processing completes within defined time windows"
      - category: "Latency"
        tests:
          - "API response time p95 under target at baseline load"
          - "End-to-end data propagation within defined SLA (e.g., < 5 seconds for near-real-time)"
          - "No latency degradation over 24-hour sustained operation"
      - category: "Resource Consumption"
        tests:
          - "Memory usage stable over extended operation (no memory leaks)"
          - "CPU utilization within capacity planning thresholds"
          - "Network bandwidth consumption within allocated limits"
          - "Database connection pool usage within configured maximums"

  security_testing:
    description: "Validate that partner integration meets security requirements for data protection, access control, and vulnerability management"
    test_categories:
      - category: "Authentication and Authorization"
        tests:
          - "Credentials stored securely, never logged or exposed in error messages"
          - "Token refresh and rotation handled without service interruption"
          - "Access scopes limited to minimum required permissions"
          - "Session management: timeout, invalidation, concurrent session limits"
      - category: "Data Protection"
        tests:
          - "Data encrypted in transit (TLS 1.2+ verified)"
          - "Sensitive fields masked in logs and monitoring dashboards"
          - "PII handling compliant with GDPR, CCPA requirements"
          - "Data retention and deletion policies enforced"
      - category: "Vulnerability Assessment"
        tests:
          - "OWASP API Security Top 10 assessment completed"
          - "Dependency scanning for known CVEs (no critical/high unpatched)"
          - "Static application security testing (SAST) with zero critical findings"
          - "Dynamic application security testing (DAST) on deployed integration"

  data_integrity:
    description: "Validate that data remains accurate, consistent, and complete throughout the integration lifecycle"
    test_categories:
      - category: "Consistency"
        tests:
          - "Record counts match between source and target after sync operations"
          - "Referential integrity maintained across related objects"
          - "Concurrent updates resolved per defined conflict resolution strategy"
          - "Eventually consistent systems converge within documented time window"
      - category: "Completeness"
        tests:
          - "All required fields populated after data transfer"
          - "No silent data loss during transformation or mapping"
          - "Audit trail captures all data modifications with actor and timestamp"
          - "Failed records captured in error queue with full context for remediation"
      - category: "Accuracy"
        tests:
          - "Data type conversions preserve precision (dates, decimals, currencies)"
          - "Character encoding preserved across system boundaries (UTF-8 end-to-end)"
          - "Enumeration values mapped correctly between partner and vendor systems"
          - "Calculated and derived fields recomputed correctly after source updates"

partner_platform_evaluation:

  scalability_assessment:
    description: "Evaluate partner platform ability to scale with growing customer base and data volumes"
    dimensions:
      - dimension: "Horizontal Scaling"
        evaluation_criteria:
          - "Stateless service architecture enabling instance scaling"
          - "Database sharding or partitioning strategy for data growth"
          - "Load balancing across multiple regions or availability zones"
          - "Auto-scaling policies responding to demand within 2-5 minutes"
      - dimension: "Multi-tenancy"
        evaluation_criteria:
          - "Tenant isolation model: silo, pool, or bridge"
          - "Noisy neighbor protection preventing single tenant resource monopolization"
          - "Tenant onboarding time: under 5 minutes for automated provisioning"
          - "Per-tenant resource quotas and throttling controls"
      - dimension: "Data Volume"
        evaluation_criteria:
          - "Current data volume and projected 3-year growth trajectory"
          - "Query performance at 10x current data volume"
          - "Archival and tiered storage strategy for aging data"
          - "Data migration capabilities for platform version upgrades"

  security_posture:
    description: "Evaluate partner platform security practices and compliance certifications"
    dimensions:
      - dimension: "Compliance Certifications"
        evaluation_criteria:
          - "SOC 2 Type II report (current, within last 12 months)"
          - "ISO 27001 certification (current)"
          - "Industry-specific: HIPAA BAA, PCI DSS, FedRAMP (as applicable)"
          - "GDPR and CCPA compliance documentation and DPA availability"
      - dimension: "Security Operations"
        evaluation_criteria:
          - "Vulnerability management: scan frequency, remediation SLAs"
          - "Incident response plan with documented procedures and contact chain"
          - "Penetration testing: annual third-party assessment"
          - "Bug bounty or responsible disclosure program"
      - dimension: "Access Control"
        evaluation_criteria:
          - "Role-based access control with principle of least privilege"
          - "Multi-factor authentication for administrative access"
          - "Audit logging of all administrative and data access actions"
          - "API key and credential rotation procedures"

  release_cadence:
    description: "Evaluate partner platform release management and change control practices"
    dimensions:
      - dimension: "Release Management"
        evaluation_criteria:
          - "Release frequency: weekly, biweekly, monthly, or quarterly"
          - "Release notes and changelog publication cadence"
          - "Pre-release notification to integration partners (minimum 2 weeks)"
          - "Beta/preview program for early access to breaking changes"
      - dimension: "Backward Compatibility"
        evaluation_criteria:
          - "API versioning strategy with documented deprecation policy"
          - "Minimum deprecation window (6+ months recommended)"
          - "Breaking change communication: dedicated notifications, migration guides"
          - "Compatibility testing across supported API versions"
      - dimension: "Change Control"
        evaluation_criteria:
          - "Staging environment available for partner pre-release testing"
          - "Rollback capability for failed deployments"
          - "Feature flags for gradual rollout of changes"
          - "Maintenance window communication (minimum 48 hours advance notice)"

  api_stability:
    description: "Evaluate partner API reliability, consistency, and developer experience"
    dimensions:
      - dimension: "Reliability"
        evaluation_criteria:
          - "Published uptime SLA (99.9%+ for production APIs)"
          - "Historical uptime record (status page with 12-month history)"
          - "Incident communication: real-time status page, email notifications"
          - "Defined RTO and RPO for API service recovery"
      - dimension: "Developer Experience"
        evaluation_criteria:
          - "API documentation quality: complete, accurate, with working examples"
          - "Sandbox environment for development and testing"
          - "Client SDKs available in major languages (Python, Java, Node.js, .NET)"
          - "Interactive API explorer or Postman collection"
      - dimension: "Rate Limiting and Quotas"
        evaluation_criteria:
          - "Documented rate limits per endpoint and authentication level"
          - "Rate limit headers in responses (X-RateLimit-Limit, X-RateLimit-Remaining)"
          - "Graceful degradation: 429 responses with Retry-After header"
          - "Quota increase process for partner tier upgrades"

