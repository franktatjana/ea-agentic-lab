# API Maturity Frameworks - Domain Knowledge
# Referenced by: alliance architect agent definitions requiring API assessment, governance, and lifecycle management
# Sources: Richardson/Fowler, OpenAPI Initiative, Google API Design Guide, Microsoft REST API Guidelines
# Last verified: 2026-03

description: >
  Reference knowledge for evaluating partner API maturity, governing API standards across alliances,
  and managing API lifecycles. Alliance Architects use these frameworks to assess partner technical
  readiness, define integration standards in joint solution architectures, and establish governance
  models for shared API surfaces.

richardson_maturity_model:

  overview:
    full_name: "Richardson Maturity Model"
    source_url: "https://martinfowler.com/articles/richardsonMaturityModel.html"
    author: "Leonard Richardson, described by Martin Fowler"
    description: "Four-level model for classifying REST API maturity based on how fully they leverage HTTP as an application protocol"

  levels:
    - level: 0
      name: "The Swamp of POX"
      description: "Single URI, single HTTP method (typically POST), XML or JSON payload determines operation"
      characteristics:
        - "All requests go to one endpoint"
        - "HTTP used purely as transport tunnel"
        - "Operation encoded in request body, not in URI or method"
        - "No use of HTTP status codes beyond 200 and 500"
      partner_assessment: "Legacy integration, high coupling, difficult to evolve independently"
      example: "POST /api with body {action: 'getPartner', id: '123'}"

    - level: 1
      name: "Resources"
      description: "Individual URIs for different resources, but operations still encoded in request body"
      characteristics:
        - "Distinct endpoints per resource: /partners, /integrations, /certifications"
        - "Still primarily using POST for all operations"
        - "Resource identity expressed in URI path"
        - "No semantic use of HTTP methods"
      partner_assessment: "Improved addressability, but clients still need out-of-band knowledge of operations"
      example: "POST /partners/123 with body {action: 'update', name: 'Acme'}"

    - level: 2
      name: "HTTP Verbs"
      description: "Proper use of HTTP methods (GET, POST, PUT, DELETE) and status codes for each resource"
      characteristics:
        - "GET for retrieval (safe, idempotent, cacheable)"
        - "POST for creation (returns 201 with Location header)"
        - "PUT/PATCH for updates (idempotent)"
        - "DELETE for removal (idempotent)"
        - "Appropriate status codes: 200, 201, 204, 400, 404, 409, 429"
      partner_assessment: "Production-ready for most integration scenarios, predictable behavior"
      example: "GET /partners/123 returns 200 with partner data, PUT /partners/123 updates and returns 200"

    - level: 3
      name: "Hypermedia Controls (HATEOAS)"
      description: "Responses include links and actions describing what operations are available from the current state"
      characteristics:
        - "Response bodies contain hyperlinks to related resources and available actions"
        - "Clients discover capabilities at runtime, reducing coupling to URI structure"
        - "State transitions expressed as links: self, next, related resources"
        - "Media types describe response structure and available affordances"
      partner_assessment: "Highest maturity, enables self-documenting APIs that evolve without breaking clients"
      example: "GET /partners/123 returns data plus links: {self, integrations, certifications, deactivate}"

api_lifecycle_management:

  overview:
    source_url: "https://cloud.google.com/apigee/docs/api-platform/fundamentals/api-development-lifecycle"
    description: "End-to-end management of APIs from initial design through retirement, ensuring consistent quality and partner experience"

  phases:
    - phase: "Design"
      description: "Define API contract before writing implementation code"
      activities:
        - "Document use cases and consumer personas (internal teams, partners, third-party developers)"
        - "Design resource model and endpoint structure using API-first methodology"
        - "Create OpenAPI specification with request/response schemas"
        - "Conduct design review with partner integration stakeholders"
        - "Define SLAs: latency targets, availability, rate limits, support response times"
      deliverables:
        - "OpenAPI 3.1 specification"
        - "API design review approval"
        - "SLA definition document"

    - phase: "Develop"
      description: "Implement API against the approved specification"
      activities:
        - "Generate server stubs and client SDKs from OpenAPI specification"
        - "Implement business logic with comprehensive input validation"
        - "Build automated contract tests verifying spec compliance"
        - "Configure authentication, authorization, and rate limiting"
        - "Set up logging, metrics, and distributed tracing"
      deliverables:
        - "Running API implementation"
        - "Contract test suite"
        - "Deployment configuration"

    - phase: "Test"
      description: "Validate API functionality, performance, and security before release"
      activities:
        - "Functional testing: all endpoints, error cases, edge cases"
        - "Contract testing: verify implementation matches OpenAPI specification"
        - "Performance testing: load test at 2x expected peak traffic"
        - "Security testing: OWASP API Security Top 10, penetration testing"
        - "Partner sandbox testing: selected partners validate against pre-release version"
      deliverables:
        - "Test results and coverage report"
        - "Performance benchmark baseline"
        - "Security assessment report"

    - phase: "Deploy"
      description: "Release API to production with appropriate rollout strategy"
      activities:
        - "Deploy to staging environment for final validation"
        - "Canary or blue-green deployment to production"
        - "Update API gateway configuration: routing, rate limits, authentication"
        - "Publish updated documentation and changelog"
        - "Notify partner integration contacts of new version availability"
      deliverables:
        - "Production deployment"
        - "Updated API documentation"
        - "Partner notification"

    - phase: "Monitor"
      description: "Continuously observe API health, usage, and partner satisfaction"
      activities:
        - "Track availability, latency (p50, p95, p99), and error rates"
        - "Monitor per-partner usage patterns and quota consumption"
        - "Alert on SLA breaches and anomalous traffic patterns"
        - "Collect partner feedback through developer portal and support channels"
        - "Review API analytics for deprecation candidates and improvement opportunities"
      key_metrics:
        - metric: "Availability"
          target: "99.9% uptime (8.76 hours annual downtime max)"
        - metric: "Latency p95"
          target: "< 200ms for read operations, < 500ms for write operations"
        - metric: "Error Rate"
          target: "< 0.1% 5xx errors under normal load"
        - metric: "Time to First Call"
          target: "Partner completes first successful API call within 30 minutes of onboarding"

    - phase: "Deprecate"
      description: "Signal intent to retire an API version while supporting migration"
      activities:
        - "Announce deprecation with minimum 6-month migration window"
        - "Add Deprecation and Sunset HTTP headers to responses"
        - "Publish migration guide with endpoint-by-endpoint mapping"
        - "Track per-partner migration progress and proactively assist lagging partners"
        - "Increase deprecation warnings in developer portal and API responses"
      communication_timeline:
        - milestone: "T-6 months"
          action: "Announce deprecation, publish migration guide"
        - milestone: "T-3 months"
          action: "Direct outreach to partners still on deprecated version"
        - milestone: "T-1 month"
          action: "Final warning, escalate to partner account teams"
        - milestone: "T-0"
          action: "Begin sunset phase"

    - phase: "Sunset"
      description: "Permanently retire API version after migration period"
      activities:
        - "Return 410 Gone for all requests to retired endpoints"
        - "Maintain redirect responses pointing to successor version for 90 days"
        - "Archive API documentation with clear retired status"
        - "Decommission infrastructure and revoke associated credentials"
        - "Post-mortem: document lessons learned for future API lifecycle management"

versioning_strategies:

  overview:
    source_url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design#versioning-a-restful-web-api"
    description: "Strategies for evolving APIs while maintaining backward compatibility with existing partner integrations"

  strategies:
    - strategy: "URL Path Versioning"
      pattern: "/v1/partners, /v2/partners"
      pros:
        - "Explicit and visible in every request"
        - "Easy to route in API gateway and load balancer"
        - "Simple for partners to understand and adopt"
      cons:
        - "Implies entire API surface changes with each version"
        - "Resource URIs change between versions, breaking bookmarks and links"
      recommendation: "Good default choice for partner-facing APIs due to simplicity"

    - strategy: "Header Versioning"
      pattern: "X-API-Version: 2 or Accept: application/vnd.company.v2+json"
      pros:
        - "URI stays stable across versions"
        - "Supports content negotiation for multiple response formats"
        - "Cleaner URI structure"
      cons:
        - "Version not visible in URLs, harder to test in browser"
        - "Partners must configure HTTP headers correctly"
        - "Caching complexity increases with version-specific responses"
      recommendation: "Suitable for internal APIs or partners with mature HTTP client implementations"

    - strategy: "Query Parameter Versioning"
      pattern: "/partners?version=2"
      pros:
        - "Easy to add to existing requests"
        - "Optional: can default to latest version if omitted"
      cons:
        - "Mixes API versioning with business query parameters"
        - "Cache key must include version parameter"
        - "Inconsistent with REST resource model"
      recommendation: "Avoid for production partner APIs due to ambiguity and caching issues"

    - strategy: "Content Negotiation"
      pattern: "Accept: application/vnd.company.partners.v2+json"
      pros:
        - "Most RESTful approach, aligns with HTTP specification"
        - "Supports resource-level versioning, not just API-level"
        - "Enables gradual migration: version individual resources independently"
      cons:
        - "Higher complexity for partner developers to implement"
        - "Tooling support varies across client libraries"
        - "Requires clear documentation of media type conventions"
      recommendation: "Consider for sophisticated partners with strong HTTP expertise"

openapi_standards:

  specification_structure:
    full_name: "OpenAPI Specification 3.1"
    source_url: "https://spec.openapis.org/oas/v3.1.0"
    description: "Industry-standard format for describing REST APIs, enabling documentation, code generation, and contract testing"
    required_sections:
      - section: "openapi"
        description: "Specification version (3.1.0)"
      - section: "info"
        description: "API title, version, description, contact, license"
      - section: "servers"
        description: "Base URLs for sandbox, staging, production environments"
      - section: "paths"
        description: "Endpoint definitions with operations, parameters, request/response schemas"
      - section: "components/schemas"
        description: "Reusable data models referenced across endpoints"
      - section: "components/securitySchemes"
        description: "Authentication methods: OAuth2, API key, bearer token"
      - section: "security"
        description: "Default security requirements applied to all operations"

  validation_requirements:
    description: "Quality gates for OpenAPI specifications in partner integration projects"
    checks:
      - "All endpoints have descriptions and at least one example response"
      - "All request/response schemas use $ref to components for reusability"
      - "Error responses documented for 400, 401, 403, 404, 429, 500"
      - "Pagination parameters defined consistently across collection endpoints"
      - "Security schemes applied to all endpoints"
      - "Specification passes spectral or redocly lint with zero errors"

  code_generation:
    description: "Automated client and server code generation from OpenAPI specifications"
    tools:
      - tool: "OpenAPI Generator"
        url: "https://openapi-generator.tech/"
        use_case: "Generate client SDKs in 40+ languages for partner distribution"
      - tool: "Kiota (Microsoft)"
        url: "https://learn.microsoft.com/en-us/openapi/kiota/"
        use_case: "Generate type-safe API clients with built-in authentication handling"
      - tool: "Prism (Stoplight)"
        url: "https://stoplight.io/open-source/prism"
        use_case: "Mock server from OpenAPI spec for partner development and testing"

api_governance:

  overview:
    source_url: "https://cloud.google.com/apis/design/naming_convention"
    description: "Standards and conventions ensuring consistency, quality, and developer experience across all partner-facing APIs"

  naming_conventions:
    source_url: "https://cloud.google.com/apis/design/naming_convention"
    rules:
      - rule: "Collection names are plural nouns"
        example: "/partners, /integrations, /certifications"
      - rule: "Resource names are singular identifiers"
        example: "/partners/{partnerId}"
      - rule: "Use kebab-case for multi-word URI segments"
        example: "/partner-programs, /integration-tests"
      - rule: "Use camelCase for JSON property names"
        example: "{partnerId, integrationStatus, createdAt}"
      - rule: "Use consistent terminology across endpoints"
        example: "Always 'partnerId', never mix with 'partner_id' or 'partnerID'"
      - rule: "Actions on resources use sub-resource pattern"
        example: "POST /integrations/{id}/activate, not POST /activateIntegration"

  pagination:
    source_url: "https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design#filter-and-paginate-data"
    patterns:
      - pattern: "Offset-based"
        parameters: "?offset=20&limit=10"
        use_case: "Simple implementations with small datasets"
        limitation: "Performance degrades on large datasets, inconsistent with concurrent writes"
      - pattern: "Cursor-based"
        parameters: "?cursor=eyJpZCI6MTIzfQ&limit=10"
        use_case: "Large datasets, real-time data, consistent pagination"
        limitation: "Cannot jump to arbitrary page, cursor must be opaque"
      - pattern: "Keyset-based"
        parameters: "?after=2024-01-15T10:30:00Z&limit=10"
        use_case: "Time-series data, sorted results"
        limitation: "Requires stable sort key, complex with multi-column sorting"
    standard_response_format:
      fields:
        - "data: array of results"
        - "meta.totalCount: total matching records"
        - "meta.pageSize: number of records per page"
        - "links.next: URL or cursor for next page"
        - "links.prev: URL or cursor for previous page"

  filtering:
    source_url: "https://google.aip.dev/160"
    patterns:
      - pattern: "Query Parameter Filtering"
        example: "?status=active&type=technology"
        use_case: "Simple equality filters on known fields"
      - pattern: "Filter Expression (Google AIP-160)"
        example: "?filter=status='active' AND createdAt>'2024-01-01'"
        use_case: "Complex filtering with operators and logical combinations"
      - pattern: "Field Selection"
        example: "?fields=id,name,status"
        use_case: "Reduce payload size by requesting only needed fields"

  error_response_format:
    source_url: "https://www.rfc-editor.org/rfc/rfc9457"
    standard: "RFC 9457 Problem Details for HTTP APIs"
    format:
      fields:
        - field: "type"
          description: "URI reference identifying the problem type"
          example: "https://api.example.com/errors/insufficient-quota"
        - field: "title"
          description: "Human-readable summary of the problem type"
          example: "API quota exceeded"
        - field: "status"
          description: "HTTP status code"
          example: "429"
        - field: "detail"
          description: "Human-readable explanation specific to this occurrence"
          example: "You have exceeded your daily quota of 10,000 requests. Quota resets at 00:00 UTC."
        - field: "instance"
          description: "URI reference identifying this specific occurrence"
          example: "https://api.example.com/errors/instances/abc-123"
        - field: "errors"
          description: "Array of field-level validation errors (for 400 responses)"
          example: "[{field: 'email', message: 'Invalid email format'}]"

sources:
  - name: "Richardson Maturity Model"
    author: "Leonard Richardson, described by Martin Fowler"
    url: "https://martinfowler.com/articles/richardsonMaturityModel.html"
    relevance: "Foundational framework for assessing REST API maturity"
  - name: "OpenAPI Initiative"
    url: "https://www.openapis.org/"
    relevance: "Industry standard for API specification, documentation, and tooling"
  - name: "Google API Design Guide"
    url: "https://cloud.google.com/apis/design"
    relevance: "Comprehensive API design conventions and naming standards"
  - name: "Microsoft REST API Guidelines"
    url: "https://github.com/microsoft/api-guidelines"
    relevance: "Enterprise API governance patterns, versioning, and error handling standards"
  - name: "Google API Improvement Proposals (AIPs)"
    url: "https://google.aip.dev/"
    relevance: "Detailed design decisions for filtering, pagination, and resource-oriented design"
  - name: "RFC 9457 - Problem Details for HTTP APIs"
    url: "https://www.rfc-editor.org/rfc/rfc9457"
    relevance: "Standard error response format adopted by major API platforms"
