# SK_AA_001 - Integration Validation
skill_id: SK_AA_001
name: Integration Validation
domain: integration-validation
owner: aa-integration-validation-agent
description: >
  Assess API/SDK compatibility across platform versions, validate
  integration patterns with structured test plans, track version
  deprecation timelines, and analyze partner platform changes for
  breaking impact on customer deployments.
capabilities:
  - API/SDK compatibility assessment across platform versions
  - Integration pattern validation and certification
  - Version tracking and deprecation timeline monitoring
  - Partner platform change impact analysis
inputs:
  - partner_name
  - api_version
  - integration_scope
  - test_results
outputs:
  - compatibility_assessment
  - integration_certification
  - version_tracking_report
  - change_impact_analysis
prompts:
  - aa-api-compatibility
  - aa-integration-testing
  - aa-version-tracking
  - aa-change-impact
tools:
  - read-aa-data
  - write-aa-artifact
quality_gates:
  - All compatibility claims cite specific version combinations tested
  - Integration certifications reference structured test results
  - Version tracking includes migration guidance for deprecated APIs
  - Change impact analysis covers all affected customer deployments
