# SK_AA_003 - Technical Enablement
skill_id: SK_AA_003
name: Technical Enablement
domain: technical-enablement
owner: aa-technical-enablement-agent
description: >
  Prepare co-sell technical readiness packages for joint customer
  engagements, review partner documentation for accuracy, validate
  solution catalog entries against current platform versions, and
  create field SA enablement materials on partner capabilities.
capabilities:
  - Co-sell technical readiness package preparation
  - Partner documentation review and validation
  - Solution catalog entry validation and update
  - Field SA enablement material creation
inputs:
  - partner_name
  - engagement_context
  - documentation
  - catalog_entries
outputs:
  - cosell_readiness_package
  - documentation_review_report
  - catalog_validation_report
  - field_enablement_materials
prompts:
  - aa-cosell-readiness
  - aa-documentation-review
  - aa-catalog-validation
  - aa-field-enablement
tools:
  - read-aa-data
  - write-aa-artifact
quality_gates:
  - Co-sell packages include validated reference architectures and known limitations
  - Documentation reviews flag inaccurate claims with specific corrections
  - Catalog entries specify validated version ranges, not just "compatible"
  - Enablement materials include practical integration guidance for field SAs
