# SK_AA_002 - Solution Architecture
skill_id: SK_AA_002
name: Solution Architecture
domain: solution-architecture
owner: aa-solution-architecture-agent
description: >
  Design joint solution architectures combining vendor and partner
  capabilities, develop and maintain reference architectures, document
  deployment patterns with infrastructure and security considerations,
  and define integration pattern libraries.
capabilities:
  - Joint solution architecture design
  - Reference architecture development and maintenance
  - Deployment pattern documentation
  - Integration pattern library management
inputs:
  - partner_name
  - solution_requirements
  - integration_pattern
  - deployment_context
outputs:
  - joint_solution_design
  - reference_architecture
  - deployment_pattern_document
  - integration_pattern_definition
prompts:
  - aa-joint-solution-design
  - aa-reference-architecture
  - aa-deployment-pattern
  - aa-integration-pattern
tools:
  - read-aa-data
  - write-aa-artifact
quality_gates:
  - Reference architectures include validated version combinations
  - Deployment patterns include infrastructure, security, and sizing considerations
  - Integration patterns include error handling and failure mode documentation
  - Joint solution designs reference existing validated patterns where applicable
