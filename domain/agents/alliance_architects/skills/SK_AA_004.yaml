# SK_AA_004 - Due Diligence
skill_id: SK_AA_004
name: Due Diligence
domain: due-diligence
owner: aa-due-diligence-agent
description: >
  Conduct technical assessment of prospective partner platforms,
  score API maturity using Richardson Maturity Model, estimate
  integration effort and complexity across dimensions, and analyze
  technical risks before commercial commitment.
capabilities:
  - Partner platform technical capability assessment
  - API maturity scoring using Richardson Maturity Model
  - Integration effort and complexity estimation
  - Technical risk analysis for prospective partnerships
inputs:
  - partner_name
  - partner_platform
  - integration_requirements
  - api_documentation
outputs:
  - technical_assessment_report
  - api_maturity_scorecard
  - integration_effort_estimate
  - technical_risk_analysis
prompts:
  - aa-technical-assessment
  - aa-api-maturity
  - aa-integration-effort
  - aa-technical-risk
tools:
  - read-aa-data
  - write-aa-artifact
quality_gates:
  - Technical assessments cover architecture, scalability, security, and release cadence
  - API maturity scores include per-dimension evidence and Richardson Model level
  - Effort estimates break down by integration dimension with justification
  - Risk analysis includes severity, likelihood, and mitigation recommendations
