        automated_by: aa-due-diligence-agent
      - text: "Maintaining reference architecture diagrams for partner integrations"
        automated_by: aa-solution-architecture-agent
    scenarios:
      - problem: "Partner platform update breaks integration in customer production environments"
        why: >
          Partners release platform updates on their own cadence. Without proactive
          compatibility monitoring, the first sign of a broken integration is a customer
          support ticket. By then, the customer's production environment is affected and
          both vendors' credibility is damaged.
        agent: aa-integration-validation-agent
        agent_response: >
          Monitors partner platform change announcements, release notes, and API deprecation
          notices. Maps changes against current integration touchpoints, identifies breaking
          changes, and triggers compatibility assessments before updates reach customer
          environments.
        success_signal: "Breaking changes detected and impact-assessed within 48 hours, before customer production impact"
      - problem: "Co-sell engagement stalls at technical validation because joint solution has no validated reference architecture"
        why: >
          When vendor and partner present a joint solution, technical buyers detect gaps
          in an unvalidated integration story immediately. The co-sell motion stalls while
          both teams scramble to build architecture artifacts that should have existed
          before the first customer meeting.
        agent: aa-solution-architecture-agent
        agent_response: >
          Maintains validated reference architectures for each strategic partner integration.
          Prepares co-sell technical readiness packages with architecture diagrams, integration
          patterns, deployment considerations, and known limitations.
        success_signal: "SA teams receive validated joint solution materials before every co-sell customer engagement"
      - problem: "Prospective partnership is announced before anyone assessed whether the integration is technically feasible"
        why: >
          Partnership decisions driven by commercial opportunity often skip technical
          assessment. When integration proves harder than expected, engineering resources
          are consumed by work that was never scoped and the partnership delivers less
          value than projected.
        agent: aa-due-diligence-agent
        agent_response: >
          Conducts structured technical due diligence covering API maturity, data model
          compatibility, authentication alignment, deployment model fit, and integration
          effort estimation. Produces a feasibility report that informs the commercial decision.
        success_signal: "Technical feasibility report completed before every new partnership commitment"
    key_responsibilities:
      - "Integration Validation: assess API/SDK compatibility across platform versions, run integration tests, certify partner integrations, and track version deprecation timelines to prevent customer-facing breakage"
      - "Solution Architecture: design joint solution architectures with partners, develop and maintain reference architectures, document deployment patterns, and define integration pattern libraries"
      - "Technical Enablement: prepare co-sell technical readiness packages for field SA teams, review partner documentation for accuracy, maintain the partner solution catalog, and create field enablement materials"
      - "Due Diligence: conduct technical assessment of prospective partners, score API maturity using Richardson Model, estimate integration effort and complexity, and analyze technical risks before commercial commitment"
      - "Platform Change Monitoring: track partner platform changes across release notes, changelogs, and developer portals to detect breaking changes before they reach customer environments"
      - "Reference Architecture Maintenance: keep joint solution reference architectures current as both vendor and partner platforms evolve, with validated version combinations and known limitations"
      - "Co-sell Technical Credibility: ensure every joint customer engagement starts with a technically validated integration story, not ad-hoc architecture slides"
      - "Integration Troubleshooting: provide CA teams with integration guidance, upgrade compatibility matrices, and known issue documentation within SLA"
      - "Partner Technical Relationship: coordinate with partner engineering teams on joint roadmaps, API alignment, and integration quality standards"
      - "Ecosystem Intelligence: surface cross-account integration patterns, partner technology direction shifts, and API friction data to Field CTO and Product teams"
