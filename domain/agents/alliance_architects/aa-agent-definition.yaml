toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: aa-agent-proactive
  name: Alliance Architect Agent (Proactive)
  description: 'Proactive mode: monitors partner platform changes and surfaces integration risks before they impact customers'
  agent:
    $component_ref: aa-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection of partner platform changes,
      API deprecations, and integration risks. Scan partner release notes
      and changelogs for breaking changes. Surface integration risks before
      they reach customer environments. Prioritize timeliness over depth.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: aa-agent-analytical
  name: Alliance Architect Agent (Analytical)
  description: 'Analytical mode: deep integration analysis with comprehensive compatibility evidence'
  agent:
    $component_ref: aa-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and technical precision. Provide comprehensive
      integration analysis with full API compatibility evidence. Map data flows,
      error handling paths, and edge cases. Include version compatibility matrices
      and migration impact assessments.

      '
    human_in_the_loop: true
flows: []
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - joint-solution-architecture
    - integration-validation
    - api-compatibility
    - partner-solution-catalog
    - co-sell-technical-readiness
    - technical-due-diligence
    input_modes:
    - text/plain
    - application/json
    output_modes:
