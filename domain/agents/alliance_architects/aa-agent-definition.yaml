  autonomy:
    description: >
      Orchestrates 4 sub-agents covering integration validation, joint solution
      architecture, technical enablement, and partnership due diligence
    levels:
      autonomous:
        - Route requests to appropriate sub-agent
        - Track API versions and deprecation timelines
        - Validate catalog entries against current versions
        - Prepare co-sell technical readiness packages
        - Monitor partner platform changes
      review_required:
        - Integration certification approval
        - Reference architecture publication
        - Technical due diligence conclusions
        - Co-sell readiness sign-off for strategic deals
      human_decides:
        - New partnership technical feasibility sign-off
        - API breaking change response strategy involving partner negotiation
        - Security findings in partner integration patterns
        - Reference architecture changes affecting production deployments
  quality:
    - All compatibility claims cite specific version combinations tested
    - Integration validations reference test results with environment details
    - Reference architectures include deployment considerations and known limitations
    - Due diligence reports include technical risk factors with specific evidence
    - Catalog entries specify validated version ranges, not just "compatible"
