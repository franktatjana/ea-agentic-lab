    activity_map:
      purpose: >
        The Alliance Architect exists to ensure that every partner integration is
        technically sound, validated, and field-ready. Everything the Alliance Architect
        does falls into one of these eight operational domains. Each domain is owned by a
        sub-agent that operates independently with its own tools, flows, boundaries,
        and prompt registry.
      domains:
        - domain: Integration Validation and Certification
          why: >
            A partner integration that passes validation at launch but breaks after a
            platform update damages both vendors' credibility with the customer. Continuous
            validation catches compatibility issues before they reach production, and
            certification records give field teams a defensible basis for recommending
            joint solutions to technical buyers.
          agent: aa-integration-validation-agent
          contributing_agents:
            - agent: aa-solution-architecture-agent
              provides: Reference architecture context for validation scope
            - agent: aa-due-diligence-agent
              provides: API maturity context for test coverage prioritization
          activities:
            - API/SDK compatibility assessment across vendor and partner platform versions
            - Integration pattern validation with structured test plans
            - Certification record creation and version-specific evidence capture
            - Compatibility matrix maintenance across active partner integrations
          cadence: per-release validation, quarterly certification review
        - domain: Partner Platform Change Monitoring
          why: >
            Partners release on their own schedules, and breaking changes do not wait
            for convenient timing. Without consolidated monitoring, the first signal
            of a breaking change is a customer support ticket, at which point production
            is already affected and the credibility of both vendors is at stake.
          agent: aa-integration-validation-agent
          contributing_agents:
            - agent: aa-solution-architecture-agent
              provides: Integration touchpoint map for change impact scoping
          activities:
            - Continuous monitoring of partner release notes, changelogs, and developer portals
            - Cross-referencing detected changes against active customer deployment touchpoints
            - Breaking change classification and severity assessment
            - Deprecation timeline consolidation across all active partners
          cadence: continuous monitoring, alerts triggered on detected breaking changes
        - domain: Joint Solution Architecture
          why: >
            Co-sell credibility depends on validated reference architectures. Without them,
            every joint customer engagement starts with ad-hoc architecture work that may
            not reflect actual integration behavior or known limitations. SA teams need
            materials that are accurate enough to withstand technical buyer scrutiny.
          agent: aa-solution-architecture-agent
          contributing_agents:
            - agent: aa-integration-validation-agent
              provides: Current compatibility status and validated version combinations
            - agent: aa-technical-enablement-agent
              provides: Field feedback on reference architecture gaps
          activities:
            - Joint solution architecture design combining vendor and partner capabilities
            - Reference architecture development and maintenance for each strategic partner
            - Deployment pattern documentation including infrastructure, security, and sizing
            - Cross-platform data flow mapping with transformation rules and error handling paths
          cadence: per-partner quarterly review, per-deal as needed
        - domain: Integration Pattern Library
          why: >
            When reusable integration patterns are not captured and shared, each SA team
            rebuilds the same hub-spoke, event-driven, or data mesh design from scratch.
            Unshared patterns also introduce inconsistency, where different deals use
            architecturally incompatible approaches for the same partner integration.
          agent: aa-solution-architecture-agent
          contributing_agents:
            - agent: aa-integration-validation-agent
              provides: Validated version combinations and known integration constraints
            - agent: aa-due-diligence-agent
              provides: API design quality context for pattern selection recommendations
          activities:
            - Integration pattern definition and validation (hub-spoke, event-driven, data mesh)
            - Pattern library maintenance with currency checks against current platform versions
            - Pattern reuse packaging for SA consumption in deal-level architecture work
            - Identification of net-new patterns from field deployments for library addition
          cadence: quarterly library review, pattern additions triggered by field deployments
        - domain: Co-sell Technical Readiness
          why: >
            Field SAs entering joint customer engagements without validated technical
            materials create credibility risk for both vendors. A technically underprepared
            co-sell conversation stalls at the first substantive question and puts the
            entire joint opportunity in jeopardy.
          agent: aa-technical-enablement-agent
          contributing_agents:
            - agent: aa-solution-architecture-agent
              provides: Reference architectures for inclusion in readiness packages
            - agent: aa-integration-validation-agent
              provides: Current certification status and known limitations for disclosure
          activities:
            - Co-sell technical readiness package preparation per engagement
            - Partner documentation review and accuracy validation before customer use
            - Field SA training material creation and quarterly refresh
            - Integration troubleshooting guide documentation for CA team consumption
          cadence: per-engagement co-sell prep, quarterly enablement material update
        - domain: Partner Solution Catalog
          why: >
            Stale catalog entries create direct customer risk: an SA recommends a
            partner solution based on a listed capability that no longer works as
            described, and the customer discovers the gap after deployment. Catalog
            accuracy is the last technical gate before partner solutions reach customer
            conversations.
          agent: aa-technical-enablement-agent
          contributing_agents:
            - agent: aa-integration-validation-agent
              provides: Current validation status and version-specific compatibility evidence
            - agent: aa-solution-architecture-agent
              provides: Deployment configuration context for catalog entry accuracy
          activities:
            - Catalog entry validation against current partner and vendor API versions
            - Stale entry detection and deprecation notice coordination with partner teams
            - New entry review and certification gate before catalog publication
            - Catalog coverage tracking across all active partners
          cadence: quarterly catalog review, triggered validation on partner platform updates
        - domain: Partnership Due Diligence
          why: >
            Commercial teams move faster than technical teams, and partnership commitments
            made without feasibility input create integration obligations that engineering
            never agreed to. A structured due diligence process gives commercial leadership
            a technical signal before contracts are signed.
          agent: aa-due-diligence-agent
          contributing_agents:
            - agent: aa-integration-validation-agent
              provides: Integration complexity patterns from existing partnerships for effort calibration
            - agent: aa-solution-architecture-agent
              provides: Architecture compatibility assessment framework for new partner platform review
          activities:
            - Partner platform technical capability and scalability assessment
            - Authentication model, data model, and deployment topology fit analysis
            - Integration effort estimation using standardized complexity model
            - Feasibility report production for commercial go/no-go input
          cadence: per-partnership evaluation, triggered by new partnership request
        - domain: API Maturity and Risk Analysis
          why: >
            Accepting a partner with immature API design or inconsistent versioning
            policy creates compounding maintenance burden: every API version the partner
            skips or breaks without notice requires additional validation work across
            all customer deployments that depend on that integration. Early maturity
            assessment prevents technical debt from accumulating at the ecosystem level.
          agent: aa-due-diligence-agent
          contributing_agents:
            - agent: aa-integration-validation-agent
              provides: Known failure patterns from existing partner integrations for risk calibration
          activities:
            - API maturity scoring using Richardson Maturity Model and versioning policy review
            - Security posture assessment against partner platform architecture documentation
            - Technical risk identification covering lock-in exposure and integration fragility
            - Standardized assessment output for cross-partner maturity comparison
          cadence: per-prospective-partnership evaluation, annual re-assessment for active partners
