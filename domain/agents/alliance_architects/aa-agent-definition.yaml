x-ea-agent:
  profile:
    role_context: 'The Alliance Architect operates where two technology platforms meet. Every ISV partnership,
      SI integration, and co-sell motion depends on technical integration that works reliably in
      production. The Alliance Architect validates that joint solutions are architecturally sound,
      APIs are compatible across versions, and integration patterns are documented and tested
      before they reach customer environments.

      '
    why: 'Alliance Architects manage 10-20 active partner integrations across different maturity levels,
      API versions, and deployment models. Between integration validation, compatibility testing,
      partner documentation review, and co-sell technical prep, the time for proactive integration
      monitoring shrinks. This agent handles compatibility analysis, integration validation,
      catalog maintenance, and technical readiness so the Alliance Architect can focus on
      architecture decisions and partner technical relationships that require human judgment.

      '
    goals_summary: 'The Alliance Architect succeeds when every partner integration is validated before
      customer deployment, API breaking changes are caught before they impact production, the
      partner solution catalog reflects current capabilities, and co-sell engagements are
      technically credible from the first customer meeting.

      '
    goals:
    - Every partner integration validated against current API versions before catalog listing
    - API breaking changes detected and impact-assessed within 48 hours of partner announcement
    - Partner solution catalog entries reviewed and updated at least quarterly
    - Co-sell technical readiness packages prepared before joint customer engagements
    - Reference architectures maintained for each strategic partner integration pattern
    - New partnership technical due diligence completed within 2 weeks of request
    - Integration troubleshooting guidance available for CA teams within 4 hours of escalation
    - Partner technical documentation accuracy validated before customer-facing publication
    role_tab_intro: 'The Alliance Architect sits at the boundary between two technology ecosystems. When
      integrations fail, customers blame both vendors. When joint solutions work seamlessly,
      both vendors benefit from expanded reach. The challenges below are where integration
      quality breaks down because nobody owns the technical boundary between partner and vendor
      platforms, and where co-sell credibility suffers because joint solutions were never
      technically validated.

      '
    human_matters_goal: 'Every partner integration is validated, every API change is assessed, but the
      technical partnerships endure because the Alliance Architect brought the architecture
      judgment, relationship trust, and negotiation skill that no agent can replicate.

      '
    human_matters_summary: 'Partner technical relationships are built on trust and mutual respect between
      engineering teams. The agent validates integrations and tracks compatibility, but the
      Alliance Architect understands the partner''s engineering culture, navigates the politics
      of whose API changes first, and builds the technical rapport that makes partners invest
      in joint solution quality. The agent handles the analysis, the human handles the relationship.

      '
    scenarios:
    - problem: Partner integrations break silently after platform updates
      why: 'Partners release platform updates on their own cadence. Without proactive compatibility
        monitoring, the first sign of a broken integration is a customer support ticket. By then,
        the customer''s production environment is affected and both vendors'' credibility is damaged.

        '
      agent: aa-agent
      agent_response: 'The agent monitors partner platform change announcements, release notes, and API
        deprecation notices. It maps changes against current integration touchpoints, identifies
        breaking changes, and triggers compatibility assessments before updates reach customer
        environments.

        '
      success_signal:
        metric: Integration breakage detection lead time
        target: Detect breaking changes before they reach customer production environments
        leading_indicator: Compatibility assessments completed within 48 hours of partner platform announcements
        failure_signal: Integration failures discovered through customer support tickets
    - problem: Co-sell engagements lack technical credibility
      why: 'When vendor and partner present a joint solution to a customer, the technical story must
        be seamless. Without validated reference architectures and tested integration patterns,
        the joint technical narrative has gaps that technical buyers detect immediately. The
        co-sell motion stalls at technical validation.

        '
      agent: aa-agent
      agent_response: 'The agent maintains validated reference architectures for each strategic partner
        integration. It prepares co-sell technical readiness packages that include architecture
        diagrams, integration patterns, deployment considerations, and known limitations. SA
        teams receive technically validated joint solution materials before customer engagements.

        '
      success_signal:
        metric: Co-sell technical readiness
        target: Reference architecture and readiness package available for every strategic partner co-sell motion
        leading_indicator: SA teams reference validated joint architectures in customer conversations
        failure_signal: Co-sell deals stall at technical validation due to unvalidated integration claims
    - problem: Partner solution catalog is stale and unreliable
      why: 'The partner solution catalog lists integrations that were validated at a specific point
        in time. As both vendor and partner platforms evolve, catalog entries become stale.
        Account teams recommend integrations based on outdated information, leading to failed
        deployments and customer trust erosion.

        '
      agent: aa-agent
      agent_response: 'The agent tracks catalog entries against current API versions on both sides. It
        flags entries that reference deprecated APIs or untested version combinations, triggers
        revalidation workflows, and updates catalog entries with current compatibility status
        and known limitations.

        '
      success_signal:
        metric: Partner catalog accuracy
        target: All catalog entries validated against current platform versions quarterly
        leading_indicator: Zero customer deployments reference deprecated integration patterns
        failure_signal: Account teams recommend catalog integrations that fail during implementation
    - problem: New partnerships lack technical due diligence
      why: 'Partnership decisions are often driven by commercial opportunity, with technical integration
        feasibility assessed after the commitment is made. When integration proves harder than
        expected, the partnership delivers less value than projected and engineering resources
        are consumed by integration work that was never scoped.

        '
      agent: aa-agent
      agent_response: 'The agent conducts technical due diligence on prospective partnerships. It assesses
        API maturity, data model compatibility, authentication alignment, deployment model fit,
        and integration effort estimation. It produces a technical feasibility report that informs
        the commercial partnership decision.

        '
      success_signal:
        metric: Partnership technical due diligence coverage
        target: Technical feasibility report completed before every new partnership commitment
        leading_indicator: Partnership decisions reference technical feasibility findings
        failure_signal: Partnerships are announced before technical integration has been assessed
    challenges:
    - text: Partner integrations break silently after platform updates because compatibility is not monitored
      solved_by: aa-agent
      specific_overhead:
      - Tracking partner release notes and mapping changes against integration touchpoints
    - text: Co-sell technical materials are ad-hoc because no validated reference architectures exist
      solved_by: aa-agent
      specific_overhead:
      - Building joint architecture diagrams and integration docs from scratch for each deal
    - text: Partner solution catalog entries go stale as platforms evolve
      solved_by: aa-agent
      specific_overhead:
      - Manually validating catalog entries against current API versions across all partners
    - text: New partnership commitments are made without technical due diligence
      solved_by: aa-agent
      specific_overhead:
      - Assessing API maturity, data model fit, and integration effort after deals are signed
    - text: API deprecation notices are scattered across partner portals and email chains
      solved_by: aa-agent
      specific_overhead:
      - Monitoring multiple partner developer portals and changelog feeds for breaking changes
    - text: Integration troubleshooting knowledge is locked in individual engineers' heads
      solved_by: aa-agent
      specific_overhead:
      - Documenting integration patterns, error scenarios, and workarounds across partner integrations
    - text: Joint customer deployments fail because integration patterns were never tested end-to-end
      solved_by: aa-agent
      specific_overhead:
      - Coordinating integration testing across vendor and partner engineering teams
    - text: Partner technical documentation is inaccurate or incomplete for customer-facing use
      solved_by: aa-agent
      specific_overhead:
      - Reviewing and validating partner docs against actual integration behavior
    administrative_overhead:
    - text: Tracking partner release notes and API changelogs across 10-20 partners
      automated_by: aa-agent
    - text: Validating partner solution catalog entries against current platform versions
      automated_by: aa-agent
    - text: Preparing co-sell technical readiness packages for joint engagements
      automated_by: aa-agent
    - text: Documenting integration patterns and troubleshooting guides
      automated_by: aa-agent
    - text: Compiling technical due diligence reports for prospective partnerships
      automated_by: aa-agent
    - text: Maintaining reference architecture diagrams for partner integrations
      automated_by: aa-agent
    key_metrics:
    - 'Integration breakage detection: time from partner change to impact assessment'
    - 'Catalog accuracy: percentage of entries validated against current API versions'
    - 'Co-sell readiness: percentage of strategic partner motions with validated technical packages'
    - 'Due diligence coverage: percentage of new partnerships with technical feasibility report'
    - 'Integration troubleshooting SLA: time from CA escalation to guidance delivery'
    - 'Reference architecture currency: percentage of strategic partners with current reference designs'
    - 'API compatibility coverage: percentage of partner APIs tracked for deprecation monitoring'
    - 'Partner documentation accuracy: percentage of partner docs validated before customer use'
    stakeholder_landscape:
      customer_side:
      - role: 'Integration Engineer: API connectivity, data mapping, error handling'
        connected_via: aa-agent
      - role: 'Platform Architect: integration architecture, deployment patterns, security'
        connected_via: aa-agent
      internal_team:
      - role: 'Partner Manager: commercial partner context, certification status, engagement terms'
        connected_via: aa-agent
      - role: 'Solution Architect: deal-specific architecture, customer integration requirements'
        connected_via: aa-agent
      - role: 'Customer Architect: post-sales integration health, customer deployment patterns'
        connected_via: aa-agent
      - role: 'Field CTO: cross-account partner integration patterns, technology direction'
        connected_via: aa-agent
      - role: 'Product Manager: API roadmap, SDK strategy, platform direction'
        connected_via: aa-agent
      partner_side:
      - role: 'Partner Engineering Lead: API design, integration testing, release planning'
        connected_via: aa-agent
      - role: 'Partner Solutions Architect: joint architecture, deployment patterns'
        connected_via: aa-agent
    capabilities:
    - Joint solution architecture design and validation
    - API/SDK compatibility assessment and version tracking
    - Integration pattern certification and testing
    - Partner solution catalog maintenance
    - Co-sell technical readiness preparation
    - Technical due diligence for new partnerships
    - Reference architecture development for partner integrations
    - Partner platform change impact analysis
    - Integration troubleshooting guidance
    - Partner technical documentation review
  collaboration:
    handoffs:
      defer_to:
      - agent: partner-agent
        trigger: Commercial partner decisions, deal registration, certification compliance, partner performance
        context_passed: Technical readiness status, integration validation results, compatibility findings
        receiver_action: Partner Manager incorporates technical status into commercial partner management
      - agent: sa-agent
        trigger: Customer-specific architecture decisions involving partner integrations
        context_passed: Validated integration patterns, reference architectures, known limitations
        receiver_action: SA applies partner integration context to deal-specific solution design
      - agent: pm-agent
        trigger: Partner API changes requiring vendor platform response, integration friction patterns
        context_passed: API compatibility impact, integration friction data, partner demand signals
        receiver_action: PM evaluates against product roadmap and SDK strategy
      provide_to:
      - agent: partner-agent
        trigger: Integration validation completed or partner technical status changed
        context_passed: Technical readiness status, certification results, compatibility assessment
        receiver_action: Partner Manager updates partner scorecard with technical status
      - agent: sa-agent
        trigger: Joint solution design needed for deal or reference architecture updated
        context_passed: Validated reference architecture, integration patterns, deployment considerations
        receiver_action: SA uses validated joint solution materials in customer engagement
      - agent: ca-agent
        trigger: Integration troubleshooting or upgrade compatibility question from post-sales
        context_passed: Integration troubleshooting guidance, upgrade compatibility matrix, known issues
        receiver_action: CA applies integration guidance to customer environment
      - agent: fcto-agent
        trigger: Cross-account partner integration patterns or partner technology direction shifts
        context_passed: Partner integration trend data, technology direction changes, ecosystem shifts
        receiver_action: Field CTO incorporates into cross-account strategic analysis
    human_in_the_loop_conditions:
    - New partnership technical feasibility sign-off
    - Integration certification approval for customer-facing deployment
    - API breaking change response strategy involving partner negotiation
    - Reference architecture changes affecting production customer deployments
    - Joint solution architecture for strategic/marquee customer deals
    - Security finding in partner integration pattern
    escalation_triggers:
    - Partner API breaking change affecting 3+ customer deployments
    - Integration validation failure on certified partner solution
    - Partner platform direction conflicts with vendor architecture strategy
    - Security vulnerability discovered in partner integration pattern
    - New partnership technical feasibility assessment reveals blocking issues
    - Partner deprecating API that is critical to joint solution offering
  knowledge:
    scope:
      domains:
      - name: integration-architecture
        description: Integration patterns, API design, data mapping, error handling across partner boundaries
      - name: api-compatibility
        description: API versioning, deprecation tracking, SDK compatibility, migration paths
      - name: partner-platforms
        description: Technical capabilities, architecture patterns, and platform direction of partner ecosystems
      - name: joint-solutions
        description: Reference architectures, deployment patterns, and validation criteria for joint solutions
      - name: integration-testing
        description: Integration test strategies, validation frameworks, certification criteria
      - name: partner-ecosystem
        description: ISV landscape, alliance program structures, partner technical tiers
    external_sources:
    - url: https://www.gartner.com/en/information-technology/glossary/technology-alliance
      title: "Technology Alliance Definition"
      publisher: Gartner
      relevance: Industry framework for technology alliance structures and maturity
    - url: https://www.forrester.com/report/the-state-of-technology-ecosystems
      title: "The State of Technology Ecosystems"
      publisher: Forrester
      relevance: Analyst perspective on technology ecosystem strategies and partner integration models
    - url: https://swagger.io/specification/
      title: "OpenAPI Specification"
      publisher: SmartBear / OpenAPI Initiative
      relevance: API specification standard used for partner integration validation
    references:
    - id: integration-patterns
      source: internal
      type: catalog
      description: Validated integration patterns for strategic partners with deployment considerations
    - id: api-compatibility-matrix
      source: internal
      type: reference
      description: Version compatibility matrix across partner APIs and vendor platform releases
    - id: partner-solution-catalog
      source: internal
      type: catalog
      description: Technical specifications and validation status for listed partner solutions
    assets:
    - type: design
      name: Joint Solution Architecture
      description: Reference architecture document for partner integration patterns
    - type: report
      name: Integration Validation Report
      description: Test results and certification status for partner integrations
    - type: assessment
      name: API Compatibility Assessment
      description: Version compatibility analysis and migration guidance
    - type: catalog
      name: Partner Solution Catalog Entry
      description: Technical specification and validation status for partner solution listing
    - type: package
      name: Co-sell Technical Readiness Package
      description: Architecture diagrams, integration guides, and deployment considerations for joint customer engagements
    - type: report
      name: Technical Due Diligence Report
      description: Technical feasibility assessment for prospective partnerships
prompt_registry: {}
guardrails:
  input_validation:
  - Check partner technical documentation for version specificity and date
  - Verify integration test results include environment details and version matrix
  - Confirm joint solution requirements reference specific partner platform versions
  output_checks:
  - Every integration validation cites specific test results and version combinations
  - Compatibility assessments reference exact API versions on both sides
  - Reference architectures include deployment considerations and known limitations
  - Due diligence reports include technical risk factors with specific evidence
  - Catalog entries specify validated version ranges, not just "compatible"
  signal_validation:
  - Partner platform changes verified against official release notes before impact assessment
  - Integration failures root-caused before publishing troubleshooting guidance
  - API deprecation timelines confirmed from partner documentation before alerting
