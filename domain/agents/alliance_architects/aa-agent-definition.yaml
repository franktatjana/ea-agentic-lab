  autonomy:
    description: >
      Orchestrates 4 sub-agents covering integration validation, joint solution
      architecture, technical enablement, and partnership due diligence
    levels:
      autonomous:
        - Route requests to appropriate sub-agent
        - Track API versions and deprecation timelines
        - Validate catalog entries against current versions
        - Prepare co-sell technical readiness packages
        - Monitor partner platform changes
      review_required:
        - Integration certification approval
        - Reference architecture publication
        - Technical due diligence conclusions
