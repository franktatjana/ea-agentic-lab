    activity_map:
      purpose: >
        The Alliance Architect exists to ensure that every partner integration is
        technically sound, validated, and field-ready. Everything the Alliance Architect
        does falls into one of these operational domains. Each domain is owned by a
        sub-agent that operates independently with its own tools, flows, boundaries,
        and prompt registry.
      domains:
        - domain: Integration Validation and Certification
          why: >
            A partner integration that passes validation at launch but breaks after a
            platform update damages both vendors' credibility with the customer. Continuous
            validation catches compatibility issues before they reach production.
          agent: aa-integration-validation-agent
          contributing_agents:
            - agent: aa-solution-architecture-agent
              provides: Reference architecture context for validation scope
            - agent: aa-due-diligence-agent
              provides: API maturity context for test coverage prioritization
          owner: aa-integration-validation-agent
          receives: Partner API docs, SDK references, release notes, test results
          provides: Compatibility assessments, certification status, breaking change alerts
          activities:
            - API/SDK compatibility assessment across platform versions
            - Integration pattern validation and certification
            - Version tracking and deprecation timeline monitoring
            - Partner platform change impact analysis
          cadence: continuous monitoring, per-release validation, quarterly certification review
        - domain: Joint Solution Architecture
          why: >
            Co-sell credibility depends on validated reference architectures. Without them,
            every joint customer engagement starts with ad-hoc architecture work that may
            not reflect actual integration behavior or known limitations.
          agent: aa-solution-architecture-agent
          contributing_agents:
            - agent: aa-integration-validation-agent
              provides: Current compatibility status and validated version combinations
            - agent: aa-technical-enablement-agent
              provides: Field feedback on reference architecture gaps
          owner: aa-solution-architecture-agent
          receives: Partner platform capabilities, vendor API specs, customer requirements
          provides: Joint solution designs, reference architectures, deployment patterns
          activities:
            - Joint solution architecture design
            - Reference architecture development and maintenance
            - Deployment pattern documentation
            - Integration pattern library management
          cadence: per-partner quarterly review, per-deal as needed
        - domain: Technical Enablement and Catalog
          why: >
            Field SAs and co-sell teams are the primary consumers of partner integration
            knowledge. Stale catalog entries, missing enablement materials, or unreviewed
            partner docs lead to misinformed customer conversations and failed deployments.
          agent: aa-technical-enablement-agent
          contributing_agents:
            - agent: aa-integration-validation-agent
              provides: Current validation status for catalog entries
            - agent: aa-solution-architecture-agent
              provides: Reference architectures for co-sell readiness packages
          owner: aa-technical-enablement-agent
          receives: Partner documentation, catalog entries, field feedback, engagement context
          provides: Co-sell readiness packages, validated docs, catalog updates, enablement materials
          activities:
            - Co-sell technical readiness package preparation
            - Partner documentation review and validation
            - Solution catalog entry validation and update
            - Field SA enablement material creation
          cadence: per-engagement co-sell prep, quarterly catalog review, quarterly enablement update
        - domain: Partnership Due Diligence
          why: >
            Partnership decisions driven by commercial opportunity without technical
            assessment lead to integration surprises. A structured due diligence process
            surfaces feasibility issues before commercial commitments are made.
          agent: aa-due-diligence-agent
          contributing_agents:
            - agent: aa-integration-validation-agent
              provides: Integration complexity patterns from existing partnerships
            - agent: aa-solution-architecture-agent
              provides: Architecture compatibility assessment framework
          owner: aa-due-diligence-agent
          receives: Partner platform docs, API specifications, architecture overview
          provides: Feasibility reports, API maturity scores, effort estimates, risk analysis
          activities:
            - Partner platform technical capability assessment
            - API maturity scoring using Richardson Model
            - Integration effort and complexity estimation
            - Technical risk analysis for prospective partnerships
          cadence: per-partnership evaluation, triggered by new partnership request
