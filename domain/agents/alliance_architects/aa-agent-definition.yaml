# Alliance Architect Agent - Orchestrator Definition
# Oracle Agent Spec 26.1.0
# Sub-agents: aa-integration-validation, aa-solution-architecture, aa-technical-enablement, aa-due-diligence
# Role: Digital twin of the Alliance Architect
agentspec_version: 26.1.0
component_type: Agent
id: aa-agent
name: Alliance Architect Agent
description: >
  Digital twin of the Alliance Architect role. Orchestrates technical partner
  ecosystem management across integration validation, joint solution architecture,
  technical enablement, and partnership due diligence through 4 specialized
  sub-agents. Owns the technical side of partner relationships while the Partner
  Manager Agent owns commercial alignment.
metadata:
  definition_version: 1.0.0
  parent_agent: null
  disclaimer: This agent specification is a reference design for educational and demonstration purposes. It is not a production system. All examples, case studies, and scenarios are fictional.
  tags:
    - alliance-architect
    - isv
    - partner-integration
    - joint-solution
    - api-compatibility
    - co-sell-technical
    - reference-architecture
  responsibility: >
    Orchestrate 4 sub-agents covering integration validation, joint solution
    architecture, technical enablement, and partnership due diligence
system_prompt: >
  You are the Alliance Architect Orchestrator. You are a PURE ROUTER.
  You DO NOT answer technical integration questions directly.
  You route every request to exactly one of your 4 sub-agents.

  ROUTING TABLE:

  aa-integration-validation-agent
    - API/SDK compatibility assessment
    - Integration testing and certification
    - Version tracking and deprecation monitoring
    - Partner platform change impact analysis
    - Integration breakage detection

  aa-solution-architecture-agent
    - Joint solution architecture design
    - Reference architecture development and maintenance
    - Deployment pattern documentation
    - Integration pattern library
    - Cross-platform data flow mapping

  aa-technical-enablement-agent
    - Co-sell technical readiness packages
    - Partner documentation review and validation
    - Partner solution catalog maintenance
    - Field SA enablement on partner capabilities
    - Partner technical training materials

  aa-due-diligence-agent
    - New partnership technical assessment
    - Partner platform evaluation
    - API maturity scoring
    - Integration effort estimation
    - Technical risk analysis for prospective partnerships

  ROUTING RULES:
  1. Parse the user request for domain signals
  2. Route to exactly ONE sub-agent
  3. If the request spans multiple domains, route to the PRIMARY domain
     and note which secondary sub-agents should be consulted
  4. NEVER generate technical analysis yourself

  AGGREGATION: When a request requires cross-domain synthesis (e.g.,
  "full partner technical review"), trigger parallel assessments from
  relevant sub-agents and aggregate their outputs into a unified view.

  MUST NOT:
  - Perform technical analysis directly
  - Make commercial partner commitments (Partner Manager's domain)
  - Track partner deliverables or dependencies (Partner Manager's domain)
  - Design customer-specific architectures (SA Agent's domain)
  - Make vendor product roadmap commitments (PM Agent's domain)
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.4
    max_tokens: 4096
inputs:
  - title: technical_request
    type: string
    description: The technical integration request to route
  - title: partner_context
    type: string
    description: Partner and integration context
outputs:
  - title: routed_response
    type: object
    description: Response from the appropriate sub-agent
tools:
  - component_type: ClientTool
    id: invoke-aa-integration-validation
    name: Invoke Integration Validation Agent
    description: Route to integration validation sub-agent for API compatibility, testing, version tracking, certification
    requires_confirmation: false
    inputs:
      - title: task
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: sub-agent
  - component_type: ClientTool
    id: invoke-aa-solution-architecture
    name: Invoke Solution Architecture Agent
    description: Route to solution architecture sub-agent for joint designs, reference architectures, deployment patterns
    requires_confirmation: false
    inputs:
      - title: task
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: sub-agent
  - component_type: ClientTool
    id: invoke-aa-technical-enablement
    name: Invoke Technical Enablement Agent
    description: Route to technical enablement sub-agent for co-sell readiness, docs review, catalog, field enablement
    requires_confirmation: false
    inputs:
      - title: task
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: sub-agent
  - component_type: ClientTool
    id: invoke-aa-due-diligence
    name: Invoke Due Diligence Agent
    description: Route to due diligence sub-agent for new partnership assessment, platform evaluation, risk analysis
    requires_confirmation: false
    inputs:
      - title: task
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: sub-agent
  - component_type: ClientTool
    id: read-aa-data
    name: Read Alliance Data
    description: "Access data sources: partner technical docs, APIs, integration test results, platform changes, solution catalog"
    requires_confirmation: false
    inputs:
      - title: query
        type: string
    outputs:
      - title: data
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry
  - component_type: ClientTool
    id: write-aa-artifact
    name: Write Alliance Artifact
    description: "Save artifacts: joint solution designs, validation reports, compatibility assessments, catalog entries"
    requires_confirmation: true
    inputs:
      - title: artifact
        type: object
      - title: destination_path
        type: string
    outputs:
      - title: status
        type: string
    x-ea-agent:
      risk: medium
      resolver: service-registry
  - component_type: ClientTool
    id: ask-user
    name: Ask User
    description: Request clarification or additional input from the user
    requires_confirmation: false
    inputs:
      - title: question
        type: string
    outputs:
      - title: answer
        type: string
    x-ea-agent:
      risk: low
      resolver: inline
toolboxes: []
specialized_agents:
  - component_type: SpecializedAgent
    id: aa-agent-proactive
    name: Alliance Architect Agent (Proactive)
    description: "Proactive mode: monitors partner platform changes, API deprecations, integration risks before customer impact"
    agent:
      $component_ref: aa-agent
    agent_specialization_parameters:
      additional_instructions: >
        Focus on proactive detection of partner platform changes, API
        deprecations, and integration risks. Scan partner release notes
        and changelogs for breaking changes. Surface integration risks
        before they reach customer environments. Prioritize timeliness.
      human_in_the_loop: true
  - component_type: SpecializedAgent
    id: aa-agent-analytical
    name: Alliance Architect Agent (Analytical)
    description: "Analytical mode: deep integration analysis with comprehensive compatibility evidence and architecture review"
    agent:
      $component_ref: aa-agent
    agent_specialization_parameters:
      additional_instructions: >
        Focus on depth and technical precision. Provide comprehensive
        integration analysis with full API compatibility evidence. Map
        data flows, error handling paths, and edge cases. Include version
        compatibility matrices and migration impact assessments.
      human_in_the_loop: true
flows:
  - component_type: Flow
    id: integration-validation
    name: Integration Validation
    description: Flow for API compatibility, integration testing, version tracking, and certification.
    inputs:
      - title: partner_name
        type: string
      - title: api_version
        type: string
      - title: integration_scope
        type: string
      - title: test_results
        type: string
    outputs:
      - title: validation_result
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: aa-api-compatibility
          input: partner_name, api_version
          description: Assess API/SDK compatibility across platform versions
        - step: 2
          prompt: aa-integration-testing
          input: partner_name, integration_scope, test_results
          description: Validate integration patterns and certify results
        - step: 3
          prompt: aa-version-tracking
          input: partner_name
          description: Track API versions and deprecation timelines
        - step: 4
          prompt: aa-change-impact
          input: partner_name, api_version
          description: Assess impact of partner platform changes on integrations
  - component_type: Flow
    id: solution-architecture
    name: Solution Architecture
    description: Flow for joint solution design, reference architectures, and deployment patterns.
    inputs:
      - title: partner_name
        type: string
      - title: solution_requirements
        type: string
      - title: integration_pattern
        type: string
    outputs:
      - title: architecture_result
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: aa-joint-solution-design
          input: partner_name, solution_requirements
          description: Design joint solution architecture
        - step: 2
          prompt: aa-reference-architecture
          input: partner_name, integration_pattern
          description: Develop or update reference architecture
        - step: 3
          prompt: aa-deployment-pattern
          input: partner_name, solution_requirements
          description: Document deployment patterns and considerations
        - step: 4
          prompt: aa-integration-pattern
          input: partner_name, integration_pattern
          description: Define and validate integration patterns
  - component_type: Flow
    id: technical-enablement
    name: Technical Enablement
    description: Flow for co-sell readiness, documentation review, catalog, and field enablement.
    inputs:
      - title: partner_name
        type: string
      - title: engagement_context
        type: string
      - title: documentation
        type: string
    outputs:
      - title: enablement_result
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: aa-cosell-readiness
          input: partner_name, engagement_context
          description: Prepare co-sell technical readiness package
        - step: 2
          prompt: aa-documentation-review
          input: partner_name, documentation
          description: Review and validate partner technical documentation
        - step: 3
          prompt: aa-catalog-validation
          input: partner_name
          description: Validate partner solution catalog entries
        - step: 4
          prompt: aa-field-enablement
          input: partner_name
          description: Prepare field SA enablement materials for partner capabilities
  - component_type: Flow
    id: due-diligence
    name: Due Diligence
    description: Flow for new partnership technical assessment, platform evaluation, and risk analysis.
    inputs:
      - title: partner_name
        type: string
      - title: partner_platform
        type: string
      - title: integration_requirements
        type: string
    outputs:
      - title: due_diligence_result
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: aa-technical-assessment
          input: partner_name, partner_platform
          description: Assess partner platform technical capabilities
        - step: 2
          prompt: aa-api-maturity
          input: partner_name, partner_platform
          description: Score partner API maturity and design quality
        - step: 3
          prompt: aa-integration-effort
          input: partner_name, integration_requirements
          description: Estimate integration effort and complexity
        - step: 4
          prompt: aa-technical-risk
          input: partner_name, partner_platform
          description: Analyze technical risks for prospective partnership
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: "0.1"
    capabilities:
      - integration-validation
      - solution-architecture
      - technical-enablement
      - due-diligence
    input_modes:
      - text/plain
      - application/json
    output_modes:
      - application/yaml
      - application/json
      - text/markdown
      - text/plain
x-ea-agent:
  prompt_registry:
    aa-api-compatibility:
      description: Assess API/SDK compatibility across platform versions
      source: prompts/tasks.yaml#integration_validation.api_compatibility
      inputs:
        - title: partner_name
          type: string
        - title: api_version
          type: string
      outputs:
        - title: compatibility_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [partner_api_docs, version_matrix, sdk_changelog]
          priority: critical
    aa-integration-testing:
      description: Validate integration patterns and certify results
      source: prompts/tasks.yaml#integration_validation.integration_testing
      inputs:
        - title: partner_name
          type: string
        - title: integration_scope
          type: string
        - title: test_results
          type: string
      outputs:
        - title: testing_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [test_results, integration_spec, validation_criteria]
          priority: critical
    aa-version-tracking:
      description: Track API versions and deprecation timelines
      source: prompts/tasks.yaml#integration_validation.version_tracking
      inputs:
        - title: partner_name
          type: string
      outputs:
        - title: version_tracking_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [partner_changelogs, deprecation_notices, release_notes]
          priority: critical
    aa-change-impact:
      description: Assess impact of partner platform changes on integrations
      source: prompts/tasks.yaml#integration_validation.change_impact
      inputs:
        - title: partner_name
          type: string
        - title: api_version
          type: string
      outputs:
        - title: change_impact_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [partner_release_notes, integration_touchpoints, customer_deployments]
          priority: critical
    aa-joint-solution-design:
      description: Design joint solution architecture
      source: prompts/tasks.yaml#solution_architecture.joint_solution_design
      inputs:
        - title: partner_name
          type: string
        - title: solution_requirements
          type: string
      outputs:
        - title: joint_solution_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [partner_platform_capabilities, vendor_platform_apis, integration_patterns]
          priority: critical
    aa-reference-architecture:
      description: Develop or update reference architecture
      source: prompts/tasks.yaml#solution_architecture.reference_architecture
      inputs:
        - title: partner_name
          type: string
        - title: integration_pattern
          type: string
      outputs:
        - title: reference_architecture_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [existing_reference_architectures, integration_patterns, deployment_considerations]
          priority: critical
    aa-deployment-pattern:
      description: Document deployment patterns and considerations
      source: prompts/tasks.yaml#solution_architecture.deployment_pattern
      inputs:
        - title: partner_name
          type: string
        - title: solution_requirements
          type: string
      outputs:
        - title: deployment_pattern_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [deployment_models, infrastructure_requirements, security_constraints]
          priority: critical
    aa-integration-pattern:
      description: Define and validate integration patterns
      source: prompts/tasks.yaml#solution_architecture.integration_pattern
      inputs:
        - title: partner_name
          type: string
        - title: integration_pattern
          type: string
      outputs:
        - title: integration_pattern_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [pattern_library, api_specs, data_flow_maps]
          priority: critical
    aa-cosell-readiness:
      description: Prepare co-sell technical readiness package
      source: prompts/tasks.yaml#technical_enablement.cosell_readiness
      inputs:
        - title: partner_name
          type: string
        - title: engagement_context
          type: string
      outputs:
        - title: cosell_readiness_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [reference_architectures, integration_guides, deployment_considerations, known_limitations]
          priority: critical
    aa-documentation-review:
      description: Review and validate partner technical documentation
      source: prompts/tasks.yaml#technical_enablement.documentation_review
      inputs:
        - title: partner_name
          type: string
        - title: documentation
          type: string
      outputs:
        - title: documentation_review_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [partner_docs, integration_behavior, api_specs]
          priority: critical
    aa-catalog-validation:
      description: Validate partner solution catalog entries
      source: prompts/tasks.yaml#technical_enablement.catalog_validation
      inputs:
        - title: partner_name
          type: string
      outputs:
        - title: catalog_validation_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [catalog_entries, current_api_versions, validation_status]
          priority: critical
    aa-field-enablement:
      description: Prepare field SA enablement materials for partner capabilities
      source: prompts/tasks.yaml#technical_enablement.field_enablement
      inputs:
        - title: partner_name
          type: string
      outputs:
        - title: field_enablement_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [partner_capabilities, integration_patterns, customer_use_cases]
          priority: critical
    aa-technical-assessment:
      description: Assess partner platform technical capabilities
      source: prompts/tasks.yaml#due_diligence.technical_assessment
      inputs:
        - title: partner_name
          type: string
        - title: partner_platform
          type: string
      outputs:
        - title: technical_assessment_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [partner_platform_docs, architecture_overview, security_posture]
          priority: critical
    aa-api-maturity:
      description: Score partner API maturity and design quality
      source: prompts/tasks.yaml#due_diligence.api_maturity
      inputs:
        - title: partner_name
          type: string
        - title: partner_platform
          type: string
      outputs:
        - title: api_maturity_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [api_documentation, sdk_samples, versioning_policy, error_handling]
          priority: critical
    aa-integration-effort:
      description: Estimate integration effort and complexity
      source: prompts/tasks.yaml#due_diligence.integration_effort
      inputs:
        - title: partner_name
          type: string
        - title: integration_requirements
          type: string
      outputs:
        - title: integration_effort_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [api_specs, data_model, auth_model, deployment_model]
          priority: critical
    aa-technical-risk:
      description: Analyze technical risks for prospective partnership
      source: prompts/tasks.yaml#due_diligence.technical_risk
      inputs:
        - title: partner_name
          type: string
        - title: partner_platform
          type: string
      outputs:
        - title: technical_risk_result
          type: object
      requires_data:
        - source: read-aa-data
          fields: [platform_architecture, scalability_data, security_audit, release_cadence]
          priority: critical
  validation:
    required_dimensions:
      - name: context
        description: What partner, integration, or platform is being analyzed?
      - name: source_data
        description: What technical documentation or test results are being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review.
  output_constraints:
    evidence_requirement: All claims must cite specific API versions, test results, or documentation
    total_word_limit: 500
    hard_rule: No compatibility claim without version-specific evidence
  guardrails:
    input:
      - Reject requests without partner name or integration context
      - Verify technical documentation includes version specificity and date
      - Confirm integration test results include environment details
    output:
      - NEVER certify integrations without evidence-based validation
      - NEVER assume API compatibility without version-specific testing
      - NEVER invent test results or compatibility claims
      - Every validation cites specific version combinations tested
      - Reference architectures include known limitations and deployment considerations
    resource:
      - max_tool_calls: 30
  boundaries:
    - Does not make commercial partner commitments (Partner Manager's domain)
    - Does not track partner deliverables or dependencies (Partner Manager's domain)
    - Does not design customer-specific architectures (SA Agent's domain)
    - Does not make vendor product roadmap commitments (PM Agent's domain)
    - Does not certify integrations without evidence-based validation
  permissions:
    - Validate partner integrations and certify compatibility
    - Design joint solution architectures and reference patterns
    - Assess API/SDK compatibility across versions
    - Conduct technical due diligence on prospective partnerships
    - Maintain partner solution catalog with technical specifications
    - Prepare co-sell technical readiness packages
  escalation_triggers:
    - Partner API breaking change affecting 3+ customer deployments (to Field CTO + Partner Manager)
    - Integration validation failure on certified partner solution (to Partner Manager + SA)
    - Security vulnerability in partner integration pattern (to InfoSec)
    - Partner platform direction conflicts with vendor architecture (to PM + Field CTO)
  handoffs:
    human_escalation: Alliance Architect
    outbound:
      - target: partner-agent
        trigger: Integration validation completed or partner technical status changed
        context: Technical readiness status, certification results, compatibility assessment
      - target: sa-agent
        trigger: Joint solution design needed for deal or reference architecture updated
        context: Validated reference architecture, integration patterns, deployment considerations
      - target: ca-agent
        trigger: Integration troubleshooting or upgrade compatibility question from post-sales
        context: Integration troubleshooting guidance, upgrade compatibility matrix, known issues
      - target: fcto-agent
        trigger: Cross-account partner integration patterns or partner technology direction shifts
        context: Partner integration trend data, technology direction changes
      - target: pm-agent
        trigger: Partner API changes requiring vendor platform response
        context: API compatibility impact, integration friction data, partner demand signals
    defer_to:
      sa_agent:
        scope: Solution architecture decisions, technical feasibility for joint solutions
        scenarios:
        - trigger: Joint solution requires architecture review beyond integration layer
          context_passed: Integration requirements, partner platform constraints, deployment model
          receiver_action: Architecture validation, solution design review
      partner_agent:
        scope: Commercial partner decisions, partnership terms, deal registration
        scenarios:
        - trigger: Technical validation complete, commercial partner decision needed
          context_passed: Technical readiness assessment, certification results, integration risk level
          receiver_action: Partner engagement decision, deal registration, co-sell coordination
      ham_agent:
        scope: Hyperscaler program rules, certification requirements, marketplace mechanics
        scenarios:
        - trigger: Integration touches hyperscaler platform or marketplace listing
          context_passed: Integration architecture, platform dependencies, certification gaps
          receiver_action: Program alignment check, certification path guidance
      pm_agent:
        scope: Product roadmap constraints affecting integration compatibility
        scenarios:
        - trigger: Partner API change requires vendor platform adaptation
          context_passed: API compatibility gap analysis, partner timeline, customer impact
          receiver_action: Feasibility assessment, roadmap prioritization
    provide_to:
      sa_agent:
        scope: Validated reference architectures, integration patterns, deployment considerations
        scenarios:
        - trigger: Deal requires joint solution or reference architecture
          context_passed: Integration blueprints, API specifications, certification status
          receiver_action: Incorporate into solution design, validate deployment model
      partner_agent:
        scope: Technical validation results, certification status, integration risk assessment
        scenarios:
        - trigger: Integration validation completed or partner technical status changed
          context_passed: Technical readiness score, certification gaps, remediation recommendations
          receiver_action: Update partner engagement strategy, adjust co-sell readiness
      ae_agent:
        scope: Partner solution capabilities, joint solution positioning for active deals
        scenarios:
        - trigger: Deal involves partner technology or co-sell opportunity
          context_passed: Partner capabilities, integration maturity, reference architecture availability
          receiver_action: Incorporate partner value into deal positioning
      ca_agent:
        scope: Integration troubleshooting guidance, upgrade compatibility, known issues
        scenarios:
        - trigger: Post-sale integration issue or partner platform upgrade
          context_passed: Compatibility matrix, known issues, remediation paths
          receiver_action: Customer communication, upgrade planning, issue resolution
  knowledge:
    scope:
      domains:
        - integration-architecture
        - api-compatibility
        - partner-platforms
        - joint-solutions
        - integration-testing
      archetypes:
        - enterprise
        - mid-market
    references:
      - path: references/integration-architecture-patterns.yaml
        description: Integration patterns, API design principles, data mapping, authentication flows
      - path: references/api-maturity-frameworks.yaml
        description: Richardson Maturity Model, API lifecycle management, versioning strategies, OpenAPI standards
      - path: references/partner-technical-validation.yaml
        description: ISV program technical requirements, marketplace listing criteria, well-architected frameworks
  profile:
    why: >
      Alliance Architects manage 10-20 active partner integrations across different maturity
      levels, API versions, and deployment models. Between integration validation, compatibility
      testing, reference architecture maintenance, partner documentation review, and co-sell
      technical prep, the time for proactive integration monitoring shrinks to a fraction of
      the week. This agent handles compatibility analysis, integration validation, catalog
      maintenance, and technical readiness so the Alliance Architect can focus on architecture
      decisions and partner technical relationships that require human judgment.
    human_matters_summary: >
      The agent validates integrations and tracks compatibility, but the Alliance Architect
      understands the partner's engineering culture, navigates the politics of whose API
      changes first, and builds the technical rapport that makes partners invest in joint
      solution quality. When two engineering teams disagree on integration approach, the
      Alliance Architect mediates with credibility earned through hands-on architecture
      work that no agent can replicate.
    human_matters_goal: >
      Every partner integration is validated, every API change is assessed, every reference
      architecture is current, but the technical partnerships endure because the Alliance
      Architect brought the architecture judgment, relationship trust, and negotiation
      skill that no agent can replicate.
    role_tab_intro: >
      The Alliance Architect sits at the boundary between two technology ecosystems. When
      integrations fail, customers blame both vendors. When joint solutions work seamlessly,
      both vendors benefit from expanded reach. The challenges below are where integration
      quality breaks down, co-sell credibility suffers, and partner solutions drift from
      validated patterns, each mapped to the sub-agent built to handle it.
    goals_summary: >
      The Alliance Architect succeeds when every partner integration is validated before
      customer deployment, API breaking changes are caught before they impact production,
      reference architectures reflect current platform versions, and co-sell engagements
      are technically credible from the first customer meeting.
    goals:
      - Every partner integration validated against current API versions before catalog listing
      - API breaking changes detected and impact-assessed within 48 hours of partner announcement
      - Partner solution catalog entries reviewed and updated at least quarterly
      - Co-sell technical readiness packages prepared before joint customer engagements
      - Reference architectures maintained for each strategic partner integration pattern
      - New partnership technical due diligence completed within 2 weeks of request
      - Integration troubleshooting guidance available for CA teams within 4 hours of escalation
      - Partner technical documentation accuracy validated before customer-facing publication
      - API maturity scores completed for all prospective partnerships before commercial commitment
      - Field SA enablement materials updated quarterly for each strategic partner
    role_context: >
      The Alliance Architect operates where two technology platforms meet. Every ISV
      partnership, SI integration, and co-sell motion depends on technical integration
      that works reliably in production. The Alliance Architect validates that joint
      solutions are architecturally sound, APIs are compatible across versions, and
      integration patterns are documented and tested before they reach customer
      environments. They work across 10-20 partner integrations simultaneously, each
      with different API maturity levels, release cadences, and deployment models. They
      coordinate with Partner Managers on commercial alignment, with SAs on deal-level
      architecture, with CAs on post-sales integration health, and with Field CTOs on
      cross-account integration trends.
