# SK_FCTO_003 - Technology Vision
skill_id: SK_FCTO_003
name: Technology Vision
domain: technology-vision
owner: fcto-technology-vision-agent
description: >
  Monitor technology trends from analyst reports, open-source activity,
  and field signals. Assess portfolio readiness for emerging patterns.
  Develop thought leadership content grounded in field observations.
  Build forward-looking technology direction narratives.
capabilities:
  - Technology trend monitoring and assessment
  - Portfolio readiness evaluation
  - Thought leadership content development
  - Technology direction narrative building
inputs:
  - trend_signals
  - portfolio_context
  - content_scope
  - field_observations
outputs:
  - trend_assessment
  - readiness_evaluation
  - thought_leadership_content
  - technology_narrative
prompts:
  - fcto-trend-monitoring
  - fcto-portfolio-readiness
  - fcto-thought-leadership
  - fcto-technology-narrative
tools:
  - read-fcto-data
  - write-fcto-artifact
quality_gates:
  - Trend assessments cite specific analyst reports with dates
  - Portfolio readiness identifies specific capability gaps
  - Thought leadership maps to documented cross-account patterns
  - Technology narratives connect product roadmap to customer priorities
