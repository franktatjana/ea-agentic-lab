# SK_FCTO_001 - Pattern Synthesis
skill_id: SK_FCTO_001
name: Pattern Synthesis
domain: pattern-synthesis
owner: fcto-pattern-synthesis-agent
description: >
  Detect recurring technical patterns across 50-100+ customer accounts,
  analyze competitive displacement tactics repeating across the install
  base, develop cross-vertical win themes from field evidence, and
  cluster product gap signals by theme, frequency, and revenue impact.
capabilities:
  - Cross-account technical pattern detection
  - Competitive displacement pattern analysis
  - Win theme development across verticals and horizontals
  - Product gap signal clustering by revenue impact
inputs:
  - account_data
  - time_period
  - pattern_scope
  - competitive_context
outputs:
  - pattern_report
  - displacement_analysis
  - win_themes
  - gap_clusters
prompts:
  - fcto-pattern-detection
  - fcto-competitive-displacement
  - fcto-win-theme-development
  - fcto-product-gap-clustering
tools:
  - read-fcto-data
  - write-fcto-artifact
quality_gates:
  - Every pattern cites evidence from at least 3 accounts
  - Competitive displacement analysis includes specific tactics observed
  - Win themes backed by cross-account customer outcomes
  - Product gap clusters include frequency and revenue-weighted impact
