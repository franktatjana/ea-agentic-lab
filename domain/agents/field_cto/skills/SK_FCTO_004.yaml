# SK_FCTO_004 - Field Intelligence
skill_id: SK_FCTO_004
name: Field Intelligence
domain: field-intelligence
owner: fcto-field-intelligence-agent
description: >
  Aggregate field observations from SA and CA engagement data, structure
  intelligence for product strategy consumption with frequency and revenue
  weighting, prepare evidence-backed advisory board input, and provide
  cross-account evidence for strategic deal positioning.
capabilities:
  - Field observation aggregation from SA/CA data
  - Product strategy intelligence structuring and routing
  - Advisory board evidence preparation
  - Strategic deal positioning support
inputs:
  - field_data
  - intelligence_scope
  - deal_context
  - advisory_board_agenda
outputs:
  - aggregated_intelligence
  - product_strategy_report
  - advisory_board_input
  - deal_support_package
prompts:
  - fcto-observation-aggregation
  - fcto-product-strategy-routing
  - fcto-advisory-board-prep
  - fcto-strategic-deal-support
tools:
  - read-fcto-data
  - write-fcto-artifact
quality_gates:
  - Intelligence reports include frequency, source attribution, and revenue weighting
  - Advisory board input references evidence from 3+ accounts
  - Deal support packages cite specific similar deployments and outcomes
  - Product strategy reports structured for PM consumption with actionable recommendations
