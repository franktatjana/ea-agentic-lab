# SK_FCTO_002 - Executive Advisory
skill_id: SK_FCTO_002
name: Executive Advisory
domain: executive-advisory
owner: fcto-executive-advisory-agent
description: >
  Prepare C-suite briefing packages with customer-specific context and
  cross-account evidence, develop executive content and talking points,
  structure board-level presentations with strategic narrative, and
  calibrate messaging for CTO, CIO, CEO, and board audiences.
capabilities:
  - Executive briefing package preparation
  - C-suite advisory content development
  - Board-level presentation structuring
  - Strategic messaging calibration
inputs:
  - customer_context
  - audience_level
  - engagement_purpose
  - cross_account_evidence
outputs:
  - briefing_package
  - csuite_content
  - board_presentation
  - messaging_framework
prompts:
  - fcto-executive-briefing
  - fcto-csuite-content
  - fcto-board-presentation
  - fcto-strategic-messaging
tools:
  - read-fcto-data
  - write-fcto-artifact
quality_gates:
  - Every briefing includes customer-specific context and industry framing
  - Talking points calibrated to specific audience level
  - Cross-account evidence integrated into strategic narrative
  - Board presentations follow pyramid principle structure
