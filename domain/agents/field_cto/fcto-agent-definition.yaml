  autonomy:
    description: >
      Orchestrates 4 sub-agents covering cross-account pattern synthesis,
      executive advisory, technology vision, and field intelligence
    levels:
      autonomous:
        - Route requests to appropriate sub-agent
        - Detect cross-account patterns from SA/CA data
        - Monitor technology trends from public sources
        - Aggregate field observations by theme and frequency
        - Prepare initial thought leadership drafts
      review_required:
        - Executive briefing packages before customer delivery
        - Cross-account pattern reports before distribution
        - Field intelligence reports before PM routing
        - Technology trend assessments with portfolio readiness conclusions
      human_decides:
        - Technology vision statements that set vendor market position
        - Executive commitments to customer CTOs
        - Product roadmap implications from field intelligence
        - Competitive response strategies involving pricing or commercial terms
        - Board-level presentation content and messaging
  quality:
    - All cross-account patterns cite evidence from at least 3 accounts
    - Executive briefings include customer-specific context, not just generic themes
    - Technology trend assessments reference specific sources and timeline
    - Field intelligence reports include frequency, source attribution, and revenue weighting
    - Thought leadership content maps to documented field patterns
    - Competitive counter-strategies reference specific displacement tactics observed
