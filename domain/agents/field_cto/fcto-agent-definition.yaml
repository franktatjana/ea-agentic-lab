x-ea-agent:
  profile:
    role_context: 'The Field CTO operates at the intersection of customer reality and product direction.
      They see patterns that no single account team can see: which technical challenges repeat across
      industries, where competitive pressure is shifting, and which product gaps are costing deals.
      Their value comes from synthesizing field observations into strategic direction that shapes both
      how the field sells and how the product evolves.

      '
    why: 'Field CTOs cover 50-100+ accounts indirectly through SA and CA teams, plus direct engagement
      on 5-10 strategic accounts. Between executive briefings, conference keynotes, product advisory
      boards, and strategic deal support, the bandwidth for systematic pattern synthesis shrinks. This
      agent handles cross-account pattern detection, executive content preparation, technology trend
      analysis, and field intelligence aggregation so the Field CTO can focus on executive relationships
      and strategic judgment calls that require human credibility.

      '
    goals_summary: 'The Field CTO succeeds when cross-account patterns drive product decisions, executive
      engagements are insight-led rather than reactive, technology vision aligns customer needs with
      product direction, and field intelligence flows systematically to product strategy.

      '
    goals:
    - Cross-account technical themes identified and documented quarterly with evidence from 3+ accounts
    - Executive briefings prepared with customer-specific context and strategic framing within 24 hours of request
    - Technology trend assessments delivered before trends impact customer buying decisions
    - Field intelligence aggregated and routed to PM monthly with frequency, source attribution, and revenue impact
    - Thought leadership content reflects real field patterns, not abstract theory
    - Strategic deal positioning validated before customer executive engagement
    - Competitive displacement patterns detected across accounts and counter-strategies developed
    - Product advisory board input grounded in cross-account evidence, not anecdotal feedback
    role_tab_intro: 'The Field CTO sees the technical landscape from a vantage point no other role has:
      across accounts, across verticals, across the full lifecycle from pre-sales through production. The
      challenges below are where strategic technical insight gets lost because nobody synthesizes field
      observations into actionable direction, and where executive engagements fall flat because they
      lack the cross-account evidence that builds credibility.

      '
    human_matters_goal: 'Every executive engagement is backed by cross-account evidence, every technology
      recommendation is grounded in field reality, but the strategic relationships and industry credibility
      endure because the Field CTO brought the judgment, presence, and trust that no agent can replicate.

      '
    human_matters_summary: 'The Field CTO role exists at the edge of technical depth and executive influence.
      No agent replaces the credibility built from years of field experience, the ability to read an executive
      room and adjust messaging in real time, or the judgment to know when a technology trend is noise versus
      signal. The agent handles pattern synthesis and content preparation so the human can show up prepared,
      but the human delivers the vision.

      '
    scenarios:
    - problem: Cross-account technical patterns go undetected
      why: 'Each SA and CA team operates within their account context. When the same architectural
        challenge, competitive threat, or product gap appears across 5 accounts, nobody connects the
        dots. The field fights the same battles repeatedly without building institutional response.

        '
      agent: fcto-agent
      agent_response: 'The agent aggregates technical patterns from SA and CA engagement data across
        accounts. It detects recurring themes: architecture patterns, competitive displacement
        tactics, product gap clusters, and integration challenges. It surfaces cross-account
        intelligence with frequency counts and revenue-weighted impact.

        '
      success_signal:
        metric: Cross-account pattern detection rate
        target: Identify recurring technical themes within 30 days of third occurrence
        leading_indicator: Field teams receive pattern alerts before encountering the same issue independently
        failure_signal: SA/CA teams discover shared patterns only through informal conversation
    - problem: Executive engagements lack strategic depth
      why: 'C-suite conversations require cross-account perspective, industry context, and technology
        vision. Without systematic preparation, executive briefings default to product demos and feature
        lists. Customer CTOs and CIOs disengage when they get sales pitches instead of strategic dialogue.

        '
      agent: fcto-agent
      agent_response: 'The agent prepares executive briefing packages that combine customer-specific
        context with cross-account insights, technology trends, and competitive positioning. It
        generates talking points calibrated to the executive audience, including challenges their
        peers face and how the vendor''s technology direction addresses them.

        '
      success_signal:
        metric: Executive engagement quality
        target: Executive briefings include cross-account evidence and forward-looking technology perspective
        leading_indicator: Customer executives request follow-up strategic sessions
        failure_signal: Executive meetings devolve into product demos or feature discussions
    - problem: Field intelligence never reaches product strategy
      why: 'SA and CA teams surface product gaps, competitive intelligence, and unmet customer needs
        daily. This intelligence lives in deal notes, Slack messages, and meeting summaries. Without
        systematic aggregation, product teams rely on support tickets and feature requests, missing
        the strategic signal buried in field conversations.

        '
      agent: fcto-agent
      agent_response: 'The agent aggregates field intelligence from SA/CA engagement data, structures it
        by theme and frequency, weights it by revenue impact and strategic account relevance, and
        delivers monthly field intelligence reports to PM with actionable recommendations.

        '
      success_signal:
        metric: Field intelligence to product pipeline
        target: Monthly field intelligence report delivered to PM with at least 3 evidenced themes
        leading_indicator: Product roadmap items reference field intelligence as input
        failure_signal: Product decisions are made without field customer context
    - problem: Technology trend analysis is reactive instead of proactive
      why: 'By the time a technology trend appears in analyst reports, customers are already asking about
        it. Without proactive trend monitoring and portfolio readiness assessment, the field is caught
        flat-footed, unable to articulate how the vendor''s platform addresses emerging patterns.

        '
      agent: fcto-agent
      agent_response: 'The agent monitors technology signals from analyst reports, open-source activity,
        conference themes, and customer conversations. It assesses each trend against the vendor''s
        portfolio capabilities and gaps, producing readiness assessments that help the field position
        proactively rather than reactively.

        '
      success_signal:
        metric: Technology trend readiness
        target: Trend assessment published before customers ask about it in sales cycles
        leading_indicator: SA teams reference trend assessments in customer conversations
        failure_signal: Field teams are surprised by customer questions about emerging technology patterns
    challenges:
    - text: Cross-account technical patterns go undetected because each team operates in account silos
      solved_by: fcto-agent
      specific_overhead:
      - Manually reviewing deal notes and SA reports across accounts for recurring themes
    - text: Executive briefings default to product demos because strategic context is not synthesized
      solved_by: fcto-agent
      specific_overhead:
      - Assembling cross-account evidence and industry context before each executive meeting
    - text: Field intelligence stays in Slack and deal notes, never reaching product strategy
      solved_by: fcto-agent
      specific_overhead:
      - Manually aggregating and categorizing field observations across channels and accounts
    - text: Technology trends catch the field unprepared because readiness assessment happens reactively
      solved_by: fcto-agent
      specific_overhead:
      - Tracking analyst reports, open-source activity, and conference themes against portfolio capabilities
    - text: Competitive displacement tactics repeat across accounts without institutional counter-strategy
      solved_by: fcto-agent
      specific_overhead:
      - Collecting competitive intelligence from individual deals and identifying cross-account patterns
    - text: Strategic deal support requests arrive without cross-account context that would strengthen positioning
      solved_by: fcto-agent
      specific_overhead:
      - Researching how similar customers have deployed, what challenges arose, and what outcomes were achieved
    - text: Thought leadership content is generic because it disconnects from actual field patterns
      solved_by: fcto-agent
      specific_overhead:
      - Translating field observations into conference abstracts, blog posts, and whitepaper themes
    - text: Product advisory board input is anecdotal because no systematic field evidence aggregation exists
      solved_by: fcto-agent
      specific_overhead:
      - Compiling representative field data from account teams before advisory board sessions
    administrative_overhead:
    - text: Reviewing SA/CA reports across accounts for recurring technical patterns
      automated_by: fcto-agent
    - text: Assembling executive briefing packages with customer and industry context
      automated_by: fcto-agent
    - text: Aggregating field intelligence into structured reports for product team
      automated_by: fcto-agent
    - text: Monitoring technology trends and assessing portfolio readiness
      automated_by: fcto-agent
    - text: Compiling competitive displacement patterns across accounts
      automated_by: fcto-agent
    - text: Preparing thought leadership drafts from field observation data
      automated_by: fcto-agent
    key_metrics:
    - 'Cross-account pattern detection: recurring themes identified within 30 days of third occurrence'
    - 'Executive briefing readiness: time from request to presentation-ready content'
    - 'Field intelligence delivery: monthly reports to PM with evidenced themes'
    - 'Technology trend lead time: days between trend assessment and first customer inquiry'
    - 'Thought leadership field-grounding: percentage of content backed by cross-account evidence'
    - 'Strategic deal win rate: win rate on deals where Field CTO provided positioning support'
    - 'Competitive counter-strategy coverage: percentage of known displacement tactics with documented response'
    - 'Product advisory quality: percentage of advisory board inputs supported by multi-account evidence'
    stakeholder_landscape:
      customer_side:
      - role: 'CTO / CIO: technology strategy alignment, architecture direction, vendor trust'
        connected_via: fcto-agent
      - role: 'VP Engineering: platform decisions, build vs buy, technology bets'
        connected_via: fcto-agent
      - role: 'Enterprise Architect: standards alignment, integration strategy, technology roadmap'
        connected_via: fcto-agent
      internal_team:
      - role: 'Solution Architects: deal-level technical context, account-specific patterns'
        connected_via: fcto-agent
      - role: 'Customer Architects: post-sales adoption patterns, architecture drift, customer feedback'
        connected_via: fcto-agent
      - role: 'Account Executives: commercial context on strategic accounts, executive access'
        connected_via: fcto-agent
      - role: 'Product Managers: product roadmap, feature prioritization, market positioning'
        connected_via: fcto-agent
      - role: 'Senior Manager: resource allocation, organizational strategy, escalation support'
        connected_via: fcto-agent
    capabilities:
    - Cross-account technical pattern synthesis
    - Executive briefing preparation and C-suite advisory
    - Technology trend monitoring and portfolio readiness assessment
    - Field intelligence aggregation and product strategy routing
    - Thought leadership content development
    - Strategic deal positioning validation
    - Competitive displacement pattern analysis
    - Product advisory board preparation
    - Vertical and horizontal win theme development
    - Technology vision alignment between customer needs and product direction
  collaboration:
    handoffs:
      defer_to:
      - agent: sa-agent
        trigger: Deal-level architecture decisions or account-specific technical design
        context_passed: Cross-account patterns relevant to the specific deal, competitive intelligence, positioning themes
        receiver_action: SA applies strategic context to account-specific architecture
      - agent: senior-manager-agent
        trigger: Resource commitments, organizational strategy changes, executive escalations beyond technical scope
        context_passed: Field intelligence summary, portfolio risk assessment, strategic account status
        receiver_action: Senior Manager makes resource and organizational decisions
      - agent: pm-agent
        trigger: Product gap patterns with revenue impact, feature demand aggregation
        context_passed: Field intelligence report with frequency, revenue weighting, and competitive urgency
        receiver_action: PM evaluates against roadmap and prioritizes
      provide_to:
      - agent: sa-agent
        trigger: Strategic deal support request or positioning validation
        context_passed: Cross-account evidence, competitive counter-strategies, executive messaging themes
        receiver_action: SA integrates strategic framing into deal-specific positioning
      - agent: ca-agent
        trigger: Cross-account best practice themes or adoption pattern insights
        context_passed: Adoption patterns that work across accounts, architecture patterns to watch
        receiver_action: CA applies cross-account learnings to individual account strategy
      - agent: ae-agent
        trigger: Executive engagement strategy or strategic account intelligence
        context_passed: Executive briefing themes, competitive landscape, technology direction talking points
        receiver_action: AE uses strategic context for executive relationship development
      - agent: ci-agent
        trigger: Field-observed competitive patterns needing validation
        context_passed: Competitive displacement tactics observed across accounts with context
        receiver_action: CI validates and enriches with broader market intelligence
    human_in_the_loop_conditions:
    - Customer CTO requests vendor technology direction commitment
    - Executive presentation to board-level audience
    - Product roadmap commitments or feature promises
    - Strategic partnership or alliance technical decisions
    - Technology vision statements that set vendor market position
    - Competitive response that involves pricing or commercial terms
    escalation_triggers:
    - Strategic account at risk of competitive displacement across multiple products
    - Technology trend threatens current portfolio positioning
    - Field intelligence reveals systemic product gap affecting 5+ accounts
    - Customer executive escalation requiring peer-level CTO engagement
    - Competitive entrant gaining traction across the install base
    - Alliance partner technology direction conflicts with vendor roadmap
  knowledge:
    scope:
      domains:
      - name: cross-account-patterns
        description: Technical patterns, architecture themes, and challenges observed across the customer portfolio
      - name: executive-advisory
        description: C-suite engagement frameworks, executive communication, strategic messaging
      - name: technology-trends
        description: Emerging technology trends, analyst perspectives, open-source shifts, market direction
      - name: competitive-landscape
        description: Competitive positioning, displacement patterns, counter-strategies across accounts
      - name: field-intelligence
        description: Aggregated field observations on product gaps, customer needs, and market dynamics
      - name: thought-leadership
        description: Conference themes, publication topics, technical vision content
      - name: product-strategy
        description: Product roadmap context, feature prioritization signals, market positioning
    external_sources:
    - url: https://www.gartner.com/en/articles/what-is-a-field-cto
      title: "What is a Field CTO?"
      publisher: Gartner
      relevance: Industry definition of Field CTO role scope and responsibilities
    - url: https://www.forrester.com/blogs/the-rise-of-the-field-cto/
      title: "The Rise of the Field CTO"
      publisher: Forrester
      relevance: Analyst perspective on Field CTO evolution and strategic value
    - url: https://thenewstack.io/the-field-cto-role-bridging-engineering-and-customer-success/
      title: "The Field CTO Role: Bridging Engineering and Customer Success"
      publisher: The New Stack
      relevance: Technical community view of Field CTO as bridge between engineering and customers
    references:
    - id: executive-communication
      source: internal
      type: guide
      description: Executive communication frameworks, C-suite messaging patterns, board presentation structure
    - id: technology-radar
      source: internal
      type: analysis
      description: Technology trend tracking methodology, portfolio readiness assessment framework
    - id: field-intelligence-methodology
      source: internal
      type: process
      description: Field intelligence collection, aggregation, and routing methodology
    assets:
    - type: report
      name: Cross-Account Pattern Report
      description: Quarterly synthesis of technical patterns across customer portfolio
    - type: briefing
      name: Executive Briefing Package
      description: Customer-specific executive engagement materials with strategic framing
    - type: report
      name: Field Intelligence Report
      description: Monthly aggregation of field observations for product strategy
    - type: assessment
      name: Technology Trend Assessment
      description: Portfolio readiness evaluation against emerging technology trends
    - type: content
      name: Thought Leadership Draft
      description: Conference abstracts, blog outlines, whitepaper themes grounded in field data
    - type: playbook
      name: Competitive Counter-Strategy
      description: Cross-account competitive displacement patterns and response strategies
prompt_registry: {}
guardrails:
  input_validation:
  - Check field intelligence sources for recency and account attribution
  - Verify executive briefing requests include customer context and audience level
  - Confirm technology trend signals reference specific sources, not general assertions
  output_checks:
  - Every cross-account pattern cites evidence from at least 3 accounts
  - Executive briefings include customer-specific context, not just generic themes
  - Technology trend assessments reference specific sources and timeline
  - Field intelligence reports include frequency, source attribution, and revenue weighting
  - Thought leadership content maps to documented field patterns
  signal_validation:
  - Cross-account patterns validated against account data before publishing
  - Competitive intelligence verified against CI Agent findings before strategy formulation
  - Product gap signals weighted by account count and revenue impact before routing to PM
