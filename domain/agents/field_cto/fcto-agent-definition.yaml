        - role: "Senior Manager: resource allocation, organizational strategy, escalation support"
          connected_via: fcto-agent
    challenges:
      - text: The same architectural challenge appears in 5 accounts but nobody connects the dots, so the field fights each battle from scratch
        solved_by: fcto-pattern-synthesis-agent
        specific_overhead:
          - Manually reviewing deal notes and SA reports across 50-100 accounts for recurring themes
        source: "Gartner: organizations with systematic cross-account intelligence outperform peers by 23% on strategic deal wins"
      - text: Competitive displacement tactics that worked against us in one account repeat in the next, with no institutional counter-strategy
        solved_by: fcto-pattern-synthesis-agent
        specific_overhead:
          - Collecting competitive intelligence from individual deals and correlating across accounts
      - text: Product gaps surface account-by-account as isolated feature requests, masking systemic demand that should inform roadmap
        solved_by: fcto-field-intelligence-agent
        specific_overhead:
          - Aggregating and categorizing field observations from Slack, deal notes, and meeting summaries
      - text: Executive briefings default to product demos because customer-specific strategic context is never synthesized in advance
        solved_by: fcto-executive-advisory-agent
        specific_overhead:
          - Assembling cross-account evidence, industry context, and peer benchmarks before each executive meeting
      - text: Customer CTO engagement stalls because the vendor side cannot articulate technology direction beyond the next release
        solved_by: fcto-technology-vision-agent
        specific_overhead:
          - Building forward-looking technology narratives that connect product roadmap to customer strategic priorities
      - text: Board-level presentations are built from scratch each time because no reusable executive narrative framework exists
        solved_by: fcto-executive-advisory-agent
        specific_overhead:
          - Creating executive presentation structures that can be adapted per customer rather than rebuilt
      - text: Technology trends appear in analyst reports before the field can articulate how the vendor platform addresses them
        solved_by: fcto-technology-vision-agent
        specific_overhead:
          - Tracking analyst reports, open-source activity, and conference themes against portfolio capabilities
      - text: Portfolio readiness for emerging patterns (AI, edge, multi-cloud) is never assessed until customers ask in sales cycles
        solved_by: fcto-technology-vision-agent
        specific_overhead:
          - Evaluating vendor platform capabilities against emerging technology requirements proactively
      - text: Field intelligence stays in Slack channels and deal notes, never reaching product strategy in actionable form
        solved_by: fcto-field-intelligence-agent
        specific_overhead:
          - Manually aggregating field observations, weighting by revenue impact, and structuring for PM consumption
      - text: Product advisory board input is anecdotal because no systematic cross-account evidence aggregation exists
        solved_by: fcto-field-intelligence-agent
        specific_overhead:
          - Compiling representative field data from account teams before advisory board sessions
      - text: Strategic deal support requests arrive without cross-account context, so positioning misses evidence from similar deployments
        solved_by: fcto-field-intelligence-agent
        specific_overhead:
          - Researching how similar customers deployed, what challenges arose, and what outcomes were achieved
      - text: Thought leadership content reads as abstract theory because it disconnects from actual field patterns and customer outcomes
        solved_by: fcto-technology-vision-agent
        specific_overhead:
          - Translating field observations into conference abstracts, blog posts, and whitepaper themes grounded in data
    administrative_overhead:
      - text: Reviewing SA/CA reports across accounts for recurring technical patterns
        automated_by: fcto-pattern-synthesis-agent
      - text: Assembling executive briefing packages with customer and industry context
        automated_by: fcto-executive-advisory-agent
      - text: Aggregating field intelligence into structured reports for product team
        automated_by: fcto-field-intelligence-agent
      - text: Monitoring technology trends and assessing portfolio readiness
        automated_by: fcto-technology-vision-agent
      - text: Compiling competitive displacement patterns across accounts
        automated_by: fcto-pattern-synthesis-agent
      - text: Preparing thought leadership drafts from field observation data
        automated_by: fcto-technology-vision-agent
    scenarios:
      - problem: Cross-account technical patterns go undetected
        why: >
          Each SA and CA team operates within their account context. When the same architectural
          challenge, competitive threat, or product gap appears across 5 accounts, nobody connects the
          dots. The field fights the same battles repeatedly without building institutional response.
        agent: fcto-pattern-synthesis-agent
        agent_response: >
          Aggregates technical patterns from SA and CA engagement data across accounts. Detects
          recurring themes: architecture patterns, competitive displacement tactics, product gap
          clusters, and integration challenges. Surfaces cross-account intelligence with frequency
          counts and revenue-weighted impact.
        success_signal: "Recurring technical themes identified within 30 days of third occurrence, before field teams encounter the same issue independently"
      - problem: Executive engagements lack strategic depth
        why: >
          C-suite conversations require cross-account perspective, industry context, and technology
          vision. Without systematic preparation, executive briefings default to product demos and
          feature lists. Customer CTOs and CIOs disengage when they get sales pitches instead of
          strategic dialogue.
        agent: fcto-executive-advisory-agent
        agent_response: >
          Prepares executive briefing packages that combine customer-specific context with cross-account
          insights, technology trends, and competitive positioning. Generates talking points calibrated
          to the executive audience, including challenges their peers face and how the vendor's
          technology direction addresses them.
        success_signal: "Executive briefings include cross-account evidence and customer executives request follow-up strategic sessions"
      - problem: Field intelligence never reaches product strategy
        why: >
          SA and CA teams surface product gaps, competitive intelligence, and unmet customer needs
          daily. This intelligence lives in deal notes, Slack messages, and meeting summaries. Without
          systematic aggregation, product teams rely on support tickets and feature requests, missing
          the strategic signal buried in field conversations.
        agent: fcto-field-intelligence-agent
        agent_response: >
          Aggregates field intelligence from SA/CA engagement data, structures it by theme and frequency,
          weights it by revenue impact and strategic account relevance, and delivers monthly field
          intelligence reports to PM with actionable recommendations.
        success_signal: "Monthly field intelligence report delivered to PM with at least 3 evidenced themes, product roadmap items reference field intelligence as input"
    with_this_agent:
      - domain: Cross-Account Pattern Synthesis
        agent: fcto-pattern-synthesis-agent
        items:
          - "Pattern detection: identify recurring technical challenges, architecture themes, and product gaps across 50-100+ accounts"
          - "Competitive analysis: detect displacement tactics repeating across the install base and develop counter-strategies"
          - "Win themes: develop technical positioning themes that span verticals and horizontals"
          - "Gap clustering: group product gap signals by theme, frequency, and revenue impact for PM routing"
      - domain: Executive Advisory and C-Suite Engagement
        agent: fcto-executive-advisory-agent
        items:
          - "Executive briefings: prepare customer-specific packages with cross-account evidence and industry context"
          - "C-suite content: develop talking points and advisory content calibrated to CTO/CIO audience"
          - "Board presentations: structure board-level narratives with strategic framing and technology vision"
          - "Strategic messaging: calibrate vendor messaging for executive audience with competitive positioning"
      - domain: Technology Vision and Thought Leadership
        agent: fcto-technology-vision-agent
        items:
          - "Trend monitoring: track technology signals from analyst reports, open-source, conferences, and field"
          - "Portfolio readiness: assess vendor platform capabilities against emerging technology patterns"
          - "Thought leadership: develop conference abstracts, blog themes, and whitepaper outlines from field data"
          - "Technology narratives: build forward-looking direction stories connecting roadmap to customer priorities"
      - domain: Field Intelligence and Strategic Support
        agent: fcto-field-intelligence-agent
        items:
          - "Observation aggregation: collect and structure field observations from SA and CA engagement data"
          - "Product routing: deliver structured intelligence to PM with frequency, revenue weighting, and urgency"
          - "Advisory board prep: prepare evidence-backed input for product advisory board sessions"
          - "Deal support: provide cross-account deployment evidence for strategic deal positioning"
    activity_map:
      purpose: >
        The Field CTO exists to bridge what the market needs, what the product delivers,
        and how the field positions it. Everything the Field CTO does falls into one of
        these operational domains. Each domain is owned by a sub-agent that operates
        independently with its own tools, flows, boundaries, and prompt registry.
      domains:
        - domain: Cross-Account Pattern Synthesis
          why: >
            When the same architectural challenge, competitive threat, or product gap appears
            across 5 accounts, nobody connects the dots. The field fights the same battles
            repeatedly. Systematic pattern synthesis turns isolated observations into
            institutional intelligence.
          agent: fcto-pattern-synthesis-agent
          contributing_agents:
            - agent: fcto-field-intelligence-agent
              provides: Raw field observations and deal data for pattern detection
            - agent: fcto-technology-vision-agent
              provides: Technology trend context for pattern interpretation
          owner: fcto-pattern-synthesis-agent
          receives: SA/CA engagement data, deal notes, competitive encounters, architecture reviews
          provides: Pattern reports, competitive displacement analysis, win themes, product gap clusters
          activities:
            - Cross-account technical pattern detection
            - Competitive displacement pattern analysis
            - Win theme development across verticals and horizontals
            - Product gap signal clustering by revenue impact
          cadence: continuous monitoring, quarterly pattern report, per-incident competitive analysis
        - domain: Executive Advisory and C-Suite Engagement
          why: >
            C-suite conversations require cross-account perspective and technology vision.
            Without systematic preparation, executive briefings default to product demos.
            Customer CTOs and CIOs disengage when they get sales pitches instead of
            strategic dialogue.
          agent: fcto-executive-advisory-agent
          contributing_agents:
            - agent: fcto-pattern-synthesis-agent
              provides: Cross-account evidence and competitive positioning
            - agent: fcto-technology-vision-agent
              provides: Technology direction narratives and trend assessments
          owner: fcto-executive-advisory-agent
          receives: Customer context, audience profile, engagement purpose, cross-account patterns
          provides: Executive briefing packages, C-suite talking points, board presentations, messaging frameworks
          activities:
            - Executive briefing package preparation
            - C-suite advisory content development
            - Board-level presentation structuring
            - Strategic messaging calibration
          cadence: per-engagement preparation, quarterly executive narrative refresh
        - domain: Technology Vision and Thought Leadership
          why: >
            By the time a technology trend appears in analyst reports, customers are already
            asking about it. Proactive trend monitoring and portfolio readiness assessment
            keeps the field ahead of customer conversations rather than reacting to them.
          agent: fcto-technology-vision-agent
          contributing_agents:
            - agent: fcto-pattern-synthesis-agent
              provides: Field-observed technology adoption patterns
            - agent: fcto-field-intelligence-agent
              provides: Customer technology inquiries and demand signals
          owner: fcto-technology-vision-agent
          receives: Analyst reports, conference themes, open-source activity, customer inquiries, product roadmap
          provides: Trend assessments, portfolio readiness evaluations, thought leadership content, technology narratives
          activities:
            - Technology trend monitoring and assessment
            - Portfolio readiness evaluation
            - Thought leadership content development
            - Technology direction narrative building
          cadence: continuous trend monitoring, quarterly readiness assessment, per-event thought leadership
        - domain: Field Intelligence and Strategic Support
          why: >
            SA and CA teams surface product gaps, competitive intelligence, and unmet needs
            daily. Without systematic aggregation, product teams miss the strategic signal
            buried in field conversations. Structured field intelligence turns scattered
            observations into product strategy input.
          agent: fcto-field-intelligence-agent
          contributing_agents:
            - agent: fcto-pattern-synthesis-agent
              provides: Cross-account patterns for intelligence context
            - agent: fcto-executive-advisory-agent
              provides: Executive engagement insights and customer priority signals
          owner: fcto-field-intelligence-agent
          receives: SA reports, CA reports, deal notes, Slack observations, field feedback
          provides: Aggregated intelligence, product strategy reports, advisory board input, deal support packages
          activities:
            - Field observation aggregation from SA/CA data
            - Product strategy intelligence structuring and routing
            - Advisory board evidence preparation
            - Strategic deal positioning support
          cadence: continuous aggregation, monthly PM intelligence report, per-board advisory prep
