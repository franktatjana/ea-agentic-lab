          connected_via: fcto-pattern-synthesis-agent
        - role: "Customer Architects: post-sales adoption patterns, architecture drift, customer feedback themes"
          connected_via: fcto-field-intelligence-agent
        - role: "Account Executives: commercial context on strategic accounts, executive access, deal intelligence"
          connected_via: fcto-executive-advisory-agent
        - role: "Product Managers: product roadmap, feature prioritization, market positioning, API strategy"
          connected_via: fcto-field-intelligence-agent
        - role: "Alliance Architects: partner integration patterns, technology direction shifts, ecosystem trends"
