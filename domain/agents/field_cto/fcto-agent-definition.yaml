# Field CTO Agent - Orchestrator Definition
# Oracle Agent Spec 26.1.0
# Sub-agents: fcto-pattern-synthesis, fcto-executive-advisory, fcto-technology-vision, fcto-field-intelligence
# Role: Digital twin of the Field CTO
agentspec_version: 26.1.0
component_type: Agent
id: fcto-agent
name: Field CTO Agent
description: >
  Digital twin of the Field CTO role. Orchestrates cross-account technical strategy
  across pattern synthesis, executive advisory, technology vision, and field intelligence
  through 4 specialized sub-agents. The bridge between what the market needs, what the
  product delivers, and how the field positions it.
metadata:
  definition_version: 1.0.0
  parent_agent: null
  disclaimer: This agent specification is a reference design for educational and demonstration purposes. It is not a production system. All examples, case studies, and scenarios are fictional.
  tags:
    - field-cto
    - technical-strategy
    - thought-leadership
    - executive-advisory
    - technology-vision
    - cross-account
    - pattern-synthesis
    - field-intelligence
  responsibility: >
    Orchestrate 4 sub-agents covering cross-account pattern synthesis, executive
    advisory, technology vision, and field intelligence aggregation
system_prompt: >
  You are the Field CTO Orchestrator. You are a PURE ROUTER.
  You DO NOT perform strategic analysis directly.
  You route every request to exactly one of your 4 sub-agents.

  ROUTING TABLE:

  fcto-pattern-synthesis-agent
    - Cross-account technical pattern detection
    - Competitive displacement pattern analysis
    - Win theme development across verticals and horizontals
    - Product gap clustering across accounts
    - Architecture pattern correlation

  fcto-executive-advisory-agent
    - Executive briefing preparation
    - C-suite advisory content
    - Board-level presentation structure
    - Executive messaging and talking points
    - Strategic account executive engagement

  fcto-technology-vision-agent
    - Technology trend monitoring and assessment
    - Portfolio readiness evaluation
    - Thought leadership content development
    - Technology direction narratives
    - Emerging pattern analysis (AI, edge, multi-cloud)

  fcto-field-intelligence-agent
    - Field observation aggregation from SA/CA teams
    - Product strategy intelligence routing to PM
    - Advisory board preparation
    - Strategic deal positioning support
    - Demand signal structuring

  ROUTING RULES:
  1. Parse the user request for domain signals
  2. Route to exactly ONE sub-agent
  3. If the request spans multiple domains, route to the PRIMARY domain
     and note which secondary sub-agents should be consulted
  4. NEVER generate strategic analysis yourself

  AGGREGATION: When a request requires cross-domain synthesis (e.g.,
  "full strategic account review"), trigger parallel assessments from
  relevant sub-agents and aggregate their outputs into a unified view.

  MUST NOT:
  - Perform strategic analysis directly
  - Make product commitments or roadmap promises
  - Override SA architecture decisions on specific accounts
  - Commit vendor resources without Leadership approval
  - Invent market data or competitive intelligence not evidenced
  - Handle deal-level execution (SA Agent's domain)
  - Manage account operations (AE/CA Agent's domain)
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.5
    max_tokens: 4096
inputs:
  - title: strategic_request
    type: string
    description: The strategic request to route
  - title: account_context
    type: string
    description: Account and portfolio context
outputs:
  - title: routed_response
    type: object
    description: Response from the appropriate sub-agent
tools:
  - component_type: ClientTool
    id: invoke-fcto-pattern-synthesis
    name: Invoke Pattern Synthesis Agent
    description: Route to pattern synthesis sub-agent for cross-account patterns, competitive displacement, win themes
    requires_confirmation: false
    inputs:
      - title: task
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: sub-agent
  - component_type: ClientTool
    id: invoke-fcto-executive-advisory
    name: Invoke Executive Advisory Agent
    description: Route to executive advisory sub-agent for briefings, C-suite content, board presentations
    requires_confirmation: false
    inputs:
      - title: task
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: sub-agent
  - component_type: ClientTool
    id: invoke-fcto-technology-vision
    name: Invoke Technology Vision Agent
    description: Route to technology vision sub-agent for trend monitoring, portfolio readiness, thought leadership
    requires_confirmation: false
    inputs:
      - title: task
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: sub-agent
  - component_type: ClientTool
    id: invoke-fcto-field-intelligence
    name: Invoke Field Intelligence Agent
    description: Route to field intelligence sub-agent for observation aggregation, PM routing, deal support
    requires_confirmation: false
    inputs:
      - title: task
        type: string
    outputs:
      - title: result
        type: object
    x-ea-agent:
      risk: low
      resolver: sub-agent
  - component_type: ClientTool
    id: read-fcto-data
    name: Read Field CTO Data
    description: "Access data sources: cross-account patterns, executive briefing requests, technology trends, field intelligence, SA/CA reports"
    requires_confirmation: false
    inputs:
      - title: query
        type: string
    outputs:
      - title: data
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry
  - component_type: ClientTool
    id: write-fcto-artifact
    name: Write Field CTO Artifact
    description: "Save artifacts: executive briefings, pattern reports, technology assessments, field intelligence reports"
    requires_confirmation: true
    inputs:
      - title: artifact
        type: object
      - title: destination_path
        type: string
    outputs:
      - title: status
        type: string
    x-ea-agent:
      risk: medium
      resolver: service-registry
  - component_type: ClientTool
    id: ask-user
    name: Ask User
    description: Request clarification or additional input from the user
    requires_confirmation: false
    inputs:
      - title: question
        type: string
    outputs:
      - title: answer
        type: string
    x-ea-agent:
      risk: low
      resolver: inline
toolboxes: []
specialized_agents:
  - component_type: SpecializedAgent
    id: fcto-agent-proactive
    name: Field CTO Agent (Proactive)
    description: "Proactive mode: scans for cross-account patterns and surfaces strategic themes without prompting"
    agent:
      $component_ref: fcto-agent
    agent_specialization_parameters:
      additional_instructions: >
        Focus on proactive pattern detection across accounts. Scan for
        emerging technical themes, competitive shifts, and portfolio-level risks.
        Surface strategic insights before being asked. Prioritize timeliness
        and executive relevance over granularity.
      human_in_the_loop: true
  - component_type: SpecializedAgent
    id: fcto-agent-analytical
    name: Field CTO Agent (Analytical)
    description: "Analytical mode: deep strategic analysis with cross-account evidence and trend synthesis"
    agent:
      $component_ref: fcto-agent
    agent_specialization_parameters:
      additional_instructions: >
        Focus on depth and cross-account pattern synthesis. Provide
        comprehensive strategic analysis with full evidence trails across
        accounts. Identify structural themes vs isolated incidents. Include
        confidence levels and market context.
      human_in_the_loop: true
flows:
  - component_type: Flow
    id: pattern-synthesis
    name: Pattern Synthesis
    description: Flow for cross-account pattern detection, competitive displacement analysis, and win theme development.
    inputs:
      - title: account_data
        type: string
      - title: time_period
        type: string
      - title: pattern_scope
        type: string
    outputs:
      - title: pattern_result
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: fcto-pattern-detection
          input: account_data, time_period
          description: Detect recurring technical patterns across accounts
        - step: 2
          prompt: fcto-competitive-displacement
          input: account_data
          description: Analyze competitive displacement patterns across install base
        - step: 3
          prompt: fcto-win-theme-development
          input: pattern_scope
          description: Develop technical win themes spanning verticals and horizontals
        - step: 4
          prompt: fcto-product-gap-clustering
          input: account_data
          description: Cluster product gap signals by theme, frequency, and revenue impact
  - component_type: Flow
    id: executive-advisory
    name: Executive Advisory
    description: Flow for executive briefing preparation, C-suite content, and strategic messaging.
    inputs:
      - title: customer_context
        type: string
      - title: audience_level
        type: string
      - title: engagement_purpose
        type: string
    outputs:
      - title: advisory_result
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: fcto-executive-briefing
          input: customer_context, audience_level
          description: Prepare executive briefing package with strategic framing
        - step: 2
          prompt: fcto-csuite-content
          input: customer_context, engagement_purpose
          description: Develop C-suite advisory content and talking points
        - step: 3
          prompt: fcto-board-presentation
          input: customer_context
          description: Structure board-level presentation with cross-account evidence
        - step: 4
          prompt: fcto-strategic-messaging
          input: customer_context, audience_level
          description: Calibrate strategic messaging for executive audience
  - component_type: Flow
    id: technology-vision
    name: Technology Vision
    description: Flow for technology trend monitoring, portfolio readiness, and thought leadership.
    inputs:
      - title: trend_signals
        type: string
      - title: portfolio_context
        type: string
      - title: content_scope
        type: string
    outputs:
      - title: vision_result
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: fcto-trend-monitoring
          input: trend_signals
          description: Monitor and assess technology trends against portfolio
        - step: 2
          prompt: fcto-portfolio-readiness
          input: trend_signals, portfolio_context
          description: Evaluate portfolio readiness for emerging technology patterns
        - step: 3
          prompt: fcto-thought-leadership
          input: content_scope
          description: Develop thought leadership content from field observations
        - step: 4
          prompt: fcto-technology-narrative
          input: portfolio_context
          description: Build forward-looking technology direction narratives
  - component_type: Flow
    id: field-intelligence
    name: Field Intelligence
    description: Flow for field observation aggregation, product strategy routing, and deal support.
    inputs:
      - title: field_data
        type: string
      - title: intelligence_scope
        type: string
      - title: deal_context
        type: string
    outputs:
      - title: intelligence_result
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: fcto-observation-aggregation
          input: field_data, intelligence_scope
          description: Aggregate field observations from SA/CA engagement data
        - step: 2
          prompt: fcto-product-strategy-routing
          input: field_data
          description: Structure field intelligence for product strategy consumption
        - step: 3
          prompt: fcto-advisory-board-prep
          input: field_data
          description: Prepare evidence-backed input for product advisory board
        - step: 4
          prompt: fcto-strategic-deal-support
          input: deal_context
          description: Provide cross-account evidence for strategic deal positioning
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: "0.1"
    capabilities:
      - pattern-synthesis
      - executive-advisory
      - technology-vision
      - field-intelligence
    input_modes:
      - text/plain
      - application/json
    output_modes:
      - application/yaml
      - application/json
      - text/markdown
      - text/plain
x-ea-agent:
  prompt_registry:
    fcto-pattern-detection:
      description: Detect recurring technical patterns across customer accounts
      source: prompts/tasks.yaml#pattern_synthesis.pattern_detection
      inputs:
        - title: account_data
          type: string
        - title: time_period
          type: string
      outputs:
        - title: pattern_report
          type: object
      requires_data:
        - source: read-fcto-data
          fields: [sa_engagement_data, ca_engagement_data, deal_notes, architecture_reviews]
          priority: critical
    fcto-competitive-displacement:
      description: Analyze competitive displacement patterns across install base
      source: prompts/tasks.yaml#pattern_synthesis.competitive_displacement
      inputs:
        - title: account_data
          type: string
      outputs:
        - title: displacement_analysis
          type: object
      requires_data:
        - source: read-fcto-data
          fields: [competitive_encounters, win_loss_data, displacement_tactics]
          priority: critical
    fcto-win-theme-development:
      description: Develop technical win themes spanning verticals and horizontals
      source: prompts/tasks.yaml#pattern_synthesis.win_theme_development
      inputs:
