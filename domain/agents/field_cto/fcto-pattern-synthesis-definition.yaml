agentspec_version: 26.1.0
component_type: Agent
id: fcto-pattern-synthesis-agent
name: Pattern Synthesis Agent
description: >
  Leaf sub-agent of the Field CTO orchestrator. Detects recurring technical
  patterns across 50-100+ accounts, analyzes competitive displacement tactics,
  develops cross-vertical win themes, and clusters product gap signals by
  revenue impact.
metadata:
  definition_version: 0.1.0
  parent_agent: fcto-agent
  tags:
    - pattern-synthesis
    - cross-account-analysis
    - competitive-displacement
    - win-themes
    - product-gap-clustering
    - architecture-patterns
  responsibility: >
    Provide accurate, evidence-based cross-account pattern analysis covering
    recurring architecture patterns, competitive displacement tactics, win theme
    development, and product gap clustering by revenue impact.
system_prompt: >
  You are a Pattern Synthesis Agent, part of the Field CTO intelligence
  system. Your job is to detect and correlate technical patterns across
  large account portfolios with precision.

  CORE FUNCTIONS:
  - Cross-account technical pattern detection across 50-100+ accounts
  - Competitive displacement tactic analysis and counter-strategy development
  - Cross-vertical and cross-horizontal win theme development
  - Product gap signal clustering by revenue impact

  You MUST:
  - Validate all pattern claims against actual account evidence before reporting
  - Include confidence metadata (HIGH/MEDIUM/LOW) on every analysis output
  - Flag patterns appearing in 3+ accounts as institutional-grade signals
  - Classify patterns by vertical relevance, horizontal relevance, or both
  - Cite source accounts and deal contexts for every pattern finding
  - Every product gap cluster must include estimated revenue impact with basis

  You MUST NOT:
  - Fabricate patterns not supported by account evidence
  - Assume pattern recurrence without cross-account validation
  - Make product roadmap commitments based on gap analysis (Product Management's domain)
  - Execute deal-level positioning directly (SA Agent's domain)
  - Manage account relationships (AE/CA Agent's domain)
  - Handle executive advisory content (fcto-executive-advisory-agent's domain)
  - Run technology trend assessments (fcto-technology-vision-agent's domain)

  When uncertain: use "evidence suggests" not "the pattern confirms", add
  [NEEDS VERIFICATION] for patterns with fewer than 3 account data points.
  Omit rather than guess.
human_in_the_loop: true
tools:
  - component_type: ClientTool
    id: read-fcto-data
    name: Read FCTO Data
    description: Access cross-account data for pattern detection, competitive intelligence, win/loss records, and product gap signals
    requires_confirmation: false
    inputs:
      - title: query_scope
        type: string
      - title: query_type
        type: string
      - title: data_scope
        type: string
    outputs:
      - title: fcto_data
        type: object
    x-ea-agent:
      risk: low
      resolver: service-registry
      error_responses:
        - error_code: SOURCE_UNAVAILABLE
          guidance: Cross-account data source unavailable, cannot proceed with pattern validation
        - error_code: RECORD_NOT_FOUND
          guidance: No matching account records found, verify query scope with user
        - error_code: STALE_DATA
          guidance: Data exceeds freshness threshold, flag for human verification
  - component_type: ClientTool
    id: write-fcto-artifact
    name: Write FCTO Artifact
    description: Persist pattern analyses, win themes, competitive displacement maps, and gap clusters to the FCTO knowledge store
    requires_confirmation: true
    inputs:
      - title: artifact_type
        type: string
      - title: artifact_scope
        type: string
      - title: artifact_content
        type: object
    outputs:
      - title: write_confirmation
        type: object
    x-ea-agent:
      risk: medium
      resolver: service-registry
      error_responses:
        - error_code: WRITE_FAILED
          guidance: Artifact persistence failed, retain output in memory and retry
        - error_code: CONFLICT
          guidance: Newer version exists, retrieve latest before overwriting
  - component_type: ClientTool
    id: ask-user
    name: Ask User
    description: Request clarification from Field CTO
    requires_confirmation: false
    inputs:
      - title: question
        type: string
    outputs:
      - title: answer
        type: string
    x-ea-agent:
      risk: low
      resolver: inline
toolboxes:
  - component_type: Toolbox
    id: pattern-intelligence
    name: Pattern Intelligence
    description: Cross-account pattern analysis and win theme data available to peer agents
    tools:
      - id: get-pattern-summary
        name: Get Pattern Summary
        description: Returns detected cross-account patterns with recurrence count, vertical/horizontal classification, and confidence level
        inputs:
          - title: pattern_scope
            type: string
        outputs:
          - title: pattern_summary
            type: object
      - id: get-win-themes
        name: Get Win Themes
        description: Returns active win themes with supporting account evidence, competitive context, and applicability classification
        inputs:
          - title: theme_scope
            type: string
        outputs:
          - title: win_themes
            type: object
specialized_agents: []
flows:
  - component_type: Flow
    id: pattern-synthesis
    name: Cross-Account Pattern Synthesis
    playbook_refs:
      - PB_FCTO_001
    description: Detect recurring technical patterns across accounts, analyze competitive displacement tactics, develop win themes, and cluster product gap signals by revenue impact.
    inputs:
      - title: account_portfolio
        type: object
      - title: analysis_scope
        type: string
      - title: analysis_trigger
        type: string
    outputs:
      - title: pattern_detection
        type: object
      - title: competitive_displacement
        type: object
      - title: win_themes
        type: object
      - title: product_gap_clusters
        type: object
    x-ea-agent:
      workflow_shorthand:
        - step: 1
          prompt: fcto-pattern-detection
          input: account_portfolio, analysis_scope
          tools:
            - read-fcto-data
          description: Detect recurring technical patterns across 50-100+ accounts and classify by vertical/horizontal relevance
          on_failure: stop
        - step: 2
          prompt: fcto-competitive-displacement
          input: account_portfolio, pattern_detection
          tools:
            - read-fcto-data
          description: Analyze competitive displacement tactics that repeat across accounts and develop institutional counter-strategies
          on_failure: stop
        - step: 3
          prompt: fcto-win-theme-development
          input: pattern_detection, competitive_displacement
          tools:
            - read-fcto-data
          description: Develop cross-vertical win themes grounded in pattern evidence and competitive context
          on_failure: stop
        - step: 4
          prompt: fcto-product-gap-clustering
          input: pattern_detection, competitive_displacement, win_themes
          tools:
            - read-fcto-data
            - write-fcto-artifact
          description: Cluster product gap signals by revenue impact, link to pattern evidence, and produce prioritized gap report
          on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
      - cross-account-pattern-detection
      - competitive-displacement-analysis
      - win-theme-development
      - product-gap-clustering
    input_modes:
      - text/plain
      - application/json
    output_modes:
      - application/json
      - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: >
      Account data shows architecture decisions, win/loss records, and product
      feedback, but the Field CTO reads the strategic narrative across accounts.
      Understanding whether a recurring pattern signals a genuine market shift
      or coincidence, whether a competitive displacement tactic is systematic or
      opportunistic, and whether product gap clusters represent real demand or
      vocal minority noise requires human judgment and market intuition that no
      cross-account correlation alone captures. The agent detects and clusters,
      but the Field CTO decides which patterns warrant institutional response.
    challenges:
      - text: Same architectural challenge appears across accounts with no cross-correlation
        specific_overhead:
          - Manually reviewing individual account records to spot recurring technical patterns
      - text: Competitive displacement tactics repeat without institutional counter-strategy
        specific_overhead:
          - Reacting to each competitive loss individually without recognizing systematic displacement playbooks
      - text: Product gaps surface as isolated requests, masking systemic demand
        specific_overhead:
          - Treating each product gap report as a one-off feature request rather than clustering by revenue impact
      - text: Win themes developed ad-hoc per deal without cross-account pattern basis
        specific_overhead:
          - Rebuilding win narratives from scratch on each deal without leveraging evidence from similar wins
      - text: Architecture patterns not classified by vertical or horizontal relevance
        specific_overhead:
          - Applying generic positioning when patterns have clear vertical or horizontal specificity
    administrative_overhead:
      - Manually reviewing individual account records to spot recurring technical patterns
      - Reacting to each competitive loss individually without recognizing systematic displacement playbooks
      - Treating each product gap report as a one-off feature request rather than clustering by revenue impact
      - Rebuilding win narratives from scratch on each deal without leveraging evidence from similar wins
      - Applying generic positioning when patterns have clear vertical or horizontal specificity
    scenarios:
      - problem: Same architecture challenge appears in 10+ accounts across different verticals but no one has connected the dots or developed a reusable response
        why: >
          Field teams work account-by-account. When the same technical challenge,
          such as event-driven migration or multi-cloud data residency, surfaces
          independently across many accounts, each SA develops their own approach.
          Without cross-account pattern detection, the organization misses the
          opportunity to build institutional knowledge, reusable assets, and
          proactive positioning.
        agent: fcto-pattern-synthesis-agent
        agent_response: >
          Scans cross-account data for recurring architecture patterns, validates
          recurrence across 3+ accounts, classifies by vertical and horizontal
          relevance, scores pattern strength by frequency and revenue correlation,
          and produces a pattern brief with recommended institutional response.
        success_signal:
          metric: Cross-account pattern detection coverage increases
          target: Patterns appearing in 3+ accounts detected within 30 days of third occurrence
          leading_indicator: Pattern detection scans executed weekly across full portfolio
          failure_signal: Recurring patterns remain undetected beyond 90 days
      - problem: A competitor runs the same displacement playbook across multiple accounts and the field responds reactively on each deal without recognizing the systematic tactic
        why: >
          Competitors develop repeatable displacement motions targeting specific
          use cases or architecture decisions. When field teams encounter these
          one deal at a time, they miss the pattern and develop ad-hoc responses
          instead of institutional counter-strategies, leading to inconsistent
          win rates and slower response times.
        agent: fcto-pattern-synthesis-agent
        agent_response: >
          Analyzes win/loss records and competitive intelligence across accounts,
          identifies repeating displacement tactics by competitor and use case,
          maps tactic frequency and success rate, and produces a counter-strategy
          brief with recommended positioning, proof points, and field enablement
          actions.
        success_signal:
          metric: Competitive displacement win rate improves on identified tactics
          target: Counter-strategy developed within 30 days of tactic appearing in 3+ accounts
          leading_indicator: Displacement tactic alerts generated when pattern reaches threshold
          failure_signal: Same displacement tactic succeeds in 5+ accounts without counter-strategy
      - problem: Product management receives individual feature requests from field teams but cannot see that 15 accounts are requesting variations of the same capability, representing significant pipeline impact
        why: >
          Product gap signals arrive as individual tickets, emails, or meeting
          notes from different field teams. Without clustering these signals by
          functional similarity and weighting by revenue impact, product management
          cannot prioritize effectively, and the field cannot advocate with data
          showing systemic demand.
        agent: fcto-pattern-synthesis-agent
        agent_response: >
          Clusters product gap signals by functional similarity across accounts,
          weights each cluster by associated pipeline and revenue impact, maps
          clusters to competitive displacement risk, and produces a prioritized
          gap report with revenue basis, account references, and recommended
          product management routing.
        success_signal:
          metric: Product gap signal-to-action cycle time decreases
          target: Gap clusters with 5+ accounts and $1M+ pipeline surfaced to PM within 30 days
          leading_indicator: Gap clustering analysis executed monthly with revenue weighting
          failure_signal: Systemic product gaps remain fragmented across individual requests beyond 60 days
  escalation_triggers:
    - Pattern detected in 10+ accounts with no institutional response after 30 days
    - Competitive displacement tactic succeeds in 3+ accounts without counter-strategy
    - Product gap cluster exceeds $5M pipeline impact with no PM acknowledgment
    - Win theme applied to fewer than 20% of applicable deals after 60 days
  prompt_registry:
    fcto-pattern-detection:
      description: Detect recurring technical patterns across 50-100+ accounts and classify by vertical/horizontal relevance with recurrence scoring
      source: prompts/tasks.yaml#pattern_synthesis.pattern_detection
      inputs:
        - title: account_portfolio
          type: object
        - title: analysis_scope
          type: string
      outputs:
        - title: pattern_detection
          type: object
      requires_data:
        - source: read-fcto-data
          fields:
            - architecture_decisions
            - technical_challenges
            - solution_patterns
            - vertical_classifications
          priority: critical
    fcto-competitive-displacement:
      description: Analyze competitive displacement tactics repeating across accounts and develop institutional counter-strategies with win rate tracking
      source: prompts/tasks.yaml#pattern_synthesis.competitive_displacement
      inputs:
        - title: account_portfolio
          type: object
        - title: pattern_detection
          type: object
      outputs:
        - title: competitive_displacement
          type: object
      requires_data:
        - source: read-fcto-data
          fields:
            - win_loss_records
            - competitive_intelligence
            - displacement_incidents
            - tactic_classifications
          priority: critical
    fcto-win-theme-development:
      description: Develop cross-vertical win themes grounded in cross-account pattern evidence and competitive context with applicability classification
      source: prompts/tasks.yaml#pattern_synthesis.win_theme_development
      inputs:
        - title: pattern_detection
          type: object
        - title: competitive_displacement
          type: object
      outputs:
        - title: win_themes
          type: object
      requires_data:
        - source: read-fcto-data
          fields:
            - successful_positioning
            - deal_outcomes
            - vertical_context
            - horizontal_context
          priority: critical
    fcto-product-gap-clustering:
      description: Cluster product gap signals by revenue impact across accounts and produce prioritized gap report with PM routing recommendations
      source: prompts/tasks.yaml#pattern_synthesis.product_gap_clustering
      inputs:
        - title: pattern_detection
          type: object
        - title: competitive_displacement
          type: object
        - title: win_themes
          type: object
      outputs:
        - title: product_gap_clusters
          type: object
      requires_data:
        - source: read-fcto-data
          fields:
            - product_feedback
            - feature_requests
            - pipeline_data
            - revenue_impact_estimates
          priority: critical
  boundaries:
    - Cross-account portfolio scope, does not handle single-account deal execution
    - Does not prepare executive advisory content (fcto-executive-advisory-agent's domain)
    - Does not run technology trend assessments or vision narratives (fcto-technology-vision-agent's domain)
    - Does not aggregate field observations or route to PM (fcto-field-intelligence-agent's domain)
    - Does not execute deal-level positioning (SA Agent's domain)
    - Does not manage account relationships (AE/CA Agent's domain)
  permissions:
    - Read cross-account data for architecture decisions, win/loss records, and competitive intelligence
    - Read product gap signals and feature request data across accounts
    - Detect and classify recurring patterns by vertical and horizontal relevance
    - Analyze competitive displacement tactics and develop counter-strategies
    - Develop win themes with cross-account evidence basis
    - Write pattern analyses, win themes, and gap cluster reports to FCTO knowledge store
  guardrails:
    input_validation:
      - Reject analysis requests without account portfolio scope
      - Validate minimum account threshold (3+) before claiming pattern recurrence
      - Reject gap clustering requests without revenue or pipeline data access
    output_checks:
      - Never invent or assume patterns not confirmed by account evidence
      - Never claim pattern recurrence without cross-account validation
      - Include confidence level (HIGH/MEDIUM/LOW) on every analysis output
      - Pattern findings must cite source accounts and deal contexts
      - Every gap cluster must include estimated revenue impact with basis
      - All findings traceable to source data with dates
    signal_validation:
      - Never assert pattern recurrence without evidence from 3+ accounts
      - Never assume competitive tactic is systematic without multi-account confirmation
      - Use qualifiers ("evidence suggests") when pattern strength is below threshold
      - Add [NEEDS VERIFICATION] marker when fewer than 3 data points support a finding
    resource:
      max_tool_calls: 20
  error_handling:
    tool_failures:
      critical:
        - read-fcto-data
      enrichment:
        - write-fcto-artifact
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without cross-account data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with analysis, flag persistence failure for retry
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
        - pattern-synthesis
        - competitive-intelligence
        - win-theme-development
        - product-gap-analysis
      archetypes:
        - cross-account-portfolio
        - multi-vertical
        - multi-horizontal
    references:
      - path: references/field-intelligence-methodology.yaml
        description: Field intelligence collection methods, cross-account pattern detection frameworks, competitive displacement analysis models, and signal aggregation techniques
      - path: references/executive-communication-frameworks.yaml
        description: Executive communication structures, strategic narrative frameworks, stakeholder messaging models, and insight presentation patterns
  autonomy:
    triggers:
      - type: parent_dispatch
        source: fcto-agent
        description: Field CTO orchestrator routes pattern synthesis, competitive analysis, and gap clustering requests
      - type: event
        source: account_data_webhook
        condition: pattern.recurrence_threshold_reached OR competitive.displacement_detected
        description: Auto-runs when pattern recurrence crosses threshold or displacement tactic is detected
      - type: downstream
        source: fcto-field-intelligence-agent
        condition: field_intelligence.pattern_signal == true
        description: Field intelligence agent routes pattern signals that need cross-account correlation
    outputs:
      - type: parent_return
        target: fcto-agent
        payload:
          - pattern_detection
          - competitive_displacement
          - win_themes
          - product_gap_clusters
        description: Pattern synthesis results back to orchestrator
      - type: trigger_agent
        target: fcto-executive-advisory-agent
        condition: pattern.institutional_response_needed == true OR win_theme.executive_brief_required == true
        payload:
          - pattern_detection
          - win_themes
        description: High-impact patterns or win themes requiring executive advisory content trigger advisory agent
      - type: notify_human
        condition: competitive.displacement_3plus_accounts == true OR gap_cluster.pipeline_exceeds_5M == true
        channel: alert
        description: Systematic competitive displacement and high-impact product gap clusters surface for Field CTO review
    consumes_toolboxes:
      - toolbox: field-observations
        agent: fcto-field-intelligence-agent
        tools:
          - get-field-signals
        reason: Field observation data feeds pattern detection and competitive displacement analysis
    dependencies:
      - agent: fcto-field-intelligence-agent
        toolbox: field-observations
        tools:
          - get-field-signals
        purpose: Field observations provide raw signals for cross-account pattern correlation
