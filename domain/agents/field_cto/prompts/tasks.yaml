# Field CTO Agent - Task Prompts (Runbook Format)
# Purpose: Full runbook prompts with numbered steps, named deliverables, and quality checks
# Reference: Personality defined in personalities/fcto_personality.yaml
# Standard: docs/architecture/playbooks/runbook-design-principles.md
# 16 prompts across 4 runbook domains

# ============================================================================
# PATTERN SYNTHESIS PROMPTS
# ============================================================================
pattern_synthesis:

  pattern_detection:
    id: fcto-pattern-detection
    name: "Cross-Account Technical Pattern Detection"
    description: "Detect recurring technical patterns across multiple accounts by aggregating field observations, weighting by revenue impact, and classifying pattern maturity for strategic action"
    domain: pattern_synthesis
    inputs:
      - name: field_observations
        required: true
        description: Aggregated field observations from SAs, SEs, and account teams across accounts
      - name: account_portfolio
        required: true
        description: Account portfolio with revenue data, verticals, and technology profiles
      - name: prior_pattern_analysis
        required: false
        description: Previous pattern detection results for trend comparison
      - name: product_roadmap
        required: false
        description: Current product roadmap for pattern-to-roadmap alignment
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Detecting recurring technical patterns across the account portfolio.
      Field observations: {field_observations}
      Account portfolio: {account_portfolio}
      Prior pattern analysis: {prior_pattern_analysis}
      Product roadmap: {product_roadmap}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are synthesizing cross-account field observations to identify recurring technical patterns that warrant strategic attention. Patterns backed by revenue-weighted evidence drive product strategy, competitive positioning, and field enablement priorities.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode selection:
      - FULL: all required inputs PRESENT
      - DEGRADED: 1+ inputs PARTIAL, flag gaps in every affected deliverable
      - DEFER: 2+ required inputs ABSENT, STOP and produce: (a) missing inputs with specific ask, (b) who can provide each, (c) re-run deadline
      If field_observations is ABSENT, DEFER: cannot detect patterns without field data.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: OBSERVATION AGGREGATION
      Normalize and categorize raw field observations into pattern candidates.
      For each observation cluster:
      - Pattern candidate name (descriptive, technology-neutral where possible)
      - Observation count (number of independent field reports)
      - Account count (distinct accounts exhibiting the pattern)
      - Revenue weight: aggregate ARR of accounts exhibiting the pattern
      - Vertical distribution: which verticals show this pattern
      - Technology stack context: platforms, tools, and architectures involved
      - Confidence: HIGH (5+ accounts, consistent reports) / MEDIUM (3-4 accounts) / LOW (1-2 accounts, anecdotal)
      Merge observations that describe the same underlying pattern with different terminology.
      Deliverable: Pattern candidate table (Pattern | Observation Count | Account Count | Revenue Weight | Verticals | Tech Context | Confidence).

      STEP 2: PATTERN CLASSIFICATION
      Classify each pattern candidate by maturity and strategic relevance.
      For each pattern:
      - Maturity: EMERGING (early signals, < 3 accounts) / ESTABLISHED (consistent, 3-10 accounts) / PERVASIVE (widespread, 10+ accounts or majority of a vertical)
      - Strategic relevance: CRITICAL (affects deal outcomes) / IMPORTANT (affects positioning) / INFORMATIONAL (useful context)
      - Trend direction: ACCELERATING / STABLE / DECELERATING based on observation frequency over time
      - Revenue-weighted priority score: (account count x avg ARR x strategic relevance multiplier)
      - Technology Radar quadrant: ADOPT / TRIAL / ASSESS / HOLD
      Sort by revenue-weighted priority score descending.
      Deliverable: Pattern classification table (Pattern | Maturity | Relevance | Trend | Priority Score | Radar Quadrant | Confidence).

      STEP 3: ROADMAP ALIGNMENT
      If product_roadmap is available, map patterns to roadmap items.
      For each pattern:
      - Roadmap coverage: ADDRESSED (feature planned/shipped) / PARTIAL (partial coverage) / GAP (no roadmap item) / CONFLICT (roadmap direction contradicts pattern)
      - Revenue at risk if gap persists (sum of ARR from affected accounts)
      - Competitive exposure: are competitors exploiting this gap? YES / NO with evidence
      If product_roadmap is ABSENT, state "Roadmap alignment not assessed, product roadmap not provided."
      Deliverable: Alignment table (Pattern | Roadmap Coverage | Revenue at Risk | Competitive Exposure | Recommended Action).

      STEP 4: STRATEGIC RECOMMENDATIONS
      For each CRITICAL and IMPORTANT pattern, produce actionable recommendations.
      - Recommendation type: PRODUCT FEEDBACK / FIELD ENABLEMENT / COMPETITIVE COUNTER / MESSAGING UPDATE
      - Specific action with rationale
      - Owner (product, field enablement, competitive intelligence, marketing)
      - Timeline: IMMEDIATE (< 30 days) / NEAR-TERM (30-90 days) / STRATEGIC (> 90 days)
      - Expected impact on win rates or deal velocity
      Deliverable: Recommendation table (Pattern | Type | Action | Owner | Timeline | Expected Impact).

      QUALITY CHECKS:
      - Patterns derived from cross-account evidence, not single-account anecdotes
      - Revenue weighting applied to prevent low-value noise from dominating
      - Maturity classification uses explicit account-count thresholds
      - Roadmap gaps quantified by revenue at risk, not just flagged
      - Recommendations include owner and timeline, not just "we should do X"
      - Confidence attached to every pattern classification
      - Executive summary is self-sufficient: reader can act without reading pattern details

      RUN MODE EXECUTION:
      - QUICK: executive summary + top 5 patterns by priority score + top recommendation + state delta
      - DISCOVERY: signal acquisition plan (field data collection gaps, observation sources, SA interview schedule)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) total patterns detected with maturity distribution and aggregate revenue weight, (2) highest-priority pattern and its roadmap alignment status, (3) single most urgent recommendation with owner and expected impact.

  competitive_displacement:
    id: fcto-competitive-displacement
    name: "Competitive Displacement Pattern Analysis"
    description: "Analyze competitive displacement patterns across accounts by mapping competitor presence, identifying displacement triggers, and developing counter-strategies weighted by revenue impact"
    domain: pattern_synthesis
    inputs:
      - name: competitive_intelligence
        required: true
        description: Competitive encounter data from field teams including wins, losses, and active battles
      - name: account_portfolio
        required: true
        description: Account portfolio with competitor footprint and revenue data
      - name: competitor_profiles
        required: false
        description: Known competitor capabilities, pricing models, and go-to-market strategies
      - name: win_loss_data
        required: false
        description: Win/loss analysis reports with technical decision factors
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Analyzing competitive displacement patterns across the account portfolio.
      Competitive intelligence: {competitive_intelligence}
      Account portfolio: {account_portfolio}
      Competitor profiles: {competitor_profiles}
      Win/loss data: {win_loss_data}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are identifying patterns in how competitors displace our presence or how we displace competitors. The output drives counter-strategy development and proactive defense of installed base.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If competitive_intelligence is ABSENT, DEFER: cannot analyze displacement without competitive encounter data.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: COMPETITOR LANDSCAPE MAPPING
      Map competitor presence across the account portfolio.
      For each competitor:
      - Competitor name
      - Account penetration: number of accounts where present and percentage of portfolio
      - Revenue exposure: aggregate ARR of accounts where competitor is active
      - Primary displacement vector: which of our solutions they target
      - Trend: EXPANDING / STABLE / CONTRACTING in the portfolio
      - Confidence: VERIFIED (deal data) / ESTIMATED (field reports) / ASSUMED (market inference)
      Sort by revenue exposure descending.
      Deliverable: Competitor landscape table (Competitor | Account Count | Revenue Exposure | Displacement Vector | Trend | Confidence).

      STEP 2: DISPLACEMENT TRIGGER ANALYSIS
      Identify what triggers displacement events (theirs and ours).
      For each displacement pattern:
      - Trigger category: CONTRACT RENEWAL / TECHNOLOGY SHIFT / EXECUTIVE CHANGE / COST PRESSURE / CAPABILITY GAP / INTEGRATION FAILURE
      - Direction: INBOUND (competitor displacing us) / OUTBOUND (us displacing competitor)
      - Frequency: number of occurrences in the analysis window
      - Average revenue impact per event
      - Typical timeline from trigger to displacement decision
      - Early warning signals: what observable indicators precede this trigger
      Deliverable: Trigger analysis table (Trigger | Direction | Frequency | Avg Revenue Impact | Timeline | Early Warning Signals).

      STEP 3: WIN/LOSS PATTERN EXTRACTION
      If win_loss_data is available, extract technical decision factors from displacement outcomes.
      For each factor:
      - Technical decision factor (specific capability, integration, performance metric)
      - Win correlation: percentage of wins where this factor was cited
      - Loss correlation: percentage of losses where this factor was cited
      - Net influence: WIN DRIVER (positive) / LOSS DRIVER (negative) / NEUTRAL
      - Addressability: CAN FIX (product/roadmap) / CAN POSITION (messaging) / STRUCTURAL (market reality)
      If win_loss_data is ABSENT, state "Win/loss factor analysis not assessed, data not provided."
      Deliverable: Decision factor table (Factor | Win % | Loss % | Net Influence | Addressability).

      STEP 4: COUNTER-STRATEGY DEVELOPMENT
      For each active competitor with EXPANDING trend or HIGH revenue exposure, develop a displacement counter-strategy.
      - Competitor and displacement vector
      - Counter-strategy: DEFEND (protect installed base) / DISPLACE (proactive takeout) / DIFFERENTIATE (reposition to avoid head-to-head)
      - Key technical proof points to deploy
      - Messaging adjustments needed
      - Field enablement required (battle cards, demo scripts, reference architectures)
      - Revenue-weighted priority: accounts to activate first
      Deliverable: Counter-strategy table (Competitor | Vector | Strategy | Proof Points | Messaging | Enablement | Priority Accounts).

      QUALITY CHECKS:
      - Competitor landscape uses revenue-weighted exposure, not just account counts
      - Displacement triggers distinguished by direction (inbound vs. outbound)
      - Win/loss factors separated into addressable vs. structural gaps
      - Counter-strategies are specific to competitor and displacement vector, not generic
      - Early warning signals are observable and actionable
      - Confidence attached to every competitor assessment
      - Executive summary is self-sufficient: reader can act without reading competitor details

      RUN MODE EXECUTION:
      - QUICK: executive summary + top 3 competitors by revenue exposure + top counter-strategy + state delta
      - DISCOVERY: signal plan (win/loss interview schedule, competitive intelligence sources, field team survey)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) competitor count with expanding vs. contracting distribution and total revenue exposure, (2) highest-impact displacement pattern and its primary trigger, (3) single most urgent counter-strategy with priority accounts and expected revenue protection.

  win_theme_development:
    id: fcto-win-theme-development
    name: "Technical Win Theme Development"
    description: "Develop technical win themes from cross-account evidence by identifying differentiators, validating with proof points, and packaging for field consumption"
    domain: pattern_synthesis
    inputs:
      - name: win_data
        required: true
        description: Technical win reports including deal context, decision factors, and differentiators cited
      - name: competitive_landscape
        required: false
        description: Competitive positioning data for differentiation validation
      - name: product_capabilities
        required: true
        description: Current product capabilities and recent feature releases
      - name: field_feedback
        required: false
        description: SA and SE feedback on messaging effectiveness and customer resonance
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Developing technical win themes from cross-account evidence.
      Win data: {win_data}
      Competitive landscape: {competitive_landscape}
      Product capabilities: {product_capabilities}
      Field feedback: {field_feedback}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are distilling cross-account win data into reusable technical win themes that field teams can deploy in active deals. Themes must be evidence-backed, competitively differentiated, and packaged for rapid adoption.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If win_data is ABSENT, DEFER: cannot develop win themes without documented wins.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: WIN FACTOR EXTRACTION
      Extract recurring technical factors from win reports.
      For each factor:
      - Factor description (specific capability or approach that influenced the decision)
      - Frequency: number of wins where this factor was cited
      - Revenue correlation: aggregate deal value of wins citing this factor
      - Vertical concentration: is this factor vertical-specific or horizontal?
      - Customer persona resonance: which buyer personas responded to this factor (CTO, VP Eng, CISO, etc.)
      - Confidence: HIGH (5+ wins, consistent citation) / MEDIUM (3-4 wins) / LOW (1-2 wins)
      Deliverable: Win factor table (Factor | Frequency | Revenue Correlation | Verticals | Personas | Confidence).

      STEP 2: THEME SYNTHESIS
      Cluster related win factors into coherent win themes.
      For each theme:
      - Theme name (concise, field-ready label)
      - Component factors (from Step 1)
      - Theme narrative: 2-3 sentence articulation following the SCQA framework (Situation, Complication, Question, Answer)
      - Proof points: specific customer outcomes with quantified results
      - Competitive differentiation: why competitors cannot make this same claim
      - Shelf life: DURABLE (12+ months) / CURRENT (6-12 months) / EXPIRING (< 6 months, tied to temporary advantage)
      Deliverable: Theme synthesis table (Theme | Factors | Narrative | Proof Points | Differentiation | Shelf Life).

      STEP 3: COMPETITIVE VALIDATION
      If competitive_landscape is available, validate each theme against competitor capabilities.
      For each theme:
      - Defensibility: UNIQUE (competitors cannot replicate) / ADVANTAGED (we lead by 12+ months) / PARITY (competitors have similar capability) / VULNERABLE (competitor is catching up)
      - Competitor response: known or expected counter-messaging
      - Positioning adjustment: how to sharpen the theme given competitive reality
      If competitive_landscape is ABSENT, state "Competitive validation not performed, landscape data not provided."
      Deliverable: Validation table (Theme | Defensibility | Competitor Response | Positioning Adjustment).

      STEP 4: FIELD PACKAGING
      Package validated themes for field team consumption.
      For each theme:
      - One-sentence elevator pitch
      - Three supporting proof points (customer, metric, context)
      - Objection handling: top 2 customer objections and responses
      - Demo alignment: which demo scenarios reinforce this theme
      - Ideal deal profile: deal size, vertical, buyer persona, and competitive context where this theme applies
      - Deployment priority: HIGH (immediate field distribution) / MEDIUM (next enablement cycle) / LOW (archive for niche use)
      Deliverable: Field package (Theme | Elevator Pitch | Proof Points | Objections | Demo | Deal Profile | Priority).

      QUALITY CHECKS:
      - Themes derived from multiple wins, not single-deal anecdotes
      - Revenue correlation used to weight theme importance
      - SCQA narrative is concise and field-ready, not academic
      - Proof points include quantified customer outcomes, not vague claims
      - Competitive differentiation validated or flagged as unvalidated
      - Shelf life assessed honestly (expiring themes marked, not presented as durable)
      - Executive summary is self-sufficient: reader can act without reading theme details

      RUN MODE EXECUTION:
      - QUICK: executive summary + top 3 themes with elevator pitches + top deployment action + state delta
      - DISCOVERY: signal plan (win report collection gaps, SA interview schedule, competitive intelligence needs)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) total themes developed with deployment priority distribution and aggregate revenue correlation, (2) highest-priority theme with its competitive defensibility, (3) single most urgent field enablement action with owner and timeline.

  product_gap_clustering:
    id: fcto-product-gap-clustering
    name: "Product Gap Signal Clustering"
    description: "Cluster product gap signals from field encounters by aggregating feature requests, weighting by revenue impact, and structuring for product management consumption"
    domain: pattern_synthesis
    inputs:
      - name: gap_signals
        required: true
        description: Product gap signals from field teams including feature requests, workaround reports, and competitive loss factors
      - name: account_portfolio
        required: true
        description: Account portfolio with revenue data for revenue-weighted prioritization
      - name: product_roadmap
        required: false
        description: Current product roadmap for gap-to-roadmap alignment
      - name: competitive_gaps
        required: false
        description: Gaps specifically identified through competitive encounters
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Clustering product gap signals from field encounters for product strategy input.
      Gap signals: {gap_signals}
      Account portfolio: {account_portfolio}
      Product roadmap: {product_roadmap}
      Competitive gaps: {competitive_gaps}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are transforming scattered field-reported product gaps into clustered, revenue-weighted signals that product management can act on. Raw gap reports are noisy; your job is to separate signal from noise and quantify business impact.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If gap_signals is ABSENT, DEFER: cannot cluster gaps without field signal data.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: SIGNAL NORMALIZATION
      Normalize raw gap signals into a consistent taxonomy.
      For each signal:
      - Normalized gap description (remove account-specific context, express as capability need)
      - Original signal count (number of independent reports describing this gap)
      - Source diversity: number of distinct field reporters
      - Account impact: list of accounts reporting this gap with ARR
      - Gap type: MISSING FEATURE / USABILITY / PERFORMANCE / INTEGRATION / SCALE LIMITATION
      - Severity as reported by field: DEAL BLOCKER / COMPETITIVE DISADVANTAGE / CUSTOMER FRICTION / NICE TO HAVE
      - Confidence: HIGH (5+ reports, consistent description) / MEDIUM (3-4 reports) / LOW (1-2 reports)
      Merge signals that describe the same underlying gap with different terminology.
      Deliverable: Normalized signal table (Gap | Signal Count | Source Diversity | Accounts | Gap Type | Field Severity | Confidence).

      STEP 2: CLUSTER FORMATION
      Group related gaps into product-level clusters.
      For each cluster:
      - Cluster name (product capability area)
      - Component gaps (from Step 1)
      - Aggregate signal count
      - Revenue-weighted score: sum of ARR across all affected accounts
      - Deal impact: number of deals where cluster gaps were cited as blockers or competitive disadvantages
      - Vertical concentration: which verticals are most affected
      - Hype Cycle positioning: where does the underlying capability sit (Innovation Trigger, Peak of Inflated Expectations, Trough of Disillusionment, Slope of Enlightenment, Plateau of Productivity)
      Sort by revenue-weighted score descending.
      Deliverable: Cluster table (Cluster | Component Gaps | Signal Count | Revenue Score | Deal Impact | Verticals | Hype Cycle Position).

      STEP 3: ROADMAP ALIGNMENT
      If product_roadmap is available, map each cluster to roadmap items.
      For each cluster:
      - Roadmap coverage: PLANNED (specific item) / PARTIAL (related work) / GAP (nothing planned) / CONFLICT (roadmap direction opposes field need)
      - Planned delivery timeline (if applicable)
      - Field satisfaction with timeline: ACCEPTABLE / TOO LATE (deals will close before delivery) / UNKNOWN
      - Revenue at risk if gap persists beyond planned delivery
      If product_roadmap is ABSENT, state "Roadmap alignment not assessed, product roadmap not provided."
      Deliverable: Roadmap alignment table (Cluster | Coverage | Delivery Timeline | Field Satisfaction | Revenue at Risk).

      STEP 4: PRODUCT MANAGEMENT BRIEF
      Structure the top clusters for product management consumption.
      For each top cluster (ranked by revenue-weighted score):
      - Problem statement (one paragraph, customer-centric, no solution prescription)
      - Business case: revenue at risk, deals affected, competitive exposure
      - Customer evidence: representative quotes or scenarios from 2-3 accounts
      - Competitive benchmark: what competitors offer in this area
      - Suggested priority: P0 (revenue-critical) / P1 (competitive parity) / P2 (market positioning) / P3 (future investment)
      - Field workarounds currently in use (if any)
      Deliverable: PM brief (Cluster | Problem Statement | Business Case | Customer Evidence | Competitive Benchmark | Suggested Priority | Workarounds).

      QUALITY CHECKS:
      - Gaps normalized to remove account-specific context before clustering
      - Revenue weighting uses actual ARR data, not subjective importance ratings
      - Signal count distinguishes independent reports from duplicate escalations
      - Clusters map to product capability areas, not individual feature requests
      - PM brief includes problem statements, not solution prescriptions
      - Hype Cycle positioning helps product team calibrate market timing
      - Confidence attached to every cluster assessment
      - Executive summary is self-sufficient: reader can act without reading cluster details

      RUN MODE EXECUTION:
      - QUICK: executive summary + top 5 clusters by revenue score + top PM action + state delta
      - DISCOVERY: signal plan (field survey design, gap report collection cadence, account team interviews)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) total gap clusters with severity distribution and aggregate revenue weight, (2) highest-impact cluster with its roadmap alignment status, (3) single most urgent product feedback action with PM owner and revenue justification.

# ============================================================================
# EXECUTIVE ADVISORY PROMPTS
# ============================================================================
executive_advisory:

  executive_briefing:
    id: fcto-executive-briefing
    name: "Executive Briefing Package Preparation"
    description: "Prepare an executive briefing package by synthesizing technology landscape, business context, and strategic recommendations into a structured brief following the pyramid principle"
    domain: executive_advisory
    inputs:
      - name: briefing_context
        required: true
        description: Briefing purpose, audience (title, background, known priorities), and occasion
      - name: account_context
        required: true
        description: Account strategic context including business objectives, technology landscape, and active initiatives
      - name: technology_insights
        required: false
        description: Relevant technology trends, industry benchmarks, and peer comparisons
      - name: prior_interactions
        required: false
        description: Previous executive interactions, commitments made, and follow-up items
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Preparing executive briefing package.
      Briefing context: {briefing_context}
      Account context: {account_context}
      Technology insights: {technology_insights}
      Prior interactions: {prior_interactions}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are preparing a structured executive briefing package for a C-level or VP-level audience. The package must follow the pyramid principle: lead with the conclusion, support with evidence, and anticipate executive questions. Every element must respect the executive's time and decision-making context.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If briefing_context is ABSENT, DEFER: cannot prepare a briefing without knowing the audience and purpose.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: AUDIENCE AND OBJECTIVE ANALYSIS
      Profile the executive audience and define briefing objectives.
      - Executive profile: title, domain expertise, known decision-making style, strategic priorities
      - Briefing objective: what decision or action should result from this briefing
      - Success criteria: how to measure whether the briefing achieved its purpose
      - Time constraints: expected duration, format (in-person, virtual, async read)
      - Prior relationship context: previous interactions, open commitments, trust level
      - Messaging calibration: technical depth appropriate for this audience (HIGH / MEDIUM / LOW)
      - Confidence: HIGH / MEDIUM / LOW based on quality of audience intel
      If prior_interactions is ABSENT, state "No prior interaction history available, treating as first executive engagement."
      Deliverable: Audience analysis (Profile | Objective | Success Criteria | Format | Prior Context | Tech Depth | Confidence).

      STEP 2: CONTENT ARCHITECTURE (PYRAMID PRINCIPLE)
      Structure the briefing content using the pyramid principle.
      - Governing thought: single sentence capturing the key message the executive should retain
      - Supporting arguments (3 maximum): each a complete thought that supports the governing thought
      - Evidence base: for each argument, 2-3 data points, proof points, or examples
      - Anticipated questions: 5 executive questions likely to arise, with prepared responses
      - Topics to avoid: sensitive areas, competitive landmines, or premature commitments
      Deliverable: Content architecture (Governing Thought | Argument 1-3 | Evidence per Argument | Anticipated Q&A | Avoidance List).

      STEP 3: TECHNOLOGY NARRATIVE
      If technology_insights is available, weave technology context into the briefing.
      - Industry trends relevant to the executive's priorities (2-3 maximum)
      - Peer comparison: how similar organizations are approaching these challenges
      - Technology maturity assessment: where relevant technologies sit on the adoption curve
      - Our positioning: how our capabilities align with the trends that matter to this executive
      If technology_insights is ABSENT, state "Technology narrative limited to account-specific context, broader trend data not provided."
      Deliverable: Technology narrative brief (Trend | Peer Context | Maturity | Our Position | Relevance to Executive).

      STEP 4: BRIEFING DOCUMENT
      Produce the final briefing package.
      - Executive brief (1 page): governing thought, 3 supporting arguments, call to action
      - Supporting appendix: detailed evidence, data tables, reference materials
      - Pre-brief checklist: logistics, attendee list, materials to share in advance, internal alignment needed
      - Post-brief actions: follow-up commitments to capture, next meeting to propose, internal debrief plan
      Deliverable: Briefing document (Executive Brief | Appendix | Pre-Brief Checklist | Post-Brief Actions).

      QUALITY CHECKS:
      - Governing thought is a single actionable sentence, not a topic label
      - No more than 3 supporting arguments (executive cognitive load limit)
      - Anticipated questions include uncomfortable ones, not just softballs
      - Technology narrative is relevant to this executive's priorities, not generic trend reporting
      - Messaging calibration matches audience technical depth
      - Briefing fits within stated time constraints
      - Executive summary is self-sufficient: reader can act without reading appendix

      RUN MODE EXECUTION:
      - QUICK: executive summary + governing thought + anticipated Q&A + state delta
      - DISCOVERY: signal plan (executive profile research, prior interaction history, account team intel gathering)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) briefing objective and audience profile with confidence level, (2) governing thought and the single strongest supporting argument, (3) single most important pre-brief action with owner and deadline.

  csuite_content:
    id: fcto-csuite-content
    name: "C-Suite Advisory Content Development"
    description: "Develop C-suite advisory content by mapping executive priorities to technology capabilities, structuring thought leadership narratives, and producing executive-ready artifacts"
    domain: executive_advisory
    inputs:
      - name: executive_priorities
        required: true
        description: Known C-suite priorities, strategic themes, and board-level concerns
      - name: technology_capabilities
        required: true
        description: Our technology capabilities relevant to executive priorities
      - name: industry_context
        required: false
        description: Industry trends, analyst perspectives, and peer benchmarks relevant to the C-suite audience
      - name: content_inventory
        required: false
        description: Existing advisory content for gap analysis and refresh assessment
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Developing C-suite advisory content.
      Executive priorities: {executive_priorities}
      Technology capabilities: {technology_capabilities}
      Industry context: {industry_context}
      Content inventory: {content_inventory}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are creating advisory content that positions our Field CTO organization as a trusted technology advisor to C-suite executives. Content must address business outcomes, not product features, and demonstrate strategic thinking that earns executive attention.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If executive_priorities is ABSENT, DEFER: cannot develop advisory content without understanding executive concerns.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: PRIORITY-TO-CAPABILITY MAPPING
      Map executive priorities to technology capabilities using business outcome language.
      For each priority:
      - Executive priority (stated in business terms)
      - Underlying technology challenge (what technical problem creates the business pain)
      - Our capability alignment: which capabilities address this challenge
      - Outcome framing: how to express the technology solution in business outcome terms
      - Evidence strength: STRONG (multiple proof points) / MODERATE (some evidence) / WEAK (logical argument only)
      - Content gap: do we have existing content for this mapping? YES / NO / OUTDATED
      Deliverable: Priority mapping table (Priority | Tech Challenge | Our Capability | Outcome Frame | Evidence | Content Gap).

      STEP 2: NARRATIVE DEVELOPMENT
      Develop advisory narratives for the top 3 priority-to-capability mappings.
      For each narrative:
      - Narrative title (executive-resonant, outcome-focused)
      - SCQA structure: Situation (industry context), Complication (what changed), Question (what the executive must decide), Answer (our perspective)
      - Supporting data points: 3 quantified evidence items (analyst data, customer outcomes, market benchmarks)
      - Contrarian angle: one insight that challenges conventional thinking (earns executive attention)
      - Call to action: what the executive should do with this information
      - Tone calibration: authoritative but not sales-oriented, strategic not tactical
      Deliverable: Narrative briefs (Title | SCQA | Data Points | Contrarian Angle | CTA | Tone Notes).

      STEP 3: CONTENT GAP ANALYSIS
      If content_inventory is available, assess what exists vs. what is needed.
      For each priority area:
      - Existing content: title, format, creation date, last refresh
      - Currency: CURRENT (< 6 months) / AGING (6-12 months) / STALE (> 12 months)
      - Quality: EXECUTIVE-READY / NEEDS REFRESH / NEEDS REWRITE / MISSING
      - Gap description: what specific content is needed
      If content_inventory is ABSENT, state "Content gap analysis not performed, inventory not provided."
      Deliverable: Gap analysis table (Priority | Existing Content | Currency | Quality | Gap Description).

      STEP 4: CONTENT PRODUCTION PLAN
      Define the production plan for new and refreshed content.
      For each content piece:
      - Content title and format (whitepaper, executive brief, presentation, article)
      - Target audience (specific C-suite roles)
      - Source material requirements (SME interviews, data, customer stories)
      - Author and reviewers
      - Production timeline with milestones
      - Distribution channels (executive briefings, events, digital, account teams)
      - Success metric: how to measure content effectiveness
      Deliverable: Production plan table (Title | Format | Audience | Sources | Author | Timeline | Distribution | Success Metric).

      QUALITY CHECKS:
      - Content addresses business outcomes, not product features
      - SCQA narratives are complete (all four elements present and connected)
      - Contrarian angles are genuinely challenging, not manufactured controversy
      - Evidence includes quantified data, not just qualitative claims
      - Tone is advisory (peer-to-peer), not sales (vendor-to-buyer)
      - Content gaps prioritized by executive priority ranking, not recency
      - Executive summary is self-sufficient: reader can act without reading narrative details

      RUN MODE EXECUTION:
      - QUICK: executive summary + top narrative with SCQA + top production action + state delta
      - DISCOVERY: signal plan (executive priority research, analyst report access, SME interview schedule)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) number of priority areas mapped with evidence strength distribution, (2) highest-priority narrative and its contrarian angle, (3) single most urgent content production action with author and deadline.

  board_presentation:
    id: fcto-board-presentation
    name: "Board-Level Presentation Structure"
    description: "Structure a board-level technology presentation by distilling complex technology topics into governance-appropriate framing with risk, investment, and outcome language"
    domain: executive_advisory
    inputs:
      - name: presentation_topic
        required: true
        description: Technology topic for board presentation and the strategic context driving the discussion
      - name: board_profile
        required: true
        description: Board composition, technology literacy level, known concerns, and governance priorities
      - name: technology_assessment
        required: true
        description: Technical assessment data, architecture details, and implementation status
      - name: financial_context
        required: false
        description: Investment data, TCO analysis, and ROI projections relevant to the topic
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Structuring board-level technology presentation.
      Presentation topic: {presentation_topic}
      Board profile: {board_profile}
      Technology assessment: {technology_assessment}
      Financial context: {financial_context}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are structuring a technology presentation for a board of directors audience. Board presentations require translating technical complexity into governance language: risk exposure, investment rationale, competitive positioning, and measurable outcomes. Boards do not make technology decisions; they approve investments and assess risk.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If presentation_topic or board_profile is ABSENT, DEFER: cannot structure board content without topic definition and audience understanding.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: BOARD CONTEXT FRAMING
      Translate the technology topic into board-appropriate framing.
      - Business context: why this topic matters to the organization's strategy (not why the technology is interesting)
      - Governance relevance: which board concerns does this address (risk, compliance, competitive position, growth, cost)
      - Decision requested: what specific board action is sought (approve investment, acknowledge risk, endorse direction)
      - Board literacy calibration: technology depth appropriate for this board (HIGH / MEDIUM / LOW)
      - Peer benchmark: how peer organizations' boards are addressing this topic
      - Time allocation: recommended presentation duration and Q&A time
      Deliverable: Context frame (Business Context | Governance Relevance | Decision Requested | Literacy Level | Peer Benchmark | Time).

      STEP 2: RISK AND INVESTMENT FRAMING
      Frame the technology topic in risk and investment terms.
      - Risk exposure: what happens if the organization does nothing (quantified where possible)
      - Investment required: capital and operational expenditure, timeline, resource commitment
      - ROI projection: expected return with confidence interval and assumptions stated
      - Competitive risk: what competitors are doing and the cost of falling behind
      - Implementation risk: likelihood of delivery challenges, mitigation approach
      - If financial_context is ABSENT, state "Financial framing uses estimates, detailed financial data not provided."
      Deliverable: Risk-investment frame (Risk of Inaction | Investment | ROI | Competitive Risk | Implementation Risk | Confidence).

      STEP 3: PRESENTATION STRUCTURE
      Build the slide-level presentation structure.
      For each slide:
      - Slide title (conclusion-oriented, not topic label)
      - Key message (one sentence the board should retain from this slide)
      - Supporting data (2-3 data points or visuals)
      - Backup detail (available if board asks deeper questions)
      Recommended structure (6-8 slides maximum):
      1. Strategic context and decision requested
      2. Current state assessment
      3. Risk exposure (cost of inaction)
      4. Recommended approach with investment
      5. Expected outcomes and timeline
      6. Governance and oversight model
      7. Decision/approval requested
      Deliverable: Presentation outline (Slide | Title | Key Message | Data | Backup Detail).

      STEP 4: Q&A PREPARATION
      Prepare for board questions.
      - 8-10 likely board questions organized by board member archetype (financial, operational, risk, strategic)
      - For each question: prepared response (30-second verbal answer), supporting data reference, escalation path if answer is unknown
      - Hostile questions: 2-3 challenging questions that could derail the presentation, with deflection-free honest responses
      - Follow-up commitments: what the board may request as post-meeting deliverables
      Deliverable: Q&A prep table (Question | Archetype | Response | Supporting Data | Escalation Path) + hostile question responses.

      QUALITY CHECKS:
      - Slide titles are conclusions, not topic labels ("Cloud migration reduces operational risk by 40%" not "Cloud Migration Update")
      - Technology jargon eliminated or translated for board literacy level
      - Risk quantified in financial terms where possible, not abstract severity ratings
      - Investment framing includes total cost of ownership, not just initial spend
      - Q&A includes hostile questions, not just friendly ones
      - Presentation fits within recommended time allocation
      - Executive summary is self-sufficient: reader can structure the presentation without reading details

      RUN MODE EXECUTION:
      - QUICK: executive summary + presentation structure outline + top 3 board questions + state delta
      - DISCOVERY: signal plan (board profile research, financial data requests, peer benchmark sources)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) decision requested and governance relevance with board literacy calibration, (2) risk of inaction quantified against investment required, (3) single most important preparation action with owner and deadline.

  strategic_messaging:
    id: fcto-strategic-messaging
    name: "Strategic Messaging Calibration"
    description: "Calibrate strategic messaging by aligning technology narratives to audience segments, testing message resonance, and producing segment-specific messaging frameworks"
    domain: executive_advisory
    inputs:
      - name: current_messaging
        required: true
        description: Current strategic messaging including positioning statements, value propositions, and key narratives
      - name: audience_segments
        required: true
        description: Target audience segments with roles, priorities, and decision criteria
      - name: field_resonance_data
        required: false
        description: Field team feedback on messaging effectiveness, customer reactions, and objection patterns
      - name: competitive_messaging
        required: false
        description: Competitor messaging and positioning for differentiation analysis
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Calibrating strategic messaging across audience segments.
      Current messaging: {current_messaging}
      Audience segments: {audience_segments}
      Field resonance data: {field_resonance_data}
      Competitive messaging: {competitive_messaging}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are calibrating strategic messaging to ensure technology narratives resonate with each audience segment. Messaging that works for a CTO fails with a CFO; messaging that works in financial services falls flat in manufacturing. Calibration means adjusting depth, framing, and proof points per segment.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If current_messaging is ABSENT, DEFER: cannot calibrate messaging that does not exist yet.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: MESSAGE AUDIT
      Assess current messaging across key dimensions.
      For each message or positioning statement:
      - Message text (verbatim)
      - Intended audience
      - Clarity: CLEAR (audience understands on first read) / AMBIGUOUS (multiple interpretations) / CONFUSING (requires explanation)
      - Differentiation: UNIQUE (only we can say this) / COMMON (many vendors say this) / GENERIC (interchangeable)
      - Evidence backing: QUANTIFIED (data-backed) / QUALITATIVE (testimonial) / UNSUBSTANTIATED (claim only)
      - Competitive vulnerability: does a competitor have a stronger version of this message? YES / NO
      - Confidence: based on field_resonance_data if available, otherwise ASSUMED
      Deliverable: Message audit table (Message | Audience | Clarity | Differentiation | Evidence | Competitive Vulnerability | Confidence).

      STEP 2: SEGMENT-SPECIFIC CALIBRATION
      Calibrate messaging for each audience segment.
      For each segment:
      - Segment name and decision criteria (what they care about)
      - Current message fit: STRONG / ADEQUATE / WEAK / MISSING
      - Calibration needed: depth adjustment (more/less technical), framing adjustment (business/technical/risk), proof point adjustment (which evidence resonates)
      - Calibrated message: rewritten positioning statement for this segment
      - Proof points: 2-3 segment-specific evidence items
      - Objection anticipation: top objection from this segment and pre-built response
      Deliverable: Calibration table (Segment | Current Fit | Calibration Needed | Calibrated Message | Proof Points | Objection Response).

      STEP 3: COMPETITIVE DIFFERENTIATION
      If competitive_messaging is available, sharpen differentiation.
      For each competitor:
      - Competitor's primary message
      - Overlap with our messaging: HIGH / MEDIUM / LOW
      - Differentiation opportunity: where we can credibly claim superiority
      - Messaging trap: competitor narratives designed to neutralize our advantage
      - Counter-positioning: how to reframe the conversation away from competitor strengths
      If competitive_messaging is ABSENT, state "Competitive differentiation not assessed, competitor messaging not provided."
      Deliverable: Differentiation table (Competitor | Their Message | Overlap | Our Differentiation | Their Trap | Our Counter).

      STEP 4: MESSAGING FRAMEWORK
      Produce a segment-specific messaging framework for field deployment.
      Framework structure per segment:
      - Headline message (one sentence, segment-calibrated)
      - Three supporting pillars (each a complete value statement)
      - Proof points per pillar
      - Competitive handle (what to say when competitor X comes up)
      - Escalation phrase (when to bring in Field CTO for deeper conversation)
      - Anti-patterns: what NOT to say to this segment (common field mistakes)
      Deliverable: Messaging framework (Segment | Headline | Pillars | Proof Points | Competitive Handle | Escalation | Anti-Patterns).

      QUALITY CHECKS:
      - Every audience segment has a distinct calibrated message (no one-size-fits-all)
      - Differentiation claims are substantiated, not aspirational
      - Competitive counter-positioning addresses real competitor strengths, not strawmen
      - Anti-patterns drawn from actual field mistakes, not theoretical concerns
      - Messaging framework is deployable (field teams can use it without additional interpretation)
      - Confidence levels reflect data quality (field-validated vs. assumed)
      - Executive summary is self-sufficient: reader can act without reading calibration details

      RUN MODE EXECUTION:
      - QUICK: executive summary + message audit highlights + top calibration action + state delta
      - DISCOVERY: signal plan (field resonance survey, competitive messaging collection, customer interview schedule)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) message audit results with clarity and differentiation distribution, (2) weakest audience segment and the calibration needed, (3) single most urgent messaging update with owner and deployment timeline.

# ============================================================================
# TECHNOLOGY VISION PROMPTS
# ============================================================================
technology_vision:

  trend_monitoring:
    id: fcto-trend-monitoring
    name: "Technology Trend Monitoring and Assessment"
    description: "Monitor and assess technology trends by scanning sources, classifying relevance, mapping to portfolio impact, and producing a technology radar update"
    domain: technology_vision
    inputs:
      - name: trend_sources
        required: true
        description: Technology trend data from analyst reports, conference takeaways, research papers, and field observations
      - name: current_portfolio
        required: true
        description: Current technology portfolio and product capabilities for impact assessment
      - name: prior_radar
        required: false
        description: Previous technology radar for trend movement tracking
      - name: customer_demand_signals
        required: false
        description: Customer inquiries and RFP trends indicating demand direction
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Monitoring and assessing technology trends for strategic planning.
      Trend sources: {trend_sources}
      Current portfolio: {current_portfolio}
      Prior radar: {prior_radar}
      Customer demand signals: {customer_demand_signals}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are producing a technology trend assessment that informs portfolio strategy, R&D investment, and field positioning. The assessment must separate signal from noise and distinguish hype from substance using structured frameworks.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If trend_sources is ABSENT, DEFER: cannot assess trends without source data.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: TREND SCANNING AND CLASSIFICATION
      Scan and classify technology trends from source data.
      For each trend:
      - Trend name and description
      - Source category: ANALYST (Gartner, Forrester, IDC) / ACADEMIC (research papers) / CONFERENCE (event takeaways) / FIELD (customer observations) / MARKET (vendor announcements, M&A)
      - Source count: number of independent sources citing this trend
      - Hype Cycle positioning: Innovation Trigger / Peak of Inflated Expectations / Trough of Disillusionment / Slope of Enlightenment / Plateau of Productivity
      - Time to mainstream adoption: < 2 years / 2-5 years / 5-10 years / > 10 years / OBSOLETE BEFORE MAINSTREAM
      - Confidence: HIGH (3+ analyst sources agree) / MEDIUM (mixed signals) / LOW (single source or speculative)
      Deliverable: Trend scan table (Trend | Source Category | Source Count | Hype Cycle | Time to Mainstream | Confidence).

      STEP 2: TECHNOLOGY RADAR PLACEMENT
      Place each trend on the technology radar.
      For each trend:
      - Radar quadrant: ADOPT (proven, use now) / TRIAL (worth pursuing, understand risks) / ASSESS (explore, understand impact) / HOLD (proceed with caution, wait for maturity)
      - Movement since prior radar: NEW / MOVED IN (toward ADOPT) / MOVED OUT (toward HOLD) / STABLE / REMOVED
      - Rationale for placement (specific evidence, not intuition)
      - Dissenting view: is there credible counter-argument to this placement? State it.
      If prior_radar is ABSENT, mark all as NEW and state "Baseline radar, no movement tracking available."
      Deliverable: Radar table (Trend | Quadrant | Movement | Rationale | Dissenting View).

      STEP 3: PORTFOLIO IMPACT ASSESSMENT
      Map trends to current portfolio capabilities.
      For each trend:
      - Portfolio relevance: DIRECT (affects current products) / ADJACENT (affects related markets) / DISRUPTIVE (threatens current approach) / IRRELEVANT
      - Impact type: OPPORTUNITY (trend strengthens our position) / THREAT (trend weakens our position) / NEUTRAL
      - Readiness: PREPARED (capability exists) / DEVELOPING (in progress) / GAP (nothing planned) / NA
      - Revenue implication: estimated impact on pipeline or ARR (directional if not quantifiable)
      - Customer demand signal: if customer_demand_signals available, corroborate with demand data
      Deliverable: Impact table (Trend | Relevance | Impact Type | Readiness | Revenue Implication | Demand Validation).

      STEP 4: STRATEGIC RECOMMENDATIONS
      Produce actionable recommendations from the trend assessment.
      For each ADOPT and TRIAL trend with DIRECT or ADJACENT relevance:
      - Recommendation: INVEST (increase capability) / PARTNER (acquire through partnership) / MONITOR (track, no action yet) / DIVEST (reduce exposure to declining trend)
      - Specific action with rationale
      - Owner (product, engineering, partnerships, field)
      - Timeline: IMMEDIATE / NEAR-TERM / STRATEGIC
      - Investment estimate: LOW / MEDIUM / HIGH with basis
      For DISRUPTIVE trends:
      - Disruption scenario and probability
      - Hedging strategy
      Deliverable: Recommendation table (Trend | Recommendation | Action | Owner | Timeline | Investment) + disruption scenarios.

      QUALITY CHECKS:
      - Trends sourced from multiple independent sources, not single-vendor narratives
      - Hype Cycle positioning uses defined criteria, not subjective impression
      - Radar placement includes dissenting views (intellectual honesty)
      - Portfolio impact distinguishes opportunity from threat explicitly
      - Recommendations include investment estimates, not just "we should explore X"
      - Customer demand signals corroborate or contradict analyst trends
      - Executive summary is self-sufficient: reader can act without reading trend details

      RUN MODE EXECUTION:
      - QUICK: executive summary + radar summary (quadrant counts + key movements) + top recommendation + state delta
      - DISCOVERY: signal plan (analyst report access, conference attendance plan, customer inquiry tracking setup)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) total trends assessed with radar quadrant distribution and confidence level, (2) most impactful trend movement and its portfolio implication, (3) single most urgent strategic action with owner and investment level.

  portfolio_readiness:
    id: fcto-portfolio-readiness
    name: "Portfolio Readiness Evaluation"
    description: "Evaluate portfolio readiness against emerging market requirements by assessing capability coverage, identifying investment priorities, and producing a readiness scorecard"
    domain: technology_vision
    inputs:
      - name: market_requirements
        required: true
        description: Emerging market requirements from analyst reports, customer demand, and competitive analysis
      - name: current_portfolio
        required: true
        description: Current product portfolio with capabilities, roadmap status, and maturity levels
      - name: competitive_portfolio
        required: false
        description: Competitor portfolio capabilities for gap benchmarking
      - name: customer_adoption_data
        required: false
        description: Customer adoption metrics and feature usage data for current portfolio
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Evaluating portfolio readiness against emerging market requirements.
      Market requirements: {market_requirements}
      Current portfolio: {current_portfolio}
      Competitive portfolio: {competitive_portfolio}
      Customer adoption data: {customer_adoption_data}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are assessing whether the current product portfolio is ready for where the market is heading. Portfolio readiness determines investment priorities, partnership needs, and competitive positioning decisions. The output must be actionable for product leadership.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If market_requirements is ABSENT, DEFER: cannot evaluate readiness without defined target state.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: MARKET REQUIREMENT MAPPING
      Categorize and prioritize emerging market requirements.
      For each requirement:
      - Requirement description (capability needed)
      - Market driver: what is creating this demand (regulation, technology shift, customer behavior change, competitive pressure)
      - Urgency: IMMEDIATE (market expects now) / NEAR-TERM (12-18 months) / EMERGING (18-36 months)
      - Market size impact: what percentage of TAM requires this capability
      - Source confidence: VALIDATED (multiple sources) / DIRECTIONAL (analyst projection) / SPECULATIVE (single source)
      Deliverable: Requirement map (Requirement | Market Driver | Urgency | TAM Impact | Confidence).

      STEP 2: CAPABILITY COVERAGE ASSESSMENT
      Assess current portfolio against each market requirement.
      For each requirement:
      - Coverage: FULL (capability exists and is mature) / PARTIAL (capability exists but incomplete) / PLANNED (on roadmap) / GAP (not addressed)
      - Maturity: GA (generally available) / BETA / ALPHA / CONCEPT / NA
      - Adoption: if customer_adoption_data available, what percentage of customers use related features
      - Time to full coverage: months to close the gap (for PARTIAL, PLANNED, or GAP)
      - Investment required: LOW / MEDIUM / HIGH with basis
      Deliverable: Coverage table (Requirement | Coverage | Maturity | Adoption | Time to Close | Investment).

      STEP 3: COMPETITIVE BENCHMARKING
      If competitive_portfolio is available, benchmark our readiness against competitors.
      For each requirement:
      - Our coverage level (from Step 2)
      - Competitor A coverage, Competitor B coverage (top 2-3 competitors)
      - Relative position: LEADING / PARITY / TRAILING
      - Competitive gap: months behind leader (if trailing)
      - Catch-up feasibility: ACHIEVABLE / CHALLENGING / UNLIKELY with rationale
      If competitive_portfolio is ABSENT, state "Competitive benchmarking not performed, competitor data not provided."
      Deliverable: Benchmark table (Requirement | Our Coverage | Competitor Coverage | Position | Gap | Catch-Up Feasibility).

      STEP 4: READINESS SCORECARD AND INVESTMENT PRIORITIES
      Produce a portfolio readiness scorecard.
      - Overall readiness score: percentage of market requirements at FULL or PARTIAL coverage
      - Readiness by urgency tier: IMMEDIATE / NEAR-TERM / EMERGING
      - Critical gaps: requirements with IMMEDIATE urgency and GAP coverage
      - Investment priorities: ranked by (urgency x TAM impact x competitive position)
      For each investment priority:
      - Requirement and gap description
      - Recommended approach: BUILD / BUY / PARTNER
      - Investment estimate and timeline
      - Expected outcome (coverage level after investment)
      - Risk if not addressed (revenue impact, competitive position)
      Deliverable: Readiness scorecard (Overall Score | By Urgency | Critical Gaps) + Investment priority table (Requirement | Approach | Investment | Timeline | Outcome | Risk if Deferred).

      QUALITY CHECKS:
      - Market requirements sourced from multiple inputs, not single analyst report
      - Coverage assessment uses defined maturity levels, not subjective readiness claims
      - Competitive benchmarking acknowledges where competitors lead
      - Investment priorities weighted by urgency and TAM impact, not squeaky-wheel requests
      - Build/buy/partner recommendation justified for each priority
      - Adoption data validates which existing capabilities actually get used
      - Executive summary is self-sufficient: reader can act without reading coverage details

      RUN MODE EXECUTION:
      - QUICK: executive summary + readiness scorecard + top 3 critical gaps + state delta
      - DISCOVERY: signal plan (market requirement validation sources, competitor capability research, adoption data collection)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) overall readiness score with critical gap count and urgency distribution, (2) highest-priority investment with its build/buy/partner recommendation, (3) single most urgent action with owner, investment level, and consequence of delay.

  thought_leadership:
    id: fcto-thought-leadership
    name: "Thought Leadership Content Development"
    description: "Develop thought leadership content by identifying differentiated perspectives, validating with cross-account evidence, and producing field-deployable intellectual capital"
    domain: technology_vision
    inputs:
      - name: topic_area
        required: true
        description: Technology topic area for thought leadership development
      - name: cross_account_evidence
        required: true
        description: Field evidence from multiple accounts supporting the perspective
      - name: analyst_positions
        required: false
        description: Analyst perspectives and published research on the topic for alignment or differentiation
      - name: existing_content
        required: false
        description: Existing thought leadership content on this topic for refresh or extension
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Developing thought leadership content on {topic_area}.
      Cross-account evidence: {cross_account_evidence}
      Analyst positions: {analyst_positions}
      Existing content: {existing_content}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are developing thought leadership that establishes the Field CTO organization as a credible, differentiated voice on a technology topic. Thought leadership must go beyond restating analyst consensus; it must offer a perspective earned through cross-account field experience that analysts cannot replicate.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If cross_account_evidence is ABSENT, DEFER: thought leadership without field evidence is opinion, not leadership.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: PERSPECTIVE IDENTIFICATION
      Identify the differentiated perspective that forms the thought leadership thesis.
      - Topic landscape: what is the current consensus on this topic (analyst view, market conventional wisdom)
      - Our perspective: what do we see from the field that the consensus misses or gets wrong
      - Evidence basis: number of accounts and engagements supporting our perspective
      - Revenue context: aggregate ARR of accounts where this perspective is relevant
      - Contrarian strength: STRONGLY CONTRARIAN (challenges consensus) / MILDLY CONTRARIAN (adds nuance) / ALIGNED WITH CONSENSUS (validates with unique evidence)
      - Risk assessment: what happens if our perspective is wrong (reputational, commercial)
      Deliverable: Perspective summary (Consensus View | Our Perspective | Evidence Basis | Revenue Context | Contrarian Strength | Risk).

      STEP 2: EVIDENCE VALIDATION
      Validate the perspective with structured cross-account evidence.
      For each supporting evidence point:
      - Account context (anonymized): industry, size, technology maturity
      - Observation: what we observed that supports the perspective
      - Outcome: measurable result (quantified where possible)
      - Reproducibility: CONSISTENT (seen in 5+ accounts) / EMERGING (3-4 accounts) / ANECDOTAL (1-2 accounts)
      - Counter-evidence: observations that contradict the perspective (intellectual honesty)
      - Net assessment: does the evidence support publishing this perspective? YES / CONDITIONAL (needs more data) / NO
      Deliverable: Evidence table (Account Context | Observation | Outcome | Reproducibility | Counter-Evidence) + net assessment.

      STEP 3: ANALYST ALIGNMENT
      If analyst_positions is available, position our perspective relative to analyst views.
      For each relevant analyst:
      - Analyst name and published position
      - Alignment: REINFORCES / EXTENDS / CONTRADICTS our perspective
      - Citation strategy: how to reference or differentiate from this analyst view
      - Risk: could an analyst publicly disagree with our position? Likelihood and impact
      If analyst_positions is ABSENT, state "Analyst alignment not assessed, published positions not provided."
      Deliverable: Analyst alignment table (Analyst | Their Position | Alignment | Citation Strategy | Disagreement Risk).

      STEP 4: CONTENT PRODUCTION
      Produce the thought leadership content package.
      - Core thesis: one sentence that captures the differentiated perspective
      - Long-form article (800-1200 words): SCQA structure with evidence and implications
      - Executive summary (200 words): standalone version for time-constrained audiences
      - Field talking points: 5 bullet points field teams can use in customer conversations
      - Conference abstract (150 words): for speaking submission if applicable
      - Visual concept: one diagram or framework that makes the thesis memorable
      - Shelf life: DURABLE (12+ months) / CURRENT (6-12 months) / TIME-SENSITIVE (< 6 months)
      Deliverable: Content package (Thesis | Article | Executive Summary | Talking Points | Abstract | Visual Concept | Shelf Life).

      QUALITY CHECKS:
      - Perspective is earned from field evidence, not borrowed from analyst reports
      - Counter-evidence acknowledged, not suppressed
      - Evidence base spans 3+ accounts minimum for any published claim
      - Content differentiates from analyst consensus (not restating what Gartner said)
      - Talking points are usable by field teams without additional context
      - Shelf life honestly assessed (time-sensitive content marked, not presented as evergreen)
      - Executive summary is self-sufficient: reader can act without reading the full article

      RUN MODE EXECUTION:
      - QUICK: executive summary + core thesis + talking points + state delta
      - DISCOVERY: signal plan (additional account evidence needed, analyst research to acquire, SME review schedule)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) core thesis with contrarian strength and evidence base size, (2) strongest supporting evidence point and its reproducibility, (3) single most urgent production action with author and timeline.

  technology_narrative:
    id: fcto-technology-narrative
    name: "Technology Direction Narrative"
    description: "Build a technology direction narrative by synthesizing trend data, portfolio trajectory, and market context into a coherent forward-looking story for internal and external audiences"
    domain: technology_vision
    inputs:
      - name: technology_trends
        required: true
        description: Technology trend assessment and radar data
      - name: portfolio_trajectory
        required: true
        description: Product portfolio direction, roadmap themes, and investment priorities
      - name: market_context
        required: false
        description: Market dynamics, customer evolution patterns, and competitive landscape shifts
      - name: prior_narrative
        required: false
        description: Previous technology narrative for continuity and evolution tracking
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Building technology direction narrative.
      Technology trends: {technology_trends}
      Portfolio trajectory: {portfolio_trajectory}
      Market context: {market_context}
      Prior narrative: {prior_narrative}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are building a technology direction narrative that connects where the market is going, where our portfolio is heading, and why the two are aligned. The narrative must work for internal audiences (product, engineering, field) and external audiences (customers, analysts, partners) with appropriate depth adjustments.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If technology_trends or portfolio_trajectory is ABSENT, DEFER: narrative requires both market direction and portfolio direction.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: MARKET DIRECTION SYNTHESIS
      Synthesize market direction from trend data and market context.
      - 3-5 macro trends shaping the technology landscape (not feature-level trends)
      - For each trend:
        - Trend description and driving forces
        - Customer impact: how this trend changes what customers need
        - Timeline: when this trend becomes a default expectation (1-2 years, 2-5 years, 5+ years)
        - Confidence: HIGH / MEDIUM / LOW with basis
      - Market narrative arc: the overarching story connecting these trends (one paragraph)
      If market_context is ABSENT, derive market direction from technology_trends only and note limited market validation.
      Deliverable: Market direction summary (Trend | Customer Impact | Timeline | Confidence) + narrative arc.

      STEP 2: PORTFOLIO ALIGNMENT
      Map portfolio trajectory to market direction.
      For each macro trend:
      - Portfolio response: how our roadmap addresses this trend
      - Alignment strength: STRONG (roadmap directly targets) / MODERATE (partial coverage) / WEAK (gap or misalignment)
      - Timing: AHEAD (portfolio ready before market demand) / ALIGNED (matching market timeline) / BEHIND (market demand outpacing delivery)
      - Narrative thread: how to explain our response to this trend (one sentence)
      - Credibility: what proof points support our claim of alignment
      Deliverable: Alignment table (Trend | Portfolio Response | Alignment | Timing | Narrative Thread | Credibility).

      STEP 3: NARRATIVE CONSTRUCTION
      Build the technology direction narrative.
      - Core narrative (500 words): where the market is going, where we are heading, and why customers should care
      - Internal version: adds portfolio investment rationale, R&D priorities, competitive positioning
      - External version: adds customer benefit framing, peer validation, outcome examples
      - Continuity: if prior_narrative available, show evolution (what changed, what stayed, what is new)
      - Visual framework: one conceptual diagram that makes the narrative tangible
      If prior_narrative is ABSENT, state "New narrative, no continuity tracking available."
      Deliverable: Technology narrative (Core | Internal Version | External Version | Continuity Notes | Visual Framework).

      STEP 4: DEPLOYMENT GUIDE
      Produce a deployment guide for using the narrative across audiences.
      For each audience:
      - Audience: INTERNAL PRODUCT / INTERNAL FIELD / CUSTOMER EXECUTIVE / ANALYST / PARTNER
      - Version to use (internal or external)
      - Depth adjustment: what to expand, what to abbreviate
      - Proof points to emphasize for this audience
      - Questions to anticipate from this audience
      - Delivery format: presentation, whitepaper, conversation, briefing
      Deliverable: Deployment guide (Audience | Version | Depth | Proof Points | Questions | Format).

      QUALITY CHECKS:
      - Macro trends are genuinely macro (industry-shaping, not feature-level)
      - Portfolio alignment is honest about gaps and timing misalignment
      - Internal and external versions are distinct (internal includes what to conceal externally)
      - Narrative has a clear arc (not a list of disconnected trend responses)
      - Visual framework aids comprehension rather than decorating the document
      - Continuity from prior narrative shows intellectual consistency
      - Executive summary is self-sufficient: reader can articulate the technology direction without reading details

      RUN MODE EXECUTION:
      - QUICK: executive summary + core narrative + deployment guide summary + state delta
      - DISCOVERY: signal plan (trend data gaps, portfolio roadmap access, market research needs)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) market direction in one sentence with confidence level, (2) portfolio alignment strength with critical timing gap if any, (3) single most important narrative deployment action with audience and timeline.

# ============================================================================
# FIELD INTELLIGENCE PROMPTS
# ============================================================================
field_intelligence:

  observation_aggregation:
    id: fcto-observation-aggregation
    name: "Field Observation Aggregation"
    description: "Aggregate field observations from SAs, SEs, and account teams into structured intelligence by normalizing reports, identifying signal clusters, and routing to appropriate consumers"
    domain: field_intelligence
    inputs:
      - name: raw_observations
        required: true
        description: Raw field observations from SAs, SEs, and account teams including deal context, technical findings, and customer feedback
      - name: observation_taxonomy
        required: true
        description: Classification taxonomy for observations (categories, severity levels, routing rules)
      - name: prior_aggregation
        required: false
        description: Previous aggregation results for trend comparison and deduplication
      - name: consumer_registry
        required: false
        description: Registry of intelligence consumers (product, competitive, enablement) with their intake requirements
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Aggregating field observations into structured intelligence.
      Raw observations: {raw_observations}
      Observation taxonomy: {observation_taxonomy}
      Prior aggregation: {prior_aggregation}
      Consumer registry: {consumer_registry}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are transforming raw, unstructured field observations into classified, deduplicated, revenue-weighted intelligence signals. Raw field data is noisy and inconsistent; your job is to extract actionable signal and route it to the right consumers.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If raw_observations is ABSENT, DEFER: cannot aggregate without field data.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: OBSERVATION NORMALIZATION
      Normalize raw observations into a consistent format.
      For each observation:
      - Observation ID (assigned)
      - Source: reporter role (SA, SE, AE, CSM), region, vertical
      - Account context: account name, ARR, vertical, technology profile
      - Observation date
      - Raw text (verbatim or summarized)
      - Normalized category (from observation_taxonomy): PRODUCT GAP / COMPETITIVE ENCOUNTER / CUSTOMER PAIN / TECHNOLOGY TREND / PROCESS FRICTION / WIN FACTOR / LOSS FACTOR
      - Severity: CRITICAL (deal impact) / HIGH (pattern signal) / MEDIUM (useful context) / LOW (background noise)
      - Confidence: HIGH (direct observation) / MEDIUM (secondhand report) / LOW (inference or rumor)
      Flag duplicate or near-duplicate observations for merge review.
      Deliverable: Normalized observation table (ID | Source | Account | Date | Category | Severity | Confidence | Summary).

      STEP 2: SIGNAL CLUSTERING
      Cluster related observations into signal groups.
      For each cluster:
      - Signal name (descriptive label)
      - Component observations (IDs from Step 1)
      - Observation count (total, deduplicated)
      - Account spread: number of distinct accounts
      - Revenue weight: aggregate ARR of affected accounts
      - Vertical concentration: which verticals over-represented
      - Time pattern: ACCELERATING (increasing frequency) / STABLE / DECELERATING / ONE-TIME
      - Signal strength: STRONG (5+ accounts, consistent) / MODERATE (3-4 accounts) / WEAK (1-2 accounts)
      Deliverable: Signal cluster table (Signal | Obs Count | Accounts | Revenue Weight | Verticals | Time Pattern | Strength).

      STEP 3: CONSUMER ROUTING
      Route each signal cluster to appropriate intelligence consumers.
      For each signal:
      - Primary consumer: PRODUCT MANAGEMENT / COMPETITIVE INTELLIGENCE / FIELD ENABLEMENT / EXECUTIVE LEADERSHIP / ENGINEERING
      - Routing rationale: why this consumer needs this signal
      - Urgency: IMMEDIATE (act now) / SCHEDULED (next review cycle) / ARCHIVE (reference only)
      - Format requirement: what the consumer needs (data table, narrative summary, metric, alert)
      - If consumer_registry is available, match to specific intake processes and contacts
      If consumer_registry is ABSENT, route by category using standard mapping and note "Consumer-specific routing not validated, registry not provided."
      Deliverable: Routing table (Signal | Consumer | Rationale | Urgency | Format | Contact/Process).

      STEP 4: INTELLIGENCE DIGEST
      Produce a consolidated intelligence digest for leadership.
      - Signal count: total observations processed, clusters formed, signals routed
      - Top 5 signals by revenue weight with one-sentence summary each
      - Emerging signals: clusters that appeared for the first time this period
      - Declining signals: clusters that were strong previously but are weakening
      - Data quality assessment: observation volume, source diversity, confidence distribution
      - Collection gaps: categories or regions with insufficient observation volume
      Deliverable: Intelligence digest (Summary Stats | Top Signals | Emerging | Declining | Data Quality | Collection Gaps).

      QUALITY CHECKS:
      - Observations deduplicated before clustering (inflated counts caught)
      - Revenue weighting uses actual ARR, not subjective importance
      - Signal strength uses explicit account-count thresholds
      - Routing includes urgency classification, not just consumer name
      - Data quality assessment is honest about collection gaps
      - Emerging and declining signal trends require prior_aggregation data or are marked "baseline period"
      - Executive summary is self-sufficient: reader can act without reading observation details

      RUN MODE EXECUTION:
      - QUICK: executive summary + top 5 signals + routing summary + state delta
      - DISCOVERY: signal plan (observation collection gaps, field reporting cadence, source recruitment for underrepresented regions)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) total observations processed with cluster and signal distribution, (2) highest revenue-weighted signal and its routing, (3) single most urgent intelligence action with consumer and timeline.

  product_strategy_routing:
    id: fcto-product-strategy-routing
    name: "Product Strategy Intelligence Routing"
    description: "Structure field intelligence for product management consumption by translating field signals into product-actionable format with business case quantification and priority recommendation"
    domain: field_intelligence
    inputs:
      - name: aggregated_signals
        required: true
        description: Aggregated field intelligence signals with revenue weighting and account context
      - name: product_roadmap
        required: true
        description: Current product roadmap for gap-to-roadmap mapping
      - name: pm_intake_requirements
        required: false
        description: Product management team's preferred intake format and decision criteria
      - name: competitive_context
        required: false
        description: Competitive capability data for urgency calibration
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Structuring field intelligence for product management consumption.
      Aggregated signals: {aggregated_signals}
      Product roadmap: {product_roadmap}
      PM intake requirements: {pm_intake_requirements}
      Competitive context: {competitive_context}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are translating field intelligence into a format that product management can directly act on. PMs need business-case-backed feature priorities, not raw field complaints. Your job is to bridge the gap between field reality and product planning.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If aggregated_signals is ABSENT, DEFER: cannot route intelligence without signal data.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: SIGNAL-TO-ROADMAP MAPPING
      Map each field signal to relevant roadmap items.
      For each signal:
      - Signal description and revenue weight (from aggregation)
      - Roadmap match: ADDRESSED (planned feature) / PARTIAL (related work) / GAP (nothing planned) / CONFLICT (roadmap contradicts field need)
      - If ADDRESSED: planned delivery quarter and field satisfaction with timeline
      - If GAP or CONFLICT: what product area should own this
      - Deal urgency: number of active deals where this signal is a factor, total deal value
      Deliverable: Signal-roadmap map (Signal | Revenue Weight | Roadmap Match | Delivery | Deal Urgency | Product Area).

      STEP 2: BUSINESS CASE CONSTRUCTION
      For each GAP or CONFLICT signal, build a product-ready business case.
      For each case:
      - Problem statement (customer-centric, one paragraph)
      - Revenue at risk: deals that could be lost or delayed without this capability
      - Revenue opportunity: new deals that could be won with this capability
      - Competitive pressure: do competitors have this? Timeline to competitive parity loss
      - Customer evidence: 2-3 anonymized account examples with specific pain points
      - Workaround cost: what field teams do today and the cost (time, credibility, deal velocity)
      Deliverable: Business case table (Signal | Problem | Revenue at Risk | Revenue Opportunity | Competitive Pressure | Customer Evidence | Workaround Cost).

      STEP 3: PRIORITY RECOMMENDATION
      Produce a prioritized recommendation for product management.
      For each signal, recommend priority:
      - P0: revenue-critical (active deal blockers, competitive displacement imminent)
      - P1: competitive parity (competitors have it, customers expect it)
      - P2: market positioning (emerging requirement, builds differentiation)
      - P3: future investment (long-term trend, no immediate revenue impact)
      Priority scoring formula: (revenue at risk x deal urgency x competitive pressure) / workaround availability
      Include dissenting view: where might PM reasonably disagree with this priority?
      Deliverable: Priority table (Signal | Priority | Score | Revenue Justification | Competitive Factor | Dissenting View).

      STEP 4: PM COMMUNICATION PACKAGE
      Package the intelligence for PM consumption.
      - Executive brief (1 page): top 3 signals, revenue impact, recommended priorities
      - Signal detail appendix: full business cases for P0 and P1 items
      - Field evidence package: customer quotes and account examples (anonymized)
      - Review request: specific meeting or review cycle where PM should consider these signals
      - Success metric: how to measure whether PM action addressed the field signal
      If pm_intake_requirements is available, format to match their preferred structure.
      Deliverable: PM package (Executive Brief | Signal Details | Field Evidence | Review Request | Success Metrics).

      QUALITY CHECKS:
      - Business cases are customer-centric problem statements, not feature requests
      - Revenue quantification uses actual deal data, not hypothetical projections
      - Competitive pressure based on verified competitor capabilities, not speculation
      - Priority recommendations include dissenting views (PM may have context field lacks)
      - Workaround costs quantified (field time, deal velocity impact, customer satisfaction)
      - Package formatted for PM decision process, not field team preferences
      - Executive summary is self-sufficient: PM can triage without reading details

      RUN MODE EXECUTION:
      - QUICK: executive summary + P0 signals with business cases + state delta
      - DISCOVERY: signal plan (PM intake process documentation, roadmap access, competitive capability verification)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) total signals mapped with roadmap coverage distribution and aggregate revenue weight, (2) highest-priority P0 signal with revenue justification, (3) single most urgent PM engagement action with meeting/review target and deadline.

  advisory_board_prep:
    id: fcto-advisory-board-prep
    name: "Advisory Board Input Preparation"
    description: "Prepare field-sourced input for customer advisory boards and technology councils by synthesizing cross-account themes, validating with evidence, and structuring for board discussion format"
    domain: field_intelligence
    inputs:
      - name: board_charter
        required: true
        description: Advisory board charter including purpose, membership profile, and discussion format
      - name: field_themes
        required: true
        description: Cross-account themes and technology patterns to present for advisory board validation
      - name: prior_board_output
        required: false
        description: Previous advisory board outputs, commitments, and action items for continuity
      - name: product_questions
        required: false
        description: Specific questions product management wants validated through the advisory board
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Preparing field-sourced input for advisory board.
      Board charter: {board_charter}
      Field themes: {field_themes}
      Prior board output: {prior_board_output}
      Product questions: {product_questions}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are preparing field-sourced input for a customer advisory board or technology council. The advisory board is a strategic asset: it validates product direction, surfaces unmet needs, and strengthens customer relationships. Your job is to ensure the field perspective is well-represented and that board time is used to validate, not educate.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If board_charter or field_themes is ABSENT, DEFER: cannot prepare board input without knowing the forum and the content.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: THEME SELECTION AND EVIDENCE PACKAGING
      Select the most impactful field themes for board discussion and package supporting evidence.
      For each candidate theme:
      - Theme description
      - Cross-account evidence: number of accounts, revenue weight, vertical distribution
      - Board relevance: HIGH (directly aligns with board charter) / MEDIUM (tangentially relevant) / LOW (not appropriate for this forum)
      - Discussion value: VALIDATION (confirm hypothesis) / EXPLORATION (surface new perspectives) / DECISION (seek direction)
      - Supporting evidence: 3 anonymized account examples with outcomes
      - Confidence: HIGH / MEDIUM / LOW based on evidence depth
      Select top 3-5 themes by board relevance and discussion value.
      Deliverable: Theme selection table (Theme | Evidence Base | Revenue Weight | Board Relevance | Discussion Value | Confidence).

      STEP 2: DISCUSSION DESIGN
      Design the board discussion for each selected theme.
      For each theme:
      - Discussion objective: what we want to learn or validate
      - Presentation format: data-led, narrative, interactive exercise, panel discussion
      - Time allocation (minutes)
      - Facilitator notes: how to introduce, key questions to ask, how to handle tangents
      - Expected outcome: what a successful discussion produces (validated hypothesis, new insight, direction change, commitment)
      - Anti-patterns: what would make this discussion fail (too much presentation, loaded questions, vendor pitch tone)
      Deliverable: Discussion design table (Theme | Objective | Format | Time | Key Questions | Expected Outcome | Anti-Patterns).

      STEP 3: PRODUCT QUESTION INTEGRATION
      If product_questions is available, integrate PM questions into board discussions.
      For each product question:
      - Question text (as submitted by PM)
      - Board-appropriate framing (translated from PM jargon to customer language)
      - Theme alignment: which discussion theme naturally accommodates this question
      - Insertion point: where in the discussion to introduce this question
      - Risk: could this question feel like a sales probe? Mitigation approach
      If product_questions is ABSENT, state "No product-specific questions integrated, PM input not provided."
      Deliverable: Question integration table (PM Question | Board Framing | Theme Alignment | Insertion Point | Risk Mitigation).

      STEP 4: BOARD SESSION BRIEF
      Produce the complete board session preparation package.
      - Session agenda with time allocations and facilitators
      - Pre-read materials for board members (what to share in advance, maximum 2 pages)
      - Internal prep brief: what our team needs to know before the session
      - Prior commitment tracking: if prior_board_output available, status of previous action items
      - Post-session plan: how to capture outputs, who documents, follow-up communication timeline
      - Success metrics: how to measure whether the board session achieved its objectives
      Deliverable: Board session brief (Agenda | Pre-Read | Internal Brief | Commitment Status | Post-Session Plan | Success Metrics).

      QUALITY CHECKS:
      - Themes selected by board relevance, not internal convenience
      - Discussion design prevents vendor-pitch tone (advisory boards are for listening, not selling)
      - PM questions translated to customer language, not internal jargon
      - Time allocations are realistic (discussion, not presentation, dominates)
      - Pre-read is concise (board members will not read long documents)
      - Prior commitments tracked and addressed (board members remember what was promised)
      - Executive summary is self-sufficient: session facilitator can prepare from summary alone

      RUN MODE EXECUTION:
      - QUICK: executive summary + theme list + agenda outline + state delta
      - DISCOVERY: signal plan (board member profile updates, PM question collection, prior board output retrieval)
      - FULL: all deliverables

      EXECUTIVE SUMMARY: State (1) number of themes selected with board relevance and discussion value distribution, (2) highest-priority theme and its validation objective, (3) single most important preparation action with owner and deadline.

  strategic_deal_support:
    id: fcto-strategic-deal-support
    name: "Strategic Deal Support"
    description: "Provide Field CTO-level strategic deal support by assessing technical positioning, identifying executive engagement opportunities, and developing deal-specific technology narratives"
    domain: field_intelligence
    inputs:
      - name: deal_context
        required: true
        description: Deal overview including opportunity value, stage, competitive landscape, customer stakeholders, and technical requirements
      - name: account_technology_profile
        required: true
        description: Customer's technology landscape, architecture, and strategic technology initiatives
      - name: competitive_intelligence
        required: false
        description: Competitor positioning and known technical strategies in this deal
      - name: cross_account_patterns
        required: false
        description: Relevant patterns from similar deals or accounts for leverage
      - name: run_mode
        required: false
        description: "FULL | QUICK | DISCOVERY (default: FULL)"
    prompt: |
      Context: Providing strategic deal support.
      Deal context: {deal_context}
      Account technology profile: {account_technology_profile}
      Competitive intelligence: {competitive_intelligence}
      Cross-account patterns: {cross_account_patterns}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are providing Field CTO-level strategic support for a high-value deal. Your role is not to replace the SA or SE, but to add strategic altitude: executive-level technology narrative, cross-account pattern leverage, and competitive counter-strategy that individual account teams cannot develop alone.

      STEP 0: INPUT GATE
      Classify each input as PRESENT / PARTIAL / ABSENT.
      Run mode: FULL / DEGRADED / DEFER (standard rules).
      If deal_context is ABSENT, DEFER: cannot support a deal without understanding the opportunity.
      Deliverable: Input Gate table + Run Mode declaration.

      STEP 1: DEAL ASSESSMENT
      Assess the deal from a strategic technology perspective.
      - Deal profile: value, stage, expected close date, competitive status
      - Technical complexity: LOW / MEDIUM / HIGH with basis
      - Strategic importance: STANDARD (one of many) / SIGNIFICANT (reference potential) / TRANSFORMATIONAL (market-defining)
      - Customer decision-making dynamics: who decides (technical evaluator, business sponsor, procurement), what matters to each
      - Win probability assessment: LIKELY / COMPETITIVE / UPHILL based on current positioning
      - Field CTO value-add opportunity: where strategic engagement can shift the outcome
      Deliverable: Deal assessment (Profile | Complexity | Importance | Decision Dynamics | Win Probability | FCTO Value-Add).

      STEP 2: TECHNOLOGY NARRATIVE DEVELOPMENT
      Develop a deal-specific technology narrative that operates above feature-level positioning.
      - Customer's strategic technology direction (from account profile)
      - Our alignment: how our technology direction aligns with their trajectory (not just current needs)
      - Vision gap: what the customer has not yet articulated but will need (based on cross-account patterns)
      - Narrative structure (SCQA): customer situation, technology complication, strategic question, our answer
      - Executive talking points: 3 points calibrated for the customer's CTO or CIO
      - Proof points: 2-3 peer examples from similar organizations (anonymized if needed)
      Deliverable: Technology narrative (Customer Direction | Our Alignment | Vision Gap | SCQA Narrative | Executive Points | Proof Points).

      STEP 3: COMPETITIVE COUNTER-STRATEGY
      If competitive_intelligence is available, develop deal-specific counter-strategy.
      For each active competitor:
      - Competitor's known positioning in this deal
      - Their technical strengths (what they will lead with)
      - Their technical weaknesses (what they will avoid discussing)
      - Our counter-positioning: how to reframe the evaluation criteria to favor our strengths
      - Trap questions: questions that expose competitor weaknesses without appearing negative
      - Risk: could the competitor use a similar strategy against us? Defensive preparation needed
      If competitive_intelligence is ABSENT, state "Competitive counter-strategy not developed, competitor data not provided."
      Deliverable: Counter-strategy table (Competitor | Their Position | Strengths | Weaknesses | Our Counter | Trap Questions | Defensive Prep).

      STEP 4: ENGAGEMENT PLAN
      Define the Field CTO engagement plan for this deal.
      - Engagement type: EXECUTIVE BRIEFING / ARCHITECTURE REVIEW / TECHNOLOGY VISION SESSION / DEAL REVIEW / CUSTOMER DINNER
      - Participants: who from our side, who from customer side
      - Preparation required: materials, demos, reference customers to brief
      - Timing: when in the deal cycle to engage (too early = premature, too late = wasted)
      - Success criteria: what outcome defines a successful engagement
      - Follow-up actions: commitments to make and next steps
      - Cross-account leverage: if cross_account_patterns available, which patterns to reference
      Deliverable: Engagement plan (Type | Participants | Preparation | Timing | Success Criteria | Follow-Up | Cross-Account Leverage).

      QUALITY CHECKS:
      - Deal assessment uses objective criteria, not wishful thinking about win probability
      - Technology narrative operates above feature level (strategic direction, not product comparison)
      - Vision gap is plausible based on cross-account evidence, not speculative
      - Counter-strategy addresses real competitor strengths, not strawman weaknesses
      - Trap questions are professional and insight-driven, not antagonistic
      - Engagement timing is justified in deal cycle context
      - Executive summary is self-sufficient: deal team can prepare from summary alone

      RUN MODE EXECUTION:
      - QUICK: executive summary + technology narrative + engagement plan + state delta
      - DISCOVERY: signal plan (competitive intelligence gathering, customer stakeholder research, cross-account pattern search)
      - FULL: all deliverables

