# Executive Communication Frameworks - Domain Knowledge
# Referenced by: field CTO agent definitions requiring C-suite engagement, board presentation, strategic messaging
# Sources: McKinsey executive communication, Barbara Minto Pyramid Principle, Gartner executive engagement
# Last verified: 2026-03

structured_communication_models:

  pyramid_principle:
    full_name: "Minto Pyramid Principle"
    source_url: "https://www.barbaraminto.com/"
    source_reference: "Barbara Minto, 'The Pyramid Principle: Logic in Writing and Thinking', Pearson Education"
    purpose: "Structure executive communication so the main conclusion comes first, supported by logically grouped arguments and evidence"
    structure:
      - level: "Governing Thought"
        description: "The single most important message the audience must take away"
        guidance:
          - "State the recommendation or conclusion in one sentence"
          - "Answer the question the audience is implicitly asking"
          - "Lead with this, do not build up to it"
      - level: "Key Line Arguments"
        description: "Two to five supporting arguments that logically prove the governing thought"
        guidance:
          - "Each argument must independently support the top-level conclusion"
          - "Arguments should be mutually exclusive and collectively exhaustive (MECE)"
          - "Order arguments by importance or logical dependency"
      - level: "Supporting Evidence"
        description: "Data, examples, and analysis that validate each key line argument"
        guidance:
          - "Each piece of evidence ties to exactly one argument"
          - "Use quantitative data where possible, qualitative where necessary"
          - "Limit to three to five evidence points per argument to maintain clarity"
    application_to_field_cto:
      - "Technology strategy presentations: lead with strategic recommendation, support with market data, customer evidence, and competitive analysis"
      - "Product advisory input: structure field observations as conclusion-first memos to product leadership"
      - "Board presentations: governing thought = strategic technology direction, key lines = market position, customer impact, competitive differentiation"

  scqa_framework:
    full_name: "Situation-Complication-Question-Answer Framework"
    source_url: "https://www.richardhare.com/the-scqa-framework/"
    source_reference: "Derived from Minto Pyramid Principle, widely adopted in McKinsey and BCG communication methodology"
    purpose: "Build a narrative arc that moves executives from shared context to urgency to a clear recommendation"
    components:
      - element: "Situation"
        description: "Establish the shared context the audience already knows and agrees with"
        guidance:
          - "State facts that are uncontroversial and verifiable"
          - "Anchor in the audience's reality, not yours"
          - "Keep brief, this section builds rapport not insight"
        example: "Your engineering organization has grown 40% year-over-year and now operates 200+ microservices across three cloud providers"
      - element: "Complication"
        description: "Introduce the tension, problem, or change that disrupts the stable situation"
        guidance:
          - "This is the 'but' or 'however' that creates urgency"
          - "Connect to business impact: revenue at risk, competitive exposure, operational cost"
          - "Use data to make the complication concrete, not abstract"
        example: "Platform team velocity has dropped 30% due to configuration drift across environments, and two major customer incidents traced to deployment inconsistencies in Q3"
      - element: "Question"
        description: "The implicit or explicit question the complication raises in the audience's mind"
        guidance:
          - "The question should feel inevitable given the situation and complication"
          - "Frame as a strategic question, not a tactical one"
          - "The audience should feel this is their question, not yours"
        example: "How do we restore deployment reliability and platform team velocity without slowing feature delivery?"
      - element: "Answer"
        description: "Your recommendation that directly addresses the question"
        guidance:
          - "State the answer clearly and concisely"
          - "Follow with supporting evidence structured per the pyramid principle"
          - "Include a clear next step or call to action"
        example: "Adopt a platform engineering approach with an internal developer platform that standardizes deployment pipelines, environment provisioning, and observability across all services"
    sequencing_variations:
      - variation: "SCQA (standard)"
        use_when: "Audience is unfamiliar with the problem or needs full context"
      - variation: "QSCA (question-first)"
        use_when: "Audience already knows the problem and wants to jump to the answer"
      - variation: "CSQA (complication-first)"
        use_when: "Audience needs to feel urgency before hearing context"

executive_audience_calibration:

  audience_patterns:
    source_reference: "Gartner executive engagement research, McKinsey communication guidelines"
    purpose: "Calibrate message content, depth, and framing based on which executive role you are addressing"
    audiences:
      - role: "Chief Technology Officer (CTO)"
        primary_concerns:
          - "Technology architecture and platform decisions"
          - "Engineering team productivity and talent retention"
          - "Technical debt trajectory and modernization roadmap"
          - "Build vs buy vs partner decisions"
        messaging_approach:
          - "Lead with architecture and technical strategy"
          - "Use concrete technical terminology, avoid marketing abstractions"
          - "Show integration patterns and migration paths, not just capabilities"
          - "Demonstrate understanding of their current stack and constraints"
        evidence_types:
          - "Architecture diagrams and integration patterns"
          - "Performance benchmarks and scalability data"
          - "Developer experience metrics from comparable deployments"
          - "Open-source community health and ecosystem adoption data"
      - role: "Chief Information Officer (CIO)"
        primary_concerns:
          - "IT portfolio rationalization and total cost of ownership"
          - "Enterprise risk, security posture, and compliance"
          - "Vendor consolidation and strategic supplier management"
          - "Digital transformation program delivery and ROI"
        messaging_approach:
          - "Lead with business outcome and risk reduction"
          - "Frame technology decisions in portfolio management terms"
          - "Quantify TCO impact across infrastructure, licensing, and operations"
          - "Address governance, compliance, and audit trail capabilities"
        evidence_types:
          - "TCO models with three-year projections"
          - "Compliance certification matrix (SOC2, ISO 27001, GDPR)"
          - "Analyst positioning (Gartner Magic Quadrant, Forrester Wave)"
          - "Reference customers in same industry and regulatory environment"
      - role: "Chief Executive Officer (CEO)"
        primary_concerns:
          - "Revenue growth and market share trajectory"
          - "Competitive differentiation and strategic positioning"
          - "Customer retention and expansion economics"
          - "Investor narrative and market credibility"
        messaging_approach:
          - "Lead with market impact and competitive advantage"
          - "Translate technology capabilities into business outcomes"
          - "Limit to three key points maximum, with one clear call to action"
          - "Connect to company strategy and stated priorities from earnings calls or board materials"
        evidence_types:
          - "Customer revenue impact case studies"
          - "Market share and competitive displacement data"
          - "Industry analyst endorsements"
          - "Peer company adoption as social proof"
      - role: "Board of Directors"
        primary_concerns:
          - "Fiduciary risk and strategic direction"
          - "Market positioning relative to competitors"
          - "Capital allocation efficiency"
          - "Management team execution capability"
        messaging_approach:
          - "Absolute minimum technical detail, maximum strategic context"
          - "Use analogies and comparisons, not specifications"
          - "Frame every point in terms of risk, opportunity, or competitive necessity"
          - "Provide clear decision framework with options and trade-offs, not a single recommendation"
        evidence_types:
          - "Market trend data from recognized analysts"
          - "Competitive landscape summary (one-page maximum)"
          - "Customer concentration risk or expansion opportunity data"
          - "Peer benchmarking on technology investment levels"

board_presentation_structure:

  strategic_narrative_model:
    source_reference: "McKinsey board communication guidelines, Gartner CIO presentation frameworks"
    purpose: "Structure a board-level technology presentation that connects platform capabilities to strategic business outcomes"
    sections:
      - section: "Strategic Context"
        duration_minutes: 3
        content:
          - "Market forces driving technology investment (industry trends, competitive moves)"
          - "Customer behavior shifts creating new requirements"
          - "Regulatory or compliance landscape changes"
        guidance: "Establish external context before discussing internal capabilities. Board members think market-in, not product-out"
      - section: "Current Position Assessment"
        duration_minutes: 3
        content:
          - "Where the organization stands relative to market requirements"
          - "Key capability gaps or competitive exposures"
          - "Technology investments already in motion and their trajectory"
        guidance: "Be candid about gaps. Board members lose trust when presented with only positive framing"
      - section: "Strategic Technology Direction"
        duration_minutes: 5
        content:
          - "Recommended technology direction with two to three strategic pillars"
          - "How each pillar connects to a specific business outcome (revenue, cost, risk)"
          - "Timeline and investment requirements at portfolio level"
        guidance: "Each pillar should be expressible in one sentence. If it requires a paragraph, it is not yet distilled enough for board consumption"
      - section: "Evidence and Validation"
        duration_minutes: 3
        content:
          - "Customer outcomes that validate the direction"
          - "Analyst or market data supporting the thesis"
          - "Competitive intelligence confirming the strategic necessity"
        guidance: "Use three to five proof points maximum. More than five dilutes conviction rather than building it"
      - section: "Decision Framework"
        duration_minutes: 3
        content:
          - "Clear options with trade-offs (invest, defer, divest)"
          - "Risk profile of each option"
          - "Recommended path with specific next steps and timeline"
        guidance: "Board members want to make decisions, not receive briefings. Always close with a decision request or approval ask"

technology_vision_storytelling:

  roadmap_narrative_methodology:
    source_reference: "Gartner technology vision communication, ThoughtWorks strategic advisory methodology"
    purpose: "Connect a technology roadmap to customer priorities and market dynamics through a compelling narrative"
    narrative_elements:
      - element: "Customer Pain Anchor"
        description: "Ground the vision in a real customer problem observed in the field"
        guidance:
          - "Start with a specific customer scenario, not an abstract market trend"
          - "Name the business impact: revenue lost, deals delayed, churn risk"
          - "Use field observations from SA and CA engagements as source material"
      - element: "Market Direction"
        description: "Place the customer pain in the context of a broader market shift"
        guidance:
          - "Reference analyst data or industry research validating the trend"
          - "Show that this is a structural shift, not a temporary condition"
          - "Connect to patterns observed across multiple customer segments"
      - element: "Platform Response"
        description: "Explain how the vendor's platform capabilities address the market shift"
        guidance:
          - "Map platform capabilities to the customer pain, not vice versa"
          - "Show the roadmap as a response to customer demand, not internal engineering priorities"
          - "Differentiate by explaining what is uniquely possible with this platform"
      - element: "Customer Outcome"
        description: "Paint a concrete picture of the customer's future state after adoption"
        guidance:
          - "Quantify the outcome wherever possible (time saved, cost reduced, revenue enabled)"
          - "Use existing customer success data to make the outcome credible"
          - "Connect back to the opening pain anchor to close the narrative loop"

communication_anti_patterns:

  executive_engagement_failures:
    source_reference: "Gartner executive engagement research, field CTO community best practices"
    purpose: "Catalog common executive communication mistakes that destroy credibility and reduce engagement effectiveness"
    anti_patterns:
      - pattern: "Feature Dumping"
        description: "Presenting a list of product features without connecting them to business outcomes"
        consequence: "Executive disengages because they cannot translate features into strategic value"
        correction: "Map every capability to a specific business outcome before presenting. If a feature cannot be connected to an outcome the executive cares about, remove it from the presentation"
      - pattern: "Demo-First Engagement"
        description: "Opening an executive meeting with a product demonstration before establishing strategic context"
        consequence: "Executive feels they are in a sales pitch, not a strategic conversation. Trust erodes"
        correction: "Always establish business context and understand the executive's priorities before showing any product. Demo should validate a thesis, not introduce one"
      - pattern: "No Strategic Framing"
        description: "Discussing technology decisions without connecting them to market dynamics, competitive positioning, or business strategy"
        consequence: "Executive cannot justify the investment to their board or leadership team"
        correction: "Open with market context using SCQA structure. Every technology recommendation must answer 'why now' and 'why this over alternatives'"
      - pattern: "Depth Miscalibration"
        description: "Presenting technical implementation details to a business executive, or strategic abstractions to a technical executive"
        consequence: "Audience feels the presenter does not understand their role or concerns"
        correction: "Use the audience calibration model above to match content depth to the executive's role and priorities"
      - pattern: "Monologue Presentation"
        description: "Delivering a 30-slide presentation without pausing for executive input, questions, or dialogue"
        consequence: "Miss critical signals about executive priorities and concerns. Meeting becomes one-directional"
        correction: "Prepare five slides maximum for a 30-minute executive meeting. Use the remaining time for dialogue. The goal is strategic conversation, not information transfer"
      - pattern: "Competitive Ignorance"
        description: "Presenting vendor capabilities without acknowledging competitive alternatives or explaining differentiation"
        consequence: "Executive doubts the presenter's objectivity and market awareness"
        correction: "Proactively address the competitive landscape. Executives respect honest positioning more than superlative claims"
