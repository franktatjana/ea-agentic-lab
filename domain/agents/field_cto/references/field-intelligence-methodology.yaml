# Field Intelligence Methodology - Domain Knowledge
# Referenced by: field CTO agent definitions requiring intelligence collection, product strategy routing, advisory board preparation
# Sources: Pragmatic Institute, SVPG, Gartner field CTO frameworks, Pragmatic Marketing
# Last verified: 2026-03

field_intelligence_collection:

  structured_observation_methodology:
    full_name: "Structured Field Observation Capture"
    source_reference: "Pragmatic Institute product management framework (Listen phase), SVPG product discovery methodology"
    purpose: "Systematically capture and categorize technology observations from SA and CA customer engagements to build an evidence-based field intelligence corpus"
    observation_schema:
      required_fields:
        - field: "observation_id"
          description: "Unique identifier for tracking and deduplication"
        - field: "source_type"
          description: "Origin of the observation"
          values:
            - "customer_engagement: direct customer meeting, workshop, or POC"
            - "deal_cycle: observation from active sales opportunity"
            - "support_escalation: pattern from customer support or success interaction"
            - "competitive_encounter: intelligence from competitive displacement or defense"
            - "conference_interaction: hallway conversation, booth visit, or talk Q&A"
        - field: "customer_segment"
          description: "Industry vertical, company size, and maturity level of the customer"
        - field: "technology_domain"
          description: "Primary technology area: infrastructure, data, security, AI/ML, developer experience, observability, etc."
        - field: "observation_summary"
          description: "One to two sentence description of the observation"
        - field: "business_impact"
          description: "Quantified or estimated business consequence for the customer"
        - field: "evidence_strength"
          description: "Rating of observation reliability"
          values:
            - "direct: personally observed or conducted the engagement"
            - "reported: received from SA, CA, or AE who participated"
            - "inferred: derived from deal data, RFP patterns, or support trends"
      optional_fields:
        - field: "competitive_context"
          description: "Which competitors were involved and their positioning"
        - field: "product_implication"
          description: "Potential product feature or capability gap identified"
        - field: "urgency_signal"
          description: "Timeline pressure from customer: immediate need, planning cycle, exploratory"
        - field: "account_revenue"
          description: "Current and potential account revenue for prioritization weighting"
    collection_cadence:
      - "SA engagement debrief: within 48 hours of customer-facing engagement"
      - "Deal cycle retrospective: within one week of deal close (win or loss)"
      - "Quarterly field intelligence review: aggregation and theme extraction across all observations"

intelligence_aggregation:

  theme_clustering_methodology:
    source_reference: "Pragmatic Institute strategic role framework, qualitative research methodology"
    purpose: "Aggregate individual field observations into actionable themes with statistical confidence and revenue weighting"
    aggregation_steps:
      - step: "Observation Normalization"
        description: "Standardize observations for consistent analysis"
        activities:
          - "Normalize technology domain tags to a controlled vocabulary"
          - "Standardize customer segment descriptors (industry, size, maturity)"
          - "Deduplicate observations from the same engagement reported by multiple participants"
          - "Validate evidence strength ratings against source material"
      - step: "Theme Clustering"
        description: "Group normalized observations into thematic clusters"
        methods:
          - method: "Technology Domain Clustering"
            description: "Group observations by technology area to identify domain-specific patterns"
          - method: "Customer Outcome Clustering"
            description: "Group observations by the business outcome customers are trying to achieve"
          - method: "Failure Pattern Clustering"
            description: "Group observations by the type of failure or challenge customers encounter"
          - method: "Competitive Clustering"
            description: "Group observations by the competitor involved to identify displacement and defense patterns"
      - step: "Frequency Analysis"
        description: "Quantify theme prevalence across the observation corpus"
        metrics:
          - "Observation count per theme: raw number of independent observations"
          - "Account breadth: number of distinct customer accounts represented"
          - "Segment distribution: spread of theme across industries and company sizes"
          - "Time trend: is the theme growing, stable, or declining in frequency"
      - step: "Revenue-Weighted Prioritization"
        description: "Weight themes by associated revenue impact to prioritize business-critical intelligence"
        weighting_factors:
          - factor: "At-risk revenue"
            description: "Current ARR in accounts where this theme represents churn risk"
            weight: "Highest, immediate business impact"
          - factor: "Blocked pipeline"
            description: "Pipeline value in deals where this theme is a blocker or competitive disadvantage"
            weight: "High, near-term revenue opportunity"
          - factor: "Expansion opportunity"
            description: "Estimated expansion revenue if the theme's capability gap were addressed"
            weight: "Medium, growth opportunity"
          - factor: "Market positioning"
            description: "Analyst and competitive impact of addressing or ignoring the theme"
            weight: "Medium, strategic positioning value"

product_strategy_routing:

  field_to_product_methodology:
    full_name: "Field Intelligence to Product Strategy Routing"
    source_reference: "SVPG product discovery methodology, Pragmatic Institute market-driven approach"
    purpose: "Structure field observations for product management consumption so they inform roadmap decisions with evidence rather than anecdotes"
    routing_structure:
      - component: "Signal Summary"
        description: "One-paragraph executive summary of the field intelligence signal"
        content:
          - "What is the signal: name the pattern or capability gap"
          - "How strong is it: number of accounts, revenue weight, trend direction"
          - "Why it matters now: competitive pressure, market timing, customer urgency"
      - component: "Evidence Package"
        description: "Structured evidence supporting the signal"
        content:
          - "Observation count and account breadth (minimum three independent accounts)"
          - "Representative customer quotes or scenario descriptions (anonymized)"
          - "Revenue impact data: at-risk ARR, blocked pipeline value, expansion estimate"
          - "Competitive context: which competitors address this today and how"
      - component: "Customer Context"
        description: "Profile of customers generating this signal"
        content:
          - "Industry verticals most affected"
          - "Company size and maturity distribution"
          - "Technology stack and architecture patterns of affected customers"
          - "Buying center: which customer roles are driving the demand"
      - component: "Proposed Response"
        description: "Field CTO's recommended product response with rationale"
        response_types:
          - type: "Feature Request"
            description: "Specific capability gap that could be addressed with a platform feature"
            required_elements:
              - "Capability description in customer terms, not implementation terms"
              - "Success criteria: what must be true for customers to consider this addressed"
              - "Priority recommendation with justification"
          - type: "Integration Gap"
            description: "Interoperability requirement with third-party technology"
            required_elements:
              - "Target integration technology and version"
              - "Customer workflow that requires the integration"
              - "Competitive integration landscape"
          - type: "Messaging Gap"
            description: "Existing capability that customers do not know about or cannot find"
            required_elements:
              - "Capability that already exists in the platform"
              - "Why customers are not discovering or adopting it"
              - "Recommended enablement or messaging change"
          - type: "Market Positioning"
            description: "Strategic positioning concern requiring analyst relations or marketing response"
            required_elements:
              - "Current market perception gap"
              - "Evidence of perception impact on deals"
              - "Recommended positioning adjustment"

advisory_board_preparation:

  evidence_compilation_methodology:
    source_reference: "Gartner customer advisory board best practices, SaaS vendor advisory board frameworks"
    purpose: "Compile field intelligence into structured evidence packages for customer advisory board presentations and product strategy reviews"
    preparation_components:
      - component: "Market Landscape Briefing"
        description: "Current state of the technology market relevant to advisory board focus areas"
        content:
          - "Key market trends with analyst data and field validation"
          - "Competitive landscape changes since last advisory board meeting"
          - "Regulatory or compliance shifts affecting customer technology decisions"
        preparation_time: "Two to three weeks before advisory board meeting"
      - component: "Customer Outcome Data"
        description: "Aggregated success metrics from customer deployments"
        content:
          - "Platform adoption metrics across advisory board member organizations"
          - "Business outcome achievements: cost reduction, time-to-market, reliability improvements"
          - "Benchmark comparisons: advisory board member outcomes versus broader customer base"
        data_sources:
          - "Customer success team quarterly business reviews"
          - "Platform telemetry and usage analytics"
          - "Customer satisfaction survey results"
      - component: "Demand Signal Package"
        description: "Structured field intelligence demonstrating customer demand for specific capabilities"
        content:
          - "Top five to ten demand signals ranked by revenue weight and frequency"
          - "For each signal: summary, evidence count, revenue impact, competitive context"
          - "Trend analysis: new signals, growing signals, declining signals"
          - "Product team response status for previously surfaced signals"
        presentation_format: "One-page summary per signal with supporting data appendix"
      - component: "Discussion Framework"
        description: "Structured questions and decision points for advisory board dialogue"
        question_types:
          - type: "Validation Questions"
            purpose: "Confirm field intelligence signals with advisory board members"
            example: "We are seeing increasing demand for X across Y segment. Does this match your organization's priorities?"
          - type: "Prioritization Questions"
            purpose: "Help product team rank competing investment priorities"
            example: "Given capabilities A, B, and C on the roadmap, which would deliver the most value to your organization in the next 12 months?"
          - type: "Direction Questions"
            purpose: "Test strategic technology direction with customer stakeholders"
            example: "We are evaluating two architectural approaches to address X. Which approach better aligns with your technology strategy?"

cross_account_pattern_methodology:

  pattern_detection_framework:
    source_reference: "Pragmatic Institute win/loss analysis, SVPG product-market fit methodology"
    purpose: "Identify patterns that span multiple customer accounts to distinguish structural market signals from individual customer noise"
    evidence_thresholds:
      - threshold: "Anecdotal"
        account_count: "1-2 accounts"
        treatment: "Record observation, do not escalate to product strategy"
        confidence: "Low, insufficient data to distinguish signal from noise"
      - threshold: "Emerging Pattern"
        account_count: "3-5 accounts"
        treatment: "Elevate to field intelligence theme, begin structured tracking"
        confidence: "Medium, pattern is forming but requires continued monitoring"
      - threshold: "Validated Signal"
        account_count: "6-10 accounts"
        treatment: "Route to product strategy with full evidence package"
        confidence: "High, pattern is confirmed across sufficient independent data points"
      - threshold: "Market Requirement"
        account_count: "10+ accounts or revenue-weighted equivalent"
        treatment: "Escalate as strategic priority with business case"
        confidence: "Very high, pattern represents structural market demand"
    revenue_weighted_equivalence:
      description: "For signals from high-value accounts, fewer accounts may constitute a validated signal"
      rules:
        - "Single account representing more than 5% of total ARR: treat as emerging pattern regardless of count"
        - "Three accounts representing combined more than 10% of pipeline: treat as validated signal"
        - "Deal loss pattern appearing in two or more enterprise deals above threshold: treat as validated signal"
    statistical_rigor:
      - "Segment control: ensure pattern appears across segments, not concentrated in one vertical or size band"
      - "Time control: pattern must appear across multiple quarters to exclude seasonal effects"
      - "Source control: observations must come from multiple field team members to exclude individual bias"
      - "Competitive control: distinguish between competitive displacement signals and general market demand"

competitive_intelligence_synthesis:

  displacement_pattern_detection:
    source_reference: "Pragmatic Institute competitive analysis framework, Gartner competitive intelligence methodology"
    purpose: "Detect and analyze patterns where competitors are winning or losing deals to inform counter-strategy and product positioning"
    detection_methodology:
      - step: "Loss Pattern Cataloging"
        description: "Systematically catalog competitive losses with root cause analysis"
        data_points:
          - "Competitor involved and their specific product/offering"
          - "Customer segment and deal characteristics"
          - "Primary loss reason: feature gap, pricing, relationship, integration, perception"
          - "Secondary factors contributing to loss"
          - "Customer's evaluation criteria and weighting"
          - "Stage at which competitive loss occurred"
      - step: "Win Pattern Analysis"
        description: "Analyze competitive wins to identify repeatable displacement strategies"
        data_points:
          - "Competitor displaced and their specific product/offering"
          - "Primary win driver: feature advantage, architecture fit, TCO, relationship"
          - "Customer's initial disposition (preferred vendor vs open evaluation)"
          - "Key proof points or demonstrations that shifted the decision"
          - "Time from initial engagement to competitive displacement"
      - step: "Trend Identification"
        description: "Identify shifts in competitive dynamics over time"
        analysis_dimensions:
          - "Win/loss ratio by competitor: trending up, stable, or declining"
          - "New competitors appearing in evaluations that were not present previously"
          - "Feature areas where competitive gap is widening or narrowing"
          - "Customer segments where competitive position is strongest or weakest"
    counter_strategy_development:
      - element: "Competitive Battlecard Input"
        description: "Field-grounded competitive positioning for SA and AE teams"
        components:
          - "Strengths: validated differentiators backed by customer evidence"
          - "Weaknesses: honest assessment of areas where competitor has advantage"
          - "Landmines: questions or evaluation criteria that expose competitor weaknesses"
          - "Traps: competitor-set evaluation criteria designed to disadvantage our platform"
          - "Proof points: customer references and case studies for each strength claim"
      - element: "Product Gap Escalation"
        description: "Competitive feature gaps requiring product investment"
        components:
          - "Gap description with competitive benchmark"
          - "Revenue impact: deals lost or at risk due to this gap"
          - "Customer workaround assessment: how customers address the gap today"
          - "Recommended priority: table stakes (must address), differentiator (invest to lead), or niche (monitor only)"
      - element: "Positioning Adjustment"
        description: "Market messaging changes needed based on competitive movement"
        components:
          - "Current positioning gap versus market perception"
          - "Competitor messaging shifts that require response"
          - "Analyst briefing recommendations to correct market perception"
          - "Field team enablement needs to execute updated positioning"
