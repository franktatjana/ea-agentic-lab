# Technology Trend Methodology - Domain Knowledge
# Referenced by: field CTO agent definitions requiring trend analysis, technology radar, thought leadership
# Sources: ThoughtWorks Technology Radar, Gartner Hype Cycle, Forrester Wave, CNCF
# Last verified: 2026-03

technology_radar:

  thoughtworks_radar_methodology:
    full_name: "ThoughtWorks Technology Radar Methodology"
    source_url: "https://www.thoughtworks.com/radar"
    source_reference: "ThoughtWorks Technology Advisory Board, published biannually since 2010"
    purpose: "Curated assessment of technology landscape based on hands-on experience from real-world delivery projects, organized into quadrants and rings"
    quadrants:
      - quadrant: "Techniques"
        description: "Practices and approaches to software development, architecture, and delivery"
        examples:
          - "Platform engineering"
          - "Event-driven architecture"
          - "Micro frontends"
          - "Team cognitive load assessment"
      - quadrant: "Tools"
        description: "Software tools for development, deployment, testing, and operations"
        examples:
          - "Container orchestration platforms"
          - "Infrastructure-as-code tools"
          - "Observability platforms"
          - "AI coding assistants"
      - quadrant: "Platforms"
        description: "Infrastructure platforms, cloud services, and managed services that teams build upon"
        examples:
          - "Cloud provider managed services"
          - "Internal developer platforms"
          - "Data mesh platforms"
          - "AI/ML training platforms"
      - quadrant: "Languages & Frameworks"
        description: "Programming languages and application frameworks"
        examples:
          - "Rust for systems programming"
          - "TypeScript ecosystem"
          - "LLM orchestration frameworks"
          - "WebAssembly runtimes"
    rings:
      - ring: "Adopt"
        description: "Proven technology that ThoughtWorks recommends for broad use"
        field_cto_action: "Actively recommend to customers, integrate into standard reference architectures, use in customer workshops"
      - ring: "Trial"
        description: "Worth pursuing in projects that can handle risk, with support to manage challenges"
        field_cto_action: "Recommend for innovation-forward customers, propose for proof-of-concept engagements, track adoption outcomes"
      - ring: "Assess"
        description: "Worth exploring to understand how it will affect your organization"
        field_cto_action: "Include in technology vision presentations, discuss in advisory board sessions, monitor for maturity signals"
      - ring: "Hold"
        description: "Proceed with caution, legacy technology or overhyped trends to approach carefully"
        field_cto_action: "Advise customers to defer adoption, provide migration guidance away from held technologies, explain risks"
    application_to_field_cto:
      - "Build a vendor-specific technology radar that maps emerging trends to platform capabilities"
      - "Use radar methodology to structure customer advisory conversations about technology direction"
      - "Create quarterly field-informed radar updates using observations from customer engagements"
      - "Feed radar assessments into product strategy as structured demand signals"

hype_cycle_analysis:

  gartner_hype_cycle_methodology:
    full_name: "Gartner Hype Cycle Methodology"
    source_url: "https://www.gartner.com/en/research/methodologies/gartner-hype-cycle"
    source_reference: "Gartner Research, methodology developed by Jackie Fenn, applied annually across 90+ technology domains"
    purpose: "Map technologies through a predictable cycle of expectations to help organizations determine when to adopt"
    phases:
      - phase: "Innovation Trigger"
        description: "A potential technology breakthrough signals the start of interest. Early proof-of-concept stories and media coverage generate visibility"
        characteristics:
          - "No usable products exist yet"
          - "Commercial viability is unproven"
          - "Research labs and early startups are primary sources"
        field_cto_action:
          - "Monitor through conference presentations, academic papers, and patent filings"
          - "Brief internal teams on potential relevance to vendor platform"
          - "Avoid making customer recommendations at this stage"
      - phase: "Peak of Inflated Expectations"
        description: "Early publicity produces success stories, often accompanied by scores of failures. Some companies take action, many do not"
        characteristics:
          - "Intense media coverage and vendor marketing"
          - "High expectations that exceed current capability"
          - "Many startups and established vendors announce products"
        field_cto_action:
          - "Counter-balance hype with realistic assessment in customer conversations"
          - "Identify genuine use cases versus marketing claims"
          - "Prepare competitive positioning for when customers ask about hyped technologies"
      - phase: "Trough of Disillusionment"
        description: "Interest wanes as experiments and implementations fail to deliver. Producers shake out or fail. Investment continues only if surviving providers improve"
        characteristics:
          - "Initial implementations reveal limitations"
          - "Market consolidation as weaker vendors exit"
          - "Realistic understanding of capabilities and limitations emerges"
        field_cto_action:
          - "Identify technologies entering the trough that align with vendor platform strengths"
          - "Build relationships with surviving vendors for partnership opportunities"
          - "Develop honest customer guidance about realistic adoption timelines"
      - phase: "Slope of Enlightenment"
        description: "More instances of how the technology benefits the enterprise emerge. Second and third-generation products appear from established vendors"
        characteristics:
          - "Best practices and implementation patterns solidify"
          - "Clear ROI models emerge from production deployments"
          - "Enterprise adoption frameworks become available"
        field_cto_action:
          - "Develop reference architectures incorporating these technologies"
          - "Create customer success stories from early adopters"
          - "Build enablement content for SA and CA teams"
      - phase: "Plateau of Productivity"
        description: "Mainstream adoption takes off. Criteria for evaluating provider viability are clearly defined. Market penetration and relevance are paying off"
        characteristics:
          - "Technology is broadly understood and adopted"
          - "Vendor market is stable with clear leaders"
          - "Standards and interoperability are established"
        field_cto_action:
          - "Position vendor platform integration as competitive necessity"
          - "Shift messaging from innovation to operational excellence"
          - "Focus on migration and modernization narratives"
    assessment_dimensions:
      - dimension: "Time to Mainstream Adoption"
        scale:
          - "Less than 2 years"
          - "2 to 5 years"
          - "5 to 10 years"
          - "More than 10 years"
          - "Obsolete before plateau"
      - dimension: "Benefit Rating"
        levels:
          - level: "Transformational"
            description: "Enables new ways of doing business across industries"
          - level: "High"
            description: "Enables new ways of performing horizontal or vertical processes"
          - level: "Moderate"
            description: "Provides incremental improvements to established processes"
          - level: "Low"
            description: "Slightly improves processes, difficult to differentiate from alternatives"

portfolio_readiness_assessment:

  capability_mapping_methodology:
    source_reference: "Forrester technology portfolio assessment, Gartner technology readiness frameworks"
    purpose: "Assess an organization's current technology portfolio against emerging trends to identify gaps, opportunities, and competitive exposure"
    assessment_steps:
      - step: "Capability Inventory"
        description: "Map current vendor platform capabilities to technology trend categories"
        activities:
          - "Catalog all platform features, APIs, and integrations by functional domain"
          - "Map each capability to the corresponding technology trend or market category"
          - "Rate capability maturity: emerging, functional, competitive, leading"
          - "Identify capabilities that span multiple trend categories"
      - step: "Gap Analysis"
        description: "Compare capability inventory against market requirements and customer demand signals"
        activities:
          - "Cross-reference platform capabilities with analyst framework requirements (Gartner MQ criteria, Forrester Wave criteria)"
          - "Map customer feature requests and RFP requirements to capability gaps"
          - "Assess competitive product capabilities in gap areas"
          - "Prioritize gaps by revenue impact: deals lost or at risk due to missing capability"
      - step: "Competitive Benchmarking"
        description: "Position vendor platform capabilities relative to key competitors across trend categories"
        activities:
          - "Build capability comparison matrix across top three to five competitors per category"
          - "Use analyst evaluations, customer feedback, and technical assessment as data sources"
          - "Identify areas of clear differentiation and areas of parity or deficit"
          - "Track competitive movement quarterly to detect closing or widening gaps"
      - step: "Readiness Scoring"
        description: "Assign a readiness score to each technology trend based on capability coverage and market timing"
        scoring_dimensions:
          - dimension: "Capability Coverage"
            scale: "0-100, percentage of market-required capabilities present in platform"
          - dimension: "Market Timing"
            scale: "Early (invest), On-time (compete), Late (catch-up)"
          - dimension: "Customer Demand"
            scale: "Low (monitoring), Medium (emerging requests), High (deal-critical)"
          - dimension: "Competitive Position"
            scale: "Leading, Competitive, Lagging, Absent"

thought_leadership_development:

  field_grounded_content_methodology:
    source_reference: "ThoughtWorks field advisory methodology, Gartner distinguished analyst program"
    purpose: "Transform field observations and customer engagement patterns into authoritative thought leadership content"
    content_creation_pipeline:
      - stage: "Observation Collection"
        description: "Systematically capture technology patterns from customer engagements"
        activities:
          - "Record technology challenges and solutions observed across customer accounts"
          - "Tag observations by industry, company size, technology domain, and maturity level"
          - "Note recurring questions from customers and prospects that signal knowledge gaps"
          - "Capture successful and failed adoption patterns with contributing factors"
        minimum_evidence: "Three or more independent customer observations before elevating to a content theme"
      - stage: "Pattern Synthesis"
        description: "Aggregate individual observations into thematic technology narratives"
        activities:
          - "Cluster observations by technology domain and customer outcome"
          - "Identify causal patterns: what conditions lead to success versus failure"
          - "Cross-reference field patterns with analyst research and industry data"
          - "Develop a thesis statement that captures the pattern's significance"
      - stage: "Content Development"
        description: "Create structured thought leadership content from validated patterns"
        content_types:
          - type: "Blog Post"
            purpose: "Accessible analysis of a single technology trend or pattern"
            structure: "Observation → Pattern → Implication → Recommendation (1,000-1,500 words)"
          - type: "Conference Talk"
            purpose: "In-depth exploration of a technology theme with customer evidence"
            structure: "Problem framing → Market context → Field evidence → Architecture patterns → Call to action (30-45 minutes)"
          - type: "Whitepaper"
            purpose: "Comprehensive analysis of a technology domain with actionable guidance"
            structure: "Executive summary → Market analysis → Customer evidence → Reference architecture → Implementation roadmap (3,000-5,000 words)"
          - type: "Technology Brief"
            purpose: "Internal advisory document for product and strategy teams"
            structure: "Field signal summary → Customer demand evidence → Competitive landscape → Recommendation (1-2 pages)"
      - stage: "Validation and Review"
        description: "Ensure content accuracy, differentiation, and strategic alignment"
        validation_checks:
          - "Customer data anonymized and approved for external use"
          - "Technical claims verified against current platform capabilities"
          - "Competitive references are factual and defensible"
          - "Content aligns with vendor strategic messaging and roadmap direction"

  conference_abstract_methodology:
    source_reference: "Conference speaking best practices, O'Reilly and QCon submission guidelines"
    purpose: "Structure conference talk proposals that balance vendor credibility with technical depth"
    abstract_structure:
      - element: "Hook"
        description: "Opening sentence that captures the selection committee's attention with a concrete problem or surprising data point"
      - element: "Problem Statement"
        description: "The specific challenge that the audience faces, stated in their terms not vendor terms"
      - element: "Approach"
        description: "How the talk addresses the problem, including methodology, architecture patterns, or case study approach"
      - element: "Key Takeaways"
        description: "Three to four concrete things the audience will learn, stated as actionable outcomes"
      - element: "Speaker Credibility"
        description: "Brief statement of field experience relevant to the topic, emphasizing hands-on customer work"
    selection_criteria:
      - "Vendor-neutral framing: talk must be useful even if audience uses a different platform"
      - "Field-grounded: content must come from real customer engagements, not theoretical analysis"
      - "Actionable: audience must be able to apply learnings on Monday morning"
      - "Original: perspective must add something not already covered by existing conference content"

trend_signal_sources:

  signal_taxonomy:
    source_reference: "ThoughtWorks Technology Advisory Board methodology, Gartner emerging technology analysis"
    purpose: "Categorize and prioritize sources of technology trend signals for systematic monitoring"
    signal_categories:
      - category: "Analyst Reports"
        sources:
          - "Gartner Magic Quadrant and Hype Cycle publications"
          - "Forrester Wave evaluations and prediction reports"
          - "IDC MarketScape and FutureScape analyses"
          - "RedMonk programming language and database rankings"
        signal_strength: "High, represents synthesized market analysis from multiple data points"
        monitoring_cadence: "Quarterly review of new publications in relevant technology domains"
      - category: "Open-Source Activity"
        sources:
          - "GitHub trending repositories and star velocity"
          - "CNCF project maturity transitions (sandbox → incubating → graduated)"
          - "Apache Software Foundation project incubation pipeline"
          - "Stack Overflow survey trends and tag velocity"
        signal_strength: "Medium-high, indicates practitioner adoption and community investment"
        monitoring_cadence: "Monthly review of activity metrics and project milestones"
      - category: "Conference Themes"
        sources:
          - "KubeCon, re:Invent, Google Cloud Next keynote themes"
          - "QCon, Strange Loop, GOTO track themes and talk acceptance patterns"
          - "Vendor-specific conference (Dreamforce, .conf, Ignite) strategic announcements"
          - "Academic conference proceedings (SIGMOD, OSDI, SOSP) for early-stage signals"
        signal_strength: "Medium, indicates industry attention and vendor investment direction"
        monitoring_cadence: "Per-event review with quarterly trend synthesis"
      - category: "Patent Filings"
        sources:
          - "USPTO and EPO patent databases filtered by technology domain"
          - "Major technology company patent portfolios (Google, Microsoft, Amazon, Meta)"
          - "Patent citation networks revealing technology convergence"
        signal_strength: "Low-medium, indicates long-term R&D direction but not immediate market impact"
        monitoring_cadence: "Semi-annual review of patent filing trends in strategic technology areas"
      - category: "Venture Capital Investment"
        sources:
          - "Crunchbase and PitchBook funding round data by technology category"
          - "Andreessen Horowitz, Sequoia, and Accel investment thesis publications"
          - "Y Combinator batch composition analysis"
        signal_strength: "Medium, indicates market belief in technology viability and growth potential"
        monitoring_cadence: "Quarterly review of funding trends by technology category"
      - category: "Customer Demand Signals"
        sources:
          - "RFP and RFI requirement patterns across customer segments"
          - "Customer feature requests aggregated from support and success teams"
          - "Proof-of-concept and pilot requests by technology domain"
          - "Deal loss analysis citing missing technology capabilities"
        signal_strength: "Highest, represents actual market demand with revenue attached"
        monitoring_cadence: "Monthly aggregation from field teams, quarterly trend analysis"

technology_direction_narratives:

  narrative_construction_methodology:
    source_reference: "Gartner technology vision communication, ThoughtWorks strategic advisory"
    purpose: "Connect emerging technology patterns to vendor platform capabilities through structured narratives that field teams can use in customer engagements"
    narrative_components:
      - component: "Trend Identification"
        description: "Name and describe the technology trend using signal source data"
        requirements:
          - "Trend must appear in at least two signal source categories"
          - "Customer demand signal must be present, not just analyst or vendor hype"
          - "Competitive landscape must show at least one competitor investing in the trend"
      - component: "Customer Impact Mapping"
        description: "Translate the technology trend into business outcomes relevant to target customer segments"
        requirements:
          - "Map to at least three distinct customer use cases across different industries"
          - "Quantify impact where possible using customer data or analyst estimates"
          - "Identify which customer roles (CTO, CIO, VP Engineering) care most about this trend"
      - component: "Platform Capability Alignment"
        description: "Show how vendor platform capabilities address the trend today and on the roadmap"
        requirements:
          - "Current capabilities: what customers can do today with the platform"
          - "Roadmap capabilities: what is planned and when it will be available"
          - "Gap capabilities: where partners or third-party integrations fill the space"
      - component: "Competitive Differentiation"
        description: "Articulate what makes the vendor's approach to this trend distinct from competitors"
        requirements:
          - "Must be defensible and specific, not generic superlatives"
          - "Grounded in architecture or approach differences, not marketing claims"
          - "Validated by customer feedback or analyst assessment"
      - component: "Call to Action"
        description: "Clear next step for the customer to explore this technology direction with the vendor"
        requirements:
          - "Specific engagement type: workshop, proof-of-concept, architecture review"
          - "Resource commitment: what the vendor will provide"
          - "Timeline: how long the engagement takes"
