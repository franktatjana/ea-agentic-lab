# Field CTO Agent Configuration
# Purpose: Orchestrate cross-account strategic intelligence across pattern synthesis, executive advisory, technology vision, and field intelligence
# Sub-agents: fcto-pattern-synthesis, fcto-executive-advisory, fcto-technology-vision, fcto-field-intelligence

agent_id: "fcto_agent"
team: "field_cto"
category: "strategic"
purpose: "Orchestrate cross-account strategic intelligence through 4 specialized sub-agents"

core_functions:
  - "Route strategic requests to correct sub-agent"
  - "Aggregate cross-domain strategic assessments"
  - "Pattern synthesis: cross-account patterns, competitive displacement, win themes, product gaps"
  - "Executive advisory: briefings, C-suite content, board presentations, strategic messaging"
  - "Technology vision: trend monitoring, portfolio readiness, thought leadership, technology narratives"
  - "Field intelligence: observation aggregation, product strategy routing, advisory board, deal support"

mechanics:
  - "Parse request for domain signals and route to sub-agent"
  - "Aggregate parallel sub-agent outputs for cross-domain views"
  - "Monitor cross-account data for proactive pattern alerting"

inputs:
  - "SA and CA engagement data across accounts"
  - "Executive briefing requests and customer context"
  - "Technology trend signals from analysts and field"
  - "Field observations from deal notes and team reports"
  - "Product roadmap and competitive landscape"

outputs:
  - "Pattern reports (cross-account themes, competitive displacement, win themes)"
  - "Executive content (briefings, talking points, board presentations)"
  - "Vision assessments (trend monitoring, portfolio readiness, thought leadership)"
  - "Intelligence reports (field aggregation, product strategy input, deal support)"

escalation_to: "Field CTO"

sub_agents:
  - id: "fcto-pattern-synthesis-agent"
    name: "Pattern Synthesis"
    skill: "SK_FCTO_001"
  - id: "fcto-executive-advisory-agent"
    name: "Executive Advisory"
    skill: "SK_FCTO_002"
  - id: "fcto-technology-vision-agent"
    name: "Technology Vision"
    skill: "SK_FCTO_003"
  - id: "fcto-field-intelligence-agent"
    name: "Field Intelligence"
    skill: "SK_FCTO_004"

playbooks:
  owned:
    - id: "PB_FCTO_001"
      name: "Cross-Account Pattern Synthesis"
      path: "domain/playbooks/field_cto/PB_FCTO_001_cross_account_pattern_synthesis.yaml"
      description: "Quarterly synthesis of technical patterns across customer portfolio"
    - id: "PB_FCTO_002"
      name: "Executive Advisory"
      path: "domain/playbooks/field_cto/PB_FCTO_002_executive_advisory.yaml"
      description: "Executive briefing preparation and C-suite engagement support"
    - id: "PB_FCTO_003"
      name: "Technology Vision"
      path: "domain/playbooks/field_cto/PB_FCTO_003_technology_vision.yaml"
      description: "Technology trend monitoring and portfolio readiness assessment"
    - id: "PB_FCTO_004"
      name: "Field Intelligence"
      path: "domain/playbooks/field_cto/PB_FCTO_004_field_intelligence.yaml"
      description: "Field observation aggregation and product strategy routing"
  contributes_to:
    - id: "PB_AE_002"
      name: "Account Planning"
      role: "secondary_agent"
      description: "Provides cross-account patterns and competitive intelligence"
    - id: "PB_SA_002"
      name: "Solution Design"
      role: "secondary_agent"
      description: "Validates strategic deal positioning with cross-account evidence"
    - id: "PB_AE_004"
      name: "Deal Progression"
      role: "secondary_agent"
      description: "Provides executive engagement strategy and positioning support"
    - id: "PB_PTR_003"
      name: "Joint Account Planning"
      role: "secondary_agent"
      description: "Provides cross-account partner integration patterns"
    - id: "PB_HAM_001"
      name: "Hyperscaler Co-sell"
      role: "secondary_agent"
      description: "Validates strategic positioning for co-sell engagements"

skills:
  owned:
    - "SK_FCTO_001"
    - "SK_FCTO_002"
    - "SK_FCTO_003"
    - "SK_FCTO_004"

execution:
  trigger_sources:
    - "cross_account_pattern_detected"
    - "executive_briefing_requested"
    - "technology_trend_signal_detected"
    - "field_intelligence_aggregation_due"
    - "strategic_deal_support_requested"
    - "advisory_board_preparation_triggered"
  output_destination: "{realm}/{node}/internal-infohub/field_cto/"
  escalation_threshold: "strategic_risk_detected"

personality_file: "teams/field_cto/personalities/fcto_personality.yaml"
prompts_dir: "teams/field_cto/prompts"
