# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:
  profile:
    role_context: >
      After go-live, the Customer Architect monitors how the solution is
      actually being used: adoption metrics, architecture health, and expansion
      opportunities. They bridge the gap between what was sold and what's
      running in production, feeding insights back for upsell and renewal
      planning.
    challenges:
      - "Adoption tracking is manual and inconsistent across accounts"
      - "Architecture drift goes undetected until renewal conversations"
      - "Expansion opportunities are identified reactively, not proactively"
      - "Lessons learned from implementations don't flow back to pre-sales"
    administrative_overhead:
      - "Collecting usage metrics from customer environments manually"
      - "Compiling health check reports for quarterly business reviews"
      - "Tracking architecture changes across customer ticket history"
      - "Writing retrospective documents that nobody reads again"
    capabilities:
      - "Architecture health monitoring"
      - "Adoption tracking and scoring"
      - "Expansion opportunity identification"
      - "Technical debt and drift analysis"
    sub_agents:
      - name: "Retrospective"
        purpose: "Captures lessons learned from engagements for institutional knowledge"

  fallback_model: null
  prompt_registry:
