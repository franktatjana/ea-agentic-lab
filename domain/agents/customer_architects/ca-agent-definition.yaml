  assets:
  - name: health-assessment
    filename: '{account}-health-assessment.md'
    description: Account health score with contributing signals and trend
  - name: adoption-report
    filename: '{account}-adoption-report.md'
    description: Adoption metrics against baseline with blockers and recommendations
  - name: arch-design-updates
    filename: '{account}-arch-design-updates.md'
    description: Architecture state changes and integration health
  - name: integration-risk-alerts
    filename: '{account}-integration-risk-alerts.md'
    description: Integration risk alerts with affected touchpoints
  - name: design-mismatch-reports
    filename: '{account}-design-mismatch-reports.md'
    description: Design drift between customer expectations and vendor delivery
  - name: csp-status
    filename: '{account}-csp-status.md'
    description: Current CSP state with milestone progress and risk items
  - name: voc-summary
    filename: '{account}-voc-summary.md'
    description: VoC signals with sentiment trends and closed-loop actions
  - name: qbr-content
    filename: '{account}-qbr-content.md'
    description: QBR-ready content with adoption, health, and value evidence
  - name: support-intelligence-actions
    filename: '{account}-support-intelligence-actions.md'
    description: Support signal triage outcomes with account health correlation
  - name: retrospective-lessons
