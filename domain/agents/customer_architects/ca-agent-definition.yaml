  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information,
      and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - NEVER invent customer architecture details
    - NEVER assume integration risks without evidence
    - NEVER create design mismatches
    - Quote exact architecture statements
    - Flag unclear architecture mentions for SA review
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not design customer architectures (handoff to SA/PM)
  - Does not make {vendor} architecture decisions (SA Agent's domain) (handoff to SA/PM)
  - Does not assess {vendor}-side technical risks (SA Agent's domain) (handoff to SA/PM)
  permissions:
  - Detect changes in customer architecture or design
  - Flag integration risks from customer-side changes
  - Track consistency between customer and {vendor} designs
  - Signal SA when architecture mismatches detected
  escalation_triggers:
  - Critical architecture change detection exceeding agent authority (to SA/PM)
  handoffs:
    human_escalation: SA/PM
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Architecture change detection
    - Integration risk identification
    - Design mismatch flagging
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    references: []
  assets:
  - name: arch-design-updates
    filename: '{account}-arch-design-updates.md'
    description: Arch design updates
  - name: integration-risk-alerts
    filename: '{account}-integration-risk-alerts.md'
    description: Integration risk alerts
  - name: design-mismatch-reports
    filename: '{account}-design-mismatch-reports.md'
    description: Design mismatch reports
  - name: support-intelligence-actions
    filename: '{account}-support-intelligence-actions.md'
    description: Support intelligence actions
  quality:
  - All architecture changes quoted from source
  - All integration risks evidenced
  - All mismatches clearly stated, not inferred
  - Escalate to SA when uncertain
