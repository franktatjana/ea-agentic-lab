x-ea-agent:
  profile:
    role_context: 'The Customer Architect monitors how the solution is being used: adoption metrics, architecture health, and expansion opportunities. They bridge the gap between
      what was sold and what is running in production, feeding insights back for renewal and expansion planning.

      '
    why: 'Customer Architects manage 15-30 accounts at different lifecycle stages, each with own adoption, architecture state, and renewal timeline. Between health checks, QBR preparation,
      support triage, and CSP updates, the time available for strategic account conversations shrinks. This agent handles signal aggregation, health scoring, adoption tracking, and artifact generation
      so the CA can focus on relationship judgment and proactive account strategy.

      '
    goals_summary: 'The CA succeeds when adoption stays on track, architecture drift is caught before renewal, every account has a customer success plan, and expansion surface from data
      rather than guesswork.

      '
    goals:
    - Every account has a current health score updated at least monthly
    - Adoption tracked against success plan baselines with no manual data collection
    - Architecture drift detected at least 90 days before renewal date
    - CSP refreshed quarterly with current metrics, not stale estimates
    - Expansion opportunities surfaced from usage data, not reactive customer requests
    - QBR content prepared with evidence-backed narrative and zero last-minute scrambling
    - Support signals triaged and correlated with account health within SLA
    - VoC collected systematically and closed-loop on negative feedback within 48 hours
    - Implementation lessons captured and linked to deal profiles for pre-sales reuse
    - Product feedback aggregated and routed to PM with frequency and source attribution
    role_tab_intro: 'The CA owns the post-sales technical relationship across 15-30 accounts, each at a different point in the adoption lifecycle. The challenges below are where account coverage gaps
      form, adoption risks go undetected, and renewal conversations start from a position of surprise rather than confidence, each mapped to the sub-agent built to handle it.

      '
    human_matters_goal: 'Every account is monitored, every health signal is surfaced, but the customer relationship endures because the CA brought judgment and empathy that no agent can replicate.

      '
    scenarios:
    - problem: Architecture drift goes undetected until renewal
      why: 'After go-live, customer environments evolve through patches, integrations, and team changes. Without continuous monitoring, the architecture drifts from the original design. By the time the
        renewal conversation happens, the gap between what was sold and what is running creates friction and erodes trust.

        '
      agent: ca-agent
      agent_response: 'The agent monitors customer architecture changes from support signals and usage data, detects integration risks, and flags design deviations. It generates health assessments that
        connect architecture state to business outcomes, giving the account team early warning before drift becomes a renewal risk.

        '
      success_signal:
        metric: Architecture drift detection lead time before renewal
        target: Flag architecture deviations at least 90 days before renewal date
        leading_indicator: Health check reports include actionable architecture findings each quarter
        failure_signal: Architecture issues surface only during renewal negotiations
    - problem: Expansion opportunities are discovered reactively
      why: 'Customer adoption patterns contain signals about where the solution delivers value and where adjacent use cases exist. Without systematic tracking, expansion opportunities surface only when
        a customer asks, rather than when the account team could proactively position them.

        '
      agent: ca-agent
      agent_response: 'The agent tracks adoption metrics and maps usage patterns against the customer success plan. It identifies under-utilized capabilities and adjacent use cases where expansion aligns
        with the customer''s adoption trajectory, surfacing opportunities with evidence from actual usage data.

        '
      success_signal:
        metric: Proactively identified expansion opportunities per account
        target: Surface at least 1 data-backed expansion opportunity per account per quarter
        leading_indicator: Adoption health scores correlate with expansion pipeline generation
        failure_signal: Expansion conversations happen only when customers initiate them
    - problem: Adoption tracking is manual and inconsistent across accounts
      why: 'Customer adoption signals live in usage dashboards, support tickets, and anecdotal feedback from CSMs. Without systematic aggregation, some accounts get detailed tracking while others are checked
        only before QBRs. Inconsistency means adoption risks go undetected until they threaten renewal.

        '
      agent: ca-agent
      agent_response: 'The agent aggregates adoption signals from usage metrics, support interactions, and engagement patterns into a standardized adoption health score per account. It applies consistent
        measurement criteria across all accounts, flags declining adoption trends early, and generates targeted enablement recommendations for accounts below threshold.

        '
      success_signal:
        metric: Adoption tracking coverage and consistency
        target: All active accounts have a current adoption health score updated at least monthly
        leading_indicator: Adoption trend alerts trigger proactive outreach before QBR preparation
        failure_signal: Adoption issues are discovered during QBR preparation or at renewal
    - problem: Lessons learned from implementations don't flow back to pre-sales
      why: 'Every implementation generates insights about what works, what does not, and which assumptions were wrong. These lessons stay locked in delivery team retrospectives and post-mortems. Pre-sales
        teams repeat the same mistakes because they never see the feedback from downstream execution.

        '
      agent: ca-agent
      agent_response: 'The agent captures implementation lessons, including scope accuracy, technical assumptions that failed, and integration patterns that worked, and structures them into a searchable
        knowledge base linked to deal characteristics. It surfaces relevant lessons when pre-sales teams work on deals with similar profiles, closing the feedback loop between delivery outcomes and sales
        positioning.

        '
      success_signal:
        metric: Implementation lesson feedback loop coverage
        target: Lessons from at least 80% of completed implementations are captured and linked to deal profiles
        leading_indicator: Pre-sales teams reference implementation lessons in deal preparation for similar opportunities
        failure_signal: Pre-sales commits to scope or timeline that delivery has already identified as unrealistic
    challenges:
    # Orchestrator-level challenges
    - text: Context-switching across 15-30 accounts at different lifecycle stages
      solved_by: ca-agent
      specific_overhead:
      - Pulling health, adoption, and architecture context before each account interaction
    - text: Cross-domain signals require coordination that no single function owns
      solved_by: ca-agent
      specific_overhead:
      - Manually correlating health, adoption, and architecture signals to form account-level view
    # Health challenges
    - text: Health signals are scattered across support tickets, usage data, and anecdotal feedback
      solved_by: ca-health-agent
      specific_overhead:
      - Manually correlating support cases with account health status
    - text: Renewal readiness is assessed weeks before expiry instead of continuously
      solved_by: ca-health-agent
      specific_overhead:
      - Compiling health check reports for quarterly business reviews
    - text: Support escalation patterns are not connected to account health decisions
      solved_by: ca-health-agent
      specific_overhead:
      - Cross-referencing repeat support issues with adoption and architecture state
    - text: Critical support incidents are treated as isolated events instead of health indicators
      solved_by: ca-health-agent
    - text: Health scoring relies on subjective assessment rather than multi-source signal aggregation
      solved_by: ca-health-agent
      specific_overhead:
      - Manually weighting and combining usage, support, and engagement signals per account
    # Adoption challenges
    - text: Adoption tracking is manual and inconsistent across accounts
      solved_by: ca-adoption-agent
      specific_overhead:
      - Collecting usage metrics from customer environments manually
    - text: Adoption blockers are identified by symptom, not root cause
      solved_by: ca-adoption-agent
      specific_overhead:
      - Investigating whether adoption issues are technical, process, knowledge, or resource-based
    - text: Expansion opportunities are identified reactively, not proactively
      solved_by: ca-adoption-agent
      specific_overhead:
      - Tracking usage patterns against potential adjacent use cases across accounts
    - text: Value delivered is never measured against original business goals from the CSP
      solved_by: ca-adoption-agent
      specific_overhead:
      - Manually mapping current usage metrics back to original success criteria
    - text: QBR preparation consumes days of manual data gathering
      solved_by: ca-adoption-agent
      specific_overhead:
      - Assembling adoption metrics, health scores, and value evidence from multiple systems
    - text: Success stories lack quantitative evidence because value data is not tracked systematically
      solved_by: ca-adoption-agent
    # Architecture challenges
    - text: Architecture drift goes undetected until renewal conversations
      solved_by: ca-architecture-agent
      specific_overhead:
      - Tracking architecture changes across customer ticket history
    - text: Integration health is assumed stable until something breaks in production
      solved_by: ca-architecture-agent
      specific_overhead:
      - Monitoring customer-vendor integration touchpoints for degradation signals
    - text: Customer environment changes are discovered through incident reports, not proactive monitoring
      solved_by: ca-architecture-agent
    - text: Design drift between customer expectations and vendor delivery grows silently
      solved_by: ca-architecture-agent
      specific_overhead:
      - Comparing current architecture state against original solution design documents
    # CSP challenges
    - text: Customer success plans go stale between quarterly reviews
      solved_by: ca-csp-agent
      specific_overhead:
      - Updating CSP milestones and risk sections with current data before each review
    - text: CSP handoff from SA is incomplete, forcing the CA to reconstruct context
      solved_by: ca-csp-agent
      specific_overhead:
      - Validating handoff completeness and chasing missing sections from SA team
    - text: CSP risk sections lag behind actual health and support signals
      solved_by: ca-csp-agent
    - text: Expansion planning starts from scratch instead of building on completed milestones
      solved_by: ca-csp-agent
      specific_overhead:
      - Reviewing milestone completion and readiness criteria before planning next phase
    # Journey and VoC challenges
    - text: Negative customer feedback goes unaddressed until it becomes churn risk
      solved_by: ca-journey-agent
      specific_overhead:
      - Tracking VoC signals across NPS surveys, CSAT, and meeting notes
    - text: Customer sentiment is measured by survey scores alone, missing qualitative friction signals
      solved_by: ca-journey-agent
      specific_overhead:
      - Collecting and correlating feedback from surveys, meetings, and support interactions
    - text: Product feedback from customers never reaches the PM team in actionable form
      solved_by: ca-journey-agent
      specific_overhead:
      - Aggregating and categorizing product requests across accounts for PM consumption
    - text: Journey friction at onboarding compounds through adoption because it is never surfaced
      solved_by: ca-journey-agent
    - text: VoC trends are invisible because feedback is collected but never analyzed over time
      solved_by: ca-journey-agent
      specific_overhead:
      - Building trend reports from point-in-time survey results and scattered qualitative notes
    # Retrospective challenges
    - text: Lessons learned from implementations don't flow back to pre-sales
      solved_by: retrospective-agent
      specific_overhead:
      - Writing retrospective documents that nobody reads again
    - text: Implementation patterns repeat across accounts but institutional knowledge stays local
      solved_by: retrospective-agent
      specific_overhead:
      - Extracting reusable patterns from engagement-specific retrospective notes
    # TAM-sourced challenges: enablement, upgrades, advocacy
    - text: Adoption blockers classified as knowledge gaps have no structured enablement response
      solved_by: ca-adoption-agent
      specific_overhead:
      - Manually assessing training needs and coordinating enablement sessions per account
    - text: Major vendor releases catch customers unprepared because upgrade readiness is never assessed
      solved_by: ca-architecture-agent
      specific_overhead:
      - Checking customer environments against upcoming release requirements one account at a time
    - text: Product feedback routed to PM disappears into a backlog with no outcome visibility
      solved_by: ca-journey-agent
      specific_overhead:
      - Manually following up with PM on feedback status and informing customers of outcomes
    - text: Support backlog trends upward without anyone noticing until it affects renewal conversations
      solved_by: ca-health-agent
      specific_overhead:
      - Manually tracking open issue counts and comparing against previous periods
    - text: Preventive maintenance opportunities are missed because configuration drift is not monitored
      solved_by: ca-architecture-agent
    - text: Champion departures and stakeholder restructuring go undetected until renewal conversations reveal relationship gaps
      source: REF_CA_BP_001
      solved_by: ca-health-agent
    - text: Health scoring is threshold-based rather than predictive, missing churn risk that ML models detect 3-6 months ahead with 85%+ accuracy
      source: REF_CA_BP_001
      solved_by: ca-health-agent
    - text: Health assessments produce qualitative ratings without ARR weighting, so a $2M account at yellow gets the same attention as a $50K account
      source: REF_CA_BP_001
      solved_by: ca-health-agent
    - text: Time-to-value has no explicit metric, so the strongest predictor of long-term retention goes unmeasured
      source: REF_CA_BP_001
      solved_by: ca-journey-agent
    - text: Health alerts produce assessments but do not auto-trigger intervention sequences like outreach emails or enablement check-ins
      source: REF_CA_BP_001
      solved_by: ca-health-agent
    administrative_overhead:
    - text: Pulling health, adoption, and architecture context before each account interaction
      automated_by: ca-agent
    - text: Collecting usage metrics from customer environments manually
      automated_by: ca-adoption-agent
    - text: Compiling health check reports for quarterly business reviews
      automated_by: ca-health-agent
    - text: Tracking architecture changes across customer ticket history
      automated_by: ca-architecture-agent
    - text: Manually correlating support cases with account health status
      automated_by: ca-health-agent
    - text: Assembling QBR content from multiple disconnected systems
      automated_by: ca-adoption-agent
    - text: Updating CSP milestones before each quarterly review
      automated_by: ca-csp-agent
    - text: Aggregating VoC and product feedback across accounts
      automated_by: ca-journey-agent
    - text: Writing retrospective documents that nobody reads again
      automated_by: retrospective-agent
    - text: Validating CSP handoff completeness from SA
      automated_by: ca-csp-agent
    key_metrics:
    - 'Health score accuracy: health predictions that correlate with actual renewal outcomes'
    - 'Adoption tracking coverage: percentage of active accounts with current adoption score'
    - 'Architecture drift detection: days between change and detection vs days before renewal'
    - 'CSP freshness: percentage of CSPs updated within the last 30 days'
    - 'VoC closed-loop rate: negative feedback items with documented follow-up action'
    - 'Expansion signal conversion: proactively identified opportunities that enter pipeline'
    - 'QBR preparation time: hours from trigger to presentation-ready content'
    - 'Retrospective reuse rate: lessons referenced in subsequent pre-sales engagements'
    - 'Time-to-value: days from deployment to first measurable business outcome'
    - 'Support backlog trend: open issue count trending below agreed threshold per account'
    - 'Enablement effectiveness: adoption lift within 30 days of enablement intervention'
    - 'Upgrade readiness: percentage of accounts assessed before major version releases'
    - 'Feedback outcome rate: product feedback items where PM action was taken and customer informed'
    stakeholder_landscape:
      customer_side:
      - role: 'IT Director / Operations Lead: deployment health, infrastructure changes, capacity'
        connected_via: ca-architecture-agent
      - role: 'Business Sponsor / VP: value realization, ROI, strategic alignment'
        connected_via: ca-adoption-agent
      - role: 'Technical Champion: day-to-day adoption, feature usage, integration issues'
        connected_via: ca-adoption-agent
      - role: 'End Users: adoption friction, feature requests, satisfaction signals'
        connected_via: ca-journey-agent
      - role: 'Procurement / Renewal Lead: contract terms, renewal timeline, budget approval'
        connected_via: ca-health-agent
      internal_team:
      - role: 'Account Executive: commercial context, renewal strategy, expansion positioning'
        connected_via: ca-agent
      - role: 'Solution Architect: technical continuity, architecture decisions, handoff context'
        connected_via: ca-agent
      - role: 'Product Manager: feature gaps, product feedback, roadmap alignment'
        connected_via: ca-journey-agent
      - role: 'Support Team: escalation patterns, incident history, resolution quality'
        connected_via: ca-health-agent
      - role: 'Delivery Manager: implementation status, lessons learned, deployment issues'
        connected_via: retrospective-agent
    capabilities:
    - Customer health monitoring and early warning
    - Adoption tracking against success plan baselines
    - Architecture drift detection and integration health
    - Customer success plan lifecycle management
    - Customer journey mapping and friction analysis
    - Voice of Customer collection and trend analysis
    - Product feedback aggregation for PM
    - QBR content preparation with evidence
    - Expansion opportunity identification from usage data
    - Support intelligence triage and correlation
    - Retrospective capture and knowledge reuse
    - Renewal readiness assessment
    sub_agents:
    - name: CA Health Agent
      id: ca-health-agent
      purpose: Customer health monitoring, early warning detection, renewal readiness, support intelligence triage
      definition_path: domain/agents/customer_architects/ca-health-definition.yaml
    - name: CA Adoption Agent
      id: ca-adoption-agent
      purpose: Adoption tracking, blocker identification, use case expansion, value delivery, QBR content
      definition_path: domain/agents/customer_architects/ca-adoption-definition.yaml
    - name: CA Architecture Agent
      id: ca-architecture-agent
      purpose: Customer architecture monitoring, change impact assessment, integration health
      definition_path: domain/agents/customer_architects/ca-architecture-definition.yaml
    - name: CA CSP Agent
      id: ca-csp-agent
      purpose: CSP lifecycle from SA handoff through quarterly refresh, risk updates, expansion planning
      definition_path: domain/agents/customer_architects/ca-csp-definition.yaml
    - name: CA Journey Agent
      id: ca-journey-agent
      purpose: Customer journey mapping, friction analysis, VoC collection and analysis, product feedback
      definition_path: domain/agents/customer_architects/ca-journey-definition.yaml
    - name: Retrospective Agent
      id: retrospective-agent
      purpose: Captures lessons learned from engagements for institutional knowledge
      definition_path: domain/agents/retrospective/retrospective-agent-definition.yaml
    human_matters_summary: 'The agent surfaces signals and prepares artifacts, but the CA decides which accounts need a difficult conversation and how to deliver it without eroding trust.

      '
    with_this_agent:
    - domain: Customer Health Monitoring
      agent: ca-health-agent
      items:
      - 'Health: Assess account health from usage, support, and engagement signals with early warning detection.'
      - 'Renewal Readiness: Evaluate renewal risk and readiness across accounts approaching contract end.'
    - domain: Support Intelligence
      agent: ca-health-agent
      items:
      - 'Support Triage: Correlate support signals with account health and route to appropriate response.'
      - 'Support Backlog: Track open issue trends against threshold and flag when backlog trajectory threatens account health.'
    - domain: Adoption Tracking and Value Delivery
      agent: ca-adoption-agent
      items:
      - 'Adoption: Track adoption metrics against success plan baselines and identify blockers with root cause.'
      - 'Value: Measure value delivered against original business goals for QBR evidence.'
      - 'Expansion: Discover expansion opportunities from usage patterns and business context.'
    - domain: Customer Enablement
      agent: ca-adoption-agent
      items:
      - 'Enablement: Assess knowledge gaps from adoption blockers and recommend training, documentation, or workshops.'
      - 'Enablement Outcomes: Track adoption lift within 30 days of enablement intervention.'
    - domain: Customer Architecture Monitoring
      agent: ca-architecture-agent
      items:
      - 'Architecture: Monitor customer-side architecture changes and assess integration impact.'
      - 'Drift Detection: Flag design drift between customer expectations and vendor implementation.'
    - domain: Upgrade Lifecycle and Preventive Maintenance
      agent: ca-architecture-agent
      items:
      - 'Upgrade Readiness: Assess customer environment readiness before major vendor version releases.'
      - 'Preventive Maintenance: Analyze configuration drift and patch status for preventive recommendations.'
    - domain: Customer Success Plan Lifecycle
      agent: ca-csp-agent
      items:
      - 'CSP Handoff: Validate and accept CSP handoff from SA at deal close.'
      - 'CSP Refresh: Perform quarterly CSP refresh integrating health, adoption, and risk dimensions.'
      - 'Expansion Planning: Plan next adoption phase when current milestones are met.'
    - domain: Customer Journey and Voice of Customer
      agent: ca-journey-agent
      items:
      - 'Journey: Map customer journey with friction points and sentiment tracking across lifecycle phases.'
      - 'VoC: Collect and analyze Voice of Customer signals from NPS, CSAT, and qualitative feedback.'
      - 'Product Feedback: Aggregate product-relevant feedback for PM team consumption.'
      - 'Feedback Outcome: Track PM action on routed feedback and notify customers of outcomes.'
    - domain: Retrospectives and Institutional Knowledge
      agent: retrospective-agent
      items:
      - 'Retrospectives: Capture lessons learned from engagements and link to deal profiles for pre-sales reuse.'
    activity_map:
      purpose: 'The CA owns the post-sales technical relationship across customer accounts, from solution handoff through renewal. All domain work is delegated to 6 specialized sub-agents.
        The CA orchestrator is a pure router: it holds no operational flows or prompts, only routing logic, cross-agent coordination, and account-level aggregation.

        '
      domains:
      - domain: Customer Health Monitoring
        why: 'Account health is a composite signal from usage, support, engagement, and commercial data. Without continuous aggregation, risks surface only when a renewal conversation forces a review.

          '
        agent: ca-health-agent
        contributing_agents:
        - agent: ca-adoption-agent
          provides: Adoption decline signals that affect health score
        - agent: ca-architecture-agent
          provides: Architecture risks that indicate health degradation
        activities:
        - Health score calculation from multi-source signals
        - Early warning detection for at-risk accounts
        - Renewal readiness assessment
        - Health trend analysis across account portfolio
        cadence: continuous, minimum monthly per account
      - domain: Support Intelligence
        why: 'Support signals contain early indicators of adoption friction, architecture gaps, and relationship risk. Without systematic triage, critical patterns are buried in ticket queues.

          '
        agent: ca-health-agent
        activities:
        - Support signal triage and severity classification
        - Repeat issue pattern detection
        - Support-health correlation analysis
        - Critical incident response coordination
        cadence: continuous, triggered by SIG_SUP_* signals
      - domain: Adoption Tracking and Value Delivery
        why: 'Adoption health without a baseline is a number without meaning. Systematic tracking against the success plan reveals blockers early and surfaces expansion opportunities from usage patterns.

          '
        agent: ca-adoption-agent
        contributing_agents:
        - agent: ca-csp-agent
          provides: Success plan baselines and milestone targets
        - agent: ca-journey-agent
          provides: Friction points that block adoption progress
        activities:
        - Adoption scoring against expected usage baselines
        - Blocker identification with root cause classification
        - Value delivery measurement against original business goals
        - Use case expansion discovery from usage patterns
        - QBR value content preparation
        cadence: monthly adoption review, quarterly value assessment
      - domain: Customer Architecture Monitoring
        why: 'Customer environments evolve through patches, integrations, and team changes. Without monitoring, architecture drifts from original design and integration risks compound silently.

          '
        agent: ca-architecture-agent
        contributing_agents:
        - agent: ca-health-agent
          provides: Support signals indicating architecture issues
        activities:
        - Architecture change detection from available evidence
        - Integration health tracking across customer-vendor touchpoints
        - Change impact assessment with affected systems
        - Design drift identification between customer and vendor
        cadence: continuous, triggered by change signals or quarterly review
      - domain: Customer Success Plan Lifecycle
        why: 'A CSP that goes stale between quarterly reviews is a document, not a plan. Continuous lifecycle management connects handoff quality to adoption outcomes to expansion readiness.

          '
        agent: ca-csp-agent
        contributing_agents:
        - agent: ca-adoption-agent
          provides: Adoption milestones and expansion opportunities
        - agent: ca-health-agent
          provides: Health signals for risk section updates
        activities:
        - CSP handoff validation from SA
        - Monthly value metric updates against goals
        - Milestone tracking with adoption data evidence
        - Quarterly comprehensive refresh
        - Risk section updates from current signals
        - Expansion planning when phase milestones complete
        cadence: handoff at deal close, monthly updates, quarterly refresh
      - domain: Customer Journey and Voice of Customer
        why: 'VoC collected but not acted on erodes trust faster than not collecting at all. Systematic collection, trend analysis, and closed-loop follow-up turn feedback into retention.

          '
        agent: ca-journey-agent
        contributing_agents:
        - agent: ca-health-agent
          provides: Health context for journey friction correlation
        - agent: ca-adoption-agent
          provides: Adoption data for journey phase mapping
        activities:
        - Journey mapping with touchpoints and sentiment per phase
        - Friction point identification from support and usage data
        - VoC signal collection from NPS, CSAT, and qualitative feedback
        - VoC trend analysis for sentiment shift detection
        - Closed-loop action on negative feedback
        - Product feedback aggregation for PM team
        cadence: continuous VoC collection, quarterly journey review
      - domain: Retrospectives and Institutional Knowledge
        why: 'Every implementation generates insights about what works and what fails. Without structured capture, pre-sales teams repeat the same mistakes because they never see feedback from downstream execution.

          '
        agent: retrospective-agent
        activities:
        - Lessons learned capture from engagements
        - Pattern extraction across similar implementations
        - Knowledge base linking to deal characteristics
        cadence: per-engagement completion, quarterly pattern review
  autonomy:
    role: near_pure_router
    description: 'Routes domain work to 6 sub-agents. Watches sub-agent and peer agent outputs for cross-domain triggers that require routing to other sub-agents or aggregation. Coordinates with SA Agent
      for technical continuity and AE Agent for commercial context.

      '
    triggers:
    - source: sa-agent
      condition: sa_handoff.type == deal_close
      action: Route to ca-csp-agent for CSP handoff validation
      context_received:
      - account_context
      - csp_document
      - architecture_decisions
    - source: ae-agent
      condition: ae_signal.type == renewal_approaching
      action: Route to ca-health-agent for renewal readiness assessment
      context_received:
      - account_context
      - renewal_timeline
      - commercial_context
    - source: support_system
      condition: signal.type in [SIG_SUP_001, SIG_SUP_002, SIG_SUP_003, SIG_SUP_004]
      action: Route to ca-health-agent for support intelligence triage
      context_received:
      - signal_payload
      - account_context
      - support_history
    - source: playbook_orchestrator
      condition: playbook.assigned_role == customer_architect
      action: Accept playbook task and route to appropriate sub-agent
      context_received:
      - playbook_id
      - task_context
      - deliverable_requirements
    reactive_routing:
    - watch: ca-health-agent
      true: health_score.trend == declining AND health_score.value < 60
      route_to: ca-adoption-agent
      context_forward:
      - account_id
      - health_assessment
      - declining_signals
      reason: Declining health triggers adoption reassessment to identify root cause
    - watch: ca-adoption-agent
      true: adoption.score < 40 AND blocker.unresolved_days > 30
      route_to: ca-csp-agent
      context_forward:
      - account_id
      - adoption_assessment
      - unresolved_blockers
      reason: Sustained low adoption triggers CSP risk update
    - watch: ca-architecture-agent
      true: change_impact.severity >= HIGH
      route_to: ca-health-agent
      context_forward:
      - account_id
      - architecture_change
      - affected_integrations
      reason: High-impact architecture change triggers health reassessment
    - watch: ca-journey-agent
      true: voc.sentiment == negative AND voc.source_role == executive_sponsor
      route_to: ca-health-agent
      context_forward:
      - account_id
      - voc_signal
      - stakeholder_context
      reason: Negative executive sentiment triggers immediate health review
    - watch: ca-csp-agent
      true: expansion.readiness == true
      route_to: ca-adoption-agent
      context_forward:
      - account_id
      - expansion_plan
      - current_milestones
      reason: Expansion readiness triggers adoption tracking for new use cases
  fallback_model: null
  prompt_registry: {}
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - NEVER invent customer architecture details
    - NEVER assume integration risks without evidence
    - NEVER create design mismatches
    - Quote exact architecture statements
    - Flag unclear architecture mentions for SA review
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not design customer architectures (handoff to SA/PM)
  - Does not make {vendor} architecture decisions (SA Agent's domain) (handoff to SA/PM)
  - Does not assess {vendor}-side technical risks (SA Agent's domain) (handoff to SA/PM)
  permissions:
  - Detect changes in customer architecture or design
  - Flag integration risks from customer-side changes
  - Track consistency between customer and {vendor} designs
  - Signal SA when architecture mismatches detected
  escalation_triggers:
  - Critical architecture change detection exceeding agent authority (to SA/PM)
  - Health score drops below critical threshold with no prior warning signals (to CA Manager)
  - Customer champion goes dark during active adoption phase (to AE Agent for relationship)
  - Support escalation pattern indicates systemic architecture gap (to SA Agent for design review)
  - Renewal risk detected 90+ days before contract end with no mitigation plan (to AE Agent + CA Manager)
  - CSP handoff from SA missing critical sections despite validation request (to SA Agent)
  - Negative VoC from executive sponsor with no prior sentiment decline signals (to AE Agent + CA Manager)
  - Adoption drops below 40% of baseline with blockers unresolved for 30+ days (to CA Manager)
  - Customer architecture change impacts vendor integration with no migration path (to SA Agent)
  - Product feedback indicates feature gap affecting multiple accounts (to PM Agent)
  - Design drift between customer expectations and vendor delivery exceeds tolerance (to SA Agent + AE Agent)
  handoffs:
    human_escalation: SA/PM
    defer_to:
      sa_agent:
        scope: Vendor-side architecture decisions, complex technical assessments
        scenarios:
        - trigger: Customer architecture change requires vendor-side design review
          context_passed: Architecture change details, affected integrations, impact assessment
          receiver_action: Architecture evaluation, design recommendation, risk mitigation
        - trigger: Design drift exceeds CA scope and requires solution redesign
          context_passed: Drift analysis, customer expectations, current vendor state
          receiver_action: Solution realignment, architecture decision, customer communication
      ae_agent:
        scope: Commercial decisions, renewal strategy, expansion positioning
        scenarios:
        - trigger: Health decline signals renewal risk requiring commercial response
          context_passed: Health assessment, risk factors, renewal timeline, relationship context
          receiver_action: Account strategy adjustment, customer engagement, commercial planning
        - trigger: Expansion opportunity identified from adoption data
          context_passed: Usage patterns, expansion evidence, readiness assessment, value metrics
          receiver_action: Commercial positioning, pricing, customer outreach
      pm_agent:
        scope: Product roadmap, feature gaps, product feedback
        scenarios:
        - trigger: Aggregated product feedback reaches threshold for PM attention
          context_passed: Feedback summary, frequency, affected accounts, priority ranking
          receiver_action: Backlog prioritization, roadmap consideration, feature feasibility
    provide_to:
      sa_agent:
        scope: Customer architecture context for pre-sales alignment
        scenarios:
        - trigger: Customer architecture state relevant to active pre-sales engagement
          context_passed: Architecture state, integration inventory, design patterns, known risks
          receiver_action: Pre-sales alignment, proposal accuracy, risk-aware solution design
      ae_agent:
        scope: Relationship risk signals, expansion signals, renewal readiness
        scenarios:
        - trigger: Health score drops below threshold or renewal readiness changes
          context_passed: Health assessment, contributing factors, recommended actions, timeline
          receiver_action: Account strategy adjustment, customer engagement planning
        - trigger: QBR content prepared with value evidence
          context_passed: QBR package, adoption metrics, value delivered, expansion opportunities
          receiver_action: QBR delivery, commercial positioning, renewal negotiation
      all_agents:
        scope: Customer health and adoption data via toolboxes
        scenarios:
        - trigger: Account health or adoption data requested by peer agent
          context_passed: Health score, adoption metrics, architecture state, VoC summary
          receiver_action: Domain-specific impact assessment within each agent's scope
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  - Negative VoC closed-loop actions involving executive stakeholders
  - CSP goal modifications that change success criteria
  - Health assessments recommending account escalation to leadership
  playbook_raci:
    context: 'Outside of agent-owned operations, the CA participates in cross-role scenarios orchestrated by playbooks. In these scenarios the CA provides customer health, adoption, and architecture
      context while other roles lead their domain. The CA''s sub-agents feed analysis into these playbooks but do not orchestrate them.

      '
    responsible:
    - playbook: Customer QBR (PB_CA_001)
      scope: QBR preparation, adoption evidence, value narrative, health summary
      team: customer_architects
      file: PB_CA_001_customer_qbr.yaml
    - playbook: Customer Health (PB_CA_007)
      scope: Health assessment, early warning, renewal readiness
      team: customer_architects
      file: PB_CA_007_customer_health.yaml
    - playbook: Adoption Metrics (PB_CA_008)
      scope: Adoption tracking, blocker analysis, baseline comparison
      team: customer_architects
      file: PB_CA_008_adoption_metrics.yaml
    - playbook: Solution Adoption Success (PB_CA_009)
      scope: Value delivery measurement, success story development
      team: customer_architects
      file: PB_CA_009_solution_adoption_success.yaml
    consulted:
    - playbook: ADR (PB_SA_001)
      scope: Customer architecture context for pre-sales architecture decisions
      team: solution_architects
    - playbook: Deal Retrospective (PB_AE_003)
      scope: Post-sales perspective on deal assumptions vs. delivery reality
      team: account_executives
    - playbook: Vendor Ecosystem Assessment (PB_VE_001)
      scope: Customer integration patterns and vendor ecosystem health
      team: vendor_ecosystem
    informed:
    - playbook: Strategic Account Plan (PB_STR_004)
      scope: Account health and adoption data for strategic planning
      team: strategy
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Architecture change detection
    - Integration risk identification
    - Design mismatch flagging
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - customer-health
      - adoption-tracking
      - architecture-monitoring
      - customer-success-planning
      - voice-of-customer
      - support-intelligence
      - journey-mapping
      - value-realization
      - expansion-planning
      - retrospective-analysis
      - customer-enablement
      - upgrade-lifecycle
      - technical-advocacy
      archetypes:
      - enterprise
      - mid-market
      - regulated-industries
    references:
    - path: references/health-scoring-framework.yaml
      description: Health score dimensions, signal weights, threshold definitions, trend detection
    - path: references/adoption-baseline-methodology.yaml
      description: Usage baseline calculation, adoption scoring, blocker classification taxonomy
    - path: references/csp-lifecycle.yaml
      description: CSP phases, handoff validation checklist, milestone tracking, refresh cadence
    - path: references/voc-collection-framework.yaml
      description: VoC signal sources, sentiment classification, closed-loop action templates
    - path: references/architecture-monitoring-patterns.yaml
      description: Change detection signals, integration health indicators, drift classification
    - path: references/qbr-preparation.yaml
      description: QBR content structure, evidence requirements, narrative templates
    - path: references/support-signal-taxonomy.yaml
      description: Signal types (SIG_SUP_001-004), severity classification, correlation rules
    - path: references/expansion-readiness-criteria.yaml
      description: Milestone completion gates, readiness assessment, expansion positioning
    - path: references/retrospective-methodology.yaml
      description: Lesson capture template, pattern extraction, knowledge linking
    - path: references/enablement-planning.yaml
      description: Customer enablement assessment, training needs analysis, knowledge transfer templates
    - path: references/upgrade-lifecycle.yaml
      description: Upgrade readiness assessment, migration planning, version lifecycle management
    - path: references/technical-advocacy-framework.yaml
      description: Internal advocacy workflow, feedback outcome tracking, product influence measurement
    - path: references/glossary-and-resources.md
      description: Glossary and resources
    - path: references/industry-best-practices.yaml
      description: Industry best practices audit (TSIA, Gainsight, ChurnZero, Totango, McKinsey, G2), gap analysis, quarterly refresh
    external_sources:
    - url: https://www.gainsight.com/blog/five-tenets-technical-account-management/
