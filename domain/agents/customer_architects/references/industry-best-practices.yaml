reference_id: REF_CA_BP_001
name: CA Industry Best Practices
description: >
  Industry best practices for AI-assisted Customer Architect / TAM operations,
  sourced from analyst firms, CS platforms, methodology frameworks, and TAM practices.
  Used to validate CA agent capabilities against market expectations.
version: 1.0.0
last_audited: 2026-03-21
audit_cadence: quarterly

sources:
  analyst_firms:
    - name: Gartner
      findings:
        - title: 91% of CS Leaders Under Executive Pressure to Implement AI
          relevance: AI implementation no longer optional, top priorities are CSAT, operational efficiency, self-service success
          gap: none
          status: already_aligned
          note: CA agent framework addresses this by providing AI-assisted intelligence across all CS domains
        - title: Agentic AI Will Autonomously Resolve 80% of Common Issues by 2029
          relevance: Routine health checks, adoption reports, QBR prep should be fully autonomous within 3 years
          gap: All sub-agents have human_in_the_loop true with no graduated trust tiers. No progressive autonomy maturity model
          priority: low

    - name: Forrester
      findings:
        - title: 30% of Enterprises Will Create Parallel AI Functions Mirroring Human Service Roles
          relevance: AI teams need operational monitoring, onboarding, and performance optimization
          gap: No operational monitoring of agent accuracy, false positive rate on health alerts, or self-assessment feedback loop
          priority: low
        - title: Foundational Data Work Matters More Than AI Transformation
          relevance: Data unification, quality, and accessibility are prerequisites for AI-first CS
          gap: none
          status: already_aligned
          note: CA agent's read-ca-data tool with error handling (SOURCE_UNAVAILABLE, STALE_DATA) and InfoHub centralization address this

    - name: TSIA
      findings:
        - title: CSMs Must Evolve Into Commercially Fluent Value Managers
          relevance: CS evaluated on CAC, cost-to-serve, CLV, and NRR, not just health scores. 7-point higher NRR for orgs with formal value realization
          gap: CA surfaces health and adoption signals but financial quantification (CLV, cost-to-serve, ROI narratives) belongs to VE Agent. CA gap is limited to not surfacing financial context alongside health signals for prioritization
          priority: medium
          note: Financial modeling is VE domain (REF_VE_BP_001). CA responsibility is signal surfacing and triage, not dollar quantification
        - title: 80% of Orgs Cannot Quantify Savings from CS Technology
          relevance: CS teams cannot justify tooling investment without operational self-measurement
          gap: No CS-team-level operational metrics (time saved, coverage ratio improvement, cost-per-account). No agent ROI self-measurement
          priority: medium

    - name: McKinsey
      findings:
        - title: Three Buckets of NRR (Retention, Pricing, Expansion) Need Clear Owners
          relevance: NRR above 110% correlates with value creation. Top performers succeed more by reducing gross churn than driving expansion
          gap: CA covers retention and expansion but has no pricing intelligence. Pricing friction not surfaced as retention signal
          priority: medium
        - title: Top Performers Drive Quick Time-to-Value with Measurable Onboarding Goals
          relevance: Time-to-value is the strongest predictor of long-term retention
          gap: No explicit TTV metric, onboarding velocity tracking, or days-to-first-value measurement
          priority: high

  cs_platforms:
    - name: Gainsight / Staircase AI
      findings:
        - title: Multi-Threaded Relationship Intelligence from Communication Channels
          relevance: Scans email, meetings, chat, Slack, ticketing to auto-map stakeholder relationships. Detects sentiment shifts 6 weeks earlier than usage data
          gap: No automated stakeholder intelligence, communication channel scanning, champion departure detection, or multi-threading score
          priority: high
        - title: DEAR Health Score Framework (Deployment, Engagement, Adoption, ROI)
          relevance: 4-6 dimensions with weighted scoring. Exec engagement 15% weight recommended
          gap: Health dimensions exist but no explicit weighting model, no exec engagement dimension, no response time tracking as health signal
          priority: medium

    - name: ChurnZero
      findings:
        - title: 14 Specialized AI Agents (Account Intelligence, Signal Detection, Workflow Assistance)
          relevance: Market view of what CS AI agents should cover. Account Intelligence (stakeholder tracking, competitive monitoring, buying signals) is a gap
          gap: No sub-agent dedicated to account intelligence, stakeholder dynamics, or competitive monitoring in post-sales context
          priority: high
        - title: Harbinger Agent Detects Relationship and Behavioral Shifts
          relevance: Champion departure, org restructuring, exec sponsor changes are leading indicators preceding health score changes
          gap: Health agent monitors usage and support signals but not relationship-level shifts
          priority: high
        - title: Beacon Agent Identifies Positive Intent and Buying Signals
          relevance: Proactive scanning for expansion signals like new department usage, capability inquiries, budget cycle timing
          gap: Expansion opportunities identified from usage patterns but no systematic buying signal detection
          priority: medium

    - name: Totango
      findings:
        - title: SuccessBlocs Pre-Built Automation Templates
          relevance: Auto-trigger based on lifecycle stages. 34% higher engagement through auto-triggered personalized sequences
          gap: Playbooks defined as workflows but not as trigger-action automation templates. No pre-built intervention patterns
          priority: medium
        - title: Post-Sale Revenue Intelligence (Forrester Wave Leader Q4 2025)
          relevance: AI identifies expansion timing, predicts renewal outcomes, quantifies revenue at risk in dollar terms
          gap: Health assessments produce qualitative ratings (RED/YELLOW/GREEN) without ARR weighting. $2M and $50K accounts at same health level treated equally
          priority: high

  cs_methodology:
    - name: G2 Expert Survey
      findings:
        - title: AI-Enhanced Health Scores Predict Churn 3-6 Months in Advance with 85%+ Accuracy
          relevance: ML models on historical churn data achieve best results. 80%+ prediction accuracy reduces involuntary churn by 23%
          gap: Health scoring is threshold-based (signal crosses line, alert fires) not predictive ML. No model training on historical data or probability-based risk
          priority: high
        - title: Automated Interventions Save 15-20 Hours Per CSM Per Week
          relevance: AI-triggered playbook execution, not just alerting, delivers measurable time savings
          gap: Agent produces assessments and alerts but does not auto-execute intervention sequences (schedule check-in, draft outreach, initiate enablement)
          priority: medium

    - name: EverAfter
      findings:
        - title: Health Scores Should Predict Both Churn AND Expansion
          relevance: Bidirectional scoring positions accounts on a churn-to-expansion spectrum, not just risk
          gap: Health focuses on risk (early warning, renewal readiness). Expansion handled separately by Adoption and CSP agents. No unified churn-to-expansion spectrum score
          priority: medium

  tam_practices:
    - name: Red Hat / Google Cloud
      findings:
        - title: Five TAM Tenets (Advocacy, Proactive Guidance, Risk Mitigation, Strategic Alignment, Operational Efficiency)
          relevance: Formal customer advocacy workflows and operational efficiency measurement are standard TAM tenets
          gap: Advocacy limited to VoC/product feedback. No formal workflow for representing customer priorities inside vendor. Missing operational health monitoring (uptime, latency, error rates from customer perspective)
          priority: medium

  emerging_patterns:
    - name: Real-Time Sentiment Analysis
      findings:
        - title: Continuous Sentiment Across Communication Channels
          relevance: Continuous pulse on customer mood without waiting for formal surveys. Leading indicator of health changes
          gap: VoC is structured (surveys, meetings). No continuous sentiment analysis across email, chat, Slack, support
          priority: medium

    - name: Predictive Lifetime Value
      findings:
        - title: CLV Modeling for Account Prioritization
          relevance: Predict customer lifetime value from usage patterns, engagement depth, expansion trajectory. Used for CSM time allocation
          gap: Account prioritization implicit (health score, renewal proximity) rather than value-weighted
          priority: medium

gap_summary:
  high:
    - Stakeholder intelligence and champion tracking (Gainsight/Staircase AI, ChurnZero)
    - Predictive ML-based health scoring, 85%+ accuracy 3-6 months ahead (G2, EverAfter, Gainsight)
    - Revenue-weighted risk and opportunity scoring with ARR context for triage prioritization (Totango, McKinsey, TSIA)
    - Time-to-value tracking as retention predictor (McKinsey)

  medium:
    - Executive engagement as health dimension with response time tracking (Gainsight DEAR)
    - Buying signal detection for expansion timing (ChurnZero Beacon)
    - Auto-triggered intervention sequences from health alerts (G2, Totango SuccessBlocs)
    - Pricing friction as retention signal (McKinsey NRR framework)
    - Real-time sentiment analysis across communication channels (Gainsight/Staircase AI)
    - Customer advocacy workflows beyond VoC routing (Red Hat TAM tenets)
    - Operational health monitoring, customer-side runtime metrics (Red Hat Dedicated Ops TAM)
    - CS technology ROI self-measurement (TSIA)
    - Unified churn-to-expansion spectrum score (EverAfter)
    - CLV modeling for value-weighted account prioritization (Practical CSM)

  low:
    - Progressive autonomy maturity model for graduated trust tiers (Gartner)
    - Segmented service delivery for SMB/mid-market (ChurnZero, Gainsight)
    - Customer-facing agent capability (Digital CSM trend)
    - Leading vs lagging indicator taxonomy formalization (EverAfter)
    - Customer-facing content generation (Practical CSM)
