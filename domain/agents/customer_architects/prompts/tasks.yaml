      QUALITY CHECKS BEFORE OUTPUT:
      1. All VoC sources are reviewed, none excluded
      2. Deduplication groups genuinely related items, not artificially inflates counts
      3. Priority assessment uses customer impact, not CA opinion
      4. Competitive gaps include specific competitor names where available
      5. PM package includes business context, not just technical requests
      6. Customer quotes are verbatim where available, flagged as paraphrased otherwise

      Produce all 7 deliverables. Lead with a 2-sentence summary stating the total
