      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: PARSE AND CONTEXTUALIZE THE SIGNAL
      Extract the key facts from {signal_payload}: what happened, when, which systems
      or features are affected, how many users are impacted, and what the customer has
      already tried. Cross-reference against the account's current health score and
      adoption status to understand the signal in context.
      Deliverable: Signal Context (What | When | Systems Affected | Users Impacted | Customer Actions Taken | Account Context).

      STEP 3: CLASSIFY THE SIGNAL
      Classify the signal into exactly one primary category:
      - ADOPTION_ISSUE: signal indicates users are struggling to use the solution effectively
      - ARCHITECTURE_GAP: signal reveals an integration, configuration, or infrastructure problem
      - RELATIONSHIP_RISK: signal suggests customer frustration, escalation, or trust erosion
      - EXPANSION_SIGNAL: signal indicates growing usage, new use case interest, or positive momentum
      Assign confidence level: HIGH (clear evidence), MEDIUM (probable), LOW (ambiguous).
      Deliverable: Signal Classification (Category | Confidence | Classification Evidence | Alternative Category if Ambiguous).

      STEP 4: ASSESS IMPACT ON ACCOUNT HEALTH
      Determine how this signal affects the overall account health score. Evaluate impact
      across dimensions: technical health, adoption health, and relationship health.
      Recommend a health score adjustment (increase, decrease, or maintain) with magnitude
      and justification.
      Deliverable: Health Impact Assessment (Dimension | Current Score | Impact | Recommended Adjustment | Justification).

      STEP 5: DEFINE REQUIRED ACTIONS
      Based on the classification and impact, define the required actions. Each action must
      have: a specific description, an owner (CA, support team, SA, AE, or customer), urgency
      (immediate/this week/next review), and the expected outcome.
      Deliverable: Action Plan (Action | Owner | Urgency | Expected Outcome | Dependency).

      STEP 6: DETERMINE ESCALATION AND DOCUMENTATION
      Assess whether this signal requires escalation: to AE (commercial impact), to SA
      (architecture complexity), to management (resource needs), or to customer executive
      (relationship repair). Determine what risk register and CSP updates are needed.
      Deliverable: Escalation Decision (Escalation Needed Y/N | Target | Rationale | Risk Register Update | CSP Update).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Signal is classified into exactly one category with confidence level
      2. Impact assessment covers all three health dimensions
      3. Health score adjustment has specific magnitude and evidence-based justification
      4. Every action has a named owner and urgency level, not "TBD"
      5. Escalation decision includes the rationale, not just yes/no
      6. Documentation updates specify exact sections of risk register and CSP

      Produce all 7 deliverables. Lead with a 2-sentence summary stating the signal
      classification, impact level, and the most urgent required action.

  quarterly_support_review:
    name: "Quarterly Support Review for QBR"
    description: "Analyze quarterly support patterns for QBR preparation"
    playbooks:
      - "PB_CA_001"  # Customer-facing QBR
    skills:
      - "SK_CA_001"  # Support Intelligence Triage
    prompt: |
      You are preparing the quarterly support review for {account_name} QBR.
      Period: {quarter}. Support pattern data: {support_pattern_data}.
      Prior quarter comparison: {prior_quarter}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.

      This runbook analyzes quarterly support patterns, identifies trends, and produces
      QBR-ready content that demonstrates support health and improvement trajectory.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: ANALYZE TICKET VOLUME TRENDS
      Compare ticket volume for {quarter} against {prior_quarter}: total tickets,
      tickets by severity, tickets by category, and tickets per user. Calculate the
      change percentage for each dimension. Identify spikes or anomalies with their causes.
      Deliverable: Volume Trend (Dimension | Prior Quarter | This Quarter | Change % | Spike/Anomaly | Cause).

      STEP 3: IDENTIFY TOP ISSUE CATEGORIES
      Rank the top 3-5 issue categories by volume and impact. For each, determine the
      root cause: product issue, user knowledge gap, configuration drift, or integration
      instability. Assess whether each category is improving, stable, or worsening.
      Deliverable: Top Issues (Category | Volume | Root Cause | Trend | Resolution Rate % | Customer Impact).

      STEP 4: ANALYZE REPEAT ISSUE PATTERNS
      Identify issues that recur: same type of ticket from the same user/team, or the
      same issue reported by different users. Calculate the repeat issue rate (repeat
      tickets / total tickets). Determine whether permanent fixes are available or in progress.
      Deliverable: Repeat Issue Analysis (Issue | Occurrences | Affected Users | Fix Available Y/N | Fix Status | Cost of Inaction).

      STEP 5: ASSESS CSAT AND RESOLUTION METRICS
      Compile support CSAT scores for the quarter. Analyze resolution time by severity
      level and compare against SLAs. Identify any SLA breaches and their causes.
      Deliverable: Support Metrics (Metric | This Quarter | Prior Quarter | SLA Target | Met Y/N | Notable Events).

      STEP 6: COMPILE NOTABLE INCIDENTS
      Document significant support incidents from the quarter: severity, duration,
      customer impact, root cause, resolution, and preventive measures taken. Include
      the customer's experience during the incident.
      Deliverable: Incident Log (Incident | Date | Severity | Duration | Root Cause | Resolution | Prevention Implemented).

      STEP 7: PREPARE QBR DISCUSSION CONTENT
      Structure the findings into QBR-ready content. Lead with support health status
      (GREEN/YELLOW/RED). Highlight improvements made since the last review. Prepare
      honest discussion of areas needing improvement. Include recommendations for the
      customer (training, process changes) and commitments from {vendor}.
      Deliverable: QBR Content (Health Status | Improvements | Areas for Discussion | Customer Recommendations | {vendor} Commitments | Actions Since Last Review).

      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. All comparisons use specific numbers with change percentages
      2. Root causes are specific technical or process findings, not generic categories
      3. Repeat issue rate is calculated precisely (formula shown)
      4. CSAT scores are compared against both prior quarter and SLA targets
      5. Notable incidents include the customer experience perspective
      6. QBR content is balanced: honest about issues, clear about improvements
      7. Actions since last review are documented to show accountability

      Produce all 8 deliverables. Lead with a 2-sentence summary stating the support
      health status and the most significant trend (positive or negative).

  support_health_assessment:
    name: "Support Health Impact Assessment"
    description: "Assess how support health affects overall account health"
    skills:
      - "SK_CA_001"  # Support Intelligence Triage
    prompt: |
      You are assessing how support health impacts overall account health for {account_name}.
      Support signals: {recent_signals}. Current health score: {health_score}.
      Engagement track: {engagement_track}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.

      This runbook evaluates support health as a component of overall account health,
      identifies patterns indicating deeper issues, and recommends interventions.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: ASSESS SUPPORT HEALTH DIMENSIONS
      Evaluate support health across five dimensions: ticket volume trend (normalized per
      user), resolution speed (vs SLA), first-contact resolution rate, severity distribution
      shift, and customer satisfaction with support. Score each dimension 1-5 with supporting
      data.
      Deliverable: Support Health Scorecard (Dimension | Score 1-5 | Data Point | Benchmark | Trend).

      STEP 3: CALCULATE SUPPORT HEALTH STATUS
      From Step 2 scores, determine overall support health:
      - GREEN: all dimensions 3.5+, no declining trends
      - YELLOW: any dimension below 3.5 or declining, but no critical patterns
      - RED: any dimension below 2.0 or multiple declining, or critical escalation pattern
      Deliverable: Support Health Status with score, justification, and comparison to prior assessment.

      STEP 4: IDENTIFY DEEPER PATTERNS
      Analyze whether support patterns indicate issues beyond support itself:
      - Increasing how-to tickets → training/adoption gap
      - Recurring integration failures → architecture instability
      - Escalation language in tickets → relationship risk
      - Tickets from new users/teams → expansion signal
      - Declining ticket volume with declining usage → disengagement risk
      Deliverable: Pattern Analysis (Pattern | Evidence | Underlying Issue | Confidence | Account Health Dimension Affected).

      STEP 5: RECOMMEND HEALTH SCORE ADJUSTMENT
      Based on Steps 2-4, recommend whether the overall account health score should be
      adjusted based on support health. Provide the specific adjustment (e.g., reduce
      technical health by 0.5 points) with detailed justification.
      Deliverable: Health Score Recommendation (Current Score | Recommended Change | New Score | Justification | Review Date).

      STEP 6: DEFINE INTERVENTIONS
      For each pattern identified in Step 4, define an intervention: what to do, who
      owns it, timeline, and what success looks like. Determine whether any patterns
      require escalation to AE, SA, or management.
      Deliverable: Intervention Plan (Pattern | Intervention | Owner | Timeline | Success Metric | Escalation Needed Y/N).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every dimension score has quantitative support, not subjective judgment
      2. Health status follows the defined criteria precisely
      3. Patterns are evidence-based with specific ticket data references
      4. Health score adjustment recommendation includes specific magnitude
      5. Interventions address root causes, not symptoms
      6. Escalation recommendations include specific rationale and target

      Produce all 7 deliverables. Lead with a 2-sentence summary stating the support
      health status and its most significant impact on overall account health.
