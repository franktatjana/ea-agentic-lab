# VALUE REALIZATION PROMPTS
# ============================================================================
value_realization:

  value_delivered:
    name: "Value Delivered Assessment"
    description: "Assess value delivered to customer"
    prompt: |
      You are assessing value delivered to {account_name} using {vendor} for {use_cases}.
      Deployment duration: {deployment_duration}. Original goals: {original_goals}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook produces a structured value assessment that maps original goals to
      outcomes, quantifies realized value, and identifies unrealized value still available.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: RECONSTRUCT ORIGINAL VALUE PROPOSITION
      Extract the original business goals, success criteria, and expected outcomes from
      the pre-sales documentation and CSP. For each goal, capture the original target
      metric and timeline commitment.
      Deliverable: Original Goals table (Goal | Success Metric | Target Value | Target Date | Stakeholder).

      STEP 2: MEASURE CURRENT OUTCOMES
      For each goal from Step 1, determine the current measured outcome. Where direct
      measurement is available, use exact data. Where estimation is required, document the
      estimation method and assign confidence: HIGH (measured data), MEDIUM (calculated
      estimate), LOW (benchmark comparison). Assign secondary flags where the signal spans
      multiple dimensions (e.g., confidence may be primarily HIGH for one metric but flagged
      MEDIUM for the business impact translation).
      Deliverable: Outcome Measurement (Goal | Target | Actual | Method | Confidence | Secondary Flags | Delta %).

      STEP 4: QUANTIFY BUSINESS VALUE
      Translate outcomes from Step 2 into business value: cost savings (hours saved x rate,
      tool consolidation), efficiency gains (process time reduction, throughput increase),
      risk reduction (incidents avoided, compliance gaps closed), and revenue impact
      (faster time-to-market, new capability enabled).
      Deliverable: Value Quantification (Value Category | Metric | Before | After | Annual Impact | Confidence).

      STEP 5: DOCUMENT QUALITATIVE IMPROVEMENTS
      Capture value that resists quantification: team satisfaction, process standardization,
      visibility improvements, decision quality, and strategic positioning. For each, gather
      supporting evidence: stakeholder quotes, survey results, or observable behavior changes.
      Deliverable: Qualitative Value (Improvement | Evidence | Stakeholder Quote | Impact Area).

      STEP 6: IDENTIFY UNREALIZED VALUE
      Compare the full value potential against what has been realized. Identify goals not yet
      met, capabilities not yet leveraged, and value the customer does not yet recognize.
      For each unrealized item, specify what action would unlock it.
      Deliverable: Unrealized Value (Opportunity | Blocker | Action to Unlock | Prerequisites | Potential Value | Timeline).

      STEP 7: DRAFT VALUE NARRATIVE
      Compose a customer-facing value narrative (8-12 sentences) that tells the story:
      the challenge before {vendor}, the solution implemented, the results achieved, and
      the path forward. This narrative should be suitable for QBR presentation or executive
      stakeholder communication.
      Deliverable: Value Narrative draft with before/after structure and embedded metrics.

      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every goal from Step 2 has a corresponding outcome in Step 3, none skipped
      2. All quantified values include confidence levels with secondary flags where applicable
      3. Cost savings calculations show the formula (units x rate x period)
      4. Qualitative improvements have supporting evidence, not just claims
      5. Value narrative uses specific numbers, not "significant improvement"
      6. Unrealized value items have specific unlock actions with prerequisites, not "explore further"
      7. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 8 deliverables. Lead with a 3-sentence executive summary stating total
      quantified value, the weakest point / lowest confidence area, and the single most
      urgent action to unlock unrealized value.

