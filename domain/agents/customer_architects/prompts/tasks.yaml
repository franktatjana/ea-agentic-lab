# ============================================================================
# CUSTOMER HEALTH PROMPTS
# ============================================================================
customer_health:

  health_assessment:
    name: "Customer Health Assessment"
    description: "Comprehensive customer health review"
    prompt: |
      You are conducting a comprehensive health assessment for {account_name}.
      Available signals: {available_signals}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook produces a multi-dimensional health assessment covering technical,
      adoption, and relationship health to identify risks and drive proactive interventions.

      STEP 0: INPUT GATE AND DATA AVAILABILITY INVENTORY
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Before scoring anything, explicitly catalog what data is available and what is missing
      for each health dimension. For each dimension (Technical, Adoption, Relationship),
      determine data richness: HIGH (telemetry, dashboards, or 5+ data points), MEDIUM
      (partial data, 2-4 data points from meetings or reports), LOW (no direct data,
      relying on stakeholder comments or assumptions). List the specific sources available.
      This step ensures the consumer of the output knows where the assessment is grounded
      versus where it is extrapolating.
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness HIGH/MEDIUM/LOW | Sources Available | Data Gaps | Extrapolation Risk) + Run Mode declaration.

      ZERO-SIGNAL PIVOT: If 2 or more dimensions score LOW richness, STOP the assessment.
      Do not score health on insufficient data. Instead, switch to SIGNAL ACQUISITION MODE
      and produce the following deliverables instead of Steps 1-6:

      ACQUISITION STEP A: QUESTIONS TO ASK
      For each LOW-richness dimension, list the 3-5 specific questions to ask in the next
      2-3 customer interactions. Questions should target the highest-leverage data gaps:
      the facts that, once known, would most change the health picture. Sequence by
      conversation type (executive check-in, technical review, operational sync).
      Deliverable: Question Plan (Dimension | Question | Target Persona | Conversation Type | Data Gap Filled).

      ACQUISITION STEP B: DATA SOURCES TO REQUEST
      Identify the systems, dashboards, reports, or access rights needed to fill gaps.
      For each, specify: what to request, who to request it from, how to frame the ask
      (value to the customer, not just our need), and the expected turnaround time.
      Deliverable: Data Source Requests (Dimension | Source/System | Request To | Framing | Turnaround Days).

      ACQUISITION STEP C: OBSERVATION CHECKLIST
      Define what to observe and capture in the next 2-3 interactions without explicitly
      asking: response speed patterns, meeting attendance patterns, enthusiasm vs.
      obligation signals, unsolicited mentions of competitors or alternatives, body
      language on expansion topics.
      Deliverable: Observation Checklist (Interaction Type | What to Observe | Indicator Of | How to Record).

      ACQUISITION STEP D: FIRST-REAL-RUN TARGET
      Define the minimum data threshold needed before the next health assessment will
      produce reliable scores. Set a target date for re-running this prompt with
      sufficient signal. List the specific data points that must be collected by then.
      Deliverable: Re-assessment Gate (Dimension | Minimum Data Required | Collection Method | Target Date | Owner).

      If in Signal Acquisition Mode, produce Acquisition Steps A-D and end with a
      1-sentence summary: "Health assessment deferred due to insufficient signal in
      {dimensions}. Signal acquisition plan targets re-assessment by {date}."
      Do not proceed to Steps 1-6.

      If 2+ dimensions score MEDIUM or HIGH, proceed with the full assessment below.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: ASSESS TECHNICAL HEALTH
      Evaluate the technical dimension: system uptime/availability, integration error rates,
      performance metrics (response times, throughput), open support tickets by severity,
      and architecture risk exposure. Score each factor on a 1-5 scale with supporting data.
      For factors where data richness is LOW (from Step 0), note "estimated" next to the score
      and explain the basis for the estimate.
      Deliverable: Technical Health Scorecard (Factor | Score 1-5 | Evidence | Data Richness | Trend | Risk Flag).

      STEP 3: ASSESS ADOPTION HEALTH
      Evaluate the adoption dimension: active user ratio (active/licensed), feature
      utilization breadth, usage frequency trends, new user onboarding rate, and use case
      depth (how many use cases are in production vs planned). For factors where data richness
      is LOW (from Step 0), note "estimated" and the basis.
      Deliverable: Adoption Health Scorecard (Factor | Score 1-5 | Evidence | Data Richness | Trend | Risk Flag).

      STEP 4: ASSESS RELATIONSHIP HEALTH
      Evaluate the relationship dimension in two layers:

      Layer A, Observable Indicators: meeting attendance frequency, response times to
      outreach, stakeholder count engaged, NPS/CSAT scores if available, meeting content
      quality (agenda-driven vs. status-only). Score each on 1-5 with specific data.

      Layer B, Interpretive Assessments: champion strength (active/passive/lost), executive
      sponsor commitment level, competitive positioning mentions, political dynamics.
      For each interpretive assessment, assign a confidence level: HIGH (based on 6+ months
      of interaction history or 5+ data points), MEDIUM (based on 2-4 data points),
      LOW (based on 1-2 data points or indirect evidence). A "passive champion" classification
      based on two data points is very different from one based on six months of history,
      and this distinction must be visible.

      Deliverable: Relationship Health Scorecard with two sub-tables:
      - Observable Indicators (Factor | Score 1-5 | Evidence | Data Points | Trend)
      - Interpretive Assessments (Assessment | Classification | Confidence HIGH/MEDIUM/LOW | Evidence Count | Basis | Risk Flag).

      STEP 5: IDENTIFY RISK INDICATORS
      From all three scorecards, extract items scored 1-2 or trending downward. Classify each
      risk as: IMMEDIATE (action needed within 2 weeks), EMERGING (action needed within 60 days),
      or WATCH (monitor at next review). Assign secondary flags where the signal spans
      multiple dimensions (e.g., a risk may be primarily IMMEDIATE for technical impact
      but flagged EMERGING for relationship impact). For each risk, assess commercial
      impact using a three-value field:
      - RENEWAL: risk directly threatens renewal likelihood
      - EXPANSION: risk doesn't threaten renewal but blocks upsell/cross-sell potential
      - NEITHER: operational risk without direct commercial impact
      Deliverable: Risk Indicators (Risk | Dimension | Severity | Secondary Flags | Timeline | Commercial Impact: Renewal/Expansion/Neither | Confidence).

      STEP 6: CALCULATE OVERALL HEALTH SCORE
      Compute overall health as GREEN / YELLOW / RED:
      - GREEN: all dimensions average 3.5+ and no IMMEDIATE risks
      - YELLOW: any dimension below 3.5 or 1+ IMMEDIATE risk with mitigation in progress
      - RED: any dimension below 2.5 or 2+ IMMEDIATE risks without mitigation
      Assign secondary flags where the signal spans multiple dimensions (e.g., overall
      health may be YELLOW but flagged RED for a specific dimension or user segment).
      Note where the score is heavily influenced by LOW-richness data (from Step 0) and
      flag if the overall assessment confidence is reduced.
      Deliverable: Overall Health Score with dimension breakdown, secondary flags, data confidence caveat, and written justification.

      STEP 7: BUILD ACTION PLAN
      For each risk from Step 5, define a specific intervention: what to do, who owns it,
      deadline, expected impact on health score, and prerequisites or dependencies.
      The prerequisites column forces honesty about what is actionable immediately versus
      what requires escalation or cross-functional buy-in (e.g., "requires VP-level meeting"
      or "depends on product team fix in next release").
      Prioritize actions that affect renewal or expansion.
      Deliverable: Health Action Plan (Risk | Action | Owner | Deadline | Prerequisites/Dependencies | Expected Impact | Commercial Relevance: Renewal/Expansion/Neither).

      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Data Availability Map completed first, with every dimension assessed for richness
      2. If 2+ dimensions are LOW, Signal Acquisition Mode was used and Steps 2-7 were NOT produced
      3. In Signal Acquisition Mode: questions target highest-leverage gaps, not generic discovery
      4. In Signal Acquisition Mode: data source requests are framed as value to customer, not our need
      5. In Signal Acquisition Mode: re-assessment gate has a specific date and minimum data threshold
      6. In Assessment Mode: every score has quantitative evidence, not subjective judgment
      7. Scores based on LOW-richness data are marked "estimated" with basis explained
      8. Relationship health separates observable facts from interpretive assessments
      9. Interpretive assessments include confidence levels tied to evidence count
      10. Risk timelines use specific day/week ranges, not "soon"
      11. Commercial impact uses the three-value scale (Renewal/Expansion/Neither), not binary
      12. Actions include prerequisites/dependencies, distinguishing immediate from escalation-dependent

      OUTPUT MODES:
      - Signal Acquisition Mode (2+ LOW dimensions): Produce Step 0 + Acquisition Steps A-D.
        Lead with: "Health assessment deferred due to insufficient signal in {dimensions}.
        Signal acquisition plan targets re-assessment by {date}."
      - Full Assessment Mode (2+ MEDIUM/HIGH dimensions): Produce all 9 deliverables (Steps 0-8).
        Lead with a 3-sentence executive summary stating the overall health score (with
        secondary flags), the weakest point / lowest confidence area, and the single most
        urgent action.
      13. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

  early_warning:
    name: "Early Warning Detection"
    description: "Identify early warning signs of trouble"
    prompt: |
      You are scanning for early warning signs at {account_name}.
      Recent signals: {recent_signals}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook identifies subtle indicators that account health may be deteriorating
      before they escalate into visible risks, enabling proactive intervention.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: CATALOG RECENT SIGNALS
      List every signal received in the review period: usage changes, support interactions,
      stakeholder communications, meeting outcomes, NPS/CSAT responses, and competitive
      intelligence. Classify each as POSITIVE, NEGATIVE, NEUTRAL, or AMBIGUOUS.
      Deliverable: Signal Catalog (Date | Signal | Source | Classification | Strength: Strong/Weak).

      STEP 3: IDENTIFY WARNING PATTERNS
      From NEGATIVE and AMBIGUOUS signals in Step 2, identify warning patterns:
      - ENGAGEMENT DECLINE: fewer meetings, slower responses, lower attendance
      - USAGE DROP: declining logins, reduced feature utilization, lower data volume
      - CHAMPION RISK: champion role change, reduced advocacy, new competing priorities
      - ESCALATION PATTERN: increasing support severity, executive complaints
      - COMPETITIVE SIGNAL: competitor mentions, RFP language, vendor evaluation activity
      - ORGANIZATIONAL CHANGE: restructuring, leadership turnover, budget pressure
      Deliverable: Warning Patterns (Pattern | Signals Supporting | Confidence | Potential Impact).

      STEP 4: ASSESS SEVERITY AND TIMELINE
      For each warning pattern from Step 3, estimate: how far along is the deterioration
      (EARLY, MID, ADVANCED), how many weeks until it becomes a visible risk, and what the
      likely consequence is (reduced usage, churn risk, downsell, expansion block).
      Assign secondary flags where the signal spans multiple dimensions (e.g., a warning
      may be primarily EARLY for usage decline but flagged MID for relationship impact).
      Deliverable: Severity Assessment (Pattern | Stage | Secondary Flags | Weeks to Risk | Likely Consequence).

      STEP 5: DETERMINE INVESTIGATION ACTIONS
      For each warning pattern, specify what additional information is needed to confirm or
      dismiss the concern. Define who to talk to, what data to pull, and what questions to ask.
      Deliverable: Investigation Plan (Pattern | Data Needed | Who to Contact | Questions to Ask | Deadline).

      STEP 6: BUILD PREVENTIVE ACTION PLAN
      For confirmed or high-confidence warnings, define preventive actions that can be taken
      now, before the risk materializes. Each action should aim to reverse the trajectory.
      Deliverable: Preventive Actions (Warning | Action | Owner | Deadline | Prerequisites | Success Indicator | Stakeholder Alert Needed Y/N).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every warning pattern is supported by at least 2 signals, not a single data point
      2. Confidence levels distinguish between confirmed patterns and tentative observations
      3. Timeline estimates use specific week counts, not "soon" or "eventually"
      4. Investigation actions specify exact questions, not "check in with customer"
      5. Preventive actions target the root cause with prerequisites specified, not the symptom
      6. Ambiguous signals are investigated, not ignored or over-interpreted
      7. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 7 deliverables. Lead with a 2-sentence summary stating the most
      concerning warning pattern (with secondary flags), the weakest point / lowest
      confidence area, and the single most urgent preventive action.

  renewal_readiness:
    name: "Renewal Readiness Assessment"
    description: "Assess readiness for upcoming renewal"
    prompt: |
      You are assessing renewal readiness for {account_name} with renewal in
      {months_until_renewal} months. Current ARR: {arr}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook produces a renewal readiness assessment that evaluates the value story,
      identifies risks to renewal, and builds a pre-renewal action plan.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: BUILD THE VALUE STORY
      Compile the quantified value delivered since last renewal or initial purchase. For each
      value area, document: the metric, the improvement achieved, the business impact, and
      the confidence level. Calculate total quantified ROI where data supports it.
      Deliverable: Value Story (Value Area | Metric | Improvement | Business Impact | Confidence | ROI Contribution).

      STEP 3: ASSESS RENEWAL RISK FACTORS
      Evaluate each risk dimension: champion stability (still in role and engaged?), executive
      sponsor sentiment, competitive threats (active evaluation?), budget pressure signals,
      usage trends (growing or declining?), unresolved issues or complaints, and contract
      terms satisfaction.
      Deliverable: Risk Assessment (Risk Factor | Status | Evidence | Impact on Renewal | Mitigation Available).

      STEP 4: EVALUATE STAKEHOLDER ALIGNMENT
      Map all stakeholders involved in the renewal decision. For each, assess: their
      sentiment toward {vendor} (advocate/neutral/detractor), their influence on the decision
      (high/medium/low), and the last meaningful engagement date. Flag stakeholders not
      engaged in the last 60 days.
      Deliverable: Stakeholder Alignment (Name | Role | Sentiment | Influence | Last Engaged | Gap Flag).

      STEP 5: IDENTIFY EXPANSION OPPORTUNITY
      Assess whether the renewal is an opportunity to expand: new use cases validated during
      the current term, additional users or departments expressing interest, product
      capabilities the customer has not yet adopted, and upsell/cross-sell potential.
      Estimate expansion ARR with confidence level.
      Deliverable: Expansion Assessment (Opportunity | ARR Potential | Confidence | Champion | Prerequisite).

      STEP 6: CALCULATE RENEWAL CONFIDENCE
      Score renewal confidence as HIGH / MEDIUM / LOW:
      - HIGH: strong value story, champion engaged, no competitive threat, usage growing
      - MEDIUM: adequate value but gaps exist, or 1 risk factor unmitigated
      - LOW: weak value story, champion risk, competitive threat active, or usage declining
      Assign secondary flags where the signal spans multiple dimensions (e.g., confidence
      may be primarily MEDIUM overall but flagged LOW for champion stability or competitive threat).
      Deliverable: Renewal Confidence with score, secondary flags, justification, and comparison to last renewal.

      STEP 7: BUILD PRE-RENEWAL ACTION PLAN
      Define the actions required before renewal date. Sequence by priority: risk mitigations
      first, then value reinforcement, then expansion conversations. Include AE handoff
      timing for commercial negotiation.
      Deliverable: Pre-Renewal Plan (Sequence | Action | Owner | Deadline | Prerequisites | Dependency | AE Handoff Trigger).

      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Value story includes specific metrics, not "customer is happy"
      2. Every risk factor has evidence, not assumption
      3. Stakeholder map includes all decision-makers, not just the champion
      4. Expansion ARR estimates have confidence levels
      5. Renewal confidence justification references specific evidence from Steps 2-5
      6. Pre-renewal plan accounts for the time remaining ({months_until_renewal} months)
      7. AE handoff timing is specific, not "when ready"

      Produce all 8 deliverables. Lead with a 3-sentence executive summary stating renewal
      confidence, the strongest value point, and the most critical risk to mitigate.

# ============================================================================
# CUSTOMER SUCCESS PLAN PROMPTS (Post-Sales)
# Based on industry SA best practices
# ============================================================================
customer_success_plan:

  accept_csp_handoff:
    name: "Accept CSP Handoff from SA"
    description: "Receive and validate CSP handoff at deal close"
    prompt: |
      You are accepting a Customer Success Plan (CSP) handoff for {account_name} from
      SA {sa_name} at deal close. CSP document: {csp_link}. Handoff notes: {handoff_notes}.
      Account state: {account_state}.

      This runbook validates the CSP completeness, identifies gaps requiring SA follow-up,
      and produces a 30-day engagement plan for the post-sales transition.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: VALIDATE CSP COMPLETENESS
      Review every section of the CSP against the standard template. For each section, mark
      as COMPLETE (all fields populated with specific data), PARTIAL (populated but missing
      details), or MISSING (section empty or absent). Flag any section where the content
      is generic rather than account-specific.
      Deliverable: Completeness Checklist (Section | Status | Missing Details | Generic Content Flag).

      STEP 2: VERIFY BUSINESS OUTCOMES
      Extract all stated business outcomes and success criteria from the CSP. For each,
      verify: is the metric measurable? Is the target specific? Is the timeline realistic
      given deployment scope? Flag outcomes that are vague ("improve efficiency") or lack
      a baseline measurement.
      Deliverable: Outcome Validation (Outcome | Metric | Target | Baseline | Timeline | Validation Status).

      STEP 3: REVIEW STAKEHOLDER CONTEXT
      Extract the stakeholder map from the CSP. Verify for each stakeholder: role, influence
      level, sentiment at close, preferred communication channel, and meeting cadence
      expectation. Identify gaps: key roles not represented, single-threaded risk, or
      stakeholders the SA flagged as requiring special attention.
      Deliverable: Stakeholder Review (Name | Role | Influence | Sentiment | Communication Pref | Gap Flag).

      STEP 4: IDENTIFY OPEN ITEMS AND OWNERSHIP
      List every open item, pending decision, and known risk from the handoff notes and CSP.
      Assign ownership: items the CA now owns, items requiring SA follow-up, items the
      customer owns, and items requiring support team involvement.
      Deliverable: Open Items Register (Item | Source | Owner | Deadline | Dependency | Priority).

      STEP 5: PREPARE SA FOLLOW-UP QUESTIONS
      Compile questions for the SA based on gaps found in Steps 1-4: missing context,
      ambiguous commitments, stakeholder dynamics not documented, and technical details
      needed for onboarding.
      Deliverable: SA Questions list (Question | Related Section | Priority | Context Needed).

      STEP 6: BUILD FIRST 30-DAY PLAN
      Create a day-by-day engagement plan for the first 30 days: customer introduction
      meetings, stakeholder 1:1s, technical validation of integrations, first value
      check-in, and open item resolution milestones.
      Deliverable: 30-Day Plan (Week | Activity | Participants | Objective | Deliverable | Dependencies).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every CSP section is assessed, none skipped
      2. Vague outcomes are flagged with specific recommendations for improvement
      3. Open items have specific owners and deadlines, not "TBD"
      4. SA questions reference specific CSP gaps, not general curiosity
      5. 30-day plan includes customer-facing meetings with stated objectives
      6. Single-threaded risk is explicitly called out if only one champion exists

      Produce all 7 deliverables. Lead with a 2-sentence summary stating handoff quality
      (COMPLETE / NEEDS FOLLOW-UP / INCOMPLETE) and the number of open items requiring action.

  update_csp_value:
    name: "Update CSP Value Tracking"
    description: "Monthly update of CSP value metrics"
    prompt: |
      You are performing the monthly CSP value update for {account_name}.
      Current CSP: {csp_link}. Review period: {review_period}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.

      This runbook updates all value tracking metrics in the CSP, assesses outcome progress,
      and identifies actions to accelerate value realization.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: COLLECT CURRENT UTILIZATION METRICS
      Gather all measurable utilization data for {review_period}: active users, feature
      usage rates, API call volumes, workflow execution counts, and data storage consumption.
      Compare each metric to the prior period and the target from the CSP.
      Deliverable: Utilization Metrics table (Metric | Baseline | Prior Period | Current | Target | Trend | On Track Y/N).

      STEP 3: ASSESS OUTCOME PROGRESS
      For each business outcome defined in the CSP, evaluate current progress. Determine
      the completion percentage, supporting evidence, and whether the outcome is on track
      to be achieved by its target date. Classify as ON TRACK, AT RISK, or BEHIND.
      Deliverable: Outcome Progress table (Outcome | Target Date | Completion % | Evidence | Status).

      STEP 4: UPDATE HEALTH INDICATORS
      Refresh the health indicators section of the CSP: adoption health, technical health,
      relationship health, and value health. For each, note the current state and what
      changed since last update.
      Deliverable: Health Indicators (Dimension | Prior Status | Current Status | Change Driver).

      STEP 5: DOCUMENT WINS AND CHALLENGES
      Record specific wins (milestones achieved, problems solved, value delivered) and
      challenges (blockers encountered, delays, issues raised) from {review_period}.
      Each entry must have a date and supporting detail.
      Deliverable: Period Log (Date | Type: Win/Challenge | Detail | Impact | Follow-up Action).

      STEP 6: IDENTIFY VALUE GAPS AND ACCELERATION ACTIONS
      Compare realized value against potential value. For each gap, determine the root cause
      and define an action to accelerate value realization. Prioritize by impact on next
      QBR value story.
      Deliverable: Value Acceleration Plan (Gap | Root Cause | Action | Owner | Timeline | QBR Impact).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every utilization metric has current and prior period numbers for comparison
      2. Outcome progress percentages are calculated, not guessed
      3. Health indicator changes reference specific events, not general impressions
      4. Wins are quantified where possible (hours saved, incidents prevented)
      5. Value acceleration actions have owners and timelines
      6. Updated CSP section 8 is ready for direct insertion

      Produce all 7 deliverables formatted for CSP section 8 insertion. Lead with a
      2-sentence summary of the value trend direction and the biggest win this period.

  update_csp_milestones:
    name: "Update CSP Milestone Status"
    description: "Track and update adoption milestones"
    prompt: |
      You are updating milestone status for the {account_name} CSP.
      Current phase: {current_phase}. Milestones: {milestone_list}.
      Account state: {account_state}.

      This runbook tracks adoption milestone completion, identifies at-risk milestones,
      and updates the CSP phase progress with mitigation plans for delays.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: ASSESS EACH MILESTONE
      For every milestone in {milestone_list}, determine current status: COMPLETED (with
      completion date), IN PROGRESS (with percentage and expected completion), AT RISK
      (with delay reason), or NOT STARTED (with planned start date). Capture evidence
      supporting each status.
      Deliverable: Milestone Status table (Milestone | Due Date | Status | Evidence | Completion/Expected Date).

      STEP 2: CALCULATE PHASE PROGRESS
      Aggregate milestone statuses from Step 1 to determine overall phase completion
      percentage. Weight milestones by their criticality to the phase objective. Determine
      whether the phase is on track to complete by its target date.
      Deliverable: Phase Progress (Phase | Target Date | Completion % | On Track Y/N | Projected Completion).

      STEP 3: ANALYZE AT-RISK MILESTONES
      For each AT RISK milestone from Step 1, perform root cause analysis: is the delay
      caused by customer dependencies, {vendor} actions, technical blockers, or resource
      constraints? Determine the impact: does this delay cascade to other milestones or
      block the phase transition?
      Deliverable: At-Risk Analysis (Milestone | Root Cause | Delay Days | Cascade Impact | Blocking Y/N).

      STEP 4: BUILD MITIGATION PLANS
      For each at-risk milestone from Step 3, define a mitigation plan: specific actions
      to get back on track, alternative approaches if the original plan is no longer viable,
      and escalation criteria if mitigation fails.
      Deliverable: Mitigation Plans (Milestone | Action | Owner | New Target Date | Escalation Trigger).

      STEP 5: UPDATE TIMELINE AND FOCUS AREAS
      If milestones have shifted, produce an updated phase timeline. Identify the next 3
      milestones that should receive focus in the coming period. For each, specify what
      "done" looks like and who is responsible.
      Deliverable: Updated Timeline with next focus milestones (Milestone | Definition of Done | Owner | Target Date).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every milestone has a specific status with evidence, not "in progress" without detail
      2. Completion percentages are calculated from deliverables, not estimated
      3. Delay durations are in specific days, not "slightly behind"
      4. Mitigation plans have alternative approaches, not just "try harder"
      5. Cascade impacts are mapped to downstream milestones
      6. Updated timeline accounts for mitigation plan adjustments

      Produce all 6 deliverables. Lead with a 2-sentence summary stating phase completion
      percentage and the number of milestones at risk.

  quarterly_csp_refresh:
    name: "Quarterly CSP Refresh"
    description: "Comprehensive quarterly CSP review and update"
    prompt: |
      You are performing the quarterly CSP refresh for {account_name}.
      Current CSP: {csp_link}. Quarter: {quarter}.
      Account state: {account_state}.

      This runbook reviews and updates every CSP section, assesses phase transitions,
      refreshes the stakeholder map and risk register, and prepares QBR talking points.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: REVIEW ALL CSP SECTIONS
      Audit every section of the CSP for accuracy and currency. For each section, determine:
      is the content still accurate, has anything changed, and what needs updating? Mark
      sections as CURRENT, NEEDS UPDATE, or STALE.
      Deliverable: Section Audit (Section | Status | Changes Required | Priority | Last Updated).

      STEP 2: ASSESS PHASE COMPLETION AND TRANSITION
      Evaluate whether the current phase should transition to the next. Review all phase
      milestones, adoption criteria, and success metrics. If transition is warranted,
      define the next phase objectives and entry criteria confirmation.
      Deliverable: Phase Assessment (Current Phase | Completion % | Transition Ready Y/N | Next Phase | Entry Criteria Met).

      STEP 3: REFRESH BUSINESS OUTCOMES
      Review original business outcomes against current customer priorities. Determine
      whether any outcomes should be retired (achieved or no longer relevant), modified
      (scope changed), or added (new priorities emerged). Document the rationale for changes.
      Deliverable: Outcome Refresh (Outcome | Original Target | Current Status | Action: Keep/Modify/Retire/Add | Rationale).

      STEP 4: UPDATE STAKEHOLDER MAP
      Review the stakeholder landscape for changes: role changes, departures, new stakeholders,
      sentiment shifts, and engagement level changes. Update champion status and identify
      new champions to develop.
      Deliverable: Stakeholder Update (Name | Prior Role | Current Role/Status | Sentiment Change | Action Needed).

      STEP 5: REFRESH RISK REGISTER
      Review all existing risks: close resolved risks, update mitigation status on active
      risks, and add new risks identified during the quarter. Re-score likelihood and impact.
      Deliverable: Risk Register Refresh (Risk | Prior Score | Current Score | Status | Mitigation Update | New Y/N).

      STEP 6: PREPARE QBR TALKING POINTS
      From Steps 1-5, extract the key talking points for the upcoming QBR: value delivered
      this quarter, phase progress, stakeholder alignment points, risks to discuss, and
      next quarter priorities.
      Deliverable: QBR Talking Points (Topic | Key Message | Supporting Data | Discussion Question | Time Allocation).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every CSP section is reviewed, none skipped
      2. Phase transition assessment references specific criteria, not subjective readiness
      3. Outcome changes have explicit rationale
      4. Stakeholder departures have replacement identification or gap flag
      5. Risk scores are updated with current evidence, not carried forward unchanged
      6. QBR talking points are prioritized by customer relevance

      Produce all 7 deliverables. Lead with a 3-sentence summary of the most significant
      CSP changes this quarter, the phase status, and the top QBR theme.

  csp_qbr_prep:
    name: "Prepare CSP for Customer QBR"
    description: "Extract QBR content from CSP"
    playbooks:
      - "PB_CA_001"  # Customer-facing QBR
    prompt: |
      You are preparing QBR content from the {account_name} CSP.
      CSP: {csp_link}. QBR date: {qbr_date}.
      Account state: {account_state}.

      This runbook extracts and structures QBR-ready content from the CSP, producing
      a presentation-ready package with value evidence, adoption progress, and discussion items.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: EXTRACT VALUE DELIVERED SUMMARY
      Pull all quantified value from the CSP value tracking section. Select the top 3-5
      metrics that best demonstrate ROI. For each, prepare a before/after comparison with
      business impact context that resonates with executive stakeholders.
      Deliverable: Value Summary (Metric | Before | After | Improvement | Business Impact | Executive Framing).

      STEP 2: COMPILE ADOPTION SCORECARD
      Create a visual-ready adoption scorecard from CSP milestone and adoption data:
      phase completion, feature adoption rates, user penetration, and use case deployment
      status. Score each dimension as GREEN/YELLOW/RED with supporting metrics.
      Deliverable: Adoption Scorecard (Dimension | Score | Metric | Trend | Highlight).

      STEP 3: IDENTIFY SUCCESS HIGHLIGHTS
      Select 2-3 specific successes from the quarter that demonstrate partnership value.
      Structure each as a micro-story: what was the challenge, what did we do together,
      what was the result. These should be shareable moments the customer can reference.
      Deliverable: Success Highlights (Title | Challenge | Joint Action | Result | Stakeholder Impact).

      STEP 4: PREPARE DISCUSSION TOPICS
      Identify 3-5 topics requiring customer input or decision: upcoming phase transitions,
      adoption barriers needing customer action, expansion opportunities, or strategic
      alignment questions. Frame each as a question with context and options.
      Deliverable: Discussion Topics (Topic | Context | Question for Customer | Options | Recommended Action).

      STEP 5: BUILD NEXT PHASE PREVIEW
      Draft a forward-looking section covering: next quarter objectives, planned milestones,
      new use cases or features to adopt, and asks from the customer (resources, access,
      decisions). Include a draft timeline.
      Deliverable: Next Phase Preview (Objective | Milestone | Timeline | Customer Ask | Expected Value).

      STEP 6: COMPILE ASKS AND RECOMMENDATIONS
      List all asks for the customer: resource commitments, access requirements, decision
      deadlines, and engagement commitments. Pair each ask with the value it enables.
      Deliverable: Asks Summary (Ask | Rationale | Value Enabled | Deadline | Priority).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Value metrics use specific numbers with before/after comparisons
      2. Adoption scorecard dimensions cover all CSP phases
      3. Success highlights are customer-centric, not {vendor}-centric
      4. Discussion topics include options, not open-ended questions
      5. Next phase preview aligns with CSP-documented customer goals
      6. Asks are paired with value, not presented as demands
      7. Content is presentation-ready: concise, visual-friendly, jargon-free

      Produce all 7 deliverables. Lead with a 3-sentence executive summary suitable for
      opening the QBR slide deck.

  csp_risk_update:
    name: "Update CSP Risks"
    description: "Review and update CSP risk section"
    prompt: |
      You are updating the risk section of the {account_name} CSP.
      Current risks: {risk_list}. Recent signals: {recent_signals}.
      Account state: {account_state}.

      This runbook reviews all existing risks, incorporates new signals, and produces
      an updated risk register with current mitigations and overall risk posture.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: REVIEW EXISTING RISKS
      For each risk in {risk_list}, determine current status: ACTIVE (still present and
      unmitigated), MITIGATING (mitigation in progress, partially effective), MITIGATED
      (mitigation applied, risk reduced), or CLOSED (risk no longer applies). Update the
      evidence and last-assessed date for each.
      Deliverable: Risk Status Review (Risk | Prior Status | Current Status | Evidence Update | Last Assessed).

      STEP 2: IDENTIFY NEW RISKS FROM SIGNALS
      Analyze {recent_signals} for new risk indicators not captured in the existing register.
      Classify each new risk by category: TECHNICAL, ADOPTION, RELATIONSHIP, COMMERCIAL,
      COMPETITIVE, or ORGANIZATIONAL. Determine likelihood and impact.
      Deliverable: New Risks (Risk | Category | Source Signal | Likelihood | Impact | Confidence).

      STEP 3: UPDATE MITIGATION STATUS
      For ACTIVE and MITIGATING risks from Step 1, assess mitigation progress: what actions
      have been taken, are they effective, and what remains to be done. For ineffective
      mitigations, define alternative approaches.
      Deliverable: Mitigation Update (Risk | Mitigation Action | Progress % | Effective Y/N | Alternative if Needed).

      STEP 4: ASSESS OVERALL RISK POSTURE
      Calculate the overall risk posture considering all active risks, their mitigations,
      and new risks added. Compare to prior assessment. Classify as:
      IMPROVING (fewer/lower risks), STABLE (similar profile), or DETERIORATING (more/higher risks).
      Deliverable: Risk Posture Assessment with trend, comparison to prior period, and key drivers.

      STEP 5: DEFINE ESCALATION RECOMMENDATIONS
      Identify any risks that require escalation: to management (resource constraints),
      to AE (commercial risk), to SA (technical risk), or to customer executive sponsor
      (relationship/organizational risk). Provide escalation rationale for each.
      Deliverable: Escalation Recommendations (Risk | Escalation Target | Rationale | Urgency | Suggested Message).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every existing risk has an updated status, none carried forward without review
      2. New risks have specific source signals, not general concerns
      3. Likelihood and impact assessments are based on evidence, not intuition
      4. Closed risks have explicit resolution documentation
      5. Escalation recommendations include the specific message, not just "escalate"
      6. Overall risk posture comparison references the prior assessment date

      Produce all 6 deliverables. Lead with a 2-sentence summary stating the overall
      risk posture trend and the most critical risk requiring attention.

  csp_expansion_planning:
    name: "Plan CSP Expansion Phase"
    description: "Plan next adoption phase in CSP"
    prompt: |
      You are planning the next adoption phase for {account_name} as they complete
      {current_phase}. CSP: {csp_link}. Expansion opportunities: {opportunities}.
      Account state: {account_state}.

      This runbook defines the next phase of the customer success plan, including objectives,
      new use cases, milestones, stakeholder engagement, and success criteria.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: ASSESS PHASE READINESS
      Confirm that {current_phase} exit criteria are met. Review all milestones, adoption
      metrics, and value realization targets. Document what was achieved and what is being
      carried forward. Flag any unresolved items that could affect the next phase.
      Deliverable: Phase Exit Assessment (Criterion | Status | Evidence | Carry Forward Y/N).

      STEP 2: DEFINE NEXT PHASE OBJECTIVES
      Based on customer business priorities and {opportunities}, define 3-5 objectives for
      the next phase. Each objective must be measurable, time-bound, and aligned to a
      customer business goal. Include the value each objective delivers.
      Deliverable: Phase Objectives (Objective | Business Goal Alignment | Success Metric | Target | Timeline | Value).

      STEP 3: SELECT AND SCOPE NEW USE CASES
      From {opportunities}, evaluate and select use cases for the next phase. For each
      selected use case, define: scope, expected value, implementation complexity, dependencies,
      and the customer team required. Estimate time to first value.
      Deliverable: Use Case Selection (Use Case | Value | Complexity | Dependencies | Customer Team | Time to Value).

      STEP 4: BUILD MILESTONE PLAN
      Create milestones for the next phase. Each milestone should mark a meaningful
      achievement, not just a task completion. Define: the milestone, its due date, the
      definition of done, the owner, and what it unlocks.
      Deliverable: Milestone Plan (Milestone | Due Date | Definition of Done | Owner | Unlocks | Dependencies).

      STEP 5: PLAN STAKEHOLDER ENGAGEMENT
      Identify stakeholders required for the expansion phase: new stakeholders to bring into
      the program, existing stakeholders whose role changes, and executive sponsors who need
      to re-confirm commitment. Plan the engagement sequence.
      Deliverable: Stakeholder Engagement Plan (Stakeholder | Role in Phase | Engagement Action | Timeline | Owner).

      STEP 6: DEFINE SUCCESS CRITERIA AND RESOURCE REQUIREMENTS
      Establish the criteria for phase success and the resources required from both {vendor}
      and the customer. Include: technical resources, training needs, integration work,
      and ongoing support requirements.
      Deliverable: Phase Plan Summary (Success Criteria | {vendor} Resources | Customer Resources | Prerequisites | Risk).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Phase exit criteria are verified with evidence, not assumed complete
      2. Every objective has a measurable success metric with a specific target
      3. Use case complexity assessments include resource and time estimates
      4. Milestones have definitions of done, not vague descriptions
      5. Stakeholder engagement actions are sequenced logically
      6. Resource requirements are specific (hours, people, tools), not "adequate support"

      Produce all 7 deliverables. Lead with a 2-sentence summary stating the phase name,
      duration, and the primary value objective.

# ============================================================================
# CUSTOMER JOURNEY MAPPING PROMPTS (Post-Sales)
# Based on industry B2B customer experience best practices
# ============================================================================
customer_journey:

  accept_journey_handoff:
    name: "Accept Journey Map Handoff from SA"
    description: "Receive and validate journey map at deal close"
    prompt: |
      You are accepting a customer journey map handoff for {account_name} from SA {sa_name}
      at deal close. Journey map: {journey_map_link}. CSP: {csp_link}.
      Account state: {account_state}.

      This runbook validates the pre-sales journey documentation, captures close sentiment
      baseline, and plans the post-sales journey continuation.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: REVIEW PRE-SALES JOURNEY DOCUMENTATION
      Examine the journey map for completeness: are all pre-sales stages documented
      (discovery, evaluation, technical validation, negotiation, close)? For each stage,
      verify that touchpoints, stakeholder experiences, and sentiment are captured.
      Deliverable: Journey Review (Stage | Documented Y/N | Touchpoints Captured | Sentiment Recorded | Gaps).

      STEP 2: EXTRACT KEY JOURNEY INSIGHTS
      Identify the most important insights from the pre-sales journey: what moments of
      truth shaped the customer's decision, what friction points were encountered, what
      expectations were set, and what promises were made that must be delivered post-sales.
      Deliverable: Key Insights (Insight | Stage | Impact on Decision | Post-Sales Implication | Action Required).

      STEP 3: CAPTURE CLOSE SENTIMENT BASELINE
      Document the sentiment of each key stakeholder at deal close: their confidence level,
      enthusiasm, concerns, and expectations for the post-sales experience. This becomes
      the baseline against which post-sales sentiment is tracked.
      Deliverable: Sentiment Baseline (Stakeholder | Role | Confidence | Enthusiasm | Top Concern | Key Expectation).

      STEP 4: IDENTIFY KNOWN FRICTION TO MONITOR
      From the pre-sales journey, extract friction points that could carry over into
      post-sales: unresolved concerns, workarounds that were accepted, features promised
      on roadmap, or stakeholders who were skeptical.
      Deliverable: Friction Watch List (Friction Point | Origin Stage | Current Status | Risk if Unresolved | Monitoring Plan).

      STEP 5: PLAN POST-SALES JOURNEY CONTINUATION
      Define the first 30-day touchpoint plan that continues the journey seamlessly from
      close to onboarding. Map each touchpoint to a stakeholder, an objective, and a
      sentiment goal. Ensure no stakeholder goes more than 10 business days without contact.
      Deliverable: 30-Day Touchpoint Plan (Day | Touchpoint | Stakeholder | Objective | Sentiment Goal | Owner).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every pre-sales stage is reviewed, none assumed complete
      2. Promises made during sales are explicitly documented
      3. Sentiment baseline covers all decision-influencing stakeholders
      4. Friction watch list items have specific monitoring plans
      5. 30-day plan ensures no stakeholder gap exceeds 10 business days
      6. Insights distinguish between facts and SA interpretations

      Produce all 6 deliverables. Lead with a 2-sentence summary stating the journey
      handoff quality and the most critical post-sales action.

  map_onboarding_journey:
    name: "Map Onboarding Journey"
    description: "Document customer experience during onboarding"
    prompt: |
      You are mapping the onboarding journey for {account_name}.
      Go-live target: {go_live_date}. Key milestones: {milestones}.
      Account state: {account_state}.

      This runbook documents the customer experience at every onboarding touchpoint,
      captures sentiment evolution, and identifies friction that could affect long-term adoption.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: DOCUMENT ALL ONBOARDING TOUCHPOINTS
      List every interaction between {account_name} and {vendor} during onboarding:
      kickoff meetings, training sessions, configuration workshops, integration calls,
      testing activities, and support interactions. Capture date, participants, purpose,
      and outcome for each.
      Deliverable: Touchpoint Log (Date | Touchpoint | Type | Participants | Purpose | Outcome | Sentiment).

      STEP 2: MAP MILESTONE EXPERIENCE
      For each milestone in {milestones}, document the planned vs actual experience:
      was it on time, what the customer's reaction was, what worked well, and what caused
      frustration. Calculate the gap between planned and actual delivery date.
      Deliverable: Milestone Experience (Milestone | Planned Date | Actual Date | Gap Days | Customer Reaction | What Worked | Friction).

      STEP 3: TRACK STAKEHOLDER SENTIMENT EVOLUTION
      For each key stakeholder, plot their sentiment trajectory across onboarding touchpoints.
      Identify inflection points where sentiment improved or declined and the triggering event.
      Compare against the close sentiment baseline from the journey handoff.
      Deliverable: Sentiment Tracker (Stakeholder | Close Baseline | Current Sentiment | Trend | Inflection Events).

      STEP 4: CATALOG FRICTION POINTS
      Document every friction point encountered during onboarding: delays, confusion,
      rework, escalations, miscommunications, and unmet expectations. For each, determine
      whether it was systemic (process issue) or situational (one-time).
      Deliverable: Friction Catalog (Friction | Date | Category | Systemic/Situational | Resolution | Time to Resolve).

      STEP 5: ASSESS GO-LIVE READINESS EXPERIENCE
      Evaluate whether the overall onboarding experience positions the customer for a
      positive go-live: are stakeholders confident, are users trained, are integrations
      tested, and are expectations aligned with reality? Flag any experience gaps that
      could cause go-live to feel negative even if technically successful.
      Deliverable: Go-Live Experience Assessment (Dimension | Readiness | Evidence | Risk to Positive Experience).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every touchpoint has a sentiment capture, not just a description
      2. Milestone gaps are in specific days, not "slightly delayed"
      3. Sentiment inflection points reference specific events, not general trends
      4. Friction points distinguish systemic from situational issues
      5. Go-live readiness considers experience quality, not just technical readiness
      6. Stakeholder sentiment is tracked individually, not aggregated prematurely

      Produce all 6 deliverables. Lead with a 2-sentence summary stating the overall
      onboarding experience quality and the most significant friction point.

  map_adoption_journey:
    name: "Map Ongoing Adoption Journey"
    description: "Track customer experience during adoption phase"
    prompt: |
      You are mapping the adoption journey for {account_name} in the post-go-live phase.
      Months since go-live: {months_since_golive}. Current adoption level: {adoption_level}.
      Account state: {account_state}.

      This runbook tracks the customer experience during the adoption phase, documenting
      feature discovery patterns, support interactions, and expansion readiness signals.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: DOCUMENT RECENT TOUCHPOINTS
      Catalog all touchpoints in the current review period: scheduled check-ins, ad-hoc
      conversations, training sessions, support interactions, and executive engagements.
      For each, capture the stakeholder, topic, outcome, and sentiment expressed.
      Deliverable: Touchpoint Log (Date | Type | Stakeholder | Topic | Outcome | Sentiment | Follow-up).

      STEP 2: TRACK FEATURE DISCOVERY JOURNEY
      Map how users are discovering and adopting features over time. Identify the adoption
      sequence: what features were adopted first, what features users found on their own vs
      were guided to, and what features remain undiscovered. Note "aha moments" where
      feature discovery accelerated usage.
      Deliverable: Feature Discovery Map (Feature | Discovery Method | Adoption Date | User Reaction | Usage Depth).

      STEP 3: MAP USAGE MILESTONES
      Identify meaningful usage milestones achieved since go-live: first workflow automated,
      100th report generated, first department expansion, first executive dashboard created.
      For each, note whether the customer acknowledged the milestone and how they reacted.
      Deliverable: Usage Milestone Timeline (Milestone | Date | User Impact | Customer Acknowledgment | Celebration Opportunity).

      STEP 4: ANALYZE SUPPORT JOURNEY PATTERNS
      Review support interactions as a journey element: is the customer's support experience
      improving over time (fewer tickets, faster resolution, less frustration)? Identify
      whether support interactions are building confidence or eroding trust.
      Deliverable: Support Journey Analysis (Period | Ticket Volume | Avg Resolution Time | Sentiment | Confidence Impact).

      STEP 5: IDENTIFY EXPANSION INTEREST SIGNALS
      Scan touchpoints and usage patterns for expansion signals: questions about additional
      features, requests from other departments, references to new use cases, and positive
      internal advocacy. Classify each signal's strength and readiness level.
      Deliverable: Expansion Signals (Signal | Source | Date | Strength | Readiness | Recommended Next Step).

      STEP 6: ASSESS OVERALL JOURNEY HEALTH
      Based on Steps 1-5, assess the adoption journey health: is the customer progressing
      through adoption stages as expected, are they engaged, and is the experience building
      long-term advocacy or creating fatigue?
      Deliverable: Journey Health Assessment with score (HEALTHY / MODERATE / AT RISK), evidence, and recommendations.

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Touchpoints capture sentiment, not just transactional outcomes
      2. Feature discovery includes the method (guided vs organic), not just the date
      3. Usage milestones are meaningful achievements, not arbitrary thresholds
      4. Support journey assessment considers sentiment trend, not just volume
      5. Expansion signals have specific readiness assessments, not "interested"
      6. Journey health references patterns across multiple steps, not a single dimension

      Produce all 7 deliverables. Lead with a 2-sentence summary stating the adoption
      journey health and the most promising expansion signal.

  analyze_journey_health:
    name: "Analyze Journey Health"
    description: "Assess overall customer journey health"
    prompt: |
      You are analyzing journey health for {account_name} across all post-sales stages.
      Journey map: {journey_map_link}. Recent signals: {signals}.
      Account state: {account_state}.

      This runbook assesses the overall customer journey health by evaluating each stage,
      identifying persistent friction, and recommending improvements.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: ASSESS STAGE-BY-STAGE HEALTH
      Evaluate each post-sales journey stage the customer has passed through or is currently
      in: onboarding, initial adoption, deep adoption, expansion, and renewal. For each
      stage, assess: was the experience positive, neutral, or negative? What evidence supports
      the assessment?
      Deliverable: Stage Health (Stage | Status: Completed/Active/Upcoming | Experience | Evidence | Score 1-5).

      STEP 2: IDENTIFY PERSISTENT FRICTION
      Review friction points across all stages. Identify friction that persists across
      multiple stages or recurs after apparent resolution. These systemic issues indicate
      process or product gaps, not one-time problems.
      Deliverable: Persistent Friction (Friction | Stages Affected | First Reported | Still Active Y/N | Root Cause | Impact).

      STEP 3: EVALUATE MOMENTS OF TRUTH
      Identify the key moments of truth in this customer's journey: points where the
      experience had outsized impact on the relationship (positive or negative). Examples:
      first value realization, major incident response, executive review, renewal discussion.
      Deliverable: Moments of Truth (Moment | Date | Type: Positive/Negative | Impact on Relationship | Handled Well Y/N).

      STEP 4: MAP SENTIMENT TRAJECTORY
      Plot the overall sentiment trajectory from close to current. Identify the high points,
      low points, and current direction. Determine whether the trajectory is building toward
      advocacy or moving toward indifference or dissatisfaction.
      Deliverable: Sentiment Trajectory (Period | Sentiment Level | Direction | Key Driver | Risk Flag).

      STEP 5: BUILD JOURNEY IMPROVEMENT PLAN
      From Steps 1-4, identify the top 3-5 improvements that would most positively impact
      the customer's journey. For each, define the action, the expected experience improvement,
      and the owner. Prioritize improvements that affect upcoming stages.
      Deliverable: Improvement Plan (Improvement | Target Stage | Expected Impact | Action | Owner | Timeline).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every completed stage has a health score with evidence
      2. Persistent friction is traced to root causes, not just symptoms
      3. Moments of truth assessment includes whether they were handled well
      4. Sentiment trajectory references specific events at inflection points
      5. Improvement plan prioritizes upcoming stages over past stages
      6. Overall journey health score synthesizes all dimensions

      Produce all 6 deliverables. Lead with a 2-sentence summary stating the overall
      journey health score and the most impactful improvement opportunity.

  identify_journey_friction:
    name: "Identify Journey Friction Points"
    description: "Discover and document friction in customer journey"
    prompt: |
      You are conducting a friction analysis for {account_name}.
      Recent feedback: {feedback}. Support patterns: {support_data}. Usage data: {usage_signals}.
      Account state: {account_state}.

      This runbook discovers and documents all friction points in the customer journey,
      performs root cause analysis, and produces a remediation plan.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: CATALOG ALL FRICTION SIGNALS
      Cross-reference feedback, support data, and usage signals to identify every point
      of friction. For each, capture: what the friction is, what journey stage it affects,
      when it was first observed, and whether it is ongoing or resolved.
      Deliverable: Friction Inventory (Friction | Stage | First Observed | Status | Source Data).

      STEP 2: CLASSIFY FRICTION BY TYPE AND SEVERITY
      Classify each friction point by type: PRODUCT (feature gap or bug), PROCESS (workflow
      or procedure issue), PEOPLE (communication or skill gap), TECHNICAL (integration or
      performance), or EXPECTATION (mismatch between promise and delivery). Score severity
      as HIGH (blocks progress), MEDIUM (creates workaround), LOW (annoyance).
      Deliverable: Friction Classification (Friction | Type | Severity | Users Affected | Frequency).

      STEP 3: PERFORM ROOT CAUSE ANALYSIS
      For HIGH and MEDIUM severity friction from Step 2, determine root cause. Trace each
      friction point to its origin: when did it start, what caused it, and why hasn't it
      been resolved? Distinguish between symptoms and root causes.
      Deliverable: Root Cause Analysis (Friction | Symptom | Root Cause | Origin Date | Resolution Blockers).

      STEP 4: ASSESS RELATIONSHIP IMPACT
      For each friction point, assess the cumulative impact on the customer relationship:
      has it eroded trust, created stakeholder frustration, generated escalation risk, or
      damaged the value perception? Map friction to specific stakeholders most affected.
      Deliverable: Relationship Impact (Friction | Stakeholder Affected | Trust Impact | Escalation Risk | Value Perception Impact).

      STEP 5: BUILD REMEDIATION PLAN
      Create a prioritized remediation plan. Address HIGH severity friction first, then
      MEDIUM. For each, define: the fix, the owner, the timeline, and the communication
      to the customer. Identify quick wins (resolvable in under 1 week) separately.
      Deliverable: Remediation Plan (Priority | Friction | Fix | Owner | Timeline | Customer Communication | Quick Win Y/N).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Friction inventory cross-references all three data sources, not just one
      2. Classification uses the defined type categories, no "other" or "general"
      3. Root cause analysis distinguishes symptoms from causes
      4. Relationship impact assessment names specific affected stakeholders
      5. Remediation plan includes customer communication approach, not just internal fix
      6. Quick wins are genuinely achievable in under 1 week with named resources

      Produce all 6 deliverables. Lead with a 2-sentence summary stating the number of
      friction points by severity and the most impactful quick win available.

# ============================================================================
# VOICE OF CUSTOMER (VoC) PROMPTS
# Based on industry VoC program best practices
# ============================================================================
voice_of_customer:

  initiate_voc_tracking:
    name: "Initialize VoC Tracking"
    description: "Set up VoC tracking for new customer"
    prompt: |
      You are setting up Voice of Customer (VoC) tracking for {account_name}.
      Account tier: {tier}. Stakeholders: {stakeholders}.
      Account state: {account_state}.

      This runbook establishes the VoC collection framework, defines cadence by metric type,
      and creates the closed-loop process for acting on customer feedback.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: DEFINE VoC COLLECTION FRAMEWORK
      Design the VoC program for this account based on their tier and stakeholder landscape.
      Determine which metrics to track (NPS, CSAT, CES), the collection method for each,
      and the target population. Adjust depth and frequency to match the account tier.
      Deliverable: VoC Framework (Metric | Method | Target Population | Tier Justification).

      STEP 2: SET COLLECTION CADENCE
      Define when and how often each metric is collected. NPS: annual or semi-annual.
      CSAT: after key interactions (QBRs, support escalations, implementations). CES:
      after process-heavy interactions (onboarding, configuration changes). Qualitative
      feedback: continuous capture from meetings and communications.
      Deliverable: Collection Calendar (Metric | Frequency | Trigger Event | Responsible | First Collection Date).

      STEP 3: MAP STAKEHOLDER SURVEY PLAN
      Determine which stakeholders receive which surveys. Match survey type to stakeholder
      role: executives get NPS, end-users get CSAT and CES, technical leads get product
      feedback surveys. Identify opt-out risks and mitigation.
      Deliverable: Stakeholder Survey Map (Stakeholder | Role | Survey Types | Preferred Channel | Opt-out Risk).

      STEP 4: ESTABLISH BASELINE METRICS
      Define what baseline measurements to capture in the first 30 days. Identify proxy
      data available from the pre-sales process (SA sentiment notes, close survey) and
      plan the first formal measurements.
      Deliverable: Baseline Plan (Metric | Proxy Available | Formal Baseline Method | Target Date | Owner).

      STEP 5: DESIGN CLOSED-LOOP WORKFLOW
      Define the process for acting on VoC feedback: who reviews feedback, how quickly
      responses are required (SLA by sentiment: negative within 48 hours, positive within
      1 week), escalation paths, and documentation requirements.
      Deliverable: Closed-Loop Workflow (Feedback Type | SLA | Reviewer | Escalation Path | Documentation | Follow-up).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. VoC framework matches the account tier (enterprise gets more depth)
      2. Collection cadence avoids survey fatigue (no stakeholder surveyed more than quarterly)
      3. Every stakeholder has at least one survey type assigned
      4. Baseline plan has specific dates and owners
      5. Closed-loop SLAs are specific hours/days, not "promptly"
      6. Workflow includes documentation requirements, not just action

      Produce all 6 deliverables. Lead with a 2-sentence summary stating the VoC program
      scope and the first collection milestone.

  collect_nps_feedback:
    name: "Collect and Process NPS"
    description: "Administer NPS survey and process results"
    prompt: |
      You are processing NPS survey results for {account_name}.
      Survey date: {date}. Respondents: {respondent_count}. Results: {results}.
      Account state: {account_state}.

      This runbook analyzes NPS results, segments respondents, identifies themes, and
      produces a closed-loop action plan for detractors and advocacy opportunities for promoters.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: CALCULATE AND SEGMENT NPS
      Calculate the NPS score. Segment respondents into Promoters (9-10), Passives (7-8),
      and Detractors (0-6). For each respondent, capture: name, role, score, and verbatim
      comment. Calculate response rate against total eligible stakeholders.
      Deliverable: NPS Summary (Score | Promoters Count | Passives Count | Detractors Count | Response Rate %).

      STEP 2: ANALYZE RESPONDENT DETAILS
      For each respondent, assess: does their score align with their engagement level? Is
      their score a change from prior surveys? What role do they play in renewal decisions?
      Flag any detractors who are decision-makers or champions.
      Deliverable: Respondent Analysis (Name | Role | Score | Prior Score | Change | Decision Influence | Risk Flag).

      STEP 3: EXTRACT COMMENT THEMES
      Analyze all verbatim comments. Group into themes: PRODUCT (features, reliability),
      SERVICE (support, responsiveness), VALUE (ROI, outcomes), RELATIONSHIP (trust,
      communication), PROCESS (ease of doing business). Count mentions per theme. Identify
      the top positive and top negative theme.
      Deliverable: Theme Analysis (Theme | Mentions | Sample Comments | Sentiment | Trend vs Prior).

      STEP 4: BUILD DETRACTOR FOLLOW-UP PLAN
      For each detractor, define a follow-up plan: who contacts them, within what timeframe
      (48 hours for decision-makers, 1 week for others), what the conversation objective is,
      and what resolution is proposed. Document any systemic issues detractors are surfacing.
      Deliverable: Detractor Follow-up (Name | Score | Key Concern | Contact Owner | Deadline | Resolution Approach).

      STEP 5: IDENTIFY PROMOTER ADVOCACY OPPORTUNITIES
      For each promoter, assess advocacy potential: would they serve as a reference?
      Participate in a case study? Speak at an event? Provide a testimonial? Note the
      appropriate ask based on their role and relationship depth.
      Deliverable: Advocacy Opportunities (Name | Score | Advocacy Ask | Relationship Readiness | Next Step).

      STEP 6: COMPARE TRENDS
      Compare this survey's results to prior NPS surveys for this account. Identify score
      movement direction, theme shifts, and whether prior closed-loop actions had measurable
      impact on scores.
      Deliverable: Trend Comparison (Survey Date | Score | Key Theme | Action Taken | Impact Observed).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. NPS calculation follows standard methodology (% promoters minus % detractors)
      2. Every detractor has a specific follow-up plan with named owner and deadline
      3. Theme analysis includes verbatim quotes, not just categories
      4. Response rate is calculated against eligible population, not just reported
      5. Trend comparison references prior actions and their effectiveness
      6. Decision-maker detractors are flagged as priority

      Produce all 7 deliverables. Lead with a 2-sentence summary stating the NPS score,
      the score trend, and the highest-priority detractor action.

  collect_csat_feedback:
    name: "Collect CSAT After Interaction"
    description: "Capture satisfaction after key touchpoints"
    prompt: |
      You are processing CSAT feedback after a {interaction_type} with {account_name}.
      Interaction date: {date}. Participants: {participants}. Results: {results}.
      Account state: {account_state}.

      This runbook analyzes post-interaction satisfaction, identifies drivers of the score,
      and produces follow-up actions to address concerns or reinforce positive experiences.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: SUMMARIZE CSAT RESULTS
      Calculate the CSAT score (percentage of satisfied or very satisfied responses).
      For each respondent, capture: name, role, score, and verbatim feedback. Compare
      the score against the account's CSAT baseline and the benchmark for this interaction type.
      Deliverable: CSAT Summary (Score | Respondent Count | vs Baseline | vs Benchmark | Distribution).

      STEP 2: ANALYZE SCORE DRIVERS
      Identify what drove the score: interaction quality, outcome achieved, responsiveness,
      preparation level, or follow-through on prior commitments. For low scores, determine
      whether the driver was the interaction itself or a pre-existing frustration expressed
      during the interaction.
      Deliverable: Score Drivers (Driver | Impact on Score | Evidence | Addressable Y/N | Owner).

      STEP 3: EXTRACT VERBATIM INSIGHTS
      Capture all verbatim feedback. Classify each comment as: actionable (something
      {vendor} can change), informational (context for understanding), or sentiment-only
      (emotional expression without specific ask). Note any unexpected feedback.
      Deliverable: Verbatim Analysis (Respondent | Comment | Classification | Theme | Action Required).

      STEP 4: DETERMINE ROOT CAUSE FOR LOW SCORES
      For any score below the satisfaction threshold (below 4/5 or equivalent), trace the
      root cause: was it a preparation gap, communication failure, unmet expectation, or
      unresolved prior issue? Determine whether this is a one-time event or a pattern.
      Deliverable: Root Cause Analysis (Respondent | Score | Root Cause | Pattern/One-time | Systemic Fix Available).

      STEP 5: BUILD FOLLOW-UP ACTION PLAN
      Define follow-up actions: for low scores, specific outreach with resolution. For
      high scores, reinforcement and advocacy opportunity. For all respondents, close
      the loop by acknowledging their feedback.
      Deliverable: Follow-up Plan (Respondent | Score | Action | Owner | Deadline | Communication Draft).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. CSAT score calculation follows the defined methodology consistently
      2. Score drivers are evidence-based, not assumed
      3. Root cause analysis distinguishes patterns from one-time events
      4. Every low score has a follow-up action with deadline
      5. Verbatim feedback is captured exactly, not paraphrased
      6. Baseline and benchmark comparisons use consistent scales

      Produce all 6 deliverables. Lead with a 2-sentence summary stating the CSAT score,
      how it compares to baseline, and the most important follow-up action.

  capture_qualitative_feedback:
    name: "Capture Qualitative Customer Feedback"
    description: "Document and categorize qualitative feedback"
    prompt: |
      You are documenting qualitative feedback from {account_name}.
      Source: {source_type}. Date: {date}. Stakeholder: {stakeholder}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.

      This runbook captures, categorizes, and assesses qualitative customer feedback,
      then determines appropriate closed-loop response and documentation.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: DOCUMENT FEEDBACK VERBATIM
      Record the feedback as close to the customer's exact words as possible. Where exact
      quotes are available, use them with quotation marks. Where paraphrasing is necessary,
      mark it as paraphrased. Capture the context: what prompted the feedback, what was
      being discussed, and the stakeholder's emotional state.
      Deliverable: Feedback Record (Verbatim/Paraphrased | Exact Quote | Context | Emotional State | Prompted/Unsolicited).

      STEP 3: CLASSIFY FEEDBACK
      Assign primary and secondary categories: PRODUCT (feature, quality, performance),
      SERVICE (support, responsiveness, expertise), RELATIONSHIP (trust, communication,
      alignment), VALUE (ROI, outcomes, expectations), PROCESS (ease of business, procedures,
      bureaucracy). Determine sentiment: POSITIVE, NEUTRAL, or NEGATIVE.
      Deliverable: Classification (Primary Category | Secondary Category | Sentiment | Intensity: Mild/Moderate/Strong).

      STEP 4: ASSESS IMPACT AND URGENCY
      Determine the feedback's impact on the account relationship: does it affect renewal
      risk, expansion potential, reference willingness, or stakeholder engagement? Assess
      urgency: does this require immediate response (within 24 hours), scheduled follow-up
      (within 1 week), or standard processing (next review cycle)?
      Deliverable: Impact Assessment (Renewal Impact | Expansion Impact | Reference Impact | Urgency | Response SLA).

      STEP 5: DETERMINE APPROPRIATE RESPONSE
      Based on the sentiment and urgency from Steps 3-4, determine the response approach:
      acknowledgment only, investigation and response, escalation to management, product
      feedback submission, or service recovery action. Draft the response communication.
      Deliverable: Response Plan (Response Type | Draft Communication | Owner | Channel | Deadline).

      STEP 6: UPDATE VoC RECORDS AND JOURNEY MAP
      Determine where this feedback should be documented: VoC tracking system, journey map
      update, risk register, or CSP notes. Specify what to update and how this feedback
      connects to existing themes or trends.
      Deliverable: Documentation Update (System to Update | Section | Content to Add | Connected Themes | Trend Update).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Feedback is captured verbatim where possible, paraphrased content is flagged
      2. Category assignment is specific (not "general" or "other")
      3. Sentiment intensity distinguishes mild from strong reactions
      4. Response SLAs are in specific hours/days
      5. Response communication draft is personalized, not templated
      6. Documentation updates specify exact sections and systems

      Produce all 7 deliverables. Lead with a 1-sentence summary stating the feedback
      sentiment, category, and required response urgency.

  analyze_support_voc:
    name: "Analyze Support Ticket VoC"
    description: "Extract VoC insights from support interactions"
    prompt: |
      You are extracting VoC insights from support interactions for {account_name}.
      Period: {time_period}. Ticket volume: {count}. Ticket data: {summary}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.

      This runbook analyzes support tickets as a VoC data source, identifying patterns,
      recurring pain points, embedded product feedback, and sentiment trends.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: ANALYZE TICKET VOLUME AND DISTRIBUTION
      Break down ticket volume by: severity (critical/high/medium/low), category (product
      bug, how-to, configuration, integration, performance), and resolution time. Compare
      volume and distribution to the prior period.
      Deliverable: Volume Analysis (Category | Severity | Count | Avg Resolution Hours | vs Prior Period | Trend).

      STEP 3: IDENTIFY RECURRING PAIN POINTS
      Group tickets into pain point clusters: issues that multiple tickets describe or that
      recur for the same user/team. For each cluster, determine: frequency, affected users,
      total time spent, and whether a permanent fix exists or a workaround is in place.
      Deliverable: Pain Point Clusters (Pain Point | Ticket Count | Users Affected | Total Hours | Fix Available Y/N | Workaround).

      STEP 4: EXTRACT CUSTOMER SENTIMENT FROM TICKETS
      Analyze the language and tone in customer communications within tickets. Classify
      overall sentiment per ticket as FRUSTRATED, NEUTRAL, or APPRECIATIVE. Identify
      escalation language, competitive mentions, and renewal/churn signals embedded in
      support interactions.
      Deliverable: Sentiment Analysis (Ticket | Sentiment | Key Phrases | Escalation Language Y/N | Competitive Mention | Churn Signal).

      STEP 5: EXTRACT EMBEDDED PRODUCT FEEDBACK
      Identify product feedback embedded in support interactions: feature requests, usability
      complaints, integration gaps, and performance expectations. Distinguish between
      workaround requests (symptom) and capability gaps (root cause).
      Deliverable: Product Feedback (Feedback | Type: Request/Complaint/Gap | Frequency | Customer Priority | Workaround Available).

      STEP 6: BUILD RECOMMENDATIONS
      Based on Steps 2-5, produce recommendations in three categories: actions for {vendor}
      support team (process improvements, knowledge base updates), actions for CA (customer
      engagement, training, proactive outreach), and product feedback for PM team.
      Deliverable: Recommendations (Category | Recommendation | Evidence | Expected Impact | Priority | Owner).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Volume analysis includes period-over-period comparison with specific numbers
      2. Pain point clusters are based on ticket content, not just category tags
      3. Sentiment classification uses specific language evidence, not assumptions
      4. Product feedback distinguishes symptoms from root capability gaps
      5. Recommendations have specific owners, not "the team"
      6. Churn signals are flagged with urgency indicators

      Produce all 7 deliverables. Lead with a 2-sentence summary stating the support
      VoC health trend and the most critical finding.

  extract_meeting_voc:
    name: "Extract VoC from Meeting Notes"
    description: "Identify VoC signals from customer meetings"
    prompt: |
      You are extracting VoC signals from a customer meeting with {account_name}.
      Meeting date: {date}. Meeting type: {type}. Notes: {notes_summary}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.

      This runbook identifies all VoC signals embedded in meeting interactions, categorizes
      them, and determines required follow-up actions and journey map updates.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: EXTRACT ALL FEEDBACK SIGNALS
      Review the meeting notes for every instance of customer feedback: explicit statements
      (direct comments about {vendor}), implicit signals (tone, questions asked, topics
      avoided), and behavioral signals (attendance, engagement level, follow-up commitment).
      Deliverable: Signal Extraction (Signal | Type: Explicit/Implicit/Behavioral | Speaker | Context | Exact Quote if Available).

      STEP 3: CATEGORIZE FEEDBACK
      Classify each signal into categories: PRODUCT (feature, quality, roadmap), SERVICE
      (support, responsiveness), VALUE (ROI, outcomes), RELATIONSHIP (trust, alignment,
      communication), COMPETITIVE (competitor mentions, alternatives discussed), and
      STRATEGIC (business direction, priority shifts).
      Deliverable: Feedback Categorization (Signal | Category | Sentiment | Strength | Priority).

      STEP 4: ASSESS SENTIMENT AND IMPLICATIONS
      Determine the overall meeting sentiment and what it implies for the account. Identify
      any signals that indicate risk (frustration, disengagement, competitive evaluation)
      or opportunity (enthusiasm, expansion interest, advocacy willingness).
      Deliverable: Sentiment Assessment (Overall Sentiment | Risk Signals | Opportunity Signals | Implications for Account).

      STEP 5: DEFINE FOLLOW-UP ACTIONS
      For each significant signal from Steps 2-3, determine the required follow-up: who
      needs to be informed, what action should be taken, and by when. Priority-rank actions
      by their impact on account health.
      Deliverable: Action Items (Signal | Action Required | Owner | Deadline | Impact on Health | Priority).

      STEP 6: DETERMINE JOURNEY MAP UPDATES
      Assess whether this meeting changes the customer journey map: does it add a new
      touchpoint with significant sentiment, change the trajectory, introduce new friction,
      or validate a moment of truth? Specify exact updates needed.
      Deliverable: Journey Map Updates (Update Type | Section | Content to Add | Sentiment Shift | Priority).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Both explicit and implicit signals are captured, not just direct statements
      2. Exact quotes are used where available, paraphrases are flagged
      3. Competitive mentions are captured with specific detail
      4. Follow-up actions have specific owners and deadlines
      5. Sentiment assessment distinguishes meeting sentiment from overall account sentiment
      6. Journey map updates specify exact sections and content

      Produce all 7 deliverables. Lead with a 2-sentence summary stating the meeting
      sentiment and the most significant VoC signal identified.

  voc_trend_analysis:
    name: "Analyze VoC Trends"
    description: "Review VoC metrics and identify trends"
    prompt: |
      You are analyzing VoC trends for {account_name} over {time_period}.
      Available metrics: {metrics}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.

      This runbook identifies trends across all VoC data sources, correlates them with
      journey events, and produces actionable recommendations based on trajectory.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: COMPILE METRIC TRENDS
      For each available VoC metric (NPS, CSAT, CES, qualitative sentiment), plot the
      trend across {time_period}. Calculate: period-over-period change, moving average,
      and direction (improving, stable, declining). Note any statistically significant
      changes vs noise.
      Deliverable: Metric Trends (Metric | Start Value | End Value | Change | Direction | Significant Y/N).

      STEP 3: IDENTIFY PERSISTENT THEMES
      Review qualitative feedback themes across {time_period}. Identify themes that
      persist across multiple collection points vs themes that appeared once. For persistent
      themes, note whether they are improving, stable, or worsening.
      Deliverable: Theme Persistence (Theme | First Appeared | Frequency | Trend | Resolved Y/N | Related Metric Impact).

      STEP 4: MAP IMPROVEMENTS AND DECLINES
      Separate all metrics and themes into improving areas and declining areas. For each
      improvement, identify what drove it (action taken, product change, relationship event).
      For each decline, identify what caused it and whether corrective action is in progress.
      Deliverable: Movement Analysis (Area | Direction | Driver/Cause | Action Taken | Impact Measured).

      STEP 5: CORRELATE WITH JOURNEY EVENTS
      Cross-reference VoC movements from Step 4 with customer journey events: deployments,
      incidents, QBRs, staffing changes, expansion milestones. Identify correlations between
      journey events and VoC shifts.
      Deliverable: Event Correlation (VoC Shift | Journey Event | Correlation Strength | Lag Time | Implication).

      STEP 6: PRODUCE TREND-BASED RECOMMENDATIONS
      Based on the trajectory analysis, produce recommendations: what to continue doing
      (improving areas), what to change (declining areas), and what to watch (ambiguous
      trends). Each recommendation must reference specific data.
      Deliverable: Recommendations (Area | Trend | Recommendation | Evidence | Priority | Expected Impact).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Trends use specific values, not "improving" without numbers
      2. Period-over-period changes are calculated consistently
      3. Theme persistence is tracked across collection points, not just counted
      4. Correlations distinguish causation signals from coincidence
      5. Recommendations reference specific trend data, not general advice
      6. Statistical significance is noted where sample sizes allow

      Produce all 7 deliverables. Lead with a 2-sentence summary stating the overall
      VoC trajectory and the most significant trend requiring attention.

  closed_loop_action:
    name: "Execute Closed-Loop Action"
    description: "Follow up on VoC feedback"
    prompt: |
      You are executing a closed-loop follow-up for {account_name} VoC feedback.
      Feedback: {feedback_summary}. Stakeholder: {stakeholder}. Sentiment: {sentiment}.
      Account state: {account_state}.

      This runbook manages the end-to-end closed-loop process: acknowledgment, investigation,
      action, communication back to the customer, and resolution documentation.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: ACKNOWLEDGE AND LOG FEEDBACK
      Confirm the feedback has been received and logged. Determine the acknowledgment
      approach: immediate personal response (for negative/strong feedback), scheduled
      follow-up (for moderate feedback), or batch processing (for minor/positive feedback).
      Draft the acknowledgment communication.
      Deliverable: Acknowledgment Record (Feedback Logged Y/N | Approach | Draft Communication | Send Deadline | Channel).

      STEP 2: INVESTIGATE AND DETERMINE RESPONSE
      Investigate the feedback: is the concern valid, what is the root cause, what
      options exist for resolution, and what is the appropriate response level? Determine
      whether this requires individual response, systemic change, escalation, or product
      feedback submission.
      Deliverable: Investigation Summary (Feedback | Validity | Root Cause | Response Options | Recommended Response | Effort).

      STEP 3: TAKE ACTION
      Execute the determined response: resolve the issue, implement the change, submit
      the product feedback, or escalate to the appropriate team. Document every action
      taken with dates and outcomes.
      Deliverable: Action Log (Action | Date | Outcome | Owner | Status: Complete/In Progress/Escalated).

      STEP 4: COMMUNICATE BACK TO CUSTOMER
      Prepare and deliver the follow-up communication to {stakeholder}. The communication
      must: acknowledge the original feedback, describe what was done, explain the outcome
      or timeline, and invite continued feedback. Match the communication channel to the
      stakeholder's preference.
      Deliverable: Customer Communication (Draft Message | Channel | Sent Date | Response Received | Satisfaction with Resolution).

      STEP 5: DOCUMENT RESOLUTION AND UPDATE RECORDS
      Close the loop in all tracking systems: update VoC records, journey map, health
      score if applicable, and CSP risk register if the feedback was risk-related.
      Assess whether the resolution improved the stakeholder's sentiment.
      Deliverable: Resolution Record (Original Sentiment | Action Taken | Resolution Status | Sentiment After | Systems Updated | Feedback Loop Closed Y/N).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Acknowledgment has a specific send deadline in hours, not "promptly"
      2. Investigation identifies root cause, not just symptoms
      3. Actions have specific dates and outcomes, not "in progress" indefinitely
      4. Customer communication is personalized to the stakeholder and their feedback
      5. Resolution documents the sentiment change, not just the technical fix
      6. All tracking systems are listed with specific update requirements

      Produce all 6 deliverables. Lead with a 1-sentence summary stating the feedback
      status (acknowledged/investigated/resolved) and the current sentiment trajectory.

  voc_qbr_content:
    name: "Prepare VoC Content for QBR"
    description: "Compile VoC insights for quarterly review"
    playbooks:
      - "PB_CA_001"  # Customer-facing QBR
    prompt: |
      You are preparing VoC content for the {account_name} QBR.
      Quarter: {quarter}. VoC data: {voc_summary}.
      Account state: {account_state}.

      This runbook compiles VoC insights into QBR-ready content that demonstrates listening,
      responsiveness, and continuous improvement in the customer relationship.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: COMPILE VoC METRICS SUMMARY
      Gather all VoC metrics for {quarter}: NPS score and trend, CSAT scores by interaction
      type, CES if available, and qualitative feedback volume. Present each metric with
      quarter-over-quarter comparison and benchmark context.
      Deliverable: VoC Metrics (Metric | This Quarter | Last Quarter | Change | Benchmark | Context).

      STEP 2: HIGHLIGHT KEY TRENDS
      Identify the 3-5 most important VoC trends from the quarter. For each, describe the
      trend, the evidence supporting it, and what it means for the partnership. Distinguish
      between trends driven by {vendor} actions and trends driven by external factors.
      Deliverable: Key Trends (Trend | Evidence | Driver | Partnership Implication | Action Taken/Planned).

      STEP 3: SHOWCASE ACTIONS TAKEN FROM FEEDBACK
      Document specific actions {vendor} took in response to customer feedback during the
      quarter. For each, show: the original feedback, the action taken, and the result.
      This demonstrates the closed-loop commitment.
      Deliverable: Actions from Feedback (Original Feedback | Action Taken | Result | Stakeholder Impact).

      STEP 4: PREPARE CUSTOMER DISCUSSION POINTS
      Identify 2-3 VoC-related topics to discuss with the customer during the QBR:
      areas where feedback is needed, validation of improvements made, and upcoming
      feedback collection plans. Frame each as a conversation, not a presentation.
      Deliverable: Discussion Points (Topic | Context | Question for Customer | Why It Matters | Time Allocation).

      STEP 5: DRAFT FEEDBACK COMMITMENT
      Prepare a forward-looking statement for the QBR: what {vendor} commits to listening
      for in the next quarter, how feedback will be collected, and what the customer can
      expect in terms of responsiveness. Include specific asks for continued feedback.
      Deliverable: Feedback Commitment (Commitment | Collection Method | Response SLA | Customer Ask | Next Milestone).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every metric has quarter-over-quarter comparison with specific numbers
      2. Trends are supported by data, not assertions
      3. Actions taken from feedback show measurable results where possible
      4. Discussion points are framed as questions, not lectures
      5. Content is customer-facing: transparent about areas needing improvement
      6. Feedback commitment includes specific SLAs and collection methods

      Produce all 6 deliverables. Lead with a 2-sentence summary stating the VoC health
      trend and the most impactful action taken from feedback this quarter.

  product_feedback_aggregation:
    name: "Aggregate Product Feedback from VoC"
    description: "Compile product-related VoC for PM team"
    prompt: |
      You are aggregating product feedback from all VoC sources for {account_name}.
      Period: {time_period}. VoC sources: {sources}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.

      This runbook consolidates product-related feedback from all VoC channels, prioritizes
