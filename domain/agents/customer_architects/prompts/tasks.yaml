# CA Agent Task Prompts
# Purpose: Full runbook prompts with numbered steps, named deliverables, and quality checks
# Reference: Personality defined in personalities/ca_personality.yaml
# Standard: feedback_runbook_prompt_standard.md

# ============================================================================
# ADOPTION ANALYSIS PROMPTS
# ============================================================================
adoption:

  adoption_health:
    name: "Solution Adoption Health Check"
    description: "Assess customer adoption of {vendor} solution"
    prompt: |
      You are assessing adoption health for {account_name} across their {vendor} deployment.
      Deployment age: {months_deployed} months. Licensed use cases: {use_cases}.
      Account state: {account_state}.
      Signal history for the last 30 days: {signal_history_30d}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook produces a comprehensive adoption health assessment that quantifies feature
      utilization, identifies underused capabilities, and recommends actions to deepen adoption.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      For each scoring dimension, assess data richness:
      - HIGH: telemetry, dashboards, 5+ data points
      - MEDIUM: partial data, 2-4 data points
      - LOW: no direct data, estimates only
      If 2+ dimensions score LOW, trigger ZERO-SIGNAL PIVOT (see below).
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      STEP 1: TEMPORAL PATTERN ANALYSIS
      Review signal_history_30d for this account. Identify:
      - Recurring patterns: same signal type appearing 3+ times
      - Trend direction: signal frequency increasing, stable, or decreasing
      - Escalation patterns: signals progressing from LOW to MEDIUM to HIGH severity
      - Correlation clusters: multiple signal types co-occurring within 7-day windows
      - Resolution effectiveness: were previous actions effective (signal stopped) or
        ineffective (signal recurred)?
      Deliverable: Temporal Pattern Analysis (Pattern | Signal Count | First Seen | Trend | Correlated Signals | Prior Action | Effective Y/N).

      STEP 2: COLLECT USAGE METRICS
      Extract all available usage data for {account_name}: login frequency, feature utilization
      rates, active users vs licensed users, API call volumes, and workflow execution counts.
      For each metric, capture the current value, the baseline (month 1), and the trend direction
      over the last 90 days.
      Deliverable: Usage Metrics table (Metric | Baseline | Current | Target | Trend | Gap %).

      STEP 3: MAP FEATURE ADOPTION
      List every licensed feature or module. For each, classify adoption as:
      ACTIVE (used weekly by 50%+ of target users), PARTIAL (used but below 50% penetration),
      DORMANT (configured but rarely used), UNDEPLOYED (not yet configured).
      Assign secondary flags where the signal spans multiple dimensions (e.g., a feature
      may be primarily PARTIAL but also flagged DORMANT for certain user groups).
      Note which user personas are driving or ignoring each feature.
      Deliverable: Feature Adoption Matrix (Feature | Status | Secondary Flags | Target Users | Actual Users | Persona Gap).

      STEP 4: IDENTIFY UNDERUTILIZED CAPABILITIES
      From DORMANT and UNDEPLOYED features in Step 3, determine why each is underutilized.
      Classify root cause: AWARENESS (users do not know it exists), SKILL (users lack training),
      PROCESS (no business process mapped), TECHNICAL (integration/config gap), RELEVANCE
      (feature does not fit current workflows).
      Assign secondary flags where the signal spans multiple dimensions (e.g., an adoption
      blocker may be primarily TECHNICAL but also flagged PROCESS and AWARENESS).
      Deliverable: Underutilization Analysis (Feature | Root Cause | Secondary Flags | Evidence | Unlock Action | Effort).

      STEP 5: ASSESS ADOPTION TRAJECTORY
      Using the trend data from Step 2, project adoption trajectory for the next 90 days.
      Classify the account trajectory as ACCELERATING, STEADY, PLATEAUING, or DECLINING.
      Assign secondary flags where the signal spans multiple dimensions (e.g., overall
      trajectory may be STEADY but flagged DECLINING for a specific user segment or feature area).
      Identify inflection points: events that caused adoption to spike or drop.
      Deliverable: Trajectory Assessment with classification, secondary flags, projection, and inflection events.

      STEP 6: CALCULATE ADOPTION HEALTH SCORE
      Score adoption health as HIGH / MEDIUM / LOW using these criteria:
      - HIGH: 70%+ features ACTIVE, usage trending up, no critical DORMANT features
      - MEDIUM: 40-69% features ACTIVE, usage stable, some DORMANT features with unlock potential
      - LOW: below 40% features ACTIVE, usage declining or plateauing, multiple UNDEPLOYED modules
      Assign secondary flags where the signal spans multiple dimensions (e.g., overall score
      may be MEDIUM but flagged LOW for a specific use case or user segment).
      Deliverable: Adoption Health Score with secondary flags and written justification referencing Steps 2-5.

      STEP 7: BUILD ADOPTION IMPROVEMENT PLAN
      From Steps 4 and 5, create a prioritized action plan. Sequence actions by impact
      (adoption uplift potential) and effort. Each action must specify: what to do, who owns it
      (CA, customer admin, support), timeline, and expected adoption impact.
      Deliverable: Improvement Plan (Priority | Action | Owner | Timeline | Prerequisites | Expected Impact | Churn Risk Reduction).

      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every metric has a specific number, not "good" or "low"
      2. Every feature is classified into exactly one adoption status with secondary flags where applicable
      3. Underutilization root causes are evidence-based, not assumed
      4. Trajectory classification references specific trend data
      5. Health score justification cites metrics from Step 2, not opinions
      6. Improvement actions have specific owners and timelines, not "the team" or "soon"
      7. Churn risk indicators are tied to specific adoption gaps
      8. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 8 deliverables. Lead with a 3-sentence executive summary stating the
      adoption health score, the biggest adoption gap (weakest point / lowest confidence area),
      and the single most urgent action.

  adoption_blockers:
    name: "Adoption Blocker Analysis"
    description: "Identify what's blocking customer adoption"
    prompt: |
      You are diagnosing adoption blockers for {account_name} where actual usage ({actual_usage})
      falls below expected usage ({expected_usage}).
      Account state: {account_state}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook identifies the root causes preventing adoption, classifies them by type,
      and produces a sequenced remediation plan with clear ownership.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: QUANTIFY THE ADOPTION GAP
      Compare expected vs actual usage across all measured dimensions: user count, feature
      utilization, workflow frequency, and data volume. Calculate the gap percentage for each
      dimension. Rank dimensions by gap severity.
      Deliverable: Adoption Gap table (Dimension | Expected | Actual | Gap % | Severity Rank).

      STEP 2: IDENTIFY BLOCKERS
      For each gap dimension from Step 1, investigate the root cause. Classify each blocker as:
      TECHNICAL (integration failure, performance issue, configuration gap),
      ORGANIZATIONAL (change management, staffing, competing priorities),
      KNOWLEDGE (training gaps, documentation issues, workflow unfamiliarity),
      PROCESS (no defined workflow, manual workaround preferred),
      VENDOR (product limitation, missing feature, API gap).
      Assign secondary flags where the signal spans multiple dimensions (e.g., a blocker
      may be primarily TECHNICAL but also flagged PROCESS and KNOWLEDGE).
      Deliverable: Blocker Inventory (Blocker | Type | Secondary Flags | Affected Dimension | Evidence | Duration Active).

      STEP 3: ASSESS BLOCKER IMPACT
      For each blocker in Step 2, determine: how many users are affected, what revenue or
      value is at risk, and whether this blocker is worsening, stable, or being partially
      worked around. Score impact as HIGH (blocks core use case), MEDIUM (limits expansion),
      LOW (cosmetic or workaround exists).
      Assign secondary flags where the signal spans multiple dimensions (e.g., impact
      may be primarily HIGH for one use case but MEDIUM for adjacent workflows).
      Deliverable: Impact Assessment (Blocker | Users Affected | Value at Risk | Trend | Impact Score | Secondary Flags).

      STEP 4: MAP QUICK WINS VS STRUCTURAL FIXES
      Separate blockers into quick wins (resolvable in under 2 weeks with existing resources)
      and structural fixes (requiring product changes, major config, or organizational shift).
      For quick wins, specify the exact action. For structural fixes, define the project scope.
      Deliverable: Resolution Map (Blocker | Category: Quick Win / Structural | Action | Resources Needed | Timeline).

      STEP 5: BUILD REMEDIATION PLAN
      Sequence all resolutions from Step 4. Quick wins first, then structural fixes ordered by
      impact score from Step 3. Assign ownership: CA actions, customer admin actions, {vendor}
      support actions, and escalation items. Include check-in cadence to verify resolution.
      Deliverable: Remediation Plan (Sequence | Action | Owner | Deadline | Prerequisites | Success Metric | Escalation Trigger).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every gap has a percentage, not "significant" or "below target"
      2. Blocker types are classified precisely with secondary flags where applicable, no "general" or "various" categories
      3. Quick wins have specific resolution actions, not "investigate" or "look into"
      4. Every remediation action has a named owner, not "the team"
      5. Impact scoring references affected user counts and value, not subjective judgment
      6. Duration active is stated in days or weeks, not "a while"
      7. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 6 deliverables. Lead with a 2-sentence summary stating the primary blocker
      type (with secondary flags), the weakest point / lowest confidence area, and the single
      highest-impact quick win.

  use_case_expansion:
    name: "Use Case Expansion Opportunity"
    description: "Identify new use case opportunities"
    prompt: |
      You are identifying expansion opportunities for {account_name} beyond their current
      use cases: {current_use_cases}. Customer business context: {business_context}.
      Account state: {account_state}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook produces a prioritized set of new use cases with business justification,
      complexity assessment, and a proposal approach for each.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: MAP CURRENT VALUE CHAIN
      Document how {account_name} currently uses {vendor} across each active use case.
      For each, capture: business process supported, users involved, value being generated,
      and integration points with other systems.
      Deliverable: Current Value Chain (Use Case | Business Process | Users | Value Generated | Integrations).

      STEP 2: IDENTIFY ADJACENT USE CASES
      Based on the current value chain from Step 1 and the customer's business context,
      identify adjacent use cases where {vendor} capabilities could extend. Consider:
      upstream/downstream processes, related departments, similar workflows in other
      business units, and complementary product modules not yet deployed.
      Deliverable: Expansion Candidates (Use Case | Business Area | Adjacency Type | Capability Required).

      STEP 3: ASSESS FIT AND VALUE
      For each candidate from Step 2, score fit (HIGH/MEDIUM/LOW) based on product capability
      match and customer readiness. Assign secondary flags where the signal spans multiple
      dimensions (e.g., fit may be primarily HIGH for capability match but flagged MEDIUM
      for customer readiness). Estimate business value: cost savings, efficiency gain,
      risk reduction, or revenue impact. Assign confidence level to each estimate:
      HIGH (confirmed data), MEDIUM (estimate from comparable accounts), LOW (benchmark only).
      Deliverable: Fit-Value Matrix (Use Case | Fit Score | Secondary Flags | Value Estimate | Value Type | Confidence).

      STEP 4: ASSESS COMPLEXITY AND PREREQUISITES
      For each viable candidate (MEDIUM or HIGH fit from Step 3), determine implementation
      complexity: integration requirements, data migration needs, training scope, change
      management effort, and timeline to first value. Identify prerequisites that must be
      met before starting.
      Deliverable: Complexity Assessment (Use Case | Complexity | Prerequisites | Time to First Value | Resources Required).

      STEP 5: IDENTIFY STAKEHOLDERS AND CHAMPIONS
      For each recommended use case, identify: the business owner who would benefit, the
      technical stakeholder who would implement, and potential champions who could advocate
      internally. Flag cases where no champion is identified as higher risk.
      Deliverable: Stakeholder Map (Use Case | Business Owner | Technical Lead | Champion | Champion Risk).

      STEP 6: BUILD PROPOSAL APPROACH
      For the top 3 expansion opportunities (ranked by value/complexity ratio), design a
      proposal approach: proof points from similar customers, demo scenario, pilot scope,
      success criteria, and ask for the customer meeting.
      Deliverable: Proposal Plan (Use Case | Proof Points | Demo Approach | Pilot Scope | Prerequisites | Success Criteria | Meeting Ask).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every value estimate has a confidence level, none are unqualified
      2. Adjacency to current use cases is explicit, not assumed
      3. Complexity assessments include specific resource requirements
      4. Stakeholder map identifies real roles, not generic titles
      5. Proposal approach includes proof points from comparable accounts
      6. No use cases recommended that require unshipped product capabilities without flagging
      7. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 7 deliverables. Lead with a 3-sentence executive summary stating the
      number of viable expansions, the highest-value opportunity (and the weakest point /
      lowest confidence area), and the single most urgent recommended action.

# ============================================================================
# CUSTOMER ARCHITECTURE PROMPTS
# ============================================================================
customer_architecture:

  architecture_discovery:
    name: "Customer Architecture Discovery"
    description: "Discover and document customer architecture"
    prompt: |
      You are conducting architecture discovery for {account_name} to document their
      technical landscape and {vendor} integration points.
      Information gathered so far: {gathered_info}.
      Account state: {account_state}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook produces a structured architecture map that documents infrastructure,
      integrations, dependencies, and risks to inform ongoing customer success activities.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: MAP INFRASTRUCTURE LANDSCAPE
      Document the customer's infrastructure: cloud providers, on-premises footprint,
      hybrid configuration, network topology relevant to {vendor}, and security
      architecture (SSO, identity provider, network segmentation).
      Deliverable: Infrastructure Summary (Layer | Technology | Provider | Hosting Model | Notes).

      STEP 2: DOCUMENT TECHNOLOGY STACK
      Catalog the customer's technology stack that interacts with or is adjacent to {vendor}.
      For each system, capture: name, vendor, version, role in the architecture, data it
      manages, and whether it integrates with {vendor} today.
      Deliverable: Technology Stack Registry (System | Vendor | Version | Role | Data Managed | {vendor} Integration Y/N).

      STEP 3: MAP INTEGRATION POINTS
      For each system that integrates with {vendor}, document: integration method (API, file
      transfer, webhook, native connector), data flow direction, data volume, frequency,
      and current health status. Flag any integrations running on deprecated APIs or
      unsupported configurations.
      Deliverable: Integration Map (System | Method | Direction | Volume | Frequency | Health | Deprecation Risk).

      STEP 4: IDENTIFY DEPENDENCIES AND CRITICALITY
      Determine which integrations and systems are critical path for the customer's use of
      {vendor}. Classify each dependency as: HARD (failure stops {vendor} usage),
      SOFT (degraded experience), or OPTIONAL (convenience only).
      Assign secondary flags where the signal spans multiple dimensions (e.g., a dependency
      may be primarily HARD for one workflow but SOFT for others).
      Note single points of failure.
      Deliverable: Dependency Matrix (Dependency | Type | Criticality | Secondary Flags | Single Point of Failure Y/N | Redundancy).

      STEP 5: ASSESS ARCHITECTURE RISKS
      From Steps 3-4, identify architecture risks: deprecated integrations, single points
      of failure, scalability constraints, security gaps, and compliance concerns. For each
      risk, estimate likelihood and impact.
      Deliverable: Architecture Risk Register (Risk | Category | Likelihood | Impact | Mitigation | Owner | Prerequisites).

      STEP 6: DOCUMENT FUTURE STATE INDICATORS
      Capture any known or planned changes to the customer's architecture: cloud migration
      plans, system replacements, new deployments, or organizational restructuring that
      would affect the {vendor} integration landscape.
      Deliverable: Future State Summary (Planned Change | Timeline | Impact on {vendor} | Action Required).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every integration has a specific method and direction, not "connected to"
      2. Dependencies are classified by criticality with secondary flags where applicable
      3. Risk register includes specific mitigation actions with prerequisites, not "monitor"
      4. Technology versions are captured where known, flagged as "unknown" where not
      5. Single points of failure are explicitly called out
      6. Future state changes include timeline estimates, not "eventually"
      7. No architecture component is listed without its role in the overall landscape
      8. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 7 deliverables. Lead with a 3-sentence executive summary stating the
      architecture complexity, the top risk (weakest point / lowest confidence area), and
      the single most urgent action required.

  change_impact:
    name: "Customer Architecture Change Impact"
    description: "Assess impact of customer architecture change"
    prompt: |
      You are assessing the impact of a planned architecture change at {account_name}:
      {change_description}. Current {vendor} integration: {integration_summary}.
      Account state: {account_state}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook produces an impact assessment that identifies what will break, what
      needs modification, and what actions both {vendor} and the customer must take.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: DOCUMENT THE CHANGE
      Capture the full scope of the planned change: what systems are affected, what is
      being added/removed/modified, the customer's timeline, and the business driver.
      Identify whether this is a migration, upgrade, replacement, or net-new deployment.
      Deliverable: Change Specification (Scope | Systems Affected | Change Type | Timeline | Business Driver).

      STEP 2: MAP AFFECTED INTEGRATION POINTS
      Cross-reference the change scope from Step 1 against the known {vendor} integration
      map. For each integration point, determine: will it break, require modification,
      or be unaffected? Classify impact as BREAKING (will fail), MODIFICATION (needs update),
      or NONE (no impact). Assign secondary flags where the signal spans multiple dimensions
      (e.g., an integration may be primarily MODIFICATION but flagged BREAKING for specific
      data flows or edge cases).
      Deliverable: Integration Impact table (Integration | Current State | Impact Classification | Secondary Flags | Detail).

      STEP 3: ASSESS DATA FLOW IMPACT
      For BREAKING and MODIFICATION integrations from Step 2, trace the data flow impact.
      Determine: what data will stop flowing, what transformations change, what downstream
      systems or reports will be affected, and whether data loss is possible during transition.
      Deliverable: Data Flow Impact (Integration | Data Affected | Downstream Impact | Data Loss Risk | Mitigation).

      STEP 4: DEFINE REQUIRED {vendor} ACTIONS
      For each affected integration, specify what {vendor} must do: configuration changes,
      API endpoint updates, connector upgrades, new integration development, or support
      case creation. Estimate effort for each action.
      Deliverable: {vendor} Action Plan (Action | Integration | Effort Estimate | Owner | Prerequisites | Dependency).

      STEP 5: BUILD TIMELINE ALIGNMENT
      Align {vendor} actions from Step 4 with the customer's change timeline. Identify
      conflicts: actions that cannot complete before the customer's go-live, testing windows
      required, and rollback procedures if issues arise. Flag whether SA involvement is
      needed for architecture review.
      Deliverable: Aligned Timeline (Phase | Customer Activity | {vendor} Activity | Deadline | SA Needed Y/N | Risk).

      STEP 6: ASSESS OVERALL RISK AND COMMUNICATE
      Calculate overall impact level: HIGH (core use case at risk), MEDIUM (partial
      degradation possible), LOW (cosmetic or minor adjustments). Assign secondary flags
      where the signal spans multiple dimensions (e.g., overall impact may be MEDIUM but
      flagged HIGH for specific integration paths).
      Draft a communication summary for the customer covering what they need to know and what you need from them.
      Deliverable: Impact Summary with risk level, secondary flags, customer communication draft, and escalation recommendation.

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every integration is classified as BREAKING, MODIFICATION, or NONE with secondary flags, none skipped
      2. Data loss risk is explicitly assessed for each affected flow
      3. Effort estimates use specific units (hours/days), not "some work"
      4. Timeline alignment identifies specific conflicts, not "might be tight"
      5. SA involvement is recommended with specific reason, not blanket "just in case"
      6. Customer communication draft is specific to their change, not a template
      7. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 7 deliverables. Lead with a 2-sentence summary stating the overall
      impact level, the weakest point / lowest confidence area, and the single most
      critical action required.

  integration_health:
    name: "Integration Health Assessment"
    description: "Assess health of customer-{vendor} integrations"
    prompt: |
      You are assessing integration health for {account_name} across their {vendor}
      integration landscape. Known integrations: {integration_list}.
      Account state: {account_state}.
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      This runbook produces a health assessment of all integrations, identifying issues,
      improvement opportunities, and risks requiring attention.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT → STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs
      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) + Run Mode declaration.

      STEP 1: INVENTORY ALL INTEGRATIONS
      List every active integration between {account_name} systems and {vendor}. For each,
      capture: integration name, source system, target system, method (API/webhook/file/native),
      data volume per day, and last verified working date.
      Deliverable: Integration Inventory (Name | Source | Target | Method | Daily Volume | Last Verified).

      STEP 2: ASSESS HEALTH STATUS
      For each integration from Step 1, assess current health: error rates (last 30 days),
      latency trends, data quality issues, and recent incidents. Classify health as
      GREEN (error rate below 1%, no incidents), YELLOW (error rate 1-5% or recent incident),
      RED (error rate above 5% or ongoing issue). Assign secondary flags where the signal
      spans multiple dimensions (e.g., an integration may be primarily GREEN for error rate
      but flagged YELLOW for latency trends).
      Deliverable: Health Status table (Integration | Error Rate | Latency | Data Quality | Incidents | Health | Secondary Flags).

      STEP 3: IDENTIFY ACTIVE ISSUES
      For YELLOW and RED integrations from Step 2, document the specific issues: error
      messages, failure patterns, data mismatches, and performance degradation details.
      Determine root cause for each: configuration drift, API version mismatch, capacity
      limits, or external system changes.
      Deliverable: Active Issues log (Integration | Issue | Root Cause | Duration | Affected Users | Workaround).

      STEP 4: ASSESS IMPROVEMENT OPPORTUNITIES
      Review all integrations for optimization potential: can batch processes become real-time?
      Can deprecated connectors be upgraded? Are there native connectors available to replace
      custom builds? Would additional integrations unlock new use cases?
      Deliverable: Improvement Opportunities (Integration | Opportunity | Benefit | Effort | Prerequisites | Priority).

      STEP 5: UPDATE RISK REGISTER
      From Steps 2-4, identify integration risks: aging connectors approaching end-of-life,
      single points of failure, unmonitored integrations, and scaling constraints as usage grows.
      Deliverable: Integration Risk Register (Risk | Integration | Likelihood | Impact | Mitigation | Prerequisites | SA Recommendation).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New risks added or existing risks resolved
      - Signals to append to recent history
      - Next actions to add or complete
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      1. Every integration has a specific error rate, not "occasional errors"
      2. Health classification follows the defined criteria precisely with secondary flags where applicable
      3. Root causes are specific technical findings, not "needs investigation"
      4. Improvement opportunities include effort estimates and prerequisites
      5. Risk mitigations are actionable, not "monitor closely"
      6. SA recommendations specify what technical expertise is needed
      7. Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Produce all 6 deliverables. Lead with a 3-sentence executive summary stating the
      overall integration health, the weakest point / lowest confidence area, and the
      single most urgent action.

