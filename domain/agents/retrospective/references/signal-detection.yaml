# Retrospective Signal Detection Reference
# Domain knowledge extracted to references/ per DDR-018

retrospective_triggers:
  win_signals:
    - "Deal closed-won"
    - "Successful POV completion"
    - "Competitive displacement"
    - "Expansion deal closed"

  loss_signals:
    - "Deal closed-lost"
    - "Deal marked no-decision"
    - "Customer chose competitor"
    - "Deal abandoned"

  priority_indicators:
    high:
      - "Strategic account"
      - "Large ARR (>$100K)"
      - "Competitive loss"
      - "Unusual circumstances"
    standard:
      - "Commercial account"
      - "Standard deal motion"

pattern_indicators:
  - "Same competitor winning repeatedly"
  - "Same objection recurring"
  - "Same feature gap cited"
  - "Same process step failing"
