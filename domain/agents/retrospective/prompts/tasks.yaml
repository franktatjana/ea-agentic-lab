# Retrospective Agent Task Prompts
# Purpose: Full runbook prompts with numbered steps, named deliverables, and quality checks
# Standard: docs/architecture/playbooks/runbook-design-principles.md
# Based on: Industry SA retrospective best practices

# ============================================================================
# WIN RETROSPECTIVE PROMPTS
# ============================================================================
win_retrospective:

  initiate_win_retro:
    name: "Initiate Win Retrospective"
    description: "Start structured retrospective for closed-won deal, validate inputs, gather deal timeline and key events, identify participants, and prepare analysis framework"
    prompt: |
      Context: Deal closed-won for {account_name}.
      Opportunity: {opportunity_name}
      ARR: {arr}
      Close date: {close_date}
      Sales cycle: {sales_cycle_days} days
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + top action; DISCOVERY = data gathering plan only. Default: FULL)

      You are initiating a win retrospective to capture what worked and why.
      Win retrospectives preserve institutional knowledge and create replicable
      playbooks. Every finding must trace to evidence. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: DEAL TIMELINE RECONSTRUCTION
      Reconstruct the deal timeline from available data.
      For each milestone:
      - Date and event description
      - Participants involved
      - Impact on deal progression
      - Evidence source (CRM, email, meeting notes)
      If {account_state} is empty: state that no account state baseline exists,
      note that timeline will be reconstructed from available inputs only, proceed
      without fabrication.
      Deliverable: Deal Timeline table (Date | Event | Participants | Impact |
      Evidence Source).

      STEP 2: PARTICIPANT IDENTIFICATION
      Identify all participants needed for the retrospective.
      For each participant:
      - Name and role
      - Involvement phase (discovery, POV, negotiation, close)
      - Perspective value: HIGH (directly influenced outcome), MEDIUM (contributed
        to specific phase), LOW (peripheral involvement)
      - Availability status if known
      Deliverable: Participant table (Name | Role | Phase | Perspective Value |
      Status).

      STEP 3: ANALYSIS FRAMEWORK PREPARATION
      Prepare the analysis framework for the retrospective.
      Categories to cover:
      - Value proposition alignment
      - Sales execution effectiveness
      - Technical validation quality
      - Competitive dynamics
      - Relationship and trust factors
      For each category:
      - Data sources to review
      - Questions to investigate
      - Evidence to gather before session
      Deliverable: Analysis Framework table (Category | Data Sources | Key Questions |
      Evidence to Gather).

      STEP 4: SESSION AGENDA (if synchronous retrospective needed)
      Design the retrospective session agenda.
      - Duration recommendation with rationale
      - Agenda items with time allocation
      - Facilitation notes
      - Pre-read materials to distribute
      If sufficient data exists for async analysis: state "Synchronous session
      optional, async analysis recommended based on data completeness."
      Deliverable: Session Agenda (Item | Duration | Facilitator Notes | Pre-Read).

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Retrospective status to set
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, run mode declared
      - Every timeline event traced to an evidence source
      - Participant perspective values include basis (not arbitrary)
      - Analysis framework covers all five categories
      - No participant or event fabricated, gaps stated explicitly
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, account state
        delta, and top action. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the data gathering plan (what
        evidence to collect, from whom, by when). Skip timeline and framework.
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) deal snapshot and retrospective readiness,
      (2) the weakest point or biggest data gap, and (3) the single most urgent
      action to take next.

  analyze_win_factors:
    name: "Analyze Win Factors"
    description: "Deep analysis of why we won across value proposition, sales execution, technical validation, competitive dynamics, and relationship factors with evidence-traced findings"
    prompt: |
      Context: Win retrospective for {account_name}.
      Deal history: {deal_history}
      POV results: {pov_results}
      Stakeholder map: {stakeholders}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + top 3 drivers; DISCOVERY = evidence gap analysis only. Default: FULL)

      You are analyzing the factors that drove this win. Every factor must be
      traced to evidence, not assumed. Replicability assessment determines which
      practices become playbook entries. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: VALUE PROPOSITION ANALYSIS
      Analyze which value propositions resonated and why.
      For each value driver:
      - Value proposition articulated
      - Customer response (quote or evidence)
      - Use case that drove the decision
      - Differentiation factor vs alternatives
      - Confidence: HIGH (customer explicitly confirmed), MEDIUM (inferred from
        behavior), LOW (team assumption without customer validation)
      If {deal_history} is empty: state that no deal history exists, note that
      value analysis will be limited to available inputs, proceed without fabrication.
      Deliverable: Value Proposition table (Value Driver | Customer Response |
      Use Case | Differentiator | Confidence | Evidence).

      STEP 2: SALES EXECUTION ANALYSIS
      Analyze which sales motions and tactics worked.
      For each execution factor:
      - Motion or tactic used
      - Effectiveness: HIGH / MEDIUM / LOW with basis
      - Discovery quality assessment
      - Stakeholder engagement depth
      - Timing and sequencing impact
      Deliverable: Sales Execution table (Tactic | Effectiveness | Basis |
      Stakeholder Impact | Timing Factor).

      STEP 3: TECHNICAL VALIDATION ANALYSIS
      Analyze how technical proof influenced the outcome.
      For each technical factor:
      - Proof point delivered (POV, demo, reference)
      - Customer reaction and feedback
      - Technical concerns raised and how addressed
      - Decisive technical moment (if identifiable)
      - Confidence: HIGH (directly cited by customer), MEDIUM (correlated with
        deal progression), LOW (assumed impact)
      If {pov_results} is empty: state that no POV results exist, note that
      technical validation analysis will be incomplete, proceed without fabrication.
      Deliverable: Technical Validation table (Proof Point | Customer Reaction |
      Concerns Addressed | Decisive? | Confidence | Evidence).

      STEP 4: COMPETITIVE DYNAMICS ANALYSIS
      Analyze competitive factors in the win.
      For each competitive dimension:
      - Competitor faced (if known)
      - Our competitive advantage in this deal
      - How objections were handled
      - Primary category: [FEATURE|PRICE|RELATIONSHIP|TRUST|TIMING|NO_COMPETITION]
        Secondary flags where multiple categories apply.
      - Confidence: HIGH (customer disclosed competitor details), MEDIUM (partial
        intel from deal team), LOW (inferred from market context)
      If no competitor was involved: state "No competitive displacement identified"
      and proceed to next step.
      Deliverable: Competitive Dynamics table (Dimension | Competitor | Our Advantage |
      Objection Handling | Category | Secondary Flags | Confidence).

      STEP 5: RELATIONSHIP AND TRUST ANALYSIS
      Analyze relationship factors that influenced the outcome.
      For each relationship factor:
      - Champion strength assessment: STRONG / MODERATE / WEAK with basis
      - Trust-building actions and their impact
      - Executive engagement contribution
      - Decision maker alignment
      - Confidence: HIGH (champion explicitly advocated), MEDIUM (inferred from
        access level), LOW (assumed from deal velocity)
      If {stakeholders} is empty: state that no stakeholder map exists, note that
      relationship analysis will be limited, proceed without fabrication.
      Deliverable: Relationship table (Factor | Assessment | Basis | Impact |
      Confidence | Evidence).

      STEP 6: WIN FACTOR SYNTHESIS
      Synthesize all analyses into a unified view.
      - Primary win drivers (top 3), each with:
        - Factor description
        - Evidence chain
        - Replicability: HIGH (process-driven, repeatable), MEDIUM (partially
          replicable, some context-dependent), LOW (lucky, not replicable)
        - Confidence: HIGH / MEDIUM / LOW with basis
      - What we should repeat (replicable practices)
      - What we got lucky on (not replicable, state why)
      - Competitive insights gained
      Deliverable: Win Factor Synthesis table (Category | Key Factor | Evidence |
      Replicability | Confidence).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Win factors to append
      - Competitive intelligence to log
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, run mode declared
      - Every win factor traced to specific evidence (not team opinion alone)
      - Confidence levels stated for every factor with explicit basis
      - Replicability assessments distinguish process-driven from circumstantial
      - Competitive analysis includes primary category + secondary flags
      - No factors fabricated, gaps stated explicitly
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, top 3 win
        drivers with evidence, and account state delta.
      - If run_mode is DISCOVERY: produce only the evidence gap analysis (what
        data is missing, where to get it, impact on analysis quality).
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the primary win driver and overall confidence
      profile, (2) the weakest point or lowest-confidence area, and (3) the single
      most urgent replicable practice to codify.

  document_win_learnings:
    name: "Document Win Learnings"
    description: "Create win retrospective document with replicable practices, competitive intelligence, and actionable recommendations for future deals"
    prompt: |
      Context: Completing win retrospective for {account_name}.
      Analysis findings: {analysis_summary}
      Team input: {team_feedback}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + key learnings + top action; DISCOVERY = documentation gap analysis only. Default: FULL)

      You are documenting win learnings for institutional knowledge capture.
      This document will be referenced by future deal teams facing similar
      scenarios. Every learning must be actionable. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: DEAL SNAPSHOT
      Create a structured deal snapshot for quick reference.
      - Account, ARR, sales cycle length, competitor faced
      - Deal type and segment
      - Key stakeholders and roles
      - Primary win driver (1 sentence)
      Deliverable: Deal Snapshot (structured key-value pairs).

      STEP 2: SUCCESS FACTORS SUMMARY
      Summarize success factors from analysis findings.
      For each factor:
      - Factor description
      - Category: [VALUE_PROP|SALES_EXECUTION|TECHNICAL|COMPETITIVE|RELATIONSHIP]
        Secondary flags where multiple categories apply.
      - Evidence supporting the factor
      - Replicability: HIGH / MEDIUM / LOW with basis
      - Confidence: HIGH / MEDIUM / LOW with basis
      If {analysis_summary} is empty: state that no analysis summary exists,
      note that success factors will be inferred from available context, proceed
      without fabrication.
      Deliverable: Success Factors table (Factor | Category | Secondary Flags |
      Evidence | Replicability | Confidence).

      STEP 3: REPLICABLE PRACTICES
      Extract practices that can be repeated in future deals.
      For each practice:
      - Practice description (actionable, specific)
      - Applicable scenario (when to use this)
      - Prerequisites: what must be true for this practice to work
      - Expected impact
      - Evidence from this deal
      Deliverable: Replicable Practices table (Practice | Scenario | Prerequisites |
      Expected Impact | Evidence).

      STEP 4: KEY LEARNINGS
      Extract universally applicable learnings.
      For each learning:
      - Learning statement (conclusion, not topic)
      - Category: [DISCOVERY|POSITIONING|DEMO|POV|NEGOTIATION|RELATIONSHIP|PROCESS]
      - Applicability: which deal types or segments benefit
      - Action item for future deals
      - Confidence: HIGH / MEDIUM / LOW with basis
      If {team_feedback} is empty: state that no team feedback exists, note that
      learnings are derived from analysis only, proceed without fabrication.
      Deliverable: Key Learnings table (Learning | Category | Applicability |
      Action | Confidence).

      STEP 5: COMPETITIVE INTELLIGENCE
      Extract competitive insights to log.
      For each insight:
      - Competitor name
      - Intelligence type: [POSITIONING|PRICING|FEATURE|TACTIC|MESSAGING]
      - Detail (specific, evidence-based)
      - Confidence: HIGH / MEDIUM / LOW with basis
      - Recommended action for CI team
      If no competitive dynamics existed: state "No competitive intelligence
      generated, deal was uncontested."
      Deliverable: Competitive Intelligence table (Competitor | Type | Detail |
      Confidence | Recommended Action).

      STEP 6: KNOWLEDGE SHARING PACKAGE
      Create anonymized content for broad distribution.
      - Anonymized situation description
      - Key learnings (numbered, context-free)
      - Recommendations for similar deals
      - Discussion questions for team sessions
      Deliverable: Knowledge Sharing Package (Situation | Learnings | Recommendations |
      Discussion Questions).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Learnings to append to knowledge base
      - CI entries to add
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, run mode declared
      - Every learning is actionable (contains specific action, not just observation)
      - Replicable practices include prerequisites column
      - Confidence levels stated for every factor and learning with basis
      - Competitive intelligence includes evidence, not assumptions
      - Knowledge sharing package is properly anonymized
      - No learnings fabricated, gaps stated explicitly
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, top 5 key
        learnings, and account state delta.
      - If run_mode is DISCOVERY: produce only the documentation gap analysis
        (what information is missing for a complete retrospective document).
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the primary win driver and deal outcome value,
      (2) the weakest documented area or lowest-confidence learning, and (3) the
      single most important practice to codify for future deals.

# ============================================================================
# LOSS RETROSPECTIVE PROMPTS
# ============================================================================
loss_retrospective:

  initiate_loss_retro:
    name: "Initiate Loss Retrospective"
    description: "Start structured blameless retrospective for closed-lost deal, validate inputs, reconstruct timeline, and identify inflection points"
    prompt: |
      Context: Deal closed-lost for {account_name}.
      Opportunity: {opportunity_name}
      ARR: {arr}
      Loss date: {close_date}
      Loss reason (CRM): {loss_reason}
      Competitor: {competitor}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + top action; DISCOVERY = data gathering plan only. Default: FULL)

      You are initiating a loss retrospective to understand what happened and
      extract preventable lessons. This is a blameless analysis focused on process
      improvement, not individual fault. Every finding must trace to evidence.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: INITIAL LOSS CLASSIFICATION
      Classify the loss using structured categories.
      - Primary loss type: [COMPETITOR|NO_DECISION|TECHNICAL|COMMERCIAL|RELATIONSHIP|TIMING]
        Secondary flags where multiple categories apply.
      - CRM loss reason validation: does {loss_reason} align with available evidence?
        If misaligned, flag discrepancy with evidence.
      - Confidence: HIGH (customer provided explicit feedback), MEDIUM (inferred
        from deal behavior), LOW (CRM reason only, no validation)
      If {loss_reason} is empty: state that no CRM loss reason exists, note that
      classification will depend on other evidence, proceed without fabrication.
      Deliverable: Loss Classification (Primary Type | Secondary Flags | CRM Alignment |
      Confidence | Evidence).

      STEP 2: DEAL TIMELINE WITH INFLECTION POINTS
      Reconstruct the deal timeline and identify where momentum was lost.
      For each milestone:
      - Date and event description
      - Momentum indicator: POSITIVE / NEUTRAL / NEGATIVE
      - Inflection point flag: YES / NO
      - Evidence source (CRM, email, meeting notes)
      Highlight the tipping point where the deal shifted toward loss.
      Deliverable: Deal Timeline table (Date | Event | Momentum | Inflection? |
      Evidence Source) with tipping point annotation.

      STEP 3: PARTICIPANT IDENTIFICATION
      Identify all participants needed for the blameless retrospective.
      For each participant:
      - Name and role
      - Involvement phase
      - Perspective value: HIGH / MEDIUM / LOW with basis
      - Availability status if known
      Deliverable: Participant table (Name | Role | Phase | Perspective Value |
      Status).

      STEP 4: BLAMELESS ANALYSIS FRAMEWORK
      Prepare the blameless analysis framework.
      - Ground rules for blameless retrospective
      - Categories to investigate with specific questions
      - Data sources to review before analysis
      - Evidence to gather from participants
      Deliverable: Analysis Framework (Category | Questions | Data Sources |
      Evidence Needed) + Blameless Ground Rules.

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Loss classification to set
      - Retrospective status to set
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, run mode declared
      - Loss classification includes primary + secondary flags with evidence
      - CRM loss reason validated against evidence, discrepancies flagged
      - Timeline identifies at least one inflection point or states none found
      - Blameless framework uses objective language, no individual blame
      - Confidence levels stated for every classification with basis
      - No events fabricated, gaps stated explicitly
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, loss
        classification, and top action. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the data gathering plan (what
        evidence to collect, from whom, by when). Skip timeline and framework.
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) loss classification and deal value impact,
      (2) the weakest point or biggest evidence gap, and (3) the single most
      urgent action to take next.

  analyze_loss_factors:
    name: "Analyze Loss Factors"
    description: "Deep blameless analysis of why we lost across loss classification, competitive dynamics, sales process, technical evaluation, and commercial factors"
    prompt: |
      Context: Loss retrospective for {account_name}.
      Deal history: {deal_history}
      Loss reason: {loss_reason}
      Competitor: {competitor}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + top 3 loss drivers; DISCOVERY = evidence gap analysis only. Default: FULL)

      You are analyzing the factors that drove this loss. This is blameless
      analysis: focus on process, information, and execution gaps rather than
      individual fault. Every factor must be traced to evidence and classified
      as controllable or uncontrollable. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: LOSS CLASSIFICATION DEEP DIVE
      Validate and deepen the loss classification.
      - Primary loss type: [COMPETITOR|NO_DECISION|TECHNICAL|COMMERCIAL|RELATIONSHIP|TIMING]
        Secondary flags where multiple categories apply.
      - When momentum was lost (specific date or phase)
      - Tipping point event with evidence
      - Confidence: HIGH (customer confirmed), MEDIUM (inferred from evidence),
        LOW (team assumption)
      Deliverable: Loss Classification Detail (Type | Secondary Flags | Tipping Point |
      Evidence | Confidence).

      STEP 2: COMPETITIVE ANALYSIS (if applicable)
      Analyze competitive factors in the loss.
      For each competitive dimension:
      - Who won the deal (if known)
      - What competitor did better (specific, evidence-based)
      - Features or capabilities that were decisive
      - Price/value comparison if available
      - Confidence: HIGH (customer disclosed details), MEDIUM (partial intel),
        LOW (market inference)
      If {competitor} is empty or unknown: state "Competitor unknown, competitive
      analysis limited to inferred signals" and proceed with available evidence.
      Deliverable: Competitive Analysis table (Dimension | Competitor Approach |
      Our Approach | Gap | Confidence | Evidence).

      STEP 3: SALES PROCESS REVIEW
      Review sales process execution for gaps.
      For each process dimension:
      - Qualification quality: did we qualify properly?
      - Stakeholder engagement: did we engage the right people?
      - Warning signs: what signals did we miss?
      - Sales motion fit: was our approach appropriate for this deal?
      - Controllable: YES (we could have acted differently) / NO (external factor)
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Sales Process Review table (Dimension | Assessment | Warning Signs |
      Controllable | Confidence | Evidence).

      STEP 4: TECHNICAL EVALUATION REVIEW
      Review technical evaluation for gaps.
      For each technical dimension:
      - Unmet technical requirements (specific)
      - POV/POC performance vs expectations
      - Technical objections not overcome (list each)
      - Technical fit assessment: FIT / PARTIAL_FIT / MISFIT with basis
      - Controllable: YES / NO
      - Confidence: HIGH / MEDIUM / LOW with basis
      If no POV/POC occurred: state "No technical evaluation conducted, assess
      whether this was a contributing factor."
      Deliverable: Technical Evaluation table (Dimension | Assessment | Unmet
      Requirements | Controllable | Confidence | Evidence).

      STEP 5: COMMERCIAL FACTOR REVIEW
      Review commercial and pricing factors.
      For each commercial dimension:
      - Pricing competitiveness assessment
      - Terms acceptability
      - Value demonstration quality
      - ROI clarity for decision makers
      - Controllable: YES / NO
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Commercial Review table (Dimension | Assessment | Controllable |
      Confidence | Evidence).

      STEP 6: LOSS FACTOR SYNTHESIS
      Synthesize all analyses into a unified view.
      - Primary loss drivers (top 3), each with:
        - Factor description
        - Evidence chain
        - Controllable: YES / NO
        - What we could have done differently (if controllable)
        - Confidence: HIGH / MEDIUM / LOW with basis
      - Warning signs we missed (specific signals with dates)
      - What was outside our control (market, timing, competitor strength)
      - Competitive insights gained
      Deliverable: Loss Factor Synthesis table (Category | Factor | Evidence |
      Controllable | Alternative Action | Confidence).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Loss factors to append
      - Competitive intelligence to log
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, run mode declared
      - Every loss factor traced to specific evidence (not team blame)
      - Blameless language used throughout (process gaps, not people failures)
      - Confidence levels stated for every factor with explicit basis
      - Controllable/uncontrollable distinction made for every factor
      - Competitive analysis includes primary category + secondary flags
      - Warning signs include specific dates or phases when observable
      - No factors fabricated, gaps stated explicitly
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, top 3 loss
        drivers with evidence, and account state delta.
      - If run_mode is DISCOVERY: produce only the evidence gap analysis (what
        data is missing, where to get it, impact on analysis quality).
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the primary loss driver and controllability
      assessment, (2) the weakest point or lowest-confidence area, and (3) the
      single most urgent process change to prevent recurrence.

  document_loss_learnings:
    name: "Document Loss Learnings"
    description: "Create blameless loss retrospective document with root cause analysis, process improvements, competitive intelligence, and resurrection assessment"
    prompt: |
      Context: Completing loss retrospective for {account_name}.
      Analysis findings: {analysis_summary}
      Team input: {team_feedback}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + key learnings + top action; DISCOVERY = documentation gap analysis only. Default: FULL)

      You are documenting loss learnings for institutional knowledge capture.
      This document must be blameless, evidence-based, and actionable. Future
      deal teams will reference this to avoid repeating mistakes. Follow these
      steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: DEAL SNAPSHOT
      Create a structured deal snapshot for quick reference.
      - Account, ARR, sales cycle length, competitor, loss type
      - Deal type and segment
      - Key stakeholders and roles
      - Primary loss driver (1 sentence)
      Deliverable: Deal Snapshot (structured key-value pairs).

      STEP 2: TIMELINE OF KEY EVENTS
      Document the timeline of key events leading to the loss.
      For each event:
      - Date and description
      - Momentum impact: POSITIVE / NEUTRAL / NEGATIVE
      - Inflection point: YES / NO
      - Evidence source
      Deliverable: Key Events Timeline (Date | Event | Momentum | Inflection |
      Evidence Source).

      STEP 3: ROOT CAUSE ANALYSIS
      Perform root cause analysis using 5 Whys methodology.
      - Surface reason (what happened)
      - Why 1 through Why 5 (each with evidence)
      - Root cause statement
      - Confidence: HIGH (evidence supports all 5 levels), MEDIUM (evidence
        supports 3-4 levels), LOW (fewer than 3 levels evidenced)
      If evidence is insufficient for full 5 Whys: state the level at which
      evidence runs out, do not fabricate deeper levels.
      Deliverable: Root Cause Analysis (Level | Why | Evidence | Confidence).

      STEP 4: LEARNINGS EXTRACTION
      Extract actionable learnings from the loss.
      For each learning:
      - Learning statement (conclusion, not topic)
      - Category: [QUALIFICATION|DISCOVERY|POSITIONING|TECHNICAL|COMMERCIAL|PROCESS]
        Secondary flags where multiple categories apply.
      - Preventable: YES (process change would have helped) / NO (external factor)
      - Recommendation (specific, actionable)
      - Confidence: HIGH / MEDIUM / LOW with basis
      If {team_feedback} is empty: state that no team feedback exists, note that
      learnings are derived from analysis only, proceed without fabrication.
      Deliverable: Learnings table (Learning | Category | Secondary Flags |
      Preventable | Recommendation | Confidence).

      STEP 5: PROCESS IMPROVEMENTS
      Recommend specific process improvements.
      For each improvement:
      - Improvement description
      - Pattern addressed (which loss factor it prevents)
      - Prerequisites: what must change for this to work
      - Expected impact: HIGH / MEDIUM / LOW
      - Implementation effort: HIGH / MEDIUM / LOW
      - Owner recommendation
      Deliverable: Process Improvements table (Improvement | Pattern Addressed |
      Prerequisites | Impact | Effort | Owner).

      STEP 6: COMPETITIVE INTELLIGENCE
      Extract competitive insights to log.
      For each insight:
      - Competitor name
      - Intelligence type: [POSITIONING|PRICING|FEATURE|TACTIC|MESSAGING]
      - Detail (specific, evidence-based)
      - Confidence: HIGH / MEDIUM / LOW with basis
      - Recommended action for CI team
      If no competitive dynamics existed: state "No competitive intelligence
      generated, loss was not competitor-driven."
      Deliverable: Competitive Intelligence table (Competitor | Type | Detail |
      Confidence | Recommended Action).

      STEP 7: PRODUCT FEEDBACK
      Document product-related feedback if applicable.
      - Feature gap description (specific)
      - Customer requirement that was unmet
      - Competitive comparison on this feature
      - Business impact (deals affected, ARR)
      - Suggested priority: [CRITICAL|HIGH|MEDIUM|LOW] with basis
      If no product gap contributed: state "No product feedback generated, loss
      was not feature-driven."
      Deliverable: Product Feedback (Gap | Requirement | Competitive Comparison |
      Impact | Priority | Basis).

      STEP 8: RESURRECTION POTENTIAL ASSESSMENT
      Assess whether this deal can be resurrected.
      - Resurrection likelihood: HIGH / MEDIUM / LOW / NONE with basis
      - Conditions that would need to change
      - Recommended timeline for re-engagement
      - Actions to take now to preserve the relationship
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Resurrection Assessment (Likelihood | Conditions | Timeline |
      Immediate Actions | Confidence).

      STEP 9: KNOWLEDGE SHARING PACKAGE
      Create anonymized content for broad distribution.
      - Anonymized situation description
      - Key learnings (numbered, context-free)
      - Recommendations for similar deals
      - Discussion questions for team sessions
      Deliverable: Knowledge Sharing Package (Situation | Learnings | Recommendations |
      Discussion Questions).

      STEP 10: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Learnings to append to knowledge base
      - CI entries to add
      - Product feedback to log
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, run mode declared
      - Blameless language used throughout (no individual blame, process focus)
      - Root cause analysis stops at evidence boundary, no fabrication
      - Every learning is actionable (contains specific recommendation)
      - Process improvements include prerequisites column
      - Confidence levels stated for every finding with basis
      - Competitive intelligence based on evidence, not assumptions
      - Resurrection assessment includes conditions and timeline
      - Knowledge sharing package is properly anonymized
      - No findings fabricated, gaps stated explicitly
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, top 5 key
        learnings, resurrection assessment, and account state delta.
      - If run_mode is DISCOVERY: produce only the documentation gap analysis
        (what information is missing for a complete retrospective document).
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the root cause and controllability, (2) the
      weakest documented area or lowest-confidence finding, and (3) the single
      most urgent process change to implement.

  competitive_loss_deep_dive:
    name: "Competitive Loss Deep Dive"
    description: "Detailed analysis when lost to specific competitor, covering tactics, pricing, messaging, feature gaps, and counter-positioning recommendations"
    prompt: |
      Context: Lost to {competitor} at {account_name}.
      Competitor details: {competitor_info}
      Customer feedback: {customer_feedback}
      Our positioning: {our_positioning}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + decisive factors + top counter-move; DISCOVERY = intelligence gap analysis only. Default: FULL)

      You are conducting a deep dive on a competitive loss. This analysis feeds
      the CI team's competitive playbooks and informs counter-positioning for
      future encounters. Every claim about the competitor must trace to evidence.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: COMPETITOR APPROACH ANALYSIS
      Analyze the competitor's approach across key dimensions.
      For each dimension:
      - Dimension: [PRODUCT|PRICING|MESSAGING|SALES_MOTION|TECHNICAL|RELATIONSHIP]
      - Their approach (specific, evidence-based)
      - Our approach in comparison
      - Gap identified
      - Confidence: HIGH (customer disclosed), MEDIUM (inferred from feedback),
        LOW (market assumption)
      If {competitor_info} is empty: state that no competitor details exist, note
      that analysis will be limited to customer feedback and inference, proceed
      without fabrication.
      Deliverable: Competitor Approach table (Dimension | Their Approach |
      Our Approach | Gap | Confidence | Evidence).

      STEP 2: DECISIVE FACTORS IDENTIFICATION
      Identify the factors that won it for the competitor.
      For each decisive factor:
      - Factor description
      - Category: [FEATURE|PRICE|RELATIONSHIP|TRUST|TIMING|INTEGRATION|BRAND]
        Secondary flags where multiple categories apply.
      - Evidence supporting this was decisive
      - Controllable by us: YES / NO with explanation
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Decisive Factors table (Factor | Category | Secondary Flags |
      Evidence | Controllable | Confidence).

      STEP 3: MESSAGING AND POSITIONING ANALYSIS
      Analyze competitor messaging that resonated with the customer.
      For each messaging dimension:
      - Message or positioning theme
      - Customer reaction (quote or behavioral evidence)
      - Our counter-message (what we said)
      - Effectiveness comparison
      - Confidence: HIGH (customer quoted competitor messaging), MEDIUM (inferred
        from customer responses), LOW (assumed from market positioning)
      If {customer_feedback} is empty: state that no customer feedback exists,
      note that messaging analysis will be limited, proceed without fabrication.
      Deliverable: Messaging Analysis table (Theme | Customer Reaction |
      Our Counter-Message | Effectiveness | Confidence | Evidence).

      STEP 4: PRICING AND COMMERCIAL COMPARISON
      Compare pricing and commercial terms.
      - Pricing model comparison (if known)
      - Value perception difference
      - Terms and conditions comparison
      - TCO comparison (if available)
      - Confidence: HIGH (customer disclosed pricing), MEDIUM (partial pricing
        intel), LOW (estimated from market data)
      If pricing information is unavailable: state "Pricing intelligence not
      available, recommend post-loss debrief to gather."
      Deliverable: Commercial Comparison (Dimension | Competitor | Us | Gap |
      Confidence).

      STEP 5: FEATURE AND CAPABILITY GAP ANALYSIS
      Identify specific feature or capability gaps exploited.
      For each gap:
      - Feature or capability
      - Competitor offering
      - Our offering (or absence)
      - Customer priority level: MUST_HAVE / IMPORTANT / NICE_TO_HAVE
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Feature Gap table (Feature | Competitor | Us | Customer
      Priority | Confidence | Evidence).

      STEP 6: RELATIONSHIP DYNAMICS ASSESSMENT
      Assess relationship factors in the competitive loss.
      - Champion access: did competitor have stronger champion?
      - Executive engagement: who engaged at what level?
      - Trust signals observed
      - Incumbent advantage (if applicable)
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Relationship Dynamics (Factor | Competitor Advantage |
      Our Position | Gap | Confidence | Evidence).

      STEP 7: COUNTER-POSITIONING RECOMMENDATIONS
      Develop recommendations for future encounters with this competitor.
      For each recommendation:
      - Recommendation (specific, actionable)
      - Gap it addresses
      - Prerequisites: what must be true for this to work
      - Expected impact
      - Urgency: IMMEDIATE / NEXT_QUARTER / STRATEGIC
      Deliverable: Counter-Positioning table (Recommendation | Gap Addressed |
      Prerequisites | Expected Impact | Urgency).

      STEP 8: CI AGENT UPDATE CONTENT
      Prepare structured content for CI Agent ingestion.
      - Competitor profile updates
      - Battle card updates
      - Pricing intelligence updates
      - Win/loss pattern updates
      Deliverable: CI Update Package (Section | Content | Confidence | Source).

      STEP 9: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Competitive intelligence to log
      - Counter-positioning to add
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, run mode declared
      - Every competitor claim traced to evidence (customer feedback, market data)
      - Confidence levels stated for every comparison with basis
      - Decisive factors include primary category + secondary flags
      - Counter-positioning recommendations include prerequisites column
      - No competitor capabilities fabricated, gaps stated explicitly
      - Feature gaps distinguish customer-confirmed from team-assumed
      - CI update content is structured for agent ingestion
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, decisive
        factors, top counter-move, and account state delta.
      - If run_mode is DISCOVERY: produce only the intelligence gap analysis
        (what competitor intel is missing, how to gather it).
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the decisive competitive factor and confidence
      level, (2) the weakest point in our competitive intelligence, and (3) the
      single most urgent counter-positioning action.

# ============================================================================
# PATTERN ANALYSIS PROMPTS
# ============================================================================
pattern_analysis:

  identify_patterns:
    name: "Identify Patterns Across Retrospectives"
    description: "Find recurring patterns in wins and losses across retrospectives, classify by segment and competitor, and identify emerging and declining patterns"
    prompt: |
      Context: Analyzing retrospectives from {time_period}.
      Win retrospectives: {win_count}
      Loss retrospectives: {loss_count}
      Retrospective data: {retrospective_summaries}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + top patterns + top action; DISCOVERY = data sufficiency analysis only. Default: FULL)

      You are identifying recurring patterns across retrospectives. Patterns
      become actionable when they recur with sufficient frequency and evidence.
      Single observations are data points, not patterns. Follow these steps
      in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Data Sufficiency Check: assess whether the retrospective corpus is large
      enough for pattern detection.
      - Minimum for pattern claims: 3+ retrospectives showing the same factor
      - Minimum for trend claims: 2+ time periods with comparable data
      - If fewer than 5 total retrospectives: state "INSUFFICIENT DATA FOR
        ROBUST PATTERN ANALYSIS" and flag which findings are preliminary.

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Data Sufficiency Assessment + Run Mode declaration.

      STEP 1: WIN PATTERN IDENTIFICATION
      Identify recurring factors across win retrospectives.
      For each pattern:
      - Pattern description (specific behavior or factor)
      - Frequency: count of retrospectives where this appeared
      - Segments where observed
      - Pattern strength: STRONG (5+ occurrences), MODERATE (3-4 occurrences),
        EMERGING (2 occurrences), INSUFFICIENT DATA FOR PATTERN (1 occurrence)
      - Confidence: HIGH (consistent evidence across retrospectives), MEDIUM
        (evidence present but inconsistent), LOW (inferred from limited data)
      If {win_count} is 0: state "No win retrospectives available for pattern
      analysis" and skip to Step 2.
      Deliverable: Win Patterns table (Pattern | Frequency | Segments | Strength |
      Confidence | Evidence Sources).

      STEP 2: LOSS PATTERN IDENTIFICATION
      Identify recurring factors across loss retrospectives.
      For each pattern:
      - Pattern description (specific behavior or gap)
      - Frequency: count of retrospectives where this appeared
      - Segments where observed
      - Pattern severity: CRITICAL (5+ occurrences, high impact), SIGNIFICANT
        (3-4 occurrences), EMERGING (2 occurrences), INSUFFICIENT DATA FOR
        PATTERN (1 occurrence)
      - Controllable: YES / NO
      - Confidence: HIGH / MEDIUM / LOW with basis
      If {loss_count} is 0: state "No loss retrospectives available for pattern
      analysis" and skip to Step 3.
      Deliverable: Loss Patterns table (Pattern | Frequency | Segments | Severity |
      Controllable | Confidence | Evidence Sources).

      STEP 3: COMPETITOR PATTERN IDENTIFICATION
      Identify competitor-specific patterns across retrospectives.
      For each competitor:
      - Win pattern against this competitor (if sufficient data)
      - Loss pattern against this competitor (if sufficient data)
      - Trend: IMPROVING / STABLE / DECLINING / INSUFFICIENT DATA FOR TREND
        A trend claim requires 2+ time periods with comparable data. A single
        period observation = INSUFFICIENT DATA FOR TREND.
      - Confidence: HIGH / MEDIUM / LOW with basis
      If no competitor data exists: state "No competitor-specific patterns
      identifiable from available retrospectives."
      Deliverable: Competitor Patterns table (Competitor | Win Pattern |
      Loss Pattern | Trend | Data Points | Confidence).

      STEP 4: SEGMENT AND INDUSTRY PATTERNS
      Identify patterns specific to segments or industries.
      For each segment/industry:
      - Win factors unique to this segment
      - Loss factors unique to this segment
      - Recommended approach adjustments
      - Confidence: HIGH / MEDIUM / LOW with basis
      If segment data is insufficient: state which segments lack data and
      recommend minimum retrospective count for analysis.
      Deliverable: Segment Patterns table (Segment | Win Factors | Loss Factors |
      Approach Adjustments | Confidence).

      STEP 5: EMERGING AND DECLINING PATTERNS
      Identify patterns that are new or fading.
      - Emerging patterns: factors appearing in recent retrospectives but not
        in earlier ones (requires 2+ time periods to establish)
      - Declining patterns: factors that were common but are now rare
        (requires 2+ time periods to establish)
      - For each: state data points supporting the emergence/decline claim
      If only one time period of data exists: state "INSUFFICIENT DATA FOR
      TREND ANALYSIS, single period only."
      Deliverable: Emerging Patterns table (Pattern | First Observed | Recent
      Frequency | Data Points) + Declining Patterns table (Pattern | Peak
      Frequency | Recent Frequency | Data Points).

      STEP 6: RECOMMENDED FOCUS AREAS
      Synthesize patterns into recommended focus areas.
      For each recommendation:
      - Focus area description
      - Patterns supporting this recommendation
      - Prerequisites: what must change to address this
      - Expected impact: HIGH / MEDIUM / LOW
      - Urgency: IMMEDIATE / NEXT_QUARTER / STRATEGIC
      Deliverable: Focus Areas table (Area | Supporting Patterns | Prerequisites |
      Impact | Urgency).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Patterns to append to knowledge base
      - Focus areas to add
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, data sufficiency assessed, run mode declared
      - Pattern claims require 3+ occurrences (2 occurrences = EMERGING only)
      - Single observations labeled as data points, not patterns
      - Trend claims require 2+ time periods with comparable data
      - Single-period observations marked INSUFFICIENT DATA FOR TREND
      - Confidence levels stated for every pattern with basis
      - Competitor patterns distinguish data-supported from inferred
      - Emerging/declining designations include data point counts
      - No patterns fabricated from insufficient data
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, top 3 win
        patterns, top 3 loss patterns, and top focus area.
      - If run_mode is DISCOVERY: produce only the data sufficiency analysis
        (what retrospective data is needed for robust pattern detection).
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the dominant win and loss patterns with
      confidence, (2) the weakest data area or lowest-confidence pattern claim,
      and (3) the single most urgent focus area to address.

  trend_analysis:
    name: "Retrospective Trend Analysis"
    description: "Analyze trends in win/loss patterns over time, track recommendation implementation, and identify improving and declining areas"
    prompt: |
      Context: Trend analysis for {time_period}.
      Historical patterns: {historical_patterns}
      Recent retrospectives: {recent_data}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + trend summary + top action; DISCOVERY = data gap analysis only. Default: FULL)

      You are analyzing trends in retrospective patterns over time. Trend claims
      are only valid when supported by two or more comparable time periods.
      Single-period observations are data points, not trends. Follow these steps
      in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Trend Data Validation: assess whether sufficient time periods exist for
      trend claims.
      - Minimum for trend: 2 comparable time periods
      - Minimum for strong trend: 3+ comparable time periods
      - If only 1 time period: all findings are BASELINE, not trends
      If {historical_patterns} is empty: state "No historical baseline exists,
      this analysis establishes baseline only. All findings are single-period
      observations, not trends."

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Trend Data Validation + Run Mode declaration.

      STEP 1: PATTERN TRAJECTORY ANALYSIS
      Track how each identified pattern has changed over time.
      For each pattern:
      - Pattern name
      - Previous period value (frequency, severity, or strength)
      - Current period value
      - Trajectory: IMPROVING / STABLE / DECLINING / NEW / INSUFFICIENT DATA
        FOR TREND
      - Data points supporting the trajectory claim (minimum 2 required)
      - Confidence: HIGH (3+ periods, consistent direction), MEDIUM (2 periods),
        LOW (single period, trajectory assumed)
      Deliverable: Pattern Trajectory table (Pattern | Previous | Current |
      Trajectory | Data Points | Confidence).

      STEP 2: RECOMMENDATION IMPLEMENTATION TRACKING
      Track whether previous recommendations were implemented and their impact.
      For each recommendation:
      - Recommendation description
      - Source retrospective
      - Implementation status: IMPLEMENTED / IN_PROGRESS / BLOCKED / NOT_STARTED
      - Impact observed (if implemented): POSITIVE / NEUTRAL / NEGATIVE / TOO_EARLY
      - Evidence of impact
      - Confidence: HIGH / MEDIUM / LOW with basis
      If no previous recommendations exist: state "No prior recommendations to
      track, this analysis establishes baseline."
      Deliverable: Implementation Tracking table (Recommendation | Source |
      Status | Impact | Evidence | Confidence).

      STEP 3: IMPROVING AREAS
      Identify areas showing improvement over time.
      For each improving area:
      - Area description
      - Evidence of improvement (specific metrics or observations)
      - Data points: period 1 value, period 2 value (minimum 2 required)
      - Contributing factors (what drove the improvement)
      - Sustainability assessment: SUSTAINABLE / AT_RISK / UNCERTAIN
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Improving Areas table (Area | Evidence | Period 1 | Period 2 |
      Contributing Factors | Sustainability | Confidence).

      STEP 4: DECLINING AREAS
      Identify areas showing decline over time.
      For each declining area:
      - Area description
      - Evidence of decline (specific metrics or observations)
      - Data points: period 1 value, period 2 value (minimum 2 required)
      - Root cause hypothesis with evidence
      - Urgency: CRITICAL / HIGH / MEDIUM / LOW
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Declining Areas table (Area | Evidence | Period 1 | Period 2 |
      Root Cause | Urgency | Confidence).

      STEP 5: SEASONAL OR CYCLICAL PATTERNS
      Identify any seasonal or cyclical patterns.
      - Requires 3+ comparable periods (e.g., 3 quarters, 3 years) to claim
        seasonality
      - For each candidate pattern: state data points and whether cycle is
        confirmed or hypothesized
      If fewer than 3 comparable periods: state "INSUFFICIENT DATA FOR
      SEASONAL PATTERN ANALYSIS."
      Deliverable: Seasonal Patterns table (Pattern | Periods Observed |
      Cycle Length | Status | Confidence) or insufficiency statement.

      STEP 6: RECOMMENDATIONS FOR NEXT PERIOD
      Generate recommendations based on trend analysis.
      For each recommendation:
      - Recommendation (specific, actionable)
      - Trend it addresses
      - Prerequisites: what must be true for this to work
      - Expected impact: HIGH / MEDIUM / LOW
      - Priority: IMMEDIATE / NEXT_QUARTER / STRATEGIC
      Deliverable: Recommendations table (Recommendation | Trend Addressed |
      Prerequisites | Impact | Priority).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Trend data to append
      - Recommendations to add
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, trend data validated, run mode declared
      - Every trend claim supported by 2+ data points from different periods
      - Single-period observations labeled BASELINE or INSUFFICIENT DATA FOR TREND
      - Seasonal claims require 3+ comparable periods
      - Implementation tracking distinguishes impact from correlation
      - Confidence levels stated for every trajectory with basis
      - Improving/declining areas include specific period-over-period data
      - No trends fabricated from insufficient data
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, trend summary
        (improving/stable/declining counts), and top action.
      - If run_mode is DISCOVERY: produce only the data gap analysis (what
        historical data is needed for robust trend detection).
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) overall trend direction and confidence,
      (2) the weakest data area or most uncertain trend claim, and (3) the single
      most urgent action based on trend data.

  generate_pattern_report:
    name: "Generate Pattern Report"
    description: "Create periodic pattern report for leadership with win/loss highlights, competitive landscape, and prioritized recommendations"
    prompt: |
      Context: Generating {frequency} pattern report.
      Period: {period}
      Data: {pattern_data}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + top 5 recommendations; DISCOVERY = data completeness assessment only. Default: FULL)

      You are generating a pattern report for leadership consumption. This report
      must be concise, evidence-based, and actionable. Leadership readers will
      scan the executive summary and act on recommendations. Follow these steps
      in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: METRICS SUMMARY
      Compile program metrics for the period.
      - Retrospectives completed: count and completion rate
      - Average time to retrospective: days from close to retro
      - Recommendations implemented: count and percentage
      - Win rate trend (requires 2+ periods): IMPROVING / STABLE / DECLINING /
        INSUFFICIENT DATA FOR TREND
      For each metric: state the data source and confidence level.
      If {pattern_data} is empty: state that no pattern data exists, note that
      metrics will be unavailable, proceed without fabrication.
      Deliverable: Metrics Summary table (Metric | Value | Previous Period |
      Trend | Confidence | Data Source).

      STEP 2: WIN PATTERN HIGHLIGHTS
      Summarize what is working based on win patterns.
      For each highlight:
      - Pattern description
      - Frequency and evidence strength
      - Replicability recommendation
      - Confidence: HIGH / MEDIUM / LOW with basis
      Limit to top 5 patterns by frequency and impact.
      Deliverable: Win Highlights table (Pattern | Frequency | Evidence Strength |
      Replicability | Confidence).

      STEP 3: LOSS PATTERN HIGHLIGHTS
      Summarize what needs fixing based on loss patterns.
      For each highlight:
      - Pattern description
      - Frequency and severity
      - Root cause category
      - Controllable: YES / NO
      - Confidence: HIGH / MEDIUM / LOW with basis
      Limit to top 5 patterns by severity and controllability.
      Deliverable: Loss Highlights table (Pattern | Frequency | Severity |
      Root Cause | Controllable | Confidence).

      STEP 4: COMPETITIVE LANDSCAPE SUMMARY
      Summarize competitive dynamics from the period.
      For each competitor:
      - Win/loss record (if sufficient data)
      - Key patterns observed
      - Trend: IMPROVING / STABLE / DECLINING / INSUFFICIENT DATA FOR TREND
        Trend requires 2+ periods. Single period = data point only.
      - Recommended focus
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Competitive Landscape table (Competitor | Record | Key Pattern |
      Trend | Data Points | Recommended Focus | Confidence).

      STEP 5: TOP 5 RECOMMENDATIONS
      Prioritize the top 5 recommendations from pattern analysis.
      For each recommendation:
      - Recommendation (specific, actionable)
      - Patterns addressed
      - Prerequisites: what must change for this to work
      - Expected impact: HIGH / MEDIUM / LOW
      - Effort: HIGH / MEDIUM / LOW
      - Owner recommendation
      - Priority rank with rationale
      Deliverable: Top 5 Recommendations table (Rank | Recommendation | Patterns |
      Prerequisites | Impact | Effort | Owner).

      STEP 6: ESCALATIONS FOR LEADERSHIP
      Identify items requiring leadership attention or decision.
      For each escalation:
      - Escalation description
      - Why leadership attention is needed
      - Recommended action
      - Deadline or urgency
      If no escalations: state "No escalations required this period."
      Deliverable: Escalations table (Item | Rationale | Recommended Action |
      Urgency).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Report metadata to log
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, run mode declared
      - Metrics include data source and confidence for each value
      - Trend claims require 2+ periods, single-period = INSUFFICIENT DATA
      - Win highlights limited to top 5 by frequency and impact
      - Loss highlights limited to top 5 by severity and controllability
      - Recommendations include prerequisites column
      - Confidence levels stated for every finding with basis
      - Escalations are specific with clear rationale
      - No metrics or trends fabricated from insufficient data
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary and top 5
        recommendations.
      - If run_mode is DISCOVERY: produce only the data completeness assessment
        (what data is needed for a complete pattern report).
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) program health and key metric trends,
      (2) the weakest area or most concerning pattern, and (3) the single most
      urgent recommendation for leadership action.

# ============================================================================
# KNOWLEDGE SHARING PROMPTS
# ============================================================================
knowledge_sharing:

  create_lessons_summary:
    name: "Create Lessons Learned Summary"
    description: "Create shareable anonymized lessons learned document with universally applicable learnings and actionable recommendations"
    prompt: |
      Context: Creating lessons summary from {retrospective_id}.
      Original retrospective: {retrospective_content}
      Audience: {target_audience}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + key learnings; DISCOVERY = content gap analysis only. Default: FULL)

      You are creating a shareable lessons learned summary. This document must
      be properly anonymized and contain universally applicable learnings that
      help other deal teams. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: ANONYMIZATION
      Anonymize all customer-specific details.
      - Replace company name with descriptor (e.g., "large financial services firm")
      - Remove specific ARR values (use ranges: "mid-six-figure deal")
      - Remove individual names
      - Generalize industry-specific details where they could identify the account
      - Verify no identifying details remain
      Deliverable: Anonymization Checklist (Element | Original | Anonymized | Risk
      if Not Anonymized).

      STEP 2: SITUATION DESCRIPTION
      Create an anonymized situation description.
      - Deal context (segment, type, complexity)
      - Key challenge or dynamic
      - Outcome (win/loss, general terms)
      - Why this retrospective matters for others
      Deliverable: Anonymized Situation Description (narrative paragraph).

      STEP 3: KEY LEARNINGS EXTRACTION
      Extract universally applicable learnings.
      For each learning:
      - Learning statement (numbered, conclusion not topic)
      - Category: [DISCOVERY|POSITIONING|DEMO|POV|NEGOTIATION|RELATIONSHIP|PROCESS]
      - Applicability: which deal types, segments, or scenarios benefit
      - Actionable recommendation
      - Confidence: HIGH / MEDIUM / LOW with basis
      If {retrospective_content} is empty: state that no retrospective content
      exists, produce only a content request.
      Deliverable: Key Learnings table (# | Learning | Category | Applicability |
      Recommendation | Confidence).

      STEP 4: AUDIENCE-SPECIFIC FORMATTING
      Format the summary for the target audience.
      - For sales teams: focus on execution and positioning learnings
      - For SA teams: focus on technical and POV learnings
      - For leadership: focus on process and strategic learnings
      - For all: balanced coverage
      If {target_audience} is empty: default to "all" audience.
      Deliverable: Audience-Formatted Summary with emphasis annotations.

      STEP 5: DISCUSSION QUESTIONS
      Create discussion questions for team sessions.
      For each question:
      - Question text
      - Learning it explores
      - Suggested discussion time
      - Expected outcome from discussion
      Deliverable: Discussion Questions table (Question | Learning Reference |
      Time | Expected Outcome).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Knowledge sharing entry to log
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, run mode declared
      - Anonymization verified: no company names, individual names, or specific
        ARR values remain
      - Every learning is universally applicable (not situation-specific)
      - Learnings include actionable recommendations
      - Confidence levels stated for every learning with basis
      - Audience formatting matches specified target audience
      - Discussion questions are open-ended, not leading
      - No content fabricated, gaps stated explicitly
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary and key learnings.
      - If run_mode is DISCOVERY: produce only the content gap analysis (what
        retrospective content is needed for a complete lessons summary).
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the core lesson and its applicability scope,
      (2) the weakest or most context-dependent learning, and (3) the single
      most important takeaway for the target audience.

  create_competitive_brief:
    name: "Create Competitive Intelligence Brief"
    description: "Extract competitive insights from retrospectives for CI team with classified tactics, pricing intelligence, and counter-positioning recommendations"
    prompt: |
      Context: Extracting competitive insights from retrospectives.
      Competitor: {competitor}
      Retrospective data: {retrospective_excerpts}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + top tactics + top counter-move; DISCOVERY = intelligence gap analysis only. Default: FULL)

      You are creating a competitive intelligence brief from retrospective data.
      Every insight must be evidence-based and classified by confidence. This
      brief feeds the CI team's competitive playbooks. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: INTELLIGENCE CLASSIFICATION
      Classify the intelligence source and type.
      - Intelligence source: [WIN_RETRO|LOSS_RETRO|BOTH]
      - Primary intelligence type: [POSITIONING|PRICING|FEATURE|TACTIC|MESSAGING]
        Secondary flags where multiple types apply.
      - Data volume: count of retrospectives contributing
      - Confidence baseline: HIGH (3+ retrospectives), MEDIUM (2 retrospectives),
        LOW (1 retrospective)
      Deliverable: Intelligence Classification (Source | Primary Type | Secondary
      Flags | Data Volume | Confidence Baseline).

      STEP 2: TACTICS OBSERVED
      Document competitor tactics observed across retrospectives.
      For each tactic:
      - Tactic description (specific, observable behavior)
      - Context in which it appeared
      - Effectiveness against us: HIGH / MEDIUM / LOW
      - Frequency: count of retrospectives where observed
      - Confidence: HIGH / MEDIUM / LOW with basis
      If {retrospective_excerpts} is empty: state that no retrospective data
      exists, produce only an intelligence request.
      Deliverable: Tactics table (Tactic | Context | Effectiveness | Frequency |
      Confidence | Evidence Sources).

      STEP 3: PRICING INTELLIGENCE
      Document pricing and commercial intelligence.
      - Pricing model observations
      - Discount patterns observed
      - Value positioning approach
      - TCO comparison data (if available)
      - Confidence: HIGH (customer disclosed pricing), MEDIUM (partial data),
        LOW (inferred from deal behavior)
      If no pricing data exists: state "No pricing intelligence available from
      retrospective data."
      Deliverable: Pricing Intelligence (Dimension | Observation | Confidence |
      Evidence).

      STEP 4: MESSAGING ANALYSIS
      Document competitor messaging that resonated with customers.
      For each message:
      - Message theme or positioning
      - Customer response (evidence-based)
      - Our counter-message effectiveness
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Messaging Analysis table (Theme | Customer Response |
      Counter-Message Effectiveness | Confidence | Evidence).

      STEP 5: FEATURE GAP EXPLOITATION
      Document how competitor exploited feature gaps.
      For each gap:
      - Feature or capability
      - How competitor positioned this
      - Customer priority for this feature
      - Our response effectiveness
      - Confidence: HIGH / MEDIUM / LOW with basis
      If no feature gaps were exploited: state "No feature gap exploitation
      identified."
      Deliverable: Feature Gaps table (Feature | Competitor Positioning |
      Customer Priority | Our Response | Confidence | Evidence).

      STEP 6: COUNTER-POSITIONING RECOMMENDATIONS
      Recommend counter-moves based on intelligence.
      For each recommendation:
      - Recommendation (specific, actionable)
      - Tactic or gap it addresses
      - Prerequisites: what must be true for this to work
      - Expected impact
      - Urgency: IMMEDIATE / NEXT_QUARTER / STRATEGIC
      Deliverable: Counter-Positioning table (Recommendation | Addresses |
      Prerequisites | Impact | Urgency).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - CI entries to add
      - Counter-positioning to log
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, run mode declared
      - Every insight traced to specific retrospective evidence
      - Confidence levels stated for every observation with basis
      - Intelligence classification includes primary + secondary flags
      - Tactics include frequency counts (single observation ≠ pattern)
      - Counter-positioning recommendations include prerequisites column
      - No competitor capabilities assumed or fabricated
      - Pricing intelligence clearly distinguished confirmed from inferred
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, top 3 tactics,
        and top counter-move.
      - If run_mode is DISCOVERY: produce only the intelligence gap analysis
        (what data is missing for a complete CI brief).
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the competitor's dominant tactic and overall
      intelligence confidence, (2) the weakest intelligence area, and (3) the
      single most urgent counter-positioning action.

  create_product_feedback:
    name: "Create Product Feedback from Loss"
    description: "Document product feedback from loss retrospective with quantified business impact, competitive comparison, and prioritization recommendation"
    prompt: |
      Context: Product-related loss at {account_name}.
      Feature gap: {feature_gap}
      Customer requirements: {requirements}
      Competitive comparison: {competitive_features}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + gap summary + priority; DISCOVERY = requirements gap analysis only. Default: FULL)

      You are documenting product feedback from a loss retrospective. This
      feedback must be specific, evidence-based, and quantified for product
      team prioritization. Vague feedback does not drive product decisions.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: FEEDBACK CLASSIFICATION
      Classify the product feedback.
      - Primary type: [FEATURE_GAP|ENHANCEMENT|BUG|PRICING|INTEGRATION|PERFORMANCE]
        Secondary flags where multiple types apply.
      - Summary (1 sentence, conclusion not topic)
      - Severity for the customer: BLOCKER / MAJOR / MINOR
      - Confidence: HIGH (customer explicitly stated this as reason), MEDIUM
        (inferred from evaluation feedback), LOW (team assumption)
      Deliverable: Feedback Classification (Type | Secondary Flags | Summary |
      Severity | Confidence | Evidence).

      STEP 2: CUSTOMER CONTEXT
      Document the customer context (anonymized for product team).
      - Industry and segment
      - Use case requiring the feature
      - Technical environment relevant to the gap
      - Decision maker perspective on the gap
      - Customer quotes (anonymized, verbatim where possible)
      If {requirements} is empty: state that no customer requirements exist,
      note that context will be limited to available deal data, proceed without
      fabrication.
      Deliverable: Customer Context (Industry | Use Case | Environment |
      Decision Maker Perspective | Anonymized Quotes).

      STEP 3: REQUIREMENTS DETAIL
      Document the specific requirements that were unmet.
      For each requirement:
      - Requirement description (specific, testable)
      - Customer priority: MUST_HAVE / IMPORTANT / NICE_TO_HAVE
      - Our current capability (what we offer today)
      - Gap description (specific difference)
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Requirements table (Requirement | Priority | Current Capability |
      Gap | Confidence | Evidence).

      STEP 4: COMPETITIVE COMPARISON
      Compare our offering to competitor's on the gap dimension.
      For each feature/capability:
      - Feature name
      - Competitor capability (specific, evidence-based)
      - Our capability
      - Gap severity: CRITICAL / SIGNIFICANT / MINOR
      - Confidence: HIGH (customer demonstrated competitor feature), MEDIUM
        (customer described competitor feature), LOW (inferred from market data)
      If {competitive_features} is empty: state that no competitive comparison
      data exists, note that comparison will be limited, proceed without
      fabrication.
      Deliverable: Competitive Comparison table (Feature | Competitor | Us |
      Gap Severity | Confidence | Evidence).

      STEP 5: BUSINESS IMPACT QUANTIFICATION
      Quantify the business impact of this product gap.
      - Deals affected: count (this deal + any known similar losses)
      - ARR impact: total value of deals affected
      - Win rate impact: estimated effect on win rate (with confidence)
      - Segment exposure: which segments are most affected
      - Trend: is this gap appearing more frequently? (requires 2+ data points,
        single observation = INSUFFICIENT DATA FOR TREND)
      - Confidence: HIGH / MEDIUM / LOW with basis for each metric
      Deliverable: Business Impact (Metric | Value | Confidence | Evidence).

      STEP 6: PRIORITY RECOMMENDATION
      Recommend priority for product team.
      - Suggested priority: [CRITICAL|HIGH|MEDIUM|LOW] with basis
      - Impact if not addressed (specific consequences)
      - Prerequisites for addressing this gap
      - Related product feedback (if any prior feedback exists)
      - Time sensitivity assessment
      Deliverable: Priority Recommendation (Priority | Basis | Impact if Ignored |
      Prerequisites | Related Feedback | Time Sensitivity).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Product feedback entry to log
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, run mode declared
      - Feedback classification includes primary + secondary flags
      - Requirements are specific and testable (not vague)
      - Competitive comparison based on evidence, not assumptions
      - Business impact metrics include confidence levels
      - Trend claims require 2+ data points
      - Customer quotes properly anonymized
      - Priority recommendation includes explicit basis
      - No capabilities fabricated for us or competitor
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, gap summary,
        priority recommendation, and account state delta.
      - If run_mode is DISCOVERY: produce only the requirements gap analysis
        (what information is needed for a complete product feedback document).
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the feature gap and its business impact,
      (2) the weakest evidence area or most uncertain metric, and (3) the
      recommended priority with key basis.

# ============================================================================
# PROCESS IMPROVEMENT PROMPTS
# ============================================================================
process_improvement:

  generate_recommendations:
    name: "Generate Process Improvement Recommendations"
    description: "Create actionable process improvements from pattern analysis with impact/effort assessment, implementation roadmap, and success metrics"
    prompt: |
      Context: Generating recommendations from pattern analysis.
      Patterns identified: {patterns}
      Current processes: {current_processes}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + quick wins + top strategic change; DISCOVERY = process assessment only. Default: FULL)

      You are generating process improvement recommendations from retrospective
      patterns. Recommendations must be specific, actionable, and include
      implementation prerequisites. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: PATTERN-TO-PROCESS MAPPING
      Map each identified pattern to current process gaps.
      For each pattern:
      - Pattern description
      - Current process that should prevent this (if any)
      - Process gap: MISSING (no process exists) / BROKEN (process exists but
        fails) / BYPASSED (process exists but not followed)
      - Frequency of pattern occurrence
      - Confidence: HIGH / MEDIUM / LOW with basis
      If {current_processes} is empty: state that no current process documentation
      exists, note that gap analysis will be limited, proceed without fabrication.
      Deliverable: Pattern-Process Map table (Pattern | Current Process | Gap Type |
      Frequency | Confidence | Evidence).

      STEP 2: RECOMMENDATION GENERATION
      Generate specific recommendations for each process gap.
      For each recommendation:
      - Recommendation description (specific, actionable)
      - Pattern addressed
      - Expected impact: HIGH / MEDIUM / LOW with basis
      - Implementation effort: HIGH / MEDIUM / LOW with basis
      - Prerequisites: what must be true or change for this to work
      - Owner recommendation (role, not individual)
      - Success metric (how to measure if this worked)
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Recommendations table (Recommendation | Pattern | Impact |
      Effort | Prerequisites | Owner | Success Metric | Confidence).

      STEP 3: QUICK WINS IDENTIFICATION
      Identify quick wins (low effort, high impact).
      For each quick win:
      - Description
      - Why it qualifies as quick win (low effort justification)
      - Expected impact
      - Prerequisites
      - Implementation timeline
      Deliverable: Quick Wins table (Quick Win | Effort Justification | Impact |
      Prerequisites | Timeline).

      STEP 4: STRATEGIC CHANGES
      Identify strategic changes (high effort, high impact).
      For each strategic change:
      - Description
      - Why it requires strategic investment (high effort justification)
      - Expected impact
      - Prerequisites and dependencies
      - Implementation phases
      - Risk assessment
      Deliverable: Strategic Changes table (Change | Effort Justification | Impact |
      Prerequisites | Phases | Risk).

      STEP 5: IMPLEMENTATION ROADMAP
      Create a phased implementation roadmap.
      - Phase 1 (immediate, 0-30 days): quick wins
      - Phase 2 (short-term, 30-90 days): moderate effort changes
      - Phase 3 (medium-term, 90-180 days): strategic changes
      For each phase: items, owners, dependencies, success criteria.
      Deliverable: Implementation Roadmap (Phase | Items | Owners | Dependencies |
      Success Criteria | Timeline).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Recommendations to log
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, run mode declared
      - Every recommendation traced to a specific pattern
      - Impact and effort assessments include basis (not arbitrary)
      - Prerequisites column present for every recommendation
      - Quick wins genuinely low-effort (not just low-priority)
      - Success metrics are measurable (not vague)
      - Confidence levels stated for every recommendation with basis
      - No recommendations fabricated without supporting pattern data
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, quick wins,
        and top strategic change.
      - If run_mode is DISCOVERY: produce only the process assessment (current
        process inventory and gap identification).
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) the number of recommendations and their
      impact profile, (2) the weakest process area or most critical gap, and
      (3) the single most impactful quick win to implement immediately.

  track_implementation:
    name: "Track Recommendation Implementation"
    description: "Track status of retrospective recommendations, assess observed impact, identify blockers, and escalate where needed"
    prompt: |
      Context: Tracking recommendations from {time_period}.
      Recommendations: {recommendations_list}
      Current status: {status_updates}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + status counts + escalations; DISCOVERY = tracking gap analysis only. Default: FULL)

      You are tracking the implementation of retrospective recommendations.
      Implementation without impact measurement is incomplete. Every status
      update must include evidence. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: IMPLEMENTATION STATUS TRACKING
      Track each recommendation's implementation status.
      For each recommendation:
      - Recommendation description
      - Source retrospective or report
      - Status: IMPLEMENTED / IN_PROGRESS / BLOCKED / NOT_STARTED
      - Owner and accountability
      - Evidence of status (what confirms the status)
      - Days since recommendation
      If {recommendations_list} is empty: state that no recommendations exist
      to track, produce only a baseline recommendation.
      Deliverable: Implementation Tracker table (Recommendation | Source | Status |
      Owner | Evidence | Days Open).

      STEP 2: STATUS SUMMARY
      Summarize implementation across all recommendations.
      - Implemented: count and percentage
      - In progress: count and percentage
      - Blocked: count and percentage
      - Not started: count and percentage
      - Average time to implementation (for completed items)
      - Confidence: HIGH (all statuses verified), MEDIUM (some statuses
        self-reported), LOW (statuses estimated)
      Deliverable: Status Summary (Category | Count | Percentage | Confidence).

      STEP 3: IMPACT ASSESSMENT
      Assess observed impact of implemented recommendations.
      For each implemented recommendation:
      - Recommendation description
      - Expected impact (from original recommendation)
      - Observed impact: POSITIVE / NEUTRAL / NEGATIVE / TOO_EARLY_TO_ASSESS
      - Evidence of impact (specific metrics or observations)
      - Impact attribution confidence: HIGH (clear causal link), MEDIUM
        (correlated but not proven causal), LOW (assumed impact)
      Deliverable: Impact Assessment table (Recommendation | Expected Impact |
      Observed Impact | Evidence | Attribution Confidence).

      STEP 4: BLOCKER ANALYSIS
      Analyze blocked recommendations.
      For each blocked item:
      - Recommendation description
      - Blocker description (specific)
      - Blocker type: RESOURCE / DEPENDENCY / DECISION / TECHNICAL / ORGANIZATIONAL
      - Unblock action required
      - Prerequisites for unblocking
      - Escalation needed: YES / NO
      If no blocked items: state "No blocked recommendations."
      Deliverable: Blocker Analysis table (Recommendation | Blocker | Type |
      Unblock Action | Prerequisites | Escalation).

      STEP 5: ESCALATIONS
      Identify items requiring escalation.
      For each escalation:
      - Item description
      - Why escalation is needed
      - Recommended escalation path
      - Urgency: CRITICAL / HIGH / MEDIUM
      - Deadline for resolution
      If no escalations: state "No escalations required."
      Deliverable: Escalations table (Item | Rationale | Path | Urgency | Deadline).

      STEP 6: UPDATED RECOMMENDATIONS
      Update or retire recommendations based on tracking results.
      For each recommendation:
      - Current recommendation
      - Action: KEEP / MODIFY / RETIRE / ESCALATE
      - Rationale for action
      - Modified recommendation (if MODIFY)
      Deliverable: Updated Recommendations table (Recommendation | Action |
      Rationale | Modified Version).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Tracking status to update
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, run mode declared
      - Every status claim backed by evidence (not self-reported without verification)
      - Impact assessment distinguishes causal from correlated
      - Blockers include specific unblock actions with prerequisites
      - Escalations include clear rationale and deadline
      - Confidence levels stated for status and impact assessments
      - No statuses fabricated, unknown statuses marked explicitly
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, status counts,
        and escalations.
      - If run_mode is DISCOVERY: produce only the tracking gap analysis (what
        status data is missing for complete tracking).
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) implementation rate and overall program
      health, (2) the most critical blocker or weakest implementation area, and
      (3) the single most urgent escalation or action.

  retrospective_effectiveness:
    name: "Assess Retrospective Program Effectiveness"
    description: "Evaluate whether the retrospective program is delivering value through completion rates, implementation tracking, pattern recurrence, and win rate correlation"
    prompt: |
      Context: Assessing retrospective program effectiveness.
      Period: {assessment_period}
      Metrics: {program_metrics}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + health assessment + top recommendation; DISCOVERY = metrics gap analysis only. Default: FULL)

      You are assessing whether the retrospective program is working. This is
      a meta-analysis: are retrospectives themselves driving improvement? Every
      effectiveness claim must be evidence-based. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: PROGRAM HEALTH ASSESSMENT
      Assess overall program health.
      - Program health: [HEALTHY|NEEDS_ATTENTION|AT_RISK] with basis
      - Health dimensions assessed:
        - Completion rate (retrospectives done / deals closed)
        - Timeliness (average days from close to retrospective)
        - Quality (average learning count per retrospective)
        - Implementation rate (recommendations acted on)
      For each dimension:
      - Current value
      - Target or benchmark
      - Gap assessment
      - Confidence: HIGH / MEDIUM / LOW with basis
      If {program_metrics} is empty: state that no program metrics exist, note
      that health assessment will be qualitative only, proceed without fabrication.
      Deliverable: Program Health Assessment (Overall Health | Basis) + Health
      Dimensions table (Dimension | Current | Target | Gap | Confidence).

      STEP 2: COMPLETION AND TIMELINESS METRICS
      Analyze retrospective completion and timeliness.
      - Completion rate by deal type (win/loss)
      - Average time to retrospective by deal type
      - Trend: IMPROVING / STABLE / DECLINING / INSUFFICIENT DATA FOR TREND
        (requires 2+ periods)
      - Outliers (deals with no retrospective or very late retrospective)
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Completion Metrics table (Deal Type | Completion Rate |
      Avg Days | Trend | Data Points | Confidence).

      STEP 3: LEARNING IMPLEMENTATION EFFECTIVENESS
      Assess whether learnings are being implemented and making a difference.
      - Implementation rate (recommendations acted on / total recommendations)
      - Impact of implemented recommendations (positive / neutral / negative)
      - Pattern recurrence: are the same patterns repeating despite recommendations?
        Trend: DECREASING (good) / STABLE / INCREASING (bad) / INSUFFICIENT
        DATA FOR TREND (requires 2+ periods)
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Learning Effectiveness table (Metric | Value | Trend |
      Data Points | Confidence | Evidence).

      STEP 4: WIN RATE CORRELATION
      Assess correlation between retrospective program and win rate.
      - Win rate before and after program (if data available)
      - Correlation assessment: POSITIVE / NONE / NEGATIVE / INSUFFICIENT DATA
      - Caution: correlation is not causation, state confounding factors
      - Confidence: HIGH (controlled comparison), MEDIUM (before/after with
        confounders), LOW (insufficient data for meaningful comparison)
      If fewer than 2 comparable periods: state "INSUFFICIENT DATA FOR WIN
      RATE CORRELATION ANALYSIS."
      Deliverable: Win Rate Correlation (Period | Win Rate | Retrospective
      Activity | Correlation | Confounders | Confidence).

      STEP 5: WHAT IS WORKING
      Identify program elements that are working well.
      For each positive element:
      - Element description
      - Evidence of effectiveness
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Working Well table (Element | Evidence | Confidence).

      STEP 6: WHAT NEEDS IMPROVEMENT
      Identify program elements that need improvement.
      For each improvement area:
      - Area description
      - Current state and gap
      - Recommended change
      - Prerequisites for improvement
      - Expected impact
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Needs Improvement table (Area | Current State | Recommended
      Change | Prerequisites | Impact | Confidence).

      STEP 7: PROGRAM RECOMMENDATIONS
      Generate recommendations for the retrospective program itself.
      For each recommendation:
      - Recommendation (specific, actionable)
      - Problem it addresses
      - Prerequisites
      - Expected impact
      - Priority: IMMEDIATE / NEXT_QUARTER / STRATEGIC
      Deliverable: Program Recommendations table (Recommendation | Problem |
      Prerequisites | Impact | Priority).

      STEP 8: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Program health status to set
      - Recommendations to log
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input Gate completed first, run mode declared
      - Program health assessment includes explicit basis
      - Trend claims require 2+ comparable periods
      - Win rate correlation explicitly states it is correlation, not causation
      - Pattern recurrence assessed with specific pattern names
      - Confidence levels stated for every metric and assessment
      - No effectiveness claims fabricated from insufficient data
      - Recommendations include prerequisites column
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, program health
        assessment, and top recommendation.
      - If run_mode is DISCOVERY: produce only the metrics gap analysis (what
        data is needed for a complete effectiveness assessment).
      - If run_mode is FULL or not specified: produce all deliverables as described.

      Format: Produce all deliverables as labeled sections. Lead with a 3-sentence
      executive summary stating: (1) program health status and key metric,
      (2) the weakest program dimension or most concerning trend, and (3) the
      single most urgent program improvement to make.
