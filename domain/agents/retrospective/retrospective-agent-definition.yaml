x-ea-agent:
  profile:
    role_context: 'The Retrospective Lead conducts structured win/loss analysis after deal completion, extracting actionable lessons and identifying recurring patterns across the organization.
      Every closed deal contains intelligence that can improve future performance, but without a systematic capture process, teams pivot to the next opportunity and institutional memory
      lives in individual heads. The same loss reasons recur quarter after quarter, retrospectives get skipped or conducted too late for the lessons to matter, and candid participation
      disappears when team members fear blame. This agent closes the learning loop by initiating retrospectives within days of deal closure, maintaining a blame-free analytical structure,
      detecting cross-deal patterns that individual retrospectives miss, and distributing insights to the teams and processes that can act on them.

      '
    why: 'Every deal closes with untapped intelligence, but no one captures it. Teams pivot immediately to the next opportunity, retrospectives get skipped or completed months late, and the same loss reasons
      recur quarter after quarter because institutional memory lives in individual heads. When a retrospective does happen, findings are too generic to act on: "improve communication" or "start earlier"
      without owners, deadlines, or connection to measurable process changes. The operational cost is compounding: the same competitor wins on the same objection three quarters in a row, candid participation
      disappears when team members fear blame, and pattern detection remains impossible because each deal is analyzed as a standalone event. The Retrospective Agent exists to close this loop, turning closed
      deals into a searchable, structured organizational knowledge base before the learning window closes.

      '
    human_matters_summary: 'Losses teach lessons only if humans extract meaning. The agent structures retrospectives and identifies recurring patterns, but the team brings contextual judgment on why patterns
      exist, which lessons are actionable versus structural, and how to implement improvements without blame. The pattern is visible, but human wisdom determines whether lessons actually change behavior.

      '
    human_matters_goal: The agent surfaces what happened and why, but the team decides which lessons are worth acting on, who owns implementation, and whether a pattern reflects process failure or situational
      context that numbers alone cannot explain.
    role_tab_intro: 'A retrospective function runs against natural deal-team momentum. After a deal closes, the team moves on. Retrospectives compete with active pipeline for time, candid input is withheld
      when participants fear blame, and insights fade before they reach the people who need them. The challenges below map to where the retrospective process breaks down, each addressed by a dedicated sub-agent.'
    goals_summary: The Retrospective function succeeds when every closed deal produces structured learnings within two weeks, recurring patterns drive measurable process changes, and the organization stops
      losing deals for the same reasons quarter after quarter.
    goals:
    - Initiate structured retrospectives within 5 business days of deal closure for at least 90% of closed deals
    - Complete win and loss retrospectives within 2 weeks of deal close for at least 90% of opportunities
    - Convert at least 70% of retrospective findings into trackable improvement actions with owners and deadlines
    - Detect recurring loss patterns across 3+ deals and surface them with supporting evidence within 30 days of pattern emergence
    - Achieve at least 80% participant contribution rate in retrospective sessions with substantive, non-surface-level input
    - Distribute lessons learned summaries to relevant team members within 48 hours of retrospective completion
    - Generate cross-deal pattern reports quarterly with trend data covering win and loss rate shifts by factor and segment
    - Achieve greater than 75% of identified patterns with an associated improvement action within 30 days of detection
    key_metrics:
    - name: Retrospective Completion Rate
      definition: Percentage of closed deals (won and lost) with a completed retrospective within 2 weeks of closure
    - name: Insight-to-Action Conversion Rate
      definition: Percentage of retrospective findings converted to trackable improvement actions with owners and deadlines within 2 weeks
    - name: Pattern Detection Lag
      definition: Days between a recurring pattern reaching 3+ deal occurrences and delivery of a structured pattern report to leadership
    - name: Retrospective Timeliness
      definition: Percentage of retrospectives initiated within 5 business days of deal closure
    - name: Lesson Adoption Rate
      definition: Percentage of distributed lessons learned referenced in subsequent deal strategy sessions within the following quarter
    key_responsibilities:
    - 'Win/Loss Data Collection: compile deal history, CRM data, communication logs, and stakeholder inputs as structured retrospective source material'
    - 'Stakeholder Interview Synthesis: gather and synthesize candid input from all deal participants using blame-free frameworks and anonymized collection'
    - 'Decision Factor Extraction: identify and classify the process, technical, competitive, and relationship factors that drove the deal outcome'
    - 'Pattern Identification: aggregate findings across deals to detect recurring win and loss patterns by factor, competitor, segment, and deal size'
    - 'Lesson Documentation: produce standardized retrospective documents with tagged findings, evidence citations, and outcome attribution'
    - 'Lesson Distribution: route findings to the right stakeholders, including CI for competitive insights, PM for product feedback, and all agents for process learnings'
    - 'Action Item Tracking: convert findings into specific improvement actions with owners, deadlines, and measurable success criteria, and track implementation status'
    - 'Playbook Updates: propagate verified learnings into sales, technical, and process playbooks to prevent the same gaps from recurring'
    - 'Institutional Knowledge Capture: structure and tag lessons into a searchable knowledge base with confidentiality controls for cross-deal access'
    - 'Confidentiality Management: abstract deal-specific details while preserving pattern-relevant metadata for compliant cross-deal analysis'
    - 'Retrospective Timeliness Enforcement: trigger retrospective initiation automatically on deal closure signals and track completion against defined windows'
    - 'Retrospective Program Effectiveness: evaluate whether the retrospective program is driving measurable win rate improvements and process change adoption'
    sub_agents:
    - name: Retro Analysis Agent
      id: retro-analysis-agent
      purpose: Win/loss data collection, stakeholder interview synthesis, factor extraction, and pattern identification
    - name: Retro Action Agent
      id: retro-action-agent
      purpose: Lesson distribution, action item tracking, playbook updates, and institutional knowledge capture
    scenarios:
    - problem: Deal retrospectives happen inconsistently and learnings are lost within weeks
      why: 'After a deal closes, the team moves immediately to the next opportunity. Retrospectives get skipped or conducted informally with no documentation. The same mistakes repeat across quarters because
        institutional memory lives only in individual heads, not in a searchable, structured knowledge base.

        '
      agent: retrospective-agent
      agent_response: 'Triggers structured retrospectives automatically when deals close, using a blame-free framework that separates process factors from individual performance. Documents findings in a
        standardized format with tagged patterns, making lessons searchable and referenceable for future deals.

        '
      success_signal:
        metric: Retrospective completion rate
        target: '> 90% of closed deals (won and lost) have completed retrospective within 2 weeks'
        leading_indicator: Retrospective initiated within 48h of deal closure
        failure_signal: Deal closes without retrospective or retrospective completed > 30 days late
    - problem: Recurring loss patterns go undetected because retrospectives are analyzed in isolation
      why: 'Individual retrospectives capture deal-specific lessons but miss systemic patterns. When the same competitor wins on the same objection three quarters in a row, nobody connects the dots because
        each loss is analyzed as a standalone event. The organization fixes symptoms instead of root causes.

        '
      agent: retrospective-agent
      agent_response: 'Aggregates retrospective data across deals to identify recurring patterns in wins and losses. Generates periodic pattern reports that surface systemic issues, competitor trends, and
        process gaps with frequency and impact data to prioritize organizational improvements.

        '
      success_signal:
        metric: Pattern detection and action rate
        target: '> 75% of identified patterns have associated improvement actions within 30 days'
        leading_indicator: Cross-deal pattern report generated quarterly with trend data
        failure_signal: Same loss pattern appears in 3+ consecutive retrospectives with no action
    - problem: Getting candid participation when team members fear retrospectives will assign blame
      why: 'Team members hold back honest assessments when they believe retrospective findings will be used for performance evaluation. Without psychological safety, retrospectives capture surface-level
        observations while the real process failures remain unspoken and unaddressed.

        '
      agent: retrospective-agent
      agent_response: 'The agent structures retrospectives using a blame-free framework that separates process analysis from individual performance. It anonymizes input collection, focuses questions on
        systemic factors rather than personal decisions, and generates findings that attribute outcomes to process gaps, tooling issues, or information flow problems rather than individuals.

        '
      success_signal:
        metric: Retrospective participation depth and candor
        target: At least 80% of participants contribute substantive input beyond surface-level observations
        leading_indicator: Anonymous input collection generates more detailed findings than open discussion alone
        failure_signal: Retrospective findings are generic and avoid naming specific process failures
    - problem: Connecting retrospective insights to measurable process changes rather than generic recommendations
      why: 'Retrospectives produce insights like "improve communication" or "start earlier" that are too vague to act on. Without connecting findings to specific, measurable process changes with owners
        and deadlines, the retrospective becomes a cathartic exercise that changes nothing.

        '
      agent: retrospective-agent
      agent_response: 'The agent converts retrospective findings into specific improvement actions with owners, deadlines, and measurable success criteria. It tracks implementation status across retrospective
        cycles, flags recurring findings that indicate prior actions were ineffective, and reports on the conversion rate from insight to implemented change.

        '
      success_signal:
        metric: Insight-to-action conversion rate
        target: At least 70% of retrospective findings converted to trackable improvement actions within 2 weeks
        leading_indicator: Each finding has an assigned owner and measurable success criterion
        failure_signal: Improvement actions remain unimplemented at the next retrospective cycle
    - problem: Maintaining enough historical data to detect patterns while respecting deal confidentiality
      why: 'Pattern detection requires aggregating data across deals, but individual deal details may be confidential. Teams either restrict access so much that pattern analysis is impossible, or share
        too freely and create compliance risks. The balance between analytical value and confidentiality is hard to maintain.

        '
      agent: retrospective-agent
      agent_response: 'The agent applies a confidentiality framework that abstracts deal-specific details while preserving pattern-relevant metadata. It tags findings by category, competitor, deal stage,
        and outcome without exposing customer names or commercial terms, enabling cross-deal pattern analysis within compliance boundaries.

        '
      success_signal:
        metric: Pattern analysis coverage with confidentiality compliance
        target: Cross-deal pattern reports generated from at least 90% of completed retrospectives
        leading_indicator: Anonymized findings are rich enough for pattern classification without manual review
        failure_signal: Pattern analysis is blocked because data cannot be shared across deal boundaries
    - problem: Ensuring retrospectives happen promptly after deal closure when the team is already focused elsewhere
      why: 'After a deal closes, the team pivots immediately to the next opportunity. Retrospective scheduling competes with active deal priorities, so it gets deferred until memories have faded and the
        reconstructed narrative is less accurate than real-time observations would have been.

        '
      agent: retrospective-agent
      agent_response: 'The agent triggers retrospective initiation automatically upon deal closure signals from the CRM, scheduling the session within a defined window while the experience is fresh. It
        pre-populates the retrospective with deal timeline data, key milestones, and outcome metrics to reduce preparation overhead and minimize the scheduling burden on the team.

        '
      success_signal:
        metric: Retrospective timeliness
        target: Retrospective initiated within 5 business days of deal closure for at least 90% of deals
        leading_indicator: Automated trigger fires within 24 hours of deal status change
        failure_signal: Retrospective conducted more than 30 days after deal closure
    challenges:
    - text: Getting candid participation when team members fear retrospectives will assign blame
      solved_by: retro-analysis-agent
      category: Psychological Safety
      specific_overhead:
      - Scheduling and facilitating retrospective sessions across distributed team members
      - Anonymizing and aggregating input to protect individual contributors during synthesis
    - text: Connecting retrospective insights to measurable process changes rather than generic recommendations
      solved_by: retro-action-agent
      category: Action Accountability
      specific_overhead:
      - Converting every finding into an action item with an owner, deadline, and success criterion
      - Following up on open actions across multiple stakeholders between retrospective cycles
    - text: Maintaining enough historical data to detect patterns while respecting deal confidentiality
      solved_by: retro-analysis-agent
      category: Data Governance
      specific_overhead:
      - Tagging and categorizing findings into the pattern taxonomy for compliant cross-deal analysis
      - Applying confidentiality abstractions to deal-specific details before sharing across deal boundaries
    - text: Ensuring retrospectives happen promptly after deal closure when the team is already focused elsewhere
      solved_by: retro-analysis-agent
      category: Process Discipline
      specific_overhead:
      - Monitoring CRM for deal closure signals and triggering retrospective initiation within the defined window
      - Pre-populating retrospective inputs with deal timeline, milestones, and outcome metrics to reduce scheduling friction
    - text: Deal retrospectives happen inconsistently and learnings are lost within weeks because no structured system captures them
      solved_by: retro-analysis-agent
      category: Knowledge Capture
      specific_overhead:
      - Compiling deal history, CRM data, communication logs, and stakeholder inputs as structured retrospective source material
      - Enforcing a consistent retrospective format and tagging taxonomy across all deals and team members
    - text: Recurring loss patterns go undetected because each deal is analyzed as a standalone event rather than as part of a portfolio
      solved_by: retro-analysis-agent
      category: Pattern Detection
      specific_overhead:
      - Aggregating tagged findings across deals to identify recurring patterns by factor, competitor, and segment
      - Generating cross-deal pattern reports with frequency and impact data before patterns become entrenched
    - text: Lessons learned reach the wrong audience too late and fail to change behavior in subsequent deals
      solved_by: retro-action-agent
      category: Knowledge Distribution
      specific_overhead:
      - Routing findings to the right stakeholders within 48 hours of retrospective completion
      - Tracking whether distributed lessons are referenced in subsequent deal strategy sessions
    - text: Playbooks go stale between retrospective cycles because verified learnings are never propagated back into process documentation
      solved_by: retro-action-agent
      category: Playbook Maintenance
      specific_overhead:
      - Identifying which playbooks are affected by new findings and flagging them for update
      - Coordinating playbook edits across CI, SA, and AE playbooks with version tracking
    - text: Action items from retrospectives remain unimplemented because ownership is unclear and no one tracks follow-through
      solved_by: retro-action-agent
      category: Action Accountability
      specific_overhead:
      - Tracking implementation status of all improvement recommendations from prior retrospective cycles
      - Escalating overdue or unaddressed actions to the relevant stakeholder or manager
    - text: Retrospective quality degrades when participants reconstruct deal events from fading memory rather than contemporaneous notes
      solved_by: retro-analysis-agent
      category: Data Quality
      specific_overhead:
      - Pulling contemporaneous deal artifacts to anchor the retrospective in factual timeline data
      - Flagging gaps where deal activity was not logged in time and noting the resulting confidence limitation
    - text: Competitive loss patterns identified in retrospectives never reach the CI team in time to update battlecards or positioning
      solved_by: retro-action-agent
      category: Cross-Function Routing
      specific_overhead:
      - Extracting competitor-specific findings and routing them to the CI team within the battlecard refresh cycle
      - Tagging competitive content for cross-reference against active deal pipeline
    - text: Product feedback buried in loss retrospectives fails to surface as prioritized input for the PM team
      solved_by: retro-action-agent
      category: Cross-Function Routing
      specific_overhead:
      - Extracting and structuring product gap mentions from loss retrospectives into PM-ready feedback documents
      - Aggregating repeat feature gap mentions across retrospectives to establish frequency and ARR-at-risk impact
    administrative_overhead:
    - Scheduling and facilitating retrospective sessions across distributed team members
    - Compiling deal history, CRM data, and communication logs as input for each retrospective
    - Tagging and categorizing findings into the pattern taxonomy for cross-deal analysis
    - Tracking implementation status of improvement recommendations from prior retrospectives
    stakeholder_landscape:
      customer_side:
      - 'Deal Champions: primary contacts who participated in the evaluation and can provide candid buyer-side retrospective input'
      - 'Economic Buyers: senior decision-makers whose priorities and concerns shaped the outcome and whose perspective reveals real decision drivers'
      - 'Technical Evaluators: the team members who assessed the solution technically and can identify where gaps influenced the decision'
      - 'Procurement and Vendor Management: controls evaluation criteria, selection process, and competitive shortlist and can explain final decision rationale'
      - 'Lost Buyers: contacts at closed-lost accounts who may provide post-decision candid feedback on why they chose a competitor'
      internal_team:
      - 'Account Executive: primary deal owner whose process decisions, relationships, and sequencing are central inputs to every retrospective'
      - 'Solution Architect: provides the technical assessment of where the POC, architecture conversation, or technical objections influenced the outcome'
      - 'Competitive Intelligence: receives competitor-specific findings to update battlecards and refine win/loss-based positioning'
      - 'Product Management: receives structured product feedback and feature gap analysis extracted from loss retrospectives'
      - 'Sales Leadership: receives pattern reports, trend data, and process improvement recommendations that require organizational-level decisions'
    with_this_agent:
    - domain: Win/Loss Data Collection
      agent: retro-analysis-agent
      items:
      - 'CRM and Deal Data Assembly: pull deal history, activity logs, and outcome fields into a structured retrospective input package'
      - 'Communication Log Compilation: aggregate relevant call notes, emails, and Slack threads to reconstruct the deal timeline'
      - 'Retrospective Trigger: initiate the structured retrospective automatically within 5 business days of deal closure signal'
    - domain: Stakeholder Interview Synthesis
      agent: retro-analysis-agent
      items:
      - 'Blame-Free Input Collection: gather candid input from all deal participants using anonymized, process-focused collection frameworks'
      - 'Multi-Perspective Synthesis: reconcile input from AE, SA, and customer contacts into a coherent account of what happened and why'
      - 'Candor Facilitation: structure questions around systemic factors rather than individual decisions to maximize participation depth'
    - domain: Factor Extraction and Classification
      agent: retro-analysis-agent
      items:
      - 'Outcome Factor Identification: classify decision drivers into process, technical, competitive, relationship, and timing categories'
      - 'Root Cause Separation: distinguish surface-level loss reasons from underlying structural factors with evidence anchoring'
      - 'Evidence Citation: tie every factor to a specific deal event, customer statement, or timeline data point'
    - domain: Cross-Deal Pattern Detection
      agent: retro-analysis-agent
      items:
      - 'Pattern Aggregation: consolidate tagged findings across deals to surface recurring win and loss patterns by factor and segment'
      - 'Trend Reporting: generate quarterly cross-deal pattern reports with frequency, impact, and trend direction for leadership'
      - 'Confidentiality Abstraction: apply anonymization controls to deal-specific details before cross-deal pattern analysis'
    - domain: Lesson Distribution
      agent: retro-action-agent
      items:
      - 'Stakeholder Routing: distribute findings to the right internal stakeholders within 48 hours of retrospective completion'
      - 'CI Feed: extract and route competitor-specific findings to the CI team within the battlecard refresh cycle'
      - 'PM Feedback Package: structure product gap and feature request mentions into PM-ready feedback with frequency and ARR context'
    - domain: Action Item Tracking
      agent: retro-action-agent
      items:
      - 'Action Creation: convert retrospective findings into specific improvement actions with owners, deadlines, and measurable success criteria'
      - 'Implementation Tracking: monitor action status across retrospective cycles and escalate overdue or unaddressed items'
      - 'Conversion Reporting: report insight-to-action conversion rate and flag findings that have not been actioned after two retrospective cycles'
    - domain: Playbook Updates
      agent: retro-action-agent
      items:
      - 'Playbook Impact Identification: determine which sales, technical, and process playbooks are affected by new verified learnings'
      - 'Update Propagation: coordinate playbook edits with CI, SA, and AE playbook owners and track version changes'
      - 'Stale Content Flagging: identify playbook sections that contradict recent retrospective findings and flag for revision'
    - domain: Institutional Knowledge Capture
      agent: retro-action-agent
      items:
      - 'Knowledge Base Structuring: tag and index retrospective findings into a searchable repository with confidentiality controls'
      - 'Retrospective Effectiveness Evaluation: assess whether the retrospective program is driving measurable win rate improvements and process change adoption'
      - 'Program Health Reporting: produce periodic retrospective program reports covering completion rates, action conversion, and outcome trend'
    activity_map:
      purpose: 'The Retrospective Agent exists to turn closed deal outcomes into organizational learning that prevents the same losses from recurring. Everything the retrospective function does falls into one
        of eight operational domains, four owned by the retro-analysis-agent for data and pattern work, and four owned by the retro-action-agent for distribution, action, and knowledge capture.'
      domains:
      - domain: Win/Loss Data Collection
        why: 'A retrospective without complete source data produces reconstructed narratives rather than evidence-based analysis. Without compiling deal history, CRM logs, and stakeholder inputs before memories
          fade, the retrospective captures anecdote rather than fact and the resulting findings cannot be confidently acted on.'
        agent: retro-analysis-agent
        activities:
        - Pull deal history, CRM activity logs, and outcome fields into a structured input package
        - Aggregate call notes, emails, and communication threads to reconstruct the deal timeline
        - Trigger retrospective initiation automatically within 5 business days of deal closure signal
        - Pre-populate retrospective with deal metrics to reduce manual preparation overhead
        cadence: triggered within 5 business days of each deal closure
      - domain: Stakeholder Interview Synthesis
        why: 'The most valuable retrospective input comes from deal participants who will withhold honest assessments if they fear blame. Without a structured, anonymized input process focused on systemic
          factors rather than individual decisions, retrospectives capture surface observations while the real process failures remain unspoken and unaddressed.'
        agent: retro-analysis-agent
        activities:
        - Gather candid input from AE, SA, and customer contacts using blame-free collection frameworks
        - Anonymize and aggregate individual inputs before synthesis to protect participant candor
        - Structure questions around process factors, information flow, and decision timing rather than personal decisions
        - Reconcile conflicting participant accounts into a coherent deal narrative with evidence citations
        cadence: per-deal, concurrent with retrospective initiation
      - domain: Factor Extraction and Classification
        why: 'Without classifying what actually drove the outcome, retrospective findings remain too generic to act on. Separating process failures from competitive gaps from timing issues from relationship
          dynamics produces specific, addressable findings rather than the vague recommendations that retrospectives typically generate.'
        agent: retro-analysis-agent
        activities:
        - Classify decision drivers into process, technical, competitive, relationship, and timing categories
        - Distinguish stated loss reasons from underlying structural factors with evidence anchoring
        - Tie every factor to a specific deal event, customer statement, or timeline data point
        - Tag findings with category, competitor, deal stage, and segment metadata for cross-deal indexing
        cadence: per-deal, completed within 2 weeks of deal closure
      - domain: Cross-Deal Pattern Detection
        why: 'Individual retrospectives capture deal-specific learnings but miss systemic patterns. When the same competitor wins on the same objection across multiple deals, or when the same process step
          precedes losses in a particular segment, pattern detection is only possible by aggregating tagged findings across the portfolio.'
        agent: retro-analysis-agent
        activities:
        - Aggregate tagged findings across deals to surface recurring win and loss patterns by factor, competitor, and segment
        - Generate quarterly cross-deal pattern reports with frequency, trend direction, and impact data
        - Apply confidentiality abstractions to deal-specific details before cross-deal pattern analysis
        - Flag patterns that have appeared in 3+ deals without an associated improvement action for escalation
        cadence: quarterly reports, triggered alerts when pattern threshold reached
      - domain: Lesson Distribution
        why: 'Retrospective findings only change outcomes if they reach the people who can act on them before the next relevant deal. Without structured routing to CI, PM, and deal teams within a defined
          window, learnings expire unused and the same gaps recur in the next quarter.'
        agent: retro-action-agent
        activities:
        - Route findings to the right internal stakeholders within 48 hours of retrospective completion
        - Extract and route competitor-specific findings to the CI team within the battlecard refresh cycle
        - Structure product gap mentions into PM-ready feedback with frequency and ARR-at-risk context
        - Track whether distributed lessons are referenced in subsequent deal strategy sessions
        cadence: within 48 hours of each retrospective completion
      - domain: Action Item Tracking
        why: 'Retrospectives that produce insights without owners, deadlines, and follow-through change nothing. Without structured action tracking and escalation for overdue items, the insight-to-action
          conversion rate stays near zero and the retrospective program becomes a documentation exercise rather than an improvement engine.'
        agent: retro-action-agent
        activities:
        - Convert retrospective findings into specific improvement actions with owners, deadlines, and measurable success criteria
        - Monitor action implementation status across retrospective cycles
        - Escalate overdue or unaddressed actions to the relevant stakeholder or manager
        - Report insight-to-action conversion rate and flag findings unactioned after two cycles
        cadence: continuous tracking, status updates at each retrospective cycle
      - domain: Playbook Updates
        why: 'Verified learnings that never reach playbooks allow the same process gaps to recur indefinitely. Without propagating retrospective findings back into sales, technical, and process documentation,
          the retrospective function generates knowledge without institutional memory, and the next deal team starts with the same outdated guidance.'
        agent: retro-action-agent
        activities:
        - Identify which playbooks are affected by new verified learnings from recent retrospectives
        - Coordinate playbook edits with CI, SA, and AE playbook owners and track version changes
        - Flag playbook sections that contradict recent retrospective findings for revision
        - Validate that updated playbooks reflect the corrected process before closing the action item
        cadence: within one retrospective cycle of finding verification, quarterly full audit
      - domain: Institutional Knowledge Capture
        why: 'The retrospective program generates value only if its outputs accumulate into a searchable, structured knowledge base that survives individual team turnover. Without confidentiality-controlled
          indexing and program effectiveness tracking, institutional memory remains fragile and the program cannot demonstrate measurable impact on win rate or deal quality.'
        agent: retro-action-agent
        activities:
        - Tag and index retrospective findings into a searchable repository with confidentiality controls
        - Assess whether the retrospective program is driving measurable win rate improvements and process change adoption
        - Produce periodic program health reports covering completion rates, action conversion, and outcome trends
        - Archive closed retrospectives with full evidence trails for future pattern analysis
        cadence: ongoing capture, program health report quarterly
    playbook_raci:
      responsible:
      - playbook: Deal Retrospective with Situation Diagnostic (PB_AE_001)
        scope: Conduct structured win/loss retrospective, identify root causes of outcomes, and
        team: account_executives
        file: PB_AE_001_retrospective.yaml
      - playbook: Structured Win/Loss Retrospective (PB_RET_001)
