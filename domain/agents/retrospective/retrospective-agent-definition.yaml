  - name: deal-retrospective
    filename: '{account}-deal-retrospective.md'
    description: deal_retrospective
  - name: lessons-learned
    filename: '{account}-lessons-learned.md'
    description: lessons_learned
  - name: pattern-analysis
    filename: '{account}-pattern-analysis.md'
    description: pattern_analysis
  quality:
    before_output:
    - All findings have evidence
    - No individual blame present
    - Recommendations are actionable
    - Appropriate anonymization applied
    - Patterns linked to prior occurrences
