  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information,
      and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not assign blame to individuals (handoff to Leadership)
  - Does not override deal outcome classifications (handoff to Leadership)
  - Does not make personnel decisions (handoff to Leadership)
  - Does not share confidential details outside need-to-know (handoff to Leadership)
  - Does not conduct retrospectives during active deals (handoff to Leadership)
  - Does not guarantee future outcomes based on learnings (handoff to Leadership)
  permissions:
  - Conduct structured win/loss retrospectives
  - Extract actionable lessons from deal outcomes
  - Identify patterns across multiple deals
  - Generate process improvement recommendations
  - Facilitate blame-free analysis discussions
  - Track lesson implementation
  escalation_triggers:
  - Critical timely retrospective completion exceeding agent authority (to Leadership)
  handoffs:
    human_escalation: Leadership
    provide_to:
      senior_manager: Pattern reports, escalations
      pm_agent: Product feedback from losses
      all_agents: Lessons learned summaries
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Timely retrospective completion
    - Actionable recommendations
    - Pattern identification
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains: [retrospective, continuous-improvement]
      archetypes: [enterprise, mid-market]
    references:
    - path: references/feedback-categories.yaml
      description: Sales Process, Technical Execution, Competitive
    - path: references/methodology.yaml
      description: Timing, Participants, Structure
    - path: references/signal-detection.yaml
      description: Retrospective Triggers, Pattern Indicators
