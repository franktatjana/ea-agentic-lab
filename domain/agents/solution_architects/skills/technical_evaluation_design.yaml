# SK_SA_012: Technical Evaluation Design
# Design and manage structured POV and Guided Trial evaluations

skill_id: "SK_SA_012"
name: "Technical Evaluation Design"
description: "Design structured technical evaluations (Proof of Value and Guided Trials) with defined success criteria, checkpoint cadence, and evidence-based outcome measurement"
version: 1
owner: "sa-best-practices-agent"
category: "evaluation"

workflow:
  - step: 1
    action: "Select evaluation format (POV vs. Guided Trial) based on use case complexity and customer maturity"
    prompt_ref: "prompts/tasks.yaml#technical_evaluation.select_format"
    inputs: ["use_case", "customer_maturity", "complexity_assessment"]
    outputs: ["evaluation_format"]

  - step: 2
    action: "Define measurable success criteria with target metrics and measurement methods"
    prompt_ref: "prompts/tasks.yaml#technical_evaluation.define_criteria"
    inputs: ["evaluation_format", "use_case", "customer_objectives"]
    outputs: ["success_criteria"]

  - step: 3
    action: "Design evaluation plan with timeline, checkpoints, and environment requirements"
    prompt_ref: "prompts/tasks.yaml#technical_evaluation.design_plan"
    inputs: ["success_criteria", "evaluation_format", "customer_environment"]
    outputs: ["evaluation_plan"]

  - step: 4
    action: "Measure results against success criteria and compile evaluation summary"
    prompt_ref: "prompts/tasks.yaml#technical_evaluation.measure_results"
    inputs: ["evaluation_plan", "checkpoint_data", "success_criteria"]
    outputs: ["evaluation_summary"]

inputs:
  required:
    - name: "use_case"
      type: "object"
      description: "Use case to validate with technical requirements and expected outcomes"
    - name: "customer_objectives"
      type: "array"
      description: "Customer's evaluation objectives and decision criteria"
  optional:
    - name: "customer_maturity"
      type: "string"
      description: "Customer's technical maturity level for self-directed evaluation"
    - name: "complexity_assessment"
      type: "object"
      description: "Use case complexity factors (integrations, scale, compliance)"
    - name: "customer_environment"
      type: "object"
      description: "Customer environment details for evaluation setup"

outputs:
  - name: "evaluation_plan"
    type: "object"
    format: "yaml"
    description: "Structured evaluation plan with format, timeline, checkpoints, and success criteria"
  - name: "evaluation_summary"
    type: "object"
    format: "markdown"
    description: "Evaluation outcome report with evidence per success criterion"

quality_criteria:
  - "Success criteria are specific, measurable, and agreed with customer"
  - "Evaluation timeline is realistic for the scope"
  - "Checkpoints are scheduled at intervals that catch blockers early"
  - "Summary provides clear evidence for purchase decision"

guardrails:
  - "Never start evaluation without defined success criteria"
  - "Flag evaluation scope that exceeds timeline (8 weeks POV, 30 days trial)"
  - "Distinguish between criteria met and criteria partially met"
  - "Track customer engagement level, escalate if champion disengages"
  - "Guided Trials must have exactly 3 defined goals"

imports: []

tags: ["evaluation", "pov", "guided-trial", "success-criteria", "technical-validation"]
