# SK_SA_007: Demo Design
# Targeted demo scenario design mapped to customer pain points

skill_id: "SK_SA_007"
name: "Demo Design"
description: "Design targeted technical demonstrations mapped to customer pain points, including scenario scripting, environment requirements, and value narrative integration"
version: 1
owner: "sa-best-practices-agent"
category: "demo_preparation"

workflow:
  - step: 1
    action: "Analyze discovery findings for demo-worthy pain points and prioritize by customer impact"
    prompt_ref: "prompts/tasks.yaml#demo_design.analyze_pain_points"
    inputs: ["discovery_findings", "customer_pain_points"]
    outputs: ["prioritized_pain_points"]

  - step: 2
    action: "Map prioritized pain points to product capabilities that address them"
    prompt_ref: "prompts/tasks.yaml#demo_design.map_capabilities"
    inputs: ["prioritized_pain_points", "product_capabilities"]
    outputs: ["capability_mapping"]

  - step: 3
    action: "Design demo scenario with narrative arc: problem → solution → outcome"
    prompt_ref: "prompts/tasks.yaml#demo_design.design_scenario"
    inputs: ["capability_mapping", "customer_context"]
    outputs: ["demo_scenario"]

  - step: 4
    action: "Define environment requirements, data setup, and configuration for demo execution"
    prompt_ref: "prompts/tasks.yaml#demo_design.define_environment"
    inputs: ["demo_scenario", "customer_environment"]
    outputs: ["environment_requirements"]

inputs:
  required:
    - name: "discovery_findings"
      type: "object"
      description: "Technical discovery outputs with pain points and use cases"
    - name: "customer_pain_points"
      type: "array"
      description: "Prioritized list of customer technical pain points"
  optional:
    - name: "product_capabilities"
      type: "array"
      description: "Product capabilities relevant to the use case"
    - name: "customer_context"
      type: "object"
      description: "Customer industry, size, and technical maturity"
    - name: "customer_environment"
      type: "object"
      description: "Customer's current technical environment for demo matching"

outputs:
  - name: "demo_scenario"
    type: "object"
    format: "yaml"
    description: "Scripted demo scenario with steps, talking points, and anticipated questions"
  - name: "environment_requirements"
    type: "object"
    format: "yaml"
    description: "Data, configuration, and infrastructure requirements for demo execution"

quality_criteria:
  - "Every demo step links to a customer pain point"
  - "Narrative arc follows problem → solution → outcome structure"
  - "Environment requirements are achievable within demo timeline"
  - "Anticipated questions have prepared responses"

guardrails:
  - "Never demo capabilities that do not exist in the product"
  - "Do not overcommit on performance characteristics"
  - "Flag capabilities requiring specialist validation"
  - "Include fallback plan for environment issues"

imports: []

tags: ["demo", "preparation", "pain-points", "scenario-design"]
