# SK_SA_010: Industry Contextualization
# Apply vertical/sector patterns to solutions

skill_id: "SK_SA_010"
name: "Industry Contextualization"
description: "Apply industry-specific patterns, compliance requirements, and sector best practices to solution recommendations, ensuring architecture fits the customer's vertical context"
version: 1
owner: "sa-best-practices-agent"
category: "knowledge_management"

workflow:
  - step: 1
    action: "Identify customer vertical, sector, and regulatory environment"
    prompt_ref: "prompts/tasks.yaml#industry_contextualization.identify_vertical"
    inputs: ["customer_industry", "account_context"]
    outputs: ["industry_profile"]

  - step: 2
    action: "Retrieve industry-specific architecture patterns and compliance requirements"
    prompt_ref: "prompts/tasks.yaml#industry_contextualization.retrieve_patterns"
    inputs: ["industry_profile", "solution_area"]
    outputs: ["industry_patterns"]

  - step: 3
    action: "Apply sector patterns to solution recommendations and architecture decisions"
    prompt_ref: "prompts/tasks.yaml#industry_contextualization.apply_patterns"
    inputs: ["industry_patterns", "solution_design"]
    outputs: ["contextualized_recommendations"]

  - step: 4
    action: "Flag industry-specific risks, compliance gaps, and sector-specific considerations"
    prompt_ref: "prompts/tasks.yaml#industry_contextualization.flag_risks"
    inputs: ["contextualized_recommendations", "regulatory_context"]
    outputs: ["industry_risk_flags"]

inputs:
  required:
    - name: "customer_industry"
      type: "string"
      description: "Customer's industry vertical (e.g., financial services, healthcare, manufacturing)"
    - name: "solution_area"
      type: "string"
      description: "Solution domain being contextualized"
  optional:
    - name: "account_context"
      type: "object"
      description: "Account profile with size, geography, and maturity"
    - name: "regulatory_context"
      type: "array"
      description: "Known regulatory requirements (GDPR, HIPAA, PCI-DSS, etc.)"
    - name: "solution_design"
      type: "object"
      description: "Current solution design to contextualize"

outputs:
  - name: "industry_recommendations"
    type: "array"
    format: "yaml"
    description: "Industry-specific recommendations applied to the solution"
  - name: "compliance_notes"
    type: "array"
    format: "yaml"
    description: "Compliance requirements and gaps for the customer's regulatory environment"
  - name: "sector_patterns"
    type: "array"
    format: "yaml"
    description: "Reference architecture patterns specific to the customer's industry"

quality_criteria:
  - "Industry patterns cite authoritative sources"
  - "Compliance requirements are current and verifiable"
  - "Recommendations are specific to customer's sector, not generic"
  - "Risk flags include mitigation approaches"

guardrails:
  - "Never present generic advice as industry-specific"
  - "Flag compliance requirements that need legal validation"
  - "Cite regulatory framework version and effective date"
  - "Distinguish between mandatory compliance and best practice"

imports: []

tags: ["industry", "vertical", "compliance", "sector-patterns", "contextualization"]
