# SK_SA_011: Value Stream Facilitation
# Facilitate value stream discovery workshops

skill_id: "SK_SA_011"
name: "Value Stream Facilitation"
description: "Facilitate structured value stream discovery workshops, guiding participants through current-state mapping, bottleneck identification, and future-state design with solution capability integration"
version: 1
owner: "sa_agent"
category: "workshop_facilitation"

workflow:
  - step: 1
    action: "Qualify VSD opportunity: assess customer readiness, exec sponsorship, and value stream candidates"
    prompt_ref: "prompts/tasks.yaml#value_stream_facilitation.qualify_opportunity"
    inputs: ["account_context", "pain_points", "stakeholder_map"]
    outputs: ["qualification_assessment"]

  - step: 2
    action: "Prepare workshop: gather pre-workshop data, select VSD technique, design agenda"
    prompt_ref: "prompts/tasks.yaml#value_stream_facilitation.prepare_workshop"
    inputs: ["qualification_assessment", "process_documentation", "participant_list"]
    outputs: ["workshop_plan"]

  - step: 3
    action: "Facilitate current-state mapping: guide participants through process steps, handoffs, and bottleneck identification"
    prompt_ref: "prompts/tasks.yaml#value_stream_facilitation.map_current_state"
    inputs: ["workshop_plan", "participant_input"]
    outputs: ["current_state_map"]

  - step: 4
    action: "Design future-state: map improvements to solution capabilities, quantify improvement potential"
    prompt_ref: "prompts/tasks.yaml#value_stream_facilitation.design_future_state"
    inputs: ["current_state_map", "solution_capabilities"]
    outputs: ["future_state_map", "improvement_recommendations"]

  - step: 5
    action: "Produce executive briefing with findings, recommendations, and next steps"
    prompt_ref: "prompts/tasks.yaml#value_stream_facilitation.executive_briefing"
    inputs: ["current_state_map", "future_state_map", "improvement_recommendations"]
    outputs: ["executive_briefing"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account profile with industry, size, and maturity"
    - name: "pain_points"
      type: "array"
      description: "Technical discovery pain points suggesting value stream issues"
  optional:
    - name: "process_documentation"
      type: "object"
      description: "Existing customer process docs and workflow descriptions"
    - name: "stakeholder_map"
      type: "object"
      description: "Stakeholder map with workshop participant candidates"
    - name: "solution_capabilities"
      type: "array"
      description: "Product capabilities relevant to the value stream"

outputs:
  - name: "current_state_map"
    type: "object"
    format: "yaml"
    description: "Current-state value stream map with process steps, timing, and bottlenecks"
  - name: "future_state_map"
    type: "object"
    format: "yaml"
    description: "Future-state value stream map with improvements mapped to capabilities"
  - name: "executive_briefing"
    type: "object"
    format: "markdown"
    description: "Executive briefing with key findings and prioritized recommendations"

quality_criteria:
  - "Current-state map validated by workshop participants"
  - "Bottlenecks quantified with timing data or participant consensus"
  - "Future-state improvements link to specific solution capabilities"
  - "Executive briefing stands alone without technical context"
  - "Recommendations include effort and impact assessment"

guardrails:
  - "Never fabricate process data, all maps based on participant input"
  - "Flag assumptions that need operational validation"
  - "Distinguish between quick wins and transformation initiatives"
  - "Executive briefing uses customer language, not vendor terminology"
  - "Scope workshop to single value stream per session"

imports: []

tags: ["value-stream", "workshop", "facilitation", "discovery", "process-mapping"]
