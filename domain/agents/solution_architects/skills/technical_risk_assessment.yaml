# SK_SA_003: Technical Risk Assessment
# Extracted from: solution_architects/prompts/tasks.yaml technical_risk section

skill_id: "SK_SA_003"
name: "Technical Risk Assessment"
description: "Evaluate deployment health, diagnose performance issues, assess capacity for growth, and evaluate integration risks"
version: 1
owner: "sa_agent"
category: "risk_management"

workflow:
  - step: 1
    action: "Evaluate current deployment health and identify risks"
    prompt_ref: "prompts/tasks.yaml#technical_risk.architecture_health_check"
    inputs: ["account_context", "deployment_summary"]
    outputs: ["health_assessment"]

  - step: 2
    action: "Diagnose reported performance issues with root cause analysis"
    prompt_ref: "prompts/tasks.yaml#technical_risk.performance_investigation"
    inputs: ["health_assessment", "performance_symptoms"]
    outputs: ["performance_diagnosis"]

  - step: 3
    action: "Assess capacity for planned growth against current resource limits"
    prompt_ref: "prompts/tasks.yaml#technical_risk.capacity_planning"
    inputs: ["health_assessment", "growth_projections"]
    outputs: ["capacity_assessment"]

  - step: 4
    action: "Evaluate risks in proposed or existing integrations"
    prompt_ref: "prompts/tasks.yaml#technical_risk.integration_risk_assessment"
    inputs: ["health_assessment", "integration_inventory"]
    outputs: ["integration_risk_report"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, deployment details, architecture summary"
  optional:
    - name: "deployment_summary"
      type: "object"
      description: "Current deployment topology and configuration"
    - name: "performance_symptoms"
      type: "string"
      description: "Reported performance issues or degradation details"
    - name: "growth_projections"
      type: "object"
      description: "Expected growth in data, users, or transactions"
    - name: "integration_inventory"
      type: "array"
      description: "List of existing or proposed integrations"

outputs:
  - name: "health_assessment"
    type: "object"
    format: "yaml"
    description: "Architecture health score, identified risks with severity, recommended actions"
  - name: "performance_diagnosis"
    type: "object"
    format: "yaml"
    description: "Root cause analysis, contributing factors, remediation plan"
  - name: "capacity_assessment"
    type: "object"
    format: "yaml"
    description: "Current utilization, growth headroom, capacity ceiling timeline"
  - name: "integration_risk_report"
    type: "object"
    format: "yaml"
    description: "Integration risk matrix, complexity score, mitigation recommendations"

quality_criteria:
  - "Every risk has severity classification and evidence"
  - "Performance diagnosis traces to specific metrics or symptoms"
  - "Capacity projections include growth assumptions"
  - "Integration risks map to specific integration points"

guardrails:
  - "Never downplay risks to avoid difficult conversations"
  - "Use severity framework consistently (CRITICAL/HIGH/MEDIUM/LOW)"
  - "Flag when assessment requires specialist engagement"
  - "Add [NEEDS VERIFICATION] when relying on incomplete data"

imports: []

tags: ["architecture", "risk", "performance", "capacity", "integration"]
