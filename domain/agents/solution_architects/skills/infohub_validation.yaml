# SK_SA_006: InfoHub Validation
# Extracted from: solution_architects/prompts/tasks.yaml infohub_validation section

skill_id: "SK_SA_006"
name: "InfoHub Validation"
description: "Check if account InfoHub is complete and current, identify stale content needing update"
version: 1
owner: "sa_agent"
category: "quality_assurance"

workflow:
  - step: 1
    action: "Check InfoHub completeness: required artifacts present, content meets quality criteria"
    prompt_ref: "prompts/tasks.yaml#infohub_validation.completeness_check"
    inputs: ["account_context", "infohub_contents"]
    outputs: ["completeness_report"]

  - step: 2
    action: "Identify stale content: last-updated dates, outdated references, missing recent decisions"
    prompt_ref: "prompts/tasks.yaml#infohub_validation.staleness_report"
    inputs: ["completeness_report", "recent_activity"]
    outputs: ["staleness_report"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name and engagement phase"
  optional:
    - name: "infohub_contents"
      type: "object"
      description: "Current InfoHub artifact inventory with metadata"
    - name: "recent_activity"
      type: "array"
      description: "Recent meetings, decisions, and events for freshness comparison"

outputs:
  - name: "completeness_report"
    type: "object"
    format: "yaml"
    description: "Missing artifacts, incomplete sections, quality gaps, remediation priorities"
  - name: "staleness_report"
    type: "object"
    format: "yaml"
    description: "Stale artifacts with last-updated dates, outdated content, update recommendations"

quality_criteria:
  - "Completeness check covers all required artifact types"
  - "Staleness thresholds applied consistently"
  - "Remediation priorities ranked by deal impact"
  - "Update recommendations are specific and actionable"

guardrails:
  - "Use defined staleness thresholds from reference knowledge"
  - "Never mark content as complete without verifying required sections"
  - "Flag artifacts that reference outdated decisions"
  - "Prioritize gaps that affect active deal processes"

imports: []

tags: ["infohub", "validation", "completeness", "quality", "governance"]
