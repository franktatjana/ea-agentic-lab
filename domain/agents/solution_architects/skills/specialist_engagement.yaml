# SK_SA_004: Specialist Engagement
# Extracted from: solution_architects/prompts/tasks.yaml specialist_engagement section

skill_id: "SK_SA_004"
name: "Specialist Engagement"
description: "Determine if specialist involvement is needed and prepare formal engagement requests"
version: 1
owner: "sa_agent"
category: "coordination"

workflow:
  - step: 1
    action: "Assess whether specialist involvement is needed based on technical signals and complexity"
    prompt_ref: "prompts/tasks.yaml#specialist_engagement.specialist_need_assessment"
    inputs: ["account_context", "technical_signals", "domain_area"]
    outputs: ["need_assessment"]

  - step: 2
    action: "Prepare formal specialist request with context, scope, and expected outcomes"
    prompt_ref: "prompts/tasks.yaml#specialist_engagement.specialist_request"
    inputs: ["need_assessment", "account_context"]
    outputs: ["specialist_request"]
    condition: "need_assessment.specialist_needed == true"

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, current engagement status, technical landscape"
  optional:
    - name: "technical_signals"
      type: "array"
      description: "Technical signals or questions that may require specialist input"
    - name: "domain_area"
      type: "string"
      description: "Suspected domain area (security, observability, search, data management)"

outputs:
  - name: "need_assessment"
    type: "object"
    format: "yaml"
    description: "Assessment of specialist need: needed (yes/no), domain, urgency, rationale"
  - name: "specialist_request"
    type: "object"
    format: "yaml"
    description: "Formal engagement request: domain, scope, context, timeline, expected outcomes"

quality_criteria:
  - "Need assessment cites specific technical triggers"
  - "Domain selection maps to defined specialist categories"
  - "Request includes sufficient context for specialist to prepare"
  - "Expected outcomes are measurable"

guardrails:
  - "Never route to specialist without documented trigger"
  - "Never assess complexity beyond SA scope"
  - "Include customer requirements verbatim in request"
  - "Flag urgency level for scheduling prioritization"

imports: []

tags: ["specialist", "coordination", "routing", "engagement"]
