# SK_SA_008: Value Narrative Construction
# Maps technical capabilities to quantified business outcomes

skill_id: "SK_SA_008"
name: "Value Narrative Construction"
description: "Map technical capabilities to business outcomes, constructing ROI narratives grounded in architecture evidence, risk reduction, and efficiency gains"
version: 1
owner: "sa_agent"
category: "value_articulation"

workflow:
  - step: 1
    action: "Extract technical capabilities from solution design and architecture decisions"
    prompt_ref: "prompts/tasks.yaml#value_narrative.extract_capabilities"
    inputs: ["solution_design", "architecture_decisions"]
    outputs: ["capability_inventory"]

  - step: 2
    action: "Map each capability to a business outcome using customer's language and objectives"
    prompt_ref: "prompts/tasks.yaml#value_narrative.map_outcomes"
    inputs: ["capability_inventory", "business_objectives"]
    outputs: ["capability_outcome_map"]

  - step: 3
    action: "Attach quantitative evidence: sizing data, risk reduction metrics, efficiency gains"
    prompt_ref: "prompts/tasks.yaml#value_narrative.quantify_evidence"
    inputs: ["capability_outcome_map", "sizing_data", "risk_assessment"]
    outputs: ["quantified_value_map"]

  - step: 4
    action: "Construct narrative that bridges technical language to business language"
    prompt_ref: "prompts/tasks.yaml#value_narrative.construct_narrative"
    inputs: ["quantified_value_map", "audience_profile"]
    outputs: ["value_narrative"]

inputs:
  required:
    - name: "solution_design"
      type: "object"
      description: "Solution design or HLD with architecture components"
    - name: "business_objectives"
      type: "array"
      description: "Customer's stated business objectives and success criteria"
  optional:
    - name: "sizing_data"
      type: "object"
      description: "Sizing estimation with capacity and performance data"
    - name: "risk_assessment"
      type: "object"
      description: "Risk assessment findings with severity and impact"
    - name: "architecture_decisions"
      type: "array"
      description: "ADRs documenting architecture trade-offs"
    - name: "audience_profile"
      type: "string"
      description: "Target audience: executive, technical, or operational"

outputs:
  - name: "value_narrative"
    type: "object"
    format: "markdown"
    description: "Value narrative document bridging technical capabilities to business outcomes"
  - name: "capability_outcome_map"
    type: "object"
    format: "yaml"
    description: "Structured mapping: capability → outcome → evidence → quantification"

quality_criteria:
  - "Every value claim links to a specific technical capability"
  - "Quantifications include stated assumptions"
  - "Evidence sources are cited for each claim"
  - "Narrative uses customer language, not vendor jargon"

guardrails:
  - "Never make unsubstantiated value claims"
  - "Flag assumptions that need customer validation"
  - "Separate hard ROI (measurable) from soft benefits (qualitative)"
  - "Customer-facing version must exclude competitive positioning"

imports: []

tags: ["value", "narrative", "roi", "business-outcomes", "technical-to-business"]
