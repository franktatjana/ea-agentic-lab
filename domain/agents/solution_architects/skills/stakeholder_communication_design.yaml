# SK_SA_009: Stakeholder Communication Design
# Audience-adapted architecture messaging

skill_id: "SK_SA_009"
name: "Stakeholder Communication Design"
description: "Design audience-adapted architecture communications, tailoring message depth, artifact types, and delivery sequence for executive, technical, and operational stakeholders"
version: 1
owner: "sa_agent"
category: "communication"

workflow:
  - step: 1
    action: "Identify audience segments and their concerns, technical depth, and format preferences"
    prompt_ref: "prompts/tasks.yaml#stakeholder_communication.analyze_audiences"
    inputs: ["stakeholder_map", "audience_profiles"]
    outputs: ["audience_analysis"]

  - step: 2
    action: "Adapt architecture message per audience: executive summary, technical deep-dive, operational guide"
    prompt_ref: "prompts/tasks.yaml#stakeholder_communication.adapt_messages"
    inputs: ["audience_analysis", "architecture_decisions"]
    outputs: ["audience_messages"]

  - step: 3
    action: "Select appropriate artifact types per audience and design artifact structure"
    prompt_ref: "prompts/tasks.yaml#stakeholder_communication.design_artifacts"
    inputs: ["audience_messages", "available_content"]
    outputs: ["artifact_designs"]

  - step: 4
    action: "Design communication sequence and delivery timing across audiences"
    prompt_ref: "prompts/tasks.yaml#stakeholder_communication.plan_delivery"
    inputs: ["artifact_designs", "meeting_schedule"]
    outputs: ["communication_plan"]

inputs:
  required:
    - name: "architecture_decisions"
      type: "array"
      description: "Architecture decisions (ADRs) to communicate"
    - name: "stakeholder_map"
      type: "object"
      description: "Stakeholder map with roles and influence"
  optional:
    - name: "audience_profiles"
      type: "array"
      description: "Pre-defined audience segment profiles"
    - name: "available_content"
      type: "array"
      description: "Existing architecture artifacts (HLD, diagrams, decision logs)"
    - name: "meeting_schedule"
      type: "array"
      description: "Upcoming meetings for delivery planning"

outputs:
  - name: "communication_plan"
    type: "object"
    format: "yaml"
    description: "Communication plan with audience segments, artifacts, and delivery sequence"
  - name: "audience_adapted_artifacts"
    type: "array"
    format: "markdown"
    description: "Architecture artifacts tailored to each audience segment"

quality_criteria:
  - "Each audience receives content at appropriate abstraction level"
  - "Core architecture message is consistent across all variants"
  - "Executive artifacts avoid technical jargon"
  - "Technical artifacts provide sufficient depth for evaluation"

guardrails:
  - "Never share internal-only content in customer-facing artifacts"
  - "Verify message consistency across audience variants"
  - "Flag sensitive trade-offs that need careful framing"
  - "Delivery sequence respects stakeholder hierarchy"

imports: []

tags: ["communication", "stakeholder", "architecture", "audience-adaptation"]
