# SK_SA_005: Meeting Support
# Extracted from: solution_architects/prompts/tasks.yaml meeting_support section

skill_id: "SK_SA_005"
name: "Meeting Support"
description: "Prepare for technical customer meetings, extract insights from meetings, and prepare for sizing discussions"
version: 1
owner: "sa_agent"
category: "meeting_management"

workflow:
  - step: 1
    action: "Prepare technical brief for customer meeting: architecture context, open items, risks, questions"
    prompt_ref: "prompts/tasks.yaml#meeting_support.technical_prep"
    inputs: ["account_context", "meeting_agenda", "attendees"]
    outputs: ["meeting_brief"]

  - step: 2
    action: "Extract technical insights from meeting: decisions, risks, action items, architecture changes"
    prompt_ref: "prompts/tasks.yaml#meeting_support.technical_debrief"
    inputs: ["meeting_notes", "meeting_brief"]
    outputs: ["meeting_debrief"]

  - step: 3
    action: "Prepare for sizing/capacity discussion: current metrics, growth projections, resource estimates"
    prompt_ref: "prompts/tasks.yaml#meeting_support.sizing_session"
    inputs: ["account_context", "deployment_details", "growth_requirements"]
    outputs: ["sizing_brief"]

inputs:
  required:
    - name: "account_context"
      type: "object"
      description: "Account name, technical profile, engagement history"
  optional:
    - name: "meeting_agenda"
      type: "string"
      description: "Meeting agenda or topic"
    - name: "attendees"
      type: "array"
      description: "Meeting participants and their roles"
    - name: "meeting_notes"
      type: "string"
      description: "Meeting notes for debrief processing"
    - name: "deployment_details"
      type: "object"
      description: "Current deployment topology for sizing context"
    - name: "growth_requirements"
      type: "object"
      description: "Expected growth parameters for sizing"

outputs:
  - name: "meeting_brief"
    type: "object"
    format: "yaml"
    description: "Technical prep: architecture summary, open items, risks to discuss, prepared questions"
  - name: "meeting_debrief"
    type: "object"
    format: "yaml"
    description: "Post-meeting: decisions captured, risks identified, action items with owners, follow-ups"
  - name: "sizing_brief"
    type: "object"
    format: "yaml"
    description: "Sizing prep: current metrics, growth model, resource estimates, discussion points"

quality_criteria:
  - "Meeting brief references current InfoHub data"
  - "Debrief captures all decisions with rationale"
  - "Action items have owners and due dates"
  - "Sizing estimates include assumptions and ranges"

guardrails:
  - "Never present outdated architecture information"
  - "Flag information gaps before the meeting"
  - "Cross-reference debrief decisions with existing decision log"
  - "Sizing estimates must state assumptions explicitly"

imports: []

tags: ["meeting", "preparation", "debrief", "sizing", "technical"]
