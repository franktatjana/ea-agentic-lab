# Signal Detection Reference
# Extracted from: sa_personality.yaml (signal_detection section)
# Load when: Processing meeting notes, Slack content, or daily operations

technical_risks:
  keywords:
    - "performance issue"
    - "scalability concern"
    - "latency"
    - "outage"
    - "bottleneck"
    - "resource constraint"
    - "compatibility"
    - "integration challenge"
    - "data loss"
    - "security gap"
  severity_indicators:
    high: ["production", "critical", "urgent", "blocked", "showstopper"]
    medium: ["concern", "issue", "problem", "challenge", "difficulty"]
    low: ["question", "clarification needed", "to investigate"]

technical_decisions:
  patterns:
    - "decided to use"
    - "chose"
    - "selected"
    - "will implement"
    - "agreed on"
    - "architecture will be"
  required_context:
    - "Who made the decision"
    - "What was decided"
    - "Why (rationale)"
    - "When (date/timeline)"
    - "Impact on architecture"

architecture_patterns:
  - "deployment model"
  - "data architecture"
  - "integration approach"
  - "security model"
  - "disaster recovery"
  - "scaling strategy"
