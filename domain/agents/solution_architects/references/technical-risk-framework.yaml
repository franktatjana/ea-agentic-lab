# Technical Risk Framework
# Referenced by: sa-agent-definition.yaml
# Load when: Risk classification, architecture health checks, escalation decisions

severity_classification:
  CRITICAL:
    definition: "Blocks deal progress or threatens production stability"
    response_time: "Same day"
    escalation: "Immediate to SA + Senior Manager"
    examples:
      - "Production outage during evaluation"
      - "Security vulnerability with active exploit"
      - "Compliance blocker with no workaround"
      - "Data loss or corruption risk"
  HIGH:
    definition: "Significant risk that could derail timeline or reduce confidence"
    response_time: "Within 24 hours"
    escalation: "SA review required"
    examples:
      - "Performance below customer SLA targets"
      - "Integration incompatibility with key system"
      - "Capacity ceiling approaching within growth horizon"
      - "Architecture anti-pattern with compounding impact"
  MEDIUM:
    definition: "Known concern with manageable mitigation path"
    response_time: "Within 1 week"
    escalation: "Track in risk register"
    examples:
      - "Suboptimal configuration affecting efficiency"
      - "Missing monitoring for key components"
      - "Documentation gaps in architecture decisions"
      - "Dependency on deprecated API version"
  LOW:
    definition: "Minor concern or improvement opportunity"
    response_time: "Next review cycle"
    escalation: "Log for tracking"
    examples:
      - "Code style inconsistencies"
      - "Optional optimization opportunity"
      - "Nice-to-have feature for operational efficiency"

composite_risk_scoring:
  dimensions:
    probability:
      HIGH: 0.8
      MEDIUM: 0.5
      LOW: 0.2
    impact:
      CRITICAL: 10
      HIGH: 7
      MEDIUM: 4
      LOW: 1
    velocity:
      IMMEDIATE: 1.5
      FAST: 1.2
      SLOW: 1.0
  formula: "risk_score = probability * impact * velocity"
  thresholds:
    escalate: ">= 8.0"
    monitor: "4.0 - 7.9"
    accept: "< 4.0"

risk_trending:
  improving: "2+ consecutive assessments with lower score"
  stable: "Score variance < 1.0 across assessments"
  worsening: "2+ consecutive assessments with higher score"
  action_on_worsening: "Reassess mitigation plan, consider escalation"

escalation_triggers:
  - condition: "Any CRITICAL severity risk"
    action: "Immediate notification to SA and Senior Manager"
  - condition: "3+ HIGH risks on single account"
    action: "Request architecture review session"
  - condition: "Risk score trending worsening for 2+ cycles"
    action: "Escalate to Senior Manager with trend analysis"
  - condition: "Customer-facing risk with no mitigation plan"
    action: "Block next customer interaction until plan exists"
