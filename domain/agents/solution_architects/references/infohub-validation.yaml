# InfoHub Validation Reference
# Extracted from: sa_personality.yaml (infohub_validation section)
# Load when: Running InfoHub completeness checks or staleness reports

completeness_checks:
  client_profile_required_fields:
    - "Last activity date"
    - "Key technologies in use"
    - "Active stakeholders"
    - "Recent technical decisions"
    - "Open risks"

  decision_log_required_fields:
    - "Decision description"
    - "Decision maker"
    - "Date"
    - "Rationale"
    - "Architecture impact"

  risk_register_required_fields:
    - "Risk description"
    - "Severity level"
    - "Affected client"
    - "Date identified"
    - "Mitigation status"

staleness_thresholds:
  client_profile: "30 days without update"
  risk_without_mitigation: "14 days"
  decision_without_follow_up: "21 days"
