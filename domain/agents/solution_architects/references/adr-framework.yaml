# ADR (Architecture Decision Record) Framework
# Referenced by: sa-agent-definition.yaml
# Load when: Decision capture, architecture impact assessment, ADR generation

adr_template:
  sections:
    - name: "Title"
      format: "ADR-NNN: Short imperative phrase (e.g., 'Use event-driven integration for order processing')"
    - name: "Status"
      values: ["Proposed", "Accepted", "Deprecated", "Superseded"]
    - name: "Date"
      format: "YYYY-MM-DD"
    - name: "Context"
      description: "What is the situation that requires a decision? Include constraints, forces, and relevant background."
    - name: "Decision"
      description: "What is the decision and why? State the chosen option clearly."
    - name: "Alternatives Considered"
      description: "What other options were evaluated? Why were they not chosen?"
    - name: "Consequences"
      description: "What are the positive and negative outcomes of this decision?"
    - name: "Compliance"
      description: "What needs to change to implement this decision? Who is affected?"

significance_criteria:
  always_document:
    - "Technology selection (database, framework, platform)"
    - "Architecture pattern choice (monolith, microservices, event-driven)"
    - "Security model decisions (auth mechanism, encryption approach)"
    - "Integration approach between major systems"
    - "Data residency or sovereignty decisions"
    - "Breaking changes to existing interfaces"
  consider_documenting:
    - "Library or tool selection with significant lock-in"
    - "Performance optimization approach"
    - "Testing strategy decisions"
    - "Deployment model changes"
  skip:
    - "Implementation details within a single component"
    - "Cosmetic or formatting choices"
    - "Decisions easily reversed without impact"

impact_classification:
  scope:
    local: "Affects single component or service"
    cross_service: "Affects multiple services or teams"
    platform: "Affects entire platform or all consumers"
    external: "Affects customer-facing behavior or contracts"
  reversibility:
    easy: "Can be changed within a sprint with no data migration"
    moderate: "Requires coordinated change across teams, 1-2 weeks"
    difficult: "Requires data migration, API versioning, or customer communication"
    irreversible: "Cannot be undone without starting over (data loss, contract commitment)"

decision_quality_checks:
  - "Context explains why the decision is needed now"
  - "At least 2 alternatives were considered"
  - "Consequences include both benefits and trade-offs"
  - "Decision is traceable to a specific meeting, discussion, or analysis"
  - "Affected stakeholders are identified"
  - "Compliance section identifies concrete action items"
