# Architecture Patterns Reference
# Referenced by: sa-agent-definition.yaml
# Load when: Architecture reviews, deployment model discussions, technical design

deployment_models:
  on_premise:
    characteristics: ["Full control", "Data sovereignty", "Capital expense"]
    considerations: ["Hardware refresh cycles", "Capacity planning", "DR/BC"]
    risk_factors: ["Underprovisioning", "Delayed upgrades", "Skills gap"]
  cloud_native:
    characteristics: ["Elastic scaling", "Managed services", "OpEx model"]
    considerations: ["Vendor lock-in", "Data residency", "Cost governance"]
    risk_factors: ["Cost overrun", "Configuration drift", "Shared responsibility gaps"]
  hybrid:
    characteristics: ["Workload flexibility", "Migration path", "Regulatory balance"]
    considerations: ["Network complexity", "Data synchronization", "Operational overhead"]
    risk_factors: ["Inconsistent security posture", "Latency", "Dual-stack complexity"]
  multi_cloud:
    characteristics: ["Vendor diversity", "Best-of-breed", "Resilience"]
    considerations: ["Complexity", "Skill requirements", "Governance overhead"]
    risk_factors: ["Operational sprawl", "Inconsistent policies", "Integration burden"]

data_architecture:
  patterns:
    centralized: "Single data store, consistent schema, simpler governance"
    distributed: "Domain-owned data, eventual consistency, higher autonomy"
    federated: "Virtual integration, query routing, schema-on-read"
    lakehouse: "Unified batch and streaming, schema evolution, cost-efficient storage"
  evaluation_criteria:
    - "Data volume and growth rate"
    - "Query latency requirements"
    - "Regulatory constraints on data location"
    - "Number of consumers and access patterns"
    - "Schema stability vs evolution needs"

integration_approaches:
  synchronous:
    patterns: ["REST API", "gRPC", "GraphQL"]
    best_for: "Low-latency, request-response workflows"
    risks: ["Tight coupling", "Cascading failures", "Timeout chains"]
  asynchronous:
    patterns: ["Message queue", "Event streaming", "Pub/sub"]
    best_for: "Decoupled systems, high throughput, eventual consistency"
    risks: ["Message ordering", "Dead letters", "Debugging complexity"]
  batch:
    patterns: ["ETL", "File transfer", "Bulk API"]
    best_for: "Large data volumes, scheduled processing, legacy integration"
    risks: ["Stale data", "Error recovery", "Monitoring gaps"]

scaling_strategies:
  horizontal:
    approach: "Add instances behind load balancer"
    prerequisites: ["Stateless design", "Shared-nothing", "Session externalization"]
  vertical:
    approach: "Increase instance resources"
    limits: ["Hardware ceiling", "Downtime for resize", "Cost curve"]
  auto_scaling:
    triggers: ["CPU utilization", "Queue depth", "Request latency", "Custom metrics"]
    considerations: ["Warm-up time", "Minimum instances", "Cost caps", "Scale-down delay"]
