# Capacity Planning Reference
# Referenced by: sa-agent-definition.yaml
# Load when: Sizing sessions, capacity assessments, growth modeling

sizing_methodology:
  inputs_required:
    - "Current data volume (storage, daily ingest rate)"
    - "Expected growth rate (monthly/annual percentage)"
    - "Peak-to-average ratio"
    - "Retention requirements"
    - "Query patterns (read/write ratio, concurrent users)"
    - "SLA targets (latency, availability, throughput)"

  dimensions:
    compute:
      metrics: ["vCPU utilization", "Memory usage", "Instance count"]
      headroom: "Target 60-70% peak utilization for burst capacity"
      scaling_trigger: "Sustained >70% for 15+ minutes"
    storage:
      metrics: ["Total volume", "IOPS", "Throughput MB/s", "Latency"]
      headroom: "Maintain 30% free capacity for operational overhead"
      growth_planning: "Project 12-18 months ahead"
    network:
      metrics: ["Bandwidth utilization", "Packet rate", "Connection count"]
      headroom: "Target 50% peak utilization for traffic bursts"
      bottleneck_indicators: ["Retransmissions", "Queue drops", "Latency spikes"]
    ingest:
      metrics: ["Events per second", "Bytes per second", "Batch size"]
      headroom: "Size for 2x expected peak"
      burst_planning: "Account for log storms, reindexing, backfill operations"

performance_baselines:
  measurement_approach:
    - "Establish baseline under normal load"
    - "Identify degradation thresholds"
    - "Document performance under peak conditions"
    - "Map resource consumption to workload drivers"
  key_metrics:
    - metric: "p50 latency"
      purpose: "Typical user experience"
    - metric: "p95 latency"
      purpose: "Tail latency affecting 5% of requests"
    - metric: "p99 latency"
      purpose: "Worst-case scenario for SLA compliance"
    - metric: "Error rate"
      purpose: "System reliability indicator"
    - metric: "Throughput"
      purpose: "System capacity under load"

growth_modeling:
  linear:
    formula: "current * (1 + growth_rate * months)"
    use_when: "Steady, predictable growth"
  exponential:
    formula: "current * (1 + growth_rate)^months"
    use_when: "Rapid adoption, viral growth patterns"
  stepped:
    description: "Growth in discrete jumps (new regions, product launches)"
    planning: "Map known events to capacity step-ups"

  planning_horizons:
    tactical: "0-3 months, precise sizing"
    operational: "3-12 months, capacity reservations"
    strategic: "12-36 months, architecture decisions"

resource_estimation:
  t_shirt_sizes:
    small: "< 100GB data, < 100 events/sec, < 50 concurrent users"
    medium: "100GB-1TB data, 100-1K events/sec, 50-500 concurrent users"
    large: "1TB-10TB data, 1K-10K events/sec, 500-5K concurrent users"
    xlarge: "> 10TB data, > 10K events/sec, > 5K concurrent users"
