reference_id: REF_SA_BP_001
name: SA Industry Best Practices
description: >
  Industry best practices for AI-assisted Solution Architect operations,
  sourced from cloud providers, analyst firms, EA frameworks, and presales platforms.
  Used to validate SA agent capabilities against market expectations.
version: 1.0.0
last_audited: 2026-03-21
audit_cadence: quarterly

sources:
  cloud_providers:
    - name: AWS
      findings:
        - title: AI-Automated Architecture Review Against Well-Architected Pillars
          relevance: GenAI accelerator ingests architecture docs and evaluates against six pillars, generating assessment reports with recommendations
          gap: SA risk agent evaluates deployment health and capacity but does not perform structured pillar-based reviews (security, reliability, performance, cost optimization, operational excellence, sustainability)
          priority: high
        - title: ADR Lifecycle Management with Status Tracking
          relevance: ADR statuses (Proposed/Accepted/Deprecated/Superseded) with review cadence and linkage between related decisions
          gap: Decision capture agent generates ADRs but does not implement lifecycle management, status transitions, or supersession chain tracking
          priority: high
        - title: ADR Fitness Functions for Automated Compliance
          relevance: Architecture fitness functions (ArchUnit, NetArchTest) verify code changes comply with recorded architecture decisions
          gap: Decisions are captured but never validated against actual deployment. No fitness function or compliance check capability
          priority: high
        - title: Continuous Architecture Governance via AI
          relevance: Transform manual reviews into continuous, intelligent governance rather than point-in-time assessments
          gap: Architecture reviews are event-triggered, not continuously running against evolving architecture state
          priority: medium

    - name: Microsoft / Azure
      findings:
        - title: Architecture Diagram Generation from Unstructured Input (Open Source Agent)
          relevance: Agent accepts any format (YAML, Markdown, meeting notes) and produces risk analysis plus interactive Excalidraw diagrams with dependency mapping
          gap: SA agent produces text-based risk assessments and architecture analyses but no visual architecture diagrams or component dependency maps
          priority: high
        - title: AI Agent Orchestration Design Patterns (Routing, Planning, Reflection)
          relevance: Patterns for dynamic intent-based routing, agent self-evaluation, and complex request decomposition
          gap: SA orchestrator uses static routing rules. No reflection (output quality self-evaluation) or planning (complex request decomposition) patterns
          priority: medium

    - name: 6pillars.ai
      findings:
        - title: Auto-Discovery and Auto-Fill of Architecture Reviews
          relevance: Answers 54 of 57 Well-Architected questions automatically, delivers reviews in 30 min vs 50 hours manually
          gap: Architecture health check requires manual input. No automated assessment tool that auto-discovers deployment posture
          priority: medium

  analyst_firms:
    - name: Gartner
      findings:
        - title: EA Teams Need Financial Modeling and AI Skills
          relevance: Architecture decisions increasingly need financial impact quantification
          gap: Decision capture agent does not include financial impact as standard dimension. No cost/value impact on ADRs
          priority: medium
        - title: AI Security Platforms for Agent Governance
          relevance: Centralized visibility, usage policy enforcement, protection against prompt injection and data leakage
          gap: Guardrails are per-agent, not system-wide. No centralized security layer monitoring for cross-sub-agent threats
          priority: medium

    - name: Forrester
      findings:
        - title: Buyers Demand Proof Over Promises, CFOs Enter AI Deals
          relevance: CFOs pulled into more AI deals requiring financial-level value quantification, not just technical feasibility
          gap: none
          status: already_aligned
          note: CFO-level financial modeling (TCO, IRR, NPV) is VE Agent's domain (REF_VE_BP_001). SA value sub-agent provides technical-to-business translation, not financial modeling
        - title: 25% of Planned AI Spend Deferred to 2027 Due to Failed Pilots
          relevance: POC/pilot success rates are low. SAs need better evaluation frameworks to prevent failure
          gap: No explicit pilot success framework with structured success criteria, measurement plans, and early warning signals
          priority: medium

  ea_frameworks:
    - name: TOGAF / Open Group
      findings:
        - title: AI-Enhanced TOGAF ADM with Automatic Traceability
          relevance: Generate ArchiMate strategy maps from business goals, create automatic traceability between requirements, processes, and technology components
          gap: Decision capture agent captures individual decisions but does not maintain traceability links. When business goals change, no automatic impact analysis across the decision chain
          priority: high
        - title: AI-Generated ArchiMate Models from Architecture Descriptions
          relevance: Generate formal architecture models from natural language, reducing gap between informal conversations and formal EA documentation
          gap: All outputs are text-based. No formal architecture model generation in standard notations (ArchiMate, C4, UML)
          priority: medium

    - name: UK Government Digital Service
      findings:
        - title: Standardized Cross-Organization ADR Framework for Governance
          relevance: ADRs feed into formal governance boards (Technical Design Council). Framework separates guidance from template
          gap: ADRs generated but not connected to governance workflows or design authority review. No cross-account ADR reuse to avoid solving same problem differently
          priority: medium

  presales_platforms:
    - name: 1up.ai / SiftHub / Inventive.ai
      findings:
        - title: AI-Automated RFP/RFI Response Generation
          relevance: Ingests past responses, product docs, competitive positioning to generate technical responses. 60-80% time reduction
          gap: Discovery agent handles RFI ingestion for discovery purposes but does not generate RFP/RFI responses. No response automation capability
          priority: high
        - title: AI-Generated Dynamic Battle Cards from Internal Content
          relevance: 85-95% reduction in manual research time, 30-40% improvement in competitive win rates
          gap: none
          status: already_aligned
          note: Competitive intelligence is CI Agent's domain (REF_CI_BP_001). SA consumes CI outputs for technical positioning but does not own battle card creation or competitive monitoring
        - title: Real-Time Technical Support During Customer Calls
          relevance: AI whisper agent feeds human SA relevant information during live customer interactions
          gap: SA agent operates asynchronously. No real-time support capability during live calls. Engagement agent prepares for meetings but does not support during them
          priority: medium
        - title: AI-Automated Technical Proposal Generation
          relevance: Generate complete solution briefs combining product knowledge, customer context, deal requirements. Sales cycles shortened 35%
          gap: No sub-agent produces complete customer-facing technical proposals combining architecture, risk, value, and implementation approach
          priority: high

  poc_methodology:
    - name: Enterprise POC Best Practices (Opine)
      findings:
        - title: Structured POC Scope with Success Criteria Gates
          relevance: POCs fail primarily due to scope creep. 3-5 success criteria, measurable thresholds, weekly checkpoints, hard stops
          gap: CSP agent includes evaluation milestones but no dedicated POC scope management with scope creep tracking or success criteria gate enforcement
          priority: high
        - title: Lightweight POC Alternatives (Interactive Demos, Guided Simulations)
          relevance: 70% of purchase decisions influenced by hands-on experience. Interactive demos provide faster validation with lower resource investment
          gap: Engagement agent focuses on traditional demos and workshops. No flow for interactive demo experiences or self-service evaluation environments
          priority: medium

  handoff_methodology:
    - name: Gainsight
      findings:
        - title: Structured Outcomes-Based Handoff from Presales to Customer Success
          relevance: 5-step process with outcomes tracking through sales cycle. 23-67% of churn ties to ineffective onboarding
          gap: CSP handoff is document-centric, not outcomes-centric. No validation that defined outcomes survive the handoff and are adopted by post-sales team
          priority: high
        - title: Early CA Introduction During Presales
          relevance: Introducing post-sales owner during late-stage presales builds trust and reduces friction
          gap: CSP agent defines handoff at deal close but does not model early CA introduction. Journey agent does not include CA shadow participation as touchpoint type
          priority: medium

  emerging_patterns:
    - name: Architecture Governance Automation
      findings:
        - title: Agentic AI for Proactive Architecture Governance (O'Reilly)
          relevance: AI agents enforce governance by continuously monitoring changes against recorded decisions. Two enforcement layers, proactive and reactive
          gap: Decision capture agent records decisions but has no enforcement mechanism. Acceptable in presales but valuable for existing deployment oversight
          priority: medium

    - name: Solution Design Acceleration
      findings:
        - title: Reusable Architecture Pattern and Component Libraries
          relevance: Maintain validated patterns and reusable components for rapid assembly rather than designing from scratch
          gap: Best practices agent maintains knowledge but no composable pattern catalog. Reference architecture framework provides templates but pattern reuse is manual
          priority: medium
        - title: AI-Automated Solution Sizing from Workload Data
          relevance: Analyze workload characteristics, growth projections, infrastructure constraints for optimal configuration recommendations
          gap: Risk agent includes capacity planning but initial solution sizing is manual. No sub-agent generates sizing recommendations from customer data
          priority: medium

gap_summary:
  high:
    - Pillar-based architecture review against Well-Architected frameworks (AWS, Azure, GCP)
    - ADR lifecycle management with status tracking and supersession chains (AWS)
    - ADR fitness functions for automated compliance verification (AWS, O'Reilly)
    - TOGAF traceability, automatic impact analysis when business goals change
    - Architecture diagram generation from unstructured input (Microsoft open source)
    - RFP/RFI response automation from past responses and product knowledge (1up.ai, SiftHub)
    - Customer-facing technical proposal generation combining all SA outputs (Inventive.ai)
    - POC scope management with success criteria gates and scope creep tracking (Opine)
    - Outcomes-based handoff validation, not document-centric (Gainsight)

  medium:
    - Continuous architecture governance vs event-triggered reviews (AWS)
    - Real-time meeting support / whisper agent during customer calls (SiftHub)
    - Unified deal-level technical dashboard synthesizing all sub-agent outputs
    - Formal architecture model generation in ArchiMate, C4, UML (TOGAF)
    - Agent orchestration reflection and planning patterns (Azure)
    - Centralized agent security layer across sub-agents (Gartner)
    - Auto-discovery of deployment posture for health checks (6pillars.ai)
    - Early CA introduction during presales (Gainsight)
    - ADR cross-account reuse and governance workflow connection (UK GDS)
    - Financial dimension in architecture decisions (Gartner EA)
    - ADR validation agent / peer review step (industry practice)
    - Reusable architecture pattern and component libraries
    - Solution sizing automation from workload data
    - Lightweight POC alternatives (interactive demos, guided simulations)
    - Pilot success framework with early warning signals (Forrester)

  low:
    - SA agent system self-measurement and meta-level ROI tracking
