# Migration Patterns Reference
# Referenced by: sa-agent-definition.yaml
# Load when: Migration scenarios, cutover planning, risk assessment for transitions

migration_strategies:
  big_bang:
    description: "Full cutover in single maintenance window"
    best_for: "Small datasets, simple schemas, low-risk environments"
    risks: ["Extended downtime", "Rollback complexity", "All-or-nothing outcome"]
    prerequisites: ["Complete testing", "Rollback plan", "Stakeholder alignment on downtime"]

  phased:
    description: "Migrate in stages, workload by workload or team by team"
    best_for: "Large environments, multiple workloads, risk-averse organizations"
    risks: ["Dual-run costs", "Cross-phase dependencies", "Extended timeline"]
    prerequisites: ["Phase boundaries defined", "Inter-phase data flow plan", "Per-phase rollback"]

  parallel_run:
    description: "Run old and new systems simultaneously, validate before cutover"
    best_for: "Mission-critical workloads, compliance requirements, data accuracy validation"
    risks: ["Double compute costs", "Data sync complexity", "Team cognitive load"]
    prerequisites: ["Comparison framework", "Sync mechanism", "Clear cutover criteria"]

  strangler_fig:
    description: "Incrementally route traffic from old to new system"
    best_for: "Legacy modernization, API-fronted systems, gradual risk reduction"
    risks: ["Routing complexity", "Feature parity gaps", "Long tail of legacy"]
    prerequisites: ["Traffic routing layer", "Feature parity tracking", "Monitoring both paths"]

risk_factors:
  data_migration:
    - "Schema differences between source and target"
    - "Data volume and transfer time"
    - "Referential integrity across migrated and non-migrated data"
    - "Character encoding and timezone handling"
    - "Historical data completeness requirements"

  integration_migration:
    - "API version differences"
    - "Authentication mechanism changes"
    - "Rate limit adjustments"
    - "Endpoint URL changes requiring consumer updates"

  operational:
    - "Team familiarity with new platform"
    - "Monitoring and alerting coverage"
    - "Runbook availability for new environment"
    - "On-call rotation adjustments"

rollback_planning:
  requirements:
    - "Point-in-time recovery capability"
    - "Data written during migration must be preservable"
    - "Rollback decision criteria defined before start"
    - "Rollback time budget agreed with stakeholders"
  decision_triggers:
    - "Data integrity check failure"
    - "Performance below acceptance threshold"
    - "Critical integration failure"
    - "Rollback window expiring without green status"

phased_approach_template:
  phases:
    - name: "Assessment"
      activities: ["Inventory", "Dependency mapping", "Risk assessment", "Timeline"]
    - name: "Preparation"
      activities: ["Environment setup", "Migration tooling", "Test migrations", "Runbooks"]
    - name: "Pilot"
      activities: ["Non-critical workload migration", "Validation", "Process refinement"]
    - name: "Execution"
      activities: ["Phased workload migration", "Continuous validation", "Stakeholder communication"]
    - name: "Optimization"
      activities: ["Performance tuning", "Cost optimization", "Decommission old systems"]
