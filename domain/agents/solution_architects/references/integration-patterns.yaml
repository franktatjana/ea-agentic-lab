# Integration Patterns Reference
# Referenced by: sa-agent-definition.yaml
# Load when: Integration assessment, data flow analysis, API design reviews

common_patterns:
  api_gateway:
    description: "Centralized entry point for all API consumers"
    use_when: "Multiple consumers, rate limiting needed, auth centralization"
    risks: ["Single point of failure", "Latency overhead", "Version management"]

  event_driven:
    description: "Producers emit events, consumers react independently"
    use_when: "Loose coupling, multiple consumers, eventual consistency acceptable"
    risks: ["Event ordering", "Schema evolution", "Dead letter handling"]

  saga:
    description: "Distributed transaction across services via compensating actions"
    use_when: "Cross-service transactions, long-running processes"
    risks: ["Compensation complexity", "Partial failure states", "Debugging difficulty"]

  data_sync:
    description: "Bidirectional or unidirectional data replication between systems"
    use_when: "System of record patterns, offline capability, reporting"
    risks: ["Conflict resolution", "Drift detection", "Consistency windows"]

  webhook:
    description: "Push notifications from source to registered endpoints"
    use_when: "Real-time notifications, third-party integration, event forwarding"
    risks: ["Delivery guarantees", "Retry storms", "Endpoint availability"]

anti_patterns:
  point_to_point_spaghetti:
    description: "Direct connections between every system pair"
    symptoms: ["N*(N-1)/2 connections", "No central visibility", "Change cascade"]
    resolution: "Introduce integration layer (ESB, event bus, API gateway)"

  shared_database:
    description: "Multiple services reading/writing same database tables"
    symptoms: ["Schema coupling", "Lock contention", "Unclear ownership"]
    resolution: "Service-owned data with API-based access"

  chatty_integration:
    description: "Excessive fine-grained API calls for single operation"
    symptoms: ["High latency", "Network saturation", "Fragile under load"]
    resolution: "Batch endpoints, aggregation layer, BFF pattern"

  temporal_coupling:
    description: "Services must be available simultaneously for operation"
    symptoms: ["Cascading failures", "Retry storms", "Deployment dependencies"]
    resolution: "Async messaging, circuit breaker, bulkhead"

complexity_indicators:
  low: "1-3 integrations, same protocol, same team owns both sides"
  medium: "4-8 integrations, mixed protocols, cross-team coordination"
  high: "9+ integrations, legacy systems, multi-vendor, regulatory data flows"
  scoring:
    - dimension: "Number of integration points"
    - dimension: "Protocol heterogeneity"
    - dimension: "Data sensitivity classification"
    - dimension: "Team boundary crossings"
    - dimension: "SLA mismatch between systems"

data_flow_assessment:
  questions:
    - "What is the system of record for each data entity?"
    - "What is the acceptable latency for data propagation?"
    - "What happens when a downstream system is unavailable?"
    - "How are schema changes communicated across boundaries?"
    - "What audit trail exists for data in transit?"
