# Discovery Methodology Reference
# Referenced by: sa-agent-definition.yaml, PB_SA_014 (Technical Discovery)
# Load when: Technical discovery sessions, requirements gathering, stakeholder mapping

# ==============================================================================
# PRE-ENGAGEMENT INTELLIGENCE
# ==============================================================================
pre_engagement_research:
  purpose: "Build initial understanding of the customer's landscape before first contact, using publicly available sources"
  sources:
    - "Company website, engineering blog, and technical publications"
    - "Job postings (reveal technology stack, team structure, hiring priorities)"
    - "Industry analyst reports covering the customer's vertical"
    - "Public conference talks or open-source contributions by customer engineers"
    - "Annual reports, earnings calls (for public companies)"
    - "LinkedIn profiles of technical leadership"
  synthesis_technique:
    approach: "Mind mapping to connect information across domains"
    purpose: "Visual representation helps identify gaps, relationships, and hypotheses before customer conversations"
    output: "Initial landscape sketch with technology stack, team structure, strategic initiatives, and open questions"
  sa_ae_collaboration:
    ae_contributes: "Business context, relationship history, commercial priorities, organizational politics"
    sa_contributes: "Technology landscape hypothesis, technical challenge areas, capability alignment ideas"
    joint_output: "Aligned discovery plan with targeted questions per stakeholder"

# ==============================================================================
# DISCOVERY DIMENSIONS
# ==============================================================================
discovery_dimensions:
  business_outcomes:
    purpose: "Understand what success looks like in business terms"
    key_questions:
      - "What business problem is driving this initiative?"
      - "How do you measure success today?"
      - "What is the cost of inaction?"
      - "What is the expected timeline for value realization?"
    red_flags:
      - "No clear business sponsor"
      - "Success metrics undefined or purely technical"
      - "Initiative driven by technology curiosity, not business need"

  current_state:
    purpose: "Map the existing landscape before proposing changes"
    key_questions:
      - "What systems handle this workflow today?"
      - "What are the current pain points and workarounds?"
      - "What data flows exist between systems?"
      - "What is the current scale (users, data volume, transactions)?"
    red_flags:
      - "No documentation of current architecture"
      - "Significant tribal knowledge dependencies"
      - "Active technical debt with no remediation plan"

  requirements:
    purpose: "Distinguish must-haves from nice-to-haves with evidence"
    categories:
      functional: "What the system must do"
      non_functional: "How the system must perform (latency, availability, throughput)"
      security: "Authentication, authorization, encryption, compliance"
      operational: "Monitoring, backup, DR, maintenance windows"
      integration: "APIs, data formats, protocols, existing system connections"
    prioritization: "MoSCoW (Must/Should/Could/Won't) validated with stakeholders"

  stakeholders:
    purpose: "Map who influences, decides, and implements"
    roles_to_identify:
      - "Technical decision maker"
      - "Business sponsor"
      - "End user representatives"
      - "IT operations team"
      - "Security/compliance team"
      - "Procurement/legal"
    assessment_points:
      - "Decision authority level"
      - "Technical depth"
      - "Engagement willingness"
      - "Potential blockers or champions"
      - "Disposition: advocate, neutral, or resistant"

  timeline:
    purpose: "Establish realistic milestones with dependencies"
    key_inputs:
      - "Business deadline drivers (regulatory, competitive, fiscal)"
      - "Technical dependencies and prerequisites"
      - "Resource availability (customer and vendor)"
      - "Change management and training needs"
    red_flags:
      - "Aggressive timeline with no resource commitment"
      - "No phasing, everything in single big-bang release"
      - "External deadline with no flexibility and unclear scope"

# ==============================================================================
# DISCUSSION AREAS
# ==============================================================================
# Practitioner-level areas to probe during initial customer engagement.
# Not all areas apply to every customer. Select based on industry, maturity,
# and initial intelligence.

discussion_areas:
  technology_landscape:
    description: "Understand the customer's technology estate and strategic direction"
    topics:
      - "Current platform stack and architecture patterns"
      - "Strategic technology initiatives and transformation programs"
      - "Migrations underway or planned (platform, cloud, language, framework)"
      - "Application modernization approach and progress"
      - "Microservice architecture and development process maturity"
      - "Infrastructure strategy (cloud-native, hybrid, on-premises)"
    probing_for:
      - "Pain points and challenges with current approach"
      - "What the current solution is and who owns it"
      - "Whether the problem is isolated (single team) or systemic (cross-organization)"

  engineering_practices:
    description: "Assess the maturity and effectiveness of engineering processes"
    topics:
      - "Development workflow from code to production"
      - "Code review and approval processes"
      - "CI/CD pipeline maturity and automation level"
      - "Testing strategy and quality gates"
      - "Release frequency and deployment confidence"
      - "Agile practices and process maturity"
      - "Team collaboration patterns and tooling"
    probing_for:
      - "Manual bottlenecks in the delivery pipeline"
      - "Gaps between team practices and organizational standards"
      - "Developer experience friction points"

  governance_and_compliance:
    description: "Map regulatory, compliance, and governance requirements"
    topics:
      - "Regulatory mandates affecting software delivery"
      - "Compliance audit requirements and frequency"
      - "Change control processes and approval chains"
      - "Policy enforcement mechanisms (automated vs. manual)"
      - "Audit trail and evidence generation capabilities"
    probing_for:
      - "Compliance gaps that create risk or slow delivery"
      - "Manual compliance processes that could be automated"

  security_posture:
    description: "Understand security practices and cybersecurity exposure"
    topics:
      - "Application security practices (SAST, DAST, dependency scanning)"
      - "Secure software development lifecycle maturity"
      - "Security posture visibility and vulnerability management"
      - "Shift-left security adoption and developer integration"
      - "Supply chain security practices"
    probing_for:
      - "Security as an afterthought vs. integrated into development"
      - "Visibility gaps in security posture"

  organizational_context:
    description: "Understand team structure, collaboration, and change readiness"
    topics:
      - "Technical team structure and reporting lines"
      - "Key technical engagements and cross-team collaborations"
      - "Talent retention challenges and skill gaps"
      - "Change management appetite and organizational readiness"
      - "Developer productivity and satisfaction signals"
    probing_for:
      - "Organizational silos that impede delivery"
      - "Champions who can drive adoption internally"
      - "Resistance patterns and their root causes"

  industry_context:
    description: "Industry-specific initiatives and external drivers"
    topics:
      - "Industry regulations and compliance frameworks"
      - "Competitive pressures driving technology investment"
      - "Industry transformation trends affecting the customer"
      - "Vertical-specific technology patterns and standards"
    probing_for:
      - "External deadlines or mandates driving urgency"
      - "Industry peers the customer benchmarks against"

# ==============================================================================
# PERSONA-SPECIFIC ENGAGEMENT
# ==============================================================================
persona_engagement:
  platform_engineering:
    focus: "Tools, process, and delivery pipeline challenges"
    listen_for: "Adoption friction, developer experience gaps, tooling fragmentation"

  application_development:
    focus: "Development workflow, testing, and deployment challenges"
    listen_for: "Process pain, manual steps, inconsistent environments, slow feedback loops"

  engineering_management:
    focus: "Delivery velocity, team productivity, and strategic alignment"
    listen_for: "Visibility gaps, reporting challenges, resource constraints, initiative prioritization"

  operations:
    focus: "Reliability, monitoring, incident response, and infrastructure"
    listen_for: "Operational toil, alert fatigue, deployment fear, rollback frequency"

  security_team:
    focus: "Vulnerability management, compliance evidence, policy enforcement"
    listen_for: "Security-developer friction, audit preparation burden, visibility gaps"

# ==============================================================================
# SA-AE COLLABORATION MODEL
# ==============================================================================
sa_ae_collaboration:
  principle: "Discovery is joint SA-AE work. AE owns business context, SA owns technical landscape."

  ae_driven_activities:
    - "Set the stage with the right meetings and participants"
    - "Take notes and capture organizational structure"
    - "Discover and confirm the organizational approach and business priorities"
    - "Provide key business directions to the SA team"

  sa_driven_activities:
    - "Assess the conversation as transactional vs. strategic (see solution-fit-methodology.yaml)"
    - "Map the technical team structure and identify stakeholders for expanded discussion"
    - "Identify technical challenges and align platform capabilities to customer environment"
    - "Indicate main capability areas and high-level solution approach for subsequent conversations"

  joint_activities:
    - "Collaborate on organizational priority and inject initiatives beyond tool/feature discussions"
    - "Agree on pre-qualification based on personas engaged and opportunity size"
    - "Analyze current data and connect business points with technical aspects"

  post_session:
    - "SA synthesizes technical findings into discovery report"
    - "AE confirms business context and commercial framing"
    - "Joint alignment on next activities and customer engagement plan"

# ==============================================================================
# SYNTHESIS FRAMEWORK
# ==============================================================================
synthesis_framework:
  output: "Technical Discovery Summary"
  sections:
    - "Business Context and Drivers"
    - "Current State Assessment"
    - "Requirements (prioritized)"
    - "Stakeholder Map"
    - "Timeline and Milestones"
    - "Identified Risks and Gaps"
    - "Recommended Next Steps"
  quality_check:
    - "Every requirement traces to a business driver"
    - "Every risk has a proposed mitigation or investigation path"
    - "Stakeholder map covers all decision and influence roles"
    - "Timeline accounts for dependencies and resource constraints"
    - "Discussion areas explored match the customer's industry and maturity"
