# Solution Fit Methodology Reference
# Referenced by: PB_SA_015 (Solution Fit Assessment)
# Load when: Assessing opportunity shape and mapping capabilities to customer needs

# ==============================================================================
# OPPORTUNITY SHAPE ASSESSMENT
# ==============================================================================
# The critical bifurcation: is this a point-solution need (transactional) or
# an enterprise transformation opportunity (strategic)? This assessment
# determines the entire pursuit approach.

opportunity_shape:
  transactional:
    definition: "Customer seeks a targeted solution for a specific problem with limited organizational scope"
    signals:
      - "Customer focused on a single feature or tool to solve a specific problem"
      - "Small team scope, required to integrate to existing tools"
      - "No executive sponsorship or initiative beyond the immediate need"
      - "Sentiment centered on tool comparison, not business outcomes"
      - "Individual or team focused on a specific capability, not platform approach"
    approach:
      - "Efficient, focused engagement"
      - "Quick demonstration of capability-to-problem fit"
      - "Short evaluation cycle (guided trial)"
      - "May earn the right for a broader conversation later"
    caution: "Not all transactional deals stay transactional. A small initial win can open strategic conversations if the SA identifies broader signals during engagement."

  strategic:
    definition: "Customer pursuing enterprise-wide transformation with organizational impact"
    signals_to_drive_strategic:
      - "Appetite for process and structure re-alignment (agile transformation, shift-left security)"
      - "Discussion moves to organizational mindset, people, and culture, not just tools and features"
      - "Interest in maturity benchmarks and accelerated delivery practices"
      - "Focus on developer experience and cross-team collaboration improvement"
      - "Stakeholders discuss adoption, change management, and organizational thinking"
      - "Initial conversation earns invitation to broader or higher-level meetings"
      - "Multiple teams or departments affected by the problem"
    approach:
      - "Multi-stakeholder, executive-level engagement"
      - "Value Stream Mapping workshop to map end-to-end process"
      - "Phased technology roadmap aligned with business milestones"
      - "Deep technical evaluation (Proof of Value)"
      - "Architecture Communication Plan for different audiences"

  land_and_expand:
    definition: "Enter with a transactional win, expand strategically once credibility is established"
    indicators:
      - "Strategic signals present but executive sponsor not yet engaged"
      - "Customer receptive to broader conversation but needs proof of value first"
      - "Small initial deal can demonstrate capability for larger initiative"
    approach:
      - "Win the tactical deal efficiently"
      - "Deliver visible value within 30-90 days"
      - "Use initial success to earn broader conversations"
      - "Position value stream discovery or strategic review as next step"

# ==============================================================================
# CAPABILITY FRAMEWORK
# ==============================================================================
# Maps customer needs to solution capability areas. These are vendor-neutral
# capability domains that any platform solution may address.

capability_framework:
  developer_experience:
    description: "Capabilities that improve how developers build, review, and ship code"
    areas:
      - "Code management with review and approval workflows"
      - "Ownership and process from develop through release and operate"
      - "Team collaboration and transferable skills across teams"
      - "Developer productivity measurement and improvement"
      - "Talent retention through modern tooling and practices"
    maps_to_pain: "Developer friction, slow feedback loops, inconsistent tooling, manual processes"

  governance_and_compliance:
    description: "Capabilities that embed compliance into the delivery pipeline"
    areas:
      - "Regulatory mandate enforcement in software delivery"
      - "Compliance audit evidence generation and tracking"
      - "Change control automation and approval workflows"
      - "Policy-as-code enforcement across teams"
    maps_to_pain: "Audit preparation burden, manual compliance checks, policy inconsistency"

  security:
    description: "Capabilities that integrate security into the development lifecycle"
    areas:
      - "Application security scanning (static, dynamic, dependency)"
      - "Secure software development lifecycle (SSDLC)"
      - "Security posture visibility and vulnerability management"
      - "Supply chain security and software bill of materials"
      - "Cybersecurity exposure reduction"
    maps_to_pain: "Security as afterthought, late-stage vulnerability discovery, security-developer friction"

  delivery_automation:
    description: "Capabilities that accelerate and stabilize the path from code to production"
    areas:
      - "CI/CD pipeline automation and optimization"
      - "Deployment strategy (blue-green, canary, progressive)"
      - "Environment provisioning and infrastructure as code"
      - "Release orchestration across teams and services"
    maps_to_pain: "Manual deployment, slow release cycles, deployment fear, environment inconsistency"

  platform_consolidation:
    description: "Capabilities that reduce tool sprawl and create a unified development platform"
    areas:
      - "Single platform for the complete software lifecycle"
      - "Consistent developer experience across teams"
      - "Reduced integration maintenance between point tools"
      - "Centralized visibility and analytics"
    maps_to_pain: "Tool fragmentation, integration tax, inconsistent processes across teams"

# ==============================================================================
# SOLUTION OPTIONS
# ==============================================================================
# When capabilities are identified, solution options can be framed. These
# are outcome-oriented framings, not product features.

solution_options:
  shift_left_security:
    outcome: "Security team engaged early, measurable business outcome in security posture improvement while accelerating software delivery"
    capability_areas: ["security", "delivery_automation"]
    customer_profile: "Security is a recognized concern, compliance requirements, security team exists but operates in reactive mode"

  continuous_compliance:
    outcome: "Compliance built into the delivery pipeline, governance policies enforced automatically, audit evidence generated as a byproduct of normal delivery"
    capability_areas: ["governance_and_compliance", "delivery_automation"]
    customer_profile: "Regulated industry, audit burden, change control overhead, compliance team struggling to keep pace with delivery"

  automated_delivery:
    outcome: "Modernized CI/CD driving delivery performance, organization becoming a top performer in software delivery velocity and reliability"
    capability_areas: ["delivery_automation", "developer_experience"]
    customer_profile: "Manual or fragile deployment processes, slow release cycles, desire to improve DORA metrics"

  unified_platform:
    outcome: "Consolidated toolchain with unified developer experience, reduced integration tax, and scalable adoption across the organization"
    capability_areas: ["platform_consolidation", "developer_experience"]
    customer_profile: "Tool sprawl, inconsistent practices across teams, integration maintenance burden, scaling challenges"

# ==============================================================================
# ROADMAP CONSTRUCTION
# ==============================================================================
roadmap_guidance:
  principles:
    - "Align technology milestones with customer's business strategy and initiative timeline"
    - "Start with quick wins that demonstrate visible value within 30-90 days"
    - "Phase from initial value to broader platform adoption"
    - "Each phase should be independently valuable, not dependent on completing all phases"

  typical_phasing:
    phase_1:
      label: "Quick Win / Initial Value"
      duration: "30-90 days"
      focus: "Solve the most visible pain point, establish credibility"
      criteria: "Can be deployed with minimal organizational change"

    phase_2:
      label: "Core Platform / Expand"
      duration: "3-6 months"
      focus: "Broader capability adoption, more teams onboarded"
      criteria: "Requires organizational alignment and change management"

    phase_3:
      label: "Enterprise Transformation"
      duration: "6-12+ months"
      focus: "Full platform adoption, process standardization, maturity improvement"
      criteria: "Executive sponsorship, dedicated transformation program"

  roadmap_alignment:
    - "Map phases to customer's fiscal year and budget cycles"
    - "Align with customer's own strategic initiatives and milestones"
    - "Account for change management and adoption ramp time"
    - "Include success criteria per phase so value is measurable"
    - "Roadmap becomes input for Customer Success Plan after close"

# ==============================================================================
# QUALIFICATION DECISION
# ==============================================================================
# After assessment, determine the pursuit approach

pursuit_decision:
  go_strategic:
    criteria: "Strategic signals strong, exec sponsor identified, organizational scope confirmed"
    next_steps:
      - "Value Stream Mapping (PB_SA_011)"
      - "Solution Description / HLD (PB_SA_003)"
      - "Technology Roadmap co-creation with customer"
      - "Architecture Communication Plan for multiple audiences (PB_SA_010)"

  go_transactional:
    criteria: "Point solution, single team, clear capability match"
    next_steps:
      - "Targeted demo (PB_SA_006)"
      - "Guided trial with 3 defined goals (PB_SA_012)"
      - "Fast close, position for future expansion"

  go_land_and_expand:
    criteria: "Strategic potential but needs proof point first"
    next_steps:
      - "Demo or short evaluation for immediate need (PB_SA_006 / PB_SA_012)"
      - "Deliver quick win"
      - "Use success to propose VSD or strategic review (PB_SA_011)"

  defer:
    criteria: "Signals ambiguous, insufficient data for assessment"
    next_steps:
      - "Additional targeted discovery (PB_SA_014)"
      - "Focus on exec sponsor identification and organizational scope questions"
