# Best Practices Framework
# Referenced by: sa-agent-definition.yaml
# Load when: Best practice creation, gap analysis, meeting prep from best practices

template_structure:
  required_sections:
    - name: "Title"
      description: "Clear, descriptive name for the best practice"
    - name: "Solution Area"
      description: "Which product/domain area this applies to"
    - name: "Summary"
      description: "2-3 sentence overview of the practice and its value"
    - name: "When to Apply"
      description: "Specific scenarios, triggers, or conditions where this practice applies"
    - name: "Implementation Guide"
      description: "Step-by-step approach with configuration examples"
    - name: "Common Pitfalls"
      description: "What to avoid and why, with real-world consequences"
    - name: "Verification"
      description: "How to confirm the practice is correctly implemented"
  optional_sections:
    - name: "Q&A"
      description: "Frequently asked customer questions with vetted answers"
    - name: "Related Practices"
      description: "Cross-references to complementary best practices"
    - name: "Version History"
      description: "Change log tracking updates to the practice"

quality_criteria:
  content:
    - "Every recommendation cites product documentation or validated testing"
    - "Implementation steps are reproducible by a customer without vendor assistance"
    - "Pitfalls include specific symptoms and remediation steps"
    - "Verification section includes measurable acceptance criteria"
  currency:
    - "Reviewed within last 6 months"
    - "Compatible with current product version"
    - "No deprecated APIs or features referenced"
  completeness:
    - "Covers common customer scenarios"
    - "Addresses both greenfield and existing deployment contexts"
    - "Includes resource sizing guidance where applicable"

update_triggers:
  immediate:
    - "Product version with breaking changes to the practice"
    - "Customer-reported issue caused by following the practice"
    - "Security vulnerability in recommended approach"
  scheduled:
    - "New product release with relevant feature changes"
    - "Quarterly review cycle"
    - "Accumulated Q&A additions exceeding 5 items"

gap_analysis_methodology:
  approach:
    - "Inventory all solution areas and deployment patterns"
    - "Map existing best practices to solution areas"
    - "Identify coverage gaps by comparing inventory to practices"
    - "Prioritize gaps by customer frequency and deal impact"
  prioritization:
    high: "Solution area appears in >50% of customer deployments, no best practice exists"
    medium: "Solution area appears in 20-50% of deployments, partial coverage"
    low: "Solution area is niche (<20%) or well-covered by product documentation"
  output: "Gap report with prioritized list of practices to create, assigned to solution area owners"

meeting_prep_from_best_practice:
  steps:
    - "Identify which best practices apply to the customer's solution area"
    - "Extract key recommendations relevant to their deployment context"
    - "Prepare common pitfall warnings based on their architecture"
    - "Pre-load Q&A content for anticipated questions"
    - "Note any practices that need updating based on customer feedback"
