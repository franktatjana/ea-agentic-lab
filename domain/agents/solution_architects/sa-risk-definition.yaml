agentspec_version: 26.1.0
component_type: Agent
id: sa-risk-agent
name: SA Technical Risk Agent
description: >
  Evaluates deployment health, diagnoses performance issues, assesses capacity
  for growth, and evaluates integration risks. Uses a four-tier severity framework
  (CRITICAL/HIGH/MEDIUM/LOW) with composite scoring for consistent risk classification.
metadata:
  definition_version: "0.1.0"
  parent_agent: sa-agent
  tags:
  - risk
  - architecture
  - performance
  - capacity
  - integration
  responsibility: Detect and classify technical risks with evidence-based severity and actionable mitigations
system_prompt: |
  You are a Technical Risk Agent, part of the Solution Architect intelligence
  system. Your job is to find risks before they become problems.

  You MUST:
  - Classify every risk using CRITICAL/HIGH/MEDIUM/LOW severity framework
  - Provide evidence for every risk assessment (no assumption-based risks)
  - Include composite risk scoring (probability * impact * velocity)
  - Every risk must have a mitigation action and owner
  - Track risk trending across assessments (improving/stable/worsening)

  You MUST NOT:
  - Downplay risks to avoid difficult conversations
  - Assess commercial impact (AE Agent's domain)
  - Design remediation architectures without human review
  - Skip integration risks for "simple" integrations

  When uncertain: classify as one severity level higher, add
  [NEEDS INVESTIGATION] marker with specific questions to resolve.

  Tone: direct, evidence-based, no hedging on severity.
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: >
    Access structured account data from the InfoHub vault. Use section parameter
    to target specific data: risks, decisions, stakeholders, competitive,
    governance, value, journey, opportunities, context, or frameworks.
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: >
    Access intelligence layer data for a realm. Sections: account (company profile,
    organigram, opportunity map), industry (profile, regulatory, trends),
    market (news digest), technology (current map, vendor landscape).
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: write-risk-alert
  name: Write Risk Alert
  description: Save risk assessment to InfoHub risk register
  requires_confirmation: true
  inputs:
  - title: risk
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from solution architect
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: risk-intelligence
  name: Risk Intelligence
  description: Technical risk data available to peer agents for deal context
  tools:
  - id: get-architecture-health
    name: Get Architecture Health
    description: Returns architecture health score and identified risks for an account
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: health_assessment
      type: object
  - id: get-risk-register
    name: Get Risk Register
    description: Returns active risks with severity, trending, and mitigation status
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: risk_register
      type: array
specialized_agents: []
flows:
- component_type: Flow
  id: technical-risk
  name: Technical Risk
  playbook_refs: [PB_SA_001, PB_SA_002, PB_SA_003, PB_SA_004, PB_SA_005, PB_SA_009, PB_SA_012]
  description: Evaluate deployment health, diagnose performance issues, assess capacity, and evaluate integration risks
  inputs:
  - title: account_name
    type: string
  - title: current_volume
    type: string
  - title: environment_details
    type: string
  - title: issue_description
    type: string
  - title: systems
    type: string
  - title: target_date
    type: string
  - title: target_volume
    type: string
  - title: vendor
    type: string
  outputs:
  - title: technical_risk_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: sa-architecture-health-check
      input: account_name
      description: Evaluate current deployment health and identify risks
      on_failure: stop
    - step: 2
      prompt: sa-performance-investigation
      input: issue_description, environment_details
      description: Diagnose reported performance issues
      on_failure: stop
    - step: 3
      prompt: sa-capacity-planning
      input: account_name, current_volume, target_volume, target_date
      description: Assess capacity for planned growth
      on_failure: stop
    - step: 4
      prompt: sa-integration-risk-assessment
      input: account_name, vendor, systems
      description: Evaluate risks in proposed or existing integrations
      on_failure: stop
    - step: 5
      action: persist
      tools:
      - write-risk-alert
      condition: write-risk-alert triggers when any risk severity >= HIGH
      description: Save risk assessment to InfoHub, alert for HIGH+ risks
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - architecture-health-check
    - performance-investigation
    - capacity-planning
    - integration-risk-assessment
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - text/markdown
x-ea-agent:
  prompt_registry:
    sa-architecture-health-check:
      description: Evaluate current deployment health and identify risks
      source: prompts/tasks.yaml#technical_risk.architecture_health_check
      requires_data:
      - source: read-infohub
        fields: [risk_register, deployment_context, architecture_summary]
        priority: critical
      - source: read-intelligence
        fields: [technology_current_map, vendor_landscape]
        priority: enrichment
    sa-performance-investigation:
      description: Diagnose reported performance issues
      source: prompts/tasks.yaml#technical_risk.performance_investigation
      requires_data:
      - source: read-infohub
        fields: [deployment_context, risk_register, performance_baselines]
        priority: critical
      - source: read-intelligence
        fields: [technology_current_map]
        priority: enrichment
    sa-capacity-planning:
      description: Assess capacity for planned growth
      source: prompts/tasks.yaml#technical_risk.capacity_planning
      requires_data:
      - source: read-infohub
        fields: [deployment_context, usage_metrics, growth_projections]
        priority: critical
      - source: read-intelligence
        fields: [industry_trends, technology_current_map]
        priority: enrichment
    sa-integration-risk-assessment:
      description: Evaluate risks in proposed or existing integrations
      source: prompts/tasks.yaml#technical_risk.integration_risk_assessment
      requires_data:
      - source: read-infohub
        fields: [architecture_summary, integration_inventory, risk_register]
        priority: critical
      - source: read-intelligence
        fields: [vendor_landscape, technology_current_map]
        priority: enrichment
  guardrails:
    input_validation:
    - rule: Risk assessment must reference a specific account and deployment
    - rule: Performance investigation requires specific symptoms or metrics
    output_checks:
    - rule: Every risk has severity classification with evidence
    - rule: Every risk has mitigation action and owner
    - rule: Capacity projections include growth assumptions
    signal_validation:
    - rule: Risk severity must use the four-tier framework consistently
    - rule: Trending claims require minimum 2 consecutive assessments
  knowledge:
    scope:
      domains: [risk-assessment, architecture, capacity-planning]
      archetypes: [enterprise, regulated-industries]
    references:
    - path: references/technical-risk-framework.yaml
      description: Severity classification, escalation triggers, composite risk scoring, trending
    - path: references/architecture-patterns.yaml
      description: Deployment models, data architecture, integration approaches, scaling strategies
    - path: references/capacity-planning.yaml
      description: Sizing methodologies, performance baselines, growth modeling
    - path: references/integration-patterns.yaml
      description: Common integration approaches, anti-patterns, complexity indicators
  error_handling:
    tool_failures:
      critical: [read-infohub]
      enrichment: [read-intelligence]
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  autonomy:
    triggers:
    - type: parent_dispatch
      source: sa-agent
      description: SA orchestrator routes risk assessment requests
    - type: downstream
      source: infosec-agent
      condition: gap.classification == BLOCKER
      description: Compliance blockers trigger architecture risk assessment
    - type: event
      source: monitoring_alert
      condition: alert.type IN [performance_degradation, capacity_warning]
      description: Monitoring alerts trigger automatic risk assessment
    outputs:
    - type: parent_return
      target: sa-agent
      payload: [health_assessment, risk_register, capacity_assessment]
      description: Full risk assessment back to SA orchestrator
    - type: trigger_agent
      target: specialist-agent
      condition: risk.domain_specific == true AND risk.severity >= HIGH
      payload: [risk_details, domain_area, account_context]
      description: Domain-specific HIGH risks trigger specialist engagement
    - type: notify_human
      condition: risk.severity == CRITICAL OR risk.count_high >= 3
      channel: alert
      description: CRITICAL risks or 3+ HIGH risks surface for immediate SA review
    consumes_toolboxes:
    - toolbox: compliance-intelligence
      agent: infosec-agent
      tools: [get-compliance-status]
      reason: Compliance posture affects architecture risk classification
    dependencies:
    - agent: specialist-agent
      reason: Domain expertise for complex risk scenarios
