  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Technical accuracy
    - Risk identification
    - Decision capture
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - architecture
      - discovery
      - risk-assessment
      - best-practices
      - signal-detection
      - integration
      - capacity-planning
      archetypes:
      - enterprise
      - mid-market
      - regulated-industries
    references:
    - path: references/infohub-validation.yaml
      description: Completeness Checks, Staleness Thresholds
    - path: references/signal-detection.yaml
      description: Technical Risks, Technical Decisions, Architecture Patterns
    - path: references/specialist-triggers.yaml
      description: When To Flag, Domains
    - path: references/glossary-and-resources.md
      description: Glossary And Resources
    - path: references/architecture-patterns.yaml
      description: Deployment models, data architecture, integration approaches, scaling strategies
    - path: references/technical-risk-framework.yaml
      description: Severity classification, escalation triggers, composite risk scoring, trending
    - path: references/discovery-methodology.yaml
      description: Discovery dimensions, question frameworks, red flags, synthesis templates
    - path: references/integration-patterns.yaml
      description: Common integration approaches, anti-patterns, complexity indicators
    - path: references/capacity-planning.yaml
      description: Sizing methodologies, performance baselines, growth modeling
    - path: references/migration-patterns.yaml
      description: Migration strategies, risk factors, rollback planning, phased approaches
    - path: references/adr-framework.yaml
      description: ADR template, significance criteria, impact classification
    - path: references/best-practices-framework.yaml
      description: Best practice template structure, quality criteria, update triggers
  autonomy:
    role: near_pure_router
    description: 'Routes domain work to 10 sub-agents and keeps 3 operational flows. Watches sub-agent and peer agent outputs for cross-domain triggers that require routing to other sub-agents or aggregation.
      Coordinates with AE Agent as a peer (separate role, separate person).

      '
    triggers:
    - source: ae-agent
      condition: ae_handoff.type == technical_discovery
      action: Route to sa-discovery-agent with account and opportunity context
      context_received:
      - account_context
      - opportunity_data
      - customer_requirements
    - source: ae-agent
      condition: ae_handoff.type == solution_validation
      action: Route to sa-csp-agent with proposed architecture context
      context_received:
      - solution_scope
      - success_criteria
      - deal_timeline
    - source: playbook_orchestrator
      condition: playbook.assigned_role == solution_architect
      action: Accept playbook task and route to appropriate sub-agent
      context_received:
      - playbook_id
      - task_context
      - deliverable_requirements
    - source: infosec-agent
      condition: security_review.requested == true
      action: Route to sa-risk-agent for architecture security assessment
      context_received:
      - security_requirements
      - compliance_context
      - architecture_scope
    reactive_routing:
    - watch: poc-agent
      true: poc_risk.severity >= HIGH
      route_to: specialist-agent
      context_forward:
      - poc_context
      - risk_details
      - domain_affected
      description: High-risk POC triggers specialist engagement
    - watch: poc-agent
      true: poc_conclusion.go_decision == true
      route_to: sa-csp-agent
      context_forward:
      - poc_results
      - success_criteria
      - stakeholder_map
      description: Successful POC triggers CSP initiation
    - watch: rfp-agent
      true: rfp_technical_section.required == true
      route_to: specialist-agent
      context_forward:
      - rfp_context
      - technical_requirements
      - domain
      description: RFP technical sections trigger specialist input
    - watch: rfp-agent
      true: rfp_security_section.required == true
      route_to: infosec-agent
      context_forward:
      - rfp_context
      - security_requirements
      description: RFP security sections route to InfoSec peer
    - watch: infosec-agent
      true: compliance_gap.classification == BLOCKER
      route_to: sa-risk-agent
      context_forward:
      - gap_details
      - affected_architecture
      - deal_context
      description: Security blocker triggers architecture risk assessment
    - watch: specialist-agent
      true: engagement_complete == true
      route_to: sa-decision-capture-agent
      context_forward:
      - specialist_findings
      - recommendations
      - decisions_made
      description: Specialist handback triggers decision capture
    - watch: poc-agent
      true: poc_scope_change == true
      route_to: sa-risk-agent
      context_forward:
      - original_scope
      - proposed_change
      - impact_assessment
      description: POC scope change triggers risk reassessment
    - watch: sa-discovery-agent
      true: discovery.qualifying_deal == true
      route_to: sa-csp-agent
      context_forward:
      - discovery_summary
      - account_context
      - opportunity_data
      description: Qualifying discovery triggers CSP initiation
    - watch: sa-risk-agent
      true: risk.domain_specific == true AND risk.severity >= HIGH
      route_to: specialist-agent
      context_forward:
      - risk_details
      - domain_area
      - account_context
      description: Domain-specific HIGH risks trigger specialist engagement
    - watch: ae-agent
      true: commercial_risk.severity == HIGH
      route_to: sa-risk-agent
      context_forward:
      - risk_details
      - affected_deal
      - commercial_impact
      description: High commercial risk triggers technical risk posture reassessment
    cascade_limits:
      max_depth: 3
      max_agents_per_chain: 4
      circuit_breaker: Stop chain if same agent triggered twice in one cascade
  assets:
  - name: risk-notes
    filename: '{account}-risk-notes.md'
    description: Risk notes
  - name: technical-decision-logs
    filename: '{account}-technical-decision-logs.md'
    description: Technical decision logs
  - name: architecture-impact-assessments
    filename: '{account}-architecture-impact-assessments.md'
    description: Architecture impact assessments
  - name: client-technical-profiles
    filename: '{account}-client-technical-profiles.md'
    description: Client technical profiles
  quality:
    before_output:
    - All clients mentioned exist in tags
    - All people mentioned exist in person/* tags
    - All technologies mentioned found in content or tags
    - Every risk has severity level
    - Every decision has date and source
    - No orphaned pronouns (he/she/they without referent)
    - No vague terms without qualification (soon, many, few)
