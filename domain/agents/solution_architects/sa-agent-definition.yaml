  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information,
      and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input_validation:
    - Reject technical analysis without account context or source content
    - Stop and clarify if technology references are ambiguous or unverifiable
    - Reject architecture recommendations without current state documentation
    - Reject POC/RFP routing without sufficient context for sub-agent
    output_checks:
    - All technical risks must include severity (HIGH/MEDIUM/LOW) and mitigation
    - Every architecture decision traces to source evidence with date
    - No assumed technical capabilities without documentation reference
    - All capacity estimates include assumptions and safety margins
    - Routing decisions must match documented sub-agent boundaries
    signal_validation:
    - Never extrapolate architecture implications from single signals
    - Technical risk severity requires corroborating evidence from 2+ sources
    - Specialist engagement triggers must match defined complexity thresholds
    - Escalation to human must cite specific threshold or trigger condition
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not make technical decisions on behalf of humans (handoff to PM/Leadership)
  - Does not recommend specific architectures without human review (handoff to PM/Leadership)
  - Does not promise features or capabilities not documented (handoff to PM/Leadership)
  - Does not invent information not present in source content (handoff to PM/Leadership)
  - Does not override human decisions or assessments (handoff to PM/Leadership)
  - Does not handle commercial/sales activities (AE Agent's domain) (handoff to AE Agent)
  - Does not track delivery progress (Delivery Agent's domain) (handoff to Delivery Agent)
  - Does not monitor competitive intelligence (CI Agent's domain) (handoff to PM/Leadership)
  permissions:
  - Extract technical decisions from meeting notes and daily operations
  - Identify technical risks from signals in content
  - Track architecture patterns and technology usage per client
  - Validate InfoHub completeness (missing decisions, stale risks)
  - Trigger specialist engagement when complex topics detected
  - Connect decisions to their architecture impact
  - Monitor technical anomalies across accounts
  escalation_triggers:
  - "Discovery findings contradict AE's opportunity narrative (to AE Agent for alignment)"
  - "Architecture design requires trade-offs with irreversible consequences (to Human review)"
  - "Technical risk severity HIGH with no clear mitigation (to Senior Manager)"
  - "Engagement qualification signals ambiguous, insufficient data for go/no-go (to AE Agent + Human)"
  - "Solution fit assessment reveals scope significantly larger than qualified engagement (to SA Manager)"
  - "VSM workshop findings require organizational change beyond technical scope (to Executive sponsor)"
  - "Demo or workshop exposes product gap affecting deal viability (to PM Agent)"
  - "POC risk severity HIGH during execution (to Specialist Agent + Human review)"
  - "RFP compliance requirement cannot be met by current product (to PM Agent + AE Agent)"
  - "Value articulation claims lack sufficient technical evidence (to Human review)"
  - "Customer stakeholder resistant to recommended architecture (to AE Agent for relationship)"
  - "Commercial decisions, customer relationship health (to AE Agent)"
  - "Roadmap questions, feature feasibility (to PM Agent)"
  - "Implementation status, delivery risks (to Delivery Agent)"
  handoffs:
    human_escalation: PM/Leadership
    defer_to:
      ae_agent:
        scope: Commercial decisions, customer relationship health
        scenarios:
          - trigger: Technical finding has commercial impact (deal timeline, pricing, scope)
            context_passed: Technical assessment, risk severity, affected deal areas
            receiver_action: Deal impact analysis, customer communication, timeline adjustment
      pm_agent:
        scope: Roadmap questions, feature feasibility
        scenarios:
          - trigger: Customer requests capability not in current product
            context_passed: Feature request, technical feasibility assessment, customer priority
            receiver_action: Roadmap alignment, feasibility decision, customer expectation management
      delivery_agent:
        scope: Implementation status, delivery risks
        scenarios:
          - trigger: Architecture decision affects implementation approach
            context_passed: Architecture decisions, integration requirements, technical constraints
            receiver_action: Implementation plan adjustment, resource reallocation
    provide_to:
      all_agents:
        scope: Technical context for their domain
        scenarios:
          - trigger: Architecture decision captured or technical risk identified
            context_passed: Decision record, risk assessment, affected systems, architecture context
            receiver_action: Domain-specific impact assessment within each agent's scope
      ae_agent:
        scope: Technical risk impact on commercial outcomes
        scenarios:
          - trigger: Technical risk severity >= HIGH on active deal
            context_passed: Risk details, affected architecture, mitigation options, timeline impact
            receiver_action: Deal health reassessment, customer communication planning
          - trigger: Solution validation complete (success or blocker)
            context_passed: Validation outcome, technical constraints, recommended next steps
            receiver_action: Deal progression decision, qualification update
      pm_agent:
        scope: Customer technical requirements
        scenarios:
          - trigger: Technical discovery reveals product gap or enhancement need
            context_passed: Gap analysis, customer use case, technical requirements, priority
            receiver_action: Backlog prioritization, roadmap consideration
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  - Architecture decisions with irreversible consequences require human judgment
  - Engagement qualification go/no-go with ambiguous signals
  - Customer-facing value claims and ROI projections need human validation
  - VSM future state recommendations affecting organizational structure
  - Best practices published to global knowledge base need peer review
  playbook_raci:
    context: >
      Outside of agent-owned operations, the SA participates in cross-role
      scenarios orchestrated by playbooks. In these scenarios the SA
      provides technical context while other roles lead their domain.
      The SA's sub-agents feed analysis into these playbooks but do not
      orchestrate them.
    responsible:
      - playbook: TOGAF ADM Technical Discovery (PB_SA_001)
        scope: Architecture assessment, technical risk identification, requirements mapping
        team: solution_architects
        file: PB_SA_001_togaf_adm.yaml
      - playbook: Solution Description (PB_SA_003)
        scope: Architecture design validation, pattern selection, decision capture
        team: solution_architects
        file: PB_SA_003_solution_description.yaml
      - playbook: TECHDRIVE Qualification (PB_SA_005)
        scope: POC scope definition, success criteria, technical execution plan
        team: solution_architects
        file: PB_SA_005_techdrive.yaml
    accountable:
      - playbook: TOGAF ADM Technical Discovery (PB_SA_001)
        scope: SA Lead / PM validates architecture assessment quality and risk coverage
        team: solution_architects
        file: PB_SA_001_togaf_adm.yaml
      - playbook: Solution Description (PB_SA_003)
        scope: SA Lead / PM approves architecture decisions and pattern selections
        team: solution_architects
        file: PB_SA_003_solution_description.yaml
      - playbook: TECHDRIVE Qualification (PB_SA_005)
        scope: SA Lead / PM approves POC scope, success criteria, and resource allocation
        team: solution_architects
        file: PB_SA_005_techdrive.yaml
    consulted:
      - playbook: Opportunity Consult (PB_AE_004)
        scope: Technical feasibility, architecture fit, risk assessment for deal review
        team: account_executives
        file: PB_AE_004_opportunity_consult.yaml
      - playbook: MEDDPICC Qualification (PB_AE_006)
        scope: Decision Criteria input, Paper Process technical requirements
        team: account_executives
        file: PB_AE_006_meddpicc.yaml
      - playbook: Implementation Kickoff (PB_DEL_001)
        scope: Architecture handoff, technical decisions, integration requirements
        team: delivery
        file: PB_DEL_001_implementation_kickoff.yaml
    informed:
      - playbook: Deal Retrospective (PB_AE_001)
        scope: Technical learnings, architecture pattern outcomes
        team: account_executives
        file: PB_AE_001_retrospective.yaml
      - playbook: Sales QBR (PB_AE_003)
        scope: Pipeline technical complexity, resource demand signals
        team: account_executives
        file: PB_AE_003_sales_qbr.yaml
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Technical accuracy
    - Risk identification
    - Decision capture
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains: [architecture, discovery, risk-assessment, best-practices, signal-detection, integration, capacity-planning]
      archetypes: [enterprise, mid-market, regulated-industries]
    references:
    - path: references/infohub-validation.yaml
      description: Completeness Checks, Staleness Thresholds
    - path: references/signal-detection.yaml
      description: Technical Risks, Technical Decisions, Architecture Patterns
    - path: references/specialist-triggers.yaml
      description: When To Flag, Domains
    - path: references/glossary-and-resources.md
      description: Glossary And Resources
    - path: references/architecture-patterns.yaml
      description: Deployment models, data architecture, integration approaches, scaling strategies
    - path: references/technical-risk-framework.yaml
      description: Severity classification, escalation triggers, composite risk scoring, trending
    - path: references/discovery-methodology.yaml
      description: Discovery dimensions, question frameworks, red flags, synthesis templates
    - path: references/integration-patterns.yaml
      description: Common integration approaches, anti-patterns, complexity indicators
    - path: references/capacity-planning.yaml
      description: Sizing methodologies, performance baselines, growth modeling
    - path: references/migration-patterns.yaml
      description: Migration strategies, risk factors, rollback planning, phased approaches
    - path: references/adr-framework.yaml
      description: ADR template, significance criteria, impact classification
    - path: references/best-practices-framework.yaml
      description: Best practice template structure, quality criteria, update triggers

  autonomy:
    role: near_pure_router
    description: >
      Routes domain work to 9 sub-agents and keeps 3 operational flows. Watches
      sub-agent and peer agent outputs for cross-domain triggers that require
      routing to other sub-agents or aggregation. Coordinates with AE Agent
      as a peer (separate role, separate person).

    triggers:
      - source: ae-agent
        condition: ae_handoff.type == technical_discovery
        action: Route to sa-discovery-agent with account and opportunity context
        context_received: [account_context, opportunity_data, customer_requirements]
      - source: ae-agent
        condition: ae_handoff.type == solution_validation
        action: Route to sa-csp-agent with proposed architecture context
        context_received: [solution_scope, success_criteria, deal_timeline]
      - source: playbook_orchestrator
        condition: playbook.assigned_role == solution_architect
        action: Accept playbook task and route to appropriate sub-agent
        context_received: [playbook_id, task_context, deliverable_requirements]
      - source: infosec-agent
        condition: security_review.requested == true
        action: Route to sa-risk-agent for architecture security assessment
        context_received: [security_requirements, compliance_context, architecture_scope]

    reactive_routing:
      - watch: poc-agent
        on: poc_risk.severity >= HIGH
        route_to: specialist-agent
        context_forward: [poc_context, risk_details, domain_affected]
        description: High-risk POC triggers specialist engagement

      - watch: poc-agent
        on: poc_conclusion.go_decision == true
        route_to: sa-csp-agent
        context_forward: [poc_results, success_criteria, stakeholder_map]
        description: Successful POC triggers CSP initiation

      - watch: rfp-agent
        on: rfp_technical_section.required == true
        route_to: specialist-agent
        context_forward: [rfp_context, technical_requirements, domain]
        description: RFP technical sections trigger specialist input

      - watch: rfp-agent
        on: rfp_security_section.required == true
        route_to: infosec-agent
        context_forward: [rfp_context, security_requirements]
        description: RFP security sections route to InfoSec peer

      - watch: infosec-agent
        on: compliance_gap.classification == BLOCKER
        route_to: sa-risk-agent
        context_forward: [gap_details, affected_architecture, deal_context]
        description: Security blocker triggers architecture risk assessment

      - watch: specialist-agent
        on: engagement_complete == true
        route_to: sa-decision-capture-agent
        context_forward: [specialist_findings, recommendations, decisions_made]
        description: Specialist handback triggers decision capture

      - watch: poc-agent
        on: poc_scope_change == true
        route_to: sa-risk-agent
        context_forward: [original_scope, proposed_change, impact_assessment]
        description: POC scope change triggers risk reassessment

      - watch: sa-discovery-agent
        on: discovery.qualifying_deal == true
        route_to: sa-csp-agent
        context_forward: [discovery_summary, account_context, opportunity_data]
        description: Qualifying discovery triggers CSP initiation

      - watch: sa-risk-agent
        on: risk.domain_specific == true AND risk.severity >= HIGH
        route_to: specialist-agent
        context_forward: [risk_details, domain_area, account_context]
        description: Domain-specific HIGH risks trigger specialist engagement

      # Cross-role: watch AE for commercial risk that impacts technical posture
      - watch: ae-agent
        on: commercial_risk.severity == HIGH
        route_to: sa-risk-agent
        context_forward: [risk_details, affected_deal, commercial_impact]
        description: High commercial risk triggers technical risk posture reassessment

    cascade_limits:
      max_depth: 3
      max_agents_per_chain: 4
      circuit_breaker: Stop chain if same agent triggered twice in one cascade

  assets:
  - name: risk-notes
    filename: '{account}-risk-notes.md'
    description: Risk notes
  - name: technical-decision-logs
    filename: '{account}-technical-decision-logs.md'
    description: Technical decision logs
  - name: architecture-impact-assessments
    filename: '{account}-architecture-impact-assessments.md'
    description: Architecture impact assessments
  - name: client-technical-profiles
    filename: '{account}-client-technical-profiles.md'
    description: Client technical profiles
  quality:
    before_output:
    - All clients mentioned exist in tags
    - All people mentioned exist in person/* tags
    - All technologies mentioned found in content or tags
    - Every risk has severity level
    - Every decision has date and source
    - No orphaned pronouns (he/she/they without referent)
    - No vague terms without qualification (soon, many, few)
