    workflow_shorthand:
    - step: 1
      prompt: sa-decision-capture-analyze
      input: context
      description: Analyze input
    - step: 2
      prompt: sa-decision-capture-synthesize
      input: analysis
      description: Synthesize findings
    - step: 3
      prompt: sa-decision-capture-output
      input: synthesis
      description: Generate output
