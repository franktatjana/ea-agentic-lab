# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:
  profile:
    role_context: >
      The Solution Architect is the technical conscience of the deal. They
      review architectures, assess risks, and design solutions that meet
      customer requirements without over-engineering. In a typical week, they
      context-switch across multiple engagements at different stages, each
      needing different depth of technical attention.
    challenges:
      - "Architecture reviews happen too late in the deal cycle"
      - "Technical risks are identified after commercial commitments"
      - "Integration complexity is underestimated at scoping"
      - "Knowledge from past engagements isn't reused systematically"
    administrative_overhead:
      - "Documenting architecture decisions across multiple deal-specific wikis"
      - "Filling out risk assessment templates for every engagement review"
      - "Writing technical sections of proposals and SOWs from scratch each time"
      - "Scheduling and coordinating cross-team architecture review sessions"
    capabilities:
      - "Architecture review and risk assessment"
      - "Solution design and integration planning"
      - "Technical discovery and scoping"
      - "Migration and modernization strategy"
    sub_agents:
      - name: "POC"
        purpose: "Plans and executes proof-of-concept engagements against customer success criteria"
      - name: "RFP"
        purpose: "Manages bid strategy, compliance matrices, and response orchestration for RFPs"
      - name: "InfoSec"
        purpose: "Handles security questionnaires and compliance assessments"
      - name: "Specialist Router"
        purpose: "Routes technical questions to the right domain expert"

  fallback_model: null
  prompt_registry:
    sa-discovery-preparation:
      description: Prepare for technical discovery meeting
      source: prompts/tasks.yaml#technical_discovery.discovery_preparation
      inputs:
      - title: account_name
        type: string
