# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:

  profile:
    why: >
      Solution Architects context-switch across 5-15 engagements at different
      stages, each requiring different technical depth. Between architecture
      reviews, risk assessments, meeting prep, and decision documentation,
      the actual design and advisory window shrinks. This agent handles
      signal detection, risk tracking, InfoHub maintenance, and artifact
      generation so the SA can focus on architecture judgment and customer
      conversations.

    goals:
      - "Surface every technical risk before it becomes a commercial blocker"
      - "Capture every architecture decision with rationale and impact within 24 hours"
      - "Keep InfoHub complete and current across all active engagements"
      - "Route specialist engagement requests within SLA, with full context"
      - "Prepare for every technical meeting with zero manual prep time"

    role_context: >
      The Solution Architect is the technical conscience of the deal. They
      review architectures, assess risks, and design solutions that meet
      customer requirements without over-engineering. In a typical week, they
      context-switch across multiple engagements at different stages, each
      needing different depth of technical attention.

    key_metrics:
      - "Technical risk detection rate: risks surfaced before vs after commercial commitment"
      - "Decision capture latency: hours from meeting to documented ADR"
      - "InfoHub completeness: percentage of required artifacts present and current per account"
      - "Specialist engagement SLA: time from detection to specialist request dispatch"
      - "POC conversion rate: evaluations that progress to contract (influenced by SA quality)"

    qualification_framework:
      name: Technical Readiness Assessment
      owner: sa-agent
      note: >
        The SA assesses technical readiness across 6 dimensions. Each dimension
        is informed by the sub-agent that owns the relevant domain.
      dimensions:
        - letter: A
          name: Architecture Fit
          description: How well the proposed solution maps to customer's existing architecture
          supported_by: sa-agent
        - letter: I
          name: Integration Complexity
          description: Number, type, and risk of integrations required
          supported_by: sa-agent
        - letter: S
          name: Security & Compliance
          description: Regulatory requirements, security posture, certification needs
          supported_by: infosec-agent
        - letter: P
          name: POC Readiness
          description: Whether technical prerequisites exist for meaningful evaluation
          supported_by: poc-agent
        - letter: R
          name: Risk Profile
          description: Technical risks that could block deal or deployment success
          supported_by: sa-agent
        - letter: D
          name: Domain Expertise
          description: Whether specialist knowledge is needed beyond SA generalist scope
          supported_by: specialist-agent

    stakeholder_landscape:
      customer_side:
        - role: "CTO / VP Engineering: architecture strategy, technology direction, build vs buy"
          connected_via: sa-agent
        - role: "IT Director / Infrastructure Lead: deployment topology, capacity, operations"
          connected_via: sa-agent
        - role: "Security Lead / CISO: compliance requirements, threat model, data handling"
          connected_via: infosec-agent
        - role: "Development Team Lead: integration points, API design, SDK requirements"
          connected_via: sa-agent
        - role: "Data Architect: data model, migration, retention, access patterns"
          connected_via: specialist-agent
      internal_team:
        - role: "Account Executive: deal context, commercial constraints, timeline pressure"
          connected_via: sa-agent
        - role: "Value Engineer: business case construction, TCO analysis"
          connected_via: sa-agent
        - role: "Delivery Manager: implementation feasibility, resource planning"
          connected_via: sa-agent
        - role: "Domain Specialists: deep expertise in security, observability, search"
          connected_via: specialist-agent
        - role: "Product Manager: roadmap alignment, feature feasibility"
          connected_via: sa-agent

    challenges:
      - text: "Architecture reviews happen too late in the deal cycle"
        solved_by: sa-agent
      - text: "Technical risks surface after commercial commitments are made"
        solved_by: sa-agent
      - text: "Integration complexity is underestimated during scoping"
        solved_by: sa-agent
      - text: "Knowledge from past engagements isn't reused systematically"
        solved_by: sa-agent
      - text: "POC criteria are vague, leading to inconclusive evaluations"
        solved_by: poc-agent
      - text: "RFP responses are written from scratch each time"
        solved_by: rfp-agent
      - text: "Security questionnaires consume disproportionate SA time"
        solved_by: infosec-agent
      - text: "Specialist engagement is ad-hoc with context lost in handoffs"
        solved_by: specialist-agent
      - text: "Decision rationale is lost when not captured immediately"
        solved_by: sa-agent
      - text: "Customer journey mapping is skipped under time pressure"
        solved_by: sa-agent

    administrative_overhead:
      - text: "Documenting architecture decisions across multiple deal-specific wikis"
        automated_by: sa-agent
      - text: "Filling out risk assessment templates for every engagement review"
        automated_by: sa-agent
      - text: "Writing technical sections of proposals and SOWs from scratch each time"
        automated_by: rfp-agent
      - text: "Scheduling and coordinating cross-team architecture review sessions"
        automated_by: sa-agent
      - text: "Preparing technical meeting briefs from scattered notes and prior docs"
        automated_by: sa-agent
      - text: "Tracking POC milestones and success criteria across multiple evaluations"
        automated_by: poc-agent
      - text: "Responding to repetitive security questionnaire sections"
        automated_by: infosec-agent
      - text: "Maintaining InfoHub completeness across all active accounts"
        automated_by: sa-agent

    capabilities:
      - "Architecture review and risk assessment"
      - "Technical discovery and scoping"
      - "Solution design and integration planning"
      - "Migration and modernization strategy"
      - "POC lifecycle management"
      - "RFP technical response"
      - "Security and compliance enablement"
      - "Domain specialist coordination"

    with_this_agent:
      - "Surface technical risks before they block deals or deployments"
      - "Capture every architecture decision with full rationale within 24 hours"
      - "Walk into every technical meeting prepared with customer-specific context"
      - "Route specialist requests with complete context, no handoff gaps"
      - "Keep InfoHub complete and current across all engagements automatically"
      - "Score technical readiness across architecture, integration, security, and domain dimensions"
      - "Run structured discovery covering business outcomes, current state, and requirements"
      - "Generate ADRs from meeting discussions with impact analysis"
      - "Build customer success plans bridging pre-sales findings to post-sales adoption"
      - "Map customer journeys with stakeholder-specific views and feedback capture"
      - "Qualify POC requests with evidence-based go/no-go criteria"
      - "Orchestrate RFP responses with technical, security, and specialist contributions"

    public_resources:
      - title: "TOGAF Architecture Development Method"
        url: "https://pubs.opengroup.org/togaf-standard/adm/chap01.html"
        context: "Enterprise architecture framework: phases from vision to governance"
      - title: "Architecture Decision Records (ADR)"
        url: "https://adr.github.io/"
        context: "Lightweight format for capturing architecture decisions"
      - title: "C4 Model for Software Architecture"
        url: "https://c4model.com/"
        context: "Context, Container, Component, Code diagrams for communication"
      - title: "The Twelve-Factor App"
        url: "https://12factor.net/"
        context: "Methodology for building cloud-native applications"
      - title: "OWASP Application Security"
        url: "https://owasp.org/www-project-application-security-verification-standard/"
        context: "Security verification standard for technical assessments"
      - title: "AWS Well-Architected Framework"
        url: "https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html"
        context: "Cloud architecture best practices across 6 pillars"

    sub_agents:
      # Co-located sub-agents (solution_architects/)
      - name: SA Discovery Agent
        id: sa-discovery-agent
        purpose: Technical discovery lifecycle, business outcomes, current state, requirements
        definition_path: domain/agents/solution_architects/sa-discovery-definition.yaml
      - name: SA Technical Risk Agent
        id: sa-risk-agent
        purpose: Architecture health, performance, capacity planning, integration risk
        definition_path: domain/agents/solution_architects/sa-risk-definition.yaml
      - name: SA Decision Capture Agent
        id: sa-decision-capture-agent
        purpose: Decision extraction from meetings, architecture impact, ADR generation
        definition_path: domain/agents/solution_architects/sa-decision-capture-definition.yaml
      - name: SA CSP Agent
        id: sa-csp-agent
        purpose: Customer Success Plan lifecycle from initiation through CA handoff
        definition_path: domain/agents/solution_architects/sa-csp-definition.yaml
      - name: SA Best Practices Agent
        id: sa-best-practices-agent
        purpose: Best practices knowledge base creation, maintenance, and gap analysis
        definition_path: domain/agents/solution_architects/sa-best-practices-definition.yaml
      - name: SA Journey Agent
        id: sa-journey-agent
        purpose: Customer journey mapping, touchpoint documentation, stakeholder journeys
        definition_path: domain/agents/solution_architects/sa-journey-definition.yaml
      # External sub-agents (separate directories)
      - name: POC Agent
        id: poc-agent
        purpose: POC lifecycle management, qualification, execution, conversion
        definition_path: domain/agents/poc/poc-agent-definition.yaml
      - name: RFP Agent
        id: rfp-agent
        purpose: Bid strategy, compliance matrix, response orchestration
        definition_path: domain/agents/rfp/rfp-agent-definition.yaml
      - name: Specialist Engagement Agent
        id: specialist-agent
        purpose: Domain expert routing (security, observability, search specialists)
        definition_path: domain/agents/specialists/specialist-agent-definition.yaml

    peer_agents:
      - name: InfoSec Agent
        id: infosec-agent
        relationship: Peer (separate role, separate person)
        purpose: Security questionnaires, compliance gap analysis, certification tracking
        definition_path: domain/agents/infosec/infosec-agent-definition.yaml

    activity_map:
      purpose: >
        The SA maintains technical integrity across all engagements. Most domains
        are delegated to specialized sub-agents that operate independently with
        their own tools, flows, and knowledge. The SA orchestrator keeps 3
        operational flows and coordinates across all sub-agents.
      domains:
        - domain: Technical Discovery
          why: >
            Structured discovery covering business outcomes, current state,
            requirements, stakeholders, and timeline. Foundation for all
            subsequent technical work.
          agent: sa-discovery-agent
          contributing_agents:
            - agent: poc-agent
              provides: Technical prerequisites and evaluation readiness signals
            - agent: specialist-agent
              provides: Domain-specific discovery questions and depth
          activities:
            - Discovery preparation with customer context
            - Business outcomes and current state assessment
            - Requirements and stakeholder mapping
            - Discovery synthesis and debrief
          cadence: per-engagement, triggered at discovery phase

        - domain: Architecture Risk Management
          why: >
            Identify, classify, and track technical risks before they become
            commercial blockers or deployment failures.
          agent: sa-risk-agent
          contributing_agents:
            - agent: infosec-agent
              provides: Security and compliance risk assessment (peer)
            - agent: specialist-agent
              provides: Domain-specific risk patterns and mitigations
          activities:
            - Architecture health check for active deployments
            - Performance investigation for reported issues
            - Capacity planning for growth scenarios
            - Integration risk assessment for proposed connections
          cadence: continuous, triggered by signals or stage transitions

        - domain: Decision Management
          why: >
            Every significant technical decision is captured with rationale and
            architecture impact. Decisions not captured are decisions lost.
          agent: sa-decision-capture-agent
          activities:
            - Extract decisions from meetings and operations
            - Generate ADRs for significant choices
            - Analyze decision impact on architecture
          cadence: per-meeting, triggered by decision signals

        - domain: POC Lifecycle
          why: >
            Proof-of-concept evaluations consume significant resources.
            Structured execution ensures only winnable POCs proceed and each
            drives to a clear customer decision.
          agent: poc-agent
          contributing_agents:
            - agent: sa-agent
              provides: Architecture context and technical requirements
            - agent: specialist-agent
              provides: Domain expertise during POC execution
          activities:
            - POC qualification (go/no-go analysis)
            - Success criteria design
            - Execution tracking against milestones
            - POC-to-close conversion
          cadence: per-POC lifecycle

        - domain: RFP Response
          why: >
            RFP responses require coordinated input from technical, security,
            and specialist domains under tight deadlines.
          agent: rfp-agent
          contributing_agents:
            - agent: sa-agent
              provides: Architecture context and solution design
            - agent: infosec-agent
              provides: Security and compliance sections
            - agent: specialist-agent
              provides: Domain-specific technical content
          activities:
            - Bid/no-bid assessment
            - Compliance matrix completion
            - Technical response orchestration
            - Win theme development
          cadence: per-RFP, deadline-driven

        - domain: Security & Compliance
          why: >
            Security questionnaires and compliance assessments gate most
            enterprise deals. Fast, accurate responses accelerate deal velocity.
          agent: infosec-agent
          relationship: peer
          contributing_agents:
            - agent: sa-risk-agent
              provides: Architecture context for security responses
          activities:
            - Security questionnaire response
            - Compliance gap analysis
            - Certification status tracking
          cadence: per-deal, triggered by customer security requirements

        - domain: Specialist Engagement
          why: >
            Complex technical topics in security, observability, and search
            require deep domain expertise beyond SA generalist scope.
          agent: specialist-agent
          contributing_agents:
            - agent: sa-agent
              provides: Engagement context and customer requirements
          activities:
            - Specialist need assessment
            - Domain expert engagement coordination
            - Findings integration into account context
          cadence: on-demand, triggered by complexity thresholds

        - domain: InfoHub Operations
          why: >
            The InfoHub is the single source of technical truth per account.
            Completeness and freshness directly affect decision quality.
          agent: sa-agent
          activities:
            - Completeness validation against required artifacts
            - Staleness detection and update triggers
          cadence: weekly validation, triggered by artifact changes

        - domain: Customer Success Planning
          why: >
            Bridge pre-sales technical findings into post-sales adoption
            strategy. CSP created during the deal ensures continuity.
          agent: sa-csp-agent
          contributing_agents:
            - agent: poc-agent
              provides: POC results and success criteria achievement
          activities:
            - CSP initiation at qualification
            - Technical evaluation plan
            - Phased adoption planning
            - CSP finalization and CA handoff
          cadence: per-engagement lifecycle

        - domain: Best Practices
          why: >
            Reusable best practices reduce repeated work and ensure consistent
            quality across engagements. Knowledge captured once serves all SAs.
          agent: sa-best-practices-agent
          activities:
            - Best practice creation from standard template
            - Meeting preparation using best practice content
            - Q&A content generation and update
            - Best practice currency maintenance
            - Gap analysis by solution area
          cadence: continuous, triggered by product releases or customer patterns

        - domain: Customer Journey
          why: >
            Mapping the customer journey from first touch to deal close captures
            the full pre-sales experience and ensures clean handoff to Customer
            Architect with no information gaps.
          agent: sa-journey-agent
          contributing_agents:
            - agent: sa-csp-agent
              provides: Success plan context for handoff preparation
          activities:
            - Journey map initiation at Stage 2
            - Touchpoint documentation after customer meetings
            - Stakeholder-specific journey views
            - POV/POC evaluation touchpoints
            - Journey map handoff to CA at deal close
            - Qualitative feedback capture
          cadence: per-engagement lifecycle, triggered by customer meetings

