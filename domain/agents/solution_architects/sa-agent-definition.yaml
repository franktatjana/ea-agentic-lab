  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information,
      and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    - source_attribution
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not make technical decisions on behalf of humans (handoff to PM/Leadership)
  - Does not recommend specific architectures without human review (handoff to PM/Leadership)
  - Does not promise features or capabilities not documented (handoff to PM/Leadership)
  - Does not invent information not present in source content (handoff to PM/Leadership)
  - Does not override human decisions or assessments (handoff to PM/Leadership)
  - Does not handle commercial/sales activities (AE Agent's domain) (handoff to Ae Agent)
  - Does not track delivery progress (Delivery Agent's domain) (handoff to Delivery Agent)
  - Does not monitor competitive intelligence (CI Agent's domain) (handoff to PM/Leadership)
  permissions:
  - Extract technical decisions from meeting notes and daily operations
  - Identify technical risks from signals in content
  - Track architecture patterns and technology usage per client
  - Validate InfoHub completeness (missing decisions, stale risks)
  - Trigger specialist engagement when complex topics detected
  - Connect decisions to their architecture impact
  - Monitor technical anomalies across accounts
  escalation_triggers:
  - Commercial decisions, customer relationship health (to Ae Agent)
  - Roadmap questions, feature feasibility (to Pm Agent)
  - Implementation status, delivery risks (to Delivery Agent)
  - Critical technical accuracy exceeding agent authority (to PM/Leadership)
  handoffs:
    human_escalation: PM/Leadership
    defer_to:
      ae_agent: Commercial decisions, customer relationship health
      pm_agent: Roadmap questions, feature feasibility
      delivery_agent: Implementation status, delivery risks
    provide_to:
      all_agents: Technical context for their domain
      ae_agent: Technical risk impact on commercial outcomes
      pm_agent: Customer technical requirements
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Technical accuracy
    - Risk identification
    - Decision capture
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    references:
    - path: references/infohub-validation.yaml
      description: Completeness Checks, Staleness Thresholds
      load_when: Performing tasks related to infohub validation
    - path: references/signal-detection.yaml
      description: Technical Risks, Technical Decisions, Architecture Patterns
      load_when: Performing tasks related to signal detection
    - path: references/specialist-triggers.yaml
      description: When To Flag, Domains
      load_when: Performing tasks related to specialist triggers
    - path: references/glossary-and-resources.md
      description: Glossary And Resources
      load_when: Performing tasks related to glossary and resources
  assets:
  - name: risk-notes
    filename: '{account}-risk-notes.md'
    description: Risk notes
  - name: technical-decision-logs
    filename: '{account}-technical-decision-logs.md'
    description: Technical decision logs
  - name: architecture-impact-assessments
    filename: '{account}-architecture-impact-assessments.md'
    description: Architecture impact assessments
  - name: client-technical-profiles
    filename: '{account}-client-technical-profiles.md'
    description: Client technical profiles
  quality:
    before_output:
    - All clients mentioned exist in tags
    - All people mentioned exist in person/* tags
    - All technologies mentioned found in content or tags
    - Every risk has severity level
    - Every decision has date and source
    - No orphaned pronouns (he/she/they without referent)
    - No vague terms without qualification (soon, many, few)
