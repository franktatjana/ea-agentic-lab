    activity_map:
      purpose: 'The SA is accountable for the technical side of customer engagements, from first qualification through post-sales handoff. Most domains are delegated to specialized sub-agents. The SA orchestrator
        keeps 3 operational flows (meeting support, InfoHub validation, specialist engagement) and 3 core domains (Architecture Design, Technical Advisory, Specialist Coordination) while 10 sub-agents own
        the rest.

        '
      domains:
      - domain: Technical Discovery and Landscape Assessment
        why: 'Structured discovery covering business outcomes, current state, requirements, stakeholders, and timeline. Foundation for all subsequent technical work.

          '
        agent: sa-discovery-agent
        contributing_agents:
        - agent: specialist-agent
          provides: Domain-specific discovery questions and depth
        activities:
        - Pre-engagement research and hypothesis building
        - Business outcomes and current state assessment
        - Requirements and stakeholder mapping
        - Discovery synthesis and debrief
        cadence: per-engagement, triggered at discovery phase
      - domain: Architecture and Solution Design
        why: 'Architecture design is the structural blueprint: how systems connect, integration patterns, deployment topology, security boundaries. Solution design maps vendor capabilities to customer requirements.
          The SA does both.

          '
        agent: sa-agent
        contributing_agents:
        - agent: sa-discovery-agent
          provides: Customer requirements and current state
        - agent: sa-risk-agent
          provides: Risk constraints and integration concerns
        - agent: specialist-agent
          provides: Domain-specific architecture patterns
        activities:
        - Reference architecture design
        - Integration pattern selection
        - Deployment topology planning
        - Capability-to-requirement mapping
        - Sizing and capacity planning
        cadence: per-engagement, follows discovery
      - domain: Technical Risk Identification and Mitigation
        why: 'Identify, classify, and track technical risks before they become commercial blockers or deployment failures.

          '
        agent: sa-risk-agent
        contributing_agents:
        - agent: specialist-agent
          provides: Domain-specific risk patterns and mitigations
        activities:
        - Architecture health check for active deployments
        - Performance investigation for reported issues
        - Capacity planning for growth scenarios
        - Integration risk assessment for proposed connections
        cadence: continuous, triggered by signals or stage transitions
      - domain: Engagement Qualification
        why: 'Evidence-based go/no-go assessment before committing SA resources. Prevents investment in unwinnable or misaligned opportunities.

          '
        agent: sa-discovery-agent
        contributing_agents:
        - agent: sa-risk-agent
          provides: Technical risk signals informing qualification
        activities:
        - Stage-gated engagement assessment
        - MEDDPICC technical qualification check
        - Engagement mode selection (transactional, strategic, land-and-expand)
        - Resource commitment recommendation
        cadence: per-opportunity, triggered at SA assignment
      - domain: Solution Fit Assessment
        why: 'Determine whether an opportunity is transactional (point solution) or strategic (enterprise transformation). This assessment shapes the entire pursuit approach.

          '
        agent: sa-discovery-agent
        contributing_agents:
        - agent: sa-best-practices-agent
          provides: Industry patterns and capability mapping
        - agent: sa-risk-agent
          provides: Technical feasibility constraints
        activities:
        - Opportunity shape assessment (transactional vs strategic)
        - Capability-to-pain-point mapping
        - Solution option framing
        - Technology roadmap construction
        cadence: per-engagement, follows discovery
      - domain: Value Stream Mapping
        why: 'End-to-end process mapping identifies waste, bottlenecks, and improvement opportunities. VSM workshops drive strategic engagements and executive alignment.

          '
        agent: sa-value-agent
        contributing_agents:
        - agent: sa-discovery-agent
          provides: Current state process understanding
        - agent: sa-journey-agent
          provides: Customer journey context
        activities:
        - VSM qualification and stakeholder preparation
        - Current state value stream mapping
        - Future state design with improvement targets
        - Executive briefing on findings and roadmap
        cadence: per strategic engagement, requires exec sponsorship
      - domain: Demo, Technical Workshops, and Customer Enablement
        why: 'Targeted demonstrations, workshops, and enablement sessions prove value against customer pain points and build technical confidence.

          '
        agent: sa-best-practices-agent
        contributing_agents:
        - agent: sa-discovery-agent
          provides: Customer pain points for demo targeting
        - agent: specialist-agent
          provides: Domain expertise for specialist demos
        activities:
        - Discovery-to-demo scenario mapping
        - Demo environment design and rehearsal
        - Technical workshop facilitation
        - Customer enablement sessions
        cadence: per-engagement, follows discovery and fit assessment
      - domain: POC Lifecycle
        why: 'Proof-of-concept evaluations consume significant resources. Structured execution ensures only winnable POCs proceed and each drives to a clear customer decision.

          '
        agent: poc-agent
        contributing_agents:
        - agent: sa-agent
          provides: Architecture context and technical requirements
        - agent: specialist-agent
          provides: Domain expertise during POC execution
        activities:
        - POC qualification (go/no-go analysis)
        - Success criteria design
        - Execution tracking against milestones
        - POC-to-close conversion
        cadence: per-POC lifecycle
      - domain: RFP Technical Response
        why: 'RFP responses require coordinated input from technical, security, and specialist domains under tight deadlines.

          '
        agent: rfp-agent
        contributing_agents:
        - agent: sa-agent
          provides: Architecture context and solution design
        - agent: specialist-agent
          provides: Domain-specific technical content
        activities:
        - Bid/no-bid assessment
        - Compliance matrix completion
        - Technical response orchestration
        - Win theme development
        cadence: per-RFP, deadline-driven
      - domain: Value Articulation
        why: 'Mapping technical capabilities to quantified business outcomes. ROI framing from technical evidence bridges the gap between what the solution does and why it matters.

          '
        agent: sa-value-agent
        contributing_agents:
        - agent: sa-discovery-agent
          provides: Customer pain points and business context
        - agent: sa-risk-agent
          provides: Risk reduction evidence
        activities:
        - Technical capability inventory
        - Business outcome mapping per capability
        - ROI evidence assembly
        - Value narrative construction for different audiences
        cadence: per-engagement, follows solution design
      - domain: Trusted Technical Advisory and Architecture Communication
        why: 'The SA is the customer''s trusted technical advisor. Guiding architecture decisions and adapting messaging for executive, technical, and operational audiences builds confidence and drives
          deal progression.

          '
        agent: sa-agent
        contributing_agents:
        - agent: sa-decision-capture-agent
          provides: Decision history and architecture rationale
        - agent: sa-best-practices-agent
          provides: Communication templates and patterns
        activities:
        - Audience analysis and message adaptation
        - Architecture artifact design per audience
        - Technical decision guidance
        - Stakeholder alignment and objection handling
        cadence: continuous throughout engagement
      - domain: Customer Journey and CA Handoff
        why: 'Mapping the customer journey from first touch to deal close captures the full pre-sales experience and ensures clean handoff to Customer Architect with no information gaps.

          '
        agent: sa-journey-agent
        contributing_agents:
        - agent: sa-csp-agent
          provides: Success plan context for handoff preparation
        activities:
        - Journey map initiation at engagement start
        - Touchpoint documentation after customer meetings
        - Stakeholder-specific journey views
        - CSP finalization and CA handoff
        cadence: per-engagement lifecycle
      - domain: Customer Success Planning
        why: 'The SA is the directly responsible individual for the Customer Success Plan. It captures technical outcomes, adoption milestones, and success criteria that bridge pre-sales commitments to
          post-sales delivery. Without it, delivery starts from scratch.

          '
        agent: sa-csp-agent
        contributing_agents:
        - agent: sa-discovery-agent
          provides: Business outcomes and technical requirements
        - agent: sa-journey-agent
          provides: Customer journey context and stakeholder map
        activities:
        - CSP initiation with technical outcomes from discovery
        - Adoption milestone definition with customer
        - Success criteria alignment between sales and delivery
        - CSP handoff preparation for CA
        cadence: per-strategic-engagement, finalized before close
      - domain: Decision Capture and Architecture Governance
        why: 'Every significant technical decision is captured with rationale and architecture impact. Decisions not captured are decisions lost.

          '
        agent: sa-decision-capture-agent
        activities:
        - Extract decisions from meetings and operations
        - Generate ADRs for significant choices
        - Analyze decision impact on architecture
        cadence: per-meeting, triggered by decision signals
      - domain: Best Practices Documentation and Knowledge Sharing
        why: 'Reusable best practices reduce repeated work and ensure consistent quality across engagements. SAs document reference architectures, deployment patterns, and integration guides from engagement
          experience.

          '
        agent: sa-best-practices-agent
        activities:
        - Best practice creation from engagement learnings
        - Reference architecture documentation
        - Q&A content generation and update
        - Gap analysis by solution area
        - Knowledge sharing across SA team
        cadence: continuous, triggered by product releases or engagement patterns
      - domain: Specialist Coordination and Product Contribution
        why: 'The SA determines when domain specialists are needed, provides technical context for their engagement, and serves as the voice of the customer back to Product Management. Field patterns, product
          gaps, and customer requirements feed directly into roadmap prioritization.

          '
        agent: sa-agent
        contributing_agents:
        - agent: specialist-agent
          provides: Domain expertise in security, observability, search
        - agent: poc-agent
          provides: Evaluation findings that reveal product gaps
        activities:
        - Specialist need assessment and routing
        - Technical context handoff to specialists
        - Product gap identification from field engagements
        - Customer feedback relay to Product, Engineering, and Marketing
        - Feature request pattern aggregation for PM
        - Joint solution shaping with PM on roadmap items
        cadence: per-engagement for specialists, quarterly for PM contribution
      - domain: Technical Competitive Positioning
        why: 'The SA provides the technical depth behind competitive positioning, architecture differentiation, and displacement strategies that AE and CI cannot assess alone.

          '
        agent: sa-best-practices-agent
        contributing_agents:
        - agent: sa-risk-agent
          provides: Competitor technical risk exposure
        - agent: sa-discovery-agent
          provides: Customer requirements context for differentiation
        activities:
        - Technical differentiation analysis per competitor
        - Architecture comparison for displacement scenarios
        - Competitive technical win themes
        - Technical objection handling for competitive deals
        cadence: per-competitive-deal, refreshed quarterly
  fallback_model: null
