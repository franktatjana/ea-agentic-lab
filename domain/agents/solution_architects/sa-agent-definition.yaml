x-ea-agent:
  profile:
    why: 'Solution Architects context-switch across 5-15 engagements at different stages, each requiring different technical depth. Between architecture reviews, risk assessments, meeting prep, and decision
      documentation, the actual design and advisory window shrinks. This agent handles signal detection, risk tracking, InfoHub maintenance, and artifact generation so the SA can focus on architecture judgment
      and customer conversations.

      '
    human_matters_summary: 'The agent prepares architecture assessments, risk analysis, and decision documentation, but the SA brings design judgment, customer trust, and the ability to read the room in
      technical conversations.

      '
    goals_summary: 'The SA succeeds when technical risks are caught early, architecture decisions are documented, and every engagement moves from discovery to handoff with no information gaps.

      '
    goals:
    - Zero unqualified engagements consuming SA time
    - Complete technical landscape documented before solution design begins
    - Solution design validated against customer requirements with no unaddressed gaps
    - Opportunity shape assessed within first two discovery sessions
    - Every technical risk surfaced before it becomes a commercial blocker
    - Actionable VSM output delivered within one week of workshop completion
    - Every demo and workshop maps directly to validated customer pain points
    - POC conversion rate above team benchmark through structured evaluation design
    - RFP technical response turnaround within deadline with no missed compliance items
    - Technical value quantified with evidence for every strategic deal
    - Customer technical confidence measured through deal progression velocity
    - Every architecture decision captured with rationale within 24 hours
    - Clean CA handoff with zero information gaps at deal close
    - Reusable best practices created from every strategic engagement
    role_context: 'The Solution Architect is the technical conscience of the deal and a change agent for customer transformation. They review architectures, assess risks, and design solutions that meet
      customer requirements without over-engineering. In a typical week, they context-switch across 5-15 engagements at different stages, each needing different depth of technical attention.

      SAs bridge the gap between what customers need and what the platform can deliver. They own the technical narrative from first discovery through post-sales handoff, working as a peer to the Account
      Executive who owns the commercial side. Beyond technical design, SAs serve as trusted advisors who challenge customers on what to start, stop, and continue, connecting technology decisions to measurable
      business outcomes.

      '
    scenarios:
    - problem: Architecture risks surface after the deal is signed
      why: 'During pre-sales, technical due diligence competes with deal velocity. SAs juggle multiple accounts and often lack time to perform thorough risk assessments before commercial commitment, leaving
        gaps that become delivery problems.

        '
      agent: sa-agent
      agent_response: 'The agent routes architecture reviews to the SA Technical Risk Agent, which evaluates performance, capacity, and integration risks using structured assessment frameworks. Findings
        surface as risk cards before deal review, giving the team time to scope mitigations into the proposal.

        '
      success_signal:
        metric: Architecture risk assessments completed before commercial commitment
        target: 90% of deals have risk assessment before proposal submission
        leading_indicator: Risk cards generated within 48 hours of discovery completion
        failure_signal: Post-signature architecture rework or delivery scope changes
    - problem: Meeting decisions go undocumented and context is lost across handoffs
      why: 'SAs make and negotiate technical decisions in customer meetings, but capturing those decisions competes with preparing for the next engagement. Undocumented decisions create confusion during
        implementation and leave the CA handoff incomplete.

        '
      agent: sa-agent
      agent_response: 'The agent routes decision capture to the SA Decision Capture Agent, which extracts decisions from meeting notes and generates Architecture Decision Records with rationale, alternatives
        considered, and implications. These feed directly into InfoHub for handoff completeness.

        '
      success_signal:
        metric: Architecture decisions documented with rationale
        target: Every architecture decision captured within 24 hours of the meeting
        leading_indicator: ADRs generated per customer engagement per week
        failure_signal: Implementation team discovers undocumented decisions during delivery
    - problem: Context-switching across 5-15 engagements at different lifecycle stages
      why: 'SAs carry a portfolio of accounts simultaneously, each at a different stage from early discovery to post-sales handoff. Rebuilding context for every meeting or request drains cognitive capacity
        and increases the chance of dropping critical details.

        '
      agent: sa-agent
      agent_response: 'The orchestrator maintains per-account state across all sub-agents, so switching between engagements requires no manual context assembly. When an SA moves to a different account,
        the agent surfaces the current lifecycle stage, open risks, pending decisions, and next actions from the relevant sub-agents automatically.

        '
      success_signal:
        metric: Context retrieval time when switching between accounts
        target: Full account context available in under 60 seconds for any engagement
        leading_indicator: SA self-reported prep time per meeting decreasing week over week
        failure_signal: SA spends more than 15 minutes gathering context before customer interactions
    - problem: Discovery depth varies by SA experience and prep time
      why: 'Junior SAs may miss critical architecture questions while experienced SAs have internalized discovery patterns over years. When prep time is limited, even seasoned SAs skip areas, leading to
        incomplete technical landscapes that surface as surprises later in the deal cycle.

        '
      agent: sa-agent
      agent_response: 'The agent routes discovery to the SA Discovery Agent, which enforces a structured discovery framework covering business outcomes, current state, requirements, and constraints regardless
        of SA experience level. The framework adapts question depth based on engagement complexity and flags uncovered areas before the SA moves forward.

        '
      success_signal:
        metric: Discovery completeness score across all engagements
        target: 95% of discovery dimensions covered before solution design begins
        leading_indicator: Reduction in variance of discovery scores between junior and senior SAs
        failure_signal: Architecture rework traced back to missed discovery questions
    - problem: Value articulation stays technical, never reaches business language
      why: 'SAs think in architectures, integrations, and performance characteristics. Translating those into revenue impact, cost avoidance, or operational efficiency requires a different framing that
        many SAs find unnatural, leaving the business case weak or entirely absent from technical proposals.

        '
      agent: sa-agent
      agent_response: 'The agent routes value articulation to the SA Value Agent, which maps technical capabilities to quantified business outcomes using value stream analysis. It translates architecture
        decisions into language that resonates with business stakeholders: cost reduction percentages, time-to-value estimates, and risk mitigation in financial terms.

        '
      success_signal:
        metric: Proposals that include quantified business outcomes alongside technical design
        target: 100% of strategic deal proposals contain at least 3 quantified value statements
        leading_indicator: Value statements drafted within 24 hours of discovery completion
        failure_signal: Customer executives request business justification that SA cannot provide
    - problem: Customer journey context is lost during CA handoff
      why: 'The transition from pre-sales to post-sales is where institutional knowledge disappears. Design rationale, rejected alternatives, customer-specific constraints, and relationship nuances live
        in the SA''s head and rarely transfer completely to the Customer Advisor who inherits the account.

        '
      agent: sa-agent
      agent_response: 'The agent routes journey mapping to the SA Journey Agent, which tracks every engagement touchpoint, decision, and context shift across the customer lifecycle. At handoff, it generates
        a structured transition package including architecture decisions, open risks, stakeholder map, and adoption milestones that the CA can consume without needing the original SA''s presence.

        '
      success_signal:
        metric: 'CA handoff completeness: percentage of required context artifacts present'
        target: 100% of handoff packages scored complete by receiving CA within first week
        leading_indicator: Handoff artifacts auto-generated as engagement progresses, not at the end
        failure_signal: CA escalates missing context or contradictory information within 30 days of handoff
    - problem: Keeping up with platform changes across an expanding product portfolio
      why: 'Product releases, deprecations, and new capabilities arrive continuously. SAs must stay current across the full portfolio to design accurate solutions, but the volume of change outpaces any
        individual''s ability to read every release note and update their mental model.

        '
      agent: sa-agent
      agent_response: 'The agent routes knowledge management to the SA Best Practices Agent, which continuously ingests platform release notes, documentation updates, and deprecation notices. It surfaces
        relevant changes per engagement context, updates reference architectures automatically, and flags when existing customer designs are affected by platform changes.

        '
      success_signal:
        metric: SA awareness of platform changes relevant to active engagements
        target: Relevant platform changes surfaced to SA within 48 hours of release
        leading_indicator: Reference architectures updated within one week of major platform releases
        failure_signal: SA proposes deprecated features or misses new capabilities in solution designs
    - problem: POC scope creep during evaluations erodes time for other engagements
      why: 'POCs start with defined success criteria but expand as customers add requirements mid-evaluation. Without guardrails, the SA invests disproportionate time on a single evaluation while other
        accounts receive minimal attention, reducing overall portfolio effectiveness.

        '
      agent: sa-agent
      agent_response: 'The agent routes POC lifecycle management to the POC Agent, which enforces qualification gates, tracks success criteria against the original scope, and flags scope additions for explicit
        approval. When new requirements emerge, the agent assesses impact on timeline and resources before the SA commits, preserving capacity for the broader portfolio.

        '
      success_signal:
        metric: 'POC scope variance: requirements at completion vs requirements at kickoff'
        target: Less than 15% scope increase without documented approval and timeline adjustment
        leading_indicator: Scope change requests flagged and assessed within 4 hours of submission
        failure_signal: POC extends beyond original timeline by more than 50% without formal re-scoping
    - problem: RFP deadlines force rushed technical responses with recycled boilerplate
      why: 'RFPs arrive with tight deadlines that compress the time available for thoughtful technical responses. SAs default to copying past answers that may not fit the current customer''s context, producing
        generic responses that fail to differentiate and occasionally contain inaccurate or outdated information.

        '
      agent: sa-agent
      agent_response: 'The agent routes RFP response orchestration to the RFP Agent, which maintains a structured response library indexed by capability, customer segment, and compliance requirement. It
        adapts past responses to the current customer''s context using discovery findings, flags stale content for review, and coordinates specialist inputs in parallel to compress response time without
        sacrificing accuracy.

        '
      success_signal:
        metric: RFP response accuracy and customer-specificity scores
        target: 'Zero recycled boilerplate: 100% of technical responses customized to customer context'
        leading_indicator: First draft of technical sections generated within 24 hours of RFP receipt
        failure_signal: Customer feedback citing generic or inaccurate technical responses in RFP
    - problem: 'Cross-team coordination friction: waiting on specialists, PM, legal for inputs'
      why: 'SAs depend on specialists for domain depth, product managers for roadmap clarity, and legal for compliance sign-off. Each dependency introduces wait time and communication overhead that compounds
        across engagements, slowing deal velocity and leaving SAs blocked on external inputs.

        '
      agent: sa-agent
      agent_response: 'The orchestrator manages specialist engagement directly through its specialist-engagement flow, dispatching requests with full technical context so recipients can respond without
        back-and-forth clarification. It tracks response SLAs, escalates overdue inputs, and routes requests to alternative specialists when primary contacts are unavailable, reducing coordination overhead
        for the SA.

        '
      success_signal:
        metric: Specialist response time from request to actionable input
        target: 90% of specialist inputs received within 24 hours of request dispatch
        leading_indicator: 'Requests dispatched with sufficient context: less than 10% require clarification'
        failure_signal: SA blocked on external inputs for more than 48 hours on active deals
    - problem: Customer stakeholder misalignment on architecture direction forces the SA to mediate
      why: 'Different customer stakeholders, such as the CTO favoring cloud-native while the security lead demands on-premises control, hold conflicting architecture preferences. The SA must identify these
        conflicts early and navigate them diplomatically, or risk designing a solution that one faction will block.

        '
      agent: sa-agent
      agent_response: 'The agent routes stakeholder analysis to the SA Discovery Agent, which maps stakeholder positions, priorities, and concerns during discovery. It identifies conflicting requirements
        early and surfaces them as explicit trade-off decisions for the SA to facilitate, providing evidence-based comparison frameworks that help stakeholders evaluate options against shared business objectives
        rather than individual technical preferences.

        '
      success_signal:
        metric: Stakeholder conflicts identified and documented before solution design
        target: 100% of multi-stakeholder engagements have conflict map before architecture proposal
        leading_indicator: Stakeholder alignment sessions scheduled within one week of conflict detection
        failure_signal: Architecture proposal rejected due to stakeholder conflict not identified in discovery
    - problem: Competitive displacement adds migration path and coexistence complexity to every design
      why: 'When customers run a competitor''s platform, the SA must design not just the target architecture but also the migration path and interim coexistence state. This doubles the design surface area
        and requires deep knowledge of competitor architectures that the SA may not have readily available.

        '
      agent: sa-agent
      agent_response: 'The agent routes competitive positioning to the SA Best Practices Agent, which maintains migration playbooks and coexistence patterns for common competitor platforms. It provides
        the SA with tested migration paths, known compatibility constraints, and risk profiles specific to each competitor, reducing research time and improving the accuracy of displacement architecture
        designs.

        '
      success_signal:
        metric: Displacement designs that include validated migration path and coexistence plan
        target: 100% of competitive displacement proposals include tested migration patterns
        leading_indicator: Migration playbook referenced within 4 hours of competitive displacement identified
        failure_signal: Migration failures or coexistence issues traced to gaps in displacement design
    challenges:
    - text: Context-switching across 5-15 engagements at different lifecycle stages
      solved_by: sa-agent
      specific_overhead:
      - Meeting prep by pulling architecture context from multiple accounts
    - text: Architecture risks surface after commercial commitment, not before
      solved_by: sa-risk-agent
      specific_overhead:
      - Compiling risk registers and tracking mitigation across engagements
    - text: Risk assessments rely on gut feel rather than evidence-based severity classification
      solved_by: sa-risk-agent
      specific_overhead:
      - Manually reviewing deployment architecture and configuration to assess health across multiple accounts
    - text: Integration risks are underestimated for what appear to be simple connector-based integrations
      solved_by: sa-risk-agent
      specific_overhead:
      - Gathering performance metrics and usage data to evaluate capacity against growth projections
    - text: Capacity planning ignores growth projections, leading to performance issues 6-12 months post-deployment
      solved_by: sa-risk-agent
      specific_overhead:
      - Cross-referencing integration inventories against known anti-patterns and complexity indicators
    - text: Risk trending is invisible because assessments are point-in-time with no comparison to prior evaluations
      solved_by: sa-risk-agent
    - text: Risk mitigation actions are defined in assessments but never tracked to completion, leaving known risks open
      solved_by: sa-risk-agent
      specific_overhead:
      - Following up on mitigation action owners and updating risk status across review cycles
    - text: Customers treat risk findings as over-engineering and resist architectural changes recommended to close gaps
      solved_by: sa-risk-agent
    - text: Disaster recovery and business continuity gaps scoped out of initial deployments resurface as blockers at renewal
      solved_by: sa-risk-agent
    - text: Technical decisions made in meetings go undocumented
      solved_by: sa-decision-capture-agent
      specific_overhead:
      - Documenting architecture decisions as ADRs after every discussion
    - text: Discovery depth varies by SA experience and prep time
      solved_by: sa-discovery-agent
    - text: Value articulation stays technical, never reaches business language
      solved_by: sa-value-agent
    - text: Technical capabilities are presented without connecting them to measurable business outcomes
      solved_by: sa-value-agent
      specific_overhead:
      - Manually mapping each technical capability to a business outcome with supporting evidence
    - text: ROI frameworks use single-point estimates that lack credibility with financial stakeholders
      solved_by: sa-value-agent
      specific_overhead:
      - Building ROI frameworks from scratch for each deal instead of adapting a reusable model
    - text: Value narratives are generic across audiences instead of tailored to each stakeholder's priorities
      solved_by: sa-value-agent
      specific_overhead:
      - Adapting value narratives for different audiences by rewriting the same content multiple times
    - text: Value stream mapping reveals process complexity that exceeds the current solution scope
      solved_by: sa-value-agent
    - text: Customers decline to share internal financial data, making it impossible to build a credible ROI case
      solved_by: sa-value-agent
      specific_overhead:
      - Constructing benchmark-based proxies when customer financial data is unavailable or restricted
    - text: Value assumptions validated at proposal stage are challenged during procurement when budget holders review the details
      solved_by: sa-value-agent
    - text: Post-sale value realization is never measured, so pre-sale commitments cannot be validated or referenced at renewal
      solved_by: sa-value-agent
    - text: Competitive value comparisons require positioning TCO against incumbent costs without access to competitor pricing
      solved_by: sa-value-agent
    - text: Customer journey context is lost during CA handoff
      solved_by: sa-journey-agent
    - text: Keeping up with platform changes across an expanding product portfolio
      solved_by: sa-best-practices-agent
      specific_overhead:
      - Updating architecture diagrams after every design discussion
    - text: POC scope creep during evaluations erodes time for other engagements
      solved_by: poc-agent
      specific_overhead:
      - Compiling POC results into decision-ready presentations for customer stakeholders
    - text: Balancing thorough qualification against sales urgency to start POCs quickly
      solved_by: poc-agent
      specific_overhead:
      - Documenting success criteria, milestones, and exit conditions for each POC
    - text: Maintaining customer engagement across multi-week evaluations with competing priorities
      solved_by: poc-agent
      specific_overhead:
      - Preparing weekly POC status updates with milestone tracking and risk flags
    - text: Coordinating specialist and SA resources across overlapping POC timelines
      solved_by: poc-agent
      specific_overhead:
      - Coordinating resource schedules across SA, specialist, and customer teams
    - text: POC drags on without clear success criteria or exit conditions
      solved_by: poc-agent
    - text: Customer stakeholders disengage mid-evaluation and momentum collapses
      solved_by: poc-agent
    - text: Converting a successful POC into commercial momentum before competing customer priorities take over
      solved_by: poc-agent
      specific_overhead:
      - Preparing post-POC recommendation briefs and executive summaries for the go/no-go meeting
    - text: Running competitive POCs where the customer evaluates multiple vendors simultaneously
      solved_by: poc-agent
    - text: POC environment provisioning delays push back the technical start and compress the evaluation window
      solved_by: poc-agent
    - text: Translating technical POC results into a business decision narrative for non-technical executive stakeholders
      solved_by: poc-agent
    - text: RFP deadlines force rushed technical responses with recycled boilerplate
      solved_by: rfp-agent
      specific_overhead:
      - Assembling RFP technical sections from past responses and specialist inputs
    - text: Tight RFP deadlines conflicting with contributor availability across multiple active deals
      solved_by: rfp-agent
      specific_overhead:
      - Building and maintaining compliance matrices that map requirements to capabilities
    - text: Maintaining consistent win themes when different teams write different response sections
      solved_by: rfp-agent
      specific_overhead:
      - Tracking section ownership, deadlines, and completion status across contributors
    - text: Accessing accurate, current product capability data for compliance matrix completion
      solved_by: rfp-agent
      specific_overhead:
      - Coordinating review cycles between technical, commercial, and legal reviewers
    - text: Balancing response quality against the volume of RFPs received simultaneously
      solved_by: rfp-agent
    - text: Team pursues low-probability RFPs because no structured bid/no-bid process exists
      solved_by: rfp-agent
    - text: RFP response sections arrive late and inconsistent because coordination is manual
      solved_by: rfp-agent
    - text: RFPs written to favor a competitor's architecture make it hard to respond without appearing non-compliant
      solved_by: rfp-agent
    - text: Legal and security review cycles inside the RFP deadline compress the writing window for technical sections
      solved_by: rfp-agent
    - text: Product roadmap commitments made in RFP responses create post-award delivery expectations that go untracked
      solved_by: rfp-agent
    - text: 'Cross-team coordination friction: waiting on specialists, PM, legal for inputs'
      solved_by: sa-agent
      specific_overhead:
      - Maintaining InfoHub completeness and freshness per account
    - text: Customer stakeholder misalignment on architecture direction forces the SA to mediate
      solved_by: sa-discovery-agent
    - text: Competitive displacement adds migration path and coexistence complexity to every design
      solved_by: sa-best-practices-agent
      specific_overhead:
      - Researching and adapting reference architectures for each engagement
    administrative_overhead:
    - text: Meeting prep by pulling architecture context from multiple accounts
      automated_by: sa-agent
    - text: Maintaining InfoHub completeness and freshness per account
      automated_by: sa-agent
    - text: Documenting architecture decisions as ADRs after every discussion
      automated_by: sa-decision-capture-agent
    - text: Compiling risk registers and tracking mitigation across engagements
      automated_by: sa-risk-agent
    - text: Updating architecture diagrams after every design discussion
      automated_by: sa-best-practices-agent
    - text: Researching and adapting reference architectures for each engagement
      automated_by: sa-best-practices-agent
    - text: Assembling RFP technical sections from past responses and specialist inputs
      automated_by: rfp-agent
    - text: Writing status updates across engagements for different audiences
      automated_by: sa-agent
    key_metrics:
    - 'Technical risk detection rate: risks surfaced before vs after commercial commitment'
    - 'Decision capture latency: hours from meeting to documented ADR'
    - 'InfoHub completeness: percentage of required artifacts present and current per account'
    - 'Specialist engagement SLA: time from detection to specialist request dispatch'
    - 'POC conversion rate: evaluations that progress to contract (influenced by SA quality)'
    - 'SA-influenced win rate: deals with SA engagement vs deals without'
    - 'Customer Success Plan completion: CSPs delivered before close on strategic deals'
    qualification_framework:
      name: Technical Readiness Assessment
      owner: sa-agent
      note: 'The SA assesses technical readiness across 6 dimensions. Each dimension is informed by the sub-agent that owns the relevant domain.

        '
      dimensions:
      - letter: A
        name: Architecture Fit
        description: How well the proposed solution maps to customer's existing architecture
        supported_by: sa-agent
      - letter: I
        name: Integration Complexity
        description: Number, type, and risk of integrations required
        supported_by: sa-agent
      - letter: S
        name: Security & Compliance
        description: Regulatory requirements, security posture, certification needs
        supported_by: infosec-agent
      - letter: P
        name: POC Readiness
        description: Whether technical prerequisites exist for meaningful evaluation
        supported_by: poc-agent
      - letter: R
        name: Risk Profile
        description: Technical risks that could block deal or deployment success
        supported_by: sa-agent
      - letter: D
        name: Domain Expertise
        description: Whether specialist knowledge is needed beyond SA generalist scope
        supported_by: specialist-agent
    stakeholder_landscape:
      customer_side:
      - role: 'CTO / VP Engineering: architecture strategy, technology direction, build vs buy'
        connected_via: sa-agent
      - role: 'IT Director / Infrastructure Lead: deployment topology, capacity, operations'
        connected_via: sa-agent
      - role: 'Security Lead / CISO: compliance requirements, threat model, data handling'
        connected_via: infosec-agent
      - role: 'Development Team Lead: integration points, API design, SDK requirements'
        connected_via: sa-agent
      - role: 'Data Architect: data model, migration, retention, access patterns'
        connected_via: specialist-agent
      internal_team:
      - role: 'Account Executive: deal context, commercial constraints, timeline pressure'
        connected_via: sa-agent
      - role: 'Value Engineer: business case construction, TCO analysis'
        connected_via: sa-agent
      - role: 'Delivery Manager: implementation feasibility, resource planning'
        connected_via: sa-agent
      - role: 'Domain Specialists: deep expertise in security, observability, search'
        connected_via: specialist-agent
      - role: 'Product Manager: roadmap alignment, feature feasibility'
        connected_via: sa-agent
      - role: 'Partner / SI: joint solution delivery, ecosystem technical alignment'
        connected_via: sa-agent
    capabilities:
    - Technical discovery and landscape assessment
    - Architecture and solution design
    - Technical risk identification and mitigation
    - Engagement qualification (go/no-go)
    - Solution fit assessment (transactional vs strategic)
    - Value stream mapping
    - Demo, technical workshops, and customer enablement
    - POC lifecycle (qualification, success criteria, execution, conversion)
    - RFP technical response (bid/no-bid, compliance, win themes)
    - Value articulation (technical to business)
    - Trusted technical advisory and architecture communication
    - Customer journey and CA handoff
    - Decision capture and architecture governance
    - Best practices documentation and knowledge sharing
    - Specialist coordination and product contribution
    - Technical competitive positioning
    - Customer success planning
