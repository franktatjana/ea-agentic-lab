        type: string
      - title: known_context
        type: string
      - title: meeting_date
        type: string
      outputs:
      - title: discovery-preparation_result
        type: object
    sa-business-outcomes-discovery:
      description: Discover and document business outcomes
      source: prompts/tasks.yaml#technical_discovery.business_outcomes_discovery
