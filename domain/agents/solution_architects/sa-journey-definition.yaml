agentspec_version: 26.1.0
component_type: Agent
id: sa-journey-agent
name: SA Customer Journey Agent
description: 'Maps the customer journey from first touch through deal close. Documents touchpoints after discovery meetings, creates stakeholder-specific journey views, tracks POV/POC evaluation touchpoints,
  captures qualitative feedback, and prepares journey map handoff to Customer Architect at deal close.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: sa-agent
  tags:
  - customer-journey
  - touchpoints
  - feedback
  - handoff
  responsibility: Build and maintain customer journey maps that capture the full pre-sales experience
system_prompt: 'You are a Customer Journey Agent, part of the Solution Architect intelligence

  system. Your job is to map the customer experience through every touchpoint.


  You MUST:

  - Initiate journey mapping when opportunity enters Stage 2

  - Document every touchpoint with date, participants, topics, and outcomes

  - Create stakeholder-specific views showing their individual journey

  - Capture qualitative feedback (sentiment, friction points, highlights)

  - Prepare complete handoff to CA with no information gaps


  You MUST NOT:

  - Skip touchpoint documentation for "routine" meetings

  - Fabricate feedback not expressed by the customer

  - Merge stakeholder journeys (each person has a different experience)

  - Hand off without journey completeness check


  When uncertain about sentiment: quote the exact customer statement,

  do not interpret mood or intent beyond what was said.


  Tone: empathetic, observational, detail-oriented.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-communications
  name: Read Communications
  description: 'Access meeting transcripts, Slack threads, and email exchanges for touchpoint documentation and stakeholder interaction evidence.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: source_type
    type: string
  - title: time_period
    type: string
  outputs:
  - title: communications
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Cannot access communications, flag as data gap
    - error_code: NO_RECORDS
      guidance: No communications found for period, expand search or note gap
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks, decisions, stakeholders, competitive, governance, value, journey, opportunities,
    context, or frameworks.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: write-sa-artifact
  name: Write Solution Artifact
  description: Save journey maps and handoff packages to InfoHub
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from solution architect
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: journey-intelligence
  name: Journey Intelligence
  description: Customer journey data available to peer agents for relationship context
  tools:
  - id: get-journey-map
    name: Get Journey Map
    description: Returns customer journey map with touchpoints and sentiment
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: journey_map
      type: object
  - id: get-stakeholder-journey
    name: Get Stakeholder Journey
    description: Returns journey view for a specific stakeholder
    inputs:
    - title: account_name
      type: string
    - title: stakeholder_name
      type: string
    outputs:
    - title: stakeholder_journey
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: customer-journey
  name: Customer Journey
  playbook_refs:
  - PB_SA_007
  - PB_SA_011
  description: Map customer journey from first touch through deal close and handoff
  inputs:
  - title: account_name
    type: string
  - title: attendees
    type: string
  - title: ca_name
    type: string
  - title: interactions
    type: string
  outputs:
  - title: customer_journey_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: sa-initiate-journey-map
      input: opportunity_name, account_name, first_touch, stakeholders
      description: Start journey mapping when opportunity enters Stage 2
      on_failure: stop
    - step: 2
      prompt: sa-map-discovery-touchpoints
      input: account_name, meeting_date, attendees, topics
      description: Document touchpoints after discovery meetings
      on_failure: stop
    - step: 3
      prompt: sa-map-stakeholder-journeys
      input: account_name, stakeholders, interactions
      description: Create detailed journey view per key stakeholder
      on_failure: skip_with_warning
    - step: 4
      prompt: sa-map-evaluation-journey
      input: account_name, pov_type, start_date, end_date
      description: Document POV/POC journey touchpoints
      on_failure: skip_with_warning
    - step: 5
      prompt: sa-journey-handoff-to-ca
      input: account_name, ca_name, journey_map_link, csp_link
      description: Prepare journey map handoff at deal close
      on_failure: stop
    - step: 6
      prompt: sa-capture-presales-feedback
      input: account_name, type, date, participants
      description: Document qualitative feedback from customer interactions
      on_failure: skip_with_warning
    - step: 7
      action: persist
      tools:
      - write-sa-artifact
      description: Save journey map and handoff package to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - journey-mapping
    - touchpoint-documentation
    - stakeholder-journeys
    - journey-handoff
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'Journey maps capture what happened, but the SA interprets why it matters. Reading between the lines of customer feedback, understanding cultural context, and recognizing when
      a positive meeting masked underlying concerns requires human judgment. The agent records touchpoints, but the SA shapes the experience those touchpoints represent.

      '
    challenges:
    - text: Touchpoints go undocumented after routine meetings, creating gaps in the journey record
      specific_overhead:
      - Manually logging meeting dates, participants, topics, and outcomes after every customer interaction
    - text: Individual stakeholder experiences are merged into one aggregate view that hides critical differences
      specific_overhead:
      - Building separate journey views for each stakeholder from the same pool of meeting notes
    - text: Qualitative feedback from customer interactions is lost because no structured capture process exists
      specific_overhead:
      - Reviewing weeks of communications to reconstruct the timeline when preparing for a handoff
    - text: Journey maps are not handed off to the Customer Architect, forcing re-discovery of the relationship history
      specific_overhead:
      - Capturing sentiment and friction points from meeting transcripts without over-interpreting customer statements
    administrative_overhead:
    - Manually logging meeting dates, participants, topics, and outcomes after every customer interaction
    - Building separate journey views for each stakeholder from the same pool of meeting notes
    - Reviewing weeks of communications to reconstruct the timeline when preparing for a handoff
    - Capturing sentiment and friction points from meeting transcripts without over-interpreting customer statements
    scenarios:
    - problem: Touchpoints go undocumented after routine meetings, creating gaps in the journey record
      why: 'When only major milestones are tracked, the journey map misses the incremental interactions where trust builds or erodes. A series of short check-ins where the customer expressed frustration
        becomes invisible, and the SA loses the ability to detect negative trends before they escalate into a formal complaint.

        '
      agent: sa-journey-agent
      agent_response: 'Auto-triggers touchpoint documentation after every customer meeting. Extracts date, participants, topics, and outcomes from meeting transcripts and communications. Flags gaps when
        no customer contact has occurred for 21+ days during an active evaluation.

        '
      success_signal:
        metric: Touchpoints documented within 24h of customer interaction
        target: 100% of customer meetings have a documented touchpoint in the journey map
        leading_indicator: No touchpoint gaps longer than 7 days during active evaluation phases
        failure_signal: Journey map has 21+ day gaps during an active evaluation with no explanation
    - problem: Journey maps are not handed off to the Customer Architect, forcing re-discovery of the relationship history
      why: 'The Customer Architect inherits a customer with months of interaction history but no structured record of it. They cannot see which stakeholders were engaged, what feedback was given, or where
        friction occurred. The customer feels like they are starting over with a new vendor team that knows nothing about them.

        '
      agent: sa-journey-agent
      agent_response: 'Prepares a complete journey map handoff package at deal close. Includes all touchpoints, stakeholder-specific journey views, feedback summaries, and unresolved concerns. Runs a completeness
        check before handoff to ensure no critical context is missing.

        '
      success_signal:
        metric: Journey handoff package completeness at deal close
        target: 100% of handoffs include full touchpoint history, stakeholder views, and feedback summary
        leading_indicator: CA acknowledges sufficient context within first week of engagement
        failure_signal: CA requests additional meetings with the SA to understand relationship history
    - problem: Individual stakeholder experiences are merged into one aggregate view that hides critical differences
      why: 'When all stakeholder interactions are collapsed into a single journey timeline, the SA loses visibility into divergent experiences. A champion who had consistently positive interactions looks
        the same as a detractor who raised concerns at every meeting. The aggregate view masks risks that only become visible when each stakeholder''s journey is examined independently.

        '
      agent: sa-journey-agent
      agent_response: 'Creates individual journey views for each key stakeholder, tracking their specific touchpoints, topics discussed, feedback given, and sentiment over time. Highlights divergences between
        stakeholder experiences so the SA can identify at-risk relationships and tailor engagement strategies per person rather than per account.

        '
      success_signal:
        metric: Stakeholder-specific journey views maintained
        target: Individual journey view exists for every key stakeholder in active evaluations
        leading_indicator: SA uses stakeholder journey views to tailor meeting prep for specific participants
        failure_signal: Detractor sentiment goes undetected because feedback was averaged across all stakeholders
    - problem: Qualitative feedback from customer interactions is lost because no structured capture process exists
      why: 'Customer feedback expressed in meetings, emails, and informal conversations contains signals about satisfaction, concerns, and priorities that quantitative data cannot capture. Without a structured
        process to record this feedback, the SA relies on memory, sentiment trends go untracked, and the handoff to the CA lacks the relationship context that determines how the customer truly feels about
        the engagement.

        '
      agent: sa-journey-agent
      agent_response: 'Captures qualitative feedback from every customer interaction using structured fields: sentiment, friction points, highlights, and exact customer quotes. Tracks feedback trends over
        time to surface patterns the SA might miss across multiple accounts, and includes feedback summaries in the journey handoff package.

        '
      success_signal:
        metric: Customer interactions with captured qualitative feedback
        target: 90% of customer interactions have structured feedback captured within 48h
        leading_indicator: Feedback trend data available for SA review before each customer meeting
        failure_signal: Journey handoff contains no qualitative feedback, only a list of meeting dates
  escalation_triggers:
  - Negative feedback pattern detected (2+ consecutive interactions)
  - Journey handoff ready but no Customer Architect assigned
  - Stakeholder journey shows complete disengagement from evaluation
  - 'Critical touchpoint gap: no customer contact for 21+ days mid-evaluation'
  prompt_registry:
    sa-initiate-journey-map:
      description: Start journey mapping at Stage 2
      source: prompts/tasks.yaml#customer_journey.initiate_journey_map
      inputs:
      - title: opportunity_name
        type: string
      - title: account_name
        type: string
      - title: first_touch
        type: string
      - title: stakeholders
        type: array
      outputs:
      - title: journey_map_initial
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - stakeholder_map
        - account_context
        - opportunity_data
        priority: enrichment
      - source: read-communications
        fields:
        - initial_touchpoints
        - first_contact_records
        priority: critical
    sa-map-discovery-touchpoints:
      description: Document touchpoints after discovery
      source: prompts/tasks.yaml#customer_journey.map_discovery_touchpoints
      inputs:
      - title: account_name
        type: string
      - title: meeting_date
        type: string
      - title: attendees
        type: array
      - title: topics
        type: string
      outputs:
      - title: touchpoint_entries
        type: object
      requires_data:
      - source: read-communications
        fields:
        - meeting_transcripts
        - email_threads
        - slack_threads
        priority: critical
      - source: read-infohub
        fields:
        - stakeholder_map
        - discovery_summary
        priority: enrichment
    sa-map-stakeholder-journeys:
      description: Create stakeholder-specific journey views
      source: prompts/tasks.yaml#customer_journey.map_stakeholder_journeys
      inputs:
      - title: account_name
        type: string
      - title: stakeholders
        type: array
      - title: interactions
        type: array
      outputs:
      - title: stakeholder_journeys
        type: object
      requires_data:
      - source: read-communications
        fields:
        - stakeholder_interactions
        - meeting_attendance
        - email_exchanges
        priority: critical
      - source: read-infohub
        fields:
        - stakeholder_map
        - stakeholder_roles
        priority: enrichment
    sa-map-evaluation-journey:
      description: Document POV/POC evaluation touchpoints
      source: prompts/tasks.yaml#customer_journey.map_evaluation_journey
      inputs:
      - title: account_name
        type: string
      - title: pov_type
        type: string
      - title: start_date
        type: string
      - title: end_date
        type: string
      - title: participants
        type: array
      outputs:
      - title: evaluation_journey
        type: object
      requires_data:
      - source: read-communications
        fields:
        - evaluation_meeting_records
        - poc_correspondence
        priority: critical
      - source: read-infohub
        fields:
        - journey_context
        - evaluation_criteria
        priority: enrichment
    sa-journey-handoff-to-ca:
      description: Prepare journey map handoff at deal close
      source: prompts/tasks.yaml#customer_journey.journey_handoff_to_ca
      inputs:
      - title: account_name
        type: string
      - title: ca_name
        type: string
      - title: journey_map_link
        type: string
      - title: csp_link
        type: string
      outputs:
      - title: journey_handoff_package
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - journey_map
        - stakeholder_map
        - risk_register
        - open_items
        priority: critical
      - source: read-communications
        fields:
        - full_interaction_history
        - unresolved_threads
        priority: critical
    sa-capture-presales-feedback:
      description: Capture qualitative feedback from customer interactions
      source: prompts/tasks.yaml#customer_journey.capture_presales_feedback
      inputs:
      - title: account_name
        type: string
      - title: type
        type: string
      - title: date
        type: string
      - title: participants
        type: array
      outputs:
      - title: feedback_capture
        type: object
      requires_data:
      - source: read-communications
        fields:
        - meeting_transcripts
        - customer_statements
        - feedback_records
        priority: critical
      - source: read-infohub
        fields:
        - stakeholder_map
        - journey_context
        priority: enrichment
  boundaries:
  - Customer journey mapping only, does not conduct technical discovery
  - Does not assess technical risk or architecture health
  - Does not create customer success plans or adoption timelines
  - Does not invent sentiment claims without specific customer statements
  - Does not merge individual stakeholder journeys into aggregate views
  permissions:
  - Read meeting notes and customer interactions from communications
  - Read stakeholder maps and opportunity data from InfoHub
  - Document touchpoints with dates, participants, and outcomes
  - Create stakeholder-specific journey views
  - Prepare journey map handoff packages for Customer Architect
  guardrails:
    input_validation:
    - rule: Touchpoints require specific date, participants, and context
    - rule: Journey initiation requires opportunity and stakeholder data
    output_checks:
    - rule: Every touchpoint has date, participants, topics, and outcomes
    - rule: Stakeholder journeys are individual, not merged
    - rule: Handoff package passes completeness check
    signal_validation:
    - rule: Sentiment claims quote exact customer statements
    - rule: Friction points reference specific observed behavior
  knowledge:
    scope:
      domains:
      - customer-journey
      - touchpoints
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/discovery-methodology.yaml
      description: Discovery dimensions, question frameworks, red flags, synthesis templates
    - path: references/best-practices-framework.yaml
      description: Best practice template structure, quality criteria, update triggers
  error_handling:
    tool_failures:
      critical:
      - read-communications
      enrichment:
      - read-infohub
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  autonomy:
    triggers:
    - type: parent_dispatch
      source: sa-agent
      description: SA orchestrator routes journey mapping requests
    - type: event
      source: crm_webhook
      condition: opportunity.stage == STAGE_2
      description: Journey mapping auto-initiates at Stage 2
    - type: event
      source: meeting_ended
      condition: meeting.has_customer == true
      description: Customer meetings trigger touchpoint documentation
    outputs:
    - type: parent_return
      target: sa-agent
      payload:
      - journey_map
      - touchpoints
      - feedback_summary
      description: Journey data back to SA orchestrator
    - type: notify_human
      condition: journey.handoff_ready == true OR journey.negative_feedback_count > 2
      channel: alert
      description: Handoff readiness and negative feedback patterns surface for SA review
    consumes_toolboxes:
    - toolbox: discovery-intelligence
      agent: sa-discovery-agent
      tools:
      - get-discovery-summary
      reason: Discovery findings provide touchpoint context and stakeholder roles
    - toolbox: csp-intelligence
      agent: sa-csp-agent
      tools:
      - get-csp-status
      reason: CSP milestones align with journey map phases
    dependencies: []
