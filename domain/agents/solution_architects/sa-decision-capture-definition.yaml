agentspec_version: 26.1.0
component_type: Agent
id: sa-decision-capture-agent
name: SA Decision Capture Agent
description: >
  Captures technical decisions from meetings, frames their architecture impact,
  and generates Architecture Decision Records (ADRs) when warranted. Ensures
  every significant technical choice is documented with rationale, alternatives
  considered, and consequences.
metadata:
  definition_version: "0.1.0"
  parent_agent: sa-agent
  tags:
  - decisions
  - adr
  - architecture
  - documentation
  responsibility: Capture every technical decision with rationale and architecture impact
system_prompt: |
  You are a Decision Capture Agent, part of the Solution Architect intelligence
  system. Your job is to ensure no technical decision goes undocumented.

  You MUST:
  - Extract decisions from meeting notes with exact attribution (who, what, when)
  - Assess architecture impact for each decision (scope, reversibility)
  - Generate ADRs for significant decisions (technology selection, pattern choice, breaking changes)
  - Cross-reference with existing decision log for conflicts
  - Separate technical decisions from business decisions

  You MUST NOT:
  - Generate ADRs for trivial decisions (formatting, naming conventions)
  - Make technical decisions on behalf of humans
  - Attribute decisions without clear evidence of who decided
  - Skip alternatives consideration for significant decisions

  When uncertain about significance: err on the side of documenting,
  add [REVIEW SIGNIFICANCE] marker.

  Tone: precise, factual, structured.
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-communications
  name: Read Communications
  description: >
    Access meeting transcripts and Slack threads where technical decisions
    are discussed. Primary source for decision extraction.
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: source_type
    type: string
  - title: time_period
    type: string
  outputs:
  - title: communications
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Cannot access communications, flag as data gap
    - error_code: NO_RECORDS
      guidance: No communications found for period, expand search or note gap
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: >
    Access structured account data from the InfoHub vault. Use section parameter
    to target specific data: risks, decisions, stakeholders, competitive,
    governance, value, journey, opportunities, context, or frameworks.
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: write-sa-artifact
  name: Write Solution Artifact
  description: Save decision logs and ADRs to InfoHub
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from solution architect
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: decision-intelligence
  name: Decision Intelligence
  description: Technical decision data available to peer agents for context
  tools:
  - id: get-decision-log
    name: Get Decision Log
    description: Returns technical decisions for an account with impact classification
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: decisions
      type: array
  - id: get-adrs
    name: Get ADRs
    description: Returns Architecture Decision Records for an account
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: adrs
      type: array
specialized_agents: []
flows:
- component_type: Flow
  id: decision-capture
  name: Decision Capture
  playbook_refs: [PB_SA_001, PB_SA_004, PB_SA_005, PB_SA_010, PB_SA_015]
  description: Capture technical decisions from meetings, frame architecture impact, generate ADRs
  inputs:
  - title: meeting_notes
    type: string
  - title: architecture_summary
    type: object
  - title: decision_log
    type: array
  outputs:
  - title: technical_decisions
    type: array
  - title: adrs
    type: array
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: sa-decision-capture-analyze
      input: meeting_notes
      description: Extract raw decisions from meeting notes
      on_failure: stop
    - step: 2
      prompt: sa-decision-capture-synthesize
      input: raw_decisions, architecture_summary
      description: Assess architecture impact of each decision
      on_failure: stop
    - step: 3
      prompt: sa-decision-capture-output
      input: decisions, impact_analysis
      description: Generate ADRs for significant decisions
      on_failure: skip_with_warning
    - step: 4
      action: persist
      tools:
      - write-sa-artifact
      description: Save decision log and ADRs to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - decision-capture
    - adr-generation
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: >
      Technical decisions often emerge implicitly in conversation. The SA
      recognizes when a statement is a decision versus a preference, understands
      the architectural weight of each choice, and ensures stakeholders grasp
      consequences before commitments become permanent. The agent documents,
      but the SA validates significance and catches what was left unsaid.
    challenges:
      - "Technical decisions are made in meetings but never documented, leaving no rationale trail"
      - "New decisions conflict with prior ADRs that no one remembers or reviews before committing"
      - "Irreversible architecture choices get made without the right stakeholders in the room"
      - "Alternatives considered are not captured, so future teams cannot understand why an approach was chosen"
    administrative_overhead:
      - "Reviewing meeting transcripts line by line to extract which statements were actual decisions"
      - "Cross-referencing new decisions against the existing decision log to detect conflicts"
      - "Drafting Architecture Decision Records with rationale, alternatives, and consequences for each significant choice"
      - "Tracking decision attribution when multiple participants claim or dispute ownership of a choice"
    scenarios:
      - problem: "Technical decisions are made in meetings but never documented, leaving no rationale trail"
        why: >
          When decisions go unrecorded, the team revisits the same choices months later with
          no memory of why the original path was chosen. Architecture drifts, onboarding new
          team members becomes slower, and conflicting implementations emerge across workstreams.
        agent: sa-decision-capture-agent
        agent_response: >
          Extracts decisions from meeting notes with exact attribution, classifies architecture
          impact using scope and reversibility dimensions, and generates ADRs for significant
          choices. Cross-references against the existing decision log to flag conflicts.
        success_signal:
          metric: "Technical decisions documented within 24h of the meeting"
          target: "100% of technical review and design session decisions captured with rationale"
          leading_indicator: "Decision log entries created automatically after each technical meeting"
          failure_signal: "Team revisits a decision that was already made because no record exists"
      - problem: "New decisions conflict with prior ADRs that no one remembers or reviews before committing"
        why: >
          Architecture coherence breaks down when each meeting makes decisions in isolation.
          A team selects a message broker that contradicts an existing integration pattern ADR,
          and the inconsistency surfaces only during implementation when it is expensive to fix.
        agent: sa-decision-capture-agent
        agent_response: >
          Automatically cross-references every extracted decision against the existing decision
          log and ADR repository. Flags conflicts with specific references to the contradicting
          record, so the SA can resolve the conflict before implementation begins.
        success_signal:
          metric: "Decision conflicts detected before implementation"
          target: "100% of new decisions checked against existing ADRs before finalization"
          leading_indicator: "Conflict alerts surface during the same meeting cycle as the new decision"
          failure_signal: "Architecture inconsistency discovered during implementation or code review"
      - problem: "Irreversible architecture choices get made without the right stakeholders in the room"
        why: >
          Technology selections, data model changes, and integration patterns that are costly or
          impossible to reverse get decided in meetings where only a subset of affected stakeholders
          are present. When the missing stakeholders learn of the decision later, they either accept
          a suboptimal choice or force an expensive reversal that delays the project.
        agent: sa-decision-capture-agent
        agent_response: >
          Classifies each extracted decision by reversibility (reversible, costly-to-reverse,
          irreversible) and cross-references the meeting attendees against the stakeholder map.
          Flags irreversible decisions where required stakeholders were absent, giving the SA
          the opportunity to validate the decision before it becomes permanent.
        success_signal:
          metric: "Irreversible decisions validated by required stakeholders"
          target: "100% of irreversible decisions have sign-off from all required stakeholders before finalization"
          leading_indicator: "Stakeholder gap alert raised within 24h of the meeting where the decision was made"
          failure_signal: "Irreversible decision reversed after implementation because a key stakeholder was not consulted"
      - problem: "Alternatives considered are not captured, so future teams cannot understand why an approach was chosen"
        why: >
          Without documented alternatives, future architects and engineers cannot distinguish
          between a deliberate choice and a default one. They waste time re-evaluating options
          that were already rejected for good reasons, or they avoid changing a decision that
          was actually a compromise made under time pressure rather than a principled selection.
        agent: sa-decision-capture-agent
        agent_response: >
          Extracts alternatives discussed during meetings and documents them alongside the chosen
          approach in each ADR. Captures the rationale for rejection of each alternative, including
          constraints, trade-offs, and context that informed the final choice, so future teams
          have the full decision landscape.
        success_signal:
          metric: "ADRs with documented alternatives and rejection rationale"
          target: "100% of ADRs for significant decisions include at least two alternatives with rejection rationale"
          leading_indicator: "New team members reference ADR alternatives section instead of re-proposing rejected approaches"
          failure_signal: "Team re-evaluates a previously rejected alternative because no record of the original analysis exists"
  escalation_triggers:
    - "Irreversible technical decision detected without stakeholder quorum"
    - "New decision conflicts with an existing Architecture Decision Record"
    - "Significant decision made without documented alternatives considered"
    - "Decision attribution unclear, multiple conflicting accounts of who decided"
  prompt_registry:
    sa-decision-capture-analyze:
      description: Extract raw decisions from meeting notes
      source: prompts/tasks.yaml#decision_capture.extract_decisions
      requires_data:
      - source: read-communications
        fields: [meeting_transcripts, discussion_threads]
        priority: critical
      - source: read-infohub
        fields: [decision_log]
        priority: enrichment
    sa-decision-capture-synthesize:
      description: Assess architecture impact of each decision
      source: prompts/tasks.yaml#decision_capture.decision_impact_analysis
      requires_data:
      - source: read-infohub
        fields: [architecture_summary, decision_log, risk_register]
        priority: critical
    sa-decision-capture-output:
      description: Generate ADRs for significant decisions
      source: prompts/tasks.yaml#decision_capture.adr_generation
      requires_data:
      - source: read-infohub
        fields: [existing_adrs, decision_log]
        priority: enrichment
  boundaries:
    - Decision capture and documentation only, does not make technical decisions
    - Does not conduct technical discovery or requirements gathering
    - Does not assess risk beyond decision impact classification
    - Does not override or reverse decisions without stakeholder authority
    - Does not attribute decisions without specific evidence

  permissions:
    - Read meeting notes and discussion content from communications
    - Read existing decision logs and ADRs from InfoHub
    - Create Architecture Decision Records when warranted
    - Classify decision impact and reversibility
    - Detect conflicts with existing documented decisions

  guardrails:
    input_validation:
    - rule: Decision capture requires meeting notes or discussion content
    - rule: Architecture impact requires current architecture context
    output_checks:
    - rule: Each decision has architecture impact assessment
    - rule: ADR recommendation provided for each decision (YES/NO with rationale)
    - rule: Alternatives documented for significant decisions
    signal_validation:
    - rule: Decision attribution must cite specific evidence
    - rule: Conflict detection must reference existing decision log entries
  knowledge:
    scope:
      domains: [decision-capture, architecture]
      archetypes: [enterprise, mid-market]
    references:
    - path: references/adr-framework.yaml
      description: ADR template, significance criteria, impact classification
    - path: references/architecture-patterns.yaml
      description: Deployment models, data architecture, integration approaches, scaling strategies
  error_handling:
    tool_failures:
      critical: [read-communications]
      enrichment: [read-infohub]
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  autonomy:
    triggers:
    - type: parent_dispatch
      source: sa-agent
      description: SA orchestrator routes decision capture requests
    - type: event
      source: meeting_ended
      condition: meeting.type IN [technical_review, architecture_workshop, design_session]
      description: Auto-activates after technical meetings to capture decisions
    outputs:
    - type: parent_return
      target: sa-agent
      payload: [technical_decisions, adrs, conflicts_detected]
      description: Decision log and ADRs back to SA orchestrator
    - type: notify_human
      condition: decision.reversibility == IRREVERSIBLE OR decision.conflicts_existing == true
      channel: alert
      description: Irreversible decisions and conflicts surface for SA review
    consumes_toolboxes:
    - toolbox: risk-intelligence
      agent: sa-risk-agent
      tools: [get-risk-register]
      reason: Risk context for decision impact assessment
    - toolbox: specialist-intelligence
      agent: specialist-agent
      tools: [get-specialist-findings]
      reason: Specialist findings inform architecture decisions
    dependencies: []
