# SA Agent Configuration
# Purpose: Maintain technical integrity & risk visibility

agent_id: "sa_agent"
team: "solution_architects"
category: "architecture"
purpose: "Maintain technical integrity & risk visibility"

core_functions:
  - "Detects tech risks"
  - "Connects decisions to architecture impact"
  - "Validates InfoHub completeness"
  - "Triggers specialists"

mechanics:
  - "Scans Slack/notes for tech signals"
  - "Flags anomalies"
  - "Derives risks from decisions"

inputs:
  - "Slack technical channels"
  - "Meeting notes"
  - "Decisions"
  - "Daily operation notes"

outputs:
  - "Risk notes"
  - "Technical decision logs"
  - "Architecture impact assessments"
  - "Client technical profiles"

escalation_to: "PM/Leadership"

skills:
  owned:
    - skill_id: "SK_SA_001"
      path: "skills/technical_discovery.yaml"
    - skill_id: "SK_SA_002"
      path: "skills/decision_capture.yaml"
    - skill_id: "SK_SA_007"
      path: "skills/demo_design.yaml"
    - skill_id: "SK_SA_008"
      path: "skills/value_narrative_construction.yaml"
    - skill_id: "SK_SA_009"
      path: "skills/stakeholder_communication_design.yaml"
    - skill_id: "SK_SA_010"
      path: "skills/industry_contextualization.yaml"
    - skill_id: "SK_SA_011"
      path: "skills/value_stream_facilitation.yaml"
    - skill_id: "SK_SA_012"
      path: "skills/technical_evaluation_design.yaml"
  imports:
    - skill_id: "SK_GOV_002"
      from: "governance"
      usage: "Raw decision extraction for technical framing"

# Playbook Integration
playbooks:
  owned:
    - "PB_SA_001"  # ADR
    - "PB_SA_006"  # Technical Demo Preparation
    - "PB_SA_007"  # Customer Journey Mapping
    - "PB_SA_008"  # InfoHub Health Review
    - "PB_SA_009"  # Technical Value Narrative
    - "PB_SA_010"  # Architecture Communication Plan
    - "PB_SA_011"  # Value Stream Mapping
    - "PB_SA_012"  # Technical Evaluation Execution
    - "PB_SA_013"  # SA Engagement Qualification
    - "PB_SA_014"  # Technical Discovery
    - "PB_SA_015"  # Solution Fit Assessment
    - "PB_SA_016"  # Office Hours with Enterprise Clients
    - "PB_STR_004"  # SWOT Analysis (coordinates cross-functional)
    - "PB_STR_006"  # Decision Tree Analysis
    - "PB_STR_204"  # Risk Heat Map
  contributes_to:
    - "PB_STR_001"  # Three Horizons - technical feasibility
    - "PB_CA_001"  # Customer QBR - technical content and recommendations
    - "PB_STR_005"  # PESTLE Analysis - technical dimensions
    - "PB_VE_001"  # Value Engineering - technical validation
    - "PB_CA_007"  # Customer Health - technical health signals
    - "PB_AE_003"  # Sales QBR - technical win themes and SA resource planning
    - "PB_CI_001"  # Five Forces - technical competitive positioning

# Execution Configuration
execution:
  trigger_sources:
    - "slack_technical_channels"
    - "infohub_updates"
    - "meeting_notes"
  output_destination: "{realm}/{node}/internal-infohub/risks/"
  escalation_threshold: "high_severity_risk"

personality_file: "teams/solution_architects/personalities/sa_personality.yaml"
prompts_dir: "teams/solution_architects/prompts"
