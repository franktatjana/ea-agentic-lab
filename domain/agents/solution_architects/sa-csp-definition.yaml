agentspec_version: 26.1.0
component_type: Agent
id: sa-csp-agent
name: SA Customer Success Plan Agent
description: 'Manages the Customer Success Plan lifecycle from initiation at Stage 2 through technical evaluation, adoption planning, finalization, and handoff to Customer Architect at deal close. Ensures
  every qualifying deal has a structured path from purchase to value realization.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: sa-agent
  tags:
  - csp
  - customer-success
  - adoption
  - handoff
  responsibility: Build and maintain Customer Success Plans that bridge pre-sales to post-sales
system_prompt: 'You are a Customer Success Plan Agent, part of the Solution Architect intelligence

  system. Your job is to build success plans that survive the handoff.


  You MUST:

  - Initiate CSP when opportunity enters Stage 2 with ARR > $100K

  - Include technical evaluation plan with measurable milestones

  - Define phased adoption plan aligned to customer timeline

  - Prepare for customer presentation with executive-appropriate language

  - Prepare handoff package for CA with full context (no information loss)


  You MUST NOT:

  - Create CSPs for deals below $100K ARR (unless explicitly requested)

  - Promise capabilities not validated during evaluation

  - Skip adoption phasing (big-bang rollouts fail)

  - Hand off without confirming CA availability and readiness


  When uncertain about timeline or scope: document assumptions,

  flag for customer validation in next meeting.


  Tone: structured, outcome-focused, customer-ready.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-crm-data
  name: Read CRM Data
  description: 'Access CRM opportunity data: stage, ARR, close date, and activity history. Used for CSP initiation triggers and milestone tracking.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: fields
    type: string
  outputs:
  - title: crm_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: CRM unavailable, cannot proceed with pipeline data
    - error_code: RECORD_NOT_FOUND
      guidance: Record not found in CRM, verify identifiers with user
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks, decisions, stakeholders, competitive, governance, value, journey, opportunities,
    context, or frameworks.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map), industry (profile, regulatory, trends), market (news digest), technology (current
    map, vendor landscape).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: write-sa-artifact
  name: Write Solution Artifact
  description: Save CSP documents and handoff packages to InfoHub
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from solution architect
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: csp-intelligence
  name: CSP Intelligence
  description: Customer Success Plan data available to peer agents
  tools:
  - id: get-csp-status
    name: Get CSP Status
    description: Returns current CSP status, milestones, and readiness for an account
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: csp_status
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: customer-success-plan
  name: Customer Success Plan
  playbook_refs:
  - PB_SA_005
  - PB_SA_007
  - PB_SA_012
  description: Full CSP lifecycle from initiation through handoff to Customer Architect
  inputs:
  - title: account_name
    type: string
  - title: opportunity_name
    type: string
  - title: opportunity_arr
    type: string
  - title: discovery_summary
    type: string
  - title: ca_name
    type: string
  outputs:
  - title: customer_success_plan_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: sa-initiate-csp
      input: opportunity_name, account_name, opportunity_arr, discovery_summary
      description: Start CSP when opportunity enters Stage 2 with ARR > $100K
      on_failure: stop
    - step: 2
      prompt: sa-develop-csp-technical
      input: account_name, outcomes, technical_findings, vendor
      description: Add technical evaluation plan to CSP
      on_failure: stop
    - step: 3
      prompt: sa-develop-csp-adoption
      input: account_name, use_cases, timeline
      description: Define phased adoption plan in CSP
      on_failure: stop
    - step: 4
      prompt: sa-finalize-csp
      input: account_name, csp_summary, eval_status
      description: Complete CSP and prepare for customer presentation
      on_failure: stop
    - step: 5
      prompt: sa-csp-handoff-prep
      input: account_name, csp_link, ca_name
      description: Prepare CSP handoff from SA to CA at deal close
      on_failure: stop
    - step: 6
      action: persist
      tools:
      - write-sa-artifact
      description: Save CSP and handoff package to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - csp-initiation
    - csp-development
    - csp-handoff
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'Success plans require customer buy-in that only comes from human relationships. The SA negotiates milestones, resolves conflicting stakeholder expectations, and makes judgment
      calls on phasing that balance ambition with realism. The agent structures the plan, but the SA earns the commitment to follow it.

      '
    challenges:
    - text: Qualifying deals reach Stage 2 without a structured path from purchase to value realization
      specific_overhead:
      - Manually assembling CSP documents from discovery notes, CRM data, and meeting summaries
    - text: Handoff to Customer Architect loses critical context because no standard package exists
      specific_overhead:
      - Reformatting technical evaluation plans into executive-appropriate language for customer presentations
    - text: Adoption plans default to big-bang rollouts because phased alternatives are not documented
      specific_overhead:
      - Tracking milestone completion across multiple stakeholders and updating the CSP accordingly
    - text: Evaluation milestones are vague, making it impossible to track whether the customer is on track
      specific_overhead:
      - Compiling handoff packages for the Customer Architect with all relevant context from the deal cycle
    administrative_overhead:
    - Manually assembling CSP documents from discovery notes, CRM data, and meeting summaries
    - Reformatting technical evaluation plans into executive-appropriate language for customer presentations
    - Tracking milestone completion across multiple stakeholders and updating the CSP accordingly
    - Compiling handoff packages for the Customer Architect with all relevant context from the deal cycle
    scenarios:
    - problem: Qualifying deals reach Stage 2 without a structured path from purchase to value realization
      why: 'Without a customer success plan initiated early, the evaluation becomes reactive. Milestones are unclear, adoption phasing is improvised after close, and the customer''s first experience post-purchase
        sets a negative tone that takes months to recover from.

        '
      agent: sa-csp-agent
      agent_response: 'Auto-initiates a CSP when the opportunity enters Stage 2 with ARR above $100K. Pulls discovery findings, stakeholder map, and CRM data to build a structured plan with technical evaluation
        milestones and phased adoption targets aligned to the customer timeline.

        '
      success_signal:
        metric: CSP initiated for qualifying deals at Stage 2
        target: 100% of deals with ARR > $100K have a CSP by end of Stage 2
        leading_indicator: CSP draft available within 48h of stage change
        failure_signal: Deal closes without a documented success plan or adoption phases
    - problem: Handoff to Customer Architect loses critical context because no standard package exists
      why: 'When the SA hands off to a CA without a structured package, the CA starts from scratch. They re-ask questions the customer already answered, miss known risks, and repeat mistakes the SA already
        identified. The customer experiences this as organizational amnesia.

        '
      agent: sa-csp-agent
      agent_response: 'Prepares a structured handoff package that includes the full CSP, risk register, stakeholder map, evaluation results, and open items. Verifies CA availability and runs a completeness
        check to ensure no critical context is missing before handoff.

        '
      success_signal:
        metric: Handoff packages pass completeness check
        target: 100% of handoffs include CSP, risks, stakeholders, and open items
        leading_indicator: CA confirms they have sufficient context without requesting additional meetings
        failure_signal: CA schedules re-discovery meetings with the customer to fill context gaps
    - problem: Adoption plans default to big-bang rollouts because phased alternatives are not documented
      why: 'Big-bang rollouts concentrate risk into a single go-live event where everything must work simultaneously. When phased adoption alternatives are not pre-built into the CSP, the team defaults
        to the simplest plan, and post-purchase failures cascade across all user groups at once instead of being contained within a manageable pilot.

        '
      agent: sa-csp-agent
      agent_response: 'Builds phased adoption plans as a mandatory section of every CSP, aligned to customer timeline and use case priority. Defines rollout waves with user group scope, success criteria
        per phase, and go/no-go gates that prevent progression until the previous phase is validated.

        '
      success_signal:
        metric: CSPs with phased adoption plans
        target: 100% of CSPs include at least two adoption phases with defined go/no-go criteria
        leading_indicator: Adoption plan reviewed and accepted by customer before deal close
        failure_signal: Customer attempts a single-phase rollout because no phased alternative was documented
    - problem: Evaluation milestones are vague, making it impossible to track whether the customer is on track
      why: 'Vague milestones like "complete evaluation" or "validate integration" give neither the SA nor the customer a way to measure progress. The evaluation drifts without accountability, stakeholders
        cannot report status to leadership, and deals stall because no one can confirm whether the technical evaluation is succeeding or failing.

        '
      agent: sa-csp-agent
      agent_response: 'Defines measurable evaluation milestones with specific completion criteria, target dates, and responsible owners. Each milestone includes what "done" looks like in concrete terms
        so the SA and customer can objectively assess whether the evaluation is on track and intervene early when milestones slip.

        '
      success_signal:
        metric: Evaluation milestones with measurable completion criteria
        target: 100% of CSP evaluation milestones have specific criteria, target date, and owner
        leading_indicator: Milestone progress is trackable at weekly cadence without requiring ad hoc status meetings
        failure_signal: Evaluation timeline slips by 2+ weeks with no milestone data to explain why
  escalation_triggers:
  - CSP handoff blocked because CA is unavailable or unassigned
  - Customer rejects proposed adoption milestones or timeline
  - Evaluation results don't support capabilities promised during sales
  - Blocker detected that prevents CSP finalization before deal close
  prompt_registry:
    sa-initiate-csp:
      description: Start CSP when opportunity enters Stage 2
      source: prompts/tasks.yaml#customer_success_plan.initiate_csp
      inputs:
      - title: opportunity_name
        type: string
      - title: account_name
        type: string
      - title: opportunity_arr
        type: number
      - title: discovery_summary
        type: string
      outputs:
      - title: csp_initial
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - opportunity_stage
        - arr
        - close_date
        - activity_history
        priority: critical
      - source: read-infohub
        fields:
        - stakeholder_map
        - discovery_summary
        - account_context
        priority: critical
    sa-develop-csp-technical:
      description: Add technical evaluation plan to CSP
      source: prompts/tasks.yaml#customer_success_plan.develop_csp_technical
      inputs:
      - title: account_name
        type: string
      - title: outcomes
        type: string
      - title: technical_findings
        type: string
      - title: vendor
        type: string
      outputs:
      - title: csp_technical_plan
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - technical_findings
        - vendor_landscape
        - evaluation_criteria
        priority: critical
      - source: read-intelligence
        fields:
        - technology_current_map
        - vendor_landscape
        priority: enrichment
    sa-develop-csp-adoption:
      description: Define phased adoption plan in CSP
      source: prompts/tasks.yaml#customer_success_plan.develop_csp_adoption
      inputs:
      - title: account_name
        type: string
      - title: use_cases
        type: array
      - title: timeline
        type: string
      outputs:
      - title: csp_adoption_plan
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - use_cases
        - customer_timeline
        - journey_context
        priority: critical
      - source: read-intelligence
        fields:
        - industry_profile
        - regulatory_requirements
        priority: enrichment
    sa-finalize-csp:
      description: Complete CSP and prepare for presentation
      source: prompts/tasks.yaml#customer_success_plan.finalize_csp
      inputs:
      - title: account_name
        type: string
      - title: csp_summary
        type: string
      - title: eval_status
        type: string
      outputs:
      - title: csp_finalized
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - csp_draft
        - evaluation_status
        - stakeholder_map
        priority: critical
      - source: read-crm-data
        fields:
        - opportunity_stage
        - close_date
        priority: enrichment
    sa-csp-handoff-prep:
      description: Prepare CSP handoff from SA to CA
      source: prompts/tasks.yaml#customer_success_plan.csp_handoff_prep
      inputs:
      - title: account_name
        type: string
      - title: csp_link
        type: string
      - title: ca_name
        type: string
      outputs:
      - title: handoff_package
        type: object
      requires_data:
      - source: read-infohub
        fields:
        - csp_final
        - risk_register
        - stakeholder_map
        - open_items
        priority: critical
      - source: read-crm-data
        fields:
        - opportunity_stage
        - close_date
        - activity_history
        priority: critical
  boundaries:
  - Customer success planning only, does not conduct technical discovery
  - Does not assess technical risk or architecture health independently
  - Does not promise capabilities not validated during evaluation
  - Does not assign Customer Architects or manage post-sale delivery
  - Does not negotiate milestones directly with customers
  permissions:
  - Read opportunity data and stage progression from CRM
  - Read discovery findings and requirements from InfoHub
  - Create and update customer success plans with phased milestones
  - Track CSP lifecycle from initiation through handoff
  - Prepare handoff packages for Customer Architect transition
  guardrails:
    input_validation:
    - rule: CSP initiation requires opportunity ARR and stage data
    - rule: Technical plan requires validated discovery findings
    output_checks:
    - rule: Adoption plan includes phased rollout with milestones
    - rule: Handoff package includes all context needed by CA
    - rule: No capabilities promised that were not validated during evaluation
    signal_validation:
    - rule: Stage progression must reference CRM data
    - rule: ARR threshold must be verified before CSP initiation
  knowledge:
    scope:
      domains:
      - customer-success
      - adoption
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/best-practices-framework.yaml
      description: Best practice template structure, quality criteria, update triggers
    - path: references/infohub-validation.yaml
      description: Completeness Checks, Staleness Thresholds
  error_handling:
    tool_failures:
      critical:
      - read-crm-data
      - read-infohub
      enrichment:
      - read-intelligence
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  autonomy:
    triggers:
    - type: parent_dispatch
      source: sa-agent
      description: SA orchestrator routes CSP lifecycle requests
    - type: event
      source: crm_webhook
      condition: opportunity.stage == STAGE_2 AND opportunity.arr >= 100000
      description: Auto-initiates CSP when qualifying deal reaches Stage 2
    - type: downstream
      source: poc-agent
      condition: poc.outcome == SUCCESS
      payload:
      - poc_results
      - customer_requirements
      description: Successful POC triggers CSP technical plan development
    outputs:
    - type: parent_return
      target: sa-agent
      payload:
      - csp_status
      - adoption_plan
      - handoff_readiness
      description: CSP status and readiness back to SA orchestrator
    - type: notify_human
      condition: csp.handoff_ready == true OR csp.blocker_detected == true
      channel: alert
      description: Handoff readiness and blockers surface for SA review
    consumes_toolboxes:
    - toolbox: discovery-intelligence
      agent: sa-discovery-agent
      tools:
      - get-discovery-summary
      - get-stakeholder-map
      reason: Discovery findings seed CSP content and milestones
    - toolbox: journey-intelligence
      agent: sa-journey-agent
      tools:
      - get-journey-map
      reason: Journey context enriches adoption planning
    - toolbox: poc-intelligence
      agent: poc-agent
      tools:
      - get-poc-results
      reason: POC outcomes feed into technical evaluation section
    dependencies: []
