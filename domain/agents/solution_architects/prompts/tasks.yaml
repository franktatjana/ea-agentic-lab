      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: FEEDBACK EXTRACTION
      Extract feedback from the interaction.
      For each feedback item:
      - Feedback content (verbatim quote where possible, paraphrase if not)
      - Speaker (name and role)
      - Feedback type: explicit (directly stated) / implicit (behavioral signal)
      - Topic: product / service / relationship / process / pricing / competition
        Assign primary topic. Add secondary flags if applicable.
      - Confidence: HIGH (verbatim quote), MEDIUM (close paraphrase),
        LOW (interpretation of behavior)
      If {interaction_notes} is empty: state "No interaction notes provided.
      Cannot extract feedback." DEFER.
      Deliverable: Feedback extraction table (Content | Speaker | Type |
      Topic | Secondary Flags | Confidence).

      STEP 2: SENTIMENT CLASSIFICATION
      Classify sentiment for each feedback item.
      For each item:
      - Feedback reference
      - Sentiment: positive / neutral / negative
      - Intensity: strong / moderate / mild
      - Sentiment basis (what signals indicate this classification)
      - Impact on overall engagement sentiment
      - Confidence: HIGH (clear signals), MEDIUM (mixed signals), LOW (ambiguous)
      Deliverable: Sentiment classification table (Feedback | Sentiment |
      Intensity | Basis | Engagement Impact | Confidence).

      STEP 3: FOLLOW-UP ASSESSMENT
      Determine if follow-up is needed.
      For each feedback item requiring follow-up:
      - Feedback reference
      - Follow-up action required
      - Owner
      - Priority: immediate / this_week / this_sprint
      - Prerequisites
      - Consequence if not addressed
      If no follow-up needed: state "No follow-up actions required from
      this interaction."
      Deliverable: Follow-up table (Feedback | Action | Owner | Priority |
      Prerequisites | Consequence).

      STEP 4: JOURNEY MAP UPDATE
      Determine journey map updates.
      - Touchpoint to add (date, type, outcome, sentiment)
      - Stakeholder sentiment updates
        For each sentiment update: field path | old value | new value | evidence
      - Sentiment trend update: requires two+ data points. If this is the
        second+ touchpoint for a stakeholder, update trend. If first: "BASELINE
        ESTABLISHED."
      - New friction points to add (if any)
      - Journey stage progression (if applicable)
      Deliverable: Journey map update specification with field-level state
      changes (Field | Previous | Updated | Evidence).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Verbatim quotes used where available
      - Sentiment classifications include basis
      - Follow-up actions include consequence if not addressed
      - Journey map updates specify field-level state changes
      - Sentiment trends require two data points (enforced)
      - Feedback topics include secondary flags where applicable
      - Confidence levels stated with basis throughout
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, feedback
        summary, and journey map update.
      - If run_mode is DISCOVERY: produce only feedback capture framework
        and classification approach.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) feedback volume and overall
      sentiment from this interaction, (2) the most significant feedback
      item or sentiment shift, and (3) the single most urgent follow-up
      action.
