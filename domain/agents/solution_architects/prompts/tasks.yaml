# SA Agent Task Prompts
# Purpose: Full runbook prompts with numbered steps, named deliverables, and quality checks
# Reference: Personality defined in personalities/sa_personality.yaml
# Standard: docs/architecture/playbooks/runbook-design-principles.md

# ============================================================================
# TECHNICAL DISCOVERY FRAMEWORK
# Based on industry SA best practices
# ============================================================================
technical_discovery:

  discovery_preparation:
    name: "Technical Discovery Preparation"
    description: "Prepare for technical discovery meeting by researching the account, forming use case hypotheses, and building a structured question set across business, technical, stakeholder, and timeline dimensions"
    prompt: |
      Context: Upcoming discovery meeting with {account_name}.
      Meeting date: {meeting_date}
      Attendees: {attendees}
      Known context: {known_context}
      InfoHub data: {infohub_data}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + top 5 questions; DISCOVERY = question framework only. Default: FULL)

      You are preparing for a technical discovery meeting. Preparation quality
      directly determines discovery depth. Every question must be traceable to
      a knowledge gap, and every hypothesis must state its evidence basis.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: COMPANY RESEARCH
      Research the company using available data.
      For each finding:
      - Data point (industry, revenue, recent news, known tech stack)
      - Source (InfoHub, public, CRM, prior interactions)
      - Recency (date of information)
      - Confidence: HIGH (verified source, <90 days old), MEDIUM (single source
        or 90-180 days old), LOW (inferred or >180 days old)
      If {known_context} is empty: state that no prior context exists, note that
      all research will rely on public sources, proceed without fabrication.
      Deliverable: Company research table (Data Point | Value | Source | Recency |
      Confidence).

      STEP 2: USE CASE HYPOTHESIS FORMATION
      Based on industry and company research, form use case hypotheses.
      For each hypothesis:
      - Use case name
      - Industry basis (why this is common in their industry)
      - Evidence from research (what signals support this)
      - Confidence: HIGH (multiple corroborating signals), MEDIUM (industry
        pattern with some company evidence), LOW (industry pattern only,
        no company-specific evidence)
      - Validation questions (what to ask to confirm or reject)
      Deliverable: Use case hypothesis table (Use Case | Industry Basis |
      Evidence | Confidence | Validation Questions).

      STEP 3: DISCOVERY QUESTION SET
      Build structured discovery questions organized by dimension.
      For each question:
      - Question text
      - Dimension: business_outcomes / current_state / requirements /
        stakeholders / timeline
      - Purpose (what gap this question fills)
      - Follow-up triggers (what answers would prompt deeper probing)
      Target: 5 business outcomes, 5 current state, 5 requirements,
      3 stakeholder, 3 timeline questions minimum.
      Deliverable: Discovery question matrix (Dimension | Question | Purpose |
      Follow-Up Triggers).

      STEP 4: RED FLAG CHECKLIST
      Identify signals to watch for during the meeting that indicate risk.
      For each red flag:
      - Signal description
      - What it indicates
      - Recommended response if observed
      Deliverable: Red flag checklist (Signal | Indicates | Response).

      STEP 5: PRIOR INTERACTION SUMMARY
      Summarize any prior interactions from InfoHub.
      - Interaction date, type, attendees, key outcomes
      - Open items from prior interactions
      - Commitments made
      If {infohub_data} is empty: state "No prior interactions on record.
      This is a first engagement." Proceed without fabrication.
      Deliverable: Prior interaction summary table (Date | Type | Attendees |
      Outcomes | Open Items) or empty-state declaration.

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every use case hypothesis states its evidence basis and confidence
      - Every question traces to a specific knowledge gap
      - Red flags include recommended responses, not just warnings
      - Prior interaction summary includes open items, not just dates
      - No fabricated company data: if unknown, state it
      - Executive summary is self-sufficient: a reader can act on it without
        reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, top 5
        priority questions, and highest-confidence use case hypothesis.
      - If run_mode is DISCOVERY: produce only the discovery question matrix
        and red flag checklist.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) overall preparation readiness
      and data confidence, (2) the weakest point or biggest knowledge gap
      going into the meeting, and (3) the single most important question to
      get answered.

  business_outcomes_discovery:
    name: "Business Outcomes Discovery"
    description: "Extract, classify, and prioritize business outcomes from customer statements, linking each to measurable success criteria, cost of inaction, and outcome owners"
    prompt: |
      Context: Discovery session with {account_name}.
      Customer statements: {customer_statements}
      Industry context: {industry_context}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + top 3 outcomes; DISCOVERY = outcome hypothesis framework only. Default: FULL)

      You are extracting business outcomes from customer statements. Outcomes
      must be specific and measurable, not vague aspirations. Each outcome needs
      an owner and a cost of inaction to establish urgency. Follow these steps
      in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: STATEMENT EXTRACTION
      Extract explicit business outcome statements from customer input.
      For each statement:
      - Verbatim quote or close paraphrase
      - Speaker (if identifiable)
      - Outcome category: revenue_growth / cost_reduction / risk_mitigation /
        operational_efficiency / compliance / innovation
        Assign one primary category for routing. Add secondary flags where the
        statement spans multiple categories.
      - Specificity: HIGH (includes numbers or timelines), MEDIUM (directional
        but not quantified), LOW (vague aspiration)
      If {customer_statements} is empty: state "No customer statements provided.
      Cannot extract outcomes." Proceed to hypothesis step only.
      Deliverable: Statement extraction table (Quote | Speaker | Category |
      Secondary Flags | Specificity).

      STEP 2: OUTCOME FORMULATION
      Convert extracted statements into structured business outcomes.
      For each outcome:
      - Outcome statement (specific, measurable where possible)
      - Success metric (how will achievement be measured)
      - Metric target (specific number or range if stated, "TBD" if not)
      - Measurement method (how to track the metric)
      - Priority: critical / important / desirable
      - Confidence: HIGH (customer explicitly stated metric), MEDIUM (metric
        inferred from context), LOW (metric assumed from industry norms)
      Deliverable: Business outcome table (Outcome | Success Metric | Target |
      Measurement | Priority | Confidence).

      STEP 3: COST OF INACTION ANALYSIS
      For each business outcome, assess cost of inaction.
      - Financial impact (quantified if possible, range acceptable)
      - Operational impact (what degrades or fails)
      - Competitive impact (market position risk)
      - Timeline pressure (when does inaction become critical)
      - Confidence: HIGH (customer provided data), MEDIUM (estimated from
        industry benchmarks), LOW (rough approximation)
      - Data basis: state what the estimate is based on
      If quantification data is insufficient: state "Cost of inaction cannot
      be quantified with available data. Qualitative assessment provided."
      Deliverable: Cost of inaction table (Outcome | Financial Impact |
      Operational Impact | Competitive Impact | Timeline | Confidence | Basis).

      STEP 4: OUTCOME OWNERSHIP MAPPING
      Map each outcome to stakeholder owners.
      - Outcome name
      - Primary owner (name and title if known)
      - Secondary stakeholders
      - Budget authority (who controls funding)
      If stakeholder data is sparse: note "Stakeholder mapping incomplete,
      requires follow-up discovery."
      Deliverable: Ownership table (Outcome | Primary Owner | Secondary
      Stakeholders | Budget Authority).

      STEP 5: FOLLOW-UP QUESTIONS
      Identify gaps in outcome understanding that need follow-up.
      - Question text
      - Target stakeholder
      - Purpose (what gap it fills)
      - Priority: HIGH (blocks solution design) / MEDIUM (improves accuracy) /
        LOW (nice to have)
      Deliverable: Follow-up questions table (Question | Target | Purpose |
      Priority).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every outcome is specific and measurable (no vague aspirations accepted)
      - Every outcome has a success metric and confidence level
      - Cost of inaction states its data basis for every estimate
      - Outcome categories include secondary flags where applicable
      - Stakeholder gaps explicitly noted, not silently omitted
      - Trend claims require two data points: single observation = INSUFFICIENT
        DATA FOR TREND
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, top 3 prioritized
        outcomes, and highest-priority follow-up question.
      - If run_mode is DISCOVERY: produce only the follow-up questions framework
        and outcome hypothesis list.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) number of outcomes extracted
      and overall confidence profile, (2) the weakest point or least-supported
      outcome, and (3) the single most urgent follow-up action.

  current_state_discovery:
    name: "Current State Discovery"
    description: "Map the customer's current technology environment including tools, architecture, data flows, pain points, and gaps, producing a structured current-state baseline"
    prompt: |
      Context: Discovery session with {account_name}.
      Customer environment info: {environment_info}
      Industry context: {industry_context}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + top pain points; DISCOVERY = assessment framework only. Default: FULL)

      You are mapping the customer's current technology state. This baseline
      is the foundation for gap analysis and solution design. Every tool and
      system must be documented with its purpose and pain points. Architecture
      descriptions must distinguish fact from inference. Follow these steps
      in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: TECHNOLOGY INVENTORY
      Catalog all tools and systems mentioned or inferred.
      For each technology:
      - Tool or system name
      - Category: infrastructure / data_platform / application / security /
        monitoring / integration / other
        Assign one primary category. Add secondary flags where the tool spans
        categories.
      - Purpose (what it does for the customer)
      - Pain points (specific issues mentioned)
      - Scale indicators (users, data volume, transactions if known)
      - Confidence: HIGH (customer explicitly confirmed), MEDIUM (mentioned
        in passing), LOW (inferred from context)
      If {environment_info} is empty: state "No environment information provided.
      Technology inventory cannot be built from available data." Proceed to
      produce discovery questions framework only.
      Deliverable: Technology inventory table (Tool | Category | Secondary Flags |
      Purpose | Pain Points | Scale | Confidence).

      STEP 2: ARCHITECTURE SUMMARY
      Describe the current architecture based on discovered information.
      - Architecture style (monolithic, microservices, hybrid, unknown)
      - Deployment model (on-premise, cloud, hybrid, multi-cloud)
      - Key integration patterns
      - Data flow description (sources, processing, destinations)
      - Confidence: HIGH (customer provided architecture diagrams or detailed
        walkthrough), MEDIUM (described verbally), LOW (inferred from tool list)
      If architecture details are sparse: state "Architecture details are
      insufficient for a complete description. The following is based on
      {basis}." Clearly separate confirmed facts from inferences.
      Deliverable: Architecture summary (Style | Deployment | Integrations |
      Data Flow | Confidence | Basis).

      STEP 3: PAIN POINT ANALYSIS
      Consolidate and prioritize pain points with business impact.
      For each pain point:
      - Description
      - Affected systems
      - Business impact (quantified if possible)
      - Frequency (constant, intermittent, event-driven)
      - Severity: critical / high / medium / low
      - Confidence: HIGH (customer quantified impact), MEDIUM (customer
        described impact qualitatively), LOW (inferred from context)
      Deliverable: Pain point table (Pain Point | Affected Systems | Business
      Impact | Frequency | Severity | Confidence).

      STEP 4: GAP ANALYSIS
      Identify gaps between current state and desired state.
      For each gap:
      - Current state
      - Desired state (if articulated by customer)
      - Gap description
      - Impact of gap persisting
      - Prerequisites to close gap
      If desired state is not articulated: state "Desired state not yet defined
      by customer. Gap is inferred from pain points."
      Deliverable: Gap analysis table (Current | Desired | Gap | Impact |
      Prerequisites).

      STEP 5: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - New technology inventory entries
      - Architecture baseline established or updated
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every tool in inventory has purpose and confidence level
      - Architecture summary separates confirmed facts from inferences
      - Pain points include business impact, not just technical description
      - Gap analysis includes prerequisites column
      - Empty states handled explicitly (no silent omissions)
      - Account state delta references specific evidence for each field change
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, top 3 pain
        points, and most critical gap.
      - If run_mode is DISCOVERY: produce only the technology inventory
        framework and discovery questions to fill gaps.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) technology landscape scope
      and overall confidence in the baseline, (2) the weakest point or
      least-understood area of the current state, and (3) the single most
      urgent discovery action to improve the baseline.

  requirements_discovery:
    name: "Requirements Discovery"
    description: "Capture, classify, and prioritize technical and business requirements from discovery sessions, producing a structured requirements matrix with scale, compliance, and integration dimensions"
    prompt: |
      Context: Discovery session with {account_name}.
      Customer requirements discussed: {requirements_discussed}
      Business outcomes: {business_outcomes}
      Current state: {current_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + must-haves only; DISCOVERY = requirements framework only. Default: FULL)

      You are structuring requirements from a discovery session. Requirements
      must be linked to business outcomes and prioritized with clear criteria.
      Every requirement needs a rationale, not just a label. Follow these steps
      in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: REQUIREMENT EXTRACTION
      Extract requirements from customer discussion.
      For each requirement:
      - Requirement statement
      - Category: functional / non_functional / integration / compliance / scale
        Assign one primary category. Add secondary flags where the requirement
        spans categories (e.g., a compliance requirement with scale implications).
      - Source (who stated it, verbatim if possible)
      - Linked business outcome (which outcome this supports)
      - Confidence: HIGH (explicitly stated by decision-maker), MEDIUM (stated
        by technical evaluator), LOW (inferred from discussion)
      If {requirements_discussed} is empty: state "No requirements captured.
      This runbook cannot proceed without requirement input." DEFER.
      Deliverable: Requirement extraction table (Requirement | Category |
      Secondary Flags | Source | Linked Outcome | Confidence).

      STEP 2: PRIORITIZATION
      Prioritize each requirement using MoSCoW method.
      For each requirement:
      - Priority: Must / Should / Could / Won't (this phase)
      - Rationale for priority assignment
      - Dependencies (other requirements that must be met first)
      - Prerequisites for implementation
      - Confidence: HIGH (customer confirmed priority), MEDIUM (SA assessment
        based on business outcome alignment), LOW (assumed from industry norms)
      Deliverable: Prioritized requirements matrix (Requirement | Priority |
      Rationale | Dependencies | Prerequisites | Confidence).

      STEP 3: SCALE REQUIREMENTS
      Document scale-specific requirements.
      - Current volume metrics (users, data, transactions)
      - Target volume metrics (with timeline)
      - Growth rate (if two+ data points available; if single data point, state
        "INSUFFICIENT DATA FOR TREND, single observation only")
      - Peak vs average patterns
      - Confidence: HIGH (customer provided metrics), MEDIUM (estimated from
        industry benchmarks), LOW (rough approximation)
      Deliverable: Scale requirements summary (Metric | Current | Target |
      Timeline | Growth | Confidence | Basis).

      STEP 4: COMPLIANCE REQUIREMENTS
      Document compliance and regulatory requirements.
      - Regulation or standard name
      - Specific requirement
      - Current compliance status: compliant / partial / non_compliant / unknown
      - Impact on solution design
      - Prerequisites to achieve compliance
      If no compliance requirements are identified: state "No compliance
      requirements identified in this session. Confirm with legal/compliance
      stakeholders."
      Deliverable: Compliance checklist (Regulation | Requirement | Current
      Status | Design Impact | Prerequisites).

      STEP 5: INTEGRATION REQUIREMENTS
      Document integration needs.
      - System to integrate with
      - Integration type: API / batch / streaming / file / manual
        Assign primary type. Add secondary flags if multiple patterns needed.
      - Data exchanged
      - Volume and frequency
      - Current integration status: exists / planned / conceptual
      - Prerequisites for integration
      Deliverable: Integration requirements table (System | Type | Secondary
      Flags | Data | Volume | Frequency | Status | Prerequisites).

      STEP 6: SIZING INPUTS
      Capture inputs needed for solution sizing.
      - Sizing dimension (compute, storage, network, licenses)
      - Known value or range
      - Source of estimate
      - Confidence: HIGH / MEDIUM / LOW with basis
      Deliverable: Sizing inputs table (Dimension | Value | Source | Confidence |
      Basis).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every requirement links to a business outcome
      - Priority assignments include rationale, not just labels
      - Scale requirements distinguish confirmed metrics from estimates
      - Compliance section addressed or explicitly noted as unconfirmed
      - Integration requirements include prerequisites column
      - Trend claims (growth rates) require two data points
      - Confidence levels stated with basis for every item
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, Must-priority
        requirements, and critical sizing inputs.
      - If run_mode is DISCOVERY: produce only the requirements framework
        and discovery questions to fill gaps.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) total requirements captured
      and priority distribution, (2) the weakest point or least-defined
      requirement area, and (3) the single most urgent clarification needed.

  stakeholder_discovery:
    name: "Stakeholder Discovery"
    description: "Map the stakeholder landscape including decision makers, technical evaluators, end users, and potential blockers, producing an engagement plan per stakeholder"
    prompt: |
      Context: Discovery for {account_name}.
      Known stakeholders: {known_stakeholders}
      Opportunity context: {opportunity_context}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + influence matrix; DISCOVERY = stakeholder identification framework only. Default: FULL)

      You are mapping the stakeholder landscape for a technical engagement.
      Stakeholder mapping determines engagement strategy and risk mitigation.
      Every stakeholder must have a classified role and stance assessment with
      evidence basis. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: STAKEHOLDER IDENTIFICATION
      Identify all stakeholders from available data.
      For each stakeholder:
      - Name and title
      - Role classification: decision_maker / technical_evaluator / end_user /
        influencer / blocker / champion
        Assign one primary role. Add secondary flags where the person serves
        multiple roles (e.g., technical evaluator who is also a blocker).
      - Department or team
      - Relationship to the opportunity
      - Confidence: HIGH (met in person or confirmed by sponsor), MEDIUM
        (identified from org chart or email), LOW (inferred from role)
      If {known_stakeholders} is empty: state "No stakeholders identified.
      Stakeholder discovery is the first priority." Proceed to produce
      identification framework only.
      Deliverable: Stakeholder table (Name | Title | Role | Secondary Flags |
      Department | Relationship | Confidence).

      STEP 2: INFLUENCE AND INTEREST ASSESSMENT
      Assess each stakeholder's influence and interest level.
      For each stakeholder:
      - Influence level: HIGH / MEDIUM / LOW
      - Influence basis (what gives them influence: budget, technical authority,
        organizational position)
      - Interest level: HIGH / MEDIUM / LOW
      - Interest basis (why they care: pain points, career goals, mandate)
      - Stance: champion / supporter / neutral / skeptic / opponent
      - Stance evidence (what behavior or statements indicate this stance)
      - Confidence: HIGH (direct observation), MEDIUM (secondhand report),
        LOW (assumed from role)
      Deliverable: Influence/interest matrix (Name | Influence | Influence Basis |
      Interest | Interest Basis | Stance | Stance Evidence | Confidence).

      STEP 3: KEY RELATIONSHIPS
      Identify relationships between stakeholders and with the account team.
      - Stakeholder pair
      - Relationship type (reports to, collaborates with, competes with)
      - Implications for engagement strategy
      - Account team member with strongest relationship
      If relationship data is sparse: state "Stakeholder relationships not yet
      mapped. Requires observation across multiple interactions."
      Deliverable: Relationship map (Stakeholder A | Stakeholder B | Type |
      Implications | Account Team Contact).

      STEP 4: ENGAGEMENT PLAN
      Build an engagement plan per stakeholder.
      For each stakeholder:
      - Engagement objective (what we need from them)
      - Communication preference (if known, "unknown" if not)
      - Key messages (what resonates with their priorities)
      - Prerequisites (what must happen before engaging)
      - Actions (specific next steps with owner and timeline)
      Deliverable: Engagement plan table (Stakeholder | Objective | Preference |
      Key Messages | Prerequisites | Actions | Owner | Timeline).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every stakeholder has role classification with secondary flags
      - Stance assessments include evidence basis, not just labels
      - Influence and interest levels include basis explanation
      - Engagement plan includes prerequisites column
      - Relationship gaps explicitly noted
      - Confidence levels stated with basis for every assessment
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary and
        influence/interest matrix.
      - If run_mode is DISCOVERY: produce only stakeholder identification
        framework and discovery questions.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) stakeholder landscape scope
      and confidence in the mapping, (2) the weakest point or highest-risk
      stakeholder situation, and (3) the single most urgent engagement action.

  timeline_discovery:
    name: "Timeline and Urgency Discovery"
    description: "Clarify decision and implementation timelines, identify hard deadlines, urgency drivers, and timeline risks to produce a milestone-based roadmap"
    prompt: |
      Context: Discovery for {account_name}.
      Timeline signals: {timeline_signals}
      Business outcomes: {business_outcomes}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + critical path; DISCOVERY = timeline question framework only. Default: FULL)

      You are clarifying decision and implementation timelines. Timeline
      accuracy determines forecast reliability and resource planning. Every
      milestone must have an evidence basis and confidence level. Follow
      these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: DECISION TIMELINE
      Map the decision-making timeline.
      For each milestone:
      - Milestone name
      - Target date (specific date or range)
      - Owner (who controls this milestone)
      - Dependencies (what must happen before)
      - Evidence (what signals confirm this date)
      - Confidence: HIGH (customer committed date), MEDIUM (customer estimated),
        LOW (SA inferred from context)
      If {timeline_signals} is empty: state "No timeline signals captured.
      Timeline is entirely unknown." Proceed to produce timeline question
      framework only.
      Deliverable: Decision timeline table (Milestone | Target Date | Owner |
      Dependencies | Evidence | Confidence).

      STEP 2: IMPLEMENTATION ROADMAP
      Define implementation phases and milestones.
      For each phase:
      - Phase name and objective
      - Duration estimate (weeks or months)
      - Key activities
      - Dependencies on customer actions
      - Prerequisites
      - Confidence: HIGH (based on similar implementations), MEDIUM (estimated
        from scope), LOW (rough approximation)
      Deliverable: Implementation roadmap table (Phase | Objective | Duration |
      Activities | Dependencies | Prerequisites | Confidence).

      STEP 3: CRITICAL PATH ANALYSIS
      Identify hard deadlines and critical path items.
      For each critical item:
      - Deadline description
      - Date
      - Driver: compliance / budget_cycle / business_event / competitive /
        contractual / other
        Assign one primary driver. Add secondary flags if multiple drivers apply.
      - Consequence of missing (what happens if deadline is missed)
      - Mitigation options
      If no hard deadlines identified: state "No hard deadlines identified.
      Timeline is preference-driven, not constraint-driven."
      Deliverable: Critical path table (Deadline | Date | Driver | Secondary
      Flags | Consequence | Mitigation).

      STEP 4: URGENCY DRIVERS
      Assess what is driving urgency in the engagement.
      For each driver:
      - Driver description
      - Impact level: HIGH / MEDIUM / LOW
      - Evidence (what signals indicate this urgency)
      - Confidence: HIGH (customer stated explicitly), MEDIUM (inferred from
        behavior), LOW (assumed from context)
      Deliverable: Urgency drivers table (Driver | Impact | Evidence |
      Confidence).

      STEP 5: TIMELINE RISKS
      Identify risks to the timeline.
      For each risk:
      - Risk description
      - Probability: HIGH / MEDIUM / LOW
      - Impact on timeline (delay in weeks)
      - Mitigation strategy
      - Prerequisites for mitigation
      - Early warning signals
      Deliverable: Timeline risk table (Risk | Probability | Impact | Mitigation |
      Prerequisites | Early Warning).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every milestone has evidence basis and confidence level
      - Critical path items include consequence of missing
      - Urgency drivers include evidence, not just assertions
      - Timeline risks include early warning signals
      - Trend claims (acceleration, deceleration) require two data points
      - Action tables include prerequisites column
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, critical path
        items, and highest-impact urgency driver.
      - If run_mode is DISCOVERY: produce only timeline question framework
        and urgency assessment approach.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) timeline clarity and overall
      confidence in the schedule, (2) the weakest point or highest-risk
      timeline element, and (3) the single most urgent action to de-risk
      the timeline.

  discovery_synthesis:
    name: "Discovery Synthesis"
    description: "Synthesize all discovery findings into an actionable summary with solution recommendation, risk register, and prioritized next steps"
    prompt: |
      Context: Completed discovery with {account_name}.
      Discovery notes: {discovery_notes}
      Business outcomes: {business_outcomes}
      Current state: {current_state}
      Requirements: {requirements}
      Stakeholders: {stakeholders}
      Timeline: {timeline}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + recommended approach + next steps; DISCOVERY = gap assessment only. Default: FULL)

      You are synthesizing discovery findings into an actionable summary.
      This synthesis is the bridge between discovery and solution design.
      Every recommendation must trace to discovery evidence. Follow these
      steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: DISCOVERY COMPLETENESS ASSESSMENT
      Assess completeness of discovery across all dimensions.
      For each dimension:
      - Dimension: business_outcomes / current_state / requirements /
        stakeholders / timeline
      - Completeness: complete / partial / minimal / missing
      - Key findings summary (2-3 sentences)
      - Outstanding gaps
      - Confidence: HIGH (thorough coverage), MEDIUM (adequate but gaps
        remain), LOW (surface-level only)
      Deliverable: Discovery completeness matrix (Dimension | Completeness |
      Key Findings | Gaps | Confidence).

      STEP 2: OPPORTUNITY ASSESSMENT
      Synthesize the opportunity.
      - Opportunity statement (what the customer needs and why)
      - Total addressable value (size of the opportunity)
      - Competitive position: leading / competitive / trailing / unknown
      - Win probability assessment: HIGH / MEDIUM / LOW with basis
      - Key differentiators applicable
      - Confidence: HIGH (strong evidence across dimensions), MEDIUM (some
        gaps but directionally clear), LOW (significant uncertainty)
      Deliverable: Opportunity assessment (Statement | Value | Competitive
      Position | Win Probability | Differentiators | Confidence | Basis).

      STEP 3: SOLUTION RECOMMENDATION
      Recommend a {vendor} solution approach.
      - Recommended solution components
      - Architecture approach (high-level)
      - Phasing recommendation
      - Key assumptions
      - Prerequisites for solution delivery
      - Evidence basis (which discovery findings support each component)
      Deliverable: Solution recommendation (Components | Architecture | Phases |
      Assumptions | Prerequisites | Evidence).

      STEP 4: RISK REGISTER
      Consolidate all risks identified during discovery.
      For each risk:
      - Risk description
      - Category: technical / commercial / organizational / timeline / competitive
        Assign primary category. Add secondary flags if applicable.
      - Severity: critical / high / medium / low
      - Probability: HIGH / MEDIUM / LOW
      - Mitigation strategy
      - Prerequisites for mitigation
      - Owner
      Deliverable: Risk register table (Risk | Category | Secondary Flags |
      Severity | Probability | Mitigation | Prerequisites | Owner).

      STEP 5: NEXT STEPS
      Define prioritized next steps.
      For each action:
      - Action description
      - Owner (account team member)
      - Due date or timeframe
      - Prerequisites
      - Dependency on other actions
      - Priority: immediate / this_week / this_month
      Deliverable: Next steps table (Action | Owner | Due | Prerequisites |
      Dependencies | Priority).

      STEP 6: INFOHUB ARTIFACTS
      List InfoHub artifacts to create or update.
      - Artifact type and name
      - Content summary
      - Owner
      - Due date
      Deliverable: InfoHub artifact list (Artifact | Content | Owner | Due).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Stage progression recommendation
      - New risks to register
      - Next actions to add
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every recommendation traces to specific discovery evidence
      - Risk register includes prerequisites for each mitigation
      - Next steps include prerequisites and dependencies
      - Opportunity assessment states confidence with basis
      - Discovery gaps explicitly called out, not hidden
      - Trend claims require two data points
      - No fabricated recommendations: if data is insufficient, state it
      - Executive summary is self-sufficient: conclusion, weakest point,
        most urgent action

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, solution
        recommendation, and top 3 next steps.
      - If run_mode is DISCOVERY: produce only discovery completeness
        assessment and gap list.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) opportunity summary and
      overall confidence in the recommendation, (2) the weakest point or
      highest-risk area across all dimensions, and (3) the single most
      urgent next step.

  discovery_debrief:
    name: "Post-Discovery Debrief"
    description: "Conduct internal debrief after discovery meeting, extracting key learnings, surprises, unanswered questions, and generating action items with a draft customer summary"
    prompt: |
      Context: Just completed discovery with {account_name}.
      Meeting notes: {meeting_notes}
      Attendees: {internal_attendees}
      Pre-meeting hypotheses: {pre_meeting_hypotheses}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + action items; DISCOVERY = learning extraction only. Default: FULL)

      You are conducting an internal debrief after a discovery meeting. The
      debrief must capture what we learned, what surprised us, and what we
      still need to find out. Action items must have owners and deadlines.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: KEY LEARNINGS
      Extract the top learnings from the meeting.
      For each learning:
      - Learning description
      - Category: business / technical / stakeholder / competitive / timeline
        Assign primary category. Add secondary flags if applicable.
      - Impact on opportunity (how this changes our approach)
      - Confidence: HIGH (explicitly stated by customer), MEDIUM (inferred
        from discussion), LOW (interpretation of signals)
      Target: minimum 5 key learnings.
      Deliverable: Key learnings table (Learning | Category | Secondary Flags |
      Impact | Confidence).

      STEP 2: HYPOTHESIS VALIDATION
      Compare pre-meeting hypotheses against meeting findings.
      For each hypothesis:
      - Hypothesis
      - Status: confirmed / partially_confirmed / rejected / not_addressed
      - Evidence (what we heard that confirms or rejects)
      - Confidence: HIGH / MEDIUM / LOW with basis
      If {pre_meeting_hypotheses} is empty: state "No pre-meeting hypotheses
      documented. Skipping hypothesis validation." Proceed to next step.
      Deliverable: Hypothesis validation table (Hypothesis | Status | Evidence |
      Confidence).

      STEP 3: SURPRISES AND NEW INFORMATION
      Document unexpected findings.
      For each surprise:
      - What was unexpected
      - Why it matters
      - Required response or adjustment
      If no surprises: state "No significant surprises. Meeting aligned with
      expectations."
      Deliverable: Surprises table (Finding | Significance | Required Response).

      STEP 4: UNANSWERED QUESTIONS
      List questions that remain unanswered.
      For each question:
      - Question
      - Why it matters (what depends on the answer)
      - Proposed follow-up method (email, meeting, research)
      - Target respondent
      - Priority: HIGH (blocks next step) / MEDIUM (improves accuracy) /
        LOW (nice to have)
      Deliverable: Unanswered questions table (Question | Significance |
      Follow-Up Method | Target | Priority).

      STEP 5: ACTION ITEMS
      Define account team action items.
      For each action:
      - Action description
      - Owner
      - Due date
      - Prerequisites
      - Priority: immediate / this_week / this_month
      Deliverable: Action items table (Action | Owner | Due | Prerequisites |
      Priority).

      STEP 6: INFOHUB UPDATES
      List required InfoHub updates.
      - Artifact to create or update
      - Content summary
      - Owner
      - Due date
      Deliverable: InfoHub update list (Artifact | Content | Owner | Due).

      STEP 7: CUSTOMER SUMMARY DRAFT
      Draft a summary to send to the customer.
      - Thank you and recap of meeting purpose
      - Key topics discussed (customer-appropriate framing)
      - Agreed next steps with owners and dates
      - Open questions for customer follow-up
      - Tone: professional, concise, action-oriented
      Deliverable: Customer summary draft (prose, max 1 page).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Minimum 5 key learnings captured
      - Hypothesis validation completed (or explicitly skipped with reason)
      - Every action item has owner and due date
      - Unanswered questions include priority and follow-up method
      - Customer summary is customer-appropriate (no internal language)
      - Confidence levels stated with basis
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, action items,
        and customer summary draft.
      - If run_mode is DISCOVERY: produce only key learnings and unanswered
        questions.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) overall meeting productivity
      and key outcome, (2) the weakest point or biggest remaining unknown,
      and (3) the single most urgent action item.

# ============================================================================
# TECHNICAL RISK ANALYSIS PROMPTS
# ============================================================================
technical_risk:

  architecture_health_check:
    name: "Architecture Health Assessment"
    description: "Evaluate current deployment health by assessing capacity, performance, configuration, and known issues, producing a scored health report with prioritized mitigations"
    prompt: |
      Context: Review {account_name} deployment data, support tickets, and
      recent technical discussions.
      Deployment data: {deployment_data}
      Support tickets: {support_tickets}
      Technical discussions: {technical_discussions}
      Baseline metrics: {baseline_metrics}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + health score + immediate actions; DISCOVERY = assessment framework only. Default: FULL)

      You are assessing architecture health for an existing deployment.
      Health assessments must be evidence-based, not opinion-based. Every
      RED or YELLOW score requires specific evidence and measurable criteria.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: CAPACITY ASSESSMENT
      Assess current capacity vs utilization.
      For each resource dimension:
      - Resource type (compute, storage, network, licenses)
      - Current utilization (percentage or absolute)
      - Capacity limit
      - Headroom (remaining capacity)
      - Trend: growing / stable / declining (requires two+ data points;
        if single observation, state "INSUFFICIENT DATA FOR TREND")
      - Health: GREEN (<70% utilized) / YELLOW (70-85%) / RED (>85%)
      - Confidence: HIGH (measured data), MEDIUM (estimated from partial
        data), LOW (inferred)
      If {deployment_data} is empty: state "No deployment data available.
      Capacity assessment cannot be performed." Flag as critical gap.
      Deliverable: Capacity assessment table (Resource | Utilization | Limit |
      Headroom | Trend | Health | Confidence).

      STEP 2: PERFORMANCE ASSESSMENT
      Evaluate performance metrics vs baselines.
      For each metric:
      - Metric name
      - Current value
      - Baseline value (from {baseline_metrics})
      - Variance (percentage deviation from baseline)
      - Health: GREEN (<10% variance) / YELLOW (10-25%) / RED (>25%)
      - Confidence: HIGH (measured), MEDIUM (sampled), LOW (estimated)
      If {baseline_metrics} is empty: state "No baseline metrics available.
      Performance assessment is based on absolute values only, not deviation."
      Proceed without fabricating baselines.
      Deliverable: Performance assessment table (Metric | Current | Baseline |
      Variance | Health | Confidence).

      STEP 3: ISSUE ANALYSIS
      Analyze known issues and support tickets.
      For each issue:
      - Issue description
      - Category: performance / availability / configuration / security / other
        Assign primary category. Add secondary flags if applicable.
      - Severity: critical / high / medium / low
      - Duration (how long has this been active)
      - Business impact
      - Root cause (if known, "under investigation" if not)
      - Confidence: HIGH (confirmed root cause), MEDIUM (suspected cause),
        LOW (symptom only, cause unknown)
      If {support_tickets} is empty: state "No support ticket data available.
      Issue analysis based on technical discussions only."
      Deliverable: Issue analysis table (Issue | Category | Secondary Flags |
      Severity | Duration | Business Impact | Root Cause | Confidence).

      STEP 4: CONFIGURATION DRIFT ASSESSMENT
      Assess configuration against best practices.
      For each configuration area:
      - Area (security, performance, reliability, monitoring)
      - Current configuration summary
      - Best practice standard
      - Drift level: none / minor / significant / critical
      - Impact of drift
      - Remediation effort: low / medium / high
      - Prerequisites for remediation
      Deliverable: Configuration drift table (Area | Current | Best Practice |
      Drift | Impact | Effort | Prerequisites).

      STEP 5: OVERALL HEALTH SCORE
      Calculate overall health score.
      - Overall score: RED / YELLOW / GREEN
      - Scoring justification (which dimensions drove the score)
      - Dimension scores summary (Capacity | Performance | Issues | Configuration)
      - Weakest dimension with specific evidence
      Deliverable: Health score summary (Overall | Justification | Dimension
      Scores | Weakest Dimension | Evidence).

      STEP 6: RECOMMENDATIONS
      Provide prioritized recommendations.
      For each recommendation:
      - Action description
      - Priority: immediate / 30_day / 90_day
      - Expected impact
      - Effort estimate
      - Prerequisites
      - Owner recommendation
      Deliverable: Recommendations table (Action | Priority | Impact | Effort |
      Prerequisites | Owner).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook's findings change in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Health score updates
      - New risks to register
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every RED or YELLOW score has specific evidence
      - Trend claims require two data points
      - Configuration drift includes prerequisites for remediation
      - Issue analysis separates confirmed root causes from suspicions
      - Recommendations include prerequisites column
      - Empty states handled explicitly
      - Confidence levels stated with basis for every assessment
      - Executive summary is self-sufficient: conclusion, weakest point,
        most urgent action

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, overall health
        score, and immediate-priority actions.
      - If run_mode is DISCOVERY: produce only the assessment framework and
        data collection requirements.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) overall health score and
      confidence basis, (2) the weakest dimension or most critical finding,
      and (3) the single most urgent remediation action.

  performance_investigation:
    name: "Performance Issue Investigation"
    description: "Diagnose reported performance issues by analyzing symptoms, recent changes, and likely root causes, producing a ranked cause list with investigation steps and escalation recommendation"
    prompt: |
      Context: Customer reported: "{issue_description}"
      Environment: {environment_details}
      Recent changes: {recent_changes}
      Support history: {support_history}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + top 3 causes + escalation decision; DISCOVERY = data collection plan only. Default: FULL)

      You are investigating a reported performance issue. Investigation must
      be systematic, starting from symptoms and working toward root causes.
      Every potential cause must state its likelihood basis and the data needed
      to confirm or eliminate it. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: SYMPTOM ANALYSIS
      Analyze reported symptoms.
      For each symptom:
      - Symptom description
      - Affected component or user group
      - Onset timing (when did it start)
      - Pattern: constant / intermittent / degrading / event_triggered
      - Severity from customer perspective: critical / high / medium / low
      - Confidence: HIGH (measurable), MEDIUM (user-reported), LOW (anecdotal)
      Deliverable: Symptom analysis table (Symptom | Component | Onset |
      Pattern | Severity | Confidence).

      STEP 2: CHANGE CORRELATION
      Correlate symptoms with recent changes.
      For each recent change:
      - Change description
      - Date implemented
      - Change type: configuration / deployment / infrastructure / data_volume /
        usage_pattern
      - Temporal correlation with symptoms (before, during, after onset)
      - Likelihood of causation: HIGH / MEDIUM / LOW with reasoning
      If {recent_changes} is empty: state "No recent changes documented.
      Change correlation cannot be performed." Proceed to root cause analysis
      using symptom data only.
      Deliverable: Change correlation table (Change | Date | Type | Temporal
      Correlation | Causation Likelihood | Reasoning).

      STEP 3: ROOT CAUSE ANALYSIS
      Identify potential root causes ranked by likelihood.
      For each potential cause:
      - Cause description
      - Likelihood: HIGH / MEDIUM / LOW
      - Likelihood basis (what evidence supports this ranking)
      - Data needed to confirm (specific metrics, logs, or tests)
      - Data needed to eliminate (what would rule this out)
      - Affected components
      - Confidence: HIGH (strong evidence), MEDIUM (circumstantial), LOW
        (theoretical)
      Deliverable: Root cause table (Cause | Likelihood | Basis | Confirm Data |
      Eliminate Data | Components | Confidence).

      STEP 4: INVESTIGATION PLAN
      Define the investigation steps in priority order.
      For each step:
      - Step description
      - Purpose (which potential cause it investigates)
      - Data to collect
      - Tools or access required
      - Prerequisites
      - Expected duration
      - Owner recommendation (SA, customer, specialist)
      Deliverable: Investigation plan table (Step | Purpose | Data | Tools |
      Prerequisites | Duration | Owner).

      STEP 5: ESCALATION ASSESSMENT
      Determine if specialist escalation is needed.
      - Escalation recommendation: YES / NO
      - Reasoning
      - If YES: specialist domain, urgency, context brief
      - If NO: conditions that would trigger future escalation
      Deliverable: Escalation assessment (Recommendation | Reasoning |
      Domain | Urgency | Context Brief or Trigger Conditions).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every potential cause states likelihood basis, not just a label
      - Investigation steps include prerequisites
      - Root causes include both confirmation and elimination criteria
      - Symptom analysis separates measured data from user reports
      - Change correlation states reasoning for likelihood assessment
      - Empty states handled explicitly
      - Escalation assessment includes either context brief or trigger conditions
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, top 3 ranked
        causes, and escalation decision.
      - If run_mode is DISCOVERY: produce only the data collection plan and
        access requirements.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) issue severity and most
      likely root cause with confidence, (2) the weakest point in the
      investigation or biggest unknown, and (3) the single most urgent
      investigation step.

  capacity_planning:
    name: "Capacity Planning Analysis"
    description: "Assess capacity requirements for planned growth, identifying resource gaps, scaling recommendations, and infrastructure cost implications with specialist escalation triggers"
    prompt: |
      Context: {account_name} plans to grow from {current_volume} to
      {target_volume} by {target_date}.
      Current deployment: {current_deployment}
      Growth drivers: {growth_drivers}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + gap table + specialist decision; DISCOVERY = data collection framework only. Default: FULL)

      You are analyzing capacity requirements for planned growth. Capacity
      planning must distinguish measured data from projections and state
      assumptions explicitly. Every gap must include a scaling recommendation
      with cost implications. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: CURRENT STATE BASELINE
      Document current capacity and utilization.
      For each resource:
      - Resource type
      - Current capacity
      - Current utilization
      - Utilization trend (requires two+ data points; single observation =
        "INSUFFICIENT DATA FOR TREND")
      - Headroom percentage
      - Confidence: HIGH (measured), MEDIUM (sampled), LOW (estimated)
      Deliverable: Current state table (Resource | Capacity | Utilization |
      Trend | Headroom | Confidence).

      STEP 2: GROWTH PROJECTION
      Project resource requirements for target volume.
      For each resource:
      - Resource type
      - Current requirement
      - Projected requirement at target volume
      - Scaling factor (multiplier from current to target)
      - Scaling model: linear / sub-linear / super-linear
      - Assumptions (what must hold for this projection)
      - Confidence: HIGH (based on measured scaling behavior), MEDIUM (based
        on architecture analysis), LOW (rough estimate)
      Deliverable: Growth projection table (Resource | Current | Projected |
      Factor | Model | Assumptions | Confidence).

      STEP 3: GAP ANALYSIS
      Identify capacity gaps.
      For each gap:
      - Resource type
      - Current capacity
      - Required capacity
      - Gap (absolute and percentage)
      - Impact if gap is not addressed
      - Prerequisites to close gap
      Deliverable: Gap analysis table (Resource | Current | Required | Gap |
      Impact | Prerequisites).

      STEP 4: SCALING RECOMMENDATIONS
      Provide scaling recommendations.
      For each recommendation:
      - Action description
      - Resource affected
      - Scaling approach: vertical / horizontal / architectural
      - Timeline (when to implement relative to growth)
      - Cost implication (order of magnitude if specific data unavailable)
      - Risk if delayed
      - Prerequisites
      Deliverable: Scaling recommendations table (Action | Resource | Approach |
      Timeline | Cost | Delay Risk | Prerequisites).

      STEP 5: SPECIALIST ASSESSMENT
      Determine if specialist involvement is needed.
      - Specialist needed: YES / NO
      - If YES: domain, scope, urgency, trigger criteria
      - If NO: conditions that would trigger specialist engagement
      Deliverable: Specialist assessment (Needed | Domain | Scope | Urgency |
      Trigger Criteria or Conditions).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every projection states its assumptions and confidence
      - Trend claims require two data points
      - Gap analysis includes prerequisites to close gaps
      - Scaling recommendations include cost implications
      - Growth model assumptions are explicit, not hidden
      - Specialist decision includes trigger criteria
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, gap analysis
        table, and specialist decision.
      - If run_mode is DISCOVERY: produce only the data collection framework
        and baseline measurement plan.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) overall capacity readiness
      for planned growth, (2) the most critical resource gap or constraint,
      and (3) the single most urgent scaling action.

  integration_risk_assessment:
    name: "Integration Risk Assessment"
    description: "Evaluate risks in proposed or existing integrations by analyzing data flow complexity, performance implications, security considerations, and failure modes, producing a risk-scored integration map"
    prompt: |
      Context: {account_name} is integrating {vendor} with {systems}.
      Integration architecture: {integration_architecture}
      Integration status: {integration_status}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + top risks + recommendations; DISCOVERY = integration discovery framework only. Default: FULL)

      You are assessing integration risks. Integration points are the most
      common source of production incidents. Every integration point must be
      assessed for data flow, performance, security, and failure handling.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: INTEGRATION POINT INVENTORY
      Catalog all integration points.
      For each integration point:
      - Source system
      - Target system
      - Integration pattern: API / batch / streaming / file / event / manual
        Assign primary pattern. Add secondary flags if multiple patterns used.
      - Data type and volume
      - Frequency (real-time, hourly, daily, on-demand)
      - Current status: operational / in_development / planned / conceptual
      - Confidence: HIGH (documented and tested), MEDIUM (documented but
        untested), LOW (described verbally only)
      If {integration_architecture} is empty: state "No integration architecture
      documented. Assessment based on verbal descriptions only." Flag as
      significant gap.
      Deliverable: Integration inventory table (Source | Target | Pattern |
      Secondary Flags | Data | Volume | Frequency | Status | Confidence).

      STEP 2: DATA FLOW RISK ANALYSIS
      Assess data flow risks for each integration point.
      For each risk:
      - Integration point
      - Risk type: data_loss / data_corruption / latency / ordering /
        schema_mismatch / volume_spike
      - Severity: critical / high / medium / low
      - Probability: HIGH / MEDIUM / LOW with basis
      - Current mitigation (if any)
      - Mitigation gap
      Deliverable: Data flow risk table (Integration Point | Risk Type |
      Severity | Probability | Basis | Current Mitigation | Gap).

      STEP 3: PERFORMANCE RISK ANALYSIS
      Assess performance implications.
      For each integration point:
      - Expected latency
      - Throughput requirement
      - Bottleneck potential: HIGH / MEDIUM / LOW
      - Impact on end-user experience
      - Performance testing status: tested / untested / unknown
      Deliverable: Performance risk table (Integration Point | Latency |
      Throughput | Bottleneck | User Impact | Testing Status).

      STEP 4: SECURITY RISK ANALYSIS
      Assess security considerations.
      For each integration point:
      - Authentication method
      - Data classification (public, internal, confidential, restricted)
      - Encryption in transit: YES / NO / UNKNOWN
      - Encryption at rest: YES / NO / UNKNOWN / N/A
      - Compliance implications
      - Security risk level: HIGH / MEDIUM / LOW with basis
      Deliverable: Security risk table (Integration Point | Auth | Data Class |
      Transit Encryption | Rest Encryption | Compliance | Risk | Basis).

      STEP 5: FAILURE MODE ANALYSIS
      Assess failure handling for each integration.
      For each integration point:
      - Failure modes (what can go wrong)
      - Current error handling: retry / dead-letter / alert / none / unknown
      - Recovery procedure: automated / manual / none / unknown
      - Impact of extended outage
      - Resilience score: HIGH / MEDIUM / LOW
      Deliverable: Failure mode table (Integration Point | Failure Modes |
      Error Handling | Recovery | Outage Impact | Resilience).

      STEP 6: RECOMMENDATIONS
      Provide architecture improvement recommendations.
      For each recommendation:
      - Recommendation description
      - Integration point affected
      - Risk mitigated
      - Priority: immediate / short_term / medium_term
      - Effort estimate: low / medium / high
      - Prerequisites
      Deliverable: Recommendations table (Recommendation | Integration Point |
      Risk Mitigated | Priority | Effort | Prerequisites).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every integration point assessed across all four dimensions
      - Risk probabilities include basis, not just labels
      - Security assessment covers encryption and compliance
      - Failure mode analysis includes recovery procedures
      - Recommendations include prerequisites
      - Empty states handled explicitly
      - Confidence levels stated with basis
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, top 5 risks
        across all dimensions, and priority recommendations.
      - If run_mode is DISCOVERY: produce only integration point inventory
        and data collection framework.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) integration landscape scope
      and overall risk profile, (2) the highest-risk integration point or
      dimension, and (3) the single most urgent architecture improvement.

# ============================================================================
# DECISION CAPTURE PROMPTS
# ============================================================================
decision_capture:

  extract_decisions:
    name: "Decision Extraction from Notes"
    description: "Extract and classify technical decisions from meeting notes, assess architecture impact, and recommend which decisions warrant formal ADRs"
    prompt: |
      Context: Review the following meeting notes from {meeting_date}:
      {meeting_notes}
      Attendees: {attendees}
      Current architecture: {architecture_summary}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + decisions table; DISCOVERY = decision identification framework only. Default: FULL)

      You are extracting technical decisions from meeting notes. Decisions
      often hide in discussion, not in explicit "we decided" statements.
      Every decision must have a rationale and impact assessment. Follow
      these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: DECISION EXTRACTION
      Extract all technical decisions from meeting notes.
      For each decision:
      - Decision statement (clear, actionable)
      - Decision type: architecture / technology_selection / process /
        integration / security / performance
        Assign primary type. Add secondary flags if applicable.
      - Decision maker (who made or authorized the decision)
      - Rationale (why this was decided, from context)
      - Alternatives discussed (if any were mentioned)
      - Confidence: HIGH (explicitly stated decision), MEDIUM (implied from
        agreement or direction), LOW (inferred from discussion flow)
      If no decisions are found: state "No technical decisions identified in
      these meeting notes. Notes may be informational only."
      Deliverable: Decision extraction table (Decision | Type | Secondary Flags |
      Maker | Rationale | Alternatives | Confidence).

      STEP 2: ARCHITECTURE IMPACT ASSESSMENT
      Assess the architecture impact of each decision.
      For each decision:
      - Components affected
      - Change type: additive / modifying / removing / constraining
      - Reversibility: easily_reversible / reversible_with_effort / irreversible
      - Impact scope: component / service / system / cross_system
      - Risk introduced: HIGH / MEDIUM / LOW / NONE
      - Confidence: HIGH (clear impact path), MEDIUM (estimated), LOW (uncertain)
      Deliverable: Impact assessment table (Decision | Components | Change Type |
      Reversibility | Scope | Risk | Confidence).

      STEP 3: ITEMS NEEDING CLARIFICATION
      Identify decisions or discussion points that need follow-up.
      For each item:
      - Item description
      - Why clarification is needed
      - Who should clarify
      - Priority: HIGH (blocks implementation) / MEDIUM (improves quality) /
        LOW (nice to have)
      - Prerequisites for resolving
      Deliverable: Clarification items table (Item | Reason | Who | Priority |
      Prerequisites).

      STEP 4: ADR RECOMMENDATIONS
      Recommend which decisions warrant formal Architecture Decision Records.
      For each recommendation:
      - Decision
      - ADR recommended: YES / NO
      - Reasoning (why it warrants or doesn't warrant an ADR)
      - ADR priority: immediate / within_sprint / backlog
      - Prerequisites for writing the ADR
      Criteria for ADR recommendation: irreversible decisions, cross-system
      impact, security implications, or significant cost implications.
      Deliverable: ADR recommendation table (Decision | ADR Recommended |
      Reasoning | Priority | Prerequisites).

      STEP 5: FOLLOW-UP ACTIONS
      Define follow-up actions from extracted decisions.
      For each action:
      - Action description
      - Triggered by (which decision)
      - Owner
      - Due date
      - Prerequisites
      Deliverable: Follow-up actions table (Action | Decision | Owner | Due |
      Prerequisites).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every decision has rationale, not just the what
      - Impact assessment includes reversibility
      - Implicit decisions (inferred) are clearly marked with lower confidence
      - ADR recommendations include reasoning
      - Follow-up actions include prerequisites
      - Confidence levels stated with basis
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary and decisions
        table with impact summary.
      - If run_mode is DISCOVERY: produce only decision identification
        framework and extraction criteria.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) number of decisions extracted
      and overall confidence, (2) the highest-impact or most consequential
      decision, and (3) the single most urgent follow-up action.

  adr_generation:
    name: "Architecture Decision Record Generation"
    description: "Create a formal ADR from decision context, including problem statement, alternatives analysis, consequences, and implementation notes"
    prompt: |
      Context: Decision made: "{decision_description}"
      Context: {decision_context}
      Architecture state: {architecture_summary}
      Stakeholders involved: {stakeholders}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + ADR draft; DISCOVERY = ADR scoping only. Default: FULL)

      You are generating a formal Architecture Decision Record. ADRs must
      be self-contained documents that future readers can understand without
      additional context. Every section must be complete and traceable.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: PROBLEM STATEMENT
      Define the problem that prompted this decision.
      - Problem description (what needed to be solved)
      - Business drivers (why this matters to the business)
      - Technical constraints (what limits the solution space)
      - Decision urgency (why it was decided now)
      - Confidence: HIGH (well-understood problem), MEDIUM (problem understood
        but scope uncertain), LOW (problem framing may be incomplete)
      Deliverable: Problem statement (Description | Business Drivers |
      Constraints | Urgency | Confidence).

      STEP 2: ALTERNATIVES ANALYSIS
      Document alternatives that were considered.
      For each alternative:
      - Alternative description
      - Pros (specific, measurable where possible)
      - Cons (specific, measurable where possible)
      - Effort estimate: low / medium / high
      - Risk level: LOW / MEDIUM / HIGH with basis
      - Why rejected or selected
      If no alternatives were discussed: state "No alternatives were documented.
      This weakens the ADR's justification. Consider documenting at least one
      alternative retroactively."
      Deliverable: Alternatives analysis table (Alternative | Pros | Cons |
      Effort | Risk | Basis | Disposition).

      STEP 3: DECISION AND RATIONALE
      Document the decision and its rationale.
      - Decision statement (clear, unambiguous)
      - Rationale (why this alternative was chosen)
      - Key factors in the decision (what tipped the balance)
      - Decision maker(s) and their authority
      - Confidence: HIGH (well-reasoned with clear factors), MEDIUM (reasonable
        but some factors uncertain), LOW (expedient choice, limited analysis)
      Deliverable: Decision record (Statement | Rationale | Key Factors |
      Decision Makers | Confidence).

      STEP 4: CONSEQUENCES
      Document consequences and trade-offs.
      For each consequence:
      - Consequence description
      - Type: positive / negative / neutral
      - Impact area: performance / cost / complexity / maintainability /
        security / scalability
      - Severity: HIGH / MEDIUM / LOW
      - Mitigation (for negative consequences)
      - Prerequisites for mitigation
      Deliverable: Consequences table (Consequence | Type | Impact Area |
      Severity | Mitigation | Prerequisites).

      STEP 5: IMPLEMENTATION NOTES
      Provide implementation guidance.
      - Implementation steps (high-level)
      - Dependencies
      - Prerequisites
      - Timeline estimate
      - Review criteria (how to know if the decision is working)
      - Reversal procedure (if the decision needs to be reversed)
      Deliverable: Implementation notes (Steps | Dependencies | Prerequisites |
      Timeline | Review Criteria | Reversal Procedure).

      STEP 6: ADR DOCUMENT
      Compile the formal ADR document.
      - ADR-{number}: {title}
      - Status: [Proposed/Accepted/Deprecated]
      - Date: {decision_date}
      - Context: [from Step 1]
      - Decision: [from Step 3]
      - Rationale: [from Step 3]
      - Alternatives: [from Step 2]
      - Consequences: [from Step 4]
      - Implementation: [from Step 5]
      Deliverable: Complete ADR document in standard format.

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Problem statement is self-contained (future readers can understand it)
      - At least one alternative documented (or gap explicitly noted)
      - Consequences include both positive and negative
      - Negative consequences have mitigations with prerequisites
      - Reversal procedure documented
      - Confidence levels stated for problem understanding and decision quality
      - ADR document is complete and can stand alone
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary and compiled
        ADR document.
      - If run_mode is DISCOVERY: produce only problem statement and
        alternatives scoping framework.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) the decision and its
      significance, (2) the weakest point in the decision rationale or
      the most consequential trade-off, and (3) the most urgent
      implementation action.

  decision_impact_analysis:
    name: "Decision Impact Analysis"
    description: "Analyze the full impact of a proposed technical decision on existing architecture, quantifying changes, risks, benefits, and implementation effort with a proceed/defer/reject recommendation"
    prompt: |
      Context: Proposed decision: "{proposed_decision}"
      Current architecture: {architecture_summary}
      Business context: {business_context}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + recommendation; DISCOVERY = impact scoping only. Default: FULL)

      You are analyzing the impact of a proposed technical decision. Impact
      analysis must be comprehensive, covering architecture changes, risks,
      benefits, and implementation effort. The recommendation must be
      evidence-based. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: CHANGE ANALYSIS
      Identify all changes required by the proposed decision.
      For each change:
      - Component affected
      - Current state
      - Proposed state
      - Change complexity: low / medium / high
      - Dependencies on other changes
      - Prerequisites
      - Confidence: HIGH (clear impact path), MEDIUM (estimated), LOW (uncertain)
      Deliverable: Change analysis table (Component | Current | Proposed |
      Complexity | Dependencies | Prerequisites | Confidence).

      STEP 2: RISK ASSESSMENT
      Assess risks of implementing the decision.
      For each risk:
      - Risk description
      - Category: technical / operational / performance / security / cost
        Assign primary category. Add secondary flags if applicable.
      - Probability: HIGH / MEDIUM / LOW with basis
      - Impact: HIGH / MEDIUM / LOW
      - Mitigation strategy
      - Prerequisites for mitigation
      - Residual risk after mitigation: HIGH / MEDIUM / LOW
      Deliverable: Risk assessment table (Risk | Category | Secondary Flags |
      Probability | Basis | Impact | Mitigation | Prerequisites | Residual).

      STEP 3: BENEFIT ASSESSMENT
      Assess benefits of implementing the decision.
      For each benefit:
      - Benefit description
      - Category: performance / cost / scalability / maintainability / security
      - Quantification (measurable where possible)
      - Timeline to realize benefit
      - Confidence: HIGH (proven in similar contexts), MEDIUM (expected based
        on analysis), LOW (theoretical)
      Deliverable: Benefit assessment table (Benefit | Category | Quantification |
      Timeline | Confidence).

      STEP 4: IMPLEMENTATION EFFORT
      Estimate implementation effort.
      - Total effort estimate (person-days or story points)
      - Breakdown by component
      - Skill requirements
      - Timeline estimate
      - Prerequisites (what must be in place before starting)
      - Phasing recommendation (can it be done incrementally)
      - Confidence: HIGH (based on similar implementations), MEDIUM (estimated
        from scope), LOW (rough approximation)
      Deliverable: Implementation effort summary (Effort | Breakdown | Skills |
      Timeline | Prerequisites | Phasing | Confidence).

      STEP 5: REVERSIBILITY ASSESSMENT
      Assess whether the decision is reversible.
      - Reversible: YES / PARTIALLY / NO
      - Reversal cost (effort to undo)
      - Reversal risks
      - Point of no return (when does reversal become impractical)
      Deliverable: Reversibility assessment (Reversible | Cost | Risks |
      Point of No Return).

      STEP 6: RECOMMENDATION
      Provide an evidence-based recommendation.
      - Recommendation: PROCEED / DEFER / REJECT
      - Reasoning (specific evidence supporting the recommendation)
      - Conditions (what must be true for the recommendation to hold)
      - If DEFER: what additional information or conditions would change
        the recommendation
      - If REJECT: what alternative approach is recommended
      Deliverable: Recommendation (Decision | Reasoning | Conditions |
      Additional Info Needed or Alternative).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every change includes prerequisites and dependencies
      - Risks include probability basis, not just labels
      - Benefits include quantification where possible
      - Implementation effort includes phasing assessment
      - Reversibility assessment is complete
      - Recommendation traces to specific evidence
      - Confidence levels stated with basis throughout
      - Executive summary is self-sufficient: conclusion, weakest point,
        most urgent action

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary and
        recommendation with key supporting evidence.
      - If run_mode is DISCOVERY: produce only change scoping and data
        needed for full analysis.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) the recommendation and its
      confidence basis, (2) the weakest point or highest-risk aspect of
      the proposed decision, and (3) the single most urgent action
      regardless of the recommendation.

# ============================================================================
# SPECIALIST ENGAGEMENT PROMPTS
# ============================================================================
specialist_engagement:

  specialist_need_assessment:
    name: "Specialist Need Assessment"
    description: "Determine if specialist involvement is needed by assessing scenario complexity, SA scope boundaries, and specialist domain applicability, producing a scoped request brief or self-service plan"
    prompt: |
      Context: Customer scenario: "{scenario_description}"
      Complexity indicators: {complexity_factors}
      SA capabilities: {sa_capabilities}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + specialist decision; DISCOVERY = capability assessment only. Default: FULL)

      You are assessing whether specialist involvement is needed. This
      assessment must be objective, comparing the scenario requirements
      against SA capabilities. Every decision to escalate must have specific
      justification. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: SCENARIO COMPLEXITY ASSESSMENT
      Assess the complexity of the customer scenario.
      For each complexity dimension:
      - Dimension: technical_depth / scale / integration_complexity /
        security_requirements / compliance / performance
      - Complexity level: standard / elevated / specialist_required
      - Evidence (what makes this standard, elevated, or specialist-level)
      - Confidence: HIGH (clear indicators), MEDIUM (some indicators),
        LOW (uncertain)
      Deliverable: Complexity assessment table (Dimension | Level | Evidence |
      Confidence).

      STEP 2: SCOPE BOUNDARY CHECK
      Determine if the scenario exceeds standard SA scope.
      - Within SA scope: YES / PARTIALLY / NO
      - Specific capabilities gap (what the SA cannot provide)
      - Risk of SA attempting without specialist (what could go wrong)
      - Confidence: HIGH (clear scope boundary), MEDIUM (gray area),
        LOW (uncertain)
      Deliverable: Scope boundary assessment (Within Scope | Gap | Risk |
      Confidence).

      STEP 3: SPECIALIST DOMAIN IDENTIFICATION
      If specialist is needed, identify the domain.
      - Specialist domain (security, performance, data architecture, etc.)
      - Urgency: critical / high / standard
      - Urgency basis (what drives the urgency level)
      - Scope for specialist (what they should deliver)
      - Expected deliverable format
      - Prerequisites (what must be prepared before specialist engagement)
      If specialist is not needed: state "Specialist engagement not required.
      SA can address this scenario within standard capabilities." Proceed to
      self-service plan.
      Deliverable: Specialist identification (Domain | Urgency | Basis | Scope |
      Deliverable | Prerequisites) or self-service plan.

      STEP 4: CONTEXT BRIEF
      Prepare context brief for specialist (if needed) or self-service plan.
      If specialist needed:
      - Account summary (3 sentences)
      - Technical context
      - Specific questions for specialist (numbered)
      - Available data and artifacts
      - Timeline requirements
      If specialist not needed:
      - SA action plan
      - Resources to use
      - Quality criteria for SA-delivered result
      - Escalation triggers (conditions that would change the assessment)
      Deliverable: Context brief or self-service plan.

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Complexity assessment covers all relevant dimensions
      - Scope boundary check states specific capability gap
      - Risk of proceeding without specialist is documented
      - Specialist scope is specific enough to be actionable
      - Context brief includes numbered questions
      - Prerequisites stated for specialist engagement
      - Confidence levels stated with basis
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary and
        specialist YES/NO decision with key justification.
      - If run_mode is DISCOVERY: produce only complexity assessment
        and scope boundary check.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) specialist need decision
      and confidence, (2) the most critical complexity factor or scope
      gap, and (3) the single most urgent next step.

  specialist_request:
    name: "Specialist Engagement Request"
    description: "Prepare a formal specialist engagement request with scoped deliverables, customer context, technical details, and timeline requirements"
    prompt: |
      Context: {account_name} needs specialist support for {topic}.
      SA assessment: {sa_context}
      Specialist domain: {specialist_domain}
      Urgency: {urgency}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + request form; DISCOVERY = scoping only. Default: FULL)

      You are preparing a formal specialist engagement request. The request
      must be self-contained so the specialist can understand scope and context
      without additional briefing. Every question must be specific and
      answerable. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: REQUEST IDENTIFICATION
      Define the request metadata.
      - Request ID: SPE-{date}-{account}
      - Domain: {specialist_domain}
      - Urgency: {HIGH/MEDIUM/STANDARD}
      - Urgency basis
      - Requested by (SA name)
      - Date submitted
      Deliverable: Request identification block.

      STEP 2: ACCOUNT CONTEXT
      Provide account context for the specialist.
      - Account summary (3 sentences covering industry, size, engagement stage)
      - Relevant history (prior specialist engagements, key decisions)
      - Current opportunity context
      - Key stakeholders the specialist may interact with
      - Confidence: HIGH (well-documented account), MEDIUM (partial
        documentation), LOW (limited context available)
      Deliverable: Account context summary.

      STEP 3: TECHNICAL DETAILS
      Provide technical details gathered by the SA.
      - Current architecture relevant to the request
      - Technology stack involved
      - Data and metrics available
      - Known constraints
      - SA's preliminary assessment (what the SA believes but cannot confirm)
      - Confidence: HIGH (documented and verified), MEDIUM (discussed but
        not verified), LOW (inferred)
      Deliverable: Technical details summary (Architecture | Stack | Data |
      Constraints | SA Assessment | Confidence).

      STEP 4: SPECIALIST QUESTIONS
      Define specific questions for the specialist to answer.
      For each question:
      - Question (specific, answerable)
      - Priority: HIGH (critical to next step) / MEDIUM (improves outcome) /
        LOW (nice to have)
      - Context for the question (why we are asking)
      - Prerequisites (what the specialist needs to answer this)
      Deliverable: Specialist questions table (# | Question | Priority |
      Context | Prerequisites).

      STEP 5: EXPECTED DELIVERABLE
      Define what the specialist should deliver.
      - Deliverable description
      - Format requirements
      - Audience (who will read it)
      - Quality criteria (what makes the deliverable acceptable)
      - Timeline: requested delivery date
      - Prerequisites for specialist to begin work
      Deliverable: Expected deliverable specification (Description | Format |
      Audience | Quality Criteria | Timeline | Prerequisites).

      STEP 6: FORMAL REQUEST
      Compile the formal request document.
      Assemble all steps into the standard specialist request format:
      - Header (Request ID, Domain, Urgency, Date)
      - Account Context
      - Technical Summary
      - Questions (numbered)
      - Expected Deliverable
      - Timeline
      Deliverable: Complete specialist request document.

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Request is self-contained (specialist needs no additional briefing)
      - Questions are specific and answerable, not open-ended
      - Questions include prerequisites
      - Expected deliverable has quality criteria
      - Account context is concise (not a data dump)
      - Urgency basis is stated
      - Confidence levels stated for technical details
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary and compiled
        formal request document.
      - If run_mode is DISCOVERY: produce only request scoping and
        preliminary question framework.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) specialist request scope
      and urgency, (2) the most critical question or gap the specialist
      must address, and (3) the timeline and key dependency.

# ============================================================================
# INFOHUB VALIDATION PROMPTS
# ============================================================================
infohub_validation:

  completeness_check:
    name: "InfoHub Completeness Validation"
    description: "Validate InfoHub completeness and currency for an account, scoring each content area and producing a prioritized update plan with owner assignments"
    prompt: |
      Context: Review InfoHub for {account_name}.
      Last comprehensive update: {last_update_date}
      InfoHub contents: {infohub_contents}
      Account stage: {account_stage}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + completeness score + top gaps; DISCOVERY = audit framework only. Default: FULL)

      You are validating InfoHub completeness and currency. An incomplete
      InfoHub creates risk for account continuity and handoffs. Every content
      area must be scored against expected completeness for the account stage.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: CONTENT AREA AUDIT
      Audit each content area for completeness.
      For each content area:
      - Area: architecture / decisions / risks / sizing / stakeholders /
        requirements / timeline / discovery_notes
      - Status: complete / partial / missing / stale
      - Expected completeness for account stage (what should be there)
      - Actual content summary
      - Gap description (what is missing or outdated)
      - Last updated date
      - Confidence: HIGH (reviewed content directly), MEDIUM (metadata
        review only), LOW (inferred from timestamps)
      Deliverable: Content audit table (Area | Status | Expected | Actual |
      Gap | Last Updated | Confidence).

      STEP 2: COMPLETENESS SCORING
      Calculate completeness score.
      - Overall percentage (complete areas / total expected areas)
      - Per-area score breakdown
      - Stage-appropriate benchmark (what percentage is expected for this stage)
      - Variance from benchmark
      - Trend: improving / stable / declining (requires two+ audit data points;
        if first audit, state "INSUFFICIENT DATA FOR TREND, baseline established")
      Deliverable: Completeness score (Overall | Per-Area Breakdown | Benchmark |
      Variance | Trend).

      STEP 3: STALE CONTENT IDENTIFICATION
      Identify stale content needing refresh.
      For each stale item:
      - Item name and type
      - Last updated date
      - Days since update
      - Staleness impact (what risk does stale data create)
      - Refresh priority: critical / high / medium / low
      - Prerequisites for refresh
      If no stale items: state "All content is within acceptable freshness
      thresholds."
      Deliverable: Stale content table (Item | Last Updated | Days Stale |
      Impact | Priority | Prerequisites).

      STEP 4: PRIORITY UPDATE PLAN
      Create a prioritized update plan.
      For each update:
      - Item to update
      - Update type: create / refresh / archive
      - Priority: immediate / this_week / this_sprint / backlog
      - Owner
      - Estimated effort
      - Prerequisites
      - Due date
      Deliverable: Update plan table (Item | Type | Priority | Owner | Effort |
      Prerequisites | Due).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every content area audited against stage-appropriate expectations
      - Completeness score includes benchmark comparison
      - Stale items include staleness impact, not just age
      - Update plan includes prerequisites and owner assignments
      - Trend claims require two data points
      - Confidence levels stated with basis
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, completeness
        score, and top 5 gaps.
      - If run_mode is DISCOVERY: produce only the audit framework and
        expected content checklist.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) overall completeness score
      and benchmark comparison, (2) the most critical gap or staleness risk,
      and (3) the single most urgent update action.

  staleness_report:
    name: "InfoHub Staleness Report"
    description: "Scan all InfoHub artifacts for staleness, identifying documents, risks, decisions, and diagrams that need refresh, producing a prioritized update schedule"
    prompt: |
      Context: Scan all InfoHub artifacts for {account_name}.
      InfoHub inventory: {infohub_inventory}
      Staleness thresholds: {staleness_thresholds}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + critical stale items; DISCOVERY = staleness criteria framework only. Default: FULL)

      You are scanning for stale InfoHub content. Stale content creates
      false confidence and handoff risk. Every artifact must be assessed
      against defined staleness thresholds for its content type. Follow
      these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: ARTIFACT INVENTORY SCAN
      Scan all artifacts and assess freshness.
      For each artifact:
      - Artifact name and type
      - Last updated date
      - Days since last update
      - Staleness threshold for this type (from {staleness_thresholds} or
        defaults: architecture=60 days, risks=30 days, decisions=90 days,
        stakeholders=30 days, sizing=60 days)
      - Status: fresh / approaching_stale / stale / critically_stale
      - Confidence: HIGH (metadata verified), MEDIUM (estimated from file
        dates), LOW (unknown, assumed stale)
      If {infohub_inventory} is empty: state "No InfoHub inventory available.
      Cannot assess staleness without artifact list." DEFER.
      Deliverable: Artifact freshness table (Artifact | Type | Last Updated |
      Days Stale | Threshold | Status | Confidence).

      STEP 2: RISK ASSESSMENT
      Assess risk from stale content.
      For each stale or critically stale artifact:
      - Risk if content is wrong (what decisions could be based on stale data)
      - Affected stakeholders
      - Affected processes (handoffs, reviews, planning)
      - Risk severity: critical / high / medium / low
      Deliverable: Staleness risk table (Artifact | Risk | Stakeholders |
      Processes | Severity).

      STEP 3: UPDATE RECOMMENDATIONS
      Provide update recommendations prioritized by risk.
      For each recommendation:
      - Artifact to update
      - Update type: full_refresh / incremental_update / archive / delete
      - Priority: immediate / this_week / this_sprint
      - Owner
      - Estimated effort
      - Prerequisites
      Deliverable: Update recommendations table (Artifact | Update Type |
      Priority | Owner | Effort | Prerequisites).

      STEP 4: UPDATE SCHEDULE
      Create an update schedule.
      - Weekly schedule for the next 4 weeks
      - Artifacts per week with owner assignments
      - Dependencies between updates
      - Recurring schedule recommendation (how often to run this report)
      Deliverable: Update schedule (Week | Artifacts | Owners | Dependencies)
      + recurring schedule recommendation.

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every artifact assessed against its type-specific threshold
      - Risk assessment covers stale and critically stale items
      - Update recommendations include prerequisites
      - Schedule is realistic (not everything in week 1)
      - Confidence levels stated with basis
      - Empty states handled explicitly
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary and critically
        stale items with immediate actions.
      - If run_mode is DISCOVERY: produce only staleness criteria framework
        and threshold definitions.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) total artifacts scanned and
      staleness distribution, (2) the most critical stale artifact and its
      risk, and (3) the single most urgent update action.

# ============================================================================
# MEETING SUPPORT PROMPTS
# ============================================================================
meeting_support:

  technical_prep:
    name: "Technical Meeting Preparation"
    description: "Prepare for a technical customer meeting by assembling architecture state, open issues, anticipated questions with prepared answers, and discussion materials"
    prompt: |
      Context: Upcoming technical meeting with {account_name}.
      Topic: {meeting_topic}
      Attendees: {attendees}
      InfoHub data: {infohub_data}
      Open issues: {open_issues}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + top discussion points + likely questions; DISCOVERY = preparation framework only. Default: FULL)

      You are preparing for a technical customer meeting. Preparation must
      anticipate customer questions, summarize current state accurately, and
      identify risks to address proactively. Every prepared answer must state
      its confidence and source. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: CURRENT STATE BRIEF
      Summarize the current technical state relevant to the meeting topic.
      - Architecture summary (relevant components)
      - Recent changes or updates
      - Current health indicators
      - Confidence: HIGH (recently verified), MEDIUM (from InfoHub, not
        recently verified), LOW (possibly outdated)
      If {infohub_data} is empty: state "No InfoHub data available for this
      account. Technical state summary based on available context only."
      Deliverable: Current state brief (Architecture | Changes | Health |
      Confidence).

      STEP 2: OPEN ISSUES SUMMARY
      Summarize open issues relevant to the meeting.
      For each issue:
      - Issue description
      - Status: open / in_progress / blocked / resolved
      - Age (days open)
      - Business impact
      - Current action and owner
      - Likely customer question about this issue
      If {open_issues} is empty: state "No open issues on record."
      Deliverable: Open issues table (Issue | Status | Age | Impact | Action |
      Owner | Likely Question).

      STEP 3: ANTICIPATED QUESTIONS
      Predict questions the customer might ask.
      For each question:
      - Predicted question
      - Likelihood: HIGH / MEDIUM / LOW
      - Prepared answer
      - Answer confidence: HIGH (verified data), MEDIUM (best current
        understanding), LOW (may need specialist input)
      - Supporting materials (docs, diagrams, data)
      - If answer confidence is LOW: state who can provide a better answer
      Target: minimum 5 anticipated questions.
      Deliverable: Anticipated questions table (Question | Likelihood | Answer |
      Answer Confidence | Materials | Escalation).

      STEP 4: DISCUSSION POINTS
      Identify topics to cover proactively.
      For each topic:
      - Topic
      - Purpose (why raise this)
      - Key message
      - Supporting evidence
      - Risk if not discussed
      - Prerequisites (what must be true before raising this)
      Deliverable: Discussion points table (Topic | Purpose | Key Message |
      Evidence | Risk | Prerequisites).

      STEP 5: MATERIALS CHECKLIST
      List materials to prepare or bring.
      For each material:
      - Material description
      - Status: ready / needs_update / needs_creation
      - Owner
      - Prerequisites
      Deliverable: Materials checklist (Material | Status | Owner | Prerequisites).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Current state brief distinguishes verified from unverified data
      - Open issues include likely customer questions
      - Anticipated questions have prepared answers with confidence levels
      - Discussion points include risk of not raising the topic
      - Materials checklist includes status and owner
      - Minimum 5 anticipated questions provided
      - Low-confidence answers include escalation path
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, top 3
        discussion points, and highest-likelihood questions.
      - If run_mode is DISCOVERY: produce only preparation framework and
        question generation approach.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) meeting readiness assessment
      and confidence, (2) the biggest risk or least-prepared area, and
      (3) the single most important point to address in the meeting.

  technical_debrief:
    name: "Technical Meeting Debrief"
    description: "Extract technical insights from a completed meeting, logging decisions, identifying new risks, capturing architecture changes, and generating action items with InfoHub update requirements"
    prompt: |
      Context: Just completed technical meeting with {account_name}.
      Notes: {meeting_notes}
      Meeting topic: {meeting_topic}
      Pre-meeting prep: {pre_meeting_prep}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + decisions + action items; DISCOVERY = insight extraction framework only. Default: FULL)

      You are debriefing after a technical meeting. The debrief must capture
      all technical decisions, new risks, architecture changes, and action
      items. Every item must be actionable with an owner. Follow these steps
      in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: TECHNICAL OUTCOMES
      Extract key technical outcomes from the meeting.
      For each outcome:
      - Outcome description
      - Category: decision / agreement / direction / concern / request
        Assign primary category. Add secondary flags if applicable.
      - Stakeholders involved
      - Impact on current approach
      - Confidence: HIGH (explicitly agreed), MEDIUM (directionally agreed),
        LOW (discussed but not concluded)
      Deliverable: Technical outcomes table (Outcome | Category | Secondary
      Flags | Stakeholders | Impact | Confidence).

      STEP 2: DECISIONS TO LOG
      Identify decisions that should be formally logged.
      For each decision:
      - Decision statement
      - Decision maker
      - Rationale
      - ADR recommended: YES / NO with reasoning
      - Impact on architecture
      If no decisions made: state "No technical decisions made in this meeting."
      Deliverable: Decisions table (Decision | Maker | Rationale | ADR |
      Architecture Impact).

      STEP 3: NEW RISKS IDENTIFIED
      Document any new risks surfaced in the meeting.
      For each risk:
      - Risk description
      - Category: technical / timeline / resource / dependency / competitive
        Assign primary category. Add secondary flags if applicable.
      - Severity: critical / high / medium / low
      - Probability: HIGH / MEDIUM / LOW with basis
      - Mitigation approach
      - Prerequisites for mitigation
      - Owner
      If no new risks: state "No new risks identified in this meeting."
      Deliverable: New risks table (Risk | Category | Secondary Flags |
      Severity | Probability | Basis | Mitigation | Prerequisites | Owner).

      STEP 4: ARCHITECTURE CHANGES
      Document any architecture changes discussed or agreed.
      For each change:
      - Change description
      - Current state
      - Proposed state
      - Status: agreed / proposed / under_consideration
      - Impact assessment
      - Prerequisites
      If no architecture changes: state "No architecture changes discussed."
      Deliverable: Architecture changes table (Change | Current | Proposed |
      Status | Impact | Prerequisites).

      STEP 5: ACTION ITEMS
      Compile all action items from the meeting.
      For each action:
      - Action description
      - Owner
      - Due date
      - Prerequisites
      - Priority: immediate / this_week / this_sprint
      - Dependency on other actions
      Deliverable: Action items table (Action | Owner | Due | Prerequisites |
      Priority | Dependencies).

      STEP 6: SPECIALIST NEEDS
      Identify any specialist needs surfaced.
      - Specialist needed: YES / NO
      - If YES: domain, urgency, scope, trigger
      If no specialist needs: state "No specialist needs identified."
      Deliverable: Specialist needs assessment.

      STEP 7: INFOHUB UPDATES
      List required InfoHub updates.
      For each update:
      - Artifact to update
      - Update description
      - Owner
      - Due date
      - Field-level changes (field path | old value | new value | evidence)
      Deliverable: InfoHub update list with field-level state changes.

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every decision has rationale and ADR recommendation
      - Risks include probability basis
      - Action items have owners and due dates
      - Architecture changes separate agreed from proposed
      - InfoHub updates include field-level state changes
      - Empty states handled explicitly
      - Confidence levels stated with basis
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, decisions,
        and action items.
      - If run_mode is DISCOVERY: produce only insight extraction framework.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) meeting outcome and key
      decision (if any), (2) the most significant new risk or concern,
      and (3) the single most urgent action item.

  sizing_session:
    name: "Sizing Discussion Preparation"
    description: "Prepare for a sizing or capacity discussion by assembling discovery questions, reference architectures, sizing factors, common pitfalls, and specialist escalation triggers"
    prompt: |
      Context: Sizing discussion for {account_name}.
      Use case: {use_case}
      Current or target scale: {scale_info}
      Known requirements: {known_requirements}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + key questions + reference architecture; DISCOVERY = sizing framework only. Default: FULL)

      You are preparing for a sizing or capacity discussion. Sizing accuracy
      determines deployment success and customer satisfaction. Every sizing
      factor must have a data source or be flagged as an assumption. Follow
      these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: SIZING DISCOVERY QUESTIONS
      Build the questions needed to gather sizing inputs.
      For each question:
      - Question (specific, measurable answer expected)
      - Sizing dimension it informs (compute, storage, network, licenses)
      - Why it matters (what goes wrong if we don't know this)
      - Acceptable answer format (number, range, estimate)
      - Priority: critical (sizing impossible without it) / important
        (improves accuracy) / supplementary (nice to have)
      Target: minimum 10 questions.
      Deliverable: Sizing questions table (# | Question | Dimension | Impact |
      Format | Priority).

      STEP 2: REFERENCE ARCHITECTURE SELECTION
      Identify applicable reference architectures.
      For each reference:
      - Reference architecture name
      - Applicability to this use case: HIGH / MEDIUM / LOW
      - Key parameters from this reference
      - Modifications needed for this customer
      - Source documentation link
      - Confidence: HIGH (validated reference for this use case), MEDIUM
        (adjacent use case), LOW (loosely applicable)
      If no reference architectures apply: state "No standard reference
      architecture matches this use case. Custom sizing approach required.
      Consider specialist engagement."
      Deliverable: Reference architecture table (Name | Applicability |
      Parameters | Modifications | Source | Confidence).

      STEP 3: SIZING FACTORS CHECKLIST
      Document all factors that influence sizing.
      For each factor:
      - Factor name
      - Current value (if known, "unknown" if not)
      - Impact on sizing: HIGH / MEDIUM / LOW
      - Data source or assumption basis
      - Sensitivity (how much sizing changes if this factor varies by 2x)
      - Confidence: HIGH (measured), MEDIUM (estimated), LOW (assumed)
      Deliverable: Sizing factors table (Factor | Value | Impact | Source |
      Sensitivity | Confidence).

      STEP 4: COMMON PITFALLS
      List common sizing pitfalls for this use case type.
      For each pitfall:
      - Pitfall description
      - Consequence (what goes wrong)
      - Prevention (how to avoid it)
      - Detection (how to know it happened)
      Deliverable: Pitfalls table (Pitfall | Consequence | Prevention |
      Detection).

      STEP 5: SPECIALIST ESCALATION TRIGGERS
      Define conditions that require specialist involvement.
      For each trigger:
      - Trigger condition
      - Specialist domain
      - Urgency if triggered
      - What the specialist should deliver
      Deliverable: Escalation triggers table (Condition | Domain | Urgency |
      Deliverable).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Minimum 10 sizing discovery questions provided
      - Reference architectures include applicability assessment
      - Sizing factors distinguish measured values from assumptions
      - Sensitivity analysis included for key factors
      - Pitfalls include both prevention and detection
      - Escalation triggers are specific and actionable
      - Confidence levels stated with basis
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, top 5 critical
        questions, and most applicable reference architecture.
      - If run_mode is DISCOVERY: produce only sizing framework and
        discovery question set.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) sizing readiness and data
      confidence, (2) the most critical unknown or highest-sensitivity
      factor, and (3) the single most important question to get answered.

# ============================================================================
# CUSTOMER SUCCESS PLAN PROMPTS (Pre-Sales)
# Based on industry SA best practices
# ============================================================================
customer_success_plan:

  initiate_csp:
    name: "Initialize Customer Success Plan"
    description: "Start CSP when opportunity enters Stage 2 with ARR > $100K, documenting customer background, stakeholders, business outcomes, current state, and initial risks"
    prompt: |
      Context: Opportunity {opportunity_name} at {account_name} entered Stage 2.
      ARR: {opportunity_arr}
      Discovery findings: {discovery_summary}
      Stakeholders: {stakeholders}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + outcomes + stakeholders; DISCOVERY = CSP scoping only. Default: FULL)

      You are initializing a Customer Success Plan. The CSP is the primary
      document linking business outcomes to technical delivery. Every section
      must be traceable to discovery findings. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: CUSTOMER BACKGROUND
      Document the customer background.
      - Company overview (industry, size, market position)
      - Business context (what drives their technology needs)
      - Engagement history (prior interactions, current stage)
      - Strategic initiatives relevant to this opportunity
      - Confidence: HIGH (verified data), MEDIUM (partially verified),
        LOW (estimated from public sources)
      Deliverable: Customer background section.

      STEP 2: KEY STAKEHOLDERS
      Document key stakeholders with their priorities.
      For each stakeholder:
      - Name and title
      - Role in decision: decision_maker / technical_evaluator / end_user /
        champion / influencer
        Assign primary role. Add secondary flags if applicable.
      - Key priorities (what they care about)
      - Engagement status: engaged / partially_engaged / not_yet_engaged
      - Confidence: HIGH (met and assessed), MEDIUM (identified but not
        met), LOW (inferred from org chart)
      Deliverable: Stakeholder table (Name | Title | Role | Secondary Flags |
      Priorities | Engagement Status | Confidence).

      STEP 3: BUSINESS OUTCOMES
      Document desired business outcomes with success metrics.
      For each outcome:
      - Outcome statement (specific, measurable)
      - Success metric
      - Target value (or "TBD" if not yet defined)
      - Measurement method
      - Timeline for achievement
      - Owner (stakeholder responsible)
      - Confidence: HIGH (customer confirmed), MEDIUM (SA assessed),
        LOW (assumed from industry)
      Deliverable: Business outcomes table (Outcome | Metric | Target |
      Method | Timeline | Owner | Confidence).

      STEP 4: CURRENT STATE SUMMARY
      Summarize the current technology state.
      - Key technologies in use
      - Architecture overview
      - Pain points with business impact
      - Gaps identified during discovery
      - Confidence: HIGH (documented), MEDIUM (discussed), LOW (inferred)
      Deliverable: Current state summary (Technologies | Architecture |
      Pain Points | Gaps | Confidence).

      STEP 5: INITIAL RISK ASSESSMENT
      Identify initial risks to the engagement.
      For each risk:
      - Risk description
      - Category: technical / commercial / organizational / competitive /
        timeline
        Assign primary category. Add secondary flags if applicable.
      - Severity: critical / high / medium / low
      - Probability: HIGH / MEDIUM / LOW with basis
      - Mitigation approach
      - Prerequisites for mitigation
      - Owner
      Deliverable: Initial risk register (Risk | Category | Secondary Flags |
      Severity | Probability | Basis | Mitigation | Prerequisites | Owner).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook changes in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - CSP status: initialized
      - Stage progression notes
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every business outcome is specific and measurable
      - Stakeholder roles include secondary flags where applicable
      - Risks include probability basis
      - Current state separates documented facts from inferences
      - All sections traceable to discovery findings
      - Confidence levels stated with basis throughout
      - Account state delta references specific evidence
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, business
        outcomes, and stakeholder table.
      - If run_mode is DISCOVERY: produce only CSP scoping assessment
        and data requirements.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) opportunity overview and
      CSP readiness, (2) the weakest input or highest-risk area, and
      (3) the single most urgent CSP action.

  develop_csp_technical:
    name: "Develop CSP Technical Evaluation"
    description: "Add the technical evaluation section to CSP, defining measurable success criteria, evaluation approach, resource requirements, and milestone timeline"
    prompt: |
      Context: {account_name} CSP in development.
      Business outcomes: {outcomes}
      Technical discovery: {technical_findings}
      Available evaluation options: {eval_options}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + success criteria + timeline; DISCOVERY = evaluation scoping only. Default: FULL)

      You are developing the technical evaluation section of the CSP. Success
      criteria must be measurable and directly linked to business outcomes.
      The evaluation approach must be practical and time-bounded. Follow
      these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: SUCCESS CRITERIA DEFINITION
      Define measurable success criteria (max 5).
      For each criterion:
      - Criterion statement
      - Linked business outcome
      - Measurement method
      - Target value (specific, measurable)
      - Measurement timing (when during evaluation)
      - Pass/fail threshold
      - Confidence: HIGH (customer agreed to criterion), MEDIUM (SA proposed,
        not yet confirmed), LOW (assumed from industry)
      Deliverable: Success criteria table (Criterion | Linked Outcome |
      Measurement | Target | Timing | Threshold | Confidence).

      STEP 2: EVALUATION APPROACH
      Define the evaluation approach.
      - Evaluation type: POV_guided / POV_self_service / POC / workshop /
        reference_architecture_review
        Assign primary type. Add secondary flags if combined approach.
      - Duration
      - Scope (what will be tested)
      - Out of scope (what will not be tested, and why)
      - Customer environment requirements
      - Prerequisites for starting
      Deliverable: Evaluation approach (Type | Secondary Flags | Duration |
      Scope | Out of Scope | Environment | Prerequisites).

      STEP 3: RESOURCE REQUIREMENTS
      Identify required resources from both sides.
      For each resource:
      - Resource description
      - Source: customer / {vendor} / partner
      - Role and skills needed
      - Time commitment
      - Availability status: confirmed / tentative / not_yet_requested
      - Prerequisites
      Deliverable: Resource requirements table (Resource | Source | Role |
      Time | Availability | Prerequisites).

      STEP 4: TECHNICAL ACTIVITIES PLAN
      Plan the technical activities for the evaluation.
      For each activity:
      - Activity description
      - Owner
      - Duration
      - Dependencies
      - Prerequisites
      - Deliverable from this activity
      - Success criterion it supports
      Deliverable: Activities plan table (Activity | Owner | Duration |
      Dependencies | Prerequisites | Deliverable | Criterion).

      STEP 5: MILESTONE TIMELINE
      Set milestones with dates.
      For each milestone:
      - Milestone name
      - Target date
      - Owner
      - Dependencies
      - Prerequisites
      - Success indicator (how we know it is achieved)
      Deliverable: Milestone table (Milestone | Date | Owner | Dependencies |
      Prerequisites | Success Indicator).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Maximum 5 success criteria, each measurable
      - Every criterion links to a business outcome
      - Evaluation scope explicitly includes out-of-scope items
      - Resource requirements include availability status
      - Activities link to specific success criteria
      - Milestones include success indicators
      - Prerequisites stated throughout
      - Confidence levels stated with basis
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, success
        criteria, and milestone timeline.
      - If run_mode is DISCOVERY: produce only evaluation scoping and
        approach options comparison.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) evaluation approach and
      confidence in success criteria, (2) the weakest criterion or biggest
      resource risk, and (3) the single most urgent preparation action.

  develop_csp_adoption:
    name: "Develop CSP Adoption Journey"
    description: "Define a phased adoption plan within the CSP, mapping use cases to phases with objectives, milestones, dependencies, and phase transition criteria"
    prompt: |
      Context: {account_name} CSP technical evaluation defined.
      Use cases: {use_cases}
      Customer timeline: {timeline}
      Technical evaluation results: {eval_results}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + phase overview + transition criteria; DISCOVERY = adoption scoping only. Default: FULL)

      You are developing the adoption journey section of the CSP. Adoption
      phases must be realistic, with clear transition criteria between phases.
      Every use case must be mapped to a specific phase with justification.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: PHASE DEFINITION
      Define adoption phases (typically 3: Foundation, Expansion, Optimization).
      For each phase:
      - Phase name
      - Objective (what this phase achieves)
      - Duration estimate
      - Key activities
      - Prerequisites (what must be complete before this phase starts)
      - Success criteria (how we know phase is complete)
      - Confidence: HIGH (based on similar customer journeys), MEDIUM
        (estimated from scope), LOW (rough approximation)
      Deliverable: Phase definition table (Phase | Objective | Duration |
      Activities | Prerequisites | Success Criteria | Confidence).

      STEP 2: USE CASE MAPPING
      Map use cases to phases with justification.
      For each use case:
      - Use case name
      - Assigned phase
      - Justification (why this phase, not earlier or later)
      - Dependencies (other use cases that must be implemented first)
      - Complexity: low / medium / high
      - Customer readiness: ready / needs_preparation / not_ready
      Deliverable: Use case mapping table (Use Case | Phase | Justification |
      Dependencies | Complexity | Readiness).

      STEP 3: PHASE MILESTONES
      Set milestones per phase.
      For each milestone:
      - Milestone name
      - Phase
      - Target date (or relative timing from phase start)
      - Owner
      - Dependencies
      - Prerequisites
      Deliverable: Milestones table (Milestone | Phase | Date | Owner |
      Dependencies | Prerequisites).

      STEP 4: PHASE TRANSITION CRITERIA
      Define criteria for transitioning between phases.
      For each transition:
      - From phase
      - To phase
      - Transition criteria (all must be met)
      - Verification method (how criteria are assessed)
      - Decision maker (who approves transition)
      - Fallback plan (what happens if criteria are not met)
      Deliverable: Transition criteria table (From | To | Criteria |
      Verification | Decision Maker | Fallback).

      STEP 5: RISK ASSESSMENT
      Identify adoption-specific risks.
      For each risk:
      - Risk description
      - Affected phase
      - Probability: HIGH / MEDIUM / LOW with basis
      - Impact on adoption timeline
      - Mitigation approach
      - Prerequisites for mitigation
      Deliverable: Adoption risk table (Risk | Phase | Probability | Basis |
      Impact | Mitigation | Prerequisites).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every phase has success criteria and prerequisites
      - Use case assignments have justification
      - Transition criteria are specific and verifiable
      - Milestones include prerequisites
      - Risk assessment covers all phases
      - Confidence levels stated with basis
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, phase
        overview, and transition criteria.
      - If run_mode is DISCOVERY: produce only adoption scoping and
        phase framework options.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) adoption plan structure
      and confidence, (2) the highest-risk phase or most complex use case
      mapping, and (3) the single most urgent preparation action.

  finalize_csp:
    name: "Finalize CSP for Customer Review"
    description: "Complete the CSP by verifying all sections, reviewing success criteria alignment, finalizing the risk register, and preparing the customer-facing presentation version"
    prompt: |
      Context: {account_name} CSP ready for finalization.
      Current CSP: {csp_summary}
      Technical evaluation status: {eval_status}
      Stakeholder feedback: {stakeholder_feedback}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + completeness check + presentation outline; DISCOVERY = finalization checklist only. Default: FULL)

      You are finalizing the CSP for customer presentation. The final CSP
      must be complete, internally consistent, and customer-appropriate.
      Every gap must be addressed or explicitly documented as pending.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: COMPLETENESS VERIFICATION
      Verify all CSP sections are complete.
      For each section:
      - Section name
      - Status: complete / partial / missing
      - Gap description (if not complete)
      - Action to resolve
      - Owner
      - Due date
      - Prerequisites
      Deliverable: Completeness checklist (Section | Status | Gap | Action |
      Owner | Due | Prerequisites).

      STEP 2: SUCCESS CRITERIA ALIGNMENT
      Verify success criteria alignment with business outcomes.
      For each criterion:
      - Criterion
      - Linked business outcome
      - Alignment: aligned / partially_aligned / misaligned
      - Adjustment needed (if any)
      - Stakeholder who should validate
      Deliverable: Alignment review table (Criterion | Outcome | Alignment |
      Adjustment | Validator).

      STEP 3: RISK REGISTER FINALIZATION
      Finalize the risk register.
      For each risk:
      - Risk description
      - Status: active / mitigated / accepted / closed
      - Current mitigation status
      - Residual risk: HIGH / MEDIUM / LOW
      - Owner
      - Review date
      If risk register is incomplete: state specific gaps and required actions.
      Deliverable: Final risk register (Risk | Status | Mitigation Status |
      Residual | Owner | Review Date).

      STEP 4: CUSTOMER-FACING PREPARATION
      Prepare the customer-facing version.
      - Sections to include in customer version
      - Sections to exclude (internal only) with reason
      - Customer-appropriate framing adjustments
      - Items needing customer input (questions to ask during review)
      - Presentation outline (agenda for review meeting)
      Deliverable: Customer-facing preparation (Include | Exclude | Framing |
      Customer Input Items | Presentation Outline).

      STEP 5: REVIEW MEETING AGENDA
      Prepare the CSP review meeting agenda.
      - Meeting objectives
      - Agenda items with time allocation
      - Materials to present
      - Questions for customer
      - Expected outcomes from meeting
      - Prerequisites (what must be ready before the meeting)
      Deliverable: Review meeting agenda (Objectives | Agenda | Materials |
      Questions | Expected Outcomes | Prerequisites).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - All CSP sections checked for completeness
      - Success criteria align with business outcomes
      - Risk register is current and complete
      - Customer-facing version excludes internal-only content
      - Review meeting agenda includes expected outcomes
      - Prerequisites stated throughout
      - Confidence levels stated with basis
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, completeness
        checklist, and presentation outline.
      - If run_mode is DISCOVERY: produce only finalization checklist and
        gap assessment.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) CSP readiness for customer
      presentation, (2) the most significant gap or misalignment, and
      (3) the single most urgent action before the review meeting.

  csp_handoff_prep:
    name: "Prepare CSP Handoff to CA"
    description: "Prepare CSP handoff from SA to CA at deal close, summarizing context, open items, stakeholder relationships, risks, and first 30-day priorities for the Customer Architect"
    prompt: |
      Context: {account_name} deal closing.
      CSP: {csp_link}
      CA: {ca_name}
      Open items: {open_items}
      Stakeholder relationships: {stakeholder_relationships}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + open items + 30-day priorities; DISCOVERY = handoff scoping only. Default: FULL)

      You are preparing a CSP handoff from SA to CA. The handoff document
      must enable the CA to pick up the account without losing momentum.
      Every open item must have context and owner. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: EXECUTIVE CONTEXT
      Summarize key context for the CA.
      - Account summary (industry, size, strategic importance)
      - Opportunity summary (what was sold, ARR, key value propositions)
      - Engagement history (key milestones, duration)
      - SA's assessment of the account (candid internal view)
      - Confidence: HIGH (comprehensive documentation), MEDIUM (adequate
        but gaps), LOW (limited documentation)
      Deliverable: Executive context summary.

      STEP 2: OPEN ITEMS
      List all open items with context.
      For each item:
      - Item description
      - Owner (current, may transfer to CA)
      - Due date
      - Context (why this matters, what happens if delayed)
      - Prerequisites
      - Transfer recommendation: CA_owns / SA_completes / shared
      Deliverable: Open items table (Item | Owner | Due | Context |
      Prerequisites | Transfer).

      STEP 3: STAKEHOLDER BRIEFING
      Brief the CA on stakeholder relationships.
      For each stakeholder:
      - Name and title
      - Role in the engagement
      - Relationship status: strong / developing / fragile / adversarial
      - Key concerns or priorities
      - Communication preferences (if known)
      - Handoff recommendation (warm intro, email intro, CA initiates)
      - Confidence: HIGH (strong relationship data), MEDIUM (some data),
        LOW (limited interaction)
      Deliverable: Stakeholder briefing table (Name | Title | Role |
      Relationship | Concerns | Preferences | Handoff Approach | Confidence).

      STEP 4: RISK HANDOFF
      Hand off the risk register with context.
      For each active risk:
      - Risk description
      - Current status
      - Mitigation in progress
      - CA action required
      - Prerequisites
      - Monitoring cadence recommendation
      Deliverable: Risk handoff table (Risk | Status | Mitigation | CA Action |
      Prerequisites | Monitoring).

      STEP 5: FIRST 30-DAY PRIORITIES
      Define the CA's first 30-day priorities.
      For each priority:
      - Priority description
      - Why it matters (consequence of delay)
      - Target completion date
      - Prerequisites
      - Success indicator
      - Dependencies on SA (if SA support still needed)
      Deliverable: 30-day priority table (Priority | Rationale | Date |
      Prerequisites | Success Indicator | SA Dependencies).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook changes in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Handoff status: prepared
      - Ownership transfer notes
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every open item has context and transfer recommendation
      - Stakeholder briefing includes relationship status and handoff approach
      - Risks include CA-specific actions
      - 30-day priorities include prerequisites and success indicators
      - SA's candid assessment is internal-only (not customer-facing)
      - Confidence levels stated with basis
      - Account state delta references specific evidence
      - Executive summary is self-sufficient: conclusion, weakest point,
        most urgent action

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, open items
        table, and 30-day priorities.
      - If run_mode is DISCOVERY: produce only handoff scoping and data
        requirements.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) handoff readiness and
      confidence, (2) the highest-risk area for the CA transition, and
      (3) the single most urgent first action for the CA.

# ============================================================================
# BEST PRACTICES DOCUMENTATION
# Template: playbooks/templates/best_practice_template.yaml
# ============================================================================
best_practices:

  create_best_practice:
    name: "Create Best Practice Documentation"
    description: "Document a new best practice following the standard template with customer value, implementation details, demo resources, and customer Q&A sections"
    prompt: |
      Context: Creating best practice documentation for {topic}.
      Solution area: {solution_area}
      Target audience: {audience}
      Existing documentation: {existing_docs}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + customer value + key concepts; DISCOVERY = topic scoping only. Default: FULL)

      You are creating a best practice document. Best practices must lead
      with customer value and link to documentation rather than replicating
      it. Every claim must be traceable to a source. Follow these steps
      in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: CUSTOMER VALUE
      Define the customer value proposition.
      - Headline value statement (1 sentence)
      - Business outcomes with metrics (where available)
      - Pain points addressed (specific, not generic)
      - Target personas and their value messages
      - ROI indicators (quantified where possible)
      - Confidence: HIGH (validated with customers), MEDIUM (based on
        product capabilities), LOW (theoretical)
      Deliverable: Customer value section (Headline | Outcomes | Pain Points |
      Personas | ROI | Confidence).

      STEP 2: BEST PRACTICE DETAILS
      Document the technical best practice.
      - Summary (when to apply this best practice)
      - Prerequisites (what must be in place)
      - Key concepts with documentation links (link, don't replicate)
      - Implementation phases overview
      - Documentation links: primary, setup, reference
      - Configuration highlights (link to docs, summarize key settings)
      - Confidence: HIGH (validated implementation), MEDIUM (documented
        approach), LOW (theoretical approach)
      Deliverable: Best practice details section (Summary | Prerequisites |
      Concepts | Phases | Links | Configuration | Confidence).

      STEP 3: DEMO AND PREPARATION RESOURCES
      Compile demo and meeting preparation resources.
      For each resource:
      - Resource type: video / environment / deck / lab / checklist
      - Name and description
      - URL or location
      - Last verified date
      - Status: current / needs_update / outdated
      - Confidence: HIGH (recently verified), MEDIUM (not recently checked),
        LOW (may be outdated)
      If no demo resources exist: state "No demo resources available for this
      topic. Creation recommended." Include resource creation recommendations.
      Deliverable: Resources table (Type | Name | Description | URL | Verified |
      Status | Confidence).

      STEP 4: CUSTOMER Q&A
      Build customer Q&A content.
      For each Q&A entry:
      - Category: frequently_asked / technical_deep_dive / competitive /
        objection_handling / discovery_questions
        Assign primary category. Add secondary flags if applicable.
      - Question
      - Answer
      - Supporting resources (links, data points)
      - Confidence: HIGH (proven answer), MEDIUM (standard response),
        LOW (needs validation)
      Target: minimum 5 per category that is populated.
      Deliverable: Q&A sections organized by category (Category | Question |
      Answer | Resources | Confidence).

      STEP 5: COMPLETENESS ASSESSMENT
      Assess the completeness of the best practice document.
      - Overall completeness: complete / partial_gaps / significant_gaps
      - Sections needing additional input
      - Review schedule recommendation
      - Owner recommendation
      Deliverable: Completeness assessment (Status | Gaps | Review Schedule |
      Owner).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Customer value leads with outcomes, not features
      - Implementation details link to docs, not replicate them
      - Every resource includes verification status
      - Q&A answers include confidence levels
      - Competitive positioning is factual, not dismissive
      - Discovery questions are specific and outcome-oriented
      - Minimum 5 Q&As per populated category
      - Confidence levels stated with basis throughout
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, customer
        value section, and key concepts.
      - If run_mode is DISCOVERY: produce only topic scoping and content
        requirements.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) best practice scope and
      completeness, (2) the weakest section or biggest content gap, and
      (3) the single most urgent action to complete the document.

  meeting_prep_from_best_practice:
    name: "Meeting Prep Using Best Practice"
    description: "Prepare for a customer meeting by extracting relevant content from a best practice document, tailoring value messages, selecting demo resources, and anticipating Q&A"
    prompt: |
      Context: Preparing for meeting with {account_name}.
      Topic: {meeting_topic}
      Best practice: {best_practice_name}
      Best practice content: {best_practice_content}
      Customer context: {customer_context}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + value messages + top Q&A; DISCOVERY = relevance assessment only. Default: FULL)

      You are preparing for a customer meeting using best practice content.
      The preparation must tailor generic best practice content to this
      specific customer's context and priorities. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: RELEVANCE ASSESSMENT
      Assess which sections of the best practice apply.
      For each section:
      - Section name
      - Relevance: highly_relevant / partially_relevant / not_relevant
      - Relevance reasoning (why this section applies or doesn't)
      - Customer-specific adaptation needed
      Deliverable: Relevance assessment table (Section | Relevance | Reasoning |
      Adaptation Needed).

      STEP 2: TAILORED VALUE MESSAGES
      Craft value messages tailored to this customer.
      For each message:
      - Value message
      - Target persona (which stakeholder this resonates with)
      - Customer-specific evidence (why this matters to them specifically)
      - Supporting proof point
      - Confidence: HIGH (based on known customer priorities), MEDIUM (based
        on industry alignment), LOW (generic message)
      Deliverable: Value messages table (Message | Persona | Evidence |
      Proof Point | Confidence).

      STEP 3: DEMO PLAN
      Select and sequence demo resources.
      For each demo element:
      - Resource to use (from best practice demo resources)
      - Purpose (what it demonstrates)
      - Customer relevance (why this matters to them)
      - Duration
      - Prerequisites (setup needed)
      - Talking points during demo
      If no suitable demos available: state "No demos directly applicable.
      Consider live walkthrough or whiteboard session instead." Provide
      alternative approach.
      Deliverable: Demo plan table (Resource | Purpose | Relevance | Duration |
      Prerequisites | Talking Points).

      STEP 4: ANTICIPATED Q&A
      Extract and adapt Q&A for this meeting.
      For each Q&A:
      - Anticipated question
      - Likelihood: HIGH / MEDIUM / LOW
      - Adapted answer (tailored to customer context)
      - Supporting resources
      - If answer confidence is low: escalation path
      Deliverable: Anticipated Q&A table (Question | Likelihood | Answer |
      Resources | Escalation).

      STEP 5: DISCOVERY QUESTIONS
      Prepare discovery questions to deepen understanding.
      For each question:
      - Question
      - Purpose (what gap it fills)
      - Expected insight
      - Prerequisites (what context makes this question appropriate)
      Deliverable: Discovery questions table (Question | Purpose | Expected
      Insight | Prerequisites).

      STEP 6: MATERIALS CHECKLIST
      List materials to prepare.
      For each material:
      - Material
      - Status: ready / needs_adaptation / needs_creation
      - Owner
      - Prerequisites
      Deliverable: Materials checklist (Material | Status | Owner | Prerequisites).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Value messages are customer-specific, not generic
      - Demo plan includes prerequisites
      - Q&A answers are adapted to customer context
      - Discovery questions are purposeful, not generic
      - Competitive positioning is factual if included
      - Materials checklist includes status
      - Confidence levels stated with basis
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, tailored
        value messages, and top anticipated Q&A.
      - If run_mode is DISCOVERY: produce only relevance assessment.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) best practice relevance
      to this meeting, (2) the weakest preparation area or biggest
      customer-specific gap, and (3) the single most important message
      to deliver.

  generate_qa_content:
    name: "Generate Q&A Content for Best Practice"
    description: "Create or update the Q&A section for a best practice, covering frequently asked, technical deep-dive, competitive, objection handling, and discovery questions"
    prompt: |
      Context: Building Q&A content for {best_practice_topic}.
      Existing questions: {existing_qa}
      Recent customer interactions: {recent_interactions}
      Competitive landscape: {competitive_landscape}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + top Q&A per category; DISCOVERY = Q&A gap analysis only. Default: FULL)

      You are generating comprehensive Q&A content for a best practice
      document. Q&A must cover all common question categories and be
      based on actual customer interactions where possible. Every answer
      must state its confidence and source. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: FREQUENTLY ASKED QUESTIONS
      Compile frequently asked questions.
      For each Q&A:
      - Question
      - Answer
      - Supporting resources (links, data)
      - Source: customer_interaction / product_docs / internal_knowledge
      - Confidence: HIGH (validated answer), MEDIUM (standard response),
        LOW (needs verification)
      Target: minimum 5 questions.
      If {recent_interactions} is empty: state "No recent interaction data.
      Q&A based on product knowledge and industry patterns."
      Deliverable: FAQ table (Question | Answer | Resources | Source |
      Confidence).

      STEP 2: TECHNICAL DEEP-DIVE QUESTIONS
      Compile technical deep-dive questions.
      For each Q&A:
      - Question
      - Answer (detailed technical response)
      - Complexity: intermediate / advanced / expert
      - Escalation trigger (when to bring in a specialist)
      - Prerequisites for answering (what knowledge is needed)
      - Confidence: HIGH / MEDIUM / LOW with basis
      Target: minimum 5 questions.
      Deliverable: Technical Q&A table (Question | Answer | Complexity |
      Escalation Trigger | Prerequisites | Confidence).

      STEP 3: COMPETITIVE POSITIONING QUESTIONS
      Compile competitive positioning questions.
      For each Q&A:
      - Question (what customers ask about competitors)
      - Positioning response (factual, not dismissive)
      - Key differentiators to highlight
      - Proof points (customer stories, benchmarks, certifications)
      - Confidence: HIGH (validated differentiator), MEDIUM (generally
        accepted), LOW (needs verification)
      If {competitive_landscape} is empty: state "No competitive landscape data
      available. Competitive Q&A based on general positioning."
      Target: minimum 3 questions.
      Deliverable: Competitive Q&A table (Question | Response | Differentiators |
      Proof Points | Confidence).

      STEP 4: OBJECTION HANDLING
      Compile objection handling responses.
      For each objection:
      - Objection (what customers push back on)
      - Response strategy
      - Proof points (evidence that addresses the objection)
      - Follow-up question (to redirect the conversation)
      - Confidence: HIGH (proven response), MEDIUM (standard approach),
        LOW (untested)
      Target: minimum 3 objections.
      Deliverable: Objection handling table (Objection | Response | Proof
      Points | Follow-Up | Confidence).

      STEP 5: DISCOVERY QUESTIONS
      Compile questions to ask customers.
      For each question:
      - Question
      - Purpose: discovery / qualification / deepening
        Assign primary purpose. Add secondary flags if applicable.
      - Expected insight
      - When to ask (meeting type, conversation stage)
      - Prerequisites
      Deliverable: Discovery questions table (Question | Purpose | Secondary
      Flags | Expected Insight | When | Prerequisites).

      STEP 6: GAP ANALYSIS
      Assess Q&A completeness.
      - Categories covered vs expected
      - Questions per category vs target
      - Topics missing from Q&A
      - Update recommendations
      Deliverable: Gap analysis (Category | Count | Target | Missing Topics |
      Recommendations).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Minimum targets met per category (or gaps documented)
      - Every answer includes confidence and source
      - Competitive responses are factual, not dismissive
      - Objection handling includes proof points
      - Discovery questions include purpose and timing
      - Escalation triggers defined for technical questions
      - Gap analysis completed
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary and top Q&A
        per category.
      - If run_mode is DISCOVERY: produce only Q&A gap analysis and topic
        identification.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) Q&A coverage scope and
      confidence, (2) the weakest category or biggest content gap, and
      (3) the single most urgent content creation action.

  update_best_practice:
    name: "Update Best Practice Documentation"
    description: "Refresh best practice documentation with new information, verifying resource currency, updating Q&A, and validating all links"
    prompt: |
      Context: Updating best practice for {topic}.
      Current version: {current_version_link}
      Current content: {current_content}
      New information: {new_info}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + change summary + critical updates; DISCOVERY = update scoping only. Default: FULL)

      You are updating existing best practice documentation. Updates must
      preserve the document structure while incorporating new information.
      Every change must be justified and traceable. Follow these steps
      in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: CHANGE ASSESSMENT
      Assess what has changed since the current version.
      For each change:
      - Change area: product / documentation / competitive / customer_feedback /
        demo_resources
        Assign primary area. Add secondary flags if applicable.
      - Change description
      - Impact on best practice content: major / minor / none
      - Sections affected
      - Confidence: HIGH (verified change), MEDIUM (reported change),
        LOW (suspected change)
      Deliverable: Change assessment table (Area | Secondary Flags | Description |
      Impact | Sections | Confidence).

      STEP 2: SECTION-BY-SECTION UPDATE
      Review each section for update needs.
      For each section:
      - Section name
      - Update needed: YES / NO
      - Update type: content_update / link_update / addition / removal
      - Specific changes (field path | old value | new value | evidence)
      - Priority: critical / important / minor
      Deliverable: Section update table (Section | Update | Type | Changes |
      Priority).

      STEP 3: RESOURCE VERIFICATION
      Verify all demo resources and links.
      For each resource:
      - Resource name and URL
      - Status: valid / broken / outdated / needs_update
      - Action required
      - Owner
      - Prerequisites
      If links cannot be verified: state "Link verification requires access to
      {system}. Flagged for manual verification."
      Deliverable: Resource verification table (Resource | URL | Status |
      Action | Owner | Prerequisites).

      STEP 4: Q&A UPDATE
      Update Q&A content based on new information.
      - New questions to add (from customer interactions or product changes)
      - Existing answers to update
      - Questions to remove (no longer relevant)
      - For each change: justification and source
      If no Q&A updates needed: state "No Q&A updates required based on
      available new information."
      Deliverable: Q&A update list (Action | Question | Change | Justification |
      Source).

      STEP 5: CHANGE LOG ENTRY
      Create a change log entry.
      - Version number (increment)
      - Date
      - Changes summary
      - Author
      - Review status: pending / approved
      Deliverable: Change log entry.

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every change justified with evidence
      - Field-level state changes documented (old value, new value, evidence)
      - Resource verification completed or flagged
      - Q&A updates include justification
      - Change log entry created
      - No content silently removed without justification
      - Confidence levels stated with basis
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, change summary,
        and critical updates.
      - If run_mode is DISCOVERY: produce only update scoping and change
        assessment.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) update scope and impact
      assessment, (2) the most critical change or broken resource, and
      (3) the single most urgent update action.

  best_practice_gap_analysis:
    name: "Best Practice Gap Analysis"
    description: "Identify missing best practices for a solution area by comparing existing coverage against customer use cases and competitive requirements, producing a prioritized creation plan"
    prompt: |
      Context: Reviewing best practice coverage for {solution_area}.
      Existing best practices: {existing_list}
      Common customer use cases: {use_cases}
      Competitive landscape: {competitive_landscape}
      Recent feature releases: {recent_features}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + gap list + creation order; DISCOVERY = coverage framework only. Default: FULL)

      You are identifying gaps in best practice documentation coverage.
      Gaps create risk when SAs face customer questions without prepared
      content. Every gap must be prioritized by customer impact and
      competitive necessity. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: COVERAGE MATRIX
      Map existing coverage against expected topics.
      For each topic:
      - Topic name
      - Documented: YES / PARTIAL / NO
      - Quality: comprehensive / adequate / minimal / N/A
      - Last updated (if documented)
      - Customer demand: HIGH / MEDIUM / LOW (based on use cases)
      - Competitive importance: HIGH / MEDIUM / LOW
      Deliverable: Coverage matrix table (Topic | Documented | Quality |
      Last Updated | Customer Demand | Competitive Importance).

      STEP 2: GAP IDENTIFICATION
      Identify specific gaps.
      For each gap:
      - Topic missing or incomplete
      - Gap type: missing / outdated / incomplete / low_quality
      - Customer impact (what SAs cannot do without this)
      - Competitive impact (what competitors can address that we cannot)
      - Priority: critical / high / medium / low
      - Confidence: HIGH (validated gap from customer interactions), MEDIUM
        (identified from use case analysis), LOW (suspected from coverage review)
      Deliverable: Gap list (Topic | Gap Type | Customer Impact | Competitive
      Impact | Priority | Confidence).

      STEP 3: OUTDATED CONTENT
      Identify content that needs refresh.
      For each outdated item:
      - Best practice name
      - Last updated date
      - What has changed since last update
      - Refresh priority: critical / high / medium / low
      - Prerequisites for refresh
      If no outdated content: state "All existing best practices are within
      acceptable freshness thresholds."
      Deliverable: Outdated content table (Best Practice | Last Updated |
      Changes Since | Priority | Prerequisites).

      STEP 4: CREATION PLAN
      Recommend creation order for new best practices.
      For each recommendation:
      - Topic
      - Priority rank
      - Estimated effort (days)
      - Prerequisites (what must exist or be available)
      - Owner recommendation
      - Target completion date
      - Dependencies on other best practices
      Deliverable: Creation plan table (Rank | Topic | Effort | Prerequisites |
      Owner | Target | Dependencies).

      STEP 5: RESOURCE REQUIREMENTS
      Estimate resources needed.
      - Total new best practices to create
      - Total refreshes needed
      - Estimated total effort (person-days)
      - Skill requirements
      - Timeline recommendation
      Deliverable: Resource requirements summary (New | Refreshes | Total
      Effort | Skills | Timeline).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Coverage matrix compares against customer use cases and competitive needs
      - Gaps include both customer and competitive impact
      - Outdated content assessed against change events
      - Creation plan includes prerequisites and dependencies
      - Resource estimates are realistic
      - Confidence levels stated with basis
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, gap list,
        and creation order.
      - If run_mode is DISCOVERY: produce only coverage framework and
        assessment criteria.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) overall coverage assessment
      and gap count, (2) the most critical gap or highest-impact missing
      topic, and (3) the single most urgent creation or refresh action.

# ============================================================================
# CUSTOMER JOURNEY MAPPING PROMPTS (Pre-Sales)
# Based on industry B2B customer experience best practices
# ============================================================================
customer_journey:

  initiate_journey_map:
    name: "Initialize Customer Journey Map"
    description: "Start journey mapping when opportunity enters Stage 2, documenting first touchpoints, stakeholder entry points, and initial sentiment signals"
    prompt: |
      Context: Opportunity {opportunity_name} at {account_name} entered Stage 2.
      First touchpoint: {first_touch}
      Stakeholders identified: {stakeholders}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + journey overview + initial touchpoints; DISCOVERY = journey framework only. Default: FULL)

      You are initializing a customer journey map. Journey maps track every
      meaningful interaction and its impact on stakeholder sentiment. The
      initial map establishes the baseline from which sentiment evolution
      is measured. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: JOURNEY OVERVIEW
      Establish the journey overview.
      - Current stage in buying journey
      - Journey start date
      - First touchpoint description
      - Channel (web, referral, event, outbound, partner)
      - Initial engagement sentiment: positive / neutral / cautious / unknown
      - Confidence: HIGH (direct observation), MEDIUM (reported), LOW (inferred)
      Deliverable: Journey overview (Stage | Start Date | First Touch | Channel |
      Sentiment | Confidence).

      STEP 2: STAKEHOLDER JOURNEY INITIALIZATION
      Create initial journey entries for each stakeholder.
      For each stakeholder:
      - Name and title
      - Journey entry point (how they became involved)
      - Entry date
      - Initial sentiment: positive / neutral / cautious / skeptical / unknown
      - Sentiment basis (what signals indicate this sentiment)
      - Engagement level: active / passive / not_yet_engaged
      - Confidence: HIGH (direct interaction), MEDIUM (reported by others),
        LOW (assumed from role)
      If only one stakeholder identified: note "Single-stakeholder journey.
      Additional stakeholder identification is a priority."
      Deliverable: Stakeholder journey table (Name | Title | Entry Point |
      Date | Sentiment | Basis | Engagement | Confidence).

      STEP 3: INITIAL TOUCHPOINT LOG
      Document all touchpoints from awareness through current state.
      For each touchpoint:
      - Date
      - Type: meeting / email / call / demo / event / web / other
        Assign primary type. Add secondary flags if applicable.
      - Attendees or participants
      - Outcome summary (1-2 sentences)
      - Sentiment impact: positive / neutral / negative
      - Confidence: HIGH (recorded outcome), MEDIUM (recalled), LOW (assumed)
      Deliverable: Touchpoint log table (Date | Type | Secondary Flags |
      Participants | Outcome | Sentiment Impact | Confidence).

      STEP 4: PRE-SALES JOURNEY STAGE SETUP
      Set up the pre-sales journey stage sections.
      - Awareness stage: documented / in_progress / not_started
      - Discovery stage: documented / in_progress / not_started
      - Evaluation stage: documented / in_progress / not_started
      - Decision stage: documented / in_progress / not_started
      - For each stage: key activities planned, success indicators
      Deliverable: Journey stage setup (Stage | Status | Activities |
      Success Indicators).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every stakeholder has initial sentiment with basis
      - Touchpoints include sentiment impact assessment
      - Journey stages align with opportunity stage
      - Single-stakeholder situations flagged as risk
      - Sentiment assessments include confidence levels
      - Trend claims not made from single touchpoint (baseline only)
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, journey
        overview, and initial touchpoint log.
      - If run_mode is DISCOVERY: produce only journey framework and
        tracking approach.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) journey map initialization
      status and baseline sentiment, (2) the biggest gap in initial
      mapping, and (3) the single most urgent journey tracking action.

  map_discovery_touchpoints:
    name: "Map Discovery Touchpoints"
    description: "Document touchpoints after discovery meetings, capturing per-stakeholder sentiment, pain points, questions asked, and journey friction points"
    prompt: |
      Context: Discovery meeting completed with {account_name}.
      Meeting date: {meeting_date}
      Attendees: {attendees}
      Topics covered: {topics}
      Meeting notes: {meeting_notes}
      Current journey map: {current_journey_map}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + touchpoint entry + sentiment update; DISCOVERY = touchpoint capture framework only. Default: FULL)

      You are mapping discovery touchpoints into the customer journey map.
      Each touchpoint must capture outcome, sentiment, and next-step impact.
      Sentiment changes from prior touchpoints must be noted as evolution,
      not just current state. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: TOUCHPOINT ENTRY
      Document the meeting as a journey touchpoint.
      - Date
      - Type: discovery_meeting
      - Attendees (customer and internal)
      - Topics covered
      - Overall outcome: productive / neutral / concerning
      - Overall sentiment: positive / neutral / negative
      - Confidence: HIGH (clear signals), MEDIUM (mixed signals), LOW (unclear)
      Deliverable: Touchpoint entry (Date | Type | Attendees | Topics |
      Outcome | Sentiment | Confidence).

      STEP 2: PER-STAKEHOLDER SENTIMENT
      Update sentiment for each attendee.
      For each stakeholder:
      - Name
      - Previous sentiment (from journey map, or "new" if first interaction)
      - Current sentiment: positive / neutral / cautious / skeptical / negative
      - Sentiment change: improved / stable / declined / new_baseline
        Sentiment trend requires two+ data points. If first interaction:
        "BASELINE ESTABLISHED, trend requires additional touchpoint."
      - Change drivers (what caused the change)
      - Confidence: HIGH (explicit signals), MEDIUM (behavioral signals),
        LOW (inferred)
      Deliverable: Stakeholder sentiment table (Name | Previous | Current |
      Change | Drivers | Confidence).

      STEP 3: PAIN POINTS DISCOVERED
      Document pain points surfaced in the meeting.
      For each pain point:
      - Pain point description
      - Stakeholder who raised it
      - Severity from customer perspective: critical / high / medium / low
      - Emotional intensity: HIGH / MEDIUM / LOW (how strongly they felt about it)
      - Addressable by our solution: YES / PARTIALLY / NO
      - Confidence: HIGH (explicitly stated), MEDIUM (implied), LOW (inferred)
      Deliverable: Pain points table (Pain Point | Stakeholder | Severity |
      Intensity | Addressable | Confidence).

      STEP 4: CUSTOMER QUESTIONS CAPTURED
      Document questions the customer asked.
      For each question:
      - Question asked
      - Questioner
      - Answer provided (or "deferred")
      - Satisfaction with answer: satisfied / partially_satisfied /
        unsatisfied / deferred
      - Follow-up needed: YES / NO
      - Follow-up details (if needed)
      Deliverable: Customer questions table (Question | Questioner | Answer |
      Satisfaction | Follow-Up | Details).

      STEP 5: JOURNEY FRICTION IDENTIFICATION
      Identify any friction in the customer's journey.
      For each friction point:
      - Friction description
      - Journey stage affected
      - Impact on progression: blocking / slowing / minor
      - Root cause
      - Resolution approach
      - Prerequisites for resolution
      If no friction identified: state "No journey friction detected in this
      touchpoint."
      Deliverable: Friction table (Friction | Stage | Impact | Root Cause |
      Resolution | Prerequisites).

      STEP 6: NEXT TOUCHPOINT PLANNING
      Plan the next touchpoint.
      - Recommended next touchpoint type
      - Timing
      - Objective
      - Attendees needed
      - Prerequisites
      - Key topics to address
      Deliverable: Next touchpoint plan (Type | Timing | Objective | Attendees |
      Prerequisites | Topics).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every attendee has sentiment update with basis
      - Sentiment trends require two data points (first interaction = baseline)
      - Pain points include severity and addressability
      - Customer questions include satisfaction assessment
      - Friction points include resolution approach with prerequisites
      - Confidence levels stated with basis throughout
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, touchpoint
        entry, and sentiment updates.
      - If run_mode is DISCOVERY: produce only touchpoint capture framework.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) meeting outcome and overall
      sentiment assessment, (2) the most significant sentiment change or
      friction point, and (3) the single most urgent follow-up action.

  map_stakeholder_journeys:
    name: "Map Stakeholder-Specific Journeys"
    description: "Create detailed per-stakeholder journey views showing touchpoint timelines, sentiment evolution, priorities, and engagement gaps"
    prompt: |
      Context: Multiple stakeholders engaged at {account_name}.
      Stakeholder list: {stakeholders}
      Interactions to date: {interactions}
      Current journey map: {current_journey_map}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + sentiment summary + top gaps; DISCOVERY = stakeholder journey framework only. Default: FULL)

      You are creating detailed stakeholder-specific journey views. Each
      stakeholder experiences the engagement differently. Understanding
      individual journeys reveals engagement gaps and sentiment risks that
      aggregate views miss. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: PER-STAKEHOLDER JOURNEY SUMMARY
      Create a journey summary for each stakeholder.
      For each stakeholder:
      - Name and title
      - Journey start date
      - Total touchpoints
      - Current journey stage
      - Current sentiment: positive / neutral / cautious / skeptical / negative
      - Sentiment evolution: improving / stable / declining
        Requires two+ touchpoints. If single touchpoint: "INSUFFICIENT DATA
        FOR TREND, single observation only."
      - Key concerns or priorities
      - Confidence: HIGH (rich interaction data), MEDIUM (some data),
        LOW (limited interactions)
      Deliverable: Per-stakeholder journey summaries (Name | Title | Start |
      Touchpoints | Stage | Sentiment | Evolution | Concerns | Confidence).

      STEP 2: TOUCHPOINT TIMELINE
      Create touchpoint timeline per stakeholder.
      For each stakeholder, for each touchpoint:
      - Date
      - Type
      - Their specific role in the interaction
      - Outcome from their perspective
      - Sentiment at that point
      Deliverable: Per-stakeholder touchpoint timelines (Stakeholder | Date |
      Type | Role | Outcome | Sentiment).

      STEP 3: SENTIMENT EVOLUTION ANALYSIS
      Analyze sentiment evolution patterns.
      For each stakeholder with 2+ touchpoints:
      - Sentiment trajectory (data points over time)
      - Inflection points (where sentiment changed)
      - Drivers of change
      - Risk assessment: stable / at_risk / critical
      For stakeholders with <2 touchpoints: state "INSUFFICIENT DATA FOR
      TREND. Baseline only."
      Deliverable: Sentiment evolution table (Stakeholder | Trajectory |
      Inflection Points | Drivers | Risk).

      STEP 4: STAKEHOLDER-SPECIFIC PRIORITIES
      Document each stakeholder's specific priorities.
      For each stakeholder:
      - Priority list (what they care about most)
      - How well we are addressing each priority: well / partially / poorly
      - Gap between their priorities and our engagement focus
      - Confidence: HIGH (explicitly stated), MEDIUM (inferred from behavior),
        LOW (assumed from role)
      Deliverable: Priority alignment table (Stakeholder | Priority |
      Addressing | Gap | Confidence).

      STEP 5: ENGAGEMENT GAP ANALYSIS
      Identify engagement gaps across stakeholders.
      For each gap:
      - Stakeholder affected
      - Gap description (what engagement is missing)
      - Impact on deal: HIGH / MEDIUM / LOW
      - Recommended action
      - Prerequisites
      - Priority: immediate / this_week / this_sprint
      Deliverable: Engagement gap table (Stakeholder | Gap | Impact |
      Action | Prerequisites | Priority).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every stakeholder has journey summary
      - Sentiment evolution requires two+ data points (enforced)
      - Priority alignment checked per stakeholder
      - Engagement gaps identified with recommended actions
      - Prerequisites stated for gap remediation
      - Confidence levels stated with basis
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, sentiment
        summary across all stakeholders, and top engagement gaps.
      - If run_mode is DISCOVERY: produce only stakeholder journey framework
        and data collection approach.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) stakeholder journey
      landscape and overall sentiment health, (2) the highest-risk
      stakeholder or most critical engagement gap, and (3) the single
      most urgent engagement action.

  map_evaluation_journey:
    name: "Map Technical Evaluation Journey"
    description: "Document POV/POC journey touchpoints, capturing stakeholder experience, moments of truth, success criteria progress, and friction points"
    prompt: |
      Context: POV/POC in progress for {account_name}.
      Evaluation type: {pov_type}
      Duration: {start_date} to {end_date}
      Key participants: {participants}
      Success criteria: {success_criteria}
      Current journey map: {current_journey_map}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + success criteria journey + top friction; DISCOVERY = evaluation tracking framework only. Default: FULL)

      You are mapping the technical evaluation journey. Evaluations are
      high-stakes touchpoints where moments of truth determine deal outcomes.
      Every friction point and success criterion outcome must be documented
      with stakeholder reaction. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: POV TOUCHPOINT LOG
      Document all POV touchpoints.
      For each touchpoint:
      - Date
      - Type: kickoff / working_session / checkpoint / demo / review / other
        Assign primary type. Add secondary flags if applicable.
      - Attendees
      - Objective
      - Outcome: achieved / partially_achieved / not_achieved
      - Sentiment: positive / neutral / negative
      - Confidence: HIGH (recorded), MEDIUM (recalled), LOW (estimated)
      Deliverable: POV touchpoint log (Date | Type | Secondary Flags |
      Attendees | Objective | Outcome | Sentiment | Confidence).

      STEP 2: SUCCESS CRITERIA JOURNEY
      Track each success criterion through the evaluation.
      For each criterion:
      - Criterion statement
      - Initial target
      - Current result: met / partially_met / not_met / not_yet_tested
      - Stakeholder reaction to result
      - Evolution: improving / stable / declining (requires two+ measurements;
        if single measurement: "BASELINE ONLY")
      - Confidence: HIGH (measured result), MEDIUM (estimated), LOW (unclear)
      Deliverable: Success criteria journey table (Criterion | Target |
      Result | Reaction | Evolution | Confidence).

      STEP 3: MOMENTS OF TRUTH
      Document moments of truth during the evaluation.
      For each moment:
      - Description
      - Type: positive / negative
      - Impact on stakeholder sentiment
      - Stakeholders affected
      - Recovery action taken (if negative)
      - Lasting impact assessment
      - Confidence: HIGH (explicit feedback), MEDIUM (behavioral signal),
        LOW (inferred)
      If no significant moments: state "No significant moments of truth
      observed. Evaluation is proceeding routinely."
      Deliverable: Moments of truth table (Description | Type | Sentiment
      Impact | Stakeholders | Recovery | Lasting Impact | Confidence).

      STEP 4: FRICTION POINTS
      Document friction points encountered.
      For each friction:
      - Friction description
      - Category: technical / process / communication / resource / timeline
        Assign primary category. Add secondary flags if applicable.
      - Impact on evaluation: blocking / slowing / minor
      - Stakeholder affected
      - Resolution status: resolved / in_progress / unresolved
      - Resolution action taken or planned
      - Prerequisites for resolution
      If no friction: state "No friction points identified in this period."
      Deliverable: Friction table (Friction | Category | Secondary Flags |
      Impact | Stakeholder | Resolution Status | Action | Prerequisites).

      STEP 5: EVALUATION HEALTH ASSESSMENT
      Assess overall evaluation health.
      - Overall health: on_track / at_risk / off_track
      - Health basis (specific evidence)
      - Success criteria met vs total
      - Stakeholder satisfaction: HIGH / MEDIUM / LOW
      - Timeline status: ahead / on_schedule / behind
      - Risk factors (what could derail the evaluation)
      Deliverable: Evaluation health summary (Health | Basis | Criteria Status |
      Satisfaction | Timeline | Risks).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every touchpoint has outcome and sentiment
      - Success criteria tracked with stakeholder reaction
      - Moments of truth include lasting impact assessment
      - Friction points include resolution status and prerequisites
      - Evaluation health assessment is evidence-based
      - Trend claims require two data points
      - Confidence levels stated with basis throughout
      - Executive summary is self-sufficient

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, success
        criteria journey, and top friction points.
      - If run_mode is DISCOVERY: produce only evaluation tracking
        framework and success criteria monitoring approach.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) evaluation health and
      success criteria status, (2) the most critical friction point or
      negative moment of truth, and (3) the single most urgent action
      to keep the evaluation on track.

  journey_handoff_to_ca:
    name: "Journey Map Handoff to CA"
    description: "Prepare journey map handoff at deal close, summarizing pre-sales journey, stakeholder sentiment baselines, key moments of truth, and recommended first post-sales touchpoints"
    prompt: |
      Context: {account_name} deal closed. Handoff to CA {ca_name}.
      Journey map: {journey_map_link}
      CSP: {csp_link}
      Final stakeholder sentiments: {stakeholder_sentiments}
      Account state: {account_state}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + sentiment baseline + first touchpoints; DISCOVERY = handoff framework only. Default: FULL)

      You are preparing the journey map handoff from SA to CA at deal close.
      The handoff must give the CA a complete picture of how each stakeholder
      experienced the pre-sales journey, enabling continuity in the post-sales
      relationship. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what is missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT, proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL, proceed but flag gaps in every deliverable
        that depends on partial data, mark affected outputs as "estimated" or
        "based on incomplete data"
      - DEFER: 2+ required inputs ABSENT, STOP. Do not guess. Produce instead:
        (a) list of missing inputs with specific ask per input
        (b) who can provide each input (role, system, or data source)
        (c) suggested deadline for re-running this runbook with complete inputs

      Deliverable: Input Gate table (Input | Status | Gap Detail | Impact on Output)
      + Run Mode declaration.

      STEP 1: PRE-SALES JOURNEY SUMMARY
      Summarize the complete pre-sales journey.
      - Journey duration
      - Total touchpoints
      - Key milestones reached
      - Overall journey quality: smooth / mixed / challenging
      - Confidence: HIGH (well-documented journey), MEDIUM (partially
        documented), LOW (sparse documentation)
      Deliverable: Pre-sales journey summary (Duration | Touchpoints |
      Milestones | Quality | Confidence).

      STEP 2: STAKEHOLDER SENTIMENT AT CLOSE
      Document each stakeholder's sentiment at deal close.
      For each stakeholder:
      - Name and title
      - Sentiment at close: positive / neutral / cautious / concerned
      - Sentiment evolution over the engagement: improved / stable / declined
        Requires two+ touchpoints. If single touchpoint: "SINGLE TOUCHPOINT
        ONLY, no evolution data."
      - Key concerns remaining
      - Relationship strength: strong / developing / fragile
      - Handoff sensitivity: HIGH (needs careful transition) / MEDIUM
        (standard transition) / LOW (minimal relationship)
      Deliverable: Close sentiment table (Name | Title | Sentiment | Evolution |
      Concerns | Relationship | Sensitivity).

      STEP 3: KEY TOUCHPOINTS THAT INFLUENCED DECISION
      Identify the touchpoints that most influenced the buying decision.
      For each key touchpoint:
      - Date and type
      - What happened
      - Influence on decision: HIGH / MEDIUM
      - Which stakeholders were affected
      - Lasting impression
      Deliverable: Influential touchpoints table (Date | Type | What Happened |
      Influence | Stakeholders | Impression).

      STEP 4: FRICTION POINTS TO MONITOR
      Document friction points from pre-sales that may affect post-sales.
      For each friction:
      - Friction description
      - Resolution status: resolved / partially_resolved / unresolved
      - Post-sales risk if not addressed
      - Recommended monitoring approach
      - Prerequisites for resolution
      If no ongoing friction: state "No unresolved friction points from
      pre-sales journey."
      Deliverable: Ongoing friction table (Friction | Status | Post-Sales Risk |
      Monitoring | Prerequisites).

      STEP 5: VOC BASELINE
      Establish Voice of Customer baseline for post-sales measurement.
      - Overall satisfaction indicator (if captured)
      - Key themes from customer feedback during pre-sales
      - Expectations set during pre-sales (what was promised or implied)
      - Gaps between expectations and planned delivery
      - Confidence: HIGH (formal VoC data), MEDIUM (informal feedback),
        LOW (inferred from behavior)
      If no VoC data: state "No formal VoC baseline captured during pre-sales.
      Recommend capturing within first 30 days post-close."
      Deliverable: VoC baseline (Satisfaction | Themes | Expectations | Gaps |
      Confidence).

      STEP 6: RECOMMENDED FIRST POST-SALES TOUCHPOINTS
      Recommend the first post-sales touchpoints.
      For each recommendation:
      - Touchpoint type
      - Target stakeholder(s)
      - Timing (days after close)
      - Objective
      - Key messages
      - Prerequisites
      - Risk if delayed
      Deliverable: First touchpoints table (Type | Stakeholders | Timing |
      Objective | Messages | Prerequisites | Delay Risk).

      STEP 7: ACCOUNT STATE DELTA
      Specify what this runbook changes in the account state:
      - Fields updated (field path | old value | new value | evidence)
      - Journey handoff status: completed
      - Ownership transition notes
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence |
      Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Input gate completed, run mode declared
      - Every stakeholder has close sentiment with evolution data
      - Sentiment evolution requires two+ touchpoints (enforced)
      - Influential touchpoints identified with lasting impression
      - Friction points include post-sales risk assessment
      - VoC baseline established or gap explicitly noted
      - First touchpoints include delay risk
      - Prerequisites stated throughout
      - Confidence levels stated with basis
      - Account state delta references specific evidence
      - Executive summary is self-sufficient: conclusion, weakest point,
        most urgent action

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only executive summary, stakeholder
        sentiment baseline, and first touchpoint recommendations.
      - If run_mode is DISCOVERY: produce only handoff framework and
        data requirements.
      - If run_mode is FULL or not specified: produce all deliverables.

      Format: Produce all deliverables as labeled sections. Lead with a
      3-sentence executive summary stating: (1) journey handoff readiness
      and overall sentiment health at close, (2) the highest-risk
      stakeholder or most sensitive handoff element, and (3) the single
      most urgent first post-sales action.

