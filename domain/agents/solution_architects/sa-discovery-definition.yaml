agentspec_version: 26.1.0
component_type: Agent
id: sa-discovery-agent
name: SA Discovery Agent
description: >
  Conducts structured technical discovery covering business outcomes, current state,
  requirements, stakeholders, and timeline. Synthesizes findings into actionable
  summaries that drive architecture recommendations and solution design.
metadata:
  definition_version: "0.1.0"
  parent_agent: sa-agent
  tags:
  - discovery
  - requirements
  - architecture
  - stakeholders
  responsibility: Conduct thorough technical discovery and produce actionable synthesis
system_prompt: |
  You are a Technical Discovery Agent, part of the Solution Architect intelligence
  system. Your job is to conduct structured discovery across five dimensions.

  You MUST:
  - Cover all discovery dimensions: business outcomes, current state, requirements, stakeholders, timeline
  - Link every requirement to a business driver
  - Identify red flags in current state and requirements
  - Map stakeholder roles, influence, and engagement willingness
  - Synthesize into actionable summary with recommended next steps
  - Flag gaps that need follow-up discovery sessions

  You MUST NOT:
  - Assess commercial viability (AE Agent's domain)
  - Design solutions during discovery (premature commitment)
  - Skip stakeholder mapping even for "technical-only" engagements
  - Assume requirements without customer validation

  When uncertain: document the gap, suggest discovery questions to resolve it,
  add [NEEDS DISCOVERY] marker.

  Tone: curious, structured, thorough.
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-communications
  name: Read Communications
  description: >
    Access Slack technical channels, email threads, and meeting transcripts
    for discovery evidence and stakeholder communication patterns.
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: source_type
    type: string
  - title: time_period
    type: string
  outputs:
  - title: communications
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Cannot access communications, flag as data gap
    - error_code: NO_RECORDS
      guidance: No communications found for period, expand search or note gap
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: >
    Access structured account data from the InfoHub vault. Use section parameter
    to target specific data: risks, decisions, stakeholders, competitive,
    governance, value, journey, opportunities, context, or frameworks.
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: >
    Access intelligence layer data for a realm. Sections: account (company profile,
    organigram, opportunity map), industry (profile, regulatory, trends),
    market (news digest), technology (current map, vendor landscape).
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: write-sa-artifact
  name: Write Solution Artifact
  description: Save discovery summaries and technical profiles to InfoHub
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from solution architect
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: discovery-intelligence
  name: Discovery Intelligence
  description: Discovery findings available to peer agents for engagement context
  tools:
  - id: get-discovery-summary
    name: Get Discovery Summary
    description: Returns synthesized discovery findings for an account
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: discovery_summary
      type: object
  - id: get-stakeholder-map
    name: Get Stakeholder Map
    description: Returns technical stakeholder map with roles and influence
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: stakeholder_map
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: technical-discovery
  name: Technical Discovery
  playbook_refs: [PB_SA_001, PB_SA_002, PB_SA_003, PB_SA_005, PB_SA_006, PB_SA_007, PB_SA_008, PB_SA_009, PB_SA_010, PB_SA_011, PB_SA_012, PB_SA_013, PB_SA_014, PB_SA_015]
  description: Conduct structured technical discovery covering business outcomes, current state, requirements,
    stakeholders, and timeline
  inputs:
  - title: account_context
    type: object
  - title: meeting_agenda
    type: string
  - title: attendees
    type: array
  outputs:
  - title: discovery_summary
    type: object
  - title: discovery_prep
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: sa-discovery-preparation
      input: account_name, opportunity_name
      description: Prepare discovery session with account context and research
      on_failure: stop
    - step: 2
      prompt: sa-business-outcomes-discovery
      input: account_name
      description: Discover business outcomes, success metrics, and drivers
      on_failure: stop
    - step: 3
      prompt: sa-current-state-discovery
      input: account_name
      description: Map current technical landscape, pain points, and workarounds
      on_failure: stop
    - step: 4
      prompt: sa-requirements-discovery
      input: account_name
      description: Gather and prioritize requirements using MoSCoW
      on_failure: stop
    - step: 5
      prompt: sa-stakeholder-discovery
      input: account_name, attendees
      description: Map stakeholder roles, influence, and engagement willingness
      on_failure: stop
    - step: 6
      prompt: sa-timeline-discovery
      input: account_name
      description: Establish milestones, dependencies, and deadline drivers
      on_failure: skip_with_warning
    - step: 7
      prompt: sa-discovery-synthesis
      input: account_name
      description: Synthesize all discovery dimensions into actionable summary
      on_failure: stop
    - step: 8
      prompt: sa-discovery-debrief
      input: account_name
      description: Post-discovery debrief, gap analysis, and next steps
      on_failure: skip_with_warning
    - step: 9
      action: persist
      tools:
      - write-sa-artifact
      description: Save discovery summary to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - technical-discovery
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: >
      Discovery is a human conversation, not a data extraction exercise. The SA
      brings domain expertise, builds trust through credibility, reads non-verbal
      cues, and asks follow-up questions no script could anticipate. The agent
      structures and synthesizes, but the SA creates the conditions where
      customers share what really matters.
    challenges:
      - "Customers share surface-level requirements without revealing the real business pain driving the project"
      - "Key stakeholders skip discovery sessions, leaving gaps in requirements and influence mapping"
      - "Prior discovery notes are scattered across emails, Slack, and meeting transcripts with no synthesis"
      - "Distinguishing confirmed requirements from aspirational wishlists when customers present both as must-haves"
    administrative_overhead:
      - "Manually reviewing weeks of email threads and Slack channels to prepare for a discovery session"
      - "Synthesizing five discovery dimensions into a coherent summary after each session"
      - "Cross-referencing stakeholder statements across multiple meetings to detect contradictions"
      - "Tracking which discovery gaps remain open and scheduling follow-up sessions to close them"
    scenarios:
      - problem: "Customers share surface-level requirements without revealing the real business pain driving the project"
        why: >
          When discovery stays at the feature level, the SA designs a solution that checks boxes
          but misses the business outcome the customer actually needs. The deal stalls in evaluation
          because the proposal never connects to what the economic buyer cares about.
        agent: sa-discovery-agent
        agent_response: >
          Prepares discovery sessions with research-backed context on the customer's industry,
          current technology landscape, and known pain points. Generates targeted questions
          that probe beyond feature requests to uncover business drivers and success metrics.
        success_signal:
          metric: "Business drivers identified and linked to requirements"
          target: "100% of requirements trace to at least one business driver"
          leading_indicator: "Customer confirms business outcome alignment in follow-up meeting"
          failure_signal: "Discovery summary lists features without any business driver linkage"
      - problem: "Prior discovery notes are scattered across emails, Slack, and meeting transcripts with no synthesis"
        why: >
          When an SA picks up an account mid-cycle or prepares for a follow-up session, there is
          no single source of truth for what was already discovered. Time gets wasted re-asking
          questions, and customers lose confidence when the vendor appears unprepared.
        agent: sa-discovery-agent
        agent_response: >
          Aggregates communications, meeting transcripts, and prior discovery notes into a
          structured preparation brief. Highlights open gaps, confirmed requirements, and
          stakeholder positions so the SA walks into the session fully informed.
        success_signal:
          metric: "Discovery preparation brief available before session"
          target: "100% of discovery sessions have a preparation brief generated from prior data"
          leading_indicator: "SA reports no redundant questions needed in follow-up sessions"
          failure_signal: "Customer raises previously-answered topics that the SA missed"
      - problem: "Key stakeholders skip discovery sessions, leaving gaps in requirements and influence mapping"
        why: >
          When decision-makers or technical influencers miss discovery sessions, the requirements
          gathered represent only a partial view. The SA builds a solution that satisfies the
          people in the room but misses constraints or priorities held by absent stakeholders.
          These gaps surface late in the cycle as objections that could have been addressed early.
        agent: sa-discovery-agent
        agent_response: >
          Cross-references meeting attendees against the stakeholder map to identify missing
          participants after each discovery session. Generates a gap report listing which
          discovery dimensions lack input from key roles, and suggests targeted follow-up
          questions to address the specific gaps created by each absent stakeholder.
        success_signal:
          metric: "Stakeholder coverage across discovery sessions"
          target: "All decision-makers and technical influencers contribute to at least one discovery session"
          leading_indicator: "Stakeholder gap report generated within 24h of each discovery session"
          failure_signal: "Late-stage objection raised by a stakeholder who was never included in discovery"
      - problem: "Distinguishing confirmed requirements from aspirational wishlists when customers present both as must-haves"
        why: >
          Customers often describe future-state aspirations with the same urgency as immediate
          needs. When an SA treats all stated requirements as equal, the solution scope inflates
          beyond what the budget and timeline can support. The proposal either gets rejected for
          being too expensive or the team commits to delivering capabilities the customer does
          not actually need for the initial deployment.
        agent: sa-discovery-agent
        agent_response: >
          Applies MoSCoW prioritization to every requirement and cross-references each one against
          stated business drivers and timeline constraints. Flags requirements that lack a direct
          business driver linkage or that conflict with the stated go-live timeline as candidates
          for deferral, giving the SA clear data to negotiate scope with the customer.
        success_signal:
          metric: "Requirements prioritized with business driver linkage"
          target: "100% of requirements classified using MoSCoW with business driver traceability"
          leading_indicator: "Customer validates prioritization before solution design begins"
          failure_signal: "Solution proposal includes aspirational requirements that inflate scope beyond budget"
  escalation_triggers:
    - "Critical discovery gaps found (3+ unresolved dimensions after session)"
    - "Red flags in requirements that conflict with product capabilities"
    - "Key stakeholder unwilling to participate in discovery"
    - "No business driver identified after initial discovery pass"
  prompt_registry:
    sa-discovery-preparation:
      description: Prepare for structured technical discovery session
      source: prompts/tasks.yaml#technical_discovery.discovery_preparation
      requires_data:
      - source: read-infohub
        fields: [account_context, opportunity_details, stakeholder_map, prior_discovery_notes]
        priority: critical
      - source: read-intelligence
        fields: [company_profile, industry_trends, technology_landscape]
        priority: enrichment
      - source: read-communications
        fields: [recent_slack_threads, email_threads, prior_meeting_transcripts]
        priority: enrichment
    sa-business-outcomes-discovery:
      description: Discover business outcomes and success metrics
      source: prompts/tasks.yaml#technical_discovery.business_outcomes_discovery
      requires_data:
      - source: read-infohub
        fields: [account_context, business_drivers, value_framework, opportunity_details]
        priority: critical
      - source: read-communications
        fields: [customer_statements, meeting_transcripts]
        priority: critical
      - source: read-intelligence
        fields: [company_profile, industry_trends]
        priority: enrichment
    sa-current-state-discovery:
      description: Map current technical landscape
      source: prompts/tasks.yaml#technical_discovery.current_state_discovery
      requires_data:
      - source: read-infohub
        fields: [technical_landscape, deployment_topology, vendor_stack, known_pain_points]
        priority: critical
      - source: read-communications
        fields: [technical_discussions, incident_reports, change_requests]
        priority: critical
      - source: read-intelligence
        fields: [current_technology_map, vendor_landscape]
        priority: enrichment
    sa-requirements-discovery:
      description: Gather and prioritize requirements
      source: prompts/tasks.yaml#technical_discovery.requirements_discovery
      requires_data:
      - source: read-infohub
        fields: [account_context, prior_requirements, business_drivers, frameworks]
        priority: critical
      - source: read-communications
        fields: [requirements_discussions, feature_requests, meeting_transcripts]
        priority: critical
    sa-stakeholder-discovery:
      description: Map stakeholder roles and influence
      source: prompts/tasks.yaml#technical_discovery.stakeholder_discovery
      requires_data:
      - source: read-infohub
        fields: [stakeholder_map, governance_structure, account_context]
        priority: critical
      - source: read-communications
        fields: [meeting_attendees, communication_patterns, engagement_signals]
        priority: critical
      - source: read-intelligence
        fields: [organigram, company_profile]
        priority: enrichment
    sa-timeline-discovery:
      description: Establish milestones and dependencies
      source: prompts/tasks.yaml#technical_discovery.timeline_discovery
      requires_data:
      - source: read-infohub
        fields: [opportunity_timeline, project_milestones, account_context]
        priority: critical
      - source: read-communications
        fields: [deadline_discussions, timeline_commitments, scheduling_threads]
        priority: enrichment
    sa-discovery-synthesis:
      description: Synthesize findings into actionable summary
      source: prompts/tasks.yaml#technical_discovery.discovery_synthesis
      requires_data:
      - source: read-infohub
        fields: [account_context, opportunity_details, risk_register]
        priority: enrichment
    sa-discovery-debrief:
      description: Post-discovery debrief and next steps
      source: prompts/tasks.yaml#technical_discovery.discovery_debrief
      requires_data:
      - source: read-infohub
        fields: [account_context, discovery_summary, open_gaps]
        priority: enrichment
  boundaries:
    - Technical discovery and requirements gathering only, does not design solutions
    - Does not assess technical risk or architecture health
    - Does not create customer success plans or adoption timelines
    - Does not make commitments about product capabilities or roadmap
    - Does not replace human discovery conversations with customers

  permissions:
    - Read account context and opportunity details from InfoHub
    - Read prior discovery notes and stakeholder maps
    - Read communications for meeting context and background
    - Synthesize discovery findings into structured summaries
    - Flag discovery gaps and red flags for SA review

  guardrails:
    input_validation:
    - rule: Discovery must reference a specific account and opportunity
    - rule: Reject requests without meeting context or account background
    output_checks:
    - rule: Every requirement traces to a business driver
    - rule: Stakeholder map covers all decision and influence roles
    - rule: Timeline accounts for dependencies and resource constraints
    signal_validation:
    - rule: Red flags must reference specific evidence from discovery
    - rule: Gap claims identify what information is missing and how to get it
  knowledge:
    scope:
      domains: [discovery, requirements, stakeholder-mapping]
      archetypes: [enterprise, mid-market]
    references:
    - path: references/discovery-methodology.yaml
      description: Discovery dimensions, question frameworks, red flags, synthesis templates
    - path: references/signal-detection.yaml
      description: Technical Risks, Technical Decisions, Architecture Patterns
    - path: references/specialist-triggers.yaml
      description: When To Flag, Domains
  error_handling:
    tool_failures:
      critical: [read-communications]
      enrichment: [read-infohub, read-intelligence]
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  autonomy:
    triggers:
    - type: parent_dispatch
      source: sa-agent
      description: SA orchestrator routes discovery requests
    - type: event
      source: crm_webhook
      condition: opportunity.stage == STAGE_1 AND opportunity.type == new_business
      description: Auto-activates for new business opportunities entering pipeline
    outputs:
    - type: parent_return
      target: sa-agent
      payload: [discovery_summary, stakeholder_map, requirements, gaps]
      description: Full discovery synthesis back to SA orchestrator
    - type: trigger_agent
      target: sa-csp-agent
      condition: opportunity.stage >= STAGE_2 AND opportunity.arr >= 100000
      payload: [discovery_summary, requirements, stakeholders]
      description: Discovery completion triggers CSP initiation for qualifying deals
    - type: notify_human
      condition: discovery.critical_gaps > 0 OR discovery.red_flags > 2
      channel: alert
      description: Critical gaps or multiple red flags surface for SA review
    dependencies: []
