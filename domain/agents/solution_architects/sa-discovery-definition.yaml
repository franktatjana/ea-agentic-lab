agentspec_version: 26.1.0
component_type: Agent
id: sa-discovery-agent
name: SA Discovery Agent
description: 'Conducts structured technical discovery covering business outcomes, current state, requirements, stakeholders, and timeline. Manages the full discovery lifecycle: initial structured discovery, targeted follow-up sessions for gap closure, async synthesis from inbound artifacts, and periodic refresh when context drifts. Synthesizes findings into actionable summaries that drive architecture recommendations and solution design.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: sa-agent
  tags:
  - discovery
  - requirements
  - architecture
  - stakeholders
  responsibility: Conduct thorough technical discovery, maintain discovery freshness through follow-ups and refresh cycles, and produce actionable synthesis
system_prompt: 'You are a Technical Discovery Agent, part of the Solution Architect intelligence

  system. You manage the full discovery lifecycle across four flows.


  FLOW ROUTING:

  - technical-discovery: Full structured discovery across five dimensions (new accounts, new opportunities)

  - follow-up-discovery: Targeted gap closure from prior discovery (open gaps exist, follow-up scheduled)

  - async-discovery-synthesis: Evidence extraction from inbound artifacts without live session (RFIs, diagrams, questionnaires)

  - discovery-refresh: Re-validation when discovery has aged or context signals indicate drift


  You MUST:

  - Cover all discovery dimensions: business outcomes, current state, requirements, stakeholders, timeline

  - Link every requirement to a business driver

  - Identify red flags in current state and requirements

  - Map stakeholder roles, influence, and engagement willingness

  - Synthesize into actionable summary with recommended next steps

  - Flag gaps that need follow-up discovery sessions

  - Track discovery freshness and trigger refresh when context drifts

  - Integrate async evidence from documents and communications between live sessions


  You MUST NOT:

  - Assess commercial viability (AE Agent''s domain)

  - Design solutions during discovery (premature commitment)

  - Skip stakeholder mapping even for "technical-only" engagements

  - Assume requirements without customer validation

  - Treat follow-up sessions as full discovery (focus on gaps, not re-covering known ground)

  - Accept artifact evidence at face value without confidence assessment


  When uncertain: document the gap, suggest discovery questions to resolve it,

  add [NEEDS DISCOVERY] marker.


  Tone: curious, structured, thorough.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-communications
  name: Read Communications
  description: 'Access Slack technical channels, email threads, and meeting transcripts for discovery evidence and stakeholder communication patterns.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: source_type
    type: string
  - title: time_period
    type: string
  outputs:
  - title: communications
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Cannot access communications, flag as data gap
    - error_code: NO_RECORDS
      guidance: No communications found for period, expand search or note gap
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured account data from the InfoHub vault. Use section parameter to target specific data: risks, decisions, stakeholders, competitive, governance, value, journey, opportunities,
    context, or frameworks.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: 'Access intelligence layer data for a realm. Sections: account (company profile, organigram, opportunity map), industry (profile, regulatory, trends), market (news digest), technology (current
    map, vendor landscape).

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: write-sa-artifact
  name: Write Solution Artifact
  description: Save discovery summaries and technical profiles to InfoHub
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from solution architect
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: discovery-intelligence
  name: Discovery Intelligence
  description: Discovery findings available to peer agents for engagement context
  tools:
  - id: get-discovery-summary
    name: Get Discovery Summary
    description: Returns synthesized discovery findings for an account
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: discovery_summary
      type: object
  - id: get-stakeholder-map
    name: Get Stakeholder Map
    description: Returns technical stakeholder map with roles and influence
    inputs:
    - title: account_name
      type: string
    outputs:
    - title: stakeholder_map
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: technical-discovery
  name: Technical Discovery
  playbook_refs:
  - PB_SA_001
  - PB_SA_002
  - PB_SA_003
  - PB_SA_005
  - PB_SA_006
  - PB_SA_007
  - PB_SA_008
  - PB_SA_009
  - PB_SA_010
  - PB_SA_011
  - PB_SA_012
  - PB_SA_013
  - PB_SA_014
  - PB_SA_015
  description: Conduct structured technical discovery covering business outcomes, current state, requirements, stakeholders, and timeline
  inputs:
  - title: account_context
    type: object
  - title: meeting_agenda
    type: string
  - title: attendees
    type: array
  outputs:
  - title: discovery_summary
    type: object
  - title: discovery_prep
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: sa-discovery-preparation
      input: account_name, opportunity_name
      description: Prepare discovery session with account context and research
      on_failure: stop
    - step: 2
      prompt: sa-business-outcomes-discovery
      input: account_name
      description: Discover business outcomes, success metrics, and drivers
      on_failure: stop
    - step: 3
      prompt: sa-current-state-discovery
      input: account_name
      description: Map current technical landscape, pain points, and workarounds
      on_failure: stop
    - step: 4
      prompt: sa-requirements-discovery
      input: account_name
      description: Gather and prioritize requirements using MoSCoW
      on_failure: stop
    - step: 5
      prompt: sa-stakeholder-discovery
      input: account_name, attendees
      description: Map stakeholder roles, influence, and engagement willingness
      on_failure: stop
    - step: 6
      prompt: sa-timeline-discovery
      input: account_name
      description: Establish milestones, dependencies, and deadline drivers
      on_failure: skip_with_warning
    - step: 7
      prompt: sa-discovery-synthesis
      input: account_name
      description: Synthesize all discovery dimensions into actionable summary
      on_failure: stop
    - step: 8
      prompt: sa-discovery-debrief
      input: account_name
      description: Post-discovery debrief, gap analysis, and next steps
      on_failure: skip_with_warning
    - step: 9
      action: persist
      tools:
      - write-sa-artifact
      description: Save discovery summary to InfoHub
      on_failure: stop
- component_type: Flow
  id: follow-up-discovery
  name: Follow-Up Discovery
  playbook_refs:
  - PB_SA_001
  - PB_SA_005
  description: Targeted discovery session focused on closing gaps identified in prior discovery. Loads the existing synthesis, generates questions for unresolved dimensions only, and produces an updated summary.
  inputs:
  - title: account_context
    type: object
  - title: prior_discovery_summary
    type: object
  - title: open_gaps
    type: array
  outputs:
  - title: updated_discovery_summary
    type: object
  - title: remaining_gaps
    type: array
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: sa-followup-gap-assessment
      input: account_name, prior_discovery_summary, open_gaps
      description: Load prior synthesis and identify which dimensions need follow-up, prioritize by deal impact
      on_failure: stop
    - step: 2
      prompt: sa-followup-targeted-questions
      input: account_name, gap_dimensions, stakeholder_map
      description: Generate targeted questions for each open gap, mapped to the stakeholders who can answer them
      on_failure: stop
    - step: 3
      prompt: sa-followup-evidence-integration
      input: account_name, new_findings, prior_discovery_summary
      description: Integrate new findings into existing discovery summary, reconcile contradictions
      on_failure: stop
    - step: 4
      prompt: sa-followup-delta-report
      input: account_name, updated_summary, prior_discovery_summary
      description: Produce delta report showing what changed, what closed, what remains open
      on_failure: skip_with_warning
    - step: 5
      action: persist
      tools:
      - write-sa-artifact
      description: Save updated discovery summary and delta report to InfoHub
      on_failure: stop
- component_type: Flow
  id: async-discovery-synthesis
  name: Async Discovery Synthesis
  playbook_refs:
  - PB_SA_001
  - PB_SA_005
  description: Synthesize discovery evidence from documents and communications when no live session is scheduled. Processes inbound artifacts (RFI responses, architecture diagrams, questionnaires, email threads) into structured discovery dimensions.
  inputs:
  - title: account_context
    type: object
  - title: artifact_refs
    type: array
  - title: artifact_type
    type: string
  outputs:
  - title: discovery_extract
    type: object
  - title: updated_discovery_summary
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: sa-async-artifact-ingestion
      input: account_name, artifact_refs, artifact_type
      description: Ingest and classify inbound artifacts, extract discovery-relevant content
      on_failure: stop
    - step: 2
      prompt: sa-async-dimension-mapping
      input: account_name, extracted_content, existing_discovery_summary
      description: Map extracted content to discovery dimensions, flag new evidence vs. confirmation vs. contradiction
      on_failure: stop
    - step: 3
      prompt: sa-async-confidence-assessment
      input: account_name, dimension_mapping
      description: Assess confidence level per dimension based on evidence quality and source credibility
      on_failure: skip_with_warning
    - step: 4
      prompt: sa-async-synthesis-update
      input: account_name, dimension_mapping, existing_discovery_summary
      description: Merge new evidence into discovery summary, mark updated dimensions and remaining gaps
      on_failure: stop
    - step: 5
      action: persist
      tools:
      - write-sa-artifact
      description: Save updated discovery summary and artifact extraction log to InfoHub
      on_failure: stop
- component_type: Flow
  id: discovery-refresh
  name: Discovery Refresh
  playbook_refs:
  - PB_SA_001
  - PB_SA_005
  description: Re-validate an existing discovery summary when significant time has passed or context has shifted. Checks for new signals, stakeholder changes, requirement drift, and competitive landscape shifts since the last discovery pass.
  inputs:
  - title: account_context
    type: object
  - title: existing_discovery_summary
    type: object
  - title: refresh_trigger
    type: string
  outputs:
  - title: refreshed_discovery_summary
    type: object
  - title: drift_report
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: sa-refresh-staleness-scan
      input: account_name, existing_discovery_summary
      description: Scan communications, signals, and CRM data for changes since last discovery timestamp
      on_failure: stop
    - step: 2
      prompt: sa-refresh-stakeholder-validation
      input: account_name, stakeholder_map
      description: Validate stakeholder map against recent communications, flag role changes, departures, new entrants
      on_failure: skip_with_warning
    - step: 3
      prompt: sa-refresh-requirements-drift
      input: account_name, requirements, recent_communications
      description: Detect requirements drift by comparing original requirements against recent customer statements and signals
      on_failure: stop
    - step: 4
      prompt: sa-refresh-competitive-check
      input: account_name, competitive_landscape
      description: Check for new competitive signals or vendor mentions since last discovery
      on_failure: skip_with_warning
    - step: 5
      prompt: sa-refresh-drift-synthesis
      input: account_name, staleness_findings, stakeholder_changes, requirement_drift, competitive_changes
      description: Synthesize all drift findings into a delta report with recommended actions
      on_failure: stop
    - step: 6
      action: persist
      tools:
      - write-sa-artifact
      description: Save refreshed discovery summary and drift report to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - technical-discovery
    - follow-up-discovery
    - async-discovery-synthesis
    - discovery-refresh
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'Discovery is a human conversation, not a data extraction exercise. The SA brings domain expertise, builds trust through credibility, reads non-verbal cues, and asks follow-up
      questions no script could anticipate. The agent structures and synthesizes, but the SA creates the conditions where customers share what really matters.

      '
    challenges:
    - text: Customers share surface-level requirements without revealing the real business pain driving the project
      specific_overhead:
      - Manually reviewing weeks of email threads and Slack channels to prepare for a discovery session
    - text: Key stakeholders skip discovery sessions, leaving gaps in requirements and influence mapping
      specific_overhead:
      - Synthesizing five discovery dimensions into a coherent summary after each session
    - text: Prior discovery notes are scattered across emails, Slack, and meeting transcripts with no synthesis
      specific_overhead:
      - Cross-referencing stakeholder statements across multiple meetings to detect contradictions
    - text: Distinguishing confirmed requirements from aspirational wishlists when customers present both as must-haves
      specific_overhead:
      - Tracking which discovery gaps remain open and scheduling follow-up sessions to close them
    - text: Discovery findings go stale during long sales cycles, but no one re-validates until a late-stage surprise
      specific_overhead:
      - Manually comparing current customer statements against discovery notes from months ago
    - text: Customers send RFI responses, architecture diagrams, and questionnaires between sessions, but the evidence never makes it into the discovery summary
      specific_overhead:
      - Manually extracting discovery-relevant content from inbound documents and updating the summary
    administrative_overhead:
    - Manually reviewing weeks of email threads and Slack channels to prepare for a discovery session
    - Synthesizing five discovery dimensions into a coherent summary after each session
    - Cross-referencing stakeholder statements across multiple meetings to detect contradictions
    - Tracking which discovery gaps remain open and scheduling follow-up sessions to close them
    - Manually comparing current customer statements against discovery notes from months ago to detect drift
    - Extracting discovery-relevant content from inbound artifacts and reconciling with existing summary
    scenarios:
    - problem: Customers share surface-level requirements without revealing the real business pain driving the project
      why: 'When discovery stays at the feature level, the SA designs a solution that checks boxes but misses the business outcome the customer actually needs. The deal stalls in evaluation because the
        proposal never connects to what the economic buyer cares about.

        '
      agent: sa-discovery-agent
      agent_response: 'Prepares discovery sessions with research-backed context on the customer''s industry, current technology landscape, and known pain points. Generates targeted questions that probe
        beyond feature requests to uncover business drivers and success metrics.

        '
      success_signal:
        metric: Business drivers identified and linked to requirements
        target: 100% of requirements trace to at least one business driver
        leading_indicator: Customer confirms business outcome alignment in follow-up meeting
        failure_signal: Discovery summary lists features without any business driver linkage
    - problem: Prior discovery notes are scattered across emails, Slack, and meeting transcripts with no synthesis
      why: 'When an SA picks up an account mid-cycle or prepares for a follow-up session, there is no single source of truth for what was already discovered. Time gets wasted re-asking questions, and customers
        lose confidence when the vendor appears unprepared.

        '
      agent: sa-discovery-agent
      agent_response: 'Aggregates communications, meeting transcripts, and prior discovery notes into a structured preparation brief. Highlights open gaps, confirmed requirements, and stakeholder positions
        so the SA walks into the session fully informed.

        '
      success_signal:
        metric: Discovery preparation brief available before session
        target: 100% of discovery sessions have a preparation brief generated from prior data
        leading_indicator: SA reports no redundant questions needed in follow-up sessions
        failure_signal: Customer raises previously-answered topics that the SA missed
    - problem: Key stakeholders skip discovery sessions, leaving gaps in requirements and influence mapping
      why: 'When decision-makers or technical influencers miss discovery sessions, the requirements gathered represent only a partial view. The SA builds a solution that satisfies the people in the room
        but misses constraints or priorities held by absent stakeholders. These gaps surface late in the cycle as objections that could have been addressed early.

        '
      agent: sa-discovery-agent
      agent_response: 'Cross-references meeting attendees against the stakeholder map to identify missing participants after each discovery session. Generates a gap report listing which discovery dimensions
        lack input from key roles, and suggests targeted follow-up questions to address the specific gaps created by each absent stakeholder.

        '
      success_signal:
        metric: Stakeholder coverage across discovery sessions
        target: All decision-makers and technical influencers contribute to at least one discovery session
        leading_indicator: Stakeholder gap report generated within 24h of each discovery session
        failure_signal: Late-stage objection raised by a stakeholder who was never included in discovery
    - problem: Distinguishing confirmed requirements from aspirational wishlists when customers present both as must-haves
      why: 'Customers often describe future-state aspirations with the same urgency as immediate needs. When an SA treats all stated requirements as equal, the solution scope inflates beyond what the budget
        and timeline can support. The proposal either gets rejected for being too expensive or the team commits to delivering capabilities the customer does not actually need for the initial deployment.

        '
      agent: sa-discovery-agent
      agent_response: 'Applies MoSCoW prioritization to every requirement and cross-references each one against stated business drivers and timeline constraints. Flags requirements that lack a direct business
        driver linkage or that conflict with the stated go-live timeline as candidates for deferral, giving the SA clear data to negotiate scope with the customer.

        '
      success_signal:
        metric: Requirements prioritized with business driver linkage
        target: 100% of requirements classified using MoSCoW with business driver traceability
        leading_indicator: Customer validates prioritization before solution design begins
        failure_signal: Solution proposal includes aspirational requirements that inflate scope beyond budget
    - problem: Follow-up discovery sessions re-cover already-known ground instead of targeting specific gaps
      why: 'Without a structured gap report from the prior session, the SA defaults to running a mini version of the full discovery. Customers notice the repetition and disengage, reading it as a sign that the vendor is disorganized or not listening. The follow-up session produces diminishing returns while consuming a meeting slot that could have advanced the deal.

        '
      agent: sa-discovery-agent
      agent_response: 'Loads the prior discovery synthesis and open gap list, generates targeted questions mapped to the specific stakeholders who can answer them, and produces a focused session plan that covers only unresolved dimensions. After the session, produces a delta report showing what closed and what remains open.

        '
      success_signal:
        metric: Gap closure rate per follow-up session
        target: At least 50% of open gaps closed per follow-up session
        leading_indicator: Follow-up session agenda references specific gaps, not broad discovery dimensions
        failure_signal: Customer hears the same questions they answered in a prior session
    - problem: Customers send technical artifacts between meetings but the evidence never reaches the discovery summary
      why: 'RFI responses, architecture diagrams, and security questionnaires contain rich discovery evidence, but processing them requires manual extraction and cross-referencing against existing discovery dimensions. When these artifacts sit unprocessed, the SA walks into the next session without the context the customer already provided, eroding trust and wasting session time.

        '
      agent: sa-discovery-agent
      agent_response: 'Automatically ingests inbound artifacts, classifies them by type, extracts discovery-relevant content, maps it to discovery dimensions with confidence scores, and merges the evidence into the existing summary. The SA sees an updated discovery state before the next interaction without manual extraction work.

        '
      success_signal:
        metric: Artifact evidence integration latency
        target: Inbound artifacts processed and merged into discovery summary within 4 hours of receipt
        leading_indicator: Discovery summary reflects artifact evidence before next customer interaction
        failure_signal: SA asks questions in a session that the customer already answered in a submitted document
    - problem: Discovery findings go stale during long sales cycles and no one notices until a late-stage surprise
      why: 'Enterprise deals can span 6-12 months. During that time, stakeholders change roles, requirements evolve, and competitive dynamics shift. If the discovery summary from month two is still treated as current in month eight, the solution proposal can miss critical changes. Late-stage surprises, a new CTO with different priorities, a competitor that entered the picture, requirements that shifted after an org change, force expensive rework or kill the deal entirely.

        '
      agent: sa-discovery-agent
      agent_response: 'Monitors discovery age against opportunity activity. When discovery exceeds 30 days on an active deal, scans communications and signals for changes in stakeholders, requirements, and competitive landscape. Produces a drift report highlighting what changed and recommending whether a targeted follow-up or full re-discovery is needed.

        '
      success_signal:
        metric: Discovery freshness on active opportunities
        target: No active opportunity has discovery older than 45 days without a refresh or drift acknowledgment
        leading_indicator: Drift report generated proactively before SA encounters a surprise
        failure_signal: Late-stage deal surprise traceable to stale discovery that was never refreshed
  escalation_triggers:
  - Critical discovery gaps found (3+ unresolved dimensions after session)
  - Red flags in requirements that conflict with product capabilities
  - Key stakeholder unwilling to participate in discovery
  - No business driver identified after initial discovery pass
  - Discovery refresh reveals high-severity drift (stakeholder departure, major requirement change)
  - Async artifact contradicts existing discovery findings with high confidence
  prompt_registry:
    sa-discovery-preparation:
      description: Prepare for structured technical discovery session
      source: prompts/tasks.yaml#technical_discovery.discovery_preparation
      inputs:
      - title: account_name
        type: string
