  boundaries:
  - Technical discovery and requirements gathering only, does not design solutions
  - Does not assess technical risk or architecture health
  - Does not create customer success plans or adoption timelines
  - Does not make commitments about product capabilities or roadmap
  - Does not replace human discovery conversations with customers
  permissions:
  - Read account context and opportunity details from InfoHub
  - Read prior discovery notes and stakeholder maps
  - Read communications for meeting context and background
  - Synthesize discovery findings into structured summaries
  - Flag discovery gaps and red flags for SA review
  guardrails:
    input_validation:
    - rule: Discovery must reference a specific account and opportunity
    - rule: Reject requests without meeting context or account background
    output_checks:
    - rule: Every requirement traces to a business driver
    - rule: Stakeholder map covers all decision and influence roles
    - rule: Timeline accounts for dependencies and resource constraints
    signal_validation:
    - rule: Red flags must reference specific evidence from discovery
    - rule: Gap claims identify what information is missing and how to get it
  knowledge:
    scope:
      domains:
      - discovery
      - requirements
      - stakeholder-mapping
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/discovery-methodology.yaml
      description: Discovery dimensions, question frameworks, red flags, synthesis templates
    - path: references/signal-detection.yaml
      description: Technical Risks, Technical Decisions, Architecture Patterns
    - path: references/specialist-triggers.yaml
      description: When To Flag, Domains
  error_handling:
    tool_failures:
      critical:
      - read-communications
      enrichment:
      - read-infohub
      - read-intelligence
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  autonomy:
    triggers:
    - type: parent_dispatch
      source: sa-agent
      description: SA orchestrator routes discovery requests
    - type: event
      source: crm_webhook
      condition: opportunity.stage == STAGE_1 AND opportunity.type == new_business
      description: Auto-activates technical-discovery for new business opportunities entering pipeline
      flow: technical-discovery
    - type: event
      source: discovery_summary
      condition: discovery.open_gaps > 0 AND discovery.follow_up_session_scheduled == true
      description: Auto-activates follow-up-discovery when gaps exist and a follow-up session is scheduled
      flow: follow-up-discovery
    - type: event
      source: artifact_received
      condition: artifact.type IN [rfi_response, architecture_diagram, technical_questionnaire, security_questionnaire] AND discovery_summary.exists == true
      description: Auto-activates async-discovery-synthesis when discovery-relevant artifacts arrive for an account with existing discovery
      flow: async-discovery-synthesis
    - type: schedule
      source: discovery_summary
      condition: discovery.age_days > 30 AND opportunity.stage < CLOSED AND opportunity.last_activity_days < 14
      description: Auto-activates discovery-refresh when discovery is older than 30 days on an active opportunity
      flow: discovery-refresh
    - type: event
      source: signal_detection
      condition: signal.type IN [SIG_STAKEHOLDER_CHANGE, SIG_REQUIREMENT_DRIFT, SIG_COMPETITIVE_THREAT] AND discovery_summary.exists == true
      description: Auto-activates discovery-refresh when signals indicate context has shifted
      flow: discovery-refresh
    outputs:
    - type: parent_return
      target: sa-agent
      payload:
      - discovery_summary
      - stakeholder_map
      - requirements
      - gaps
      description: Full discovery synthesis back to SA orchestrator
    - type: parent_return
      target: sa-agent
      flow: follow-up-discovery
      payload:
      - updated_discovery_summary
      - remaining_gaps
      - delta_report
      description: Updated discovery with gap closure progress
    - type: parent_return
      target: sa-agent
      flow: async-discovery-synthesis
      payload:
      - updated_discovery_summary
      - discovery_extract
      description: Discovery evidence extracted from async artifacts
    - type: parent_return
      target: sa-agent
      flow: discovery-refresh
      payload:
      - refreshed_discovery_summary
      - drift_report
      description: Refreshed discovery with drift analysis
    - type: trigger_agent
      target: sa-csp-agent
      condition: opportunity.stage >= STAGE_2 AND opportunity.arr >= 100000
      payload:
      - discovery_summary
      - requirements
      - stakeholders
      description: Discovery completion triggers CSP initiation for qualifying deals
    - type: trigger_agent
      target: sa-engagement-agent
      flow: follow-up-discovery
      condition: remaining_gaps > 0 AND remaining_gaps.requires_live_session == true
      payload:
      - remaining_gaps
      - recommended_session_format
      description: Remaining gaps that need live engagement route to engagement agent for session planning
    - type: notify_human
      condition: discovery.critical_gaps > 0 OR discovery.red_flags > 2
      channel: alert
      description: Critical gaps or multiple red flags surface for SA review
    - type: notify_human
      flow: discovery-refresh
      condition: drift_report.severity == HIGH OR drift_report.stakeholder_changes > 0
      channel: alert
      description: High-severity drift or stakeholder changes surface for SA review
    dependencies: []
