agentspec_version: 26.1.0
component_type: Agent
id: sa-best-practices-agent
name: SA Best Practices Agent
description: >
  Manages the best practices knowledge base: creates new practices from the standard
  template, prepares meeting content from practices, generates Q&A sections, updates
  existing practices with new information, and identifies gaps in coverage by solution area.
metadata:
  definition_version: "0.1.0"
  parent_agent: sa-agent
  tags:
  - best-practices
  - knowledge
  - documentation
  - gap-analysis
  responsibility: Maintain a current, complete, and actionable best practices knowledge base
system_prompt: |
  You are a Best Practices Agent, part of the Solution Architect intelligence
  system. Your job is to keep the knowledge base useful and current.

  You MUST:
  - Follow the standard template structure for all new best practices
  - Ensure every recommendation cites product documentation or validated testing
  - Include common pitfalls with specific symptoms and remediation
  - Verify currency (compatible with current product version, no deprecated features)
  - Prioritize gaps by customer frequency and deal impact

  You MUST NOT:
  - Create practices for deprecated features or versions
  - Include unverified recommendations (every claim needs a source)
  - Skip the Q&A section (customers always have questions)
  - Duplicate content that exists in product documentation

  When uncertain about a recommendation: add [NEEDS VALIDATION] marker,
  cite the closest documentation reference.

  Tone: instructional, practical, reproducible.
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: >
    Access structured account data from the InfoHub vault. Use section parameter
    to target specific data: risks, decisions, stakeholders, competitive,
    governance, value, journey, opportunities, context, or frameworks.
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist for this account, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-intelligence
  name: Read Intelligence
  description: >
    Access intelligence layer data for a realm. Sections: account (company profile,
    organigram, opportunity map), industry (profile, regulatory, trends),
    market (news digest), technology (current map, vendor landscape).
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: intelligence_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Skip intelligence enrichment, proceed with core data
    - error_code: SECTION_NOT_FOUND
      guidance: Intelligence section unavailable, note gap in output
    - error_code: STALE_DATA
      guidance: Intelligence may be outdated, flag for refresh
- component_type: ClientTool
  id: write-sa-artifact
  name: Write Solution Artifact
  description: Save best practices and gap reports to knowledge base
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from solution architect
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: best-practices-intelligence
  name: Best Practices Intelligence
  description: Best practice content available to peer agents for meeting prep and customer guidance
  tools:
  - id: get-best-practice
    name: Get Best Practice
    description: Returns best practice content for a solution area or topic
    inputs:
    - title: topic
      type: string
    outputs:
    - title: best_practice
      type: object
  - id: get-practice-gaps
    name: Get Practice Gaps
    description: Returns gap analysis showing missing best practices by solution area
    inputs:
    - title: solution_area
      type: string
    outputs:
    - title: gaps
      type: array
specialized_agents: []
flows:
- component_type: Flow
  id: best-practices
  name: Best Practices
  playbook_refs: [PB_SA_003, PB_SA_006, PB_SA_009, PB_SA_010, PB_SA_011, PB_SA_012, PB_SA_014, PB_SA_015]
  description: Create, update, and maintain best practices knowledge base
  inputs:
  - title: best_practice_topic
    type: string
  - title: solution_area
    type: string
  - title: account_name
    type: string
  - title: customer_context
    type: string
  outputs:
  - title: best_practices_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: sa-create-best-practice
      input: topic, solution_area, audience
      description: Document a new best practice following the standard template
      on_failure: skip_with_warning
    - step: 2
      prompt: sa-meeting-prep-from-best-practice
      input: account_name, meeting_topic, best_practice_name, customer_context
      description: Prepare for customer meeting using best practice content
      on_failure: stop
    - step: 3
      prompt: sa-generate-qa-content
      input: best_practice_topic, existing_qa, recent_interactions
      description: Create or update Q&A section for a best practice
      on_failure: skip_with_warning
    - step: 4
      prompt: sa-update-best-practice
      input: topic, current_version_link, new_info
      description: Refresh best practice with new information
      on_failure: skip_with_warning
    - step: 5
      prompt: sa-best-practice-gap-analysis
      input: solution_area, existing_list, use_cases
      description: Identify missing best practices for solution area
      on_failure: skip_with_warning
    - step: 6
      action: persist
      tools:
      - write-sa-artifact
      description: Save best practice content to knowledge base
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - best-practice-creation
    - best-practice-maintenance
    - gap-analysis
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: >
      Best practices must be validated in real customer environments before
      becoming guidance. The SA applies judgment on when a practice applies,
      when it doesn't, and what adaptation is needed for each customer's
      specific constraints and architecture. The agent maintains the knowledge
      base, but the SA decides what belongs in it.
    challenges:
      - "Best practices become stale as product versions evolve but no one owns the update cycle"
      - "SAs repeat the same guidance in meetings without a reusable, structured artifact to share"
      - "Coverage gaps exist for high-frequency solution areas that customers ask about regularly"
      - "Recommendations lack citations to product documentation, making them hard to validate or trust"
    administrative_overhead:
      - "Manually searching product docs and release notes to verify a recommendation is still current"
      - "Writing meeting prep content from scratch when a reusable best practice already covers the topic"
      - "Compiling Q&A sections by hunting through past customer interactions for common questions"
      - "Auditing the knowledge base periodically to find deprecated content that customers may still follow"
    scenarios:
      - problem: "Best practices become stale as product versions evolve but no one owns the update cycle"
        why: >
          When a major product release changes configuration defaults or deprecates a feature,
          existing best practices silently become wrong. SAs unknowingly share outdated guidance,
          customers hit issues during implementation, and trust in the vendor's expertise erodes.
        agent: sa-best-practices-agent
        agent_response: >
          Monitors product releases for breaking changes and flags affected best practices
          for review. Runs currency checks against the current product version and marks
          deprecated content with remediation guidance so the SA can prioritize updates.
        success_signal:
          metric: "Best practices verified against current product version"
          target: "100% of active best practices pass currency check within 30 days of a major release"
          leading_indicator: "Flagged practices are reviewed and updated before the next customer meeting"
          failure_signal: "Customer encounters deprecated guidance during implementation"
      - problem: "Coverage gaps exist for high-frequency solution areas that customers ask about regularly"
        why: >
          When customers repeatedly ask about a topic and the SA has no documented best practice
          to reference, every response is improvised. Quality varies by SA, answers may contradict
          each other, and the organization never builds institutional knowledge on its most common use cases.
        agent: sa-best-practices-agent
        agent_response: >
          Analyzes customer interaction frequency and pain point data to identify solution areas
          with no documented best practice. Prioritizes gaps by customer frequency and deal
          impact, then generates draft best practices from the standard template for SA review.
        success_signal:
          metric: "Coverage ratio of best practices to high-frequency solution areas"
          target: "Best practice exists for top 10 most-asked solution areas"
          leading_indicator: "Gap report identifies missing practices before SAs encounter the gap in meetings"
          failure_signal: "SA improvises guidance on a topic that multiple customers have asked about"
      - problem: "SAs repeat the same guidance in meetings without a reusable, structured artifact to share"
        why: >
          When best practice content lives only in an SA's head, the quality of guidance depends on
          who delivers it. Customers in different accounts receive inconsistent recommendations for
          the same use case, and every meeting requires the SA to reconstruct the same talking points
          from scratch instead of focusing on customer-specific adaptation.
        agent: sa-best-practices-agent
        agent_response: >
          Creates structured, reusable best practice artifacts from the standard template that SAs
          can reference and share directly with customers. Prepares meeting-ready content from
          existing best practices tailored to the specific account context, eliminating the need
          to rebuild guidance from memory each time.
        success_signal:
          metric: "Best practice artifacts reused across customer meetings"
          target: "80% of recurring guidance topics have a published best practice artifact available"
          leading_indicator: "SA references an existing best practice artifact during meeting prep instead of writing from scratch"
          failure_signal: "SA creates ad hoc guidance for a topic that already has a documented best practice"
      - problem: "Recommendations lack citations to product documentation, making them hard to validate or trust"
        why: >
          When a best practice says "configure X this way" without referencing the product documentation
          that supports the recommendation, customers cannot independently verify the guidance. Internal
          teams cannot distinguish validated advice from opinion, and outdated recommendations persist
          because there is no documentation link to check against new releases.
        agent: sa-best-practices-agent
        agent_response: >
          Enforces citation requirements on every recommendation within a best practice. Verifies
          each citation against current product documentation and flags recommendations where the
          supporting documentation has changed or been removed. Marks uncitable claims with
          [NEEDS VALIDATION] so the SA can prioritize verification.
        success_signal:
          metric: "Recommendations with valid product documentation citations"
          target: "100% of active recommendations cite current product documentation or validated testing"
          leading_indicator: "New best practices pass citation check before publication"
          failure_signal: "Customer follows a recommendation that contradicts current product documentation"
  escalation_triggers:
    - "Deprecated content found that customers may still be following"
    - "Recommendation contradicts a known customer constraint"
    - "Gap analysis reveals high-frequency solution area with no documented practice"
    - "Practice currency cannot be verified against current product version"
  prompt_registry:
    sa-create-best-practice:
      description: Document a new best practice
      source: prompts/tasks.yaml#best_practices.create_best_practice
      requires_data:
      - source: read-intelligence
        fields: [technology_current_map, vendor_landscape]
        priority: enrichment
    sa-meeting-prep-from-best-practice:
      description: Prepare meeting content from best practices
      source: prompts/tasks.yaml#best_practices.meeting_prep_from_best_practice
      requires_data:
      - source: read-infohub
        fields: [stakeholder_map, account_context, use_cases]
        priority: enrichment
      - source: read-intelligence
        fields: [industry_profile, account_company_profile]
        priority: enrichment
    sa-generate-qa-content:
      description: Create or update Q&A section
      source: prompts/tasks.yaml#best_practices.generate_qa_content
      requires_data:
      - source: read-infohub
        fields: [customer_interactions, common_questions]
        priority: enrichment
      - source: read-intelligence
        fields: [industry_trends, regulatory_requirements]
        priority: enrichment
    sa-update-best-practice:
      description: Refresh best practice with new information
      source: prompts/tasks.yaml#best_practices.update_best_practice
      requires_data:
      - source: read-intelligence
        fields: [technology_current_map, product_version_compatibility]
        priority: enrichment
    sa-best-practice-gap-analysis:
      description: Identify missing best practices
      source: prompts/tasks.yaml#best_practices.best_practice_gap_analysis
      requires_data:
      - source: read-infohub
        fields: [use_case_frequency, customer_pain_points]
        priority: enrichment
      - source: read-intelligence
        fields: [industry_trends, market_news_digest]
        priority: enrichment
  boundaries:
    - Best practices management only, does not conduct customer discovery
    - Does not assess technical risk or architecture health
    - Does not make product roadmap commitments
    - Does not create content without documented evidence or validated testing
    - Does not modify practices without versioning and change tracking

  permissions:
    - Read existing best practices and knowledge base from InfoHub
    - Read product documentation and release notes from intelligence sources
    - Create new best practices from the standard template
    - Update existing practices with new information and version tracking
    - Identify coverage gaps by solution area and recommend priorities

  guardrails:
    input_validation:
    - rule: New practices require solution area and target audience
    - rule: Updates must reference the current version being modified
    output_checks:
    - rule: Every recommendation cites documentation or validated testing
    - rule: Implementation steps are reproducible without vendor assistance
    - rule: Pitfalls include specific symptoms and remediation
    signal_validation:
    - rule: Currency claims must reference product version compatibility
    - rule: Gap prioritization must cite customer frequency data
  knowledge:
    scope:
      domains: [best-practices, knowledge-management]
      archetypes: [enterprise, mid-market, regulated-industries]
    references:
    - path: references/best-practices-framework.yaml
      description: Best practice template structure, quality criteria, update triggers
    - path: references/glossary-and-resources.md
      description: Glossary And Resources
  error_handling:
    tool_failures:
      critical: []
      enrichment: [read-infohub, read-intelligence]
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without critical data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  autonomy:
    triggers:
    - type: parent_dispatch
      source: sa-agent
      description: SA orchestrator routes best practice requests
    - type: event
      source: product_release
      condition: release.has_breaking_changes == true
      description: Product releases with breaking changes trigger practice review
    outputs:
    - type: parent_return
      target: sa-agent
      payload: [practice_content, gap_report, update_summary]
      description: Best practice content back to SA orchestrator
    - type: notify_human
      condition: practice.has_deprecated_content == true OR gap.priority == HIGH
      channel: alert
      description: Deprecated content and high-priority gaps surface for SA review
    dependencies: []
