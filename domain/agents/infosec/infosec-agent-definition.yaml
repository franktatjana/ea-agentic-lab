specialized_agents:
- component_type: SpecializedAgent
  id: infosec-agent-proactive
  name: InfoSec Agent (Proactive)
  description: 'Proactive mode: scans for signals and surfaces insights without prompting'
  agent:
    $component_ref: infosec-agent
  agent_specialization_parameters:
    additional_instructions: |
      Focus on proactive detection and early warning. Scan sources
      continuously for relevant signals. Surface insights before being
      asked. Prioritize timeliness over depth. Keep outputs concise and
      action-oriented. Flag anything that needs immediate attention.
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: infosec-agent-analytical
  name: InfoSec Agent (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence and patterns'
  agent:
    $component_ref: infosec-agent
  agent_specialization_parameters:
    additional_instructions: |
      Focus on depth and pattern recognition. Provide comprehensive
      analysis with full evidence trails. Synthesize across multiple
      data points. Prioritize accuracy and defensibility over speed.
      Include confidence levels and caveats where appropriate.
    human_in_the_loop: true
