# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:
  profile:
    human_matters_summary: >
      Security compliance is process; security judgment is business context. The
      agent completes questionnaires and classifies gaps, but the security leader
      understands which gaps are deal-blockers, which have creative workarounds,
      and how much risk tolerance the organization has. The gaps are classified,
      but human judgment decides which ones matter.
    scenarios:
      - problem: "Security questionnaire responses are inconsistent and slow, delaying deal cycles"
        why: >
          Enterprise customers send 200-400 question security questionnaires
          that require answers from multiple internal teams. Without a
          centralized, evidence-backed response library, each questionnaire
          starts from scratch, producing inconsistent answers that erode
          customer trust and add weeks to the sales cycle.
        agent: infosec-agent
        agent_response: >
          Maintains a response library mapped to common frameworks (SIG, CAIQ,
          custom). Drafts questionnaire responses using verified evidence from
          the compliance library, flags questions that require updated
          certification data, and routes gaps to the appropriate internal team
          for resolution.
        success_signal:
          metric: "Questionnaire turnaround time"
          target: "< 5 business days for standard questionnaires (SIG, CAIQ)"
          leading_indicator: "> 70% of questions auto-drafted from response library"
          failure_signal: "Questionnaire exceeds 10 business days or contains unverified claims"
      - problem: "Compliance gaps surface late in the deal and become blockers with no mitigation path"
        why: >
          When security requirements are not assessed early, the team discovers
          compliance gaps during legal review or final procurement stages.
          At that point, gaps become binary blockers because there is no time
          to develop compensating controls or plan a remediation roadmap.
        agent: infosec-agent
        agent_response: >
          Performs early gap assessment when customer security requirements
          first appear, classifying each gap using the four-tier framework
          (blocker, workaround, roadmap, compliant). For non-compliant areas,
          surfaces compensating controls and timeline-based remediation options
          before the gap reaches a deal-blocking stage.
        success_signal:
          metric: "Compliance gaps identified before legal/procurement stage"
          target: "> 90% of gaps classified with mitigation path before contract review"
          leading_indicator: "Gap assessment completed within 72h of receiving security requirements"
          failure_signal: "Deal blocked by compliance gap that was knowable earlier in the cycle"
      - problem: "Keeping certification and audit evidence current across multiple compliance frameworks"
        why: >
          Enterprise vendors maintain certifications across SOC 2, ISO 27001, FedRAMP,
          and industry-specific frameworks. Each has different renewal cycles, evidence
          requirements, and audit timelines. When evidence goes stale, questionnaire
          responses reference expired certifications and customer trust erodes.
        agent: infosec-agent
        agent_response: >
          The agent tracks certification renewal dates, audit cycles, and evidence
          expiration across all active compliance frameworks. It alerts the security
          team when evidence is approaching expiry, flags questionnaire responses that
          reference outdated certifications, and maintains a versioned evidence library
          linked to current audit status.
        success_signal:
          metric: "Certification evidence currency"
          target: "Zero questionnaire responses referencing expired or outdated certification evidence"
          leading_indicator: "Renewal alerts triggered at least 60 days before certification expiry"
          failure_signal: "Customer identifies an expired certification in a questionnaire response"
      - problem: "Translating technical security gaps into business risk language for non-technical stakeholders"
        why: >
          Security gaps are described in technical terms like missing encryption at rest
          or incomplete network segmentation. When these reach a CISO or procurement
          lead, the business impact is unclear. Without translation, technical gaps
          become perceived blockers instead of manageable risks with mitigation paths.
        agent: infosec-agent
        agent_response: >
          The agent maps technical security findings to business risk categories,
          translating each gap into impact language that non-technical stakeholders
          understand. It pairs each risk with a severity rating, a compensating control
          where applicable, and a remediation timeline so decision-makers can evaluate
          risk versus deal value.
        success_signal:
          metric: "Security risk communication effectiveness"
          target: "All customer-facing gap disclosures include business impact context and mitigation options"
          leading_indicator: "Non-technical stakeholders engage constructively with security findings instead of escalating"
          failure_signal: "Customer procurement rejects a deal based on a technical gap that had a viable mitigation path"
      - problem: "Managing data residency and sovereignty requirements that vary by geography and industry"
        why: >
          Data residency rules differ by country, region, and industry vertical. A
          configuration that works for a US healthcare customer fails for an EU financial
          services prospect. Tracking these variations manually leads to errors that
          surface during legal review, when the cost of correction is highest.
        agent: infosec-agent
        agent_response: >
          The agent maintains a data residency requirement matrix by geography and
          industry, cross-referenced with platform capabilities. It assesses each
          deal's residency posture early in the cycle, identifies gaps between customer
          requirements and available deployment options, and recommends architecture
          adjustments before legal review.
        success_signal:
          metric: "Data residency compliance assessment accuracy"
          target: "Residency posture assessed within 72 hours of customer requirements intake"
          leading_indicator: "No residency-related surprises during legal or procurement review"
          failure_signal: "Data residency gap discovered during contract negotiation that delays close by more than 2 weeks"
      - problem: "Coordinating responses across internal security, engineering, and legal teams under tight deadlines"
        why: >
          Security questionnaires and compliance assessments require input from multiple
          internal teams, each with their own priorities and response times. Under deal
          pressure, coordination gaps cause missed deadlines, incomplete responses, and
          inconsistent answers across sections written by different teams.
        agent: infosec-agent
        agent_response: >
          The agent decomposes security questionnaires by domain ownership, routes
          sections to the appropriate internal team with context and deadlines, and
          tracks response status across all contributors. It flags overdue sections,
          detects conflicting answers between teams, and consolidates responses into
          a consistent final document.
        success_signal:
          metric: "Cross-team response coordination efficiency"
          target: "All multi-team questionnaires completed within SLA with zero conflicting answers"
          leading_indicator: "Section owners acknowledge and begin drafting within 24 hours of routing"
          failure_signal: "Questionnaire deadline missed because one team's section was never started"
    challenges:
      - "Keeping certification and audit evidence current across multiple compliance frameworks"
      - "Translating technical security gaps into business risk language for non-technical stakeholders"
      - "Managing data residency and sovereignty requirements that vary by geography and industry"
      - "Coordinating responses across internal security, engineering, and legal teams under tight deadlines"
    administrative_overhead:
      - "Maintaining and versioning the security evidence library across certifications (SOC 2, ISO 27001, FedRAMP)"
      - "Tracking questionnaire status, ownership, and deadlines across multiple concurrent deals"
      - "Updating gap classification tiers as product capabilities and certifications evolve"
      - "Preparing security briefing materials tailored to each customer's regulatory context"

