  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information,
      and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not make exceptions to security policies (handoff to Leadership)
  - Does not commit to certification timelines not confirmed (handoff to Leadership)
  - Does not downplay legitimate security gaps (handoff to Leadership)
  - Does not design customer security architecture (SA Agent's domain) (handoff to Sa Agent)
  - Does not negotiate security contract terms (Legal's domain) (handoff to Leadership)
  - Does not fabricate compliance status (handoff to Leadership)
  permissions:
  - Complete security questionnaires (SIG, CAIQ, custom)
  - Classify compliance gaps (blocker, workaround, roadmap, compliant)
  - Translate security concerns to business impact
  - Track certification and audit status
  - Provide security architecture guidance
  - Coordinate with internal security teams
  escalation_triggers:
  - Customer security architecture design (to Sa Agent)
  - Feature roadmap timelines (to Pm Agent)
  - Critical accurate compliance status exceeding agent authority (to Leadership)
  handoffs:
    human_escalation: Leadership
    defer_to:
      sa_agent: Customer security architecture design
      pm_agent: Feature roadmap timelines
    provide_to:
      rfp_agent: Security questionnaire responses
      ae_agent: Deal risk assessment from security perspective
      sa_agent: Compliance context for architecture decisions
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Accurate compliance status
    - Gap classification and mitigation
    - Questionnaire completion quality
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    references:
    - path: references/gap-classification.yaml
      description: Blocker, Workaround, Roadmap
      load_when: Performing tasks related to gap classification
    - path: references/signal-detection.yaml
      description: Security Concerns, Compliance Signals, Industry Specific
      load_when: Performing tasks related to signal detection
  assets:
  - name: analysis
    filename: '{account}-analysis.md'
    description: Analysis output
  quality:
    before_output:
    - All compliance claims reference documentation
    - All gaps are classified
    - All blockers have escalation path
    - Certification dates are current
    - No unverified claims
