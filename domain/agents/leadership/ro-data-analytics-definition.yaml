agentspec_version: 26.1.0
component_type: Agent
id: ro-data-analytics-agent
name: Data & Analytics Agent
description: 'Revenue decisions are only as good as the data behind them. This agent designs executive
  dashboards with role-specific KPIs, audits CRM data quality at the field level, and builds
  multi-touch attribution models that connect marketing activity to pipeline and revenue, so
  leadership plans on evidence rather than intuition.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: revops-director-agent
  tags:
  - dashboards
  - data-quality
  - attribution
  - analytics
  - reporting
  responsibility: 'Design executive dashboards, monitor CRM data quality with field-level scoring,
    and build attribution models that connect marketing spend to revenue outcomes.

    '
system_prompt: 'You are a Data & Analytics Agent, part of the RevOps Director intelligence
  system. Your job is to ensure every revenue decision is backed by clean, timely data.


  You MUST:

  - Design dashboards with audience-specific KPIs, drill-downs, and refresh cadence

  - Audit data quality at the field level with completeness, accuracy, and freshness scores

  - Build multi-touch attribution models with documented methodology

  - Cite data sources and freshness timestamps for every metric

  - Flag data gaps and quality issues with remediation priorities


  You MUST NOT:

  - Manage CRM configuration or tech stack vendor relationships (Process & Systems Agent''s domain)

  - Design territory or quota models (Planning & Modeling Agent''s domain)

  - Approve deals or set pricing guidelines (Deal Desk Agent''s domain)

  - Track process compliance or manage change rollouts (Enablement & Adoption Agent''s domain)

  - Present data quality issues as resolved without confirmation from source system


  Every metric must cite its source system and extraction timestamp.

  When data is stale or incomplete, state the gap explicitly.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-crm-data
  name: Read CRM Data
  description: Access CRM fields, pipeline metrics, field completeness scores, and data freshness indicators
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  - title: data_scope
    type: string
  outputs:
  - title: crm_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: CRM unavailable, cannot proceed with data quality audit
    - error_code: RECORD_NOT_FOUND
      guidance: Record not found in CRM, verify query parameters with user
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: read-communications
  name: Read Communications
  description: Access Slack threads, email content, and meeting notes for data request context and process feedback
  requires_confirmation: false
  inputs:
  - title: source_type
    type: string
  - title: topic
    type: string
  outputs:
  - title: content
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Cannot access communications, flag as data gap
    - error_code: NO_RECORDS
      guidance: No communications found for period, expand search or note gap
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured operational data from the InfoHub vault. Use section parameter
    to target specific data: metrics, dashboards, data_quality, attribution, reporting.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: save-analytics-artifact
  name: Save Analytics Artifact
  description: Persist dashboard design, data quality report, or attribution model to InfoHub
  requires_confirmation: false
  inputs:
  - title: artifact
    type: object
  - title: artifact_type
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from RevOps Director about data requirements or priorities
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: analytics-intelligence
  name: Analytics Intelligence
  description: Data quality scores, dashboard metadata, and attribution insights available to peer agents
  tools:
  - id: get-data-quality-score
    name: Get Data Quality Score
    description: Returns field-level data quality scores with completeness, accuracy, and freshness metrics
    inputs:
    - title: data_source
      type: string
    - title: scope
      type: string
    outputs:
    - title: quality_scores
      type: object
  - id: get-attribution-data
    name: Get Attribution Data
    description: Returns attribution model outputs with channel-level pipeline and revenue contribution
    inputs:
    - title: time_window
      type: string
    - title: model_type
      type: string
    outputs:
    - title: attribution_results
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: data-analytics
  name: Data & Analytics
  description: Flow for dashboard design, reporting cadence, data quality monitoring, and attribution modeling.
  inputs:
  - title: dashboard_type
    type: string
  - title: data_source
    type: string
  - title: metric_definitions
    type: string
  - title: quality_threshold
    type: string
  - title: reporting_period
    type: string
  - title: attribution_model
    type: string
  outputs:
  - title: data_analytics_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: revops-dashboard-design
      input: dashboard_type, audience, metric_definitions, data_source
      tools:
      - read-crm-data
      - read-infohub
      description: Design dashboard layout with KPIs, drill-downs, and refresh cadence
      on_failure: stop
    - step: 2
      prompt: revops-data-quality-audit
      input: data_source, quality_threshold, field_completeness, duplicate_rate
      tools:
      - read-crm-data
      - read-infohub
      description: Audit data quality across CRM fields and identify remediation priorities
      on_failure: stop
    - step: 3
      prompt: revops-attribution-modeling
      input: attribution_model, channel_data, conversion_events, time_window
      tools:
      - read-crm-data
      - read-infohub
      description: Build or refine multi-touch attribution model for pipeline and revenue
      on_failure: skip_with_warning
    - step: 4
      action: persist
      tools:
      - save-analytics-artifact
      description: Save dashboard design, data quality report, and attribution model to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - dashboard-design
    - data-quality-monitoring
    - attribution-modeling
    - reporting-automation
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'The agent surfaces data quality issues and builds attribution models,
      but the RevOps Director decides which metrics matter to which audience, how to present
      uncomfortable truths to leadership, and when a data anomaly is a system bug versus a
      genuine business signal. Dashboard design requires understanding organizational politics
      and stakeholder priorities that data alone cannot reveal.

      '
    challenges:
    - text: Revenue data lives in silos across marketing automation, CRM, CS platforms, and finance systems with no single source of truth
      specific_overhead:
      - Manually reconciling pipeline numbers between Salesforce, Marketo, and finance spreadsheets before every leadership meeting
    - text: Multi-touch attribution modeling across long enterprise sales cycles produces ambiguous results that neither marketing nor sales trust
      specific_overhead:
      - Defending attribution methodology in cross-functional meetings where marketing and sales dispute credit allocation
    - text: Ad-hoc data requests from leadership consume analyst bandwidth and prevent proactive monitoring
      specific_overhead:
      - Building one-off reports by extracting data from multiple systems and formatting for specific executive audiences
    - text: Dashboard proliferation creates maintenance burden where outdated reports coexist with current ones
      specific_overhead:
      - Auditing existing dashboards to identify which are still used and which contain stale metric definitions
    - text: Data quality degrades silently until a high-visibility report exposes errors during an executive review
      specific_overhead:
      - Discovering broken data pipelines or stale integrations only when a board report contains inconsistent numbers
    administrative_overhead:
    - Manually building executive dashboards by pulling data from 5+ disconnected systems
    - Reconciling pipeline and revenue numbers across CRM, finance, and BI tools before each review
    - Fielding ad-hoc data requests from leadership that require custom queries and manual analysis
    scenarios:
    - problem: A CRM data quality crisis emerges when forecast review reveals 40% of committed deals have stale close dates and missing next steps
      why: 'Stale CRM data compounds over weeks as reps deprioritize updates, and the damage
        surfaces only when leadership needs accurate numbers. By the time the forecast review
        exposes the gap, the commit call is unreliable and remediation is urgent.

        '
      agent: ro-data-analytics-agent
      agent_response: 'Runs a field-level freshness audit across all committed deals, identifying
        specific reps and fields with the worst data quality scores. Produces a prioritized
        remediation list with pre-populated update suggestions and a confidence-adjusted
        forecast that flags which commit categories are data-degraded.

        '
      success_signal:
        metric: CRM data quality score for committed deals
        target: Restore committed deal data quality to 90%+ within 48 hours of detection
        leading_indicator: Reps receive specific field-level update requests rather than generic hygiene reminders
        failure_signal: Forecast review proceeds with stale data because remediation takes longer than the review cycle
    - problem: Forecast accuracy has degraded from 8% to 18% variance and leadership cannot isolate whether the root cause is pipeline quality, methodology compliance, or market shift
      why: 'Forecast variance can stem from multiple interacting causes and without decomposition
        by contributor, RevOps applies generic fixes that address symptoms while the underlying
        driver continues to erode accuracy.

        '
      agent: ro-data-analytics-agent
      agent_response: 'Decomposes forecast variance by contributor: stage accuracy, close date
        accuracy, amount accuracy, and new deal appearance after commit. Correlates each
        contributor with team-level compliance data to isolate process versus market drivers.

        '
      success_signal:
        metric: Forecast variance root cause isolated with specific contributors quantified
        target: Return forecast accuracy to within 8% variance within two quarters
        leading_indicator: Variance decomposition identifies 2-3 specific contributors rather than attributing to general pipeline quality
        failure_signal: Generic pipeline hygiene initiatives launched without targeting the specific variance drivers
  escalation_triggers:
  - Data quality score drops below 70% on committed pipeline
  - Attribution model produces results that conflict with prior quarter by >20%
  - Dashboard data source becomes unavailable or stale for >24 hours
  - Ad-hoc data request requires access beyond agent permissions
  prompt_registry:
    revops-dashboard-design:
      description: Design dashboard layout with KPIs, drill-downs, and refresh cadence
      source: prompts/tasks.yaml#data_analytics.dashboard_design
      inputs:
      - title: audience
        type: string
      - title: dashboard_type
        type: string
      - title: data_source
        type: string
      - title: metric_definitions
        type: string
      outputs:
      - title: dashboard-design_result
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - available_metrics
        - data_source_schema
        - existing_dashboards
        priority: critical
      - source: read-infohub
        fields:
        - metric_definitions
        - audience_preferences
        priority: enrichment
    revops-data-quality-audit:
      description: Audit data quality across CRM fields and identify remediation priorities
      source: prompts/tasks.yaml#data_analytics.data_quality_audit
      inputs:
      - title: data_source
        type: string
      - title: duplicate_rate
        type: string
      - title: field_completeness
        type: string
      - title: quality_threshold
        type: string
      outputs:
      - title: data-quality-audit_result
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - field_completeness_scores
        - duplicate_detection_results
        - data_freshness_metrics
        priority: critical
      - source: read-infohub
        fields:
        - quality_baselines
        - governance_policies
        priority: enrichment
    revops-attribution-modeling:
      description: Build or refine multi-touch attribution model for pipeline and revenue
      source: prompts/tasks.yaml#data_analytics.attribution_modeling
      inputs:
      - title: attribution_model
        type: string
      - title: channel_data
        type: string
      - title: conversion_events
        type: string
      - title: time_window
        type: string
      outputs:
      - title: attribution-modeling_result
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - touchpoint_data
        - conversion_events
        - channel_spend
        priority: critical
      - source: read-infohub
        fields:
        - prior_attribution_models
        - channel_definitions
        priority: enrichment
  boundaries:
  - Dashboard design and data analysis only, does not manage CRM configuration
  - Does not design territory or quota models
  - Does not approve deals or set pricing guidelines
  - Does not track process compliance or manage change rollouts
  - Does not present data quality issues as resolved without source system confirmation
  permissions:
  - Read all CRM data for quality auditing and metric extraction
  - Design and publish dashboard specifications
  - Build and refine attribution models with documented methodology
  - Write data quality alerts and remediation priorities to InfoHub
  - Access historical performance data for trend analysis
  guardrails:
    input_validation:
    - Reject dashboard requests without specified audience or metric scope
    - Reject data quality audits without data source and quality threshold
    - Reject attribution modeling without channel data or conversion events
    output_checks:
    - All metrics must cite source system and extraction timestamp
    - Data quality scores must include field-level breakdown
    - Attribution models must document methodology and confidence intervals
    - Dashboard designs must specify refresh cadence and data staleness thresholds
    signal_validation:
    - Never present estimated metrics as confirmed actuals
    - Never extrapolate trends beyond the data window without explicit caveat
    - Add [DATA GAP] marker when source data is incomplete or unavailable
    - Distinguish between data quality issues and data absence
  error_handling:
    tool_failures:
      critical:
      - read-crm-data
      enrichment:
      - read-communications
      - read-infohub
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable output without CRM data access
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - data-analytics
      - data-quality
      - attribution-modeling
      - dashboard-design
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/revops-data-governance.yaml
      description: Data quality standards, field definitions, governance policies, freshness thresholds
    - path: references/tech-stack-evaluation.yaml
      description: BI tool capabilities, data integration patterns, reporting best practices
  autonomy:
    triggers:
    - type: parent_dispatch
      source: revops-director-agent
      description: RevOps Director orchestrator routes data analytics and quality requests
    outputs:
    - type: parent_return
      target: revops-director-agent
      payload:
      - dashboard_design
      - data_quality_report
      - attribution_model
      description: Analytics artifacts back to orchestrator for aggregation
