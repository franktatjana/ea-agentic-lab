      {request_list_with_details}
      Available capacity: {capacity}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are resolving a resource conflict by making a clear allocation decision
      with documented rationale. The output must be a decision with communication
      plan, not an analysis without conclusion. Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps
      - DEFER: 2+ required inputs ABSENT → STOP. Produce missing inputs list.

      Data Availability Map, dimensions to assess: Request Details, Strategic Context,
      Resource Capacity, Opportunity Values, Timeline Constraints.
      For each dimension, assess data richness (HIGH/MEDIUM/LOW).

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP. Switch to
      SIGNAL ACQUISITION MODE and produce data gathering plan. Do not proceed.

      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      STEP 1: REQUEST ASSESSMENT
      Assess each competing request on consistent dimensions:
      - Strategic value of the opportunity (1-10 with confidence and basis)
      - Time sensitivity (deadline, consequence of delay)
      - Resource requirement (type, duration, intensity)
      - Win probability if resourced (% with confidence and basis)
      - Loss probability if not resourced (% with confidence and basis)
      - Relationship impact if declined
      Every score must include confidence level (HIGH/MEDIUM/LOW) with basis.
      If request details are incomplete: state what is missing per request,
      score as ESTIMATED with LOW confidence, proceed without fabrication.
      Deliverable: Request Assessment (Request | Strategic Value | Confidence |
      Time Sensitivity | Resource Req | Win Prob | Loss Prob | Relationship Impact).

      STEP 2: ALLOCATION DECISION
      Make the allocation decision:
      - Decision: which requests get resources, which do not
      - Allocation per request (resource type, amount, duration)
      - Decision rationale (which criteria drove the decision)
      - Confidence in decision (HIGH/MEDIUM/LOW with basis)
      Deliverable: Allocation Decision (Request | Allocation | Rationale | Confidence).

      STEP 3: IMPACT ANALYSIS
      Document impact on each affected party:
      - Impact on prioritized requests (what they get, what constraints remain)
      - Impact on deprioritized requests (what they lose, mitigation available)
      - Mitigation for deprioritized opportunities
      Priority | Action | Owner | Timeline | Prerequisites | Expected Impact
      Deliverable: Impact Analysis + Mitigation Plan using format above.

      STEP 4: COMMUNICATION PLAN
      Prepare communication for all affected parties:
      - For each requesting team: message content, tone, channel, timing
      - For prioritized teams: expectations and constraints
      - For deprioritized teams: rationale, mitigation, re-engagement trigger
      Deliverable: Communication Plan (Audience | Message | Tone | Channel |
      Timing | Re-engagement Trigger).

      STEP 5: PORTFOLIO STATE DELTA
      Specify what this runbook's findings change:
      - Fields updated (field path | old value | new value | evidence)
      - Resource allocation changes
      - Opportunity risk level changes
      - Review date for reassessment
      Deliverable: Portfolio State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - All requests scored on identical dimensions for fair comparison
      - Every score includes confidence level and basis
      - Decision is clearly stated, not hedged or deferred
      - Communication addresses both prioritized and deprioritized teams
      - Mitigation plan gives deprioritized teams a path forward
      - Review date set for reassessment if conditions change
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Lead with a 3-sentence executive summary stating: (1) the allocation
      decision and primary rationale, (2) the highest-risk trade-off or lowest-
      confidence factor, and (3) the single most important communication to deliver.
      Then produce all numbered deliverables as labeled sections.

  capacity_planning:
    name: "Resource Capacity Planning"
    description: "Plan resource allocation for upcoming quarter by forecasting demand against capacity, identifying gaps, and recommending hiring or contractor actions"
    prompt: |
      Context: Capacity planning for {quarter}.
      Pipeline: {pipeline_summary}
      Current resource utilization: {utilization}
      Anticipated major pursuits: {major_pursuits}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are planning resource capacity for the upcoming quarter. The output must
      identify gaps early enough to act: hire, contract, reallocate, or deprioritize.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps
      - DEFER: 2+ required inputs ABSENT → STOP. Produce missing inputs list.

      Data Availability Map, dimensions to assess: Pipeline Forecast, Resource Inventory,
      Utilization Rates, Major Pursuit Details, Historical Capacity Data.
      For each dimension, assess data richness (HIGH/MEDIUM/LOW).

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP. Switch to
      SIGNAL ACQUISITION MODE and produce data gathering plan. Do not proceed.

      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      STEP 1: CAPACITY INVENTORY
      Catalog available capacity by resource type:
      - Resource type (SA, AE, SE, CSM, specialist)
      - Headcount (current, planned additions, planned departures)
      - Available capacity (FTE-weeks per month, accounting for PTO, training, overhead)
      - Current utilization rate (%)
      - Trend: increasing demand, stable, decreasing demand
      - Trend requires comparison of at least two time-separated observations.
        If only one observation exists, trend is INSUFFICIENT DATA.
      Every capacity figure must include confidence level (HIGH/MEDIUM/LOW) with basis.
      Deliverable: Capacity Inventory (Resource Type | Headcount | Available FTE-Weeks |
      Current Utilization | Trend | Trend Confidence | Confidence).

      STEP 2: DEMAND FORECAST
      Forecast resource demand by month:
      - Source of demand (specific pursuit, account, or portfolio activity)
      - Resource type needed
      - Estimated demand (FTE-weeks)
      - Probability-weighted demand (FTE-weeks x win probability)
      - Month of peak demand
      If pipeline data is incomplete: state what is missing, note that demand forecast
      is estimated based on historical patterns, proceed with caveats.
      Deliverable: Demand Forecast (Source | Resource Type | Month 1 | Month 2 |
      Month 3 | Peak Month | Confidence).

      STEP 3: GAP ANALYSIS
      Compare capacity to demand:
      - Resource type
      - Available capacity (from Step 1)
      - Forecasted demand (from Step 2)
      - Gap (surplus or deficit by month)
      - Severity of deficit: CRITICAL (deals at risk), MODERATE (reduced quality),
        MANAGEABLE (stretch but feasible)
      Every gap assessment must include confidence level (HIGH/MEDIUM/LOW) with basis.
      Deliverable: Gap Analysis (Resource Type | Month 1 Capacity | Month 1 Demand |
      Month 1 Gap | Month 2 Gap | Month 3 Gap | Severity | Confidence).

      STEP 4: ALLOCATION RECOMMENDATIONS
      Recommend actions to close gaps:
      Priority | Action | Owner | Timeline | Prerequisites | Expected Impact
      Action types: reallocate from lower-priority work, hire (with lead time),
      engage contractors, deprioritize pursuits, cross-train existing team.
      Each recommendation must include cost and trade-off analysis.
      Every expected impact must include confidence level (HIGH/MEDIUM/LOW) with basis.
      Deliverable: Allocation Recommendations using format above.

      STEP 5: HIRING AND CONTRACTOR RECOMMENDATIONS
      If gaps cannot be closed through reallocation:
      - Role to hire (title, skills, level)
      - Urgency (immediate, next quarter, planned)
      - Cost (salary range, contractor rate)
      - Lead time to productive (onboarding weeks)
      - Alternative if hiring is not approved
      Deliverable: Hiring Recommendations (Role | Urgency | Cost | Lead Time |
      Alternative | Confidence).

      STEP 6: PORTFOLIO STATE DELTA
      Specify what this runbook's findings change:
      - Fields updated (field path | old value | new value | evidence)
      - Resource allocation changes
      - Hiring requests initiated
      - Pursuit deprioritizations recommended
      Deliverable: Portfolio State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Capacity figures account for PTO, training, and overhead (not raw headcount)
      - Demand forecast uses probability-weighted estimates
      - Trend claims are based on at least two time-separated observations
      - Gap analysis includes severity classification with confidence
      - Recommendations include cost and trade-off analysis
      - Hiring recommendations include alternatives if not approved
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Lead with a 3-sentence executive summary stating: (1) the overall
      capacity position and most critical gap, (2) the lowest-confidence forecast
      dimension, and (3) the single most urgent action to close the gap.
      Then produce all numbered deliverables as labeled sections.

  strategic_investment_decision:
    name: "Strategic Investment Decision"
    description: "Evaluate strategic account investment proposal using risk-adjusted return analysis, alternative comparison, and conditional approval with guardrails"
    prompt: |
      Context: Investment decision for {account_name}.
      Proposed investment: {investment_description}
      Cost: {investment_cost}
      Expected return: {expected_return}
      Alternatives: {alternatives}
      Run mode: {run_mode} (FULL = all deliverables; QUICK = executive summary + state delta + top action; DISCOVERY = signal acquisition plan only. Default: FULL)

      You are making a strategic investment decision for an account. The output must
      be a clear APPROVE/DENY/MODIFY decision with quantified rationale and guardrails.
      Follow these steps in order.

      STEP 0: INPUT GATE
      Validate all inputs before proceeding. For each required input listed in the
      context block, classify as:
      - PRESENT: data received and parseable
      - PARTIAL: data received but incomplete (specify what's missing)
      - ABSENT: no data received

      Based on input status, select run mode:
      - FULL: all required inputs PRESENT → proceed with all steps
      - DEGRADED: 1+ inputs PARTIAL → proceed but flag gaps
      - DEFER: 2+ required inputs ABSENT → STOP. Produce missing inputs list.

      Data Availability Map, dimensions to assess: Investment Details, Cost Structure,
      Return Projections, Alternative Options, Account Strategic Value.
      For each dimension, assess data richness (HIGH/MEDIUM/LOW).

      ZERO-SIGNAL PIVOT: If 2+ dimensions score LOW richness, STOP. Switch to
      SIGNAL ACQUISITION MODE and produce data gathering plan. Do not proceed.

      Deliverable: Input Gate (Input | Status | Gap Detail | Impact on Output) +
      Data Availability Map (Dimension | Richness | Sources | Gap) + Run Mode declaration.

      STEP 1: STRATEGIC VALUE ASSESSMENT
      Assess the strategic value of this investment:
      - Account strategic importance (1-10 with confidence and basis)
      - Investment alignment with portfolio strategy (HIGH/MEDIUM/LOW with basis)
      - Long-term relationship value (beyond this specific return)
      - Reference/logo value (market positioning benefit)
      - Competitive implications (what happens if we do not invest)
      Every assessment must include confidence level (HIGH/MEDIUM/LOW) with basis.
      Deliverable: Strategic Value (Dimension | Assessment | Confidence | Basis).

      STEP 2: FINANCIAL ANALYSIS
      Analyze the financial proposition:
      - Total investment cost (one-time and recurring)
      - Expected return (revenue, ARR growth, expansion pipeline)
      - Payback period
      - Risk-adjusted return (expected return x probability of achieving it)
      - Opportunity cost (what else could this investment fund)
      Every financial projection must include confidence level with basis.
      If expected return data is incomplete: state what is missing, note that
      financial analysis uses conservative estimates, proceed accordingly.
      Deliverable: Financial Analysis (Dimension | Amount | Confidence | Basis |
      Assumptions).

      STEP 3: ALTERNATIVE COMPARISON
      Compare the proposed investment to alternatives:
      - Alternative description
      - Cost comparison
      - Return comparison
      - Risk comparison
      - Strategic fit comparison
      If alternatives data is empty: state that no alternatives were provided,
      note that the decision is evaluated on absolute merit only, recommend
      gathering alternatives before finalizing.
      Deliverable: Alternative Comparison (Option | Cost | Expected Return |
      Risk | Strategic Fit | Recommendation).

      STEP 4: RISK ASSESSMENT
      Identify risks of this investment:
      - Risk description (specific scenario)
      - Likelihood (HIGH/MEDIUM/LOW with confidence and basis)
      - Impact if realized (financial, relationship, competitive)
      - Mitigation available
      - Residual risk after mitigation
      Deliverable: Risk Assessment (Risk | Likelihood | Confidence | Impact |
      Mitigation | Residual Risk).

      STEP 5: INVESTMENT DECISION
      Render the decision:
      - Decision: APPROVE / DENY / MODIFY
      - Assign one primary classification for routing. Add secondary flags where
        the investment warrants conditional monitoring.
      - Decision rationale (2-3 sentences connecting strategic value, financial
        analysis, and risk)
      - Decision confidence (HIGH/MEDIUM/LOW with basis)
      - If APPROVE: guardrails (spending limits, review checkpoints, success criteria)
      - If DENY: what would change this decision
      - If MODIFY: specific modifications and rationale
      - Success metrics and review date
      Deliverable: Investment Decision (Decision | Confidence | Rationale | Guardrails |
      Success Metrics | Review Date | Secondary Flags).

      STEP 6: ACCOUNT STATE DELTA
      Specify what this runbook's findings change:
      - Fields updated (field path | old value | new value | evidence)
      - Investment status
      - Account tier impact
      - Budget allocation changes
      Deliverable: Account State Delta (Field | Previous | Updated | Evidence | Runbook Source).

      QUALITY CHECKS BEFORE OUTPUT:
      - Strategic value assessment separates this account's value from generic claims
      - Financial analysis uses risk-adjusted returns, not best-case projections
      - Every score and projection includes confidence level with basis
      - Alternatives are compared on identical dimensions
      - Risk assessment includes mitigation and residual risk
      - Decision includes guardrails and success metrics for approved investments
      - Review date is set regardless of decision
      - Executive summary is self-sufficient: a reader can act on it without reading the detailed deliverables

      RUN MODE EXECUTION:
      - If run_mode is QUICK: produce only the executive summary, state delta, and the single highest-priority action with prerequisites. Skip detailed step deliverables.
      - If run_mode is DISCOVERY: produce only the signal acquisition plan (data gaps, questions, sources, observation checklist, re-assessment date). Skip scoring and analysis steps.
      - If run_mode is FULL or not specified: produce all deliverables as described above.

      Format: Lead with a 3-sentence executive summary stating: (1) the investment
      decision and overall confidence, (2) the highest-risk factor or lowest-
      confidence projection, and (3) the single most important guardrail or next
      action. Then produce all numbered deliverables as labeled sections.
