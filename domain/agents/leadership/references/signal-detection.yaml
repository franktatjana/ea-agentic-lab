# Signal Detection Reference
# Extracted from: senior_manager_personality.yaml (signal_detection section)
# Load when: Processing incoming requests

escalation_signals:
  keywords:
    - "need approval"
    - "exception required"
    - "blocked"
    - "conflict"
    - "urgent decision"
    - "customer escalation"
    - "resource conflict"

  severity_indicators:
    critical: ["deal at risk", "customer executive escalation", "legal issue"]
    high: ["timeline at risk", "resource shortage", "pricing conflict"]
    medium: ["process exception", "clarification needed"]

portfolio_health_signals:
  positive:
    - "pipeline growing"
    - "conversion improving"
    - "customer satisfaction high"
    - "team performing well"

  negative:
    - "forecast slipping"
    - "deals stuck"
    - "team burnout"
    - "customer churn risk"

coaching_signals:
  keywords:
    - "unsure how to"
    - "need guidance"
    - "first time"
    - "challenging situation"
    - "advice needed"
