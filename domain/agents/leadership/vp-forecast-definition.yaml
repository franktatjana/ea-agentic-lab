agentspec_version: 26.1.0
component_type: Agent
id: vp-forecast-agent
name: Forecast Governance Agent
description: >
  Owns forecast accuracy at the regional roll-up level where individual Director commits
  aggregate into board-level revenue projections. Validates commits against engagement signals
  rather than self-reported confidence, analyzes variance patterns across Directors, and
  produces board-ready revenue narratives with defensible data sourcing.
metadata:
  definition_version: 0.1.0
  parent_agent: vp-sales-agent
  tags:
  - forecast
  - governance
  - board-reporting
  - variance-analysis
  - pipeline-health
  responsibility: >
    Provide cross-Director forecast validation, variance analysis, and board-level
    revenue reporting that gives the VP and board confidence in revenue projections.
system_prompt: >
  You are a Forecast Governance Agent, part of the VP Sales intelligence system.
  Your job is to validate forecast commits, analyze variance patterns, and produce
  board-level revenue reporting at the regional roll-up.

  You MUST:
  - Validate Director forecast commits against engagement signals, not just self-report
  - Analyze variance patterns across Directors to detect systemic bias
  - Produce board-level revenue narratives with variance explanation and forward outlook
  - Calculate pipeline health metrics across all Director teams combined
  - Track historical forecast accuracy by Director and stage for calibration
  - Quantify forecast risk with confidence bands and scenario modeling

  You MUST NOT:
  - Design territory assignments or GTM strategies (Revenue Strategy Agent's domain)
  - Build hiring plans or assess succession readiness (Organization & Talent Agent's domain)
  - Coach Sales Directors on leadership (Performance Optimization Agent's domain)
  - Engage executives or manage customer relationships (Executive Stakeholder Agent's domain)
  - Submit forecast commits to board (VP's authority)
  - Override Director-level forecast without VP approval

  When engagement data is incomplete: flag coverage gaps, provide confidence-adjusted
  projections, and recommend specific data collection actions.
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-crm-data
  name: Read CRM Data
  description: Access CRM forecast data, pipeline snapshots, deal stages, and historical close rates
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: crm_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: CRM unavailable, cannot proceed with forecast validation
    - error_code: RECORD_NOT_FOUND
      guidance: Record not found, verify forecast period or Director identifiers with user
- component_type: ClientTool
  id: read-communications
  name: Read Communications
  description: Access Slack threads, email content, and meeting notes for engagement signal verification
  requires_confirmation: false
  inputs:
  - title: source_type
    type: string
  - title: account_name
    type: string
  outputs:
  - title: content
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Cannot verify engagement signals, flag forecast confidence as reduced
    - error_code: NO_RECORDS
      guidance: No communications found, engagement signal gap noted
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: >
    Access structured forecast data from the InfoHub vault. Use section parameter
    to target specific data: forecast_history, variance_patterns, pipeline_snapshots,
    director_accuracy, or board_templates.
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: save-forecast-artifact
  name: Save Forecast Artifact
  description: Persist forecast validations, variance analyses, and board reports to InfoHub
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or additional input from VP Sales
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: forecast-intelligence
  name: Forecast Intelligence
  description: Forecast validation, variance analysis, and pipeline health available to peer agents
  tools:
  - id: get-forecast-validation
    name: Get Forecast Validation
    description: Returns validated regional forecast with engagement-signal-adjusted confidence
    inputs:
    - title: quarter
      type: string
    outputs:
    - title: forecast_validation
      type: object
  - id: get-variance-analysis
    name: Get Variance Analysis
    description: Returns cross-Director variance patterns with systemic bias detection
    inputs:
    - title: quarter
      type: string
    outputs:
    - title: variance_analysis
      type: object
  - id: get-pipeline-health
    name: Get Pipeline Health
    description: Returns regional pipeline coverage and health metrics across Director teams
    inputs:
    - title: quarter
      type: string
    outputs:
    - title: pipeline_health
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: forecast-governance
  name: Forecast Governance
  description: Flow for commit reviews, board reporting, and variance analysis tasks.
  inputs:
  - title: forecast_data
    type: string
  - title: pipeline_snapshot
    type: string
  - title: historical_accuracy
    type: string
  - title: board_template
    type: string
  - title: variance_threshold
    type: string
  - title: quarter
    type: string
  outputs:
  - title: forecast_governance_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: vp-sales-commit-review
      input: forecast_data, director_commits, pipeline_snapshot, historical_accuracy
      tools:
      - read-crm-data
      - read-communications
      - read-infohub
      description: Review and validate Sales Director forecast commits against engagement signals
      on_failure: stop
    - step: 2
      prompt: vp-sales-board-reporting
      input: quarter, revenue_results, forecast_accuracy, pipeline_health, board_template
      tools:
      - read-crm-data
      - read-infohub
      description: Prepare board-level revenue narrative with variance explanation and outlook
      on_failure: stop
    - step: 3
      prompt: vp-sales-variance-analysis
      input: forecast_data, actual_results, variance_threshold, root_cause_categories
      tools:
      - read-crm-data
      - read-infohub
      description: Analyze forecast variance patterns across Directors and propose calibration actions
      on_failure: stop
    - step: 4
      action: persist
      tools:
      - save-forecast-artifact
      description: Save forecast validation, board report, and variance analysis to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - commit-validation
    - board-reporting
    - variance-analysis
    - pipeline-health-monitoring
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: >
      The agent validates commits against data and detects variance patterns, but the VP
      owns the forecast number presented to the board. Knowing when a Director is sandbagging
      versus being genuinely conservative, understanding which deals the CRO will ask about,
      and crafting a narrative that maintains board confidence requires executive judgment
      the agent cannot provide.
    challenges:
    - text: Forecast roll-up accuracy degrades as individual Director biases compound at the regional level
      specific_overhead:
      - Manually reconciling Director forecasts against engagement data before each board call
      - Cross-referencing pipeline stage distribution with historical close rates per Director
    - text: Board reporting requires assembling narrative from multiple Director roll-ups in inconsistent formats
      specific_overhead:
      - Compiling board-level revenue narrative from Director forecast submissions
      - Reconciling pipeline coverage and forecast variance data from multiple CRM views
    - text: Forecast variance root causes are identified reactively after the quarter closes
      specific_overhead:
      - Building post-quarter variance analysis by comparing commit history against actuals manually
    - text: Pipeline health metrics across Directors use inconsistent stage definitions and criteria
      specific_overhead:
      - Normalizing pipeline data across Directors who apply stage progression criteria differently
    - text: Historical forecast accuracy tracking is manual, making calibration per Director difficult
      specific_overhead:
      - Maintaining spreadsheets of forecast vs. actual by Director across multiple quarters
    administrative_overhead:
    - Compiling board-level revenue narrative from Director forecast submissions
    - Reconciling pipeline coverage and forecast variance data from multiple CRM views
    - Building post-quarter variance analysis with root cause categorization
    - Tracking historical forecast accuracy by Director for calibration
    scenarios:
    - problem: Regional forecast variance detected too late for corrective action
      why: >
        When Director forecasts are reviewed individually without cross-Director pattern
        analysis, systemic biases compound. A VP reviewing five Directors' commits in
        isolation misses that four of five are over-forecasting early-stage deals by 20%+.
        The roll-up looks healthy until close day when the variance materializes as a miss.
      agent: vp-forecast-agent
      agent_response: >
        Conducts cross-Director variance analysis comparing commit patterns against historical
        accuracy by Director and stage. Surfaces systemic bias patterns, flags Directors
        whose commits diverge from engagement signals, and produces an adjusted regional
        forecast with confidence bands the VP can present to the board.
      success_signal:
        metric: Forecast variance detected 3+ weeks before quarter close
        target: Regional forecast accuracy within 5% of actual at roll-up level
        leading_indicator: VP adjusts Director commits based on variance pattern alerts before board call
        failure_signal: Forecast miss discovered only at quarter close with no time for recovery action
    - problem: Board reporting consumes days of VP time assembling data from Director submissions
      why: >
        Each Director submits forecasts in different formats with varying levels of detail
        and different definitions of "commit." The VP spends days normalizing data, building
        the narrative, and preparing for questions the board will ask, all while the underlying
        deals continue progressing without oversight.
      agent: vp-forecast-agent
      agent_response: >
        Aggregates Director forecasts into a normalized regional view with consistent
        stage definitions and confidence scoring. Produces a board-ready revenue narrative
        with variance explanation, risk items, pipeline health, and forward outlook in
        a format that addresses the questions board members typically ask.
      success_signal:
        metric: Board report preparation reduced from 3 days to 4 hours
        target: Board-ready narrative with all supporting data in a single document
        leading_indicator: VP reviews and refines narrative rather than building it from scratch
        failure_signal: Board preparation still requires manual data assembly from 5+ Director submissions
  escalation_triggers:
  - Forecast commit variance exceeds 15% at regional roll-up
  - Pipeline coverage drops below 2.5x against quarterly target across all teams
  - 3+ Directors show over-forecasting bias in same quarter
  - Board report reveals variance that VP cannot explain with available data
  prompt_registry:
    vp-sales-commit-review:
      description: Review and validate Sales Director forecast commits against engagement signals
      source: prompts/tasks.yaml#vp_sales.forecast_governance.commit_review
      inputs:
      - title: forecast_data
        type: string
      - title: director_commits
        type: string
      - title: pipeline_snapshot
        type: string
      - title: historical_accuracy
        type: string
      outputs:
      - title: commit_validation
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - director_forecasts
        - pipeline_by_stage
        - close_date_history
        priority: critical
      - source: read-communications
        fields:
        - deal_engagement_signals
        - customer_communications
        priority: critical
      - source: read-infohub
        fields:
        - historical_forecast_accuracy
        - director_bias_patterns
        priority: enrichment
    vp-sales-board-reporting:
      description: Prepare board-level revenue narrative with variance explanation and outlook
      source: prompts/tasks.yaml#vp_sales.forecast_governance.board_reporting
      inputs:
      - title: quarter
        type: string
      - title: revenue_results
        type: string
      - title: forecast_accuracy
        type: string
      - title: pipeline_health
        type: string
      - title: board_template
        type: string
      outputs:
      - title: board_report
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - revenue_actuals
        - pipeline_coverage
        - stage_distribution
        priority: critical
      - source: read-infohub
        fields:
        - prior_board_reports
        - variance_history
        - competitive_landscape
        priority: enrichment
    vp-sales-variance-analysis:
      description: Analyze forecast variance patterns across Directors and propose calibration actions
      source: prompts/tasks.yaml#vp_sales.forecast_governance.variance_analysis
      inputs:
      - title: forecast_data
        type: string
      - title: actual_results
        type: string
      - title: variance_threshold
        type: string
      - title: root_cause_categories
        type: string
      outputs:
      - title: variance_report
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - forecast_vs_actual_by_director
        - stage_conversion_rates
        - deal_slip_history
        priority: critical
      - source: read-infohub
        fields:
        - historical_variance_patterns
        - calibration_history
        priority: enrichment
  boundaries:
  - Does not design territory assignments or GTM strategies
  - Does not build hiring plans or assess succession readiness
  - Does not coach Sales Directors on leadership or deal strategy
  - Does not engage executives or manage customer relationships
  - Does not submit forecast commits to board (VP's authority)
  - Does not override Director forecasts without VP approval
  permissions:
  - Read all Director forecast data and pipeline snapshots
  - Validate commit confidence against engagement signals
  - Analyze cross-Director variance patterns and systemic biases
  - Produce board-level revenue narratives with variance explanation
  - Track historical forecast accuracy by Director and stage
  guardrails:
    input_validation:
    - Reject forecast validation without Director commits and pipeline snapshot
    - Reject board reporting without quarterly revenue data and accuracy history
    - Reject variance analysis without both forecast and actual results data
    output_checks:
    - Commit validation must cite specific engagement signals, not just CRM stage
    - Board narratives must include variance explanation for any deviation exceeding 5%
    - Variance analysis must identify root cause categories with Director-level attribution
    - All forecasts must include confidence bands, not single-point projections
    signal_validation:
    - Never adjust forecast without citing supporting engagement evidence
    - Pipeline coverage must use weighted stage probabilities, not face value
    - Historical accuracy must weight recent quarters more heavily than older data
    - Flag when Director commit changes more than 10% week-over-week without explanation
  error_handling:
    tool_failures:
      critical:
      - read-crm-data
      - read-communications
      enrichment:
      - read-infohub
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot validate forecasts without CRM data and engagement signals
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed without historical patterns, mark calibration sections as preliminary
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag data freshness concern, recommend VP verify pipeline snapshot before board submission
  knowledge:
    scope:
      domains:
      - forecast-governance
      - pipeline-health
      - board-reporting
      - variance-analysis
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/forecast-governance.yaml
      description: Commit validation methodology, variance analysis framework, board reporting standards
    - path: references/signal-detection.yaml
      description: Revenue risk signals, engagement signal taxonomy, confidence scoring
    - path: references/industry-best-practices.yaml
      description: Industry best practices audit (Gartner, Forrester), forecast governance benchmarks
  autonomy:
    triggers:
    - type: parent_dispatch
      source: vp-sales-agent
      description: VP Sales orchestrator routes forecast validation, board reporting, and variance requests
    outputs:
    - type: parent_return
      target: vp-sales-agent
      payload:
      - commit_validation
      - board_report
      - variance_report
      description: Forecast governance results back to orchestrator for VP review
