agentspec_version: 26.1.0
component_type: Agent
id: vp-sales-agent
name: VP Sales Agent
description: >
  Digital twin of the VP Sales / Regional VP role. Orchestrates revenue strategy across
  regional planning, organizational development, forecast governance, executive stakeholder
  management, and performance optimization through 5 specialized sub-agents.
metadata:
  definition_version: 0.1.0
  parent_agent: null
  disclaimer: 'This agent specification is a reference design for educational and demonstration purposes. It is not a production system. All examples, case studies, and scenarios are fictional.

    '
  tags:
  - leadership
  - revenue
  - strategy
  - organization
  - forecast
  responsibility: 'Route VP-level revenue strategy requests to the correct sub-agent among 5 specialized agents, aggregate cross-domain insights when needed, and escalate to human when conditions are met.

    '
system_prompt: 'You are a VP Sales Orchestrator. You do not execute domain tasks

  directly. You route each request to the appropriate sub-agent.


  ROUTING RULES:

  - GTM planning, territory design, market segmentation, compensation modeling → Revenue Strategy Agent

  - Hiring plans, team scaling, succession planning, org design → Organization & Talent Agent

  - Commit reviews, board reporting, forecast variance analysis, pipeline health → Forecast Governance Agent

  - C-suite engagement, board preparation, customer executive relationships → Executive Stakeholder Agent

  - Sales Director coaching, QBR orchestration, rep productivity analysis → Performance Optimization Agent


  CROSS-DOMAIN REQUESTS:

  When a request spans multiple domains (e.g., "prepare board deck with forecast and org plan"),

  route to each relevant sub-agent and aggregate the results.


  ESCALATION:

  - Regional revenue miss exceeds 10% of plan → CRO/CEO

  - Forecast commit variance exceeds 15% at roll-up → CRO

  - Sales Director attrition or performance below threshold → CRO and HR

  - Strategic customer escalation requiring VP engagement → CRO

  - Headcount or budget request exceeding regional authority → CRO/CFO


  You MUST NOT:

  - Execute domain tasks yourself (always delegate)

  - Make individual deal decisions (Sales Director''s domain)

  - Assess technical architecture (SA Agent''s domain)

  - Track delivery status (Delivery Agent''s domain)

  - Override compensation plan design without HR/Finance approval

  '
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.5
    max_tokens: 4096
inputs:
- title: task_type
  type: string
  description: Which task to perform
- title: personality
  type: string
  description: Personality variant to use
  default: default
- title: output_format
  type: string
  description: Response format
  default: markdown
outputs:
- title: result
  type: object
  description: Agent output
tools:
- component_type: ClientTool
  id: read-vp-sales-data
  name: Read VP Sales Data
  description: 'Access data sources: regional revenue data, forecast roll-ups, org health metrics'
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: write-vp-sales-artifact
  name: Write VP Sales Artifact
  description: 'Save artifacts: board decks, territory plans, org charts, forecast commits'
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or additional input from the user
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
- component_type: ClientTool
  id: invoke-revenue-strategy
  name: Invoke Revenue Strategy Agent
  description: Route to Revenue Strategy Agent for GTM planning, territory design, market segmentation, compensation modeling
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: regional_context
    type: object
  - title: planning_period
    type: string
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: vp-revenue-strategy-agent
- component_type: ClientTool
  id: invoke-org-talent
  name: Invoke Organization & Talent Agent
  description: Route to Organization & Talent Agent for hiring plans, team scaling, succession planning, org design
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: org_context
    type: object
  - title: headcount_data
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: vp-org-talent-agent
- component_type: ClientTool
  id: invoke-forecast-governance
  name: Invoke Forecast Governance Agent
  description: Route to Forecast Governance Agent for commit reviews, board reporting, forecast variance analysis, pipeline health
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: forecast_data
    type: object
  - title: reporting_period
    type: string
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: vp-forecast-agent
- component_type: ClientTool
  id: invoke-executive-stakeholder
  name: Invoke Executive Stakeholder Agent
  description: Route to Executive Stakeholder Agent for C-suite engagement, board preparation, customer executive relationships
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: stakeholder_context
    type: object
  - title: engagement_type
    type: string
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: vp-executive-agent
- component_type: ClientTool
  id: invoke-performance-optimization
  name: Invoke Performance Optimization Agent
  description: Route to Performance Optimization Agent for Sales Director coaching, QBR orchestration, rep productivity analysis
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: performance_data
    type: object
  - title: review_period
    type: string
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: vp-performance-agent
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: vp-sales-agent-proactive
  name: VP Sales Agent (Proactive)
  description: 'Proactive mode: scans for revenue risks, org health signals, and forecast variances without prompting'
  agent:
    $component_ref: vp-sales-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan regional
      revenue data, forecast roll-ups, and org health indicators continuously.
      Surface territory imbalances, forecast risks, and talent gaps before they
      become problems. Prioritize timeliness over depth. Keep outputs concise
      and action-oriented. Flag anything requiring VP intervention immediately.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: vp-sales-agent-analytical
  name: VP Sales Agent (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence for board-level reporting and strategic planning'
  agent:
    $component_ref: vp-sales-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and pattern recognition for executive-level
      analysis. Provide comprehensive analysis with full evidence trails across
      territory performance, org health, and competitive positioning. Synthesize
      across multiple data points for board-ready narratives. Prioritize accuracy
      and defensibility over speed. Include confidence levels and caveats.

      '
    human_in_the_loop: true
flows:
- component_type: Flow
  id: revenue-strategy
  name: Revenue Strategy
  description: Flow for GTM planning, territory design, and compensation modeling tasks.
  inputs:
  - title: region
    type: string
  - title: fiscal_year
    type: string
  - title: revenue_target
    type: string
  - title: market_segments
    type: string
  - title: territory_data
    type: string
  - title: compensation_model
    type: string
  outputs:
  - title: revenue_strategy_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: vp-sales-gtm-planning
      input: region, fiscal_year, revenue_target, market_segments, competitive_landscape
      description: Design regional GTM strategy with segment prioritization and motion alignment
    - step: 2
      prompt: vp-sales-territory-design
      input: region, territory_data, rep_capacity, account_distribution, revenue_potential
      description: Model territory assignments balancing workload, revenue potential, and travel efficiency
    - step: 3
      prompt: vp-sales-compensation-modeling
      input: compensation_model, quota_distribution, accelerators, spiff_targets, retention_goals
      description: Model compensation plans that drive desired behaviors and retain top performers
- component_type: Flow
  id: org-development
  name: Organization Development
  description: Flow for hiring plans, team scaling, and succession planning tasks.
  inputs:
  - title: current_headcount
    type: string
  - title: attrition_data
    type: string
  - title: hiring_plan
    type: string
  - title: performance_distribution
    type: string
  - title: succession_candidates
    type: string
  - title: budget_constraints
    type: string
  outputs:
  - title: org_development_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: vp-sales-hiring-plan
      input: current_headcount, attrition_data, revenue_target, ramp_time, budget_constraints
      description: Build hiring plan with ramp curves, time-to-productivity, and budget impact
    - step: 2
      prompt: vp-sales-team-scaling
      input: team_structure, performance_distribution, growth_targets, market_expansion
      description: Design org scaling strategy balancing growth with culture and manager span
    - step: 3
      prompt: vp-sales-succession-planning
      input: succession_candidates, leadership_competencies, development_gaps, timeline
      description: Identify and develop next-generation Sales Directors with structured development paths
- component_type: Flow
  id: forecast-governance
  name: Forecast Governance
  description: Flow for commit reviews, board reporting, and variance analysis tasks.
  inputs:
  - title: forecast_data
    type: string
  - title: pipeline_snapshot
    type: string
  - title: historical_accuracy
    type: string
  - title: board_template
    type: string
  - title: variance_threshold
    type: string
  - title: quarter
    type: string
  outputs:
  - title: forecast_governance_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: vp-sales-commit-review
      input: forecast_data, director_commits, pipeline_snapshot, historical_accuracy
      description: Review and validate Sales Director forecast commits against engagement signals
    - step: 2
      prompt: vp-sales-board-reporting
      input: quarter, revenue_results, forecast_accuracy, pipeline_health, board_template
      description: Prepare board-level revenue narrative with variance explanation and outlook
    - step: 3
      prompt: vp-sales-variance-analysis
      input: forecast_data, actual_results, variance_threshold, root_cause_categories
      description: Analyze forecast variance patterns across Directors and propose calibration actions
- component_type: Flow
  id: executive-stakeholder
  name: Executive Stakeholder Management
  description: Flow for C-suite alignment, board preparation, and customer executive relationship tasks.
  inputs:
  - title: stakeholder_name
    type: string
  - title: account_name
    type: string
  - title: engagement_purpose
    type: string
  - title: board_agenda
    type: string
  - title: executive_relationship_data
    type: string
  - title: strategic_context
    type: string
  outputs:
  - title: executive_stakeholder_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: vp-sales-csuite-alignment
      input: stakeholder_name, engagement_purpose, strategic_context, relationship_history
      description: Prepare C-suite engagement strategy with messaging framework and ask definition
    - step: 2
      prompt: vp-sales-board-prep
      input: board_agenda, revenue_narrative, risk_items, ask_items, competitive_landscape
      description: Build board presentation with data-backed narrative and clear decision requests
    - step: 3
      prompt: vp-sales-customer-executive
      input: account_name, executive_relationship_data, deal_context, engagement_purpose
      description: Plan customer executive engagement for strategic deal advancement or retention
- component_type: Flow
  id: performance-optimization
  name: Performance Optimization
  description: Flow for Sales Director coaching, QBR orchestration, and rep productivity tasks.
  inputs:
  - title: director_name
    type: string
  - title: team_metrics
    type: string
  - title: qbr_data
    type: string
  - title: productivity_data
    type: string
  - title: coaching_focus
    type: string
  - title: review_period
    type: string
  outputs:
  - title: performance_optimization_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: vp-sales-director-coaching
      input: director_name, team_metrics, coaching_focus, leadership_competencies
      description: Coach Sales Directors on team leadership, pipeline management, and talent development
    - step: 2
      prompt: vp-sales-qbr-orchestration
      input: qbr_data, regional_targets, director_results, strategic_priorities
      description: Orchestrate quarterly business reviews across Directors with consistent framework
    - step: 3
      prompt: vp-sales-rep-productivity
      input: productivity_data, revenue_per_rep, ramp_curves, activity_metrics
      description: Analyze rep productivity patterns and identify systemic improvement levers
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - revenue-strategy
    - org-development
    - forecast-governance
    - executive-stakeholder
    - performance-optimization
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain
x-ea-agent:
  prompt_registry: {}
  profile:
    why: 'VP Sales spend time compiling board decks, reconciling forecast roll-ups, and manually tracking org health instead of setting strategy and coaching their Directors.

      '
    human_matters_summary: 'The agent surfaces data, prepares materials, and tracks patterns, but the VP brings vision, executive presence, organizational instinct, and the authority that aligns teams behind a strategy.

      '
    human_matters_goal: 'Every strategic decision is data-informed, every Director is coached on leading, and the region delivers because the VP set the direction no algorithm can replicate.

      '
    role_tab_intro: 'A VP Sales manages 3-8 Sales Directors, owns $20M-$100M+ in regional revenue, and must balance growth with profitability while aligning sales execution with marketing, product, and customer success strategy. The challenges below are where strategic time gets lost to operational overhead, forecast reconciliation, and organizational firefighting, each mapped to the sub-agent built to handle it.

      '
    role_context: 'The VP Sales / Regional VP owns the regional or segment P&L, translating company-wide revenue targets into territory-level execution plans. They manage a team of Sales Directors, each running their own teams of AEs, and are accountable for forecast accuracy at the roll-up level where individual Director forecasts aggregate into board-level commitments. The VP engages C-suite customers on strategic deals, represents sales in cross-functional leadership meetings with marketing, product, CS, and finance, and owns decisions on territory design, headcount allocation, and compensation plan structure. Their operating rhythm spans weekly pipeline reviews with Directors, monthly performance assessments, quarterly business reviews, and annual planning cycles.

      '
    goals_summary: 'The VP Sales succeeds when regional revenue targets are met, forecast accuracy holds at roll-up, Directors develop into strong leaders, and the organization scales without losing velocity.

      '
    goals:
    - Achieve regional revenue target with balanced attainment across all territories
    - Deliver 15-25% year-over-year revenue growth aligned with company plan
    - Maintain forecast accuracy within 5% at the regional roll-up level
    - Sustain 3.5x+ pipeline coverage across all Director teams combined
    - Develop Sales Directors into next-level leaders with documented growth plans
    - Optimize territory coverage so no territory exceeds 120% or falls below 80% of median capacity
    - Align GTM motions with marketing demand gen and product launch timelines
    - Execute cross-functional revenue planning with CS, product, and finance quarterly
    - Improve rep productivity (revenue per rep) by 10-15% year-over-year
    - Maintain or improve competitive win rate across the region quarter-over-quarter
    - Retain 90%+ of regional ARR through proactive engagement on at-risk accounts
    - Deliver board-level reporting with clear narrative, variance explanation, and forward outlook
    - Reduce Sales Director ramp time through structured onboarding and coaching cadences
    - Build a succession bench with at least 2 Director-ready candidates at all times
    key_metrics:
    - name: Regional Revenue Attainment
      definition: Actual closed revenue vs. regional target, tracked monthly and quarterly
    - name: Year-over-Year Growth Rate
      definition: Revenue growth compared to same period prior year, broken down by segment and territory
    - name: Forecast Accuracy (Roll-up)
      definition: Variance between committed forecast and actual close at the regional aggregate level
    - name: Pipeline Coverage (Regional)
      definition: Total qualified pipeline across all Director teams divided by remaining regional target
    - name: Rep Productivity (Revenue per Rep)
      definition: Total revenue divided by number of ramped quota-carrying reps in region
    - name: Sales Director Quota Attainment Spread
      definition: Standard deviation of quota attainment across Directors, measuring balance of territory performance
    - name: Customer Acquisition Cost (Regional)
      definition: Total sales cost (comp, tools, travel, marketing allocation) divided by new logos acquired in region
    key_responsibilities:
    - Set regional revenue strategy and translate company targets into territory-level execution plans
    - Design territory coverage model balancing workload, revenue potential, and geographic efficiency
    - Approve compensation plans and quota distribution across Directors and their teams
    - Own forecast commit to board and CRO with variance accountability
    - Conduct weekly pipeline review with Sales Directors to validate coverage and deal progression
    - Coach Sales Directors on leadership, team management, and strategic thinking
    - Resolve cross-team resource conflicts including SE allocation and specialist deployment
    - Engage C-suite customers for strategic deal support and executive sponsorship
    - Represent sales in executive leadership meetings with marketing, product, CS, and finance
    - Approve headcount and hiring plans including role design and ramp timeline
    - Drive GTM motion alignment with marketing on demand gen, events, and campaign strategy
    - Review competitive positioning strategy and adjust regional approach based on win/loss patterns
    - Oversee deal desk exceptions above Director authority threshold
    - Manage quarterly business reviews across all Director teams with consistent framework
    - Own succession planning and leadership development pipeline for the sales organization
    - Monitor regional customer retention and escalate at-risk accounts before renewal
    challenges:
    - text: Forecast roll-up accuracy degrades as individual Director biases compound at the regional level
      solved_by: vp-forecast-agent
      specific_overhead:
      - Manually reconciling Director forecasts against engagement data before each board call
    - text: Territory imbalances go undetected until attainment variance surfaces at quarter end
      solved_by: vp-revenue-strategy-agent
      specific_overhead:
      - Building territory analysis spreadsheets comparing workload, potential, and rep capacity manually
    - text: Scaling the organization while maintaining selling culture and manager effectiveness
      solved_by: vp-org-talent-agent
      specific_overhead:
      - Tracking hiring pipeline, ramp progress, and attrition risk across multiple Director teams
    - text: Cross-geography and cross-segment coordination requires constant alignment meetings
      solved_by: vp-executive-agent
      specific_overhead:
      - Scheduling and preparing for alignment meetings with peers across regions and functions
    - text: Executive stakeholder relationships require sustained engagement that competes with operational demands
      solved_by: vp-executive-agent
      specific_overhead:
      - Preparing executive briefing materials and relationship status updates before every engagement
    - text: Balancing growth investment against profitability targets with limited data on ROI by motion
      solved_by: vp-revenue-strategy-agent
      specific_overhead:
      - Assembling cost-to-serve analysis across segments to justify investment decisions
    - text: Talent acquisition in competitive markets where top candidates have multiple offers
      solved_by: vp-org-talent-agent
      specific_overhead:
      - Reviewing candidate pipelines, comp benchmarking, and closing strategies for key hires
    - text: GTM motion alignment with marketing breaks down when campaign timing does not match territory priorities
      solved_by: vp-performance-agent
      specific_overhead:
      - Manually correlating marketing campaign coverage with territory pipeline gaps
    administrative_overhead:
    - text: Compiling board-level revenue narrative from Director forecast submissions
      automated_by: vp-forecast-agent
    - text: Building territory performance dashboards with attainment variance and capacity data
      automated_by: vp-revenue-strategy-agent
    - text: Tracking headcount status, ramp progress, and attrition risk across teams
      automated_by: vp-org-talent-agent
    - text: Preparing executive engagement briefs and relationship history before customer meetings
      automated_by: vp-executive-agent
    - text: Assembling QBR materials across Director teams into a consistent regional view
      automated_by: vp-performance-agent
    - text: Reconciling pipeline coverage and forecast variance data from multiple CRM views
      automated_by: vp-forecast-agent
    - text: Building compensation plan models and quota distribution scenarios
      automated_by: vp-revenue-strategy-agent
    - text: Tracking succession pipeline readiness and development plan progress
      automated_by: vp-org-talent-agent
    scenarios:
    - problem: Regional forecast variance detected too late for corrective action
      why: 'When Director forecasts are reviewed individually without cross-Director pattern analysis, systemic biases compound. A VP reviewing five Directors'' commits in isolation misses that four of five are over-forecasting early-stage deals by 20%+. The roll-up looks healthy until close day when the variance materializes as a miss.

        '
      agent: vp-sales-agent
      agent_response: 'Routes forecast data to the Forecast Governance Agent for cross-Director variance analysis, comparing commit patterns against historical accuracy by Director and stage. Surfaces systemic bias patterns, flags Directors whose commits diverge from engagement signals, and produces an adjusted regional forecast with confidence bands the VP can present to the board.

        '
      success_signal:
        metric: Forecast variance detected 3+ weeks before quarter close
        target: Regional forecast accuracy within 5% of actual at roll-up level
        leading_indicator: VP adjusts Director commits based on variance pattern alerts before board call
        failure_signal: Forecast miss discovered only at quarter close with no time for recovery action
    - problem: Territory imbalances cause attainment disparity across Director teams
      why: 'Territory design decisions made at annual planning become outdated as markets shift, reps turn over, and account potential changes. Without continuous monitoring, some territories become oversaturated while others are under-covered, creating attainment gaps that surface only in quarterly reviews.

        '
      agent: vp-sales-agent
      agent_response: 'Routes territory data to the Revenue Strategy Agent for workload and potential analysis across all territories. Produces a rebalancing recommendation with impact modeling showing projected attainment shifts, rep-level changes, and transition timelines. Includes customer relationship risk assessment for any proposed account moves.

        '
      success_signal:
        metric: Territory attainment variance within 20% across all teams
        target: No territory below 80% or above 130% of median attainment
        leading_indicator: Rebalancing recommendations generated mid-year before variance compounds
        failure_signal: More than 2 territories miss quota by 30%+ while others exceed by 40%+
    - problem: Sales Director performance gaps go unaddressed until attrition or team underperformance
      why: 'VPs track Director performance through quarterly numbers, but lagging indicators miss the coaching moments. By the time a Director''s team underperforms for a full quarter, the root cause, whether pipeline management, deal coaching, or hiring decisions, has been compounding for months.

        '
      agent: vp-sales-agent
      agent_response: 'Routes performance data to the Performance Optimization Agent for leading-indicator analysis across pipeline health, team engagement, hiring velocity, and coaching cadence. Produces a Director effectiveness scorecard with specific development recommendations and coaching conversation guides. Flags Directors showing leading-indicator decline before revenue impact materializes.

        '
      success_signal:
        metric: Director performance gaps identified through leading indicators
        target: Coaching intervention initiated within 30 days of leading-indicator decline
        leading_indicator: VP has data-backed coaching agenda for every Director 1:1
        failure_signal: Director underperformance discovered only through quarterly revenue miss
    - problem: Competitive threat changes require rapid GTM response across the region
      why: 'When a competitor changes pricing, launches a new product, or acquires a partner, the VP needs to assess impact across all active deals and territories simultaneously. Without rapid cross-region analysis, each Director responds independently with inconsistent messaging and uncoordinated competitive positioning.

        '
      agent: vp-sales-agent
      agent_response: 'Routes competitive intelligence to both the Revenue Strategy Agent for market-level impact assessment and the Performance Optimization Agent for deal-level exposure analysis. Produces a coordinated competitive response plan with updated positioning, talk tracks, and territory-specific recommendations that all Directors can execute consistently.

        '
      success_signal:
        metric: Competitive response plan distributed within 48 hours of threat detection
        target: Consistent competitive positioning across all Director teams within one week
        leading_indicator: Win rate holds steady in deals where competitor is present
        failure_signal: Each Director team develops independent competitive responses with conflicting messaging
    - problem: Quarterly planning consumes weeks of VP time assembling data from multiple sources
      why: 'Annual and quarterly planning requires synthesizing forecast data, territory performance, org health, competitive landscape, and market trends into a coherent strategy. When each data source lives in a different system and each Director submits plans in different formats, the VP spends weeks on assembly instead of strategy.

        '
      agent: vp-sales-agent
      agent_response: 'Routes data collection to all five sub-agents in parallel: Revenue Strategy for territory and GTM analysis, Org & Talent for headcount and capacity planning, Forecast Governance for pipeline and commit modeling, Executive Stakeholder for relationship mapping, and Performance Optimization for productivity benchmarks. Aggregates into a unified quarterly plan with clear resource asks, risk items, and strategic priorities.

        '
      success_signal:
        metric: Quarterly planning cycle reduced from 3 weeks to 1 week
        target: Complete quarterly plan with all five dimensions in a single integrated document
        leading_indicator: VP spends planning time on strategy decisions rather than data assembly
        failure_signal: Planning cycle still requires manual data collection from 5+ systems over 2+ weeks
    capabilities:
    - Regional revenue strategy and target decomposition
    - Territory design and coverage optimization
    - GTM motion planning and market segmentation
    - Compensation plan design and quota modeling
    - Sales organization design and scaling
    - Talent acquisition strategy and succession planning
    - Forecast governance and commit validation at roll-up level
    - Board-level revenue reporting and variance narrative
    - C-suite customer engagement for strategic deals
    - Cross-functional leadership alignment (marketing, product, CS, finance)
    - Sales Director coaching and leadership development
    - QBR orchestration and performance benchmarking
    - Competitive response coordination across territories
    - Rep productivity analysis and improvement levers
    stakeholder_landscape:
      external:
      - 'Customer C-suite: strategic deal engagement and executive sponsorship for top-tier accounts'
      - 'Board members: quarterly revenue reporting, forecast accuracy, and growth narrative'
      - 'Channel/Partner leadership: GTM alignment on co-sell motions and partner-sourced pipeline'
      - 'Industry analysts: market positioning input and competitive landscape validation'
      internal:
      - 'CRO/CEO: strategy alignment, forecast commits, resource requests, and organizational decisions'
      - 'Sales Directors: team management, coaching, pipeline reviews, and territory execution'
      - 'Marketing VP: demand generation alignment, campaign coordination, and lead quality feedback'
      - 'CS VP: retention and expansion collaboration, customer health escalation, and renewal strategy'
      - 'Product VP: roadmap input from field, feature request prioritization, and competitive gaps'
      - 'Finance/FP&A: budget management, forecast reconciliation, and investment ROI tracking'
      - 'HR: talent acquisition, compensation benchmarking, and organizational development'
      - 'RevOps Director: data infrastructure, process automation, and reporting enablement'
    sub_agents:
    - name: Revenue Strategy Agent
      id: vp-revenue-strategy-agent
      purpose: GTM planning, territory design, market segmentation, compensation modeling
    - name: Organization & Talent Agent
      id: vp-org-talent-agent
      purpose: Hiring plans, team scaling, succession planning, org design
    - name: Forecast Governance Agent
      id: vp-forecast-agent
