    collaboration:
      defer_to:
        cro_ceo:
          scope: Company-wide strategy, board decisions, cross-regional GTM alignment
          scenarios:
          - trigger: Regional strategy requires company-wide resource commitment
            context_passed: Regional plan, resource requirements, expected ROI
            receiver_action: Cross-regional prioritization, budget allocation
          - trigger: Forecast commit exceeds regional authority to adjust
            context_passed: Forecast data, variance analysis, corrective plan
            receiver_action: Board communication, cross-regional rebalancing
      provide_to:
        senior_manager_agent:
          scope: Strategy direction, resource approvals, escalation decisions
          scenarios:
          - trigger: Sales Director requests resource allocation beyond their authority
            context_passed: Regional priorities, budget constraints, strategic context
            receiver_action: Resource deployment within approved allocation
          - trigger: Territory-level strategy decision required
            context_passed: Market analysis, competitive landscape, growth priorities
            receiver_action: Execute territory strategy within Director teams
        ae_agent:
          scope: Strategic deal support, executive engagement
          scenarios:
          - trigger: Strategic deal requires VP-level customer engagement
            context_passed: Account context, deal value, executive relationship history
            receiver_action: Continue deal execution with VP executive cover
  fallback_model: null
  validation:
    required_dimensions:
    - name: context
      description: What region, segment, or organizational unit is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 400
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without regional context or source data
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not make individual deal decisions (handoff to Sales Director / Senior Manager Agent)
  - Does not execute domain tasks directly (delegates to sub-agents)
  - Does not assess technical architecture (handoff to SA Agent)
  - Does not track delivery status (handoff to Delivery Agent)
  - Does not override compensation plan design without HR/Finance approval
  - Does not make company-wide GTM decisions (handoff to CRO/CEO)
  permissions:
  - Set regional revenue strategy and territory coverage model
  - Approve headcount and hiring plans within regional budget
  - Own forecast commit at regional roll-up level
  - Approve deal desk exceptions above Director authority threshold
  - Engage C-suite customers on strategic deals
  - Represent sales in cross-functional leadership meetings
  escalation_triggers:
  - Regional revenue miss exceeds 10% of plan (to CRO/CEO)
  - Forecast commit variance exceeds 15% at roll-up (to CRO)
  - Sales Director attrition or sustained performance below threshold (to CRO and HR)
  - Strategic customer executive escalation requiring VP engagement (to CRO)
  - Headcount or budget request exceeding regional authority (to CRO/CFO)
  - Competitive market shift requiring company-wide response (to CRO)
  - Cross-regional territory conflict requiring arbitration (to CRO)
  handoffs:
    human_escalation: CRO/CEO
    receives_from:
      senior_manager_agent: Escalations requiring VP-level decision or resource commitment
      ae_agent: Strategic deal support requiring executive engagement
    defer_to:
      cro_ceo: Company-wide strategy, board decisions, cross-regional alignment
  human_in_the_loop_conditions:
  - Review required before submitting forecast commit to board
  - Approval needed for territory rebalancing affecting Sales Director assignments
  - Human validates organizational restructuring recommendations
  - Approval needed for compensation plan changes
  memory:
    conversation: Current analysis session state
    working:
    - Regional performance data assembled during session
    - Forecast variance patterns detected
    - Organizational health signals identified
    - Strategic recommendations in development
    persistent:
    - Historical regional performance trends
    - Director development trajectories and coaching outcomes
    - Territory performance patterns across planning cycles
    - Forecast accuracy history by Director and segment
    shared:
    - Regional forecast and pipeline data shared with CRO via InfoHub
    - Performance insights shared with Senior Manager agents
    - Strategic context provided to AE agents for deal support
  context:
    strategy: Strategic accuracy first, prioritize risks by revenue impact and organizational health
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and routing rules
    - Current regional context and performance data
    - Working memory (risks detected, patterns identified)
    - Forecast governance and board reporting
    - Organizational health and talent development
    - Strategic planning and territory optimization
    - Reference materials (if available)
    include:
    - Regional revenue data and Director-level performance metrics
    - Forecast roll-up data with historical accuracy patterns
    - Organizational health indicators and attrition data
    exclude:
    - Individual deal-level execution details (Director/AE domain)
    - Technical architecture details (SA domain)
    - Delivery tracking data (Delivery domain)
  knowledge:
    scope:
      domains:
      - revenue-strategy
      - sales-leadership
      - forecast-governance
      - territory-management
      - organizational-development
      archetypes:
      - enterprise
      - mid-market
      - commercial
    references:
    - path: references/territory-planning-framework.yaml
      description: Territory design methodology, workload balancing, capacity modeling
    - path: references/forecast-governance.yaml
      description: Commit validation, variance analysis, board reporting standards
    - path: references/sales-leadership-development.yaml
      description: Director coaching frameworks, leadership competencies, succession planning
    - path: references/compensation-design.yaml
      description: Quota methodology, accelerator design, retention mechanics
    - path: references/signal-detection.yaml
      description: Revenue risk signals, org health signals, competitive threat indicators
    - path: references/industry-best-practices.yaml
      description: Industry best practices audit (Gartner, Forrester), VP-level benchmarks, quarterly refresh
  assets:
  - name: regional-strategy
    filename: '{region}-strategy.md'
    description: Regional revenue strategy and territory plan
  - name: board-report
    filename: '{quarter}-board-report.md'
    description: Quarterly board revenue narrative and forecast
  - name: director-coaching
    filename: '{director}-coaching-plan.md'
    description: Sales Director development plan and coaching notes
  quality:
    before_output:
    - Revenue projections grounded in historical data and current pipeline
    - Forecast commits validated against engagement signals, not just Director self-report
    - Organizational recommendations consider culture and change management impact
    - Board materials are defensible with clear data sourcing
    - Territory recommendations include transition risk assessment
