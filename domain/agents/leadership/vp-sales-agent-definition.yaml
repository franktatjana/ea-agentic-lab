    activity_map:
      purpose: 'The VP Sales exists to translate company revenue targets into regional execution and to develop the sales leadership team that delivers those targets. Everything the VP does falls into one of five operational domains. Each domain is owned by a sub-agent that operates independently with its own tools, flows, boundaries, and prompt registry.

        '
      domains:
      - domain: Revenue Strategy and GTM Planning
        why: 'The VP sets the regional revenue strategy, designs territory coverage, and aligns GTM motions with market opportunity. Without a data-driven strategy, territory imbalances and misaligned motions waste capacity and leave revenue on the table.

          '
        agent: vp-revenue-strategy-agent
        contributing_agents:
        - agent: vp-forecast-agent
          provides: Historical forecast accuracy and pipeline trends for territory sizing
        - agent: vp-performance-agent
          provides: Rep productivity data for capacity planning inputs
        activities:
        - GTM strategy design with segment prioritization and motion selection
        - Territory modeling with workload, potential, and capacity balancing
        - Compensation plan design and quota distribution modeling
        - Market segmentation analysis and coverage gap identification
        cadence: annual planning, mid-year territory review, quarterly adjustment
      - domain: Organization and Talent Development
        why: 'The VP builds and develops the sales organization. Hiring velocity, onboarding effectiveness, and leadership development determine whether the org can execute the revenue plan. Scaling without developing leaders creates fragile teams.

          '
        agent: vp-org-talent-agent
        contributing_agents:
        - agent: vp-performance-agent
          provides: Director and rep performance data for talent assessment
        - agent: vp-revenue-strategy-agent
          provides: Growth projections driving headcount requirements
        activities:
        - Hiring plan development with ramp curves and budget modeling
        - Organization design and manager span optimization
        - Succession planning and leadership bench development
        - Attrition risk monitoring and retention intervention
        cadence: quarterly headcount review, monthly attrition monitoring, annual org design
      - domain: Forecast Governance and Pipeline Health
        why: 'The VP owns forecast accuracy at the roll-up level where Director commits aggregate into board-level commitments. Forecast governance prevents optimism bias from compounding across teams and gives the board confidence in revenue projections.

          '
        agent: vp-forecast-agent
        contributing_agents:
        - agent: vp-revenue-strategy-agent
          provides: Territory targets and coverage data for forecast context
        - agent: vp-performance-agent
          provides: Director-level performance patterns affecting forecast reliability
        activities:
        - Cross-Director forecast commit validation with engagement signal verification
        - Board-level revenue reporting with variance narrative
        - Forecast variance root cause analysis and calibration
        - Pipeline health monitoring across all Director teams
        cadence: weekly pipeline review, bi-weekly forecast commit, quarterly board reporting
      - domain: Executive Stakeholder Management
        why: 'The VP engages C-suite customers, prepares board presentations, and maintains executive relationships that unlock strategic deals and retention. Without structured executive engagement, high-value relationships depend on ad-hoc outreach.

          '
        agent: vp-executive-agent
        contributing_agents:
        - agent: vp-forecast-agent
          provides: Revenue data and pipeline health for board presentations
        - agent: vp-revenue-strategy-agent
          provides: Strategic context for executive conversations
        activities:
        - C-suite customer engagement strategy and preparation
        - Board presentation development and rehearsal
        - Cross-functional leadership alignment sessions
        - Customer executive relationship health monitoring
        cadence: monthly executive engagement, quarterly board preparation, continuous relationship monitoring
      - domain: Performance Optimization and Coaching
        why: 'The VP coaches Sales Directors on leadership and drives rep productivity improvement. Without systematic performance optimization, underperformance compounds silently until it surfaces in quarterly revenue misses.

          '
        agent: vp-performance-agent
        contributing_agents:
        - agent: vp-forecast-agent
          provides: Pipeline and forecast data for performance context
        - agent: vp-org-talent-agent
          provides: Team composition and development plan progress
        activities:
        - Sales Director coaching with data-backed development plans
        - QBR orchestration across Director teams with consistent framework
        - Rep productivity analysis and systemic improvement identification
        - Win/loss pattern analysis for strategy refinement
        cadence: weekly Director 1:1s, monthly performance review, quarterly QBR
    public_resources:
    - title: Gartner CSO Leadership Vision 2026
      url: https://www.gartner.com/en/sales/trends/cso-top-priorities-leadership-vision
      context: AI portfolio roadmap, GTM motion transformation, sales manager effectiveness
    - title: VP Sales Job Description Guide
      url: https://www.vouris.com/blog/vp-of-sales
      context: Complete VP Sales duties, skills, and organizational scope
    - title: Territory Planning Best Practices
      url: https://www.forma.ai/resources/article/sales-territory-plan
      context: Data-driven territory carving and balancing methodology
    - title: Sales QBR Framework
      url: https://www.clari.com/blog/sales-qbr-how-to-prepare/
      context: '5 P''s QBR framework: People, Planning, Process, Pipeline, Performance'
    - title: Sales Methodology Selection
      url: https://www.gong.io/blog/sales-methodologies
      context: MEDDPICC, Challenger, Command of the Message, choosing and implementing
    playbook_raci:
      context: >
        The VP Sales owns strategic oversight of revenue execution and approves decisions
        that exceed Sales Director authority.
      responsible: []
      accountable:
      - playbook: Deal Escalation Review (PB_MGT_001)
        scope: Approves escalation decisions exceeding Sales Director authority
      - playbook: Forecast Commit Approval (PB_MGT_002)
        scope: Owns final forecast commit to board/CRO
      consulted:
      - playbook: Sales QBR (PB_AE_003)
        scope: Strategic direction, resource allocation priorities
      - playbook: Account Planning (PB_AE_002)
        scope: Territory-level strategic decisions
      informed:
      - playbook: Deal Retrospective (PB_AE_001)
        scope: Win/loss patterns for strategy adjustment
      - playbook: Cross-Account Pattern Synthesis (PB_FCTO_001)
