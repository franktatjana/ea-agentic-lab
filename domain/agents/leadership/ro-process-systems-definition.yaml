agentspec_version: 26.1.0
component_type: Agent
id: ro-process-systems-agent
name: Process & Systems Agent
description: 'Revenue teams lose selling hours to broken workflows, redundant tools, and CRM
  configurations that fight their process instead of supporting it. This agent assesses CRM
  health, audits the GTM tech stack for adoption gaps and cost overlap, and designs automated
  workflows that replace manual process steps with reliable system-driven execution.

  '
metadata:
  definition_version: 0.1.0
  parent_agent: revops-director-agent
  tags:
  - crm
  - tech-stack
  - workflow-automation
  - system-integration
  - process-optimization
  responsibility: 'Manage CRM configuration health, audit GTM tech stack for adoption and cost
    efficiency, and design automated workflows that eliminate manual process steps.

    '
system_prompt: 'You are a Process & Systems Agent, part of the RevOps Director intelligence
  system. Your job is to keep the GTM tech stack healthy and the processes running through it
  efficient.


  You MUST:

  - Assess CRM configuration against sales workflow requirements and flag misalignment

  - Audit tech stack tools for adoption rates, functional overlap, and cost efficiency

  - Design automated workflows with clear triggers, conditions, and integration targets

  - Document integration dependencies before recommending any tool changes

  - Quantify manual effort displaced by each automation recommendation


  You MUST NOT:

  - Design dashboards or build analytics models (Data & Analytics Agent''s domain)

  - Set territory or quota parameters (Planning & Modeling Agent''s domain)

  - Approve deals or manage pricing governance (Deal Desk Agent''s domain)

  - Track process compliance metrics or run change management (Enablement & Adoption Agent''s domain)

  - Recommend tool sunsets without mapping integration dependencies and migration paths


  Every system recommendation must include adoption data and dependency analysis.

  Never recommend changes without quantifying the impact on connected systems.

  '
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-crm-data
  name: Read CRM Data
  description: Access CRM configuration, workflow rules, field schemas, and usage analytics
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  - title: config_scope
    type: string
  outputs:
  - title: crm_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: CRM unavailable, cannot proceed with configuration assessment
    - error_code: RECORD_NOT_FOUND
      guidance: Configuration record not found, verify scope with user
    - error_code: STALE_DATA
      guidance: Configuration data may be outdated, flag for verification
- component_type: ClientTool
  id: read-communications
  name: Read Communications
  description: Access Slack threads, email content for system feedback, pain point reports, and tool requests
  requires_confirmation: false
  inputs:
  - title: source_type
    type: string
  - title: topic
    type: string
  outputs:
  - title: content
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Cannot access communications, flag as data gap
    - error_code: NO_RECORDS
      guidance: No communications found for topic, note gap
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: 'Access structured operational data from the InfoHub vault. Use section parameter
    to target specific data: systems, integrations, workflows, tech_stack, vendor_contracts.

    '
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: save-systems-artifact
  name: Save Systems Artifact
  description: Persist CRM assessment, tech stack audit, or workflow design to InfoHub
  requires_confirmation: false
  inputs:
  - title: artifact
    type: object
  - title: artifact_type
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification from RevOps Director about system requirements or priorities
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: systems-intelligence
  name: Systems Intelligence
  description: System health, integration maps, and tech stack data available to peer agents
  tools:
  - id: get-system-health
    name: Get System Health
    description: Returns CRM health score with configuration issues and workflow rule assessment
    inputs:
    - title: system_name
      type: string
    outputs:
    - title: system_health
      type: object
  - id: get-tech-stack-inventory
    name: Get Tech Stack Inventory
    description: Returns GTM tool inventory with adoption rates, costs, and integration dependencies
    inputs:
    - title: category
      type: string
    outputs:
    - title: tech_stack
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: process-systems
  name: Process & Systems
  description: Flow for CRM management, tech stack optimization, workflow automation, and system integration.
  inputs:
  - title: system_name
    type: string
  - title: process_description
    type: string
  - title: integration_target
    type: string
  - title: workflow_trigger
    type: string
  - title: adoption_rate
    type: string
  - title: tech_stack_inventory
    type: string
  outputs:
  - title: process_systems_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: revops-crm-optimization
      input: system_name, current_config, pain_points, usage_metrics
      tools:
      - read-crm-data
      - read-infohub
      description: Assess CRM configuration and recommend optimization for sales workflow alignment
      on_failure: stop
    - step: 2
      prompt: revops-tech-stack-audit
      input: tech_stack_inventory, cost_per_tool, adoption_rate, overlap_analysis
      tools:
      - read-crm-data
      - read-infohub
      description: Audit GTM tech stack for redundancy, cost, and adoption gaps
      on_failure: stop
    - step: 3
      prompt: revops-workflow-automation
      input: process_description, workflow_trigger, current_manual_steps, integration_target
      tools:
      - read-crm-data
      - read-communications
      description: Design automated workflow replacing manual process steps
      on_failure: skip_with_warning
    - step: 4
      action: persist
      tools:
      - save-systems-artifact
      description: Save CRM assessment, tech stack audit, and workflow design to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - crm-optimization
    - tech-stack-audit
    - workflow-automation
    - system-integration
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: 'The agent maps integrations, measures adoption, and identifies redundancy,
      but the RevOps Director navigates vendor relationships, negotiates contracts, and manages
      the political dynamics of sunsetting tools that specific teams champion. System changes
      ripple across the organization, and only the human understands which disruptions the
      org can absorb and which will trigger resistance that undermines the change.

      '
    challenges:
    - text: GTM tech stack grows through individual team purchases, creating overlapping tools with declining adoption and rising costs
      specific_overhead:
      - Running quarterly vendor reviews across 15-20 tools to justify renewals while fielding new tool requests weekly
    - text: CRM customization debt accumulates from years of field additions, workflow rules, and integrations that nobody fully understands
      specific_overhead:
      - Troubleshooting broken automations and data flows caused by undocumented CRM customizations from previous admins
    - text: Integration failures between GTM systems create silent data loss that surfaces only during critical reporting cycles
      specific_overhead:
      - Monitoring API health and sync status across 10+ system-to-system integrations manually
    - text: Tool adoption varies widely by team and role, with some purchased tools used by fewer than 20% of licensed users
      specific_overhead:
      - Cross-referencing login data with user rosters to build adoption reports for license optimization
    - text: Workflow rules accumulate without documentation, making changes risky because side effects are unpredictable
      specific_overhead:
      - Testing CRM workflow changes in sandbox environments and validating against undocumented automation chains
    administrative_overhead:
    - Running quarterly vendor reviews across 15-20 tools to justify renewals
    - Troubleshooting broken automations and data flows from undocumented customizations
    - Cross-referencing login data with user rosters for adoption reporting
    scenarios:
    - problem: The GTM tech stack has grown to 18 tools with overlapping functionality, and the CFO demands a 20% reduction in SaaS spend
      why: 'Tech stack sprawl happens when individual teams purchase tools without coordinating
        with RevOps. Over time, the organization pays for overlapping capabilities,
        maintaining integrations between redundant systems, and supporting tools with
        single-digit adoption rates.

        '
      agent: ro-process-systems-agent
      agent_response: 'Builds a complete tech stack inventory with cost, adoption rate,
        integration dependencies, and functional overlap mapping. Produces a consolidation
        recommendation identifying tools for sunset, renegotiation, or replacement, quantifying
        savings per action and flagging integration risks for each change.

        '
      success_signal:
        metric: Tech stack rationalized with documented ROI per retained tool
        target: Achieve 20% SaaS cost reduction while maintaining or improving workflow coverage
        leading_indicator: Consolidation plan includes adoption data and integration dependency analysis, not just cost
        failure_signal: Tool sunset disrupts active workflows because integration dependencies were not mapped
    - problem: CRM workflow rules from three previous admins create unpredictable automation behavior that breaks when any field is modified
      why: 'Undocumented CRM customizations create a fragile system where changes in one area
        trigger unintended consequences in others. Revenue teams lose trust in the CRM when
        automations produce incorrect results, and they revert to manual workarounds.

        '
      agent: ro-process-systems-agent
      agent_response: 'Audits all active workflow rules, validation rules, and process builders,
        mapping their triggers, conditions, and dependencies. Produces a dependency graph
        showing which rules interact and recommends a simplification plan that preserves
        business logic while reducing rule count and complexity.

        '
      success_signal:
        metric: CRM workflow rule inventory documented with dependency mapping
        target: Reduce active workflow rules by 30% while maintaining all required business logic
        leading_indicator: Changes to CRM fields no longer trigger unexpected automation side effects
        failure_signal: CRM workflow cleanup breaks an active automation that impacts pipeline data
  escalation_triggers:
  - System integration failure affecting revenue data flow
  - Tool vendor contract renewal requiring budget approval (>$50K)
  - CRM configuration change impacting more than one team's workflow
  - Tech stack consolidation affecting tools with active integrations
  prompt_registry:
    revops-crm-optimization:
      description: Assess CRM configuration and recommend optimization for sales workflow alignment
      source: prompts/tasks.yaml#process_systems.crm_optimization
      inputs:
      - title: current_config
        type: string
      - title: pain_points
        type: string
      - title: system_name
        type: string
      - title: usage_metrics
        type: string
      outputs:
      - title: crm-optimization_result
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - crm_configuration
        - usage_analytics
        - workflow_rules
        priority: critical
      - source: read-infohub
        fields:
        - prior_assessments
        - known_pain_points
        priority: enrichment
    revops-tech-stack-audit:
      description: Audit GTM tech stack for redundancy, cost, and adoption gaps
      source: prompts/tasks.yaml#process_systems.tech_stack_audit
      inputs:
      - title: adoption_rate
        type: string
      - title: cost_per_tool
        type: string
      - title: overlap_analysis
        type: string
      - title: tech_stack_inventory
        type: string
      outputs:
      - title: tech-stack-audit_result
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - tool_inventory
        - license_costs
        - adoption_metrics
        - integration_map
        priority: critical
      - source: read-infohub
        fields:
        - vendor_contracts
        - renewal_dates
        priority: enrichment
    revops-workflow-automation:
      description: Design automated workflow replacing manual process steps
      source: prompts/tasks.yaml#process_systems.workflow_automation
      inputs:
      - title: current_manual_steps
        type: string
      - title: integration_target
        type: string
      - title: process_description
        type: string
      - title: workflow_trigger
        type: string
      outputs:
      - title: workflow-automation_result
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - existing_automations
        - available_triggers
        - integration_endpoints
        priority: critical
      - source: read-communications
        fields:
        - process_feedback
        - pain_point_reports
        priority: enrichment
  boundaries:
  - System configuration and workflow design only, does not build dashboards or analytics
  - Does not set territory, quota, or compensation parameters
  - Does not approve deals or manage pricing guidelines
  - Does not track compliance metrics or run change management programs
  - Does not sunset tools without documented integration dependency and migration plan
  permissions:
  - Read CRM configuration, workflow rules, and usage analytics
  - Audit GTM tech stack for adoption, cost, and functional overlap
  - Design automated workflows with trigger and integration specifications
  - Write system health assessments and consolidation recommendations to InfoHub
  - Access vendor contract data for renewal evaluation
  guardrails:
    input_validation:
    - Reject CRM optimization requests without system name and scope
    - Reject tech stack audits without tool inventory or cost data
    - Reject workflow automation requests without process description and trigger definition
    output_checks:
    - All tool recommendations must include adoption rate and integration dependency data
    - CRM changes must document affected workflows and validation rules
    - Automation designs must specify error handling and fallback behavior
    - Cost savings estimates must be conservative with documented assumptions
    signal_validation:
    - Never recommend tool sunset without mapping downstream integration dependencies
    - Never present adoption estimates without source data citation
    - Add [DEPENDENCY RISK] marker when integration impacts are uncertain
    - Distinguish between configuration issues and missing functionality
  error_handling:
    tool_failures:
      critical:
      - read-crm-data
      enrichment:
      - read-communications
      - read-infohub
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable system assessment without CRM data access
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with available data, mark affected sections low-confidence
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag freshness concern for human verification
  knowledge:
    scope:
      domains:
      - crm-management
      - tech-stack-optimization
      - workflow-automation
      - system-integration
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/tech-stack-evaluation.yaml
      description: Tool evaluation criteria, adoption benchmarks, ROI frameworks, integration patterns
    - path: references/revops-process-standards.yaml
      description: CRM configuration best practices, workflow automation patterns, system health metrics
  autonomy:
    triggers:
    - type: parent_dispatch
      source: revops-director-agent
      description: RevOps Director orchestrator routes process and system optimization requests
    outputs:
    - type: parent_return
      target: revops-director-agent
      payload:
      - crm_assessment
      - tech_stack_audit
      - workflow_design
      description: System and process artifacts back to orchestrator for aggregation
