      - 'Compensation: Administer comp plans and provide data for commission dispute resolution'
    - domain: Deal Desk
      agent: ro-deal-desk-agent
      items:
      - 'Deal Approvals: Evaluate deals against pricing guidelines with historical precedent context'
      - 'Exceptions: Manage non-standard terms with trend analysis and margin impact assessment'
    - domain: Enablement & Adoption
      agent: ro-enablement-agent
      items:
      - 'Compliance: Track process compliance rates by team and identify intervention points before they compound'
      - 'Adoption: Analyze tool adoption barriers and design targeted enablement programs'
    activity_map:
      purpose: 'The RevOps Director exists to build and maintain the operational infrastructure that makes predictable revenue growth possible. Everything the RevOps Director does falls into one of eight operational domains, each owned by a sub-agent that operates independently with its own tools, flows, boundaries, and prompt registry. The broadest sub-agents, covering analytics, systems, and planning, are split into two domains each to reflect the distinct work they perform.

        '
      domains:
      - domain: Reporting & Dashboards
        why: 'Revenue organizations run on the information surfaced in dashboards and reviews. When reports are inconsistent, delayed, or built from conflicting data sources, leadership makes planning decisions on intuition rather than evidence, and forecast accuracy degrades quarter over quarter.

          '
        agent: ro-data-analytics-agent
        contributing_agents:
        - agent: ro-planning-agent
          provides: Territory and quota model outputs for executive dashboard visualization
        - agent: ro-deal-desk-agent
          provides: Discount trend and deal velocity metrics for pipeline reporting
        activities:
        - Executive dashboard design with role-specific KPIs and drill-downs
        - Reporting cadence management across daily, weekly, monthly, and quarterly cycles
        - Forecast variance decomposition to isolate root causes by contributor
        - Metric definition governance to ensure cross-functional alignment on shared numbers
        - Operational review package preparation for board, CRO, and QBR cycles
        cadence: daily automated reports, weekly review packages, monthly metric audits
      - domain: Data Quality & Attribution
        why: 'Decisions are only as reliable as the data behind them. CRM field gaps, duplicate records, and attribution disputes cause leadership to discount the analytics layer and revert to gut-feel planning. The cost compounds when bad data propagates into quota models, territory assignments, and board presentations.

          '
        agent: ro-data-analytics-agent
        contributing_agents:
        - agent: ro-process-systems-agent
          provides: CRM field definitions, integration schemas, and data pipeline health
        - agent: ro-enablement-agent
          provides: Rep compliance data that correlates with CRM update frequency
        activities:
        - Data quality monitoring with field-level completeness and freshness scoring
        - Duplicate detection and deduplication workflow management
        - Multi-touch attribution modeling across marketing and sales touchpoints
        - Attribution methodology governance and cross-functional alignment
        - Data remediation prioritization with rep-level intervention routing
        cadence: daily quality scoring, weekly remediation review, quarterly attribution model refresh
      - domain: CRM Management
        why: 'The CRM is the system of record for every revenue motion, and years of customization from previous admins leave it fragile. Broken automations, undocumented field dependencies, and workflow conflicts cause data loss silently, and the damage surfaces only when forecast calls reveal corrupted pipeline data.

          '
        agent: ro-process-systems-agent
        contributing_agents:
        - agent: ro-data-analytics-agent
          provides: Usage analytics and field-level data quality scores that prioritize optimization work
        - agent: ro-enablement-agent
          provides: User feedback on workflow friction points and adoption barriers
        activities:
        - CRM configuration management and field governance
        - Customization debt audit and remediation roadmap
        - Approval workflow design and maintenance
        - CRM release impact assessment and regression testing
        - Integration schema documentation and change notification processes
        cadence: continuous monitoring, monthly configuration review, per-release regression audit
      - domain: Tech Stack & Workflow
        why: 'GTM tool sprawl creates overlapping capabilities, declining adoption, and rising costs. When individual teams purchase tools without coordination, the organization maintains integrations between redundant systems and pays for licenses that single-digit percentages of the target users open. Finance mandates rationalization but RevOps inherits the inventory risk.

          '
        agent: ro-process-systems-agent
        contributing_agents:
        - agent: ro-enablement-agent
          provides: Tool adoption metrics and user feedback for rationalization decisions
        - agent: ro-data-analytics-agent
          provides: Usage analytics and ROI modeling for each tool in the stack
        activities:
        - GTM tech stack evaluation, integration planning, and sunset decisions
        - Workflow automation design replacing manual process steps
        - System integration monitoring, troubleshooting, and dependency mapping
        - Vendor management including contract negotiations and renewal reviews
        - Tool adoption gap analysis with targeted enablement coordination
        cadence: continuous integration monitoring, quarterly tech stack review, annual vendor assessment
      - domain: Territory & Quota Planning
        why: 'Territory and quota design determine whether reps believe the plan is achievable before the year starts. Models built on stale data or undocumented assumptions produce assignments that managers challenge immediately and reps game throughout the year, eroding both attainment and retention.

          '
        agent: ro-planning-agent
        contributing_agents:
        - agent: ro-data-analytics-agent
          provides: Historical attainment data, conversion rates, and market benchmarks
        - agent: ro-deal-desk-agent
          provides: Average deal sizes and discount rates that calibrate quota targets
        activities:
        - Territory design and rebalancing with multi-scenario modeling
        - Quota setting with achievability analysis and ramp schedule integration
        - Compensation plan administration and commission dispute data preparation
        - Mid-cycle territory adjustment management when headcount changes
        - Annual planning cycle coordination across sales segments and geos
        cadence: annual planning cycle, quarterly territory review, monthly quota attainment tracking
      - domain: Headcount & Capacity Modeling
        why: 'Headcount plans built on optimistic ramp assumptions overstate capacity and set revenue targets beyond what the team can achieve. The gap between planned and actual capacity surfaces in missed forecasts, rep attrition from unachievable quotas, and leadership distrust of the planning model.

          '
        agent: ro-planning-agent
        contributing_agents:
        - agent: ro-data-analytics-agent
          provides: Productivity-by-tenure benchmarks and attrition rate trends
        - agent: ro-process-systems-agent
          provides: HRIS and CRM headcount data for cross-system validation
        activities:
        - Headcount planning with productivity-based ramp-adjusted capacity models
        - Attrition impact modeling on revenue coverage throughout the year
        - Scenario modeling for headcount changes, reorgs, and new segment additions
        - Productivity benchmark development by role, segment, and tenure cohort
        - Cross-functional headcount alignment with Finance and HR on version control
        cadence: annual planning cycle, quarterly reforecast, monthly capacity tracking
      - domain: Deal Desk
        why: 'Without structured deal desk governance, pricing erodes through ad-hoc exceptions and approval bottlenecks delay closes. Individual exceptions appear reasonable in isolation but accumulate into a pattern of margin erosion that only aggregated data can reveal.

          '
        agent: ro-deal-desk-agent
        contributing_agents:
        - agent: ro-data-analytics-agent
          provides: Discount trend analysis and margin impact modeling across the portfolio
        - agent: ro-process-systems-agent
          provides: CPQ system configuration and approval workflow automation
        activities:
        - Deal approval evaluation against pricing guidelines and escalation thresholds
        - Pricing governance with historical precedent analysis and margin impact scoring
        - Non-standard contract term review and risk classification
        - Exception pattern monitoring and policy adjustment recommendations
        - Deal desk turnaround time tracking and SLA management
        cadence: real-time deal processing, monthly trend analysis, quarterly policy review
      - domain: Enablement & Adoption
        why: 'The best-designed process fails if the revenue team does not follow it. Adoption gaps create two compounding problems: the data the team enters into the system degrades, and the process improvements RevOps designed never generate the outcomes they were built to deliver.

          '
        agent: ro-enablement-agent
        contributing_agents:
        - agent: ro-process-systems-agent
          provides: System usage data and feature adoption metrics by role
        - agent: ro-data-analytics-agent
          provides: Compliance rate dashboards and trend analysis for intervention targeting
        activities:
        - Process compliance tracking by team with automated intervention triggers
        - Tool adoption analysis with barrier identification and enablement design
        - Change management planning for new processes and system rollouts
        - Training coordination and post-training effectiveness measurement
        - Process documentation governance and distribution across distributed teams
        cadence: weekly compliance monitoring, monthly adoption review, per-rollout change management
