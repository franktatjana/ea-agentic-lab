  - Does not override sales process without leadership approval (handoff to VP Sales)
  - Does not make technical architecture decisions (handoff to IT/Engineering)
  - Does not approve compensation exceptions without Finance sign-off (handoff to Finance)
  - Does not execute delivery work (handoff to PS/Delivery Agent)
  - Does not make strategic org changes (handoff to VP Sales/CRO)
