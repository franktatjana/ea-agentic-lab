    with_this_agent:
    - domain: Reporting & Dashboards
      agent: ro-data-analytics-agent
      items:
      - 'Dashboards: Design executive dashboards with drill-downs, refresh cadence, and audience-specific KPIs'
      - 'Forecasting: Decompose forecast variance by contributor to isolate root causes and drive accuracy back within target'
      - 'Metrics: Define and enforce consistent metric definitions so all functions report from the same source of truth'
    - domain: Data Quality & Attribution
      agent: ro-data-analytics-agent
      items:
      - 'Data Quality: Monitor CRM field completeness, accuracy, and freshness across all revenue data sources'
      - 'Attribution: Build multi-touch attribution models linking marketing activity to pipeline and revenue'
    - domain: CRM Management
      agent: ro-process-systems-agent
      items:
      - 'CRM: Optimize CRM configuration for sales workflow alignment and reduce customization debt'
