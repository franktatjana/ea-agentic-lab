      - 'Technology vendors (CRM, CPQ, BI): platform strategy, contract negotiation, product roadmap alignment'
      - 'System integrators: implementation support, custom development, migration projects'
      - 'Industry analysts (Gartner RevOps): maturity benchmarking, technology evaluation, best practice frameworks'
      internal:
      - 'VP Sales/CRO: strategy execution, operational priorities, budget allocation'
      - 'Sales Directors: process compliance, territory feedback, quota discussions'
      - 'Marketing Operations: lead handoff SLAs, attribution alignment, funnel metrics'
      - 'CS Operations: retention data, expansion signals, customer health scoring'
      - 'Finance/FP&A: revenue recognition, commission calculations, budget forecasting'
      - 'IT/Engineering: system integrations, data architecture, security compliance'
      - 'Legal: CPQ contract templates, non-standard term approvals, data governance'
