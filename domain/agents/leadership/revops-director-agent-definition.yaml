agentspec_version: 26.1.0
component_type: Agent
id: revops-director-agent
name: RevOps Director Agent
description: >
  Digital twin of the Revenue Operations Director role. Orchestrates operational excellence
  across data analytics, process optimization, planning and modeling, deal desk governance,
  and enablement through 5 specialized sub-agents.
metadata:
  definition_version: 0.1.0
  disclaimer: This agent specification is a reference design for educational and demonstration purposes. It is not a production system. All examples, case studies, and scenarios are fictional.
  tags:
  - leadership
  - revops
  - operations
  - analytics
  - process
  responsibility: 'Route revenue operations requests to the correct sub-agent across data analytics, process optimization, planning and modeling, deal desk governance, and enablement. Manages 5 sub-agents.

    '
system_prompt: 'You are a RevOps Director Orchestrator. You do not execute domain tasks directly.

  You route each request to the appropriate sub-agent.


  ROUTING RULES:

  - Dashboard design, reporting cadence, data quality, attribution modeling → Data & Analytics Agent

  - CRM management, tech stack optimization, workflow automation, integration → Process & Systems Agent

  - Territory planning, quota setting, headcount modeling, compensation admin → Planning & Modeling Agent

  - Deal approvals, pricing governance, contract terms, exception management → Deal Desk Agent

  - Process compliance, tool adoption, change management, training → Enablement & Adoption Agent


  CROSS-DOMAIN REQUESTS:

  When a request spans multiple domains, route to each relevant sub-agent

  and aggregate the results.


  ESCALATION:

  - Budget decisions exceeding authority (>$500K tech spend) → VP Sales/CRO

  - Org-wide process changes affecting multiple teams → VP Sales/CRO

  - Compensation plan design changes → Finance/HR

  - Legal/compliance data governance issues → Legal


  You MUST NOT:

  - Execute domain tasks yourself (always delegate)

  - Make commercial deal decisions (Senior Manager/AE Agent''s domain)

  - Override sales process without leadership approval

  - Make technical architecture decisions (IT/Engineering domain)

  - Approve compensation exceptions without Finance sign-off

  '
human_in_the_loop: true
llm_configuration:
  model_id: null
  default_generation_parameters:
    temperature: 0.5
    max_tokens: 4096
inputs:
- title: task_type
  type: string
  description: Which task to perform
- title: personality
  type: string
  description: Personality variant to use
  default: default
- title: output_format
  type: string
  description: Response format
  default: markdown
outputs:
- title: result
  type: object
  description: Agent output
tools:
- component_type: ClientTool
  id: read-revops-data
  name: Read RevOps Data
  description: 'Access data sources: CRM data, pipeline metrics, tech stack inventory, territory models'
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
- component_type: ClientTool
  id: write-revops-artifact
  name: Write RevOps Artifact
  description: 'Save artifacts: dashboards, reports, territory models, process documentation'
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or additional input from the user
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
- component_type: ClientTool
  id: invoke-ro-data-analytics-agent
  name: Invoke Data & Analytics Agent
  description: Route dashboard design, reporting, data quality, and attribution requests
  requires_confirmation: false
  inputs:
  - title: request
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: sub-agent
- component_type: ClientTool
  id: invoke-ro-process-systems-agent
  name: Invoke Process & Systems Agent
  description: Route CRM management, tech stack, workflow, and integration requests
  requires_confirmation: false
  inputs:
  - title: request
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: sub-agent
- component_type: ClientTool
  id: invoke-ro-planning-agent
  name: Invoke Planning & Modeling Agent
  description: Route territory planning, quota modeling, and compensation requests
  requires_confirmation: false
  inputs:
  - title: request
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: sub-agent
- component_type: ClientTool
  id: invoke-ro-deal-desk-agent
  name: Invoke Deal Desk Agent
  description: Route deal approvals, pricing governance, and exception requests
  requires_confirmation: false
  inputs:
  - title: request
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: sub-agent
- component_type: ClientTool
  id: invoke-ro-enablement-agent
  name: Invoke Enablement & Adoption Agent
  description: Route process compliance, tool adoption, and change management requests
  requires_confirmation: false
  inputs:
  - title: request
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: sub-agent
toolboxes: []
specialized_agents:
- component_type: SpecializedAgent
  id: revops-director-agent-proactive
  name: RevOps Director Agent (Proactive)
  description: 'Proactive mode: scans for data quality issues, process gaps, and system anomalies without prompting'
  agent:
    $component_ref: revops-director-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on proactive detection and early warning. Scan data
      quality metrics, system health indicators, and process compliance rates
      continuously. Surface anomalies and trends before they become incidents.
      Prioritize timeliness over depth. Keep outputs concise and
      action-oriented. Flag anything that needs immediate attention.

      '
    human_in_the_loop: true
- component_type: SpecializedAgent
  id: revops-director-agent-analytical
  name: RevOps Director Agent (Analytical)
  description: 'Analytical mode: deep analysis with comprehensive evidence, trend modeling, and root cause investigation'
  agent:
    $component_ref: revops-director-agent
  agent_specialization_parameters:
    additional_instructions: 'Focus on depth and root cause analysis. Provide comprehensive
      investigation with full data trails and statistical significance.
      Model scenarios across multiple variables. Prioritize accuracy and
      defensibility over speed. Include confidence intervals and methodology
      notes where appropriate.

      '
    human_in_the_loop: true
flows:
- component_type: Flow
  id: data-analytics
  name: Data & Analytics
  description: Flow for dashboard design, reporting cadence, data quality monitoring, and attribution modeling.
  inputs:
  - title: dashboard_type
    type: string
  - title: data_source
    type: string
  - title: metric_definitions
    type: string
  - title: quality_threshold
    type: string
  - title: reporting_period
    type: string
  - title: attribution_model
    type: string
  outputs:
  - title: data_analytics_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: revops-dashboard-design
      input: dashboard_type, audience, metric_definitions, data_source
      description: Design dashboard layout with KPIs, drill-downs, and refresh cadence
    - step: 2
      prompt: revops-data-quality-audit
      input: data_source, quality_threshold, field_completeness, duplicate_rate
      description: Audit data quality across CRM fields and identify remediation priorities
    - step: 3
      prompt: revops-attribution-modeling
      input: attribution_model, channel_data, conversion_events, time_window
      description: Build or refine multi-touch attribution model for pipeline and revenue
- component_type: Flow
  id: process-systems
  name: Process & Systems
  description: Flow for CRM management, tech stack optimization, workflow automation, and system integration.
  inputs:
  - title: system_name
    type: string
  - title: process_description
    type: string
  - title: integration_target
    type: string
  - title: workflow_trigger
    type: string
  - title: adoption_rate
    type: string
  - title: tech_stack_inventory
    type: string
  outputs:
  - title: process_systems_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: revops-crm-optimization
      input: system_name, current_config, pain_points, usage_metrics
      description: Assess CRM configuration and recommend optimization for sales workflow alignment
    - step: 2
      prompt: revops-tech-stack-audit
      input: tech_stack_inventory, cost_per_tool, adoption_rate, overlap_analysis
      description: Audit GTM tech stack for redundancy, cost, and adoption gaps
    - step: 3
      prompt: revops-workflow-automation
      input: process_description, workflow_trigger, current_manual_steps, integration_target
      description: Design automated workflow replacing manual process steps
- component_type: Flow
  id: planning-modeling
  name: Planning & Modeling
  description: Flow for territory planning, quota setting, headcount modeling, and compensation administration.
  inputs:
  - title: territory_data
    type: string
  - title: quota_parameters
    type: string
  - title: headcount_plan
    type: string
  - title: compensation_structure
    type: string
  - title: historical_performance
    type: string
  - title: market_data
    type: string
  outputs:
  - title: planning_modeling_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: revops-territory-design
      input: territory_data, rep_count, account_distribution, historical_performance
      description: Design balanced territories using account potential, geography, and rep capacity
    - step: 2
      prompt: revops-quota-modeling
      input: quota_parameters, historical_attainment, market_data, ramp_schedule
      description: Model quota distribution ensuring achievability and stretch across segments
    - step: 3
      prompt: revops-headcount-planning
      input: headcount_plan, revenue_target, productivity_assumptions, ramp_timeline
      description: Model headcount requirements against revenue targets with ramp-adjusted capacity
- component_type: Flow
  id: deal-desk
  name: Deal Desk
  description: Flow for deal approvals, pricing governance, contract terms, and exception management.
  inputs:
  - title: deal_id
    type: string
  - title: deal_value
    type: string
  - title: discount_requested
    type: string
  - title: contract_terms
    type: string
  - title: exception_type
    type: string
  - title: pricing_model
    type: string
  outputs:
  - title: deal_desk_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: revops-deal-approval
      input: deal_id, deal_value, discount_requested, standard_terms_variance
      description: Evaluate deal against pricing guidelines and escalation thresholds
    - step: 2
      prompt: revops-pricing-governance
      input: pricing_model, discount_history, competitive_context, margin_impact
      description: Assess pricing exception against governance policy and historical precedent
    - step: 3
      prompt: revops-contract-review
      input: contract_terms, standard_deviations, risk_assessment, approval_chain
      description: Review non-standard contract terms and route for appropriate approvals
- component_type: Flow
  id: enablement-adoption
  name: Enablement & Adoption
  description: Flow for process compliance tracking, tool adoption, change management, and training coordination.
  inputs:
  - title: process_name
    type: string
  - title: tool_name
    type: string
  - title: compliance_rate
    type: string
  - title: change_description
    type: string
  - title: training_scope
    type: string
  - title: adoption_metrics
    type: string
  outputs:
  - title: enablement_adoption_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: revops-compliance-tracking
      input: process_name, compliance_rate, non_compliant_teams, enforcement_options
      description: Track process compliance across teams and identify intervention points
    - step: 2
      prompt: revops-tool-adoption
      input: tool_name, adoption_metrics, usage_patterns, barrier_analysis
      description: Analyze tool adoption barriers and design targeted enablement interventions
    - step: 3
      prompt: revops-change-management
      input: change_description, impacted_teams, communication_plan, rollout_timeline
      description: Plan change management for new process or system rollout
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - data-analytics
    - process-systems
    - planning-modeling
    - deal-desk
    - enablement-adoption
    - sub-agent-routing
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/yaml
    - application/json
    - text/markdown
    - text/plain
x-ea-agent:
  profile:
    why: 'RevOps Directors spend their days firefighting data quality issues, manually reconciling reports across disconnected systems, and chasing tool adoption instead of designing the revenue architecture that enables predictable growth. The operational load of maintaining CRM hygiene, building one-off reports, and administering territory and quota models leaves no bandwidth for the strategic process design that separates high-performing revenue organizations from reactive ones.

      '
    human_matters_summary: 'The agent automates data collection, surfaces process gaps, and models scenarios, but the RevOps Director brings cross-functional political savvy, change management instinct, and the systems thinking that designs revenue processes people actually follow. Operational infrastructure is only as good as the organizational buy-in behind it, and that requires a human who understands the informal power structures and cultural resistance that no data model captures.

      '
    human_matters_goal: 'Every process is measurable, every decision has clean data behind it, and the revenue machine runs because RevOps designed it with the human judgment no algorithm replicates.

      '
    role_tab_intro: 'Revenue Operations sits at the center of every GTM function, yet the role is constantly pulled between strategic architecture and tactical firefighting. Data lives in silos across marketing automation, CRM, CS platforms, and finance systems. Tool sprawl creates overlapping capabilities with declining adoption. Process standardization conflicts with the flexibility that field teams demand. The challenges below capture where RevOps time gets consumed, mapped to the sub-agents built to handle each.

      '
    role_context: 'The RevOps Director owns the end-to-end revenue process from lead to cash, serving as the operational backbone that connects sales, marketing, customer success, and finance. They manage the GTM tech stack including CRM, CPQ, BI, and forecasting tools, while designing territory and quota models that balance fairness with growth ambition. They run deal desk operations, own data governance standards, and provide the analytics layer that leadership uses for board-level decisions and strategic planning. The role sits at the intersection of every revenue-generating function, translating operational data into actionable intelligence while ensuring the systems and processes underneath are reliable, adopted, and continuously optimized.

      '
    goals_summary: 'The RevOps Director succeeds when the revenue organization runs on clean data, optimized processes, and models that accurately predict performance, so leadership makes decisions with confidence instead of gut feel.

      '
    goals:
    - Improve forecast accuracy to within 5% variance through signal-validated pipeline data
    - Achieve CRM data quality score above 90% across all required fields
    - Increase pipeline stage conversion rates by 15% through process optimization
    - Drive tool adoption rates above 85% across the GTM tech stack
    - Maintain process compliance above 90% for defined sales stages and methodology
    - Deliver territory models where 70%+ of reps achieve at least 80% of quota
    - Ensure quota attainment distribution follows a normal curve with median above 90%
    - Reduce deal desk turnaround time to under 24 hours for standard approvals
    - Automate 80% of recurring reports, eliminating manual data pulls
    - Demonstrate positive ROI on every tool in the tech stack within 12 months of deployment
    - Achieve cross-functional data alignment where marketing, sales, and CS report from the same source of truth
    - Deliver headcount models that predict capacity within 10% of actual attainment
    - Reduce revenue leakage from process gaps by 25% year over year
    - Complete annual planning cycle (territories, quotas, compensation) 30 days before fiscal year start
    key_metrics:
    - 'Forecast accuracy: actual vs. predicted revenue (target: within 5% variance at month-end commit)'
    - 'CRM hygiene score: percentage of required fields current and complete across active pipeline (target: >90%)'
    - 'Pipeline conversion rate: stage-to-stage progression velocity and win rate by segment'
    - 'Tool adoption rate: DAU/MAU ratio across GTM tools, weighted by role criticality'
    - 'Deal desk cycle time: hours from deal submission to approval or counter-proposal (target: <24h standard)'
    - 'Data quality index: composite of completeness, accuracy, timeliness, and consistency across revenue data sources'
    - 'Process compliance rate: percentage of deals following defined sales stages, methodology, and approval workflows'
    key_responsibilities:
    - Own GTM tech stack strategy, vendor evaluation, and contract management
    - Design and maintain territory models balancing account potential with rep capacity
    - Set and administer quota models with ramp schedules and segment-specific targets
    - Manage deal desk operations including pricing governance and exception approvals
    - Build and maintain executive dashboards, board reporting, and operational analytics
    - Define and enforce CRM data quality standards across all revenue teams
    - Optimize the lead-to-cash process from MQL handoff through revenue recognition
    - Administer sales compensation plans and resolve commission disputes
    - Run annual and quarterly planning cycles for territories, quotas, and headcount
    - Manage the RevOps team across analytics, systems, and operations functions
    - Evaluate, integrate, and sunset tools in the revenue technology stack
    - Provide analytics and scenario modeling for leadership strategic decisions
    - Track, analyze, and improve pipeline metrics across segments and geos
    - Coordinate cross-functional revenue planning between sales, marketing, CS, and finance
    - Design and enforce sales process stages with entry/exit criteria
    - Build and maintain attribution models linking marketing activity to pipeline and revenue
    challenges:
    - text: Revenue data lives in silos across marketing automation, CRM, CS platforms, and finance systems with no single source of truth
      solved_by: ro-data-analytics-agent
      category: Data Quality & Attribution
      specific_overhead:
      - Manually reconciling pipeline numbers between Salesforce, Marketo, and finance spreadsheets before every leadership meeting
      - Building a new reconciliation spreadsheet from scratch each week because the previous version goes stale within days
    - text: GTM tech stack grows through individual team purchases, creating overlapping tools with declining adoption and rising costs
      solved_by: ro-process-systems-agent
      category: Tech Stack & Workflow
      specific_overhead:
      - Running quarterly vendor reviews across 15-20 tools to justify renewals while fielding new tool requests weekly
      - Documenting integration dependencies by hand because no centralized inventory exists for the purchased stack
    - text: Territory models built on historical data fail to account for market shifts, new product launches, and rep capability differences
      solved_by: ro-planning-agent
      category: Territory & Quota Planning
      specific_overhead:
      - Rebuilding territory models in spreadsheets every quarter when leadership changes segment definitions or adds headcount
      - Sourcing historical performance data from three systems to calibrate each rebuild because no unified model exists
    - text: Quota setting creates friction because reps perceive unfairness without transparent methodology and achievability analysis
      solved_by: ro-planning-agent
      category: Territory & Quota Planning
      specific_overhead:
      - Fielding quota appeals from managers and reps while defending the model with data from three different systems
      - Recreating the achievability analysis each cycle because the prior model is not retained in a reusable format
    - text: Deal desk becomes a bottleneck when exception requests pile up and approvers lack context on pricing precedents
      solved_by: ro-deal-desk-agent
      category: Deal Desk
      specific_overhead:
      - Chasing approvers through email and Slack for non-standard deal terms while the AE and customer wait
      - Reassembling historical discount data per exception request because no aggregated precedent log exists
    - text: Multi-touch attribution modeling across long enterprise sales cycles produces ambiguous results that neither marketing nor sales trust
      solved_by: ro-data-analytics-agent
      category: Data Quality & Attribution
      specific_overhead:
      - Defending attribution methodology in cross-functional meetings where marketing and sales dispute credit allocation
      - Manually tagging touchpoints from email, events, and outbound sequences that the attribution tool cannot ingest automatically
    - text: Rapid org changes including acquisitions, reorgs, and new product lines break established processes before replacements are ready
      solved_by: ro-enablement-agent
      category: Enablement & Adoption
      specific_overhead:
      - Rebuilding CRM workflows, approval chains, and reporting hierarchies after every organizational restructure
      - Re-training affected teams on modified processes while simultaneously documenting the new state for future reference
    - text: CRM customization debt accumulates from years of field additions, workflow rules, and integrations that nobody fully understands
      solved_by: ro-process-systems-agent
      category: CRM Management
      specific_overhead:
      - Troubleshooting broken automations and data flows caused by undocumented CRM customizations from previous admins
      - Auditing every field before any new workflow is built to avoid triggering conflicts with existing rules
    - text: Headcount plans built on optimistic ramp assumptions overstate capacity and cause revenue targets to be set beyond achievable range
      solved_by: ro-planning-agent
      category: Headcount & Capacity Modeling
      specific_overhead:
      - Manually calculating ramp-adjusted capacity for each hire cohort using spreadsheet models that do not update when attrition occurs
      - Reconciling headcount plan inputs from Finance, HR, and Sales leadership who each maintain their own headcount version
    - text: Reporting cadence is inconsistent across teams because each function pulls metrics from different systems using different definitions
      solved_by: ro-data-analytics-agent
      category: Reporting & Dashboards
      specific_overhead:
      - Resolving conflicting metric definitions in leadership reviews when sales and marketing report different pipeline numbers
      - Rebuilding shared dashboards after each system migration because definitions are embedded in tool-specific queries
    - text: Workflow automation breaks silently when upstream CRM field mappings or integration schemas change without notification
      solved_by: ro-process-systems-agent
      category: Tech Stack & Workflow
      specific_overhead:
      - Diagnosing failed automation runs by manually tracing logs across CRM, integration middleware, and downstream tools
      - Re-testing every dependent workflow after each CRM release because no automated regression suite covers custom configurations
    - text: Process compliance measurement relies on manual audits that are infrequent, lagging, and do not generate timely intervention
      solved_by: ro-enablement-agent
      category: Enablement & Adoption
      specific_overhead:
      - Running compliance spot-checks by exporting CRM data to spreadsheets and writing filters to identify non-compliant records
      - Writing compliance reports by hand after each audit cycle rather than pulling from a live monitoring system
    administrative_overhead:
    - Manually building executive dashboards by pulling data from 5+ disconnected systems
    - Reconciling pipeline and revenue numbers across CRM, finance, and BI tools before each review
    - Processing deal desk approvals through email chains and Slack with no structured workflow
    - Rebuilding territory and quota models in spreadsheets when assumptions change mid-cycle
    - Troubleshooting CRM data quality issues reported by sales managers during forecast calls
    - Running tool adoption reports manually by cross-referencing login data with user rosters
    - Documenting process changes and distributing training materials across distributed teams
    - Fielding ad-hoc data requests from leadership that require custom queries and manual analysis
    scenarios:
    - problem: A CRM data quality crisis emerges when forecast review reveals 40% of committed deals have stale close dates and missing next steps
      why: 'Stale CRM data compounds over weeks as reps deprioritize updates, and the damage surfaces only when leadership needs accurate numbers. By the time the forecast review exposes the gap, the commit call is unreliable and the RevOps Director must triage data remediation across dozens of reps while simultaneously providing a defensible forecast to the board.

        '
      agent: revops-director-agent
      agent_response: 'The agent triggers the Data & Analytics sub-agent to run a field-level freshness audit across all committed deals, identifying specific reps and fields with the worst data quality scores. It then routes the findings to the Enablement & Adoption sub-agent to generate targeted outreach to non-compliant reps with pre-populated update suggestions, while simultaneously providing the Planning & Modeling sub-agent with a confidence-adjusted forecast that flags which commit categories are data-degraded.

        '
      success_signal:
        metric: CRM data quality score for committed deals
        target: Restore committed deal data quality to 90%+ within 48 hours of detection
        leading_indicator: Reps receive specific field-level update requests rather than generic hygiene reminders
        failure_signal: Forecast review proceeds with stale data because remediation takes longer than the review cycle
    - problem: Territory rebalancing is needed after two reps depart and a new segment is added, but the current model lives in a spreadsheet only the previous RevOps analyst understood
      why: 'Territory models built as one-off spreadsheets by individuals create single points of failure. When the model owner leaves or the org changes, the new RevOps Director inherits a fragile artifact with undocumented assumptions, hardcoded filters, and formula chains that break when inputs change. Rebalancing under time pressure with an opaque model produces territories that reps immediately challenge.

        '
      agent: revops-director-agent
      agent_response: 'The agent routes to the Planning & Modeling sub-agent to reverse-engineer the existing territory structure from CRM assignment data and build a transparent, auditable model with explicit assumptions for account potential, rep capacity, and segment definitions. It then runs multiple rebalancing scenarios with the new headcount and segment parameters, presenting trade-off analysis showing coverage gaps, workload distribution, and projected quota attainability per territory.

        '
      success_signal:
        metric: Territory rebalancing completed with transparent methodology
        target: New territory model deployed within 2 weeks of org change with documented assumptions
        leading_indicator: Managers review scenario options rather than receiving a single take-it-or-leave-it assignment
        failure_signal: Territory reassignment triggers quota appeals from more than 25% of affected reps
    - problem: Deal desk identifies a pattern of escalating discount exceptions that erode margin, but no one has aggregated the data to quantify the trend
      why: 'Individual deal exceptions appear reasonable in isolation but accumulate into a systemic margin erosion pattern. Without trend analysis across deals, segments, and reps, the organization cannot distinguish between competitive necessity and habitual discounting. The deal desk approves exceptions case-by-case without visibility into the aggregate impact on revenue quality.

        '
      agent: revops-director-agent
      agent_response: 'The agent routes to the Deal Desk sub-agent to aggregate exception data by rep, segment, competitor, and deal size over the trailing four quarters. It identifies patterns such as specific reps who consistently request above-guideline discounts, competitive situations that drive legitimate concessions, and deal structures where non-standard terms cluster. The Data & Analytics sub-agent then models the margin impact and presents recommendations for guideline adjustments, approval threshold changes, or targeted coaching.

        '
      success_signal:
        metric: Discount exception trend quantified with margin impact
        target: Average discount rate reduced by 2 percentage points within two quarters through policy adjustment
        leading_indicator: Deal desk reviews include historical precedent data alongside each new exception request
        failure_signal: Discount exceptions continue to rise quarter-over-quarter without policy response
    - problem: The GTM tech stack has grown to 18 tools with overlapping functionality, and the CFO demands a 20% reduction in SaaS spend
      why: 'Tech stack sprawl happens when individual teams purchase tools to solve immediate pain without coordinating with RevOps. Over time, the organization pays for overlapping capabilities, maintaining integrations between redundant systems, and supporting tools with single-digit adoption rates. When finance mandates cuts, RevOps must evaluate each tool against actual usage, integration dependencies, and team impact without a centralized inventory.

        '
      agent: revops-director-agent
      agent_response: 'The agent routes to the Process & Systems sub-agent to build a complete tech stack inventory with cost, adoption rate, integration dependencies, and functional overlap mapping. It then routes to the Enablement & Adoption sub-agent for usage analytics showing DAU/MAU by tool and role. The combined analysis produces a consolidation recommendation that identifies tools for sunset, renegotiation, or replacement, quantifying the savings per action and flagging integration risks for each change.

        '
      success_signal:
        metric: Tech stack rationalized with documented ROI per retained tool
        target: Achieve 20% SaaS cost reduction while maintaining or improving workflow coverage
        leading_indicator: Consolidation plan includes adoption data and integration dependency analysis, not just cost
        failure_signal: Tool sunset disrupts active workflows because integration dependencies were not mapped
    - problem: Forecast accuracy has degraded from 8% to 18% variance over three quarters and leadership cannot identify whether the root cause is pipeline quality, methodology compliance, or market shift
      why: 'Forecast variance can stem from multiple interacting causes: reps over-committing to inflate coverage, pipeline stages not reflecting actual buyer behavior, market conditions shifting faster than models adjust, or inconsistent methodology application across teams. Without isolating the root cause, RevOps applies generic fixes that address symptoms while the underlying driver continues to erode accuracy.

        '
      agent: revops-director-agent
      agent_response: 'The agent routes to the Data & Analytics sub-agent to decompose forecast variance by contributor: stage accuracy (deals that skipped stages or changed stage retroactively), close date accuracy (deals that slipped vs. pulled in), amount accuracy (deals that closed at different values), and new deals that appeared after commit. It then routes to the Process & Systems sub-agent to correlate methodology compliance rates with forecast accuracy by team, identifying whether non-compliant teams have worse accuracy. The Planning & Modeling sub-agent runs a market-adjusted baseline to determine how much variance is attributable to macro conditions vs. internal process failure.

        '
      success_signal:
        metric: Forecast variance root cause isolated and addressed
        target: Return forecast accuracy to within 8% variance within two quarters
        leading_indicator: Variance decomposition identifies 2-3 specific contributors rather than attributing to general pipeline quality
        failure_signal: Generic pipeline hygiene initiatives launched without targeting the specific variance drivers
    capabilities:
    - Executive dashboard design and operational analytics
    - CRM data quality management and governance
    - Territory design and account distribution modeling
    - Quota modeling with achievability and fairness analysis
    - Deal desk pricing governance and exception management
    - GTM tech stack evaluation and rationalization
    - Pipeline conversion analysis and optimization
    - Forecast accuracy decomposition and improvement
    - Headcount capacity planning and productivity modeling
    - Multi-touch attribution modeling across revenue channels
    - Sales process design with stage entry/exit criteria
    - Change management for process and system rollouts
    - Cross-functional revenue planning coordination
    - Compensation plan administration and dispute resolution
    stakeholder_landscape:
