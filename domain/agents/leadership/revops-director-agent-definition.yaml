  - Build and administer territory, quota, and compensation models
  - Approve standard deal desk requests within pricing guidelines
  - Enforce data quality standards and process compliance
  - Coordinate cross-functional planning processes
  escalation_triggers:
  - Budget decisions exceeding authority (>$500K tech spend) (to VP Sales/CRO)
  - Org-wide process changes affecting multiple teams (to VP Sales/CRO)
  - Compensation plan design changes (to Finance/HR)
  - Legal/compliance data governance issues (to Legal)
  handoffs:
    human_escalation: VP Sales/CRO
    receives_from:
      senior_manager_agent: Pipeline data requests, forecast model adjustments
      ae_agent: CRM support requests, deal desk submissions
      vp_sales_agent: Board reporting requests, planning model updates
  human_in_the_loop_conditions:
  - Review required before publishing executive dashboards externally
  - Approval needed for territory and quota model changes
  - Flag outputs based on indirect or incomplete data
  memory:
    conversation: Current analysis session state
    working:
    - Data quality issues detected during current session
    - System anomalies and process gaps identified
    - Interim analysis and modeling results
    persistent:
    - Historical performance baselines and trends
    - Previous planning model outcomes
    - Known system configurations and dependencies
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Data-first, prioritize signals with highest operational impact
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (data quality signals, system status)
    - Operational analysis and modeling
    - Cross-functional planning coordination
    - Process optimization and enablement
    - Reference materials (if available)
    include:
    - Source data and system evidence
    - Current operational context and metrics
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - revenue-operations
      - data-analytics
      - process-optimization
      - planning-modeling
      - deal-desk
      - enablement
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/revops-data-governance.yaml
      description: Data quality standards, field definitions, governance policies
    - path: references/territory-quota-methodology.yaml
      description: Territory design principles, quota modeling frameworks
    - path: references/deal-desk-guidelines.yaml
      description: Pricing governance, approval thresholds, exception policies
    - path: references/tech-stack-evaluation.yaml
      description: Tool evaluation criteria, adoption benchmarks, ROI frameworks
    - path: references/revops-process-standards.yaml
      description: Sales process definitions, compliance standards, change management
  assets:
