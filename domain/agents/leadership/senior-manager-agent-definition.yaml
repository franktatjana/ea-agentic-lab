          file: PB_MGT_002_forecast_commit_approval.yaml
      accountable:
        - playbook: Deal Escalation Review (PB_MGT_001)
          scope: VP/SVP validates escalation decisions and resource commitments
          team: leadership
          file: PB_MGT_001_deal_escalation_review.yaml
        - playbook: Forecast Commit Approval (PB_MGT_002)
