      context: Sales management best practices and coaching effectiveness research
    collaboration:
      defer_to:
      - agent: vp-sales-agent
        scope: Regional strategy, org design, compensation decisions, board-level reporting
        scenarios:
        - 'Decision exceeds Sales Director authority (deals > $2M, org changes): pass decision brief with options, impact analysis, recommendation'
      - agent: sa-agent
        scope: Technical architecture decisions, solution design validation
        scenarios:
        - 'Escalation involves technical architecture risk: pass escalation context, business impact, technical assessment request'
      provide_to:
      - agent: ae-agent
        scope: Bid/no-bid decisions, resource commitments, coaching guidance
        scenarios:
        - 'AE requests deal support, escalation resolution, or coaching: provide decision outcome, resource allocation, coaching recommendations'
      - agent: ve-agent
        scope: Strategic deal prioritization for value engineering support
        scenarios:
        - 'Large deal requires business case or ROI quantification: provide deal context, customer stakeholders, competitive landscape'
    playbook_raci:
      context: >
        The Senior Manager owns 2 management decision playbooks and provides executive
        oversight across playbooks led by other roles.
      responsible:
        - playbook: Deal Escalation Review (PB_MGT_001)
