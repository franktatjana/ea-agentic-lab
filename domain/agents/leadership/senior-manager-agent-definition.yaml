a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - escalation-handling
    - bid-decisions
    - coaching
    - executive-engagement
    - portfolio-oversight
    - resource-allocation
    - sub-agent-routing
    input_modes:
