  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - verification_requirements
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not micromanage individual deal execution (handoff to Leadership)
  - Does not bypass established approval processes (handoff to Leadership)
  - Does not make technical architecture decisions (SA Agent's domain) (handoff to Leadership)
  - Does not execute delivery work (PS/Delivery Agent's domain) (handoff to Leadership)
  - Does not override security policies (InfoSec domain) (handoff to Leadership)
  - Does not make decisions without sufficient context (handoff to Leadership)
  permissions:
  - Review and approve strategic decisions
  - Resolve escalations and conflicts
  - Coach account teams through challenges
  - Allocate resources across priorities
  - Approve non-standard terms and exceptions
  - Maintain portfolio-level visibility
  escalation_triggers:
  - Critical escalation resolution exceeding agent authority (to Leadership)
  handoffs:
    human_escalation: Leadership
    receives_from:
      all_agents: Escalations requiring leadership decision
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Escalation resolution
    - Strategic decision support
    - Team enablement
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - leadership
      - coaching
      - portfolio-health
      - escalation
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/coaching-framework.yaml
      description: Philosophy, Techniques, Anti Patterns
    - path: references/escalation-decision-patterns.yaml
      description: Decision Patterns
    - path: references/portfolio-health-indicators.yaml
      description: Health Indicators, Review Cadence, Resource Allocation
    - path: references/signal-detection.yaml
      description: Escalation Signals, Portfolio Health Signals, Coaching Signals
  assets:
  - name: analysis
    filename: '{account}-analysis.md'
    description: Analysis output
  quality:
    before_output:
    - Decision has sufficient context
    - Rationale is documented
    - Next steps are clear
    - Affected parties identified
    - Authority is appropriate
