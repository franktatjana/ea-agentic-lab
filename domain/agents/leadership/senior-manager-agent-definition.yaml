x-ea-agent:
  profile:
    role_context: 'The Senior Manager is the day-to-day leader: coaching team members through deals, reviewing forecasts, resolving escalations, and stepping in when deals need executive engagement. They''re
      the connective tissue between leadership strategy and deal-level execution.

      '
    scenarios:
    - problem: Escalation context is lost between handoffs
      why: 'When a deal or account issue escalates, the context travels through email threads, Slack messages, and verbal summaries. By the time the manager gets involved, critical details are missing or
        distorted, leading to slower resolution and decisions made on incomplete information.

        '
      agent: senior-manager-agent
      agent_response: 'The agent triages incoming escalations with full context from the originating agent, classifies urgency, and assembles a decision brief with options, stakeholder impact, and historical
        patterns. It documents resolution decisions and extracts learnings to prevent repeat escalations.

        '
      success_signal:
        metric: Escalation resolution time with full context
        target: Reduce average escalation resolution time by 40% through structured context delivery
        leading_indicator: Managers report having sufficient context at first review of escalation
        failure_signal: Managers request multiple follow-up briefings before making escalation decisions
    - problem: Bid/no-bid decisions lack structured criteria
      why: 'Major pursuit decisions are made in hallway conversations or based on deal size alone. Without a structured assessment of competitive position, resource requirements, and win probability, the
        team over-invests in low-probability deals and under-resources winnable ones.

        '
      agent: senior-manager-agent
      agent_response: 'The agent provides a structured bid/no-bid assessment that evaluates competitive landscape, resource requirements, win/loss history against similar deals, and MEDDPICC qualification.
        It supports pursuit prioritization across competing opportunities so resources flow to the highest-value pursuits.

        '
      success_signal:
        metric: Pursuit resource allocation efficiency
        target: Improve win rate on pursued deals by 20% through better qualification
        leading_indicator: Bid decisions reference structured assessment criteria rather than gut feel
        failure_signal: Team continues to pursue low-probability deals while under-resourcing winnable ones
    - problem: Coaching insights depend on what reps choose to share in 1:1s
      why: 'Managers rely on 1:1 conversations for deal visibility, but reps naturally share wins and downplay struggles. Without objective engagement data, coaching is reactive, targeting the problems
        reps surface rather than the patterns they cannot see in their own behavior.

        '
      agent: senior-manager-agent
      agent_response: 'The agent aggregates deal activity signals including meeting cadence, stakeholder engagement breadth, deal velocity, and qualification completeness. It surfaces coaching opportunities
        where objective data diverges from rep self-reporting, giving managers evidence-based talking points for 1:1s that address real gaps.

        '
      success_signal:
        metric: Coaching insight accuracy
        target: At least 70% of coaching recommendations are confirmed as relevant by the manager
        leading_indicator: 1:1 agendas include data-backed coaching topics alongside rep self-reported items
        failure_signal: Coaching conversations remain limited to topics the rep volunteers
    - problem: Forecast reviews are based on self-reported pipeline data
      why: 'Pipeline health depends on stage accuracy, close dates, and deal amounts that reps update manually. Optimism bias inflates coverage, stale opportunities pad the funnel, and commit calls become
        negotiations rather than forecasts grounded in verifiable deal signals.

        '
      agent: senior-manager-agent
      agent_response: 'The agent cross-references pipeline data with engagement signals like meeting frequency, multi-threading depth, and deal velocity to flag forecast risks. It identifies deals where
        stage does not match activity level, highlights stale opportunities, and provides an adjusted forecast view alongside the rep-reported pipeline.

        '
      success_signal:
        metric: Forecast accuracy improvement
        target: Reduce forecast variance by 25% through signal-adjusted pipeline analysis
        leading_indicator: Forecast review meetings reference engagement-validated pipeline data
        failure_signal: Quarter-end results deviate from forecast by more than 20% due to pipeline quality issues
    challenges:
    - text: Coaching insights depend on what reps choose to share in 1:1s
      solved_by: sm-coaching-agent
      specific_overhead:
      - Preparing forecast review decks from self-reported pipeline data
    - text: Forecast reviews are based on self-reported pipeline data
      solved_by: sm-pipeline-agent
      specific_overhead:
      - Writing coaching summaries after each 1:1 session
    - text: Escalation context is lost between handoffs
      solved_by: sm-escalation-agent
      specific_overhead:
      - Tracking escalation resolution across email threads and Slack
    - text: Bid/no-bid decisions lack structured criteria
      solved_by: sm-escalation-agent
      specific_overhead:
      - Building bid/no-bid assessments from scattered competitive and qualification data
    - text: Team performance visibility requires manual aggregation across systems
      solved_by: sm-pipeline-agent
      specific_overhead:
      - Compiling team performance dashboards from CRM, call recordings, and activity logs
    administrative_overhead:
    - Preparing forecast review decks from self-reported pipeline data
    - Writing coaching summaries after each 1:1 session
    - Tracking escalation resolution across email threads and Slack
    capabilities:
    - Forecast review and strategy coaching
    - Escalation resolution
    - Portfolio-level oversight
    - Executive engagement planning
    - Team development and coaching
    human_matters_summary: 'Escalations are decisions, and decisions are leadership. The agent surfaces escalations and summarizes decision context, but the manager brings executive judgment on what is
      truly a go or no-go call, coaches teams through uncertainty, and allocates resources knowing the full portfolio context. The escalation is flagged, but the human leader decides and commits organizational
      capital.

      '
    why: 'Sales Directors spend more time compiling reports, chasing escalation context, and manually tracking team performance than coaching and leading. Between forecast reviews, pipeline audits, escalation
      triage, and executive engagement prep, the actual leadership window shrinks to a fraction of the week. This agent gives the Sales Director a digital workforce that handles the data aggregation, pattern
      detection, and preparation work so they can focus on coaching reps, making strategic decisions, and building executive relationships.

      '
    human_matters_goal: 'Every escalation is contextualized, every forecast is evidence-based, but the team wins because the leader coached them through the hard moments no agent can navigate.

      '
    role_tab_intro: 'A Sales Director manages 6-12 Account Executives across a territory, each carrying their own pipeline, escalations, and coaching needs. The challenges below are where leadership
      time gets consumed by data compilation and context chasing instead of strategic coaching and decision-making.

      '
    goals_summary: 'The Sales Director succeeds when the team hits quota, forecasts are accurate, escalations resolve fast, and coaching drives measurable skill improvement.

      '
    goals:
    - Maintain forecast accuracy within 10% variance from commit to close
    - Resolve escalations within SLA with full context at first review
    - Coach each rep at least weekly with data-backed development topics
    - Pipeline coverage above 3x across the team at all times
    - Win rate improvement quarter-over-quarter through better qualification
    - Reduce average rep ramp time by 20% through structured onboarding
    - Bid/no-bid decisions made within 48 hours with documented rationale
    - Executive engagement on every deal above $500K with clear call strategy
    - Resource conflicts resolved within 24 hours with transparent prioritization
    - Team retention above 85% annually through development investment
    - Quarterly strategy reviews completed on time with actionable territory adjustments
    - Cross-functional alignment meetings held monthly with SA, VE, and CS leads
    key_metrics:
    - 'Team quota attainment: aggregate revenue closed vs. team target across all AEs'
    - 'Forecast accuracy: variance between commit call and actual close, measured weekly'
    - 'Pipeline coverage: total team pipeline / team quota target (healthy = 3x+)'
    - 'Average win rate: team deals closed-won / total deals, tracked by rep and segment'
    - 'Rep ramp time: days from hire to first closed deal at quota-level velocity'
    - 'Escalation resolution time: hours from escalation receipt to documented decision'
    - 'Rep retention rate: percentage of quota-carrying reps retained year-over-year'
    key_responsibilities:
    - 'Pipeline Review: conduct weekly pipeline reviews with each AE, validate stage accuracy, and flag deals where activity does not match reported stage'
    - 'Forecast Commit: own the team forecast commit to VP Sales with evidence-based confidence levels per deal, not aggregated gut feel'
    - 'Deal Coaching: coach AEs on deal strategy for stalled or at-risk opportunities using objective engagement data and qualification gaps'
    - 'Escalation Resolution: triage and resolve escalations from AEs, SAs, and customers with full context assembly and documented decisions'
    - 'Executive Engagement: step into deals requiring peer-level executive conversations, prepare for executive calls, and manage executive escalation response'
    - 'Resource Allocation: resolve competing demands for SA, VE, and specialist resources across the team based on deal value and win probability'
    - 'Hiring and Onboarding: recruit, interview, and onboard new AEs with structured ramp plans and milestone tracking'
    - 'Performance Management: track individual rep performance against quota and activity metrics, conduct performance reviews, and manage PIPs when needed'
    - 'Cross-Functional Alignment: coordinate with SA leads, VE team, CS leadership, and RevOps to ensure shared priorities and seamless handoffs'
    - 'Territory Planning Approval: review and approve AE territory plans and account tiering to ensure coverage and strategic alignment'
    - 'Competitive Strategy: develop team-level competitive positioning guidance based on win/loss patterns and market intelligence'
    - 'Bid/No-Bid Assessment: make structured go/no-go decisions on major pursuits evaluating competitive position, resource requirements, and win probability'
    - 'QBR Leadership: lead quarterly business reviews presenting team performance, forecast outlook, and strategic priorities to VP Sales'
    - 'Post-Mortem Facilitation: facilitate win/loss post-mortems to extract patterns and coaching insights that improve future execution'
    stakeholder_landscape:
      external:
      - role: 'Customer executives: escalation resolution, executive sponsorship, relationship continuity'
        connected_via: sm-executive-agent
      - role: 'Customer champions: relationship investment, deal acceleration, retention strategy'
        connected_via: sm-executive-agent
      - role: 'Partner leadership: co-sell strategy, joint pipeline development, partner resource coordination'
        connected_via: sm-resource-agent
      internal:
      - role: 'Account Executives: coaching, deal strategy, performance management, career development'
        connected_via: sm-coaching-agent
      - role: 'Solution Architects: resource allocation, technical escalation routing, deal prioritization'
        connected_via: sm-resource-agent
      - role: 'Value Engineers: strategic deal support prioritization, business case review'
        connected_via: sm-resource-agent
      - role: 'VP Sales: forecast reporting, escalation elevation, strategic decisions requiring approval'
        connected_via: sm-pipeline-agent
      - role: 'RevOps: data accuracy, process optimization, territory and quota design'
        connected_via: sm-pipeline-agent
      - role: 'Customer Success: retention risk coordination, expansion strategy alignment, account health'
        connected_via: sm-executive-agent
    sub_agents:
    - name: Escalation & Decision Agent
      id: sm-escalation-agent
      purpose: Escalation triage, resolution documentation, pattern recognition, bid/no-bid assessment
    - name: Pipeline & Performance Agent
      id: sm-pipeline-agent
      purpose: Pipeline reviews, forecast accuracy, team performance tracking, quarterly strategy
    - name: Coaching & Development Agent
      id: sm-coaching-agent
      purpose: Deal coaching, skill development plans, win/loss post-mortems
    - name: Executive Engagement Agent
      id: sm-executive-agent
      purpose: Executive call preparation, executive escalation response, EBR strategy
    - name: Resource Planning Agent
      id: sm-resource-agent
      purpose: Resource conflict resolution, capacity planning, strategic investment decisions
    with_this_agent:
    - domain: Escalation Resolution
      agent: sm-escalation-agent
      items:
      - 'Escalation Triage: get full context assembly and urgency classification before making escalation decisions'
      - 'Pattern Recognition: identify recurring escalation themes to address root causes proactively'
    - domain: Pipeline Oversight
      agent: sm-pipeline-agent
      items:
      - 'Forecast Review: validate forecast commits with engagement-signal evidence, not self-reported pipeline data'
      - 'Performance Tracking: monitor team performance metrics across reps without manual dashboard compilation'
    - domain: Team Coaching
      agent: sm-coaching-agent
      items:
      - 'Deal Coaching: coach reps on stalled deals with objective data on where engagement gaps exist'
      - 'Skill Development: build evidence-based development plans tied to observed performance patterns'
    - domain: Executive Engagement
      agent: sm-executive-agent
      items:
      - 'Executive Calls: prepare for executive conversations with customer context, relationship history, and strategic talking points'
    - domain: Resource Allocation
      agent: sm-resource-agent
      items:
      - 'Resource Conflicts: resolve competing demands for SA, VE, and specialist resources with transparent prioritization criteria'
    - domain: Bid Decisions
      agent: sm-escalation-agent
      items:
      - 'Bid/No-Bid: make structured pursuit decisions based on competitive position, resource requirements, and win probability'
    - domain: Performance Management
      agent: sm-pipeline-agent
      items:
      - 'Rep Performance: track quota attainment, activity metrics, and skill progression across the team'
    activity_map:
      purpose: 'The Senior Manager exists to enable the sales team to win by providing leadership across escalation resolution, pipeline oversight, coaching, executive engagement, and resource planning. Each
        domain is owned by a sub-agent that operates independently with its own tools, flows, boundaries, and prompt registry. The Senior Manager orchestrates 5 sub-agents.

        '
      domains:
      - domain: Escalation Resolution and Bid Decisions
        why: 'The Senior Manager resolves escalations with full context and makes structured bid/no-bid decisions on major pursuits. Without structured triage, escalations consume disproportionate leadership
          time and decisions are made on incomplete information.

          '
        agent: sm-escalation-agent
        activities:
        - Escalation triage with urgency classification and context assembly
        - Resolution documentation with learnings extraction
        - Escalation pattern recognition across the team
        - Bid/no-bid assessment with structured qualification criteria
        cadence: on-demand for escalations, per-pursuit for bid decisions
      - domain: Pipeline Oversight and Team Performance
        why: 'The Senior Manager owns the team forecast and pipeline health. Leadership plans hiring, targets, and investments based on the forecast accuracy the Sales Director provides.

          '
        agent: sm-pipeline-agent
        activities:
        - Weekly pipeline review with signal-validated stage accuracy
        - Monthly team performance review with win/loss patterns
        - Quarterly strategy review with territory adjustments
        cadence: weekly pipeline, monthly performance, quarterly strategy
      - domain: Coaching and Development
        why: 'The Senior Manager coaches reps through deals and builds long-term skill development. Coaching based on objective data rather than self-reported progress drives measurable improvement.

          '
        agent: sm-coaching-agent
        activities:
        - Deal coaching with evidence-based talking points
        - Skill development plans tied to observed performance patterns
        - Win/loss post-mortem facilitation with pattern extraction
        cadence: weekly 1:1s, per-deal coaching, quarterly development reviews
      - domain: Executive Engagement
        why: 'The Senior Manager steps into deals requiring peer-level executive conversations and manages executive escalation response. Executive relationships at the leadership level unlock deal acceleration
          and retention.

          '
        agent: sm-executive-agent
        activities:
        - Executive call preparation with customer context and relationship history
        - Executive escalation response with issue resolution strategy
        - EBR strategy and planning for strategic accounts
        cadence: per-deal for executive calls, quarterly for EBR planning
      - domain: Resource Planning and Allocation
        why: 'The Senior Manager resolves competing demands for limited resources across the team. Without transparent prioritization, resource allocation defaults to whoever asks loudest rather than
          highest-value opportunities.

          '
        agent: sm-resource-agent
        activities:
        - Resource conflict resolution with transparent prioritization criteria
        - Quarterly capacity planning against pipeline forecast
        - Strategic investment decisions for key accounts
        cadence: on-demand for conflicts, quarterly for capacity planning
    public_resources:
    - title: Gartner CSO Leadership Vision 2025
      url: https://www.gartner.com/en/articles/trends-for-chief-sales-officers
      context: 'Three trends: unified commercial strategy, adaptive org design, simplified seller roles'
    - title: GROW Coaching Model
      url: https://www.mindtools.com/a5bq67y/the-grow-model-of-coaching-and-mentoring
      context: 'Goal, Reality, Options, Will coaching framework for sales managers'
    - title: Clari Sales QBR Playbook
