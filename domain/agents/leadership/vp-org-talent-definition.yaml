agentspec_version: 26.1.0
component_type: Agent
id: vp-org-talent-agent
name: Organization & Talent Agent
description: >
  Manages the organizational health of the sales region, from headcount planning and hiring
  velocity through succession pipeline development. Operates at the intersection where
  organizational design, talent acquisition, and leadership development determine whether
  the region has the capacity and capability to execute its revenue plan.
metadata:
  definition_version: 0.1.0
  parent_agent: vp-sales-agent
  tags:
  - organization
  - talent
  - hiring
  - succession
  - org-design
  responsibility: >
    Provide data-driven hiring plans, organization scaling strategies, and succession
    pipeline development that ensure the sales organization can execute current and
    future revenue targets.
system_prompt: >
  You are an Organization & Talent Agent, part of the VP Sales intelligence system.
  Your job is to plan and optimize the sales organization's structure, talent
  pipeline, and leadership bench.

  You MUST:
  - Build hiring plans with ramp curves, time-to-productivity, and budget impact
  - Design org scaling strategies that balance growth with manager effectiveness
  - Identify and develop succession candidates with structured development paths
  - Track attrition risk signals and recommend retention interventions
  - Quantify headcount impact on revenue capacity with ramp-adjusted projections
  - Model manager span of control against best practices (6-8 direct reports)

  You MUST NOT:
  - Design territory assignments or GTM strategies (Revenue Strategy Agent's domain)
  - Validate forecast commits or prepare board reports (Forecast Governance Agent's domain)
  - Coach Sales Directors on deal strategy (Performance Optimization Agent's domain)
  - Engage executives or prepare board presentations (Executive Stakeholder Agent's domain)
  - Make final hiring decisions (VP and HR's authority)
  - Set compensation structures (Revenue Strategy Agent models, HR/Finance approves)

  When attrition data is incomplete: flag the gap, use industry benchmarks as
  reference, and recommend data collection actions.
human_in_the_loop: true
tools:
- component_type: ClientTool
  id: read-crm-data
  name: Read CRM Data
  description: Access CRM data for rep performance, quota attainment, and team composition metrics
  requires_confirmation: false
  inputs:
  - title: query
    type: string
  outputs:
  - title: crm_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: CRM unavailable, cannot access rep performance data
    - error_code: RECORD_NOT_FOUND
      guidance: Record not found, verify team or rep identifiers with user
- component_type: ClientTool
  id: read-communications
  name: Read Communications
  description: Access Slack threads, email content, and meeting notes for attrition signals and team health indicators
  requires_confirmation: false
  inputs:
  - title: source_type
    type: string
  - title: account_name
    type: string
  outputs:
  - title: content
    type: string
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Cannot access communications, flag as data gap in attrition analysis
    - error_code: NO_RECORDS
      guidance: No communications found for period, expand search or note gap
- component_type: ClientTool
  id: read-infohub
  name: Read InfoHub
  description: >
    Access structured organizational data from the InfoHub vault. Use section parameter
    to target specific data: headcount, attrition, ramp_progress, performance_distribution,
    succession_pipeline, or org_structure.
  requires_confirmation: false
  inputs:
  - title: realm_id
    type: string
  - title: node_id
    type: string
  - title: section
    type: string
  - title: detail_level
    type: string
  outputs:
  - title: infohub_data
    type: object
  x-ea-agent:
    risk: low
    resolver: service-registry
    error_responses:
    - error_code: SOURCE_UNAVAILABLE
      guidance: Proceed with other data sources, flag output as incomplete
    - error_code: SECTION_NOT_FOUND
      guidance: Section does not exist, skip and note gap
    - error_code: STALE_DATA
      guidance: Data exceeds freshness threshold, flag for human verification
- component_type: ClientTool
  id: save-org-talent-artifact
  name: Save Org & Talent Artifact
  description: Persist hiring plans, org designs, and succession assessments to InfoHub
  requires_confirmation: true
  inputs:
  - title: artifact
    type: object
  - title: destination_path
    type: string
  outputs:
  - title: status
    type: string
  x-ea-agent:
    risk: medium
    resolver: service-registry
- component_type: ClientTool
  id: ask-user
  name: Ask User
  description: Request clarification or additional input from VP Sales
  requires_confirmation: false
  inputs:
  - title: question
    type: string
  outputs:
  - title: answer
    type: string
  x-ea-agent:
    risk: low
    resolver: inline
toolboxes:
- component_type: Toolbox
  id: org-talent-intelligence
  name: Org & Talent Intelligence
  description: Headcount status, attrition risk, and succession readiness available to peer agents
  tools:
  - id: get-headcount-status
    name: Get Headcount Status
    description: Returns current headcount against plan with ramp progress and open reqs
    inputs:
    - title: region
      type: string
    outputs:
    - title: headcount_status
      type: object
  - id: get-attrition-risk
    name: Get Attrition Risk
    description: Returns attrition risk assessment with retention intervention recommendations
    inputs:
    - title: region
      type: string
    outputs:
    - title: attrition_risk
      type: object
  - id: get-succession-readiness
    name: Get Succession Readiness
    description: Returns succession pipeline status with development gap analysis
    inputs:
    - title: region
      type: string
    outputs:
    - title: succession_readiness
      type: object
specialized_agents: []
flows:
- component_type: Flow
  id: org-development
  name: Organization Development
  description: Flow for hiring plans, team scaling, and succession planning tasks.
  inputs:
  - title: current_headcount
    type: string
  - title: attrition_data
    type: string
  - title: hiring_plan
    type: string
  - title: performance_distribution
    type: string
  - title: succession_candidates
    type: string
  - title: budget_constraints
    type: string
  outputs:
  - title: org_development_result
    type: object
  x-ea-agent:
    workflow_shorthand:
    - step: 1
      prompt: vp-sales-hiring-plan
      input: current_headcount, attrition_data, revenue_target, ramp_time, budget_constraints
      tools:
      - read-crm-data
      - read-infohub
      description: Build hiring plan with ramp curves, time-to-productivity, and budget impact
      on_failure: stop
    - step: 2
      prompt: vp-sales-team-scaling
      input: team_structure, performance_distribution, growth_targets, market_expansion
      tools:
      - read-crm-data
      - read-infohub
      description: Design org scaling strategy balancing growth with culture and manager span
      on_failure: stop
    - step: 3
      prompt: vp-sales-succession-planning
      input: succession_candidates, leadership_competencies, development_gaps, timeline
      tools:
      - read-crm-data
      - read-communications
      - read-infohub
      description: Identify and develop next-generation Sales Directors with structured development paths
      on_failure: stop
    - step: 4
      action: persist
      tools:
      - save-org-talent-artifact
      description: Save hiring plan, scaling strategy, and succession assessment to InfoHub
      on_failure: stop
a2a:
  agent_url: null
  connection_config: null
  agent_card:
    protocol_version: '0.1'
    capabilities:
    - hiring-plan-development
    - team-scaling-strategy
    - succession-planning
    - attrition-risk-monitoring
    input_modes:
    - text/plain
    - application/json
    output_modes:
    - application/json
    - text/markdown
x-ea-agent:
  profile:
    human_matters_summary: >
      The agent tracks headcount data, models ramp curves, and surfaces attrition signals,
      but the VP makes the judgment calls on who to hire, who to develop, and when to
      restructure. Building a sales culture, reading team dynamics, and making career-defining
      decisions for Directors require human leadership that no model can replicate.
    challenges:
    - text: Scaling the organization while maintaining selling culture and manager effectiveness
      specific_overhead:
      - Tracking hiring pipeline, ramp progress, and attrition risk across multiple Director teams
      - Modeling manager span of control impact on team performance
    - text: Talent acquisition in competitive markets where top candidates have multiple offers
      specific_overhead:
      - Reviewing candidate pipelines, comp benchmarking, and closing strategies for key hires
      - Assembling competitive offer analysis without real-time market data
    - text: Succession planning lacks structured assessment against leadership competencies
      specific_overhead:
      - Manually tracking development plan progress across Director candidates
      - Building competency gap analysis from scattered 1:1 notes and performance reviews
    - text: Ramp time visibility is poor, making revenue capacity projections unreliable
      specific_overhead:
      - Correlating hiring dates with first-deal timelines across different roles and segments
    - text: Attrition risk surfaces only when resignation happens, not during warning period
      specific_overhead:
      - Monitoring engagement signals, performance trends, and tenure patterns for early warning
    administrative_overhead:
    - Tracking headcount status, ramp progress, and attrition risk across teams
    - Tracking succession pipeline readiness and development plan progress
    - Building org design proposals with span of control and reporting line options
    - Assembling hiring velocity reports with ramp curve projections
    scenarios:
    - problem: Scaling the organization without visibility into ramp impact on revenue capacity
      why: >
        When the VP approves headcount without ramp-adjusted revenue projections, the gap
        between investment and revenue contribution becomes visible only at quarter end.
        New hires consume budget and management attention while contributing minimal pipeline
        for 4-6 months, creating a capacity illusion where the org looks full but revenue
        coverage is thin.
      agent: vp-org-talent-agent
      agent_response: >
        Builds a hiring plan with ramp curves modeled from historical time-to-first-deal
        data by role and segment. Projects revenue capacity at each month post-hire, showing
        the VP when new hires will contribute to pipeline and when they will close. Includes
        budget impact analysis with breakeven timeline.
      success_signal:
        metric: Ramp-adjusted revenue capacity projected at hiring approval time
        target: New hire revenue contribution within 10% of projection at 6-month mark
        leading_indicator: Hiring plan includes ramp curves before approval, not after
        failure_signal: New hires reach 6-month mark with no closed deals and no documented ramp plan
    - problem: Director succession bench is empty when promotion or departure creates vacancy
      why: >
        Without structured succession planning, VP promotes the top-performing AE into
        a Director role, losing a revenue producer and gaining an untrained manager. Or
        worse, a Director departure leaves a team without leadership for weeks while an
        external search runs.
      agent: vp-org-talent-agent
      agent_response: >
        Assesses succession candidates against leadership competencies with structured
        development gap analysis. Produces development plans with specific experiences,
        mentoring assignments, and readiness timelines. Maintains a bench of 2+ candidates
        per Director role with quarterly readiness updates.
      success_signal:
        metric: Succession bench has 2+ ready-now candidates per Director role
        target: Director vacancy filled from bench within 2 weeks
        leading_indicator: Quarterly succession readiness reviews completed with updated development plans
        failure_signal: Director vacancy requires external search taking 60+ days
  escalation_triggers:
  - Attrition rate exceeds 15% annualized in any Director team
  - Hiring plan falls behind by 2+ months against approved timeline
  - Succession bench drops below 1 ready-now candidate for any Director role
  - Manager span of control exceeds 10 direct reports for any Director
  prompt_registry:
    vp-sales-hiring-plan:
      description: Build hiring plan with ramp curves, time-to-productivity, and budget impact
      source: prompts/tasks.yaml#vp_sales.org_development.hiring_plan
      inputs:
      - title: current_headcount
        type: string
      - title: attrition_data
        type: string
      - title: revenue_target
        type: string
      - title: ramp_time
        type: string
      - title: budget_constraints
        type: string
      outputs:
      - title: hiring_plan
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - rep_count
        - quota_attainment_distribution
        - revenue_per_rep
        priority: critical
      - source: read-infohub
        fields:
        - historical_ramp_data
        - attrition_history
        - budget_allocation
        priority: critical
    vp-sales-team-scaling:
      description: Design org scaling strategy balancing growth with culture and manager span
      source: prompts/tasks.yaml#vp_sales.org_development.team_scaling
      inputs:
      - title: team_structure
        type: string
      - title: performance_distribution
        type: string
      - title: growth_targets
        type: string
      - title: market_expansion
        type: string
      outputs:
      - title: scaling_strategy
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - team_composition
        - performance_by_team
        - manager_span
        priority: critical
      - source: read-infohub
        fields:
        - org_structure
        - growth_projections
        priority: enrichment
    vp-sales-succession-planning:
      description: Identify and develop next-generation Sales Directors with structured development paths
      source: prompts/tasks.yaml#vp_sales.org_development.succession_planning
      inputs:
      - title: succession_candidates
        type: string
      - title: leadership_competencies
        type: string
      - title: development_gaps
        type: string
      - title: timeline
        type: string
      outputs:
      - title: succession_assessment
        type: object
      requires_data:
      - source: read-crm-data
        fields:
        - candidate_performance_history
        - team_results
        priority: critical
      - source: read-communications
        fields:
        - coaching_notes
        - leadership_feedback
        priority: enrichment
      - source: read-infohub
        fields:
        - competency_assessments
        - development_plan_history
        priority: enrichment
  boundaries:
  - Does not design territory assignments or GTM strategies
  - Does not validate forecast commits or produce board reports
  - Does not coach Directors on deal strategy or pipeline management
  - Does not prepare executive engagement plans
  - Does not make final hiring or termination decisions
  - Does not set compensation structures
  permissions:
  - Read team composition, headcount, and performance data
  - Model hiring plans with ramp curves and budget impact
  - Assess succession readiness against leadership competencies
  - Monitor attrition risk signals and recommend retention actions
  - Design org scaling strategies with span of control analysis
  guardrails:
    input_validation:
    - Reject hiring plan requests without current headcount and budget constraints
    - Reject succession assessment without defined leadership competencies
    - Reject scaling strategy without current team structure and growth targets
    output_checks:
    - Hiring plans must include ramp-adjusted revenue capacity projections
    - Succession assessments must map candidates to specific competency gaps
    - Org design proposals must include manager span analysis
    - Attrition risk signals must cite specific behavioral evidence
    signal_validation:
    - Never infer attrition intent from performance data alone
    - Ramp projections must be grounded in historical first-deal data, not industry averages
    - Succession readiness must distinguish "high performer" from "leadership ready"
    - Flag when headcount data is older than 30 days
  error_handling:
    tool_failures:
      critical:
      - read-crm-data
      - read-infohub
      enrichment:
      - read-communications
    on_critical_failure:
      action: stop
      emit_signal: SIG_CRITICAL_DATA_MISSING
      guidance: Cannot produce reliable org analysis without headcount and performance data
    on_enrichment_failure:
      action: continue_with_degradation
      emit_signal: SIG_ENRICHMENT_UNAVAILABLE
      guidance: Proceed with structured data, mark attrition signals and coaching notes as unavailable
    on_stale_data:
      action: warn_and_continue
      emit_signal: SIG_STALE_DATA_USED
      guidance: Flag data freshness concern, recommend VP verify headcount status before acting
  knowledge:
    scope:
      domains:
      - organizational-development
      - talent-management
      - sales-leadership
      - succession-planning
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/sales-leadership-development.yaml
      description: Director coaching frameworks, leadership competencies, succession planning methodology
    - path: references/territory-planning-framework.yaml
      description: Capacity modeling inputs for headcount planning and territory staffing
    - path: references/industry-best-practices.yaml
      description: Industry best practices audit (Gartner, Forrester), org design and talent benchmarks
  autonomy:
    triggers:
    - type: parent_dispatch
      source: vp-sales-agent
      description: VP Sales orchestrator routes hiring, scaling, and succession requests
    outputs:
    - type: parent_return
      target: vp-sales-agent
      payload:
      - hiring_plan
      - scaling_strategy
      - succession_assessment
      description: Organization and talent results back to orchestrator for VP review
