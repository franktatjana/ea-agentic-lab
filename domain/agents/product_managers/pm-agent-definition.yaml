  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  outputs:
  - title: result
    type: object
  x-ea-agent:
    risk: low
    resolver: agent-registry
    target_agent: pm-gap-analysis-agent
- component_type: ClientTool
  id: invoke-pm-roadmap-communication-agent
  name: Invoke PM Roadmap Communication Agent
  description: Route to PM Roadmap Communication Agent for field enablement on roadmap, release context preparation, and customer roadmap inquiry responses
  requires_confirmation: false
  inputs:
  - title: task
    type: string
  - title: account_context
    type: object
  outputs:
  - title: result
