# ============================================================
# EA-AGENTIC-LAB EXTENSIONS (x-ea-agent namespace)
# ============================================================

x-ea-agent:
  profile:
    role_context: >
      The Product Manager bridges what customers need and what engineering
      builds. They collect feature gaps from active deals, synthesize customer
      feedback, and align the product roadmap with market demand. Without this
      role, deal teams promise features that aren't on the roadmap.
    scenarios:
      - problem: "Feature gaps are discovered during customer demos"
        why: >
          Deal teams promise capabilities based on outdated knowledge of the product
          roadmap. When a customer asks for a specific feature during a demo or
          technical review, the gap between expectation and reality creates
          credibility damage that is hard to recover from mid-deal.
        agent: pm-agent
        agent_response: >
          The agent detects customer feature requests from communications and
          matches them against the current product roadmap. It flags gaps where
          requested capabilities are not planned, highlights feasibility
          constraints, and tracks roadmap dependencies so deal teams know the
          product reality before making customer commitments.
        success_signal:
          metric: "Feature gap detection before customer-facing interactions"
          target: "Identify and flag feature gaps at least 5 days before scheduled demos or technical reviews"
          leading_indicator: "Deal teams check roadmap alignment reports before committing to feature discussions"
          failure_signal: "Feature gaps are first discovered during live customer interactions"
      - problem: "Repeat feature requests across accounts go unrecognized"
        why: >
          When multiple customers ask for the same capability through different
          channels, nobody connects the pattern. Each request is treated as a
          one-off, and the product team never sees the aggregate demand signal
          that would justify prioritization.
        agent: pm-agent
        agent_response: >
          The agent identifies patterns in feature requests across accounts by
          aggregating requests from Slack, email, and CRM notes. It classifies
          request frequency by segment and deal value, creating a demand signal
          that product teams can use to inform prioritization with evidence
          from real customer conversations.
        success_signal:
          metric: "Cross-account feature request pattern identification"
          target: "Surface recurring feature patterns within 2 weeks of the third independent request"
          leading_indicator: "Product team references aggregated demand data in prioritization decisions"
          failure_signal: "Product priorities are set without awareness of cross-account request patterns"
      - problem: "Roadmap priorities don't always reflect deal urgency"
        why: >
          Product roadmaps are driven by strategic vision and engineering capacity, but
          active deals create time-sensitive feature needs. When deal urgency does not
          factor into prioritization, the sales team loses deals waiting for capabilities
          that the product team does not know are blocking revenue.
        agent: pm-agent
        agent_response: >
          The agent connects active deal requirements to roadmap items, quantifying the
          revenue impact of feature delivery timing. It surfaces deals at risk due to
          roadmap gaps, calculates the aggregate deal value behind each feature request,
          and provides product leadership with a deal-weighted prioritization overlay
          alongside the strategic roadmap.
        success_signal:
          metric: "Deal-impacted feature visibility in roadmap planning"
          target: "100% of features blocking deals above threshold are visible in roadmap prioritization"
          leading_indicator: "Product planning sessions include deal-impact data for contested priorities"
          failure_signal: "Deal lost because a feature was deprioritized without awareness of revenue impact"
    challenges:
      - "Feature requests from deals are scattered across channels"
      - "Customer feedback isn't aggregated systematically"
      - "Roadmap priorities don't always reflect deal urgency"
    administrative_overhead:
      - "Collecting feature requests from Slack, email, and CRM notes"
      - "Maintaining a feature gap tracker across active deals"
      - "Writing release notes and internal enablement updates"
    capabilities:
      - "Product roadmap alignment"
      - "Feature gap analysis from deals"
      - "Customer feedback synthesis"
      - "Engineering priority alignment"
      - "Release communication"
    human_matters_summary: >
      Customers ask for features, but markets need direction. The agent matches
      feature requests to the roadmap and highlights gaps, but the PM brings
      strategic judgment on which requests represent real market signals versus
      one-off asks, decides when to reshape priorities, and manages the complexity
      of feature promise timing. The roadmap is tracked, but the human PM decides
      which customer voices get heard.

  fallback_model: null
  prompt_registry:
    pm-gap-assessment:
      description: Analyze gap between customer need and product capability
      source: prompts/tasks.yaml#feature_gap.gap_assessment
      inputs:
      - title: account_name
        type: string
      - title: arr
        type: string
      - title: deal_value
        type: string
      - title: requirement_description
        type: string
      outputs:
      - title: gap-assessment_result
        type: object
      requires_data:
        - source: read-pm-data
          fields: [product_capabilities, roadmap_items, feature_backlog]
          priority: critical
    pm-roadmap-dependency:
      description: Analyze customer dependency on roadmap items
      source: prompts/tasks.yaml#feature_gap.roadmap_dependency
      inputs:
      - title: account_name
        type: string
      - title: customer_deadline
        type: string
      - title: date
        type: string
      - title: feature
        type: string
      - title: list
        type: string
      - title: name
        type: string
      outputs:
      - title: roadmap-dependency_result
        type: object
      requires_data:
        - source: read-pm-data
          fields: [roadmap_items, release_timelines, feature_dependencies]
          priority: critical
    pm-pattern-analysis:
      description: Identify patterns in feature requests across accounts
      source: prompts/tasks.yaml#feature_gap.pattern_analysis
      inputs:
      - title: segment
        type: string
      - title: time_period
        type: string
      outputs:
      - title: pattern-analysis_result
        type: object
      requires_data:
        - source: read-pm-data
          fields: [feature_request_history, account_segments, request_trends]
          priority: critical
    pm-quick-feasibility:
      description: Rapid feasibility assessment for customer request
      source: prompts/tasks.yaml#feasibility.quick_feasibility
      inputs:
      - title: customer_question
        type: string
      outputs:
      - title: quick-feasibility_result
        type: object
      requires_data:
        - source: read-pm-data
          fields: [product_capabilities, known_limitations]
          priority: critical
    pm-detailed-feasibility:
      description: Deep feasibility analysis for complex request
      source: prompts/tasks.yaml#feasibility.detailed_feasibility
      inputs:
      - title: detailed_requirement
        type: string
      - title: use_case_context
        type: string
      outputs:
      - title: detailed-feasibility_result
        type: object
      requires_data:
        - source: read-pm-data
          fields: [product_capabilities, architecture_constraints, roadmap_items]
          priority: critical
    pm-roadmap-response:
      description: Prepare response to customer roadmap inquiry
      source: prompts/tasks.yaml#communication.roadmap_response
      inputs:
      - title: account_name
        type: string
      - title: feature_area
        type: string
      - title: relationship_context
        type: string
      outputs:
      - title: roadmap-response_result
        type: object
      requires_data:
        - source: read-pm-data
          fields: [roadmap_items, release_timelines, public_roadmap_status]
          priority: critical
    pm-gap-messaging:
      description: Prepare customer communication about feature gap
      source: prompts/tasks.yaml#communication.gap_messaging
      inputs:
      - title: account_name
        type: string
      - title: gap_description
        type: string
      - title: impact
        type: string
      outputs:
      - title: gap-messaging_result
        type: object
      requires_data:
        - source: read-pm-data
          fields: [feature_backlog, workarounds, roadmap_items]
          priority: critical
    pm-feedback-synthesis:
      description: Synthesize product feedback from account
      source: prompts/tasks.yaml#product_feedback.feedback_synthesis
      inputs:
      - title: account_name
        type: string
      - title: time_period
        type: string
      outputs:
      - title: feedback-synthesis_result
        type: object
      requires_data:
        - source: read-pm-data
          fields: [customer_feedback_records, support_tickets, feature_requests]
          priority: critical
    pm-enhancement-request:
      description: Document customer enhancement request formally
      source: prompts/tasks.yaml#product_feedback.enhancement_request
      inputs:
      - title: account
        type: string
      - title: account_name
        type: string
      - title: business_context
        type: string
      - title: date
        type: string
      - title: enhancement_description
        type: string
      outputs:
      - title: enhancement-request_result
        type: object
      requires_data:
        - source: read-pm-data
          fields: [existing_enhancement_requests, roadmap_items]
          priority: enrichment
    pm-cab-prep:
      description: Prepare for CAB meeting with customer
      source: prompts/tasks.yaml#meeting_support.cab_prep
      inputs:
      - title: account_name
        type: string
      - title: date
        type: string
      - title: known_priorities
        type: string
      - title: proposed_topics
        type: string
      outputs:
      - title: cab-prep_result
        type: object
      requires_data:
        - source: read-pm-data
          fields: [roadmap_items, feature_status, release_timelines, customer_feedback_records]
          priority: critical
    pm-product-demo:
      description: Prepare product demonstration for customer
      source: prompts/tasks.yaml#meeting_support.product_demo
      inputs:
      - title: account_name
        type: string
      - title: audience_roles
        type: string
      - title: known_concerns
        type: string
      - title: use_case
        type: string
      outputs:
      - title: product-demo_result
        type: object
      requires_data:
        - source: read-pm-data
          fields: [product_capabilities, demo_environments, known_limitations]
          priority: critical
  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information,
      and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - required_verifications
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not commit to feature delivery dates (handoff to PM Director)
  - Does not promise unreleased features (handoff to PM Director)
  - Does not override product prioritization (handoff to PM Director)
  - Does not make architecture decisions (SA Agent's domain) (handoff to SA Agent)
  - Does not assess commercial viability (AE Agent's domain) (handoff to PM Director)
  permissions:
  - Detect customer requests for features or capabilities
  - Match requests to known roadmap items
  - Flag feature gaps (requested but not planned)
  - Highlight feasibility constraints
  - Track roadmap dependencies
  - Monitor customer expectations vs. product reality
  escalation_triggers:
  - Technical implementation feasibility (to SA Agent)
  - Critical feature request capture exceeding agent authority (to PM Director)
  handoffs:
    human_escalation: PM Director
    defer_to:
      sa_agent: Technical implementation feasibility
    provide_to:
      ae_agent: Feature gap impact on deal
      sa_agent: Product capability constraints
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Feature request capture
    - Roadmap alignment check
    - Feasibility classification
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains: [project-management, delivery-coordination]
      archetypes: [enterprise, mid-market]
    references:
    - path: references/signal-detection.yaml
      description: Feature Requests, Roadmap Dependencies, Feasibility Constraints
  assets:
  - name: feasibility-note
    filename: '{account}-feasibility-note.md'
    description: Feasibility note
  - name: roadmap-alignment-reports
    filename: '{account}-roadmap-alignment-reports.md'
    description: Roadmap alignment reports
  - name: feature-gap-analysis
    filename: '{account}-feature-gap-analysis.md'
    description: Feature gap analysis
  quality:
  - All feature requests quoted from source
  - All feasibility assessments marked [VERIFIED] or [NEEDS VERIFICATION]
  - No release date commitments
