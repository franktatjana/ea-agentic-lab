      context: Practical guidance on communicating roadmap decisions to sales, customers, and stakeholders
    playbook_raci:
      context: >
        The Product Manager owns 3 product intelligence playbooks and contributes product
        roadmap and capability context to playbooks led by other roles.
      responsible:
        - playbook: Feature Gap Analysis (PB_PM_001)
          scope: Product capability gap identification, field request aggregation, prioritization
          team: product_managers
