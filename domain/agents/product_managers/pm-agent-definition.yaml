  validation:
    required_dimensions:
    - name: context
      description: What account, project, or domain is being analyzed?
    - name: source_data
      description: What source content or data is being processed?
    on_incomplete: State what's missing, provide a preliminary analysis based on available information, and flag gaps for human review. Do not generate a full analysis from incomplete input.
  output_constraints:
    evidence_requirement: All claims must cite source evidence
    total_word_limit: 350
    hard_rule: No claim without source evidence
  guardrails:
    input:
    - Reject requests without source content or evidence base
    output:
    - strict_rules
    - required_verifications
    resource:
    - max_tool_calls: 30
  boundaries:
  - Does not commit to feature delivery dates (handoff to PM Director)
  - Does not promise unreleased features (handoff to PM Director)
  - Does not override product prioritization (handoff to PM Director)
  - Does not make architecture decisions (SA Agent's domain) (handoff to SA Agent)
  - Does not assess commercial viability (AE Agent's domain) (handoff to PM Director)
  permissions:
  - Detect customer requests for features or capabilities
  - Match requests to known roadmap items
  - Flag feature gaps (requested but not planned)
  - Highlight feasibility constraints
  - Track roadmap dependencies
  - Monitor customer expectations vs. product reality
  escalation_triggers:
  - Feature delivery date commitment requested by deal team or customer (to PM Director)
  - Roadmap reprioritization required to save deal above ARR threshold (to PM Director + VP Product)
  - Technical implementation feasibility exceeds PM scope and requires architecture assessment (to SA Agent)
  - Customer receives conflicting feature commitments from multiple team members (to PM Director + AE)
  - Competitive gap pattern signals strategic roadmap risk across 3+ accounts (to Field CTO + PM Director)
  handoffs:
    human_escalation: PM Director
    defer_to:
      sa_agent:
        scope: Technical implementation feasibility, architecture constraints on feature design
        scenarios:
        - trigger: Feature request requires technical feasibility assessment beyond product scope
          context_passed: Feature requirements, customer context, competitive urgency, current roadmap status
          receiver_action: Feasibility analysis, architecture impact assessment, constraint documentation
      delivery_agent:
        scope: Implementation complexity, deployment constraints, release dependency chain
        scenarios:
        - trigger: Release planning requires implementation effort estimation or dependency validation
          context_passed: Feature specification, deployment requirements, dependency chain, customer deadline
          receiver_action: Effort estimation, deployment planning, risk identification, constraint flagging
      fcto_agent:
        scope: Technology direction validation, cross-account demand patterns, competitive urgency signals
        scenarios:
        - trigger: Roadmap decision needs field validation or cross-account evidence to defend prioritization
          context_passed: Feature proposal, market hypothesis, competitive context, demand signal data
          receiver_action: Field intelligence validation, cross-account demand confirmation, competitive urgency scoring
      ci_agent:
        scope: Competitive gap analysis, competitor feature parity assessment
        scenarios:
        - trigger: Competitive gap pattern detected across 3+ deal conversations
          context_passed: Gap description, competitor feature context, affected deals, ARR at risk
          receiver_action: Competitive feature parity analysis, displacement risk assessment, counter-positioning
    receive_from:
      rfp_agent: Unmatched and partial-match capability gaps per RFP, recurring gap trend summaries
    provide_to:
      ae_agent:
        scope: Feature gap impact on deals, roadmap timeline commitments, approved gap messaging
        scenarios:
        - trigger: Deal blocked by feature gap or customer requests roadmap commitment
          context_passed: Gap analysis, roadmap status, workaround availability, delivery timeline, approved messaging
          receiver_action: Customer expectation management, deal strategy adjustment, commitment calibration
      sa_agent:
        scope: Product capability constraints, upcoming feature availability, feasibility classification
        scenarios:
        - trigger: Solution design needs product capability validation or feasibility input
          context_passed: Feature availability, API constraints, product limitations, upcoming releases, feasibility note
          receiver_action: Solution design adjustment, workaround design, customer communication prep
      ca_agent:
        scope: Release notes, feature availability, adoption guidance for new capabilities
        scenarios:
        - trigger: New feature released or product change affects existing customers
          context_passed: Release details, migration path, breaking changes, adoption resources, customer impact
          receiver_action: Customer communication, adoption planning, training updates
      delivery_agent:
        scope: Product updates affecting active implementations, breaking change notification
        scenarios:
        - trigger: Release schedule impacts active implementations or introduces breaking changes
          context_passed: Release timeline, breaking changes, migration requirements, affected customer list
          receiver_action: Implementation plan adjustment, upgrade planning, customer risk flagging
  human_in_the_loop_conditions:
  - Review required before publishing analysis externally
  - Approval needed for strategic recommendations
  - Flag outputs based on indirect or incomplete signals
  memory:
    conversation: Current analysis session state
    working:
    - Signals detected during current session
    - Evidence gathered from scanned content
    - Interim analysis results
    persistent:
    - Historical patterns and trends
    - Previous analysis outcomes
    - Known domain context
    shared:
    - Analysis results shared with collaborating agents via InfoHub
  context:
    strategy: Evidence-first, prioritize signals with highest severity
    token_budget: 8000
    reserve_for_references: 1500
    priority_order:
    - System prompt with identity and constraints
    - Current task context and inputs
    - Working memory (signals, evidence gathered)
    - Feature request capture
    - Roadmap alignment check
    - Feasibility classification
    - Reference materials (if available)
    include:
    - Source evidence and quotes
    - Current account or domain context
    exclude:
    - Generic advice without evidence
    - Content outside agent scope
  knowledge:
    scope:
      domains:
      - product-management
      - roadmap-alignment
      - feature-gap-analysis
      - customer-feedback-synthesis
      archetypes:
      - enterprise
      - mid-market
    references:
    - path: references/signal-detection.yaml
      description: Feature Requests, Roadmap Dependencies, Feasibility Constraints
  assets:
  - name: feasibility-note
    filename: '{account}-feasibility-note.md'
    description: Feasibility note
  - name: roadmap-alignment-reports
    filename: '{account}-roadmap-alignment-reports.md'
    description: Roadmap alignment reports
  - name: feature-gap-analysis
    filename: '{account}-feature-gap-analysis.md'
    description: Feature gap analysis
  quality:
  - All feature requests quoted from source
  - All feasibility assessments marked [VERIFIED] or [NEEDS VERIFICATION]
  - No release date commitments
