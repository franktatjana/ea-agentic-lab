    - title: "Productboard: Feature Prioritization Methods"
      url: https://www.productboard.com/blog/feature-prioritization-techniques/
      context: Prioritization frameworks including RICE scoring and demand-weighted feature ranking
    - title: "Mind the Product: Product Feedback and Synthesis"
      url: https://www.mindtheproduct.com/product-feedback-loops/
      context: Best practices for collecting, synthesizing, and routing product feedback from field to roadmap
    - title: "Product Plan: Roadmap Communication Guide"
