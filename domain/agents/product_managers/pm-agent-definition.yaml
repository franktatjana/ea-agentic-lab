x-ea-agent:
  profile:
    role_context: 'The Product Manager bridges what customers need and what engineering builds. They collect feature gaps from active deals, synthesize customer feedback, and align the product roadmap with
      market demand. Without this role, deal teams promise features that aren''t on the roadmap.

      '
    why: 'Vendor-side PMs manage a roadmap shaped by strategic vision and engineering capacity, but customer reality arrives through deal teams as scattered feature asks across Slack, email, and CRM notes.
      Without systematic aggregation, each request is treated as a one-off, patterns go unrecognized, and field-to-product feedback loops break down. This agent handles requirement classification, gap
      scoring, cross-deal pattern detection, and roadmap enablement content so the PM can focus on prioritization judgment, stakeholder alignment, and the market decisions only they can make.

      '
    human_matters_summary: 'Customers ask for features, but markets need direction. The agent matches feature requests to the roadmap and highlights gaps, but the PM brings strategic judgment on which requests
      represent real market signals versus one-off asks, decides when to reshape priorities, and manages the complexity of feature promise timing. When field pressure conflicts with engineering capacity,
      the PM resolves that tension with context the agent cannot hold: relationship risk, strategic timing, and the trust that comes from years of customer conversations.

      '
    human_matters_goal: 'Every feature ask is classified and tracked, but which ones reshape the roadmap is a judgment call only the PM can make.

      '
    role_tab_intro: 'The PM manages roadmap alignment across dozens of active deals while fielding feature requests from every direction: sales, customers, support, and leadership. The challenges below are
      where signal gets lost, gaps go undetected, and roadmap communication breaks down, each mapped to the sub-agent built to prevent it.

      '
    goals_summary: 'The PM succeeds when every customer feature ask is classified against the roadmap, no feature gap reaches a customer conversation undetected, and product prioritization reflects
      real deal demand weighted by revenue impact.

      '
    goals:
    - Every customer feature request classified against current roadmap within 48 hours of capture
    - Feature gaps detected and flagged before customer-facing demos or technical reviews
    - Cross-account feature request patterns surfaced within 2 weeks of the third independent request
    - All features blocking deals above ARR threshold visible in roadmap prioritization sessions
    - Feasibility assessments delivered within 24 hours for urgent deal-blocking requests
    - Release communication prepared for field teams at least 2 weeks before GA
    - Field teams able to answer roadmap questions without routing every inquiry to PM
    - Product feedback from deals aggregated and routed to PM with frequency and revenue weighting
    - CAB meetings prepared with current roadmap context, not stale information from last quarter
    - Gap messaging available for every active gap so deal teams communicate consistently
    - Demand signals from deals visible in product planning with deal count and ARR attribution
    - Feature roadmap commitments tracked across accounts so promise drift is caught before it causes credibility damage
    key_metrics:
    - 'Requirement classification speed: hours from feature request capture to roadmap alignment status'
    - 'Gap detection lead time: days before customer interaction that a gap is flagged to the deal team'
    - 'Cross-account pattern detection: days from third independent request to pattern report surfaced'
    - 'Deal-impact visibility: percentage of revenue-blocking features visible in prioritization sessions'
    - 'Roadmap communication freshness: days between release decision and field enablement content available'
    - 'Feasibility turnaround: hours from request to assessment for deal-blocking questions'
    - 'Feedback routing rate: percentage of field feedback items reaching PM with revenue and frequency attribution'
    key_responsibilities:
    - 'Requirement Classification: capture customer feature requests from deal conversations, classify against current roadmap as matched, partial-match, or gap, and track dependency chains per account'
    - 'Gap Detection: identify capability gaps between customer requirements and product state, score gap severity by deal impact, and maintain a gap register updated from active deals'
    - 'Feasibility Assessment: evaluate technical and timeline feasibility for customer-requested capabilities, distinguishing near-term, long-term, and not-planned classifications'
    - 'Prioritization Input: aggregate demand signals across deals with ARR weighting and competitive urgency scoring, and deliver structured input to product planning sessions'
    - 'Roadmap Communication: prepare and maintain field enablement content on current roadmap, including what is shipping, what is not, and how to handle customer questions'
    - 'Release Enablement: develop release context packages for SA and AE teams ahead of GA, covering use cases, limitations, and customer messaging for new capabilities'
    - 'Gap Messaging: create approved customer-facing language for active feature gaps so deal teams communicate consistently without improvising commitments'
    - 'Pattern Detection: detect recurring feature themes across accounts, cluster by segment and use case, and surface demand patterns before they become lost in individual deal notes'
    - 'Feedback Synthesis: aggregate VoC and deal-level product feedback into structured product intelligence reports with source attribution and frequency counts'
    - 'CAB Preparation: prepare Product Manager for Customer Advisory Board sessions with current roadmap status, top demand themes, and customer priority alignment data'
    - 'Dependency Tracking: track which active deals depend on which roadmap items, and flag deals at risk when roadmap timelines shift'
    - 'Competitive Gap Analysis: identify where competitor feature sets create gaps in the current roadmap that are showing up in deal conversations, and surface competitive demand signals to PM and CI teams'
    sub_agents:
    - name: PM Requirement Mapping Agent
      id: pm-requirement-mapping-agent
      purpose: Classify customer feature requests against the current roadmap, track dependencies per account, and surface roadmap fit status before customer-facing interactions.
    - name: PM Gap Analysis Agent
      id: pm-gap-analysis-agent
      purpose: Identify feature gaps between customer requirements and product state, assess feasibility, score gap severity by deal impact, and provide structured prioritization input.
    - name: PM Roadmap Communication Agent
      id: pm-roadmap-communication-agent
      purpose: Prepare field enablement on roadmap, release context packages, and approved gap messaging so deal teams communicate product reality consistently.
    - name: PM Feedback Synthesis Agent
      id: pm-feedback-synthesis-agent
      purpose: Aggregate field signals into product input, detect patterns across deals, and route structured feedback to PM with frequency and revenue attribution.
    challenges:
    - text: Feature requests from deals arrive through Slack, email, and CRM notes with no consistent classification, so the same gap surfaces repeatedly without the PM noticing
      solved_by: pm-requirement-mapping-agent
      category: Requirement Classification
      specific_overhead:
      - Manually reviewing deal notes and Slack threads to extract feature requests
      - Deduplicating requests across accounts to identify whether a gap has been reported before
    - text: Roadmap dependencies per account are tracked in spreadsheets that go stale mid-deal, creating silent risk when a roadmap item shifts
      solved_by: pm-requirement-mapping-agent
      category: Requirement Classification
      specific_overhead:
      - Maintaining per-account dependency trackers that must be manually updated when roadmap changes
      - Cross-referencing active deals against roadmap revisions to find newly impacted accounts
    - text: Feature gaps are discovered during live demos because nobody checked roadmap alignment before the meeting
      solved_by: pm-gap-analysis-agent
      category: Feature Gap Detection
      specific_overhead:
      - Manually verifying whether a requested feature exists before each customer-facing meeting
      - Writing gap assessments reactively after customer conversations rather than proactively before
    - text: Feasibility questions from deal teams arrive with no standard format, so each assessment starts from scratch and inconsistent answers reach customers
      solved_by: pm-gap-analysis-agent
      category: Feature Gap Detection
      specific_overhead:
      - Reformatting ad hoc feasibility questions into structured assessments for PM review
      - Tracking which feasibility answers were given to which accounts to prevent contradictions
    - text: Gap severity is assessed per deal rather than across the portfolio, so a gap blocking $5M in ARR looks the same as a gap mentioned once in a $50K deal
      solved_by: pm-gap-analysis-agent
      category: Prioritization Input
      specific_overhead:
      - Manually aggregating gap data across active deals to calculate combined revenue impact
      - Preparing gap impact summaries for product planning without a consistent weighting model
    - text: Prioritization sessions lack field demand data, so product teams defend strategic vision against anecdotal deal pressure with no quantified market signal
      solved_by: pm-feedback-synthesis-agent
      category: Prioritization Input
      specific_overhead:
      - Building demand signal reports from scattered deal notes before each planning cycle
      - Calculating ARR-weighted demand across accounts to give product a defensible prioritization input
    - text: Field teams answer roadmap questions from memory, and outdated answers create commitments the PM never made
      solved_by: pm-roadmap-communication-agent
      category: Roadmap Communication
      specific_overhead:
      - Writing and distributing roadmap Q&A guides after every planning cycle
      - Correcting customer misunderstandings created by inconsistent field messaging on roadmap topics
    - text: Release communication reaches field teams the week of GA, giving SAs and AEs no time to prepare for customer questions
      solved_by: pm-roadmap-communication-agent
      category: Roadmap Communication
      specific_overhead:
      - Preparing release notes and field enablement packs in parallel with engineering shipping the feature
      - Translating engineering release notes into customer-facing language on short notice
    - text: Customer feedback collected during CAB sessions is never synthesized, so the same themes repeat across quarterly meetings without informing roadmap priorities
      solved_by: pm-feedback-synthesis-agent
      category: Feedback Synthesis
      specific_overhead:
      - Manually reviewing CAB meeting notes and surveys for recurring product themes
      - Categorizing feedback by product area before each planning cycle without a consistent taxonomy
    - text: Cross-account feature patterns are invisible because requests are filed account-by-account, and the PM never sees aggregate demand until it becomes a competitive issue
      solved_by: pm-feedback-synthesis-agent
      category: Feedback Synthesis
      specific_overhead:
      - Reviewing deal notes across accounts to identify repeating feature themes manually
      - Building demand frequency reports from multiple CRM and Slack sources for quarterly planning
    - text: Competitive feature gaps surface in deal loss reports rather than in roadmap planning, giving product teams no lead time to respond
      solved_by: pm-gap-analysis-agent
      category: Competitive Gap Visibility
      specific_overhead:
      - Reviewing competitive loss analysis reports for product-relevant gap signals
      - Correlating competitor feature mentions across deals to separate systemic gaps from isolated asks
    - text: Enhancement requests submitted after customer meetings lack business context, so product teams deprioritize them because the case for urgency is missing
      solved_by: pm-feedback-synthesis-agent
      category: Competitive Gap Visibility
      specific_overhead:
      - Following up with deal teams to collect business context for submitted enhancement requests
      - Reformatting raw customer asks into structured product feedback with revenue and use case context
    administrative_overhead:
    - text: Collecting feature requests from Slack, email, and CRM notes across active deals
      automated_by: pm-requirement-mapping-agent
    - text: Maintaining a feature gap tracker and updating it when roadmap items shift
      automated_by: pm-requirement-mapping-agent
    - text: Writing feasibility assessments for ad hoc deal-team questions
      automated_by: pm-gap-analysis-agent
    - text: Building ARR-weighted demand signal reports for product planning cycles
      automated_by: pm-feedback-synthesis-agent
    - text: Writing and distributing release notes and field enablement content ahead of GA
      automated_by: pm-roadmap-communication-agent
    - text: Preparing CAB meeting materials and aggregating post-CAB feedback into themes
      automated_by: pm-feedback-synthesis-agent
    - text: Drafting approved gap messaging so deal teams communicate consistently without improvising
      automated_by: pm-roadmap-communication-agent
    scenarios:
    - problem: Feature gaps are discovered during customer demos
      why: 'Deal teams promise capabilities based on outdated knowledge of the product roadmap. When a customer asks for a specific feature during a demo or technical review, the gap between expectation
        and reality creates credibility damage that is hard to recover from mid-deal.

        '
      agent: pm-agent
      agent_response: 'The agent detects customer feature requests from communications and matches them against the current product roadmap. It flags gaps where requested capabilities are not planned, highlights
        feasibility constraints, and tracks roadmap dependencies so deal teams know the product reality before making customer commitments.

        '
      success_signal:
        metric: Feature gap detection before customer-facing interactions
        target: Identify and flag feature gaps at least 5 days before scheduled demos or technical reviews
        leading_indicator: Deal teams check roadmap alignment reports before committing to feature discussions
        failure_signal: Feature gaps are first discovered during live customer interactions
    - problem: Repeat feature requests across accounts go unrecognized
      why: 'When multiple customers ask for the same capability through different channels, nobody connects the pattern. Each request is treated as a one-off, and the product team never sees the aggregate
        demand signal that would justify prioritization.

        '
      agent: pm-agent
      agent_response: 'The agent identifies patterns in feature requests across accounts by aggregating requests from Slack, email, and CRM notes. It classifies request frequency by segment and deal value,
        creating a demand signal that product teams can use to inform prioritization with evidence from real customer conversations.

        '
      success_signal:
        metric: Cross-account feature request pattern identification
        target: Surface recurring feature patterns within 2 weeks of the third independent request
        leading_indicator: Product team references aggregated demand data in prioritization decisions
        failure_signal: Product priorities are set without awareness of cross-account request patterns
    - problem: Roadmap priorities don't always reflect deal urgency
      why: 'Product roadmaps are driven by strategic vision and engineering capacity, but active deals create time-sensitive feature needs. When deal urgency does not factor into prioritization, the sales
        team loses deals waiting for capabilities that the product team does not know are blocking revenue.

        '
      agent: pm-agent
      agent_response: 'The agent connects active deal requirements to roadmap items, quantifying the revenue impact of feature delivery timing. It surfaces deals at risk due to roadmap gaps, calculates
        the aggregate deal value behind each feature request, and provides product leadership with a deal-weighted prioritization overlay alongside the strategic roadmap.

        '
      success_signal:
        metric: Deal-impacted feature visibility in roadmap planning
        target: 100% of features blocking deals above threshold are visible in roadmap prioritization
        leading_indicator: Product planning sessions include deal-impact data for contested priorities
        failure_signal: Deal lost because a feature was deprioritized without awareness of revenue impact
    stakeholder_landscape:
      customer_side:
      - "Product Champions: power users who provide feature feedback and validate roadmap direction"
      - "Technical Decision Makers: evaluate product capabilities against technical requirements"
      - "Business Stakeholders: define business outcomes that drive feature prioritization"
      - "End Users: adoption signals and usability feedback that shape product direction"
      internal_team:
      - "Solution Architect: technical feasibility, architecture constraints on feature design"
      - "Account Executive: deal-level feature commitments, customer priority context"
      - "Field CTO: cross-account demand patterns, competitive urgency signals"
      - "Delivery Manager: implementation complexity, deployment constraints for releases"
      - "Customer Architect: post-release adoption feedback, customer health impact"
    with_this_agent:
    - domain: Requirement Mapping and Dependency Tracking
      agent: pm-requirement-mapping-agent
      items:
      - 'Requirement Classification: classify customer feature requests against the current roadmap as matched, partial-match, or gap.'
      - 'Dependency Tracking: maintain per-account dependency maps against roadmap items and flag deals at risk when timelines shift.'
    - domain: Roadmap Fit and Pre-Meeting Alignment
      agent: pm-requirement-mapping-agent
      items:
      - 'Pre-Meeting Alignment: verify roadmap fit for features likely to be discussed before customer-facing interactions.'
      - 'Roadmap Fit Report: deliver a structured alignment summary per account with gap classification and dependency status.'
    - domain: Feature Gap Identification and Severity Scoring
      agent: pm-gap-analysis-agent
      items:
      - 'Gap Detection: identify capability gaps between customer requirements and product state, scored by deal impact and ARR at risk.'
      - 'Gap Register: maintain a live gap register updated from active deals with severity and deal attribution.'
    - domain: Feasibility Assessment
      agent: pm-gap-analysis-agent
      items:
      - 'Quick Feasibility: rapid feasibility classification for deal-blocking feature questions within 24 hours.'
      - 'Deep Feasibility: detailed feasibility analysis for complex requirements with architecture constraints and timeline classification.'
      - 'Competitive Gap Analysis: identify competitor feature gaps showing up in deal conversations and surface competitive demand signals.'
    - domain: Roadmap Communication and Field Enablement
      agent: pm-roadmap-communication-agent
      items:
      - 'Field Enablement: prepare roadmap Q&A content and approved talking points so deal teams answer questions without improvising.'
      - 'Release Context: build release enablement packages for SA and AE teams ahead of GA with use cases, limitations, and customer messaging.'
    - domain: Gap Messaging
      agent: pm-roadmap-communication-agent
      items:
      - 'Gap Messaging: create approved customer-facing language for active feature gaps so deal teams communicate consistently.'
      - 'CAB Preparation: prepare roadmap context packages for Customer Advisory Board sessions including top demand themes.'
    - domain: Cross-Deal Signal Aggregation
      agent: pm-feedback-synthesis-agent
      items:
      - 'Pattern Detection: detect recurring feature themes across deals, cluster by segment and use case, and surface demand patterns before they are lost in account-level notes.'
      - 'Feedback Synthesis: aggregate deal-level product feedback into structured intelligence reports with source attribution and frequency counts.'
    - domain: Demand Signal Routing
      agent: pm-feedback-synthesis-agent
      items:
      - 'ARR-Weighted Demand: build ARR-weighted demand signal reports for product planning cycles with deal count and revenue attribution.'
      - 'Enhancement Request Packaging: format raw customer asks as structured enhancement requests with business context for product backlog consumption.'
    activity_map:
      purpose: 'The PM owns the product-to-field alignment lifecycle across 4 specialized sub-agents. The PM orchestrator is a pure router: it holds no operational flows or prompts, only routing logic,
        cross-agent coordination, and product-level aggregation.

        '
      domains:
      - domain: Requirement Mapping and Dependency Tracking
        why: 'Feature requests that are never classified against the roadmap accumulate into a fog of customer asks that neither PM nor deal teams can navigate. Systematic classification converts scattered
          requests into a clear map of what is covered, what is partially covered, and what is missing, with the dependency chain per active deal visible before it becomes a risk.

          '
        agent: pm-requirement-mapping-agent
        activities:
        - Feature request capture from Slack, email, and CRM notes
        - Roadmap fit classification as matched, partial-match, or gap
        - Per-account dependency mapping against roadmap items
        - Dependency risk flagging when roadmap timelines shift
        - Pre-meeting alignment checks before customer-facing interactions
        cadence: continuous, triggered by new customer communications or roadmap changes
      - domain: Roadmap Fit and Pre-Meeting Alignment
        why: 'Gaps discovered live in a customer meeting cost more than gaps detected the day before. Proactive roadmap alignment checks before scheduled interactions prevent the credibility damage that
          comes from being caught unprepared by a feature question.

          '
        agent: pm-requirement-mapping-agent
        activities:
        - Pre-meeting roadmap alignment verification per account
        - Gap flag delivery to deal team before customer interaction window
        - Alignment status reporting with classification and dependency context
        cadence: triggered by scheduled customer-facing meetings, minimum 5 days in advance
      - domain: Feature Gap Identification and Severity Scoring
        why: 'A gap blocking $3M in ARR across four accounts is not the same as a gap mentioned once in a POC conversation. Without severity scoring tied to deal value, every gap competes equally
          for PM attention and the highest-impact gaps stay buried in a long list.

          '
        agent: pm-gap-analysis-agent
        contributing_agents:
        - agent: pm-requirement-mapping-agent
          provides: Classified gap list with account and roadmap context for severity scoring
        - agent: pm-feedback-synthesis-agent
          provides: Cross-deal demand frequency for gap importance calibration
        activities:
        - Gap identification from classified requirement map
        - Gap severity scoring by deal count, ARR at risk, and competitive urgency
        - Gap register maintenance with current status per active gap
        - Competitive gap detection from deal conversation signals
        cadence: continuous, minimum weekly gap register refresh
      - domain: Feasibility Assessment
        why: 'Feasibility questions from deal teams arrive without standard format, and inconsistent PM answers reach different customers with different levels of commitment. Structured assessment
          with explicit timeline classification (near-term, long-term, not planned) prevents promise drift before it becomes a trust problem.

          '
        agent: pm-gap-analysis-agent
        activities:
        - Quick feasibility classification for urgent deal-blocking requests
        - Detailed feasibility analysis for complex requirements
        - Feasibility answer tracking per account to prevent contradictions
        - Architecture constraint flagging for requests that need SA input
        cadence: on-demand, 24-hour SLA for deal-blocking questions
      - domain: Roadmap Communication and Field Enablement
        why: 'Field teams that answer roadmap questions from memory create informal commitments the PM never made. Pre-emptive enablement content ensures every SA and AE delivers consistent, approved
          answers, and release context packages give them enough lead time to prepare for customer questions before GA.

          '
        agent: pm-roadmap-communication-agent
        contributing_agents:
        - agent: pm-gap-analysis-agent
          provides: Active gap list and severity data for gap messaging content
        activities:
        - Roadmap Q&A content creation and maintenance
        - Release enablement package preparation ahead of GA
        - Field briefing content on what is shipping, what is not, and timeline context
        - CAB meeting roadmap context preparation
        cadence: per release cycle for enablement packs, continuous for Q&A maintenance
      - domain: Gap Messaging
        why: 'When deal teams improvise gap messaging under customer pressure, they create commitments that contradict each other across accounts and sometimes contradict the roadmap. Approved gap
          messaging per active gap turns a source of promise drift into a consistent, defensible customer communication.

          '
        agent: pm-roadmap-communication-agent
        activities:
        - Approved customer-facing language per active gap
        - Gap messaging consistency checks across deal teams
        - CAB feedback packaging from post-session notes
        cadence: per new gap identified, updated when gap status changes
      - domain: Cross-Deal Signal Aggregation
        why: 'Individual deal teams see their own customers. Only systematic aggregation across the portfolio reveals which feature themes repeat, which segments drive the strongest demand, and which
          asks represent real market signals versus one-off requirements. Pattern detection turns noise into product intelligence.

          '
        agent: pm-feedback-synthesis-agent
        contributing_agents:
        - agent: pm-requirement-mapping-agent
          provides: Classified feature requests with account and segment attribution for pattern analysis
        - agent: pm-gap-analysis-agent
          provides: Gap severity data for demand signal weighting
        activities:
        - Cross-deal feature theme detection and clustering by segment and use case
        - Demand frequency tracking by feature area
        - CAB and VoC feedback aggregation into product themes
        - Enhancement request packaging with business context
        cadence: continuous aggregation, monthly demand signal report
      - domain: Demand Signal Routing
        why: 'Product teams make better prioritization decisions when demand signals carry revenue attribution, competitive context, and frequency data rather than arriving as a list of customer
          requests with no weighting. Structured routing with ARR weighting converts scattered field feedback into PM inputs that can survive a prioritization debate.

          '
        agent: pm-feedback-synthesis-agent
        activities:
        - ARR-weighted demand signal report preparation for planning cycles
        - Deal count and revenue attribution per feature theme
        - Structured delivery to PM with frequency, source, and competitive urgency context
        - Cross-role demand routing to CI Agent when competitive patterns are detected
        cadence: per planning cycle, monthly minimum
    public_resources:
    - title: "Pragmatic Institute: Product Management Frameworks"
      url: https://www.pragmaticinstitute.com/resources/articles/product/product-management-framework/
      context: Industry-standard framework for PM responsibilities covering market problems, roadmap, and launch
    - title: "Product School: Product Manager Role and Responsibilities"
      url: https://productschool.com/blog/product-management/product-manager-job-description/
