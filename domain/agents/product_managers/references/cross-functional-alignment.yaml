# PM Cross-Functional Alignment Framework - Domain Knowledge
# Referenced by: pm-agent, pm-stakeholder-agent
# Managing the product-sales-engineering-CS relationship

alignment_cadences:
  description: "Standard meeting rhythms for cross-functional alignment"
  cadences:
    weekly_product_sales_sync:
      purpose: "Surface active deal feature gaps, provide roadmap updates, align on messaging"
      attendees: ["Product Manager", "Sales Leadership", "SA Lead"]
      agenda:
      - "Deal-blocking feature gaps from past week (5 min)"
      - "Roadmap status updates relevant to active deals (10 min)"
      - "Feature request triage: new requests with deal context (15 min)"
      - "Action items from prior week (5 min)"
      outputs: ["Request status updates", "Prioritization decisions", "Escalation list"]

    monthly_cross_functional_review:
      purpose: "Align product, sales, CS, and marketing on priorities and performance"
      attendees: ["Product", "Sales", "CS", "Marketing", "Engineering lead"]
      agenda:
      - "Product usage and adoption metrics (10 min)"
      - "Top customer feedback themes (15 min)"
      - "Competitive landscape update (10 min)"
      - "Roadmap review and priority adjustments (20 min)"
      - "Cross-functional blockers (5 min)"
      outputs: ["Priority alignment document", "Escalation decisions", "Updated competitive matrix"]

    quarterly_planning_review:
      purpose: "Align quarterly roadmap with business priorities"
      attendees: ["Product leadership", "Sales leadership", "CS leadership", "Engineering leadership"]
      agenda:
      - "Prior quarter delivery review (15 min)"
      - "Revenue impact of product decisions (15 min)"
      - "Competitive position update (10 min)"
      - "Next quarter priority setting (30 min)"
      - "Resource allocation decisions (20 min)"
      outputs: ["Quarterly roadmap commitment", "Resource allocation plan", "Success metrics"]

request_lifecycle:
  description: "How a feature request moves through the system"
  stages:
    submitted:
      definition: "Request received from any channel"
      action: "Log with metadata (account, persona, deal context, competitive context)"
      sla: "Acknowledge within 2 business days"
    triaged:
      definition: "Request classified by category, urgency, and preliminary assessment"
      action: "Assign priority score using framework, determine if duplicate"
      sla: "Triage within 5 business days"
    assessed:
      definition: "Engineering feasibility and effort estimated"
      action: "Technical assessment with effort range, dependencies identified"
      sla: "Assessment within 10 business days for standard requests"
    prioritized:
      definition: "Request placed in backlog with relative priority"
      action: "Score against other requests, communicate position and rationale"
      sla: "Prioritization decision within 1 planning cycle"
    committed:
      definition: "Request scheduled for delivery in a specific release"
      action: "Add to release plan, notify requesting stakeholders"
      sla: "Delivery timeline communicated upon commitment"
    delivered:
      definition: "Feature shipped and available to customers"
      action: "Close the loop with requesting accounts, update competitive matrix"
      sla: "Stakeholder notification within 1 week of GA"
    declined:
      definition: "Request evaluated and not planned"
      action: "Communicate rationale, suggest alternatives, record for future review"
      sla: "Decision communicated within 1 planning cycle"

trust_health_indicators:
  description: "Signals that indicate health of the product-sales relationship"
  healthy_signals:
    - "Sales proactively shares customer feedback through standard channels"
    - "Feature request status is checked via tracking system, not ad-hoc escalations"
    - "Sales includes product context in deal strategy discussions"
    - "Roadmap presentations generate constructive questions, not hostile challenges"
    - "Sales credits product improvements for deal wins"
  warning_signals:
    - "Escalation frequency increasing quarter over quarter"
    - "Sales bypasses product and contacts engineering directly"
    - "Feature promises made to customers without product consultation"
    - "Sales stops attending product sync meetings"
    - "Win/loss feedback stops flowing to product"
    - "Internal NPS for product team declining"
  intervention_triggers:
    - trigger: "3+ bypass incidents in a quarter"
      action: "1:1 with sales leadership to understand root cause"
    - trigger: "Product sync attendance drops below 50%"
      action: "Restructure meeting format, validate relevance"
    - trigger: "Unauthorized feature promises detected"
      action: "Establish escalation protocol, document in governance"

escalation_framework:
  description: "When and how to escalate product-field conflicts"
  levels:
    level_1:
      trigger: "Feature request for active deal, standard priority"
      owner: "Product Manager"
      resolution: "Triage and prioritize within normal cadence"
    level_2:
      trigger: "Feature gap blocking $500K+ deal, customer executive involved"
      owner: "Product Manager + Sales Director"
      resolution: "Expedited assessment, explore workarounds, decision within 5 days"
    level_3:
      trigger: "Strategic account at risk, competitive displacement threat, multiple deals affected"
      owner: "VP Product + VP Sales"
      resolution: "Executive alignment, potential roadmap reprioritization, customer communication plan"
    level_4:
      trigger: "Market-level competitive threat, analyst downgrade, systematic product gap"
      owner: "CPO + CRO"
      resolution: "Strategic product response, potential resource reallocation, board-level visibility"

transparency_mechanisms:
  description: "Systems that build trust through visibility"
  request_portal:
    purpose: "Single place where field teams submit and track requests"
    features:
    - "Request status visible to submitter at all times"
    - "Decision rationale documented for every declined or deferred request"
    - "Impact metrics shown (how many accounts requested, revenue at risk)"
    - "Upvoting mechanism to surface demand without duplicate submissions"
  roadmap_visibility:
    purpose: "Field teams can see what's planned and why"
    features:
    - "Now / Next / Later view with confidence levels"
    - "Customer-request mapping showing which requests influenced roadmap"
    - "Release timeline with field-relevant milestones"
  decision_log:
    purpose: "Record of prioritization decisions with rationale"
    features:
    - "What was decided and why"
    - "What data informed the decision"
    - "What was explicitly deprioritized and the trade-off reasoning"
    - "Review date for revisiting deferred items"
