# PM Feedback Taxonomy - Domain Knowledge
# Referenced by: pm-agent, pm-feedback-agent
# Classification system for customer feedback across all channels

feedback_categories:
  feature_request:
    description: "Customer asks for new functionality that does not exist"
    subcategories:
      new_capability: "Entirely new feature or module"
      enhancement: "Improvement to existing functionality"
      integration: "Connection to third-party system or service"
      customization: "Ability to configure or personalize existing feature"
    required_metadata:
      - requesting_account
      - requesting_persona
      - business_justification
      - deal_association
      - competitive_context

  bug_report:
    description: "Customer reports something not working as designed"
    subcategories:
      functional: "Feature does not produce expected result"
      performance: "Feature works but unacceptably slowly"
      intermittent: "Issue occurs inconsistently, hard to reproduce"
      regression: "Previously working functionality now broken"
    severity_classification:
      critical: "Production down, data loss, security vulnerability"
      high: "Major functionality broken, no workaround"
      medium: "Functionality impaired, workaround available"
      low: "Minor issue, cosmetic, edge case"

  usability_feedback:
    description: "Customer experiences friction in using existing capabilities"
    subcategories:
      workflow: "Steps required are too many or unintuitive"
      discoverability: "Feature exists but customer cannot find it"
      documentation: "Instructions unclear or missing"
      onboarding: "Initial setup or learning curve too steep"

  competitive_feedback:
    description: "Customer references competitor capability"
    subcategories:
      parity_gap: "Competitor has feature customer expects us to have"
      differentiation: "Customer values something we do that competitor does not"
      switching_signal: "Customer considering competitor due to specific capability"

  strategic_feedback:
    description: "Customer shares broader market or business context"
    subcategories:
      market_trend: "Industry shift affecting customer priorities"
      regulatory_change: "Compliance requirement driving new needs"
      organizational_change: "Reorg, M&A, or strategy shift changing requirements"

persona_classification:
  description: "Tag feedback by the persona providing it to weight appropriately"
  personas:
    economic_buyer:
      definition: "Budget holder, signs contracts, cares about ROI and risk"
      feedback_weight: 0.95
      typical_concerns: ["TCO", "Time to value", "Risk mitigation", "Vendor consolidation"]
    technical_evaluator:
      definition: "Architect or engineer who assesses technical fit"
      feedback_weight: 0.90
      typical_concerns: ["API quality", "Performance", "Security", "Integration complexity"]
    end_user:
      definition: "Daily user of the product"
      feedback_weight: 0.80
      typical_concerns: ["Usability", "Workflow efficiency", "Reliability", "Documentation"]
    champion:
      definition: "Internal advocate who drives adoption and renewal"
      feedback_weight: 0.90
      typical_concerns: ["Adoption metrics", "Executive visibility", "Competitive positioning"]
    procurement:
      definition: "Procurement or vendor management team"
      feedback_weight: 0.60
      typical_concerns: ["Pricing", "Contract terms", "Compliance certifications", "SLAs"]

channel_classification:
  description: "Tag feedback by the channel it arrived through"
  channels:
    support_ticket:
      volume: HIGH
      signal_quality: MEDIUM
      bias: "Skewed toward problems and bugs, underrepresents positive or strategic feedback"
    sales_deal_note:
      volume: MEDIUM
      signal_quality: HIGH
      bias: "Skewed toward deal-closing features, may overweight one account's needs"
    cs_qbr:
      volume: LOW
      signal_quality: HIGH
      bias: "Structured review, good for strategic themes, limited to QBR-participating accounts"
    nps_survey:
      volume: HIGH
      signal_quality: MEDIUM
      bias: "Self-selected respondents, verbatim comments most valuable, score alone insufficient"
    cab_session:
      volume: LOW
      signal_quality: HIGHEST
      bias: "Strategic accounts only, may not represent broader customer base"
    community_forum:
      volume: HIGH
      signal_quality: LOW
      bias: "Power users and complainers overrepresented, silent majority absent"
    social_media:
      volume: VARIABLE
      signal_quality: LOW
      bias: "Public perception, amplified by sentiment, not representative of product decisions"

theme_clustering:
  description: "Rules for aggregating individual feedback items into actionable themes"
  rules:
    minimum_signals: 3
    minimum_accounts: 2
    time_window: "90 days"
    clustering_approach: "Group by capability area, not by exact wording"
  output:
    theme_name: "Descriptive label for the feedback cluster"
    signal_count: "Number of individual feedback items in this cluster"
    account_count: "Number of distinct accounts contributing to this theme"
    revenue_weighted_impact: "Sum of ARR for contributing accounts"
    persona_distribution: "Which personas are providing this feedback"
    channel_distribution: "Which channels this feedback arrives through"
    trend_direction: "Increasing, stable, or decreasing over last 3 periods"
    competitive_correlation: "Whether this theme appears in win/loss analysis"
