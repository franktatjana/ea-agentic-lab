# PM Competitive Analysis Framework - Domain Knowledge
# Referenced by: pm-agent, pm-competitive-agent
# Structured approach to competitive intelligence from the product perspective

competitive_matrix:
  description: "Living feature comparison matrix maintained per competitor"
  dimensions:
    capability_area:
      definition: "Functional domain (e.g., analytics, security, integrations, admin)"
      granularity: "Feature-level within each capability area"
    our_status:
      values:
        ga: "Generally available in current release"
        beta: "Available in beta/early access"
        planned: "On roadmap with committed timeline"
        under_consideration: "Feedback collected, not yet committed"
        not_planned: "Evaluated and deprioritized"
        not_applicable: "Outside product scope by design"
    competitor_status:
      values:
        confirmed: "Verified through product documentation, demo, or customer report"
        reported: "Cited in analyst report or customer feedback but not independently verified"
        rumored: "Mentioned in blog, conference, or social media without official confirmation"
        unknown: "No data available"
    gap_impact:
      values:
        dealbreaker: "Customers explicitly cite this gap as reason for choosing competitor"
        significant: "Gap weakens positioning but workarounds exist"
        minor: "Gap noticed but does not influence buying decision"
        non_issue: "Customers do not compare on this dimension"

win_loss_analysis:
  description: "Product-perspective analysis of deal outcomes"
  loss_categories:
    product_gap:
      definition: "Deal lost because product lacked specific capability"
      required_evidence: "Customer or champion explicitly cited missing feature"
      action: "Log to competitive matrix, assess demand frequency"
    competitive_positioning:
      definition: "Product capable but competitor positioned more effectively"
      required_evidence: "Feature exists but customer perceived competitor as stronger"
      action: "Review messaging, update battlecard, assess perception gap"
    pricing_packaging:
      definition: "Product met needs but commercial terms did not compete"
      required_evidence: "Customer confirmed product fit but chose on price"
      action: "Route to pricing team, assess packaging alternatives"
    no_decision:
      definition: "Customer chose to do nothing"
      required_evidence: "Deal stalled without competitor selection"
      action: "Assess whether product complexity or risk perception contributed"
    relationship:
      definition: "Incumbent advantage or executive relationship drove decision"
      required_evidence: "Customer acknowledged product fit but chose existing vendor"
      action: "Document for strategic account planning, not product action"

  win_categories:
    product_superiority:
      definition: "Customer chose based on specific product capabilities"
      action: "Identify which features won, reinforce in roadmap and messaging"
    trust_and_support:
      definition: "Customer chose based on vendor reputation, support, or services"
      action: "Document trust factors, ensure product doesn't erode these advantages"
    integration_fit:
      definition: "Customer chose because product fit their existing technology stack"
      action: "Reinforce ecosystem strategy, maintain integration quality"
    total_cost:
      definition: "Customer chose on TCO including implementation, migration, and operational costs"
      action: "Document TCO advantages, feed into value engineering"

competitor_monitoring:
  description: "Systematic tracking of competitor product evolution"
  sources:
    release_notes:
      frequency: "Weekly scan"
      signal_value: "Feature velocity, investment areas, deprecated capabilities"
    job_postings:
      frequency: "Monthly scan"
      signal_value: "Engineering investment direction, new product areas, technology stack changes"
    analyst_reports:
      frequency: "Quarterly review"
      signal_value: "Market positioning changes, strengths/weaknesses assessment"
    customer_feedback:
      frequency: "Continuous"
      signal_value: "Real-world competitive experience, not marketing claims"
    patent_filings:
      frequency: "Quarterly scan"
      signal_value: "Long-term R&D direction, potential future capabilities"
    conference_presentations:
      frequency: "Event-driven"
      signal_value: "Strategic messaging, upcoming features, customer case studies"

  alert_triggers:
    - trigger: "Competitor launches feature we lack that appears in 3+ active deals"
      severity: CRITICAL
      action: "Immediate product leadership review"
    - trigger: "Competitor announces capability in our differentiation area"
      severity: HIGH
      action: "Assess validity, update battlecards, review roadmap defense"
    - trigger: "Analyst report downgrades our positioning in a capability area"
      severity: HIGH
      action: "Root cause analysis, roadmap response assessment"
    - trigger: "Competitor hiring surge in specific technology area"
      severity: MEDIUM
      action: "Monitor for 60 days, assess strategic implications"

battlecard_maintenance:
  description: "Product-side input to competitive battlecards"
  pm_responsibilities:
    - "Validate feature comparison accuracy quarterly"
    - "Provide technical differentiation talking points"
    - "Flag when competitor claims are misleading or outdated"
    - "Supply evidence for product superiority claims"
    - "Update gap timelines when roadmap changes affect competitive positioning"
  update_triggers:
    - "New product release (ours or competitor)"
    - "Competitive loss citing specific feature gap"
    - "Analyst report with updated positioning"
    - "Customer-reported competitive experience"
