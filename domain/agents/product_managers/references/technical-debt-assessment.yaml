# PM Technical Debt Assessment Framework - Domain Knowledge
# Referenced by: pm-agent, pm-roadmap-agent
# Translating engineering technical debt into business language

debt_classification:
  description: "Categories of technical debt relevant to product decisions"
  categories:
    architecture_debt:
      definition: "Structural limitations that constrain future product capabilities"
      business_impact: "Slows feature delivery velocity, limits what can be built"
      examples:
      - "Monolithic architecture preventing independent feature deployment"
      - "Database schema that cannot support new data models"
      - "API design that limits integration patterns"
      visibility_to_sales: LOW
      urgency_signal: "Feature requests consistently blocked by 'requires platform change'"

    reliability_debt:
      definition: "Accumulated shortcuts that increase incident probability"
      business_impact: "Customer-facing outages, SLA violations, trust erosion"
      examples:
      - "Missing error handling in critical paths"
      - "Insufficient monitoring and alerting"
      - "Single points of failure without redundancy"
      visibility_to_sales: HIGH
      urgency_signal: "Increasing incident frequency or severity"

    performance_debt:
      definition: "Unoptimized code paths that degrade user experience"
      business_impact: "Customer complaints, competitive disadvantage on speed, failed POCs"
      examples:
      - "Slow query patterns that worsen with data volume"
      - "Memory leaks causing degradation over time"
      - "Unoptimized API responses exceeding latency SLAs"
      visibility_to_sales: HIGH
      urgency_signal: "Performance cited in support tickets or competitive losses"

    security_debt:
      definition: "Known vulnerabilities or outdated security patterns"
      business_impact: "Failed security reviews, blocked deals, compliance violations"
      examples:
      - "Outdated dependencies with known CVEs"
      - "Deprecated authentication patterns"
      - "Insufficient audit logging for compliance"
      visibility_to_sales: CRITICAL
      urgency_signal: "Security questionnaire failures or compliance audit findings"

    testing_debt:
      definition: "Insufficient test coverage increasing regression risk"
      business_impact: "Regressions in releases, slower release velocity, customer-found bugs"
      examples:
      - "Critical paths without automated tests"
      - "Integration tests that don't cover real customer scenarios"
      - "Missing performance benchmarks"
      visibility_to_sales: LOW
      urgency_signal: "Regression frequency increasing release over release"

business_case_translation:
  description: "How to present technical debt in terms stakeholders understand"
  frameworks:
    revenue_blocker:
      template: "This debt blocks {feature_list} which {N} customers are requesting with ${revenue} at risk"
      when_to_use: "When debt directly prevents building features tied to revenue"
    velocity_impact:
      template: "Current delivery velocity is {X} features/quarter. Addressing this debt would increase to {Y}, enabling {specific_roadmap_items} to ship {N} weeks earlier"
      when_to_use: "When debt is slowing overall delivery speed"
    risk_quantification:
      template: "Current incident rate is {X}/month with {Y} hours MTTR. This debt is the root cause of {Z}% of incidents. Addressing it reduces incident rate by {estimate}%"
      when_to_use: "When debt causes customer-impacting incidents"
    competitive_exposure:
      template: "Competitor ships {feature_type} features in {X} weeks. Our architecture requires {Y} weeks for similar scope. This gap is widening by {estimate} per quarter"
      when_to_use: "When debt creates competitive velocity disadvantage"

prioritization_integration:
  description: "How to score technical debt items alongside feature requests"
  rules:
  - "Technical debt items must be scored using the same framework as features"
  - "Revenue-blocking debt inherits the priority of the blocked feature"
  - "Reliability debt is scored by incident cost (frequency x duration x customer impact)"
  - "Security debt is scored by compliance risk (audit timeline x penalty exposure)"
  - "Never maintain a separate backlog for debt: it competes on equal terms with features"
  allocation_guideline:
    description: "Industry benchmark for technical debt allocation"
    recommendation: "Allocate 15-25% of engineering capacity to debt reduction"
    source: "ThoughtWorks Technology Radar, Google SRE practices"
    adjustment: "Increase allocation if incident rate trending up or velocity trending down"
