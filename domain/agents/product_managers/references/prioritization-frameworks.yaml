# PM Prioritization Frameworks - Domain Knowledge
# Referenced by: pm-agent, pm-roadmap-agent
# Industry-standard prioritization methodologies for product decisions

frameworks:
  rice:
    name: "RICE Scoring"
    source: "Intercom product team"
    description: "Quantitative scoring model balancing reach, impact, confidence, and effort"
    dimensions:
      reach:
        definition: "How many customers/users will this affect in a given time period"
        scoring: "Number of customers or transactions impacted per quarter"
        data_sources: ["Usage analytics", "Customer count", "Segment analysis"]
      impact:
        definition: "How much will this move the needle for each affected customer"
        scoring: "3 = massive, 2 = high, 1 = medium, 0.5 = low, 0.25 = minimal"
        data_sources: ["Customer feedback severity", "Revenue correlation", "Churn impact"]
      confidence:
        definition: "How confident are we in reach and impact estimates"
        scoring: "100% = high (data-backed), 80% = medium (some data), 50% = low (assumption)"
        data_sources: ["Historical data", "Customer validation", "Market research"]
      effort:
        definition: "Engineering person-months required to deliver"
        scoring: "Person-months (lower = better)"
        data_sources: ["Engineering estimates", "Historical velocity", "Complexity assessment"]
    formula: "(Reach x Impact x Confidence) / Effort"
    when_to_use: "Default framework for feature prioritization when quantitative data is available"
    limitations: "Requires reliable effort estimates, can be gamed by inflating impact scores"

  weighted_scoring:
    name: "Weighted Scoring Model"
    source: "Pragmatic Institute"
    description: "Multi-criteria scoring with stakeholder-defined weights per criterion"
    dimensions:
      revenue_impact:
        weight: 0.30
        scoring: "5 = >$1M ARR impact, 4 = $500K-1M, 3 = $100K-500K, 2 = $50K-100K, 1 = <$50K"
      strategic_alignment:
        weight: 0.25
        scoring: "5 = core strategy enabler, 4 = supports strategy, 3 = neutral, 2 = tangential, 1 = misaligned"
      customer_frequency:
        weight: 0.20
        scoring: "5 = requested by 20%+ of accounts, 4 = 10-20%, 3 = 5-10%, 2 = 2-5%, 1 = <2%"
      competitive_urgency:
        weight: 0.15
        scoring: "5 = losing deals to this gap, 4 = competitor has it, 3 = competitor building, 2 = market expectation, 1 = differentiator if built"
      effort_inverse:
        weight: 0.10
        scoring: "5 = < 1 sprint, 4 = 1-2 sprints, 3 = 3-5 sprints, 2 = 6-10 sprints, 1 = > 10 sprints"
    when_to_use: "When multiple stakeholders need transparent, defensible prioritization"
    limitations: "Weight selection is subjective, requires alignment on weight values upfront"

  kano_model:
    name: "Kano Model"
    source: "Professor Noriaki Kano, Tokyo University of Science"
    description: "Classifies features by how they affect customer satisfaction"
    categories:
      must_be:
        definition: "Expected features, absence causes dissatisfaction, presence doesn't increase satisfaction"
        examples: ["Authentication", "Data export", "API access", "Audit logging"]
        product_action: "Build these first, they are table stakes"
      performance:
        definition: "More is better, linear relationship between functionality and satisfaction"
        examples: ["Query speed", "Storage limits", "Number of integrations", "Report customization"]
        product_action: "Invest proportionally, benchmark against competitors"
      attractive:
        definition: "Unexpected delighters, absence doesn't cause dissatisfaction but presence creates loyalty"
        examples: ["AI-powered suggestions", "One-click setup", "Proactive alerts", "Natural language query"]
        product_action: "Strategic differentiators, invest when must-be and performance are covered"
      indifferent:
        definition: "Features customers don't care about either way"
        product_action: "Deprioritize, avoid building"
      reverse:
        definition: "Features that actually decrease satisfaction for some segments"
        product_action: "Make optional or configurable, never force on all users"
    when_to_use: "When deciding between feature types (table stakes vs. differentiators)"
    limitations: "Requires customer surveys to classify, categories shift over time as features become expected"

  cost_of_delay:
    name: "Cost of Delay / WSJF"
    source: "SAFe framework, Don Reinertsen"
    description: "Prioritize by the economic cost of NOT delivering each item now"
    dimensions:
      user_business_value:
        definition: "Revenue, customer satisfaction, or market share impact"
      time_criticality:
        definition: "How much value decays if delivery is delayed (regulatory deadlines, competitive windows)"
      risk_reduction:
        definition: "How much this reduces business, technical, or compliance risk"
      job_size:
        definition: "Relative effort to deliver (smaller = higher priority when value is equal)"
    formula: "(User Value + Time Criticality + Risk Reduction) / Job Size"
    when_to_use: "When time-to-market matters and items have different urgency profiles"
    limitations: "Time criticality estimation is often subjective, requires discipline to not inflate urgency"

  opportunity_scoring:
    name: "Opportunity Scoring (ODI)"
    source: "Tony Ulwick, Outcome-Driven Innovation"
    description: "Prioritize based on jobs customers need done but are currently underserved"
    dimensions:
      importance:
        definition: "How important is this job/outcome to the customer (1-10)"
        data_sources: ["Customer surveys", "Interview data", "Usage patterns"]
      satisfaction:
        definition: "How well served is this job by current solutions (1-10)"
        data_sources: ["NPS data", "Support tickets", "Competitive alternatives"]
    formula: "Importance + MAX(Importance - Satisfaction, 0) = Opportunity Score"
    interpretation:
      overserved: "Importance < Satisfaction, reduce investment"
      appropriately_served: "Importance ≈ Satisfaction, maintain"
      underserved: "Importance > Satisfaction, invest here"
    when_to_use: "When aligning product investment to customer jobs-to-be-done"

decision_documentation:
  description: "Every prioritization decision should produce a decision record"
  required_fields:
    decision: "What was prioritized and what was deferred"
    framework_used: "Which prioritization framework was applied"
    data_inputs: "What data informed the scores (deal count, revenue impact, customer feedback volume)"
    trade_offs: "What was explicitly deprioritized and why"
    review_date: "When this decision should be revisited"
    stakeholders_informed: "Who was notified of the decision and rationale"
