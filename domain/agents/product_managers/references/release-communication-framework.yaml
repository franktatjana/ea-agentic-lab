# PM Release Communication Framework - Domain Knowledge
# Referenced by: pm-agent, pm-release-agent
# Structured approach to translating releases into field-ready enablement

release_classification:
  description: "Classify every release by field impact to determine communication level"
  tiers:
    major:
      definition: "New capability area, significant competitive positioning change, or customer-facing breaking change"
      communication_level: "Full enablement package"
      lead_time: "2 weeks before GA"
      audience: "All field teams (AE, SA, VE, CS, Partners)"
      deliverables:
      - "Release brief with value proposition per persona"
      - "Competitive positioning update"
      - "Demo script or video"
      - "Objection handling guide"
      - "Customer communication template"
      - "Pricing/packaging impact (if any)"
    minor:
      definition: "Enhancement to existing capability, new integration, or performance improvement"
      communication_level: "Targeted notification"
      lead_time: "1 week before GA"
      audience: "Relevant product specialists, SAs, affected account teams"
      deliverables:
      - "Release summary with key benefits"
      - "Technical details for SAs"
      - "Affected customer notification (if applicable)"
    patch:
      definition: "Bug fix, security patch, or maintenance release"
      communication_level: "Standard changelog"
      lead_time: "Day of release"
      audience: "Support team, affected customers"
      deliverables:
      - "Changelog entry"
      - "Support KB update (if needed)"

field_enablement_template:
  description: "Standard structure for field-ready release communication"
  sections:
    what_changed:
      content: "Clear description of new capability in business language, not engineering terms"
      rules:
      - "Lead with customer benefit, not technical implementation"
      - "Include before/after comparison"
      - "State what was NOT possible before that is now possible"
    who_cares:
      content: "Which customer personas and segments benefit most"
      rules:
      - "Map to specific buyer personas (economic buyer, technical evaluator, end user)"
      - "Include industry or vertical relevance"
      - "Note which active deals this unblocks"
    competitive_impact:
      content: "How this changes competitive positioning"
      rules:
      - "State whether this closes a gap, maintains parity, or creates differentiation"
      - "Update competitive matrix entries affected"
      - "Provide talk track for competitive conversations"
    how_to_demo:
      content: "Quick demo flow for customer-facing conversations"
      rules:
      - "3-5 steps maximum"
      - "Include expected customer reaction at each step"
      - "Note prerequisites or setup required"
    known_limitations:
      content: "What this release does NOT include"
      rules:
      - "Be explicit about scope boundaries"
      - "State planned follow-on work with approximate timeline"
      - "Include workarounds for common adjacent requests"

beta_program_management:
  description: "Framework for managing early access and beta programs"
  participant_selection:
    criteria:
    - "Strategic account status (ARR tier, expansion potential)"
    - "Technical maturity to provide useful feedback"
    - "Willingness to invest time in testing and feedback"
    - "Diversity of use cases across participants"
    - "Sales team advocacy (deal context for early access)"
    avoid:
    - "Accounts with active support escalations (feedback will be biased)"
    - "Accounts in active competitive evaluation (risk of leaking to competitors)"
    - "Accounts without technical resources to actually test"
  feedback_collection:
    structured:
    - "Weekly survey: satisfaction, usability, bugs encountered"
    - "Feature-specific feedback form per capability area"
    - "Exit interview at program end"
    unstructured:
    - "Slack/Teams channel for real-time feedback"
    - "Office hours for live Q&A with product team"
    - "Bug report template with reproduction steps"
  success_metrics:
    - "Participant engagement rate (% providing feedback)"
    - "Bug detection rate (bugs found in beta vs. post-GA)"
    - "Feature validation rate (% of beta features shipping unchanged)"
    - "Net Promoter Score from beta participants"
    - "Time from beta feedback to product response"

cab_management:
  description: "Customer Advisory Board preparation and follow-through"
  session_preparation:
    account_context:
    - "Current product usage and adoption metrics"
    - "Open support tickets and escalations"
    - "Prior CAB feedback and action item status"
    - "Account strategic priorities from AE/CS"
    agenda_design:
    - "Mix of product direction sharing (30%) and feedback solicitation (70%)"
    - "Include interactive exercises, not just presentations"
    - "Dedicate time for unstructured discussion"
    - "Share pre-read materials 1 week before"
  follow_through:
    commitments:
    - "Document all action items with owners and deadlines within 48 hours"
    - "Share summary with CAB members within 1 week"
    - "Provide status update on prior session action items"
    - "Close the loop: when feedback is acted on, tell the CAB member"
    anti_patterns:
    - "Never promise features without product leadership alignment"
    - "Never use CAB as a focus group for already-decided features"
    - "Never let action items go stale between sessions"
