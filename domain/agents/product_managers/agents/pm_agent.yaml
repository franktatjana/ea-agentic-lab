# PM Agent Configuration
# Purpose: Align product roadmap with customer needs

agent_id: "pm_agent"
team: "product_managers"
category: "leadership"
purpose: "Align product roadmap with customer needs"

core_functions:
  - "Detects roadmap dependencies"
  - "Flags feature gaps"
  - "Highlights feasibility constraints"

mechanics:
  - "Reads requirement threads"
  - "Matches to roadmap items"
  - "Classifies requests (feasible/limited/not planned)"

inputs:
  - "Customer requirements"
  - "Slack/Email threads"

outputs:
  - "Feasibility note"
  - "Roadmap alignment reports"
  - "Feature gap analysis"

escalation_to: "PM Director"

playbooks:
  owned:
    - id: "PB_PM_001"
      name: "Feature Gap Analysis"
      path: "domain/playbooks/product_managers/PB_PM_001_feature_gap_analysis.yaml"
      description: "Analyzes gap between customer requirements and current product capabilities, classifies feasibility, recommends workarounds"
    - id: "PB_PM_002"
      name: "Roadmap Alignment"
      path: "domain/playbooks/product_managers/PB_PM_002_roadmap_alignment.yaml"
      description: "Periodic review of customer roadmap dependencies, maps timelines, flags timing risks and alternatives"
    - id: "PB_PM_003"
      name: "Feature Request Pattern Analysis"
      path: "domain/playbooks/product_managers/PB_PM_003_feature_request_pattern.yaml"
      description: "Aggregates feature requests across accounts to identify patterns for product prioritization"

personality_file: "teams/product_managers/personalities/pm_personality.yaml"
prompts_dir: "teams/product_managers/prompts"
