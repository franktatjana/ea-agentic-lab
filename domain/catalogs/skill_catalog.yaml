# ------------------------------------------------------------------------------
# SKILL FLOWS
# ------------------------------------------------------------------------------
# Named sequences showing how skills compose across agents

skill_flows:

  intelligence_to_strategy:
    description: "Intelligence gathering feeds account strategy"
    sequence:
      - "SK_ACI_001"  # Company Research
      - "SK_ACI_002"  # Organigram Building
      - "SK_ACI_003"  # Opportunity Identification
    feeds_playbooks:
      - "PB_ACI_001"  # Initial Account Research
      - "PB_ACI_002"  # Org Mapping
      - "PB_AE_602"      # Account Planning

  meeting_to_decisions:
    description: "Meeting processing to decision capture and registration"
    sequence:
      - "SK_GOV_001"  # Process Meeting Notes
      - "SK_GOV_002"  # Extract Decisions
      - "SK_SA_002"   # Decision Capture (adds technical framing)
    feeds_playbooks:
      - "OP_MTG_001"  # Meeting Operations

  support_to_account_strategy:
    description: "Support signals triaged by CA into account-level actions"
    sequence:
      - "SK_CA_001"   # Support Intelligence Triage (receives SIG_SUP_*)
    feeds_playbooks:
      - "PB_CA_174"      # Customer QBR (support section)
      - "PB_CA_401"      # Customer Health Score (support health factor)

  value_lifecycle:
    description: "End-to-end value engineering from discovery through amplification"
    sequence:
      - "SK_VE_001"  # Value Discovery
      - "SK_VE_002"  # Value Hypothesis
      - "SK_VE_003"  # Value Calculation
      - "SK_VE_005"  # Value Proof
      - "SK_VE_006"  # Value Realization
      - "SK_VE_007"  # Value Amplification
    feeds_playbooks:
      - "PB_VE_301"     # Value Engineering
      - "PB_VE_302"     # TCO Analysis
      - "PB_VE_303"     # ROI Calculation

  deal_management:
    description: "Commercial deal lifecycle from diagnosis through hygiene"
    sequence:
      - "SK_AE_001"  # Deal Diagnosis
      - "SK_AE_004"  # Commercial Signal Detection
      - "SK_AE_003"  # Stakeholder Intelligence
      - "SK_AE_002"  # Pipeline Management
      - "SK_AE_006"  # Opportunity Hygiene
    feeds_playbooks:
      - "PB_STR_001"     # Three Horizons
      - "PB_AE_603"     # Sales QBR
