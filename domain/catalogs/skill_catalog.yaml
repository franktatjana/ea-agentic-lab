# ==============================================================================
# SKILL CATALOG
# ==============================================================================
# Version: 1.0
# Date: 2026-02-16
# Status: Canonical Reference
#
# Skills are named, composable workflows that sit between atomic prompts
# (tasks.yaml) and abstract capabilities (playbooks). Each skill is owned
# by an agent and lives in that agent's team directory.
#
# Skills live in: domain/agents/{team}/skills/
# Template: domain/agents/_templates/skill_template.yaml
# Architecture decision: DDR-016
# For human documentation, see: docs/reference/skill-catalog.md
# ==============================================================================

# ------------------------------------------------------------------------------
# SCHEMA VERSION
# ------------------------------------------------------------------------------
schema_version: "1.0"
last_updated: "2026-02-28"
total_skills: 26

# ------------------------------------------------------------------------------
# SKILL CATEGORIES
# ------------------------------------------------------------------------------
categories:
  intelligence_gathering:
    description: "Skills for researching and collecting information from external sources"
    prefix: "SK_ACI"

  intelligence_analysis:
    description: "Skills for analyzing collected intelligence and identifying opportunities"
    prefix: "SK_ACI"

  meeting_processing:
    description: "Skills for extracting structured data from meetings"
    prefix: "SK_GOV"

  decision_management:
    description: "Skills for capturing, registering, and tracking decisions"
    prefixes: ["SK_GOV", "SK_SA"]

  technical_assessment:
    description: "Skills for technical discovery and architecture evaluation"
    prefix: "SK_SA"

  customer_health:
    description: "Skills for processing customer health signals and support intelligence"
    prefix: "SK_CA"

  value_analysis:
    description: "Skills for quantifying, tracking, and proving business value"
    prefix: "SK_VE"

  commercial_analysis:
    description: "Skills for deal diagnosis, pipeline management, and commercial signal detection"
    prefix: "SK_AE"

  competitive_analysis:
    description: "Skills for competitive signal detection, battlecards, and market intelligence"
    prefix: "SK_CI"

