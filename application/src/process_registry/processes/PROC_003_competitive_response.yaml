process_id: "PROC_003"
name: "Competitive Threat Response"
description: |
  Rapid-response workflow triggered when competitive intelligence detects a
  threat signal. Coordinates threat validation, SWOT analysis, counter-positioning,
  and battlecard updates across CI, SA, and AE agents.

version: 1
status: "active"
created_at: "2026-01-25T14:00:00Z"
created_by: "human:ceo"

trigger:
  event: "competitive_threat_detected"
  conditions:
    - field: "signal.severity"
      operator: "gte"
      value: "medium"

ownership:
  primary_owner:
    agent: "CI Agent"
    agent_id: "ci-agent"
    role: "executor"
  collaborators:
    - agent: "SA Agent"
      agent_id: "sa-agent"
      role: "technical_analyst"
    - agent: "AE Agent"
      agent_id: "ae-agent"
      role: "field_responder"

steps:
  - step_id: "S1"
    name: "Threat Signal Validation"
    owner: "ci-agent"
    action: "execute"
    playbook_ref: "PB_CI_001"
    description: "CI validates threat signal and classifies severity"
    outputs:
      - artifact: "threat_assessment"
    deadline:
      duration: "4 hours"

  - step_id: "S2"
    name: "SWOT Analysis"
    owner: "sa-agent"
    action: "analyze_document"
    playbook_ref: "PB_STR_004"
    description: "SA performs SWOT analysis against detected competitor"
    depends_on: ["S1"]
    outputs:
      - artifact: "swot_analysis"
    deadline:
      duration: "1 day"

  - step_id: "S3"
    name: "Counter-Positioning Preparation"
    owner: "ae-agent"
    action: "create_artifact"
    playbook_ref: "PB_AE_002"
    description: "AE prepares counter-positioning and customer talking points"
    depends_on: ["S1"]
    outputs:
      - artifact: "counter_positioning"
    deadline:
      duration: "1 day"

  - step_id: "S4"
    name: "Battlecard Update & Distribution"
    owner: "ci-agent"
    action: "create_artifact"
    playbook_ref: "PB_CI_001"
    description: "CI updates battlecards with SWOT findings and distributes to field"
    depends_on: ["S2", "S3"]
    outputs:
      - artifact: "updated_battlecard"
    deadline:
      duration: "4 hours"

constraints:
  deadline:
    duration: "3 days"
  sla: "Critical threats must have initial response within 24 hours"

outputs:
  primary:
    artifact: "updated_battlecard"
    format: "document"

relationships:
  depends_on: []
  triggers: []
  related: ["PROC_001"]
  conflicts_with: []

metadata:
  source:
    format: "yaml"
  tags: ["pre-sales", "competitive", "reactive"]
  priority: "high"
