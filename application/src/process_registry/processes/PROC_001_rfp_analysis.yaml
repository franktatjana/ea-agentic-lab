process_id: "PROC_001"
name: "RFP Technical & Commercial Analysis"
description: |
  End-to-end RFP response process coordinating technical analysis,
  competitive positioning, security review, and commercial qualification
  into a unified response brief.

version: 1
status: "active"
created_at: "2026-01-16T10:00:00Z"
created_by: "human:ceo"

trigger:
  event: "rfp_received"
  conditions:
    - field: "deal_stage"
      operator: "in"
      value: ["qualification", "discovery"]

ownership:
  primary_owner:
    agent: "SA Agent"
    agent_id: "sa-agent"
    role: "executor"
  collaborators:
    - agent: "AE Agent"
      agent_id: "ae-agent"
      role: "commercial_lead"
    - agent: "CI Agent"
      agent_id: "ci-agent"
      role: "competitive_analyst"
    - agent: "InfoSec Agent"
      agent_id: "infosec-agent"
      role: "security_reviewer"
    - agent: "RFP Agent"
      agent_id: "rfp-agent"
      role: "response_coordinator"

steps:
  - step_id: "S1"
    name: "Technical Requirements Analysis"
    owner: "sa-agent"
    action: "analyze_document"
    playbook_ref: "PB_SA_015"
    description: "SA analyzes technical requirements and maps to solution capabilities"
    outputs:
      - artifact: "requirements_matrix"
    deadline:
      duration: "1 day"

  - step_id: "S2"
    name: "Security Questionnaire Review"
    owner: "infosec-agent"
    action: "analyze_document"
    playbook_ref: "PB_ISEC_001"
    condition:
      field: "rfp.has_security_section"
      operator: "eq"
      value: true
    description: "InfoSec reviews security requirements and compliance questionnaire"
    depends_on: ["S1"]
    outputs:
      - artifact: "security_response"
    deadline:
      duration: "2 days"

  - step_id: "S3"
    name: "Competitive Positioning"
    owner: "ci-agent"
    action: "analyze_document"
    playbook_ref: "PB_CI_001"
    description: "CI provides competitive landscape analysis and differentiation points"
    depends_on: ["S1"]
    outputs:
      - artifact: "competitive_brief"
    deadline:
      duration: "1 day"

  - step_id: "S4"
    name: "Commercial Qualification"
    owner: "ae-agent"
    action: "analyze_document"
    playbook_ref: "PB_AE_004"
    description: "AE assesses commercial fit, pricing model, and deal qualification"
    depends_on: ["S1"]
    outputs:
      - artifact: "commercial_assessment"
    deadline:
      duration: "1 day"

  - step_id: "S5"
    name: "RFP Response Assembly"
    owner: "rfp-agent"
    action: "create_artifact"
    playbook_ref: "PB_RFP_001"
    description: "Consolidate all inputs into unified RFP response document"
    depends_on: ["S2", "S3", "S4"]
    outputs:
      - artifact: "rfp_response_brief"
    deadline:
      duration: "1 day"

constraints:
  deadline:
    duration: "5 days"
  sla: "Response must be submitted before RFP deadline minus 24h buffer"

outputs:
  primary:
    artifact: "rfp_response_brief"
    format: "document"

relationships:
  depends_on: []
  triggers: ["PROC_005"]
  related: ["PROC_003"]
  conflicts_with: []

metadata:
  source:
    format: "yaml"
  tags: ["pre-sales", "rfp", "cross-functional"]
  priority: "high"
