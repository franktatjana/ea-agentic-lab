process_id: "PROC_002"
name: "Monthly Customer Health Review"
description: |
  Monthly cross-functional health assessment combining product usage metrics,
  technical adoption depth, relationship signals, and support trends into a
  composite health score with action plan.

version: 1
status: "active"
created_at: "2026-01-20T08:00:00Z"
created_by: "human:ceo"

trigger:
  event: "scheduled_monthly"
  conditions:
    - field: "calendar.day"
      operator: "eq"
      value: "first_monday"

ownership:
  primary_owner:
    agent: "CA Agent"
    agent_id: "ca-agent"
    role: "executor"
  collaborators:
    - agent: "SA Agent"
      agent_id: "sa-agent"
      role: "technical_reviewer"
    - agent: "AE Agent"
      agent_id: "ae-agent"
      role: "relationship_assessor"

steps:
  - step_id: "S1"
    name: "Collect Customer Metrics"
    owner: "ca-agent"
    action: "execute"
    playbook_ref: "PB_CA_007"
    description: "CA collects usage metrics, support ticket trends, NPS scores"
    outputs:
      - artifact: "customer_metrics"
    deadline:
      duration: "1 day"

  - step_id: "S2"
    name: "Technical Adoption Review"
    owner: "sa-agent"
    action: "analyze_document"
    playbook_ref: "PB_SA_008"
    description: "SA reviews technical adoption depth and feature utilization"
    depends_on: ["S1"]
    outputs:
      - artifact: "adoption_analysis"
    deadline:
      duration: "1 day"

  - step_id: "S3"
    name: "Relationship Health Assessment"
    owner: "ae-agent"
    action: "analyze_document"
    playbook_ref: "PB_AE_003"
    description: "AE assesses relationship health, renewal risk, expansion signals"
    depends_on: ["S1"]
    outputs:
      - artifact: "relationship_assessment"
    deadline:
      duration: "1 day"

  - step_id: "S4"
    name: "Health Score Consolidation"
    owner: "ca-agent"
    action: "create_artifact"
    playbook_ref: "PB_CA_007"
    description: "Calculate composite health score and update customer record"
    depends_on: ["S2", "S3"]
    outputs:
      - artifact: "health_score_update"
    deadline:
      duration: "4 hours"

constraints:
  deadline:
    duration: "3 days"

outputs:
  primary:
    artifact: "health_score_update"
    format: "yaml"

relationships:
  depends_on: []
  triggers: []
  related: ["PROC_004"]
  conflicts_with: []

metadata:
  source:
    format: "yaml"
  tags: ["post-sales", "health", "recurring"]
  priority: "medium"
