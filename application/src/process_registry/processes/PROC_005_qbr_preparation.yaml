process_id: "PROC_005"
name: "Quarterly Business Review Preparation"
description: |
  Coordinated QBR preparation process bringing together revenue performance,
  customer health data, value realization metrics, technology adoption insights,
  and strategic recommendations into a board-ready QBR package.

version: 1
status: "active"
created_at: "2026-02-10T11:00:00Z"
created_by: "human:ceo"

trigger:
  event: "quarter_end_approaching"
  conditions:
    - field: "calendar.weeks_to_quarter_end"
      operator: "lte"
      value: 3

ownership:
  primary_owner:
    agent: "AE Agent"
    agent_id: "ae-agent"
    role: "executor"
  collaborators:
    - agent: "CA Agent"
      agent_id: "ca-agent"
      role: "customer_health_lead"
    - agent: "VE Agent"
      agent_id: "ve-agent"
      role: "value_analyst"
    - agent: "VP Sales Agent"
      agent_id: "vp-sales-agent"
      role: "revenue_reviewer"
    - agent: "SA Agent"
      agent_id: "sa-agent"
      role: "technical_lead"
    - agent: "RevOps Agent"
      agent_id: "revops-director-agent"
      role: "data_analyst"

steps:
  - step_id: "S1"
    name: "Revenue Performance Analysis"
    owner: "vp-sales-agent"
    action: "execute"
    playbook_ref: "PB_VPS_001"
    description: "VP Sales reviews revenue performance against targets by territory"
    outputs:
      - artifact: "revenue_analysis"
    deadline:
      duration: "2 days"

  - step_id: "S2"
    name: "Forecast Governance"
    owner: "vp-sales-agent"
    action: "execute"
    playbook_ref: "PB_VPS_002"
    description: "VP Sales validates forecast accuracy and identifies commit risks"
    depends_on: ["S1"]
    outputs:
      - artifact: "forecast_report"
    deadline:
      duration: "1 day"

  - step_id: "S3"
    name: "Customer Health Rollup"
    owner: "ca-agent"
    action: "execute"
    playbook_ref: "PB_CA_001"
    description: "CA aggregates customer health scores and identifies at-risk accounts"
    outputs:
      - artifact: "health_rollup"
    deadline:
      duration: "2 days"

  - step_id: "S4"
    name: "Value Realization Report"
    owner: "ve-agent"
    action: "create_artifact"
    playbook_ref: "PB_VE_001"
    description: "VE compiles value realization metrics and ROI evidence"
    outputs:
      - artifact: "value_report"
    deadline:
      duration: "2 days"

  - step_id: "S5"
    name: "Pipeline Analytics"
    owner: "revops-director-agent"
    action: "execute"
    playbook_ref: "PB_RO_001"
    description: "RevOps generates pipeline analytics, conversion rates, velocity"
    outputs:
      - artifact: "pipeline_analytics"
    deadline:
      duration: "2 days"

  - step_id: "S6"
    name: "Technical Win Themes"
    owner: "sa-agent"
    action: "create_artifact"
    playbook_ref: "PB_SA_009"
    description: "SA identifies technical win themes and solution patterns"
    depends_on: ["S3"]
    outputs:
      - artifact: "technical_themes"
    deadline:
      duration: "1 day"

  - step_id: "S7"
    name: "QBR Package Assembly"
    owner: "ae-agent"
    action: "create_artifact"
    playbook_ref: "PB_AE_003"
    description: "AE consolidates all inputs into QBR presentation package"
    depends_on: ["S2", "S3", "S4", "S5", "S6"]
    outputs:
      - artifact: "qbr_package"
    deadline:
      duration: "2 days"

constraints:
  deadline:
    duration: "10 days"
  sla: "QBR package must be ready 5 business days before board meeting"

outputs:
  primary:
    artifact: "qbr_package"
    format: "presentation"

relationships:
  depends_on: ["PROC_002"]
  triggers: []
  related: ["PROC_001", "PROC_003"]
  conflicts_with: []

metadata:
  source:
    format: "yaml"
  tags: ["cross-functional", "qbr", "quarterly"]
  priority: "high"
