process_id: "PROC_004"
name: "New Account Onboarding"
description: |
  Multi-agent onboarding workflow for new accounts, coordinating intelligence
  gathering, industry analysis, technology landscape assessment, and initial
  engagement planning across the full agent ecosystem.

version: 1
status: "active"
created_at: "2026-02-01T09:00:00Z"
created_by: "human:ceo"

trigger:
  event: "realm_created"
  conditions: []

ownership:
  primary_owner:
    agent: "AE Agent"
    agent_id: "ae-agent"
    role: "executor"
  collaborators:
    - agent: "ACI Agent"
      agent_id: "aci-agent"
      role: "intelligence_gatherer"
    - agent: "II Agent"
      agent_id: "ii-agent"
      role: "industry_analyst"
    - agent: "TI Agent"
      agent_id: "ti-agent"
      role: "technology_scout"
    - agent: "SA Agent"
      agent_id: "sa-agent"
      role: "technical_qualifier"
    - agent: "MNA Agent"
      agent_id: "mna-agent"
      role: "news_monitor"

steps:
  - step_id: "S1"
    name: "Account Intelligence Research"
    owner: "aci-agent"
    action: "execute"
    playbook_ref: "PB_ACI_001"
    description: "ACI researches company profile, financials, org structure"
    outputs:
      - artifact: "company_profile"
    deadline:
      duration: "2 days"

  - step_id: "S2"
    name: "Industry Deep-Dive"
    owner: "ii-agent"
    action: "execute"
    playbook_ref: "PB_II_001"
    description: "II analyzes industry context, regulations, digital maturity"
    depends_on: ["S1"]
    outputs:
      - artifact: "industry_profile"
    deadline:
      duration: "2 days"

  - step_id: "S3"
    name: "Technology Radar Generation"
    owner: "ti-agent"
    action: "execute"
    playbook_ref: "PB_TI_001"
    description: "TI scans public signals to build initial technology landscape"
    depends_on: ["S1"]
    outputs:
      - artifact: "technology_radar"
    deadline:
      duration: "2 days"

  - step_id: "S4"
    name: "News Monitoring Setup"
    owner: "mna-agent"
    action: "execute"
    playbook_ref: "PB_MNA_001"
    description: "MNA configures news monitoring and generates initial digest"
    depends_on: ["S1"]
    outputs:
      - artifact: "news_digest"
    deadline:
      duration: "1 day"

  - step_id: "S5"
    name: "Technical Discovery Planning"
    owner: "sa-agent"
    action: "create_artifact"
    playbook_ref: "PB_SA_014"
    description: "SA prepares technical discovery plan based on intelligence"
    depends_on: ["S2", "S3"]
    outputs:
      - artifact: "discovery_plan"
    deadline:
      duration: "1 day"

  - step_id: "S6"
    name: "Engagement Strategy"
    owner: "ae-agent"
    action: "create_artifact"
    playbook_ref: "PB_AE_002"
    description: "AE synthesizes all intelligence into engagement strategy"
    depends_on: ["S2", "S3", "S4", "S5"]
    outputs:
      - artifact: "engagement_strategy"
    deadline:
      duration: "1 day"

constraints:
  deadline:
    duration: "7 days"
  sla: "Account must be fully onboarded within one business week"

outputs:
  primary:
    artifact: "engagement_strategy"
    format: "yaml"

relationships:
  depends_on: []
  triggers: ["PROC_001"]
  related: []
  conflicts_with: []

metadata:
  source:
    format: "yaml"
  tags: ["pre-sales", "onboarding", "intelligence"]
  priority: "high"
