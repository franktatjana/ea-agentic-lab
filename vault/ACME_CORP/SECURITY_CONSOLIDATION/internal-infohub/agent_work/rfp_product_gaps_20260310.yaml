# Product Gap Register Entry - Written to InfoHub by RFP Agent
# This file represents what the rfp_agent writes to the product_gaps section of InfoHub
# after completing the compliance matrix for ACME-RFP-2026-SEC-001

metadata:
  written_by: "rfp_agent"
  written_date: "2026-03-10"
  rfp_ref: "ACME-RFP-2026-SEC-001"
  account: "ACME_CORP"
  node: "SECURITY_CONSOLIDATION"
  deal_arr_at_risk: 1000000  # midpoint of $800K-$1.2M range

product_gaps:

  - gap_id: "GAP-OT-001"
    capability: "Native OT/SCADA connector depth"
    requirement_text: "OT/SCADA native integration (not third-party) - Modbus, OPC-UA, DNP3, IEC 61850, IEC 62443"
    gap_description: >
      Customer scored native OT connector depth at 15% weight. Current platform has
      Modbus TCP and OPC-UA natively; DNP3 and IEC 61850 require third-party integration
      (Claroty or Dragos). LegacySIEM has native DNP3 and IEC 61850 support.
      This is a scoring disadvantage in manufacturing and critical infrastructure RFPs.
    severity: "MEDIUM"
    customer_scored_critical: true
    workaround_proposed: true
    workaround_description: "Third-party Claroty/Dragos integration covers DNP3 and IEC 61850 at additional cost. Framed as best-of-breed OT security partnership."
    workaround_customer_accepted: null  # pending
    industry_context: "Manufacturing, Critical Infrastructure, Energy, OT/ICS"
    competitive_disadvantage_vs: ["LegacySIEM", "Claroty standalone"]

  - gap_id: "GAP-DATA-001"
    capability: "EU data residency scope for OT/operational log data"
    requirement_text: "GDPR-compliant data residency in EU for all data types including OT log telemetry"
    gap_description: >
      Standard customer data residency in Frankfurt (EU-WEST-1) is confirmed.
      OT/operational telemetry data classification and residency configuration is
      not explicitly documented in product data processing agreements.
      German manufacturing customers increasingly require explicit DPA coverage
      for operational technology data under GDPR Article 28.
    severity: "MEDIUM"
    customer_scored_critical: true
    workaround_proposed: false
    workaround_description: null
    industry_context: "Manufacturing, German enterprise, regulated industries"
    competitive_disadvantage_vs: ["any vendor with explicit OT DPA coverage"]
    recommended_action: "Product + Legal to extend DPA to explicitly cover OT log data classification. Affects all German manufacturing prospects."

  - gap_id: "GAP-LANG-001"
    capability: "German-language product UI and documentation"
    requirement_text: "24/7 support in German - implied full German-language operations capability"
    gap_description: >
      Support is available in German (Frankfurt center). Product UI is English-only.
      Admin documentation is English-only. German manufacturing customers increasingly
      expect native German UI for security operations staff who are not English-fluent.
      This was raised as a preference (not a mandatory requirement) but noted in
      eval committee feedback as a differentiator for LegacySIEM.
    severity: "LOW"
    customer_scored_critical: false
    workaround_proposed: true
    workaround_description: "German-language onboarding and runbook documentation offered as PS deliverable."
    industry_context: "German enterprise, public sector, manufacturing"
    competitive_disadvantage_vs: ["LegacySIEM (native German UI)"]
